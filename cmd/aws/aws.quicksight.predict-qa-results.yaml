name: predict-qa-results
description: Predicts existing visuals or generates new visuals to answer a given query.
flags:
    --aws-account-id=!: The ID of the Amazon Web Services account that the user wants to execute Predict QA results in.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --include-generated-answer=: Indicates whether generated answers are included or excluded.
    --include-quick-sight-q-index=: Indicates whether Q indicies are included or excluded.
    --max-topics-to-consider=: The number of maximum topics to be considered to predict QA results.
    --query-text=!: The query text to be used to predict QA results.
completion:
    flag:
        include-generated-answer:
            - INCLUDE
            - EXCLUDE
        include-quick-sight-q-index:
            - INCLUDE
            - EXCLUDE
documentation:
    command: |-
        Predicts existing visuals or generates new visuals to answer a given query.

        This API uses [trusted identity propagation](https://docs.aws.amazon.com/singlesignon/latest/userguide/trustedidentitypropagation.html) to ensure that an end user is authenticated and receives the embed URL that is specific to that user. The IAM Identity Center application that the user has logged into needs to have [trusted Identity Propagation enabled for Quick Suite](https://docs.aws.amazon.com/singlesignon/latest/userguide/trustedidentitypropagation-using-customermanagedapps-specify-trusted-apps.html) with the scope value set to `quicksight:read`. Before you use this action, make sure that you have configured the relevant Quick Suite resource and permissions.

        We recommend enabling the `QSearchStatus` API to unlock the full potential of `PredictQnA`. When `QSearchStatus` is enabled, it first checks the specified dashboard for any existing visuals that match the question. If no matching visuals are found, `PredictQnA` uses generative Q&amp;A to provide an answer. To update the `QSearchStatus`, see [UpdateQuickSightQSearchConfiguration](https://docs.aws.amazon.com/quicksight/latest/APIReference/API_UpdateQuickSightQSearchConfiguration.html).
    flag:
        aws-account-id: The ID of the Amazon Web Services account that the user wants to execute Predict QA results in.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        include-generated-answer: Indicates whether generated answers are included or excluded.
        include-quick-sight-q-index: Indicates whether Q indicies are included or excluded.
        max-topics-to-consider: The number of maximum topics to be considered to predict QA results.
        query-text: The query text to be used to predict QA results.
