name: set-iam-policy
description: '*(BETA)*  Set the IAM policy for a Cloud Build connection.'
flags:
    --region=: The Google Cloud region.
documentation:
    command: |
        *(BETA)*  Set the IAM policy for a Cloud Build connection as defined in a JSON or YAML file.

        See https://cloud.google.com/iam/docs/managing-policies for details of
        the policy file format and contents.
    flag:
        region: |-
            The Google Cloud region.
            +
            To set the `region` attribute:
            * provide the argument `connection` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `builds/region`.
