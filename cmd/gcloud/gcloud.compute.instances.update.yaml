    --no-clear-node-affinities&: Removes the node affinities field from the instance.
    --no-deletion-protection&: Enables deletion protection for the instance.
    --no-enable-display-device&: Enable a display device on VM instances.
    --no-shielded-integrity-monitoring&: Enables monitoring and attestation of the boot integrity of the
    --no-shielded-learn-integrity-policy&: Causes the instance to re-learn the integrity policy baseline using
    --no-shielded-secure-boot&: The instance boots with secure boot enabled.
    --no-shielded-vtpm&: The instance boots with the TPM (Trusted Platform Module) enabled.
    --node-affinity-file=: The JSON/YAML file containing the configuration of desired nodes onto
    --node-group=: The name of the node group to schedule this instance on.
    --node=: The name of the node to schedule this instance on.
    --remove-labels=: List of label keys to remove.
    --shielded-integrity-monitoring: Enables monitoring and attestation of the boot integrity of the
    --shielded-learn-integrity-policy: Causes the instance to re-learn the integrity policy baseline using
    --shielded-secure-boot: The instance boots with secure boot enabled.
