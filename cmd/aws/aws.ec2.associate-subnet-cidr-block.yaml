name: associate-subnet-cidr-block
description: Associates a CIDR block with your subnet.
flags:
    --ipv6-cidr-block=: The IPv6 CIDR block for your subnet.
    --ipv6-ipam-pool-id=: An IPv6 IPAM pool ID.
    --ipv6-netmask-length=: An IPv6 netmask length.
    --subnet-id=!: The ID of your subnet.
documentation:
    command: Associates a CIDR block with your subnet. You can only associate a single IPv6 CIDR block with your subnet.
    flag:
        ipv6-cidr-block: The IPv6 CIDR block for your subnet.
        ipv6-ipam-pool-id: An IPv6 IPAM pool ID.
        ipv6-netmask-length: An IPv6 netmask length.
        subnet-id: The ID of your subnet.
