name: describe
description: '*(ALPHA)*  Describe a Compute Engine security policy.'
flags:
    --global: If set, the security policy is global.
    --no-global&: If set, the security policy is global.
    --region=: Region of the security policy to describe.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute security-policies describe* displays all data associated with Compute Engine security
        policy in a project.

        ## EXAMPLES

        To describe a security policy, run:

          $ gcloud alpha compute security-policies describe my-policy
    flag:
        global: If set, the security policy is global.
        no-global: If set, the security policy is global.
        region: Region of the security policy to describe. Overrides the default *compute/region* property value for this command invocation.
