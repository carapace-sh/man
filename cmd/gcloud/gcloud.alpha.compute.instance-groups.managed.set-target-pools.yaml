name: set-target-pools
description: '*(ALPHA)*  Set target pools of managed instance group.'
flags:
    --region=: Region of the managed instance group to operate on.
    --target-pools=!: Compute Engine Target Pools to add the instances to.
    --zone=: Zone of the managed instance group to operate on.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute instance-groups managed set-target-pools* sets the target pools for an existing managed instance group.
        Instances that are part of the managed instance group will be added to the
        target pool automatically.
    flag:
        region: |-
            Region of the managed instance group to operate on. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            Overrides the default *compute/region* property value for this command invocation.
        target-pools: 'Compute Engine Target Pools to add the instances to. Target Pools must be specified by name or by URL. Example: --target-pools=target-pool-1,target-pool-2. To clear the set of Target Pools pass in an empty list. Example: --target-pools=""'
        zone: |-
            Zone of the managed instance group to operate on. If not specified, you might be prompted to select a zone (interactive mode
            only).
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            Overrides the default *compute/zone* property value for this command invocation.
