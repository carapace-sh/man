name: create
description: '*(BETA)*  Create a new Gateway spoke.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --capacity=!: Set the capacity of the gateway in Gbps.
    --description=: Description of the spoke to create.
    --group=!: Group that the spoke will be part of.
    --hub=!: Hub that the spoke will attach to.
    --ip-range-reservations=!: The IP range reservation for the spoke.
    --labels=: List of label KEY=VALUE pairs to add.
    --landing-network=: The landing network for the spoke.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=!: A Google Cloud region.
completion:
    flag:
        capacity:
            - 100g
            - 10g
            - 1g
documentation:
    command: '*(BETA)*  Create a new Gateway spoke.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        capacity: |-
            Set the capacity of the gateway in Gbps. _CAPACITY_ must be one of:
            +
            *100g*::: Gateway will have capacity of 100 Gbps
            *10g*::: Gateway will have capacity of 10 Gbps
            *1g*::: Gateway will have capacity of 1 Gbps
            :::
            +
        description: Description of the spoke to create.
        group: Group that the spoke will be part of. The group must already exist.
        hub: Hub that the spoke will attach to. The hub must already exist.
        ip-range-reservations: The IP range reservation for the spoke.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        landing-network: |-
            The landing network for the spoke. The network must already
                  exist.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: A Google Cloud region. To see the names of regions, see [Viewing a list of available regions](https://cloud.google.com/compute/docs/regions-zones/viewing-regions-zones#viewing_a_list_of_available_regions).
