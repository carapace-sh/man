name: untag-delivery-stream
description: Removes tags from the specified Firehose stream.
flags:
    --delivery-stream-name=!: The name of the Firehose stream.
    --tag-keys=!: A list of tag keys.
documentation:
    command: |-
        Removes tags from the specified Firehose stream. Removed tags are deleted, and you can't recover them after this operation successfully completes.

        If you specify a tag that doesn't exist, the operation ignores it.

        This operation has a limit of five transactions per second per account.
    flag:
        delivery-stream-name: The name of the Firehose stream.
        tag-keys: A list of tag keys. Each corresponding tag is removed from the delivery stream.
