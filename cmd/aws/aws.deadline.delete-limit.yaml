name: delete-limit
description: Removes a limit from the specified farm.
flags:
    --farm-id=!: The unique identifier of the farm that contains the limit to delete.
    --limit-id=!: The unique identifier of the limit to delete.
documentation:
    command: Removes a limit from the specified farm. Before you delete a limit you must use the `DeleteQueueLimitAssociation` operation to remove the association with any queues.
    flag:
        farm-id: The unique identifier of the farm that contains the limit to delete.
        limit-id: The unique identifier of the limit to delete.
