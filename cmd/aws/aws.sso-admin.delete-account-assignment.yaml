name: delete-account-assignment
description: Deletes a principal's access from a specified Amazon Web Services account using a specified permission set.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-arn=!: The ARN of the IAM Identity Center instance under which the operation will be executed.
    --permission-set-arn=!: The ARN of the permission set that will be used to remove access.
    --principal-id=!: An identifier for an object in IAM Identity Center, such as a user or group.
    --principal-type=!: The entity type for which the assignment will be deleted.
    --target-id=!: TargetID is an Amazon Web Services account identifier, (For example, 123456789012).
    --target-type=!: The entity type for which the assignment will be deleted.
completion:
    flag:
        principal-type:
            - USER
            - GROUP
        target-type:
            - AWS_ACCOUNT
documentation:
    command: |-
        Deletes a principal's access from a specified Amazon Web Services account using a specified permission set.

        After a successful response, call `DescribeAccountAssignmentDeletionStatus` to describe the status of an assignment deletion request.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-arn: The ARN of the IAM Identity Center instance under which the operation will be executed. For more information about ARNs, see [Amazon Resource Names (ARNs) and Amazon Web Services Service Namespaces](/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference*.
        permission-set-arn: The ARN of the permission set that will be used to remove access.
        principal-id: An identifier for an object in IAM Identity Center, such as a user or group. PrincipalIds are GUIDs (For example, f81d4fae-7dec-11d0-a765-00a0c91e6bf6). For more information about PrincipalIds in IAM Identity Center, see the [IAM Identity Center Identity Store API Reference](/singlesignon/latest/IdentityStoreAPIReference/welcome.html).
        principal-type: The entity type for which the assignment will be deleted.
        target-id: TargetID is an Amazon Web Services account identifier, (For example, 123456789012).
        target-type: The entity type for which the assignment will be deleted.
