name: remove-dns-peering-zone
description: '*(ALPHA)*  Remove a DNS peering zone from a SSE Environment.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --dns-suffix=!: Name of the DNS suffix to be removed (like example.com).
    --location=: The location Id.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(ALPHA)*  Remove the specified DNS peering zone from an existing SSE environment by providing the DNS suffix.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        dns-suffix: Name of the DNS suffix to be removed (like example.com).
        location: |-
            The location Id.
            +

            To set the `location` attribute:
            * provide the argument `partner_sse_environment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * location is global by default.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
