name: accept-capacity-reservation-billing-ownership
description: Accepts a request to assign billing of the available capacity of a shared Capacity Reservation to your account.
flags:
    --capacity-reservation-id=!: The ID of the Capacity Reservation for which to accept the request.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: Accepts a request to assign billing of the available capacity of a shared Capacity Reservation to your account. For more information, see [Billing assignment for shared Amazon EC2 Capacity Reservations](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/assign-billing.html).
    flag:
        capacity-reservation-id: The ID of the Capacity Reservation for which to accept the request.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
