name: start-model-packaging-job
description: Starts an Amazon Lookout for Vision model packaging job.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: ClientToken is an idempotency token that ensures a call to `StartModelPackagingJob` completes only once.
    --configuration=!: The configuration for the model packaging job.
    --description=: A description for the model packaging job.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --job-name=: A name for the model packaging job.
    --model-version=!: The version of the model within the project that you want to package.
    --project-name=!: The name of the project which contains the version of the model that you want to package.
documentation:
    command: |-
        Starts an Amazon Lookout for Vision model packaging job. A model packaging job creates an AWS IoT Greengrass component for a Lookout for Vision model. You can use the component to deploy your model to an edge device managed by Greengrass.

        Use the [DescribeModelPackagingJob]() API to determine the current status of the job. The model packaging job is complete if the value of `Status` is `SUCCEEDED`.

        To deploy the component to the target device, use the component name and component version with the AWS IoT Greengrass [CreateDeployment](https://docs.aws.amazon.com/greengrass/v2/APIReference/API_CreateDeployment.html) API.

        This operation requires the following permissions:

        - `lookoutvision:StartModelPackagingJob`
        - `s3:PutObject`
        - `s3:GetBucketLocation`
        - `kms:GenerateDataKey`
        - `greengrass:CreateComponentVersion`
        - `greengrass:DescribeComponent`
        - (Optional) `greengrass:TagResource`. Only required if you want to tag the component.

        For more information, see *Using your Amazon Lookout for Vision model on an edge device* in the Amazon Lookout for Vision Developer Guide.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: |-
            ClientToken is an idempotency token that ensures a call to `StartModelPackagingJob` completes only once. You choose the value to pass. For example, An issue might prevent you from getting a response from `StartModelPackagingJob`. In this case, safely retry your call to `StartModelPackagingJob` by using the same `ClientToken` parameter value.

            If you don't supply a value for `ClientToken`, the AWS SDK you are using inserts a value for you. This prevents retries after a network error from making multiple dataset creation requests. You'll need to provide your own value for other use cases.

            An error occurs if the other input parameters are not the same as in the first request. Using a different value for `ClientToken` is considered a new call to `StartModelPackagingJob`. An idempotency token is active for 8 hours.
        configuration: The configuration for the model packaging job.
        description: A description for the model packaging job.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        job-name: A name for the model packaging job. If you don't supply a value, the service creates a job name for you.
        model-version: The version of the model within the project that you want to package.
        project-name: The name of the project which contains the version of the model that you want to package.
