name: delete-what-if-forecast-export
description: Deletes a what-if forecast export created using the [CreateWhatIfForecastExport]() operation.
flags:
    --what-if-forecast-export-arn=!: The Amazon Resource Name (ARN) of the what-if forecast export that you want to delete.
documentation:
    command: Deletes a what-if forecast export created using the [CreateWhatIfForecastExport]() operation. You can delete only what-if forecast exports that have a status of `ACTIVE` or `CREATE_FAILED`. To get the status, use the [DescribeWhatIfForecastExport]() operation.
    flag:
        what-if-forecast-export-arn: The Amazon Resource Name (ARN) of the what-if forecast export that you want to delete.
