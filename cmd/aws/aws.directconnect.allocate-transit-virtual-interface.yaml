name: allocate-transit-virtual-interface
description: Provisions a transit virtual interface to be owned by the specified Amazon Web Services account.
flags:
    --connection-id=!: The ID of the connection on which the transit virtual interface is provisioned.
    --new-transit-virtual-interface-allocation=!: Information about the transit virtual interface.
    --owner-account=!: The ID of the Amazon Web Services account that owns the transit virtual interface.
documentation:
    command: |-
        Provisions a transit virtual interface to be owned by the specified Amazon Web Services account. Use this type of interface to connect a transit gateway to your Direct Connect gateway.

        The owner of a connection provisions a transit virtual interface to be owned by the specified Amazon Web Services account.

        After you create a transit virtual interface, it must be confirmed by the owner using [ConfirmTransitVirtualInterface](). Until this step has been completed, the transit virtual interface is in the `requested` state and is not available to handle traffic.
    flag:
        connection-id: The ID of the connection on which the transit virtual interface is provisioned.
        new-transit-virtual-interface-allocation: Information about the transit virtual interface.
        owner-account: The ID of the Amazon Web Services account that owns the transit virtual interface.
