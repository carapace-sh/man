name: export
description: Export a pem-encoded certificate to a file.
flags:
    --include-chain: Whether to include the certificate's issuer chain in the exported file.
    --issuer-location=: The location of the CERTIFICATE.
    --issuer-pool=: The parent CA Pool of the CERTIFICATE.
    --no-include-chain&: Whether to include the certificate's issuer chain in the exported file.
    --output-file=!: The path where the resulting PEM-encoded certificate will be written.
documentation:
    command: |-
        ## EXAMPLES

        To export a single pem-encoded certificate to a file, run the following:

          $ gcloud privateca certificates export my-cert --issuer-pool=my-pool --issuer-location=us-west1 \
            --output-file=cert.pem

        To export a pem-encoded certificate along with its issuing chain in the
        same file, run the following:

        $ gcloud privateca certificates export my-cert --issuer-pool=my-pool --issuer-location=us-west1 \
          --include-chain \
          --output-file=chain.pem

        You can omit the --issuer-location flag in both of the above examples if
        you've already set the privateca/location property. For example:

        $ {top_command} config set privateca/location us-west1

        # The following is equivalent to the first example above.
        $ gcloud privateca certificates export my-cert --issuer-pool=my-pool --output-file=cert.pem

        # The following is equivalent to the second example above.
        $ gcloud privateca certificates export my-cert --issuer-pool=my-pool --include-chain \
          --output-file=chain.pem
    flag:
        include-chain: Whether to include the certificate's issuer chain in the exported file. If this is set, the resulting file will contain the pem-encoded certificate and its issuing chain, ordered from leaf to root.
        issuer-location: |-
            The location of the CERTIFICATE.
            +
            To set the `issuer-location` attribute:
            * provide the argument `CERTIFICATE` on the command line with a fully specified name;
            * provide the argument `--issuer-location` on the command line;
            * set the property `privateca/location`.
        issuer-pool: |-
            The parent CA Pool of the CERTIFICATE.
            +
            To set the `issuer-pool` attribute:
            * provide the argument `CERTIFICATE` on the command line with a fully specified name;
            * provide the argument `--issuer-pool` on the command line.
        no-include-chain: Whether to include the certificate's issuer chain in the exported file. If this is set, the resulting file will contain the pem-encoded certificate and its issuing chain, ordered from leaf to root.
        output-file: The path where the resulting PEM-encoded certificate will be written.
