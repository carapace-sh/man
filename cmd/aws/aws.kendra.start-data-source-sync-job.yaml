name: start-data-source-sync-job
description: Starts a synchronization job for a data source connector.
flags:
    --id=!: The identifier of the data source connector to synchronize.
    --index-id=!: The identifier of the index used with the data source connector.
documentation:
    command: |-
        Starts a synchronization job for a data source connector. If a synchronization job is already in progress, Amazon Kendra returns a `ResourceInUseException` exception.

        Re-syncing your data source with your index after modifying, adding, or deleting documents from your data source respository could take up to an hour or more, depending on the number of documents to sync.
    flag:
        id: The identifier of the data source connector to synchronize.
        index-id: The identifier of the index used with the data source connector.
