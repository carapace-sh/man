name: list-participants
description: Lists all participants in a specified stage session.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --filter-by-published: Filters the response list to only show participants who published during the stage session.
    --filter-by-recording-state=: Filters the response list to only show participants with the specified recording state.
    --filter-by-state=: Filters the response list to only show participants in the specified state.
    --filter-by-user-id=: Filters the response list to match the specified user ID.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: Maximum number of results to return.
    --next-token=: The first participant to retrieve.
    --no-filter-by-published: Filters the response list to only show participants who published during the stage session.
    --session-id=!: ID of the session within the stage.
    --stage-arn=!: Stage ARN.
completion:
    flag:
        filter-by-recording-state:
            - STARTING
            - ACTIVE
            - STOPPING
            - STOPPED
            - FAILED
        filter-by-state:
            - CONNECTED
            - DISCONNECTED
documentation:
    command: Lists all participants in a specified stage session.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        filter-by-published: Filters the response list to only show participants who published during the stage session. Only one of `filterByUserId`, `filterByPublished`, `filterByState`, or `filterByRecordingState` can be provided per request.
        filter-by-recording-state: Filters the response list to only show participants with the specified recording state. Only one of `filterByUserId`, `filterByPublished`, `filterByState`, or `filterByRecordingState` can be provided per request.
        filter-by-state: Filters the response list to only show participants in the specified state. Only one of `filterByUserId`, `filterByPublished`, `filterByState`, or `filterByRecordingState` can be provided per request.
        filter-by-user-id: Filters the response list to match the specified user ID. Only one of `filterByUserId`, `filterByPublished`, `filterByState`, or `filterByRecordingState` can be provided per request. A `userId` is a customer-assigned name to help identify the token; this can be used to link a participant to a user in the customer’s own systems.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: 'Maximum number of results to return. Default: 50.'
        next-token: The first participant to retrieve. This is used for pagination; see the `nextToken` response field.
        session-id: ID of the session within the stage.
        stage-arn: Stage ARN.
