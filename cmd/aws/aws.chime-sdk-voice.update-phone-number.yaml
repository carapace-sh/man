name: update-phone-number
description: Updates phone number details, such as product type, calling name, or phone number name for the specified phone number ID.
flags:
    --calling-name=: The outbound calling name associated with the phone number.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=: Specifies the updated name assigned to one or more phone numbers.
    --phone-number-id=!: The phone number ID.
    --product-type=: The product type.
completion:
    flag:
        product-type:
            - VoiceConnector
            - SipMediaApplicationDialIn
documentation:
    command: |-
        Updates phone number details, such as product type, calling name, or phone number name for the specified phone number ID. You can update one phone number detail at a time. For example, you can update either the product type, calling name, or phone number name in one action.

        For numbers outside the U.S., you must use the Amazon Chime SDK SIP Media Application Dial-In product type.

        Updates to outbound calling names can take 72 hours to complete. Pending updates to outbound calling names must be complete before you can request another update.
    flag:
        calling-name: The outbound calling name associated with the phone number.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: Specifies the updated name assigned to one or more phone numbers.
        phone-number-id: The phone number ID.
        product-type: The product type.
