name: put-permission-policy
description: Use this to share a rule group with other accounts.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --policy=!: The policy to attach to the specified rule group.
    --resource-arn=!: The Amazon Resource Name (ARN) of the [RuleGroup]() to which you want to attach the policy.
documentation:
    command: |-
        Use this to share a rule group with other accounts.

        This action attaches an IAM policy to the specified resource. You must be the owner of the rule group to perform this operation.

        This action is subject to the following restrictions:

        - You can attach only one policy with each `PutPermissionPolicy` request.
        - The ARN in the request must be a valid WAF [RuleGroup]() ARN and the rule group must exist in the same Region.
        - The user making the request must be the owner of the rule group.

        If a rule group has been shared with your account, you can access it through the call `GetRuleGroup`, and you can reference it in `CreateWebACL` and `UpdateWebACL`. Rule groups that are shared with you don't appear in your WAF console rule groups listing.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        policy: |-
            The policy to attach to the specified rule group.

            The policy specifications must conform to the following:

            - The policy must be composed using IAM Policy version 2012-10-17.
            - The policy must include specifications for `Effect`, `Action`, and `Principal`.
            - `Effect` must specify `Allow`.
            - `Action` must specify `wafv2:CreateWebACL`, `wafv2:UpdateWebACL`, and `wafv2:PutFirewallManagerRuleGroups` and may optionally specify `wafv2:GetRuleGroup`. WAF rejects any extra actions or wildcard actions in the policy.
            - The policy must not include a `Resource` parameter.

            For more information, see [IAM Policies](https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html).
        resource-arn: The Amazon Resource Name (ARN) of the [RuleGroup]() to which you want to attach the policy.
