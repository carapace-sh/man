name: describe-anomaly-detectors
description: Lists the anomaly detection models that you have created in your account.
flags:
    --anomaly-detector-types=: The anomaly detector types to request when using `DescribeAnomalyDetectorsInput`.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dimensions=: Limits the results to only the anomaly detection models that are associated with the specified metric dimensions.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of results to return in one operation.
    --metric-name=: Limits the results to only the anomaly detection models that are associated with the specified metric name.
    --namespace=: Limits the results to only the anomaly detection models that are associated with the specified namespace.
    --next-token=: Use the token returned by the previous operation to request the next page of results.
    --page-size=: The size of each page to get in the AWS service call.
    --starting-token=: A token to specify where to start paginating.
documentation:
    command: Lists the anomaly detection models that you have created in your account. For single metric anomaly detectors, you can list all of the models in your account or filter the results to only the models that are related to a certain namespace, metric name, or metric dimension. For metric math anomaly detectors, you can list them by adding `METRIC_MATH` to the `AnomalyDetectorTypes` array. This will return all metric math anomaly detectors in your account.
    flag:
        anomaly-detector-types: The anomaly detector types to request when using `DescribeAnomalyDetectorsInput`. If empty, defaults to `SINGLE_METRIC`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dimensions: Limits the results to only the anomaly detection models that are associated with the specified metric dimensions. If there are multiple metrics that have these dimensions and have anomaly detection models associated, they're all returned.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: |-
            The maximum number of results to return in one operation. The maximum value that you can specify is 100.

            To retrieve the remaining results, make another call with the returned `NextToken` value.
        metric-name: Limits the results to only the anomaly detection models that are associated with the specified metric name. If there are multiple metrics with this name in different namespaces that have anomaly detection models, they're all returned.
        namespace: Limits the results to only the anomaly detection models that are associated with the specified namespace.
        next-token: Use the token returned by the previous operation to request the next page of results.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
