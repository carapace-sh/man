name: delete-watchlist
description: Deletes the specified watchlist from Voice ID.
flags:
    --domain-id=!: The identifier of the domain that contains the watchlist.
    --watchlist-id=!: The identifier of the watchlist to be deleted.
documentation:
    command: Deletes the specified watchlist from Voice ID. This API throws an exception when there are fraudsters in the watchlist that you are trying to delete. You must delete the fraudsters, and then delete the watchlist. Every domain has a default watchlist which cannot be deleted.
    flag:
        domain-id: The identifier of the domain that contains the watchlist.
        watchlist-id: The identifier of the watchlist to be deleted.
