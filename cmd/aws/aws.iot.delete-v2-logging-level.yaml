name: delete-v2-logging-level
description: Deletes a logging level.
flags:
    --target-name=!: The name of the resource for which you are configuring logging.
    --target-type=!: The type of resource for which you are configuring logging.
completion:
    flag:
        target-type:
            - DEFAULT
            - THING_GROUP
            - CLIENT_ID
            - SOURCE_IP
            - PRINCIPAL_ID
documentation:
    command: |-
        Deletes a logging level.

        Requires permission to access the [DeleteV2LoggingLevel](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        target-name: The name of the resource for which you are configuring logging.
        target-type: The type of resource for which you are configuring logging. Must be `THING_Group`.
