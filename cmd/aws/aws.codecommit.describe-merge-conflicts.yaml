name: describe-merge-conflicts
description: Returns information about one or more merge conflicts in the attempted merge of two commit specifiers using the squash or three-way merge strategy.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --conflict-detail-level=: The level of conflict detail to use.
    --conflict-resolution-strategy=: Specifies which branch to use when resolving conflicts, or whether to attempt automatically merging two versions of a file.
    --destination-commit-specifier=!: The branch, tag, HEAD, or other fully qualified reference used to identify a commit (for example, a branch name or a full commit ID).
    --file-path=!: The path of the target files used to describe the conflicts.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-merge-hunks=: The maximum number of merge hunks to include in the output.
    --merge-option=!: The merge option or strategy you want to use to merge the code.
    --next-token=: An enumeration token that, when provided in a request, returns the next batch of the results.
    --repository-name=!: The name of the repository where you want to get information about a merge conflict.
    --source-commit-specifier=!: The branch, tag, HEAD, or other fully qualified reference used to identify a commit (for example, a branch name or a full commit ID).
completion:
    flag:
        conflict-detail-level:
            - FILE_LEVEL
            - LINE_LEVEL
        conflict-resolution-strategy:
            - NONE
            - ACCEPT_SOURCE
            - ACCEPT_DESTINATION
            - AUTOMERGE
        merge-option:
            - FAST_FORWARD_MERGE
            - SQUASH_MERGE
            - THREE_WAY_MERGE
documentation:
    command: Returns information about one or more merge conflicts in the attempted merge of two commit specifiers using the squash or three-way merge strategy. If the merge option for the attempted merge is specified as FAST\_FORWARD\_MERGE, an exception is thrown.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        conflict-detail-level: The level of conflict detail to use. If unspecified, the default FILE\_LEVEL is used, which returns a not-mergeable result if the same file has differences in both branches. If LINE\_LEVEL is specified, a conflict is considered not mergeable if the same file in both branches has differences on the same line.
        conflict-resolution-strategy: Specifies which branch to use when resolving conflicts, or whether to attempt automatically merging two versions of a file. The default is NONE, which requires any conflicts to be resolved manually before the merge operation is successful.
        destination-commit-specifier: The branch, tag, HEAD, or other fully qualified reference used to identify a commit (for example, a branch name or a full commit ID).
        file-path: The path of the target files used to describe the conflicts.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-merge-hunks: The maximum number of merge hunks to include in the output.
        merge-option: The merge option or strategy you want to use to merge the code.
        next-token: An enumeration token that, when provided in a request, returns the next batch of the results.
        repository-name: The name of the repository where you want to get information about a merge conflict.
        source-commit-specifier: The branch, tag, HEAD, or other fully qualified reference used to identify a commit (for example, a branch name or a full commit ID).
