name: cancel-environment-deployment
description: Attempts to cancel an environment deployment on an [UpdateEnvironment]() action, if the deployment is `IN_PROGRESS`.
flags:
    --environment-name=!: The name of the environment with the deployment to cancel.
documentation:
    command: |-
        Attempts to cancel an environment deployment on an [UpdateEnvironment]() action, if the deployment is `IN_PROGRESS`. For more information, see [Update an environment](https://docs.aws.amazon.com/proton/latest/userguide/ag-env-update.html) in the *Proton User guide*.

        The following list includes potential cancellation scenarios.

        - If the cancellation attempt succeeds, the resulting deployment state is `CANCELLED`.
        - If the cancellation attempt fails, the resulting deployment state is `FAILED`.
        - If the current [UpdateEnvironment]() action succeeds before the cancellation attempt starts, the resulting deployment state is `SUCCEEDED` and the cancellation attempt has no effect.
    flag:
        environment-name: The name of the environment with the deployment to cancel.
