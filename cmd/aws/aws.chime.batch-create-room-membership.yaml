name: batch-create-room-membership
description: Adds up to 50 members to a chat room in an Amazon Chime Enterprise account.
flags:
    --account-id=!: The Amazon Chime account ID.
    --membership-item-list=!: The list of membership items.
    --room-id=!: The room ID.
documentation:
    command: Adds up to 50 members to a chat room in an Amazon Chime Enterprise account. Members can be users or bots. The member role designates whether the member is a chat room administrator or a general chat room member.
    flag:
        account-id: The Amazon Chime account ID.
        membership-item-list: The list of membership items.
        room-id: The room ID.
