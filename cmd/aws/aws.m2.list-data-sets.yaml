name: list-data-sets
description: Lists the data sets imported for a specific application.
flags:
    --application-id=!: The unique identifier of the application for which you want to list the associated data sets.
    --max-results=: The maximum number of objects to return.
    --name-filter=: Filter dataset name matching the specified pattern.
    --next-token=: A pagination token returned from a previous call to this operation.
    --prefix=: The prefix of the data set name, which you can use to filter the list of data sets.
documentation:
    command: Lists the data sets imported for a specific application. In Amazon Web Services Mainframe Modernization, data sets are associated with applications deployed on runtime environments. This is known as importing data sets. Currently, Amazon Web Services Mainframe Modernization can import data sets into catalogs using [CreateDataSetImportTask](https://docs.aws.amazon.com/m2/latest/APIReference/API_CreateDataSetImportTask.html).
    flag:
        application-id: The unique identifier of the application for which you want to list the associated data sets.
        max-results: The maximum number of objects to return.
        name-filter: Filter dataset name matching the specified pattern. Can use * and % as wild cards.
        next-token: A pagination token returned from a previous call to this operation. This specifies the next item to return. To return to the beginning of the list, exclude this parameter.
        prefix: The prefix of the data set name, which you can use to filter the list of data sets.
