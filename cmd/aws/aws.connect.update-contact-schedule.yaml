name: update-contact-schedule
description: Updates the scheduled time of a task contact that is already scheduled.
flags:
    --contact-id=!: The identifier of the contact.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --scheduled-time=!: The timestamp, in Unix Epoch seconds format, at which to start running the inbound flow.
documentation:
    command: Updates the scheduled time of a task contact that is already scheduled.
    flag:
        contact-id: The identifier of the contact.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        scheduled-time: The timestamp, in Unix Epoch seconds format, at which to start running the inbound flow. The scheduled time cannot be in the past. It must be within up to 6 days in future.
