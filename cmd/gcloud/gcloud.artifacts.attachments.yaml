name: attachments
description: Manage Artifact Registry attachments.
documentation:
    command: |-
        ## EXAMPLES
        To list all attachments in the current project, repository and
        location,
        run:

            $ gcloud artifacts attachments list

        To list attachments under repository `my-repo` in the current project and
        location,
        run:

            $ gcloud artifacts attachments list --repository=my-repo
