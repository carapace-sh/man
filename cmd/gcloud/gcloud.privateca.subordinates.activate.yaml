name: activate
description: Activate a subordinate certificate authority awaiting user activation.
flags:
    --auto-enable: If this flag is set, the Certificate Authority will be automatically enabled upon creation.
    --location=: The location of the CERTIFICATE_AUTHORITY.
    --no-auto-enable&: If this flag is set, the Certificate Authority will be automatically enabled upon creation.
    --pem-chain=!: A file containing a list of PEM-encoded certificates, starting with the current CA certificate and ending with the root CA certificate.
    --pool=: The parent CA Pool of the CERTIFICATE_AUTHORITY.
documentation:
    command: |-
        ## EXAMPLES

        To activate a subordinate CA named 'server-tls-1' in the location 'us-west1'

        and CA Pool 'server-tls-pool' using a PEM certificate chain in 'chain.crt':

          $ gcloud privateca subordinates activate server-tls-1 \
            --location=us-west1 \
            --pool=server-tls-pool \
            --pem-chain=./chain.crt
    flag:
        auto-enable: If this flag is set, the Certificate Authority will be automatically enabled upon creation.
        location: |-
            The location of the CERTIFICATE_AUTHORITY.
            +
            To set the `location` attribute:
            * provide the argument `CERTIFICATE_AUTHORITY` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `privateca/location`.
        no-auto-enable: If this flag is set, the Certificate Authority will be automatically enabled upon creation.
        pem-chain: A file containing a list of PEM-encoded certificates, starting with the current CA certificate and ending with the root CA certificate.
        pool: |-
            The parent CA Pool of the CERTIFICATE_AUTHORITY.
            +
            To set the `pool` attribute:
            * provide the argument `CERTIFICATE_AUTHORITY` on the command line with a fully specified name;
            * provide the argument `--pool` on the command line.
