name: list-training-jobs
description: Lists training jobs.
flags:
    --creation-time-after=: A filter that returns only training jobs created after the specified time (timestamp).
    --creation-time-before=: A filter that returns only training jobs created before the specified time (timestamp).
    --last-modified-time-after=: A filter that returns only training jobs modified after the specified time (timestamp).
    --last-modified-time-before=: A filter that returns only training jobs modified before the specified time (timestamp).
    --max-results=: The maximum number of training jobs to return in the response.
    --name-contains=: A string in the training job name.
    --next-token=: If the result of the previous `ListTrainingJobs` request was truncated, the response includes a `NextToken`.
    --sort-by=: The field to sort results by.
    --sort-order=: The sort order for results.
    --status-equals=: A filter that retrieves only training jobs with a specific status.
    --training-plan-arn-equals=: The Amazon Resource Name (ARN); of the training plan to filter training jobs by.
    --warm-pool-status-equals=: A filter that retrieves only training jobs with a specific warm pool status.
completion:
    flag:
        sort-by:
            - Name
            - CreationTime
            - Status
        sort-order:
            - Ascending
            - Descending
        status-equals:
            - InProgress
            - Completed
            - Failed
            - Stopping
            - Stopped
            - Deleting
        warm-pool-status-equals:
            - Available
            - Terminated
            - Reused
            - InUse
documentation:
    command: |-
        Lists training jobs.

        When `StatusEquals` and `MaxResults` are set at the same time, the `MaxResults` number of training jobs are first retrieved ignoring the `StatusEquals` parameter and then they are filtered by the `StatusEquals` parameter, which is returned as a response.

        For example, if `ListTrainingJobs` is invoked with the following parameters:

        `{ ... MaxResults: 100, StatusEquals: InProgress ... }`

        First, 100 trainings jobs with any status, including those other than `InProgress`, are selected (sorted according to the creation time, from the most current to the oldest). Next, those with a status of `InProgress` are returned.

        You can quickly test the API using the following Amazon Web Services CLI code.

        `aws sagemaker list-training-jobs --max-results 100 --status-equals InProgress`
    flag:
        creation-time-after: A filter that returns only training jobs created after the specified time (timestamp).
        creation-time-before: A filter that returns only training jobs created before the specified time (timestamp).
        last-modified-time-after: A filter that returns only training jobs modified after the specified time (timestamp).
        last-modified-time-before: A filter that returns only training jobs modified before the specified time (timestamp).
        max-results: The maximum number of training jobs to return in the response.
        name-contains: A string in the training job name. This filter returns only training jobs whose name contains the specified string.
        next-token: If the result of the previous `ListTrainingJobs` request was truncated, the response includes a `NextToken`. To retrieve the next set of training jobs, use the token in the next request.
        sort-by: The field to sort results by. The default is `CreationTime`.
        sort-order: The sort order for results. The default is `Ascending`.
        status-equals: A filter that retrieves only training jobs with a specific status.
        training-plan-arn-equals: The Amazon Resource Name (ARN); of the training plan to filter training jobs by. For more information about reserving GPU capacity for your SageMaker training jobs using Amazon SageMaker Training Plan, see `CreateTrainingPlan`.
        warm-pool-status-equals: A filter that retrieves only training jobs with a specific warm pool status.
