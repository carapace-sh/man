name: create-detector-version
description: Creates a detector version.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The description of the detector version.
    --detector-id=!: The ID of the detector under which you want to create a new version.
    --external-model-endpoints=:
        description: The Amazon Sagemaker model endpoints to include in the detector version.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --model-versions=:
        description: The model versions to include in the detector version.
        nargs: -1
    --rule-execution-mode=: The rule execution mode for the rules included in the detector version.
    --rules=!:
        description: The rules to include in the detector version.
        nargs: -1
    --tags=:
        description: A collection of key and value pairs.
        nargs: -1
completion:
    flag:
        rule-execution-mode:
            - ALL_MATCHED
            - FIRST_MATCHED
documentation:
    command: Creates a detector version. The detector version starts in a `DRAFT` status.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The description of the detector version.
        detector-id: The ID of the detector under which you want to create a new version.
        external-model-endpoints: The Amazon Sagemaker model endpoints to include in the detector version.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        model-versions: The model versions to include in the detector version.
        rule-execution-mode: |-
            The rule execution mode for the rules included in the detector version.

            You can define and edit the rule mode at the detector version level, when it is in draft status.

            If you specify `FIRST_MATCHED`, Amazon Fraud Detector evaluates rules sequentially, first to last, stopping at the first matched rule. Amazon Fraud dectector then provides the outcomes for that single rule.

            If you specifiy `ALL_MATCHED`, Amazon Fraud Detector evaluates all rules and returns the outcomes for all matched rules.

            The default behavior is `FIRST_MATCHED`.
        rules: The rules to include in the detector version.
        tags: A collection of key and value pairs.
