name: import-key-pair
description: Imports the public key from an RSA or ED25519 key pair that you created using a third-party tool.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --key-name=!: A unique name for the key pair.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --public-key-material=!: The public key.
    --tag-specifications=: The tags to apply to the imported key pair.
documentation:
    command: |-
        Imports the public key from an RSA or ED25519 key pair that you created using a third-party tool. You give Amazon Web Services only the public key. The private key is never transferred between you and Amazon Web Services.

        For more information about the requirements for importing a key pair, see [Create a key pair and import the public key to Amazon EC2](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/create-key-pairs.html#how-to-generate-your-own-key-and-import-it-to-aws) in the *Amazon EC2 User Guide*.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        key-name: A unique name for the key pair.
        public-key-material: The public key.
        tag-specifications: The tags to apply to the imported key pair.
