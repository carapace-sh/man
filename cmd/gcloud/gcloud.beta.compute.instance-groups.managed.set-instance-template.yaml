name: set-instance-template
description: '*(BETA)*  Set the instance template for a managed instance group.'
flags:
    --region=: Region of the managed instance group to operate on.
    --template=!: Specifies the instance template to use when creating new instances.
    --zone=: Zone of the managed instance group to operate on.
documentation:
    command: |4+
          *(BETA)*  *gcloud beta compute instance-groups managed set-instance-template* sets the instance template for an existing managed instance
        group.

        The new template applies to all new instances added to the managed instance
        group.

        To apply the new template to existing instances in the group, use one of the
        following methods:

        - Update instances using the `update-instances` command.
        - Recreate instances using the `recreate-instances` command.
        - Use the `rolling-action start-update` command.
        - Use the API to set the group's `updatePolicy.type` to `PROACTIVE`.

    flag:
        region: |-
            Region of the managed instance group to operate on. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            Overrides the default *compute/region* property value for this command invocation.
        template: |-
            Specifies the instance template to use when creating new instances.
            An instance template is either a global or regional resource.
        zone: |-
            Zone of the managed instance group to operate on. If not specified, you might be prompted to select a zone (interactive mode
            only).
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            Overrides the default *compute/zone* property value for this command invocation.
