name: create-mlflow-tracking-server
description: Creates an MLflow Tracking Server using a general purpose Amazon S3 bucket as the artifact store.
flags:
    --artifact-store-uri=!: The S3 URI for a general purpose bucket to use as the MLflow Tracking Server artifact store.
    --automatic-model-registration: Whether to enable or disable automatic registration of new MLflow models to the SageMaker Model Registry.
    --mlflow-version=: The version of MLflow that the tracking server uses.
    --no-automatic-model-registration&: Whether to enable or disable automatic registration of new MLflow models to the SageMaker Model Registry.
    --role-arn=!: The Amazon Resource Name (ARN) for an IAM role in your account that the MLflow Tracking Server uses to access the artifact store in Amazon S3.
    --tags=: Tags consisting of key-value pairs used to manage metadata for the tracking server.
    --tracking-server-name=!: A unique string identifying the tracking server name.
    --tracking-server-size=: The size of the tracking server you want to create.
    --weekly-maintenance-window-start=: The day and time of the week in Coordinated Universal Time (UTC) 24-hour standard time that weekly maintenance updates are scheduled.
completion:
    flag:
        tracking-server-size:
            - Small
            - Medium
            - Large
documentation:
    command: Creates an MLflow Tracking Server using a general purpose Amazon S3 bucket as the artifact store. For more information, see [Create an MLflow Tracking Server](https://docs.aws.amazon.com/sagemaker/latest/dg/mlflow-create-tracking-server.html).
    flag:
        artifact-store-uri: The S3 URI for a general purpose bucket to use as the MLflow Tracking Server artifact store.
        automatic-model-registration: Whether to enable or disable automatic registration of new MLflow models to the SageMaker Model Registry. To enable automatic model registration, set this value to `True`. To disable automatic model registration, set this value to `False`. If not specified, `AutomaticModelRegistration` defaults to `False`.
        mlflow-version: The version of MLflow that the tracking server uses. To see which MLflow versions are available to use, see [How it works](https://docs.aws.amazon.com/sagemaker/latest/dg/mlflow.html#mlflow-create-tracking-server-how-it-works).
        role-arn: The Amazon Resource Name (ARN) for an IAM role in your account that the MLflow Tracking Server uses to access the artifact store in Amazon S3. The role should have `AmazonS3FullAccess` permissions. For more information on IAM permissions for tracking server creation, see [Set up IAM permissions for MLflow](https://docs.aws.amazon.com/sagemaker/latest/dg/mlflow-create-tracking-server-iam.html).
        tags: Tags consisting of key-value pairs used to manage metadata for the tracking server.
        tracking-server-name: A unique string identifying the tracking server name. This string is part of the tracking server ARN.
        tracking-server-size: |-
            The size of the tracking server you want to create. You can choose between `"Small"`, `"Medium"`, and `"Large"`. The default MLflow Tracking Server configuration size is `"Small"`. You can choose a size depending on the projected use of the tracking server such as the volume of data logged, number of users, and frequency of use.

            We recommend using a small tracking server for teams of up to 25 users, a medium tracking server for teams of up to 50 users, and a large tracking server for teams of up to 100 users.
        weekly-maintenance-window-start: 'The day and time of the week in Coordinated Universal Time (UTC) 24-hour standard time that weekly maintenance updates are scheduled. For example: TUE:03:30.'
