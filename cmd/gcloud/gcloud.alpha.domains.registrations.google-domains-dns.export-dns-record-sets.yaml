name: export-dns-record-sets
description: '*(ALPHA)*  Export your registration''s Google Domains DNS zone''s record-sets into a file.'
flags:
    --no-zone-file-format&: Indicates that records-file should be in the zone file format.
    --records-file=!: File to which record-sets should be exported.
    --zone-file-format: Indicates that records-file should be in the zone file format.
documentation:
    command: |-
        *(ALPHA)*  Export your registration's Google Domains DNS (deprecated) zone's record-sets
        into a file.
        The formats you can export to are YAML records format (default) and
        BIND zone file format.

        ## EXAMPLES

        To export DNS record-sets of ``example.com'' into a YAML file, run:

          $ gcloud domains registrations google-domains-dns export-dns-record-sets
          example.com --records-file=records.yaml

        To export DNS record-sets of ``example.com'' into a BIND zone formatted file,
        run:

          $ gcloud domains registrations google-domains-dns export-dns-record-sets
          example.com --records-file=records.zonefile --zone-file-format
    flag:
        no-zone-file-format: Indicates that records-file should be in the zone file format. When using this flag, expect the record-set to be exported to a BIND zone formatted file. If you omit this flag, the record-set is exported into a YAML formatted records file. Note, this format flag determines the format of the output recorded in the records-file; it is different from the global `--format` flag which affects console output alone.
        records-file: File to which record-sets should be exported.
        zone-file-format: Indicates that records-file should be in the zone file format. When using this flag, expect the record-set to be exported to a BIND zone formatted file. If you omit this flag, the record-set is exported into a YAML formatted records file. Note, this format flag determines the format of the output recorded in the records-file; it is different from the global `--format` flag which affects console output alone.
