name: delete-configuration-policy
description: Deletes a configuration policy.
flags:
    --identifier=!: The Amazon Resource Name (ARN) or universally unique identifier (UUID) of the configuration policy.
documentation:
    command: Deletes a configuration policy. Only the Security Hub delegated administrator can invoke this operation from the home Region. For the deletion to succeed, you must first disassociate a configuration policy from target accounts, organizational units, or the root by invoking the `StartConfigurationPolicyDisassociation` operation.
    flag:
        identifier: The Amazon Resource Name (ARN) or universally unique identifier (UUID) of the configuration policy.
