name: update
description: '*(BETA)*  Updates a snooze.'
flags:
    --display-name=: The display name for the Snooze.
    --end-time=: The end time for the Snooze.
    --fields=: The list of fields to update.
    --snooze-from-file=: The path to a JSON or YAML file containing the snooze.
    --start-time=: The start time for the Snooze.
documentation:
    command: |
        *(BETA)*  Update a snooze.

        If `--snooze-from-file` is specified, then the update rules depend on
        the value of the (optional) `--fields` flag:

          * If `--fields` is specified, then only the specified fields of the
            snooze are updated.
          * Else, all fields of the snooze are replaced. The updated snooze
            can be modified further using the flags from the Snooze
            Settings group below.

        Otherwise, the snooze will be updated with the values specified in
        the flags from the Snooze Settings group.

        For information about the JSON/YAML format of a snooze:
        https://cloud.google.com/monitoring/api/ref_v3/rest/v3/projects.snoozes
    flag:
        display-name: The display name for the Snooze.
        end-time: The end time for the Snooze.
        fields: The list of fields to update. Must specify `--snooze-from-file` if using this flag.
        snooze-from-file: The path to a JSON or YAML file containing the snooze. Use a full or relative path to a local file containing the value of snooze.
        start-time: The start time for the Snooze.
