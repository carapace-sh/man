name: put-table-maintenance-configuration
description: Creates a new maintenance configuration or replaces an existing maintenance configuration for a table.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the table.
    --namespace=!: The namespace of the table.
    --table-bucket-arn=!: The Amazon Resource Name (ARN) of the table associated with the maintenance configuration.
    --type=!: The type of the maintenance configuration.
    --value=!: Defines the values of the maintenance configuration for the table.
completion:
    flag:
        type:
            - icebergCompaction
            - icebergSnapshotManagement
documentation:
    command: |-
        Creates a new maintenance configuration or replaces an existing maintenance configuration for a table. For more information, see [S3 Tables maintenance](https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-tables-maintenance.html) in the *Amazon Simple Storage Service User Guide*.

        Permissions

        You must have the `s3tables:PutTableMaintenanceConfiguration` permission to use this operation.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the table.
        namespace: The namespace of the table.
        table-bucket-arn: The Amazon Resource Name (ARN) of the table associated with the maintenance configuration.
        type: The type of the maintenance configuration.
        value: Defines the values of the maintenance configuration for the table.
