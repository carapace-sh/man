name: associate-phone-numbers-with-voice-connector-group
description: Associates phone numbers with the specified Amazon Chime SDK Voice Connector group.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --e164-phone-numbers=!:
        description: List of phone numbers, in E.164 format.
        nargs: -1
    --force-associate: If true, associates the provided phone numbers with the provided Amazon Chime SDK Voice Connector Group and removes any previously existing associations.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-force-associate: If true, associates the provided phone numbers with the provided Amazon Chime SDK Voice Connector Group and removes any previously existing associations.
    --voice-connector-group-id=!: The Amazon Chime SDK Voice Connector group ID.
documentation:
    command: Associates phone numbers with the specified Amazon Chime SDK Voice Connector group.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        e164-phone-numbers: List of phone numbers, in E.164 format.
        force-associate: If true, associates the provided phone numbers with the provided Amazon Chime SDK Voice Connector Group and removes any previously existing associations. If false, does not associate any phone numbers that have previously existing associations.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        voice-connector-group-id: The Amazon Chime SDK Voice Connector group ID.
