name: list-custom-routing-port-mappings-by-destination
description: List the port mappings for a specific EC2 instance (destination) in a VPC subnet endpoint.
flags:
    --destination-address=!: The endpoint IP address in a virtual private cloud (VPC) subnet for which you want to receive back port mappings.
    --endpoint-id=!: The ID for the virtual private cloud (VPC) subnet.
    --max-results=: The number of destination port mappings that you want to return with this call.
    --next-token=: The token for the next set of results.
documentation:
    command: List the port mappings for a specific EC2 instance (destination) in a VPC subnet endpoint. The response is the mappings for one destination IP address. This is useful when your subnet endpoint has mappings that span multiple custom routing accelerators in your account, or for scenarios where you only want to list the port mappings for a specific destination instance.
    flag:
        destination-address: The endpoint IP address in a virtual private cloud (VPC) subnet for which you want to receive back port mappings.
        endpoint-id: The ID for the virtual private cloud (VPC) subnet.
        max-results: The number of destination port mappings that you want to return with this call. The default value is 10.
        next-token: The token for the next set of results. You receive this token from a previous call.
