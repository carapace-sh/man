name: create-node
description: Create a Node in the specified Cluster.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cluster-id=!: The ID of the cluster.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=: The user-specified name of the Node to be created.
    --node-interface-mappings=:
        description: Documentation update needed
        nargs: -1
    --request-id=: An ID that you assign to a create request.
    --role=: The initial role of the Node in the Cluster.
    --tags=: A collection of key-value pairs.
completion:
    flag:
        role:
            - BACKUP
            - ACTIVE
documentation:
    command: Create a Node in the specified Cluster. You can also create Nodes using the CreateNodeRegistrationScript. Note that you can't move a Node to another Cluster.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cluster-id: The ID of the cluster.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The user-specified name of the Node to be created.
        node-interface-mappings: Documentation update needed
        request-id: An ID that you assign to a create request. This ID ensures idempotency when creating resources.
        role: The initial role of the Node in the Cluster. ACTIVE means the Node is available for encoding. BACKUP means the Node is a redundant Node and might get used if an ACTIVE Node fails.
        tags: A collection of key-value pairs.
