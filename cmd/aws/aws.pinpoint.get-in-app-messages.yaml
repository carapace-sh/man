name: get-in-app-messages
description: Retrieves the in-app messages targeted for the provided endpoint ID.
flags:
    --application-id=!: The unique identifier for the application.
    --endpoint-id=!: The unique identifier for the endpoint.
documentation:
    command: Retrieves the in-app messages targeted for the provided endpoint ID.
    flag:
        application-id: The unique identifier for the application. This identifier is displayed as the **Project ID** on the Amazon Pinpoint console.
        endpoint-id: The unique identifier for the endpoint.
