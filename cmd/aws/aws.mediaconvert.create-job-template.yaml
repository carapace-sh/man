name: create-job-template
description: Create a new job template.
flags:
    --acceleration-settings=: Accelerated transcoding can significantly speed up jobs with long, visually complex content.
    --category=: Optional.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: Optional.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --hop-destinations=:
        description: Optional.
        nargs: -1
    --name=!: The name of the job template you are creating.
    --priority=: Specify the relative priority for this job.
    --queue=: Optional.
    --settings=!: JobTemplateSettings contains all the transcode settings saved in the template that will be applied to jobs created from it.
    --status-update-interval=: Specify how often MediaConvert sends STATUS\_UPDATE events to Amazon CloudWatch Events.
    --tags=: The tags that you want to add to the resource.
completion:
    flag:
        status-update-interval:
            - SECONDS_10
            - SECONDS_12
            - SECONDS_15
            - SECONDS_20
            - SECONDS_30
            - SECONDS_60
            - SECONDS_120
            - SECONDS_180
            - SECONDS_240
            - SECONDS_300
            - SECONDS_360
            - SECONDS_420
            - SECONDS_480
            - SECONDS_540
            - SECONDS_600
documentation:
    command: Create a new job template. For information about job templates see the User Guide at http://docs.aws.amazon.com/mediaconvert/latest/ug/what-is.html
    flag:
        acceleration-settings: Accelerated transcoding can significantly speed up jobs with long, visually complex content. Outputs that use this feature incur pro-tier pricing. For information about feature limitations, see the AWS Elemental MediaConvert User Guide.
        category: Optional. A category for the job template you are creating
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: Optional. A description of the job template you are creating.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        hop-destinations: Optional. Use queue hopping to avoid overly long waits in the backlog of the queue that you submit your job to. Specify an alternate queue and the maximum time that your job will wait in the initial queue before hopping. For more information about this feature, see the AWS Elemental MediaConvert User Guide.
        name: The name of the job template you are creating.
        priority: Specify the relative priority for this job. In any given queue, the service begins processing the job with the highest value first. When more than one job has the same priority, the service begins processing the job that you submitted first. If you don't specify a priority, the service uses the default value 0.
        queue: Optional. The queue that jobs created from this template are assigned to. If you don't specify this, jobs will go to the default queue.
        settings: JobTemplateSettings contains all the transcode settings saved in the template that will be applied to jobs created from it.
        status-update-interval: Specify how often MediaConvert sends STATUS\_UPDATE events to Amazon CloudWatch Events. Set the interval, in seconds, between status updates. MediaConvert sends an update at this interval from the time the service begins processing your job to the time it completes the transcode or encounters an error.
        tags: The tags that you want to add to the resource. You can tag resources with a key-value pair or with only a key.
