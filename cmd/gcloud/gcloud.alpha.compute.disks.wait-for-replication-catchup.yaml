name: wait-for-replication-catchup
description: '*(ALPHA)*  Provides the operation id for the asynchronous replication of a Compute Engine persistent disk-pair that can be used to wait for the replication to catch up.'
flags:
    --max-wait-duration=: Maximum duration to wait for the replication catchup.
    --region=: Region of the disk to operate on.
    --zone=: Zone of the disk to operate on.
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute disks wait-for-replication-catchup* fetches the operation id that can be used to track the
        status of async replication for a Compute Engine persistent disk-pair.
        The operation id can be used to wait for the replication to catch up.
        This command can be invoked only on the primary disk.
    flag:
        max-wait-duration: Maximum duration to wait for the replication catchup.
        region: |-
            Region of the disk to operate on. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        zone: |-
            Zone of the disk to operate on. If not specified and the ``compute/zone'' property isn't set, you
            might be prompted to select a zone (interactive mode only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
