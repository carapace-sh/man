name: delete
description: Delete a Compute Engine network firewall policy.
flags:
    --global: If set, the firewall policy is global.
    --no-global&: If set, the firewall policy is global.
    --region=: Region of the firewall policy to delete.
documentation:
    command: |-
        *gcloud compute network-firewall-policies delete* is used to delete network firewall policies. A network
        firewall policy is a set of rules that controls access to various resources.
    flag:
        global: If set, the firewall policy is global.
        no-global: If set, the firewall policy is global.
        region: Region of the firewall policy to delete. Overrides the default *compute/region* property value for this command invocation.
