name: describe
description: '*(ALPHA)*  Show details of the management server.'
flags:
    --location=: Location ID of the resource.
documentation:
    command: '*(ALPHA)*  Show all configuration data associated with the specified management server.'
    flag:
        location: |-
            Location ID of the resource.
            +

            To set the `location` attribute:
            * provide the argument `management_server` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
