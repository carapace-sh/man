name: post-switch
description: Run post-switch hooks
flags:
    --foreground: Run in foreground (block until complete)
    --var=*: Override built-in template variable (KEY=VALUE)
    -h, --help: Print help (see more with '--help')
    -y, --yes: Skip approval prompts
completion:
    flag:
        C:
            - $files
        config:
            - $files
    positional:
        - []
documentation:
    command: |-
        Run post-switch hooks

        Background by default. Use --foreground to run in foreground for debugging.
    flag:
        help: Print help (see a summary with '-h')
