name: update
description: '*(ALPHA)*  Update a Google Compute Engine network attachment.'
flags:
    --description=: An optional, textual description for the network attachment.
    --producer-accept-list=: Projects that are allowed to connect to this network attachment.
    --producer-reject-list=: Projects that are not allowed to connect to this network attachment.
    --region=: Region of the network attachment to update.
    --subnets-region=: Region of the subnetworks to operate on.
    --subnets=: The subnetworks provided by the consumer for the producers
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute network-attachments update* is used to update network attachments. You can update the
        following fields: description, subnets, producer-accept-list and
        producer-reject-list. If you update the producer-accept-list or
        producer-reject-list, the full new list should be specified.
    flag:
        description: An optional, textual description for the network attachment.
        producer-accept-list: Projects that are allowed to connect to this network attachment.
        producer-reject-list: Projects that are not allowed to connect to this network attachment.
        region: |-
            Region of the network attachment to update. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        subnets: The subnetworks provided by the consumer for the producers
        subnets-region: Region of the subnetworks to operate on. Overrides the default *compute/region* property value for this command invocation.
