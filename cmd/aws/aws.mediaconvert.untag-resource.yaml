name: untag-resource
description: Remove tags from a MediaConvert queue, preset, or job template.
flags:
    --arn=!: The Amazon Resource Name (ARN) of the resource that you want to remove tags from.
    --tag-keys=: The keys of the tags that you want to remove from the resource.
documentation:
    command: Remove tags from a MediaConvert queue, preset, or job template. For information about tagging, see the User Guide at https://docs.aws.amazon.com/mediaconvert/latest/ug/tagging-resources.html
    flag:
        arn: The Amazon Resource Name (ARN) of the resource that you want to remove tags from. To get the ARN, send a GET request with the resource name.
        tag-keys: The keys of the tags that you want to remove from the resource.
