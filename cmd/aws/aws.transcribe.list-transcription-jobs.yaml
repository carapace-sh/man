name: list-transcription-jobs
description: Provides a list of transcription jobs that match the specified criteria.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --job-name-contains=: Returns only the transcription jobs that contain the specified string.
    --max-results=: The maximum number of transcription jobs to return in each page of results.
    --next-token=: If your `ListTranscriptionJobs` request returns more results than can be displayed, `NextToken` is displayed in the response with an associated string.
    --status=: Returns only transcription jobs with the specified status.
completion:
    flag:
        status:
            - QUEUED
            - IN_PROGRESS
            - FAILED
            - COMPLETED
documentation:
    command: |-
        Provides a list of transcription jobs that match the specified criteria. If no criteria are specified, all transcription jobs are returned.

        To get detailed information about a specific transcription job, use the operation.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        job-name-contains: Returns only the transcription jobs that contain the specified string. The search is not case sensitive.
        max-results: The maximum number of transcription jobs to return in each page of results. If there are fewer results than the value that you specify, only the actual results are returned. If you do not specify a value, a default of 5 is used.
        next-token: If your `ListTranscriptionJobs` request returns more results than can be displayed, `NextToken` is displayed in the response with an associated string. To get the next page of results, copy this string and repeat your request, including `NextToken` with the value of the copied string. Repeat as needed to view all your results.
        status: Returns only transcription jobs with the specified status. Jobs are ordered by creation date, with the newest job first. If you do not include `Status`, all transcription jobs are returned.
