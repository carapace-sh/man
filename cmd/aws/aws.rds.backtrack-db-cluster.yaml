name: backtrack-db-cluster
description: Backtracks a DB cluster to a specific time, without creating a new DB cluster.
flags:
    --backtrack-to=!: The timestamp of the time to backtrack the DB cluster to, specified in ISO 8601 format.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --db-cluster-identifier=!: The DB cluster identifier of the DB cluster to be backtracked.
    --force: Specifies whether to force the DB cluster to backtrack when binary logging is enabled.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-force: Specifies whether to force the DB cluster to backtrack when binary logging is enabled.
    --no-use-earliest-time-on-point-in-time-unavailable: Specifies whether to backtrack the DB cluster to the earliest possible backtrack time when *BacktrackTo* is set to a timestamp earlier than the earliest backtrack time.
    --use-earliest-time-on-point-in-time-unavailable: Specifies whether to backtrack the DB cluster to the earliest possible backtrack time when *BacktrackTo* is set to a timestamp earlier than the earliest backtrack time.
documentation:
    command: |-
        Backtracks a DB cluster to a specific time, without creating a new DB cluster.

        For more information on backtracking, see [Backtracking an Aurora DB Cluster](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraMySQL.Managing.Backtrack.html) in the *Amazon Aurora User Guide*.

        This action applies only to Aurora MySQL DB clusters.
    flag:
        backtrack-to: |-
            The timestamp of the time to backtrack the DB cluster to, specified in ISO 8601 format. For more information about ISO 8601, see the [ISO8601 Wikipedia page.](http://en.wikipedia.org/wiki/ISO_8601)

            If the specified time isn't a consistent time for the DB cluster, Aurora automatically chooses the nearest possible consistent time for the DB cluster.

            Constraints:

            - Must contain a valid ISO 8601 timestamp.
            - Can't contain a timestamp set in the future.

            Example: `2017-07-08T18:00Z`
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        db-cluster-identifier: |-
            The DB cluster identifier of the DB cluster to be backtracked. This parameter is stored as a lowercase string.

            Constraints:

            - Must contain from 1 to 63 alphanumeric characters or hyphens.
            - First character must be a letter.
            - Can't end with a hyphen or contain two consecutive hyphens.

            Example: `my-cluster1`
        force: Specifies whether to force the DB cluster to backtrack when binary logging is enabled. Otherwise, an error occurs when binary logging is enabled.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        use-earliest-time-on-point-in-time-unavailable: Specifies whether to backtrack the DB cluster to the earliest possible backtrack time when *BacktrackTo* is set to a timestamp earlier than the earliest backtrack time. When this parameter is disabled and *BacktrackTo* is set to a timestamp earlier than the earliest backtrack time, an error occurs.
