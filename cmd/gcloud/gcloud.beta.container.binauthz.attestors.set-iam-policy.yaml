name: set-iam-policy
description: '*(BETA)*  Set the IAM policy for an attestor.'
documentation:
    command: |-
        *(BETA)*  See https://cloud.google.com/iam/docs/managing-policies for details of
        the policy file format and contents.

        ## EXAMPLES
        The following command will read an IAM policy defined in a JSON file
        'iam_policy.json' and set it for the attestor `my_attestor`:

          $ gcloud beta container binauthz attestors set-iam-policy my_attestor iam_policy.json
