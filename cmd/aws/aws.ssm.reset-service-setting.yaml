name: reset-service-setting
description: '`ServiceSetting` is an account-level setting for an Amazon Web Services service.'
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --setting-id=!: The Amazon Resource Name (ARN) of the service setting to reset.
documentation:
    command: |-
        `ServiceSetting` is an account-level setting for an Amazon Web Services service. This setting defines how a user interacts with or uses a service or a feature of a service. For example, if an Amazon Web Services service charges money to the account based on feature or service usage, then the Amazon Web Services service team might create a default setting of "false". This means the user can't use this feature unless they change the setting to "true" and intentionally opt in for a paid feature.

        Services map a `SettingId` object to a setting value. Amazon Web Services services teams define the default value for a `SettingId`. You can't create a new `SettingId`, but you can overwrite the default value if you have the `ssm:UpdateServiceSetting` permission for the setting. Use the [GetServiceSetting]() API operation to view the current value. Use the [UpdateServiceSetting]() API operation to change the default setting.

        Reset the service setting for the account to the default value as provisioned by the Amazon Web Services service team.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        setting-id: |-
            The Amazon Resource Name (ARN) of the service setting to reset. The setting ID can be one of the following.

            - `/ssm/appmanager/appmanager-enabled`
            - `/ssm/automation/customer-script-log-destination`
            - `/ssm/automation/customer-script-log-group-name`
            - /ssm/automation/enable-adaptive-concurrency
            - `/ssm/documents/console/public-sharing-permission`
            - `/ssm/managed-instance/activation-tier`
            - `/ssm/managed-instance/default-ec2-instance-management-role`
            - `/ssm/opsinsights/opscenter`
            - `/ssm/parameter-store/default-parameter-tier`
            - `/ssm/parameter-store/high-throughput-enabled`
