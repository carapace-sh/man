name: export-statefile
description: Export a terraform state file.
flags:
    --draft: If this flag is set to true, the exported deployment state file will be the draft state
    --file=: File name for statefile.
    --location=: The Cloud location for the deployment.
    --no-draft&: If this flag is set to true, the exported deployment state file will be the draft state
documentation:
    command: This command generates a signed url to download a terraform state file.
    flag:
        draft: If this flag is set to true, the exported deployment state file will be the draft state
        file: |-
            File name for statefile. It is optional and it specifies the filename or
            complete path for the downloaded statefile. If only a file path is
            provided, the statefile will be downloaded as "statefile" within that
            directory. If a filename is included, the statefile will be downloaded
            with that name.
        location: |-
            The Cloud location for the deployment.
            +
            To set the `location` attribute:
            * provide the argument `DEPLOYMENT` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `infra-manager/location`.
        no-draft: If this flag is set to true, the exported deployment state file will be the draft state
