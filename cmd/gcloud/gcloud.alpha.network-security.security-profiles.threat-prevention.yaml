name: threat-prevention
description: '*(ALPHA)*  Manage Security Profiles - Threat Prevention Profile.'
documentation:
    command: |-
        *(ALPHA)*  Manage Security Profiles - Threat Prevention Profile.

        ## EXAMPLES

        To create a Security Profile with the name `my-security-profile` which
        includes location as global or region specified and organization ID, optional
        description as `New Security Profile`, run:

          $ gcloud alpha network-security security-profiles threat-prevention create my-security-profile  --description="New Security Profile"

        To add an override, run:

          $ gcloud alpha network-security security-profiles threat-prevention add-override my-security-profile --severities=MEDIUM
          --action=ALLOW

          `my-security-profile` is the name of the Security Profile in the
          format organizations/{organizationID}/locations/{location}/securityProfiles/
          {security_profile_id} where organizationID is the organization ID to which
          the changes should apply, location either global or region specified and
          security_profile_id the Security Profile Identifier.

        To update an override, run:

          $ gcloud alpha network-security security-profiles threat-prevention update-override my-security-profile --severities=MEDIUM
          --action=ALLOW

          `my-security-profile` is the name of the Security Profile in the
          format organizations/{organizationID}/locations/{location}/securityProfiles/
          {security_profile_id} where organizationID is the organization ID to which
          the changes should apply, location either global or region specified and
          security_profile_id the Security Profile Identifier.

        To list overrides, run:

          $ gcloud alpha network-security security-profiles threat-prevention list-overrides my-security-profile

          `my-security-profile` is the name of the Security Profile in the
          format organizations/{organizationID}/locations/{location}/securityProfiles/
          {security_profile_id} where organizationID is the organization ID to which
          the changes should apply, location either global or region specified and
          security_profile_id the Security Profile Identifier.

        To delete an override, run:

          $ gcloud alpha network-security security-profiles threat-prevention delete-override my-security-profile --severities=MEDIUM

          `my-security-profile` is the name of the Security Profile in the
          format organizations/{organizationID}/locations/{location}/securityProfiles/
          {security_profile_id} where organizationID is the organization ID to which
          the changes should apply, location either global or region specified and
          security_profile_id the Security Profile Identifier.

        To list Security Profiles in specified location and organization, run:

          $ gcloud alpha network-security security-profiles threat-prevention list --location=global

        To delete a Security Profile called `my-security-profile` which includes
        location as global or region specified and organization ID, run:

            $ gcloud alpha network-security security-profiles threat-prevention delete my-security-profile
