name: import
description: '*(BETA)*  *(DEPRECATED)*  Imports data into a Cloud SQL instance from Google Cloud Storage.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --database=: Database to which the import is made.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |-
        *(BETA)*  *(DEPRECATED)*  Imports data into a Cloud SQL instance from Google Cloud Storage.

        This command is deprecated and will be removed in version 205.0.0. Use `gcloud sql import sql` instead.

        Note: authorization is required. For more information on importing data
        into Google Cloud SQL see
        [](https://cloud.google.com/sql/docs/import-export/importing).

        Cloud SQL supports importing CSV files and SQL dump files from both MySQL and
        PostgreSQL. For more information on how to create these export formats, see
        [](https://cloud.google.com/sql/docs/mysql/import-export/creating-sqldump-csv)
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        database: Database to which the import is made. The database needs to be created before importing. If not set, it is assumed that the database is specified in the file to be imported. If your SQL dump file includes a database statement, it will override the database set in this flag.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
