name: get-behavior-model-training-summaries
description: Returns a Device Defender's ML Detect Security Profile training model's status.
flags:
    --max-results=: The maximum number of results to return at one time.
    --next-token=: The token for the next set of results.
    --security-profile-name=: The name of the security profile.
documentation:
    command: |-
        Returns a Device Defender's ML Detect Security Profile training model's status.

        Requires permission to access the [GetBehaviorModelTrainingSummaries](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        max-results: The maximum number of results to return at one time. The default is 10.
        next-token: The token for the next set of results.
        security-profile-name: The name of the security profile.
