name: put-resource-policy
description: Sets the Data Catalog resource policy for access control.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --enable-hybrid=: 'If `''TRUE''`, indicates that you are using both methods to grant cross-account access to Data Catalog resources:'
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --policy-exists-condition=: A value of `MUST_EXIST` is used to update a policy.
    --policy-hash-condition=: The hash value returned when the previous policy was set using `PutResourcePolicy`.
    --policy-in-json=!: Contains the policy document to set, in JSON format.
    --resource-arn=: Do not use.
completion:
    flag:
        enable-hybrid:
            - "TRUE"
            - "FALSE"
        policy-exists-condition:
            - MUST_EXIST
            - NOT_EXIST
            - NONE
documentation:
    command: Sets the Data Catalog resource policy for access control.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        enable-hybrid: |-
            If `'TRUE'`, indicates that you are using both methods to grant cross-account access to Data Catalog resources:

            - By directly updating the resource policy with `PutResourePolicy`
            - By using the **Grant permissions** command on the Amazon Web Services Management Console.

            Must be set to `'TRUE'` if you have already used the Management Console to grant cross-account access, otherwise the call fails. Default is 'FALSE'.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        policy-exists-condition: A value of `MUST_EXIST` is used to update a policy. A value of `NOT_EXIST` is used to create a new policy. If a value of `NONE` or a null value is used, the call does not depend on the existence of a policy.
        policy-hash-condition: The hash value returned when the previous policy was set using `PutResourcePolicy`. Its purpose is to prevent concurrent modifications of a policy. Do not use this parameter if no previous policy has been set.
        policy-in-json: Contains the policy document to set, in JSON format.
        resource-arn: Do not use. For internal use only.
