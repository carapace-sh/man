name: stop-dbcluster
description: Stops an Amazon Aurora DB cluster.
flags:
    --dbcluster-identifier=!: The DB cluster identifier of the Amazon Aurora DB cluster to be stopped.
documentation:
    command: |-
        Stops an Amazon Aurora DB cluster. When you stop a DB cluster, Aurora retains the DB cluster's metadata, including its endpoints and DB parameter groups. Aurora also retains the transaction logs so you can do a point-in-time restore if necessary.

        For more information, see [Stopping and Starting an Aurora Cluster](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-cluster-stop-start.html) in the *Amazon Aurora User Guide*.

        This operation only applies to Aurora DB clusters.
    flag:
        dbcluster-identifier: The DB cluster identifier of the Amazon Aurora DB cluster to be stopped. This parameter is stored as a lowercase string.
