name: delete
description: '*(BETA)*  Delete an AlloyDB cluster in a given region.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --force: Default value is false.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-force&: Default value is false.
    --region=!: Regional location (e.g. `asia-east1`, `us-east1`).
documentation:
    command: '*(BETA)*  Delete an AlloyDB cluster in a given region.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        force: |-
            Default value is false.
            +
            If flag is specified, deletes instances (if any) within this cluster, before deleting the cluster.
            +
            If flag is not specified, cluster delete will fail if there are instances present in the cluster.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-force: |-
            Default value is false.

            If flag is specified, deletes instances (if any) within this cluster, before deleting the cluster.

            If flag is not specified, cluster delete will fail if there are instances present in the cluster.
        region: Regional location (e.g. `asia-east1`, `us-east1`). See the full list of regions at https://cloud.google.com/sql/docs/instance-locations.
