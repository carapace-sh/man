name: delete
description: Delete an existing cluster for running containers.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --kubecontext-override=&: Name of kubectl context to use.
    --location=: Compute zone or region (e.g. us-central1-a or us-central1) for the cluster.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: Compute region (e.g. us-central1) for a regional cluster.
    --timeout=&: Timeout (seconds) for waiting on the operation to complete.
    --zone=: Compute zone (e.g. us-central1-a) for a zonal cluster.
documentation:
    command: |-
        When you delete a cluster, the following resources are deleted:

        - The control plane resources
        - All of the node instances in the cluster
        - Any Pods that are running on those instances
        - Any firewalls and routes created by Kubernetes Engine at the time of cluster
          creation
        - Data stored in host hostPath and emptyDir volumes

        GKE will attempt to delete the following resources. Deletion of these
        resources is not always guaranteed:

        - External load balancers created by the cluster
        - Internal load balancers created by the cluster
        - Persistent disk volumes
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        kubecontext-override: |
            Name of kubectl context to use.

            $ {command} cluster-1 --kubecontext-override=my-kubecontext
        location: Compute zone or region (e.g. us-central1-a or us-central1) for the cluster. Overrides the default compute/region or compute/zone value for this command invocation. Prefer using this flag over the --region or --zone flags.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: Compute region (e.g. us-central1) for a regional cluster. Overrides the default compute/region property value for this command invocation.
        timeout: Timeout (seconds) for waiting on the operation to complete.
        zone: Compute zone (e.g. us-central1-a) for a zonal cluster. Overrides the default compute/zone property value for this command invocation.
