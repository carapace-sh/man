name: accept-invitation
description: Accepts the invitation to be monitored by a GuardDuty administrator account.
flags:
    --detector-id=!: The unique ID of the detector of the GuardDuty member account.
    --invitation-id=!: The value that is used to validate the administrator account to the member account.
    --master-id=!: The account ID of the GuardDuty administrator account whose invitation you're accepting.
documentation:
    command: Accepts the invitation to be monitored by a GuardDuty administrator account.
    flag:
        detector-id: |-
            The unique ID of the detector of the GuardDuty member account.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
        invitation-id: The value that is used to validate the administrator account to the member account.
        master-id: The account ID of the GuardDuty administrator account whose invitation you're accepting.
