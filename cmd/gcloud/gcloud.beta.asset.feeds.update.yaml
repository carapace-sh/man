name: update
description: '*(BETA)*  Update an existing Cloud Asset Inventory Feed.'
flags:
    --add-asset-names=: Append the given values to the current assetNames.
    --add-asset-types=: Append the given values to the current assetTypes.
    --add-relationship-types=: Append the given values to the current relationshipTypes.
    --clear-asset-names: Empty the current assetNames.
    --clear-asset-types: Empty the current assetTypes.
    --clear-condition-description: Clear any existing condition description setting on the feed.
    --clear-condition-expression: Clear any existing condition expression setting on the feed.
    --clear-condition-title: Clear any existing condition title setting on the feed.
    --clear-content-type: Clear any existing content type setting on the feed.
    --clear-relationship-types: Empty the current relationshipTypes.
    --condition-description=: Condition description to overwrite the existing one.
    --condition-expression=: Condition expression to overwrite the existing one.
    --condition-title=: Condition title to overwrite the existing one.
    --content-type=: Asset content type to overwrite the existing one.
    --folder=: Folder of the feed.
    --no-clear-asset-names&: Empty the current assetNames.
    --no-clear-asset-types&: Empty the current assetTypes.
    --no-clear-condition-description&: Clear any existing condition description setting on the feed.
    --no-clear-condition-expression&: Clear any existing condition expression setting on the feed.
    --no-clear-condition-title&: Clear any existing condition title setting on the feed.
    --no-clear-content-type&: Clear any existing content type setting on the feed.
    --no-clear-relationship-types&: Empty the current relationshipTypes.
    --organization=: Organization of the feed.
    --pubsub-topic=: Name of the Cloud Pub/Sub topic to publish to, of the form `projects/PROJECT_ID/topics/TOPIC_ID`.
    --remove-asset-names=: Remove the given values from the current assetNames.
    --remove-asset-types=: Remove the given values from the current assetTypes.
    --remove-relationship-types=: Remove the given values from the current relationshipTypes.
completion:
    flag:
        content-type:
            - resource
            - iam-policy
            - org-policy
            - access-policy
            - os-inventory
            - relationship
documentation:
    command: |
        *(BETA)*  Update an existing Cloud Asset Inventory Feed.
    flag:
        add-asset-names: Append the given values to the current assetNames.
        add-asset-types: Append the given values to the current assetTypes.
        add-relationship-types: Append the given values to the current relationshipTypes.
        clear-asset-names: Empty the current assetNames.
        clear-asset-types: Empty the current assetTypes.
        clear-condition-description: Clear any existing condition description setting on the feed. Condition description will be empty.
        clear-condition-expression: Clear any existing condition expression setting on the feed. No condition will be applied to feed.
        clear-condition-title: Clear any existing condition title setting on the feed. Condition title will be empty.
        clear-content-type: Clear any existing content type setting on the feed. Content type will be unspecified, no content but the asset name and type will be returned in the feed.
        clear-relationship-types: Empty the current relationshipTypes.
        condition-description: Condition description to overwrite the existing one.
        condition-expression: 'Condition expression to overwrite the existing one. For more information, see: https://cloud.google.com/asset-inventory/docs/monitoring-asset-changes#feed_with_condition'
        condition-title: Condition title to overwrite the existing one.
        content-type: 'Asset content type to overwrite the existing one. For more information, see: https://cloud.google.com/resource-manager/docs/cloud-asset-inventory/overview#asset_content_type. _CONTENT_TYPE_ must be one of: *resource*, *iam-policy*, *org-policy*, *access-policy*, *os-inventory*, *relationship*.'
        folder: Folder of the feed.
        no-clear-asset-names: Empty the current assetNames.
        no-clear-asset-types: Empty the current assetTypes.
        no-clear-condition-description: Clear any existing condition description setting on the feed. Condition description will be empty.
        no-clear-condition-expression: Clear any existing condition expression setting on the feed. No condition will be applied to feed.
        no-clear-condition-title: Clear any existing condition title setting on the feed. Condition title will be empty.
        no-clear-content-type: Clear any existing content type setting on the feed. Content type will be unspecified, no content but the asset name and type will be returned in the feed.
        no-clear-relationship-types: Empty the current relationshipTypes.
        organization: Organization of the feed.
        pubsub-topic: Name of the Cloud Pub/Sub topic to publish to, of the form `projects/PROJECT_ID/topics/TOPIC_ID`. You can list existing topics with `gcloud pubsub topics list --format="text(name)"`
        remove-asset-names: Remove the given values from the current assetNames.
        remove-asset-types: Remove the given values from the current assetTypes.
        remove-relationship-types: Remove the given values from the current relationshipTypes.
