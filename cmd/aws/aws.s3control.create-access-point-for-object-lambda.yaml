name: create-access-point-for-object-lambda
description: This operation is not supported by directory buckets.
flags:
    --account-id=!: The Amazon Web Services account ID for owner of the specified Object Lambda Access Point.
    --configuration=!: Object Lambda Access Point configuration as a JSON document.
    --name=!: The name you want to assign to this Object Lambda Access Point.
documentation:
    command: |-
        This operation is not supported by directory buckets.

        Creates an Object Lambda Access Point. For more information, see [Transforming objects with Object Lambda Access Points](https://docs.aws.amazon.com/AmazonS3/latest/userguide/transforming-objects.html) in the *Amazon S3 User Guide*.

        The following actions are related to `CreateAccessPointForObjectLambda`:

        - [DeleteAccessPointForObjectLambda](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_DeleteAccessPointForObjectLambda.html)
        - [GetAccessPointForObjectLambda](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_GetAccessPointForObjectLambda.html)
        - [ListAccessPointsForObjectLambda](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_ListAccessPointsForObjectLambda.html)

        You must URL encode any signed header values that contain spaces. For example, if your header value is `my file.txt`, containing two spaces after `my`, you must URL encode this value to `my%20%20file.txt`.
    flag:
        account-id: The Amazon Web Services account ID for owner of the specified Object Lambda Access Point.
        configuration: Object Lambda Access Point configuration as a JSON document.
        name: The name you want to assign to this Object Lambda Access Point.
