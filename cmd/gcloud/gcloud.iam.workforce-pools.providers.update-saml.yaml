documentation:
    command: Update a new SAML workforce pool provider.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        attribute-condition: |-
            A [Common Expression Language](https://opensource.google/projects/cel) expression, in plain
            text, to restrict which otherwise valid authentication credentials issued by the provider
            should be accepted.
            +
            The expression must output a boolean representing whether to allow the federation.
            +
            The following keywords may be referenced in the expressions:
            +
            * `assertion`: JSON representing the authentication credential issued by the Provider.
            * `google`: The Google attributes mapped from the assertion in the `attribute_mappings`.
                        `google.profile_photo` and `google.display_name` are not supported.
            * `attribute`: The custom attributes mapped from the assertion in the `attribute_mappings`.
            +
            The maximum length of the attribute condition expression is 4096 characters. If unspecified,
            all valid authentication credential will be accepted.
            +
            Example: Only allow credentials with a mapped `google.groups` value of `admins`.
            +
                     ```
                     "'admins' in google.groups"
                     ```
        attribute-mapping: |-
            Maps claims from the authentication credentials issued by the Identity Provider into Google
            Cloud IAM attributes, e.g. subject, segment.
            +
            Each key must be a string specifying the Google Cloud IAM attribute to be produced.
            +
            The following predefined keys are currently supported:
            +
            * `google.subject`: required field that indicates the principal that is being authenticated to
                                IAM, and will be logged in all API accesses for which Cloud Audit Logging
                                is configured.
            +
            * `google.groups`: optional field that indicates asserted groups that the user should be
                               considered to belong to. You can create IAM bindings using the groups
                               attribute and access to a resource will be granted if any of the groups
                               asserted here match a group in the respective binding.
            +
            * `google.display_name`: optional field that overrides the name of the user. If not set,
                                     `google.subject` will be displayed instead. This attribute cannot be
                                     used in IAM policies. The maximum length of this field is 100
                                     characters.
            +
            * `google.profile_photo`: optional fields that may be set to a valid URL specifying the user's
                                      thumbnail photo. When set, the image will be visible as the user's
                                      profile picture. If not set, a generic user icon will be displayed
                                      instead. This attribute cannot be used in IAM policies.
            +
            Custom attributes can also be mapped by specifying `attribute.{custom_attribute}`, replacing
            `{custom_attribute}` with the name of the custom attribute to be mapped. A maximum of 50
            custom attribute mappings can be defined. The maximum length of a mapped attribute key is 2048
            characters and may only contain the characters [a-z0-9_].
            +
            These attributes can then be referenced in IAM policies to define fine-grained access for the
            workforce pool to Google Cloud resources by specifying:
            +
            * `google.subject`: `principal://iam.googleapis.com/locations/global/workforcePools/{pool}/subject/{value}`
            +
            * `google.groups`: `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool}/group/{value}`
            +
            * `attribute.{custom_attribute}`: `principalSet://iam.googleapis.com/locations/global/workforcePools/{pool}/attribute.{custom_attribute}/{value}`
            +
            Each value must be a [Common Expression Language](https://opensource.google/projects/cel)
            function that maps an Identity Provider credential to the normalized attribute specified by
            the corresponding map key.
            +
            The following keywords may be referenced in the expressions:
            +
            * `assertion`: JSON representing the authentication credential issued by the Identity
                           Provider.
            +
            The maximum length of an attribute mapping expression is 2048 characters. When evaluated, the
            total size of all mapped attributes must not exceed 8KB.
            +
            Example: Map the `sub` claim of the incoming credential to the
                     `subject` Google Cloud IAM attribute.
            +
                     ```json
                     {"google.subject": "assertion.sub"}
                     ```
        clear-extended-attributes-config: Clear the extended attributes configuration.
        clear-extra-attributes-config: Clear the extra attributes configuration.
        description: A description for the workforce pool provider. Cannot exceed 256 characters in length.
        detailed-audit-logging: |-
            Enables detailed audit logging for this provider, which populates additional debug information
            in STS Cloud Audit Logs. Specify `--no-detailed-audit-logging` to disable it.
        disabled: |-
            Disables the workforce pool provider. You cannot use a disabled provider to perform
            new token exchanges or sign-ins. However, existing tokens still grant access. Specify
            `--no-disabled` to enable a disabled pool.
        display-name: A display name for the workforce pool provider. Cannot exceed 32 characters in length.
        extended-attributes-client-id: The OAuth 2.0 client ID for retrieving extended attributes from the identity provider. Required to get extended group memberships for a subset of Google Cloud products.
        extended-attributes-client-secret-value: The OAuth 2.0 client secret for retrieving extended attributes from the identity provider. Required to get extended group memberships for a subset of Google Cloud products.
        extended-attributes-filter: "The filter used to request specific records from the IdP. By default, all of the groups that are associated with a user are fetched. For Microsoft Entra ID, you can add `$search` query parameters using [Keyword Query Language] (https://learn.microsoft.com/en-us/sharepoint/dev/general-development/keyword-query-language-kql-syntax-reference). To learn more about `$search` querying in Microsoft Entra ID, see [Use the `$search` query parameter] (https://learn.microsoft.com/en-us/graph/search-query-parameter). \n+\nAdditionally, Workforce Identity Federation automatically adds the following [`$filter` query parameters] (https://learn.microsoft.com/en-us/graph/filter-query-parameter), based on the value of `attributes_type`. Values passed to `filter` are converted to `$search` query parameters. Additional `$filter` query parameters cannot be added using this field. \n+\n* `AZURE_AD_GROUPS_ID`: `securityEnabled` filter is applied."
        extended-attributes-issuer-uri: OIDC identity provider's issuer URI. Must be a valid URI using the `https` scheme. Required to get the OIDC discovery document.
        extended-attributes-type: 'Represents the identity provider and type of claims that should be fetched. _EXTENDED_ATTRIBUTES_TYPE_ must be (only one value is supported): *azure-ad-groups-id*.'
        extra-attributes-client-id: The OAuth 2.0 client ID for retrieving extra attributes from the identity provider. Required to get the access token using client credentials grant flow.
        extra-attributes-client-secret-value: The OAuth 2.0 client secret for retrieving extra attributes from the identity provider. Required to get the access token using client credentials grant flow.
        extra-attributes-filter: "The filter used to request specific records from the IdP. By default, all of the groups that are associated with a user are fetched. For Microsoft Entra ID, you can add `$search` query parameters using [Keyword Query Language] (https://learn.microsoft.com/en-us/sharepoint/dev/general-development/keyword-query-language-kql-syntax-reference). To learn more about `$search` querying in Microsoft Entra ID, see [Use the `$search` query parameter] (https://learn.microsoft.com/en-us/graph/search-query-parameter). \n+\nAdditionally, Workforce Identity Federation automatically adds the following [`$filter` query parameters] (https://learn.microsoft.com/en-us/graph/filter-query-parameter), based on the value of `attributes_type`. Values passed to `filter` are converted to `$search` query parameters. Additional `$filter` query parameters cannot be added using this field. \n+\n* `AZURE_AD_GROUPS_MAIL`: `mailEnabled` and `securityEnabled` filters are applied. \n* `AZURE_AD_GROUPS_ID`: `securityEnabled` filter is applied."
        extra-attributes-issuer-uri: OIDC identity provider's issuer URI. Must be a valid URI using the `https` scheme. Required to get the OIDC discovery document.
        extra-attributes-type: 'Represents the identity provider and type of claims that should be fetched. _EXTRA_ATTRIBUTES_TYPE_ must be one of: *azure-ad-groups-mail*, *azure-ad-groups-id*.'
        idp-metadata-path: |-
            XML file with configuration metadata for the SAML identity provider. The metadata file must
            follow the
            [SAML 2.0 metadata specification](https://www.oasis-open.org/committees/download.php/35391/sstc-saml-metadata-errata-2.0-wd-04-diff.pdf). Use a full or relative path to a local file containing the value of idp_metadata_path.
        location: |-
            The location for the workforce pool.
            +
            To set the `location` attribute:
            * provide the argument `provider` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-extended-attributes-config: Clear the extended attributes configuration.
        no-clear-extra-attributes-config: Clear the extra attributes configuration.
        no-detailed-audit-logging: |-
            Enables detailed audit logging for this provider, which populates additional debug information
            in STS Cloud Audit Logs. Specify `--no-detailed-audit-logging` to disable it.
        no-disabled: |-
            Disables the workforce pool provider. You cannot use a disabled provider to perform
            new token exchanges or sign-ins. However, existing tokens still grant access. Specify
            `--no-disabled` to enable a disabled pool.
        scim-usage: |-
            Specifies whether the workforce identity pool provider uses SCIM-managed
            groups instead of the `google.groups` attribute mapping for authorization checks.
            +
            The `scim_usage` and `extended_attributes_oauth2_client` fields are
            mutually exclusive. A request that enables both fields on the same
            workforce identity pool provider will produce an error.
            +
            Use `enabled-for-groups` to enable SCIM-managed groups.
            Use `scim-usage-unspecified` to disable SCIM-managed groups.
            +
            _SCIM_USAGE_ must be one of: *enabled-for-groups*, *scim-usage-unspecified*.
        workforce-pool: |-
            The ID to use for the workforce pool, which becomes the final component of the
            resource name. This value must be a globally unique string of 6 to 63 lowercase letters,
            digits, or hyphens. It must start with a letter, and cannot have a trailing hyphen.
            The prefix `gcp-` is reserved for use by Google, and may not be specified.
            +

            To set the `workforce-pool` attribute:
            * provide the argument `provider` on the command line with a fully specified name;
            * provide the argument `--workforce-pool` on the command line.
