name: cancel
description: '*(BETA)*  Cancels all jobs that match the command line arguments.'
flags:
    --force: Forcibly cancels a Dataflow job.
    --no-force&: Forcibly cancels a Dataflow job.
    --region=: Region ID of the jobs' regional endpoint.
documentation:
    command: '*(BETA)*  Cancels all jobs that match the command line arguments.'
    flag:
        force: Forcibly cancels a Dataflow job. Regular cancel must have been attempted at least 30 minutes prior for a job to be force cancelled.
        no-force: Forcibly cancels a Dataflow job. Regular cancel must have been attempted at least 30 minutes prior for a job to be force cancelled.
        region: Region ID of the jobs' regional endpoint. Defaults to 'us-central1'.
