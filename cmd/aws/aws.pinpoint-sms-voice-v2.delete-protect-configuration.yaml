name: delete-protect-configuration
description: Permanently delete the protect configuration.
flags:
    --protect-configuration-id=!: The unique identifier for the protect configuration.
documentation:
    command: Permanently delete the protect configuration. The protect configuration must have deletion protection disabled and must not be associated as the account default protect configuration or associated with a configuration set.
    flag:
        protect-configuration-id: The unique identifier for the protect configuration.
