name: add
description: Append a record-set addition to the transaction.
flags:
    --name=!: DNS or domain name of the record-set to add.
    --transaction-file=: Path of the file which contains the transaction.
    --ttl=!: TTL (time to live) for the record-set to add.
    --type=!: DNS record type of the record-set to add.
    --zone=!: Name of the managed zone whose record sets you want to manage.
documentation:
    command: |-
        This command appends a record-set addition to the transaction.

        For a guide detailing how to manage records, see:
        https://cloud.google.com/dns/records/

        ## EXAMPLES

        To add an A record with an IP address of "1.2.3.4", domain name of
        "my.domain.", and a managed zone "MANAGED_ZONE", run:

          $ gcloud dns record-sets transaction add "1.2.3.4" \
              --name=my.domain. --ttl=1234 \
              --type=A --zone=MANAGED_ZONE

        To add a TXT record with multiple data values while specifying time to
        live as 14400 seconds, run:

          $ gcloud dns record-sets transaction add "Hello world" "Bye world" \
              --name=my.domain. --ttl=14400 \
              --type=TXT --zone=MANAGED_ZONE
    flag:
        name: DNS or domain name of the record-set to add.
        transaction-file: Path of the file which contains the transaction.
        ttl: TTL (time to live) for the record-set to add.
        type: DNS record type of the record-set to add.
        zone: Name of the managed zone whose record sets you want to manage.
