name: import-certificate
description: Imports the signing and encryption certificates that you need to create local (AS2) profiles and partner profiles.
flags:
    --active-date=: An optional date that specifies when the certificate becomes active.
    --certificate-chain=: An optional list of certificates that make up the chain for the certificate that's being imported.
    --certificate=!: '- For the CLI, provide a file path for a certificate in URI format.'
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A short description that helps identify the certificate.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --inactive-date=: An optional date that specifies when the certificate becomes inactive.
    --private-key=: '- For the CLI, provide a file path for a private key in URI format.'
    --tags=:
        description: Key-value pairs that can be used to group and search for certificates.
        nargs: -1
    --usage=!: Specifies how this certificate is used.
completion:
    flag:
        usage:
            - SIGNING
            - ENCRYPTION
            - TLS
documentation:
    command: |-
        Imports the signing and encryption certificates that you need to create local (AS2) profiles and partner profiles.

        You can import both the certificate and its chain in the `Certificate` parameter.

        After importing a certificate, Transfer Family automatically creates a Amazon CloudWatch metric called `DaysUntilExpiry` that tracks the number of days until the certificate expires. The metric is based on the `InactiveDate` parameter and is published daily in the `AWS/Transfer` namespace.

        It can take up to a full day after importing a certificate for Transfer Family to emit the `DaysUntilExpiry` metric to your account.

        If you use the `Certificate` parameter to upload both the certificate and its chain, don't use the `CertificateChain` parameter.

        **CloudWatch monitoring**

        The `DaysUntilExpiry` metric includes the following specifications:

        - **Units:** Count (days)
        - **Dimensions:** `CertificateId` (always present), `Description` (if provided during certificate import)
        - **Statistics:** Minimum, Maximum, Average
        - **Frequency:** Published daily
    flag:
        active-date: An optional date that specifies when the certificate becomes active. If you do not specify a value, `ActiveDate` takes the same value as `NotBeforeDate`, which is specified by the CA.
        certificate: |-
            - For the CLI, provide a file path for a certificate in URI format. For example, `--certificate file://encryption-cert.pem`. Alternatively, you can provide the raw content.
            - For the SDK, specify the raw content of a certificate file. For example, ``--certificate "`cat encryption-cert.pem`"``.

            You can provide both the certificate and its chain in this parameter, without needing to use the `CertificateChain` parameter. If you use this parameter for both the certificate and its chain, do not use the `CertificateChain` parameter.
        certificate-chain: An optional list of certificates that make up the chain for the certificate that's being imported.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A short description that helps identify the certificate.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        inactive-date: An optional date that specifies when the certificate becomes inactive. If you do not specify a value, `InactiveDate` takes the same value as `NotAfterDate`, which is specified by the CA.
        private-key: |-
            - For the CLI, provide a file path for a private key in URI format. For example, `--private-key file://encryption-key.pem`. Alternatively, you can provide the raw content of the private key file.
            - For the SDK, specify the raw content of a private key file. For example, ``--private-key "`cat encryption-key.pem`"``
        tags: Key-value pairs that can be used to group and search for certificates.
        usage: |-
            Specifies how this certificate is used. It can be used in the following ways:

            - `SIGNING`: For signing AS2 messages
            - `ENCRYPTION`: For encrypting AS2 messages
            - `TLS`: For securing AS2 communications sent over HTTPS
