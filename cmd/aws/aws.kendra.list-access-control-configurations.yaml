name: list-access-control-configurations
description: Lists one or more access control configurations for an index.
flags:
    --index-id=!: The identifier of the index for the access control configuration.
    --max-results=: The maximum number of access control configurations to return.
    --next-token=: If the previous response was incomplete (because there's more data to retrieve), Amazon Kendra returns a pagination token in the response.
documentation:
    command: Lists one or more access control configurations for an index. This includes user and group access information for your documents. This is useful for user context filtering, where search results are filtered based on the user or their group access to documents.
    flag:
        index-id: The identifier of the index for the access control configuration.
        max-results: The maximum number of access control configurations to return.
        next-token: If the previous response was incomplete (because there's more data to retrieve), Amazon Kendra returns a pagination token in the response. You can use this pagination token to retrieve the next set of access control configurations.
