name: tag-resource
description: Adds tags to a resource.
flags:
    --resource-arn=!: The ARN of the Glue resource to which to add the tags.
    --tags-to-add=!: Tags to add to this resource.
documentation:
    command: Adds tags to a resource. A tag is a label you can assign to an Amazon Web Services resource. In Glue, you can tag only certain resources. For information about what resources you can tag, see [Amazon Web Services Tags in Glue](https://docs.aws.amazon.com/glue/latest/dg/monitor-tags.html).
    flag:
        resource-arn: The ARN of the Glue resource to which to add the tags. For more information about Glue resource ARNs, see the [Glue ARN string pattern](https://docs.aws.amazon.com/glue/latest/dg/aws-glue-api-common.html#aws-glue-api-regex-aws-glue-arn-id).
        tags-to-add: Tags to add to this resource.
