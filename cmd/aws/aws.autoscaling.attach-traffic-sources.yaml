name: attach-traffic-sources
description: Attaches one or more traffic sources to the specified Auto Scaling group.
flags:
    --auto-scaling-group-name=!: The name of the Auto Scaling group.
    --skip-zonal-shift-validation=: If you enable zonal shift with cross-zone disabled load balancers, capacity could become imbalanced across Availability Zones.
    --traffic-sources=!: The unique identifiers of one or more traffic sources.
documentation:
    command: |-
        Attaches one or more traffic sources to the specified Auto Scaling group.

        You can use any of the following as traffic sources for an Auto Scaling group:

        - Application Load Balancer
        - Classic Load Balancer
        - Gateway Load Balancer
        - Network Load Balancer
        - VPC Lattice

        This operation is additive and does not detach existing traffic sources from the Auto Scaling group.

        After the operation completes, use the [DescribeTrafficSources](https://docs.aws.amazon.com/autoscaling/ec2/APIReference/API_DescribeTrafficSources.html) API to return details about the state of the attachments between traffic sources and your Auto Scaling group. To detach a traffic source from the Auto Scaling group, call the [DetachTrafficSources](https://docs.aws.amazon.com/autoscaling/ec2/APIReference/API_DetachTrafficSources.html) API.
    flag:
        auto-scaling-group-name: The name of the Auto Scaling group.
        skip-zonal-shift-validation: If you enable zonal shift with cross-zone disabled load balancers, capacity could become imbalanced across Availability Zones. To skip the validation, specify `true`. For more information, see [Auto Scaling group zonal shift](https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-zonal-shift.html) in the *Amazon EC2 Auto Scaling User Guide*.
        traffic-sources: The unique identifiers of one or more traffic sources. You can specify up to 10 traffic sources.
