name: describe
description: '*(ALPHA)*  Describe a notification channel descriptor.'
documentation:
    command: |
        *(ALPHA)*  Describes a notification channel type by fetching its descriptor.

        ## EXAMPLES
        The following command obtains the descriptor for the `email` channel type:

          $ gcloud alpha monitoring channel-descriptors describe email

        The following command obtains the descriptor for the `sms` channel type:

          $ gcloud alpha monitoring channel-descriptors describe sms
