name: disable-organization-admin-account
description: Removes the existing GuardDuty delegated administrator of the organization.
flags:
    --admin-account-id=!: The Amazon Web Services Account ID for the organizations account to be disabled as a GuardDuty delegated administrator.
documentation:
    command: Removes the existing GuardDuty delegated administrator of the organization. Only the organization's management account can run this API operation.
    flag:
        admin-account-id: The Amazon Web Services Account ID for the organizations account to be disabled as a GuardDuty delegated administrator.
