name: list-associated-resources
description: Lists all of the resources that are associated with the specified application.
flags:
    --application=!: The name, ID, or ARN of the application.
    --max-results=: The upper bound of the number of results to return (cannot exceed 25).
    --next-token=: The token to use to get the next page of results after a previous API call.
documentation:
    command: |-
        Lists all of the resources that are associated with the specified application. Results are paginated.

        If you share an application, and a consumer account associates a tag query to the application, all of the users who can access the application can also view the tag values in all accounts that are associated with it using this API.
    flag:
        application: The name, ID, or ARN of the application.
        max-results: The upper bound of the number of results to return (cannot exceed 25). If this parameter is omitted, it defaults to 25. This value is optional.
        next-token: The token to use to get the next page of results after a previous API call.
