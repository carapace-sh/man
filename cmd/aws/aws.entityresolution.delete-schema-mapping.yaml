name: delete-schema-mapping
description: Deletes the `SchemaMapping` with a given name.
flags:
    --schema-name=!: The name of the schema to delete.
documentation:
    command: Deletes the `SchemaMapping` with a given name. This operation will succeed even if a schema with the given name does not exist. This operation will fail if there is a `MatchingWorkflow` object that references the `SchemaMapping` in the workflow's `InputSourceConfig`.
    flag:
        schema-name: The name of the schema to delete.
