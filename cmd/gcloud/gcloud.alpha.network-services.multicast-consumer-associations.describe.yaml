name: describe
description: '*(ALPHA)*  Describe a multicast consumer association.'
flags:
    --location=: The location Id.
documentation:
    command: |
        *(ALPHA)*  Show details of a multicast consumer association in the specified location of the current project.
    flag:
        location: |-
            The location Id.
            +
            To set the `location` attribute:
            * provide the argument `multicast_consumer_association` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
