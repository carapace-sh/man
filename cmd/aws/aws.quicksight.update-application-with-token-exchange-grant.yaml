name: update-application-with-token-exchange-grant
description: Updates an Quick Suite application with a token exchange grant.
flags:
    --aws-account-id=!: The ID of the Amazon Web Services account to be updated with a token exchange grant.
    --namespace=!: The namespace of the Quick Suite application.
documentation:
    command: Updates an Quick Suite application with a token exchange grant. This operation only supports Quick Suite applications that are registered with IAM Identity Center.
    flag:
        aws-account-id: The ID of the Amazon Web Services account to be updated with a token exchange grant.
        namespace: The namespace of the Quick Suite application.
