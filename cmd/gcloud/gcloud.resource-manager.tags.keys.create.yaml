name: create
description: Creates a TagKey resource under the specified tag parent.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: User-assigned description of the TagKey or TagValue.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --parent=!: Parent of the TagKey in the form of organizations/{org_id}.
    --purpose-data=: Purpose data of the TagKey that can only be set on creation.
    --purpose=: Purpose specifier of the TagKey that can only be set on creation.
completion:
    flag:
        purpose:
            - GCE_FIREWALL
            - DATA_GOVERNANCE
documentation:
    command: |-
        ## EXAMPLES

        To create a TagKey with the name env under 'organizations/123' with
        description 'description', run:

              $ gcloud resource-manager tags keys create env --parent=organizations/123
              --description=description
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: User-assigned description of the TagKey or TagValue. Must not exceed 256 characters.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        parent: Parent of the TagKey in the form of organizations/{org_id}.
        purpose: 'Purpose specifier of the TagKey that can only be set on creation. Specifying this field adds additional validation from the policy system that corresponds to the purpose. _PURPOSE_ must be one of: *GCE_FIREWALL*, *DATA_GOVERNANCE*.'
        purpose-data: Purpose data of the TagKey that can only be set on creation. This data is validated by the policy system that corresponds to the purpose.
