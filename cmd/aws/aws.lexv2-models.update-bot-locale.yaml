name: update-bot-locale
description: Updates the settings that a bot has for a specific locale.
flags:
    --bot-id=!: The unique identifier of the bot that contains the locale.
    --bot-version=!: The version of the bot that contains the locale to be updated.
    --description=: The new description of the locale.
    --generative-aisettings=: Contains settings for generative AI features powered by Amazon Bedrock for your bot locale.
    --locale-id=!: The identifier of the language and locale to update.
    --nlu-intent-confidence-threshold=!: The new confidence threshold where Amazon Lex inserts the `AMAZON.FallbackIntent` and `AMAZON.KendraSearchIntent` intents in the list of possible intents for an utterance.
    --voice-settings=: The new Amazon Polly voice Amazon Lex should use for voice interaction with the user.
documentation:
    command: Updates the settings that a bot has for a specific locale.
    flag:
        bot-id: The unique identifier of the bot that contains the locale.
        bot-version: The version of the bot that contains the locale to be updated. The version can only be the `DRAFT` version.
        description: The new description of the locale.
        generative-aisettings: Contains settings for generative AI features powered by Amazon Bedrock for your bot locale. Use this object to turn generative AI features on and off. Pricing may differ if you turn a feature on. For more information, see LINK.
        locale-id: The identifier of the language and locale to update. The string must match one of the supported locales. For more information, see [Supported languages](https://docs.aws.amazon.com/lexv2/latest/dg/how-languages.html).
        nlu-intent-confidence-threshold: The new confidence threshold where Amazon Lex inserts the `AMAZON.FallbackIntent` and `AMAZON.KendraSearchIntent` intents in the list of possible intents for an utterance.
        voice-settings: The new Amazon Polly voice Amazon Lex should use for voice interaction with the user.
