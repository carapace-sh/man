name: analyze-document
description: Analyzes an input document for relationships between detected items.
flags:
    --adapters-config=: Specifies the adapter to be used when analyzing a document.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --document=!: The input document as base64-encoded bytes or an Amazon S3 object.
    --feature-types=!:
        description: A list of the types of analysis to perform.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --human-loop-config=: Sets the configuration for the human in the loop workflow for analyzing documents.
    --queries-config=: Contains Queries and the alias for those Queries, as determined by the input.
documentation:
    command: |-
        Analyzes an input document for relationships between detected items.

        The types of information returned are as follows:

        - Form data (key-value pairs). The related information is returned in two [Block]() objects, each of type `KEY_VALUE_SET`: a KEY `Block` object and a VALUE `Block` object. For example, *Name: Ana Silva Carolina* contains a key and value. *Name:* is the key. *Ana Silva Carolina* is the value.
        - Table and table cell data. A TABLE `Block` object contains information about a detected table. A CELL `Block` object is returned for each cell in a table.
        - Lines and words of text. A LINE `Block` object contains one or more WORD `Block` objects. All lines and words that are detected in the document are returned (including text that doesn't have a relationship with the value of `FeatureTypes`).
        - Signatures. A SIGNATURE `Block` object contains the location information of a signature in a document. If used in conjunction with forms or tables, a signature can be given a Key-Value pairing or be detected in the cell of a table.
        - Query. A QUERY Block object contains the query text, alias and link to the associated Query results block object.
        - Query Result. A QUERY\_RESULT Block object contains the answer to the query and an ID that connects it to the query asked. This Block also contains a confidence score.

        Selection elements such as check boxes and option buttons (radio buttons) can be detected in form data and in tables. A SELECTION\_ELEMENT `Block` object contains information about a selection element, including the selection status.

        You can choose which type of analysis to perform by specifying the `FeatureTypes` list.

        The output is returned in a list of `Block` objects.

        `AnalyzeDocument` is a synchronous operation. To analyze documents asynchronously, use [StartDocumentAnalysis]().

        For more information, see [Document Text Analysis](https://docs.aws.amazon.com/textract/latest/dg/how-it-works-analyzing.html).
    flag:
        adapters-config: Specifies the adapter to be used when analyzing a document.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        document: |-
            The input document as base64-encoded bytes or an Amazon S3 object. If you use the AWS CLI to call Amazon Textract operations, you can't pass image bytes. The document must be an image in JPEG, PNG, PDF, or TIFF format.

            If you're using an AWS SDK to call Amazon Textract, you might not need to base64-encode image bytes that are passed using the `Bytes` field.
        feature-types: A list of the types of analysis to perform. Add TABLES to the list to return information about the tables that are detected in the input document. Add FORMS to return detected form data. Add SIGNATURES to return the locations of detected signatures. Add LAYOUT to the list to return information about the layout of the document. All lines and words detected in the document are included in the response (including text that isn't related to the value of `FeatureTypes`).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        human-loop-config: Sets the configuration for the human in the loop workflow for analyzing documents.
        queries-config: Contains Queries and the alias for those Queries, as determined by the input.
