name: describe
description: Outputs the Job object resulting from the Get API.
flags:
    --full: Retrieve the full Job rather than the summary view
    --region=: Region ID of the job's regional endpoint.
documentation:
    command: |-
        By default this will display the Summary view which includes:
          - Project ID
          - Regional Endpoint
          - Job ID
          - Job Name
          - Job Type (Batch vs. Streaming)
          - Job Create Time
          - Job Status (Running, Done, Cancelled, Failed)
          - Job Status Time

        Notable values that are only in the full view:
          - Environment (staging Jars, information about workers, etc.)
          - Steps from the workflow graph
    flag:
        full: Retrieve the full Job rather than the summary view
        region: Region ID of the job's regional endpoint. Defaults to 'us-central1'.
