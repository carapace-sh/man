name: modify-cluster-parameter-group
description: Modifies the parameters of a parameter group.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --parameter-group-name=!: The name of the parameter group to be modified.
    --parameters=!:
        description: An array of parameters to be modified.
        nargs: -1
documentation:
    command: |-
        Modifies the parameters of a parameter group. For the parameters parameter, it can't contain ASCII characters.

        For more information about parameters and parameter groups, go to [Amazon Redshift Parameter Groups](https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-parameter-groups.html) in the *Amazon Redshift Cluster Management Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        parameter-group-name: The name of the parameter group to be modified.
        parameters: |-
            An array of parameters to be modified. A maximum of 20 parameters can be modified in a single request.

            For each parameter to be modified, you must supply at least the parameter name and parameter value; other name-value pairs of the parameter are optional.

            For the workload management (WLM) configuration, you must supply all the name-value pairs in the wlm\_json\_configuration parameter.
