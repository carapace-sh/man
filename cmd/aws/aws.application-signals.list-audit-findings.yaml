name: list-audit-findings
description: Retrieves a list of audit findings for Application Signals resources.
flags:
    --audit-targets=!: An array of audit target specifications to filter the findings.
    --auditors=: An array of auditor names to filter the findings.
    --end-time=!: The end time for the audit findings query.
    --max-results=: The maximum number of audit findings to return in a single request.
    --next-token=: The token for the next set of results.
    --start-time=!: The start time for the audit findings query.
documentation:
    command: |-
        Retrieves a list of audit findings for Application Signals resources. Audit findings identify potential issues, misconfigurations, or compliance violations in your observability setup.

        You can filter findings by time range, auditor type, and target resources to focus on specific areas of concern. This operation supports pagination for large result sets.
    flag:
        audit-targets: An array of audit target specifications to filter the findings. Only findings related to the specified targets (such as specific services, SLOs, operations or canary) will be returned.
        auditors: An array of auditor names to filter the findings. Only findings generated by the specified auditors will be returned. When not specified, findings from all auditors are included except canary.
        end-time: The end time for the audit findings query. Only findings created before this time will be included in the results. Specify the time as the number of milliseconds since January 1, 1970, 00:00:00 UTC.
        max-results: The maximum number of audit findings to return in a single request. Valid range is 1 to 100. If not specified, defaults to 50.
        next-token: The token for the next set of results. Use this token to retrieve additional pages of audit findings when the result set is large.
        start-time: The start time for the audit findings query. Only findings created on or after this time will be included in the results. Specify the time as the number of milliseconds since January 1, 1970, 00:00:00 UTC.
