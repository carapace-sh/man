name: create-decoder-manifest
description: Creates the decoder manifest associated with a model manifest.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --default-for-unmapped-signals=: Use default decoders for all unmapped signals in the model.
    --description=: A brief description of the decoder manifest.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --model-manifest-arn=!: The Amazon Resource Name (ARN) of the vehicle model (model manifest).
    --name=!: The unique name of the decoder manifest to create.
    --network-interfaces=: A list of information about available network interfaces.
    --signal-decoders=: A list of information about signal decoders.
    --tags=: Metadata that can be used to manage the decoder manifest.
completion:
    flag:
        default-for-unmapped-signals:
            - CUSTOM_DECODING
documentation:
    command: |-
        Creates the decoder manifest associated with a model manifest. To create a decoder manifest, the following must be true:

        - Every signal decoder has a unique name.
        - Each signal decoder is associated with a network interface.
        - Each network interface has a unique ID.
        - The signal decoders are specified in the model manifest.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        default-for-unmapped-signals: |-
            Use default decoders for all unmapped signals in the model. You don't need to provide any detailed decoding information.

            Access to certain Amazon Web Services IoT FleetWise features is currently gated. For more information, see [Amazon Web Services Region and feature availability](https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/fleetwise-regions.html) in the *Amazon Web Services IoT FleetWise Developer Guide*.
        description: A brief description of the decoder manifest.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        model-manifest-arn: The Amazon Resource Name (ARN) of the vehicle model (model manifest).
        name: The unique name of the decoder manifest to create.
        network-interfaces: A list of information about available network interfaces.
        signal-decoders: A list of information about signal decoders.
        tags: Metadata that can be used to manage the decoder manifest.
