name: initiate-document-version-upload
description: Creates a new document object and version object.
flags:
    --authentication-token=: Amazon WorkDocs authentication token.
    --content-created-timestamp=: The timestamp when the content of the document was originally created.
    --content-modified-timestamp=: The timestamp when the content of the document was modified.
    --content-type=: The content type of the document.
    --document-size-in-bytes=: The size of the document, in bytes.
    --id=: The ID of the document.
    --name=: The name of the document.
    --parent-folder-id=: The ID of the parent folder.
documentation:
    command: |-
        Creates a new document object and version object.

        The client specifies the parent folder ID and name of the document to upload. The ID is optionally specified when creating a new version of an existing document. This is the first step to upload a document. Next, upload the document to the URL returned from the call, and then call [UpdateDocumentVersion]().

        To cancel the document upload, call [AbortDocumentVersionUpload]().
    flag:
        authentication-token: Amazon WorkDocs authentication token. Not required when using Amazon Web Services administrator credentials to access the API.
        content-created-timestamp: The timestamp when the content of the document was originally created.
        content-modified-timestamp: The timestamp when the content of the document was modified.
        content-type: The content type of the document.
        document-size-in-bytes: The size of the document, in bytes.
        id: The ID of the document.
        name: The name of the document.
        parent-folder-id: The ID of the parent folder.
