name: delete
description: '*(BETA)*  Delete a migration.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location of the Dataproc Metastore service.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --service=: The identifier of the Dataproc Metastore service
documentation:
    command: |
        *(BETA)*  Delete a migration.

        If run asynchronously with `--async`, exits after printing
        an operation name that can be used to poll the status of the
        deletion via:

          {top_command} metastore operations describe
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location of the Dataproc Metastore service.
            +
            If not specified, will use `default` metastore/location.
            +

            To set the `location` attribute:
            * provide the argument `migration` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `metastore/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        service: |-
            The identifier of the Dataproc Metastore service
            +
            To set the `service` attribute:
            * provide the argument `migration` on the command line with a fully specified name;
            * provide the argument `--service` on the command line.
