name: create-ip-access-settings
description: Creates an IP access settings resource that can be associated with a web portal.
flags:
    --additional-encryption-context=: Additional encryption context of the IP access settings.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --customer-managed-key=: The custom managed key of the IP access settings.
    --description=: The description of the IP access settings.
    --display-name=: The display name of the IP access settings.
    --ip-rules=!: The IP rules of the IP access settings.
    --tags=: The tags to add to the IP access settings resource.
documentation:
    command: Creates an IP access settings resource that can be associated with a web portal.
    flag:
        additional-encryption-context: Additional encryption context of the IP access settings.
        client-token: |-
            A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. Idempotency ensures that an API request completes only once. With an idempotent request, if the original request completes successfully, subsequent retries with the same client token returns the result from the original successful request.

            If you do not specify a client token, one is automatically generated by the Amazon Web Services SDK.
        customer-managed-key: The custom managed key of the IP access settings.
        description: The description of the IP access settings.
        display-name: The display name of the IP access settings.
        ip-rules: The IP rules of the IP access settings.
        tags: The tags to add to the IP access settings resource. A tag is a key-value pair.
