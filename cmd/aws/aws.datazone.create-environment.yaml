name: create-environment
description: Create an Amazon DataZone environment.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --deployment-order=: The deployment order of the environment.
    --description=: The description of the Amazon DataZone environment.
    --domain-identifier=!: The identifier of the Amazon DataZone domain in which the environment is created.
    --environment-account-identifier=: The ID of the account in which the environment is being created.
    --environment-account-region=: The region of the account in which the environment is being created.
    --environment-blueprint-identifier=: The ID of the blueprint with which the environment is being created.
    --environment-configuration-id=: The configuration ID of the environment.
    --environment-profile-identifier=: The identifier of the environment profile that is used to create this Amazon DataZone environment.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --glossary-terms=:
        description: The glossary terms that can be used in this Amazon DataZone environment.
        nargs: -1
    --name=!: The name of the Amazon DataZone environment.
    --project-identifier=!: The identifier of the Amazon DataZone project in which this environment is created.
    --user-parameters=:
        description: The user parameters of this Amazon DataZone environment.
        nargs: -1
documentation:
    command: Create an Amazon DataZone environment.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        deployment-order: The deployment order of the environment.
        description: The description of the Amazon DataZone environment.
        domain-identifier: The identifier of the Amazon DataZone domain in which the environment is created.
        environment-account-identifier: The ID of the account in which the environment is being created.
        environment-account-region: The region of the account in which the environment is being created.
        environment-blueprint-identifier: The ID of the blueprint with which the environment is being created.
        environment-configuration-id: The configuration ID of the environment.
        environment-profile-identifier: The identifier of the environment profile that is used to create this Amazon DataZone environment.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        glossary-terms: The glossary terms that can be used in this Amazon DataZone environment.
        name: The name of the Amazon DataZone environment.
        project-identifier: The identifier of the Amazon DataZone project in which this environment is created.
        user-parameters: The user parameters of this Amazon DataZone environment.
