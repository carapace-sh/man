name: get-mount-command
description: Prints a command to mount the Cloud Shell home directory via sshfs.
flags:
    --force-key-file-overwrite: If enabled gcloud will regenerate and overwrite the files associated
    --no-force-key-file-overwrite&: If enabled gcloud will regenerate and overwrite the files associated
    --no-ssh-key-file&: The path to the SSH key file.
    --ssh-key-file: The path to the SSH key file.
documentation:
    command: |
        *gcloud cloud-shell get-mount-command* starts your Cloud Shell if it is not already running, then
        prints out a command that allows you to mount the Cloud Shell home
        directory onto your local file system using *sshfs*. You must install
        and run sshfs yourself.

        After mounting the Cloud Shell home directory, any changes you make
        under the mount point on your local file system will be reflected in
        Cloud Shell and vice-versa.
    flag:
        force-key-file-overwrite: |-
            If enabled gcloud will regenerate and overwrite the files associated
            with a broken SSH key without asking for confirmation in both
            interactive and non-interactive environment.
            +
            If disabled gcloud will not attempt to regenerate the files associated
            with a broken SSH key and fail in both interactive and non-interactive
            environment.
        no-force-key-file-overwrite: |
            If enabled gcloud will regenerate and overwrite the files associated
            with a broken SSH key without asking for confirmation in both
            interactive and non-interactive environment.

            If disabled gcloud will not attempt to regenerate the files associated
            with a broken SSH key and fail in both interactive and non-interactive
            environment.
        no-ssh-key-file: |
            The path to the SSH key file. By default, this is
              *~/.ssh/google_compute_engine*.
        ssh-key-file: |-
            The path to the SSH key file. By default, this is
              *~/.ssh/google_compute_engine*.
