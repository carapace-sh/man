name: list-webhooks
description: Gets a listing of all the webhooks in this Amazon Web Services Region for this account.
flags:
    --max-results=: The maximum number of results to return in a single call.
    --next-token=: The token that was returned from the previous ListWebhooks call, which can be used to return the next set of webhooks in the list.
documentation:
    command: |-
        Gets a listing of all the webhooks in this Amazon Web Services Region for this account. The output lists all webhooks and includes the webhook URL and ARN and the configuration for each webhook.

        If a secret token was provided, it will be redacted in the response.
    flag:
        max-results: The maximum number of results to return in a single call. To retrieve the remaining results, make another call with the returned nextToken value.
        next-token: The token that was returned from the previous ListWebhooks call, which can be used to return the next set of webhooks in the list.
