name: reject-qualification-request
description: The `RejectQualificationRequest` operation rejects a user's request for a Qualification.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --qualification-request-id=!: The ID of the Qualification request, as returned by the `ListQualificationRequests` operation.
    --reason=: A text message explaining why the request was rejected, to be shown to the Worker who made the request.
documentation:
    command: |-
        The `RejectQualificationRequest` operation rejects a user's request for a Qualification.

        You can provide a text message explaining why the request was rejected. The Worker who made the request can see this message.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
