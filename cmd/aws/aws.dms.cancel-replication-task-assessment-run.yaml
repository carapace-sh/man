name: cancel-replication-task-assessment-run
description: Cancels a single premigration assessment run.
flags:
    --replication-task-assessment-run-arn=!: Amazon Resource Name (ARN) of the premigration assessment run to be canceled.
documentation:
    command: |-
        Cancels a single premigration assessment run.

        This operation prevents any individual assessments from running if they haven't started running. It also attempts to cancel any individual assessments that are currently running.
    flag:
        replication-task-assessment-run-arn: Amazon Resource Name (ARN) of the premigration assessment run to be canceled.
