name: set-iam-policy
description: '*(ALPHA)*  Set the IAM policy for a backup plan.'
flags:
    --location=: Google Cloud location.
documentation:
    command: |
        *(ALPHA)*  Set the IAM policy for a backup plan.

        ## EXAMPLES

        To set the IAM policy for a backup plan ``my-backup-plan'' in project ``my-project'' in location ``us-central1'' with the policy defined in the JSON file ``policy.json'', run:

          $ gcloud alpha container backup-restore backup-plans set-iam-policy my-backup-plan policy.json --project=my-project --location=us-central1
    flag:
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `backup_plan` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkebackup/location`.
