    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --view-arns=:
        description: A list of [Amazon resource names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) that identify the views you want details for.
        nargs: -1
documentation:
    command: Retrieves details about a list of views.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
