name: get-segment
description: Retrieves information about the configuration, dimension, and other settings for a specific segment that's associated with an application.
flags:
    --application-id=!: The unique identifier for the application.
    --segment-id=!: The unique identifier for the segment.
documentation:
    command: Retrieves information about the configuration, dimension, and other settings for a specific segment that's associated with an application.
    flag:
        application-id: The unique identifier for the application. This identifier is displayed as the **Project ID** on the Amazon Pinpoint console.
        segment-id: The unique identifier for the segment.
