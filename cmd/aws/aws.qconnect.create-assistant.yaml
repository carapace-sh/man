name: create-assistant
description: Creates an Amazon Q in Connect assistant.
flags:
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --description=: The description of the assistant.
    --name=!: The name of the assistant.
    --server-side-encryption-configuration=: The configuration information for the customer managed key used for encryption.
    --tags=: The tags used to organize, track, or control access for this resource.
    --type=!: The type of assistant.
completion:
    flag:
        type:
            - AGENT
documentation:
    command: Creates an Amazon Q in Connect assistant.
    flag:
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If not provided, the Amazon Web Services SDK populates this field. For more information about idempotency, see [Making retries safe with idempotent APIs](http://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/).
        description: The description of the assistant.
        name: The name of the assistant.
        server-side-encryption-configuration: |-
            The configuration information for the customer managed key used for encryption.

            The customer managed key must have a policy that allows `kms:CreateGrant`, `kms:DescribeKey`, `kms:Decrypt`, and `kms:GenerateDataKey*` permissions to the IAM identity using the key to invoke Amazon Q in Connect. To use Amazon Q in Connect with chat, the key policy must also allow `kms:Decrypt`, `kms:GenerateDataKey*`, and `kms:DescribeKey` permissions to the `connect.amazonaws.com` service principal.

            For more information about setting up a customer managed key for Amazon Q in Connect, see [Enable Amazon Q in Connect for your instance](https://docs.aws.amazon.com/connect/latest/adminguide/enable-q.html).
        tags: The tags used to organize, track, or control access for this resource.
        type: The type of assistant.
