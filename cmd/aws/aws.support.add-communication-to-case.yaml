name: add-communication-to-case
description: Adds additional customer communication to an Amazon Web Services Support case.
flags:
    --attachment-set-id=: The ID of a set of one or more attachments for the communication to add to the case.
    --case-id=: The support case ID requested or returned in the call.
    --cc-email-addresses=: The email addresses in the CC line of an email to be added to the support case.
    --communication-body=!: The body of an email communication to add to the support case.
documentation:
    command: |-
        Adds additional customer communication to an Amazon Web Services Support case. Use the `caseId` parameter to identify the case to which to add communication. You can list a set of email addresses to copy on the communication by using the `ccEmailAddresses` parameter. The `communicationBody` value contains the text of the communication.

        - You must have a Business, Enterprise On-Ramp, or Enterprise Support plan to use the Amazon Web Services Support API.
        - If you call the Amazon Web Services Support API from an account that doesn't have a Business, Enterprise On-Ramp, or Enterprise Support plan, the `SubscriptionRequiredException` error message appears. For information about changing your support plan, see [Amazon Web Services Support](http://aws.amazon.com/premiumsupport/).
    flag:
        attachment-set-id: The ID of a set of one or more attachments for the communication to add to the case. Create the set by calling [AddAttachmentsToSet]()
        case-id: 'The support case ID requested or returned in the call. The case ID is an alphanumeric string formatted as shown in this example: case-*12345678910-2013-c4c1d2bf33c5cf47*'
        cc-email-addresses: The email addresses in the CC line of an email to be added to the support case.
        communication-body: The body of an email communication to add to the support case.
