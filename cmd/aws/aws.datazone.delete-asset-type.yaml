name: delete-asset-type
description: Deletes an asset type in Amazon DataZone.
flags:
    --domain-identifier=!: The ID of the Amazon DataZone domain in which the asset type is deleted.
    --identifier=!: The identifier of the asset type that is deleted.
documentation:
    command: |-
        Deletes an asset type in Amazon DataZone.

        Prerequisites:

        - The asset type must exist in the domain.
        - You must have DeleteAssetType permission.
        - The asset type must not be in use (e.g., assigned to any asset). If used, deletion will fail.
        - You should retrieve the asset type using get-asset-type to confirm its presence before deletion.
    flag:
        domain-identifier: The ID of the Amazon DataZone domain in which the asset type is deleted.
        identifier: The identifier of the asset type that is deleted.
