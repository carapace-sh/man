name: submit
description: '*(BETA)*  Create a new custom job.'
hidden: true
flags:
    --archive-uris=&: Comma-separated archive URIs that will be copy to the Ray nodes.
    --container-image-uri=: The container image URI to use for the Ray worker node.
    --display-name=!: Display name of the serverless ray job.
    --entrypoint-file-args=: Comma-separated arguments passed to Ray job python file.
    --entrypoint=!: The Ray job entrypoint Python file Google Cloud Storage URI.
    --labels=: List of label KEY=VALUE pairs to add.
    --region=: ID of the region or fully qualified identifier for the region.
    --resource-spec=: Define the worker pool resource spec for the serverless ray job.
    --service-account=&: The service account to use for the Ray job.
documentation:
    command: |-
        *(BETA)*  This command will attempt to run the custom job immediately upon creation.

        ## EXAMPLES

        To create a job under project ``example'' in region
        ``us-central1'', run:

          $ gcloud beta ai ray job submit --region=us-central1 --project=example
          --worker-pool-spec=replica-count=1,machine-type='n1-highmem-2',container-image-uri='gcr.io/ucaip-test/ucaip-training-test'
          --display-name=test
    flag:
        archive-uris: Comma-separated archive URIs that will be copy to the Ray nodes. e.g. --archive-uris=gs://test-bucket/test.tar.gz,gs://test-bucket/test2.tar.gz
        container-image-uri: The container image URI to use for the Ray worker node.
        display-name: Display name of the serverless ray job.
        entrypoint: The Ray job entrypoint Python file Google Cloud Storage URI.
        entrypoint-file-args: Comma-separated arguments passed to Ray job python file. e.g. --entrypoint-file-args=arg1,arg2
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        region: |-
            ID of the region or fully qualified identifier for the region.
            +
            To set the `region` attribute:
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
        resource-spec: |-
            Define the worker pool resource spec for the serverless ray job.
            +
            The spec can contain the following fields:
            +
            *resource-unit*::: Optional. Default to 1. Define how many compute resources(CPU, memory) on each worker node. By default we are using machine e2-standard series, and each resource unit allocates 4 vCPUs and 16GB memory. The resource-unit value can only be 1,2,4,8.
            *disk-size*::: Optional, default to 100. Disk size in GB on one worker node.
            *max-node-count*::: Optional, default to 2000. The max number of worker nodes this job can occupy while running.
            +
            ::::
            Example:
            --resource-spec=resource-unit=2,disk-size=100,max-node-count=10
        service-account: The service account to use for the Ray job. If not specified, the default service account is used.
