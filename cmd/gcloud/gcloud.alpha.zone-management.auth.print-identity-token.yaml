name: print-identity-token
description: '*(ALPHA)*  Print an identity token for a specified audience.'
flags:
    --audience=!: Intended recipient of the token.
    --cred-file=!: Path to a credential file.
documentation:
    command: |-
        ## EXAMPLES

          $ gcloud alpha zone-management auth print-identity-token --audience=https://example.com --cred-file=/tmp/cred.json
    flag:
        audience: Intended recipient of the token. Currently, only one audience can be specified.
        cred-file: Path to a credential file.
