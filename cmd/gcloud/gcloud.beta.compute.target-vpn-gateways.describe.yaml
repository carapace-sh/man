name: describe
description: '*(BETA)*  Describe a Compute Engine Cloud VPN Classic Target VPN Gateway.'
flags:
    --region=: Region of the Target VPN Gateway to describe.
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute target-vpn-gateways describe* displays all data associated with a Compute Engine
        Cloud VPN Target VPN Gateway in a project.
    flag:
        region: |-
            Region of the Target VPN Gateway to describe. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
