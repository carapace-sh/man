name: create-data-provider
description: Creates a data provider using the provided settings.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --data-provider-name=: A user-friendly name for the data provider.
    --description=: A user-friendly description of the data provider.
    --engine=!: The type of database engine for the data provider.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-virtual: Indicates whether the data provider is virtual.
    --settings=!: The settings in JSON format for a data provider.
    --tags=:
        description: One or more tags to be assigned to the data provider.
        nargs: -1
    --virtual: Indicates whether the data provider is virtual.
documentation:
    command: Creates a data provider using the provided settings. A data provider stores a data store type and location information about your database.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        data-provider-name: A user-friendly name for the data provider.
        description: A user-friendly description of the data provider.
        engine: The type of database engine for the data provider. Valid values include `"aurora"`, `"aurora-postgresql"`, `"mysql"`, `"oracle"`, `"postgres"`, `"sqlserver"`, `redshift`, `mariadb`, `mongodb`, `db2`, `db2-zos`, `docdb`, and `sybase`. A value of `"aurora"` represents Amazon Aurora MySQL-Compatible Edition.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        settings: The settings in JSON format for a data provider.
        tags: One or more tags to be assigned to the data provider.
        virtual: Indicates whether the data provider is virtual.
