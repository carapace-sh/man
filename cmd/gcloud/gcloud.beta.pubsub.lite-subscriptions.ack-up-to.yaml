name: ack-up-to
description: '*(BETA)*  Acknowledge messages on a Pub/Sub Lite subscription.'
flags:
    --location=: ID of the location of the Pub/Sub Lite resource.
    --offset=!: The offset of a message within a topic partition.
    --partition=!: The topic partition.
    --zone=&: (DEPRECATED) ID of the location of the Pub/Sub Lite resource.
documentation:
    command: |
        *(BETA)*  Acknowledge all messages on a Pub/Sub Lite subscription up to the provided offset. The message
        corresponding to the provided offset will be included in the list of messages that are
        acknowledged.
    flag:
        location: |-
            ID of the location of the Pub/Sub Lite resource.
            +

            To set the `location` attribute:
            * provide the argument `subscription` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * provide the argument `--zone` on the command line.
        offset: The offset of a message within a topic partition. Must be greater than or equal to 0.
        partition: |-
            The topic partition. Partitions are zero indexed, so the partition must be in the range
            [0, topic.num_partitions). If you do not know your topic.num_partitions, run `gcloud pubsub
            lite-topic describe TOPIC --location=ZONE`.
        zone: |
            (DEPRECATED) ID of the location of the Pub/Sub Lite resource.
            +
            zone is deprecated and will be removed in an upcoming release. Please use --location instead.
