name: create-context
description: Creates a *context*.
flags:
    --context-name=!: The name of the context.
    --context-type=!: The context type.
    --description=: The description of the context.
    --properties=: A list of properties to add to the context.
    --source=!: The source type, ID, and URI.
    --tags=: A list of tags to apply to the context.
documentation:
    command: Creates a *context*. A context is a lineage tracking entity that represents a logical grouping of other tracking or experiment entities. Some examples are an endpoint and a model package. For more information, see [Amazon SageMaker ML Lineage Tracking](https://docs.aws.amazon.com/sagemaker/latest/dg/lineage-tracking.html).
    flag:
        context-name: The name of the context. Must be unique to your account in an Amazon Web Services Region.
        context-type: The context type.
        description: The description of the context.
        properties: A list of properties to add to the context.
        source: The source type, ID, and URI.
        tags: A list of tags to apply to the context.
