name: wait
description: '*(BETA)*  Waits for one or more operations to complete.'
flags:
    --timeout=: Maximum number of seconds to wait for an operation to complete.
documentation:
    command: '*(BETA)*  Waits for one or more operations to complete.'
    flag:
        timeout: Maximum number of seconds to wait for an operation to complete. By default, wait for 300s. Set to *unlimited* to wait indefinitely.
