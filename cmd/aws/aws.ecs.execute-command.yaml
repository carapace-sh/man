name: execute-command
description: Runs a command remotely on a container within a task.
flags:
    --cluster=: The Amazon Resource Name (ARN) or short name of the cluster the task is running in.
    --command=!: The command to run on the container.
    --container=: The name of the container to execute the command on.
    --interactive!: Use this flag to run your command in interactive mode.
    --no-interactive!&: Use this flag to run your command in interactive mode.
    --task=!: The Amazon Resource Name (ARN) or ID of the task the container is part of.
documentation:
    command: |-
        Runs a command remotely on a container within a task.

        If you use a condition key in your IAM policy to refine the conditions for the policy statement, for example limit the actions to a specific cluster, you receive an `AccessDeniedException` when there is a mismatch between the condition key value and the corresponding parameter value.

        For information about required permissions and considerations, see [Using Amazon ECS Exec for debugging](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ecs-exec.html) in the *Amazon ECS Developer Guide*.
    flag:
        cluster: The Amazon Resource Name (ARN) or short name of the cluster the task is running in. If you do not specify a cluster, the default cluster is assumed.
        command: The command to run on the container.
        container: The name of the container to execute the command on. A container name only needs to be specified for tasks containing multiple containers.
        interactive: Use this flag to run your command in interactive mode.
        task: The Amazon Resource Name (ARN) or ID of the task the container is part of.
