name: put-lifecycle-policy
description: Writes an object lifecycle policy to a container.
flags:
    --container-name=!: The name of the container that you want to assign the object lifecycle policy to.
    --lifecycle-policy=!: The object lifecycle policy to apply to the container.
documentation:
    command: |-
        Writes an object lifecycle policy to a container. If the container already has an object lifecycle policy, the service replaces the existing policy with the new policy. It takes up to 20 minutes for the change to take effect.

        For information about how to construct an object lifecycle policy, see [Components of an Object Lifecycle Policy](https://docs.aws.amazon.com/mediastore/latest/ug/policies-object-lifecycle-components.html).
    flag:
        container-name: The name of the container that you want to assign the object lifecycle policy to.
        lifecycle-policy: The object lifecycle policy to apply to the container.
