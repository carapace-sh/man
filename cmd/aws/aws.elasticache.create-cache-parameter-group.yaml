name: create-cache-parameter-group
description: Creates a new Amazon ElastiCache cache parameter group.
flags:
    --cache-parameter-group-family=!: The name of the cache parameter group family that the cache parameter group can be used with.
    --cache-parameter-group-name=!: A user-specified name for the cache parameter group.
    --description=!: A user-specified description for the cache parameter group.
    --tags=: A list of tags to be added to this resource.
documentation:
    command: |-
        Creates a new Amazon ElastiCache cache parameter group. An ElastiCache cache parameter group is a collection of parameters and their values that are applied to all of the nodes in any cluster or replication group using the CacheParameterGroup.

        A newly created CacheParameterGroup is an exact duplicate of the default parameter group for the CacheParameterGroupFamily. To customize the newly created CacheParameterGroup you can change the values of specific parameters. For more information, see:

        - [ModifyCacheParameterGroup](https://docs.aws.amazon.com/AmazonElastiCache/latest/APIReference/API_ModifyCacheParameterGroup.html) in the ElastiCache API Reference.
        - [Parameters and Parameter Groups](https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/ParameterGroups.html) in the ElastiCache User Guide.
    flag:
        cache-parameter-group-family: |-
            The name of the cache parameter group family that the cache parameter group can be used with.

            Valid values are: `valkey8` | `valkey7` | `memcached1.4` | `memcached1.5` | `memcached1.6` | `redis2.6` | `redis2.8` | `redis3.2` | `redis4.0` | `redis5.0` | `redis6.x` | `redis7`
        cache-parameter-group-name: A user-specified name for the cache parameter group.
        description: A user-specified description for the cache parameter group.
        tags: A list of tags to be added to this resource. A tag is a key-value pair. A tag key must be accompanied by a tag value, although null is accepted.
