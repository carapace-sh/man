name: upgrade-domain
description: Allows you to either upgrade your Amazon OpenSearch Service domain or perform an upgrade eligibility check to a compatible version of OpenSearch or Elasticsearch.
flags:
    --advanced-options=: Only supports the `override_main_response_version` parameter and not other advanced options.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-name=!: Name of the OpenSearch Service domain that you want to upgrade.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-perform-check-only: When true, indicates that an upgrade eligibility check needs to be performed.
    --perform-check-only: When true, indicates that an upgrade eligibility check needs to be performed.
    --target-version=!: OpenSearch or Elasticsearch version to which you want to upgrade, in the format Opensearch\_X.Y or Elasticsearch\_X.Y.
documentation:
    command: Allows you to either upgrade your Amazon OpenSearch Service domain or perform an upgrade eligibility check to a compatible version of OpenSearch or Elasticsearch.
    flag:
        advanced-options: Only supports the `override_main_response_version` parameter and not other advanced options. You can only include this option when upgrading to an OpenSearch version. Specifies whether the domain reports its version as 7.10 so that it continues to work with Elasticsearch OSS clients and plugins.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain-name: Name of the OpenSearch Service domain that you want to upgrade.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        perform-check-only: When true, indicates that an upgrade eligibility check needs to be performed. Does not actually perform the upgrade.
        target-version: OpenSearch or Elasticsearch version to which you want to upgrade, in the format Opensearch\_X.Y or Elasticsearch\_X.Y.
