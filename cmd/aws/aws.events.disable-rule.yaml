name: disable-rule
description: Disables the specified rule.
flags:
    --event-bus-name=: The name or ARN of the event bus associated with the rule.
    --name=!: The name of the rule.
documentation:
    command: |-
        Disables the specified rule. A disabled rule won't match any events, and won't self-trigger if it has a schedule expression.

        When you disable a rule, incoming events might continue to match to the disabled rule. Allow a short period of time for changes to take effect.
    flag:
        event-bus-name: The name or ARN of the event bus associated with the rule. If you omit this, the default event bus is used.
        name: The name of the rule.
