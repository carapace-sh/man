name: describe-mac-hosts
description: Describes the specified EC2 Mac Dedicated Host or all of your EC2 Mac Dedicated Hosts.
flags:
    --filters=: The filters.
    --host-ids=: The IDs of the EC2 Mac Dedicated Hosts.
    --max-results=: The maximum number of results to return for the request in a single page.
    --next-token=: The token to use to retrieve the next page of results.
documentation:
    command: Describes the specified EC2 Mac Dedicated Host or all of your EC2 Mac Dedicated Hosts.
    flag:
        filters: |-
            The filters.

            - `availability-zone` - The Availability Zone of the EC2 Mac Dedicated Host.
            - `instance-type` - The instance type size that the EC2 Mac Dedicated Host is configured to support.
        host-ids: The IDs of the EC2 Mac Dedicated Hosts.
        max-results: The maximum number of results to return for the request in a single page. The remaining results can be seen by sending another request with the returned `nextToken` value. This value can be between 5 and 500. If `maxResults` is given a larger value than 500, you receive an error.
        next-token: The token to use to retrieve the next page of results.
