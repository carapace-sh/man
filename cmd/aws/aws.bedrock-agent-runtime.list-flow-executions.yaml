name: list-flow-executions
description: Lists all executions of a flow.
flags:
    --flow-alias-identifier=: The unique identifier of the flow alias to list executions for.
    --flow-identifier=!: The unique identifier of the flow to list executions for.
    --max-results=: The maximum number of flow executions to return in a single response.
    --next-token=: A token to retrieve the next set of results.
documentation:
    command: |-
        Lists all executions of a flow. Results can be paginated and include summary information about each execution, such as status, start and end times, and the execution's Amazon Resource Name (ARN).

        Flow executions is in preview release for Amazon Bedrock and is subject to change.
    flag:
        flow-alias-identifier: The unique identifier of the flow alias to list executions for.
        flow-identifier: The unique identifier of the flow to list executions for.
        max-results: The maximum number of flow executions to return in a single response. If more executions exist than the specified `maxResults` value, a token is included in the response so that the remaining results can be retrieved.
        next-token: A token to retrieve the next set of results. This value is returned in the response if more results are available.
