name: update-service-network-vpc-association
description: Updates the service network and VPC association.
flags:
    --security-group-ids=!: The IDs of the security groups.
    --service-network-vpc-association-identifier=!: The ID or ARN of the association.
documentation:
    command: Updates the service network and VPC association. If you add a security group to the service network and VPC association, the association must continue to have at least one security group. You can add or edit security groups at any time. However, to remove all security groups, you must first delete the association and then recreate it without security groups.
    flag:
        security-group-ids: The IDs of the security groups.
        service-network-vpc-association-identifier: The ID or ARN of the association.
