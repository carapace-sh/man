name: create
description: '*(ALPHA)*  Creates a Cluster Director resource.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --buckets=: Reference of existing Google Cloud Storage bucket.
    --config=: Configuration of the cluster specs in the form of a JSON object.
    --create-buckets=: Parameters to create a Google Cloud Storage bucket.
    --create-filestores=: Parameters to create a filestore instance.
    --create-lustres=: Parameters to create a Lustre instance.
    --create-network=: Parameters to create a network.
    --description=: Description of the cluster.
    --dws-flex-instances=: Parameters to define cluster DWS Flex instances.
    --filestores=: Reference of existing filestore instance.
    --labels=: Cluster labels as key value pairs.
    --location=: The location id of the cluster resource.
    --lustres=: Reference of existing Lustre instance.
    --network=!: Reference of existing network name.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --on-demand-instances=: Parameters to define cluster on demand instances.
    --reserved-instances=: Parameters to define cluster reserved instances.
    --slurm-default-partition=: Parameters to define slurm cluster default partition.
    --slurm-login-node=!: Parameters to define slurm cluster login node.
    --slurm-node-sets=!: Parameters to define slurm cluster nodeset config.
    --slurm-partitions=!: Parameters to define slurm cluster partitions.
    --spot-instances=: Parameters to define cluster spot instances.
    --subnet=!: Reference of existing subnetwork name.
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha cluster-director clusters create* facilitates the creation of a cluster resource.

        There are following ways to create a cluster:
        - [Preferred] Use granular flags to define cluster specs.
        - Use --config flag with cluster specs in JSON format.

        Please refer to the examples below for more details.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        buckets: |-
            Reference of existing Google Cloud Storage bucket.
            +
            For e.g. --buckets {bucket-path}
