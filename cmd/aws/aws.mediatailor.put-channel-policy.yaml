name: put-channel-policy
description: Creates an IAM policy for the channel.
flags:
    --channel-name=!: The channel name associated with this Channel Policy.
    --policy=!: Adds an IAM role that determines the permissions of your channel.
documentation:
    command: Creates an IAM policy for the channel. IAM policies are used to control access to your channel.
    flag:
        channel-name: The channel name associated with this Channel Policy.
        policy: Adds an IAM role that determines the permissions of your channel.
