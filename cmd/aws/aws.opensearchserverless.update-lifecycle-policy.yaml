name: update-lifecycle-policy
description: Updates an OpenSearch Serverless access policy.
flags:
    --client-token=: A unique, case-sensitive identifier to ensure idempotency of the request.
    --description=: A description of the lifecycle policy.
    --name=!: The name of the policy.
    --policy-version=!: The version of the policy being updated.
    --policy=: The JSON policy document to use as the content for the lifecycle policy.
    --type=!: The type of lifecycle policy.
completion:
    flag:
        type:
            - retention
documentation:
    command: Updates an OpenSearch Serverless access policy. For more information, see [Updating data lifecycle policies](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-lifecycle.html#serverless-lifecycle-update).
    flag:
        client-token: A unique, case-sensitive identifier to ensure idempotency of the request.
        description: A description of the lifecycle policy.
        name: The name of the policy.
        policy: The JSON policy document to use as the content for the lifecycle policy.
        policy-version: The version of the policy being updated.
        type: The type of lifecycle policy.
