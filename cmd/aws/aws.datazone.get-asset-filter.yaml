name: get-asset-filter
description: Gets an asset filter.
flags:
    --asset-identifier=!: The ID of the data asset.
    --domain-identifier=!: The ID of the domain where you want to get an asset filter.
    --identifier=!: The ID of the asset filter.
documentation:
    command: |-
        Gets an asset filter.

        Prerequisites:

        - Domain (`--domain-identifier`), asset (`--asset-identifier`), and filter (`--identifier`) must all exist.
        - The asset filter should not have been deleted.
        - The asset must still exist (since the filter is linked to it).
    flag:
        asset-identifier: The ID of the data asset.
        domain-identifier: The ID of the domain where you want to get an asset filter.
        identifier: The ID of the asset filter.
