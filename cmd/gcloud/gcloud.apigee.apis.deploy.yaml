name: deploy
description: Deploy an API proxy to an environment.
flags:
    --api=: API proxy to be deployed.
    --environment=: Environment in which to deploy the API proxy.
    --no-override&: Force the deployment of the new revision, overriding any currently deployed revision that would conflict with it.
    --organization=: Apigee organization of the proxy and environment.
    --override: Force the deployment of the new revision, overriding any currently deployed revision that would conflict with it.
documentation:
    command: |4
         Deploy an API proxy to an environment.

        `gcloud apigee apis deploy` installs an API proxy revision in an Apigee runtime environment.

        By default, the API proxy's base path must not already be in use by a deployed
        proxy in the target environment. To allow Apigee to undeploy any conflicting
        API proxy as part of the deployment, use the `--override` command.

        Once a particular revision of an API proxy has been deployed, that revision
        can no longer be modified. Any updates to the API proxy must be saved as a new
        revision.
    flag:
        api: |-
            API proxy to be deployed. To get a list of available API proxies, run `{parent_command} list`.
            +
            To set the `api` attribute:
            * provide the argument `REVISION` on the command line with a fully specified name;
            * leave the argument unspecified for it to be chosen automatically with a fully specified name;
            * provide the argument `--api` on the command line.
        environment: |-
            Environment in which to deploy the API proxy. To get a list of available environments, run `{grandparent_command} environments list`.
            +
            To set the `environment` attribute:
            * provide the argument `REVISION` on the command line with a fully specified name;
            * leave the argument unspecified for it to be chosen automatically with a fully specified name;
            * provide the argument `--environment` on the command line.
        no-override: |-
            Force the deployment of the new revision, overriding any currently deployed revision that would conflict with it.

            If an existing API proxy revision is deployed, set this flag to ensure seamless deployment with zero downtime. In this case, the existing revision remains deployed until the new revision is fully deployed.

            If unset, `{command}` will fail unless all conflicting API proxies are first undeployed from the environment. To do this, run `{parent_command} undeploy` on the conflicting deployment.
        organization: |-
            Apigee organization of the proxy and environment. If unspecified, the Cloud Platform project's associated organization will be used.
            +
            To set the `organization` attribute:
            * provide the argument `REVISION` on the command line with a fully specified name;
            * leave the argument unspecified for it to be chosen automatically with a fully specified name;
            * provide the argument `--organization` on the command line;
            * set the property [project] or provide the argument [--project] on the command line, using a Cloud Platform project with an associated Apigee organization.
        override: |-
            Force the deployment of the new revision, overriding any currently deployed revision that would conflict with it.
            +
            If an existing API proxy revision is deployed, set this flag to ensure seamless deployment with zero downtime. In this case, the existing revision remains deployed until the new revision is fully deployed.
            +
            If unset, `{command}` will fail unless all conflicting API proxies are first undeployed from the environment. To do this, run `{parent_command} undeploy` on the conflicting deployment.
