name: import
description: '*(REMOVED)*  Import a domain from Google Domains registrar to Cloud Domains.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --labels=: List of label KEY=VALUE pairs to add.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |-
        *(REMOVED)*  Import a domain from Google Domains registrar to Cloud Domains.

        This command has been removed. See https://cloud.google.com/domains/docs/deprecations/feature-deprecations.

        Create a new Cloud Domains registration resource by importing an existing
        domain from Google Domains registrar.
        The new resource's ID will be equal to the domain name.

        After this command executes, a resource is created with state ACTIVE,
        indicating that the import was successful. Cloud Domains will automatically
        renew your domain as long as your Cloud Billing account is active. If this
        command fails, no resource is created.

        Other users may lose access to the domain and will need IAM permissions on the
        Cloud project containing the registration resource to regain access.

        ## EXAMPLES

        To import ``example.com'', run:

          $ gcloud domains registrations import example.com
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
