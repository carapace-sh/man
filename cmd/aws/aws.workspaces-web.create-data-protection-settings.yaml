name: create-data-protection-settings
description: Creates a data protection settings resource that can be associated with a web portal.
flags:
    --additional-encryption-context=: Additional encryption context of the data protection settings.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --customer-managed-key=: The custom managed key of the data protection settings.
    --description=: The description of the data protection settings.
    --display-name=: The display name of the data protection settings.
    --inline-redaction-configuration=: The inline redaction configuration of the data protection settings that will be applied to all sessions.
    --tags=: The tags to add to the data protection settings resource.
documentation:
    command: Creates a data protection settings resource that can be associated with a web portal.
    flag:
        additional-encryption-context: Additional encryption context of the data protection settings.
        client-token: |-
            A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. Idempotency ensures that an API request completes only once. With an idempotent request, if the original request completes successfully, subsequent retries with the same client token returns the result from the original successful request.

            If you do not specify a client token, one is automatically generated by the Amazon Web Services SDK.
        customer-managed-key: The custom managed key of the data protection settings.
        description: The description of the data protection settings.
        display-name: The display name of the data protection settings.
        inline-redaction-configuration: The inline redaction configuration of the data protection settings that will be applied to all sessions.
        tags: The tags to add to the data protection settings resource. A tag is a key-value pair.
