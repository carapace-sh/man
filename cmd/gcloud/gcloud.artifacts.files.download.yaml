name: download
description: Download an Artifact Registry file.
flags:
    --allow-overwrite: If specified, the command overwrites an existing file
    --destination=!: The path where you want to download the file.
    --local-filename=: If specified, the name of the downloaded file on the local system is set to the value you use for LOCAL_FILENAME.
    --location=: Location of the file.
    --no-allow-overwrite&: If specified, the command overwrites an existing file
    --parallelism=: Specifies the number of threads to use for downloading the file in parallel.
    --repository=: Repository of the file.
documentation:
    command: Downloads an Artifact Registry file based on file name.
    flag:
        allow-overwrite: If specified, the command overwrites an existing file
        destination: The path where you want to download the file.
        local-filename: If specified, the name of the downloaded file on the local system is set to the value you use for LOCAL_FILENAME. Otherwise the name of the downloaded file is based on the file name in the registry.
        location: |-
            Location of the file.
            +
            To set the `location` attribute:
            * provide the argument `file` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `artifacts/location`.
        no-allow-overwrite: If specified, the command overwrites an existing file
        parallelism: Specifies the number of threads to use for downloading the file in parallel.
        repository: |-
            Repository of the file.
            +
            To set the `repository` attribute:
            * provide the argument `file` on the command line with a fully specified name;
            * provide the argument `--repository` on the command line;
            * set the property `artifacts/repository`.
