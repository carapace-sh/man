name: delete-package
description: Deletes a package and all associated package versions.
flags:
    --domain-owner=: The 12-digit account number of the Amazon Web Services account that owns the domain.
    --domain=!: The name of the domain that contains the package to delete.
    --format=!: The format of the requested package to delete.
    --namespace=: The namespace of the package to delete.
    --package=!: The name of the package to delete.
    --repository=!: The name of the repository that contains the package to delete.
completion:
    flag:
        format:
            - npm
            - pypi
            - maven
            - nuget
            - generic
            - ruby
            - swift
            - cargo
documentation:
    command: Deletes a package and all associated package versions. A deleted package cannot be restored. To delete one or more package versions, use the [DeletePackageVersions](https://docs.aws.amazon.com/codeartifact/latest/APIReference/API_DeletePackageVersions.html) API.
    flag:
        domain: The name of the domain that contains the package to delete.
        domain-owner: The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces.
        format: The format of the requested package to delete.
        namespace: |-
            The namespace of the package to delete. The package component that specifies its namespace depends on its type. For example:

            The namespace is required when deleting packages of the following formats:

            - Maven
            - Swift
            - generic

            <!--THE END-->

            - The namespace of a Maven package version is its `groupId`.
            - The namespace of an npm or Swift package version is its `scope`.
            - The namespace of a generic package is its `namespace`.
            - Python, NuGet, Ruby, and Cargo package versions do not contain a corresponding component, package versions of those formats do not have a namespace.
        package: The name of the package to delete.
        repository: The name of the repository that contains the package to delete.
