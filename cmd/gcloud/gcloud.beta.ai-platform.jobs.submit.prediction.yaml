name: prediction
description: '*(BETA)*  Start an AI Platform batch prediction job.'
flags:
    --batch-size=: The number of records per batch.
    --data-format=!: Data format of the input files.
    --input-paths=!: Cloud Storage paths to the instances to run prediction on.
    --labels=: List of label KEY=VALUE pairs to add.
    --max-worker-count=: The maximum number of workers to be used for parallel processing.
    --model-dir=: Cloud Storage location where the model files are located.
    --model=: Name of the model to use for prediction.
    --output-path=!: Cloud Storage path to which to save the output.
    --region=!: The Compute Engine region to run the job in.
    --runtime-version=: AI Platform runtime version for this job.
    --signature-name=: Name of the signature defined in the SavedModel to use for
completion:
    flag:
        data-format:
            - text
            - tf-record
            - tf-record-gzip
documentation:
    command: '*(BETA)*  Start an AI Platform batch prediction job.'
    flag:
        batch-size: The number of records per batch. The service will buffer batch_size number of records in memory before invoking TensorFlow. Defaults to 64 if not specified.
        data-format: |-
            Data format of the input files. _DATA_FORMAT_ must be one of:
            +
            *text*::: Text and JSON files; for text files, see https://www.tensorflow.org/guide/datasets#consuming_text_data, for JSON files, see https://cloud.google.com/ai-platform/prediction/docs/overview#batch_prediction_input_data
            *tf-record*::: TFRecord files; see https://www.tensorflow.org/guide/datasets#consuming_tfrecord_data
            *tf-record-gzip*::: GZIP-compressed TFRecord files.
            :::
            +
        input-paths: |-
            Cloud Storage paths to the instances to run prediction on.
            +
            Wildcards (```*```) accepted at the *end* of a path. More than one path can be
            specified if multiple file patterns are needed. For example,
            +
              gs://my-bucket/instances*,gs://my-bucket/other-instances1
            +
            will match any objects whose names start with `instances` in `my-bucket` as well
            as the `other-instances1` bucket, while
            +
              gs://my-bucket/instance-dir/*
            +
            will match any objects in the `instance-dir` "directory" (since directories
            aren't a first-class Cloud Storage concept) of `my-bucket`.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        max-worker-count: The maximum number of workers to be used for parallel processing. Defaults to 10 if not specified.
        model: Name of the model to use for prediction.
        model-dir: Cloud Storage location where the model files are located.
        output-path: 'Cloud Storage path to which to save the output. Example: gs://my-bucket/output.'
        region: The Compute Engine region to run the job in.
        runtime-version: 'AI Platform runtime version for this job. Must be specified unless --master-image-uri is specified instead. It is defined in documentation along with the list of supported versions: https://cloud.google.com/ai-platform/prediction/docs/runtime-version-list'
        signature-name: |-
            Name of the signature defined in the SavedModel to use for
            this job. Defaults to DEFAULT_SERVING_SIGNATURE_DEF_KEY in
            https://www.tensorflow.org/api_docs/python/tf/compat/v1/saved_model/signature_constants,
            which is "serving_default". Only applies to TensorFlow models.
