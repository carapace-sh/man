name: delete-integration
description: Deletes the integration between CloudWatch Logs and OpenSearch Service.
flags:
    --force=: Specify `true` to force the deletion of the integration even if vended logs dashboards currently exist.
    --integration-name=!: The name of the integration to delete.
documentation:
    command: Deletes the integration between CloudWatch Logs and OpenSearch Service. If your integration has active vended logs dashboards, you must specify `true` for the `force` parameter, otherwise the operation will fail. If you delete the integration by setting `force` to `true`, all your vended logs dashboards powered by OpenSearch Service will be deleted and the data that was on them will no longer be accessible.
    flag:
        force: |-
            Specify `true` to force the deletion of the integration even if vended logs dashboards currently exist.

            The default is `false`.
        integration-name: The name of the integration to delete. To find the name of your integration, use [ListIntegrations](https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_ListIntegrations.html).
