name: create
description: '*(ALPHA)*  Creates a new Cloud DNS response policy.'
flags:
    --description=!: A description of the response policy.
    --gkeclusters=: The comma-separated list of GKE cluster names to associate with the response policy.
    --location=: Specifies the desired service location the request is sent to.
    --networks=: The comma-separated list of network names to associate with the response policy.
documentation:
    command: |-
        *(ALPHA)*  This command creates a new Cloud DNS response policy.

        ## EXAMPLES

        To create a new response policy with minimal arguments, run:

          $ gcloud alpha dns response-policies create myresponsepolicy --description='My new response policy.'
          --networks=''

        To create a new response policy with all optional arguments, run:

          $ gcloud alpha dns response-policies create myresponsepolicy --description='My new response policy.'
          --networks=network1,network2

        To create a new zonal response policy scoped to a GKE cluster in
          us-central1-a, run (alpha/beta):

          $ gcloud alpha dns response-policies create beta myresponsepolicy --description='My new response
          policy.'
          --gkeclusters=cluster1 --location=us-central1-a
    flag:
        description: A description of the response policy.
        gkeclusters: The comma-separated list of GKE cluster names to associate with the response policy.
        location: Specifies the desired service location the request is sent to. Defaults to Cloud DNS global service. Use --location=global if you want to target the global service.
        networks: The comma-separated list of network names to associate with the response policy.
