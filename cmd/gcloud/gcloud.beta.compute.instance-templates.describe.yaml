name: describe
description: '*(BETA)*  Describe a virtual machine instance template.'
flags:
    --global: If set, the instance template is global.
    --no-global&: If set, the instance template is global.
    --region=: Region of the instance template to describe.
    --view=: Specifies the information that the output should contain.
completion:
    flag:
        view:
            - BASIC
            - FULL
documentation:
    command: |
        *(BETA)*  *gcloud beta compute instance-templates describe* displays all data associated with a Google Compute
        Engine virtual machine instance template.
    flag:
        global: If set, the instance template is global.
        no-global: If set, the instance template is global.
        region: Region of the instance template to describe. Overrides the default *compute/region* property value for this command invocation.
        view: |-
            Specifies the information that the output should contain. _VIEW_ must be one of:
            +
            *BASIC*::: Default output view. Output contains all configuration details of the instance template, except partner metadata.
            *FULL*::: Output contains all configuration details of the instance template, including partner metadata.
            :::
            +
