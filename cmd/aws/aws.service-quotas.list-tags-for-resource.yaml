name: list-tags-for-resource
description: Returns a list of the tags assigned to the specified applied quota.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) for the applied quota for which you want to list tags.
documentation:
    command: Returns a list of the tags assigned to the specified applied quota.
    flag:
        resource-arn: The Amazon Resource Name (ARN) for the applied quota for which you want to list tags. You can get this information by using the Service Quotas console, or by listing the quotas using the [list-service-quotas](https://docs.aws.amazon.com/cli/latest/reference/service-quotas/list-service-quotas.html) CLI command or the [ListServiceQuotas](https://docs.aws.amazon.com/servicequotas/2019-06-24/apireference/API_ListServiceQuotas.html) Amazon Web Services API operation.
