name: create-api
description: Creates an Api resource.
flags:
    --api-key-selection-expression=: An API key selection expression.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cors-configuration=: A CORS configuration.
    --credentials-arn=: This property is part of quick create.
    --description=: The description of the API.
    --disable-execute-api-endpoint: Specifies whether clients can invoke your API by using the default execute-api endpoint.
    --disable-schema-validation: Avoid validating models when creating a deployment.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ip-address-type=: The IP address types that can invoke the API.
    --name=!: The name of the API.
    --no-disable-execute-api-endpoint: Specifies whether clients can invoke your API by using the default execute-api endpoint.
    --no-disable-schema-validation: Avoid validating models when creating a deployment.
    --protocol-type=!: The API protocol.
    --route-key=: This property is part of quick create.
    --route-selection-expression=: The route selection expression for the API.
    --tags=: The collection of tags.
    --target=: This property is part of quick create.
    --version=: A version identifier for the API.
completion:
    flag:
        ip-address-type:
            - ipv4
            - dualstack
        protocol-type:
            - WEBSOCKET
            - HTTP
documentation:
    command: Creates an Api resource.
    flag:
        api-key-selection-expression: An API key selection expression. Supported only for WebSocket APIs. See [API Key Selection Expressions](https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-websocket-api-selection-expressions.html#apigateway-websocket-api-apikey-selection-expressions).
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cors-configuration: A CORS configuration. Supported only for HTTP APIs. See [Configuring CORS](https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-cors.html) for more information.
        credentials-arn: This property is part of quick create. It specifies the credentials required for the integration, if any. For a Lambda integration, three options are available. To specify an IAM Role for API Gateway to assume, use the role's Amazon Resource Name (ARN). To require that the caller's identity be passed through from the request, specify arn:aws:iam::\*:user/\*. To use resource-based permissions on supported AWS services, specify null. Currently, this property is not used for HTTP integrations. Supported only for HTTP APIs.
        description: The description of the API.
        disable-execute-api-endpoint: Specifies whether clients can invoke your API by using the default execute-api endpoint. By default, clients can invoke your API with the default https://{api\_id}.execute-api.{region}.amazonaws.com endpoint. To require that clients use a custom domain name to invoke your API, disable the default endpoint.
        disable-schema-validation: Avoid validating models when creating a deployment. Supported only for WebSocket APIs.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ip-address-type: The IP address types that can invoke the API.
        name: The name of the API.
        protocol-type: The API protocol.
        route-key: This property is part of quick create. If you don't specify a routeKey, a default route of $default is created. The $default route acts as a catch-all for any request made to your API, for a particular stage. The $default route key can't be modified. You can add routes after creating the API, and you can update the route keys of additional routes. Supported only for HTTP APIs.
        route-selection-expression: The route selection expression for the API. For HTTP APIs, the routeSelectionExpression must be ${request.method} ${request.path}. If not provided, this will be the default for HTTP APIs. This property is required for WebSocket APIs.
        tags: The collection of tags. Each tag element is associated with a given resource.
        target: This property is part of quick create. Quick create produces an API with an integration, a default catch-all route, and a default stage which is configured to automatically deploy changes. For HTTP integrations, specify a fully qualified URL. For Lambda integrations, specify a function ARN. The type of the integration will be HTTP\_PROXY or AWS\_PROXY, respectively. Supported only for HTTP APIs.
        version: A version identifier for the API.
