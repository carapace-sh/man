name: describe-instance
description: '*(BETA)*  Describe an instance in a managed instance group.'
flags:
    --instance=!: Name of the managed instance to describe.
    --region=: Region of the managed instance group to describe an instance in.
    --zone=: Zone of the managed instance group to describe an instance in.
documentation:
    command: |
        *(BETA)*  *gcloud beta compute instance-groups managed describe-instance* describes an instance in a managed instance group, listing
        all its attributes in YAML format.
    flag:
        instance: Name of the managed instance to describe.
        region: |-
            Region of the managed instance group to describe an instance in. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            Overrides the default *compute/region* property value for this command invocation.
        zone: |-
            Zone of the managed instance group to describe an instance in. If not specified, you might be prompted to select a zone (interactive mode
            only).
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            Overrides the default *compute/zone* property value for this command invocation.
