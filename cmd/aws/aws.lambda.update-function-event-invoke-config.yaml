name: update-function-event-invoke-config
description: Updates the configuration for asynchronous invocation for a function, version, or alias.
flags:
    --destination-config=: A destination for events after they have been sent to a function for processing.
    --function-name=!: The name or ARN of the Lambda function, version, or alias.
    --maximum-event-age-in-seconds=: The maximum age of a request that Lambda sends to a function for processing.
    --maximum-retry-attempts=: The maximum number of times to retry when the function returns an error.
    --qualifier=: A version number or alias name.
documentation:
    command: |-
        Updates the configuration for asynchronous invocation for a function, version, or alias.

        To configure options for asynchronous invocation, use [PutFunctionEventInvokeConfig]().
    flag:
        destination-config: |-
            A destination for events after they have been sent to a function for processing.

            **Destinations**

            - **Function** - The Amazon Resource Name (ARN) of a Lambda function.
            - **Queue** - The ARN of a standard SQS queue.
            - **Bucket** - The ARN of an Amazon S3 bucket.
            - **Topic** - The ARN of a standard SNS topic.
            - **Event Bus** - The ARN of an Amazon EventBridge event bus.

            S3 buckets are supported only for on-failure destinations. To retain records of successful invocations, use another destination type.
        function-name: |-
            The name or ARN of the Lambda function, version, or alias.

            **Name formats**

            - **Function name** - `my-function` (name-only), `my-function:v1` (with alias).
            - **Function ARN** - `arn:aws:lambda:us-west-2:123456789012:function:my-function`.
            - **Partial ARN** - `123456789012:function:my-function`.

            You can append a version number or alias to any of the formats. The length constraint applies only to the full ARN. If you specify only the function name, it is limited to 64 characters in length.
        maximum-event-age-in-seconds: The maximum age of a request that Lambda sends to a function for processing.
        maximum-retry-attempts: The maximum number of times to retry when the function returns an error.
        qualifier: A version number or alias name.
