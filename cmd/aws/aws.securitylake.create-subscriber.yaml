name: create-subscriber
description: Creates a subscriber for accounts that are already enabled in Amazon Security Lake.
flags:
    --access-types=:
        description: The Amazon S3 or Lake Formation access type.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --sources=!:
        description: The supported Amazon Web Services services from which logs and events are collected.
        nargs: -1
    --subscriber-description=: The description for your subscriber account in Security Lake.
    --subscriber-identity=!: The Amazon Web Services identity used to access your data.
    --subscriber-name=!: The name of your Security Lake subscriber account.
    --tags=:
        description: An array of objects, one for each tag to associate with the subscriber.
        nargs: -1
documentation:
    command: Creates a subscriber for accounts that are already enabled in Amazon Security Lake. You can create a subscriber with access to data in the current Amazon Web Services Region.
    flag:
        access-types: The Amazon S3 or Lake Formation access type.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        sources: The supported Amazon Web Services services from which logs and events are collected. Security Lake supports log and event collection for natively supported Amazon Web Services services.
        subscriber-description: The description for your subscriber account in Security Lake.
        subscriber-identity: The Amazon Web Services identity used to access your data.
        subscriber-name: The name of your Security Lake subscriber account.
        tags: An array of objects, one for each tag to associate with the subscriber. For each tag, you must specify both a tag key and a tag value. A tag value cannot be null, but it can be an empty string.
