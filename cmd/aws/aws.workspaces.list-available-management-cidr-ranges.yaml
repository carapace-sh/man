name: list-available-management-cidr-ranges
description: Retrieves a list of IP address ranges, specified as IPv4 CIDR blocks, that you can use for the network management interface when you enable Bring Your Own License (BYOL).
flags:
    --management-cidr-range-constraint=!: The IP address range to search.
    --max-results=: The maximum number of items to return.
    --next-token=: If you received a `NextToken` from a previous call that was paginated, provide this token to receive the next set of results.
documentation:
    command: |-
        Retrieves a list of IP address ranges, specified as IPv4 CIDR blocks, that you can use for the network management interface when you enable Bring Your Own License (BYOL).

        This operation can be run only by Amazon Web Services accounts that are enabled for BYOL. If your account isn't enabled for BYOL, you'll receive an `AccessDeniedException` error.

        The management network interface is connected to a secure Amazon WorkSpaces management network. It is used for interactive streaming of the WorkSpace desktop to Amazon WorkSpaces clients, and to allow Amazon WorkSpaces to manage the WorkSpace.
    flag:
        management-cidr-range-constraint: The IP address range to search. Specify an IP address range that is compatible with your network and in CIDR notation (that is, specify the range as an IPv4 CIDR block).
        max-results: The maximum number of items to return.
        next-token: If you received a `NextToken` from a previous call that was paginated, provide this token to receive the next set of results.
