name: request-phone-number
description: Request an origination phone number for use in your account.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --deletion-protection-enabled: By default this is set to false.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --international-sending-enabled: By default this is set to false.
    --iso-country-code=!: The two-character code, in ISO 3166-1 alpha-2 format, for the country or region.
    --message-type=!: The type of message.
    --no-deletion-protection-enabled: By default this is set to false.
    --no-international-sending-enabled: By default this is set to false.
    --number-capabilities=!: Indicates if the phone number will be used for text messages, voice messages, or both.
    --number-type=!: The type of phone number to request.
    --opt-out-list-name=: The name of the OptOutList to associate with the phone number.
    --pool-id=: The pool to associated with the phone number.
    --registration-id=: Use this field to attach your phone number for an external registration process.
    --tags=: An array of tags (key and value pairs) to associate with the requested phone number.
completion:
    flag:
        message-type:
            - TRANSACTIONAL
            - PROMOTIONAL
        number-type:
            - LONG_CODE
            - TOLL_FREE
            - TEN_DLC
            - SIMULATOR
documentation:
    command: Request an origination phone number for use in your account. For more information on phone number request see [Request a phone number](https://docs.aws.amazon.com/sms-voice/latest/userguide/phone-numbers-request.html) in the *End User MessagingSMS User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If you don't specify a client token, a randomly generated token is used for the request to ensure idempotency.
        deletion-protection-enabled: By default this is set to false. When set to true the phone number can't be deleted.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        international-sending-enabled: By default this is set to false. When set to true the international sending of phone number is Enabled.
        iso-country-code: The two-character code, in ISO 3166-1 alpha-2 format, for the country or region.
        message-type: The type of message. Valid values are `TRANSACTIONAL` for messages that are critical or time-sensitive and `PROMOTIONAL` for messages that aren't critical or time-sensitive.
        number-capabilities: Indicates if the phone number will be used for text messages, voice messages, or both.
        number-type: |-
            The type of phone number to request.

            When you request a `SIMULATOR` phone number, you must set **MessageType** as `TRANSACTIONAL`.
        opt-out-list-name: |-
            The name of the OptOutList to associate with the phone number. You can use the OptOutListName or OptOutListArn.

            If you are using a shared End User MessagingSMS resource then you must use the full Amazon Resource Name(ARN).
        pool-id: |-
            The pool to associated with the phone number. You can use the PoolId or PoolArn.

            If you are using a shared End User MessagingSMS resource then you must use the full Amazon Resource Name(ARN).
        registration-id: Use this field to attach your phone number for an external registration process.
        tags: An array of tags (key and value pairs) to associate with the requested phone number.
