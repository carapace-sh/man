name: describe-sessions
description: Retrieves a list of all active sessions (both connected and disconnected) or terminated sessions from the past 30 days.
flags:
    --filters=: One or more filters to limit the type of sessions returned by the request.
    --max-results=: The maximum number of items to return for this call.
    --next-token=: The token for the next set of items to return.
    --state=!: The session status to retrieve a list of sessions for.
completion:
    flag:
        state:
            - Active
            - History
documentation:
    command: Retrieves a list of all active sessions (both connected and disconnected) or terminated sessions from the past 30 days.
    flag:
        filters: One or more filters to limit the type of sessions returned by the request.
        max-results: The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
        state: The session status to retrieve a list of sessions for. For example, "Active".
