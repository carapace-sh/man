name: list-services-for-auto-scaling-configuration
description: Returns a list of the associated App Runner services using an auto scaling configuration.
flags:
    --auto-scaling-configuration-arn=!: The Amazon Resource Name (ARN) of the App Runner auto scaling configuration that you want to list the services for.
    --max-results=: The maximum number of results to include in each response (result page).
    --next-token=: A token from a previous result page.
documentation:
    command: Returns a list of the associated App Runner services using an auto scaling configuration.
    flag:
        auto-scaling-configuration-arn: |-
            The Amazon Resource Name (ARN) of the App Runner auto scaling configuration that you want to list the services for.

            The ARN can be a full auto scaling configuration ARN, or a partial ARN ending with either `.../name` or `.../name/revision`. If a revision isn't specified, the latest active revision is used.
        max-results: |-
            The maximum number of results to include in each response (result page). It's used for a paginated request.

            If you don't specify `MaxResults`, the request retrieves all available results in a single response.
        next-token: |-
            A token from a previous result page. It's used for a paginated request. The request retrieves the next result page. All other parameter values must be identical to the ones specified in the initial request.

            If you don't specify `NextToken`, the request retrieves the first result page.
