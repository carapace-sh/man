name: create-load-balancer
description: Creates an Application Load Balancer, Network Load Balancer, or Gateway Load Balancer.
flags:
    --customer-owned-ipv4-pool=: \[Application Load Balancers on Outposts] The ID of the customer-owned address pool (CoIP pool).
    --enable-prefix-for-ipv6-source-nat=: \[Network Load Balancers with UDP listeners] Indicates whether to use an IPv6 prefix from each subnet for source NAT.
    --ip-address-type=: The IP address type.
    --ipam-pools=: \[Application Load Balancers] The IPAM pools to use with the load balancer.
    --name=!: The name of the load balancer.
    --scheme=: The nodes of an Internet-facing load balancer have public IP addresses.
    --security-groups=: \[Application Load Balancers and Network Load Balancers] The IDs of the security groups for the load balancer.
    --subnet-mappings=: The IDs of the subnets.
    --subnets=: The IDs of the subnets.
    --tags=: The tags to assign to the load balancer.
    --type=: The type of load balancer.
completion:
    flag:
        enable-prefix-for-ipv6-source-nat:
            - "on"
            - "off"
        ip-address-type:
            - ipv4
            - dualstack
            - dualstack-without-public-ipv4
        scheme:
            - internet-facing
            - internal
        type:
            - application
            - network
            - gateway
documentation:
    command: |-
        Creates an Application Load Balancer, Network Load Balancer, or Gateway Load Balancer.

        For more information, see the following:

        - [Application Load Balancers](https://docs.aws.amazon.com/elasticloadbalancing/latest/application/application-load-balancers.html)
        - [Network Load Balancers](https://docs.aws.amazon.com/elasticloadbalancing/latest/network/network-load-balancers.html)
        - [Gateway Load Balancers](https://docs.aws.amazon.com/elasticloadbalancing/latest/gateway/gateway-load-balancers.html)

        This operation is idempotent, which means that it completes at most one time. If you attempt to create multiple load balancers with the same settings, each call succeeds.
    flag:
        customer-owned-ipv4-pool: \[Application Load Balancers on Outposts] The ID of the customer-owned address pool (CoIP pool).
        enable-prefix-for-ipv6-source-nat: \[Network Load Balancers with UDP listeners] Indicates whether to use an IPv6 prefix from each subnet for source NAT. The IP address type must be `dualstack`. The default value is `off`.
        ip-address-type: |-
            The IP address type. Internal load balancers must use `ipv4`.

            \[Application Load Balancers] The possible values are `ipv4` (IPv4 addresses), `dualstack` (IPv4 and IPv6 addresses), and `dualstack-without-public-ipv4` (public IPv6 addresses and private IPv4 and IPv6 addresses).

            \[Network Load Balancers and Gateway Load Balancers] The possible values are `ipv4` (IPv4 addresses) and `dualstack` (IPv4 and IPv6 addresses).
        ipam-pools: \[Application Load Balancers] The IPAM pools to use with the load balancer.
        name: |-
            The name of the load balancer.

            This name must be unique per region per account, can have a maximum of 32 characters, must contain only alphanumeric characters or hyphens, must not begin or end with a hyphen, and must not begin with "internal-".
        scheme: |-
            The nodes of an Internet-facing load balancer have public IP addresses. The DNS name of an Internet-facing load balancer is publicly resolvable to the public IP addresses of the nodes. Therefore, Internet-facing load balancers can route requests from clients over the internet.

            The nodes of an internal load balancer have only private IP addresses. The DNS name of an internal load balancer is publicly resolvable to the private IP addresses of the nodes. Therefore, internal load balancers can route requests only from clients with access to the VPC for the load balancer.

            The default is an Internet-facing load balancer.

            You can't specify a scheme for a Gateway Load Balancer.
        security-groups: \[Application Load Balancers and Network Load Balancers] The IDs of the security groups for the load balancer.
        subnet-mappings: |-
            The IDs of the subnets. You can specify only one subnet per Availability Zone. You must specify either subnets or subnet mappings, but not both.

            \[Application Load Balancers] You must specify subnets from at least two Availability Zones. You can't specify Elastic IP addresses for your subnets.

            \[Application Load Balancers on Outposts] You must specify one Outpost subnet.

            \[Application Load Balancers on Local Zones] You can specify subnets from one or more Local Zones.

            \[Network Load Balancers] You can specify subnets from one or more Availability Zones. You can specify one Elastic IP address per subnet if you need static IP addresses for your internet-facing load balancer. For internal load balancers, you can specify one private IP address per subnet from the IPv4 range of the subnet. For internet-facing load balancer, you can specify one IPv6 address per subnet.

            \[Gateway Load Balancers] You can specify subnets from one or more Availability Zones. You can't specify Elastic IP addresses for your subnets.
        subnets: |-
            The IDs of the subnets. You can specify only one subnet per Availability Zone. You must specify either subnets or subnet mappings, but not both. To specify an Elastic IP address, specify subnet mappings instead of subnets.

            \[Application Load Balancers] You must specify subnets from at least two Availability Zones.

            \[Application Load Balancers on Outposts] You must specify one Outpost subnet.

            \[Application Load Balancers on Local Zones] You can specify subnets from one or more Local Zones.

            \[Network Load Balancers and Gateway Load Balancers] You can specify subnets from one or more Availability Zones.
        tags: The tags to assign to the load balancer.
        type: The type of load balancer. The default is `application`.
