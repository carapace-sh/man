name: get-vectors
description: Amazon S3 Vectors is in preview release for Amazon S3 and is subject to change.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --index-arn=: The ARN of the vector index.
    --index-name=: The name of the vector index.
    --keys=!:
        description: The names of the vectors you want to return attributes for.
        nargs: -1
    --no-return-data: Indicates whether to include the vector data in the response.
    --no-return-metadata: Indicates whether to include metadata in the response.
    --return-data: Indicates whether to include the vector data in the response.
    --return-metadata: Indicates whether to include metadata in the response.
    --vector-bucket-name=: The name of the vector bucket that contains the vector index.
documentation:
    command: |-
        Amazon S3 Vectors is in preview release for Amazon S3 and is subject to change.

        Returns vector attributes. To specify the vector index, you can either use both the vector bucket name and the vector index name, or use the vector index Amazon Resource Name (ARN).

        Permissions

        You must have the `s3vectors:GetVectors` permission to use this operation.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        index-arn: The ARN of the vector index.
        index-name: The name of the vector index.
        keys: The names of the vectors you want to return attributes for.
        return-data: Indicates whether to include the vector data in the response. The default value is `false`.
        return-metadata: Indicates whether to include metadata in the response. The default value is `false`.
        vector-bucket-name: The name of the vector bucket that contains the vector index.
