name: delete
description: Deletes a service from Google Service Management.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |-
        Services that are deleted will be retained in the system for 30 days.
        If a deleted service is still within this retention window, it can be
        undeleted with the undelete command.

        ## EXAMPLES
        To delete a service named `my-service`, run:

          $ gcloud endpoints services delete my-service

        To run the same command asynchronously (non-blocking), run:

          $ gcloud endpoints services delete my-service --async
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
