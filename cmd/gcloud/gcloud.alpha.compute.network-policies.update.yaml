name: update
description: '*(ALPHA)*  Update a Compute Engine network policy.'
flags:
    --description=: An optional, textual description for the network policy.
    --region=: Region of the network policy to update.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute network-policies update* is used to update network policies. A network
        policy is a set of rules that classifies network traffic.
    flag:
        description: An optional, textual description for the network policy.
        region: Region of the network policy to update. Overrides the default *compute/region* property value for this command invocation.
