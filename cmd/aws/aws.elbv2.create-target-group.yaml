    flag:
        health-check-protocol:
            - HTTP
            - HTTPS
            - TCP
            - TLS
            - UDP
            - TCP_UDP
            - GENEVE
            - QUIC
            - TCP_QUIC
        ip-address-type:
            - ipv4
            - ipv6
        protocol:
            - HTTP
            - HTTPS
            - TCP
