name: list-conformance-pack-compliance-scores
description: Returns a list of conformance pack compliance scores.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --filters=: Filters the results based on the `ConformancePackComplianceScoresFilters`.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --limit=: The maximum number of conformance pack compliance scores returned on each page.
    --next-token=: The `nextToken` string in a prior request that you can use to get the paginated response for the next set of conformance pack compliance scores.
    --sort-by=: Sorts your conformance pack compliance scores in either ascending or descending order, depending on `SortOrder`.
    --sort-order=: Determines the order in which conformance pack compliance scores are sorted.
completion:
    flag:
        sort-by:
            - SCORE
        sort-order:
            - ASCENDING
            - DESCENDING
documentation:
    command: |-
        Returns a list of conformance pack compliance scores. A compliance score is the percentage of the number of compliant rule-resource combinations in a conformance pack compared to the number of total possible rule-resource combinations in the conformance pack. This metric provides you with a high-level view of the compliance state of your conformance packs. You can use it to identify, investigate, and understand the level of compliance in your conformance packs.

        Conformance packs with no evaluation results will have a compliance score of `INSUFFICIENT_DATA`.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        filters: Filters the results based on the `ConformancePackComplianceScoresFilters`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        limit: The maximum number of conformance pack compliance scores returned on each page.
        next-token: The `nextToken` string in a prior request that you can use to get the paginated response for the next set of conformance pack compliance scores.
        sort-by: |-
            Sorts your conformance pack compliance scores in either ascending or descending order, depending on `SortOrder`.

            By default, conformance pack compliance scores are sorted in alphabetical order by name of the conformance pack. Enter `SCORE`, to sort conformance pack compliance scores by the numerical value of the compliance score.
        sort-order: |-
            Determines the order in which conformance pack compliance scores are sorted. Either in ascending or descending order.

            By default, conformance pack compliance scores are sorted in alphabetical order by name of the conformance pack. Conformance pack compliance scores are sorted in reverse alphabetical order if you enter `DESCENDING`.

            You can sort conformance pack compliance scores by the numerical value of the compliance score by entering `SCORE` in the `SortBy` action. When compliance scores are sorted by `SCORE`, conformance packs with a compliance score of `INSUFFICIENT_DATA` will be last when sorting by ascending order and first when sorting by descending order.
