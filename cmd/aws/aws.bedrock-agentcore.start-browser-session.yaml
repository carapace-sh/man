name: start-browser-session
description: Creates and initializes a browser session in Amazon Bedrock.
flags:
    --browser-identifier=!: The unique identifier of the browser to use for this session.
    --client-token=: A unique, case-sensitive identifier to ensure that the API request completes no more than one time.
    --name=: The name of the browser session.
    --session-timeout-seconds=: The time in seconds after which the session automatically terminates if there is no activity.
    --trace-id=: The trace identifier for request tracking.
    --trace-parent=: The parent trace information for distributed tracing.
    --view-port=: The dimensions of the browser viewport for this session.
documentation:
    command: |-
        Creates and initializes a browser session in Amazon Bedrock. The session enables agents to navigate and interact with web content, extract information from websites, and perform web-based tasks as part of their response generation.

        To create a session, you must specify a browser identifier and a name. You can also configure the viewport dimensions to control the visible area of web content. The session remains active until it times out or you explicitly stop it using the `StopBrowserSession` operation.

        The following operations are related to `StartBrowserSession`:

        - [GetBrowserSession](https://docs.aws.amazon.com/API_GetBrowserSession.html)
        - [UpdateBrowserStream](https://docs.aws.amazon.com/API_UpdateBrowserStream.html)
        - [StopBrowserSession](https://docs.aws.amazon.com/API_StopBrowserSession.html)
    flag:
        browser-identifier: The unique identifier of the browser to use for this session. This identifier specifies which browser environment to initialize for the session.
        client-token: A unique, case-sensitive identifier to ensure that the API request completes no more than one time. If this token matches a previous request, Amazon Bedrock ignores the request, but does not return an error. This parameter helps prevent the creation of duplicate sessions if there are temporary network issues.
        name: The name of the browser session. This name helps you identify and manage the session. The name does not need to be unique.
        session-timeout-seconds: The time in seconds after which the session automatically terminates if there is no activity. The default value is 3600 seconds (1 hour). The minimum allowed value is 60 seconds, and the maximum allowed value is 28800 seconds (8 hours).
        trace-id: The trace identifier for request tracking.
        trace-parent: The parent trace information for distributed tracing.
        view-port: The dimensions of the browser viewport for this session. This determines the visible area of the web content and affects how web pages are rendered. If not specified, Amazon Bedrock uses a default viewport size.
