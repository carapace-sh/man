name: describe-directory-configs
description: Retrieves a list that describes one or more specified Directory Config objects for AppStream 2.0, if the names for these objects are provided.
flags:
    --directory-names=: The directory names.
    --max-results=: The maximum size of each page of results.
    --next-token=: The pagination token to use to retrieve the next page of results for this operation.
documentation:
    command: |-
        Retrieves a list that describes one or more specified Directory Config objects for AppStream 2.0, if the names for these objects are provided. Otherwise, all Directory Config objects in the account are described. These objects include the configuration information required to join fleets and image builders to Microsoft Active Directory domains.

        Although the response syntax in this topic includes the account password, this password is not returned in the actual response.
    flag:
        directory-names: The directory names.
        max-results: The maximum size of each page of results.
        next-token: The pagination token to use to retrieve the next page of results for this operation. If this value is null, it retrieves the first page.
