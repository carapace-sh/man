name: snap-to-roads
description: '`SnapToRoads` matches GPS trace to roads most likely traveled on.'
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --key=: 'Optional: The API key to be used for authorization.'
    --snap-radius=: The radius around the provided tracepoint that is considered for snapping.
    --snapped-geometry-format=: Chooses what the returned SnappedGeometry format should be.
    --trace-points=!:
        description: List of trace points to be snapped onto the road network.
        nargs: -1
    --travel-mode-options=: Travel mode related options for the provided travel mode.
    --travel-mode=: Specifies the mode of transport when calculating a route.
completion:
    flag:
        snapped-geometry-format:
            - FlexiblePolyline
            - Simple
        travel-mode:
            - Car
            - Pedestrian
            - Scooter
            - Truck
documentation:
    command: '`SnapToRoads` matches GPS trace to roads most likely traveled on.'
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        key: 'Optional: The API key to be used for authorization. Either an API key or valid SigV4 signature must be provided when making a request.'
        snap-radius: |-
            The radius around the provided tracepoint that is considered for snapping.

            **Unit**: `meters`

            Default value: `300`
        snapped-geometry-format: |-
            Chooses what the returned SnappedGeometry format should be.

            Default Value: `FlexiblePolyline`
        trace-points: List of trace points to be snapped onto the road network.
        travel-mode: |-
            Specifies the mode of transport when calculating a route. Used in estimating the speed of travel and road compatibility.

            Default Value: `Car`
        travel-mode-options: Travel mode related options for the provided travel mode.
