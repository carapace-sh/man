name: create-document
description: Creates a Amazon Web Services Systems Manager (SSM document).
flags:
    --attachments=:
        description: A list of key-value pairs that describe attachments to a version of a document.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --content=!: The content for the new SSM document in JSON or YAML format.
    --display-name=: An optional field where you can specify a friendly name for the SSM document.
    --document-format=: Specify the document format for the request.
    --document-type=: The type of document to create.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: A name for the SSM document.
    --requires=:
        description: A list of SSM documents required by a document.
        nargs: -1
    --tags=:
        description: Optional metadata that you assign to a resource.
        nargs: -1
    --target-type=: Specify a target type to define the kinds of resources the document can run on.
    --version-name=: An optional field specifying the version of the artifact you are creating with the document.
completion:
    flag:
        document-format:
            - YAML
            - JSON
            - TEXT
        document-type:
            - Command
            - Policy
            - Automation
            - Session
            - Package
            - ApplicationConfiguration
            - ApplicationConfigurationSchema
            - DeploymentStrategy
            - ChangeCalendar
            - Automation.ChangeTemplate
            - ProblemAnalysis
            - ProblemAnalysisTemplate
            - CloudFormation
            - ConformancePackTemplate
            - QuickSetup
            - ManualApprovalPolicy
            - AutoApprovalPolicy
documentation:
    command: Creates a Amazon Web Services Systems Manager (SSM document). An SSM document defines the actions that Systems Manager performs on your managed nodes. For more information about SSM documents, including information about supported schemas, features, and syntax, see [Amazon Web Services Systems Manager Documents](https://docs.aws.amazon.com/systems-manager/latest/userguide/documents.html) in the *Amazon Web Services Systems Manager User Guide*.
    flag:
        attachments: A list of key-value pairs that describe attachments to a version of a document.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        content: |-
            The content for the new SSM document in JSON or YAML format. The content of the document must not exceed 64KB. This quota also includes the content specified for input parameters at runtime. We recommend storing the contents for your new document in an external JSON or YAML file and referencing the file in a command.

            For examples, see the following topics in the *Amazon Web Services Systems Manager User Guide*.

            - [Create an SSM document (console)](https://docs.aws.amazon.com/systems-manager/latest/userguide/documents-using.html#create-ssm-console)
            - [Create an SSM document (command line)](https://docs.aws.amazon.com/systems-manager/latest/userguide/documents-using.html#create-ssm-document-cli)
            - [Create an SSM document (API)](https://docs.aws.amazon.com/systems-manager/latest/userguide/documents-using.html#create-ssm-document-api)
        display-name: An optional field where you can specify a friendly name for the SSM document. This value can differ for each version of the document. You can update this value at a later time using the [UpdateDocument]() operation.
        document-format: Specify the document format for the request. The document format can be JSON, YAML, or TEXT. JSON is the default format.
        document-type: |-
            The type of document to create.

            The `DeploymentStrategy` document type is an internal-use-only document type reserved for AppConfig.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: |-
            A name for the SSM document.

            You can't use the following strings as document name prefixes. These are reserved by Amazon Web Services for use as document name prefixes:

            - `aws`
            - `amazon`
            - `amzn`
            - `AWSEC2`
            - `AWSConfigRemediation`
            - `AWSSupport`
        requires: A list of SSM documents required by a document. This parameter is used exclusively by AppConfig. When a user creates an AppConfig configuration in an SSM document, the user must also specify a required document for validation purposes. In this case, an `ApplicationConfiguration` document requires an `ApplicationConfigurationSchema` document for validation purposes. For more information, see [What is AppConfig?](https://docs.aws.amazon.com/appconfig/latest/userguide/what-is-appconfig.html) in the *AppConfig User Guide*.
        tags: |-
            Optional metadata that you assign to a resource. Tags enable you to categorize a resource in different ways, such as by purpose, owner, or environment. For example, you might want to tag an SSM document to identify the types of targets or the environment where it will run. In this case, you could specify the following key-value pairs:

            - `Key=OS,Value=Windows`
            - `Key=Environment,Value=Production`

            To add tags to an existing SSM document, use the [AddTagsToResource]() operation.
        target-type: 'Specify a target type to define the kinds of resources the document can run on. For example, to run a document on EC2 instances, specify the following value: `/AWS::EC2::Instance`. If you specify a value of ''/'' the document can run on all types of resources. If you don''t specify a value, the document can''t run on any resources. For a list of valid resource types, see [Amazon Web Services resource and property types reference](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-template-resource-type-ref.html) in the *CloudFormation User Guide*.'
        version-name: An optional field specifying the version of the artifact you are creating with the document. For example, `Release12.1`. This value is unique across all versions of a document, and can't be changed.
