name: delete-monitor
description: Deletes a monitor resource.
flags:
    --monitor-arn=!: The Amazon Resource Name (ARN) of the monitor resource to delete.
documentation:
    command: Deletes a monitor resource. You can only delete a monitor resource with a status of `ACTIVE`, `ACTIVE_STOPPED`, `CREATE_FAILED`, or `CREATE_STOPPED`.
    flag:
        monitor-arn: The Amazon Resource Name (ARN) of the monitor resource to delete.
