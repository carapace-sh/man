name: get-vocabulary
description: Provides information about the specified custom vocabulary.
flags:
    --vocabulary-name=!: The name of the custom vocabulary you want information about.
documentation:
    command: |-
        Provides information about the specified custom vocabulary.

        To view the status of the specified custom vocabulary, check the `VocabularyState` field. If the status is `READY`, your custom vocabulary is available to use. If the status is `FAILED`, `FailureReason` provides details on why your custom vocabulary failed.

        To get a list of your custom vocabularies, use the operation.
    flag:
        vocabulary-name: The name of the custom vocabulary you want information about. Custom vocabulary names are case sensitive.
