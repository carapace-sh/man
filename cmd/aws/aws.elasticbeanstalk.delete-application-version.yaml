name: delete-application-version
description: Deletes the specified version from the specified application.
flags:
    --application-name=!: The name of the application to which the version belongs.
    --delete-source-bundle=: Set to `true` to delete the source bundle from your storage bucket.
    --version-label=!: The label of the version to delete.
documentation:
    command: |-
        Deletes the specified version from the specified application.

        You cannot delete an application version that is associated with a running environment.
    flag:
        application-name: The name of the application to which the version belongs.
        delete-source-bundle: Set to `true` to delete the source bundle from your storage bucket. Otherwise, the application version is deleted only from Elastic Beanstalk and the source bundle remains in Amazon S3.
        version-label: The label of the version to delete.
