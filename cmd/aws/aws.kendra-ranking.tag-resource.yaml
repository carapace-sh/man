name: tag-resource
description: Adds a specified tag to a specified rescore execution plan.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the rescore execution plan to tag.
    --tags=!: A list of tag keys to add to a rescore execution plan.
documentation:
    command: Adds a specified tag to a specified rescore execution plan. A rescore execution plan is an Amazon Kendra Intelligent Ranking resource used for provisioning the `Rescore` API. If the tag already exists, the existing value is replaced with the new value.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the rescore execution plan to tag.
        tags: A list of tag keys to add to a rescore execution plan. If a tag already exists, the existing value is replaced with the new value.
