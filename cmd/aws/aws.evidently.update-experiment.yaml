name: update-experiment
description: Updates an Evidently experiment.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: An optional description of the experiment.
    --experiment=!: The name of the experiment to update.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --metric-goals=: An array of structures that defines the metrics used for the experiment, and whether a higher or lower value for each metric is the goal.
    --no-remove-segment: Removes a segment from being used in an experiment.
    --online-ab-config=: A structure that contains the configuration of which variation o use as the "control" version.
    --project=!: The name or ARN of the project that contains the experiment that you want to update.
    --randomization-salt=: When Evidently assigns a particular user session to an experiment, it must use a randomization ID to determine which variation the user session is served.
    --remove-segment: Removes a segment from being used in an experiment.
    --sampling-rate=: The portion of the available audience that you want to allocate to this experiment, in thousandths of a percent.
    --segment=: Adds an audience *segment* to an experiment.
    --treatments=: An array of structures that define the variations being tested in the experiment.
documentation:
    command: |-
        Updates an Evidently experiment.

        Don't use this operation to update an experiment's tag. Instead, use [TagResource](https://docs.aws.amazon.com/cloudwatchevidently/latest/APIReference/API_TagResource.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: An optional description of the experiment.
        experiment: The name of the experiment to update.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        metric-goals: An array of structures that defines the metrics used for the experiment, and whether a higher or lower value for each metric is the goal.
        online-ab-config: A structure that contains the configuration of which variation o use as the "control" version. The "control" version is used for comparison with other variations. This structure also specifies how much experiment traffic is allocated to each variation.
        project: The name or ARN of the project that contains the experiment that you want to update.
        randomization-salt: When Evidently assigns a particular user session to an experiment, it must use a randomization ID to determine which variation the user session is served. This randomization ID is a combination of the entity ID and `randomizationSalt`. If you omit `randomizationSalt`, Evidently uses the experiment name as the `randomizationSalt`.
        remove-segment: Removes a segment from being used in an experiment. You can't use this parameter if the experiment is currently running.
        sampling-rate: |-
            The portion of the available audience that you want to allocate to this experiment, in thousandths of a percent. The available audience is the total audience minus the audience that you have allocated to overrides or current launches of this feature.

            This is represented in thousandths of a percent. For example, specify 20,000 to allocate 20% of the available audience.
        segment: Adds an audience *segment* to an experiment. When a segment is used in an experiment, only user sessions that match the segment pattern are used in the experiment. You can't use this parameter if the experiment is currently running.
        treatments: An array of structures that define the variations being tested in the experiment.
