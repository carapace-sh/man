name: describe-volumes
description: Describes the specified EBS volumes or all of your EBS volumes.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: The filters.
    --max-results=: The maximum number of items to return for this request.
    --next-token=: The token returned from a previous paginated request.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --volume-ids=: The volume IDs.
documentation:
    command: |-
        Describes the specified EBS volumes or all of your EBS volumes.

        If you are describing a long list of volumes, we recommend that you paginate the output to make the list more manageable. For more information, see [Pagination](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Query-Requests.html#api-pagination).

        For more information about EBS volumes, see [Amazon EBS volumes](https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volumes.html) in the *Amazon EBS User Guide*.

        We strongly recommend using only paginated requests. Unpaginated requests are susceptible to throttling and timeouts.

        The order of the elements in the response, including those within nested structures, might vary. Applications should not assume the elements appear in a particular order.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            The filters.

            - `attachment.attach-time` - The time stamp when the attachment initiated.
            - `attachment.delete-on-termination` - Whether the volume is deleted on instance termination.
            - `attachment.device` - The device name specified in the block device mapping (for example, `/dev/sda1`).
            - `attachment.instance-id` - The ID of the instance the volume is attached to.
            - `attachment.status` - The attachment state (`attaching` | `attached` | `detaching`).
            - `availability-zone` - The Availability Zone in which the volume was created.
            - `availability-zone-id` - The ID of the Availability Zone in which the volume was created.
            - `create-time` - The time stamp when the volume was created.
            - `encrypted` - Indicates whether the volume is encrypted (`true` | `false`)
            - `fast-restored` - Indicates whether the volume was created from a snapshot that is enabled for fast snapshot restore (`true` | `false`).
            - `multi-attach-enabled` - Indicates whether the volume is enabled for Multi-Attach (`true` | `false`)
            - `operator.managed` - A Boolean that indicates whether this is a managed volume.
            - `operator.principal` - The principal that manages the volume. Only valid for managed volumes, where `managed` is `true`.
            - `size` - The size of the volume, in GiB.
            - `snapshot-id` - The snapshot from which the volume was created.
            - `status` - The state of the volume (`creating` | `available` | `in-use` | `deleting` | `deleted` | `error`).
            - `tag`:&lt;key&gt; - The key/value combination of a tag assigned to the resource. Use the tag key in the filter name and the tag value as the filter value. For example, to find all resources that have a tag with the key `Owner` and the value `TeamA`, specify `tag:Owner` for the filter name and `TeamA` for the filter value.
            - `tag-key` - The key of a tag assigned to the resource. Use this filter to find all resources assigned a tag with a specific key, regardless of the tag value.
            - `volume-id` - The volume ID.
            - `volume-type` - The Amazon EBS volume type (`gp2` | `gp3` | `io1` | `io2` | `st1` | `sc1`| `standard`)
        max-results: The maximum number of items to return for this request. To get the next page of items, make another request with the token returned in the output. For more information, see [Pagination](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Query-Requests.html#api-pagination).
        next-token: The token returned from a previous paginated request. Pagination continues from the end of the items returned by the previous request.
        volume-ids: The volume IDs. If not specified, then all volumes are included in the response.
