name: delete
description: '*(BETA)*  Delete routes.'
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute routes delete* deletes one or more Compute Engine routes.

        ## EXAMPLES

        To delete a route with the name 'route-name', run:

          $ gcloud beta compute routes delete route-name

        To delete two routes with the names 'route-name1' and 'route-name2',
        run:

          $ gcloud beta compute routes delete route-name1 route-name2
