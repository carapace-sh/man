name: get-device-pool-compatibility
description: Gets information about compatibility with a device pool.
flags:
    --app-arn=: The ARN of the app that is associated with the specified device pool.
    --configuration=: An object that contains information about the settings for a run.
    --device-pool-arn=!: The device pool's ARN.
    --project-arn=: The ARN of the project for which you want to check device pool compatibility.
    --test-type=: The test type for the specified device pool.
    --test=: Information about the uploaded test to be run against the device pool.
completion:
    flag:
        test-type:
            - BUILTIN_FUZZ
            - APPIUM_JAVA_JUNIT
            - APPIUM_JAVA_TESTNG
            - APPIUM_PYTHON
            - APPIUM_NODE
            - APPIUM_RUBY
            - APPIUM_WEB_JAVA_JUNIT
            - APPIUM_WEB_JAVA_TESTNG
            - APPIUM_WEB_PYTHON
            - APPIUM_WEB_NODE
            - APPIUM_WEB_RUBY
            - INSTRUMENTATION
            - XCTEST
            - XCTEST_UI
documentation:
    command: Gets information about compatibility with a device pool.
    flag:
        app-arn: The ARN of the app that is associated with the specified device pool.
        configuration: An object that contains information about the settings for a run.
        device-pool-arn: The device pool's ARN.
        project-arn: The ARN of the project for which you want to check device pool compatibility.
        test: Information about the uploaded test to be run against the device pool.
        test-type: |-
            The test type for the specified device pool.

            Allowed values include the following:

            - BUILTIN\_FUZZ.
            - APPIUM\_JAVA\_JUNIT.
            - APPIUM\_JAVA\_TESTNG.
            - APPIUM\_PYTHON.
            - APPIUM\_NODE.
            - APPIUM\_RUBY.
            - APPIUM\_WEB\_JAVA\_JUNIT.
            - APPIUM\_WEB\_JAVA\_TESTNG.
            - APPIUM\_WEB\_PYTHON.
            - APPIUM\_WEB\_NODE.
            - APPIUM\_WEB\_RUBY.
            - INSTRUMENTATION.
            - XCTEST.
            - XCTEST\_UI.
