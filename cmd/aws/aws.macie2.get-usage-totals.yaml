name: get-usage-totals
description: Retrieves (queries) aggregated usage data for an account.
flags:
    --time-range=: The inclusive time period to retrieve the data for.
documentation:
    command: Retrieves (queries) aggregated usage data for an account.
    flag:
        time-range: 'The inclusive time period to retrieve the data for. Valid values are: MONTH\_TO\_DATE, for the current calendar month to date; and, PAST\_30\_DAYS, for the preceding 30 days. If you don''t specify a value for this parameter, Amazon Macie provides aggregated usage data for the preceding 30 days.'
