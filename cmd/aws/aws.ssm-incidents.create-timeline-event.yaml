name: create-timeline-event
description: Creates a custom timeline event on the incident details page of an incident record.
flags:
    --client-token=: A token that ensures that a client calls the action only once with the specified details.
    --event-data=!: A short description of the event.
    --event-references=: Adds one or more references to the `TimelineEvent`.
    --event-time=!: The timestamp for when the event occurred.
    --event-type=!: The type of event.
    --incident-record-arn=!: The Amazon Resource Name (ARN) of the incident record that the action adds the incident to.
documentation:
    command: Creates a custom timeline event on the incident details page of an incident record. Incident Manager automatically creates timeline events that mark key moments during an incident. You can create custom timeline events to mark important events that Incident Manager can detect automatically.
    flag:
        client-token: A token that ensures that a client calls the action only once with the specified details.
        event-data: A short description of the event.
        event-references: Adds one or more references to the `TimelineEvent`. A reference is an Amazon Web Services resource involved or associated with the incident. To specify a reference, enter its Amazon Resource Name (ARN). You can also specify a related item associated with a resource. For example, to specify an Amazon DynamoDB (DynamoDB) table as a resource, use the table's ARN. You can also specify an Amazon CloudWatch metric associated with the DynamoDB table as a related item.
        event-time: The timestamp for when the event occurred.
        event-type: |-
            The type of event. You can create timeline events of type `Custom Event` and `Note`.

            To make a Note-type event appear on the *Incident notes* panel in the console, specify `eventType` as `Note`and enter the Amazon Resource Name (ARN) of the incident as the value for `eventReference`.
        incident-record-arn: The Amazon Resource Name (ARN) of the incident record that the action adds the incident to.
