name: describe-reserved-elasticsearch-instances
description: Returns information about reserved Elasticsearch instances for this account.
flags:
    --max-results=: Set this value to limit the number of results returned.
    --next-token=: NextToken should be sent in case if earlier API call produced result containing NextToken.
    --reserved-elasticsearch-instance-id=: The reserved instance identifier filter value.
documentation:
    command: Returns information about reserved Elasticsearch instances for this account.
    flag:
        max-results: Set this value to limit the number of results returned. If not specified, defaults to 100.
        next-token: NextToken should be sent in case if earlier API call produced result containing NextToken. It is used for pagination.
        reserved-elasticsearch-instance-id: The reserved instance identifier filter value. Use this parameter to show only the reservation that matches the specified reserved Elasticsearch instance ID.
