name: delete
description: '*(BETA)*  Delete a private service connection to a service for a project network.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --network=!: The network in the current project which is peered with the service
    --no-async&: Return immediately, without waiting for the operation in progress to
    --service=: The service to connect to
documentation:
    command: |
        *(BETA)*  This command deletes a private service connection to a service via a
        VPC network.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        network: The network in the current project which is peered with the service
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        service: The service to connect to
