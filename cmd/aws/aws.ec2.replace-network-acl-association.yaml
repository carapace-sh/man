name: replace-network-acl-association
description: Changes which network ACL a subnet is associated with.
flags:
    --association-id=!: The ID of the current association between the original network ACL and the subnet.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --network-acl-id=!: The ID of the new network ACL to associate with the subnet.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: |-
        Changes which network ACL a subnet is associated with. By default when you create a subnet, it's automatically associated with the default network ACL. For more information, see [Network ACLs](https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html) in the *Amazon VPC User Guide*.

        This is an idempotent operation.
    flag:
        association-id: The ID of the current association between the original network ACL and the subnet.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        network-acl-id: The ID of the new network ACL to associate with the subnet.
