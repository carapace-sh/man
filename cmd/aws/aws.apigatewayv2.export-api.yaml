name: export-api
flags:
    --api-id=!: The API identifier.
    --export-version=: The version of the API Gateway export algorithm.
    --include-extensions: Specifies whether to include [API Gateway extensions](https://docs.aws.amazon.com//apigateway/latest/developerguide/api-gateway-swagger-extensions.html) in the exported API definition.
    --no-include-extensions: Specifies whether to include [API Gateway extensions](https://docs.aws.amazon.com//apigateway/latest/developerguide/api-gateway-swagger-extensions.html) in the exported API definition.
    --output-type=!: The output type of the exported definition file.
    --specification=!: The version of the API specification to use.
    --stage-name=: The name of the API stage to export.
completion:
    positional:
        - - $files
documentation:
    flag:
        api-id: The API identifier.
        export-version: The version of the API Gateway export algorithm. API Gateway uses the latest version by default. Currently, the only supported version is 1.0.
        include-extensions: Specifies whether to include [API Gateway extensions](https://docs.aws.amazon.com//apigateway/latest/developerguide/api-gateway-swagger-extensions.html) in the exported API definition. API Gateway extensions are included by default.
        output-type: The output type of the exported definition file. Valid values are JSON and YAML.
        specification: The version of the API specification to use. OAS30, for OpenAPI 3.0, is the only supported value.
        stage-name: The name of the API stage to export. If you don't specify this property, a representation of the latest API configuration is exported.
