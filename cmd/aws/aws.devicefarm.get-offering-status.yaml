name: get-offering-status
description: Gets the current status and future status of all offerings purchased by an AWS account.
flags:
    --next-token=: An identifier that was returned from the previous call to this operation, which can be used to return the next set of items in the list.
documentation:
    command: Gets the current status and future status of all offerings purchased by an AWS account. The response indicates how many offerings are currently available and the offerings that will be available in the next period. The API returns a `NotEligible` error if the user is not permitted to invoke the operation. If you must be able to invoke this operation, contact [aws-devicefarm-support@amazon.com](mailto:aws-devicefarm-support@amazon.com).
    flag:
        next-token: An identifier that was returned from the previous call to this operation, which can be used to return the next set of items in the list.
