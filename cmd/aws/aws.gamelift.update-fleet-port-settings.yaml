name: update-fleet-port-settings
description: |-
    **This API works with the following fleet types:** EC2, Container

    Updates permissions that allow inbound traffic to connect to game sessions in the fleet.
flags:
    --fleet-id=!: A unique identifier for the fleet to update port settings for.
    --inbound-permission-authorizations=: A collection of port settings to be added to the fleet resource.
    --inbound-permission-revocations=: A collection of port settings to be removed from the fleet resource.
documentation:
    command: |-
        **This API works with the following fleet types:** EC2, Container

        Updates permissions that allow inbound traffic to connect to game sessions in the fleet.

        To update settings, specify the fleet ID to be updated and specify the changes to be made. List the permissions you want to add in `InboundPermissionAuthorizations`, and permissions you want to remove in `InboundPermissionRevocations`. Permissions to be removed must match existing fleet permissions.

        If successful, the fleet ID for the updated fleet is returned. For fleets with remote locations, port setting updates can take time to propagate across all locations. You can check the status of updates in each location by calling `DescribeFleetPortSettings` with a location name.

        **Learn more**

        [Setting up Amazon GameLift Servers fleets](https://docs.aws.amazon.com/gamelift/latest/developerguide/fleets-intro.html)
    flag:
        fleet-id: A unique identifier for the fleet to update port settings for. You can use either the fleet ID or ARN value.
        inbound-permission-authorizations: A collection of port settings to be added to the fleet resource.
        inbound-permission-revocations: A collection of port settings to be removed from the fleet resource.
