name: enable-ipam-organization-admin-account
description: Enable an Organizations member account as the IPAM admin account.
flags:
    --delegated-admin-account-id=!: The Organizations member account ID that you want to enable as the IPAM account.
    --dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --no-dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
documentation:
    command: Enable an Organizations member account as the IPAM admin account. You cannot select the Organizations management account as the IPAM admin account. For more information, see [Enable integration with Organizations](https://docs.aws.amazon.com/vpc/latest/ipam/enable-integ-ipam.html) in the *Amazon VPC IPAM User Guide*.
    flag:
        delegated-admin-account-id: The Organizations member account ID that you want to enable as the IPAM account.
        dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
