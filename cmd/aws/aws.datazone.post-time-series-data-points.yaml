    --client-token=: A unique, case-sensitive identifier that is provided to ensure the idempotency of the request.
    --domain-identifier=!: The ID of the Amazon DataZone domain in which you want to post time series data points.
    --entity-identifier=!: The ID of the asset for which you want to post time series data points.
    --entity-type=!: The type of the asset for which you want to post data points.
    --forms=!: The forms that contain the data points that you want to post.
