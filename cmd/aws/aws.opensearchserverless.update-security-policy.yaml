name: update-security-policy
description: Updates an OpenSearch Serverless security policy.
flags:
    --client-token=: Unique, case-sensitive identifier to ensure idempotency of the request.
    --description=: A description of the policy.
    --name=!: The name of the policy.
    --policy-version=!: The version of the policy being updated.
    --policy=: The JSON policy document to use as the content for the new policy.
    --type=!: The type of access policy.
completion:
    flag:
        type:
            - encryption
            - network
documentation:
    command: Updates an OpenSearch Serverless security policy. For more information, see [Network access for Amazon OpenSearch Serverless](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-network.html) and [Encryption at rest for Amazon OpenSearch Serverless](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-encryption.html).
    flag:
        client-token: Unique, case-sensitive identifier to ensure idempotency of the request.
        description: A description of the policy. Typically used to store information about the permissions defined in the policy.
        name: The name of the policy.
        policy: The JSON policy document to use as the content for the new policy.
        policy-version: The version of the policy being updated.
        type: The type of access policy.
