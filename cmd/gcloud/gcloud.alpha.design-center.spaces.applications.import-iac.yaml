name: import-iac
description: '*(ALPHA)*  Import Infrastructure as Code (IaC) for an Application.'
flags:
    --allow-partial-import: If set, partially import valid IaC changes and ignore invalid ones.
    --gcs-uri=: The Cloud Storage URI of the Terraform code (e.g., gs://my-bucket/iac).
    --iac-module-from-file=: Path to a local YAML or JSON file containing the IaC module definition.
    --location=: The Cloud location for the application.
    --no-allow-partial-import&: If set, partially import valid IaC changes and ignore invalid ones.
    --no-validate-iac&: Validate the IaC without performing the import.
    --space=: The ID of the space.
    --validate-iac: Validate the IaC without performing the import.
documentation:
    command: '*(ALPHA)*  Import Infrastructure as Code (IaC) for a Design Center Application.'
    flag:
        allow-partial-import: If set, partially import valid IaC changes and ignore invalid ones.
        gcs-uri: The Cloud Storage URI of the Terraform code (e.g., gs://my-bucket/iac).
        iac-module-from-file: Path to a local YAML or JSON file containing the IaC module definition. Use a full or relative path to a local file containing the value of iac_module.
        location: |-
            The Cloud location for the application.
            +
            To set the `location` attribute:
            * provide the argument `APPLICATION` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-allow-partial-import: If set, partially import valid IaC changes and ignore invalid ones.
        no-validate-iac: Validate the IaC without performing the import.
        space: |-
            The ID of the space.
            +
            To set the `space` attribute:
            * provide the argument `APPLICATION` on the command line with a fully specified name;
            * provide the argument `--space` on the command line.
        validate-iac: Validate the IaC without performing the import.
