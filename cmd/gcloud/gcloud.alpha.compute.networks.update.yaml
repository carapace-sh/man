name: update
description: '*(ALPHA)*  Update a Compute Engine network.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --bgp-best-path-selection-mode=: The BGP best path selection algorithm to be employed.
    --bgp-bps-always-compare-med: Enables/disables the comparison of MED across routes with different Neighbor ASNs.
    --bgp-bps-inter-region-cost=: Defines the preferred approach for handling inter-region cost in the selection process.
    --bgp-routing-mode=: The target BGP routing mode for this network.
    --enable-ula-internal-ipv6: Enable/disable ULA internal IPv6 on this network.
    --internal-ipv6-range=: When enabling ULA internal IPv6, caller can optionally specify
    --mtu=: Maximum transmission unit (MTU) is the size of the largest
    --network-firewall-policy-enforcement-order=: The Network Firewall Policy enforcement order of this network.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-bgp-bps-always-compare-med&: Enables/disables the comparison of MED across routes with different Neighbor ASNs.
    --no-enable-ula-internal-ipv6&: Enable/disable ULA internal IPv6 on this network.
    --no-switch-to-custom-subnet-mode&: Switch to custom subnet mode.
    --switch-to-custom-subnet-mode: Switch to custom subnet mode.
completion:
    flag:
        bgp-best-path-selection-mode:
            - LEGACY
            - STANDARD
        bgp-bps-inter-region-cost:
            - ADD_COST_TO_MED
            - DEFAULT
        bgp-routing-mode:
            - global
            - regional
        network-firewall-policy-enforcement-order:
            - AFTER_CLASSIC_FIREWALL
            - BEFORE_CLASSIC_FIREWALL
documentation:
    command: '*(ALPHA)*  *gcloud alpha compute networks update* is used to update Compute Engine networks.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        bgp-best-path-selection-mode: |-
            The BGP best path selection algorithm to be employed. _BGP_BEST_PATH_SELECTION_MODE_ must be one of:
            +
            *LEGACY*::: Dynamic routes are ranked based on the multiple exit-discriminator (MED) BGP attribute. When global routing is enabled, the MED of the routes received from other regions is the original MED plus the region-to-region cost.
            *STANDARD*::: Dynamic routes are ranked based on AS Path, Origin, Neighbor ASN and MED BGP attributes. When global routing is enabled, region-to-region cost is used as a tiebreaker. This mode offers customizations to fine-tune BGP best path routing with additional flags like --bgp-bps-always-compare-med and --bgp-bps-inter-region-cost
            :::
            +
        bgp-bps-always-compare-med: Enables/disables the comparison of MED across routes with different Neighbor ASNs. This value can only be set if the --bgp-best-path-selection-mode is STANDARD. Use *--bgp-bps-always-compare-med* to enable and *--no-bgp-bps-always-compare-med* to disable.
        bgp-bps-inter-region-cost: |-
            Defines the preferred approach for handling inter-region cost in the selection process. This value can only be set if the --bgp-best-path-selection-mode is STANDARD. _BGP_BPS_INTER_REGION_COST_ must be one of:
            +
            *ADD_COST_TO_MED*::: Adds inter-region cost to the MED before comparing the MED value. When multiple routes have the same value after the Add-cost-to-med comparison, the route selection continues and prefers the route with lowest cost.
            *DEFAULT*::: MED is compared as originally received from peers. When multiple routes have the same MED, cost is evaluated as the next step.
            :::
            +
        bgp-routing-mode: |-
            The target BGP routing mode for this network. _MODE_ must be one of:
            +
            *global*::: Cloud Routers in this network advertise subnetworks from all regions to their BGP peers, and program instances in all regions with the router's best learned BGP routes.
            *regional*::: Cloud Routers in this network advertise subnetworks from their local region only to their BGP peers, and program instances in their local region only with the router's best learned BGP routes.
            :::
            +
        enable-ula-internal-ipv6: |-
            Enable/disable ULA internal IPv6 on this network. Enabling this
                  feature will assign a /48 from google defined ULA prefix fd20::/20.
            +
            Use *--enable-ula-internal-ipv6* to enable and *--no-enable-ula-internal-ipv6* to disable.
        internal-ipv6-range: |-
            When enabling ULA internal IPv6, caller can optionally specify
                  the /48 range they want from the google defined ULA prefix fd20::/20.
                  ULA_IPV6_RANGE must be a valid /48 ULA IPv6 address and within the
                  fd20::/20. Operation will fail if the speficied /48 is already in used
                  by another resource. If the field is not speficied, then a /48 range
                  will be randomly allocated from fd20::/20 and returned via this field.
        mtu: |-
            Maximum transmission unit (MTU) is the size of the largest
                          IP packet that can be transmitted on this network. Default value
                          is 1460 bytes. The minimum value is 1300 bytes and the maximum
                          value is 8896 bytes. The MTU advertised via DHCP to all instances
                          attached to this network.
        network-firewall-policy-enforcement-order: |-
            The Network Firewall Policy enforcement order of this network. If
                          not specified, defaults to AFTER_CLASSIC_FIREWALL.
            +
            _NETWORK_FIREWALL_POLICY_ENFORCEMENT_ORDER_ must be one of:
            +
            *AFTER_CLASSIC_FIREWALL*::: Network Firewall Policy is enforced after classic firewall.
            *BEFORE_CLASSIC_FIREWALL*::: Network Firewall Policy is enforced before classic firewall.
            :::
            +
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-bgp-bps-always-compare-med: Enables/disables the comparison of MED across routes with different Neighbor ASNs. This value can only be set if the --bgp-best-path-selection-mode is STANDARD.
        no-enable-ula-internal-ipv6: |-
            Enable/disable ULA internal IPv6 on this network. Enabling this
                  feature will assign a /48 from google defined ULA prefix fd20::/20.
        no-switch-to-custom-subnet-mode: Switch to custom subnet mode. This action cannot be undone.
        switch-to-custom-subnet-mode: Switch to custom subnet mode. This action cannot be undone.
