name: untag-resource
description: Removes tags from the resource with the specified ARN.
flags:
    --resource-arn=!: The ARN of the resource to be untagged.
    --tag-keys=!: Array of tag keys (strings) for the tags to be removed.
documentation:
    command: Removes tags from the resource with the specified ARN.
    flag:
        resource-arn: The ARN of the resource to be untagged. The ARN must be URL-encoded.
        tag-keys: Array of tag keys (strings) for the tags to be removed. See [Best practices and strategies](https://docs.aws.amazon.com/tag-editor/latest/userguide/best-practices-and-strats.html) in *Tagging AWS Resources and Tag Editor* for details, including restrictions that apply to tags and "Tag naming limits and requirements"; Amazon IVS has no constraints on tags beyond what is documented there.
