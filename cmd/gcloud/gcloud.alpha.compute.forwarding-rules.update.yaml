name: update
description: '*(ALPHA)*  Update a Compute Engine forwarding rule.'
flags:
    --allow-global-access: If True, then clients from all regions can access this internal
    --allow-psc-global-access: If specified, clients from all regions can access this Private
    --clear-external-managed-backend-bucket-migration-state: Clears current state of external managed migration.
    --clear-labels: Remove all labels.
    --external-managed-backend-bucket-migration-state=: Specifies the migration state.
    --external-managed-backend-bucket-migration-testing-percentage=: Determines the fraction of requests that should be processed by
    --global: If set, the forwarding rule is global.
    --load-balancing-scheme=: Only for the Global external Application Load Balancer migration.
    --network-tier=: Update the network tier of a forwarding rule.
    --no-allow-global-access&: If True, then clients from all regions can access this internal
    --no-allow-psc-global-access&: If specified, clients from all regions can access this Private
    --no-clear-external-managed-backend-bucket-migration-state&: Clears current state of external managed migration.
    --no-clear-labels&: Remove all labels.
    --no-global&: If set, the forwarding rule is global.
    --region=: Region of the forwarding rule to operate on.
    --remove-labels=: List of label keys to remove.
    --source-ip-ranges=: List of comma-separated IP addresses or IP ranges.
    --update-labels=: List of label KEY=VALUE pairs to update.
completion:
    flag:
        external-managed-backend-bucket-migration-state:
            - PREPARE
            - TEST_BY_PERCENTAGE
            - TEST_ALL_TRAFFIC
        load-balancing-scheme:
            - EXTERNAL
            - EXTERNAL_MANAGED
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute forwarding-rules update* updates labels, global access and network tier for a Compute
        Engine forwarding rule.
    flag:
        allow-global-access: |-
            If True, then clients from all regions can access this internal
            forwarding rule. This can only be specified for forwarding rules with
            the LOAD_BALANCING_SCHEME set to INTERNAL or INTERNAL_MANAGED. For
            forwarding rules of type INTERNAL, the target must be either a backend
            service or a target instance.
        allow-psc-global-access: |-
            If specified, clients from all regions can access this Private
            Service Connect forwarding rule. This can only be specified if the
            forwarding rule's target is a service attachment
            (--target-service-attachment).
        clear-external-managed-backend-bucket-migration-state: Clears current state of external managed migration.
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        external-managed-backend-bucket-migration-state: |-
            Specifies the migration state. Possible values are PREPARE,
            TEST_BY_PERCENTAGE, and TEST_ALL_TRAFFIC.
            +
            To begin the migration from EXTERNAL to EXTERNAL_MANAGED, the state must
            be changed to PREPARE. The state must be changed to TEST_ALL_TRAFFIC
            before the loadBalancingScheme can be changed to EXTERNAL_MANAGED.
            Optionally, the TEST_BY_PERCENTAGE state can be used to migrate traffic to
            backend buckets attached to this forwarding rule by percentage using the
            --external-managed-backend-bucket-migration-testing-percentage flag.
            +
            _EXTERNAL_MANAGED_BACKEND_BUCKET_MIGRATION_STATE_ must be one of: *PREPARE*, *TEST_BY_PERCENTAGE*, *TEST_ALL_TRAFFIC*.
        external-managed-backend-bucket-migration-testing-percentage: |-
            Determines the fraction of requests that should be processed by
            the Global external Application Load Balancer.
            +
            The value of this field must be in the range [0, 100].
        global: If set, the forwarding rule is global.
        load-balancing-scheme: |-
            Only for the Global external Application Load Balancer migration.
            +
            The value of this field must be EXTERNAL or EXTERNAL_MANAGED.
            +
            _LOAD_BALANCING_SCHEME_ must be one of: *EXTERNAL*, *EXTERNAL_MANAGED*.
        network-tier: |-
            Update the network tier of a forwarding rule. It does not allow to
            change from `PREMIUM` to `STANDARD` and visa versa.
        no-allow-global-access: |
            If True, then clients from all regions can access this internal
            forwarding rule. This can only be specified for forwarding rules with
            the LOAD_BALANCING_SCHEME set to INTERNAL or INTERNAL_MANAGED. For
            forwarding rules of type INTERNAL, the target must be either a backend
            service or a target instance.
        no-allow-psc-global-access: |
            If specified, clients from all regions can access this Private
            Service Connect forwarding rule. This can only be specified if the
            forwarding rule's target is a service attachment
            (--target-service-attachment).
        no-clear-external-managed-backend-bucket-migration-state: Clears current state of external managed migration.
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        no-global: If set, the forwarding rule is global.
        region: |-
            Region of the forwarding rule to operate on. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        source-ip-ranges: |-
            List of comma-separated IP addresses or IP ranges. If set, this forwarding
            rule only forwards traffic when the packet's source IP address matches one
            of the IP ranges set here.
        update-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
