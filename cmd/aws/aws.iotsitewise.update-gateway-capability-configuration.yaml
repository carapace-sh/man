name: update-gateway-capability-configuration
description: Updates a gateway capability configuration or defines a new capability configuration.
flags:
    --capability-configuration=!: The JSON document that defines the configuration for the gateway capability.
    --capability-namespace=!: The namespace of the gateway capability configuration to be updated.
    --gateway-id=!: The ID of the gateway to be updated.
documentation:
    command: |-
        Updates a gateway capability configuration or defines a new capability configuration. Each gateway capability defines data sources for a gateway.

        Important workflow notes:

        Each gateway capability defines data sources for a gateway. This is the namespace of the gateway capability.

        . The namespace follows the format `service:capability:version`, where:

        - `service` - The service providing the capability, or `iotsitewise`.
        - `capability` - The specific capability type. Options include: `opcuacollector` for the OPC UA data source collector, or `publisher` for data publisher capability.
        - `version` - The version number of the capability. Option include `2` for Classic streams, V2 gateways, and `3` for MQTT-enabled, V3 gateways.

        After updating a capability configuration, the sync status becomes `OUT_OF_SYNC` until the gateway processes the configuration.Use `DescribeGatewayCapabilityConfiguration` to check the sync status and verify the configuration was applied.

        A gateway can have multiple capability configurations with different namespaces.
    flag:
        capability-configuration: The JSON document that defines the configuration for the gateway capability. For more information, see [Configuring data sources (CLI)](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/configure-sources.html#configure-source-cli) in the *IoT SiteWise User Guide*.
        capability-namespace: The namespace of the gateway capability configuration to be updated. For example, if you configure OPC UA sources for an MQTT-enabled gateway, your OPC-UA capability configuration has the namespace `iotsitewise:opcuacollector:3`.
        gateway-id: The ID of the gateway to be updated.
