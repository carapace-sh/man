name: create-license-configuration
description: Creates a license configuration.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: Description of the license configuration.
    --disassociate-when-not-found: When true, disassociates a resource when software is uninstalled.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --license-count-hard-limit: Indicates whether hard or soft license enforcement is used.
    --license-count=: Number of licenses managed by the license configuration.
    --license-counting-type=!: Dimension used to track the license inventory.
    --license-rules=: License rules.
    --name=!: Name of the license configuration.
    --no-disassociate-when-not-found: When true, disassociates a resource when software is uninstalled.
    --no-license-count-hard-limit: Indicates whether hard or soft license enforcement is used.
    --product-information-list=: Product information.
    --tags=: Tags to add to the license configuration.
completion:
    flag:
        license-counting-type:
            - vCPU
            - Instance
            - Core
            - Socket
documentation:
    command: |-
        Creates a license configuration.

        A license configuration is an abstraction of a customer license agreement that can be consumed and enforced by License Manager. Components include specifications for the license type (licensing by instance, socket, CPU, or vCPU), allowed tenancy (shared tenancy, Dedicated Instance, Dedicated Host, or all of these), license affinity to host (how long a license must be associated with a host), and the number of licenses purchased and used.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: Description of the license configuration.
        disassociate-when-not-found: When true, disassociates a resource when software is uninstalled.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        license-count: Number of licenses managed by the license configuration.
        license-count-hard-limit: Indicates whether hard or soft license enforcement is used. Exceeding a hard limit blocks the launch of new instances.
        license-counting-type: Dimension used to track the license inventory.
        license-rules: |-
            License rules. The syntax is #name=value (for example, #allowedTenancy=EC2-DedicatedHost). The available rules vary by dimension, as follows.

            - `Cores` dimension: `allowedTenancy` | `licenseAffinityToHost` | `maximumCores` | `minimumCores`
            - `Instances` dimension: `allowedTenancy` | `maximumVcpus` | `minimumVcpus`
            - `Sockets` dimension: `allowedTenancy` | `licenseAffinityToHost` | `maximumSockets` | `minimumSockets`
            - `vCPUs` dimension: `allowedTenancy` | `honorVcpuOptimization` | `maximumVcpus` | `minimumVcpus`

            The unit for `licenseAffinityToHost` is days and the range is 1 to 180. The possible values for `allowedTenancy` are `EC2-Default`, `EC2-DedicatedHost`, and `EC2-DedicatedInstance`. The possible values for `honorVcpuOptimization` are `True` and `False`.
        name: Name of the license configuration.
        product-information-list: Product information.
        tags: Tags to add to the license configuration.
