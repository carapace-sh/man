name: notify-recommendations-received
description: Removes the specified recommendations from the specified assistant's queue of newly available recommendations.
flags:
    --assistant-id=!: The identifier of the Amazon Q in Connect assistant.
    --recommendation-ids=!: The identifiers of the recommendations.
    --session-id=!: The identifier of the session.
documentation:
    command: Removes the specified recommendations from the specified assistant's queue of newly available recommendations. You can use this API in conjunction with [GetRecommendations](https://docs.aws.amazon.com/amazon-q-connect/latest/APIReference/API_GetRecommendations.html) and a `waitTimeSeconds` input for long-polling behavior and avoiding duplicate recommendations.
    flag:
        assistant-id: The identifier of the Amazon Q in Connect assistant. Can be either the ID or the ARN. URLs cannot contain the ARN.
        recommendation-ids: The identifiers of the recommendations.
        session-id: The identifier of the session. Can be either the ID or the ARN. URLs cannot contain the ARN.
