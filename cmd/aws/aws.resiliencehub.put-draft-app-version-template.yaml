name: put-draft-app-version-template
description: Adds or updates the app template for an Resilience Hub application draft version.
flags:
    --app-arn=!: Amazon Resource Name (ARN) of the Resilience Hub application.
    --app-template-body=!: A JSON string that provides information about your application structure.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
documentation:
    command: Adds or updates the app template for an Resilience Hub application draft version.
    flag:
        app-arn: 'Amazon Resource Name (ARN) of the Resilience Hub application. The format for this ARN is: arn:`partition`:resiliencehub:`region`:`account`:app/`app-id`. For more information about ARNs, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference* guide.'
        app-template-body: "A JSON string that provides information about your application structure. To learn more about the `appTemplateBody` template, see the sample template provided in the *Examples* section.\n\nThe `appTemplateBody` JSON string has the following structure:\n\n- **`resources`**\n  \n  The list of logical resources that must be included in the Resilience Hub application.\n  \n  Type: Array\n  \n  Don't add the resources that you want to exclude.\n  \n  Each `resources` array item includes the following fields:\n  \n  - *`logicalResourceId`*\n    \n    Logical identifier of the resource.\n    \n    Type: Object\n    \n    Each `logicalResourceId` object includes the following fields:\n    \n    - `identifier`\n      \n      Identifier of the resource.\n      \n      Type: String\n    - `logicalStackName`\n      \n      The name of the CloudFormation stack this resource belongs to.\n      \n      Type: String\n    - `resourceGroupName`\n      \n      The name of the resource group this resource belongs to.\n      \n      Type: String\n    - `terraformSourceName`\n      \n      The name of the Terraform S3 state file this resource belongs to.\n      \n      Type: String\n    - `eksSourceName`\n      \n      Name of the Amazon Elastic Kubernetes Service cluster and namespace this resource belongs to.\n      \n      This parameter accepts values in \"eks-cluster/namespace\" format.\n      \n      Type: String\n  - *`type`*\n    \n    The type of resource.\n    \n    Type: string\n  - *`name`*\n    \n    The name of the resource.\n    \n    Type: String\n  - `additionalInfo`\n    \n    Additional configuration parameters for an Resilience Hub application. If you want to implement `additionalInfo` through the Resilience Hub console rather than using an API call, see [Configure the application configuration parameters](https://docs.aws.amazon.com/resilience-hub/latest/userguide/app-config-param.html).\n    \n    Currently, this parameter accepts a key-value mapping (in a string format) of only one failover region and one associated account.\n    \n    Key: `\"failover-regions\"`\n    \n    Value: `\"[{\"region\":\"<REGION>\", \"accounts\":[{\"id\":\"<ACCOUNT_ID>\"}]}]\"`\n- **`appComponents`**\n  \n  List of Application Components that this resource belongs to. If an Application Component is not part of the Resilience Hub application, it will be added.\n  \n  Type: Array\n  \n  Each `appComponents` array item includes the following fields:\n  \n  - `name`\n    \n    Name of the Application Component.\n    \n    Type: String\n  - `type`\n    \n    Type of Application Component. For more information about the types of Application Component, see [Grouping resources in an AppComponent](https://docs.aws.amazon.com/resilience-hub/latest/userguide/AppComponent.grouping.html).\n    \n    Type: String\n  - `resourceNames`\n    \n    The list of included resources that are assigned to the Application Component.\n    \n    Type: Array of strings\n  - `additionalInfo`\n    \n    Additional configuration parameters for an Resilience Hub application. If you want to implement `additionalInfo` through the Resilience Hub console rather than using an API call, see [Configure the application configuration parameters](https://docs.aws.amazon.com/resilience-hub/latest/userguide/app-config-param.html).\n    \n    Currently, this parameter accepts a key-value mapping (in a string format) of only one failover region and one associated account.\n    \n    Key: `\"failover-regions\"`\n    \n    Value: `\"[{\"region\":\"<REGION>\", \"accounts\":[{\"id\":\"<ACCOUNT_ID>\"}]}]\"`\n- **`excludedResources`**\n  \n  The list of logical resource identifiers to be excluded from the application.\n  \n  Type: Array\n  \n  Don't add the resources that you want to include.\n  \n  Each `excludedResources` array item includes the following fields:\n  \n  - *`logicalResourceIds`*\n    \n    Logical identifier of the resource.\n    \n    Type: Object\n    \n    You can configure only one of the following fields:\n    \n    - `logicalStackName`\n    - `resourceGroupName`\n    - `terraformSourceName`\n    - `eksSourceName`\n    \n    Each `logicalResourceIds` object includes the following fields:\n    \n    - `identifier`\n      \n      Identifier of the resource.\n      \n      Type: String\n    - `logicalStackName`\n      \n      The name of the CloudFormation stack this resource belongs to.\n      \n      Type: String\n    - `resourceGroupName`\n      \n      The name of the resource group this resource belongs to.\n      \n      Type: String\n    - `terraformSourceName`\n      \n      The name of the Terraform S3 state file this resource belongs to.\n      \n      Type: String\n    - `eksSourceName`\n      \n      Name of the Amazon Elastic Kubernetes Service cluster and namespace this resource belongs to.\n      \n      This parameter accepts values in \"eks-cluster/namespace\" format.\n      \n      Type: String\n- **`version`**\n  \n  Resilience Hub application version.\n- `additionalInfo`\n  \n  Additional configuration parameters for an Resilience Hub application. If you want to implement `additionalInfo` through the Resilience Hub console rather than using an API call, see [Configure the application configuration parameters](https://docs.aws.amazon.com/resilience-hub/latest/userguide/app-config-param.html).\n  \n  Currently, this parameter accepts a key-value mapping (in a string format) of only one failover region and one associated account.\n  \n  Key: `\"failover-regions\"`\n  \n  Value: `\"[{\"region\":\"<REGION>\", \"accounts\":[{\"id\":\"<ACCOUNT_ID>\"}]}]\"`"
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
