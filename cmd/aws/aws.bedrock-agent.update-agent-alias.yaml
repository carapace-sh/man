name: update-agent-alias
description: Updates configurations for an alias of an agent.
flags:
    --agent-alias-id=!: The unique identifier of the alias.
    --agent-alias-name=!: Specifies a new name for the alias.
    --agent-id=!: The unique identifier of the agent.
    --alias-invocation-state=: The invocation state for the agent alias.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: Specifies a new description for the alias.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --routing-configuration=:
        description: Contains details about the routing configuration of the alias.
        nargs: -1
completion:
    flag:
        alias-invocation-state:
            - ACCEPT_INVOCATIONS
            - REJECT_INVOCATIONS
documentation:
    command: Updates configurations for an alias of an agent.
    flag:
        agent-alias-id: The unique identifier of the alias.
        agent-alias-name: Specifies a new name for the alias.
        agent-id: The unique identifier of the agent.
        alias-invocation-state: The invocation state for the agent alias. To pause the agent alias, set the value to `REJECT_INVOCATIONS`. To start the agent alias running again, set the value to `ACCEPT_INVOCATIONS`. Use the `GetAgentAlias`, or `ListAgentAliases`, operation to get the invocation state of an agent alias.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: Specifies a new description for the alias.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        routing-configuration: Contains details about the routing configuration of the alias.
