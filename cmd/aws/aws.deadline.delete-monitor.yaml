name: delete-monitor
description: Removes a Deadline Cloud monitor.
flags:
    --monitor-id=!: The unique identifier of the monitor to delete.
documentation:
    command: Removes a Deadline Cloud monitor. After you delete a monitor, you can create a new one and attach farms to the monitor.
    flag:
        monitor-id: The unique identifier of the monitor to delete. This ID is returned by the `CreateMonitor` operation, and is included in the response to the `GetMonitor` operation.
