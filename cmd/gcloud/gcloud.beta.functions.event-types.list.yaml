name: list
description: '*(BETA)*  List types of events that can be a trigger for a Google Cloud Function.'
flags:
    --gen2: If enabled, this command will use Cloud Functions (Second generation).
    --no-gen2&: If enabled, this command will use Cloud Functions (Second generation).
documentation:
    command: |
        *(BETA)*  `gcloud beta functions event-types list` displays types of events that can be a trigger for a Google Cloud
        Function.

        * For an event type, `EVENT_TYPE_DEFAULT` marks whether the given event type
          is the default (in which case the `--trigger-event` flag may be omitted).
        * For a resource, `RESOURCE_OPTIONAL` marks whether the resource has a
          corresponding default value (in which case the `--trigger-resource` flag
          may be omitted).
    flag:
        gen2: If enabled, this command will use Cloud Functions (Second generation). If disabled with `--no-gen2`, Cloud Functions (First generation) will be used. If not specified, the value of this flag will be taken from the `functions/gen2` configuration property.
        no-gen2: If enabled, this command will use Cloud Functions (Second generation). If disabled with `--no-gen2`, Cloud Functions (First generation) will be used. If not specified, the value of this flag will be taken from the `functions/gen2` configuration property.
