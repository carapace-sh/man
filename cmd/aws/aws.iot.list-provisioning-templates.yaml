name: list-provisioning-templates
description: Lists the provisioning templates in your Amazon Web Services account.
flags:
    --max-results=: The maximum number of results to return at one time.
    --next-token=: A token to retrieve the next set of results.
documentation:
    command: |-
        Lists the provisioning templates in your Amazon Web Services account.

        Requires permission to access the [ListProvisioningTemplates](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        max-results: The maximum number of results to return at one time.
        next-token: A token to retrieve the next set of results.
