name: describe
description: '*(ALPHA)*  Describes a Compute Engine network firewall policy pakcet mirroring rule.'
flags:
    --firewall-policy=!: Firewall policy ID with which to describe rule.
    --global-firewall-policy!: Use this flag to indicate that firewall policy is global.
    --no-global-firewall-policy!&: Use this flag to indicate that firewall policy is global.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute network-firewall-policies mirroring-rules describe* is used to describe network firewall policy packet mirroring
        rules.
    flag:
        firewall-policy: Firewall policy ID with which to describe rule.
        global-firewall-policy: Use this flag to indicate that firewall policy is global.
        no-global-firewall-policy: Use this flag to indicate that firewall policy is global.
