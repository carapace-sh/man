name: delete
description: '*(BETA)*  *(DEPRECATED)*  Delete a Data Catalog entry.'
flags:
    --entry-group=: Entry group of the entry.
    --location=: Location of the entry.
documentation:
    command: |4-
        *(BETA)*  *(DEPRECATED)*  This command is deprecated. Please use `gcloud dataplex entries` instead.

        Delete a Data Catalog entry.
    flag:
        entry-group: |-
            Entry group of the entry.
            +

            To set the `entry-group` attribute:
            * provide the argument `entry` on the command line with a fully specified name;
            * provide the argument `--entry-group` on the command line.
        location: |-
            Location of the entry.
            +

            To set the `location` attribute:
            * provide the argument `entry` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
