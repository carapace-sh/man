name: delete
description: Delete a registered AttachedCluster resource.
flags:
    --allow-missing: Allow idempotent deletion of cluster.
    --async: Return immediately, without waiting for the operation in progress to
    --ignore-errors: Force delete an Attached cluster.
    --location=: Google Cloud location for the cluster.
    --no-allow-missing&: Allow idempotent deletion of cluster.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-ignore-errors&: Force delete an Attached cluster.
    --no-validate-only&: Validate the cluster to delete, but don't actually perform it.
    --validate-only: Validate the cluster to delete, but don't actually perform it.
documentation:
    command: Delete a registered AttachedCluster resource.
    flag:
        allow-missing: |-
            Allow idempotent deletion of cluster.
              The request will still succeed in case the cluster does not exist.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        ignore-errors: |-
            Force delete an Attached cluster.
              Deletion of the Attached cluster will succeed even if errors occur
              during deleting in-cluster resources. Using this parameter may
              result in orphaned resources in the cluster.
        location: |-
            Google Cloud location for the cluster.
            +
            To set the `location` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_attached/location`.
        no-allow-missing: |
            Allow idempotent deletion of cluster.
              The request will still succeed in case the cluster does not exist.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-ignore-errors: |
            Force delete an Attached cluster.
              Deletion of the Attached cluster will succeed even if errors occur
              during deleting in-cluster resources. Using this parameter may
              result in orphaned resources in the cluster.
        no-validate-only: Validate the cluster to delete, but don't actually perform it.
        validate-only: Validate the cluster to delete, but don't actually perform it.
