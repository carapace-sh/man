documentation:
    command: |4
        *(ALPHA)*  *(DEPRECATED)*  This command is deprecated. Use `gcloud alpha tasks queues update` instead

        *(ALPHA)*  *(DEPRECATED)*  Update a Cloud Tasks queue.

        This command is deprecated. Use `gcloud alpha tasks queues update` instead

        The flags available to this command represent the fields of a queue that are
        mutable. Attempting to use this command on a different type of queue will
        result in an error.
    flag:
        clear-max-attempts: Clear the field corresponding to `--max-attempts`.
        clear-max-backoff: Clear the field corresponding to `--max-backoff`.
        clear-max-concurrent-tasks: Clear the field corresponding to `--max-concurrent-tasks`.
        clear-max-doublings: Clear the field corresponding to `--max-doublings`.
        clear-max-retry-duration: Clear the field corresponding to `--max-retry-duration`.
        clear-max-tasks-dispatched-per-second: Clear the field corresponding to `--max-tasks-dispatched-per-second`.
        clear-min-backoff: Clear the field corresponding to `--min-backoff`.
        clear-routing-override: Clear the field corresponding to `--routing-override`.
        location: The location where we want to manage the queue or task. If not specified, uses the location of the current project's App Engine app if there is an associated app.
        max-attempts: The maximum number of attempts per task in the queue.
        max-backoff: |-
            The maximum amount of time to wait before retrying a task after it
            fails. Must be a string that ends in 's', such as "5s".
        max-concurrent-tasks: |-
            The maximum number of concurrent tasks that Cloud Tasks allows to
            be dispatched for this queue. After this threshold has been reached,
            Cloud Tasks stops dispatching tasks until the number of outstanding
            requests decreases.
        max-doublings: |-
            The time between retries will double maxDoublings times.
            +
            A tasks retry interval starts at minBackoff, then doubles maxDoublings
            times, then increases linearly, and finally retries retries at
            intervals of maxBackoff up to maxAttempts times.
            +
            For example, if minBackoff is 10s, maxBackoff is 300s, and
            maxDoublings is 3, then the a task will first be retried in 10s. The
            retry interval will double three times, and then increase linearly by
            2^3 * 10s. Finally, the task will retry at intervals of maxBackoff
            until the task has been attempted maxAttempts times. Thus, the
            requests will retry at 10s, 20s, 40s, 80s, 160s, 240s, 300s, 300s.
        max-retry-duration: |-
            The time limit for retrying a failed task, measured from when the task
            was first run. Once the `--max-retry-duration` time has passed and the
            task has been attempted --max-attempts times, no further attempts will
            be made and the task will be deleted.
            +
            Must be a string that ends in 's', such as "5s".
        max-tasks-dispatched-per-second: The maximum rate at which tasks are dispatched from this queue.
        min-backoff: |-
            The minimum amount of time to wait before retrying a task after it
            fails. Must be a string that ends in 's', such as "5s".
        no-clear-max-attempts: Clear the field corresponding to `--max-attempts`.
        no-clear-max-backoff: Clear the field corresponding to `--max-backoff`.
        no-clear-max-concurrent-tasks: Clear the field corresponding to `--max-concurrent-tasks`.
        no-clear-max-doublings: Clear the field corresponding to `--max-doublings`.
        no-clear-max-retry-duration: Clear the field corresponding to `--max-retry-duration`.
        no-clear-max-tasks-dispatched-per-second: Clear the field corresponding to `--max-tasks-dispatched-per-second`.
        no-clear-min-backoff: Clear the field corresponding to `--min-backoff`.
        no-clear-routing-override: Clear the field corresponding to `--routing-override`.
        routing-override: |-
            If provided, the specified App Engine route is used for all tasks
            in the queue, no matter what is set is at the task-level.
            +
            KEY must be at least one of: [service, version, instance]. Any missing keys will use the
            default.
