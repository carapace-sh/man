name: put-contact-policy
description: Adds a resource policy to the specified contact or escalation plan.
flags:
    --contact-arn=!: The Amazon Resource Name (ARN) of the contact or escalation plan.
    --policy=!: Details of the resource policy.
documentation:
    command: Adds a resource policy to the specified contact or escalation plan. The resource policy is used to share the contact or escalation plan using Resource Access Manager (RAM). For more information about cross-account sharing, see [Setting up cross-account functionality](https://docs.aws.amazon.com/incident-manager/latest/userguide/xa.html).
    flag:
        contact-arn: The Amazon Resource Name (ARN) of the contact or escalation plan.
        policy: Details of the resource policy.
