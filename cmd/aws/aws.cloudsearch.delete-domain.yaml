name: delete-domain
description: Permanently deletes a search domain and all of its data.
flags:
    --domain-name=!: The name of the domain you want to permanently delete.
documentation:
    command: Permanently deletes a search domain and all of its data. Once a domain has been deleted, it cannot be recovered. For more information, see [Deleting a Search Domain](http://docs.aws.amazon.com/cloudsearch/latest/developerguide/deleting-domains.html) in the *Amazon CloudSearch Developer Guide*.
    flag:
        domain-name: The name of the domain you want to permanently delete.
