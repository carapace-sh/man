name: describe
description: '*(BETA)*  Display details of a Google Cloud Function.'
flags:
    --gen2&: If enabled, this command will use Cloud Functions (Second generation).
    --no-gen2&: If enabled, this command will use Cloud Functions (Second generation).
    --no-v2&: If specified, this command will use Cloud Functions v2 APIs and return the result in the v2 format (See https://cloud.google.com/functions/docs/reference/rest/v2/projects.locations.functions#Function).
    --region=: The Cloud region for the function.
    --v2: If specified, this command will use Cloud Functions v2 APIs and return the result in the v2 format (See https://cloud.google.com/functions/docs/reference/rest/v2/projects.locations.functions#Function).
documentation:
    command: '*(BETA)*  Display details of a Google Cloud Function.'
    flag:
        gen2: If enabled, this command will use Cloud Functions (Second generation). If disabled with `--no-gen2`, Cloud Functions (First generation) will be used. If not specified, the value of this flag will be taken from the `functions/gen2` configuration property. If the `functions/gen2` configuration property is not set, defaults to looking up the given function and using its generation. This command could conflict with `--v2`. If specified `--gen2` with `--no-v2`, or `--no-gen2` with `--v2`, Second generation will be used.
        no-gen2: If enabled, this command will use Cloud Functions (Second generation). If disabled with `--no-gen2`, Cloud Functions (First generation) will be used. If not specified, the value of this flag will be taken from the `functions/gen2` configuration property. If the `functions/gen2` configuration property is not set, defaults to looking up the given function and using its generation. This command could conflict with `--v2`. If specified `--gen2` with `--no-v2`, or `--no-gen2` with `--v2`, Second generation will be used.
        no-v2: If specified, this command will use Cloud Functions v2 APIs and return the result in the v2 format (See https://cloud.google.com/functions/docs/reference/rest/v2/projects.locations.functions#Function). If not specified, 1st gen and 2nd gen functions will use v1 and v2 APIs respectively and return the result in the corresponding format (For v1 format, see https://cloud.google.com/functions/docs/reference/rest/v1/projects.locations.functions#resource:-cloudfunction). This command conflicts with `--no-gen2`. If specified with this combination, v2 APIs will be used.
        region: |-
            The Cloud region for the function. Overrides the default `functions/region` property value for this command invocation.
            +
            To set the `region` attribute:
            * provide the argument `NAME` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `functions/region`.
        v2: If specified, this command will use Cloud Functions v2 APIs and return the result in the v2 format (See https://cloud.google.com/functions/docs/reference/rest/v2/projects.locations.functions#Function). If not specified, 1st gen and 2nd gen functions will use v1 and v2 APIs respectively and return the result in the corresponding format (For v1 format, see https://cloud.google.com/functions/docs/reference/rest/v1/projects.locations.functions#resource:-cloudfunction). This command conflicts with `--no-gen2`. If specified with this combination, v2 APIs will be used.
