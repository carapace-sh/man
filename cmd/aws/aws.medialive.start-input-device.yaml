name: start-input-device
description: Start an input device that is attached to a MediaConnect flow.
flags:
    --input-device-id=!: The unique ID of the input device to start.
documentation:
    command: Start an input device that is attached to a MediaConnect flow. (There is no need to start a device that is attached to a MediaLive input; MediaLive starts the device when the channel starts.)
    flag:
        input-device-id: The unique ID of the input device to start. For example, hd-123456789abcdef.
