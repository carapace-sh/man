name: get-discovered-schema
description: Get the discovered schema that was generated based on sampled events.
flags:
    --events=!: An array of strings where each string is a JSON event.
    --type=!: The type of event.
completion:
    flag:
        type:
            - OpenApi3
            - JSONSchemaDraft4
documentation:
    command: Get the discovered schema that was generated based on sampled events.
    flag:
        events: An array of strings where each string is a JSON event. These are the events that were used to generate the schema. The array includes a single type of event and has a maximum size of 10 events.
        type: The type of event.
