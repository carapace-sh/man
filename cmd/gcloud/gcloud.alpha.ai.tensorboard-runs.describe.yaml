name: describe
description: '*(ALPHA)*  Get detailed Tensorboard run information about the given Tensorboard run id.'
flags:
    --region=: Cloud region for the tensorboard_run.
    --tensorboard-experiment-id=: ID of the tensorboard experiment for the tensorboard_run.
    --tensorboard-id=: ID of the tensorboard for the tensorboard_run.
documentation:
    command: '*(ALPHA)*  Get detailed Tensorboard run information about the given Tensorboard run id.'
    flag:
        region: |-
            Cloud region for the tensorboard_run.
            +
            To set the `region` attribute:
            * provide the argument `tensorboard_run` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
        tensorboard-experiment-id: |-
            ID of the tensorboard experiment for the tensorboard_run.
            +
            To set the `tensorboard-experiment-id` attribute:
            * provide the argument `tensorboard_run` on the command line with a fully specified name;
            * provide the argument `--tensorboard-experiment-id` on the command line.
        tensorboard-id: |-
            ID of the tensorboard for the tensorboard_run.
            +
            To set the `tensorboard-id` attribute:
            * provide the argument `tensorboard_run` on the command line with a fully specified name;
            * provide the argument `--tensorboard-id` on the command line.
