name: describe-tags
description: Describes the specified tags.
flags:
    --filters=: One or more filters to scope the tags to return.
    --max-records=: The maximum number of items to return with this call.
    --next-token=: The token for the next set of items to return.
documentation:
    command: |-
        Describes the specified tags.

        You can use filters to limit the results. For example, you can query for the tags for a specific Auto Scaling group. You can specify multiple values for a filter. A tag must match at least one of the specified values for it to be included in the results.

        You can also specify multiple filters. The result includes information for a particular tag only if it matches all the filters. If there's no match, no special message is returned.

        For more information, see [Tag Auto Scaling groups and instances](https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-tagging.html) in the *Amazon EC2 Auto Scaling User Guide*.
    flag:
        filters: One or more filters to scope the tags to return. The maximum number of filters per filter type (for example, `auto-scaling-group`) is 1000.
        max-records: The maximum number of items to return with this call. The default value is `50` and the maximum value is `100`.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
