name: list-subscribed-workteams
description: Gets a list of the work teams that you are subscribed to in the Amazon Web Services Marketplace.
flags:
    --max-results=: The maximum number of work teams to return in each page of the response.
    --name-contains=: A string in the work team name.
    --next-token=: If the result of the previous `ListSubscribedWorkteams` request was truncated, the response includes a `NextToken`.
documentation:
    command: Gets a list of the work teams that you are subscribed to in the Amazon Web Services Marketplace. The list may be empty if no work team satisfies the filter specified in the `NameContains` parameter.
    flag:
        max-results: The maximum number of work teams to return in each page of the response.
        name-contains: A string in the work team name. This filter returns only work teams whose name contains the specified string.
        next-token: If the result of the previous `ListSubscribedWorkteams` request was truncated, the response includes a `NextToken`. To retrieve the next set of labeling jobs, use the token in the next request.
