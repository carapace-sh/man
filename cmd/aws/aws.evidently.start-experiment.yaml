name: start-experiment
description: Starts an existing experiment.
flags:
    --analysis-complete-time=!: The date and time to end the experiment.
    --experiment=!: The name of the experiment to start.
    --project=!: The name or ARN of the project that contains the experiment to start.
documentation:
    command: Starts an existing experiment. To create an experiment, use [CreateExperiment](https://docs.aws.amazon.com/cloudwatchevidently/latest/APIReference/API_CreateExperiment.html).
    flag:
        analysis-complete-time: The date and time to end the experiment. This must be no more than 30 days after the experiment starts.
        experiment: The name of the experiment to start.
        project: The name or ARN of the project that contains the experiment to start.
