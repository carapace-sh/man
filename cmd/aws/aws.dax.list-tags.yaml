name: list-tags
description: List all of the tags for a DAX cluster.
flags:
    --next-token=: An optional token returned from a prior request.
    --resource-name=!: The name of the DAX resource to which the tags belong.
documentation:
    command: List all of the tags for a DAX cluster. You can call `ListTags` up to 10 times per second, per account.
    flag:
        next-token: An optional token returned from a prior request. Use this token for pagination of results from this action. If this parameter is specified, the response includes only results beyond the token.
        resource-name: The name of the DAX resource to which the tags belong.
