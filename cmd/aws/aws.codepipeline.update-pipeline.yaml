name: update-pipeline
description: Updates a specified pipeline with edits or changes to its structure.
flags:
    --pipeline=!: The name of the pipeline to be updated.
documentation:
    command: Updates a specified pipeline with edits or changes to its structure. Use a JSON file with the pipeline structure and `UpdatePipeline` to provide the full structure of the pipeline. Updating the pipeline increases the version number of the pipeline by 1.
    flag:
        pipeline: The name of the pipeline to be updated.
