name: create-rule-groups-namespace
description: The `CreateRuleGroupsNamespace` operation creates a rule groups namespace within a workspace.
flags:
    --client-token=: A unique identifier that you can provide to ensure the idempotency of the request.
    --data=!: The rules file to use in the new namespace.
    --name=!: The name for the new rule groups namespace.
    --tags=: The list of tag keys and values to associate with the rule groups namespace.
    --workspace-id=!: The ID of the workspace to add the rule groups namespace.
documentation:
    command: |-
        The `CreateRuleGroupsNamespace` operation creates a rule groups namespace within a workspace. A rule groups namespace is associated with exactly one rules file. A workspace can have multiple rule groups namespaces.

        The combined length of a rule group namespace and a rule group name cannot exceed 721 UTF-8 bytes.

        Use this operation only to create new rule groups namespaces. To update an existing rule groups namespace, use `PutRuleGroupsNamespace`.
    flag:
        client-token: A unique identifier that you can provide to ensure the idempotency of the request. Case-sensitive.
        data: |-
            The rules file to use in the new namespace.

            Contains the base64-encoded version of the YAML rules file.

            For details about the rule groups namespace structure, see [RuleGroupsNamespaceData](https://docs.aws.amazon.com/prometheus/latest/APIReference/yaml-RuleGroupsNamespaceData.html).
        name: The name for the new rule groups namespace.
        tags: The list of tag keys and values to associate with the rule groups namespace.
        workspace-id: The ID of the workspace to add the rule groups namespace.
