name: update
description: '*(BETA)*  Update a Compute Engine target instance.'
flags:
    --security-policy-region=: Region of the security policy to operate on.
    --security-policy=: The security policy that will be set for this target instance.
    --zone=: Zone of the target instance to update.
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute target-instances update* updates a Compute Engine target instance.

        ## EXAMPLES

        To update the security policy run this:

          $ gcloud beta compute target-instances update TARGET_INSTANCE --security-policy='my-policy'
    flag:
        security-policy: The security policy that will be set for this target instance. To remove the policy from this target instance set the policy to an empty string.
        security-policy-region: Region of the security policy to operate on. Overrides the default *compute/region* property value for this command invocation.
        zone: |-
            Zone of the target instance to update. If not specified and the ``compute/zone'' property isn't set, you
            might be prompted to select a zone (interactive mode only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
