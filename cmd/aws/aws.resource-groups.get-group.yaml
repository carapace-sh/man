name: get-group
description: Returns information about a specified resource group.
flags:
    --group-name=: Deprecated - don't use this parameter.
    --group=: The name or the Amazon resource name (ARN) of the resource group to retrieve.
documentation:
    command: |-
        Returns information about a specified resource group.

        **Minimum permissions**

        To run this command, you must have the following permissions:

        - `resource-groups:GetGroup`
    flag:
        group: The name or the Amazon resource name (ARN) of the resource group to retrieve.
        group-name: Deprecated - don't use this parameter. Use `Group` instead.
