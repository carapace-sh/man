name: manage-sparql-statistics
description: Manages the generation and use of RDF graph statistics.
flags:
    --mode=: The statistics generation mode.
completion:
    flag:
        mode:
            - disableAutoCompute
            - enableAutoCompute
            - refresh
documentation:
    command: |-
        Manages the generation and use of RDF graph statistics.

        When invoking this operation in a Neptune cluster that has IAM authentication enabled, the IAM user or role making the request must have a policy attached that allows the [neptune-db:ManageStatistics](https://docs.aws.amazon.com/neptune/latest/userguide/iam-dp-actions.html#managestatistics) IAM action in that cluster.
    flag:
        mode: 'The statistics generation mode. One of: `DISABLE_AUTOCOMPUTE`, `ENABLE_AUTOCOMPUTE`, or `REFRESH`, the last of which manually triggers DFE statistics generation.'
