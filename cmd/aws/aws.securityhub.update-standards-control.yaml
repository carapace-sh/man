name: update-standards-control
description: Used to control whether an individual security standard control is enabled or disabled.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --control-status=: The updated status of the security standard control.
    --disabled-reason=: A description of the reason why you are disabling a security standard control.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --standards-control-arn=!: The ARN of the security standard control to enable or disable.
completion:
    flag:
        control-status:
            - ENABLED
            - DISABLED
documentation:
    command: |-
        Used to control whether an individual security standard control is enabled or disabled.

        Calls to this operation return a `RESOURCE_NOT_FOUND_EXCEPTION` error when the standard subscription for the control has `StandardsControlsUpdatable` value `NOT_READY_FOR_UPDATES`.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        control-status: The updated status of the security standard control.
        disabled-reason: A description of the reason why you are disabling a security standard control. If you are disabling a control, then this is required.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        standards-control-arn: The ARN of the security standard control to enable or disable.
