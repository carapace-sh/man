name: delete-asset-filter
description: Deletes an asset filter.
flags:
    --asset-identifier=!: The ID of the data asset.
    --domain-identifier=!: The ID of the domain where you want to delete an asset filter.
    --identifier=!: The ID of the asset filter that you want to delete.
documentation:
    command: |-
        Deletes an asset filter.

        Prerequisites:

        - The asset filter must exist.
        - The domain and asset must not have been deleted.
        - Ensure the --identifier refers to a valid filter ID.
    flag:
        asset-identifier: The ID of the data asset.
        domain-identifier: The ID of the domain where you want to delete an asset filter.
        identifier: The ID of the asset filter that you want to delete.
