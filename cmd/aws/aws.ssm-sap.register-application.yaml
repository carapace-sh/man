name: register-application
description: Register an SAP application with AWS Systems Manager for SAP.
flags:
    --application-id=!: The ID of the application.
    --application-type=!: The type of the application.
    --components-info=: This is an optional parameter for component details to which the SAP ABAP application is attached, such as Web Dispatcher.
    --credentials=: The credentials of the SAP application.
    --database-arn=: The Amazon Resource Name of the SAP HANA database.
    --instances=!: The Amazon EC2 instances on which your SAP application is running.
    --sap-instance-number=: The SAP instance number of the application.
    --sid=: The System ID of the application.
    --tags=: The tags to be attached to the SAP application.
completion:
    flag:
        application-type:
            - HANA
            - SAP_ABAP
documentation:
    command: |-
        Register an SAP application with AWS Systems Manager for SAP. You must meet the following requirements before registering.

        The SAP application you want to register with AWS Systems Manager for SAP is running on Amazon EC2.

        AWS Systems Manager Agent must be setup on an Amazon EC2 instance along with the required IAM permissions.

        Amazon EC2 instance(s) must have access to the secrets created in AWS Secrets Manager to manage SAP applications and components.
    flag:
        application-id: The ID of the application.
        application-type: The type of the application.
        components-info: |-
            This is an optional parameter for component details to which the SAP ABAP application is attached, such as Web Dispatcher.

            This is an array of ApplicationComponent objects. You may input 0 to 5 items.
        credentials: The credentials of the SAP application.
        database-arn: The Amazon Resource Name of the SAP HANA database.
        instances: The Amazon EC2 instances on which your SAP application is running.
        sap-instance-number: The SAP instance number of the application.
        sid: The System ID of the application.
        tags: The tags to be attached to the SAP application.
