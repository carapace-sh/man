name: delete
description: '*(BETA)*  Delete a Managed Microsoft AD domain backup.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --domain=: The fully-qualified domain name of the Microsoft Active Directory domain.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(BETA)*  Delete a Managed Microsoft AD domain backup with the specified name using Google Cloud's
        Managed Service for Microsoft Active Directory.

        This command can fail for the following reasons:
          * The specified backup doesn't exist.
          * The active account doesn't have permission to access the specified domain.
          * The active account doesn't have permission to access the specified AD domain backup.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        domain: |-
            The fully-qualified domain name of the Microsoft Active Directory domain.
            +
            To set the `domain` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--domain` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
