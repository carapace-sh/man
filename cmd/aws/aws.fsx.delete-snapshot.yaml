name: delete-snapshot
description: Deletes an Amazon FSx for OpenZFS snapshot.
flags:
    --client-request-token=: ""
    --snapshot-id=!: The ID of the snapshot that you want to delete.
documentation:
    command: |-
        Deletes an Amazon FSx for OpenZFS snapshot. After deletion, the snapshot no longer exists, and its data is gone. Deleting a snapshot doesn't affect snapshots stored in a file system backup.

        The `DeleteSnapshot` operation returns instantly. The snapshot appears with the lifecycle status of `DELETING` until the deletion is complete.
    flag:
        client-request-token: ""
        snapshot-id: The ID of the snapshot that you want to delete.
