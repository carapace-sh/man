name: start-remediation-execution
description: Runs an on-demand remediation for the specified Config rules against the last known remediation configuration.
flags:
    --config-rule-name=!: The list of names of Config rules that you want to run remediation execution for.
    --resource-keys=!: A list of resource keys to be processed with the current request.
documentation:
    command: |-
        Runs an on-demand remediation for the specified Config rules against the last known remediation configuration. It runs an execution against the current state of your resources. Remediation execution is asynchronous.

        You can specify up to 100 resource keys per request. An existing StartRemediationExecution call for the specified resource keys must complete before you can call the API again.
    flag:
        config-rule-name: The list of names of Config rules that you want to run remediation execution for.
        resource-keys: A list of resource keys to be processed with the current request. Each element in the list consists of the resource type and resource ID.
