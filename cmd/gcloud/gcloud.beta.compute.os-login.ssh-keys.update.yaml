name: update
description: '*(BETA)*  Update an SSH public key in an OS Login profile.'
flags:
    --key-file=: The path to a file containing an SSH public key to update the
    --key=: The SSH public key to update the OS Login Profile.
    --ttl=!: The amount of time before the SSH key expires.
documentation:
    command: |
        *(BETA)*  *gcloud beta compute os-login ssh-keys update* accepts either a string containing an SSH public
        key or a filename for an SSH public key, and updates the key
        in the user's OS Login profile. Currently, only the expiration time,
        ``--ttl'', can be updated.
    flag:
        key: The SSH public key to update the OS Login Profile. Key value can either be the SSH key or the OS Login fingerprint of the key.
        key-file: |-
            The path to a file containing an SSH public key to update the
            OS Login Profile. Key value can either be the SSH key or the OS Login fingerprint of the key.
        ttl: |-
            The amount of time before the SSH key expires. For example,
            specifying ``30m'' will set the expiration time on the SSH key for
            30 minutes from the current time. A value of 0 will result in no
            expiration time.
            See $ gcloud topic datetimes for information on duration formats.
