name: untag-resource
description: Removes tags from a resource.
flags:
    --resource-arn=!: The ARN of the resource.
    --tag-keys=!: A list of tag key names to remove from the resource.
documentation:
    command: Removes tags from a resource.
    flag:
        resource-arn: The ARN of the resource.
        tag-keys: A list of tag key names to remove from the resource. You don't specify the value. Both the key and its associated value are removed.
