name: undelete
description: Cancel deletion of a Google Cloud VMware Engine private cloud.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Location of the private cloud or cluster.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |+
        Unmark a VMware Engine private cloud that was previously marked for deletion by `gcloud vmware private-clouds delete`.

    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        location: |-
            Location of the private cloud or cluster.
            +
            To set the `location` attribute:
            * provide the argument `private_cloud` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/zone`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
