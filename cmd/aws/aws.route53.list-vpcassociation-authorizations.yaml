name: list-vpcassociation-authorizations
description: Gets a list of the VPCs that were created by other accounts and that can be associated with a specified hosted zone because you've submitted one or more `CreateVPCAssociationAuthorization` requests.
flags:
    --hosted-zone-id=!: The ID of the hosted zone for which you want a list of VPCs that can be associated with the hosted zone.
    --max-results=: '*Optional*: An integer that specifies the maximum number of VPCs that you want Amazon Route 53 to return.'
    --next-token=: '*Optional*: If a response includes a `NextToken` element, there are more VPCs that can be associated with the specified hosted zone.'
documentation:
    command: |-
        Gets a list of the VPCs that were created by other accounts and that can be associated with a specified hosted zone because you've submitted one or more `CreateVPCAssociationAuthorization` requests.

        The response includes a `VPCs` element with a `VPC` child element for each VPC that can be associated with the hosted zone.
    flag:
        hosted-zone-id: The ID of the hosted zone for which you want a list of VPCs that can be associated with the hosted zone.
        max-results: '*Optional*: An integer that specifies the maximum number of VPCs that you want Amazon Route 53 to return. If you don''t specify a value for `MaxResults`, Route 53 returns up to 50 VPCs per page.'
        next-token: '*Optional*: If a response includes a `NextToken` element, there are more VPCs that can be associated with the specified hosted zone. To get the next page of results, submit another request, and include the value of `NextToken` from the response in the `nexttoken` parameter in another `ListVPCAssociationAuthorizations` request.'
