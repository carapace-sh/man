name: delete
description: Delete Package Rollouts Fleet Package.
flags:
    --force: If true, force deletion of any child resources.
    --location=: Google Cloud zone or region for the fleet-package.
    --no-force&: If true, force deletion of any child resources.
documentation:
    command: Delete Package Rollouts Fleet Package.
    flag:
        force: If true, force deletion of any child resources. Otherwise, attempting to delete a Fleet Package with children will fail.
        location: |-
            Google Cloud zone or region for the fleet-package.
            +
            To set the `location` attribute:
            * provide the argument `fleet_package` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `config_delivery/location`.
        no-force: If true, force deletion of any child resources. Otherwise, attempting to delete a Fleet Package with children will fail.
