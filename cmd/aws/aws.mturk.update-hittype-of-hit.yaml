name: update-hittype-of-hit
description: The `UpdateHITTypeOfHIT` operation allows you to change the HITType properties of a HIT.
flags:
    --hitid=!: The HIT to update.
    --hittype-id=!: The ID of the new HIT type.
documentation:
    command: The `UpdateHITTypeOfHIT` operation allows you to change the HITType properties of a HIT. This operation disassociates the HIT from its old HITType properties and associates it with the new HITType properties. The HIT takes on the properties of the new HITType in place of the old ones.
    flag:
        hitid: The HIT to update.
        hittype-id: The ID of the new HIT type.
