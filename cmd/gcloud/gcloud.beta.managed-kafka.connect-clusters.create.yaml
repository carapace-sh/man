name: create
description: '*(BETA)*  Create a Managed Service for Apache Kafka connect cluster.'
flags:
    --additional-subnet=: Additional subnet to make available to the Kafka Connect cluster.
    --async: Return immediately, without waiting for the operation in progress to
    --config-file=: The path to the JSON or YAML file containing the configuration that are overridden
    --configs=: Configuration for the connect cluster that are overridden from the cluster defaults.
    --cpu=!: The number of vCPUs to provision for the cluster.
    --dns-name=: DNS domain name from the subnet's network to be made visible to the Connect Cluster.
    --kafka-cluster=!: The resource path of the Kafka cluster to connect to, or the name of the Kafka cluster to
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: ID of the location of the Managed Service for Apache Kafka resource.
    --memory=!: The memory to provision for the cluster in bytes.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --primary-subnet=!: VPC subnet to make available to the Kafka Connect cluster.
    --secret=: Secrets to load into workers.
documentation:
    command: |
        *(BETA)*  Create a Managed Service for Apache Kafka connect cluster.
    flag:
        additional-subnet: |-
            Additional subnet to make available to the Kafka Connect cluster. Structured
            like: projects/{project}/regions/{region}/subnetworks/{subnet_id}.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        config-file: |-
            The path to the JSON or YAML file containing the configuration that are overridden
            from the cluster or connector defaults. This also supports inline JSON or YAML. Sets `config_file` value.
            +
            :::
            *Input Example:*
            +
            ```
            +
            --config-file=string
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --config-file=path_to_file.(yaml|json)
            +
            ```
        configs: |-
            Configuration for the connect cluster that are overridden from the cluster defaults.
            The key of the map is a Kafka topic property name, for example:
            `cleanup.policy=compact`,`compression.type=producer`.
        cpu: The number of vCPUs to provision for the cluster. The minimum is 3.
        dns-name: DNS domain name from the subnet's network to be made visible to the Connect Cluster.
        kafka-cluster: |-
            The resource path of the Kafka cluster to connect to, or the name of the Kafka cluster to
            connect to if the cluster is in the same project as the Connect cluster.
        labels: |-
            List of label KEY=VALUE pairs to add.
            Keys must start with a lowercase character and contain only hyphens (`-`),
            underscores (```_```), lowercase characters, and numbers. Values must contain only
            hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            ID of the location of the Managed Service for Apache Kafka resource. See
            https://cloud.google.com/managed-service-for-apache-kafka/docs/locations for a list of supported
            locations.
            +

            To set the `location` attribute:
            * provide the argument `connect_cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        memory: |-
            The memory to provision for the cluster in bytes. The value must be between 1 GiB and 8 GiB
            per vCPU.
            Ex. 1024Mi, 4Gi.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        primary-subnet: |-
            VPC subnet to make available to the Kafka Connect cluster. Structured
            like: projects/{project}/regions/{region}/subnetworks/{subnet_id}.
            The primary subnet is used to create a Private Service Connect (PSC) interface for the Kafka Connect workers.
            It must be located in the same region as the Connect cluster.
        secret: |-
            Secrets to load into workers. Exact SecretVersions from Secret Manager must
            be provided -- aliases are not supported. Up to 32 secrets may be loaded
            into one cluster.
            Format: projects/<project-id>/secrets/<secret-name>/versions/<version-id>
