name: create-grant
description: Creates a grant for the specified license.
flags:
    --allowed-operations=!: Allowed operations for the grant.
    --client-token=!: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --grant-name=!: Grant name.
    --home-region=!: Home Region of the grant.
    --license-arn=!: Amazon Resource Name (ARN) of the license.
    --principals=!: The grant principals.
    --tags=: Tags to add to the grant.
documentation:
    command: Creates a grant for the specified license. A grant shares the use of license entitlements with a specific Amazon Web Services account, an organization, or an organizational unit (OU). For more information, see [Granted licenses in License Manager](https://docs.aws.amazon.com/license-manager/latest/userguide/granted-licenses.html) in the *License Manager User Guide*.
    flag:
        allowed-operations: Allowed operations for the grant.
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        grant-name: Grant name.
        home-region: Home Region of the grant.
        license-arn: Amazon Resource Name (ARN) of the license.
        principals: |-
            The grant principals. You can specify one of the following as an Amazon Resource Name (ARN):

            - An Amazon Web Services account, which includes only the account specified.

            <!--THE END-->

            - An organizational unit (OU), which includes all accounts in the OU.

            <!--THE END-->

            - An organization, which will include all accounts across your organization.
        tags: Tags to add to the grant. For more information about tagging support in License Manager, see the [TagResource](https://docs.aws.amazon.com/license-manager/latest/APIReference/API_TagResource.html) operation.
