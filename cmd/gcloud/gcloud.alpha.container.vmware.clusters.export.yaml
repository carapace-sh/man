name: export
description: '*(ALPHA)*  Export an Anthos on VMware user cluster.'
hidden: true
flags:
    --destination=: Path to a YAML file where the configuration will be exported.
    --location=: Google Cloud location for the cluster.
documentation:
    command: '*(ALPHA)*  Export an Anthos on VMware user cluster.'
    flag:
        destination: |-
            Path to a YAML file where the configuration will be exported.
                      Alternatively, you may omit this flag to write to standard output. For a schema describing the export/import format, see:
                      $CLOUDSDKROOT/lib/googlecloudsdk/schemas/gkeonprem/v1/VmwareCluster.yaml.
        location: |-
            Google Cloud location for the cluster.
            +
            To set the `location` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_vmware/location`.
