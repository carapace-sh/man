name: list-tasks
description: Returns a list of the DataSync tasks you created.
flags:
    --filters=: You can use API filters to narrow down the list of resources returned by `ListTasks`.
    --max-results=: The maximum number of tasks to return.
    --next-token=: An opaque string that indicates the position at which to begin the next list of tasks.
documentation:
    command: Returns a list of the DataSync tasks you created.
    flag:
        filters: You can use API filters to narrow down the list of resources returned by `ListTasks`. For example, to retrieve all tasks on a specific source location, you can use `ListTasks` with filter name `LocationId` and `Operator Equals` with the ARN for the location.
        max-results: The maximum number of tasks to return.
        next-token: An opaque string that indicates the position at which to begin the next list of tasks.
