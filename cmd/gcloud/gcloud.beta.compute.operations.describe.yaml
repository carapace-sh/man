name: describe
description: '*(BETA)*  Describe a Compute Engine operation.'
flags:
    --global: If set, the operation is global.
    --no-global&: If set, the operation is global.
    --region=: Region of the operation to describe.
    --zone=: Zone of the operation to describe.
documentation:
    command: |
        *(BETA)*  *gcloud beta compute operations describe* displays all data associated with a Compute Engine
        operation in a project.
    flag:
        global: If set, the operation is global.
        no-global: If set, the operation is global.
        region: Region of the operation to describe. Overrides the default *compute/region* property value for this command invocation.
        zone: Zone of the operation to describe. Overrides the default *compute/zone* property value for this command invocation.
