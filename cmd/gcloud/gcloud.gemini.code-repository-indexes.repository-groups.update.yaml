name: update
description: Update the configuration of a repository group.
flags:
    --add-repositories=: Add new value to repositories list.
    --async: Return immediately, without waiting for the operation in progress to
    --clear-labels: Clear labels value and set to empty map.
    --clear-repositories: Clear repositories value and set to empty list.
    --code-repository-index=: The codeRepositoryIndex id of the repositoryGroup resource.
    --labels=: Set labels to new value.
    --location=: The location id of the repositoryGroup resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-labels&: Clear labels value and set to empty map.
    --no-clear-repositories&: Clear repositories value and set to empty list.
    --remove-labels=: Remove existing value from map labels.
    --remove-repositories=: Remove existing value from repositories list.
    --repositories=: Set repositories to new value.
    --request-id=: An optional request ID to identify requests.
    --update-labels=: Update labels value or add key value pair.
documentation:
    command: Update the configuration of a repository group.
    flag:
        add-repositories: |-
            Add new value to repositories list. List of repositories to group.
            +
            *branchPattern*:::
            The Git branch pattern used for indexing in RE2 syntax.
            See https://github.com/google/re2/wiki/syntax for syntax.
            +
            *resource*:::
            The DeveloperConnect repository full resource name, relative resource name
            or resource URL to be indexed.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --add-repositories=branchPattern=string,resource=string --add-repositories=branchPattern=string,resource=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --add-repositories='[{"branchPattern": "string", "resource": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --add-repositories=path_to_file.(yaml|json)
            +
            ```
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        clear-labels: Clear labels value and set to empty map.
        clear-repositories: Clear repositories value and set to empty list.
        code-repository-index: |-
            The codeRepositoryIndex id of the repositoryGroup resource.
            +
            To set the `code-repository-index` attribute:
            * provide the argument `repository_group` on the command line with a fully specified name;
            * provide the argument `--code-repository-index` on the command line.
        labels: |-
            Set labels to new value. Labels as key value pairs.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: |-
            The location id of the repositoryGroup resource.
            +
            To set the `location` attribute:
            * provide the argument `repository_group` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-labels: Clear labels value and set to empty map.
        no-clear-repositories: Clear repositories value and set to empty list.
        remove-labels: |-
            Remove existing value from map labels. Sets `remove_labels` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-labels=string,string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-labels=["string"]
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-labels=path_to_file.(yaml|json)
            +
            ```
        remove-repositories: |-
            Remove existing value from repositories list. List of repositories to group.
            +
            *branchPattern*:::
            The Git branch pattern used for indexing in RE2 syntax.
            See https://github.com/google/re2/wiki/syntax for syntax.
            +
            *resource*:::
            The DeveloperConnect repository full resource name, relative resource name
            or resource URL to be indexed.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-repositories=branchPattern=string,resource=string --remove-repositories=branchPattern=string,resource=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-repositories='[{"branchPattern": "string", "resource": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-repositories=path_to_file.(yaml|json)
            +
            ```
        repositories: |-
            Set repositories to new value. List of repositories to group.
            +
            *branchPattern*:::
            The Git branch pattern used for indexing in RE2 syntax.
            See https://github.com/google/re2/wiki/syntax for syntax.
            +
            *resource*:::
            The DeveloperConnect repository full resource name, relative resource name
            or resource URL to be indexed.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --repositories=branchPattern=string,resource=string --repositories=branchPattern=string,resource=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --repositories='[{"branchPattern": "string", "resource": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --repositories=path_to_file.(yaml|json)
            +
            ```
        request-id: |-
            An optional request ID to identify requests. Specify a unique request ID
            so that if you must retry your request, the server will know to ignore
            the request if it has already been completed. The server will guarantee
            that for at least 60 minutes since the first request.
            +
            The request ID must be a valid UUID with the exception that zero UUID is
            not supported (00000000-0000-0000-0000-000000000000).
        update-labels: |-
            Update labels value or add key value pair. Labels as key value pairs.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --update-labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --update-labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --update-labels=path_to_file.(yaml|json)
            +
            ```
