    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --selective-auth=: Updates selective authentication for the trust.
    --trust-id=!: Identifier of the trust relationship.
completion:
    flag:
        selective-auth:
            - Enabled
            - Disabled
documentation:
    command: Updates the trust that has been set up between your Managed Microsoft AD directory and an self-managed Active Directory.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
