name: export-automated-reasoning-policy-version
description: Exports the policy definition for an Automated Reasoning policy version.
flags:
    --policy-arn=!: The Amazon Resource Name (ARN) of the Automated Reasoning policy to export.
documentation:
    command: Exports the policy definition for an Automated Reasoning policy version. Returns the complete policy definition including rules, variables, and custom variable types in a structured format.
    flag:
        policy-arn: The Amazon Resource Name (ARN) of the Automated Reasoning policy to export. Can be either the unversioned ARN for the draft policy or a versioned ARN for a specific policy version.
