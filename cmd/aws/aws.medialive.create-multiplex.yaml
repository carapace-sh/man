name: create-multiplex
description: Create a new multiplex.
flags:
    --availability-zones=!: A list of availability zones for the multiplex.
    --multiplex-settings=!: Configuration for a multiplex event.
    --name=!: Name of multiplex.
    --request-id=!: Unique request ID.
    --tags=: A collection of key-value pairs.
documentation:
    command: Create a new multiplex.
    flag:
        availability-zones: A list of availability zones for the multiplex. You must specify exactly two.
        multiplex-settings: Configuration for a multiplex event.
        name: Name of multiplex.
        request-id: Unique request ID. This prevents retries from creating multiple resources.
        tags: A collection of key-value pairs.
