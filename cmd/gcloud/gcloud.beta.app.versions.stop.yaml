name: stop
description: '*(BETA)*  Stop serving specified versions.'
flags:
    --service=: If specified, only stop versions from the given service.
documentation:
    command: |-
        *(BETA)*  This command stops serving the specified versions. It may only be used if the
        scaling module for your service has been set to manual.
    flag:
        service: If specified, only stop versions from the given service.
