name: create
description: Create a Cloud NetApp Active Directory.
flags:
    --administrators=: Members of the Active Directory built-in Administrators group.
    --async: Return immediately, without waiting for the operation in progress to
    --backup-operators=: Users to be added to the Built-in Backup Operator Active Directory group.
    --description=: A description of the Cloud NetApp Active Directory
    --dns=!: A comma separated list of DNS server IP addresses for the Active Directory domain.
    --domain=!: The Active Directory domain.
    --enable-aes=: The Boolean value indiciating whether AES encryption will be enabled for SMB communication.
    --enable-ldap-signing=: Boolean flag that specifies whether or not LDAP traffic needs to be signed.
    --encrypt-dc-connections=: Boolean flag that specifies whether traffic between SMB server to Domain Controller (DC) will be encrypted.
    --kdc-hostname=: Name of the Active Directory machine.
    --kdc-ip=: KDC server IP address for the Active Directory machine.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location of the active_directory.
    --net-bios-prefix=!: NetBIOS prefix name of the server.
    --nfs-users-with-ldap=: Boolean flag that allows access to local users and LDAP users.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --organizational-unit=: The Organizational Unit (OU) within the Windows Active Directory the user belongs to.
    --password=!: Password of the Active Directory domain administrator.
    --security-operators=: Domain users to be given the Security privilege.
    --site=: The Active Directory site the service          will limit Domain Controller discovery to.
    --username=!: Username of the Active Directory domain administrator.
documentation:
    command: |
        Creates an AD (Active Directory) config for Cloud NetApp Volumes.
    flag:
        administrators: Members of the Active Directory built-in Administrators group.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        backup-operators: Users to be added to the Built-in Backup Operator Active Directory group.
        description: A description of the Cloud NetApp Active Directory
        dns: A comma separated list of DNS server IP addresses for the Active Directory domain.
        domain: The Active Directory domain.
        enable-aes: The Boolean value indiciating whether AES encryption will be enabled for SMB communication.
        enable-ldap-signing: Boolean flag that specifies whether or not LDAP traffic needs to be signed.
        encrypt-dc-connections: Boolean flag that specifies whether traffic between SMB server to Domain Controller (DC) will be encrypted.
        kdc-hostname: Name of the Active Directory machine.
        kdc-ip: KDC server IP address for the Active Directory machine.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location of the active_directory.
            +
            To set the `location` attribute:
            * provide the argument `active_directory` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
        net-bios-prefix: NetBIOS prefix name of the server.
        nfs-users-with-ldap: Boolean flag that allows access to local users and LDAP users. If access is needed only for LDAP users, it has to be disabled.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        organizational-unit: The Organizational Unit (OU) within the Windows Active Directory the user belongs to.
        password: Password of the Active Directory domain administrator.
        security-operators: Domain users to be given the Security privilege.
        site: The Active Directory site the service          will limit Domain Controller discovery to.
        username: Username of the Active Directory domain administrator.
