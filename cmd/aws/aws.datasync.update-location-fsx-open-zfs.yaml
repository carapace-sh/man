name: update-location-fsx-open-zfs
description: Modifies the following configuration parameters of the Amazon FSx for OpenZFS transfer location that you're using with DataSync.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --location-arn=!: Specifies the Amazon Resource Name (ARN) of the FSx for OpenZFS transfer location that you're updating.
    --protocol=: ""
    --subdirectory=: Specifies a subdirectory in the location's path that must begin with `/fsx`.
documentation:
    command: |-
        Modifies the following configuration parameters of the Amazon FSx for OpenZFS transfer location that you're using with DataSync.

        For more information, see [Configuring DataSync transfers with FSx for OpenZFS](https://docs.aws.amazon.com/datasync/latest/userguide/create-openzfs-location.html).

        Request parameters related to `SMB` aren't supported with the `UpdateLocationFsxOpenZfs` operation.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        location-arn: Specifies the Amazon Resource Name (ARN) of the FSx for OpenZFS transfer location that you're updating.
        protocol: ""
        subdirectory: Specifies a subdirectory in the location's path that must begin with `/fsx`. DataSync uses this subdirectory to read or write data (depending on whether the file system is a source or destination location).
