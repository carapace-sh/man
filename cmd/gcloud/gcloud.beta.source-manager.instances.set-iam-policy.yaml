name: set-iam-policy
description: '*(BETA)*  Set the IAM policy for a Secure Source Manager instance.'
flags:
    --region=: Secure Source Manager location.
documentation:
    command: '*(BETA)*  Set the IAM policy for a Secure Source Manager instance.'
    flag:
        region: |-
            Secure Source Manager location.
            +
            To set the `region` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
