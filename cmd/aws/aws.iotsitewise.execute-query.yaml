    --query-statement=!: The IoT SiteWise query statement.
documentation:
    command: Run SQL queries to retrieve metadata and time-series data from asset models, assets, measurements, metrics, transforms, and aggregates.
    flag:
        client-token: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request. Don't reuse this client token if a new idempotent request is required.
        max-results: |-
            The maximum number of results to return at one time.

            - Minimum is 1
            - Maximum is 20000
