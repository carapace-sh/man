name: get-anomalies
description: Retrieves all of the cost anomalies detected on your account during the time period that's specified by the `DateInterval` object.
flags:
    --date-interval=!: Assigns the start and end dates for retrieving cost anomalies.
    --feedback=: Filters anomaly results by the feedback field on the anomaly object.
    --max-results=: The number of entries a paginated response contains.
    --monitor-arn=: Retrieves all of the cost anomalies detected for a specific cost anomaly monitor Amazon Resource Name (ARN).
    --next-page-token=: The token to retrieve the next set of results.
    --total-impact=: Filters anomaly results by the total impact field on the anomaly object.
completion:
    flag:
        feedback:
            - "YES"
            - "NO"
            - PLANNED_ACTIVITY
documentation:
    command: Retrieves all of the cost anomalies detected on your account during the time period that's specified by the `DateInterval` object. Anomalies are available for up to 90 days.
    flag:
        date-interval: Assigns the start and end dates for retrieving cost anomalies. The returned anomaly object will have an `AnomalyEndDate` in the specified time range.
        feedback: Filters anomaly results by the feedback field on the anomaly object.
        max-results: The number of entries a paginated response contains.
        monitor-arn: Retrieves all of the cost anomalies detected for a specific cost anomaly monitor Amazon Resource Name (ARN).
        next-page-token: The token to retrieve the next set of results. Amazon Web Services provides the token when the response from a previous call has more results than the maximum page size.
        total-impact: Filters anomaly results by the total impact field on the anomaly object. For example, you can filter anomalies `GREATER_THAN 200.00` to retrieve anomalies, with an estimated dollar impact greater than 200.
