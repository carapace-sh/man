name: get-launch
description: Returns the details about one launch.
flags:
    --launch=!: The name of the launch that you want to see the details of.
    --project=!: The name or ARN of the project that contains the launch.
documentation:
    command: Returns the details about one launch. You must already know the launch name. To retrieve a list of launches in your account, use [ListLaunches](https://docs.aws.amazon.com/cloudwatchevidently/latest/APIReference/API_ListLaunches.html).
    flag:
        launch: The name of the launch that you want to see the details of.
        project: The name or ARN of the project that contains the launch.
