name: create-proxy
description: Creates an Network Firewall [Proxy]()
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --listener-properties=:
        description: Listener properties for HTTP and HTTPS traffic.
        nargs: -1
    --nat-gateway-id=!: A unique identifier for the NAT gateway to use with proxy resources.
    --proxy-configuration-arn=: The Amazon Resource Name (ARN) of a proxy configuration.
    --proxy-configuration-name=: The descriptive name of the proxy configuration.
    --proxy-name=!: The descriptive name of the proxy.
    --tags=:
        description: The key:value pairs to associate with the resource.
        nargs: -1
    --tls-intercept-properties=!: TLS decryption on traffic to filter on attributes in the HTTP header.
documentation:
    command: |-
        Creates an Network Firewall [Proxy]()

        Attaches a Proxy configuration to a NAT Gateway.

        To manage a proxy's tags, use the standard Amazon Web Services resource tagging operations, [ListTagsForResource](), [TagResource](), and [UntagResource]().

        To retrieve information about proxies, use [ListProxies]() and [DescribeProxy]().
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        listener-properties: Listener properties for HTTP and HTTPS traffic.
        nat-gateway-id: A unique identifier for the NAT gateway to use with proxy resources.
        proxy-configuration-arn: |-
            The Amazon Resource Name (ARN) of a proxy configuration.

            You must specify the ARN or the name, and you can specify both.
        proxy-configuration-name: |-
            The descriptive name of the proxy configuration. You can't change the name of a proxy configuration after you create it.

            You must specify the ARN or the name, and you can specify both.
        proxy-name: The descriptive name of the proxy. You can't change the name of a proxy after you create it.
        tags: The key:value pairs to associate with the resource.
        tls-intercept-properties: TLS decryption on traffic to filter on attributes in the HTTP header.
