name: browse
description: '*(BETA)*  Open the current app in a web browser.'
flags:
    --launch-browser: Launch a browser if possible.
    --no-launch-browser&: Launch a browser if possible.
    --service=: The service that should be opened.
documentation:
    command: |
        *(BETA)*  Open the current app in a web browser.
    flag:
        launch-browser: Launch a browser if possible. When disabled, only displays the URL. Enabled by default, use *--no-launch-browser* to disable.
        no-launch-browser: Launch a browser if possible. When disabled, only displays the URL.
        service: The service that should be opened. If not specified, use the default service. May be used in conjunction with `--version`.
