name: describe-fleet-location-attributes
description: Retrieves information on a fleet's remote locations, including life-cycle status and any suspended fleet activity.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --fleet-id=!: A unique identifier for the fleet to retrieve remote locations for.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --limit=: The maximum number of results to return.
    --locations=: A list of fleet locations to retrieve information for.
    --next-token=: A token that indicates the start of the next sequential page of results.
documentation:
    command: |-
        Retrieves information on a fleet's remote locations, including life-cycle status and any suspended fleet activity.

        This operation can be used in the following ways:

        - To get data for specific locations, provide a fleet identifier and a list of locations. Location data is returned in the order that it is requested.
        - To get data for all locations, provide a fleet identifier only. Location data is returned in no particular order.

        When requesting attributes for multiple locations, use the pagination parameters to retrieve results as a set of sequential pages.

        If successful, a `LocationAttributes` object is returned for each requested location. If the fleet does not have a requested location, no information is returned. This operation does not return the home Region. To get information on a fleet's home Region, call `DescribeFleetAttributes`.

        **Learn more**

        [Setting up Amazon GameLift Servers fleets](https://docs.aws.amazon.com/gamelift/latest/developerguide/fleets-intro.html)

        [Amazon GameLift Servers service locations](https://docs.aws.amazon.com/gamelift/latest/developerguide/gamelift-regions.html) for managed hosting
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        fleet-id: A unique identifier for the fleet to retrieve remote locations for. You can use either the fleet ID or ARN value.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        limit: The maximum number of results to return. Use this parameter with `NextToken` to get results as a set of sequential pages. This limit is not currently enforced.
        locations: A list of fleet locations to retrieve information for. Specify locations in the form of an Amazon Web Services Region code, such as `us-west-2`.
        next-token: A token that indicates the start of the next sequential page of results. Use the token that is returned with a previous call to this operation. To start at the beginning of the result set, do not specify a value.
