name: delete
description: Delete a Compute Engine organization firewall policy.
flags:
    --organization=: Organization in which the organization firewall policy is to be deleted.
documentation:
    command: |-
        *gcloud compute firewall-policies delete* is used to delete organization firewall policies. An organization
        firewall policy is a set of rules that controls access to various resources.
    flag:
        organization: Organization in which the organization firewall policy is to be deleted. Must be set if FIREWALL_POLICY is the short name.
