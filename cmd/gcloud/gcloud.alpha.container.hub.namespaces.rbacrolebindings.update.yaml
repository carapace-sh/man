name: update
description: '*(ALPHA)*  *(REMOVED)*  Update a fleet namespace RBAC RoleBinding.'
hidden: true
flags:
    --group=: Group for the RBACRoleBinding to update to.
    --location=: Location for the rbacrolebinding.
    --namespace=: Name of the rbacrolebinding.
    --role=: Role for the RBACRoleBinding to update to.
    --user=: User for the RBACRoleBinding to update to.
completion:
    flag:
        role:
            - admin
            - edit
            - view
documentation:
    command: |-
        *(ALPHA)*  *(REMOVED)*  Update a fleet namespace RBAC RoleBinding.

        This command has been removed as of version 447.0.0. Use `gcloud fleet scopes rbacrolebindings update` instead.

        This command can fail for the following reasons:
        * The RoleBinding does not exist in the project.
        * The caller does not have permission to access the RoleBinding.

        ## EXAMPLES

        To update the RBAC RoleBinding `RBRB` in namespace `NAMESPACE` in the active
        project to the `viewer` role:

          $ gcloud alpha container hub namespaces rbacrolebindings update RBRB --namespace=NAMESPACE --role=viewer

        To update the RBAC RoleBinding `RBRB` in namespace `NAMESPACE` in the active
        project to the user `someone@google.com`:

          $ gcloud alpha container hub namespaces rbacrolebindings update RBRB --namespace=NAMESPACE --user=someone@google.com
    flag:
        group: Group for the RBACRoleBinding to update to.
        location: |-
            Location for the rbacrolebinding.
            +
            To set the `location` attribute:
            * provide the argument `NAME` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkehub/location`.
        namespace: |-
            Name of the rbacrolebinding.
            +
            To set the `namespace` attribute:
            * provide the argument `NAME` on the command line with a fully specified name;
            * provide the argument `--namespace` on the command line.
        role: 'Role for the RBACRoleBinding to update to. _ROLE_ must be one of: *admin*, *edit*, *view*.'
        user: User for the RBACRoleBinding to update to.
