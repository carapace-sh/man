name: create-vpc-endpoint-service-configuration
description: Creates a VPC endpoint service to which service consumers (Amazon Web Services accounts, users, and IAM roles) can connect.
flags:
    --acceptance-required: Indicates whether requests from service consumers to create an endpoint to your service must be accepted manually.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --gateway-load-balancer-arns=:
        description: The Amazon Resource Names (ARNs) of the Gateway Load Balancers.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --network-load-balancer-arns=:
        description: The Amazon Resource Names (ARNs) of the Network Load Balancers.
        nargs: -1
    --no-acceptance-required: Indicates whether requests from service consumers to create an endpoint to your service must be accepted manually.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --private-dns-name=: (Interface endpoint configuration) The private DNS name to assign to the VPC endpoint service.
    --supported-ip-address-types=:
        description: The supported IP address types.
        nargs: -1
    --supported-regions=:
        description: The Regions from which service consumers can access the service.
        nargs: -1
    --tag-specifications=:
        description: The tags to associate with the service.
        nargs: -1
documentation:
    command: |-
        Creates a VPC endpoint service to which service consumers (Amazon Web Services accounts, users, and IAM roles) can connect.

        Before you create an endpoint service, you must create one of the following for your service:

        - A [Network Load Balancer](https://docs.aws.amazon.com/elasticloadbalancing/latest/network/). Service consumers connect to your service using an interface endpoint.
        - A [Gateway Load Balancer](https://docs.aws.amazon.com/elasticloadbalancing/latest/gateway/). Service consumers connect to your service using a Gateway Load Balancer endpoint.

        If you set the private DNS name, you must prove that you own the private DNS domain name.

        For more information, see the [Amazon Web Services PrivateLink Guide](https://docs.aws.amazon.com/vpc/latest/privatelink/).
    flag:
        acceptance-required: Indicates whether requests from service consumers to create an endpoint to your service must be accepted manually.
        cli-input-json: |-
