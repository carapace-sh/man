name: accept-predictions
description: Accepts automatically generated business-friendly metadata for your Amazon DataZone assets.
flags:
    --accept-choices=:
        description: Specifies the prediction (aka, the automatically generated piece of metadata) and the target (for example, a column name) that can be accepted.
        nargs: -1
    --accept-rule=: Specifies the rule (or the conditions) under which a prediction can be accepted.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier to ensure idempotency of the request.
    --domain-identifier=!: The identifier of the Amazon DataZone domain.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identifier=!: The identifier of the asset.
    --revision=: The revision that is to be made to the asset.
documentation:
    command: Accepts automatically generated business-friendly metadata for your Amazon DataZone assets.
    flag:
        accept-choices: Specifies the prediction (aka, the automatically generated piece of metadata) and the target (for example, a column name) that can be accepted.
        accept-rule: Specifies the rule (or the conditions) under which a prediction can be accepted.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier to ensure idempotency of the request. This field is automatically populated if not provided.
        domain-identifier: The identifier of the Amazon DataZone domain.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        identifier: The identifier of the asset.
        revision: The revision that is to be made to the asset.
