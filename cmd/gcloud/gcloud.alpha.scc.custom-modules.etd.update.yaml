name: update
description: '*(ALPHA)*  Update an Event Threat Detection custom module.'
flags:
    --custom-config-from-file=: Path to a JSON file that contains the configuration for the Event Threat Detection custom module.
    --enablement-state=: Sets the enablement state of the Event Threat Detection custom module.
    --folder=: Folder where the Event Threat Detection custom module resides.
    --organization=: Organization where the Event Threat Detection custom module resides.
    --update-mask=: 'Optional: If left unspecified (default), an update mask is automatically created using the'
completion:
    flag:
        enablement-state:
            - disabled
            - enabled
            - enablement-state-unspecified
            - inherited
documentation:
    command: '*(ALPHA)*  Update an Event Threat Detection custom module.'
    flag:
        custom-config-from-file: Path to a JSON file that contains the configuration for the Event Threat Detection custom module. Use a full or relative path to a local file containing the value of custom_config.
        enablement-state: 'Sets the enablement state of the Event Threat Detection custom module. Valid options are `ENABLED`, `DISABLED`, and `INHERITED`. _ENABLEMENT_STATE_ must be one of: *disabled*, *enabled*, *enablement-state-unspecified*, *inherited*.'
        folder: Folder where the Event Threat Detection custom module resides. Formatted as `folders/456` or just `456`.
        organization: Organization where the Event Threat Detection custom module resides. Formatted as `organizations/123` or just `123`.
        update-mask: |-
            Optional: If left unspecified (default), an update mask is automatically created using the
            flags specified in the command and only those values are updated.
