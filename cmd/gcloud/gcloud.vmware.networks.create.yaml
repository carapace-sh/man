name: create
description: Create a Google Cloud VMware Engine network.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: Text describing the VMware Engine network.
    --location=: The resource name of the location.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --type=!: Type of the VMware Engine network.
completion:
    flag:
        type:
            - LEGACY
            - STANDARD
documentation:
    command: |
        Create a VMware Engine network. VMware Engine network creation is considered finished when the VMware Engine network is in ACTIVE state. Check the progress of a VMware Engine network creation using `gcloud vmware networks list`.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        description: Text describing the VMware Engine network.
        location: |-
            The resource name of the location.
            +
            To set the `location` attribute:
            * provide the argument `vmware_engine_network` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set location as 'global' (default) or a region.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        type: |-
            Type of the VMware Engine network. _TYPE_ must be one of:
            +
            *LEGACY*::: Network type used by private clouds created in projects without a network of type STANDARD. This network type is only used for new PCs in existing projects that continue to use LEGACY network. A VMware Engine network of type LEGACY is a regional resource.
            *STANDARD*::: Standard network type used for private cloud connectivity. A VMware Engine network of type STANDARD is a global resource.
            :::
            +
