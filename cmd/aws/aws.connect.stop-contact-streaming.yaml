name: stop-contact-streaming
description: Ends message streaming on a specified contact.
flags:
    --contact-id=!: The identifier of the contact.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --streaming-id=!: The identifier of the streaming configuration enabled.
documentation:
    command: Ends message streaming on a specified contact. To restart message streaming on that contact, call the [StartContactStreaming](https://docs.aws.amazon.com/connect/latest/APIReference/API_StartContactStreaming.html) API.
    flag:
        contact-id: The identifier of the contact. This is the identifier of the contact that is associated with the first interaction with the contact center.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        streaming-id: The identifier of the streaming configuration enabled.
