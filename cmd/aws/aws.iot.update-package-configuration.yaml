name: update-package-configuration
description: Updates the software package configuration.
flags:
    --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
    --version-update-by-jobs-config=: Configuration to manage job's package version reporting.
documentation:
    command: |-
        Updates the software package configuration.

        Requires permission to access the [UpdatePackageConfiguration](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) and [iam:PassRole](https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_passrole.html) actions.
    flag:
        client-token: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request. Don't reuse this client token if a new idempotent request is required.
        version-update-by-jobs-config: Configuration to manage job's package version reporting. This updates the thing's reserved named shadow that the job targets.
