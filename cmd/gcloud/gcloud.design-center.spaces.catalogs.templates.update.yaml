name: update
description: Update a catalog template.
flags:
    --catalog=: The catalog id of the template resource.
    --description=: The catalog template description.
    --display-name=: The display name of a catalog template.
    --location=: The location id of the template resource.
    --space=: The space id of the template resource.
    --template-category=: The category of the ADC template.
    --type=: The Application Design Center assembly template type.
completion:
    flag:
        template-category:
            - application-template
            - component-template
            - composite-solution-template
            - instance-template
        type:
            - application
            - asset
            - composite-application-template
            - helm-application
            - helm-chart
            - jss-solution
            - service
            - service-data-source
            - standard-application-template
            - workload
documentation:
    command: Update a catalog template.
    flag:
        catalog: |-
            The catalog id of the template resource.
            +
            To set the `catalog` attribute:
            * provide the argument `template` on the command line with a fully specified name;
            * provide the argument `--catalog` on the command line.
        description: The catalog template description.
        display-name: The display name of a catalog template.
        location: |-
            The location id of the template resource.
            +
            To set the `location` attribute:
            * provide the argument `template` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        space: |-
            The space id of the template resource.
            +
            To set the `space` attribute:
            * provide the argument `template` on the command line with a fully specified name;
            * provide the argument `--space` on the command line.
        template-category: |-
            The category of the ADC template. _TEMPLATE_CATEGORY_ must be one of:
            +
            *application-template*::: ADC application template.
            *component-template*::: ADC component template.
            *composite-solution-template*::: Imported as a single, complex unit without disassembling into components.
            *instance-template*::: ADC application instance.
            :::
            +
        type: |-
            The Application Design Center assembly template type. _TYPE_ must be one of:
            +
            *application*::: An application template is a composition of workload/service/asset
            templates.
            *asset*::: An asset template can be used to provision resources that are not services
            or workloads.
            *composite-application-template*::: A composite application template.
            *helm-application*::: A helm chart based template.
            *helm-chart*::: A helm chart based template.
            *jss-solution*::: A Jumpstart Solution template.
            *service*::: A service template is an App Hub service.
            *service-data-source*::: A service data source template.
            *standard-application-template*::: A standard application template.
            *workload*::: A workload template is an App Hub workload.
            :::
            +
