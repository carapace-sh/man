name: create-configuration
description: Creates a new MSK configuration.
flags:
    --description=: The description of the configuration.
    --kafka-versions=: The versions of Apache Kafka with which you can use this MSK configuration.
    --name=!: The name of the configuration.
    --server-properties=!: Contents of the server.properties file.
documentation:
    command: Creates a new MSK configuration.
    flag:
        description: The description of the configuration.
        kafka-versions: The versions of Apache Kafka with which you can use this MSK configuration.
        name: The name of the configuration.
        server-properties: Contents of the server.properties file. When using the API, you must ensure that the contents of the file are base64 encoded. When using the AWS Management Console, the SDK, or the AWS CLI, the contents of server.properties can be in plaintext.
