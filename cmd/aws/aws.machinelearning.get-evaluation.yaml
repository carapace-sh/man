name: get-evaluation
description: Returns an `Evaluation` that includes metadata as well as the current status of the `Evaluation`.
flags:
    --evaluation-id=!: The ID of the `Evaluation` to retrieve.
documentation:
    command: Returns an `Evaluation` that includes metadata as well as the current status of the `Evaluation`.
    flag:
        evaluation-id: The ID of the `Evaluation` to retrieve. The evaluation of each `MLModel` is recorded and cataloged. The ID provides the means to access the information.
