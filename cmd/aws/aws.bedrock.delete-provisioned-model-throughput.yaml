name: delete-provisioned-model-throughput
description: Deletes a Provisioned Throughput.
flags:
    --provisioned-model-id=!: The Amazon Resource Name (ARN) or name of the Provisioned Throughput.
documentation:
    command: Deletes a Provisioned Throughput. You can't delete a Provisioned Throughput before the commitment term is over. For more information, see [Provisioned Throughput](https://docs.aws.amazon.com/bedrock/latest/userguide/prov-throughput.html) in the [Amazon Bedrock User Guide](https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-service.html).
    flag:
        provisioned-model-id: The Amazon Resource Name (ARN) or name of the Provisioned Throughput.
