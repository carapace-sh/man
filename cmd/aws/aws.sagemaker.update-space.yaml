name: update-space
description: Updates the settings of a space.
flags:
    --domain-id=!: The ID of the associated domain.
    --space-display-name=: The name of the space that appears in the Amazon SageMaker Studio UI.
    --space-name=!: The name of the space.
    --space-settings=: A collection of space settings.
documentation:
    command: |-
        Updates the settings of a space.

        You can't edit the app type of a space in the `SpaceSettings`.
    flag:
        domain-id: The ID of the associated domain.
        space-display-name: The name of the space that appears in the Amazon SageMaker Studio UI.
        space-name: The name of the space.
        space-settings: A collection of space settings.
