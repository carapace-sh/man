name: create
description: Create an Artifact Registry rule.
flags:
    --action=!: The action the rule would make, can only be DENY or ALLOW.
    --condition=: The CEL expression for the rule.
    --location=: Location of the rule.
    --operation=: The operation the rule applies to.
    --package=: The package the rule applies to.
    --repository=: The repository associated with the rule.
completion:
    flag:
        action:
            - allow
            - deny
        operation:
            - download
documentation:
    command: |
        Create a new Artifact Registry rule.

        This command can fail for the following reasons:
          * A rule with the same name already exists.
          * The active account does not have permission to create repositories.
          * A rule with given package already exists.
    flag:
        action: 'The action the rule would make, can only be DENY or ALLOW. _ACTION_ must be one of: *allow*, *deny*.'
        condition: The CEL expression for the rule.
        location: |-
            Location of the rule. Overrides the default artifacts/location property value
            for this command invocation. To configure the default location, use the command:
            gcloud config set artifacts/location.
            +

            To set the `location` attribute:
            * provide the argument `rule` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `artifacts/location`.
        operation: 'The operation the rule applies to. _OPERATION_ must be (only one value is supported): *download*.'
        package: The package the rule applies to. Empty means the rule is set for the entire repository.
        repository: |-
            The repository associated with the rule. Overrides the default artifacts/repository property value
            for this command invocation. To configure the default repository, use the command:
            gcloud config set artifacts/repository.
            +

            To set the `repository` attribute:
            * provide the argument `rule` on the command line with a fully specified name;
            * provide the argument `--repository` on the command line;
            * set the property `artifacts/repository`.
