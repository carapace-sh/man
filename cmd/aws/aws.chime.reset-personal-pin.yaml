name: reset-personal-pin
description: Resets the personal meeting PIN for the specified user on an Amazon Chime account.
flags:
    --account-id=!: The Amazon Chime account ID.
    --user-id=!: The user ID.
documentation:
    command: Resets the personal meeting PIN for the specified user on an Amazon Chime account. Returns the [User]() object with the updated personal meeting PIN.
    flag:
        account-id: The Amazon Chime account ID.
        user-id: The user ID.
