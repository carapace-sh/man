name: delete-rotation
description: Deletes a rotation from the system.
flags:
    --rotation-id=!: The Amazon Resource Name (ARN) of the on-call rotation to delete.
documentation:
    command: Deletes a rotation from the system. If a rotation belongs to more than one on-call schedule, this operation deletes it from all of them.
    flag:
        rotation-id: The Amazon Resource Name (ARN) of the on-call rotation to delete.
