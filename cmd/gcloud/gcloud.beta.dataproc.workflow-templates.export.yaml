name: export
description: '*(BETA)*  Export a workflow template.'
flags:
    --destination=: Path to a YAML file where the configuration will be exported.
    --region=: Dataproc region for the template.
documentation:
    command: |-
        *(BETA)*  Exports a workflow template's configuration to a file.
        This configuration can be imported at a later time.
    flag:
        destination: |-
            Path to a YAML file where the configuration will be exported.
                      Alternatively, you may omit this flag to write to standard output.
        region: |-
            Dataproc region for the template. Each Dataproc region constitutes an independent resource namespace constrained to deploying instances into Compute Engine zones inside the region. Overrides the default `dataproc/region` property value for this command invocation.
            +
            To set the `region` attribute:
            * provide the argument `template` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `dataproc/region`.
