name: update-monitor
description: Updates the `aggregationPeriod` for a monitor.
flags:
    --aggregation-period=!: The aggregation time, in seconds, to change to.
    --monitor-name=!: The name of the monitor to update.
documentation:
    command: Updates the `aggregationPeriod` for a monitor. Monitors support an `aggregationPeriod` of either `30` or `60` seconds. This action requires the `monitorName` and `probeId` parameter. Run `ListMonitors` to get a list of monitor names.
    flag:
        aggregation-period: The aggregation time, in seconds, to change to. This must be either `30` or `60`.
        monitor-name: The name of the monitor to update.
