name: update-recovery-point-index-settings
description: This operation updates the settings of a recovery point index.
flags:
    --backup-vault-name=!: The name of a logical container where backups are stored.
    --iam-role-arn=: This specifies the IAM role ARN used for this operation.
    --index=!: Index can have 1 of 2 possible values, either `ENABLED` or `DISABLED`.
    --recovery-point-arn=!: An ARN that uniquely identifies a recovery point; for example, `arn:aws:backup:us-east-1:123456789012:recovery-point:1EB3B5E7-9EB0-435A-A80B-108B488B0D45`.
completion:
    flag:
        index:
            - ENABLED
            - DISABLED
documentation:
    command: |-
        This operation updates the settings of a recovery point index.

        Required: BackupVaultName, RecoveryPointArn, and IAMRoleArn
    flag:
        backup-vault-name: |-
            The name of a logical container where backups are stored. Backup vaults are identified by names that are unique to the account used to create them and the Region where they are created.

            Accepted characters include lowercase letters, numbers, and hyphens.
        iam-role-arn: |-
            This specifies the IAM role ARN used for this operation.

            For example, arn:aws:iam::123456789012:role/S3Access
        index: |-
            Index can have 1 of 2 possible values, either `ENABLED` or `DISABLED`.

            To create a backup index for an eligible `ACTIVE` recovery point that does not yet have a backup index, set value to `ENABLED`.

            To delete a backup index, set value to `DISABLED`.
        recovery-point-arn: An ARN that uniquely identifies a recovery point; for example, `arn:aws:backup:us-east-1:123456789012:recovery-point:1EB3B5E7-9EB0-435A-A80B-108B488B0D45`.
