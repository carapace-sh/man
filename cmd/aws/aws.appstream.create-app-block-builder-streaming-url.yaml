name: create-app-block-builder-streaming-url
description: Creates a URL to start a create app block builder streaming session.
flags:
    --app-block-builder-name=!: The name of the app block builder.
    --validity=: The time that the streaming URL will be valid, in seconds.
documentation:
    command: Creates a URL to start a create app block builder streaming session.
    flag:
        app-block-builder-name: The name of the app block builder.
        validity: The time that the streaming URL will be valid, in seconds. Specify a value between 1 and 604800 seconds. The default is 3600 seconds.
