name: describe-load-balancers
description: Describes the specified the load balancers.
flags:
    --load-balancer-names=: The names of the load balancers.
    --marker=: The marker for the next set of results.
    --page-size=: The maximum number of results to return with this call (a number from 1 to 400).
documentation:
    command: Describes the specified the load balancers. If no load balancers are specified, the call describes all of your load balancers.
    flag:
        load-balancer-names: The names of the load balancers.
        marker: The marker for the next set of results. (You received this marker from a previous call.)
        page-size: The maximum number of results to return with this call (a number from 1 to 400). The default is 400.
