name: update-user-proficiencies
description: Updates the properties associated with the proficiencies of a user.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --user-id=!: The identifier of the user account.
    --user-proficiencies=!: The proficiencies to be updated for the user.
documentation:
    command: Updates the properties associated with the proficiencies of a user.
    flag:
        instance-id: The identifier of the Amazon Connect instance. You can find the instance ID in the Amazon Resource Name (ARN) of the instance.
        user-id: The identifier of the user account.
        user-proficiencies: The proficiencies to be updated for the user. Proficiencies must first be associated to the user. You can do this using AssociateUserProficiencies API.
