name: create-training-plan
description: Creates a new training plan in SageMaker to reserve compute capacity.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --spare-instance-count-per-ultra-server=: Number of spare instances to reserve per UltraServer for enhanced resiliency.
    --tags=:
        description: An array of key-value pairs to apply to this training plan.
        nargs: -1
    --training-plan-name=!: The name of the training plan to create.
    --training-plan-offering-id=!: The unique identifier of the training plan offering to use for creating this plan.
documentation:
    command: "Creates a new training plan in SageMaker to reserve compute capacity.\n\nAmazon SageMaker Training Plan is a capability within SageMaker that allows customers to reserve and manage GPU capacity for large-scale AI model training. It provides a way to secure predictable access to computational resources within specific timelines and budgets, without the need to manage underlying infrastructure.\n\n**How it works**\n\nPlans can be created for specific resources such as SageMaker Training Jobs or SageMaker HyperPod clusters, automatically provisioning resources, setting up infrastructure, executing workloads, and handling infrastructure failures.\n\n**Plan creation workflow**\n\n- Users search for available plan offerings based on their requirements (e.g., instance type, count, start time, duration) using the `SearchTrainingPlanOfferings` API operation.\n- They create a plan that best matches their needs using the ID of the plan offering they want to use.\n- After successful upfront payment, the plan's status becomes `Scheduled`.\n- The plan can be used to:\n  \n  - Queue training jobs.\n  - Allocate to an instance group of a SageMaker HyperPod cluster.\n- When the plan start date arrives, it becomes `Active`. Based on available reserved capacity:\n  \n  - Training jobs are launched.\n  - Instance groups are provisioned.\n\n**Plan composition**\n\nA plan can consist of one or more Reserved Capacities, each defined by a specific instance type, quantity, Availability Zone, duration, and start and end times. For more information about Reserved Capacity, see `ReservedCapacitySummary`."
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        spare-instance-count-per-ultra-server: Number of spare instances to reserve per UltraServer for enhanced resiliency. Default is 1.
        tags: An array of key-value pairs to apply to this training plan.
        training-plan-name: The name of the training plan to create.
        training-plan-offering-id: The unique identifier of the training plan offering to use for creating this plan.
