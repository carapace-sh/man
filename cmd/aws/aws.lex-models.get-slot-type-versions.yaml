name: get-slot-type-versions
description: Gets information about all versions of a slot type.
flags:
    --max-results=: The maximum number of slot type versions to return in the response.
    --name=!: The name of the slot type for which versions should be returned.
    --next-token=: A pagination token for fetching the next page of slot type versions.
documentation:
    command: |-
        Gets information about all versions of a slot type.

        The `GetSlotTypeVersions` operation returns a `SlotTypeMetadata` object for each version of a slot type. For example, if a slot type has three numbered versions, the `GetSlotTypeVersions` operation returns four `SlotTypeMetadata` objects in the response, one for each numbered version and one for the `$LATEST` version.

        The `GetSlotTypeVersions` operation always returns at least one version, the `$LATEST` version.

        This operation requires permissions for the `lex:GetSlotTypeVersions` action.
    flag:
        max-results: The maximum number of slot type versions to return in the response. The default is 10.
        name: The name of the slot type for which versions should be returned.
        next-token: A pagination token for fetching the next page of slot type versions. If the response to this call is truncated, Amazon Lex returns a pagination token in the response. To fetch the next page of versions, specify the pagination token in the next request.
