name: describe-inbound-integrations
description: Returns a list of inbound integrations.
flags:
    --integration-arn=: The Amazon Resource Name (ARN) of the inbound integration.
    --marker=: An optional parameter that specifies the starting point to return a set of response records.
    --max-records=: The maximum number of response records to return in each call.
    --target-arn=: The Amazon Resource Name (ARN) of the target of an inbound integration.
documentation:
    command: Returns a list of inbound integrations.
    flag:
        integration-arn: The Amazon Resource Name (ARN) of the inbound integration.
        marker: An optional parameter that specifies the starting point to return a set of response records. When the results of a [DescribeInboundIntegrations]() request exceed the value specified in `MaxRecords`, Amazon Web Services returns a value in the `Marker` field of the response. You can retrieve the next set of response records by providing the returned marker value in the `Marker` parameter and retrying the request.
        max-records: |-
            The maximum number of response records to return in each call. If the number of remaining response records exceeds the specified `MaxRecords` value, a value is returned in a `marker` field of the response. You can retrieve the next set of records by retrying the command with the returned marker value.

            Default: `100`

            Constraints: minimum 20, maximum 100.
        target-arn: The Amazon Resource Name (ARN) of the target of an inbound integration.
