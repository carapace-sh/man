    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique token that Amazon SES uses to recognize subsequent retries of the same request.
    --default-action=!: Default action instructs the traﬃc policy to either Allow or Deny (block) messages that fall outside of (or not addressed by) the conditions of your policy statements
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-message-size-bytes=: The maximum message size in bytes of email which is allowed in by this traffic policy—anything larger will be blocked.
    --policy-statements=!: Conditional statements for filtering email traffic.
    --tags=: The tags used to organize, track, or control access for the resource.
    --traffic-policy-name=!: A user-friendly name for the traffic policy resource.
