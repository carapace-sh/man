name: update
description: '*(ALPHA)*  Updates TagBindings bound to the specified resource.'
flags:
    --clear-tags: Clear all tags on the resource.
    --location=: Region or zone of the resource to bind to the TagValue.
    --no-clear-tags&: Clear all tags on the resource.
    --remove-tags=: Remove the specified tags from the resource.
    --replace-tags=: Replace all existing tags on the resource with the specified key-value pairs.
    --resource-name=!: Full resource name of the resource to attach to the tagValue.
    --update-tags=: Add/update tags to the resource.
documentation:
    command: '*(ALPHA)*  Updates TagBindings bound to the specified resource.'
    flag:
        clear-tags: Clear all tags on the resource.
        location: Region or zone of the resource to bind to the TagValue. This field is not required if the resource is a global resource like projects, folders and organizations.
        no-clear-tags: Clear all tags on the resource.
        remove-tags: Remove the specified tags from the resource.
        replace-tags: |-
            Replace all existing tags on the resource with the specified key-value pairs. Sets `replace_tags` value.
            +
            *KEY*:::
            Sets `KEY` value.
            +
            *VALUE*:::
            Sets `VALUE` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --replace-tags=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --replace-tags='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --replace-tags=path_to_file.(yaml|json)
            +
            ```
        resource-name: Full resource name of the resource to attach to the tagValue.
        update-tags: |-
            Add/update tags to the resource. Sets `update_tags` value.
            +
            *KEY*:::
            Sets `KEY` value.
            +
            *VALUE*:::
            Sets `VALUE` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --update-tags=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --update-tags='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --update-tags=path_to_file.(yaml|json)
            +
            ```
