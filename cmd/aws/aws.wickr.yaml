# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: wickr
description: AWS Wickr Admin API
commands:
    - name: batch-create-user
      description: Creates multiple users in a specified Wickr network.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique identifier for this request to ensure idempotency.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --network-id=!: The ID of the Wickr network where users will be created.
        --users=!:
            description: A list of user objects containing the details for each user to be created, including username, name, security groups, and optional invite codes.
            nargs: -1
      documentation:
        command: |-
            Creates multiple users in a specified Wickr network. This operation allows you to provision multiple user accounts simultaneously, optionally specifying security groups, and validation requirements for each user.

            `codeValidation`, `inviteCode`, and `inviteCodeTtl` are restricted to networks under preview only.
        flag:
            cli-input-json: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            cli-input-yaml: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            client-token: A unique identifier for this request to ensure idempotency. If you retry a request with the same client token, the service will return the same response without creating duplicate users.
            generate-cli-skeleton: |-
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            network-id: The ID of the Wickr network where users will be created.
            users: A list of user objects containing the details for each user to be created, including username, name, security groups, and optional invite codes. Maximum 50 users per batch request.
    - name: batch-delete-user
