name: list-keys
description: Lists the keys in the caller's Amazon Web Services account and Amazon Web Services Region.
flags:
    --key-state=: The key state of the keys you want to list.
    --max-results=: Use this parameter to specify the maximum number of items to return.
    --next-token=: Use this parameter in a subsequent request after you receive a response with truncated results.
completion:
    flag:
        key-state:
            - CREATE_IN_PROGRESS
            - CREATE_COMPLETE
            - DELETE_PENDING
            - DELETE_COMPLETE
documentation:
    command: |-
        Lists the keys in the caller's Amazon Web Services account and Amazon Web Services Region. You can filter the list of keys.

        This is a paginated operation, which means that each response might contain only a subset of all the keys. When the response contains only a subset of keys, it includes a `NextToken` value. Use this value in a subsequent `ListKeys` request to get more keys. When you receive a response with no NextToken (or an empty or null value), that means there are no more keys to get.

        **Cross-account use:** This operation can't be used across different Amazon Web Services accounts.

        **Related operations:**

        - [CreateKey](https://docs.aws.amazon.com/payment-cryptography/latest/APIReference/API_CreateKey.html)
        - [DeleteKey](https://docs.aws.amazon.com/payment-cryptography/latest/APIReference/API_DeleteKey.html)
        - [GetKey](https://docs.aws.amazon.com/payment-cryptography/latest/APIReference/API_GetKey.html)
    flag:
        key-state: The key state of the keys you want to list.
        max-results: |-
            Use this parameter to specify the maximum number of items to return. When this value is present, Amazon Web Services Payment Cryptography does not return more than the specified number of items, but it might return fewer.

            This value is optional. If you include a value, it must be between 1 and 100, inclusive. If you do not include a value, it defaults to 50.
        next-token: Use this parameter in a subsequent request after you receive a response with truncated results. Set it to the value of `NextToken` from the truncated response you just received.
