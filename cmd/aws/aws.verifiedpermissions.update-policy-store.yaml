name: update-policy-store
description: Modifies the validation setting for a policy store.
flags:
    --deletion-protection=: Specifies whether the policy store can be deleted.
    --description=: Descriptive text that you can provide to help with identification of the current policy store.
    --policy-store-id=!: Specifies the ID of the policy store that you want to update
    --validation-settings=!: A structure that defines the validation settings that want to enable for the policy store.
completion:
    flag:
        deletion-protection:
            - ENABLED
            - DISABLED
documentation:
    command: |-
        Modifies the validation setting for a policy store.

        Verified Permissions is [*eventually consistent*](https://wikipedia.org/wiki/Eventual_consistency) . It can take a few seconds for a new or changed element to propagate through the service and be visible in the results of other Verified Permissions operations.
    flag:
        deletion-protection: |-
            Specifies whether the policy store can be deleted. If enabled, the policy store can't be deleted.

            When you call `UpdatePolicyStore`, this parameter is unchanged unless explicitly included in the call.
        description: Descriptive text that you can provide to help with identification of the current policy store.
        policy-store-id: Specifies the ID of the policy store that you want to update
        validation-settings: A structure that defines the validation settings that want to enable for the policy store.
