name: delete-trusted-entity-set
description: Deletes the trusted entity set that is associated with the specified `trustedEntitySetId`.
flags:
    --detector-id=!: The unique ID of the detector associated with the trusted entity set resource.
    --trusted-entity-set-id=!: The unique ID that helps GuardDuty identify which trusted entity set needs to be deleted.
documentation:
    command: Deletes the trusted entity set that is associated with the specified `trustedEntitySetId`.
    flag:
        detector-id: |-
            The unique ID of the detector associated with the trusted entity set resource.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
        trusted-entity-set-id: The unique ID that helps GuardDuty identify which trusted entity set needs to be deleted.
