name: create-profile
description: Creates a *profile*, a list of the roles that Roles Anywhere service is trusted to assume.
flags:
    --accept-role-session-name: Used to determine if a custom role session name will be accepted in a temporary credential request.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --duration-seconds=: Used to determine how long sessions vended using this profile are valid for.
    --enabled: Specifies whether the profile is enabled.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --managed-policy-arns=: A list of managed policy ARNs that apply to the vended session credentials.
    --name=!: The name of the profile.
    --no-accept-role-session-name: Used to determine if a custom role session name will be accepted in a temporary credential request.
    --no-enabled: Specifies whether the profile is enabled.
    --no-require-instance-properties: Specifies whether instance properties are required in temporary credential requests with this profile.
    --require-instance-properties: Specifies whether instance properties are required in temporary credential requests with this profile.
    --role-arns=!: A list of IAM roles that this profile can assume in a temporary credential request.
    --session-policy=: A session policy that applies to the trust boundary of the vended session credentials.
    --tags=: The tags to attach to the profile.
documentation:
    command: |-
        Creates a *profile*, a list of the roles that Roles Anywhere service is trusted to assume. You use profiles to intersect permissions with IAM managed policies.

        **Required permissions:** `rolesanywhere:CreateProfile`.
    flag:
        accept-role-session-name: Used to determine if a custom role session name will be accepted in a temporary credential request.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        duration-seconds: Used to determine how long sessions vended using this profile are valid for. See the `Expiration` section of the [CreateSession API documentation](https://docs.aws.amazon.com/rolesanywhere/latest/userguide/authentication-create-session.html#credentials-object) page for more details. In requests, if this value is not provided, the default value will be 3600.
        enabled: Specifies whether the profile is enabled.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        managed-policy-arns: A list of managed policy ARNs that apply to the vended session credentials.
        name: The name of the profile.
        require-instance-properties: Specifies whether instance properties are required in temporary credential requests with this profile.
        role-arns: A list of IAM roles that this profile can assume in a temporary credential request.
        session-policy: A session policy that applies to the trust boundary of the vended session credentials.
        tags: The tags to attach to the profile.
