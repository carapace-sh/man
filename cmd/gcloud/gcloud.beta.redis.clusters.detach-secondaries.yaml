name: detach-secondaries
description: '*(BETA)*  Detach one or more secondary clusters from the primary cluster.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --clusters-to-detach=!: Comma separated list of secondary clusters to detach from the primary cluster.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: The name of the Redis region of the cluster.
documentation:
    command: |
        *(BETA)*  Detach one or more secondary clusters from the primary cluster.

        After detachment, the secondary clusters become independent clusters, i.e. they stop replicating
        from the primary cluster and will now accept both read and write requests.

        This command is only supported on primary clusters.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        clusters-to-detach: |-
            Comma separated list of secondary clusters to detach from the primary cluster.
            +
            Each element in the list should be in the format: `projects/PROJECT_ID/locations/REGION/clusters/CLUSTER_ID`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            The name of the Redis region of the cluster. Overrides the default
            redis/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `redis/region`.
