name: start-audit-mitigation-actions-task
description: Starts a task that applies a set of mitigation actions to the specified target.
flags:
    --audit-check-to-actions-mapping=!: For an audit check, specifies which mitigation actions to apply.
    --client-request-token=!: Each audit mitigation task must have a unique client request token.
    --target=!: Specifies the audit findings to which the mitigation actions are applied.
    --task-id=!: A unique identifier for the task.
documentation:
    command: |-
        Starts a task that applies a set of mitigation actions to the specified target.

        Requires permission to access the [StartAuditMitigationActionsTask](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        audit-check-to-actions-mapping: For an audit check, specifies which mitigation actions to apply. Those actions must be defined in your Amazon Web Services accounts.
        client-request-token: Each audit mitigation task must have a unique client request token. If you try to start a new task with the same token as a task that already exists, an exception occurs. If you omit this value, a unique client request token is generated automatically.
        target: Specifies the audit findings to which the mitigation actions are applied. You can apply them to a type of audit check, to all findings from an audit, or to a specific set of findings.
        task-id: A unique identifier for the task. You can use this identifier to check the status of the task or to cancel it.
