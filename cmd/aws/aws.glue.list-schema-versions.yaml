name: list-schema-versions
description: Returns a list of schema versions that you have created, with minimal information.
flags:
    --max-results=: Maximum number of results required per page.
    --next-token=: A continuation token, if this is a continuation call.
    --schema-id=!: This is a wrapper structure to contain schema identity fields.
documentation:
    command: Returns a list of schema versions that you have created, with minimal information. Schema versions in Deleted status will not be included in the results. Empty results will be returned if there are no schema versions available.
    flag:
        max-results: Maximum number of results required per page. If the value is not supplied, this will be defaulted to 25 per page.
        next-token: A continuation token, if this is a continuation call.
        schema-id: |-
            This is a wrapper structure to contain schema identity fields. The structure contains:

            - SchemaId$SchemaArn: The Amazon Resource Name (ARN) of the schema. Either `SchemaArn` or `SchemaName` and `RegistryName` has to be provided.
            - SchemaId$SchemaName: The name of the schema. Either `SchemaArn` or `SchemaName` and `RegistryName` has to be provided.
