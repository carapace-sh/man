name: create-workflow-version
description: Creates a new workflow version for the workflow that you specify with the `workflowId` parameter.
flags:
    --accelerators=: The computational accelerator for this workflow version.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --container-registry-map-uri=: (Optional) URI of the S3 location for the registry mapping file.
    --container-registry-map=: (Optional) Use a container registry map to specify mappings between the ECR private repository and one or more upstream registries.
    --definition-repository=: The repository information for the workflow version definition.
    --definition-uri=: The S3 URI of a definition for this workflow version.
    --definition-zip=: A ZIP archive containing the main workflow definition file and dependencies that it imports for this workflow version.
    --description=: A description for this workflow version.
    --engine=: The workflow engine for this workflow version.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --main=: The path of the main definition file for this workflow version.
    --parameter-template-path=: The path to the workflow version parameter template JSON file within the repository.
    --parameter-template=: A parameter template for this workflow version.
    --readme-markdown=: The markdown content for the workflow version's README file.
    --readme-path=: The path to the workflow version README markdown file within the repository.
    --readme-uri=: The S3 URI of the README file for the workflow version.
    --request-id=!: An idempotency token to ensure that duplicate workflows are not created when Amazon Web Services HealthOmics submits retry requests.
    --storage-capacity=: The default static storage capacity (in gibibytes) for runs that use this workflow version.
    --storage-type=: The default storage type for runs that use this workflow version.
    --tags=: Tags for this workflow version.
    --version-name=!: A name for the workflow version.
    --workflow-bucket-owner-id=: Amazon Web Services Id of the owner of the S3 bucket that contains the workflow definition.
    --workflow-id=!: The ID of the workflow where you are creating the new version.
completion:
    flag:
        accelerators:
            - GPU
        engine:
            - WDL
            - NEXTFLOW
            - CWL
            - WDL_LENIENT
        storage-type:
            - STATIC
            - DYNAMIC
documentation:
    command: |-
        Creates a new workflow version for the workflow that you specify with the `workflowId` parameter.

        When you create a new version of a workflow, you need to specify the configuration for the new version. It doesn't inherit any configuration values from the workflow.

        Provide a version name that is unique for this workflow. You cannot change the name after HealthOmics creates the version.

        Don't include any personally identifiable information (PII) in the version name. Version names appear in the workflow version ARN.

        For more information, see [Workflow versioning in Amazon Web Services HealthOmics](https://docs.aws.amazon.com/omics/latest/dev/workflow-versions.html) in the *Amazon Web Services HealthOmics User Guide*.
    flag:
        accelerators: The computational accelerator for this workflow version.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        container-registry-map: (Optional) Use a container registry map to specify mappings between the ECR private repository and one or more upstream registries. For more information, see [Container images](https://docs.aws.amazon.com/omics/latest/dev/workflows-ecr.html) in the *Amazon Web Services HealthOmics User Guide*.
        container-registry-map-uri: (Optional) URI of the S3 location for the registry mapping file.
        definition-repository: The repository information for the workflow version definition. This allows you to source your workflow version definition directly from a code repository.
        definition-uri: The S3 URI of a definition for this workflow version. The S3 bucket must be in the same region as this workflow version.
        definition-zip: A ZIP archive containing the main workflow definition file and dependencies that it imports for this workflow version. You can use a file with a ://fileb prefix instead of the Base64 string. For more information, see Workflow definition requirements in the *Amazon Web Services HealthOmics User Guide*.
        description: A description for this workflow version.
        engine: The workflow engine for this workflow version. This is only required if you have workflow definition files from more than one engine in your zip file. Otherwise, the service can detect the engine automatically from your workflow definition.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        main: 'The path of the main definition file for this workflow version. This parameter is not required if the ZIP archive contains only one workflow definition file, or if the main definition file is named “main”. An example path is: `workflow-definition/main-file.wdl`.'
        parameter-template: A parameter template for this workflow version. If this field is blank, Amazon Web Services HealthOmics will automatically parse the parameter template values from your workflow definition file. To override these service generated default values, provide a parameter template. To view an example of a parameter template, see [Parameter template files](https://docs.aws.amazon.com/omics/latest/dev/parameter-templates.html) in the *Amazon Web Services HealthOmics User Guide*.
        parameter-template-path: The path to the workflow version parameter template JSON file within the repository. This file defines the input parameters for runs that use this workflow version. If not specified, the workflow version will be created without a parameter template.
        readme-markdown: The markdown content for the workflow version's README file. This provides documentation and usage information for users of this specific workflow version.
        readme-path: The path to the workflow version README markdown file within the repository. This file provides documentation and usage information for the workflow. If not specified, the `README.md` file from the root directory of the repository will be used.
        readme-uri: |-
            The S3 URI of the README file for the workflow version. This file provides documentation and usage information for the workflow version. Requirements include:

            - The S3 URI must begin with `s3://USER-OWNED-BUCKET/`
            - The requester must have access to the S3 bucket and object.
            - The max README content length is 500 KiB.
        request-id: An idempotency token to ensure that duplicate workflows are not created when Amazon Web Services HealthOmics submits retry requests.
        storage-capacity: The default static storage capacity (in gibibytes) for runs that use this workflow version. The `storageCapacity` can be overwritten at run time. The storage capacity is not required for runs with a `DYNAMIC` storage type.
        storage-type: The default storage type for runs that use this workflow version. The `storageType` can be overridden at run time. `DYNAMIC` storage dynamically scales the storage up or down, based on file system utilization. STATIC storage allocates a fixed amount of storage. For more information about dynamic and static storage types, see [Run storage types](https://docs.aws.amazon.com/omics/latest/dev/workflows-run-types.html) in the *Amazon Web Services HealthOmics User Guide*.
        tags: Tags for this workflow version. You can define up to 50 tags for the workflow. For more information, see [Adding a tag](https://docs.aws.amazon.com/omics/latest/dev/add-a-tag.html) in the *Amazon Web Services HealthOmics User Guide*.
        version-name: |-
            A name for the workflow version. Provide a version name that is unique for this workflow. You cannot change the name after HealthOmics creates the version.

            The version name must start with a letter or number and it can include upper-case and lower-case letters, numbers, hyphens, periods and underscores. The maximum length is 64 characters. You can use a simple naming scheme, such as version1, version2, version3. You can also match your workflow versions with your own internal versioning conventions, such as 2.7.0, 2.7.1, 2.7.2.
        workflow-bucket-owner-id: Amazon Web Services Id of the owner of the S3 bucket that contains the workflow definition. You need to specify this parameter if your account is not the bucket owner.
        workflow-id: The ID of the workflow where you are creating the new version. The `workflowId` is not the UUID.
