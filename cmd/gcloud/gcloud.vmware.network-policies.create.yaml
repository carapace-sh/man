name: create
description: Create a VMware Engine network policy.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: User-provided description of the network policy.
    --edge-services-cidr=!: IP address range to use for internet access and external IP access gateways, in CIDR notation.
    --external-ip-access: Enable or disable network service that allows external IP addresses to be assigned to VMware workloads.
    --internet-access: Enable or disable network service that allows VMware workloads to access the internet.
    --location=: The resource name of the location.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-external-ip-access&: Enable or disable network service that allows external IP addresses to be assigned to VMware workloads.
    --no-internet-access&: Enable or disable network service that allows VMware workloads to access the internet.
    --vmware-engine-network=!: Resource ID of the VMware Engine network to attach the new policy to.
documentation:
    command: |
        Create a VMware Engine network policy. Only one network policy applies to a VMware Engine network per region. Check the progress of a network policy creation using `gcloud vmware network-policies list`.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        description: User-provided description of the network policy.
        edge-services-cidr: IP address range to use for internet access and external IP access gateways, in CIDR notation. An RFC 1918 CIDR block with a "/26" prefix is required.
        external-ip-access: Enable or disable network service that allows external IP addresses to be assigned to VMware workloads. To enable this service, `internet-access` must also be enabled. Use `--no-external-ip-access` to disable. If the flag is not provided, access to VMware workloads through external IP addresses is disabled.
        internet-access: Enable or disable network service that allows VMware workloads to access the internet. Use `--no-internet-access` to disable. If the flag is not provided, internet access is disabled.
        location: |-
            The resource name of the location.
            +
            To set the `location` attribute:
            * provide the argument `network_policy` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/region`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-external-ip-access: |
            Enable or disable network service that allows external IP addresses to be assigned to VMware workloads. To enable this service, `internet-access` must also be enabled. Use `--no-external-ip-access` to disable. If the flag is not provided, access to VMware workloads through external IP addresses is disabled.
        no-internet-access: |
            Enable or disable network service that allows VMware workloads to access the internet. Use `--no-internet-access` to disable. If the flag is not provided, internet access is disabled.
        vmware-engine-network: Resource ID of the VMware Engine network to attach the new policy to.
