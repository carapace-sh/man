name: list-clusters
description: Returns an array of `ClusterListEntry` objects of the specified length.
flags:
    --max-results=: The number of `ClusterListEntry` objects to return.
    --next-token=: HTTP requests are stateless.
documentation:
    command: Returns an array of `ClusterListEntry` objects of the specified length. Each `ClusterListEntry` object contains a cluster's state, a cluster's ID, and other important status information.
    flag:
        max-results: The number of `ClusterListEntry` objects to return.
        next-token: HTTP requests are stateless. To identify what object comes "next" in the list of `ClusterListEntry` objects, you have the option of specifying `NextToken` as the starting point for your returned list.
