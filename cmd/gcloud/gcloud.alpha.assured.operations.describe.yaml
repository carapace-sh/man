name: describe
description: '*(ALPHA)*  Describe Assured Workloads operations.'
flags:
    --location=: The location for the operation.
    --organization=: The parent organization for the operation.
documentation:
    command: '*(ALPHA)*  Obtain details about a given Assured Workloads operation.'
    flag:
        location: |-
            The location for the operation.
            +
            To set the `location` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        organization: |-
            The parent organization for the operation.
            +
            To set the `organization` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
