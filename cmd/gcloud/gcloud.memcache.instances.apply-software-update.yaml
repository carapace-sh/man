name: apply-software-update
description: Apply software update to nodes in a Memorystore Memcached instance.
hidden: true
flags:
    --apply-all: Apply the software update onto all nodes.
    --async: Return immediately, without waiting for the operation in progress to
    --no-apply-all&: Apply the software update onto all nodes.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --node-ids=: Nodes on which to apply the software update.
    --region=: The name of the Memcached region of the instance.
documentation:
    command: |
        Apply a software update to nodes in a Memcached instance to the latest available software
        version.

        To check if a Memcache instance and its nodes have a new software update available, run:

          $ gcloud beta memcache instances describe my-memcache-instance --format="table(updateAvailable.yesno(),memcacheNodes:format='table(nodeId,updateAvailable.yesno())')" --region=us-central1

        Applying a software update to a node causes a full cache flush on that node.
    flag:
        apply-all: Apply the software update onto all nodes.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-apply-all: |
            Apply the software update onto all nodes.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        node-ids: Nodes on which to apply the software update.
        region: |-
            The name of the Memcached region of the instance. Overrides the default
            memcache/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `memcache/region`.
