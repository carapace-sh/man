name: register-certificate-without-ca
description: Register a certificate that does not have a certificate authority (CA).
flags:
    --certificate-pem=!: The certificate data, in PEM format.
    --status=: The status of the register certificate request.
completion:
    flag:
        status:
            - ACTIVE
            - INACTIVE
            - REVOKED
            - PENDING_TRANSFER
            - REGISTER_INACTIVE
            - PENDING_ACTIVATION
documentation:
    command: Register a certificate that does not have a certificate authority (CA). For supported certificates, consult [Certificate signing algorithms supported by IoT](https://docs.aws.amazon.com/iot/latest/developerguide/x509-client-certs.html#x509-cert-algorithms).
    flag:
        certificate-pem: The certificate data, in PEM format.
        status: The status of the register certificate request.
