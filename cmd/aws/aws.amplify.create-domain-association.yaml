name: create-domain-association
description: Creates a new domain association for an Amplify app.
flags:
    --app-id=!: The unique ID for an Amplify app.
    --auto-sub-domain-creation-patterns=: Sets the branch patterns for automatic subdomain creation.
    --auto-sub-domain-iam-role=: The required AWS Identity and Access Management (IAM) service role for the Amazon Resource Name (ARN) for automatically creating subdomains.
    --certificate-settings=: The type of SSL/TLS certificate to use for your custom domain.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-name=!: The domain name for the domain association.
    --enable-auto-sub-domain: Enables the automated creation of subdomains for branches.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-enable-auto-sub-domain: Enables the automated creation of subdomains for branches.
    --sub-domain-settings=!: The setting for the subdomain.
documentation:
    command: Creates a new domain association for an Amplify app. This action associates a custom domain with the Amplify app
    flag:
        app-id: The unique ID for an Amplify app.
        auto-sub-domain-creation-patterns: Sets the branch patterns for automatic subdomain creation.
        auto-sub-domain-iam-role: The required AWS Identity and Access Management (IAM) service role for the Amazon Resource Name (ARN) for automatically creating subdomains.
        certificate-settings: The type of SSL/TLS certificate to use for your custom domain. If you don't specify a certificate type, Amplify uses the default certificate that it provisions and manages for you.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain-name: The domain name for the domain association.
        enable-auto-sub-domain: Enables the automated creation of subdomains for branches.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        sub-domain-settings: The setting for the subdomain.
