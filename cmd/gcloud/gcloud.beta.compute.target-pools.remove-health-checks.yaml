name: remove-health-checks
description: '*(BETA)*  Remove an HTTP health check from a target pool.'
flags:
    --http-health-check=!: Specifies an HTTP health check object to remove from the target pool.
    --region=: Region of the target pool to remove health checks from.
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute target-pools remove-health-checks* is used to remove an HTTP health check
        from a target pool. Health checks are used to determine
        the health status of instances in the target pool. For more
        information on health checks and load balancing, see
        [](https://cloud.google.com/compute/docs/load-balancing-and-autoscaling/)
    flag:
        http-health-check: Specifies an HTTP health check object to remove from the target pool.
        region: |-
            Region of the target pool to remove health checks from. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
