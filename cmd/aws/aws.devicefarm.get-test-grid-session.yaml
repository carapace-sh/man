name: get-test-grid-session
description: A session is an instance of a browser created through a `RemoteWebDriver` with the URL from [CreateTestGridUrlResult$url]().
flags:
    --project-arn=: The ARN for the project that this session belongs to.
    --session-arn=: An ARN that uniquely identifies a [TestGridSession]().
    --session-id=: An ID associated with this session.
documentation:
    command: |-
        A session is an instance of a browser created through a `RemoteWebDriver` with the URL from [CreateTestGridUrlResult$url](). You can use the following to look up sessions:

        - The session ARN ([GetTestGridSessionRequest$sessionArn]()).
        - The project ARN and a session ID ([GetTestGridSessionRequest$projectArn]() and [GetTestGridSessionRequest$sessionId]()).
    flag:
        project-arn: The ARN for the project that this session belongs to. See [CreateTestGridProject]() and [ListTestGridProjects]().
        session-arn: An ARN that uniquely identifies a [TestGridSession]().
        session-id: An ID associated with this session.
