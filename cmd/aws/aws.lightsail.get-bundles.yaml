name: get-bundles
description: Returns the bundles that you can apply to an Amazon Lightsail instance when you create it.
flags:
    --app-category=: Returns a list of bundles that are specific to Lightsail for Research.
    --include-inactive=: A Boolean value that indicates whether to include inactive (unavailable) bundles in the response of your request.
    --page-token=: The token to advance to the next page of results from your request.
completion:
    flag:
        app-category:
            - LfR
documentation:
    command: |-
        Returns the bundles that you can apply to an Amazon Lightsail instance when you create it.

        A bundle describes the specifications of an instance, such as the monthly cost, amount of memory, the number of vCPUs, amount of storage space, and monthly network data transfer quota.

        Bundles are referred to as *instance plans* in the Lightsail console.
    flag:
        app-category: |-
            Returns a list of bundles that are specific to Lightsail for Research.

            You must use this parameter to view Lightsail for Research bundles.
        include-inactive: A Boolean value that indicates whether to include inactive (unavailable) bundles in the response of your request.
        page-token: |-
            The token to advance to the next page of results from your request.

            To get a page token, perform an initial `GetBundles` request. If your results are paginated, the response will return a next page token that you can specify as the page token in a subsequent request.
