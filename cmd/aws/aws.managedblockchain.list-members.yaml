name: list-members
description: Returns a list of the members in a network and properties of their configurations.
flags:
    --is-owned=: An optional Boolean value.
    --max-results=: The maximum number of members to return in the request.
    --name=: The optional name of the member to list.
    --network-id=!: The unique identifier of the network for which to list members.
    --next-token=: The pagination token that indicates the next set of results to retrieve.
    --status=: An optional status specifier.
completion:
    flag:
        status:
            - CREATING
            - AVAILABLE
            - CREATE_FAILED
            - UPDATING
            - DELETING
            - DELETED
            - INACCESSIBLE_ENCRYPTION_KEY
documentation:
    command: |-
        Returns a list of the members in a network and properties of their configurations.

        Applies only to Hyperledger Fabric.
    flag:
        is-owned: An optional Boolean value. If provided, the request is limited either to members that the current Amazon Web Services account owns (`true`) or that other Amazon Web Services accountsn own (`false`). If omitted, all members are listed.
        max-results: The maximum number of members to return in the request.
        name: The optional name of the member to list.
        network-id: The unique identifier of the network for which to list members.
        next-token: The pagination token that indicates the next set of results to retrieve.
        status: An optional status specifier. If provided, only members currently in this status are listed.
