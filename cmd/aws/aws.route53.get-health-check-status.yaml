name: get-health-check-status
description: Gets status of a specified health check.
flags:
    --health-check-id=!: The ID for the health check that you want the current status for.
documentation:
    command: |-
        Gets status of a specified health check.

        This API is intended for use during development to diagnose behavior. It doesn’t support production use-cases with high query rates that require immediate and actionable responses.
    flag:
        health-check-id: |-
            The ID for the health check that you want the current status for. When you created the health check, `CreateHealthCheck` returned the ID in the response, in the `HealthCheckId` element.

            If you want to check the status of a calculated health check, you must use the Amazon Route 53 console or the CloudWatch console. You can't use `GetHealthCheckStatus` to get the status of a calculated health check.
