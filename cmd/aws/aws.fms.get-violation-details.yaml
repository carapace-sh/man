name: get-violation-details
description: Retrieves violations for a resource based on the specified Firewall Manager policy and Amazon Web Services account.
flags:
    --member-account=!: The Amazon Web Services account ID that you want the details for.
    --policy-id=!: The ID of the Firewall Manager policy that you want the details for.
    --resource-id=!: The ID of the resource that has violations.
    --resource-type=!: The resource type.
documentation:
    command: Retrieves violations for a resource based on the specified Firewall Manager policy and Amazon Web Services account.
    flag:
        member-account: The Amazon Web Services account ID that you want the details for.
        policy-id: |-
            The ID of the Firewall Manager policy that you want the details for. You can get violation details for the following policy types:

            - WAF
            - DNS Firewall
            - Imported Network Firewall
            - Network Firewall
            - Security group content audit
            - Network ACL
            - Third-party firewall
        resource-id: The ID of the resource that has violations.
        resource-type: 'The resource type. This is in the format shown in the [Amazon Web Services Resource Types Reference](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-template-resource-type-ref.html). Supported resource types are: `AWS::WAFv2::WebACL`, `AWS::EC2::Instance`, `AWS::EC2::NetworkInterface`, `AWS::EC2::SecurityGroup`, `AWS::NetworkFirewall::FirewallPolicy`, and `AWS::EC2::Subnet`.'
