name: create-provisioning-template
description: Creates a provisioning template.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The description of the provisioning template.
    --enabled: True to enable the provisioning template, otherwise false.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-enabled: True to enable the provisioning template, otherwise false.
    --pre-provisioning-hook=: Creates a pre-provisioning hook template.
    --provisioning-role-arn=!: The role ARN for the role associated with the provisioning template.
    --tags=:
        description: Metadata which can be used to manage the provisioning template.
        nargs: -1
    --template-body=!: The JSON formatted contents of the provisioning template.
    --template-name=!: The name of the provisioning template.
    --type=: The type you define in a provisioning template.
completion:
    flag:
        type:
            - FLEET_PROVISIONING
            - JITP
documentation:
    command: |-
        Creates a provisioning template.

        Requires permission to access the [CreateProvisioningTemplate](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The description of the provisioning template.
        enabled: True to enable the provisioning template, otherwise false.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        pre-provisioning-hook: Creates a pre-provisioning hook template. Only supports template of type `FLEET_PROVISIONING`. For more information about provisioning template types, see [type](https://docs.aws.amazon.com/iot/latest/apireference/API_CreateProvisioningTemplate.html#iot-CreateProvisioningTemplate-request-type).
        provisioning-role-arn: The role ARN for the role associated with the provisioning template. This IoT role grants permission to provision a device.
        tags: |-
            Metadata which can be used to manage the provisioning template.

            For URI Request parameters use format: ...key1=value1&amp;key2=value2...

            For the CLI command-line parameter use format: &amp;&amp;tags "key1=value1&amp;key2=value2..."

            For the cli-input-json file use format: "tags": "key1=value1&amp;key2=value2..."
        template-body: The JSON formatted contents of the provisioning template.
        template-name: The name of the provisioning template.
        type: 'The type you define in a provisioning template. You can create a template with only one type. You can''t change the template type after its creation. The default value is `FLEET_PROVISIONING`. For more information about provisioning template, see: [Provisioning template](https://docs.aws.amazon.com/iot/latest/developerguide/provision-template.html).'
