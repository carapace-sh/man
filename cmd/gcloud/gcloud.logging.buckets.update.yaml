name: update
description: Update a bucket.
flags:
    --add-index=: Add an index to be added to the log bucket.
    --async: Return immediately, without waiting for the operation in progress to
    --billing-account=: Billing account of the bucket to update.
    --clear-indexes: Remove all logging indexes from the bucket.
    --cmek-kms-key-name=: A valid `kms_key_name` will enable CMEK for the bucket.
    --description=: A new description for the bucket.
    --enable-analytics: Whether to opt the bucket into Log Analytics.
    --folder=: Folder of the bucket to update.
    --location=!: Location of the bucket.
    --locked: Lock the bucket and prevent it from being modified or deleted (unless it is empty).
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-indexes&: Remove all logging indexes from the bucket.
    --no-enable-analytics&: Whether to opt the bucket into Log Analytics.
    --no-locked&: Lock the bucket and prevent it from being modified or deleted (unless it is empty).
    --organization=: Organization of the bucket to update.
    --remove-indexes=: Specify the field path of the logging index(es) to delete.
    --restricted-fields=: A new set of restricted fields for the bucket.
    --retention-days=: A new retention period for the bucket.
    --update-index=: Update an index to be added to the log bucket.
documentation:
    command: |
        Update the properties of a bucket.
    flag:
        add-index: |-
            Add an index to be added to the log bucket. This flag can be repeated. The ``fieldPath'' and ``type'' attributes are required. For example:  --index=fieldPath=jsonPayload.foo,type=INDEX_TYPE_STRING. The following keys are accepted:
            +
            *fieldPath*::: The LogEntry field path to index. For example: jsonPayload.request.status. Paths are limited to 800 characters and can include only letters, digits, underscores, hyphens, and periods.
            +
            *type*::: The type of data in this index. For example: INDEX_TYPE_STRING Supported types are strings and integers.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        billing-account: Billing account of the bucket to update.
        clear-indexes: Remove all logging indexes from the bucket.
        cmek-kms-key-name: A valid `kms_key_name` will enable CMEK for the bucket.
        description: A new description for the bucket.
        enable-analytics: Whether to opt the bucket into Log Analytics. Once opted in, the bucket cannot be opted out of Log Analytics.
        folder: Folder of the bucket to update.
        location: Location of the bucket.
        locked: Lock the bucket and prevent it from being modified or deleted (unless it is empty).
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-indexes: Remove all logging indexes from the bucket.
        no-enable-analytics: Whether to opt the bucket into Log Analytics. Once opted in, the bucket cannot be opted out of Log Analytics.
        no-locked: Lock the bucket and prevent it from being modified or deleted (unless it is empty).
        organization: Organization of the bucket to update.
        remove-indexes: Specify the field path of the logging index(es) to delete.
        restricted-fields: A new set of restricted fields for the bucket.
        retention-days: A new retention period for the bucket.
        update-index: |-
            Update an index to be added to the log bucket. This will update the type of the index, and also update its createTime to the new update time. This flag can be repeated. The ``fieldPath'' and ``type'' attributes are required. For example:  --index=fieldPath=jsonPayload.foo,type=INDEX_TYPE_STRING. The following keys are accepted:
            +
            *fieldPath*::: The LogEntry field path to index. For example: jsonPayload.request.status. Paths are limited to 800 characters and can include only letters, digits, underscores, hyphens, and periods.
            +
            *type*::: The type of data in this index. For example: INDEX_TYPE_STRING Supported types are strings and integers.
