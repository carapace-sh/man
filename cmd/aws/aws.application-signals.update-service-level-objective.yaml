name: update-service-level-objective
description: Updates an existing service level objective (SLO).
flags:
    --burn-rate-configurations=: Use this array to create *burn rates* for this SLO.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: An optional description for the SLO.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --goal=: A structure that contains the attributes that determine the goal of the SLO.
    --id=!: The Amazon Resource Name (ARN) or name of the service level objective that you want to update.
    --request-based-sli-config=: If this SLO is a request-based SLO, this structure defines the information about what performance metric this SLO will monitor.
    --sli-config=: If this SLO is a period-based SLO, this structure defines the information about what performance metric this SLO will monitor.
documentation:
    command: |-
        Updates an existing service level objective (SLO). If you omit parameters, the previous values of those parameters are retained.

        You cannot change from a period-based SLO to a request-based SLO, or change from a request-based SLO to a period-based SLO.
    flag:
        burn-rate-configurations: Use this array to create *burn rates* for this SLO. Each burn rate is a metric that indicates how fast the service is consuming the error budget, relative to the attainment goal of the SLO.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: An optional description for the SLO.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        goal: A structure that contains the attributes that determine the goal of the SLO. This includes the time period for evaluation and the attainment threshold.
        id: The Amazon Resource Name (ARN) or name of the service level objective that you want to update.
        request-based-sli-config: |-
            If this SLO is a request-based SLO, this structure defines the information about what performance metric this SLO will monitor.

            You can't specify both `SliConfig` and `RequestBasedSliConfig` in the same operation.
        sli-config: If this SLO is a period-based SLO, this structure defines the information about what performance metric this SLO will monitor.
