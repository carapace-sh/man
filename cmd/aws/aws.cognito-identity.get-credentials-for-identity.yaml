name: get-credentials-for-identity
description: Returns credentials for the provided identity ID.
flags:
    --custom-role-arn=: The Amazon Resource Name (ARN) of the role to be assumed when multiple roles were received in the token from the identity provider.
    --identity-id=!: A unique identifier in the format REGION:GUID.
    --logins=: A set of optional name-value pairs that map provider names to provider tokens.
documentation:
    command: |-
        Returns credentials for the provided identity ID. Any provided logins will be validated against supported login providers. If the token is for `cognito-identity.amazonaws.com`, it will be passed through to Security Token Service with the appropriate role for the token.

        This is a public API. You do not need any credentials to call this API.
    flag:
        custom-role-arn: The Amazon Resource Name (ARN) of the role to be assumed when multiple roles were received in the token from the identity provider. For example, a SAML-based identity provider. This parameter is optional for identity providers that do not support role customization.
        identity-id: A unique identifier in the format REGION:GUID.
        logins: |-
            A set of optional name-value pairs that map provider names to provider tokens. The name-value pair will follow the syntax "provider\_name": "provider\_user\_identifier".

            Logins should not be specified when trying to get credentials for an unauthenticated identity.

            The Logins parameter is required when using identities associated with external identity providers such as Facebook. For examples of `Logins` maps, see the code examples in the [External Identity Providers](https://docs.aws.amazon.com/cognito/latest/developerguide/external-identity-providers.html) section of the Amazon Cognito Developer Guide.
