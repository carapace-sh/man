name: update-odb-peering-connection
description: Modifies the settings of an Oracle Database@Amazon Web Services peering connection.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --display-name=: A new display name for the peering connection.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --odb-peering-connection-id=!: The identifier of the Oracle Database@Amazon Web Services peering connection to update.
    --peer-network-cidrs-to-be-added=:
        description: A list of CIDR blocks to add to the peering connection.
        nargs: -1
    --peer-network-cidrs-to-be-removed=:
        description: A list of CIDR blocks to remove from the peering connection.
        nargs: -1
documentation:
    command: Modifies the settings of an Oracle Database@Amazon Web Services peering connection. You can update the display name and add or remove CIDR blocks from the peering connection.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        display-name: A new display name for the peering connection.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        odb-peering-connection-id: The identifier of the Oracle Database@Amazon Web Services peering connection to update.
        peer-network-cidrs-to-be-added: A list of CIDR blocks to add to the peering connection. These CIDR blocks define the IP address ranges that can communicate through the peering connection. The CIDR blocks must not overlap with existing CIDR blocks in the Oracle Database@Amazon Web Services network.
        peer-network-cidrs-to-be-removed: A list of CIDR blocks to remove from the peering connection. The CIDR blocks must currently exist in the peering connection.
