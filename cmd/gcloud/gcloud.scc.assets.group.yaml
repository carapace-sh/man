name: group
description: '*(DEPRECATED)*  Filter an organization''s assets and groups them by their specified properties.'
flags:
    --compare-duration=: The result's "state_change" attribute is updated to indicate whether the asset was added, removed,
    --filter=: Expression is a list of one or more restrictions combined via logical operators
    --group-by=: Expression that defines what asset fields to use for grouping (including 'state').
    --page-size=: The maximum number of results to return in a single response.
    --page-token=: Value returned by the last 'GroupAssetsResponse'; indicates
    --read-time=: Time used as a reference point when filtering.
documentation:
    command: |4-
        *(DEPRECATED)*  Security Command Center Asset APIs are deprecated and will be removed on or after
        June 26, 2024. Use Cloud Asset Inventory instead [(gcloud asset)](https://cloud.google.com/sdk/gcloud/reference/asset).
        For more information, [see the deprecation notice at Assets Page](https://cloud.google.com/security-command-center/docs/how-to-use-security-command-center#assets_page).


        Filter an organization's assets and groups them by their specified properties.
    flag:
        compare-duration: |-
            The result's "state_change" attribute is updated to indicate whether the asset was added, removed,
            or remained present during the compare_duration period of time that precedes the read_time. See
            `$ gcloud topic datetimes` for information on supported duration formats.
        filter: |-
            Expression is a list of one or more restrictions combined via logical operators
            'AND' and 'OR'. Parentheses are not supported, and 'OR' has higher precedence than
            'AND'. For example, 'update_time > 100 AND
            security_center_properties.resource_type=\"google.cloud.resourcemanager.Organization\"'
            is a valid filter string.
        group-by: |-
            Expression that defines what asset fields to use for grouping (including 'state').
            String value should follow SQL syntax: comma separated list of fields.
            For example: "parent,resource_name". The following fields are supported:
            * security_center_properties.resource_project
            * security_center_properties.resource_type
            * security_center_properties.resource_parent
            * state_change
        page-size: |-
            The maximum number of results to return in a single response. Default is
            10, minimum is 1, maximum is 1000.
        page-token: |-
            Value returned by the last 'GroupAssetsResponse'; indicates
            that this is a continuation of a prior 'GroupAssets' call, and that the
            system should return the next page of data.
        read-time: |-
            Time used as a reference point when filtering. Absence of this field will default to the API's
            version of NOW. See `$ gcloud topic datetimes` for information on supported time formats.
