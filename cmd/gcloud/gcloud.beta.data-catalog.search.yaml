name: search
description: '*(BETA)*  *(DEPRECATED)*  Search Data Catalog for resources that match a query.'
flags:
    --include-gcp-public-datasets: If True, include Google Cloud Platform public datasets in the search
    --include-organization-ids=: List of Cloud Organization IDs to include in the search.
    --include-project-ids=: List of Cloud Project IDs to include in the search.
    --limit=: Maximum number of resources to list.
    --no-include-gcp-public-datasets&: If True, include Google Cloud Platform public datasets in the search
    --order-by=: Specifies the ordering of results.
    --page-size=: Some services group resource list output into pages.
    --restricted-locations=: List of locations to search within.
documentation:
    command: |4
        *(BETA)*  *(DEPRECATED)*  This command is deprecated. Please use `gcloud dataplex entries search` instead.

        Search Data Catalog for resources that match a query.
    flag:
        include-gcp-public-datasets: |-
            If True, include Google Cloud Platform public datasets in the search
            results.
        include-organization-ids: List of Cloud Organization IDs to include in the search.
        include-project-ids: List of Cloud Project IDs to include in the search.
        limit: Maximum number of resources to list. The default is *unlimited*.
        no-include-gcp-public-datasets: |
            If True, include Google Cloud Platform public datasets in the search
            results.
        order-by: |-
            Specifies the ordering of results. Defaults to 'relevance'.
            +
            Currently supported case-sensitive choices are:
            +
                *  relevance
                *  last_access_timestamp [asc|desc]: defaults to descending.
                *  last_modified_timestamp [asc|desc]: defaults to descending.
            +
            To order by last modified timestamp ascending, specify:
            `--order-by="last_modified_timestamp desc"`.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page.
        restricted-locations: List of locations to search within.
