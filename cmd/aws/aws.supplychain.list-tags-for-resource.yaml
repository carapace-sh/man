name: list-tags-for-resource
description: List all the tags for an Amazon Web ServicesSupply Chain resource.
flags:
    --resource-arn=!: The Amazon Web Services Supply chain resource ARN that needs tags to be listed.
documentation:
    command: List all the tags for an Amazon Web ServicesSupply Chain resource. You can list all the tags added to a resource. By listing the tags, developers can view the tag level information on a resource and perform actions such as, deleting a resource associated with a particular tag.
    flag:
        resource-arn: The Amazon Web Services Supply chain resource ARN that needs tags to be listed.
