name: create-and-attach-s3-access-point
description: Creates an S3 access point and attaches it to an Amazon FSx volume.
flags:
    --client-request-token=: ""
    --name=!: The name you want to assign to this S3 access point.
    --open-zfsconfiguration=: Specifies the configuration to use when creating and attaching an S3 access point to an FSx for OpenZFS volume.
    --s3-access-point=: Specifies the virtual private cloud (VPC) configuration if you're creating an access point that is restricted to a VPC.
    --type=!: The type of S3 access point you want to create.
completion:
    flag:
        type:
            - OPENZFS
documentation:
    command: |-
        Creates an S3 access point and attaches it to an Amazon FSx volume. For FSx for OpenZFS file systems, the volume must be hosted on a high-availability file system, either Single-AZ or Multi-AZ. For more information, see [Accessing your data using Amazon S3 access points](https://docs.aws.amazon.com/fsx/latest/OpenZFSGuide/s3accesspoints-for-FSx.html). in the Amazon FSx for OpenZFS User Guide.

        The requester requires the following permissions to perform these actions:

        - `fsx:CreateAndAttachS3AccessPoint`
        - `s3:CreateAccessPoint`
        - `s3:GetAccessPoint`
        - `s3:PutAccessPointPolicy`
        - `s3:DeleteAccessPoint`

        The following actions are related to `CreateAndAttachS3AccessPoint`:

        - [DescribeS3AccessPointAttachments]()
        - [DetachAndDeleteS3AccessPoint]()
    flag:
        client-request-token: ""
        name: The name you want to assign to this S3 access point.
        open-zfsconfiguration: Specifies the configuration to use when creating and attaching an S3 access point to an FSx for OpenZFS volume.
        s3-access-point: Specifies the virtual private cloud (VPC) configuration if you're creating an access point that is restricted to a VPC. For more information, see [Creating access points restricted to a virtual private cloud](https://docs.aws.amazon.com/fsx/latest/OpenZFSGuide/access-points-vpc.html).
        type: The type of S3 access point you want to create. Only `OpenZFS` is supported.
