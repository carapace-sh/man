name: describe-workspace-bundles
description: Retrieves a list that describes the available WorkSpace bundles.
flags:
    --bundle-ids=: The identifiers of the bundles.
    --next-token=: The token for the next set of results.
    --owner=: The owner of the bundles.
documentation:
    command: |-
        Retrieves a list that describes the available WorkSpace bundles.

        You can filter the results using either bundle ID or owner, but not both.
    flag:
        bundle-ids: The identifiers of the bundles. You cannot combine this parameter with any other filter.
        next-token: The token for the next set of results. (You received this token from a previous call.)
        owner: |-
            The owner of the bundles. You cannot combine this parameter with any other filter.

            To describe the bundles provided by Amazon Web Services, specify `AMAZON`. To describe the bundles that belong to your account, don't specify a value.
