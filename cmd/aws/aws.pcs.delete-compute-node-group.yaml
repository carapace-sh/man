name: delete-compute-node-group
description: Deletes a compute node group.
flags:
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --cluster-identifier=!: The name or ID of the cluster of the compute node group.
    --compute-node-group-identifier=!: The name or ID of the compute node group to delete.
documentation:
    command: Deletes a compute node group. You must delete all queues associated with the compute node group first.
    flag:
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. Idempotency ensures that an API request completes only once. With an idempotent request, if the original request completes successfully, the subsequent retries with the same client token return the result from the original successful request and they have no additional effect. If you don't specify a client token, the CLI and SDK automatically generate 1 for you.
        cluster-identifier: The name or ID of the cluster of the compute node group.
        compute-node-group-identifier: The name or ID of the compute node group to delete.
