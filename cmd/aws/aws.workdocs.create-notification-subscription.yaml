name: create-notification-subscription
description: Configure Amazon WorkDocs to use Amazon SNS notifications.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --endpoint=!: The endpoint to receive the notifications.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --organization-id=!: The ID of the organization.
    --protocol=!: The protocol to use.
    --subscription-type=!: The notification type.
completion:
    flag:
        protocol:
            - HTTPS
            - SQS
        subscription-type:
            - ALL
documentation:
    command: |-
        Configure Amazon WorkDocs to use Amazon SNS notifications. The endpoint receives a confirmation message, and must confirm the subscription.

        For more information, see [Setting up notifications for an IAM user or role](https://docs.aws.amazon.com/workdocs/latest/developerguide/manage-notifications.html) in the *Amazon WorkDocs Developer Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        endpoint: The endpoint to receive the notifications. If the protocol is HTTPS, the endpoint is a URL that begins with `https`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        organization-id: The ID of the organization.
        protocol: The protocol to use. The supported value is https, which delivers JSON-encoded messages using HTTPS POST.
        subscription-type: The notification type.
