name: create-meeting-with-attendees
description: Creates a new Amazon Chime SDK meeting in the specified media Region, with attendees.
flags:
    --attendees=!: The attendee information, including attendees' IDs and join tokens.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=!: The unique identifier for the client request.
    --external-meeting-id=!: The external meeting ID.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --media-placement-network-type=: The type of network for the media placement.
    --media-region=!: The Region in which to create the meeting.
    --meeting-features=: Lists the audio and video features enabled for a meeting, such as echo reduction.
    --meeting-host-id=: Reserved.
    --notifications-configuration=: The configuration for resource targets to receive notifications when meeting and attendee events occur.
    --primary-meeting-id=: When specified, replicates the media from the primary meeting to the new meeting.
    --tags=: The tags in the request.
    --tenant-ids=: A consistent and opaque identifier, created and maintained by the builder to represent a segment of their users.
completion:
    flag:
        media-placement-network-type:
            - Ipv4Only
            - DualStack
documentation:
    command: |-
        Creates a new Amazon Chime SDK meeting in the specified media Region, with attendees. For more information about specifying media Regions, see [Available Regions](https://docs.aws.amazon.com/chime-sdk/latest/dg/sdk-available-regions) and [Using meeting Regions](https://docs.aws.amazon.com/chime-sdk/latest/dg/chime-sdk-meetings-regions.html), both in the *Amazon Chime SDK Developer Guide*. For more information about the Amazon Chime SDK, see [Using the Amazon Chime SDK](https://docs.aws.amazon.com/chime-sdk/latest/dg/meetings-sdk.html) in the *Amazon Chime SDK Developer Guide*.

        If you use this API in conjuction with the and APIs, and you don't specify the `MeetingFeatures.Content.MaxResolution` or `MeetingFeatures.Video.MaxResolution` parameters, the following defaults are used:

        - Content.MaxResolution: FHD
        - Video.MaxResolution: HD
    flag:
        attendees: The attendee information, including attendees' IDs and join tokens.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: The unique identifier for the client request. Use a different token for different meetings.
        external-meeting-id: |-
            The external meeting ID.

            Pattern: `[-_&@+=,(){}\[\]\/«».:|'"#a-zA-Z0-9À-ÿ\s]*`

            Values that begin with `aws:` are reserved. You can't configure a value that uses this prefix. Case insensitive.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        media-placement-network-type: The type of network for the media placement. Either IPv4 only or dual-stack (IPv4 and IPv6).
        media-region: |-
            The Region in which to create the meeting.

            Available values: `af-south-1`, `ap-northeast-1`, `ap-northeast-2`, `ap-south-1`, `ap-southeast-1`, `ap-southeast-2`, `ca-central-1`, `eu-central-1`, `eu-north-1`, `eu-south-1`, `eu-west-1`, `eu-west-2`, `eu-west-3`, `sa-east-1`, `us-east-1`, `us-east-2`, `us-west-1`, `us-west-2`.

            Available values in Amazon Web Services GovCloud (US) Regions: `us-gov-east-1`, `us-gov-west-1`.
        meeting-features: Lists the audio and video features enabled for a meeting, such as echo reduction.
        meeting-host-id: Reserved.
        notifications-configuration: The configuration for resource targets to receive notifications when meeting and attendee events occur.
        primary-meeting-id: When specified, replicates the media from the primary meeting to the new meeting.
        tags: The tags in the request.
        tenant-ids: A consistent and opaque identifier, created and maintained by the builder to represent a segment of their users.
