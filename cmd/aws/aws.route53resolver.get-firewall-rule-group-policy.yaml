name: get-firewall-rule-group-policy
description: Returns the Identity and Access Management (Amazon Web Services IAM) policy for sharing the specified rule group.
flags:
    --arn=!: The ARN (Amazon Resource Name) for the rule group.
documentation:
    command: Returns the Identity and Access Management (Amazon Web Services IAM) policy for sharing the specified rule group. You can use the policy to share the rule group using Resource Access Manager (RAM).
    flag:
        arn: The ARN (Amazon Resource Name) for the rule group.
