name: deny
description: '*(BETA)*  Add values to an Organization Policy denied_values list policy.'
flags:
    --folder=: Folder ID.
    --organization=: Organization ID.
documentation:
    command: |-
        *(BETA)*  Adds one or more values to the specified Organization Policy denied_values
        list policy associated with the specified resource.

        ## EXAMPLES

        The following command adds `devEnv` and `prodEnv` to an Organization Policy
        denied_values list policy for constraint `serviceuser.services`
        on project `foo-project`:

          $ gcloud beta resource-manager org-policies deny serviceuser.services --project=foo-project devEnv prodEnv
    flag:
        folder: Folder ID.
        organization: Organization ID.
