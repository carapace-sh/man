name: describe
description: '*(ALPHA)*  Describe a Data Attribute Binding resource.'
flags:
    --location=: Location of the Dataplex resource.
documentation:
    command: |
        *(ALPHA)*  Describe a Data Attribute Binding resource.
        Displays all details of a Data Attribute Binding resource given a valid DataAttributeBindingID.
    flag:
        location: |-
            Location of the Dataplex resource.
            +

            To set the `location` attribute:
            * provide the argument `data_attribute_binding` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
