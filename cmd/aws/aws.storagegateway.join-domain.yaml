name: join-domain
description: Adds a file gateway to an Active Directory domain.
flags:
    --domain-controllers=: List of IP addresses, NetBIOS names, or host names of your domain server.
    --domain-name=!: The name of the domain that you want the gateway to join.
    --gateway-arn=!: The Amazon Resource Name (ARN) of the gateway.
    --organizational-unit=: The organizational unit (OU) is a container in an Active Directory that can hold users, groups, computers, and other OUs and this parameter specifies the OU that the gateway will join within the AD domain.
    --password=!: Sets the password of the user who has permission to add the gateway to the Active Directory domain.
    --timeout-in-seconds=: Specifies the time in seconds, in which the `JoinDomain` operation must complete.
    --user-name=!: Sets the user name of user who has permission to add the gateway to the Active Directory domain.
documentation:
    command: |-
        Adds a file gateway to an Active Directory domain. This operation is only supported for file gateways that support the SMB file protocol.

        Joining a domain creates an Active Directory computer account in the default organizational unit, using the gateway's **Gateway ID** as the account name (for example, SGW-1234ADE). If your Active Directory environment requires that you pre-stage accounts to facilitate the join domain process, you will need to create this account ahead of time.

        To create the gateway's computer account in an organizational unit other than the default, you must specify the organizational unit when joining the domain.
    flag:
        domain-controllers: |-
            List of IP addresses, NetBIOS names, or host names of your domain server. If you need to specify the port number include it after the colon (“:”). For example, `mydc.mydomain.com:389`.

            S3 File Gateway supports IPv6 addresses in addition to IPv4 and other existing formats.

            FSx File Gateway does not support IPv6.
        domain-name: The name of the domain that you want the gateway to join.
        gateway-arn: The Amazon Resource Name (ARN) of the gateway. Use the `ListGateways` operation to return a list of gateways for your account and Amazon Web Services Region.
        organizational-unit: The organizational unit (OU) is a container in an Active Directory that can hold users, groups, computers, and other OUs and this parameter specifies the OU that the gateway will join within the AD domain.
        password: Sets the password of the user who has permission to add the gateway to the Active Directory domain.
        timeout-in-seconds: Specifies the time in seconds, in which the `JoinDomain` operation must complete. The default is 20 seconds.
        user-name: Sets the user name of user who has permission to add the gateway to the Active Directory domain. The domain user account should be enabled to join computers to the domain. For example, you can use the domain administrator account or an account with delegated permissions to join computers to the domain.
