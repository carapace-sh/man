name: retry-pipeline-execution
description: Retry the execution of the pipeline.
flags:
    --client-request-token=!: A unique, case-sensitive identifier that you provide to ensure the idempotency of the operation.
    --parallelism-configuration=: This configuration, if specified, overrides the parallelism configuration of the parent pipeline.
    --pipeline-execution-arn=!: The Amazon Resource Name (ARN) of the pipeline execution.
documentation:
    command: Retry the execution of the pipeline.
    flag:
        client-request-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the operation. An idempotent operation completes no more than once.
        parallelism-configuration: This configuration, if specified, overrides the parallelism configuration of the parent pipeline.
        pipeline-execution-arn: The Amazon Resource Name (ARN) of the pipeline execution.
