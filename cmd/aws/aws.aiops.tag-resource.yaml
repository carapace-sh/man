name: tag-resource
description: Assigns one or more tags (key-value pairs) to the specified resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource that you want to apply the tags to.
    --tags=!: The list of key-value pairs to associate with the resource.
documentation:
    command: |-
        Assigns one or more tags (key-value pairs) to the specified resource.

        Tags can help you organize and categorize your resources. You can also use them to scope user permissions by granting a user permission to access or change only resources with certain tag values.

        Tags don't have any semantic meaning to Amazon Web Services and are interpreted strictly as strings of characters.

        You can associate as many as 50 tags with a resource.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource that you want to apply the tags to. You can use the `ListInvestigationGroups` operation to find the ARNs of investigation groups.
        tags: The list of key-value pairs to associate with the resource.
