name: update-practice-run-configuration
description: 'Update a practice run configuration to change one or more of the following: add, change, or remove the blocking alarm; change the outcome alarm; or add, change, or remove blocking dates or time windows.'
flags:
    --allowed-windows=:
        description: Add, change, or remove windows of days and times for when you can, optionally, allow ARC to start a practice run for a resource.
        nargs: -1
    --blocked-dates=:
        description: Add, change, or remove blocked dates for a practice run in zonal autoshift.
        nargs: -1
    --blocked-windows=:
        description: Add, change, or remove windows of days and times for when you can, optionally, block ARC from starting a practice run for a resource.
        nargs: -1
    --blocking-alarms=:
        description: Add, change, or remove the Amazon CloudWatch alarms that you optionally specify as the blocking alarms for practice runs.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --outcome-alarms=:
        description: Specify one or more Amazon CloudWatch alarms as the outcome alarms for practice runs.
        nargs: -1
    --resource-identifier=!: The identifier for the resource that you want to update the practice run configuration for.
documentation:
    command: 'Update a practice run configuration to change one or more of the following: add, change, or remove the blocking alarm; change the outcome alarm; or add, change, or remove blocking dates or time windows.'
    flag:
        allowed-windows: |-
            Add, change, or remove windows of days and times for when you can, optionally, allow ARC to start a practice run for a resource.

            The format for allowed windows is: DAY:HH:SS-DAY:HH:SS. Keep in mind, when you specify dates, that dates and times for practice runs are in UTC. Also, be aware of potential time adjustments that might be required for daylight saving time differences. Separate multiple allowed windows with spaces.

            For example, say you want to allow practice runs only on Wednesdays and Fridays from noon to 5 p.m. For this scenario, you could set the following recurring days and times as allowed windows, for example: `Wed-12:00-Wed:17:00 Fri-12:00-Fri:17:00`.

            The `allowedWindows` have to start and end on the same day. Windows that span multiple days aren't supported.
        blocked-dates: |-
            Add, change, or remove blocked dates for a practice run in zonal autoshift.

            Optionally, you can block practice runs for specific calendar dates. The format for blocked dates is: YYYY-MM-DD. Keep in mind, when you specify dates, that dates and times for practice runs are in UTC. Separate multiple blocked dates with spaces.

            For example, if you have an application update scheduled to launch on May 1, 2024, and you don't want practice runs to shift traffic away at that time, you could set a blocked date for `2024-05-01`.
        blocked-windows: |-
            Add, change, or remove windows of days and times for when you can, optionally, block ARC from starting a practice run for a resource.

            The format for blocked windows is: DAY:HH:SS-DAY:HH:SS. Keep in mind, when you specify dates, that dates and times for practice runs are in UTC. Also, be aware of potential time adjustments that might be required for daylight saving time differences. Separate multiple blocked windows with spaces.

            For example, say you run business report summaries three days a week. For this scenario, you might set the following recurring days and times as blocked windows, for example: `MON-20:30-21:30 WED-20:30-21:30 FRI-20:30-21:30`.
        blocking-alarms: Add, change, or remove the Amazon CloudWatch alarms that you optionally specify as the blocking alarms for practice runs.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        outcome-alarms: Specify one or more Amazon CloudWatch alarms as the outcome alarms for practice runs.
        resource-identifier: The identifier for the resource that you want to update the practice run configuration for. The identifier is the Amazon Resource Name (ARN) for the resource.
