name: update-ephemeris
description: Updates an existing ephemeris
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --enabled!: Whether the ephemeris is enabled or not.
    --ephemeris-id=!: The AWS Ground Station ephemeris ID.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=: A name string associated with the ephemeris.
    --no-enabled!: Whether the ephemeris is enabled or not.
    --priority=: Customer-provided priority score to establish the order in which overlapping ephemerides should be used.
documentation:
    command: Updates an existing ephemeris
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        enabled: Whether the ephemeris is enabled or not. Changing this value will not require the ephemeris to be re-validated.
        ephemeris-id: The AWS Ground Station ephemeris ID.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: A name string associated with the ephemeris. Used as a human-readable identifier for the ephemeris.
        priority: |-
            Customer-provided priority score to establish the order in which overlapping ephemerides should be used.

            The default for customer-provided ephemeris priority is 1, and higher numbers take precedence.

            Priority must be 1 or greater
