name: send-custom-verification-email
description: Adds an email address to the list of identities for your Amazon SES account in the current Amazon Web Services Region and attempts to verify it.
flags:
    --configuration-set-name=: Name of a configuration set to use when sending the verification email.
    --email-address=!: The email address to verify.
    --template-name=!: The name of the custom verification email template to use when sending the verification email.
documentation:
    command: |-
        Adds an email address to the list of identities for your Amazon SES account in the current Amazon Web Services Region and attempts to verify it. As a result of executing this operation, a customized verification email is sent to the specified address.

        To use this operation, you must first create a custom verification email template. For more information about creating and using custom verification email templates, see [Using Custom Verification Email Templates](https://docs.aws.amazon.com/ses/latest/dg/creating-identities.html#send-email-verify-address-custom) in the *Amazon SES Developer Guide*.

        You can execute this operation no more than once per second.
    flag:
        configuration-set-name: Name of a configuration set to use when sending the verification email.
        email-address: The email address to verify.
        template-name: The name of the custom verification email template to use when sending the verification email.
