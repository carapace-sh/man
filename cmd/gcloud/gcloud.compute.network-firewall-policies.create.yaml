name: create
description: Create a Compute Engine Network firewall policy.
flags:
    --description=: An optional, textual description for the network firewall policy.
    --global: If set, the firewall policy is global.
    --no-global&: If set, the firewall policy is global.
    --policy-type=: Network firewall policy type.
    --region=: Region of the firewall policy to create.
completion:
    flag:
        policy-type:
            - VPC_POLICY
            - RDMA_ROCE_POLICY
documentation:
    command: |-
        *gcloud compute network-firewall-policies create* is used to create network firewall policies. A network
        firewall policy is a set of rules that controls access to various resources.
    flag:
        description: An optional, textual description for the network firewall policy.
        global: If set, the firewall policy is global.
        no-global: If set, the firewall policy is global.
        policy-type: 'Network firewall policy type. _POLICY_TYPE_ must be one of: *VPC_POLICY*, *RDMA_ROCE_POLICY*.'
        region: Region of the firewall policy to create. Overrides the default *compute/region* property value for this command invocation.
