name: remove-tags
description: '*(ALPHA)*  Remove tags from Compute Engine virtual machine instances.'
flags:
    --all: Remove all tags from the instance.
    --no-all&: Remove all tags from the instance.
    --tags=: Specifies strings to be removed from the instance tags.
    --zone=: Zone of the instance to set tags on.
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute instances remove-tags* is used to remove tags from Compute Engine virtual
        machine instances.
    flag:
        all: Remove all tags from the instance.
        no-all: Remove all tags from the instance.
        tags: |-
            Specifies strings to be removed from the instance tags.
            Multiple tags can be removed by repeating this flag.
        zone: |-
            Zone of the instance to set tags on. If not specified, you might be prompted to select a zone (interactive mode
            only). `gcloud` attempts to identify the appropriate zone by searching for
            resources in your currently active project. If the zone cannot be determined,
            `gcloud` prompts you for a selection with all available Google Cloud Platform
            zones.
            +
            To avoid prompting when this flag is omitted, the user can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
