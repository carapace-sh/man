name: create-provisioning-profile
description: Create a provisioning profile for a device to execute the provisioning flows using a provisioning template.
flags:
    --ca-certificate=: The id of the certificate authority (CA) certificate.
    --client-token=: An idempotency token.
    --name=: The name of the provisioning template.
    --provisioning-type=!: The type of provisioning workflow the device uses for onboarding to IoT managed integrations.
    --tags=: A set of key/value pairs that are used to manage the provisioning profile.
completion:
    flag:
        provisioning-type:
            - FLEET_PROVISIONING
            - JITR
documentation:
    command: Create a provisioning profile for a device to execute the provisioning flows using a provisioning template. The provisioning template is a document that defines the set of resources and policies applied to a device during the provisioning process.
    flag:
        ca-certificate: The id of the certificate authority (CA) certificate.
        client-token: An idempotency token. If you retry a request that completed successfully initially using the same client token and parameters, then the retry attempt will succeed without performing any further actions.
        name: The name of the provisioning template.
        provisioning-type: The type of provisioning workflow the device uses for onboarding to IoT managed integrations.
        tags: A set of key/value pairs that are used to manage the provisioning profile.
