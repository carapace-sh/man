name: get-group
description: Returns information about one group.
flags:
    --group-identifier=!: Specifies the group to return information for.
documentation:
    command: Returns information about one group. Groups are a global resource, so you can use this operation from any Region.
    flag:
        group-identifier: Specifies the group to return information for. You can specify the group name, the ARN, or the group ID as the `GroupIdentifier`.
