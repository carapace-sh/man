name: describe-folder-resolved-permissions
description: Describes the folder resolved permissions.
flags:
    --aws-account-id=!: The ID for the Amazon Web Services account that contains the folder.
    --folder-id=!: The ID of the folder.
    --max-results=: The maximum number of results to be returned per request.
    --namespace=: The namespace of the folder whose permissions you want described.
    --next-token=: A pagination token for the next set of results.
documentation:
    command: Describes the folder resolved permissions. Permissions consists of both folder direct permissions and the inherited permissions from the ancestor folders.
    flag:
        aws-account-id: The ID for the Amazon Web Services account that contains the folder.
        folder-id: The ID of the folder.
        max-results: The maximum number of results to be returned per request.
        namespace: The namespace of the folder whose permissions you want described.
        next-token: A pagination token for the next set of results.
