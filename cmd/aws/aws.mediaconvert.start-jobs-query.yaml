name: start-jobs-query
description: Start an asynchronous jobs query using the provided filters.
flags:
    --filter-list=: Optional.
    --max-results=: Optional.
    --next-token=: Use this string to request the next batch of jobs matched by a jobs query.
    --order=: Optional.
completion:
    flag:
        order:
            - ASCENDING
            - DESCENDING
documentation:
    command: Start an asynchronous jobs query using the provided filters. To receive the list of jobs that match your query, call the GetJobsQueryResults API using the query ID returned by this API.
    flag:
        filter-list: Optional. Provide an array of JobsQueryFilters for your StartJobsQuery request.
        max-results: Optional. Number of jobs, up to twenty, that will be included in the jobs query.
        next-token: Use this string to request the next batch of jobs matched by a jobs query.
        order: Optional. When you request lists of resources, you can specify whether they are sorted in ASCENDING or DESCENDING order. Default varies by resource.
