        --metadata=: The key-value metadata to attach to the event.
        --payload=!:
            description: The content payload of the event.
            nargs: -1
        --session-id=: The identifier of the session in which this event occurs.
      documentation:
        command: |-
            Creates an event in an AgentCore Memory resource. Events represent interactions or activities that occur within a session and are associated with specific actors.

            To use this operation, you must have the `bedrock-agentcore:CreateEvent` permission.

            This operation is subject to request rate limiting.
        flag:
            actor-id: The identifier of the actor associated with this event. An actor represents an entity that participates in sessions and generates events.
            branch: The branch information for this event. Branches allow for organizing events into different conversation threads or paths.
            cli-input-json: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            cli-input-yaml: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            client-token: A unique, case-sensitive identifier to ensure that the operation completes no more than one time. If this token matches a previous request, AgentCore ignores the request, but does not return an error.
            event-timestamp: The timestamp when the event occurred. If not specified, the current time is used.
            generate-cli-skeleton: |-
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            memory-id: The identifier of the AgentCore Memory resource in which to create the event.
            metadata: The key-value metadata to attach to the event.
            payload: The content payload of the event. This can include conversational data or binary content.
            session-id: The identifier of the session in which this event occurs. A session represents a sequence of related events.
