name: get-effective
description: '*(BETA)*  Get effective MCP policy for a project, folder or organization.'
hidden: true
flags:
    --folder=: The Google Cloud Platform folder ID to use for this invocation.
    --organization=: The Google Cloud Platform organization ID to use for this invocation.
    --view=: The view of the effective MCP policy.
completion:
    flag:
        view:
            - BASIC
            - FULL
documentation:
    command: |-
        *(BETA)*  Get effective MCP policy for a project, folder or organization.

        ## EXAMPLES

         Get effective MCP policy for the current project:

         $ gcloud beta services mcp policies get-effective

         Get effective MCP policy for project `my-project`:

         $ gcloud beta services mcp policies get-effective --project=my-project
    flag:
        folder: The Google Cloud Platform folder ID to use for this invocation.
        organization: The Google Cloud Platform organization ID to use for this invocation.
        view: 'The view of the effective MCP policy. BASIC includes basic metadata about the effective MCP policy. FULL includes every information related to effective MCP policy. _VIEW_ must be one of: *BASIC*, *FULL*.'
