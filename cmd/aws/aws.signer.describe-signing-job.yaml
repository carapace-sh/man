name: describe-signing-job
description: Returns information about a specific code signing job.
flags:
    --job-id=!: The ID of the signing job on input.
documentation:
    command: Returns information about a specific code signing job. You specify the job by using the `jobId` value that is returned by the [StartSigningJob]() operation.
    flag:
        job-id: The ID of the signing job on input.
