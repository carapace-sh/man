name: create-asset-model
description: Creates an asset model from specified property and hierarchy definitions.
flags:
    --asset-model-composite-models=: The composite models that are part of this asset model.
    --asset-model-description=: A description for the asset model.
    --asset-model-external-id=: An external ID to assign to the asset model.
    --asset-model-hierarchies=: The hierarchy definitions of the asset model.
    --asset-model-id=: The ID to assign to the asset model, if desired.
    --asset-model-name=!: A unique name for the asset model.
    --asset-model-properties=: The property definitions of the asset model.
    --asset-model-type=: The type of asset model.
    --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
    --tags=: A list of key-value pairs that contain metadata for the asset model.
completion:
    flag:
        asset-model-type:
            - ASSET_MODEL
            - COMPONENT_MODEL
            - INTERFACE
documentation:
    command: |-
        Creates an asset model from specified property and hierarchy definitions. You create assets from asset models. With asset models, you can easily create assets of the same type that have standardized definitions. Each asset created from a model inherits the asset model's property and hierarchy definitions. For more information, see [Defining asset models](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/define-models.html) in the *IoT SiteWise User Guide*.

        You can create three types of asset models, `ASSET_MODEL`, `COMPONENT_MODEL`, or an `INTERFACE`.

        - **ASSET\_MODEL** – (default) An asset model that you can use to create assets. Can't be included as a component in another asset model.
        - **COMPONENT\_MODEL** – A reusable component that you can include in the composite models of other asset models. You can't create assets directly from this type of asset model.
        - **INTERFACE** – An interface is a type of model that defines a standard structure that can be applied to different asset models.
    flag:
        asset-model-composite-models: |-
            The composite models that are part of this asset model. It groups properties (such as attributes, measurements, transforms, and metrics) and child composite models that model parts of your industrial equipment. Each composite model has a type that defines the properties that the composite model supports. Use composite models to define alarms on this asset model.

            When creating custom composite models, you need to use [CreateAssetModelCompositeModel](https://docs.aws.amazon.com/iot-sitewise/latest/APIReference/API_CreateAssetModelCompositeModel.html). For more information, see [Creating custom composite models (Components)](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/create-custom-composite-models.html) in the *IoT SiteWise User Guide*.
        asset-model-description: A description for the asset model.
        asset-model-external-id: An external ID to assign to the asset model. The external ID must be unique within your Amazon Web Services account. For more information, see [Using external IDs](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/object-ids.html#external-ids) in the *IoT SiteWise User Guide*.
        asset-model-hierarchies: |-
            The hierarchy definitions of the asset model. Each hierarchy specifies an asset model whose assets can be children of any other assets created from this asset model. For more information, see [Asset hierarchies](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/asset-hierarchies.html) in the *IoT SiteWise User Guide*.

            You can specify up to 10 hierarchies per asset model. For more information, see [Quotas](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/quotas.html) in the *IoT SiteWise User Guide*.
        asset-model-id: The ID to assign to the asset model, if desired. IoT SiteWise automatically generates a unique ID for you, so this parameter is never required. However, if you prefer to supply your own ID instead, you can specify it here in UUID format. If you specify your own ID, it must be globally unique.
        asset-model-name: A unique name for the asset model.
        asset-model-properties: |-
            The property definitions of the asset model. For more information, see [Asset properties](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/asset-properties.html) in the *IoT SiteWise User Guide*.

            You can specify up to 200 properties per asset model. For more information, see [Quotas](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/quotas.html) in the *IoT SiteWise User Guide*.
        asset-model-type: |-
            The type of asset model.

            - **ASSET\_MODEL** – (default) An asset model that you can use to create assets. Can't be included as a component in another asset model.
            - **COMPONENT\_MODEL** – A reusable component that you can include in the composite models of other asset models. You can't create assets directly from this type of asset model.
        client-token: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request. Don't reuse this client token if a new idempotent request is required.
        tags: A list of key-value pairs that contain metadata for the asset model. For more information, see [Tagging your IoT SiteWise resources](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/tag-resources.html) in the *IoT SiteWise User Guide*.
