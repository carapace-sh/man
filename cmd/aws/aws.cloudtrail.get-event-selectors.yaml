name: get-event-selectors
description: Describes the settings for the event selectors that you configured for your trail.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --trail-name=!: Specifies the name of the trail or trail ARN.
documentation:
    command: |-
        Describes the settings for the event selectors that you configured for your trail. The information returned for your event selectors includes the following:

        - If your event selector includes read-only events, write-only events, or all events. This applies to management events, data events, and network activity events.
        - If your event selector includes management events.
        - If your event selector includes network activity events, the event sources for which you are logging network activity events.
        - If your event selector includes data events, the resources on which you are logging data events.

        For more information about logging management, data, and network activity events, see the following topics in the *CloudTrail User Guide*:

        - [Logging management events](https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-management-events-with-cloudtrail.html)
        - [Logging data events](https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-data-events-with-cloudtrail.html)
        - [Logging network activity events](https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-network-events-with-cloudtrail.html)
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        trail-name: |-
            Specifies the name of the trail or trail ARN. If you specify a trail name, the string must meet the following requirements:

            - Contain only ASCII letters (a-z, A-Z), numbers (0-9), periods (.), underscores (\_), or dashes (-)
            - Start with a letter or number, and end with a letter or number
            - Be between 3 and 128 characters
            - Have no adjacent periods, underscores or dashes. Names like `my-_namespace` and `my--namespace` are not valid.
            - Not be in IP address format (for example, 192.168.5.4)

            If you specify a trail ARN, it must be in the format:

            `arn:aws:cloudtrail:us-east-2:123456789012:trail/MyTrail`
