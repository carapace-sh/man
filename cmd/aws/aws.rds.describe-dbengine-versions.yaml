name: describe-dbengine-versions
description: Describes the properties of specific versions of DB engines.
flags:
    --dbparameter-group-family=: The name of a specific DB parameter group family to return details for.
    --default-only: Specifies whether to return only the default version of the specified engine or the engine and major version combination.
    --engine-version=: A specific database engine version to return details for.
    --engine=: The database engine to return version details for.
    --filters=: A filter that specifies one or more DB engine versions to describe.
    --include-all=: Specifies whether to also list the engine versions that aren't available.
    --list-supported-character-sets=: Specifies whether to list the supported character sets for each engine version.
    --list-supported-timezones=: Specifies whether to list the supported time zones for each engine version.
    --marker=: An optional pagination token provided by a previous request.
    --max-records=: The maximum number of records to include in the response.
    --no-default-only: Specifies whether to return only the default version of the specified engine or the engine and major version combination.
documentation:
    command: Describes the properties of specific versions of DB engines.
    flag:
        dbparameter-group-family: |-
            The name of a specific DB parameter group family to return details for.

            Constraints:

            - If supplied, must match an existing DB parameter group family.
        default-only: Specifies whether to return only the default version of the specified engine or the engine and major version combination.
        engine: |-
            The database engine to return version details for.

            Valid Values:

            - `aurora-mysql`
            - `aurora-postgresql`
            - `custom-oracle-ee`
            - `custom-oracle-ee-cdb`
            - `custom-oracle-se2`
            - `custom-oracle-se2-cdb`
            - `db2-ae`
            - `db2-se`
            - `mariadb`
            - `mysql`
            - `oracle-ee`
            - `oracle-ee-cdb`
            - `oracle-se2`
            - `oracle-se2-cdb`
            - `postgres`
            - `sqlserver-ee`
            - `sqlserver-se`
            - `sqlserver-ex`
            - `sqlserver-web`
        engine-version: |-
            A specific database engine version to return details for.

            Example: `5.1.49`
        filters: "A filter that specifies one or more DB engine versions to describe.\n\nSupported filters:\n\n- `db-parameter-group-family` - Accepts parameter groups family names. The results list only includes information about the DB engine versions for these parameter group families.\n- `engine` - Accepts engine names. The results list only includes information about the DB engine versions for these engines.\n- `engine-mode` - Accepts DB engine modes. The results list only includes information about the DB engine versions for these engine modes. Valid DB engine modes are the following:\n  \n  - `global`\n  - `multimaster`\n  - `parallelquery`\n  - `provisioned`\n  - `serverless`\n- `engine-version` - Accepts engine versions. The results list only includes information about the DB engine versions for these engine versions.\n- `status` - Accepts engine version statuses. The results list only includes information about the DB engine versions for these statuses. Valid statuses are the following:\n  \n  - `available`\n  - `deprecated`"
        include-all: Specifies whether to also list the engine versions that aren't available. The default is to list only available engine versions.
        list-supported-character-sets: |-
            Specifies whether to list the supported character sets for each engine version.

            If this parameter is enabled and the requested engine supports the `CharacterSetName` parameter for `CreateDBInstance`, the response includes a list of supported character sets for each engine version.

            For RDS Custom, the default is not to list supported character sets. If you enable this parameter, RDS Custom returns no results.
        list-supported-timezones: |-
            Specifies whether to list the supported time zones for each engine version.

            If this parameter is enabled and the requested engine supports the `TimeZone` parameter for `CreateDBInstance`, the response includes a list of supported time zones for each engine version.

            For RDS Custom, the default is not to list supported time zones. If you enable this parameter, RDS Custom returns no results.
        marker: An optional pagination token provided by a previous request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more than the `MaxRecords` value is available, a pagination token called a marker is included in the response so you can retrieve the remaining results.

            Default: 100

            Constraints: Minimum 20, maximum 100.
