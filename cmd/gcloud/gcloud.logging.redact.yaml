name: redact
description: Redact log entries.
hidden: true
flags:
    --billing-account=: Billing account of the log entries to redact.
    --folder=: Folder of the log entries to redact.
    --location=!: Location of the bucket.
    --log-filter=: A filter specifying which log entries to Redact.
    --organization=: Organization of the log entries to redact.
    --reason=!: The reason for the redaction.
documentation:
    command: |
        gcloud logging redact starts the process to redact log entries from a log bucket.
    flag:
        billing-account: Billing account of the log entries to redact.
        folder: Folder of the log entries to redact.
        location: Location of the bucket.
        log-filter: A filter specifying which log entries to Redact. The filter must be no more than 20k characters. An empty filter matches all log entries.
        organization: Organization of the log entries to redact.
        reason: The reason for the redaction. This field will be recorded in redacted log entries and should omit sensitive information. Required to be less than 1024 characters.
