name: list
description: '*(ALPHA)*  List Marketplace Solution networks in a project.'
hidden: true
flags:
    --limit=: Maximum number of resources to list.
    --region=!: ID of the region or fully qualified identifier for the region.
documentation:
    command: |
        *(ALPHA)*  List Marketplace Solutions networks in a project.
    flag:
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        region: |-
            ID of the region or fully qualified identifier for the region.
            +
            To set the `region` attribute:
            * provide the argument `--region` on the command line.
