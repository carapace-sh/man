name: delete-rum-metrics-destination
description: Deletes a destination for CloudWatch RUM extended metrics, so that the specified app monitor stops sending extended metrics to that destination.
flags:
    --app-monitor-name=!: The name of the app monitor that is sending metrics to the destination that you want to delete.
    --destination-arn=: This parameter is required if `Destination` is `Evidently`.
    --destination=!: The type of destination to delete.
completion:
    flag:
        destination:
            - CloudWatch
            - Evidently
documentation:
    command: Deletes a destination for CloudWatch RUM extended metrics, so that the specified app monitor stops sending extended metrics to that destination.
    flag:
        app-monitor-name: The name of the app monitor that is sending metrics to the destination that you want to delete.
        destination: The type of destination to delete. Valid values are `CloudWatch` and `Evidently`.
        destination-arn: This parameter is required if `Destination` is `Evidently`. If `Destination` is `CloudWatch`, do not use this parameter. This parameter specifies the ARN of the Evidently experiment that corresponds to the destination to delete.
