        no-skip-ssl: Skip SSL certificate verification for MySQL instances.
        port: Port number that gcloud will use to connect to the Cloud SQL Proxy through localhost.
        private-ip: Connect to the Cloud SQL instance using private IP.
        psc: Connect to the Cloud SQL instance using Private Service Connect.
        run-connection-test: Run connection test for Cloud SQL Proxy.
        skip-ssl: Skip SSL certificate verification for MySQL instances.
        user: Cloud SQL instance user to connect as.
