name: delete
description: '*(ALPHA)*  Delete a fleet.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |-
        *(ALPHA)*  This command can fail for the following reasons:
        * The project specified does not exist.
        * The project specified already has a fleet.
        * The active account does not have permission to access the given project.

        ## EXAMPLES

        To delete a fleet in project `example-foo-bar-1`, run:

          $ gcloud alpha container fleet delete --project=example-foo-bar-1
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
