name: modify-vpc-attribute
description: Modifies the specified attribute of the specified VPC.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --enable-dns-hostnames: Indicates whether the instances launched in the VPC get DNS hostnames.
    --enable-dns-support: Indicates whether the DNS resolution is supported for the VPC.
    --enable-network-address-usage-metrics: Indicates whether Network Address Usage metrics are enabled for your VPC.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-enable-dns-hostnames: Indicates whether the instances launched in the VPC get DNS hostnames.
    --no-enable-dns-support: Indicates whether the DNS resolution is supported for the VPC.
    --no-enable-network-address-usage-metrics: Indicates whether Network Address Usage metrics are enabled for your VPC.
    --vpc-id=!: The ID of the VPC.
documentation:
    command: Modifies the specified attribute of the specified VPC.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        enable-dns-hostnames: |-
            Indicates whether the instances launched in the VPC get DNS hostnames. If enabled, instances in the VPC get DNS hostnames; otherwise, they do not.

            You cannot modify the DNS resolution and DNS hostnames attributes in the same request. Use separate requests for each attribute. You can only enable DNS hostnames if you've enabled DNS support.
        enable-dns-support: |-
            Indicates whether the DNS resolution is supported for the VPC. If enabled, queries to the Amazon provided DNS server at the 169.254.169.253 IP address, or the reserved IP address at the base of the VPC network range "plus two" succeed. If disabled, the Amazon provided DNS service in the VPC that resolves public DNS hostnames to IP addresses is not enabled.

            You cannot modify the DNS resolution and DNS hostnames attributes in the same request. Use separate requests for each attribute.
        enable-network-address-usage-metrics: Indicates whether Network Address Usage metrics are enabled for your VPC.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        vpc-id: The ID of the VPC.
