name: put-asset-model-interface-relationship
description: Creates or updates an interface relationship between an asset model and an interface asset model.
flags:
    --asset-model-id=!: The ID of the asset model.
    --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
    --interface-asset-model-id=!: The ID of the interface asset model.
    --property-mapping-configuration=!: The configuration for mapping properties from the interface asset model to the asset model where the interface is applied.
documentation:
    command: Creates or updates an interface relationship between an asset model and an interface asset model. This operation applies an interface to an asset model.
    flag:
        asset-model-id: 'The ID of the asset model. This can be either the actual ID in UUID format, or else externalId: followed by the external ID.'
        client-token: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request. Don't reuse this client token if a new idempotent request is required.
        interface-asset-model-id: 'The ID of the interface asset model. This can be either the actual ID in UUID format, or else externalId: followed by the external ID.'
        property-mapping-configuration: The configuration for mapping properties from the interface asset model to the asset model where the interface is applied. This configuration controls how properties are matched and created during the interface application process.
