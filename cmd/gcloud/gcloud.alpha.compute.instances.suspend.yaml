name: suspend
description: '*(ALPHA)*  Suspend a virtual machine instance.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --discard-local-ssd=:
        description: If set to true, local SSD data is discarded.
        nargs: -1
    --no-async&: Return immediately, without waiting for the operation in progress to
    --zone=: Zone of the instances to operate on.
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute instances suspend* is used to suspend a Compute Engine virtual machine.
        Suspending a VM is the equivalent of sleep or standby mode: the guest
        receives an ACPI S3 suspend signal, after which all VM state is saved to
        temporary storage. An instance can only be suspended while it is in the
        RUNNING state. A suspended instance will be put in SUSPENDED state.

        Note: A suspended instance can be resumed by running the gcloud compute
        instances resume command.

        If a VM has any attached Local SSD disks, you can preserve the Local SSD
        data when you suspend the VM by setting `--discard-local-ssd=False`.
        Preserving the Local SSD disk data incurs costs and is subject to
        limitations.

        Limitations:

         - Limitations for suspending a VM: https://cloud.google.com/compute/docs/instances/suspend-resume-instance#limitations
         - Limitations for preserving Local SSD data: https://cloud.google.com/compute/docs/disks/local-ssd#stop_instance
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        discard-local-ssd: If set to true, local SSD data is discarded.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        zone: |-
            Zone of the instances to operate on. If not specified, you might be prompted to select a zone (interactive mode
            only). `gcloud` attempts to identify the appropriate zone by searching for
            resources in your currently active project. If the zone cannot be determined,
            `gcloud` prompts you for a selection with all available Google Cloud Platform
            zones.
            +
            To avoid prompting when this flag is omitted, the user can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
