name: search-training-plan-offerings
description: Searches for available training plan offerings based on specified criteria.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --duration-hours=!: The desired duration in hours for the training plan offerings.
    --end-time-before=: A filter to search for reserved capacity offerings with an end time before a specified date.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-count=: The number of instances you want to reserve in the training plan offerings.
    --instance-type=: The type of instance you want to search for in the available training plan offerings.
    --start-time-after=: A filter to search for training plan offerings with a start time after a specified date.
    --target-resources=!:
        description: The target resources (e.g., SageMaker Training Jobs, SageMaker HyperPod, SageMaker Endpoints) to search for in the offerings.
        nargs: -1
    --ultra-server-count=: The number of UltraServers to search for.
    --ultra-server-type=: The type of UltraServer to search for, such as ml.u-p6e-gb200x72.
completion:
    flag:
        instance-type:
            - ml.p4d.24xlarge
            - ml.p5.48xlarge
            - ml.p5e.48xlarge
            - ml.p5en.48xlarge
            - ml.trn1.32xlarge
            - ml.trn2.48xlarge
            - ml.p6-b200.48xlarge
            - ml.p4de.24xlarge
            - ml.p6e-gb200.36xlarge
            - ml.p5.4xlarge
documentation:
    command: |-
        Searches for available training plan offerings based on specified criteria.

        - Users search for available plan offerings based on their requirements (e.g., instance type, count, start time, duration).
        - And then, they create a plan that best matches their needs using the ID of the plan offering they want to use.

        For more information about how to reserve GPU capacity for your SageMaker training jobs or SageMaker HyperPod clusters using Amazon SageMaker Training Plan , see `CreateTrainingPlan`.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        duration-hours: The desired duration in hours for the training plan offerings.
        end-time-before: A filter to search for reserved capacity offerings with an end time before a specified date.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-count: The number of instances you want to reserve in the training plan offerings. This allows you to specify the quantity of compute resources needed for your SageMaker training jobs or SageMaker HyperPod clusters, helping you find reserved capacity offerings that match your requirements.
        instance-type: The type of instance you want to search for in the available training plan offerings. This field allows you to filter the search results based on the specific compute resources you require for your SageMaker training jobs or SageMaker HyperPod clusters. When searching for training plan offerings, specifying the instance type helps you find Reserved Instances that match your computational needs.
        start-time-after: A filter to search for training plan offerings with a start time after a specified date.
        target-resources: |-
            The target resources (e.g., SageMaker Training Jobs, SageMaker HyperPod, SageMaker Endpoints) to search for in the offerings.

            Training plans are specific to their target resource.

            - A training plan designed for SageMaker training jobs can only be used to schedule and run training jobs.
            - A training plan for HyperPod clusters can be used exclusively to provide compute resources to a cluster's instance group.
            - A training plan for SageMaker endpoints can be used exclusively to provide compute resources to SageMaker endpoints for model deployment.
        ultra-server-count: The number of UltraServers to search for.
        ultra-server-type: The type of UltraServer to search for, such as ml.u-p6e-gb200x72.
