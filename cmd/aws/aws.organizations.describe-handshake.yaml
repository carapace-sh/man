name: describe-handshake
description: Retrieves information about a previously requested handshake.
flags:
    --handshake-id=!: The unique identifier (ID) of the handshake that you want information about.
documentation:
    command: |-
        Retrieves information about a previously requested handshake. The handshake ID comes from the response to the original [InviteAccountToOrganization]() operation that generated the handshake.

        You can access handshakes that are `ACCEPTED`, `DECLINED`, or `CANCELED` for only 30 days after they change to that state. They're then deleted and no longer accessible.

        This operation can be called from any account in the organization.
    flag:
        handshake-id: |-
            The unique identifier (ID) of the handshake that you want information about. You can get the ID from the original call to [InviteAccountToOrganization](), or from a call to [ListHandshakesForAccount]() or [ListHandshakesForOrganization]().

            The [regex pattern](http://wikipedia.org/wiki/regex) for handshake ID string requires "h-" followed by from 8 to 32 lowercase letters or digits.
