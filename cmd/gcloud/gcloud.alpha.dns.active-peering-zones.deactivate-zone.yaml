name: deactivate-zone
description: '*(ALPHA)*  Deactivates a Cloud DNS peering zone.'
hidden: true
flags:
    --zone-id=!: The unique system generated id for the peering zone to deactivate.
documentation:
    command: |-
        *(ALPHA)*  This command deactivates a Cloud DNS peering zone, removing any peering config
        and setting a deactivate time. Reponses sent to the deactivated zone will
        return REFUSED.

        ## EXAMPLES

        To deactivate a peering zone, run:

          $ gcloud alpha dns active-peering-zones deactivate-zone peering_zone_id
    flag:
        zone-id: The unique system generated id for the peering zone to deactivate.
