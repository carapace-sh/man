name: update-kx-cluster-databases
description: Updates the databases mounted on a kdb cluster, which includes the `changesetId` and all the dbPaths to be cached.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A token that ensures idempotency.
    --cluster-name=!: A unique name for the cluster that you want to modify.
    --databases=!: The structure of databases mounted on the cluster.
    --deployment-configuration=: The configuration that allows you to choose how you want to update the databases on a cluster.
    --environment-id=!: The unique identifier of a kdb environment.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
documentation:
    command: |-
        Updates the databases mounted on a kdb cluster, which includes the `changesetId` and all the dbPaths to be cached. This API does not allow you to change a database name or add a database if you created a cluster without one.

        Using this API you can point a cluster to a different changeset and modify a list of partitions being cached.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A token that ensures idempotency. This token expires in 10 minutes.
        cluster-name: A unique name for the cluster that you want to modify.
        databases: The structure of databases mounted on the cluster.
        deployment-configuration: The configuration that allows you to choose how you want to update the databases on a cluster.
        environment-id: The unique identifier of a kdb environment.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
