name: update-configured-audience-model
description: Provides the information necessary to update a configured audience model.
flags:
    --audience-model-arn=: The Amazon Resource Name (ARN) of the new audience model that you want to use.
    --audience-size-config=: The new audience size configuration.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configured-audience-model-arn=!: The Amazon Resource Name (ARN) of the configured audience model that you want to update.
    --description=: The new description of the configured audience model.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --min-matching-seed-size=: The minimum number of users from the seed audience that must match with users in the training data of the audience model.
    --output-config=: The new output configuration.
    --shared-audience-metrics=: The new value for whether to share audience metrics.
documentation:
    command: Provides the information necessary to update a configured audience model. Updates that impact audience generation jobs take effect when a new job starts, but do not impact currently running jobs.
    flag:
        audience-model-arn: The Amazon Resource Name (ARN) of the new audience model that you want to use.
        audience-size-config: The new audience size configuration.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configured-audience-model-arn: The Amazon Resource Name (ARN) of the configured audience model that you want to update.
        description: The new description of the configured audience model.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        min-matching-seed-size: The minimum number of users from the seed audience that must match with users in the training data of the audience model.
        output-config: The new output configuration.
        shared-audience-metrics: The new value for whether to share audience metrics.
