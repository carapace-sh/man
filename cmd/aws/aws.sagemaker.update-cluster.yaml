name: update-cluster
description: Updates a SageMaker HyperPod cluster.
flags:
    --auto-scaling=: Updates the autoscaling configuration for the cluster.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cluster-name=!: Specify the name of the SageMaker HyperPod cluster you want to update.
    --cluster-role=: The Amazon Resource Name (ARN) of the IAM role that HyperPod assumes for cluster autoscaling operations.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-groups-to-delete=: Specify the names of the instance groups to delete.
    --instance-groups=: Specify the instance groups to update.
    --node-recovery=: The node recovery mode to be applied to the SageMaker HyperPod cluster.
    --restricted-instance-groups=: The specialized instance groups for training models like Amazon Nova to be created in the SageMaker HyperPod cluster.
    --tiered-storage-config=: Updates the configuration for managed tier checkpointing on the HyperPod cluster.
completion:
    flag:
        node-recovery:
            - Automatic
            - None
documentation:
    command: Updates a SageMaker HyperPod cluster.
    flag:
        auto-scaling: Updates the autoscaling configuration for the cluster. Use to enable or disable automatic node scaling.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cluster-name: Specify the name of the SageMaker HyperPod cluster you want to update.
        cluster-role: The Amazon Resource Name (ARN) of the IAM role that HyperPod assumes for cluster autoscaling operations. Cannot be updated while autoscaling is enabled.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-groups: Specify the instance groups to update.
        instance-groups-to-delete: Specify the names of the instance groups to delete. Use a single `,` as the separator between multiple names.
        node-recovery: The node recovery mode to be applied to the SageMaker HyperPod cluster.
        restricted-instance-groups: The specialized instance groups for training models like Amazon Nova to be created in the SageMaker HyperPod cluster.
        tiered-storage-config: Updates the configuration for managed tier checkpointing on the HyperPod cluster. For example, you can enable or disable the feature and modify the percentage of cluster memory allocated for checkpoint storage.
