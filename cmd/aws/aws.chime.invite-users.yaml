name: invite-users
description: Sends email to a maximum of 50 users, inviting them to the specified Amazon Chime `Team` account.
flags:
    --account-id=!: The Amazon Chime account ID.
    --user-email-list=!: The user email addresses to which to send the email invitation.
    --user-type=: The user type.
completion:
    flag:
        user-type:
            - PrivateUser
            - SharedDevice
documentation:
    command: Sends email to a maximum of 50 users, inviting them to the specified Amazon Chime `Team` account. Only `Team` account types are currently supported for this action.
    flag:
        account-id: The Amazon Chime account ID.
        user-email-list: The user email addresses to which to send the email invitation.
        user-type: The user type.
