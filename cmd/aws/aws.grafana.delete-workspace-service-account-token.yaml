name: delete-workspace-service-account-token
description: Deletes a token for the workspace service account.
flags:
    --service-account-id=!: The ID of the service account from which to delete the token.
    --token-id=!: The ID of the token to delete.
    --workspace-id=!: The ID of the workspace from which to delete the token.
documentation:
    command: |-
        Deletes a token for the workspace service account.

        This will disable the key associated with the token. If any automation is currently using the key, it will no longer be authenticated or authorized to perform actions with the Grafana HTTP APIs.

        Service accounts are only available for workspaces that are compatible with Grafana version 9 and above.
    flag:
        service-account-id: The ID of the service account from which to delete the token.
        token-id: The ID of the token to delete.
        workspace-id: The ID of the workspace from which to delete the token.
