name: create
description: '*(ALPHA)*  Create a new spoke.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: Description of the spoke to be created.
    --hub=!: Hub that spoke will attach to.
    --interconnect-attachment=: Interconnect attachment that this spoke links to.
    --labels=: List of label KEY=VALUE pairs to add.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: The location Id.
    --router-appliance=: Router appliance instance(s) that this spoke links to.
    --vpn-tunnel=: VPN tunnel that this spoke links to.
documentation:
    command: '*(ALPHA)*  Create a new spoke with the given name.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: Description of the spoke to be created.
        hub: Hub that spoke will attach to.
        interconnect-attachment: Interconnect attachment that this spoke links to.
        labels: List of label KEY=VALUE pairs to add.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            The location Id.
            +

            To set the `region` attribute:
            * provide the argument `spoke` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
        router-appliance: |-
            Router appliance instance(s) that this spoke links to.
            +
            For example, use `--router-appliance=instance=ins_1,ip=10.10.0.1` to add a single router-appliance instance,
            or `--router-appliance=instance=ins_1,ip=10.10.0.1 --router-appliance=instance=ins_2,ip=10.10.0.1 ...`
            to add multiple instances.
        vpn-tunnel: VPN tunnel that this spoke links to.
