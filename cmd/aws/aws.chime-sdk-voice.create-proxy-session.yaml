name: create-proxy-session
description: Creates a proxy session for the specified Amazon Chime SDK Voice Connector for the specified participant phone numbers.
flags:
    --capabilities=!:
        description: The proxy session's capabilities.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --expiry-minutes=: The number of minutes allowed for the proxy session.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --geo-match-level=: The preference for matching the country or area code of the proxy phone number with that of the first participant.
    --geo-match-params=: The country and area code for the proxy phone number.
    --name=: The name of the proxy session.
    --number-selection-behavior=: The preference for proxy phone number reuse, or stickiness, between the same participants across sessions.
    --participant-phone-numbers=!:
        description: The participant phone numbers.
        nargs: -1
    --voice-connector-id=!: The Voice Connector ID.
completion:
    flag:
        geo-match-level:
            - Country
            - AreaCode
        number-selection-behavior:
            - PreferSticky
            - AvoidSticky
documentation:
    command: Creates a proxy session for the specified Amazon Chime SDK Voice Connector for the specified participant phone numbers.
    flag:
        capabilities: The proxy session's capabilities.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        expiry-minutes: The number of minutes allowed for the proxy session.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        geo-match-level: The preference for matching the country or area code of the proxy phone number with that of the first participant.
        geo-match-params: The country and area code for the proxy phone number.
        name: The name of the proxy session.
        number-selection-behavior: The preference for proxy phone number reuse, or stickiness, between the same participants across sessions.
        participant-phone-numbers: The participant phone numbers.
        voice-connector-id: The Voice Connector ID.
