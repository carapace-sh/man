name: list-associated-groups
description: Returns a list of the groups that the specified canary is associated with.
flags:
    --max-results=: Specify this parameter to limit how many groups are returned each time you use the `ListAssociatedGroups` operation.
    --next-token=: A token that indicates that there is more data available.
    --resource-arn=!: The ARN of the canary that you want to view groups for.
documentation:
    command: Returns a list of the groups that the specified canary is associated with. The canary that you specify must be in the current Region.
    flag:
        max-results: Specify this parameter to limit how many groups are returned each time you use the `ListAssociatedGroups` operation. If you omit this parameter, the default of 20 is used.
        next-token: A token that indicates that there is more data available. You can use this token in a subsequent operation to retrieve the next set of results.
        resource-arn: The ARN of the canary that you want to view groups for.
