name: delete-db-instance
description: Deletes a previously provisioned DB instance.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --db-instance-identifier=!: The DB instance identifier for the DB instance to be deleted.
    --delete-automated-backups: Specifies whether to remove automated backups immediately after the DB instance is deleted.
    --final-db-snapshot-identifier=: The `DBSnapshotIdentifier` of the new `DBSnapshot` created when the `SkipFinalSnapshot` parameter is disabled.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-delete-automated-backups: Specifies whether to remove automated backups immediately after the DB instance is deleted.
    --no-skip-final-snapshot: Specifies whether to skip the creation of a final DB snapshot before deleting the instance.
    --skip-final-snapshot: Specifies whether to skip the creation of a final DB snapshot before deleting the instance.
documentation:
    command: |-
        Deletes a previously provisioned DB instance. When you delete a DB instance, all automated backups for that instance are deleted and can't be recovered. However, manual DB snapshots of the DB instance aren't deleted.

        If you request a final DB snapshot, the status of the Amazon RDS DB instance is `deleting` until the DB snapshot is created. This operation can't be canceled or reverted after it begins. To monitor the status of this operation, use `DescribeDBInstance`.

        When a DB instance is in a failure state and has a status of `failed`, `incompatible-restore`, or `incompatible-network`, you can only delete it when you skip creation of the final snapshot with the `SkipFinalSnapshot` parameter.

        If the specified DB instance is part of an Amazon Aurora DB cluster, you can't delete the DB instance if both of the following conditions are true:

        - The DB cluster is a read replica of another Amazon Aurora DB cluster.
        - The DB instance is the only instance in the DB cluster.

        To delete a DB instance in this case, first use the `PromoteReadReplicaDBCluster` operation to promote the DB cluster so that it's no longer a read replica. After the promotion completes, use the `DeleteDBInstance` operation to delete the final instance in the DB cluster.

        For RDS Custom DB instances, deleting the DB instance permanently deletes the EC2 instance and the associated EBS volumes. Make sure that you don't terminate or delete these resources before you delete the DB instance. Otherwise, deleting the DB instance and creation of the final snapshot might fail.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        db-instance-identifier: |-
            The DB instance identifier for the DB instance to be deleted. This parameter isn't case-sensitive.

            Constraints:

            - Must match the name of an existing DB instance.
        delete-automated-backups: Specifies whether to remove automated backups immediately after the DB instance is deleted. This parameter isn't case-sensitive. The default is to remove automated backups immediately after the DB instance is deleted.
        final-db-snapshot-identifier: |-
            The `DBSnapshotIdentifier` of the new `DBSnapshot` created when the `SkipFinalSnapshot` parameter is disabled.

            If you enable this parameter and also enable SkipFinalShapshot, the command results in an error.

            This setting doesn't apply to RDS Custom.

            Constraints:

            - Must be 1 to 255 letters or numbers.
            - First character must be a letter.
            - Can't end with a hyphen or contain two consecutive hyphens.
            - Can't be specified when deleting a read replica.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        skip-final-snapshot: |-
            Specifies whether to skip the creation of a final DB snapshot before deleting the instance. If you enable this parameter, RDS doesn't create a DB snapshot. If you don't enable this parameter, RDS creates a DB snapshot before the DB instance is deleted. By default, skip isn't enabled, and the DB snapshot is created.

            If you don't enable this parameter, you must specify the `FinalDBSnapshotIdentifier` parameter.

            When a DB instance is in a failure state and has a status of `failed`, `incompatible-restore`, or `incompatible-network`, RDS can delete the instance only if you enable this parameter.

            If you delete a read replica or an RDS Custom instance, you must enable this setting.

            This setting is required for RDS Custom.
