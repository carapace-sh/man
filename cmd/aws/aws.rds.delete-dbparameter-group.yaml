name: delete-dbparameter-group
description: Deletes a specified DB parameter group.
flags:
    --dbparameter-group-name=!: The name of the DB parameter group.
documentation:
    command: Deletes a specified DB parameter group. The DB parameter group to be deleted can't be associated with any DB instances.
    flag:
        dbparameter-group-name: |-
            The name of the DB parameter group.

            Constraints:

            - Must be the name of an existing DB parameter group
            - You can't delete a default DB parameter group
            - Can't be associated with any DB instances
