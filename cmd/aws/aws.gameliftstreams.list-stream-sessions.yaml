name: list-stream-sessions
description: Retrieves a list of Amazon GameLift Streams stream sessions that a stream group is hosting.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --export-files-status=: Filter by the exported files status.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identifier=!: The unique identifier of a Amazon GameLift Streams stream group to retrieve the stream session for.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The number of results to return.
    --next-token=: The token that marks the start of the next set of results.
    --page-size=: The size of each page to get in the AWS service call.
    --starting-token=: A token to specify where to start paginating.
    --status=: Filter by the stream session status.
completion:
    flag:
        export-files-status:
            - SUCCEEDED
            - FAILED
            - PENDING
        status:
            - ACTIVATING
            - ACTIVE
            - CONNECTED
            - PENDING_CLIENT_RECONNECTION
            - RECONNECTING
            - TERMINATING
            - TERMINATED
            - ERROR
documentation:
    command: |-
        Retrieves a list of Amazon GameLift Streams stream sessions that a stream group is hosting.

        To retrieve stream sessions, specify the stream group, and optionally filter by stream session status. You can paginate the results as needed.

        This operation returns the requested stream sessions in no particular order.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        export-files-status: |-
            Filter by the exported files status. You can specify one status in each request to retrieve only sessions that currently have that exported files status.

            Exported files can be in one of the following states:

            - `SUCCEEDED`: The exported files are successfully stored in an S3 bucket.
            - `FAILED`: The session ended but Amazon GameLift Streams couldn't collect and upload the files to S3.
            - `PENDING`: Either the stream session is still in progress, or uploading the exported files to the S3 bucket is in progress.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        identifier: The unique identifier of a Amazon GameLift Streams stream group to retrieve the stream session for. You can use either the stream group ID or the [Amazon Resource Name (ARN)](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference-arns.html).
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The number of results to return. Use this parameter with `NextToken` to return results in sequential pages. Default value is `25`.
        next-token: The token that marks the start of the next set of results. Use this token when you retrieve results as sequential pages. To get the first page of results, omit a token value. To get the remaining pages, provide the token returned with the previous result set.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        status: Filter by the stream session status. You can specify one status in each request to retrieve only sessions that are currently in that status.
