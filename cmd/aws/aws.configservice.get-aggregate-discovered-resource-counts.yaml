name: get-aggregate-discovered-resource-counts
description: Returns the resource counts across accounts and regions that are present in your Config aggregator.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration-aggregator-name=!: The name of the configuration aggregator.
    --filters=: Filters the results based on the `ResourceCountFilters` object.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --group-by-key=: The key to group the resource counts.
    --limit=: The maximum number of [GroupedResourceCount]() objects returned on each page.
    --next-token=: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
completion:
    flag:
        group-by-key:
            - RESOURCE_TYPE
            - ACCOUNT_ID
            - AWS_REGION
documentation:
    command: |-
        Returns the resource counts across accounts and regions that are present in your Config aggregator. You can request the resource counts by providing filters and GroupByKey.

        For example, if the input contains accountID 12345678910 and region us-east-1 in filters, the API returns the count of resources in account ID 12345678910 and region us-east-1. If the input contains ACCOUNT\_ID as a GroupByKey, the API returns resource counts for all source accounts that are present in your aggregator.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration-aggregator-name: The name of the configuration aggregator.
        filters: Filters the results based on the `ResourceCountFilters` object.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        group-by-key: The key to group the resource counts.
        limit: The maximum number of [GroupedResourceCount]() objects returned on each page. The default is 1000. You cannot specify a number greater than 1000. If you specify 0, Config uses the default.
        next-token: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
