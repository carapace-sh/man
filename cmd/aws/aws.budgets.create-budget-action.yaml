name: create-budget-action
description: Creates a budget action.
flags:
    --account-id=!: ""
    --action-threshold=!: ""
    --action-type=!: The type of action.
    --approval-model=!: This specifies if the action needs manual or automatic approval.
    --budget-name=!: ""
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --definition=!: ""
    --execution-role-arn=!: The role passed for action execution and reversion.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --notification-type=!: ""
    --resource-tags=:
        description: An optional list of tags to associate with the specified budget action.
        nargs: -1
    --subscribers=!:
        nargs: -1
completion:
    flag:
        action-type:
            - APPLY_IAM_POLICY
            - APPLY_SCP_POLICY
            - RUN_SSM_DOCUMENTS
        approval-model:
            - AUTOMATIC
            - MANUAL
        notification-type:
            - ACTUAL
            - FORECASTED
documentation:
    command: Creates a budget action.
    flag:
        account-id: ""
        action-threshold: ""
        action-type: The type of action. This defines the type of tasks that can be carried out by this action. This field also determines the format for definition.
        approval-model: This specifies if the action needs manual or automatic approval.
        budget-name: ""
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        definition: ""
        execution-role-arn: The role passed for action execution and reversion. Roles and actions must be in the same account.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        notification-type: ""
        resource-tags: An optional list of tags to associate with the specified budget action. Each tag consists of a key and a value, and each key must be unique for the resource.
        subscribers: ""
