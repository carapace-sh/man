name: modify-global-cluster
description: Modify a setting for an Amazon DocumentDB global cluster.
flags:
    --deletion-protection=: Indicates if the global cluster has deletion protection enabled.
    --global-cluster-identifier=!: The identifier for the global cluster being modified.
    --new-global-cluster-identifier=: The new identifier for a global cluster when you modify a global cluster.
documentation:
    command: |-
        Modify a setting for an Amazon DocumentDB global cluster. You can change one or more configuration parameters (for example: deletion protection), or the global cluster identifier by specifying these parameters and the new values in the request.

        This action only applies to Amazon DocumentDB clusters.
    flag:
        deletion-protection: Indicates if the global cluster has deletion protection enabled. The global cluster can't be deleted when deletion protection is enabled.
        global-cluster-identifier: |-
            The identifier for the global cluster being modified. This parameter isn't case-sensitive.

            Constraints:

            - Must match the identifier of an existing global cluster.
        new-global-cluster-identifier: "The new identifier for a global cluster when you modify a global cluster. This value is stored as a lowercase string.\n\n- Must contain from 1 to 63 letters, numbers, or hyphens\n  \n  The first character must be a letter\n  \n  Can't end with a hyphen or contain two consecutive hyphens\n\nExample: `my-cluster2`"
