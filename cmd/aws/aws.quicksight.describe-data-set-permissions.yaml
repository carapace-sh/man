name: describe-data-set-permissions
description: Describes the permissions on a dataset.
flags:
    --aws-account-id=!: The Amazon Web Services account ID.
    --data-set-id=!: The ID for the dataset that you want to describe.
documentation:
    command: |-
        Describes the permissions on a dataset.

        The permissions resource is `arn:aws:quicksight:region:aws-account-id:dataset/data-set-id`.
    flag:
        aws-account-id: The Amazon Web Services account ID.
        data-set-id: The ID for the dataset that you want to describe. This ID is unique per Amazon Web Services Region for each Amazon Web Services account.
