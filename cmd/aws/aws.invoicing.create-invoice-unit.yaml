name: create-invoice-unit
description: This creates a new invoice unit with the provided definition.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The invoice unit's description.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --invoice-receiver=!: The Amazon Web Services account ID chosen to be the receiver of an invoice unit.
    --name=!: The unique name of the invoice unit that is shown on the generated invoice.
    --no-tax-inheritance-disabled: Whether the invoice unit based tax inheritance is/ should be enabled or disabled.
    --resource-tags=:
        description: The tag structure that contains a tag key and value.
        nargs: -1
    --rule=!: The `InvoiceUnitRule` object used to create invoice units.
    --tax-inheritance-disabled: Whether the invoice unit based tax inheritance is/ should be enabled or disabled.
documentation:
    command: This creates a new invoice unit with the provided definition.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The invoice unit's description. This can be changed at a later time.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        invoice-receiver: The Amazon Web Services account ID chosen to be the receiver of an invoice unit. All invoices generated for that invoice unit will be sent to this account ID.
        name: The unique name of the invoice unit that is shown on the generated invoice. This can't be changed once it is set. To change this name, you must delete the invoice unit recreate.
        resource-tags: The tag structure that contains a tag key and value.
        rule: The `InvoiceUnitRule` object used to create invoice units.
        tax-inheritance-disabled: Whether the invoice unit based tax inheritance is/ should be enabled or disabled.
