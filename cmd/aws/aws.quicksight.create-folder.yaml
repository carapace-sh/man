name: create-folder
description: Creates an empty shared folder.
flags:
    --aws-account-id=!: The ID for the Amazon Web Services account where you want to create the folder.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --folder-id=!: The ID of the folder.
    --folder-type=: The type of folder.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=: The name of the folder.
    --parent-folder-arn=: The Amazon Resource Name (ARN) for the parent folder.
    --permissions=: A structure that describes the principals and the resource-level permissions of a folder.
    --sharing-model=: An optional parameter that determines the sharing scope of the folder.
    --tags=: Tags for the folder.
completion:
    flag:
        folder-type:
            - SHARED
            - RESTRICTED
        sharing-model:
            - ACCOUNT
            - NAMESPACE
documentation:
    command: Creates an empty shared folder.
    flag:
        aws-account-id: The ID for the Amazon Web Services account where you want to create the folder.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        folder-id: The ID of the folder.
        folder-type: The type of folder. By default, `folderType` is `SHARED`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the folder.
        parent-folder-arn: |-
            The Amazon Resource Name (ARN) for the parent folder.

            `ParentFolderArn` can be null. An empty `parentFolderArn` creates a root-level folder.
        permissions: |-
            A structure that describes the principals and the resource-level permissions of a folder.

            To specify no permissions, omit `Permissions`.
        sharing-model: An optional parameter that determines the sharing scope of the folder. The default value for this parameter is `ACCOUNT`.
        tags: Tags for the folder.
