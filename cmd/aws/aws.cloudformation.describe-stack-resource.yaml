name: describe-stack-resource
description: Returns a description of the specified resource in the specified stack.
flags:
    --logical-resource-id=!: The logical name of the resource as specified in the template.
    --stack-name=!: 'The name or the unique stack ID that''s associated with the stack, which aren''t always interchangeable:'
documentation:
    command: |-
        Returns a description of the specified resource in the specified stack.

        For deleted stacks, DescribeStackResource returns resource information for up to 90 days after the stack has been deleted.
    flag:
        logical-resource-id: The logical name of the resource as specified in the template.
        stack-name: |-
            The name or the unique stack ID that's associated with the stack, which aren't always interchangeable:

            - Running stacks: You can specify either the stack's name or its unique stack ID.
            - Deleted stacks: You must specify the unique stack ID.
