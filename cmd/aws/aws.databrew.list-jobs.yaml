name: list-jobs
description: Lists all of the DataBrew jobs that are defined.
flags:
    --dataset-name=: The name of a dataset.
    --max-results=: The maximum number of results to return in this request.
    --next-token=: A token generated by DataBrew that specifies where to continue pagination if a previous request was truncated.
    --project-name=: The name of a project.
documentation:
    command: Lists all of the DataBrew jobs that are defined.
    flag:
        dataset-name: The name of a dataset. Using this parameter indicates to return only those jobs that act on the specified dataset.
        max-results: The maximum number of results to return in this request.
        next-token: A token generated by DataBrew that specifies where to continue pagination if a previous request was truncated. To get the next set of pages, pass in the NextToken value from the response object of the previous page call.
        project-name: The name of a project. Using this parameter indicates to return only those jobs that are associated with the specified project.
