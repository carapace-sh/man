name: export-journal-to-s3
description: Exports journal contents within a date and time range from a ledger into a specified Amazon Simple Storage Service (Amazon S3) bucket.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --exclusive-end-time=!: The exclusive end date and time for the range of journal contents to export.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --inclusive-start-time=!: The inclusive start date and time for the range of journal contents to export.
    --name=!: The name of the ledger.
    --output-format=: The output format of your exported journal data.
    --role-arn=!: 'The Amazon Resource Name (ARN) of the IAM role that grants QLDB permissions for a journal export job to do the following:'
    --s3-export-configuration=!: The configuration settings of the Amazon S3 bucket destination for your export request.
completion:
    flag:
        output-format:
            - ION_BINARY
            - ION_TEXT
            - JSON
documentation:
    command: |-
        Exports journal contents within a date and time range from a ledger into a specified Amazon Simple Storage Service (Amazon S3) bucket. A journal export job can write the data objects in either the text or binary representation of Amazon Ion format, or in *JSON Lines* text format.

        If the ledger with the given `Name` doesn't exist, then throws `ResourceNotFoundException`.

        If the ledger with the given `Name` is in `CREATING` status, then throws `ResourcePreconditionNotMetException`.

        You can initiate up to two concurrent journal export requests for each ledger. Beyond this limit, journal export requests throw `LimitExceededException`.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        exclusive-end-time: |-
            The exclusive end date and time for the range of journal contents to export.

            The `ExclusiveEndTime` must be in `ISO 8601` date and time format and in Universal Coordinated Time (UTC). For example: `2019-06-13T21:36:34Z`.

            The `ExclusiveEndTime` must be less than or equal to the current UTC date and time.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        inclusive-start-time: |-
            The inclusive start date and time for the range of journal contents to export.

            The `InclusiveStartTime` must be in `ISO 8601` date and time format and in Universal Coordinated Time (UTC). For example: `2019-06-13T21:36:34Z`.

            The `InclusiveStartTime` must be before `ExclusiveEndTime`.

            If you provide an `InclusiveStartTime` that is before the ledger's `CreationDateTime`, Amazon QLDB defaults it to the ledger's `CreationDateTime`.
        name: The name of the ledger.
        output-format: |-
            The output format of your exported journal data. A journal export job can write the data objects in either the text or binary representation of [Amazon Ion](https://docs.aws.amazon.com/qldb/latest/developerguide/ion.html) format, or in [JSON Lines](https://jsonlines.org/) text format.

            Default: `ION_TEXT`

            In JSON Lines format, each journal block in an exported data object is a valid JSON object that is delimited by a newline. You can use this format to directly integrate JSON exports with analytics tools such as Amazon Athena and Glue because these services can parse newline-delimited JSON automatically.
        role-arn: |-
            The Amazon Resource Name (ARN) of the IAM role that grants QLDB permissions for a journal export job to do the following:

            - Write objects into your Amazon S3 bucket.
            - (Optional) Use your customer managed key in Key Management Service (KMS) for server-side encryption of your exported data.

            To pass a role to QLDB when requesting a journal export, you must have permissions to perform the `iam:PassRole` action on the IAM role resource. This is required for all journal export requests.
        s3-export-configuration: The configuration settings of the Amazon S3 bucket destination for your export request.
