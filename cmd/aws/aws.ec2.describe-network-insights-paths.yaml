name: describe-network-insights-paths
description: Describes one or more of your paths.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: The filters.
    --max-results=: The maximum number of results to return with a single call.
    --network-insights-path-ids=: The IDs of the paths.
    --next-token=: The token for the next page of results.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: Describes one or more of your paths.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            The filters. The following are the possible values:

            - destination - The ID of the resource.
            - filter-at-source.source-address - The source IPv4 address at the source.
            - filter-at-source.source-port-range - The source port range at the source.
            - filter-at-source.destination-address - The destination IPv4 address at the source.
            - filter-at-source.destination-port-range - The destination port range at the source.
            - filter-at-destination.source-address - The source IPv4 address at the destination.
            - filter-at-destination.source-port-range - The source port range at the destination.
            - filter-at-destination.destination-address - The destination IPv4 address at the destination.
            - filter-at-destination.destination-port-range - The destination port range at the destination.
            - protocol - The protocol.
            - source - The ID of the resource.
        max-results: The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned `nextToken` value.
        network-insights-path-ids: The IDs of the paths.
        next-token: The token for the next page of results.
