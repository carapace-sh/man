name: get-position-configuration
description: Get position configuration for a given resource.
flags:
    --resource-identifier=!: Resource identifier used in a position configuration.
    --resource-type=!: Resource type of the resource for which position configuration is retrieved.
completion:
    flag:
        resource-type:
            - WirelessDevice
            - WirelessGateway
documentation:
    command: |-
        Get position configuration for a given resource.

        This action is no longer supported. Calls to retrieve the position configuration should use the [GetResourcePosition](https://docs.aws.amazon.com/iot-wireless/latest/apireference/API_GetResourcePosition.html) API operation instead.
    flag:
        resource-identifier: Resource identifier used in a position configuration.
        resource-type: Resource type of the resource for which position configuration is retrieved.
