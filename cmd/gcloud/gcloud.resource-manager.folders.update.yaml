name: update
description: Update the display name of a folder.
flags:
    --display-name=!: New display name for the folder (unique under the same parent).
documentation:
    command: |-
        Updates the given folder with new folder name.

        This command can fail for the following reasons:
            * There is no folder with the given ID.
            * The active account does not have permission to update the given
              folder.
            * The new display name is taken by another folder under this folder's
              parent.

        ## EXAMPLES

        The following command updates a folder with the ID `123456789` to have
        the name "Foo Bar and Grill":

          $ gcloud resource-manager folders update 123456789 --display-name="Foo Bar and Grill"
    flag:
        display-name: New display name for the folder (unique under the same parent).
