name: describe-batch-predictions
description: Returns a list of `BatchPrediction` operations that match the search criteria in the request.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --eq=: The equal to operator.
    --filter-variable=: 'Use one of the following variables to filter a list of `BatchPrediction`:'
    --ge=: The greater than or equal to operator.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --gt=: The greater than operator.
    --le=: The less than or equal to operator.
    --limit=: The number of pages of information to include in the result.
    --lt=: The less than operator.
    --max-items=: The  total number of items to return in the command's output.
    --ne=: The not equal to operator.
    --next-token=: An ID of the page in the paginated results.
    --page-size=: The size of each page to get in the AWS service call.
    --prefix=: A string that is found at the beginning of a variable, such as `Name` or `Id`.
    --sort-order=: A two-value parameter that determines the sequence of the resulting list of `MLModel`s.
    --starting-token=: A token to specify where to start paginating.
completion:
    flag:
        filter-variable:
            - CreatedAt
            - LastUpdatedAt
            - Status
            - Name
            - IAMUser
            - MLModelId
            - DataSourceId
            - DataURI
        sort-order:
            - asc
            - dsc
documentation:
    command: Returns a list of `BatchPrediction` operations that match the search criteria in the request.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        eq: The equal to operator. The `BatchPrediction` results will have `FilterVariable` values that exactly match the value specified with `EQ`.
        filter-variable: |-
            Use one of the following variables to filter a list of `BatchPrediction`:

            - `CreatedAt` - Sets the search criteria to the `BatchPrediction` creation date.
            - `Status` - Sets the search criteria to the `BatchPrediction` status.
            - `Name` - Sets the search criteria to the contents of the `BatchPrediction` `Name`.
            - `IAMUser` - Sets the search criteria to the user account that invoked the `BatchPrediction` creation.
            - `MLModelId` - Sets the search criteria to the `MLModel` used in the `BatchPrediction`.
            - `DataSourceId` - Sets the search criteria to the `DataSource` used in the `BatchPrediction`.
            - `DataURI` - Sets the search criteria to the data file(s) used in the `BatchPrediction`. The URL can identify either a file or an Amazon Simple Storage Solution (Amazon S3) bucket or directory.
        ge: The greater than or equal to operator. The `BatchPrediction` results will have `FilterVariable` values that are greater than or equal to the value specified with `GE`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        gt: The greater than operator. The `BatchPrediction` results will have `FilterVariable` values that are greater than the value specified with `GT`.
        le: The less than or equal to operator. The `BatchPrediction` results will have `FilterVariable` values that are less than or equal to the value specified with `LE`.
        limit: The number of pages of information to include in the result. The range of acceptable values is `1` through `100`. The default value is `100`.
        lt: The less than operator. The `BatchPrediction` results will have `FilterVariable` values that are less than the value specified with `LT`.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        ne: The not equal to operator. The `BatchPrediction` results will have `FilterVariable` values not equal to the value specified with `NE`.
        next-token: An ID of the page in the paginated results.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        prefix: |-
            A string that is found at the beginning of a variable, such as `Name` or `Id`.

            For example, a `Batch Prediction` operation could have the `Name` `2014-09-09-HolidayGiftMailer`. To search for this `BatchPrediction`, select `Name` for the `FilterVariable` and any of the following strings for the `Prefix`:

            - 2014-09
            - 2014-09-09
            - 2014-09-09-Holiday
        sort-order: |-
            A two-value parameter that determines the sequence of the resulting list of `MLModel`s.

            - `asc` - Arranges the list in ascending order (A-Z, 0-9).
            - `dsc` - Arranges the list in descending order (Z-A, 9-0).

            Results are sorted by `FilterVariable`.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
