name: lock
description: Locks the deployment.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The Cloud location for the deployment.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: This command locks the deployment and generates a lockId.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The Cloud location for the deployment.
            +
            To set the `location` attribute:
            * provide the argument `DEPLOYMENT` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `infra-manager/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
