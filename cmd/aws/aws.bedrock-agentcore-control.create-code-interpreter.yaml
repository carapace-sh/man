name: create-code-interpreter
description: Creates a custom code interpreter.
flags:
    --client-token=: A unique, case-sensitive identifier to ensure that the operation completes no more than one time.
    --description=: The description of the code interpreter.
    --execution-role-arn=: The Amazon Resource Name (ARN) of the IAM role that provides permissions for the code interpreter to access Amazon Web Services services.
    --name=!: The name of the code interpreter.
    --network-configuration=!: The network configuration for the code interpreter.
    --tags=: A map of tag keys and values to assign to the code interpreter.
documentation:
    command: Creates a custom code interpreter.
    flag:
        client-token: A unique, case-sensitive identifier to ensure that the operation completes no more than one time. If this token matches a previous request, Amazon Bedrock ignores the request but does not return an error.
        description: The description of the code interpreter.
        execution-role-arn: The Amazon Resource Name (ARN) of the IAM role that provides permissions for the code interpreter to access Amazon Web Services services.
        name: The name of the code interpreter. The name must be unique within your account.
        network-configuration: The network configuration for the code interpreter. This configuration specifies the network mode for the code interpreter.
        tags: A map of tag keys and values to assign to the code interpreter. Tags enable you to categorize your resources in different ways, for example, by purpose, owner, or environment.
