name: update-mitigation-action
description: Updates the definition for the specified mitigation action.
flags:
    --action-name=!: The friendly name for the mitigation action.
    --action-params=: Defines the type of action and the parameters for that action.
    --role-arn=: The ARN of the IAM role that is used to apply the mitigation action.
documentation:
    command: |-
        Updates the definition for the specified mitigation action.

        Requires permission to access the [UpdateMitigationAction](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        action-name: The friendly name for the mitigation action. You cannot change the name by using `UpdateMitigationAction`. Instead, you must delete and recreate the mitigation action with the new name.
        action-params: Defines the type of action and the parameters for that action.
        role-arn: The ARN of the IAM role that is used to apply the mitigation action.
