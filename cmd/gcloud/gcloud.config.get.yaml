name: get
description: Print the value of a Google Cloud CLI property.
documentation:
    command: |-
        gcloud config get prints the property value from your active client side configuration
        only.

        ## AVAILABLE PROPERTIES

        {properties}

        ## EXAMPLES

        To print the project property in the core section, run:

          $ gcloud config get project

        To print the zone property in the compute section, run:

          $ gcloud config get compute/zone
