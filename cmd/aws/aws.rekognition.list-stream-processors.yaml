name: list-stream-processors
description: Gets a list of stream processors that you have created with [CreateStreamProcessor]().
flags:
    --max-results=: Maximum number of stream processors you want Amazon Rekognition Video to return in the response.
    --next-token=: If the previous response was incomplete (because there are more stream processors to retrieve), Amazon Rekognition Video returns a pagination token in the response.
documentation:
    command: Gets a list of stream processors that you have created with [CreateStreamProcessor]().
    flag:
        max-results: Maximum number of stream processors you want Amazon Rekognition Video to return in the response. The default is 1000.
        next-token: If the previous response was incomplete (because there are more stream processors to retrieve), Amazon Rekognition Video returns a pagination token in the response. You can use this pagination token to retrieve the next set of stream processors.
