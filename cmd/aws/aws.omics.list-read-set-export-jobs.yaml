name: list-read-set-export-jobs
description: Retrieves a list of read set export jobs in a JSON formatted response.
flags:
    --filter=: A filter to apply to the list.
    --max-results=: The maximum number of jobs to return in one page of results.
    --next-token=: Specify the pagination token from a previous request to retrieve the next page of results.
    --sequence-store-id=!: The jobs' sequence store ID.
documentation:
    command: Retrieves a list of read set export jobs in a JSON formatted response. This API operation is used to check the status of a read set export job initiated by the `StartReadSetExportJob` API operation.
    flag:
        filter: A filter to apply to the list.
        max-results: The maximum number of jobs to return in one page of results.
        next-token: Specify the pagination token from a previous request to retrieve the next page of results.
        sequence-store-id: The jobs' sequence store ID.
