documentation:
    command: Update cluster settings for an existing container cluster.
    flag:
        add-maintenance-exclusion-end: |-
            End time of the exclusion window. Must take place after the start time. See
            $ gcloud topic datetimes for information on time formats.
        add-maintenance-exclusion-name: |-
            A descriptor for the exclusion that can be used to remove it. If not specified,
            it will be autogenerated.
        add-maintenance-exclusion-scope: |-
            Scope of the exclusion window to specify the type of upgrades that the exclusion
            will apply to. Must be in one of no_upgrades, no_minor_upgrades or no_minor_or_node_upgrades.
            If not specified in an exclusion, defaults to no_upgrades.
        add-maintenance-exclusion-start: |-
            Start time of the exclusion window (can occur in the past). If not specified,
            the current time will be used. See $ gcloud topic datetimes for information on
            time formats.
        add-maintenance-exclusion-until-end-of-support: End time of the exclusion window is the end of the cluster's support.
        additional-ip-ranges: |-
            Add additional subnetworks named "my-subnet" with pod ipv4 range named "my-range" to the cluster.
            +
            Examples:
            +
              $ {command} example-cluster --additional-ip-ranges=subnetwork=my-subnet,pod-ipv4-range=my-range
        additional-pod-ipv4-ranges: |-
            Additional IP address ranges(by name) for pods that need to be added to the cluster.
            +
            Examples:
            +
              $ {command} example-cluster --additional-pod-ipv4-ranges=range1,range2
        additive-vpc-scope-dns-domain: The domain used in Additive VPC scope. Only works with Cluster Scope.
        anonymous-authentication-config: |-
            Enable or restrict anonymous access to the cluster. When enabled,
                  anonymous users will be authenticated as system:anonymous with the group
                  system:unauthenticated. Limiting access restricts anonymous access to only
                  the health check endpoints /readyz, /livez, and /healthz.
            +
            _ANONYMOUS_AUTHENTICATION_CONFIG_ must be one of:
            +
            *ENABLED*::: 'ENABLED' enables anonymous calls.
            *LIMITED*::: 'LIMITED' restricts anonymous access to the cluster. Only calls to
            the health check endpoints are allowed anonymously, all other calls
            will be rejected.
            :::
            +
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        auto-monitoring-scope: |-
            Enables Auto-Monitoring for a specific scope within the cluster.
            ALL: Enables Auto-Monitoring for all supported workloads within the cluster.
            NONE: Disables Auto-Monitoring. _AUTO_MONITORING_SCOPE_ must be one of: *ALL*, *NONE*.
        autopilot-privileged-admission: |4
              Specify Cloud Storage object paths pointing to privileged workload allowlists
              to be authorized for use in Autopilot mode.

              The value is a comma-separated list of Cloud Storage object paths in the format 'gke://<partner_name>/<app_name>/<allowlist_path>' for GKE-owned allowlists and 'gs://<bucket_name>/<allowlist_path>' for user-owned allowlists.
              Wildcards are supported to authorize all allowlists under specific
              paths.

            Examples:
              $ {command} --autopilot-privileged-admission=gke://*
              $ {command} --autopilot-privileged-admission=gke://my-partner/my-app/my-allowlist.yaml
              $ {command} --autopilot-privileged-admission=gs://my-bucket/allowlists/my-allowlist.yaml
              $ {command} --autopilot-privileged-admission=gs://my-bucket/*
              $ {command} --autopilot-privileged-admission=gke://my-partner/my-app/*,gs://my-bucket/allowlists/my-allowlist.yaml
              $ {command} --autopilot-privileged-admission=""
        autopilot-workload-policies: |-
            Add Autopilot workload policies to the cluster.
            +
            Examples:
            +
              $ {command} example-cluster --autopilot-workload-policies=allow-net-admin
            +
            The only supported workload policy is 'allow-net-admin'.
        autoprovisioning-cgroup-mode: |-
            Sets the cgroup mode for auto-provisioned nodes.
            +
            Updating this flag triggers an update using surge upgrades of all existing
            auto-provisioned nodes to apply the new value of cgroup mode.
            +
            For an Autopilot cluster, the specified cgroup mode will be set on all existing and new nodes in the cluster.
            For a Standard cluster, the specified cgroup mode will be set on all existing and new auto-provisioned node pools in the cluster.
            +
            If not set, GKE uses cgroupv2 for new nodes when the cluster was created running 1.26 or later,
            and cgroupv1 for clusters created running 1.25 or earlier. To check your initial cluster version, run
            `gcloud container clusters describe [NAME] --format="value(initialClusterVersion)"`
            +
            For clusters created running version 1.26 or later, you can't set the cgroup mode to v1.
            +
            To learn more, see: https://cloud.google.com/kubernetes-engine/docs/how-to/migrate-cgroupv2.
            +
            _AUTOPROVISIONING_CGROUP_MODE_ must be one of: *default*, *v1*, *v2*.
        autoprovisioning-config-file: |-
            Path of the JSON/YAML file which contains information about the
            cluster's node autoprovisioning configuration. Currently it contains
            a list of resource limits, identity defaults for autoprovisioning, node upgrade
            settings, node management settings, minimum cpu platform, image type, node locations for
            autoprovisioning, disk type and size configuration, Shielded instance settings,
            and customer-managed encryption keys settings.
            +
            Resource limits are specified in the field 'resourceLimits'.
            Each resource limits definition contains three fields:
            resourceType, maximum and minimum.
            Resource type can be "cpu", "memory" or an accelerator (e.g.
            "nvidia-tesla-t4" for NVIDIA T4). Use gcloud compute accelerator-types
            list to learn about available accelerator types.
            Maximum is the maximum allowed amount with the unit of the resource.
            Minimum is the minimum allowed amount with the unit of the resource.
            +
            Identity default contains at most one of the below fields:
            serviceAccount: The Google Cloud Platform Service Account to be used by node VMs in
            autoprovisioned node pools. If not specified, the project's default service account
            is used.
            scopes: A list of scopes to be used by node instances in autoprovisioned node pools.
            Multiple scopes can be specified, separated by commas. For information on defaults,
            look at:
            https://cloud.google.com/sdk/gcloud/reference/container/clusters/create#--scopes
            +
            Node Upgrade settings are specified under the field
            'upgradeSettings', which has the following fields:
            maxSurgeUpgrade: Number of extra (surge) nodes to be created on
            each upgrade of an autoprovisioned node pool.
            maxUnavailableUpgrade: Number of nodes that can be unavailable at the
            same time on each upgrade of an autoprovisioned node pool.
            +
            Node Management settings are specified under the field
            'management', which has the following fields:
            autoUpgrade: A boolean field that indicates if node
            autoupgrade is enabled for autoprovisioned node pools.
            autoRepair: A boolean field that indicates if node
            autorepair is enabled for autoprovisioned node pools.
            +
            minCpuPlatform (deprecated): If specified, new autoprovisioned nodes will be
            scheduled on host with specified CPU architecture or a newer one.
            Note: Min CPU platform can only be specified in Beta and Alpha.
            +
            Autoprovisioned node image is specified under the 'imageType' field. If not specified
            the default value will be applied.
            +
            Autoprovisioning locations is a set of zones where new node pools
            can be created by Autoprovisioning. Autoprovisioning locations are
            specified in the field 'autoprovisioningLocations'. All zones must
            be in the same region as the cluster's master(s).
            +
            Disk type and size are specified under the 'diskType' and 'diskSizeGb' fields,
            respectively. If specified, new autoprovisioned nodes will be created with
            custom boot disks configured by these settings.
            +
            Shielded instance settings are specified under the 'shieldedInstanceConfig'
            field, which has the following fields:
            enableSecureBoot: A boolean field that indicates if secure boot is enabled for
            autoprovisioned nodes.
            enableIntegrityMonitoring: A boolean field that indicates if integrity
            monitoring is enabled for autoprovisioned nodes.
            +
            Customer Managed Encryption Keys (CMEK) used by new auto-provisioned node pools
            can be specified in the 'bootDiskKmsKey' field.
            +
            Use a full or relative path to a local file containing the value of autoprovisioning_config_file.
        autoprovisioning-enable-insecure-kubelet-readonly-port: |-
            Enables the Kubelet's insecure read only port for Autoprovisioned
            Node Pools.
            +
            If not set, the value from nodePoolDefaults.nodeConfigDefaults will be used.
            +
            To disable the readonly port
            `--no-autoprovisioning-enable-insecure-kubelet-readonly-port`.
        autoprovisioning-image-type: Node Autoprovisioning will create new nodes with the specified image type
        autoprovisioning-locations: |-
            Set of zones where new node pools can be created by autoprovisioning.
            All zones must be in the same region as the cluster's master(s).
            Multiple locations can be specified, separated by commas.
        autoprovisioning-max-surge-upgrade: |-
            Number of extra (surge) nodes to be created on each upgrade of an
            autoprovisioned node pool.
        autoprovisioning-max-unavailable-upgrade: |-
            Number of nodes that can be unavailable at the same time on each
            upgrade of an autoprovisioned node pool.
        autoprovisioning-min-cpu-platform: |-
            (DEPRECATED) If specified, new autoprovisioned nodes will be scheduled on host with
            specified CPU architecture or a newer one.
            +
            The `--autoprovisioning-min-cpu-platform` flag is deprecated and will be removed in an upcoming release. More info: https://cloud.google.com/kubernetes-engine/docs/release-notes#March_08_2022
        autoprovisioning-network-tags: |-
            Replaces the user specified Compute Engine tags on all nodes in all the existing
            auto-provisioned node pools in the Standard cluster or the Autopilot with the given tags (comma separated).
            +
            Examples:
            +
              $ {command} example-cluster --autoprovisioning-network-tags=tag1,tag2
            +
            New nodes in auto-provisioned node pools, including ones created by resize or recreate, will have these tags
            on the Compute Engine API instance object and these tags can be used in
            firewall rules.
            See https://cloud.google.com/sdk/gcloud/reference/compute/firewall-rules/create
            for examples.
        autoprovisioning-node-pool-soak-duration: |-
            Time in seconds to be spent waiting during blue-green upgrade before
            deleting the blue pool and completing the update.
            This argument should be used in conjunction with
            `--enable-autoprovisioning-blue-green-upgrade` to take effect.
        autoprovisioning-resource-manager-tags: |-
            For an Autopilot cluster, the specified comma-separated resource manager tags
            that has the GCP_FIREWALL purpose replace the existing tags on all nodes in
            the cluster.
            +
            For a Standard cluster, the specified comma-separated resource manager tags
            that has the GCE_FIREWALL purpose are applied to all nodes in the new
            newly created auto-provisioned node pools. Existing auto-provisioned node pools
            retain the tags that they had before the update. To update tags on an existing
            auto-provisioned node pool, use the node pool level flag
            '--resource-manager-tags'.
            +
            Examples:
            +
              $ {command} example-cluster --autoprovisioning-resource-manager-tags=tagKeys/1234=tagValues/2345
              $ {command} example-cluster --autoprovisioning-resource-manager-tags=my-project/key1=value1
              $ {command} example-cluster --autoprovisioning-resource-manager-tags=12345/key1=value1,23456/key2=value2
              $ {command} example-cluster --autoprovisioning-resource-manager-tags=
            +
            All nodes in an Autopilot cluster or all newly created auto-provisioned nodes
            in a Standard cluster, including nodes that are resized or re-created, will have
            the specified tags on the corresponding Instance object in the Compute Engine API.
            You can reference these tags in network firewall policy rules. For instructions,
            see https://cloud.google.com/firewall/docs/use-tags-for-firewalls.
        autoprovisioning-scopes: |-
            The scopes to be used by node instances in autoprovisioned node pools.
            Multiple scopes can be specified, separated by commas. For information
            on defaults, look at:
            https://cloud.google.com/sdk/gcloud/reference/container/clusters/create#--scopes
        autoprovisioning-service-account: |-
            The Google Cloud Platform Service Account to be used by node VMs in
            autoprovisioned node pools. If not specified, the project default
            service account is used.
        autoprovisioning-standard-rollout-policy: |-
            Standard rollout policy options for blue-green upgrade.
            This argument should be used in conjunction with
            `--enable-autoprovisioning-blue-green-upgrade` to take effect.
            +
            Batch sizes are specified by one of, batch-node-count or batch-percent.
            The duration between batches is specified by batch-soak-duration.
            +
            Example:
            `--standard-rollout-policy=batch-node-count=3,batch-soak-duration=60s`
            `--standard-rollout-policy=batch-percent=0.05,batch-soak-duration=180s`
        autoscaling-profile: |-
            Set autoscaling behaviour, choices are 'optimize-utilization' and 'balanced'.
            Default is 'balanced'.
        binauthz-evaluation-mode: 'Enable Binary Authorization for this cluster. _BINAUTHZ_EVALUATION_MODE_ must be one of: *disabled*, *project-singleton-policy-enforce*.'
        clear-fleet-project: |-
            Remove the cluster from current fleet host project.
            Example:
            $ {command} --clear-fleet-project
        clear-maintenance-window: |-
            If set, remove the maintenance window that was set with --maintenance-window
            family of flags.
        clear-resource-usage-bigquery-dataset: Disables exporting cluster resource usage to BigQuery.
        cloud-run-config: |-
            Configurations for Cloud Run addon, requires `--addons=CloudRun` for create
            and `--update-addons=CloudRun=ENABLED` for update.
            +
            *load-balancer-type*::: (Optional) Type of load-balancer-type EXTERNAL or
            INTERNAL.
            +
            Examples:
            +
              $ {command} example-cluster --cloud-run-config=load-balancer-type=INTERNAL
        cluster-dns: |-
            DNS provider to use for this cluster. _CLUSTER_DNS_ must be one of:
            +
            *clouddns*::: Selects Cloud DNS as the DNS provider for the cluster.
            *default*::: Selects the default DNS provider (kube-dns) for the cluster.
            *kubedns*::: Selects Kube DNS as the DNS provider for the cluster.
            :::
            +
        cluster-dns-domain: |-
            DNS domain for this cluster.
            The default value is `cluster.local`.
            This is configurable when `--cluster-dns=clouddns` and
             `--cluster-dns-scope=vpc` are set.
            The value must be a valid DNS subdomain as defined in RFC 1123.
        cluster-dns-scope: |-
            DNS scope for the Cloud DNS zone created - valid only with
             `--cluster-dns=clouddns`. Defaults to cluster.
            +
            _CLUSTER_DNS_SCOPE_ must be one of:
            +
            *cluster*::: Configures the Cloud DNS zone to be private to the cluster.
            *vpc*::: Configures the Cloud DNS zone to be private to the VPC Network.
            :::
            +
        complete-credential-rotation: |-
            Complete the IP and credential rotation for this cluster. For example:
            +
              $ {command} example-cluster --complete-credential-rotation
            +
            This causes the cluster to stop serving its old IP, return to a single IP, and invalidate old credentials. See documentation for more details: https://cloud.google.com/kubernetes-engine/docs/how-to/credential-rotation.
        complete-ip-rotation: |-
            Complete the IP rotation for this cluster. For example:
            +
              $ {command} example-cluster --complete-ip-rotation
            +
            This causes the cluster to stop serving its old IP, and return to a single IP state. See documentation for more details: https://cloud.google.com/kubernetes-engine/docs/how-to/ip-rotation.
        compliance: 'Sets enablement mode for Compliance. Must provide one of: enabled, disabled.'
        compliance-standards: |
            Comma-delimited list of standards to be enabled. See
            https://cloud.google.com/kubernetes-engine/fleet-management/docs/about-compliance-dashboard#how-compliance-works
        containerd-config-from-file: |-
            Path of the YAML file that contains containerd configuration entries like configuring access to private image registries.
            +
            For detailed information on the configuration usage, please refer to https://cloud.google.com/kubernetes-engine/docs/how-to/customize-containerd-configuration.
            +
            Note: Updating the containerd configuration of an existing cluster or node pool requires recreation of the existing nodes, which might cause disruptions in running workloads.
            +
            Use a full or relative path to a local file containing the value of containerd_config.
        control-plane-disk-encryption-key: |
            The Cloud KMS symmetric encryption cryptoKey that will be used to
            encrypt the control plane disks.
        control-plane-egress: |
            Configures the egress policy for the GKE control plane to control outbound
            traffic from the kube-apiserver.

            * `NONE`: (Recommended) Provides maximum security. This mode removes the control
              plane's public IP address and blocks all outbound traffic from the
              kube-apiserver by default, preventing unexpected data exfiltration. Webhooks
              that use `clientConfig.url` will be disabled. Essential GKE-managed services
              are still permitted to function via an internal allowlist.

            * `VIA_CONTROL_PLANE`: (Default) Maintains backward compatibility. The control
              plane retains its public IP address and allows egress traffic from the
              kube-apiserver.
        database-encryption-key: |-
            Enable Database Encryption.
            +
            Enable database encryption that will be used to encrypt Kubernetes Secrets at
            the application layer. The key provided should be the resource ID in the format of
            `projects/[KEY_PROJECT_ID]/locations/[LOCATION]/keyRings/[RING_NAME]/cryptoKeys/[KEY_NAME]`.
            For more information, see
            https://cloud.google.com/kubernetes-engine/docs/how-to/encrypting-secrets.
        dataplane-v2-observability-mode: "(REMOVED) \nSelect Advanced Datapath Observability mode for the cluster. Defaults to `DISABLED`.\n+\nAdvanced Datapath Observability allows for a real-time view into pod-to-pod traffic within your cluster.\n+\nExamples:\n+\n  $ {command} --dataplane-v2-observability-mode=DISABLED\n+\n  $ {command} --dataplane-v2-observability-mode=INTERNAL_VPC_LB\n+\n  $ {command} --dataplane-v2-observability-mode=EXTERNAL_LB\n+\nFlag --dataplane-v2-observability-mode has been removed.\n+\n_DATAPLANE_V2_OBSERVABILITY_MODE_ must be one of:\n+\n*DISABLED*::: Disables Advanced Datapath Observability.\n*EXTERNAL_LB*::: Makes Advanced Datapath Observability available to the external network.\n*INTERNAL_VPC_LB*::: Makes Advanced Datapath Observability available from the VPC network.\n:::\n+"
        disable-additive-vpc-scope: Disables Additive VPC Scope.
        disable-auto-ipam: Disable the Auto IP Address Management (Auto IPAM) feature for the cluster.
        disable-autopilot: Converts a cluster from Autopilot mode to Standard mode.
        disable-database-encryption: |-
            Disable database encryption.
            +
            Disable Database Encryption which encrypt Kubernetes Secrets at
            the application layer. For more information, see
            https://cloud.google.com/kubernetes-engine/docs/how-to/encrypting-secrets.
        disable-dataplane-v2-flow-observability: Disables Advanced Datapath Observability.
        disable-dataplane-v2-metrics: Stops exposing advanced datapath flow metrics on node port.
        disable-default-snat: |-
            Disable default source NAT rules applied in cluster nodes.
            +
            By default, cluster nodes perform source network address translation (SNAT)
            for packets sent from Pod IP address sources to destination IP addresses
            that are not in the non-masquerade CIDRs list.
            For more details about SNAT and IP masquerading, see:
            https://cloud.google.com/kubernetes-engine/docs/how-to/ip-masquerade-agent#how_ipmasq_works
            SNAT changes the packet's source IP address to the node's internal IP address.
            +
            When this flag is set, GKE does not perform SNAT for packets sent to any destination.
            You must set this flag if the cluster uses privately reused public IPs.
            +
            The --disable-default-snat flag is only applicable to private GKE clusters, which are
            inherently VPC-native. Thus, --disable-default-snat requires that the cluster was created
            with both --enable-ip-alias and --enable-private-nodes.
        disable-l4-lb-firewall-reconciliation: |-
            Disable reconciliation on the cluster for L4 Load Balancer VPC
            firewalls targeting ingress traffic.
        disable-managed-prometheus: |-
            Disable managed collection for Managed Service for
              Prometheus.
        disable-workload-identity: |-
            Disable Workload Identity on the cluster.
            +
            For more information on Workload Identity, see
            +
                        https://cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
        drain-additional-ip-ranges: |
            Set status of additional subnetworks named "my-subnet" to DRAINING.

            Examples:

              $ {command} example-cluster --drain-additional-ip-ranges=subnetwork=my-subnet
        enable-authorized-networks-on-private-endpoint: |-
            Enable enforcement of --master-authorized-networks CIDR ranges for
            traffic reaching cluster's control plane via private IP.
        enable-auto-ipam: Enable the Auto IP Address Management (Auto IPAM) feature for the cluster.
        enable-autopilot-compatibility-auditing: |-
            Lets you run the
            [gcloud container clusters check-autopilot-compatibility](https://cloud.google.com/sdk/gcloud/reference/container/clusters/check-autopilot-compatibility)
            command to check whether your workloads are compatible with Autopilot
            mode. This flag is only applicable to clusters that run version
            1.31.6-gke.1027000 or later.
            +
            Note: This flag causes a control plane restart.
            +
            Use *--enable-autopilot-compatibility-auditing* to enable and *--no-enable-autopilot-compatibility-auditing* to disable.
        enable-autoprovisioning: |-
            Enables  node autoprovisioning for a cluster.
            +
            Cluster Autoscaler will be able to create new node pools. Requires maximum CPU
            and memory limits to be specified.
        enable-autoprovisioning-autorepair: |-
            Enable node autorepair for autoprovisioned node pools.
            Use --no-enable-autoprovisioning-autorepair to disable.
        enable-autoprovisioning-autoupgrade: |-
            Enable node autoupgrade for autoprovisioned node pools.
            Use --no-enable-autoprovisioning-autoupgrade to disable.
        enable-autoprovisioning-blue-green-upgrade: Whether to use blue-green upgrade for the autoprovisioned node pool.
        enable-autoprovisioning-surge-upgrade: Whether to use surge upgrade for the autoprovisioned node pool.
        enable-autoscaling: |-
            Enables autoscaling for a node pool.
            +
            Enables autoscaling in the node pool specified by --node-pool or
            the default node pool if --node-pool is not provided. If not already,
            --max-nodes or --total-max-nodes must also be set.
        enable-basic-auth: |-
            Enable basic (username/password) auth for the cluster.  `--enable-basic-auth` is
            an alias for `--username=admin`; `--no-enable-basic-auth` is an alias for
            `--username=""`. Use `--password` to specify a password; if not, the server will
            randomly generate one. For cluster versions before 1.12, if neither
            `--enable-basic-auth` nor `--username` is specified, `--enable-basic-auth` will
            default to `true`. After 1.12, `--enable-basic-auth` will default to `false`.
        enable-binauthz: |-
            (DEPRECATED) Enable Binary Authorization for this cluster.
            +
            The `--enable-binauthz` flag is deprecated. Please use `--binauthz-evaluation-mode` instead.
        enable-cilium-clusterwide-network-policy: Enable Cilium Clusterwide Network Policies on the cluster. Use *--enable-cilium-clusterwide-network-policy* to enable and *--no-enable-cilium-clusterwide-network-policy* to disable.
        enable-cost-allocation: |-
            Enable the cost management feature.
            +
            When enabled, you can get informational GKE cost breakdowns by cluster,
            namespace and label in your billing data exported to BigQuery
            (https://cloud.google.com/billing/docs/how-to/export-data-bigquery).
            +
            Use --no-enable-cost-allocation to disable this feature.
        enable-dataplane-v2-flow-observability: Enables Advanced Datapath Observability which allows for a real-time view into pod-to-pod traffic within your cluster.
        enable-dataplane-v2-metrics: Exposes advanced datapath flow metrics on node port.
        enable-default-compute-class: |-
            Enable the default compute class to use for the cluster.
            +
            To disable Default Compute Class in an existing cluster, explicitly set flag
            `--no-enable-default-compute-class`.
        enable-dns-access: |-
            Enable access to the cluster's control plane over DNS-based endpoint.
            +
            DNS-based control plane access is recommended.
        enable-fleet: |-
            Set cluster project as the fleet host project. This will register the cluster to the same project.
            To register the cluster to a fleet in a different project, please use `--fleet-project=FLEET_HOST_PROJECT`.
            Example:
            $ {command} --enable-fleet
        enable-fqdn-network-policy: Enable FQDN Network Policies on the cluster. FQDN Network Policies are disabled by default.
        enable-google-cloud-access: |-
            When you enable Google Cloud Access, any public IP addresses owned by Google
            Cloud can reach the public control plane endpoint of your cluster.
        enable-identity-service: |-
            Enable Identity Service component on the cluster.
            +
            When enabled, users can authenticate to Kubernetes cluster with external
            identity providers.
            +
            Identity Service is by default disabled when creating a new cluster.
            To disable Identity Service in an existing cluster, explicitly set flag
            `--no-enable-identity-service`.
        enable-image-streaming: Specifies whether to enable image streaming on cluster.
        enable-insecure-binding-system-authenticated: |-
            Allow using `system:authenticated` as a subject in ClusterRoleBindings and RoleBindings.
            Allowing bindings that reference `system:authenticated` is a security risk and is not recommended.
            +
            To disallow binding `system:authenticated` in a cluster, explicitly set the
            `--no-enable-insecure-binding-system-authenticated` flag instead.
        enable-insecure-binding-system-unauthenticated: |-
            Allow using `system:unauthenticated` and `system:anonymous` as subjects in ClusterRoleBindings and RoleBindings.
            Allowing bindings that reference `system:unauthenticated` and `system:anonymous` are a security risk and is not recommended.
            +
            To disallow binding `system:authenticated` in a cluster, explicitly set the
            `--no-enable-insecure-binding-system-unauthenticated` flag instead.
        enable-insecure-kubelet-readonly-port: |-
            Enables the Kubelet's insecure read only port.
            +
            To disable the readonly port on a cluster or node-pool set the flag to
            `--no-enable-insecure-kubelet-readonly-port`.
        enable-intra-node-visibility: |-
            Enable Intra-node visibility for this cluster.
            +
            Enabling intra-node visibility makes your intra-node pod-to-pod traffic
            visible to the networking fabric. With this feature, you can use VPC flow
            logging or other VPC features for intra-node traffic.
            +
            Enabling it on an existing cluster causes the cluster
            master and the cluster nodes to restart, which might cause a disruption.
        enable-ip-access: |-
            Enable access to the cluster's control plane over private IP and
            public IP if --enable-private-endpoint is not enabled.
        enable-k8s-certs-via-dns: Enable K8s client certificates Authentication to the cluster's control plane over DNS-based endpoint.
        enable-k8s-tokens-via-dns: Enable K8s Service Account tokens Authentication to the cluster's control plane over DNS-based endpoint.
        enable-kernel-module-signature-enforcement: |-
            Enforces that kernel modules are signed on all new nodes in the cluster unless
            explicitly overridden with `--no-enable-kernel-module-signature-enforcement`
            when creating the nodepool.
            Use `--no-enable-kernel-module-signature-enforcement` to disable.
            +
            Examples:
            +
              $ {command} example-cluster --enable-kernel-module-signature-enforcement
        enable-kubernetes-unstable-apis: |-
            Enable Kubernetes beta API features on this cluster.
            Beta APIs are not expected to be production ready and
            should be avoided in production-grade environments.
        enable-l4-ilb-subsetting: Enable Subsetting for L4 ILB services created on this cluster.
        enable-l4-lb-firewall-reconciliation: |-
            Enable reconciliation on the cluster for L4 Load Balancer VPC
            firewalls targeting ingress traffic. L4 LB VPC firewall
            reconciliation is enabled by default.
        enable-legacy-authorization: |-
            Enables the legacy ABAC authentication for the cluster.
            User rights are granted through the use of policies which combine attributes
            together. For a detailed look at these properties and related formats, see
            https://kubernetes.io/docs/admin/authorization/abac/. To use RBAC permissions
            instead, create or update your cluster with the option
            `--no-enable-legacy-authorization`.
        enable-legacy-lustre-port: |-
            Allow the Lustre CSI driver to initialize LNet (the virtual network layer for Lustre kernel module) using port 6988.
            This flag is required to workaround a port conflict with the gke-metadata-server on GKE nodes.
        enable-managed-prometheus: |-
            Enables managed collection for Managed Service for Prometheus in the cluster.
            +
            See https://cloud.google.com/stackdriver/docs/managed-prometheus/setup-managed#enable-mgdcoll-gke
            for more info.
            +
            Enabled by default for cluster versions 1.27 or greater,
            use --no-enable-managed-prometheus to disable.
        enable-master-authorized-networks: |-
            Allow only specified set of CIDR blocks (specified by the
            `--master-authorized-networks` flag) to connect to Kubernetes master through
            HTTPS. Besides these blocks, the following have access as well:
            +
              1) The private network the cluster connects to if
              `--enable-private-nodes` is specified.
              2) Google Compute Engine Public IPs if `--enable-private-nodes` is not
              specified.
            +
            Use `--no-enable-master-authorized-networks` to disable. When disabled, public
            internet (0.0.0.0/0) is allowed to connect to Kubernetes master through HTTPS.
        enable-master-global-access: |-
            Use with private clusters to allow access to the master's private endpoint from any Google Cloud region or on-premises environment regardless of the
            private cluster's region.
        enable-mesh-certificates: |
            Enable Mesh Certificates.

            After the cluster is created, configure an issuing certificate authority using
            the Kubernetes API.

            To disable Mesh Certificates in an existing cluster, explicitly set flag
            `--no-enable-mesh-certificates`.
        enable-multi-networking: |-
            Enables multi-networking on the cluster.
            Multi-networking is disabled by default.
        enable-network-egress-metering: |-
            Enable network egress metering on this cluster.
            +
            When enabled, a DaemonSet is deployed into the cluster. Each DaemonSet pod
            meters network egress traffic by collecting data from the conntrack table, and
            exports the metered metrics to the specified destination.
            +
            Network egress metering is disabled if this flag is omitted, or when
            `--no-enable-network-egress-metering` is set.
        enable-network-policy: Enable network policy enforcement for this cluster. If you are enabling network policy on an existing cluster the network policy addon must first be enabled on the master by using --update-addons=NetworkPolicy=ENABLED flag.
        enable-private-endpoint: |-
            Enables cluster's control plane to be accessible using private IP
            address only.
        enable-private-nodes: |-
            Standard cluster:
              Enable private nodes as a default behavior for all newly created node pools,
              if `--enable-private-nodes` is not provided at node pool creation time.
            +
              Modifications to this flag do not affect `--enable-private-nodes` state of the
              existing node pools.
            +
            Autopilot cluster:
              Force new and existing workloads, without explicit
              `cloud.google.com/private-node=true` node selector, to run on nodes with no
              public IP address.
            +
              Modifications to this flag trigger a re-schedule operation on all existng
              workloads to run on different node VMs.
        enable-ray-cluster-logging: Enable automatic log processing sidecar for Ray clusters. Use *--enable-ray-cluster-logging* to enable and *--no-enable-ray-cluster-logging* to disable.
        enable-ray-cluster-monitoring: Enable automatic metrics collection for Ray clusters. Use *--enable-ray-cluster-monitoring* to enable and *--no-enable-ray-cluster-monitoring* to disable.
        enable-resource-consumption-metering: |-
            Enable resource consumption metering on this cluster.
            +
            When enabled, a table will be created in the specified BigQuery dataset to store
            resource consumption data. The resulting table can be joined with the resource
            usage table or with BigQuery billing export.
            +
            To disable resource consumption metering, set `--no-enable-resource-consumption-
            metering`. If this flag is omitted, then resource consumption metering will
            remain enabled or disabled depending on what is already configured for this
            cluster.
        enable-runtime-vulnerability-insight: |
            Enables the GKE Runtime Vulnerability Insight API's features.

            To disable in an existing cluster, explicitly set flag to
            `--no-enable-runtime-vulnerability-insight`.
        enable-secret-manager: |-
            Enables the Secret Manager CSI driver provider component. See
            https://secrets-store-csi-driver.sigs.k8s.io/introduction
            https://github.com/GoogleCloudPlatform/secrets-store-csi-driver-provider-gcp. Use *--enable-secret-manager* to enable and *--no-enable-secret-manager* to disable.
        enable-secret-manager-rotation: |-
            Enables the rotation of secrets in the Secret Manager CSI driver
            provider component. Use *--enable-secret-manager-rotation* to enable and *--no-enable-secret-manager-rotation* to disable.
        enable-security-posture: |-
            (DEPRECATED) Enables the GKE Security Posture API's features.

            To disable in an existing cluster, explicitly set flag to
            `--no-enable-security-posture`.
            +
            `--enable-security-posture` is deprecated and will be removed in an upcoming release. Please use `--security-posture=standard` to enable GKE Security Posture. For more details, please read: https://cloud.google.com/kubernetes-engine/docs/how-to/protect-workload-configuration.
        enable-service-externalips: Enables use of services with externalIPs field.
        enable-shielded-nodes: |-
            Enable Shielded Nodes for this cluster. Enabling Shielded Nodes will enable a
            more secure Node credential bootstrapping implementation. Starting with version
            1.18, clusters will have Shielded GKE nodes by default.
        enable-slice-controller: |
            Enable Slice Controller for the cluster.
            Use `--no-enable-slice-controller` to disable.
        enable-stackdriver-kubernetes: |-
            (DEPRECATED) Enable Cloud Operations for GKE.
            +
            The `--enable-stackdriver-kubernetes` flag is deprecated and will be removed in an upcoming release. Please use `--logging` and `--monitoring` instead. For more information, please read: https://cloud.google.com/kubernetes-engine/docs/concepts/about-logs and https://cloud.google.com/kubernetes-engine/docs/how-to/configure-metrics.
        enable-vertical-pod-autoscaling: Enable vertical pod autoscaling for a cluster.
        fleet-project: |-
            Sets fleet host project for the cluster. If specified, the current cluster will be registered as a fleet membership under the fleet host project.
            +
            Example:
            $ {command} --fleet-project=my-project
        gateway-api: "Enables GKE Gateway controller in this cluster. The value of the flag specifies\nwhich Open Source Gateway API release channel will be used to define Gateway\nresources. _GATEWAY_API_ must be one of:\n+\n*disabled*::: Gateway controller will be disabled in the cluster.\n+\n*standard*::: Gateway controller will be enabled in the cluster.\nResource definitions from the `standard` OSS Gateway API release\nchannel will be installed. \n:::\n+"
        generate-password: Ask the server to generate a secure password and use that as the basic auth password, keeping the existing username.
        hpa-profile: |-
            Set Horizontal Pod Autoscaler behavior. Accepted values are: none, performance.
            For more information, see https://cloud.google.com/kubernetes-engine/docs/how-to/horizontal-pod-autoscaling#hpa-profile.
        in-transit-encryption: 'Enable Dataplane V2 in-transit encryption. Dataplane v2 in-transit encryption is disabled by default. _IN_TRANSIT_ENCRYPTION_ must be one of: *inter-node-transparent*, *none*.'
        kuberun-config: |
            Configurations for Cloud Run addon, requires `--addons=CloudRun` for create
            and `--update-addons=CloudRun=ENABLED` for update.

            *load-balancer-type*::: (Optional) Type of load-balancer-type EXTERNAL or
            INTERNAL.

            Examples:

              $ {command} example-cluster --cloud-run-config=load-balancer-type=INTERNAL
        location: Compute zone or region (e.g. us-central1-a or us-central1) for the cluster. Overrides the default compute/region or compute/zone value for this command invocation. Prefer using this flag over the --region or --zone flags.
        location-policy: |-
            Location policy specifies the algorithm used when scaling-up the node pool.
            +
            * `BALANCED` - Is a best effort policy that aims to balance the sizes of available
              zones.
            * `ANY` - Instructs the cluster autoscaler to prioritize utilization of unused
              reservations, and reduces preemption risk for Spot VMs.
            +
            _LOCATION_POLICY_ must be one of: *BALANCED*, *ANY*.
        logging: |-
            Set the components that have logging enabled. Valid component values are:
            `SYSTEM`, `WORKLOAD`, `API_SERVER`, `CONTROLLER_MANAGER`, `SCHEDULER`, `NONE`
            +
            For more information, see
            https://cloud.google.com/kubernetes-engine/docs/concepts/about-logs#available-logs
            +
            Examples:
            +
              $ {command} --logging=SYSTEM
              $ {command} --logging=SYSTEM,API_SERVER,WORKLOAD
              $ {command} --logging=NONE
        logging-service: |-
            (DEPRECATED) Logging service to use for the cluster. Options are:
            "logging.googleapis.com/kubernetes" (the Google Cloud Logging
            service with Kubernetes-native resource model enabled),
            "logging.googleapis.com" (the Google Cloud Logging service),
            "none" (logs will not be exported from the cluster)
            +
            The `--logging-service` flag is deprecated and will be removed in an upcoming release. Please use `--logging` instead. For more information, please read: https://cloud.google.com/kubernetes-engine/docs/concepts/about-logs.
        logging-variant: "Specifies the logging variant that will be deployed on all the nodes\nin the cluster. Valid logging variants are `MAX_THROUGHPUT`, `DEFAULT`.\nIf no value is specified, DEFAULT is used. _LOGGING_VARIANT_ must be one of:\n+\n*DEFAULT*::: 'DEFAULT' variant requests minimal resources but may not\nguarantee high throughput. \n*MAX_THROUGHPUT*::: 'MAX_THROUGHPUT' variant requests more node resources and is\nable to achieve logging throughput up to 10MB per sec. \n:::\n+"
        maintenance-window: |-
            Set a time of day when you prefer maintenance to start on this cluster. For example:
            +
              $ {command} example-cluster --maintenance-window=12:43
            +
            The time corresponds to the UTC time zone, and must be in HH:MM format.
            +
            Non-emergency maintenance will occur in the 4 hour block starting at the
            specified time.
            +
            This is mutually exclusive with the recurring maintenance windows
            and will overwrite any existing window. Compatible with maintenance
            exclusions.
            +
            To remove an existing maintenance window from the cluster, use
            '--clear-maintenance-window'.
        maintenance-window-end: |-
            The end time for calculating the duration of the maintenance window,
            as expressed by the amount of time after the START_TIME, in the
            same format. The value for END_TIME must be in the future, relative
            to START_TIME. This only calculates the duration of the window,
            and doesn't set when the maintenance window stops recurring.
            Maintenance windows only stop recurring when they're removed. See
            $ gcloud topic datetimes for information on time formats.
            +
            This flag argument must be specified if any of the other arguments
            in this group are specified.
        maintenance-window-recurrence: |-
            An RFC 5545 RRULE, specifying how the window will recur. Note that minimum
            requirements for maintenance periods will be enforced. Note that FREQ=SECONDLY,
            MINUTELY, and HOURLY are not supported.
        maintenance-window-start: |-
            Start time of the first window (can occur in the past). The start time
            influences when the window will start for recurrences. See $ gcloud topic
            datetimes for information on time formats.
        master-authorized-networks: The list of CIDR blocks (up to 100 for private cluster, 50 for public cluster) that are allowed to connect to Kubernetes master through HTTPS. Specified in CIDR notation (e.g. 1.2.3.4/30). Cannot be specified unless `--enable-master-authorized-networks` is also specified.
        max-accelerator: |-
            Sets maximum limit for a single type of accelerators (e.g. GPUs) in cluster.
            +
            *type*::: (Required) The specific type (e.g. nvidia-tesla-t4 for NVIDIA T4)
            of accelerator for which the limit is set. Use ```gcloud compute
            accelerator-types list``` to learn about all available accelerator types.
            +
            *count*::: (Required) The maximum number of accelerators
            to which the cluster can be scaled.
        max-cpu: |-
            Maximum number of cores in the cluster.
            +
            Maximum number of cores to which the cluster can scale.
        max-memory: |-
            Maximum memory in the cluster.
            +
            Maximum number of gigabytes of memory to which the cluster can scale.
        max-nodes: |-
            Maximum number of nodes per zone in the node pool.
            +
            Maximum number of nodes per zone to which the node pool specified by --node-pool
            (or default node pool if unspecified) can scale. Ignored unless
            --enable-autoscaling is also specified.
        membership-type: |-
            Specify a membership type for the cluster's fleet membership.
            Example:
            $ {command} --membership-type=LIGHTWEIGHT. _MEMBERSHIP_TYPE_ must be (only one value is supported):
            +
            *LIGHTWEIGHT*::: Fleet membership representing this cluster will be lightweight.
            +
            :::
            +
        min-accelerator: |-
            Sets minimum limit for a single type of accelerators (e.g. GPUs) in cluster. Defaults
            to 0 for all accelerator types if it isn't set.
            +
            *type*::: (Required) The specific type (e.g. nvidia-tesla-t4 for NVIDIA T4)
            of accelerator for which the limit is set. Use ```gcloud compute
            accelerator-types list``` to learn about all available accelerator types.
            +
            *count*::: (Required) The minimum number of accelerators
            to which the cluster can be scaled.
        min-cpu: |-
            Minimum number of cores in the cluster.
            +
            Minimum number of cores to which the cluster can scale.
        min-memory: |-
            Minimum memory in the cluster.
            +
            Minimum number of gigabytes of memory to which the cluster can scale.
        min-nodes: |-
            Minimum number of nodes per zone in the node pool.
            +
            Minimum number of nodes per zone to which the node pool specified by --node-pool
            (or default node pool if unspecified) can scale. Ignored unless
            --enable-autoscaling is also specified.
        monitoring: |-
            Set the components that have monitoring enabled. Valid component values are:
            `SYSTEM`, `WORKLOAD` (Deprecated), `NONE`, `API_SERVER`, `CONTROLLER_MANAGER`,
            `SCHEDULER`, `DAEMONSET`, `DEPLOYMENT`, `HPA`, `POD`, `STATEFULSET`, `STORAGE`,
            `CADVISOR`, `KUBELET`, `DCGM`, `JOBSET`
            +
            For more information, see
            https://cloud.google.com/kubernetes-engine/docs/how-to/configure-metrics#available-metrics
            +
            Examples:
            +
              $ {command} --monitoring=SYSTEM,API_SERVER,POD
              $ {command} --monitoring=NONE
        monitoring-service: |-
            (DEPRECATED) Monitoring service to use for the cluster. Options are:
            "monitoring.googleapis.com/kubernetes" (the Google Cloud
            Monitoring service with Kubernetes-native resource model enabled),
            "monitoring.googleapis.com" (the Google Cloud Monitoring service),
            "none" (no metrics will be exported from the cluster)
            +
            The `--monitoring-service` flag is deprecated and will be removed in an upcoming release. Please use `--monitoring` instead. For more information, please read: https://cloud.google.com/kubernetes-engine/docs/how-to/configure-metrics.
        network-performance-configs: |-
            Configures network performance settings for the cluster.
            Node pools can override with their own settings.
            +
            *total-egress-bandwidth-tier*::: Total egress bandwidth is the available
            outbound bandwidth from a VM, regardless of whether the traffic
            is going to internal IP or external IP destinations.
            The following tier values are allowed: [TIER_UNSPECIFIED,TIER_1].
            +
            See https://cloud.google.com/compute/docs/networking/configure-vm-with-high-bandwidth-configuration for more information.
        network-tier: |
            Set the network tier for the cluster, possible values are premium, standard and default.
            If use default, cluster will use project default network tier.
        no-add-maintenance-exclusion-until-end-of-support: |
            End time of the exclusion window is the end of the cluster's support.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-autoprovisioning-enable-insecure-kubelet-readonly-port: |
            Enables the Kubelet's insecure read only port for Autoprovisioned
            Node Pools.

            If not set, the value from nodePoolDefaults.nodeConfigDefaults will be used.

            To disable the readonly port
            `--no-autoprovisioning-enable-insecure-kubelet-readonly-port`.
        no-clear-fleet-project: |
            Remove the cluster from current fleet host project.
            Example:
            $ {command} --clear-fleet-project
        no-clear-maintenance-window: |
            If set, remove the maintenance window that was set with --maintenance-window
            family of flags.
        no-clear-resource-usage-bigquery-dataset: Disables exporting cluster resource usage to BigQuery.
        no-complete-credential-rotation: |-
            Complete the IP and credential rotation for this cluster. For example:

              $ {command} example-cluster --complete-credential-rotation

            This causes the cluster to stop serving its old IP, return to a single IP, and invalidate old credentials. See documentation for more details: https://cloud.google.com/kubernetes-engine/docs/how-to/credential-rotation.
        no-complete-ip-rotation: |-
            Complete the IP rotation for this cluster. For example:

              $ {command} example-cluster --complete-ip-rotation

            This causes the cluster to stop serving its old IP, and return to a single IP state. See documentation for more details: https://cloud.google.com/kubernetes-engine/docs/how-to/ip-rotation.
        no-disable-additive-vpc-scope: Disables Additive VPC Scope.
        no-disable-autopilot: Converts a cluster from Autopilot mode to Standard mode.
        no-disable-database-encryption: |
            Disable database encryption.

            Disable Database Encryption which encrypt Kubernetes Secrets at
            the application layer. For more information, see
            https://cloud.google.com/kubernetes-engine/docs/how-to/encrypting-secrets.
        no-disable-default-snat: |
            Disable default source NAT rules applied in cluster nodes.

            By default, cluster nodes perform source network address translation (SNAT)
            for packets sent from Pod IP address sources to destination IP addresses
            that are not in the non-masquerade CIDRs list.
            For more details about SNAT and IP masquerading, see:
            https://cloud.google.com/kubernetes-engine/docs/how-to/ip-masquerade-agent#how_ipmasq_works
            SNAT changes the packet's source IP address to the node's internal IP address.

            When this flag is set, GKE does not perform SNAT for packets sent to any destination.
            You must set this flag if the cluster uses privately reused public IPs.

            The --disable-default-snat flag is only applicable to private GKE clusters, which are
            inherently VPC-native. Thus, --disable-default-snat requires that the cluster was created
            with both --enable-ip-alias and --enable-private-nodes.
        no-disable-managed-prometheus: |-
            Disable managed collection for Managed Service for
              Prometheus.
        no-disable-workload-identity: |
            Disable Workload Identity on the cluster.

            For more information on Workload Identity, see

                        https://cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
        no-enable-authorized-networks-on-private-endpoint: |
            Enable enforcement of --master-authorized-networks CIDR ranges for
            traffic reaching cluster's control plane via private IP.
        no-enable-autopilot-compatibility-auditing: |
            Lets you run the
            [gcloud container clusters check-autopilot-compatibility](https://cloud.google.com/sdk/gcloud/reference/container/clusters/check-autopilot-compatibility)
            command to check whether your workloads are compatible with Autopilot
            mode. This flag is only applicable to clusters that run version
            1.31.6-gke.1027000 or later.

            Note: This flag causes a control plane restart.
        no-enable-autoprovisioning: |-
            Enables  node autoprovisioning for a cluster.

            Cluster Autoscaler will be able to create new node pools. Requires maximum CPU
            and memory limits to be specified.
        no-enable-autoprovisioning-autorepair: |
            Enable node autorepair for autoprovisioned node pools.
            Use --no-enable-autoprovisioning-autorepair to disable.
        no-enable-autoprovisioning-autoupgrade: |
            Enable node autoupgrade for autoprovisioned node pools.
            Use --no-enable-autoprovisioning-autoupgrade to disable.
        no-enable-autoprovisioning-blue-green-upgrade: |
            Whether to use blue-green upgrade for the autoprovisioned node pool.
        no-enable-autoprovisioning-surge-upgrade: |
            Whether to use surge upgrade for the autoprovisioned node pool.
        no-enable-autoscaling: |-
            Enables autoscaling for a node pool.

            Enables autoscaling in the node pool specified by --node-pool or
            the default node pool if --node-pool is not provided. If not already,
            --max-nodes or --total-max-nodes must also be set.
        no-enable-basic-auth: |-
            Enable basic (username/password) auth for the cluster.  `--enable-basic-auth` is
            an alias for `--username=admin`; `--no-enable-basic-auth` is an alias for
            `--username=""`. Use `--password` to specify a password; if not, the server will
            randomly generate one. For cluster versions before 1.12, if neither
            `--enable-basic-auth` nor `--username` is specified, `--enable-basic-auth` will
            default to `true`. After 1.12, `--enable-basic-auth` will default to `false`.
        no-enable-binauthz: "(DEPRECATED) Enable Binary Authorization for this cluster.\n+\nThe `--enable-binauthz` flag is deprecated. Please use `--binauthz-evaluation-mode` instead. "
        no-enable-cilium-clusterwide-network-policy: Enable Cilium Clusterwide Network Policies on the cluster.
        no-enable-cost-allocation: |
            Enable the cost management feature.

            When enabled, you can get informational GKE cost breakdowns by cluster,
            namespace and label in your billing data exported to BigQuery
            (https://cloud.google.com/billing/docs/how-to/export-data-bigquery).

            Use --no-enable-cost-allocation to disable this feature.
        no-enable-default-compute-class: |
            Enable the default compute class to use for the cluster.

            To disable Default Compute Class in an existing cluster, explicitly set flag
            `--no-enable-default-compute-class`.
        no-enable-dns-access: |
            Enable access to the cluster's control plane over DNS-based endpoint.

            DNS-based control plane access is recommended.
        no-enable-fleet: |
            Set cluster project as the fleet host project. This will register the cluster to the same project.
            To register the cluster to a fleet in a different project, please use `--fleet-project=FLEET_HOST_PROJECT`.
            Example:
            $ {command} --enable-fleet
        no-enable-fqdn-network-policy: |
            Enable FQDN Network Policies on the cluster. FQDN Network Policies are disabled by default.
        no-enable-google-cloud-access: |
            When you enable Google Cloud Access, any public IP addresses owned by Google
            Cloud can reach the public control plane endpoint of your cluster.
        no-enable-identity-service: |
            Enable Identity Service component on the cluster.

            When enabled, users can authenticate to Kubernetes cluster with external
            identity providers.

            Identity Service is by default disabled when creating a new cluster.
            To disable Identity Service in an existing cluster, explicitly set flag
            `--no-enable-identity-service`.
        no-enable-image-streaming: Specifies whether to enable image streaming on cluster.
        no-enable-insecure-binding-system-authenticated: |
            Allow using `system:authenticated` as a subject in ClusterRoleBindings and RoleBindings.
            Allowing bindings that reference `system:authenticated` is a security risk and is not recommended.

            To disallow binding `system:authenticated` in a cluster, explicitly set the
            `--no-enable-insecure-binding-system-authenticated` flag instead.
        no-enable-insecure-binding-system-unauthenticated: |
            Allow using `system:unauthenticated` and `system:anonymous` as subjects in ClusterRoleBindings and RoleBindings.
            Allowing bindings that reference `system:unauthenticated` and `system:anonymous` are a security risk and is not recommended.

            To disallow binding `system:authenticated` in a cluster, explicitly set the
            `--no-enable-insecure-binding-system-unauthenticated` flag instead.
        no-enable-insecure-kubelet-readonly-port: |
            Enables the Kubelet's insecure read only port.

            To disable the readonly port on a cluster or node-pool set the flag to
            `--no-enable-insecure-kubelet-readonly-port`.
        no-enable-intra-node-visibility: |
            Enable Intra-node visibility for this cluster.

            Enabling intra-node visibility makes your intra-node pod-to-pod traffic
            visible to the networking fabric. With this feature, you can use VPC flow
            logging or other VPC features for intra-node traffic.

            Enabling it on an existing cluster causes the cluster
            master and the cluster nodes to restart, which might cause a disruption.
        no-enable-ip-access: |
            Enable access to the cluster's control plane over private IP and
            public IP if --enable-private-endpoint is not enabled.
        no-enable-k8s-certs-via-dns: 'Enable K8s client certificates Authentication to the cluster''s control plane over DNS-based endpoint. '
        no-enable-k8s-tokens-via-dns: 'Enable K8s Service Account tokens Authentication to the cluster''s control plane over DNS-based endpoint. '
        no-enable-kernel-module-signature-enforcement: |
            Enforces that kernel modules are signed on all new nodes in the cluster unless
            explicitly overridden with `--no-enable-kernel-module-signature-enforcement`
            when creating the nodepool.
            Use `--no-enable-kernel-module-signature-enforcement` to disable.

            Examples:

              $ {command} example-cluster --enable-kernel-module-signature-enforcement
        no-enable-l4-ilb-subsetting: Enable Subsetting for L4 ILB services created on this cluster.
        no-enable-legacy-authorization: |
            Enables the legacy ABAC authentication for the cluster.
            User rights are granted through the use of policies which combine attributes
            together. For a detailed look at these properties and related formats, see
            https://kubernetes.io/docs/admin/authorization/abac/. To use RBAC permissions
            instead, create or update your cluster with the option
            `--no-enable-legacy-authorization`.
        no-enable-legacy-lustre-port: |
            Allow the Lustre CSI driver to initialize LNet (the virtual network layer for Lustre kernel module) using port 6988.
            This flag is required to workaround a port conflict with the gke-metadata-server on GKE nodes.
        no-enable-managed-prometheus: |
            Enables managed collection for Managed Service for Prometheus in the cluster.

            See https://cloud.google.com/stackdriver/docs/managed-prometheus/setup-managed#enable-mgdcoll-gke
            for more info.

            Enabled by default for cluster versions 1.27 or greater,
            use --no-enable-managed-prometheus to disable.
        no-enable-master-authorized-networks: |
            Allow only specified set of CIDR blocks (specified by the
            `--master-authorized-networks` flag) to connect to Kubernetes master through
            HTTPS. Besides these blocks, the following have access as well:

              1) The private network the cluster connects to if
              `--enable-private-nodes` is specified.
              2) Google Compute Engine Public IPs if `--enable-private-nodes` is not
              specified.

            Use `--no-enable-master-authorized-networks` to disable. When disabled, public
            internet (0.0.0.0/0) is allowed to connect to Kubernetes master through HTTPS.
        no-enable-master-global-access: |
            Use with private clusters to allow access to the master's private endpoint from any Google Cloud region or on-premises environment regardless of the
            private cluster's region.
        no-enable-mesh-certificates: |
            Enable Mesh Certificates.

            After the cluster is created, configure an issuing certificate authority using
            the Kubernetes API.

            To disable Mesh Certificates in an existing cluster, explicitly set flag
            `--no-enable-mesh-certificates`.
        no-enable-multi-networking: |
            Enables multi-networking on the cluster.
            Multi-networking is disabled by default.
        no-enable-network-egress-metering: |
            Enable network egress metering on this cluster.

            When enabled, a DaemonSet is deployed into the cluster. Each DaemonSet pod
            meters network egress traffic by collecting data from the conntrack table, and
            exports the metered metrics to the specified destination.

            Network egress metering is disabled if this flag is omitted, or when
            `--no-enable-network-egress-metering` is set.
        no-enable-network-policy: Enable network policy enforcement for this cluster. If you are enabling network policy on an existing cluster the network policy addon must first be enabled on the master by using --update-addons=NetworkPolicy=ENABLED flag.
        no-enable-private-endpoint: |
            Enables cluster's control plane to be accessible using private IP
            address only.
        no-enable-private-nodes: |
            Standard cluster:
              Enable private nodes as a default behavior for all newly created node pools,
              if `--enable-private-nodes` is not provided at node pool creation time.

              Modifications to this flag do not affect `--enable-private-nodes` state of the
              existing node pools.

            Autopilot cluster:
              Force new and existing workloads, without explicit
              `cloud.google.com/private-node=true` node selector, to run on nodes with no
              public IP address.

              Modifications to this flag trigger a re-schedule operation on all existng
              workloads to run on different node VMs.
        no-enable-ray-cluster-logging: |
            Enable automatic log processing sidecar for Ray clusters.
        no-enable-ray-cluster-monitoring: |
            Enable automatic metrics collection for Ray clusters.
        no-enable-resource-consumption-metering: |
            Enable resource consumption metering on this cluster.

            When enabled, a table will be created in the specified BigQuery dataset to store
            resource consumption data. The resulting table can be joined with the resource
            usage table or with BigQuery billing export.

            To disable resource consumption metering, set `--no-enable-resource-consumption-
            metering`. If this flag is omitted, then resource consumption metering will
            remain enabled or disabled depending on what is already configured for this
            cluster.
        no-enable-runtime-vulnerability-insight: |
            Enables the GKE Runtime Vulnerability Insight API's features.

            To disable in an existing cluster, explicitly set flag to
            `--no-enable-runtime-vulnerability-insight`.
        no-enable-secret-manager: |
            Enables the Secret Manager CSI driver provider component. See
            https://secrets-store-csi-driver.sigs.k8s.io/introduction
            https://github.com/GoogleCloudPlatform/secrets-store-csi-driver-provider-gcp
        no-enable-secret-manager-rotation: |
            Enables the rotation of secrets in the Secret Manager CSI driver
            provider component.
        no-enable-security-posture: |-
            (DEPRECATED) Enables the GKE Security Posture API's features.

            To disable in an existing cluster, explicitly set flag to
            `--no-enable-security-posture`.
            +
            `--enable-security-posture` is deprecated and will be removed in an upcoming release. Please use `--security-posture=standard` to enable GKE Security Posture. For more details, please read: https://cloud.google.com/kubernetes-engine/docs/how-to/protect-workload-configuration.
        no-enable-service-externalips: |
            Enables use of services with externalIPs field.
        no-enable-shielded-nodes: |
            Enable Shielded Nodes for this cluster. Enabling Shielded Nodes will enable a
            more secure Node credential bootstrapping implementation. Starting with version
            1.18, clusters will have Shielded GKE nodes by default.
        no-enable-slice-controller: |
            Enable Slice Controller for the cluster.
            Use `--no-enable-slice-controller` to disable.
        no-enable-stackdriver-kubernetes: |-
            (DEPRECATED) Enable Cloud Operations for GKE.
            +
            The `--enable-stackdriver-kubernetes` flag is deprecated and will be removed in an upcoming release. Please use `--logging` and `--monitoring` instead. For more information, please read: https://cloud.google.com/kubernetes-engine/docs/concepts/about-logs and https://cloud.google.com/kubernetes-engine/docs/how-to/configure-metrics.
        no-enable-vertical-pod-autoscaling: Enable vertical pod autoscaling for a cluster.
        no-generate-password: Ask the server to generate a secure password and use that as the basic auth password, keeping the existing username.
        no-set-password: Set the basic auth password to the specified value, keeping the existing username.
        no-start-credential-rotation: |-
            Start the rotation of IP and credentials for this cluster. For example:

              $ {command} example-cluster --start-credential-rotation

            This causes the cluster to serve on two IPs, and will initiate a node upgrade to point to the new IP. See documentation for more details: https://cloud.google.com/kubernetes-engine/docs/how-to/credential-rotation.
        no-start-ip-rotation: |-
            Start the rotation of this cluster to a new IP. For example:

              $ {command} example-cluster --start-ip-rotation

            This causes the cluster to serve on two IPs, and will initiate a node upgrade to point to the new IP. See documentation for more details: https://cloud.google.com/kubernetes-engine/docs/how-to/ip-rotation.
        no-unset-membership-type: |
            Set the membership type for the cluster's fleet membership to empty.
            Example:
            $ {command} --unset-membership-type
        node-locations: |-
            The set of zones in which the specified node footprint should be replicated.
            All zones must be in the same region as the cluster's master(s), specified by
            the `-location`, `--zone`, or `--region` flag. Additionally, for zonal clusters,
            `--node-locations` must contain the cluster's primary zone. If not specified,
            all nodes will be in the cluster's primary zone (for zonal clusters) or spread
            across three randomly chosen zones within the cluster's region (for regional
            clusters).
            +
            Note that `NUM_NODES` nodes will be created in each zone, such that if you
            specify `--num-nodes=4` and choose two locations, 8 nodes will be created.
            +
            Multiple locations can be specified, separated by commas. For example:
            +
              $ {command} example-cluster --location us-central1-a --node-locations us-central1-a,us-central1-b
        node-pool: Node pool to be updated.
        notification-config: |-
            The notification configuration of the cluster. GKE supports publishing
            cluster upgrade notifications to any Pub/Sub topic you created in the same
            project. Create a subscription for the topic specified to receive notification
            messages. See https://cloud.google.com/pubsub/docs/admin on how to manage
            Pub/Sub topics and subscriptions. You can also use the filter option to
            specify which event types you'd like to receive from the following options:
            SecurityBulletinEvent, UpgradeEvent, UpgradeInfoEvent, UpgradeAvailableEvent.
            +
            Examples:
            +
              $ {command} example-cluster --notification-config=pubsub=ENABLED,pubsub-topic=projects/{project}/topics/{topic-name}
              $ {command} example-cluster --notification-config=pubsub=ENABLED,pubsub-topic=projects/{project}/topics/{topic-name},filter="SecurityBulletinEvent|UpgradeEvent"
            +
            The project of the Pub/Sub topic must be the same one as the cluster. It can
            be either the project ID or the project number.
        password: The password to use for cluster auth. Defaults to a server-specified randomly-generated string.
        patch-update: |-
            The patch update to use for the cluster.
            +
            Setting to 'accelerated' automatically upgrades the cluster to the latest patch available within the cluster's current minor version and release channel.
            Setting to 'default' automatically upgrades the cluster to the default patch upgrade targetversion available within the cluster's current minor version and release channel.
            +
            _PATCH_UPDATE_ must be one of: *accelerated*, *default*.
        private-ipv6-google-access-type: |-
            Sets the type of private access to Google services over IPv6.
            +
            PRIVATE_IPV6_GOOGLE_ACCESS_TYPE must be one of:
            +
              bidirectional
                Allows Google services to initiate connections to GKE pods in this
                cluster. This is not intended for common use, and requires previous
                integration with Google services.
            +
              disabled
                Default value. Disables private access to Google services over IPv6.
            +
              outbound-only
                Allows GKE pods to make fast, secure requests to Google services
                over IPv6. This is the most common use of private IPv6 access.
            +
              $ gcloud alpha container clusters create       --private-ipv6-google-access-type=disabled
              $ gcloud alpha container clusters create       --private-ipv6-google-access-type=outbound-only
              $ gcloud alpha container clusters create       --private-ipv6-google-access-type=bidirectional
            +
            _PRIVATE_IPV6_GOOGLE_ACCESS_TYPE_ must be one of: *bidirectional*, *disabled*, *outbound-only*.
        region: Compute region (e.g. us-central1) for a regional cluster. Overrides the default compute/region property value for this command invocation.
        release-channel: |-
            Subscribe or unsubscribe this cluster to a release channel.
            +
            When a cluster is subscribed to a release channel, Google maintains both the
            master version and the node version. Node auto-upgrade is enabled by default
            for release channel clusters and can be controlled via [upgrade-scope
            exclusions](https://cloud.google.com/kubernetes-engine/docs/concepts/maintenance-windows-and-exclusions#scope_of_maintenance_to_exclude).
            +
            _CHANNEL_ must be one of:
            +
            *None*::: Use 'None' to opt-out of any release channel.
            +
            *extended*::: Clusters subscribed to 'extended' can remain on a minor version for 24 months
            from when the minor version is made available in the Regular channel.
            +
            *rapid*::: 'rapid' channel is offered on an early access basis for customers
            who want to test new releases.
            +
            WARNING: Versions available in the 'rapid' channel may be subject
            to unresolved issues with no known workaround and are not subject
            to any SLAs.
            +
            *regular*::: Clusters subscribed to 'regular' receive versions that are
            considered GA quality. 'regular' is intended for production users
            who want to take advantage of new features.
            +
            *stable*::: Clusters subscribed to 'stable' receive versions that are known to
            be stable and reliable in production.
            +
            :::
            +
        remove-additional-ip-ranges: |-
            Additional subnetworks to be removed from the cluster.
            +
            Examples:
            +
            Remove pod range named "my-range" under additional subnetwork named "my-subnet" from the cluster.
            +
              $ {command} example-cluster --remove-additional-ip-ranges=subnetwork=my-subnet,pod-ipv4-range=my-range
            +
            Remove additional subnetwork named "my-subnet", including all the pod ipv4 ranges under the subnetwork.
            +
              $ {command} example-cluster --remove-additional-ip-ranges=subnetwork=my-subnet
        remove-additional-pod-ipv4-ranges: |-
            Previously added additional pod ranges(by name) for pods that are to be removed from the cluster.
            +
            Examples:
            +
              $ {command} example-cluster --remove-additional-pod-ipv4-ranges=range1,range2
        remove-autopilot-workload-policies: |-
            Remove Autopilot workload policies from the cluster.
            +
            Examples:
            +
              $ {command} example-cluster --remove-autopilot-workload-policies=allow-net-admin
            +
            The only supported workload policy is 'allow-net-admin'.
        remove-labels: |-
            Labels to remove from the Google Cloud resources in use by the Kubernetes Engine
            cluster. These are unrelated to Kubernetes labels.
            +
            Examples:
            +
              $ {command} example-cluster --remove-labels=label_a,label_b
        remove-maintenance-exclusion: |-
            Name of a maintenance exclusion to remove. If you hadn't specified a name, one
            was auto-generated. Get it with $ gcloud container clusters describe.
        remove-workload-policies: |-
            Remove Autopilot workload policies from the cluster.
            +
            Examples:
            +
              $ {command} example-cluster --remove-workload-policies=allow-net-admin
            +
            The only supported workload policy is 'allow-net-admin'.
        resource-usage-bigquery-dataset: |-
            The name of the BigQuery dataset to which the cluster's usage of cloud
            resources is exported. A table will be created in the specified dataset to
            store cluster resource usage. The resulting table can be joined with BigQuery
            Billing Export to produce a fine-grained cost breakdown.
            +
            Examples:
            +
              $ {command} example-cluster --resource-usage-bigquery-dataset=example_bigquery_dataset_name
        secret-manager-rotation-interval: |-
            Set the rotation period for secrets in the Secret Manager CSI driver
            provider component. If you don't specify a time interval for the rotation, it will default to a rotation period of two minutes.
        security-group: |-
            The name of the RBAC security group for use with Google security groups
            in Kubernetes RBAC
            (https://kubernetes.io/docs/reference/access-authn-authz/rbac/).
            +
            To include group membership as part of the claims issued by Google
            during authentication, a group must be designated as a security group by
            including it as a direct member of this group.
            +
            If unspecified, no groups will be returned for use with RBAC.
        security-posture: |-
            Sets the mode of the Kubernetes security posture API's off-cluster features.
            +
            To enable advanced mode explicitly set the flag to
            `--security-posture=enterprise`.
            +
            To enable in standard mode explicitly set the flag to
            `--security-posture=standard`
            +
            To disable in an existing cluster, explicitly set the flag to
            `--security-posture=disabled`.
            +
            For more information on enablement, see https://cloud.google.com/kubernetes-engine/docs/concepts/about-security-posture-dashboard#feature-enablement.
            +
            _SECURITY_POSTURE_ must be one of: *disabled*, *standard*, *enterprise*.
        service-account-signing-keys: |
            the resource path of the Cloud KMS asymmetric signing cryptoKeyVersion
            that will be used to sign service account tokens.

            only one key version can be specified.
        service-account-verification-keys: |
            the resource path of the Cloud KMS asymmetric signing cryptoKeyVersion
            that shall be used to verify service account tokens.

            at most 2 key versions can be specified.
        set-password: Set the basic auth password to the specified value, keeping the existing username.
        stack-type: 'IP stack type of the cluster nodes. _STACK_TYPE_ must be one of: *ipv4*, *ipv4-ipv6*.'
        start-credential-rotation: |-
            Start the rotation of IP and credentials for this cluster. For example:
            +
              $ {command} example-cluster --start-credential-rotation
            +
            This causes the cluster to serve on two IPs, and will initiate a node upgrade to point to the new IP. See documentation for more details: https://cloud.google.com/kubernetes-engine/docs/how-to/credential-rotation.
        start-ip-rotation: |-
            Start the rotation of this cluster to a new IP. For example:
            +
              $ {command} example-cluster --start-ip-rotation
            +
            This causes the cluster to serve on two IPs, and will initiate a node upgrade to point to the new IP. See documentation for more details: https://cloud.google.com/kubernetes-engine/docs/how-to/ip-rotation.
        tier: |-
            (DEPRECATED) Set the desired tier for the cluster.
            +
            The `--tier` flag is deprecated. More info: https://cloud.google.com/kubernetes-engine/docs/release-notes#September_02_2025. _TIER_ must be one of: *standard*, *enterprise*.
        timeout: Timeout (seconds) for waiting on the operation to complete.
        total-max-nodes: |-
            Maximum number of all nodes in the node pool.
            +
            Maximum number of all nodes to which the node pool specified by --node-pool
            (or default node pool if unspecified) can scale. Ignored unless
            --enable-autoscaling is also specified.
        total-min-nodes: |-
            Minimum number of all nodes in the node pool.
            +
            Minimum number of all nodes to which the node pool specified by --node-pool
            (or default node pool if unspecified) can scale. Ignored unless
            --enable-autoscaling is also specified.
        undrain-additional-ip-ranges: |
            Set status of additional subnetworks named "my-subnet" to ACTIVE.

            Examples:

              $ {command} example-cluster --undrain-additional-ip-ranges=subnetwork=my-subnet
        unset-membership-type: |-
            Set the membership type for the cluster's fleet membership to empty.
            Example:
            $ {command} --unset-membership-type
        update-addons: |-
            Cluster addons to enable or disable. Options are
            HorizontalPodAutoscaling=ENABLED|DISABLED
            HttpLoadBalancing=ENABLED|DISABLED
            KubernetesDashboard=ENABLED|DISABLED
            NetworkPolicy=ENABLED|DISABLED
            BackupRestore=ENABLED|DISABLED
            CloudRun=ENABLED|DISABLED
            ConfigConnector=ENABLED|DISABLED
            NodeLocalDNS=ENABLED|DISABLED
            GcePersistentDiskCsiDriver=ENABLED|DISABLED
            GcpFilestoreCsiDriver=ENABLED|DISABLED
            GcsFuseCsiDriver=ENABLED|DISABLED
        update-labels: |-
            Labels to apply to the Google Cloud resources in use by the Kubernetes Engine
            cluster. These are unrelated to Kubernetes labels.
            +
            Examples:
            +
              $ {command} example-cluster --update-labels=label_a=value1,label_b=value2
        username: |-
            The user name to use for basic auth for the cluster. Use `--password` to specify
            a password; if not, the server will randomly generate one.
        workload-policies: |-
            Add Autopilot workload policies to the cluster.
            +
            Examples:
            +
              $ {command} example-cluster --workload-policies=allow-net-admin
            +
            The only supported workload policy is 'allow-net-admin'.
        workload-pool: |-
            Enable Workload Identity on the cluster.
            +
            When enabled, Kubernetes service accounts will be able to act as Cloud IAM
            Service Accounts, through the provided workload pool.
            +
            Currently, the only accepted workload pool is the workload pool of
            the Cloud project containing the cluster, `PROJECT_ID.svc.id.goog`.
            +
            For more information on Workload Identity, see
            +
                        https://cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
        workload-vulnerability-scanning: |-
            Sets the mode of the Kubernetes security posture API's workload
            vulnerability scanning.
            +
            To enable Advanced vulnerability insights mode explicitly set the flag to
            `--workload-vulnerability-scanning=enterprise`.
            +
            To enable in standard mode explicitly set the flag to
            `--workload-vulnerability-scanning=standard`.
            +
            To disable in an existing cluster, explicitly set the flag to
            `--workload-vulnerability-scanning=disabled`.
            +
            For more information on enablement, see https://cloud.google.com/kubernetes-engine/docs/concepts/about-security-posture-dashboard#feature-enablement.
            +
            _WORKLOAD_VULNERABILITY_SCANNING_ must be one of: *disabled*, *standard*, *enterprise*.
        zone: Compute zone (e.g. us-central1-a) for a zonal cluster. Overrides the default compute/zone property value for this command invocation.
