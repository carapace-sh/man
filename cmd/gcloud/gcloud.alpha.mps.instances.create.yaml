name: create
description: '*(ALPHA)*  Create a Marketplace Solution Instance.'
hidden: true
flags:
    --boot-image-name=!: Name of the boot image used to create this instance
    --memory-gib=!: The memory size used to create instance in Gib
    --network-attachment-name=!: Name of network attached to the instance created
    --region=: Region of the resource.
    --system-type=!: IBM Power system type of the instance
    --virtual-cpu-cores=!: Processor for the instance
    --virtual-cpu-type=!: Processor type for the instance.
completion:
    flag:
        virtual-cpu-type:
            - CAPPED_SHARED
            - DEDICATED
            - UNCAPPED_SHARED
            - UNSPECIFIED
documentation:
    command: |
        *(ALPHA)*  Create a Marketplace Solution Instance.
    flag:
        boot-image-name: Name of the boot image used to create this instance
        memory-gib: The memory size used to create instance in Gib
        network-attachment-name: Name of network attached to the instance created
        region: |-
            Region of the resource.
            +
            To set the `region` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
        system-type: IBM Power system type of the instance
        virtual-cpu-cores: Processor for the instance
        virtual-cpu-type: "Processor type for the instance. _VIRTUAL_CPU_TYPE_ must be one of:\n+\n*CAPPED_SHARED*::: Capped shared processors\n*DEDICATED*::: Dedicated processors. \n*UNCAPPED_SHARED*::: Uncapped shared processors\n*UNSPECIFIED*::: Unspecified\n:::\n+"
