name: topic
description: '*(BETA)*  gcloud supplementary help.'
documentation:
    command: |-
        *(BETA)*  The gcloud beta topic command group provides supplementary help for topics not
        directly associated with individual commands.

        More information on gcloud beta topic can be found by running:

          $ gcloud topic [TOPIC_NAME]

        For a list of available topics run:

          $ gcloud topic --help
