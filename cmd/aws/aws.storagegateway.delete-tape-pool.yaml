name: delete-tape-pool
description: Delete a custom tape pool.
flags:
    --pool-arn=!: The Amazon Resource Name (ARN) of the custom tape pool to delete.
documentation:
    command: Delete a custom tape pool. A custom tape pool can only be deleted if there are no tapes in the pool and if there are no automatic tape creation policies that reference the custom tape pool.
    flag:
        pool-arn: The Amazon Resource Name (ARN) of the custom tape pool to delete.
