name: validate-pull-through-cache-rule
description: Validates an existing pull through cache rule for an upstream registry that requires authentication.
flags:
    --ecr-repository-prefix=!: The repository name prefix associated with the pull through cache rule.
    --registry-id=: The registry ID associated with the pull through cache rule.
documentation:
    command: Validates an existing pull through cache rule for an upstream registry that requires authentication. This will retrieve the contents of the Amazon Web Services Secrets Manager secret, verify the syntax, and then validate that authentication to the upstream registry is successful.
    flag:
        ecr-repository-prefix: The repository name prefix associated with the pull through cache rule.
        registry-id: The registry ID associated with the pull through cache rule. If you do not specify a registry, the default registry is assumed.
