name: get-finding-statistics
description: Retrieves (queries) aggregated statistical data about findings.
flags:
    --finding-criteria=: The criteria to use to filter the query results.
    --group-by=!: The finding property to use to group the query results.
    --size=: The maximum number of items to include in each page of the response.
    --sort-criteria=: The criteria to use to sort the query results.
completion:
    flag:
        group-by:
            - resourcesAffected.s3Bucket.name
            - type
            - classificationDetails.jobId
            - severity.description
documentation:
    command: Retrieves (queries) aggregated statistical data about findings.
    flag:
        finding-criteria: The criteria to use to filter the query results.
        group-by: |-
            The finding property to use to group the query results. Valid values are:

            - classificationDetails.jobId - The unique identifier for the classification job that produced the finding.
            - resourcesAffected.s3Bucket.name - The name of the S3 bucket that the finding applies to.
            - severity.description - The severity level of the finding, such as High or Medium.
            - type - The type of finding, such as Policy:IAMUser/S3BucketPublic and SensitiveData:S3Object/Personal.
        size: The maximum number of items to include in each page of the response.
        sort-criteria: The criteria to use to sort the query results.
