name: update-group
description: Updates the specified group metadata and attributes in the specified identity store.
flags:
    --group-id=!: The identifier for a group in the identity store.
    --identity-store-id=!: The globally unique identifier for the identity store.
    --operations=!: A list of `AttributeOperation` objects to apply to the requested group.
documentation:
    command: Updates the specified group metadata and attributes in the specified identity store.
    flag:
        group-id: The identifier for a group in the identity store.
        identity-store-id: The globally unique identifier for the identity store.
        operations: A list of `AttributeOperation` objects to apply to the requested group. These operations might add, replace, or remove an attribute. For more information on the attributes that can be added, replaced, or removed, see [Group](https://docs.aws.amazon.com/singlesignon/latest/IdentityStoreAPIReference/API_Group.html).
