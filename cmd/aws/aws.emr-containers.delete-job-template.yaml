name: delete-job-template
description: Deletes a job template.
flags:
    --id=!: The ID of the job template that will be deleted.
documentation:
    command: 'Deletes a job template. Job template stores values of StartJobRun API request in a template and can be used to start a job run. Job template allows two use cases: avoid repeating recurring StartJobRun API request values, enforcing certain values in StartJobRun API request.'
    flag:
        id: The ID of the job template that will be deleted.
