name: delete
description: '*(ALPHA)*  Delete an OS policy assignment.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Location of the OS policy assignment.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(ALPHA)*  Delete an OS policy assignment
        ## EXAMPLES

        To delete an OS policy `my-assignment` in location `us-central1-a`:

          $ gcloud alpha compute os-config os-policy-assignments delete my-assignment --location=us-central1-a
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            Location of the OS policy assignment.
            +

            To set the `location` attribute:
            * provide the argument `os_policy_assignment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/zone`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
