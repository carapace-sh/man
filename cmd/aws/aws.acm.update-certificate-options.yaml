name: update-certificate-options
description: Updates a certificate.
flags:
    --certificate-arn=!: ARN of the requested certificate to update.
    --options=!: Use to update the options for your certificate.
documentation:
    command: Updates a certificate. You can use this function to specify whether to opt in to or out of recording your certificate in a certificate transparency log and exporting. For more information, see [Opting Out of Certificate Transparency Logging](https://docs.aws.amazon.com/acm/latest/userguide/acm-bestpractices.html#best-practices-transparency) and [Certificate Manager Exportable Managed Certificates](https://docs.aws.amazon.com/acm/latest/userguide/acm-exportable-certificates.html).
    flag:
        certificate-arn: |-
            ARN of the requested certificate to update. This must be of the form:

            `arn:aws:acm:us-east-1:account:certificate/12345678-1234-1234-1234-123456789012`
        options: Use to update the options for your certificate. Currently, you can specify whether to add your certificate to a transparency log or export your certificate. Certificate transparency makes it possible to detect SSL/TLS certificates that have been mistakenly or maliciously issued. Certificates that have not been logged typically produce an error message in a browser.
