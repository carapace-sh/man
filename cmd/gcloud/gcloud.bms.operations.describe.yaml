name: describe
description: Show metadata for a Bare Metal Solution operation.
flags:
    --region=: Region of the resource.
documentation:
    command: |
        Display all metadata associated with a Bare Metal Solution operation given a valid
        operation name.
    flag:
        region: |-
            Region of the resource.
            +
            To set the `region` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * global is the only supported location.
