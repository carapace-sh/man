name: create
description: '*(BETA)*  Create a new workforce pool under an organization.'
flags:
    --allowed-services=: Services allowed for web sign-in with the workforce pool.
    --async: Return immediately, without waiting for the operation in progress to
    --description=: A description for the workforce pool.
    --disable-programmatic-signin: Disable programmatic sign-in for workforce pool users.
    --disabled: Whether or not the workforce pool is disabled.
    --display-name=: A display name for the workforce pool.
    --location=: The location for the workforce pool.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-disable-programmatic-signin&: Disable programmatic sign-in for workforce pool users.
    --no-disabled&: Whether or not the workforce pool is disabled.
    --organization=!: The parent organization of the workforce pool to create.
    --session-duration=: How long the Google Cloud access tokens, console sign-in sessions, and gcloud sign-in sessions from this workforce pool are valid.
documentation:
    command: |-
        *(BETA)*  Creates a workforce pool under an organization given a valid organization ID.

        ## EXAMPLES

        The following command creates a workforce pool with ID `my-workforce-pool`
        in the organization ``12345'':

          $ gcloud beta iam workforce-pools create my-workforce-pool --organization=12345

        The following command creates a workforce pool with ID `my-workforce-pool`
        with explicit values for all required and optional parameters:

          $ gcloud beta iam workforce-pools create my-workforce-pool --organization=12345 --location=global
          --display-name="My Workforce Pool" --description="My workforce pool
          description." --session-duration="7200s" --disabled
    flag:
        allowed-services: Services allowed for web sign-in with the workforce pool. The flag accepts multiple values with the key as `domain` and value as the domain of the service allowed for web sign-in. If not set, by default all the services are allowed.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: A description for the workforce pool. Cannot exceed 256 characters in length.
        disable-programmatic-signin: Disable programmatic sign-in for workforce pool users.
        disabled: Whether or not the workforce pool is disabled.
        display-name: A display name for the workforce pool. Cannot exceed 32 characters in length.
        location: |-
            The location for the workforce pool.
            +
            To set the `location` attribute:
            * provide the argument `workforce_pool` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-disable-programmatic-signin: Disable programmatic sign-in for workforce pool users.
        no-disabled: Whether or not the workforce pool is disabled.
        organization: The parent organization of the workforce pool to create.
        session-duration: How long the Google Cloud access tokens, console sign-in sessions, and gcloud sign-in sessions from this workforce pool are valid. Must be greater than 15 minutes (900s) and less than 12 hours (43200s). If not configured, minted credentials will have a default duration of one hour (3600s).
