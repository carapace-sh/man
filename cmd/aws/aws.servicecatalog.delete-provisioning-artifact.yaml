name: delete-provisioning-artifact
description: Deletes the specified provisioning artifact (also known as a version) for the specified product.
flags:
    --accept-language=: The language code.
    --product-id=!: The product identifier.
    --provisioning-artifact-id=!: The identifier of the provisioning artifact.
documentation:
    command: |-
        Deletes the specified provisioning artifact (also known as a version) for the specified product.

        You cannot delete a provisioning artifact associated with a product that was shared with you. You cannot delete the last provisioning artifact for a product, because a product must have at least one provisioning artifact.
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        product-id: The product identifier.
        provisioning-artifact-id: The identifier of the provisioning artifact.
