name: stop
description: '*(ALPHA)*  Stop a pending or running deployment update or creation.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --fingerprint=: The fingerprint to use in requests to modify a deployment.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |-
        *(ALPHA)*  This command will stop a currently running or pending operation on
        a deployment.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        fingerprint: The fingerprint to use in requests to modify a deployment. If not specified, a get deployment request will be made to fetch the latest fingerprint. A fingerprint is a randomly generated value that is part of the update, stop, and cancel-preview request to perform optimistic locking. It is initially generated by Deployment Manager and changes after every request to modify data. The latest fingerprint is printed when deployment data is modified.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
