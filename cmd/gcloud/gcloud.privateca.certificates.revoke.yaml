name: revoke
description: Revoke a certificate.
flags:
    --certificate=!: ID of the certificate or fully qualified identifier for the certificate.
    --issuer-location=: The location of the Issuing CA pool.
    --issuer-pool=!: ID of the Issuing CA pool or fully qualified identifier for the Issuing CA pool.
    --reason=: Revocation reason to include in the CRL.
    --serial-number=: The serial number of the certificate.
completion:
    flag:
        reason:
            - affiliation-changed
            - attribute-authority-compromise
            - certificate-authority-compromise
            - certificate-hold
            - cessation-of-operation
            - key-compromise
            - privilege-withdrawn
            - unspecified
            - superseded
documentation:
    command: |-
        Revokes the given certificate for the given reason.

        ## EXAMPLES

        To revoke the 'frontend-server-tls' certificate due to key compromise:

          $ gcloud privateca certificates revoke \
            --certificate=frontend-server-tls \
            --issuer-pool=my-pool --issuer-location=us-west1 \
            --reason=key_compromise

        To revoke the a certificate with the serial number
        '7dc1d9186372de2e1f4824abb1c4c9e5e43cbb40' due to a newer one being issued:

          $ gcloud privateca certificates revoke \
            --serial-number=7dc1d9186372de2e1f4824abb1c4c9e5e43cbb40 \
            --issuer-pool=my-pool --issuer-location=us-west1 \
            --reason=superseded
    flag:
        certificate: |-
            ID of the certificate or fully qualified identifier for the certificate.
            +
            To set the `certificate` attribute:
            * provide the argument `--certificate` on the command line.
        issuer-location: |-
            The location of the Issuing CA pool.
            +
            To set the `issuer-location` attribute:
            * provide the argument `--issuer-pool` on the command line with a fully specified name;
            * provide the argument `--issuer-location` on the command line;
            * set the property `privateca/location`.
        issuer-pool: |-
            ID of the Issuing CA pool or fully qualified identifier for the Issuing CA pool.
            +
            To set the `pool` attribute:
            * provide the argument `--issuer-pool` on the command line.
        reason: 'Revocation reason to include in the CRL. _REASON_ must be one of: *affiliation-changed*, *attribute-authority-compromise*, *certificate-authority-compromise*, *certificate-hold*, *cessation-of-operation*, *key-compromise*, *privilege-withdrawn*, *unspecified*, *superseded*.'
        serial-number: The serial number of the certificate.
