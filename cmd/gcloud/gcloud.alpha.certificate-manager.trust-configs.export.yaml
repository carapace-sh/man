name: export
description: '*(ALPHA)*  Export TrustConfig.'
flags:
    --destination=: Path to a YAML file where the configuration will be exported.
    --location=: Certificate Manager location.
documentation:
    command: |
        *(ALPHA)*  Export a TrustConfig.
    flag:
        destination: |-
            Path to a YAML file where the configuration will be exported.
            The exported data will not contain any output-only fields.
            Alternatively, you may omit this flag to write to standard output.
            For a schema describing the export/import format, see
            $CLOUDSDKROOT/lib/googlecloudsdk/schemas/...
        location: |-
            Certificate Manager location.
            +
            To set the `location` attribute:
            * provide the argument `trust_config` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * default value of location is [global].
