name: create-custom-action-type
description: Creates a new custom action that can be used in all pipelines associated with the Amazon Web Services account.
flags:
    --category=!: The category of the custom action, such as a build action or a test action.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration-properties=: The configuration properties for the custom action.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --input-artifact-details=!: The details of the input artifact for the action, such as its commit ID.
    --output-artifact-details=!: The details of the output artifact of the action, such as its commit ID.
    --provider=!: The provider of the service used in the custom action, such as CodeDeploy.
    --settings=: URLs that provide users information about this custom action.
    --tags=: The tags for the custom action.
    --version=!: The version identifier of the custom action.
completion:
    flag:
        category:
            - Source
            - Build
            - Deploy
            - Test
            - Invoke
            - Approval
            - Compute
documentation:
    command: Creates a new custom action that can be used in all pipelines associated with the Amazon Web Services account. Only used for custom actions.
    flag:
        category: The category of the custom action, such as a build action or a test action.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration-properties: |-
            The configuration properties for the custom action.

            You can refer to a name in the configuration properties of the custom action within the URL templates by following the format of {Config:name}, as long as the configuration property is both required and not secret. For more information, see [Create a Custom Action for a Pipeline](https://docs.aws.amazon.com/codepipeline/latest/userguide/how-to-create-custom-action.html).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        input-artifact-details: The details of the input artifact for the action, such as its commit ID.
        output-artifact-details: The details of the output artifact of the action, such as its commit ID.
        provider: The provider of the service used in the custom action, such as CodeDeploy.
        settings: URLs that provide users information about this custom action.
        tags: The tags for the custom action.
        version: The version identifier of the custom action.
