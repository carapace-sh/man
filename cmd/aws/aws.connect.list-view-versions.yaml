name: list-view-versions
description: Returns all the available versions for the specified Amazon Connect instance and view identifier.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
    --view-id=!: The identifier of the view.
documentation:
    command: |-
        Returns all the available versions for the specified Amazon Connect instance and view identifier.

        Results will be sorted from highest to lowest.
    flag:
        instance-id: The identifier of the Amazon Connect instance. You can find the instanceId in the ARN of the instance.
        max-results: The maximum number of results to return per page. The default MaxResult size is 100.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        view-id: The identifier of the view. Both `ViewArn` and `ViewId` can be used.
