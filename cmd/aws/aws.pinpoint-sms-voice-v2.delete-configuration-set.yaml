name: delete-configuration-set
description: Deletes an existing configuration set.
flags:
    --configuration-set-name=!: The name of the configuration set or the configuration set ARN that you want to delete.
documentation:
    command: |-
        Deletes an existing configuration set.

        A configuration set is a set of rules that you apply to voice and SMS messages that you send. In a configuration set, you can specify a destination for specific types of events related to voice and SMS messages.
    flag:
        configuration-set-name: The name of the configuration set or the configuration set ARN that you want to delete. The ConfigurationSetName and ConfigurationSetArn can be found using the [DescribeConfigurationSets]() action.
