name: batch-modify-cluster-snapshots
description: Modifies the settings for a set of cluster snapshots.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --force: A boolean value indicating whether to override an exception if the retention period has passed.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --manual-snapshot-retention-period=: The number of days that a manual snapshot is retained.
    --no-force: A boolean value indicating whether to override an exception if the retention period has passed.
    --snapshot-identifier-list=!:
        description: A list of snapshot identifiers you want to modify.
        nargs: -1
documentation:
    command: Modifies the settings for a set of cluster snapshots.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        force: A boolean value indicating whether to override an exception if the retention period has passed.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        manual-snapshot-retention-period: |-
            The number of days that a manual snapshot is retained. If you specify the value -1, the manual snapshot is retained indefinitely.

            The number must be either -1 or an integer between 1 and 3,653.

            If you decrease the manual snapshot retention period from its current value, existing manual snapshots that fall outside of the new retention period will return an error. If you want to suppress the errors and delete the snapshots, use the force option.
        snapshot-identifier-list: A list of snapshot identifiers you want to modify.
