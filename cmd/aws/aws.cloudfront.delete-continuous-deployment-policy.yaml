name: delete-continuous-deployment-policy
description: Deletes a continuous deployment policy.
flags:
    --id=!: The identifier of the continuous deployment policy that you are deleting.
    --if-match=: The current version (`ETag` value) of the continuous deployment policy that you are deleting.
documentation:
    command: |-
        Deletes a continuous deployment policy.

        You cannot delete a continuous deployment policy that's attached to a primary distribution. First update your distribution to remove the continuous deployment policy, then you can delete the policy.
    flag:
        id: The identifier of the continuous deployment policy that you are deleting.
        if-match: The current version (`ETag` value) of the continuous deployment policy that you are deleting.
