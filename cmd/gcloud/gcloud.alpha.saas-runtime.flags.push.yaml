name: push
description: '*(ALPHA)*  Create Flags from a JSON manifest file.'
hidden: true
flags:
    --file=!: Path to the JSON manifest file containing the flag definitions.
    --location=: Location ID
    --unit-kind=!: ID of the unitKind or fully qualified identifier for the unitKind.
documentation:
    command: |
        *(ALPHA)*  Creates Flags based on the contents of a provided JSON manifest file. Flags defined in the file
        will be created. If a Flag already exists with the same type, it will be ignored. Otherwise,
        the command will exit with an error.
    flag:
        file: Path to the JSON manifest file containing the flag definitions. The manifest file must conform to the OpenFeature CLI flag manifest schema. Use a full or relative path to a local file containing the value of file.
        location: |-
            Location ID
            +
            To set the `location` attribute:
            * provide the argument `--unit-kind` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        unit-kind: |-
            ID of the unitKind or fully qualified identifier for the unitKind.
            +
            To set the `unit_kind` attribute:
            * provide the argument `--unit-kind` on the command line.
