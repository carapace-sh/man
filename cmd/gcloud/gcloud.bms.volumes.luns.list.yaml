name: list
description: List Bare Metal Solution LUNs in a project.
flags:
    --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
    --limit=: Maximum number of resources to list.
    --region=: Region of the resource.
    --volume=!: ID of the volume or fully qualified identifier for the volume.
documentation:
    command: |
        List Bare Metal Solution logical unit numbers (LUNs) for a volume.
    flag:
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--filter*, *--limit*.
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--filter*, *--limit*.
        region: |-
            Region of the resource.
            +
            To set the `region` attribute:
            * provide the argument `--volume` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
        volume: |-
            ID of the volume or fully qualified identifier for the volume.
            +
            To set the `volume` attribute:
            * provide the argument `--volume` on the command line.
