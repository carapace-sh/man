name: enable-image-deregistration-protection
description: Enables deregistration protection for an AMI.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --image-id=!: The ID of the AMI.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-with-cooldown: If `true`, enforces deregistration protection for 24 hours after deregistration protection is disabled.
    --with-cooldown: If `true`, enforces deregistration protection for 24 hours after deregistration protection is disabled.
documentation:
    command: |-
        Enables deregistration protection for an AMI. When deregistration protection is enabled, the AMI can't be deregistered.

        To allow the AMI to be deregistered, you must first disable deregistration protection.

        For more information, see [Protect an Amazon EC2 AMI from deregistration](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ami-deregistration-protection.html) in the *Amazon EC2 User Guide*.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        image-id: The ID of the AMI.
        with-cooldown: If `true`, enforces deregistration protection for 24 hours after deregistration protection is disabled.
