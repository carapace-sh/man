name: update-group
description: Updates a group resource.
flags:
    --filter-expression=: The updated filter expression defining criteria by which to group traces.
    --group-arn=: The ARN that was generated upon creation.
    --group-name=: The case-sensitive name of the group.
    --insights-configuration=: The structure containing configurations related to insights.
documentation:
    command: Updates a group resource.
    flag:
        filter-expression: The updated filter expression defining criteria by which to group traces.
        group-arn: The ARN that was generated upon creation.
        group-name: The case-sensitive name of the group.
        insights-configuration: |-
            The structure containing configurations related to insights.

            - The InsightsEnabled boolean can be set to true to enable insights for the group or false to disable insights for the group.
            - The NotificationsEnabled boolean can be set to true to enable insights notifications for the group. Notifications can only be enabled on a group with InsightsEnabled set to true.
