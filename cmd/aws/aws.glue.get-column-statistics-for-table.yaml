name: get-column-statistics-for-table
description: Retrieves table statistics of columns.
flags:
    --catalog-id=: The ID of the Data Catalog where the partitions in question reside.
    --column-names=!: A list of the column names.
    --database-name=!: The name of the catalog database where the partitions reside.
    --table-name=!: The name of the partitions' table.
documentation:
    command: |-
        Retrieves table statistics of columns.

        The Identity and Access Management (IAM) permission required for this operation is `GetTable`.
    flag:
        catalog-id: The ID of the Data Catalog where the partitions in question reside. If none is supplied, the Amazon Web Services account ID is used by default.
        column-names: A list of the column names.
        database-name: The name of the catalog database where the partitions reside.
        table-name: The name of the partitions' table.
