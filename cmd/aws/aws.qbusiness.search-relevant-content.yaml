name: search-relevant-content
description: Searches for relevant content in a Amazon Q Business application based on a query.
flags:
    --application-id=!: The unique identifier of the Amazon Q Business application to search.
    --attribute-filter=: ""
    --content-source=!: The source of content to search in.
    --max-results=: The maximum number of results to return.
    --next-token=: The token for the next set of results.
    --query-text=!: The text to search for.
documentation:
    command: Searches for relevant content in a Amazon Q Business application based on a query. This operation takes a search query text, the Amazon Q Business application identifier, and optional filters (such as content source and maximum results) as input. It returns a list of relevant content items, where each item includes the content text, the unique document identifier, the document title, the document URI, any relevant document attributes, and score attributes indicating the confidence level of the relevance.
    flag:
        application-id: The unique identifier of the Amazon Q Business application to search.
        attribute-filter: ""
        content-source: The source of content to search in.
        max-results: The maximum number of results to return.
        next-token: The token for the next set of results. (You received this token from a previous call.)
        query-text: The text to search for.
