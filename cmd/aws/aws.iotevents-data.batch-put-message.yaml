name: batch-put-message
description: Sends a set of messages to the IoT Events system.
flags:
    --messages=!: The list of messages to send.
documentation:
    command: Sends a set of messages to the IoT Events system. Each message payload is transformed into the input you specify (`"inputName"`) and ingested into any detectors that monitor that input. If multiple messages are sent, the order in which the messages are processed isn't guaranteed. To guarantee ordering, you must send messages one at a time and wait for a successful response.
    flag:
        messages: 'The list of messages to send. Each message has the following format: `''{ "messageId": "string", "inputName": "string", "payload": "string"}''`'
