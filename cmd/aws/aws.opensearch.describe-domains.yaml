    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-names=!:
        description: Array of OpenSearch Service domain names that you want information about.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
documentation:
    command: Returns domain configuration information about the specified Amazon OpenSearch Service domains.
    flag:
