name: create
description: '*(ALPHA)*  Create a BigLake Iceberg REST catalog.'
flags:
    --catalog-type=!: Catalog type to create the catalog with.
    --credential-mode=: Credential mode to create the catalog with.
completion:
    flag:
        catalog-type:
            - gcs-bucket
        credential-mode:
            - end-user
            - vended-credentials
documentation:
    command: '*(ALPHA)*  Create a BigLake Iceberg REST catalog.'
    flag:
        catalog-type: |-
            Catalog type to create the catalog with. _CATALOG_TYPE_ must be (only one value is supported):
            +
            *gcs-bucket*::: A catalog backed by a GCS bucket.
            :::
            +
        credential-mode: |-
            Credential mode to create the catalog with. _CREDENTIAL_MODE_ must be one of:
            +
            *end-user*::: Use end user credentials to access the catalog.
            *vended-credentials*::: Use vended credentials to access the catalog.
            :::
            +
