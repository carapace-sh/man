name: list-aggregated-utterances
description: Provides a list of utterances that users have sent to the bot.
flags:
    --aggregation-duration=!: The time window for aggregating the utterance information.
    --bot-alias-id=: The identifier of the bot alias associated with this request.
    --bot-id=!: The unique identifier of the bot associated with this request.
    --bot-version=: The identifier of the bot version associated with this request.
    --filters=: Provides the specification of a filter used to limit the utterances in the response to only those that match the filter specification.
    --locale-id=!: The identifier of the language and locale where the utterances were collected.
    --max-results=: The maximum number of utterances to return in each page of results.
    --next-token=: If the response from the `ListAggregatedUtterances` operation contains more results that specified in the `maxResults` parameter, a token is returned in the response.
    --sort-by=: Specifies sorting parameters for the list of utterances.
documentation:
    command: |-
        Provides a list of utterances that users have sent to the bot.

        Utterances are aggregated by the text of the utterance. For example, all instances where customers used the phrase "I want to order pizza" are aggregated into the same line in the response.

        You can see both detected utterances and missed utterances. A detected utterance is where the bot properly recognized the utterance and activated the associated intent. A missed utterance was not recognized by the bot and didn't activate an intent.

        Utterances can be aggregated for a bot alias or for a bot version, but not both at the same time.

        Utterances statistics are not generated under the following conditions:

        - The `childDirected` field was set to true when the bot was created.
        - You are using slot obfuscation with one or more slots.
        - You opted out of participating in improving Amazon Lex.
    flag:
        aggregation-duration: The time window for aggregating the utterance information. You can specify a time between one hour and two weeks.
        bot-alias-id: The identifier of the bot alias associated with this request. If you specify the bot alias, you can't specify the bot version.
        bot-id: The unique identifier of the bot associated with this request.
        bot-version: The identifier of the bot version associated with this request. If you specify the bot version, you can't specify the bot alias.
        filters: Provides the specification of a filter used to limit the utterances in the response to only those that match the filter specification. You can only specify one filter and one string to filter on.
        locale-id: The identifier of the language and locale where the utterances were collected. For more information, see [Supported languages](https://docs.aws.amazon.com/lexv2/latest/dg/how-languages.html).
        max-results: The maximum number of utterances to return in each page of results. If there are fewer results than the maximum page size, only the actual number of results are returned. If you don't specify the `maxResults` parameter, 1,000 results are returned.
        next-token: If the response from the `ListAggregatedUtterances` operation contains more results that specified in the `maxResults` parameter, a token is returned in the response. Use that token in the `nextToken` parameter to return the next page of results.
        sort-by: Specifies sorting parameters for the list of utterances. You can sort by the hit count, the missed count, or the number of distinct sessions the utterance appeared in.
