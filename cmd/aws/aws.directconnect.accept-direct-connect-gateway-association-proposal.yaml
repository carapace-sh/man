name: accept-direct-connect-gateway-association-proposal
description: Accepts a proposal request to attach a virtual private gateway or transit gateway to a Direct Connect gateway.
flags:
    --associated-gateway-owner-account=!: The ID of the Amazon Web Services account that owns the virtual private gateway or transit gateway.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --direct-connect-gateway-id=!: The ID of the Direct Connect gateway.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --override-allowed-prefixes-to-direct-connect-gateway=:
        description: Overrides the Amazon VPC prefixes advertised to the Direct Connect gateway.
        nargs: -1
    --proposal-id=!: The ID of the request proposal.
documentation:
    command: Accepts a proposal request to attach a virtual private gateway or transit gateway to a Direct Connect gateway.
    flag:
        associated-gateway-owner-account: The ID of the Amazon Web Services account that owns the virtual private gateway or transit gateway.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        direct-connect-gateway-id: The ID of the Direct Connect gateway.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        override-allowed-prefixes-to-direct-connect-gateway: |-
            Overrides the Amazon VPC prefixes advertised to the Direct Connect gateway.

            For information about how to set the prefixes, see [Allowed Prefixes](https://docs.aws.amazon.com/directconnect/latest/UserGuide/multi-account-associate-vgw.html#allowed-prefixes) in the *Direct Connect User Guide*.
        proposal-id: The ID of the request proposal.
