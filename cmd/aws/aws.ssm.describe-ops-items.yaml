name: describe-ops-items
description: Query a set of OpsItems.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of items to return for this call.
    --next-token=: A token to start the list.
    --ops-item-filters=: One or more filters to limit the response.
    --page-size=: The size of each page to get in the AWS service call.
    --starting-token=: A token to specify where to start paginating.
documentation:
    command: |-
        Query a set of OpsItems. You must have permission in Identity and Access Management (IAM) to query a list of OpsItems. For more information, see [Set up OpsCenter](https://docs.aws.amazon.com/systems-manager/latest/userguide/OpsCenter-setup.html) in the *Amazon Web Services Systems Manager User Guide*.

        Operations engineers and IT professionals use Amazon Web Services Systems Manager OpsCenter to view, investigate, and remediate operational issues impacting the performance and health of their Amazon Web Services resources. For more information, see [Amazon Web Services Systems Manager OpsCenter](https://docs.aws.amazon.com/systems-manager/latest/userguide/OpsCenter.html) in the *Amazon Web Services Systems Manager User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: A token to start the list. Use this token to get the next set of results.
        ops-item-filters: "One or more filters to limit the response.\n\n- Key: CreatedTime\n  \n  Operations: GreaterThan, LessThan\n- Key: LastModifiedBy\n  \n  Operations: Contains, Equals\n- Key: LastModifiedTime\n  \n  Operations: GreaterThan, LessThan\n- Key: Priority\n  \n  Operations: Equals\n- Key: Source\n  \n  Operations: Contains, Equals\n- Key: Status\n  \n  Operations: Equals\n- Key: Title*\n  \n  Operations: Equals,Contains\n- Key: OperationalData\\**\n  \n  Operations: Equals\n- Key: OperationalDataKey\n  \n  Operations: Equals\n- Key: OperationalDataValue\n  \n  Operations: Equals, Contains\n- Key: OpsItemId\n  \n  Operations: Equals\n- Key: ResourceId\n  \n  Operations: Contains\n- Key: AutomationId\n  \n  Operations: Equals\n- Key: AccountId\n  \n  Operations: Equals\n\n\\*The Equals operator for Title matches the first 100 characters. If you specify more than 100 characters, they system returns an error that the filter value exceeds the length limit.\n\n\\*\\*If you filter the response by using the OperationalData operator, specify a key-value pair by using the following JSON format: {\"key\":\"key\\_name\",\"value\":\"a\\_value\"}"
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
