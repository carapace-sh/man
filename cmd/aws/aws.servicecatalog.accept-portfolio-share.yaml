name: accept-portfolio-share
description: Accepts an offer to share the specified portfolio.
flags:
    --accept-language=: The language code.
    --portfolio-id=!: The portfolio identifier.
    --portfolio-share-type=: The type of shared portfolios to accept.
completion:
    flag:
        portfolio-share-type:
            - IMPORTED
            - AWS_SERVICECATALOG
            - AWS_ORGANIZATIONS
documentation:
    command: Accepts an offer to share the specified portfolio.
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        portfolio-id: The portfolio identifier.
        portfolio-share-type: |-
            The type of shared portfolios to accept. The default is to accept imported portfolios.

            - `AWS_ORGANIZATIONS` - Accept portfolios shared by the management account of your organization.
            - `IMPORTED` - Accept imported portfolios.
            - `AWS_SERVICECATALOG` - Not supported. (Throws ResourceNotFoundException.)

            For example, `aws servicecatalog accept-portfolio-share --portfolio-id "port-2qwzkwxt3y5fk" --portfolio-share-type AWS_ORGANIZATIONS`
