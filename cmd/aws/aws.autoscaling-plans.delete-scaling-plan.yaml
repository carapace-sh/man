name: delete-scaling-plan
description: Deletes the specified scaling plan.
flags:
    --scaling-plan-name=!: The name of the scaling plan.
    --scaling-plan-version=!: The version number of the scaling plan.
documentation:
    command: |-
        Deletes the specified scaling plan.

        Deleting a scaling plan deletes the underlying [ScalingInstruction]() for all of the scalable resources that are covered by the plan.

        If the plan has launched resources or has scaling activities in progress, you must delete those resources separately.
    flag:
        scaling-plan-name: The name of the scaling plan.
        scaling-plan-version: The version number of the scaling plan. Currently, the only valid value is `1`.
