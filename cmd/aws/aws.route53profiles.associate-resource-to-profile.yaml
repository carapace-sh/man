name: associate-resource-to-profile
description: Associates a DNS reource configuration to a Route 53 Profile.
flags:
    --name=!: Name for the resource association.
    --profile-id=!: ID of the Profile.
    --resource-arn=!: Amazon resource number, ARN, of the DNS resource.
    --resource-properties=: If you are adding a DNS Firewall rule group, include also a priority.
documentation:
    command: Associates a DNS reource configuration to a Route 53 Profile.
    flag:
        name: Name for the resource association.
        profile-id: ID of the Profile.
        resource-arn: Amazon resource number, ARN, of the DNS resource.
        resource-properties: |-
            If you are adding a DNS Firewall rule group, include also a priority. The priority indicates the processing order for the rule groups, starting with the priority assinged the lowest value.

            The allowed values for priority are between 100 and 9900.
