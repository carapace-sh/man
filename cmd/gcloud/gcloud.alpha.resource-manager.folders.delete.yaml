name: delete
description: '*(ALPHA)*  Delete a folder.'
documentation:
    command: |-
        *(ALPHA)*  Delete a folder, given a valid folder ID.

        This command can fail for the following reasons:
            * There is no folder with the given ID.
            * The active account does not have permission to delete the given folder.
            * The folder to be deleted is not empty.

        ## EXAMPLES

        The following command deletes a folder with the ID `123456789`:

          $ gcloud alpha resource-manager folders delete 123456789
