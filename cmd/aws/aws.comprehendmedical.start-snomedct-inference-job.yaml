name: start-snomedct-inference-job
description: Starts an asynchronous job to detect medical concepts and link them to the SNOMED-CT ontology.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=: A unique identifier for the request.
    --data-access-role-arn=!: The Amazon Resource Name (ARN) of the AWS Identity and Access Management (IAM) role that grants Amazon Comprehend Medical read access to your input data.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --input-data-config=!: ""
    --job-name=: The user generated name the asynchronous InferSNOMEDCT job.
    --kms-key=: An AWS Key Management Service key used to encrypt your output files.
    --language-code=!: The language of the input documents.
    --output-data-config=!: ""
completion:
    flag:
        language-code:
            - en
documentation:
    command: Starts an asynchronous job to detect medical concepts and link them to the SNOMED-CT ontology. Use the DescribeSNOMEDCTInferenceJob operation to track the status of a job.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: A unique identifier for the request. If you don't set the client request token, Amazon Comprehend Medical generates one.
        data-access-role-arn: The Amazon Resource Name (ARN) of the AWS Identity and Access Management (IAM) role that grants Amazon Comprehend Medical read access to your input data.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        input-data-config: ""
        job-name: The user generated name the asynchronous InferSNOMEDCT job.
        kms-key: An AWS Key Management Service key used to encrypt your output files. If you do not specify a key, the files are written in plain text.
        language-code: The language of the input documents. All documents must be in the same language.
        output-data-config: ""
