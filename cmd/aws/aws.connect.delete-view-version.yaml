name: delete-view-version
description: Deletes the particular version specified in `ViewVersion` identifier.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --view-id=!: The identifier of the view.
    --view-version=!: The version number of the view.
documentation:
    command: Deletes the particular version specified in `ViewVersion` identifier.
    flag:
        instance-id: The identifier of the Amazon Connect instance. You can find the instanceId in the ARN of the instance.
        view-id: The identifier of the view. Both `ViewArn` and `ViewId` can be used.
        view-version: The version number of the view.
