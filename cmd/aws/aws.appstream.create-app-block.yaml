name: create-app-block
description: Creates an app block.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The description of the app block.
    --display-name=: The display name of the app block.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the app block.
    --packaging-type=: The packaging type of the app block.
    --post-setup-script-details=: The post setup script details of the app block.
    --setup-script-details=: The setup script details of the app block.
    --source-s3-location=!: The source S3 location of the app block.
    --tags=: The tags assigned to the app block.
completion:
    flag:
        packaging-type:
            - CUSTOM
            - APPSTREAM2
documentation:
    command: |-
        Creates an app block.

        App blocks are an Amazon AppStream 2.0 resource that stores the details about the virtual hard disk in an S3 bucket. It also stores the setup script with details about how to mount the virtual hard disk. The virtual hard disk includes the application binaries and other files necessary to launch your applications. Multiple applications can be assigned to a single app block.

        This is only supported for Elastic fleets.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The description of the app block.
        display-name: The display name of the app block. This is not displayed to the user.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the app block.
        packaging-type: The packaging type of the app block.
        post-setup-script-details: The post setup script details of the app block. This can only be provided for the `APPSTREAM2` PackagingType.
        setup-script-details: The setup script details of the app block. This must be provided for the `CUSTOM` PackagingType.
        source-s3-location: The source S3 location of the app block.
        tags: The tags assigned to the app block.
