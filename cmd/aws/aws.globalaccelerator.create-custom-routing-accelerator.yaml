name: create-custom-routing-accelerator
description: Create a custom routing accelerator.
flags:
    --enabled=: Indicates whether an accelerator is enabled.
    --idempotency-token=!: A unique, case-sensitive identifier that you provide to ensure the idempotency—that is, the uniqueness—of the request.
    --ip-address-type=: The IP address type that an accelerator supports.
    --ip-addresses=: Optionally, if you've added your own IP address pool to Global Accelerator (BYOIP), you can choose an IPv4 address from your own pool to use for the accelerator's static IPv4 address when you create an accelerator.
    --name=!: The name of a custom routing accelerator.
    --tags=: Create tags for an accelerator.
completion:
    flag:
        ip-address-type:
            - IPV4
            - DUAL_STACK
documentation:
    command: |-
        Create a custom routing accelerator. A custom routing accelerator directs traffic to one of possibly thousands of Amazon EC2 instance destinations running in a single or multiple virtual private clouds (VPC) subnet endpoints.

        Be aware that, by default, all destination EC2 instances in a VPC subnet endpoint cannot receive traffic. To enable all destinations to receive traffic, or to specify individual port mappings that can receive traffic, see the [AllowCustomRoutingTraffic](https://docs.aws.amazon.com/global-accelerator/latest/api/API_AllowCustomRoutingTraffic.html) operation.

        Global Accelerator is a global service that supports endpoints in multiple Amazon Web Services Regions but you must specify the US West (Oregon) Region to create, update, or otherwise work with accelerators. That is, for example, specify `--region us-west-2` on Amazon Web Services CLI commands.
    flag:
        enabled: |-
            Indicates whether an accelerator is enabled. The value is true or false. The default value is true.

            If the value is set to true, an accelerator cannot be deleted. If set to false, the accelerator can be deleted.
        idempotency-token: A unique, case-sensitive identifier that you provide to ensure the idempotency—that is, the uniqueness—of the request.
        ip-address-type: The IP address type that an accelerator supports. For a custom routing accelerator, the value must be IPV4.
        ip-addresses: |-
            Optionally, if you've added your own IP address pool to Global Accelerator (BYOIP), you can choose an IPv4 address from your own pool to use for the accelerator's static IPv4 address when you create an accelerator.

            After you bring an address range to Amazon Web Services, it appears in your account as an address pool. When you create an accelerator, you can assign one IPv4 address from your range to it. Global Accelerator assigns you a second static IPv4 address from an Amazon IP address range. If you bring two IPv4 address ranges to Amazon Web Services, you can assign one IPv4 address from each range to your accelerator. This restriction is because Global Accelerator assigns each address range to a different network zone, for high availability.

            You can specify one or two addresses, separated by a space. Do not include the /32 suffix.

            Note that you can't update IP addresses for an existing accelerator. To change them, you must create a new accelerator with the new addresses.

            For more information, see [Bring your own IP addresses (BYOIP)](https://docs.aws.amazon.com/global-accelerator/latest/dg/using-byoip.html) in the *Global Accelerator Developer Guide*.
        name: The name of a custom routing accelerator. The name can have a maximum of 64 characters, must contain only alphanumeric characters or hyphens (-), and must not begin or end with a hyphen.
        tags: |-
            Create tags for an accelerator.

            For more information, see [Tagging in Global Accelerator](https://docs.aws.amazon.com/global-accelerator/latest/dg/tagging-in-global-accelerator.html) in the *Global Accelerator Developer Guide*.
