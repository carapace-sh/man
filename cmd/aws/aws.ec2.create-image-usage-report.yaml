name: create-image-usage-report
description: Creates a report that shows how your image is used across other Amazon Web Services accounts.
flags:
    --account-ids=: The Amazon Web Services account IDs to include in the report.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure idempotency of the request.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --image-id=!: The ID of the image to report on.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --resource-types=!: The resource types to include in the report.
    --tag-specifications=: The tags to apply to the report on creation.
documentation:
    command: |-
        Creates a report that shows how your image is used across other Amazon Web Services accounts. The report provides visibility into which accounts are using the specified image, and how many resources (EC2 instances or launch templates) are referencing it.

        For more information, see [View your AMI usage](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/your-ec2-ami-usage.html) in the *Amazon EC2 User Guide*.
    flag:
        account-ids: The Amazon Web Services account IDs to include in the report. To include all accounts, omit this parameter.
        client-token: A unique, case-sensitive identifier that you provide to ensure idempotency of the request.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        image-id: The ID of the image to report on.
        resource-types: The resource types to include in the report.
        tag-specifications: |-
            The tags to apply to the report on creation. The `ResourceType` must be set to `image-usage-report`; any other value will cause the report creation to fail.

            To tag a report after it has been created, see [CreateTags](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_CreateTags.html).
