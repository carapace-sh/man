name: delete-workspace-image
description: Deletes the specified image from your account.
flags:
    --image-id=!: The identifier of the image.
documentation:
    command: Deletes the specified image from your account. To delete an image, you must first delete any bundles that are associated with the image and unshare the image if it is shared with other accounts.
    flag:
        image-id: The identifier of the image.
