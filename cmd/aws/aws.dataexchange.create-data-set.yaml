name: create-data-set
description: This operation creates a data set.
flags:
    --asset-type=!: The type of asset that is added to a data set.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=!: A description for the data set.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the data set.
    --tags=: A data set tag is an optional label that you can assign to a data set when you create it.
completion:
    flag:
        asset-type:
            - S3_SNAPSHOT
            - REDSHIFT_DATA_SHARE
            - API_GATEWAY_API
            - S3_DATA_ACCESS
            - LAKE_FORMATION_DATA_PERMISSION
documentation:
    command: This operation creates a data set.
    flag:
        asset-type: The type of asset that is added to a data set.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description for the data set. This value can be up to 16,348 characters long.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the data set.
        tags: A data set tag is an optional label that you can assign to a data set when you create it. Each tag consists of a key and an optional value, both of which you define. When you use tagging, you can also use tag-based access control in IAM policies to control access to these data sets and revisions.
