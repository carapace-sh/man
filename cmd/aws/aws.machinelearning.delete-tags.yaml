name: delete-tags
description: Deletes the specified tags associated with an ML object.
flags:
    --resource-id=!: The ID of the tagged ML object.
    --resource-type=!: The type of the tagged ML object.
    --tag-keys=!: One or more tags to delete.
completion:
    flag:
        resource-type:
            - BatchPrediction
            - DataSource
            - Evaluation
            - MLModel
documentation:
    command: |-
        Deletes the specified tags associated with an ML object. After this operation is complete, you can't recover deleted tags.

        If you specify a tag that doesn't exist, Amazon ML ignores it.
    flag:
        resource-id: The ID of the tagged ML object. For example, `exampleModelId`.
        resource-type: The type of the tagged ML object.
        tag-keys: One or more tags to delete.
