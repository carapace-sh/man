name: describe-regions
description: Provides information about the Regions that are configured for multi-Region replication.
flags:
    --directory-id=!: The identifier of the directory.
    --next-token=: The `DescribeRegionsResult.NextToken` value from a previous call to [DescribeRegions]().
    --region-name=: The name of the Region.
documentation:
    command: Provides information about the Regions that are configured for multi-Region replication.
    flag:
        directory-id: The identifier of the directory.
        next-token: The `DescribeRegionsResult.NextToken` value from a previous call to [DescribeRegions](). Pass null if this is the first call.
        region-name: The name of the Region. For example, `us-east-1`.
