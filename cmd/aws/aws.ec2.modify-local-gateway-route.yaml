name: modify-local-gateway-route
description: Modifies the specified local gateway route.
flags:
    --destination-cidr-block=: The CIDR block used for destination matches.
    --destination-prefix-list-id=: The ID of the prefix list.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --local-gateway-route-table-id=!: The ID of the local gateway route table.
    --local-gateway-virtual-interface-group-id=: The ID of the virtual interface group.
    --network-interface-id=: The ID of the network interface.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: Modifies the specified local gateway route.
    flag:
        destination-cidr-block: The CIDR block used for destination matches. The value that you provide must match the CIDR of an existing route in the table.
        destination-prefix-list-id: The ID of the prefix list. Use a prefix list in place of `DestinationCidrBlock`. You cannot use `DestinationPrefixListId` and `DestinationCidrBlock` in the same request.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        local-gateway-route-table-id: The ID of the local gateway route table.
        local-gateway-virtual-interface-group-id: The ID of the virtual interface group.
        network-interface-id: The ID of the network interface.
