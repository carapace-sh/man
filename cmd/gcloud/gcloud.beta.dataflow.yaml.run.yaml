name: run
description: '*(BETA)*  Runs a job from the specified path.'
flags:
    --jinja-variables=: Jinja2 variables to be used in reifying the yaml.
    --network=: Compute Engine network for launching worker instances to run the pipeline.
    --pipeline-options=: Pipeline options to pass to the job.
    --region=: Region ID of the job's regional endpoint.
    --subnetwork=: Compute Engine subnetwork for launching worker instances to run the pipeline.
    --template-file-gcs-location=: Google Cloud Storage location of the YAML template to run.
    --yaml-pipeline-file=: Path of a file defining the YAML pipeline to run.
    --yaml-pipeline=: Inline definition of the YAML pipeline to run.
documentation:
    command: '*(BETA)*  Runs a job from the specified YAML description or Cloud Storage path.'
    flag:
        jinja-variables: Jinja2 variables to be used in reifying the yaml.
        network: Compute Engine network for launching worker instances to run the pipeline.  If not set, the default network is used.
        pipeline-options: Pipeline options to pass to the job.
        region: Region ID of the job's regional endpoint. Defaults to 'us-central1'.
        subnetwork: Compute Engine subnetwork for launching worker instances to run the pipeline.  If not set, the default subnetwork is used.
        template-file-gcs-location: Google Cloud Storage location of the YAML template to run. (Must be a URL beginning with 'gs://'.)
        yaml-pipeline: Inline definition of the YAML pipeline to run.
        yaml-pipeline-file: Path of a file defining the YAML pipeline to run. (Must be a local file or a URL beginning with 'gs://'.)
