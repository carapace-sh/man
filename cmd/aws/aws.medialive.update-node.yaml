name: update-node
description: Change the settings for a Node.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cluster-id=!: The ID of the cluster
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=: Include this parameter only if you want to change the current name of the Node.
    --node-id=!: The ID of the node.
    --role=: The initial role of the Node in the Cluster.
    --sdi-source-mappings=:
        description: The mappings of a SDI capture card port to a logical SDI data stream
        nargs: -1
completion:
    flag:
        role:
            - BACKUP
            - ACTIVE
documentation:
    command: Change the settings for a Node.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cluster-id: The ID of the cluster
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: Include this parameter only if you want to change the current name of the Node. Specify a name that is unique in the Cluster. You can't change the name. Names are case-sensitive.
        node-id: The ID of the node.
        role: The initial role of the Node in the Cluster. ACTIVE means the Node is available for encoding. BACKUP means the Node is a redundant Node and might get used if an ACTIVE Node fails.
        sdi-source-mappings: The mappings of a SDI capture card port to a logical SDI data stream
