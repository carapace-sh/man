name: get-rule
description: Retrieves information about the specified listener rules.
flags:
    --listener-identifier=!: The ID or ARN of the listener.
    --rule-identifier=!: The ID or ARN of the listener rule.
    --service-identifier=!: The ID or ARN of the service.
documentation:
    command: Retrieves information about the specified listener rules. You can also retrieve information about the default listener rule. For more information, see [Listener rules](https://docs.aws.amazon.com/vpc-lattice/latest/ug/listeners.html#listener-rules) in the *Amazon VPC Lattice User Guide*.
    flag:
        listener-identifier: The ID or ARN of the listener.
        rule-identifier: The ID or ARN of the listener rule.
        service-identifier: The ID or ARN of the service.
