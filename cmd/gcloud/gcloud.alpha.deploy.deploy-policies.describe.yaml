name: describe
description: '*(ALPHA)*  Show details about a deploy policy.'
flags:
    --region=: The Cloud region for the deploy policy.
documentation:
    command: '*(ALPHA)*  Show details about a deploy policy.'
    flag:
        region: |-
            The Cloud region for the deploy policy.  Alternatively, set the property [deploy/region].
            +
            To set the `region` attribute:
            * provide the argument `deploy_policy` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `deploy/region`.
