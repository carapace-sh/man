name: get-credentials
description: '*(ALPHA)*  Fetch credentials for a running Anthos Config Controller.'
flags:
    --location=!: The location (region) of the Anthos Config Controller.
documentation:
    command: |-
        *(ALPHA)*  gcloud alpha anthos config controller get-credentials updates a `kubeconfig` file with appropriate credentials and
        endpoint information to point `kubectl` at a specific
        Anthos Config Controller.
    flag:
        location: The location (region) of the Anthos Config Controller.
