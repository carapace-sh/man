name: list-functions
description: Returns a list of Lambda functions, with the version-specific configuration of each.
flags:
    --function-version=: Set to `ALL` to include entries for all published versions of each function.
    --marker=: Specify the pagination token that's returned by a previous request to retrieve the next page of results.
    --master-region=: For Lambda@Edge functions, the Amazon Web Services Region of the master function.
    --max-items=: The maximum number of functions to return in the response.
completion:
    flag:
        function-version:
            - ALL
documentation:
    command: |-
        Returns a list of Lambda functions, with the version-specific configuration of each. Lambda returns up to 50 functions per call.

        Set `FunctionVersion` to `ALL` to include all published versions of each function in addition to the unpublished version.

        The `ListFunctions` operation returns a subset of the [FunctionConfiguration]() fields. To get the additional fields (State, StateReasonCode, StateReason, LastUpdateStatus, LastUpdateStatusReason, LastUpdateStatusReasonCode, RuntimeVersionConfig) for a function or version, use [GetFunction]().
    flag:
        function-version: Set to `ALL` to include entries for all published versions of each function.
        marker: Specify the pagination token that's returned by a previous request to retrieve the next page of results.
        master-region: For Lambda@Edge functions, the Amazon Web Services Region of the master function. For example, `us-east-1` filters the list of functions to include only Lambda@Edge functions replicated from a master function in US East (N. Virginia). If specified, you must set `FunctionVersion` to `ALL`.
        max-items: The maximum number of functions to return in the response. Note that `ListFunctions` returns a maximum of 50 items in each response, even if you set the number higher.
