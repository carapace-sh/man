name: modify-target-group
description: Modifies the health checks used when evaluating the health state of the targets in the specified target group.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --health-check-enabled: Indicates whether health checks are enabled.
    --health-check-interval-seconds=: The approximate amount of time, in seconds, between health checks of an individual target.
    --health-check-path=: \[HTTP/HTTPS health checks] The destination for health checks on the targets.
    --health-check-port=: The port the load balancer uses when performing health checks on targets.
    --health-check-protocol=: The protocol the load balancer uses when performing health checks on targets.
    --health-check-timeout-seconds=: \[HTTP/HTTPS health checks] The amount of time, in seconds, during which no response means a failed health check.
    --healthy-threshold-count=: The number of consecutive health checks successes required before considering an unhealthy target healthy.
    --matcher=: \[HTTP/HTTPS health checks] The HTTP or gRPC codes to use when checking for a successful response from a target.
    --no-health-check-enabled: Indicates whether health checks are enabled.
    --target-group-arn=!: The Amazon Resource Name (ARN) of the target group.
    --unhealthy-threshold-count=: The number of consecutive health check failures required before considering the target unhealthy.
completion:
    flag:
        health-check-protocol:
            - HTTP
            - HTTPS
            - TCP
            - TLS
            - UDP
            - TCP_UDP
            - GENEVE
            - QUIC
            - TCP_QUIC
documentation:
    command: Modifies the health checks used when evaluating the health state of the targets in the specified target group.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        health-check-enabled: Indicates whether health checks are enabled. If the target type is `lambda`, health checks are disabled by default but can be enabled. If the target type is `instance`, `ip`, or `alb`, health checks are always enabled and can't be disabled.
        health-check-interval-seconds: The approximate amount of time, in seconds, between health checks of an individual target.
        health-check-path: |-
            \[HTTP/HTTPS health checks] The destination for health checks on the targets.

            \[HTTP1 or HTTP2 protocol version] The ping path. The default is /.

            \[GRPC protocol version] The path of a custom health check method with the format /package.service/method. The default is /Amazon Web Services.ALB/healthcheck.
        health-check-port: The port the load balancer uses when performing health checks on targets.
        health-check-protocol: The protocol the load balancer uses when performing health checks on targets. For Application Load Balancers, the default is HTTP. For Network Load Balancers and Gateway Load Balancers, the default is TCP. The TCP protocol is not supported for health checks if the protocol of the target group is HTTP or HTTPS. It is supported for health checks only if the protocol of the target group is TCP, TLS, UDP, or TCP\_UDP. The GENEVE, TLS, UDP, TCP\_UDP, QUIC, and TCP\_QUIC protocols are not supported for health checks.
        health-check-timeout-seconds: \[HTTP/HTTPS health checks] The amount of time, in seconds, during which no response means a failed health check.
        healthy-threshold-count: The number of consecutive health checks successes required before considering an unhealthy target healthy.
        matcher: \[HTTP/HTTPS health checks] The HTTP or gRPC codes to use when checking for a successful response from a target. For target groups with a protocol of TCP, TCP\_UDP, UDP or TLS the range is 200-599. For target groups with a protocol of HTTP or HTTPS, the range is 200-499. For target groups with a protocol of GENEVE, the range is 200-399.
        target-group-arn: The Amazon Resource Name (ARN) of the target group.
        unhealthy-threshold-count: The number of consecutive health check failures required before considering the target unhealthy.
