name: cancel-retrieval
description: Cancels retrieval of a virtual tape from the virtual tape shelf (VTS) to a gateway after the retrieval process is initiated.
flags:
    --gateway-arn=!: ""
    --tape-arn=!: The Amazon Resource Name (ARN) of the virtual tape you want to cancel retrieval for.
documentation:
    command: Cancels retrieval of a virtual tape from the virtual tape shelf (VTS) to a gateway after the retrieval process is initiated. The virtual tape is returned to the VTS. This operation is only supported in the tape gateway type.
    flag:
        gateway-arn: ""
        tape-arn: The Amazon Resource Name (ARN) of the virtual tape you want to cancel retrieval for.
