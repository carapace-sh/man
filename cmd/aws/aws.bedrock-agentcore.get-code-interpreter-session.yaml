name: get-code-interpreter-session
description: Retrieves detailed information about a specific code interpreter session in Amazon Bedrock.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --code-interpreter-identifier=!: The unique identifier of the code interpreter associated with the session.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --session-id=!: The unique identifier of the code interpreter session to retrieve.
documentation:
    command: |-
        Retrieves detailed information about a specific code interpreter session in Amazon Bedrock. This operation returns the session's configuration, current status, and metadata.

        To get a code interpreter session, you must specify both the code interpreter identifier and the session ID. The response includes information about the session's timeout settings and current status.

        The following operations are related to `GetCodeInterpreterSession`:

        - [StartCodeInterpreterSession](https://docs.aws.amazon.com/API_StartCodeInterpreterSession.html)
        - [ListCodeInterpreterSessions](https://docs.aws.amazon.com/API_ListCodeInterpreterSessions.html)
        - [StopCodeInterpreterSession](https://docs.aws.amazon.com/API_StopCodeInterpreterSession.html)
