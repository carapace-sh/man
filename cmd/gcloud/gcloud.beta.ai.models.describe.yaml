name: describe
description: '*(BETA)*  Get detailed model information about the given model id.'
flags:
    --region=: Cloud region for the model.
documentation:
    command: |-
        ## EXAMPLES

        Describe a model `123` of project `example` in region `us-central1`,
        run:

          $ gcloud beta ai models describe 123 --project=example --region=us-central1

        Describe a model `123` of version `2` of project `example` in region
        `us-central1`, run:

          $ gcloud beta ai models describe 123@2 --project=example --region=us-central1
    flag:
        region: |-
            Cloud region for the model.
            +
            To set the `region` attribute:
            * provide the argument `model` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
