name: verify
description: '*(BETA)*  Verify that the Cloud NetApp Volumes KMS Config is reachable.'
flags:
    --location=: The location of the kms_config.
documentation:
    command: |
        *(BETA)*  Verifies that the Cloud NetApp Volumes KMS (Key Management System) Config is reachable.
    flag:
        location: |-
            The location of the kms_config.
            +
            To set the `location` attribute:
            * provide the argument `kms_config` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
