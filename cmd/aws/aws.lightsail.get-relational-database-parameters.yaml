name: get-relational-database-parameters
description: Returns all of the runtime parameters offered by the underlying database software, or engine, for a specific database in Amazon Lightsail.
flags:
    --page-token=: The token to advance to the next page of results from your request.
    --relational-database-name=!: The name of your database for which to get parameters.
documentation:
    command: |-
        Returns all of the runtime parameters offered by the underlying database software, or engine, for a specific database in Amazon Lightsail.

        In addition to the parameter names and values, this operation returns other information about each parameter. This information includes whether changes require a reboot, whether the parameter is modifiable, the allowed values, and the data types.
    flag:
        page-token: |-
            The token to advance to the next page of results from your request.

            To get a page token, perform an initial `GetRelationalDatabaseParameters` request. If your results are paginated, the response will return a next page token that you can specify as the page token in a subsequent request.
        relational-database-name: The name of your database for which to get parameters.
