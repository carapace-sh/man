name: delete-device-pool
description: Deletes a device pool given the pool ARN.
flags:
    --arn=!: Represents the Amazon Resource Name (ARN) of the Device Farm device pool to delete.
documentation:
    command: Deletes a device pool given the pool ARN. Does not allow deletion of curated pools owned by the system.
    flag:
        arn: Represents the Amazon Resource Name (ARN) of the Device Farm device pool to delete.
