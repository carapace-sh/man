name: put-account-alias
description: Creates or updates an individual alias for each Amazon Web Services account ID.
flags:
    --account-alias=!: An alias or short name for an Amazon Web Services account.
documentation:
    command: Creates or updates an individual alias for each Amazon Web Services account ID. The alias appears in the Amazon Web Services Support App page of the Amazon Web Services Support Center. The alias also appears in Slack messages from the Amazon Web Services Support App.
    flag:
        account-alias: An alias or short name for an Amazon Web Services account.
