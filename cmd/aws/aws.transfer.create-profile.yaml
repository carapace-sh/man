name: create-profile
description: Creates the local or partner profile to use for AS2 transfers.
flags:
    --as2-id=!: The `As2Id` is the *AS2-name*, as defined in the [RFC 4130](https://datatracker.ietf.org/doc/html/rfc4130). For inbound transfers, this is the `AS2-From` header for the AS2 messages sent from the partner.
    --certificate-ids=: An array of identifiers for the imported certificates.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --profile-type=!: 'Determines the type of profile to create:'
    --tags=: Key-value pairs that can be used to group and search for AS2 profiles.
completion:
    flag:
        profile-type:
            - LOCAL
            - PARTNER
documentation:
    command: Creates the local or partner profile to use for AS2 transfers.
    flag:
        as2-id: The `As2Id` is the *AS2-name*, as defined in the [RFC 4130](https://datatracker.ietf.org/doc/html/rfc4130). For inbound transfers, this is the `AS2-From` header for the AS2 messages sent from the partner. For outbound connectors, this is the `AS2-To` header for the AS2 messages sent to the partner using the `StartFileTransfer` API operation. This ID cannot include spaces.
        certificate-ids: An array of identifiers for the imported certificates. You use this identifier for working with profiles and partner profiles.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        profile-type: |-
            Determines the type of profile to create:

            - Specify `LOCAL` to create a local profile. A local profile represents the AS2-enabled Transfer Family server organization or party.
            - Specify `PARTNER` to create a partner profile. A partner profile represents a remote organization, external to Transfer Family.
        tags: Key-value pairs that can be used to group and search for AS2 profiles.
