name: set-iam-policy
description: '*(BETA)*  Set the IAM policy for a Cloud Deploy Custom Target Type.'
flags:
    --region=: Location of the custom target type.
documentation:
    command: |
        *(BETA)*  Set the IAM policy associated with a Cloud Deploy Custom Target Type.

        See https://cloud.google.com/iam/docs/managing-policies for details of
        the policy file format and contents.
    flag:
        region: |-
            Location of the custom target type.
            +

            To set the `region` attribute:
            * provide the argument `custom_target_type` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `deploy/region`.
