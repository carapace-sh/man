name: ssh
description: '*(ALPHA)*  SSH into a running workstation.'
flags:
    --cluster=: The cluster for the workstation.
    --command=: A command to run on the workstation.
    --config=: The config for the workstation.
    --local-host-port=: '`LOCAL_HOST:LOCAL_PORT` on which gcloud should bind and listen for connections'
    --port=: The port on the workstation to which traffic should be sent.
    --region=: The region for the workstation.
    --ssh-flag=: Additional flags to be passed to *ssh(1)*.
    --user=: The username with which to SSH.
documentation:
    command: |-
        *(ALPHA)*  SSH into a running workstation.

        Note that arguments for the `NO_PROXY` environment variable must be FQDNs.

        ## EXAMPLES

          To ssh into a running workstation, run:

            $ gcloud alpha workstations ssh WORKSTATION

          To specify the workstation port, run:

            $ gcloud alpha workstations ssh WORKSTATION --port=22

          To ssh into a running workstation with a username, run:

            $ gcloud alpha workstations ssh WORKSTATION --user=my-user

          To run a command on the workstation, such as getting a snapshot of the
          guest's process tree, run:
            $ gcloud alpha workstations ssh WORKSTATION --command="ps -ejH"
    flag:
        cluster: |-
            The cluster for the workstation.
            +
            To set the `cluster` attribute:
            * provide the argument `workstation` on the command line with a fully specified name;
            * provide the argument `--cluster` on the command line;
            * set the property `workstations/cluster`.
        command: |-
            A command to run on the workstation.
            +
            Runs the command on the target workstation and then exits.
        config: |-
            The config for the workstation.
            +
            To set the `config` attribute:
            * provide the argument `workstation` on the command line with a fully specified name;
            * provide the argument `--config` on the command line;
            * set the property `workstations/config`.
        local-host-port: |-
            `LOCAL_HOST:LOCAL_PORT` on which gcloud should bind and listen for connections
            that should be tunneled.
            +
            `LOCAL_PORT` may be omitted, in which case it is treated as 0 and an arbitrary
            unused local port is chosen. The colon also may be omitted in that case.
            +
            If `LOCAL_PORT` is 0, an arbitrary unused local port is chosen.
        port: The port on the workstation to which traffic should be sent.
        region: |-
            The region for the workstation.
            +
            To set the `region` attribute:
            * provide the argument `workstation` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `workstations/region`.
        ssh-flag: |-
            Additional flags to be passed to *ssh(1)*. It is recommended that flags
            be passed using an assignment operator and quotes. Example:
            +
              $ {command} --ssh-flag="-vvv" --ssh-flag="-L 80:localhost:80"
        user: The username with which to SSH.
