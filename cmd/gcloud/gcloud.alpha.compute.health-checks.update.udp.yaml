documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute health-checks update udp* is used to update an existing UDP health check. Only
        arguments passed in will be updated on the health check. Other
        attributes will remain unaffected.
    flag:
        check-interval: |-
            How often to perform a health check for an instance. For example,
            specifying ``10s'' will run the check every 10 seconds.
            See $ gcloud topic datetimes for information on duration formats.
        description: A textual description for the UDP health check. Pass in an empty string to unset.
        global: If set, the UDP health check is global.
        healthy-threshold: |-
            The number of consecutive successful health checks before an
            unhealthy instance is marked as healthy.
        no-global: If set, the UDP health check is global.
        port: The UDP port number that this health check monitors.
        port-name: |-
            The port name that this health check monitors. By default, this is
            empty.
        region: |-
            Region of the UDP health check to update. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        request: |-
            Application data to send in payload of an UDP packet. It is an error if
            this is empty.
        response: |-
            The bytes to match against the beginning of the response data.
            It is an error if this is empty.
        timeout: |-
            If Google Compute Engine doesn't receive a healthy response from the
            instance by the time specified by the value of this flag, the health
            check request is considered a failure. For example, specifying ``10s''
            will cause the check to wait for 10 seconds before considering the
            request a failure.
            See $ gcloud topic datetimes for information on duration formats.
        unhealthy-threshold: |-
            The number of consecutive health check failures before a healthy
            instance is marked as unhealthy.
