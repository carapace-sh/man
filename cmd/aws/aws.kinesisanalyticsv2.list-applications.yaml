name: list-applications
description: Returns a list of Managed Service for Apache Flink applications in your account.
flags:
    --limit=: The maximum number of applications to list.
    --next-token=: If a previous command returned a pagination token, pass it into this value to retrieve the next set of results.
documentation:
    command: |-
        Returns a list of Managed Service for Apache Flink applications in your account. For each application, the response includes the application name, Amazon Resource Name (ARN), and status.

        If you want detailed information about a specific application, use [DescribeApplication]().
    flag:
        limit: The maximum number of applications to list.
        next-token: If a previous command returned a pagination token, pass it into this value to retrieve the next set of results. For more information about pagination, see [Using the Amazon Command Line Interface's Pagination Options](https://docs.aws.amazon.com/cli/latest/userguide/pagination.html).
