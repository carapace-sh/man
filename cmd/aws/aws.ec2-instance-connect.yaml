# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: ec2-instance-connect
description: AWS EC2 Instance Connect
commands:
    - name: open-tunnel
      description: Opens a websocket tunnel to the specified EC2 Instance or private ip.
      flags:
        --instance-connect-endpoint-dns-name=: Specify the EC2 Instance Connect Endpoint DNS Name that should be used to open the tunnel
        --instance-connect-endpoint-id=: Specify the EC2 Instance Connect Endpoint Id that should be used to open the tunnel
        --instance-id=: Specify the id of the EC2 instance that a tunnel should be opened for
        --local-port=: Specify the local port to listen on
        --max-tunnel-duration=: Specify the maximum time, in seconds, to keep a websocket tunnel alive for
        --max-websocket-connections=: Specify the maximum amount of websocket connections allowed when local-port is specified
        --private-ip-address=: Specify the private ip address to open a tunnel for
        --remote-port=: Specify the remote port to connect to on the instance
    - name: send-serial-console-ssh-public-key
      description: Pushes an SSH public key to the specified EC2 instance.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --instance-id=!: The ID of the EC2 instance.
        --serial-port=: The serial port of the EC2 instance.
        --ssh-public-key=!: The public key material.
      documentation:
        command: Pushes an SSH public key to the specified EC2 instance. The key remains for 60 seconds, which gives you 60 seconds to establish a serial console connection to the instance using SSH. For more information, see [EC2 Serial Console](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-serial-console.html) in the *Amazon EC2 User Guide*.
        flag:
            cli-input-json: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            cli-input-yaml: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            generate-cli-skeleton: |-
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            instance-id: The ID of the EC2 instance.
            serial-port: |-
                The serial port of the EC2 instance. Currently only port 0 is supported.

                Default: 0
            ssh-public-key: The public key material. To use the public key, you must have the matching private key. For information about the supported key formats and lengths, see [Requirements for key pairs](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-key-pairs.html#how-to-generate-your-own-key-and-import-it-to-aws) in the *Amazon EC2 User Guide*.
    - name: send-ssh-public-key
      description: Pushes an SSH public key to the specified EC2 instance for use by the specified user.
      flags:
        --availability-zone=: The Availability Zone in which the EC2 instance was launched.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --instance-id=!: The ID of the EC2 instance.
        --instance-os-user=!: The OS user on the EC2 instance for whom the key can be used to authenticate.
        --ssh-public-key=!: The public key material.
      documentation:
        command: Pushes an SSH public key to the specified EC2 instance for use by the specified user. The key remains for 60 seconds. For more information, see [Connect to your Linux instance using EC2 Instance Connect](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Connect-using-EC2-Instance-Connect.html) in the *Amazon EC2 User Guide*.
        flag:
            availability-zone: The Availability Zone in which the EC2 instance was launched.
            cli-input-json: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            cli-input-yaml: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            generate-cli-skeleton: |-
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            instance-id: The ID of the EC2 instance.
            instance-os-user: The OS user on the EC2 instance for whom the key can be used to authenticate.
            ssh-public-key: The public key material. To use the public key, you must have the matching private key.
    - name: ssh
      description: Connect to your EC2 instance using your OpenSSH client.
      flags:
        --connection-type=: Specify how to SSH into the instance
        --eice-options=: Specify the options for your EC2 Instance Connect Endpoint.maxTunnelDuration
        --instance-id=!: Specify the ID of the EC2 instance to connect to
        --instance-ip=: Specify the IP address of the instance to connect to
        --local-forwarding=: Specify the local forwarding specification as defined by your OpenSSH client
        --os-user=: Specify the OS SSH user
        --private-key-file=: Specify the path to the private key file for login
        --ssh-port=: Specify the SSH port
      completion:
        flag:
            connection-type:
                - "direct\tSSH directly to the instance"
                - "eice\tSSH using EC2 Instance Connect Endpoint"
                - "auto\tThe CLI automatically determines the connection type"
documentation:
    command: |-
        This is the *Amazon EC2 Instance Connect API Reference*. It provides descriptions, syntax, and usage examples for each of the actions for Amazon EC2 Instance Connect. Amazon EC2 Instance Connect enables system administrators to publish one-time use SSH public keys to EC2, providing users a simple and secure way to connect to their instances.

        To view the Amazon EC2 Instance Connect content in the *Amazon EC2 User Guide*, see [Connect to your Linux instance using EC2 Instance Connect](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Connect-using-EC2-Instance-Connect.html).

        For Amazon EC2 APIs, see the [Amazon EC2 API Reference](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Welcome.html).
