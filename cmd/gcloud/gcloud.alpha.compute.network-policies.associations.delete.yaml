name: delete
description: '*(ALPHA)*  Delete an association between a network policy and a network.'
flags:
    --name=!: Name of the association to remove.
    --network-policy-region=: Region of the network policy to delete.
    --network-policy=!: Network Policy ID with which to delete association.
documentation:
    command: '*(ALPHA)*  *gcloud alpha compute network-policies associations delete* is used to delete network policy associations.'
    flag:
        name: Name of the association to remove.
        network-policy: Network Policy ID with which to delete association.
        network-policy-region: Region of the network policy to delete. Overrides the default *compute/region* property value for this command invocation.
