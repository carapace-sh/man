name: copy
description: '*(ALPHA)*  *(DEPRECATED)*  Upload, download, and copy Cloud Storage objects.'
hidden: true
flags:
    --no-recursive&: Recursively copy the contents of any directories that match the path expression.
    --num-threads=&: The number of threads to use for the copy.
    --recursive: Recursively copy the contents of any directories that match the path expression.
documentation:
    command: |4
        *(ALPHA)*  *(DEPRECATED)*  This command is deprecated. Use `gcloud alpha storage cp` instead.

        Copy files between your local file system and Cloud Storage or from one
        Cloud Storage location to another.
    flag:
        no-recursive: Recursively copy the contents of any directories that match the path expression.
        num-threads: The number of threads to use for the copy.
        recursive: Recursively copy the contents of any directories that match the path expression.
