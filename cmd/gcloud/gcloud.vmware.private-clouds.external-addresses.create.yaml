name: create
description: Create an external IP address.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: Text describing the external address
    --internal-ip=!: internal ip address to which external address will be linked
    --location=: Location of the private cloud or cluster.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --private-cloud=: VMware Engine private cloud.
documentation:
    command: |
        Create an external IP address that represents an allocated external IP address and its corresponding internal IP address in the private cloud.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        description: Text describing the external address
        internal-ip: internal ip address to which external address will be linked
        location: |-
            Location of the private cloud or cluster.
            +
            To set the `location` attribute:
            * provide the argument `external_address` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/zone`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        private-cloud: |-
            VMware Engine private cloud.
            +
            To set the `private-cloud` attribute:
            * provide the argument `external_address` on the command line with a fully specified name;
            * provide the argument `--private-cloud` on the command line.
