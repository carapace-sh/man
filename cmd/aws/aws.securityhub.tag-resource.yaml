name: tag-resource
description: Adds one or more tags to a resource.
flags:
    --resource-arn=!: The ARN of the resource to apply the tags to.
    --tags=!: The tags to add to the resource.
documentation:
    command: Adds one or more tags to a resource.
    flag:
        resource-arn: The ARN of the resource to apply the tags to.
        tags: The tags to add to the resource. You can add up to 50 tags at a time. The tag keys can be no longer than 128 characters. The tag values can be no longer than 256 characters.
