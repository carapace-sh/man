name: describe-patch-baselines
description: Lists the patch baselines in your Amazon Web Services account.
flags:
    --filters=: Each element in the array is a structure containing a key-value pair.
    --max-results=: The maximum number of patch baselines to return (per page).
    --next-token=: The token for the next set of items to return.
documentation:
    command: Lists the patch baselines in your Amazon Web Services account.
    flag:
        filters: "Each element in the array is a structure containing a key-value pair.\n\nSupported keys for `DescribePatchBaselines` include the following:\n\n- **`NAME_PREFIX`**\n  \n  Sample values: `AWS-` | `My-`\n- **`OWNER`**\n  \n  Sample values: `AWS` | `Self`\n- **`OPERATING_SYSTEM`**\n  \n  Sample values: `AMAZON_LINUX` | `SUSE` | `WINDOWS`"
        max-results: The maximum number of patch baselines to return (per page).
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
