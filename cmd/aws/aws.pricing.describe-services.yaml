name: describe-services
description: Returns the metadata for one service or a list of the metadata for all services.
flags:
    --format-version=: The format version that you want the response to be in.
    --max-results=: The maximum number of results that you want returned in the response.
    --next-token=: The pagination token that indicates the next set of results that you want to retrieve.
    --service-code=: The code for the service whose information you want to retrieve, such as `AmazonEC2`.
documentation:
    command: Returns the metadata for one service or a list of the metadata for all services. Use this without a service code to get the service codes for all services. Use it with a service code, such as `AmazonEC2`, to get information specific to that service, such as the attribute names available for that service. For example, some of the attribute names available for EC2 are `volumeType`, `maxIopsVolume`, `operation`, `locationType`, and `instanceCapacity10xlarge`.
    flag:
        format-version: |-
            The format version that you want the response to be in.

            Valid values are: `aws_v1`
        max-results: The maximum number of results that you want returned in the response.
        next-token: The pagination token that indicates the next set of results that you want to retrieve.
        service-code: The code for the service whose information you want to retrieve, such as `AmazonEC2`. You can use the `ServiceCode` to filter the results in a `GetProducts` call. To retrieve a list of all services, leave this blank.
