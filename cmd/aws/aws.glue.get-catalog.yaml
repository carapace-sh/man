name: get-catalog
description: The name of the Catalog to retrieve.
flags:
    --catalog-id=!: The ID of the parent catalog in which the catalog resides.
documentation:
    command: The name of the Catalog to retrieve. This should be all lowercase.
    flag:
        catalog-id: The ID of the parent catalog in which the catalog resides. If none is provided, the Amazon Web Services Account Number is used by default.
