name: get-service
description: Gets the settings for a specified service.
flags:
    --id=!: The ID or Amazon Resource Name (ARN) of the service that you want to get settings for.
documentation:
    command: Gets the settings for a specified service.
    flag:
        id: The ID or Amazon Resource Name (ARN) of the service that you want to get settings for. For services created by consumers in a shared namespace, specify the service ARN. For more information about shared namespaces, see [Cross-account Cloud Map namespace sharing](https://docs.aws.amazon.com/cloud-map/latest/dg/sharing-namespaces.html) in the *Cloud Map Developer Guide*.
