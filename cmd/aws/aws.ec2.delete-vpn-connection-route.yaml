name: delete-vpn-connection-route
description: Deletes the specified static route associated with a VPN connection between an existing virtual private gateway and a VPN customer gateway.
flags:
    --destination-cidr-block=!: The CIDR block associated with the local subnet of the customer network.
    --vpn-connection-id=!: The ID of the VPN connection.
documentation:
    command: Deletes the specified static route associated with a VPN connection between an existing virtual private gateway and a VPN customer gateway. The static route allows traffic to be routed from the virtual private gateway to the VPN customer gateway.
    flag:
        destination-cidr-block: The CIDR block associated with the local subnet of the customer network.
        vpn-connection-id: The ID of the VPN connection.
