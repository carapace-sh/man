name: create
description: '*(BETA)*  Create a Compute Engine organization firewall policy.'
flags:
    --description=: An optional, textual description for the organization security policy.
    --folder=: Folder in which the organization firewall policy is to be created.
    --organization=: Organization in which the organization firewall policy is to be created.
    --short-name=!: A textual name of the firewall policy.
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute firewall-policies create* is used to create organization firewall policies. An organization
        firewall policy is a set of rules that controls access to various resources.
    flag:
        description: An optional, textual description for the organization security policy.
        folder: Folder in which the organization firewall policy is to be created.
        organization: Organization in which the organization firewall policy is to be created.
        short-name: A textual name of the firewall policy. The name must be 1-63 characters long, and comply with RFC 1035.
