name: delete-auth-policy
description: Deletes the specified auth policy.
flags:
    --resource-identifier=!: The ID or ARN of the resource.
documentation:
    command: Deletes the specified auth policy. If an auth is set to `AWS_IAM` and the auth policy is deleted, all requests are denied. If you are trying to remove the auth policy completely, you must set the auth type to `NONE`. If auth is enabled on the resource, but no auth policy is set, all requests are denied.
    flag:
        resource-identifier: The ID or ARN of the resource.
