name: delete
description: Delete a Compute Engine network peering.
flags:
    --network=!: The name of the network in the current project containing the peering.
documentation:
    command: |-
        *gcloud compute networks peerings delete* deletes a Compute Engine network peering.

        ## EXAMPLES

        To delete a network peering with the name 'peering-name' on the network
        'local-network', run:

          $ gcloud compute networks peerings delete peering-name \
            --network=local-network
    flag:
        network: The name of the network in the current project containing the peering.
