name: update
description: '*(ALPHA)*  Update a Cloud Media Asset asset type.'
hidden: true
flags:
    --location=: Google Cloud location.
    --update-asset-type-config-file=!: File path to a config file in JSON format.
documentation:
    command: '*(ALPHA)*  Update a Media Asset asset type.'
    flag:
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `asset_type` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `media_asset/location`.
        update-asset-type-config-file: File path to a config file in JSON format. It must containe the asset type updated fields and update_mask. Use a full or relative path to a local file containing the value of update_asset_type_config_file.
