name: gke
description: Create Dataproc GKE-based virtual clusters.
documentation:
    command: |-
        All interactions other than creation should be handled by
        "gcloud dataproc clusters" commands.

        ## EXAMPLES

        To create a cluster, run:

          $ gcloud dataproc clusters gke my-cluster --region='us-central1' --gke-cluster='my-gke-cluster'
          --spark-engine-version='latest' --pools='name=dp,roles=default'
