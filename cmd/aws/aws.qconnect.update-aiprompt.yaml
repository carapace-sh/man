name: update-aiprompt
description: Updates an AI Prompt.
flags:
    --ai-prompt-id=!: The identifier of the Amazon Q in Connect AI Prompt.
    --assistant-id=!: The identifier of the Amazon Q in Connect assistant.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --description=: The description of the Amazon Q in Connect AI Prompt.
    --model-id=: The identifier of the model used for this AI Prompt.
    --template-configuration=: The configuration of the prompt template for this AI Prompt.
    --visibility-status=!: The visibility status of the Amazon Q in Connect AI prompt.
completion:
    flag:
        visibility-status:
            - SAVED
            - PUBLISHED
documentation:
    command: Updates an AI Prompt.
    flag:
        ai-prompt-id: The identifier of the Amazon Q in Connect AI Prompt.
        assistant-id: The identifier of the Amazon Q in Connect assistant. Can be either the ID or the ARN. URLs cannot contain the ARN.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If not provided, the Amazon Web Services SDK populates this field. For more information about idempotency, see [Making retries safe with idempotent APIs](http://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/)..
        description: The description of the Amazon Q in Connect AI Prompt.
        model-id: |-
            The identifier of the model used for this AI Prompt.

            For information about which models are supported in each Amazon Web Services Region, see [Supported models for system/custom prompts](https://docs.aws.amazon.com/connect/latest/adminguide/create-ai-prompts.html#cli-create-aiprompt).
        template-configuration: The configuration of the prompt template for this AI Prompt.
        visibility-status: The visibility status of the Amazon Q in Connect AI prompt.
