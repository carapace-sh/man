name: create-trigger
description: Creates a new trigger.
flags:
    --actions=!: The actions initiated by this trigger when it fires.
    --description=: A description of the new trigger.
    --event-batching-condition=: Batch condition that must be met (specified number of events received or batch time window expired) before EventBridge event trigger fires.
    --name=!: The name of the trigger.
    --predicate=: A predicate to specify when the new trigger should fire.
    --schedule=: 'A `cron` expression used to specify the schedule (see [Time-Based Schedules for Jobs and Crawlers](https://docs.aws.amazon.com/glue/latest/dg/monitor-data-warehouse-schedule.html). For example, to run something every day at 12:15 UTC, you would specify: `cron(15 12 * * ?'
    --start-on-creation=: Set to `true` to start `SCHEDULED` and `CONDITIONAL` triggers when created.
    --tags=: The tags to use with this trigger.
    --type=!: The type of the new trigger.
    --workflow-name=: The name of the workflow associated with the trigger.
completion:
    flag:
        type:
            - SCHEDULED
            - CONDITIONAL
            - ON_DEMAND
            - EVENT
documentation:
    command: |-
        Creates a new trigger.

        Job arguments may be logged. Do not pass plaintext secrets as arguments. Retrieve secrets from a Glue Connection, Amazon Web Services Secrets Manager or other secret management mechanism if you intend to keep them within the Job.
    flag:
        actions: The actions initiated by this trigger when it fires.
        description: A description of the new trigger.
        event-batching-condition: Batch condition that must be met (specified number of events received or batch time window expired) before EventBridge event trigger fires.
        name: The name of the trigger.
        predicate: |-
            A predicate to specify when the new trigger should fire.

            This field is required when the trigger type is `CONDITIONAL`.
        schedule: |-
            A `cron` expression used to specify the schedule (see [Time-Based Schedules for Jobs and Crawlers](https://docs.aws.amazon.com/glue/latest/dg/monitor-data-warehouse-schedule.html). For example, to run something every day at 12:15 UTC, you would specify: `cron(15 12 * * ? *)`.

            This field is required when the trigger type is SCHEDULED.
        start-on-creation: Set to `true` to start `SCHEDULED` and `CONDITIONAL` triggers when created. True is not supported for `ON_DEMAND` triggers.
        tags: The tags to use with this trigger. You may use tags to limit access to the trigger. For more information about tags in Glue, see [Amazon Web Services Tags in Glue](https://docs.aws.amazon.com/glue/latest/dg/monitor-tags.html) in the developer guide.
        type: The type of the new trigger.
        workflow-name: The name of the workflow associated with the trigger.
