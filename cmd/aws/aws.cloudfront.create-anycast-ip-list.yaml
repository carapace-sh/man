name: create-anycast-ip-list
description: Creates an Anycast static IP list.
flags:
    --ip-address-type=: The IP address type for the Anycast static IP list.
    --ip-count=!: The number of static IP addresses that are allocated to the Anycast static IP list.
    --name=!: Name of the Anycast static IP list.
    --tags=: ""
completion:
    flag:
        ip-address-type:
            - ipv4
            - ipv6
            - dualstack
documentation:
    command: Creates an Anycast static IP list.
    flag:
        ip-address-type: |-
            The IP address type for the Anycast static IP list. You can specify one of the following options:

            - `ipv4` - Allocate a list of only IPv4 addresses
            - `ipv6` - Allocate a list of only IPv4 addresses
            - `dualstack` - Allocate a list of both IPv4 and IPv6 addresses
        ip-count: 'The number of static IP addresses that are allocated to the Anycast static IP list. Valid values: 21 or 3.'
        name: Name of the Anycast static IP list.
        tags: ""
