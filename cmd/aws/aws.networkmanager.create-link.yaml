name: create-link
description: Creates a new link for a specified site.
flags:
    --bandwidth=!: The upload speed and download speed in Mbps.
    --description=: A description of the link.
    --global-network-id=!: The ID of the global network.
    --provider=: The provider of the link.
    --site-id=!: The ID of the site.
    --tags=: The tags to apply to the resource during creation.
    --type=: The type of the link.
documentation:
    command: Creates a new link for a specified site.
    flag:
        bandwidth: The upload speed and download speed in Mbps.
        description: |-
            A description of the link.

            Constraints: Maximum length of 256 characters.
        global-network-id: The ID of the global network.
        provider: |-
            The provider of the link.

            Constraints: Maximum length of 128 characters. Cannot include the following characters: | \\ ^
        site-id: The ID of the site.
        tags: The tags to apply to the resource during creation.
        type: |-
            The type of the link.

            Constraints: Maximum length of 128 characters. Cannot include the following characters: | \\ ^
