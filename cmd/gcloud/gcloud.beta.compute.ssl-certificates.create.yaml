name: create
description: '*(BETA)*  Create a Compute Engine SSL certificate.'
flags:
    --certificate=!: Path to a local certificate file to create a self-managed
    --description=: An optional, textual description for the SSL certificate.
    --domains=: List of domains to create a managed certificate for.
    --global: If set, the SSL certificate is global.
    --no-global&: If set, the SSL certificate is global.
    --private-key=!: Path to a local private key file.
    --region=: Region of the SSL certificate to create.
documentation:
    command: |
        *(BETA)*  *gcloud beta compute ssl-certificates create* creates SSL certificate resources, which you can use in a
        target HTTPS or target SSL proxy. An SSL certificate resource consists
        of a certificate and private key. The private key is encrypted before it
        is stored.

        You can create either a managed or a self-managed SslCertificate
        resource. A managed SslCertificate is provisioned and renewed for you. A
        self-managed certificate is created by passing the
        certificate obtained from Certificate Authority through `--certificate`
        and `--private-key` flags.
    flag:
        certificate: |-
            Path to a local certificate file to create a self-managed
            certificate. The certificate must be in PEM format. The certificate
            chain must be no greater than 5 certs long. The chain must include at
            least one intermediate cert.
        description: An optional, textual description for the SSL certificate.
        domains: List of domains to create a managed certificate for.
        global: If set, the SSL certificate is global.
        no-global: If set, the SSL certificate is global.
        private-key: |-
            Path to a local private key file. The private key must be in PEM
            format and must use RSA or ECDSA encryption.
        region: |-
            Region of the SSL certificate to create. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
