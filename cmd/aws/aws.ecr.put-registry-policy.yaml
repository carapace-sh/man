name: put-registry-policy
description: Creates or updates the permissions policy for your registry.
flags:
    --policy-text=!: The JSON policy text to apply to your registry.
documentation:
    command: |-
        Creates or updates the permissions policy for your registry.

        A registry policy is used to specify permissions for another Amazon Web Services account and is used when configuring cross-account replication. For more information, see [Registry permissions](https://docs.aws.amazon.com/AmazonECR/latest/userguide/registry-permissions.html) in the *Amazon Elastic Container Registry User Guide*.
    flag:
        policy-text: The JSON policy text to apply to your registry. The policy text follows the same format as IAM policy text. For more information, see [Registry permissions](https://docs.aws.amazon.com/AmazonECR/latest/userguide/registry-permissions.html) in the *Amazon Elastic Container Registry User Guide*.
