name: create-hsm
description: This is documentation for **AWS CloudHSM Classic**.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A user-defined token to ensure idempotence.
    --eni-ip=: The IP address to assign to the HSM's ENI.
    --external-id=: The external ID from `IamRoleArn`, if present.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --iam-role-arn=!: The ARN of an IAM role to enable the AWS CloudHSM service to allocate an ENI on your behalf.
    --ssh-key=!: The SSH public key to install on the HSM.
    --subnet-id=!: The identifier of the subnet in your VPC in which to place the HSM.
    --subscription-type=!: ""
    --syslog-ip=: The IP address for the syslog monitoring server.
completion:
    flag:
        subscription-type:
            - PRODUCTION
documentation:
    command: |-
        This is documentation for **AWS CloudHSM Classic**. For more information, see [AWS CloudHSM Classic FAQs](http://aws.amazon.com/cloudhsm/faqs-classic/), the [AWS CloudHSM Classic User Guide](https://docs.aws.amazon.com/cloudhsm/classic/userguide/), and the [AWS CloudHSM Classic API Reference](https://docs.aws.amazon.com/cloudhsm/classic/APIReference/).

        **For information about the current version of AWS CloudHSM**, see [AWS CloudHSM](http://aws.amazon.com/cloudhsm/), the [AWS CloudHSM User Guide](https://docs.aws.amazon.com/cloudhsm/latest/userguide/), and the [AWS CloudHSM API Reference](https://docs.aws.amazon.com/cloudhsm/latest/APIReference/).

        Creates an uninitialized HSM instance.

        There is an upfront fee charged for each HSM instance that you create with the `CreateHsm` operation. If you accidentally provision an HSM and want to request a refund, delete the instance using the [DeleteHsm]() operation, go to the [AWS Support Center](https://console.aws.amazon.com/support/home), create a new case, and select **Account and Billing Support**.

        It can take up to 20 minutes to create and provision an HSM. You can monitor the status of the HSM with the [DescribeHsm]() operation. The HSM is ready to be initialized when the status changes to `RUNNING`.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A user-defined token to ensure idempotence. Subsequent calls to this operation with the same token will be ignored.
        eni-ip: |-
            The IP address to assign to the HSM's ENI.

            If an IP address is not specified, an IP address will be randomly chosen from the CIDR range of the subnet.
        external-id: The external ID from `IamRoleArn`, if present.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        iam-role-arn: The ARN of an IAM role to enable the AWS CloudHSM service to allocate an ENI on your behalf.
        ssh-key: The SSH public key to install on the HSM.
        subnet-id: The identifier of the subnet in your VPC in which to place the HSM.
        subscription-type: ""
        syslog-ip: The IP address for the syslog monitoring server. The AWS CloudHSM service only supports one syslog monitoring server.
