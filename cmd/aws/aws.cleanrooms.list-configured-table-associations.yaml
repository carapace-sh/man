name: list-configured-table-associations
description: Lists configured table associations for a membership.
flags:
    --max-results=: The maximum number of results that are returned for an API request call.
    --membership-identifier=!: A unique identifier for the membership to list configured table associations for.
    --next-token=: The pagination token that's used to fetch the next set of results.
documentation:
    command: Lists configured table associations for a membership.
    flag:
        max-results: The maximum number of results that are returned for an API request call. The service chooses a default number if you don't set one. The service might return a \`nextToken\` even if the \`maxResults\` value has not been met.
        membership-identifier: A unique identifier for the membership to list configured table associations for. Currently accepts the membership ID.
        next-token: The pagination token that's used to fetch the next set of results.
