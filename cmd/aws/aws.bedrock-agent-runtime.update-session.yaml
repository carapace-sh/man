name: update-session
description: Updates the metadata or encryption settings of a session.
flags:
    --session-identifier=!: The unique identifier of the session to modify.
    --session-metadata=: A map of key-value pairs containing attributes to be persisted across the session.
documentation:
    command: Updates the metadata or encryption settings of a session. For more information about sessions, see [Store and retrieve conversation history and context with Amazon Bedrock sessions](https://docs.aws.amazon.com/bedrock/latest/userguide/sessions.html).
    flag:
        session-identifier: The unique identifier of the session to modify. You can specify either the session's `sessionId` or its Amazon Resource Name (ARN).
        session-metadata: A map of key-value pairs containing attributes to be persisted across the session. For example the user's ID, their language preference, and the type of device they are using.
