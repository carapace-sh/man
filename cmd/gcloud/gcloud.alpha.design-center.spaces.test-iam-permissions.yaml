name: test-iam-permissions
description: '*(ALPHA)*  Test IAM permissions for a Design Center space.'
flags:
    --location=: The Cloud location for the space.
    --permissions=!: The set of permissions to check for the resource.
documentation:
    command: |4
         *(ALPHA)*  Tests the IAM permissions that a caller has on a Design Center space.

        Returns an empty set of permissions if the space does not exist.

        Note: This operation is designed to be used for building
        permission-aware UIs and command-line tools, not for authorization
        checking. This operation may "fail open" without warning.
    flag:
        location: |-
            The Cloud location for the space.
            +
            To set the `location` attribute:
            * provide the argument `space` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        permissions: The set of permissions to check for the resource.
