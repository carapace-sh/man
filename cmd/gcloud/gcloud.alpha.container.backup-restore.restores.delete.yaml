name: delete
description: '*(ALPHA)*  Delete a restore.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --etag=: The etag is used for optimistic concurrency control as a way to help
    --location=: Google Cloud location.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --restore-plan=: Restore Plan name.
documentation:
    command: |
        *(ALPHA)*  Delete a Backup for GKE restore.

        ## EXAMPLES

        To delete a restore 'my-restore' in project 'my-project' in location 'us-central1' under restore plan ``my-restore-plan'', run:

          $ gcloud alpha container backup-restore restores delete my-restore --project=my-project --location=us-central1 --restore-plan=my-restore-plan
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        etag: |-
            The etag is used for optimistic concurrency control as a way to help
            prevent simultaneous updates or deletes of a resource from overwriting each other.
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `restore` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkebackup/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        restore-plan: |-
            Restore Plan name.
            +
            To set the `restore-plan` attribute:
            * provide the argument `restore` on the command line with a fully specified name;
            * provide the argument `--restore-plan` on the command line;
            * set the property `gkebackup/restore_plan`.
