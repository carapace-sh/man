name: list-progress-update-streams
description: Lists progress update streams associated with the user account making this call.
flags:
    --max-results=: Filter to limit the maximum number of results to list per page.
    --next-token=: If a `NextToken` was returned by a previous call, there are more results available.
documentation:
    command: Lists progress update streams associated with the user account making this call.
    flag:
        max-results: Filter to limit the maximum number of results to list per page.
        next-token: If a `NextToken` was returned by a previous call, there are more results available. To retrieve the next page of results, make the call again using the returned token in `NextToken`.
