name: describe
description: Describe a Google Cloud Private Connection.
flags:
    --location=: The resource name of the location.
documentation:
    command: |
        Describe a Private Connection by its resource name. It contains details of the private connection, such as service_network, vmware_engine_network, routing_mode and state.
    flag:
        location: |-
            The resource name of the location.
            +
            To set the `location` attribute:
            * provide the argument `private_connection` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/region`.
