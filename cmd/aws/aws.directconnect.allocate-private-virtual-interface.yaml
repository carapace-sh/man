name: allocate-private-virtual-interface
description: Provisions a private virtual interface to be owned by the specified Amazon Web Services account.
flags:
    --connection-id=!: The ID of the connection on which the private virtual interface is provisioned.
    --new-private-virtual-interface-allocation=!: Information about the private virtual interface.
    --owner-account=!: The ID of the Amazon Web Services account that owns the virtual private interface.
documentation:
    command: |-
        Provisions a private virtual interface to be owned by the specified Amazon Web Services account.

        Virtual interfaces created using this action must be confirmed by the owner using [ConfirmPrivateVirtualInterface](). Until then, the virtual interface is in the `Confirming` state and is not available to handle traffic.
    flag:
        connection-id: The ID of the connection on which the private virtual interface is provisioned.
        new-private-virtual-interface-allocation: Information about the private virtual interface.
        owner-account: The ID of the Amazon Web Services account that owns the virtual private interface.
