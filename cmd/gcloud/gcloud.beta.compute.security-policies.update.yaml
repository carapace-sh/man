name: update
description: '*(BETA)*  Update a Compute Engine security policy.'
flags:
    --description=: An optional, textual description for the security policy.
    --enable-layer7-ddos-defense: Whether to enable Cloud Armor Layer 7 DDoS Defense Adaptive Protection.
    --global: If set, the security policy is global.
    --json-custom-content-types=: A comma-separated list of custom Content-Type header values to apply JSON
    --json-parsing=: The JSON parsing behavior for this rule.
    --layer7-ddos-defense-auto-deploy-confidence-threshold=: Confidence threshold above which Adaptive Protection's auto-deploy takes actions
    --layer7-ddos-defense-auto-deploy-expiration-sec=: Duration over which Adaptive Protection's auto-deployed actions last
    --layer7-ddos-defense-auto-deploy-impacted-baseline-threshold=: Impacted baseline threshold below which Adaptive Protection's auto-deploy takes actions
    --layer7-ddos-defense-auto-deploy-load-threshold=: Load threshold above which Adaptive Protection's auto-deploy takes actions
    --layer7-ddos-defense-rule-visibility=: The visibility type indicates whether the rules are opaque or transparent.
    --log-level=: The level of detail to display for WAF logging.
    --network-ddos-protection=: The DDoS protection level for network load balancing and instances with external IPs.
    --no-enable-layer7-ddos-defense&: Whether to enable Cloud Armor Layer 7 DDoS Defense Adaptive Protection.
    --no-global&: If set, the security policy is global.
    --recaptcha-redirect-site-key=: The reCAPTCHA site key to be used for rules using the ``redirect'' action
    --region=: Region of the security policy to update.
    --request-body-inspection-size=: Maximum request body inspection size.
    --user-ip-request-headers=: A comma-separated list of request header names to use for resolving the
completion:
    flag:
        json-parsing:
            - DISABLED
            - STANDARD
            - STANDARD_WITH_GRAPHQL
        layer7-ddos-defense-rule-visibility:
            - STANDARD
            - PREMIUM
        log-level:
            - NORMAL
            - VERBOSE
        network-ddos-protection:
            - STANDARD
            - ADVANCED
            - ADVANCED_PREVIEW
        request-body-inspection-size:
            - 8KB
            - 16KB
            - 32KB
            - 48KB
            - 64KB
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute security-policies update* is used to update security policies.

        ## EXAMPLES

        To update the description run this:

          $ gcloud beta compute security-policies update SECURITY_POLICY --description='new description'
    flag:
        description: An optional, textual description for the security policy.
        enable-layer7-ddos-defense: Whether to enable Cloud Armor Layer 7 DDoS Defense Adaptive Protection.
        global: If set, the security policy is global.
        json-custom-content-types: |-
            A comma-separated list of custom Content-Type header values to apply JSON
            parsing for preconfigured WAF rules. Only applicable when JSON parsing is
            enabled, like ``--json-parsing=STANDARD''. When configuring a Content-Type
            header value, only the type/subtype needs to be specified, and the
            parameters should be excluded.
        json-parsing: 'The JSON parsing behavior for this rule. Must be one of the following values: [DISABLED, STANDARD, STANDARD_WITH_GRAPHQL]. _JSON_PARSING_ must be one of: *DISABLED*, *STANDARD*, *STANDARD_WITH_GRAPHQL*.'
        layer7-ddos-defense-auto-deploy-confidence-threshold: Confidence threshold above which Adaptive Protection's auto-deploy takes actions
        layer7-ddos-defense-auto-deploy-expiration-sec: Duration over which Adaptive Protection's auto-deployed actions last
        layer7-ddos-defense-auto-deploy-impacted-baseline-threshold: Impacted baseline threshold below which Adaptive Protection's auto-deploy takes actions
        layer7-ddos-defense-auto-deploy-load-threshold: Load threshold above which Adaptive Protection's auto-deploy takes actions
        layer7-ddos-defense-rule-visibility: 'The visibility type indicates whether the rules are opaque or transparent. _VISIBILITY_TYPE_ must be one of: *STANDARD*, *PREMIUM*.'
        log-level: 'The level of detail to display for WAF logging. _LOG_LEVEL_ must be one of: *NORMAL*, *VERBOSE*.'
        network-ddos-protection: 'The DDoS protection level for network load balancing and instances with external IPs. _NETWORK_DDOS_PROTECTION_ must be one of: *STANDARD*, *ADVANCED*, *ADVANCED_PREVIEW*.'
        no-enable-layer7-ddos-defense: Whether to enable Cloud Armor Layer 7 DDoS Defense Adaptive Protection.
        no-global: If set, the security policy is global.
        recaptcha-redirect-site-key: |-
            The reCAPTCHA site key to be used for rules using the ``redirect'' action
            and the ``google-recaptcha'' redirect type under the security policy.
        region: Region of the security policy to update. Overrides the default *compute/region* property value for this command invocation.
        request-body-inspection-size: 'Maximum request body inspection size. _REQUEST_BODY_INSPECTION_SIZE_ must be one of: *8KB*, *16KB*, *32KB*, *48KB*, *64KB*.'
        user-ip-request-headers: |-
            A comma-separated list of request header names to use for resolving the
            caller's user IP address.
