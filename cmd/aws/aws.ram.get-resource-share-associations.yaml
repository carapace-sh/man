name: get-resource-share-associations
description: Retrieves the lists of resources and principals that associated for resource shares that you own.
flags:
    --association-status=: Specifies that you want to retrieve only associations that have this status.
    --association-type=!: Specifies whether you want to retrieve the associations that involve a specified resource or principal.
    --max-results=: Specifies the total number of results that you want included on each page of the response.
    --next-token=: Specifies that you want to receive the next page of results.
    --principal=: Specifies the ID of the principal whose resource shares you want to retrieve.
    --resource-arn=: Specifies the [Amazon Resource Name (ARN)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) of a resource whose resource shares you want to retrieve.
    --resource-share-arns=: Specifies a list of [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) of the resource share whose associations you want to retrieve.
completion:
    flag:
        association-status:
            - ASSOCIATING
            - ASSOCIATED
            - FAILED
            - DISASSOCIATING
            - DISASSOCIATED
        association-type:
            - PRINCIPAL
            - RESOURCE
documentation:
    command: Retrieves the lists of resources and principals that associated for resource shares that you own.
    flag:
        association-status: Specifies that you want to retrieve only associations that have this status.
        association-type: |-
            Specifies whether you want to retrieve the associations that involve a specified resource or principal.

            - `PRINCIPAL` – list the principals whose associations you want to see.
            - `RESOURCE` – list the resources whose associations you want to see.
        max-results: Specifies the total number of results that you want included on each page of the response. If you do not include this parameter, it defaults to a value that is specific to the operation. If additional items exist beyond the number you specify, the `NextToken` response element is returned with a value (not null). Include the specified value as the `NextToken` request parameter in the next call to the operation to get the next part of the results. Note that the service might return fewer results than the maximum even when there are more results available. You should check `NextToken` after every operation to ensure that you receive all of the results.
        next-token: Specifies that you want to receive the next page of results. Valid only if you received a `NextToken` response in the previous request. If you did, it indicates that more output is available. Set this parameter to the value provided by the previous call's `NextToken` response to request the next page of results.
        principal: |-
            Specifies the ID of the principal whose resource shares you want to retrieve. This can be an Amazon Web Services account ID, an organization ID, an organizational unit ID, or the [Amazon Resource Name (ARN)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) of an individual IAM role or user.

            You cannot specify this parameter if the association type is `RESOURCE`.
        resource-arn: |-
            Specifies the [Amazon Resource Name (ARN)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) of a resource whose resource shares you want to retrieve.

            You cannot specify this parameter if the association type is `PRINCIPAL`.
        resource-share-arns: Specifies a list of [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) of the resource share whose associations you want to retrieve.
