name: create-rule-group
description: Creates the specified stateless or stateful rule group, which includes the rules for network traffic inspection, a capacity setting, and tags.
flags:
    --analyze-rule-group: Indicates whether you want Network Firewall to analyze the stateless rules in the rule group for rule behavior such as asymmetric routing.
    --capacity=!: The maximum operating resources that this rule group can use.
    --description=: A description of the rule group.
    --dry-run: Indicates whether you want Network Firewall to just check the validity of the request, rather than run the request.
    --encryption-configuration=: A complex type that contains settings for encryption of your rule group resources.
    --no-analyze-rule-group: Indicates whether you want Network Firewall to analyze the stateless rules in the rule group for rule behavior such as asymmetric routing.
    --no-dry-run: Indicates whether you want Network Firewall to just check the validity of the request, rather than run the request.
    --rule-group-name=!: The descriptive name of the rule group.
    --rule-group=: An object that defines the rule group rules.
    --rules=: A string containing stateful rule group rules specifications in Suricata flat format, with one rule per line.
    --source-metadata=: A complex type that contains metadata about the rule group that your own rule group is copied from.
    --summary-configuration=: An object that contains a `RuleOptions` array of strings.
    --tags=: The key:value pairs to associate with the resource.
    --type=!: Indicates whether the rule group is stateless or stateful.
completion:
    flag:
        type:
            - STATELESS
            - STATEFUL
documentation:
    command: |-
        Creates the specified stateless or stateful rule group, which includes the rules for network traffic inspection, a capacity setting, and tags.

        You provide your rule group specification in your request using either `RuleGroup` or `Rules`.
    flag:
        analyze-rule-group: Indicates whether you want Network Firewall to analyze the stateless rules in the rule group for rule behavior such as asymmetric routing. If set to `TRUE`, Network Firewall runs the analysis and then creates the rule group for you. To run the stateless rule group analyzer without creating the rule group, set `DryRun` to `TRUE`.
        capacity: |-
            The maximum operating resources that this rule group can use. Rule group capacity is fixed at creation. When you update a rule group, you are limited to this capacity. When you reference a rule group from a firewall policy, Network Firewall reserves this capacity for the rule group.

            You can retrieve the capacity that would be required for a rule group before you create the rule group by calling [CreateRuleGroup]() with `DryRun` set to `TRUE`.

            You can't change or exceed this capacity when you update the rule group, so leave room for your rule group to grow.

            **Capacity for a stateless rule group**

            For a stateless rule group, the capacity required is the sum of the capacity requirements of the individual rules that you expect to have in the rule group.

            To calculate the capacity requirement of a single rule, multiply the capacity requirement values of each of the rule's match settings:

            - A match setting with no criteria specified has a value of 1.
            - A match setting with `Any` specified has a value of 1.
            - All other match settings have a value equal to the number of elements provided in the setting. For example, a protocol setting \["UDP"] and a source setting \["10.0.0.0/24"] each have a value of 1. A protocol setting \["UDP","TCP"] has a value of 2. A source setting \["10.0.0.0/24","10.0.0.1/24","10.0.0.2/24"] has a value of 3.

            A rule with no criteria specified in any of its match settings has a capacity requirement of 1. A rule with protocol setting \["UDP","TCP"], source setting \["10.0.0.0/24","10.0.0.1/24","10.0.0.2/24"], and a single specification or no specification for each of the other match settings has a capacity requirement of 6.

            **Capacity for a stateful rule group**

            For a stateful rule group, the minimum capacity required is the number of individual rules that you expect to have in the rule group.
        description: A description of the rule group.
        dry-run: |-
            Indicates whether you want Network Firewall to just check the validity of the request, rather than run the request.

            If set to `TRUE`, Network Firewall checks whether the request can run successfully, but doesn't actually make the requested changes. The call returns the value that the request would return if you ran it with dry run set to `FALSE`, but doesn't make additions or changes to your resources. This option allows you to make sure that you have the required permissions to run the request and that your request parameters are valid.

            If set to `FALSE`, Network Firewall makes the requested changes to your resources.
        encryption-configuration: A complex type that contains settings for encryption of your rule group resources.
        rule-group: |-
            An object that defines the rule group rules.

            You must provide either this rule group setting or a `Rules` setting, but not both.
        rule-group-name: The descriptive name of the rule group. You can't change the name of a rule group after you create it.
        rules: |-
            A string containing stateful rule group rules specifications in Suricata flat format, with one rule per line. Use this to import your existing Suricata compatible rule groups.

            You must provide either this rules setting or a populated `RuleGroup` setting, but not both.

            You can provide your rule group specification in Suricata flat format through this setting when you create or update your rule group. The call response returns a [RuleGroup]() object that Network Firewall has populated from your string.
        source-metadata: A complex type that contains metadata about the rule group that your own rule group is copied from. You can use the metadata to keep track of updates made to the originating rule group.
        summary-configuration: |-
            An object that contains a `RuleOptions` array of strings. You use `RuleOptions` to determine which of the following [RuleSummary]() values are returned in response to `DescribeRuleGroupSummary`.

            - `Metadata` - returns
            - `Msg`
            - `SID`
        tags: The key:value pairs to associate with the resource.
        type: Indicates whether the rule group is stateless or stateful. If the rule group is stateless, it contains stateless rules. If it is stateful, it contains stateful rules.
