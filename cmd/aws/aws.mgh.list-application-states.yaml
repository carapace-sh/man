name: list-application-states
description: Lists all the migration statuses for your applications.
flags:
    --application-ids=: The configurationIds from the Application Discovery Service that uniquely identifies your applications.
    --max-results=: Maximum number of results to be returned per page.
    --next-token=: If a `NextToken` was returned by a previous call, there are more results available.
documentation:
    command: Lists all the migration statuses for your applications. If you use the optional `ApplicationIds` parameter, only the migration statuses for those applications will be returned.
    flag:
        application-ids: The configurationIds from the Application Discovery Service that uniquely identifies your applications.
        max-results: Maximum number of results to be returned per page.
        next-token: If a `NextToken` was returned by a previous call, there are more results available. To retrieve the next page of results, make the call again using the returned token in `NextToken`.
