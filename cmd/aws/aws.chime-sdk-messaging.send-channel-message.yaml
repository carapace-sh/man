name: send-channel-message
description: Sends a message to a particular channel that the member is a part of.
flags:
    --channel-arn=!: The ARN of the channel.
    --chime-bearer=!: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
    --client-request-token=!: The `Idempotency` token for each client request.
    --content-type=: The content type of the channel message.
    --content=!: The content of the channel message.
    --message-attributes=: The attributes for the message, used for message filtering along with a `FilterRule` defined in the `PushNotificationPreferences`.
    --metadata=: The optional metadata for each message.
    --persistence=!: Boolean that controls whether the message is persisted on the back end.
    --push-notification=: The push notification configuration of the message.
    --sub-channel-id=: The ID of the SubChannel in the request.
    --target=: The target of a message.
    --type=!: The type of message, `STANDARD` or `CONTROL`.
completion:
    flag:
        persistence:
            - PERSISTENT
            - NON_PERSISTENT
        type:
            - STANDARD
            - CONTROL
documentation:
    command: |-
        Sends a message to a particular channel that the member is a part of.

        The `x-amz-chime-bearer` request header is mandatory. Use the ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call as the value in the header.

        Also, `STANDARD` messages can be up to 4KB in size and contain metadata. Metadata is arbitrary, and you can use it in a variety of ways, such as containing a link to an attachment.

        `CONTROL` messages are limited to 30 bytes and do not contain metadata.
    flag:
        channel-arn: The ARN of the channel.
        chime-bearer: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
        client-request-token: The `Idempotency` token for each client request.
        content: The content of the channel message.
        content-type: The content type of the channel message.
        message-attributes: The attributes for the message, used for message filtering along with a `FilterRule` defined in the `PushNotificationPreferences`.
        metadata: The optional metadata for each message.
        persistence: Boolean that controls whether the message is persisted on the back end. Required.
        push-notification: The push notification configuration of the message.
        sub-channel-id: The ID of the SubChannel in the request.
        target: The target of a message. Must be a member of the channel, such as another user, a bot, or the sender. Only the target and the sender can view targeted messages. Only users who can see targeted messages can take actions on them. However, administrators can delete targeted messages that they can’t see.
        type: |-
            The type of message, `STANDARD` or `CONTROL`.

            `STANDARD` messages can be up to 4KB in size and contain metadata. Metadata is arbitrary, and you can use it in a variety of ways, such as containing a link to an attachment.

            `CONTROL` messages are limited to 30 bytes and do not contain metadata.
