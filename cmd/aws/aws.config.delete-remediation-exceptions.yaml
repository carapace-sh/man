name: delete-remediation-exceptions
description: Deletes one or more remediation exceptions mentioned in the resource keys.
flags:
    --config-rule-name=!: The name of the Config rule for which you want to delete remediation exception configuration.
    --resource-keys=!: An exception list of resource exception keys to be processed with the current request.
documentation:
    command: |-
        Deletes one or more remediation exceptions mentioned in the resource keys.

        Config generates a remediation exception when a problem occurs executing a remediation action to a specific resource. Remediation exceptions blocks auto-remediation until the exception is cleared.
    flag:
        config-rule-name: The name of the Config rule for which you want to delete remediation exception configuration.
        resource-keys: An exception list of resource exception keys to be processed with the current request. Config adds exception for each resource key. For example, Config adds 3 exceptions for 3 resource keys.
