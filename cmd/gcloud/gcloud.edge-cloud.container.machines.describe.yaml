name: describe
description: Show details about the machine.
flags:
    --location=: The global location name.
documentation:
    command: Show details about the machine.
    flag:
        location: |-
            The global location name.
            +
            To set the `location` attribute:
            * provide the argument `machine` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `edge_container/location`.
