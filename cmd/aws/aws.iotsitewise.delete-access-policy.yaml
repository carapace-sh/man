name: delete-access-policy
description: Deletes an access policy that grants the specified identity access to the specified IoT SiteWise Monitor resource.
flags:
    --access-policy-id=!: The ID of the access policy to be deleted.
    --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
documentation:
    command: Deletes an access policy that grants the specified identity access to the specified IoT SiteWise Monitor resource. You can use this operation to revoke access to an IoT SiteWise Monitor resource.
    flag:
        access-policy-id: The ID of the access policy to be deleted.
        client-token: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request. Don't reuse this client token if a new idempotent request is required.
