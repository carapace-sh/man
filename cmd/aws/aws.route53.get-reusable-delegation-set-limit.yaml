name: get-reusable-delegation-set-limit
description: Gets the maximum number of hosted zones that you can associate with the specified reusable delegation set.
flags:
    --delegation-set-id=!: The ID of the delegation set that you want to get the limit for.
    --type=!: Specify `MAX_ZONES_BY_REUSABLE_DELEGATION_SET` to get the maximum number of hosted zones that you can associate with the specified reusable delegation set.
completion:
    flag:
        type:
            - MAX_ZONES_BY_REUSABLE_DELEGATION_SET
documentation:
    command: |-
        Gets the maximum number of hosted zones that you can associate with the specified reusable delegation set.

        For the default limit, see [Limits](https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/DNSLimitations.html) in the *Amazon Route 53 Developer Guide*. To request a higher limit, [open a case](https://console.aws.amazon.com/support/home#/case/create?issueType=service-limit-increase&limitType=service-code-route53).
    flag:
        delegation-set-id: The ID of the delegation set that you want to get the limit for.
        type: Specify `MAX_ZONES_BY_REUSABLE_DELEGATION_SET` to get the maximum number of hosted zones that you can associate with the specified reusable delegation set.
