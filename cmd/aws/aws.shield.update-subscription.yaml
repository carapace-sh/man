name: update-subscription
description: Updates the details of an existing subscription.
flags:
    --auto-renew=: When you initally create a subscription, `AutoRenew` is set to `ENABLED`.
completion:
    flag:
        auto-renew:
            - ENABLED
            - DISABLED
documentation:
    command: |-
        Updates the details of an existing subscription. Only enter values for parameters you want to change. Empty parameters are not updated.

        For accounts that are members of an Organizations organization, Shield Advanced subscriptions are billed against the organization's payer account, regardless of whether the payer account itself is subscribed.
    flag:
        auto-renew: When you initally create a subscription, `AutoRenew` is set to `ENABLED`. If `ENABLED`, the subscription will be automatically renewed at the end of the existing subscription period. You can change this by submitting an `UpdateSubscription` request. If the `UpdateSubscription` request does not included a value for `AutoRenew`, the existing value for `AutoRenew` remains unchanged.
