name: update
description: '*(BETA)*  Update a backup, only supported for the following fields: --expiration-date and --retention-period.'
flags:
    --cluster=: Name of the Bigtable cluster.
    --expiration-date=: Absolute expiration time of the backup; must be at least 6 hours and at most 90 days from
    --hot-to-standard-time=: Time at which a hot backup will be converted to a standard backup; must be at least 24 hours
    --instance=: Name of the Bigtable instance.
    --retention-period=: Retention period of the backup relative from now; must be at least 6 hours and at most 90
documentation:
    command: |
        *(BETA)*  Update a backup, only supported for the following fields: --expiration-date and --retention-period.
    flag:
        cluster: |-
            Name of the Bigtable cluster.
            +
            To set the `cluster` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--cluster` on the command line.
        expiration-date: |-
            Absolute expiration time of the backup; must be at least 6 hours and at most 90 days from
            backup creation time. See `$ gcloud topic datetimes` for information on date/time formats.
            See `$ gcloud bigtable backups describe` for creation time.
        hot-to-standard-time: |-
            Time at which a hot backup will be converted to a standard backup; must be at least 24 hours
            from backup creation time. Only applies for hot backups. See `$ gcloud topic datetimes` for
            information on date/time formats. See `$ gcloud bigtable backups describe` for creation time.
        instance: |-
            Name of the Bigtable instance.
            +
            To set the `instance` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line.
        retention-period: |-
            Retention period of the backup relative from now; must be at least 6 hours and at most 90
            days from backup creation time. See `$ gcloud topic datetimes` for information on duration
            formats. See `$ gcloud bigtable backups describe` for creation time.
