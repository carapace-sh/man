name: describe-projects
description: Gets information about your Rekognition projects.
flags:
    --features=: Specifies the type of customization to filter projects by.
    --max-results=: The maximum number of results to return per paginated call.
    --next-token=: If the previous response was incomplete (because there is more results to retrieve), Rekognition returns a pagination token in the response.
    --project-names=: A list of the projects that you want Rekognition to describe.
documentation:
    command: |-
        Gets information about your Rekognition projects.

        This operation requires permissions to perform the `rekognition:DescribeProjects` action.
    flag:
        features: Specifies the type of customization to filter projects by. If no value is specified, CUSTOM\_LABELS is used as a default.
        max-results: The maximum number of results to return per paginated call. The largest value you can specify is 100. If you specify a value greater than 100, a ValidationException error occurs. The default value is 100.
        next-token: If the previous response was incomplete (because there is more results to retrieve), Rekognition returns a pagination token in the response. You can use this pagination token to retrieve the next set of results.
        project-names: A list of the projects that you want Rekognition to describe. If you don't specify a value, the response includes descriptions for all the projects in your AWS account.
