name: send-destination-number-verification-code
description: Before you can send test messages to a verified destination phone number you need to opt-in the verified destination phone number.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration-set-name=: The name of the configuration set to use.
    --context=: You can specify custom data in this field.
    --destination-country-parameters=: This field is used for any country-specific registration requirements.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --language-code=: Choose the language to use for the message.
    --origination-identity=: The origination identity of the message.
    --verification-channel=!: Choose to send the verification code as an SMS or voice message.
    --verified-destination-number-id=!: The unique identifier for the verified destination phone number.
completion:
    flag:
        language-code:
            - DE_DE
            - EN_GB
            - EN_US
            - ES_419
            - ES_ES
            - FR_CA
            - FR_FR
            - IT_IT
            - JA_JP
            - KO_KR
            - PT_BR
            - ZH_CN
            - ZH_TW
        verification-channel:
            - TEXT
            - VOICE
documentation:
    command: Before you can send test messages to a verified destination phone number you need to opt-in the verified destination phone number. Creates a new text message with a verification code and send it to a verified destination phone number. Once you have the verification code use [VerifyDestinationNumber]() to opt-in the verified destination phone number to receive messages.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration-set-name: The name of the configuration set to use. This can be either the ConfigurationSetName or ConfigurationSetArn.
        context: You can specify custom data in this field. If you do, that data is logged to the event destination.
        destination-country-parameters: This field is used for any country-specific registration requirements. Currently, this setting is only used when you send messages to recipients in India using a sender ID. For more information see [Special requirements for sending SMS messages to recipients in India](https://docs.aws.amazon.com/pinpoint/latest/userguide/channels-sms-senderid-india.html).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        language-code: Choose the language to use for the message.
        origination-identity: |-
            The origination identity of the message. This can be either the PhoneNumber, PhoneNumberId, PhoneNumberArn, SenderId, SenderIdArn, PoolId, or PoolArn.

            If you are using a shared End User MessagingSMS resource then you must use the full Amazon Resource Name(ARN).
        verification-channel: Choose to send the verification code as an SMS or voice message.
        verified-destination-number-id: The unique identifier for the verified destination phone number.
