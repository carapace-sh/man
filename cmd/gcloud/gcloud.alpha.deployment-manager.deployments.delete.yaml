name: delete
description: '*(ALPHA)*  Delete a deployment.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --delete-policy=: Delete policy for resources that will change as part of an update or delete.
    --no-async&: Return immediately, without waiting for the operation in progress to
completion:
    flag:
        delete-policy:
            - abandon
            - delete
documentation:
    command: '*(ALPHA)*  This command deletes a deployment and deletes all associated resources.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        delete-policy: 'Delete policy for resources that will change as part of an update or delete. `delete` deletes the resource while `abandon` just removes the resource reference from the deployment. _DELETE_POLICY_ must be one of: *abandon*, *delete*.'
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
