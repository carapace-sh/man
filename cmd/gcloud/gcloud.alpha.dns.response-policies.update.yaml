name: update
description: '*(ALPHA)*  Updates a Cloud DNS response policy.'
flags:
    --description=: A description of the response policy.
    --gkeclusters=: The comma-separated list of GKE cluster names to associate with the response policy.
    --location=: Specifies the desired service location the request is sent to.
    --networks=: The comma-separated list of network names to associate with the response policy.
documentation:
    command: |-
        *(ALPHA)*  This command updates a Cloud DNS response policy.

        ## EXAMPLES

        To update a response policy with minimal arguments, run:

          $ gcloud alpha dns response-policies update myresponsepolicy --description='My updated response policy.'
          --networks=''

        To update a response policy with all optional arguments, run:

          $ gcloud alpha dns response-policies update myresponsepolicy --description='My updated response policy.'
          --networks=network1,network2

        To update a new zonal response policy scoped to a GKE cluster in
        us-central1-a, run:

          $ gcloud alpha dns response-policies update myresponsepolicy --description='My new response policy.'
          --gkeclusters=cluster1 --location=us-central1-a
    flag:
        description: A description of the response policy.
        gkeclusters: The comma-separated list of GKE cluster names to associate with the response policy.
        location: Specifies the desired service location the request is sent to. Defaults to Cloud DNS global service. Use --location=global if you want to target the global service.
        networks: The comma-separated list of network names to associate with the response policy.
