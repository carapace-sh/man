name: get-comment-reactions
description: Returns information about reactions to a specified comment ID.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --comment-id=!: The ID of the comment for which you want to get reactions information.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: A non-zero, non-negative integer used to limit the number of returned results.
    --next-token=: An enumeration token that, when provided in a request, returns the next batch of the results.
    --reaction-user-arn=: Optional.
documentation:
    command: Returns information about reactions to a specified comment ID. Reactions from users who have been deleted will not be included in the count.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        comment-id: The ID of the comment for which you want to get reactions information.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: A non-zero, non-negative integer used to limit the number of returned results. The default is the same as the allowed maximum, 1,000.
        next-token: An enumeration token that, when provided in a request, returns the next batch of the results.
        reaction-user-arn: Optional. The Amazon Resource Name (ARN) of the user or identity for which you want to get reaction information.
