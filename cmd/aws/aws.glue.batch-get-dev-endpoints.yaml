name: batch-get-dev-endpoints
description: Returns a list of resource metadata for a given list of development endpoint names.
flags:
    --dev-endpoint-names=!: The list of `DevEndpoint` names, which might be the names returned from the `ListDevEndpoint` operation.
documentation:
    command: Returns a list of resource metadata for a given list of development endpoint names. After calling the `ListDevEndpoints` operation, you can call this operation to access the data to which you have been granted permissions. This operation supports all IAM permissions, including permission conditions that uses tags.
    flag:
        dev-endpoint-names: The list of `DevEndpoint` names, which might be the names returned from the `ListDevEndpoint` operation.
