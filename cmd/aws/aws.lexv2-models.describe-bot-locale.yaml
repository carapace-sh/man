name: describe-bot-locale
description: Describes the settings that a bot has for a specific locale.
flags:
    --bot-id=!: The identifier of the bot associated with the locale.
    --bot-version=!: The version of the bot associated with the locale.
    --locale-id=!: The unique identifier of the locale to describe.
documentation:
    command: Describes the settings that a bot has for a specific locale.
    flag:
        bot-id: The identifier of the bot associated with the locale.
        bot-version: The version of the bot associated with the locale.
        locale-id: The unique identifier of the locale to describe. The string must match one of the supported locales. For more information, see [Supported languages](https://docs.aws.amazon.com/lexv2/latest/dg/how-languages.html).
