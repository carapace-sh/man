name: update-event-destination
description: Updates an existing event destination in a configuration set.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cloud-watch-logs-destination=: An object that contains information about an event destination that sends data to CloudWatch Logs.
    --configuration-set-name=!: The configuration set to update with the new event destination.
    --enabled: When set to true logging is enabled.
    --event-destination-name=!: The name to use for the event destination.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --kinesis-firehose-destination=: An object that contains information about an event destination for logging to Firehose.
    --matching-event-types=: An array of event types that determine which events to log.
    --no-enabled: When set to true logging is enabled.
    --sns-destination=: An object that contains information about an event destination that sends data to Amazon SNS.
documentation:
    command: |-
        Updates an existing event destination in a configuration set. You can update the IAM role ARN for CloudWatch Logs and Firehose. You can also enable or disable the event destination.

        You may want to update an event destination to change its matching event types or updating the destination resource ARN. You can't change an event destination's type between CloudWatch Logs, Firehose, and Amazon SNS.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cloud-watch-logs-destination: An object that contains information about an event destination that sends data to CloudWatch Logs.
        configuration-set-name: The configuration set to update with the new event destination. Valid values for this can be the ConfigurationSetName or ConfigurationSetArn.
        enabled: When set to true logging is enabled.
        event-destination-name: The name to use for the event destination.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        kinesis-firehose-destination: An object that contains information about an event destination for logging to Firehose.
        matching-event-types: |-
            An array of event types that determine which events to log.

            The `TEXT_SENT` event type is not supported.
        sns-destination: An object that contains information about an event destination that sends data to Amazon SNS.
