name: create-channel-placement-group
description: Create a ChannelPlacementGroup in the specified Cluster.
flags:
    --cluster-id=!: The ID of the cluster.
    --name=: Specify a name that is unique in the Cluster.
    --nodes=: An array of one ID for the Node that you want to associate with the ChannelPlacementGroup.
    --request-id=: An ID that you assign to a create request.
    --tags=: A collection of key-value pairs.
documentation:
    command: Create a ChannelPlacementGroup in the specified Cluster. As part of the create operation, you specify the Nodes to attach the group to.After you create a ChannelPlacementGroup, you add Channels to the group (you do this by modifying the Channels to add them to a specific group). You now have an association of Channels to ChannelPlacementGroup, and ChannelPlacementGroup to Nodes. This association means that all the Channels in the group are able to run on any of the Nodes associated with the group.
    flag:
        cluster-id: The ID of the cluster.
        name: Specify a name that is unique in the Cluster. You can't change the name. Names are case-sensitive.
        nodes: An array of one ID for the Node that you want to associate with the ChannelPlacementGroup. (You can't associate more than one Node with the ChannelPlacementGroup.) The Node and the ChannelPlacementGroup must be in the same Cluster.
        request-id: An ID that you assign to a create request. This ID ensures idempotency when creating resources. the request.
        tags: A collection of key-value pairs.
