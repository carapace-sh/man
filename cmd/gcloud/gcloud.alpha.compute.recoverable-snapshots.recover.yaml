name: recover
description: '*(ALPHA)*  Recovers a Compute Engine recoverable snapshot.'
hidden: true
flags:
    --snapshot-name=: Name of the snapshot after the recovery.
documentation:
    command: |
        *(ALPHA)*  Recovers the specified global recoverable snapshot.
        If `--snapshot-name` is provided, the snapshot will be recovered with
        that name. Otherwise, it will be recovered with the original name.
    flag:
        snapshot-name: Name of the snapshot after the recovery. If not provided, the snapshot will be recovered with the original name.
