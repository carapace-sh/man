name: create-subscription-request
description: Creates a subscription request in Amazon DataZone.
flags:
    --asset-permissions=:
        description: The asset permissions of the subscription request.
        nargs: -1
    --asset-scopes=:
        description: The asset scopes of the subscription request.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier that is provided to ensure the idempotency of the request.
    --domain-identifier=!: The ID of the Amazon DataZone domain in which the subscription request is created.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --metadata-forms=:
        description: The metadata form included in the subscription request.
        nargs: -1
    --request-reason=!: The reason for the subscription request.
    --subscribed-listings=!:
        description: The published asset for which the subscription grant is to be created.
        nargs: -1
    --subscribed-principals=!:
        description: The Amazon DataZone principals for whom the subscription request is created.
        nargs: -1
documentation:
    command: Creates a subscription request in Amazon DataZone.
    flag:
        asset-permissions: The asset permissions of the subscription request.
        asset-scopes: The asset scopes of the subscription request.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier that is provided to ensure the idempotency of the request.
        domain-identifier: The ID of the Amazon DataZone domain in which the subscription request is created.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        metadata-forms: The metadata form included in the subscription request.
        request-reason: The reason for the subscription request.
        subscribed-listings: The published asset for which the subscription grant is to be created.
        subscribed-principals: The Amazon DataZone principals for whom the subscription request is created.
