name: modify-replication-group-shard-configuration
description: Modifies a replication group's shards (node groups) by allowing you to add shards, remove shards, or rebalance the keyspaces among existing shards.
flags:
    --apply-immediately!: Indicates that the shard reconfiguration process begins immediately.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-apply-immediately!: Indicates that the shard reconfiguration process begins immediately.
    --node-group-count=!: The number of node groups (shards) that results from the modification of the shard configuration.
    --node-groups-to-remove=:
        description: If the value of `NodeGroupCount` is less than the current number of node groups (shards), then either `NodeGroupsToRemove` or `NodeGroupsToRetain` is required.
        nargs: -1
    --node-groups-to-retain=:
        description: If the value of `NodeGroupCount` is less than the current number of node groups (shards), then either `NodeGroupsToRemove` or `NodeGroupsToRetain` is required.
        nargs: -1
    --replication-group-id=!: The name of the Valkey or Redis OSS (cluster mode enabled) cluster (replication group) on which the shards are to be configured.
    --resharding-configuration=:
        description: Specifies the preferred availability zones for each node group in the cluster.
        nargs: -1
documentation:
    command: Modifies a replication group's shards (node groups) by allowing you to add shards, remove shards, or rebalance the keyspaces among existing shards.
    flag:
        apply-immediately: |-
            Indicates that the shard reconfiguration process begins immediately. At present, the only permitted value for this parameter is `true`.

            Value: true
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        node-group-count: The number of node groups (shards) that results from the modification of the shard configuration.
        node-groups-to-remove: |-
            If the value of `NodeGroupCount` is less than the current number of node groups (shards), then either `NodeGroupsToRemove` or `NodeGroupsToRetain` is required. `NodeGroupsToRemove` is a list of `NodeGroupId`s to remove from the cluster.

            ElastiCache will attempt to remove all node groups listed by `NodeGroupsToRemove` from the cluster.
        node-groups-to-retain: |-
            If the value of `NodeGroupCount` is less than the current number of node groups (shards), then either `NodeGroupsToRemove` or `NodeGroupsToRetain` is required. `NodeGroupsToRetain` is a list of `NodeGroupId`s to retain in the cluster.

            ElastiCache will attempt to remove all node groups except those listed by `NodeGroupsToRetain` from the cluster.
        replication-group-id: The name of the Valkey or Redis OSS (cluster mode enabled) cluster (replication group) on which the shards are to be configured.
        resharding-configuration: |-
            Specifies the preferred availability zones for each node group in the cluster. If the value of `NodeGroupCount` is greater than the current number of node groups (shards), you can use this parameter to specify the preferred availability zones of the cluster's shards. If you omit this parameter ElastiCache selects availability zones for you.

            You can specify this parameter only if the value of `NodeGroupCount` is greater than the current number of node groups (shards).
