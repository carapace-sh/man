name: update-traffic-policy-comment
description: Updates the comment for a specified traffic policy version.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --comment=!: The new comment for the specified traffic policy and version.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --id=!: The value of `Id` for the traffic policy that you want to update the comment for.
    --version=!: The value of `Version` for the traffic policy that you want to update the comment for.
documentation:
    command: Updates the comment for a specified traffic policy version.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
