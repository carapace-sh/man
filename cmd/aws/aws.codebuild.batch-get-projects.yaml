name: batch-get-projects
description: Gets information about one or more build projects.
flags:
    --names=!: The names or ARNs of the build projects.
documentation:
    command: Gets information about one or more build projects.
    flag:
        names: The names or ARNs of the build projects. To get information about a project shared with your Amazon Web Services account, its ARN must be specified. You cannot specify a shared project using its name.
