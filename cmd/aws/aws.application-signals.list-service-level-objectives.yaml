name: list-service-level-objectives
description: Returns a list of SLOs created in this account.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dependency-config=: Identifies the dependency using the `DependencyKeyAttributes` and `DependencyOperationName`.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --include-linked-accounts: If you are using this operation in a monitoring account, specify `true` to include SLO from source accounts in the returned data.
    --key-attributes=: You can use this optional field to specify which services you want to retrieve SLO information for.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of results to return in one operation.
    --metric-source-types=:
        description: Use this optional field to only include SLOs with the specified metric source types in the output.
        nargs: -1
    --next-token=: Include this value, if it was returned by the previous operation, to get the next set of service level objectives.
    --no-include-linked-accounts: If you are using this operation in a monitoring account, specify `true` to include SLO from source accounts in the returned data.
    --operation-name=: The name of the operation that this SLO is associated with.
    --page-size=: The size of each page to get in the AWS service call.
    --slo-owner-aws-account-id=: SLO's Amazon Web Services account ID.
    --starting-token=: A token to specify where to start paginating.
documentation:
    command: Returns a list of SLOs created in this account.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dependency-config: Identifies the dependency using the `DependencyKeyAttributes` and `DependencyOperationName`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        include-linked-accounts: |-
            If you are using this operation in a monitoring account, specify `true` to include SLO from source accounts in the returned data.

            When you are monitoring an account, you can use Amazon Web Services account ID in `KeyAttribute` filter for service source account and `SloOwnerawsaccountID` for SLO source account with `IncludeLinkedAccounts` to filter the returned data to only a single source account.
        key-attributes: |-
            You can use this optional field to specify which services you want to retrieve SLO information for.

            This is a string-to-string map. It can include the following fields.

            - `Type` designates the type of object this is.
            - `ResourceType` specifies the type of the resource. This field is used only when the value of the `Type` field is `Resource` or `AWS::Resource`.
            - `Name` specifies the name of the object. This is used only if the value of the `Type` field is `Service`, `RemoteService`, or `AWS::Service`.
            - `Identifier` identifies the resource objects of this resource. This is used only if the value of the `Type` field is `Resource` or `AWS::Resource`.
            - `Environment` specifies the location where this object is hosted, or what it belongs to.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of results to return in one operation. If you omit this parameter, the default of 50 is used.
        metric-source-types: |-
            Use this optional field to only include SLOs with the specified metric source types in the output. Supported types are:

            - Service operation
            - Service dependency
            - CloudWatch metric
        next-token: Include this value, if it was returned by the previous operation, to get the next set of service level objectives.
        operation-name: The name of the operation that this SLO is associated with.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        slo-owner-aws-account-id: SLO's Amazon Web Services account ID.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
