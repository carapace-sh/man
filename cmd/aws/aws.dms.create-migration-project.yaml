name: create-migration-project
description: Creates the migration project using the specified parameters.
flags:
    --description=: A user-friendly description of the migration project.
    --instance-profile-identifier=!: The identifier of the associated instance profile.
    --migration-project-name=: A user-friendly name for the migration project.
    --schema-conversion-application-attributes=: The schema conversion application attributes, including the Amazon S3 bucket name and Amazon S3 role ARN.
    --source-data-provider-descriptors=!: Information about the source data provider, including the name, ARN, and Secrets Manager parameters.
    --tags=: One or more tags to be assigned to the migration project.
    --target-data-provider-descriptors=!: Information about the target data provider, including the name, ARN, and Amazon Web Services Secrets Manager parameters.
    --transformation-rules=: The settings in JSON format for migration rules.
documentation:
    command: |-
        Creates the migration project using the specified parameters.

        You can run this action only after you create an instance profile and data providers using [CreateInstanceProfile](https://docs.aws.amazon.com/dms/latest/APIReference/API_CreateInstanceProfile.html) and [CreateDataProvider](https://docs.aws.amazon.com/dms/latest/APIReference/API_CreateDataProvider.html).
    flag:
        description: A user-friendly description of the migration project.
        instance-profile-identifier: The identifier of the associated instance profile. Identifiers must begin with a letter and must contain only ASCII letters, digits, and hyphens. They can't end with a hyphen, or contain two consecutive hyphens.
        migration-project-name: A user-friendly name for the migration project.
        schema-conversion-application-attributes: The schema conversion application attributes, including the Amazon S3 bucket name and Amazon S3 role ARN.
        source-data-provider-descriptors: Information about the source data provider, including the name, ARN, and Secrets Manager parameters.
        tags: One or more tags to be assigned to the migration project.
        target-data-provider-descriptors: Information about the target data provider, including the name, ARN, and Amazon Web Services Secrets Manager parameters.
        transformation-rules: The settings in JSON format for migration rules. Migration rules make it possible for you to change the object names according to the rules that you specify. For example, you can change an object name to lowercase or uppercase, add or remove a prefix or suffix, or rename objects.
