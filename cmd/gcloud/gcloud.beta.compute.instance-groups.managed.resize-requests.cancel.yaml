name: cancel
description: '*(BETA)*  Cancel a Compute Engine managed instance group resize request.'
flags:
    --region=: Region of the managed instance group to operate on.
    --resize-requests=!: A list of comma-separated names of resize requests to cancel.
    --zone=: Zone of the managed instance group to operate on.
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute instance-groups managed resize-requests cancel* cancels one or more Compute Engine managed instance group resize
        requests.

        You can only cancel a resize request when it is in the ACCEPTED state.
    flag:
        region: |-
            Region of the managed instance group to operate on. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            Overrides the default *compute/region* property value for this command invocation.
        resize-requests: A list of comma-separated names of resize requests to cancel.
        zone: |-
            Zone of the managed instance group to operate on. If not specified, you might be prompted to select a zone (interactive mode
            only).
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            Overrides the default *compute/zone* property value for this command invocation.
