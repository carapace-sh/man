name: describe-certificates
description: Returns a list of certificate authority (CA) certificates provided by Amazon DocumentDB for this Amazon Web Services account.
flags:
    --certificate-identifier=: The user-supplied certificate identifier.
    --filters=: This parameter is not currently supported.
    --marker=: An optional pagination token provided by a previous `DescribeCertificates` request.
    --max-records=: The maximum number of records to include in the response.
documentation:
    command: Returns a list of certificate authority (CA) certificates provided by Amazon DocumentDB for this Amazon Web Services account.
    flag:
        certificate-identifier: |-
            The user-supplied certificate identifier. If this parameter is specified, information for only the specified certificate is returned. If this parameter is omitted, a list of up to `MaxRecords` certificates is returned. This parameter is not case sensitive.

            Constraints

            - Must match an existing `CertificateIdentifier`.
        filters: This parameter is not currently supported.
        marker: An optional pagination token provided by a previous `DescribeCertificates` request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that the remaining results can be retrieved.

            Default: 100

            Constraints:

            - Minimum: 20
            - Maximum: 100
