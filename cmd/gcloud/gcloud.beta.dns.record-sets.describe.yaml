name: describe
description: '*(BETA)*  Describe a record-set in a managed-zone.'
flags:
    --location=: Specifies the desired service location the request is sent to.
    --type=!: DNS record type of the record-set (e.g. A, AAAA, MX etc.).
    --zone=!: Name of the managed zone whose record sets you want to manage.
documentation:
    command: |-
        *(BETA)*  This command describes a record-set contained within the specified
        managed-zone.

        ## EXAMPLES

        To describe a record-set with dnsName foo.bar.com. and record type A, rrdata
        run:

          $ gcloud beta dns record-sets describe foo.bar.com. --type=A --zone=my_zone
    flag:
        location: Specifies the desired service location the request is sent to. Defaults to Cloud DNS global service. Use --location=global if you want to target the global service.
        type: DNS record type of the record-set (e.g. A, AAAA, MX etc.).
        zone: Name of the managed zone whose record sets you want to manage.
