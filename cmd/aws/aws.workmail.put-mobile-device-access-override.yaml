name: put-mobile-device-access-override
description: Creates or updates a mobile device access override for the given WorkMail organization, user, and device.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description of the override.
    --device-id=!: The mobile device for which you create the override.
    --effect=!: The effect of the override, `ALLOW` or `DENY`.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --organization-id=!: Identifies the WorkMail organization for which you create the override.
    --user-id=!: The WorkMail user for which you create the override.
completion:
    flag:
        effect:
            - ALLOW
            - DENY
documentation:
    command: Creates or updates a mobile device access override for the given WorkMail organization, user, and device.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description of the override.
        device-id: The mobile device for which you create the override. `DeviceId` is case insensitive.
        effect: The effect of the override, `ALLOW` or `DENY`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        organization-id: Identifies the WorkMail organization for which you create the override.
        user-id: |-
            The WorkMail user for which you create the override. Accepts the following types of user identities:

            - User ID: `12345678-1234-1234-1234-123456789012` or `S-1-1-12-1234567890-123456789-123456789-1234`
            - Email address: `user@domain.tld`
            - User name: `user`
