name: describe-metadata-model-exports-to-target
description: Returns a paginated list of metadata model exports.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --filters=:
        description: Filters applied to the metadata model exports described in the form of key-value pairs.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --marker=: Specifies the unique pagination token that makes it possible to display the next page of results.
    --max-records=: The maximum number of records to include in the response.
    --migration-project-identifier=!: The migration project name or Amazon Resource Name (ARN).
documentation:
    command: Returns a paginated list of metadata model exports.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        filters: Filters applied to the metadata model exports described in the form of key-value pairs.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        marker: |-
            Specifies the unique pagination token that makes it possible to display the next page of results. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.

            If `Marker` is returned by a previous response, there are more results available. The value of `Marker` is a unique pagination token for each page. To retrieve the next page, make the call again using the returned token and keeping all other arguments unchanged.
        max-records: The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, DMS includes a pagination token in the response so that you can retrieve the remaining results.
        migration-project-identifier: The migration project name or Amazon Resource Name (ARN).
