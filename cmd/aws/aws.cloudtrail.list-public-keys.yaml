name: list-public-keys
description: Returns all public keys whose private keys were used to sign the digest files within the specified time range.
flags:
    --end-time=: Optionally specifies, in UTC, the end of the time range to look up public keys for CloudTrail digest files.
    --next-token=: Reserved for future use.
    --start-time=: Optionally specifies, in UTC, the start of the time range to look up public keys for CloudTrail digest files.
documentation:
    command: |-
        Returns all public keys whose private keys were used to sign the digest files within the specified time range. The public key is needed to validate digest files that were signed with its corresponding private key.

        CloudTrail uses different private and public key pairs per Region. Each digest file is signed with a private key unique to its Region. When you validate a digest file from a specific Region, you must look in the same Region for its corresponding public key.
    flag:
        end-time: Optionally specifies, in UTC, the end of the time range to look up public keys for CloudTrail digest files. If not specified, the current time is used.
        next-token: Reserved for future use.
        start-time: Optionally specifies, in UTC, the start of the time range to look up public keys for CloudTrail digest files. If not specified, the current time is used, and the current public key is returned.
