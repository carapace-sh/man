name: list-table-metadata
description: Lists the metadata for the tables in the specified data catalog database.
flags:
    --catalog-name=!: The name of the data catalog for which table metadata should be returned.
    --database-name=!: The name of the database for which table metadata should be returned.
    --expression=: A regex filter that pattern-matches table names.
    --max-results=: Specifies the maximum number of results to return.
    --next-token=: A token generated by the Athena service that specifies where to continue pagination if a previous request was truncated.
    --work-group=: The name of the workgroup for which the metadata is being fetched.
documentation:
    command: Lists the metadata for the tables in the specified data catalog database.
    flag:
        catalog-name: The name of the data catalog for which table metadata should be returned.
        database-name: The name of the database for which table metadata should be returned.
        expression: A regex filter that pattern-matches table names. If no expression is supplied, metadata for all tables are listed.
        max-results: Specifies the maximum number of results to return.
        next-token: A token generated by the Athena service that specifies where to continue pagination if a previous request was truncated. To obtain the next set of pages, pass in the NextToken from the response object of the previous page call.
        work-group: The name of the workgroup for which the metadata is being fetched. Required if requesting an IAM Identity Center enabled Glue Data Catalog.
