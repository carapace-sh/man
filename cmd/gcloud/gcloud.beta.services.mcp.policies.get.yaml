name: get
description: '*(BETA)*  Get MCP policy for a project, folder or organization.'
hidden: true
flags:
    --folder=: The Google Cloud Platform folder ID to use for this invocation.
    --organization=: The Google Cloud Platform organization ID to use for this invocation.
    --output-file=: Path to the file to write policy contents to.
    --policy-name=: Name of the MCP policy.
documentation:
    command: |-
        *(BETA)*  Get MCP policy for a project, folder or
        organization.

        ## EXAMPLES

         Get MCP policy for default policy on current project:

         $ gcloud beta services mcp policies get
            OR
         $ gcloud beta services mcp policies get --policy-name=default

         Get MCP policy for default policy on current project and save the
         content in an output file:

         $ gcloud beta services mcp policies get --output-file=/path/to/the/file.yaml
             OR
         $ gcloud beta services mcp policies get --output-file=/path/to/the/file.json
    flag:
        folder: The Google Cloud Platform folder ID to use for this invocation.
        organization: The Google Cloud Platform organization ID to use for this invocation.
        output-file: Path to the file to write policy contents to. Supported format:.yaml or .json.
        policy-name: Name of the MCP policy. Currently only "default" is supported.
