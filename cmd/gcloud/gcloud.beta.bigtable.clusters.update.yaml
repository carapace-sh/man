name: update
description: '*(BETA)*  Update a Bigtable cluster''s number of nodes.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --autoscaling-cpu-target=: The target CPU utilization percentage for autoscaling.
    --autoscaling-max-nodes=: The maximum number of nodes for autoscaling.
    --autoscaling-min-nodes=: The minimum number of nodes for autoscaling.
    --autoscaling-storage-target=: The target storage utilization gibibytes per node for autoscaling.
    --disable-autoscaling: Set this flag and --num-nodes to disable autoscaling.
    --instance=: Bigtable instance for the cluster.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-disable-autoscaling&: Set this flag and --num-nodes to disable autoscaling.
    --num-nodes=!: Number of nodes to serve.
documentation:
    command: '*(BETA)*  Update a Bigtable cluster''s number of nodes.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        autoscaling-cpu-target: The target CPU utilization percentage for autoscaling. Accepted values are from 10 to 80.
        autoscaling-max-nodes: The maximum number of nodes for autoscaling.
        autoscaling-min-nodes: The minimum number of nodes for autoscaling.
        autoscaling-storage-target: The target storage utilization gibibytes per node for autoscaling. Accepted values are from 2560 to 5120 for SSD clusters and 8192 to 16384 for HDD clusters.
        disable-autoscaling: Set this flag and --num-nodes to disable autoscaling. If autoscaling is currently not enabled, setting this flag does nothing.
        instance: |-
            Bigtable instance for the cluster.
            +
            To set the `instance` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-disable-autoscaling: Set this flag and --num-nodes to disable autoscaling. If autoscaling is currently not enabled, setting this flag does nothing.
        num-nodes: Number of nodes to serve.
