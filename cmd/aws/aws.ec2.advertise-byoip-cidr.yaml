name: advertise-byoip-cidr
description: Advertises an IPv4 or IPv6 address range that is provisioned for use with your Amazon Web Services resources through bring your own IP addresses (BYOIP).
flags:
    --asn=: The public 2-byte or 4-byte ASN that you want to advertise.
    --cidr=!: The address range, in CIDR notation.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --network-border-group=: If you have [Local Zones](https://docs.aws.amazon.com/local-zones/latest/ug/how-local-zones-work.html) enabled, you can choose a network border group for Local Zones when you provision and advertise a BYOIPv4 CIDR.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: |-
        Advertises an IPv4 or IPv6 address range that is provisioned for use with your Amazon Web Services resources through bring your own IP addresses (BYOIP).

        You can perform this operation at most once every 10 seconds, even if you specify different address ranges each time.

        We recommend that you stop advertising the BYOIP CIDR from other locations when you advertise it from Amazon Web Services. To minimize down time, you can configure your Amazon Web Services resources to use an address from a BYOIP CIDR before it is advertised, and then simultaneously stop advertising it from the current location and start advertising it through Amazon Web Services.

        It can take a few minutes before traffic to the specified addresses starts routing to Amazon Web Services because of BGP propagation delays.
    flag:
        asn: The public 2-byte or 4-byte ASN that you want to advertise.
        cidr: The address range, in CIDR notation. This must be the exact range that you provisioned. You can't advertise only a portion of the provisioned range.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        network-border-group: |-
            If you have [Local Zones](https://docs.aws.amazon.com/local-zones/latest/ug/how-local-zones-work.html) enabled, you can choose a network border group for Local Zones when you provision and advertise a BYOIPv4 CIDR. Choose the network border group carefully as the EIP and the Amazon Web Services resource it is associated with must reside in the same network border group.

            You can provision BYOIP address ranges to and advertise them in the following Local Zone network border groups:

            - us-east-1-dfw-2
            - us-west-2-lax-1
            - us-west-2-phx-2

            You cannot provision or advertise BYOIPv6 address ranges in Local Zones at this time.
