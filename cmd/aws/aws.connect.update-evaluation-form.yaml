name: update-evaluation-form
description: Updates details about a specific evaluation form version in the specified Amazon Connect instance.
flags:
    --auto-evaluation-configuration=: Whether automated evaluations are enabled.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --create-new-version=: A flag indicating whether the operation must create a new version.
    --description=: The description of the evaluation form.
    --evaluation-form-id=!: The unique identifier for the evaluation form.
    --evaluation-form-version=!: A version of the evaluation form to update.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --items=!: Items that are part of the evaluation form.
    --scoring-strategy=: A scoring strategy of the evaluation form.
    --title=!: A title of the evaluation form.
documentation:
    command: |-
        Updates details about a specific evaluation form version in the specified Amazon Connect instance. Question and section identifiers cannot be duplicated within the same evaluation form.

        This operation does not support partial updates. Instead it does a full update of evaluation form content.
    flag:
        auto-evaluation-configuration: Whether automated evaluations are enabled.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If not provided, the Amazon Web Services SDK populates this field. For more information about idempotency, see [Making retries safe with idempotent APIs](https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/).
        create-new-version: A flag indicating whether the operation must create a new version.
        description: The description of the evaluation form.
        evaluation-form-id: The unique identifier for the evaluation form.
        evaluation-form-version: A version of the evaluation form to update.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        items: Items that are part of the evaluation form. The total number of sections and questions must not exceed 100 each. Questions must be contained in a section.
        scoring-strategy: A scoring strategy of the evaluation form.
        title: A title of the evaluation form.
