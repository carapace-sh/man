name: list-signaling-channels
description: Returns an array of `ChannelInfo` objects.
flags:
    --channel-name-condition=: 'Optional: Returns only the channels that satisfy a specific condition.'
    --max-results=: The maximum number of channels to return in the response.
    --next-token=: If you specify this parameter, when the result of a `ListSignalingChannels` operation is truncated, the call returns the `NextToken` in the response.
documentation:
    command: Returns an array of `ChannelInfo` objects. Each object describes a signaling channel. To retrieve only those channels that satisfy a specific condition, you can specify a `ChannelNameCondition`.
    flag:
        channel-name-condition: 'Optional: Returns only the channels that satisfy a specific condition.'
        max-results: The maximum number of channels to return in the response. The default is 500.
        next-token: If you specify this parameter, when the result of a `ListSignalingChannels` operation is truncated, the call returns the `NextToken` in the response. To get another batch of channels, provide this token in your next request.
