name: get-entity-types
description: Gets all entity types or a specific entity type if a name is specified.
flags:
    --max-results=: The maximum number of objects to return for the request.
    --name=: The name.
    --next-token=: The next token for the subsequent request.
documentation:
    command: Gets all entity types or a specific entity type if a name is specified. This is a paginated API. If you provide a null `maxResults`, this action retrieves a maximum of 10 records per page. If you provide a `maxResults`, the value must be between 5 and 10. To get the next page results, provide the pagination token from the `GetEntityTypesResponse` as part of your request. A null pagination token fetches the records from the beginning.
    flag:
        max-results: The maximum number of objects to return for the request.
        name: The name.
        next-token: The next token for the subsequent request.
