name: get-associated-resource
description: Gets the resource associated with the application.
flags:
    --application=!: The name, ID, or ARN of the application.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of results to return.
    --next-token=: A unique pagination token for each page of results.
    --resource-tag-status=: States whether an application tag is applied, not applied, in the process of being applied, or skipped.
    --resource-type=!: The type of resource associated with the application.
    --resource=!: The name or ID of the resource associated with the application.
completion:
    flag:
        resource-type:
            - CFN_STACK
            - RESOURCE_TAG_VALUE
documentation:
    command: Gets the resource associated with the application.
    flag:
        application: The name, ID, or ARN of the application.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The maximum number of results to return. If the parameter is omitted, it defaults to 25. The value is optional.
        next-token: A unique pagination token for each page of results. Make the call again with the returned token to retrieve the next page of results.
        resource: The name or ID of the resource associated with the application.
        resource-tag-status: States whether an application tag is applied, not applied, in the process of being applied, or skipped.
        resource-type: The type of resource associated with the application.
