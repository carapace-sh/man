name: list-ops-item-related-items
description: Lists all related-item resources associated with a Systems Manager OpsCenter OpsItem.
flags:
    --filters=: One or more OpsItem filters.
    --max-results=: The maximum number of items to return for this call.
    --next-token=: The token for the next set of items to return.
    --ops-item-id=: The ID of the OpsItem for which you want to list all related-item resources.
documentation:
    command: Lists all related-item resources associated with a Systems Manager OpsCenter OpsItem. OpsCenter is a tool in Amazon Web Services Systems Manager.
    flag:
        filters: One or more OpsItem filters. Use a filter to return a more specific list of results.
        max-results: The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
        ops-item-id: The ID of the OpsItem for which you want to list all related-item resources.
