name: set-iam-policy
description: '*(ALPHA)*  Set IAM policy for a service account.'
documentation:
    command: |-
        *(ALPHA)*  This command replaces the existing IAM policy for a service account, given
        an IAM_ACCOUNT and a file encoded in JSON or YAML that contains the IAM
        policy. If the given policy file specifies an "etag" value, then the
        replacement will succeed only if the policy already in place matches that
        etag. (An etag obtained via $ gcloud iam service-accounts get-iam-policy will
        prevent the replacement if the policy for the service account has been
        subsequently updated.) A policy file that does not contain an etag value will
        replace any existing policy for the service account.

        If the service account does not exist, this command returns a
        `PERMISSION_DENIED` error.

        When managing IAM roles, you can treat a service account either as a resource or as an identity. This command is to set the iam policy of a service account resource. There are other gcloud commands to manage IAM policies for other types of resources. For example, to manage IAM policies on a project, use the `$ gcloud projects` commands.
