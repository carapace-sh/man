name: delete-directory-registration
description: Deletes a directory registration.
flags:
    --directory-registration-arn=!: The Amazon Resource Name (ARN) that was returned when you called [CreateDirectoryRegistration](https://docs.aws.amazon.com/pca-connector-ad/latest/APIReference/API_CreateDirectoryRegistration.html).
documentation:
    command: Deletes a directory registration. Deleting a directory registration deauthorizes Amazon Web Services Private CA with the directory.
    flag:
        directory-registration-arn: The Amazon Resource Name (ARN) that was returned when you called [CreateDirectoryRegistration](https://docs.aws.amazon.com/pca-connector-ad/latest/APIReference/API_CreateDirectoryRegistration.html).
