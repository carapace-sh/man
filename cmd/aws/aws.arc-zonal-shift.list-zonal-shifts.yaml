name: list-zonal-shifts
description: Lists all active and completed zonal shifts in Amazon Application Recovery Controller in your Amazon Web Services account in this Amazon Web Services Region.
flags:
    --max-results=: The number of objects that you want to return with this call.
    --next-token=: Specifies that you want to receive the next page of results.
    --resource-identifier=: The identifier for the resource that you want to list zonal shifts for.
    --status=: A status for a zonal shift.
completion:
    flag:
        status:
            - ACTIVE
            - EXPIRED
            - CANCELED
documentation:
    command: |-
        Lists all active and completed zonal shifts in Amazon Application Recovery Controller in your Amazon Web Services account in this Amazon Web Services Region. `ListZonalShifts` returns customer-initiated zonal shifts, as well as practice run zonal shifts that ARC started on your behalf for zonal autoshift.

        For more information about listing autoshifts, see ["&gt;ListAutoshifts](https://docs.aws.amazon.com/arc-zonal-shift/latest/api/API_ListAutoshifts.html).
    flag:
        max-results: The number of objects that you want to return with this call.
        next-token: Specifies that you want to receive the next page of results. Valid only if you received a `nextToken` response in the previous request. If you did, it indicates that more output is available. Set this parameter to the value provided by the previous call's `nextToken` response to request the next page of results.
        resource-identifier: The identifier for the resource that you want to list zonal shifts for. The identifier is the Amazon Resource Name (ARN) for the resource.
        status: |-
            A status for a zonal shift.

            The `Status` for a zonal shift can have one of the following values:

            - **ACTIVE**: The zonal shift has been started and is active.
            - **EXPIRED**: The zonal shift has expired (the expiry time was exceeded).
            - **CANCELED**: The zonal shift was canceled.
