name: restore
description: Restore one or more soft-deleted objects.
flags:
    --all-versions: Restores all versions of soft-deleted objects.
    --allow-overwrite: If included, live objects will be overwritten.
    --async: Initiates an asynchronous bulk restore operation on the specified bucket.
    --created-after-time=: Restores only the objects that were created after this time.
    --created-before-time=: Restores only the objects that were created before this time.
    --deleted-after-time=: Restores only the objects that were soft-deleted after this time.
    --deleted-before-time=: Restores only the objects that were soft-deleted before this time.
    --if-generation-match=: Execute only if the generation matches the generation of the requested object.
    --if-metageneration-match=: Execute only if the metageneration matches the metageneration of the requested object.
    --no-allow-overwrite&: If included, live objects will be overwritten.
    --no-async&: Initiates an asynchronous bulk restore operation on the specified bucket.
    --no-preserve-acl&: Preserves ACLs when copying in the cloud.
    --no-read-paths-from-stdin&: Read the list of URLs from stdin.
    --preserve-acl: Preserves ACLs when copying in the cloud.
    --read-paths-from-stdin: Read the list of URLs from stdin.
documentation:
    command: |+
        The restore command restores soft-deleted resources:

          $ gcloud storage restore url...

    flag:
        all-versions: |-
            Restores all versions of soft-deleted objects.
            +
            This flag is only useful for buckets with [object versioning] (https://cloud.google.com/storage/docs/object-versioning) enabled. In this case, the latest soft-deleted version will become live and the previous generations will become noncurrent.
            +
            If versioning is disabled, the latest soft-deleted version will become live and previous generations will be soft-deleted again.
            +
            This flag disables parallelism to preserve version order.
        allow-overwrite: If included, live objects will be overwritten. If versioning is enabled, this will result in a noncurrent object. If versioning is not enabled, this will result in a soft-deleted object.
        async: Initiates an asynchronous bulk restore operation on the specified bucket.
        created-after-time: Restores only the objects that were created after this time.
        created-before-time: Restores only the objects that were created before this time.
        deleted-after-time: Restores only the objects that were soft-deleted after this time.
        deleted-before-time: Restores only the objects that were soft-deleted before this time.
        if-generation-match: Execute only if the generation matches the generation of the requested object.
        if-metageneration-match: Execute only if the metageneration matches the metageneration of the requested object.
        no-allow-overwrite: If included, live objects will be overwritten. If versioning is enabled, this will result in a noncurrent object. If versioning is not enabled, this will result in a soft-deleted object.
        no-async: Initiates an asynchronous bulk restore operation on the specified bucket.
        no-preserve-acl: |-
            Preserves ACLs when copying in the cloud. This option is Cloud Storage-only, and you need OWNER access to all copied objects. If all objects in the destination bucket should have the same ACL, you can also set a default object ACL on that bucket instead of using this flag.
            Preserving ACLs is the default behavior for updating existing objects.
        no-read-paths-from-stdin: Read the list of URLs from stdin.
        preserve-acl: |-
            Preserves ACLs when copying in the cloud. This option is Cloud Storage-only, and you need OWNER access to all copied objects. If all objects in the destination bucket should have the same ACL, you can also set a default object ACL on that bucket instead of using this flag.
            Preserving ACLs is the default behavior for updating existing objects. Use *--preserve-acl* to enable and *--no-preserve-acl* to disable.
        read-paths-from-stdin: Read the list of URLs from stdin.
