name: list-accelerators
description: List the accelerators for an Amazon Web Services account.
flags:
    --max-results=: The number of Global Accelerator objects that you want to return with this call.
    --next-token=: The token for the next set of results.
documentation:
    command: List the accelerators for an Amazon Web Services account.
    flag:
        max-results: The number of Global Accelerator objects that you want to return with this call. The default value is 10.
        next-token: The token for the next set of results. You receive this token from a previous call.
