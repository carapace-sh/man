name: describe-metadata-model
description: Gets detailed information about the specified metadata model, including its definition and corresponding converted objects in the target database if applicable.
flags:
    --migration-project-identifier=!: The migration project name or Amazon Resource Name (ARN).
    --origin=!: Specifies whether to retrieve metadata from the source or target tree.
    --selection-rules=!: The JSON string that specifies which metadata model to retrieve.
completion:
    flag:
        origin:
            - SOURCE
            - TARGET
documentation:
    command: Gets detailed information about the specified metadata model, including its definition and corresponding converted objects in the target database if applicable.
    flag:
        migration-project-identifier: The migration project name or Amazon Resource Name (ARN).
        origin: 'Specifies whether to retrieve metadata from the source or target tree. Valid values: SOURCE | TARGET'
        selection-rules: 'The JSON string that specifies which metadata model to retrieve. Only one selection rule with "rule-action": "explicit" can be provided. For more information, see [Selection Rules](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Tasks.CustomizingTasks.TableMapping.SelectionTransformation.Selections.html) in the DMS User Guide.'
