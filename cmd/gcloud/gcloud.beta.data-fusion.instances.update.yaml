name: update
description: '*(BETA)*  Updates a Cloud Data Fusion instance.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --clear-maintenance-window: Clear the maintenance window for this Data Fusion instance.
    --enable-rbac: Enable granular role-based access control for this Data Fusion instance.
    --enable-stackdriver-logging: Enable Stackdriver logging for this Data Fusion instance.
    --enable-stackdriver-monitoring: Enable Stackdriver monitoring for this Data Fusion instance.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: Compute Engine region in which to create the instance.
    --maintenance-window-end=: The end time of the maintenance window.
    --maintenance-window-recurrence=: An RFC 5545 RRULE, specifying how the maintenance window will recur.
    --maintenance-window-start=: The start time of the maintenance window.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-maintenance-window&: Clear the maintenance window for this Data Fusion instance.
    --no-enable-rbac&: Enable granular role-based access control for this Data Fusion instance.
    --no-enable-stackdriver-logging&: Enable Stackdriver logging for this Data Fusion instance.
    --no-enable-stackdriver-monitoring&: Enable Stackdriver monitoring for this Data Fusion instance.
    --options=: Options to use for instance update, specified as KEY1=VALUE1,KEY2=VALUE2.
    --patch-revision=: Patch revision version of Cloud Data Fusion to update to.
documentation:
    command: |
        *(BETA)*  If run asynchronously with `--async`, exits after printing an operation
        that can be used to poll the status of the creation operation via:

          gcloud beta data-fusion instances update operations list
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        clear-maintenance-window: Clear the maintenance window for this Data Fusion instance.
        enable-rbac: Enable granular role-based access control for this Data Fusion instance.
        enable-stackdriver-logging: Enable Stackdriver logging for this Data Fusion instance.
        enable-stackdriver-monitoring: Enable Stackdriver monitoring for this Data Fusion instance.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            Compute Engine region in which to create the instance.
            +
            To set the `location` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `datafusion/location`.
        maintenance-window-end: |-
            The end time of the maintenance window. Only the time of the day is
            used as a reference for an ending time of the window with a provided
            recurrence. This will be used in conjunction with start time, and
            the difference will determine the length of a single maintenance
            window. This flag must be specified if any of the other arguments in this
            group are specified. For example:
              --maintenance_window_end=2024-01-02T01:00:00Z.
            See $ gcloud topic datetimes for information on time formats.
        maintenance-window-recurrence: |-
            An RFC 5545 RRULE, specifying how the maintenance window will recur.
            Only FREQ=WEEKLY format is supported. This flag must be specified if
            any of the other arguments in this group are specified. For example:
              --maintenance_window_recurrence="FREQ=WEEKLY;BYDAY=FR,SA,SU".
        maintenance-window-start: |-
            The start time of the maintenance window. Only the time of the day is
            used as a reference for a starting time of the window with a provided
            recurrence. This flag must be specified if any of the other arguments in
            this group are specified. For example:
              --maintenance_window_start=2024-01-01T01:00:00Z.
            See $ gcloud topic datetimes for information on time formats.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-maintenance-window: |
            Clear the maintenance window for this Data Fusion instance.
        no-enable-rbac: Enable granular role-based access control for this Data Fusion instance.
        no-enable-stackdriver-logging: Enable Stackdriver logging for this Data Fusion instance.
        no-enable-stackdriver-monitoring: Enable Stackdriver monitoring for this Data Fusion instance.
        options: Options to use for instance update, specified as KEY1=VALUE1,KEY2=VALUE2.
        patch-revision: Patch revision version of Cloud Data Fusion to update to.
