name: create
description: '*(ALPHA)*  Create a new Vertex AI Tensorboard time series.'
flags:
    --description=: Description of the tensorboard-time-series.
    --display-name=!: Display name of the tensorboard-time-series.
    --plugin-data=: Plugin data of the tensorboard-time-series.
    --plugin-name=: Plugin name of the tensorboard-time-series.
    --region=: Cloud region for the tensorboard_run.
    --tensorboard-experiment-id=: ID of the tensorboard experiment for the tensorboard_run.
    --tensorboard-id=: ID of the tensorboard for the tensorboard_run.
    --type=!: Value type of the tensorboard-time-series.
completion:
    flag:
        type:
            - blob-sequence
            - scalar
            - tensor
documentation:
    command: '*(ALPHA)*  Create a new Vertex AI Tensorboard time series.'
    flag:
        description: Description of the tensorboard-time-series.
        display-name: Display name of the tensorboard-time-series.
        plugin-data: Plugin data of the tensorboard-time-series.
        plugin-name: Plugin name of the tensorboard-time-series.
        region: |-
            Cloud region for the tensorboard_run.
            +
            To set the `region` attribute:
            * provide the argument `tensorboard_run` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
        tensorboard-experiment-id: |-
            ID of the tensorboard experiment for the tensorboard_run.
            +
            To set the `tensorboard-experiment-id` attribute:
            * provide the argument `tensorboard_run` on the command line with a fully specified name;
            * provide the argument `--tensorboard-experiment-id` on the command line.
        tensorboard-id: |-
            ID of the tensorboard for the tensorboard_run.
            +
            To set the `tensorboard-id` attribute:
            * provide the argument `tensorboard_run` on the command line with a fully specified name;
            * provide the argument `--tensorboard-id` on the command line.
        type: |-
            Value type of the tensorboard-time-series. _TYPE_ must be one of:
            +
            *blob-sequence*::: Used for tensorboard-time-series that is a list of blob sequences. E.g. set of sample images with labels over epochs/time.
            *scalar*::: Used for tensorboard-time-series that is a list of scalars. E.g. accuracy of a model over epochs/time.
            *tensor*::: Used for tensorboard-time-series that is a list of tensors. E.g. histograms of weights of layer in a model over epoch/time.
            :::
            +
