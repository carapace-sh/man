name: create-api-key-credential-provider
description: Creates a new API key credential provider.
flags:
    --api-key=!: The API key to use for authentication.
    --name=!: The name of the API key credential provider.
    --tags=: A map of tag keys and values to assign to the API key credential provider.
documentation:
    command: Creates a new API key credential provider.
    flag:
        api-key: The API key to use for authentication. This value is encrypted and stored securely.
        name: The name of the API key credential provider. The name must be unique within your account.
        tags: A map of tag keys and values to assign to the API key credential provider. Tags enable you to categorize your resources in different ways, for example, by purpose, owner, or environment.
