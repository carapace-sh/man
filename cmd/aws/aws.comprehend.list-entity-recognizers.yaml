name: list-entity-recognizers
description: Gets a list of the properties of all entity recognizers that you created, including recognizers currently in training.
flags:
    --filter=: Filters the list of entities returned.
    --max-results=: The maximum number of results to return on each page.
    --next-token=: Identifies the next page of results to return.
documentation:
    command: |-
        Gets a list of the properties of all entity recognizers that you created, including recognizers currently in training. Allows you to filter the list of recognizers based on criteria such as status and submission time. This call returns up to 500 entity recognizers in the list, with a default number of 100 recognizers in the list.

        The results of this list are not in any particular order. Please get the list and sort locally if needed.
    flag:
        filter: Filters the list of entities returned. You can filter on `Status`, `SubmitTimeBefore`, or `SubmitTimeAfter`. You can only set one filter at a time.
        max-results: The maximum number of results to return on each page. The default is 100.
        next-token: Identifies the next page of results to return.
