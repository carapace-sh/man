name: get-stream-session
description: Gets metadata on a specified stream.
flags:
    --channel-arn=!: ARN of the channel resource
    --stream-id=: Unique identifier for a live or previously live stream in the specified channel.
documentation:
    command: Gets metadata on a specified stream.
    flag:
        channel-arn: ARN of the channel resource
        stream-id: Unique identifier for a live or previously live stream in the specified channel. If no `streamId` is provided, this returns the most recent stream session for the channel, if it exists.
