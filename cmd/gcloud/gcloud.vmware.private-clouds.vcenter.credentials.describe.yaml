name: describe
description: Describe Google Cloud VMware Engine vCenter credentials.
flags:
    --location=: Location of the private cloud or cluster.
    --private-cloud=!: ID of the private cloud or fully qualified identifier for the private cloud.
    --username=&: The username of the user to be queried for credentials.
documentation:
    command: |
        Retrieve VMware vCenter sign-in credentials associated with a VMware Engine private cloud.
    flag:
        location: |-
            Location of the private cloud or cluster.
            +
            To set the `location` attribute:
            * provide the argument `--private-cloud` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/zone`.
        private-cloud: |-
            ID of the private cloud or fully qualified identifier for the private cloud.
            +
            To set the `private-cloud` attribute:
            * provide the argument `--private-cloud` on the command line.
        username: |
            The username of the user to be queried for credentials.
