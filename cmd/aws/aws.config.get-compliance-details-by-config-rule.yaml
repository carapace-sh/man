name: get-compliance-details-by-config-rule
description: Returns the evaluation results for the specified Config rule.
flags:
    --compliance-types=: Filters the results by compliance.
    --config-rule-name=!: The name of the Config rule for which you want compliance information.
    --limit=: The maximum number of evaluation results returned on each page.
    --next-token=: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
documentation:
    command: Returns the evaluation results for the specified Config rule. The results indicate which Amazon Web Services resources were evaluated by the rule, when each resource was last evaluated, and whether each resource complies with the rule.
    flag:
        compliance-types: |-
            Filters the results by compliance.

            `INSUFFICIENT_DATA` is a valid `ComplianceType` that is returned when an Config rule cannot be evaluated. However, `INSUFFICIENT_DATA` cannot be used as a `ComplianceType` for filtering results.
        config-rule-name: The name of the Config rule for which you want compliance information.
        limit: The maximum number of evaluation results returned on each page. The default is 10. You cannot specify a number greater than 100. If you specify 0, Config uses the default.
        next-token: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
