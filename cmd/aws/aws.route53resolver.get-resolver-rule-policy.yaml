name: get-resolver-rule-policy
description: Gets information about the Resolver rule policy for a specified rule.
flags:
    --arn=!: The ID of the Resolver rule that you want to get the Resolver rule policy for.
documentation:
    command: Gets information about the Resolver rule policy for a specified rule. A Resolver rule policy includes the rule that you want to share with another account, the account that you want to share the rule with, and the Resolver operations that you want to allow the account to use.
    flag:
        arn: The ID of the Resolver rule that you want to get the Resolver rule policy for.
