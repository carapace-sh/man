name: list-content-associations
description: Lists the content associations.
flags:
    --content-id=!: The identifier of the content.
    --knowledge-base-id=!: The identifier of the knowledge base.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
documentation:
    command: |-
        Lists the content associations.

        For more information about content associations--what they are and when they are used--see [Integrate Amazon Q in Connect with step-by-step guides](https://docs.aws.amazon.com/connect/latest/adminguide/integrate-q-with-guides.html) in the *Amazon Connect Administrator Guide*.
    flag:
        content-id: The identifier of the content.
        knowledge-base-id: The identifier of the knowledge base.
        max-results: The maximum number of results to return per page.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
