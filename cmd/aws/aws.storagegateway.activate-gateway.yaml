name: activate-gateway
description: Activates the gateway you previously deployed on your host.
flags:
    --activation-key=!: Your gateway activation key.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --gateway-name=!: The name you configured for your gateway.
    --gateway-region=!: A value that indicates the Amazon Web Services Region where you want to store your data.
    --gateway-timezone=!: A value that indicates the time zone you want to set for the gateway.
    --gateway-type=: A value that defines the type of gateway to activate.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --medium-changer-type=: The value that indicates the type of medium changer to use for tape gateway.
    --tags=: A list of up to 50 tags that you can assign to the gateway.
    --tape-drive-type=: The value that indicates the type of tape drive to use for tape gateway.
documentation:
    command: |-
        Activates the gateway you previously deployed on your host. In the activation process, you specify information such as the Amazon Web Services Region that you want to use for storing snapshots or tapes, the time zone for scheduled snapshots the gateway snapshot schedule window, an activation key, and a name for your gateway. The activation process also associates your gateway with your account. For more information, see [UpdateGatewayInformation]().

        You must turn on the gateway VM before you can activate your gateway.
    flag:
        activation-key: |-
            Your gateway activation key. You can obtain the activation key by sending an HTTP GET request with redirects enabled to the gateway IP address (port 80). The redirect URL returned in the response provides you the activation key for your gateway in the query string parameter `activationKey`. It may also include other activation-related parameters, however, these are merely defaults -- the arguments you pass to the `ActivateGateway` API call determine the actual configuration of your gateway.

            For more information, see [Getting activation key](https://docs.aws.amazon.com/storagegateway/latest/userguide/get-activation-key.html) in the *Storage Gateway User Guide*.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        gateway-name: The name you configured for your gateway.
        gateway-region: |-
            A value that indicates the Amazon Web Services Region where you want to store your data. The gateway Amazon Web Services Region specified must be the same Amazon Web Services Region as the Amazon Web Services Region in your `Host` header in the request. For more information about available Amazon Web Services Regions and endpoints for Storage Gateway, see [Storage Gateway endpoints and quotas](https://docs.aws.amazon.com/general/latest/gr/sg.html) in the *Amazon Web Services General Reference*.

            Valid Values: See [Storage Gateway endpoints and quotas](https://docs.aws.amazon.com/general/latest/gr/sg.html) in the *Amazon Web Services General Reference*.
        gateway-timezone: A value that indicates the time zone you want to set for the gateway. The time zone is of the format "GMT", "GMT-hr:mm", or "GMT+hr:mm". For example, GMT indicates Greenwich Mean Time without any offset. GMT-4:00 indicates the time is 4 hours behind GMT. GMT+2:00 indicates the time is 2 hours ahead of GMT. The time zone is used, for example, for scheduling snapshots and your gateway's maintenance schedule.
        gateway-type: |-
            A value that defines the type of gateway to activate. The type specified is critical to all later functions of the gateway and cannot be changed after activation. The default value is `CACHED`.

            Amazon FSx File Gateway is no longer available to new customers. Existing customers of FSx File Gateway can continue to use the service normally. For capabilities similar to FSx File Gateway, visit [this blog post](https://aws.amazon.com/blogs/storage/switch-your-file-share-access-from-amazon-fsx-file-gateway-to-amazon-fsx-for-windows-file-server/).

            Valid Values: `STORED` | `CACHED` | `VTL` | `FILE_S3` | `FILE_FSX_SMB`
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        medium-changer-type: |-
            The value that indicates the type of medium changer to use for tape gateway. This field is optional.

            Valid Values: `STK-L700` | `AWS-Gateway-VTL` | `IBM-03584L32-0402`
        tags: |-
            A list of up to 50 tags that you can assign to the gateway. Each tag is a key-value pair.

            Valid characters for key and value are letters, spaces, and numbers that can be represented in UTF-8 format, and the following special characters: + - = . _ : / @. The maximum length of a tag's key is 128 characters, and the maximum length for a tag's value is 256 characters.
        tape-drive-type: |-
            The value that indicates the type of tape drive to use for tape gateway. This field is optional.

            Valid Values: `IBM-ULT3580-TD5`
