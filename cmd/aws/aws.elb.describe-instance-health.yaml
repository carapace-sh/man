name: describe-instance-health
description: Describes the state of the specified instances with respect to the specified load balancer.
flags:
    --instances=: The IDs of the instances.
    --load-balancer-name=!: The name of the load balancer.
documentation:
    command: Describes the state of the specified instances with respect to the specified load balancer. If no instances are specified, the call describes the state of all instances that are currently registered with the load balancer. If instances are specified, their state is returned even if they are no longer registered with the load balancer. The state of terminated instances is not returned.
    flag:
        instances: The IDs of the instances.
        load-balancer-name: The name of the load balancer.
