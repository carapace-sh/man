name: delete
description: Delete a Compute Engine managed instance group resize request.
flags:
    --resize-requests=!: A list of comma-separated names of resize requests to delete.
    --zone=: Zone of the managed instance group to operate on.
documentation:
    command: |-
        *gcloud compute instance-groups managed resize-requests delete* deletes one or more Compute Engine managed instance
        group resize requests.

        You can only delete a request when it is in a state SUCCEEDED,
        FAILED, or CANCELLED.
    flag:
        resize-requests: A list of comma-separated names of resize requests to delete.
        zone: |-
            Zone of the managed instance group to operate on. If not specified and the ``compute/zone'' property isn't set, you
            might be prompted to select a zone (interactive mode only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
