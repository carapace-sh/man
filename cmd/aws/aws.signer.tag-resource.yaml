name: tag-resource
description: Adds one or more tags to a signing profile.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) for the signing profile.
    --tags=!: One or more tags to be associated with the signing profile.
documentation:
    command: Adds one or more tags to a signing profile. Tags are labels that you can use to identify and organize your AWS resources. Each tag consists of a key and an optional value. To specify the signing profile, use its Amazon Resource Name (ARN). To specify the tag, use a key-value pair.
    flag:
        resource-arn: The Amazon Resource Name (ARN) for the signing profile.
        tags: One or more tags to be associated with the signing profile.
