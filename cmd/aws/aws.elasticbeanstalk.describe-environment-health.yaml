name: describe-environment-health
description: Returns information about the overall health of the specified environment.
flags:
    --attribute-names=: Specify the response elements to return.
    --environment-id=: Specify the environment by ID.
    --environment-name=: Specify the environment by name.
documentation:
    command: Returns information about the overall health of the specified environment. The **DescribeEnvironmentHealth** operation is only available with AWS Elastic Beanstalk Enhanced Health.
    flag:
        attribute-names: Specify the response elements to return. To retrieve all attributes, set to `All`. If no attribute names are specified, returns the name of the environment.
        environment-id: |-
            Specify the environment by ID.

            You must specify either this or an EnvironmentName, or both.
        environment-name: |-
            Specify the environment by name.

            You must specify either this or an EnvironmentName, or both.
