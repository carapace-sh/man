name: describe
description: Describe a Dataplex job running a particular task.
flags:
    --lake=: Identifier of the Dataplex lake resource.
    --location=: Location of the Dataplex resource.
    --task=: Identifier of the Dataplex task resource.
documentation:
    command: |
        Describe a Dataplex job running a particular task.

        Displays all details of a Dataplex job given a valid job ID.
    flag:
        lake: |-
            Identifier of the Dataplex lake resource.
            +

            To set the `lake` attribute:
            * provide the argument `job` on the command line with a fully specified name;
            * provide the argument `--lake` on the command line.
        location: |-
            Location of the Dataplex resource.
            +

            To set the `location` attribute:
            * provide the argument `job` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
        task: |-
            Identifier of the Dataplex task resource.
            +

            To set the `task` attribute:
            * provide the argument `job` on the command line with a fully specified name;
            * provide the argument `--task` on the command line.
