name: get-slot-types
description: |-
    Returns slot type information as follows:

    - If you specify the `nameContains` field, returns the `$LATEST` version of all slot types that contain the specified string.
flags:
    --max-results=: The maximum number of slot types to return in the response.
    --name-contains=: Substring to match in slot type names.
    --next-token=: A pagination token that fetches the next page of slot types.
documentation:
    command: |-
        Returns slot type information as follows:

        - If you specify the `nameContains` field, returns the `$LATEST` version of all slot types that contain the specified string.
        - If you don't specify the `nameContains` field, returns information about the `$LATEST` version of all slot types.

        The operation requires permission for the `lex:GetSlotTypes` action.
    flag:
        max-results: The maximum number of slot types to return in the response. The default is 10.
        name-contains: Substring to match in slot type names. A slot type will be returned if any part of its name matches the substring. For example, "xyz" matches both "xyzabc" and "abcxyz."
        next-token: A pagination token that fetches the next page of slot types. If the response to this API call is truncated, Amazon Lex returns a pagination token in the response. To fetch next page of slot types, specify the pagination token in the next request.
