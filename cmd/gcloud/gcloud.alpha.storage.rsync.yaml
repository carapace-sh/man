documentation:
    command: |+
        *(ALPHA)*  *gcloud alpha storage rsync* copies to and updates objects at `DESTINATION` to match
        `SOURCE`. `SOURCE` must specify a directory, bucket, or bucket
        subdirectory. *gcloud alpha storage rsync* does not copy empty directory trees,
        since storage providers use a [flat namespace](https://cloud.google.com/storage/docs/folders).

        Note, shells (like bash, zsh) sometimes attempt to expand wildcards in
        ways that can be surprising. Also, attempting to copy files whose names
        contain wildcard characters can result in problems.

        If synchronizing a large amount of data between clouds you might consider
        setting up a Google Compute Engine account and running *gcloud alpha storage rsync* there.
        Since *gcloud alpha storage rsync* cross-provider data transfers flow through the machine
        where *gcloud alpha storage rsync* is running, doing this can make your transfer run
        significantly faster than on your local workstation.

    flag:
        additional-headers: Includes arbitrary headers in storage API calls. Accepts a comma separated list of key=value pairs, e.g. `header1=value1,header2=value2`. Overrides the default *storage/additional_headers* property value for this command invocation.
        cache-control: How caches should handle requests and responses.
        canned-acl: 'Applies predefined, or "canned," ACLs to a resource. See docs for a list of predefined ACL constants: https://cloud.google.com/storage/docs/access-control/lists#predefined-acl'
        checksums-only: When comparing objects with matching names at the source and destination, skip modification time check and compare object hashes. Normally, hashes are only compared if modification times are not available.
        clear-custom-contexts: Clears all custom contexts on objects.
        clear-custom-metadata: Clears all custom metadata on objects. When used with `--preserve-posix`, POSIX attributes will still be stored in custom metadata.
        content-disposition: How content should be displayed.
        content-encoding: How content is encoded (e.g. ``gzip'').
        content-language: Content's language (e.g. ``en'' signifies "English").
        content-md5: Manually specified MD5 hash digest for the contents of an uploaded file. This flag cannot be used when uploading multiple files. The custom digest is used by the cloud provider for validation.
        content-type: Type of data contained in the object (e.g. ``text/html'').
        continue-on-error: If any operations are unsuccessful, the command will exit with a non-zero exit status after completing the remaining operations. This flag takes effect only in sequential execution mode (i.e. processor and thread count are set to 1). Parallelism is default.
        custom-contexts: Sets custom contexts on objects. The existing custom contexts (if any) would be overwritten.
        custom-contexts-file: |-
            Path to a local JSON or YAML file containing custom contexts one wants to set on
            an object. For example:
            +
            1. The following JSON document shows two key value
            pairs, i.e. (key1, value1) and (key2, value2):
            +
              ```
                {
                  "key1": {"value": "value1"},
                  "key2": {"value": "value2"}
                }
              ```
            +
            2. The following YAML document shows two key value
            pairs, i.e. (key1, value1) and (key2, value2):
            +
              ```
                key1:
                  value: value1
                key2:
                  value: value2
              ```
            +
            Note: Currently object contexts only supports string format for values.
        custom-metadata: Sets custom metadata on objects. When used with `--preserve-posix`, POSIX attributes are also stored in custom metadata.
        custom-time: Custom time for Cloud Storage objects in RFC 3339 format.
        decryption-keys: A comma-separated list of customer-supplied encryption keys (RFC 4648 section 4 base64-encoded AES256 strings) that will be used to decrypt Cloud Storage objects. Data encrypted with a customer-managed encryption key (CMEK) is decrypted automatically, so CMEKs do not need to be listed here.
        delete-unmatched-destination-objects: |-
            Delete extra files under DESTINATION not found under SOURCE.
            By default extra files are not deleted. Managed folders are not
            affected by this flag.
            +
            Note: this option can delete data quickly if you specify the wrong
            source and destination combination.
        dry-run: Print what operations rsync would perform without actually executing them.
        encryption-key: The encryption key to use for encrypting target objects. The specified encryption key can be a customer-supplied encryption key (An RFC 4648 section 4 base64-encoded AES256 string), or a customer-managed encryption key of the form `projects/{project}/locations/{location}/keyRings/{key-ring}/cryptoKeys/{crypto-key}`. The specified key also acts as a decryption key, which is useful when copying or moving encrypted data to a new location. Using this flag in an `objects update` command triggers a rewrite of target objects.
        exclude: |-
            Exclude objects matching regex pattern from rsync.
            +
            Note that this is a Python regular expression, not a pure wildcard
            pattern. For example, matching a string ending in "abc" is
            `.*abc$` rather than `*abc`. Also note that the exclude path
            is relative, as opposed to absolute
            (similar to Linux `rsync` and `tar` exclude options).
            +
            For the Windows cmd.exe command line interpreter, use
            `^` as an escape character instead of `\` and escape the `|`
            character. When using Windows PowerShell, use `'` instead of
            `"` and surround the `|` character with `"`.
        gzip-in-flight: |-
            Applies gzip transport encoding to any file upload whose
            extension matches the input extension list. This is useful when
            uploading files with compressible content such as .js, .css,
            or .html files. This also saves network bandwidth while
            leaving the data uncompressed in Cloud Storage.
            +
            When you specify the `--gzip-in-flight` option, files being
            uploaded are compressed in-memory and on-the-wire only. Both the local
            files and Cloud Storage objects remain uncompressed. The
            uploaded objects retain the `Content-Type` and name of the
            original files.
        gzip-in-flight-all: |-
            Applies gzip transport encoding to file uploads. This option
            works like the `--gzip-in-flight` option described above,
            but it applies to all uploaded files, regardless of extension.
            +
            CAUTION: If some of the source files don't compress well, such
            as binary data, using this option may result in longer uploads.
        if-generation-match: Execute only if the generation matches the generation of the requested object.
        if-metageneration-match: Execute only if the metageneration matches the metageneration of the requested object.
        ignore-symlinks: Ignore file symlinks instead of copying what they point to. Enabled by default, use *--no-ignore-symlinks* to disable.
        include-managed-folders: Includes managed folders in command operations. For transfers, gcloud storage will set up managed folders in the destination with the same IAM policy bindings as the source. Managed folders are only included with recursive cloud-to-cloud transfers.
        no-checksums-only: When comparing objects with matching names at the source and destination, skip modification time check and compare object hashes. Normally, hashes are only compared if modification times are not available.
        no-clear-custom-contexts: Clears all custom contexts on objects.
        no-clear-custom-metadata: Clears all custom metadata on objects. When used with `--preserve-posix`, POSIX attributes will still be stored in custom metadata.
        no-clobber: Do not overwrite existing files or objects at the destination. Skipped items will be printed. This option may perform an additional GET request for cloud objects before attempting an upload.
        no-delete-unmatched-destination-objects: |-
            Delete extra files under DESTINATION not found under SOURCE.
            By default extra files are not deleted. Managed folders are not
            affected by this flag.

            Note: this option can delete data quickly if you specify the wrong
            source and destination combination.
        no-dry-run: Print what operations rsync would perform without actually executing them.
        no-ignore-symlinks: Ignore file symlinks instead of copying what they point to.
        no-include-managed-folders: Includes managed folders in command operations. For transfers, gcloud storage will set up managed folders in the destination with the same IAM policy bindings as the source. Managed folders are only included with recursive cloud-to-cloud transfers.
        no-preserve-acl: |-
            Preserves ACLs when copying in the cloud. This option is Cloud Storage-only, and you need OWNER access to all copied objects. If all objects in the destination bucket should have the same ACL, you can also set a default object ACL on that bucket instead of using this flag.
            Preserving ACLs is the default behavior for updating existing objects.
        predefined-acl: 'Applies predefined, or "canned," ACLs to a resource. See docs for a list of predefined ACL constants: https://cloud.google.com/storage/docs/access-control/lists#predefined-acl'
        preserve-acl: |-
            Preserves ACLs when copying in the cloud. This option is Cloud Storage-only, and you need OWNER access to all copied objects. If all objects in the destination bucket should have the same ACL, you can also set a default object ACL on that bucket instead of using this flag.
            Preserving ACLs is the default behavior for updating existing objects.
        preserve-posix: |-
            Causes POSIX attributes to be preserved when objects are copied. With this feature enabled,
            gcloud storage will copy several fields provided by the stat command:
            access time, modification time, owner UID, owner group GID, and the mode
            (permissions) of the file.
            +
            For uploads, these attributes are read off of local files and stored in the
            cloud as custom metadata. For downloads, custom cloud metadata is set as POSIX
            attributes on files after they are downloaded.
            +
            On Windows, this flag will only set and restore access time and modification
            time because Windows doesn't have a notion of POSIX UID, GID, and mode.
        recursive: Recursively copy the contents of any directories that match the source path expression.
        remove-custom-contexts: Removes the custom contexts on the object, if an entry is not found, it would be ignored.
        remove-custom-metadata: Removes individual custom metadata keys from objects. This flag can be used with `--update-custom-metadata`. When used with `--preserve-posix`, POSIX attributes specified by this flag are not preserved.
        skip-if-dest-has-newer-mtime: Skip operating on destination object if it has a newer modification time than the source.
        skip-unsupported: Skip objects with unsupported object types.
        update-custom-contexts: Updates the custom contexts on the object, if an entry is found, it would be overwritten, otherwise the entry would be added.
        update-custom-metadata: Adds or sets individual custom metadata key value pairs on objects. Existing custom metadata not specified with this flag is not changed. This flag can be used with `--remove-custom-metadata`. When keys overlap with those provided by `--preserve-posix`, values specified by this flag are used.
