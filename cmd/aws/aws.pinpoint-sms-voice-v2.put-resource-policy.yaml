name: put-resource-policy
description: Attaches a resource-based policy to a End User MessagingSMS resource(phone number, sender Id, phone poll, or opt-out list) that is used for sharing the resource.
flags:
    --policy=!: The JSON formatted resource-based policy to attach.
    --resource-arn=!: The Amazon Resource Name (ARN) of the End User MessagingSMS resource to attach the resource-based policy to.
documentation:
    command: Attaches a resource-based policy to a End User MessagingSMS resource(phone number, sender Id, phone poll, or opt-out list) that is used for sharing the resource. A shared resource can be a Pool, Opt-out list, Sender Id, or Phone number. For more information about resource-based policies, see [Working with shared resources](https://docs.aws.amazon.com/sms-voice/latest/userguide/shared-resources.html) in the *End User MessagingSMS User Guide*.
    flag:
        policy: The JSON formatted resource-based policy to attach.
        resource-arn: The Amazon Resource Name (ARN) of the End User MessagingSMS resource to attach the resource-based policy to.
