name: create-microsoft-teams-channel-configuration
description: Creates an AWS Chatbot configuration for Microsoft Teams.
flags:
    --channel-id=!: The ID of the Microsoft Teams channel.
    --channel-name=: The name of the Microsoft Teams channel.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration-name=!: The name of the configuration.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --guardrail-policy-arns=:
        description: The list of IAM policy ARNs that are applied as channel guardrails.
        nargs: -1
    --iam-role-arn=!: A user-defined role that AWS Chatbot assumes.
    --logging-level=: Logging levels include `ERROR`, `INFO`, or `NONE`.
    --no-user-authorization-required: Enables use of a user role requirement in your chat configuration.
    --sns-topic-arns=:
        description: The Amazon Resource Names (ARNs) of the SNS topics that deliver notifications to AWS Chatbot.
        nargs: -1
    --tags=:
        description: A map of tags assigned to a resource.
        nargs: -1
    --team-id=!: The ID of the Microsoft Teams authorized with AWS Chatbot.
    --team-name=: The name of the Microsoft Teams Team.
    --tenant-id=!: The ID of the Microsoft Teams tenant.
    --user-authorization-required: Enables use of a user role requirement in your chat configuration.
documentation:
    command: Creates an AWS Chatbot configuration for Microsoft Teams.
    flag:
        channel-id: The ID of the Microsoft Teams channel.
        channel-name: The name of the Microsoft Teams channel.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration-name: The name of the configuration.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        guardrail-policy-arns: The list of IAM policy ARNs that are applied as channel guardrails. The AWS managed `AdministratorAccess` policy is applied by default if this is not set.
        iam-role-arn: |-
            A user-defined role that AWS Chatbot assumes. This is not the service-linked role.

            For more information, see [IAM policies for AWS Chatbot](https://docs.aws.amazon.com/chatbot/latest/adminguide/chatbot-iam-policies.html) in the *AWS Chatbot Administrator Guide*.
        logging-level: Logging levels include `ERROR`, `INFO`, or `NONE`.
        sns-topic-arns: The Amazon Resource Names (ARNs) of the SNS topics that deliver notifications to AWS Chatbot.
        tags: A map of tags assigned to a resource. A tag is a string-to-string map of key-value pairs.
        team-id: |-
            The ID of the Microsoft Teams authorized with AWS Chatbot.

            To get the team ID, you must perform the initial authorization flow with Microsoft Teams in the AWS Chatbot console. Then you can copy and paste the team ID from the console. For more information, see [Step 1: Configure a Microsoft Teams client](https://docs.aws.amazon.com/chatbot/latest/adminguide/teams-setup.html#teams-client-setup) in the *AWS Chatbot Administrator Guide*.
        team-name: The name of the Microsoft Teams Team.
        tenant-id: The ID of the Microsoft Teams tenant.
        user-authorization-required: Enables use of a user role requirement in your chat configuration.
