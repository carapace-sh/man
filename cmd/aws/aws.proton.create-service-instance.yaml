name: create-service-instance
description: Create a service instance.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: The client token of the service instance to create.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the service instance to create.
    --service-name=!: The name of the service the service instance is added to.
    --spec=!: The spec for the service instance you want to create.
    --tags=:
        description: An optional list of metadata items that you can associate with the Proton service instance.
        nargs: -1
    --template-major-version=: To create a new major and minor version of the service template, *exclude* `major Version`.
    --template-minor-version=: To create a new minor version of the service template, include a `major Version`.
documentation:
    command: Create a service instance.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: The client token of the service instance to create.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the service instance to create.
        service-name: The name of the service the service instance is added to.
        spec: The spec for the service instance you want to create.
        tags: |-
            An optional list of metadata items that you can associate with the Proton service instance. A tag is a key-value pair.

            For more information, see [Proton resources and tagging](https://docs.aws.amazon.com/proton/latest/userguide/resources.html) in the *Proton User Guide*.
        template-major-version: To create a new major and minor version of the service template, *exclude* `major Version`.
        template-minor-version: To create a new minor version of the service template, include a `major Version`.
