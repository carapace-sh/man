name: create-otaupdate
description: Creates an IoT OTA update on a target group of things or groups.
flags:
    --additional-parameters=: A list of additional OTA update parameters, which are name-value pairs.
    --aws-job-abort-config=: The criteria that determine when and how a job abort takes place.
    --aws-job-executions-rollout-config=: Configuration for the rollout of OTA updates.
    --aws-job-presigned-url-config=: Configuration information for pre-signed URLs.
    --aws-job-timeout-config=: Specifies the amount of time each device has to finish its execution of the job.
    --description=: The description of the OTA update.
    --files=!: The files to be streamed by the OTA update.
    --ota-update-id=!: The ID of the OTA update to be created.
    --protocols=: The protocol used to transfer the OTA update image.
    --role-arn=!: The IAM role that grants Amazon Web Services IoT Core access to the Amazon S3, IoT jobs and Amazon Web Services Code Signing resources to create an OTA update job.
    --tags=: Metadata which can be used to manage updates.
    --target-selection=: Specifies whether the update will continue to run (CONTINUOUS), or will be complete after all the things specified as targets have completed the update (SNAPSHOT).
    --targets=!: The devices targeted to receive OTA updates.
completion:
    flag:
        target-selection:
            - CONTINUOUS
            - SNAPSHOT
documentation:
    command: |-
        Creates an IoT OTA update on a target group of things or groups.

        Requires permission to access the [CreateOTAUpdate](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        additional-parameters: A list of additional OTA update parameters, which are name-value pairs. They won't be sent to devices as a part of the Job document.
        aws-job-abort-config: The criteria that determine when and how a job abort takes place.
        aws-job-executions-rollout-config: Configuration for the rollout of OTA updates.
        aws-job-presigned-url-config: Configuration information for pre-signed URLs.
        aws-job-timeout-config: Specifies the amount of time each device has to finish its execution of the job. A timer is started when the job execution status is set to `IN_PROGRESS`. If the job execution status is not set to another terminal state before the timer expires, it will be automatically set to `TIMED_OUT`.
        description: The description of the OTA update.
        files: The files to be streamed by the OTA update.
        ota-update-id: The ID of the OTA update to be created.
        protocols: The protocol used to transfer the OTA update image. Valid values are \[HTTP], \[MQTT], \[HTTP, MQTT]. When both HTTP and MQTT are specified, the target device can choose the protocol.
        role-arn: The IAM role that grants Amazon Web Services IoT Core access to the Amazon S3, IoT jobs and Amazon Web Services Code Signing resources to create an OTA update job.
        tags: Metadata which can be used to manage updates.
        target-selection: 'Specifies whether the update will continue to run (CONTINUOUS), or will be complete after all the things specified as targets have completed the update (SNAPSHOT). If continuous, the update may also be run on a thing when a change is detected in a target. For example, an update will run on a thing when the thing is added to a target group, even after the update was completed by all things originally in the group. Valid values: CONTINUOUS | SNAPSHOT.'
        targets: The devices targeted to receive OTA updates.
