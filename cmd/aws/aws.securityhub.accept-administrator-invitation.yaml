name: accept-administrator-invitation
description: We recommend using Organizations instead of Security Hub invitations to manage your member accounts.
flags:
    --administrator-id=!: The account ID of the Security Hub administrator account that sent the invitation.
    --invitation-id=!: The identifier of the invitation sent from the Security Hub administrator account.
documentation:
    command: |-
        We recommend using Organizations instead of Security Hub invitations to manage your member accounts. For information, see [Managing Security Hub administrator and member accounts with Organizations](https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-accounts-orgs.html) in the *Security Hub User Guide*.

        Accepts the invitation to be a member account and be monitored by the Security Hub administrator account that the invitation was sent from.

        This operation is only used by member accounts that are not added through Organizations.

        When the member account accepts the invitation, permission is granted to the administrator account to view findings generated in the member account.
    flag:
        administrator-id: The account ID of the Security Hub administrator account that sent the invitation.
        invitation-id: The identifier of the invitation sent from the Security Hub administrator account.
