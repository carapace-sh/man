name: describe-tapes
description: Returns a description of virtual tapes that correspond to the specified Amazon Resource Names (ARNs).
flags:
    --gateway-arn=!: ""
    --limit=: Specifies that the number of virtual tapes described be limited to the specified number.
    --marker=: A marker value, obtained in a previous call to `DescribeTapes`.
    --tape-arns=: Specifies one or more unique Amazon Resource Names (ARNs) that represent the virtual tapes you want to describe.
documentation:
    command: |-
        Returns a description of virtual tapes that correspond to the specified Amazon Resource Names (ARNs). If `TapeARN` is not specified, returns a description of the virtual tapes associated with the specified gateway. This operation is only supported for the tape gateway type.

        The operation supports pagination. By default, the operation returns a maximum of up to 100 tapes. You can optionally specify the `Limit` field in the body to limit the number of tapes in the response. If the number of tapes returned in the response is truncated, the response includes a `Marker` field. You can use this `Marker` value in your subsequent request to retrieve the next set of tapes.
    flag:
        gateway-arn: ""
        limit: |-
            Specifies that the number of virtual tapes described be limited to the specified number.

            Amazon Web Services may impose its own limit, if this field is not set.
        marker: |-
            A marker value, obtained in a previous call to `DescribeTapes`. This marker indicates which page of results to retrieve.

            If not specified, the first page of results is retrieved.
        tape-arns: Specifies one or more unique Amazon Resource Names (ARNs) that represent the virtual tapes you want to describe. If this parameter is not specified, Tape gateway returns a description of all virtual tapes associated with the specified gateway.
