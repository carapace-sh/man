name: create
description: Create a workload identity pool managed identity.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: A description of the managed identity.
    --disabled: Whether the managed identity is disabled.
    --location=: The location name.
    --namespace=: The ID to use for the namespace.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-disabled&: Whether the managed identity is disabled.
    --workload-identity-pool=: The ID to use for the pool, which becomes the final component of the resource name.
documentation:
    command: Create a workload identity pool managed identity.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: A description of the managed identity.
        disabled: |-
            Whether the managed identity is disabled. If disabled, credentials may no longer be issued for
            this identity. Existing credentials may continue to be accepted until they expire.
        location: |-
            The location name.
            +
            To set the `location` attribute:
            * provide the argument `managed_identity` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        namespace: |-
            The ID to use for the namespace. This value must be 2-63 characters, and may contain the
            characters [a-z0-9-]. The prefix `gcp-` is reserved for use by Google, and may not be
            specified.
            +

            To set the `namespace` attribute:
            * provide the argument `managed_identity` on the command line with a fully specified name;
            * provide the argument `--namespace` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-disabled: |-
            Whether the managed identity is disabled. If disabled, credentials may no longer be issued for
            this identity. Existing credentials may continue to be accepted until they expire.
        workload-identity-pool: |-
            The ID to use for the pool, which becomes the final component of the resource name. This value
            should be 4-32 characters, and may contain the characters [a-z0-9-]. The prefix `gcp-` is
            reserved for use by Google, and may not be specified.
            +

            To set the `workload-identity-pool` attribute:
            * provide the argument `managed_identity` on the command line with a fully specified name;
            * provide the argument `--workload-identity-pool` on the command line.
