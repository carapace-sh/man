name: delete-application-from-environment
description: Deletes a specific application from the specific runtime environment where it was previously deployed.
flags:
    --application-id=!: The unique identifier of the application you want to delete.
    --environment-id=!: The unique identifier of the runtime environment where the application was previously deployed.
documentation:
    command: Deletes a specific application from the specific runtime environment where it was previously deployed. You cannot delete a runtime environment using DeleteEnvironment if any application has ever been deployed to it. This API removes the association of the application with the runtime environment so you can delete the environment smoothly.
    flag:
        application-id: The unique identifier of the application you want to delete.
        environment-id: The unique identifier of the runtime environment where the application was previously deployed.
