name: update-contributor-insights
description: Updates the status for contributor insights for a specific table or index.
flags:
    --contributor-insights-action=!: Represents the contributor insights action.
    --contributor-insights-mode=: Specifies whether to track all access and throttled events or throttled events only for the DynamoDB table or index.
    --index-name=: The global secondary index name, if applicable.
    --table-name=!: The name of the table.
completion:
    flag:
        contributor-insights-action:
            - ENABLE
            - DISABLE
        contributor-insights-mode:
            - ACCESSED_AND_THROTTLED_KEYS
            - THROTTLED_KEYS
documentation:
    command: Updates the status for contributor insights for a specific table or index. CloudWatch Contributor Insights for DynamoDB graphs display the partition key and (if applicable) sort key of frequently accessed items and frequently throttled items in plaintext. If you require the use of Amazon Web Services Key Management Service (KMS) to encrypt this table’s partition key and sort key data with an Amazon Web Services managed key or customer managed key, you should not enable CloudWatch Contributor Insights for DynamoDB for this table.
    flag:
        contributor-insights-action: Represents the contributor insights action.
        contributor-insights-mode: Specifies whether to track all access and throttled events or throttled events only for the DynamoDB table or index.
        index-name: The global secondary index name, if applicable.
        table-name: The name of the table. You can also provide the Amazon Resource Name (ARN) of the table in this parameter.
