name: list-mail-domains
description: Lists the mail domains in a given WorkMail organization.
flags:
    --max-results=: The maximum number of results to return in a single call.
    --next-token=: The token to use to retrieve the next page of results.
    --organization-id=!: The WorkMail organization for which to list domains.
documentation:
    command: Lists the mail domains in a given WorkMail organization.
    flag:
        max-results: The maximum number of results to return in a single call.
        next-token: The token to use to retrieve the next page of results. The first call does not require a token.
        organization-id: The WorkMail organization for which to list domains.
