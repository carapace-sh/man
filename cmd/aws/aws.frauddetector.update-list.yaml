name: update-list
description: Updates a list.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The new description.
    --elements=: One or more list elements to add or replace.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the list to update.
    --update-mode=: The update mode (type).
    --variable-type=: The variable type you want to assign to the list.
completion:
    flag:
        update-mode:
            - REPLACE
            - APPEND
            - REMOVE
documentation:
    command: Updates a list.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The new description.
        elements: |-
            One or more list elements to add or replace. If you are providing the elements, make sure to specify the `updateMode` to use.

            If you are deleting all elements from the list, use `REPLACE` for the `updateMode` and provide an empty list (0 elements).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the list to update.
        update-mode: |-
            The update mode (type).

            - Use `APPEND` if you are adding elements to the list.
            - Use `REPLACE` if you replacing existing elements in the list.
            - Use `REMOVE` if you are removing elements from the list.
        variable-type: |-
            The variable type you want to assign to the list.

            You cannot update a variable type of a list that already has a variable type assigned to it. You can assign a variable type to a list only if the list does not already have a variable type.
