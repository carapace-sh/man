name: start-query-monitor-top-contributors
description: Create a query that you can use with the Network Flow Monitor query interface to return the top contributors for a monitor.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --destination-category=!: The category that you want to query top contributors for, for a specific monitor.
    --end-time=!: The timestamp that is the date and time end of the period that you want to retrieve results for with your query.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --limit=: The maximum number of top contributors to return.
    --metric-name=!: The metric that you want to query top contributors for.
    --monitor-name=!: The name of the monitor.
    --start-time=!: The timestamp that is the date and time that is the beginning of the period that you want to retrieve results for with your query.
completion:
    flag:
        destination-category:
            - INTRA_AZ
            - INTER_AZ
            - INTER_VPC
            - UNCLASSIFIED
            - AMAZON_S3
            - AMAZON_DYNAMODB
            - INTER_REGION
        metric-name:
            - ROUND_TRIP_TIME
            - TIMEOUTS
            - RETRANSMISSIONS
            - DATA_TRANSFERRED
documentation:
    command: |-
        Create a query that you can use with the Network Flow Monitor query interface to return the top contributors for a monitor. Specify the monitor that you want to create the query for.

        The call returns a query ID that you can use with [GetQueryResultsMonitorTopContributors](https://docs.aws.amazon.com/networkflowmonitor/2.0/APIReference/API_GetQueryResultsMonitorTopContributors.html) to run the query and return the top contributors for a specific monitor.

        Top contributors in Network Flow Monitor are network flows with the highest values for a specific metric type. Top contributors can be across all workload insights, for a given scope, or for a specific monitor. Use the applicable APIs for the top contributors that you want to be returned.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        destination-category: |-
            The category that you want to query top contributors for, for a specific monitor. Destination categories can be one of the following:

            - `INTRA_AZ`: Top contributor network flows within a single Availability Zone
            - `INTER_AZ`: Top contributor network flows between Availability Zones
            - `INTER_REGION`: Top contributor network flows between Regions (to the edge of another Region)
            - `INTER_VPC`: Top contributor network flows between VPCs
            - `AMAZON_S3`: Top contributor network flows to or from Amazon S3
            - `AMAZON_DYNAMODB`: Top contributor network flows to or from Amazon Dynamo DB
            - `UNCLASSIFIED`: Top contributor network flows that do not have a bucket classification
        end-time: The timestamp that is the date and time end of the period that you want to retrieve results for with your query.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        limit: The maximum number of top contributors to return.
        metric-name: The metric that you want to query top contributors for. That is, you can specify a metric with this call and return the top contributor network flows, for that type of metric, for a monitor and (optionally) within a specific category, such as network flows between Availability Zones.
        monitor-name: The name of the monitor.
        start-time: The timestamp that is the date and time that is the beginning of the period that you want to retrieve results for with your query.
