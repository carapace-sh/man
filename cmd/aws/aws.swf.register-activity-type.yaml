name: register-activity-type
description: Registers a new *activity type* along with its configuration settings in the specified domain.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --default-task-heartbeat-timeout=: If set, specifies the default maximum time before which a worker processing a task of this type must report progress by calling [RecordActivityTaskHeartbeat]().
    --default-task-list=: If set, specifies the default task list to use for scheduling tasks of this activity type.
    --default-task-priority=: The default task priority to assign to the activity type.
    --default-task-schedule-to-close-timeout=: If set, specifies the default maximum duration for a task of this activity type.
    --default-task-schedule-to-start-timeout=: If set, specifies the default maximum duration that a task of this activity type can wait before being assigned to a worker.
    --default-task-start-to-close-timeout=: If set, specifies the default maximum duration that a worker can take to process tasks of this activity type.
    --description=: A textual description of the activity type.
    --domain=!: The name of the domain in which this activity is to be registered.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the activity type within the domain.
    --version=!: The version of the activity type.
documentation:
    command: "Registers a new *activity type* along with its configuration settings in the specified domain.\n\nA `TypeAlreadyExists` fault is returned if the type already exists in the domain. You cannot change any configuration settings of the type after its registration, and it must be registered as a new version.\n\n**Access Control**\n\nYou can use IAM policies to control this action's access to Amazon SWF resources as follows:\n\n- Use a `Resource` element with the domain name to limit the action to only specified domains.\n- Use an `Action` element to allow or deny permission to call this action.\n- Constrain the following parameters by using a `Condition` element with the appropriate keys.\n  \n  - `defaultTaskList.name`: String constraint. The key is `swf:defaultTaskList.name`.\n  - `name`: String constraint. The key is `swf:name`.\n  - `version`: String constraint. The key is `swf:version`.\n\nIf the caller doesn't have sufficient permissions to invoke the action, or the parameter values fall outside the specified constraints, the action fails. The associated event attribute's `cause` parameter is set to `OPERATION_NOT_PERMITTED`. For details and example IAM policies, see [Using IAM to Manage Access to Amazon SWF Workflows](https://docs.aws.amazon.com/amazonswf/latest/developerguide/swf-dev-iam.html) in the *Amazon SWF Developer Guide*."
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        default-task-heartbeat-timeout: |-
            If set, specifies the default maximum time before which a worker processing a task of this type must report progress by calling [RecordActivityTaskHeartbeat](). If the timeout is exceeded, the activity task is automatically timed out. This default can be overridden when scheduling an activity task using the `ScheduleActivityTask` [Decision](). If the activity worker subsequently attempts to record a heartbeat or returns a result, the activity worker receives an `UnknownResource` fault. In this case, Amazon SWF no longer considers the activity task to be valid; the activity worker should clean up the activity task.

            The duration is specified in seconds, an integer greater than or equal to `0`. You can use `NONE` to specify unlimited duration.
        default-task-list: If set, specifies the default task list to use for scheduling tasks of this activity type. This default task list is used if a task list isn't provided when a task is scheduled through the `ScheduleActivityTask` [Decision]().
        default-task-priority: |-
            The default task priority to assign to the activity type. If not assigned, then `0` is used. Valid values are integers that range from Java's `Integer.MIN_VALUE` (-2147483648) to `Integer.MAX_VALUE` (2147483647). Higher numbers indicate higher priority.

            For more information about setting task priority, see [Setting Task Priority](https://docs.aws.amazon.com/amazonswf/latest/developerguide/programming-priority.html) in the *in the Amazon SWF Developer Guide.*.
        default-task-schedule-to-close-timeout: |-
            If set, specifies the default maximum duration for a task of this activity type. This default can be overridden when scheduling an activity task using the `ScheduleActivityTask` [Decision]().

            The duration is specified in seconds, an integer greater than or equal to `0`. You can use `NONE` to specify unlimited duration.
        default-task-schedule-to-start-timeout: |-
            If set, specifies the default maximum duration that a task of this activity type can wait before being assigned to a worker. This default can be overridden when scheduling an activity task using the `ScheduleActivityTask` [Decision]().

            The duration is specified in seconds, an integer greater than or equal to `0`. You can use `NONE` to specify unlimited duration.
        default-task-start-to-close-timeout: |-
            If set, specifies the default maximum duration that a worker can take to process tasks of this activity type. This default can be overridden when scheduling an activity task using the `ScheduleActivityTask` [Decision]().

            The duration is specified in seconds, an integer greater than or equal to `0`. You can use `NONE` to specify unlimited duration.
        description: A textual description of the activity type.
        domain: The name of the domain in which this activity is to be registered.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: |-
            The name of the activity type within the domain.

            The specified string must not contain a `:` (colon), `/` (slash), `|` (vertical bar), or any control characters (`\u0000-\u001f` | `\u007f-\u009f`). Also, it must *not* be the literal string `arn`.
        version: |-
            The version of the activity type.

            The activity type consists of the name and version, the combination of which must be unique within the domain.

            The specified string must not contain a `:` (colon), `/` (slash), `|` (vertical bar), or any control characters (`\u0000-\u001f` | `\u007f-\u009f`). Also, it must *not* be the literal string `arn`.
