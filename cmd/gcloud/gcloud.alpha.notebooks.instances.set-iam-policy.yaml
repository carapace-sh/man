name: set-iam-policy
description: '*(ALPHA)*  *(DEPRECATED)*  Set the IAM policy for an Instance.'
flags:
    --location=: The location of the notebook instance.
documentation:
    command: |4
        *(ALPHA)*  *(DEPRECATED)*  This command is deprecated. Please use `gcloud notebooks` instead.

        *gcloud alpha notebooks instances set-iam-policy* sets the IAM policy for a Notebook instance given an
        instance ID and a JSON or YAML file that describes the IAM policy.

        Note: Setting the IAM policy for an Instance replaces existing IAM bindings for
        that account.
    flag:
        location: |-
            The location of the notebook instance.
            +
            To set the `location` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `notebooks/location`.
