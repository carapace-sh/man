name: list-channels
description: Lists all Channels created under a single Chime App as a paginated list.
flags:
    --app-instance-arn=!: The ARN of the `AppInstance`.
    --chime-bearer=!: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of channels that you want to return.
    --next-token=: The token passed by previous API calls until all requested channels are returned.
    --privacy=: The privacy setting.
completion:
    flag:
        privacy:
            - PUBLIC
            - PRIVATE
documentation:
    command: |-
        Lists all Channels created under a single Chime App as a paginated list. You can specify filters to narrow results.

        **Functionality &amp; restrictions**

        - Use privacy = `PUBLIC` to retrieve all public channels in the account.
        - Only an `AppInstanceAdmin` can set privacy = `PRIVATE` to list the private channels in an account.

        The `x-amz-chime-bearer` request header is mandatory. Use the ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call as the value in the header.
    flag:
        app-instance-arn: The ARN of the `AppInstance`.
        chime-bearer: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The maximum number of channels that you want to return.
        next-token: The token passed by previous API calls until all requested channels are returned.
        privacy: The privacy setting. `PUBLIC` retrieves all the public channels. `PRIVATE` retrieves private channels. Only an `AppInstanceAdmin` can retrieve private channels.
