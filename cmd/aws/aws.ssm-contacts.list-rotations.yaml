name: list-rotations
description: Retrieves a list of on-call rotations.
flags:
    --max-results=: The maximum number of items to return for this call.
    --next-token=: A token to start the list.
    --rotation-name-prefix=: A filter to include rotations in list results based on their common prefix.
documentation:
    command: Retrieves a list of on-call rotations.
    flag:
        max-results: The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: A token to start the list. Use this token to get the next set of results.
        rotation-name-prefix: A filter to include rotations in list results based on their common prefix. For example, entering prod returns a list of all rotation names that begin with `prod`, such as `production` and `prod-1`.
