name: authorize-security-group-ingress
description: Adds the specified inbound (ingress) rules to a security group.
flags:
    --cidr-ip=: The IPv4 address range, in CIDR format.
    --cidr=: The IPv4 address range, in CIDR format
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --from-port=: If the protocol is TCP or UDP, this is the start of the port range.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --group-id=: The ID of the security group.
    --group-name=: \[Default VPC] The name of the security group.
    --group-owner=: The AWS account ID that owns the source security group
    --ip-permissions=:
        description: The permissions for the security group rules.
        nargs: -1
    --ip-protocol=: The IP protocol name (`tcp`, `udp`, `icmp`) or number (see [Protocol Numbers](http://www.iana.org/assignments/protocol-numbers/protocol-numbers.xhtml)). To specify all protocols, use `-1`.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --port=: The range of ports to allow or ICMP code
    --protocol=: The IP protoco
    --source-group=: The name or ID of the source security group
    --source-security-group-name=: \[Default VPC] The name of the source security group.
    --source-security-group-owner-id=: The Amazon Web Services account ID for the source security group, if the source security group is in a different account.
    --tag-specifications=:
        description: The tags applied to the security group rule.
        nargs: -1
    --to-port=: If the protocol is TCP or UDP, this is the end of the port range.
documentation:
    command: |-
        Adds the specified inbound (ingress) rules to a security group.

        An inbound rule permits instances to receive traffic from the specified IPv4 or IPv6 address range, the IP address ranges that are specified by a prefix list, or the instances that are associated with a destination security group. For more information, see [Security group rules](https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html).

        You must specify exactly one of the following sources: an IPv4 or IPv6 address range, a prefix list, or a security group. You must specify a protocol for each rule (for example, TCP). If the protocol is TCP or UDP, you must also specify a port or port range. If the protocol is ICMP or ICMPv6, you must also specify the ICMP/ICMPv6 type and code.

        Rule changes are propagated to instances associated with the security group as quickly as possible. However, a small delay might occur.

        For examples of rules that you can add to security groups for specific access scenarios, see [Security group rules for different use cases](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/security-group-rules-reference.html) in the *Amazon EC2 User Guide*.

        For more information about security group quotas, see [Amazon VPC quotas](https://docs.aws.amazon.com/vpc/latest/userguide/amazon-vpc-limits.html) in the *Amazon VPC User Guide*.
    flag:
        cidr-ip: |-
            The IPv4 address range, in CIDR format.

            Amazon Web Services [canonicalizes](https://en.wikipedia.org/wiki/Canonicalization) IPv4 and IPv6 CIDRs. For example, if you specify 100.68.0.18/18 for the CIDR block, Amazon Web Services canonicalizes the CIDR block to 100.68.0.0/18. Any subsequent DescribeSecurityGroups and DescribeSecurityGroupRules calls will return the canonicalized form of the CIDR block. Additionally, if you attempt to add another rule with the non-canonical form of the CIDR (such as 100.68.0.18/18) and there is already a rule for the canonicalized form of the CIDR block (such as 100.68.0.0/18), the API throws an duplicate rule error.

            To specify an IPv6 address range, use IP permissions instead.

            To specify multiple rules and descriptions for the rules, use IP permissions instead.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        from-port: |-
            If the protocol is TCP or UDP, this is the start of the port range. If the protocol is ICMP, this is the ICMP type or -1 (all ICMP types).

            To specify multiple rules and descriptions for the rules, use IP permissions instead.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        group-id: The ID of the security group.
        group-name: \[Default VPC] The name of the security group. For security groups for a default VPC you can specify either the ID or the name of the security group. For security groups for a nondefault VPC, you must specify the ID of the security group.
        ip-permissions: The permissions for the security group rules.
        ip-protocol: |-
            The IP protocol name (`tcp`, `udp`, `icmp`) or number (see [Protocol Numbers](http://www.iana.org/assignments/protocol-numbers/protocol-numbers.xhtml)). To specify all protocols, use `-1`.

            To specify `icmpv6`, use IP permissions instead.

            If you specify a protocol other than one of the supported values, traffic is allowed on all ports, regardless of any ports that you specify.

            To specify multiple rules and descriptions for the rules, use IP permissions instead.
        source-security-group-name: |-
            \[Default VPC] The name of the source security group.

            The rule grants full ICMP, UDP, and TCP access. To create a rule with a specific protocol and port range, specify a set of IP permissions instead.
        source-security-group-owner-id: |-
            The Amazon Web Services account ID for the source security group, if the source security group is in a different account.

            The rule grants full ICMP, UDP, and TCP access. To create a rule with a specific protocol and port range, use IP permissions instead.
        tag-specifications: The tags applied to the security group rule.
        to-port: |-
            If the protocol is TCP or UDP, this is the end of the port range. If the protocol is ICMP, this is the ICMP code or -1 (all ICMP codes). If the start port is -1 (all ICMP types), then the end port must be -1 (all ICMP codes).

            To specify multiple rules and descriptions for the rules, use IP permissions instead.
