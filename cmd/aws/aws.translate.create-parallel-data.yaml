name: create-parallel-data
description: Creates a parallel data resource in Amazon Translate by importing an input file from Amazon S3.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=!: A unique identifier for the request.
    --description=: A custom description for the parallel data resource in Amazon Translate.
    --encryption-key=: ""
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: A custom name for the parallel data resource in Amazon Translate.
    --parallel-data-config=!: Specifies the format and S3 location of the parallel data input file.
    --tags=:
        description: Tags to be associated with this resource.
        nargs: -1
documentation:
    command: Creates a parallel data resource in Amazon Translate by importing an input file from Amazon S3. Parallel data files contain examples that show how you want segments of text to be translated. By adding parallel data, you can influence the style, tone, and word choice in your translation output.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique identifier for the request. This token is automatically generated when you use Amazon Translate through an AWS SDK.
        description: A custom description for the parallel data resource in Amazon Translate.
        encryption-key: ""
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: A custom name for the parallel data resource in Amazon Translate. You must assign a name that is unique in the account and region.
        parallel-data-config: Specifies the format and S3 location of the parallel data input file.
        tags: Tags to be associated with this resource. A tag is a key-value pair that adds metadata to a resource. Each tag key for the resource must be unique. For more information, see [Tagging your resources](https://docs.aws.amazon.com/translate/latest/dg/tagging.html).
