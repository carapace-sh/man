name: proxy-config
description: '*(BETA)*  Retrieve a configuration summary for a given Envoy instance.'
flags:
    --fqdn=: Filter clusters by substring of Service FQDN field.
    --location=: Location for the membership.
    --membership=!: ID of the membership or fully qualified identifier for the membership.
    --no-show-exec-error&: If true and command fails, print the underlying command that was executed and its exit status.
    --output=: Return the detailed proxy config.
    --show-exec-error&: If true and command fails, print the underlying command that was executed and its exit status.
    --type=!: Proxy configuration type to retrieve.
completion:
    flag:
        output:
            - json
            - yaml
        type:
            - bootstrap
            - cluster
            - clusters
            - endpoint
            - endpoints
            - listener
            - listeners
            - log
            - route
            - routes
            - secret
            - secrets
documentation:
    command: '*(BETA)*  Retrieve a configuration summary for a given Envoy instance.'
    flag:
        fqdn: Filter clusters by substring of Service FQDN field. If unspecified, all clusters will be included in the output"
        location: |-
            Location for the membership.
            +
            To set the `location` attribute:
            * provide the argument `--membership` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkehub/location`.
        membership: |-
            ID of the membership or fully qualified identifier for the membership.
            +
            To set the `membership` attribute:
            * provide the argument `--membership` on the command line.
        no-show-exec-error: If true and command fails, print the underlying command that was executed and its exit status.
        output: 'Return the detailed proxy config. The output format is either json or yaml. _OUTPUT_ must be one of: *json*, *yaml*.'
        show-exec-error: If true and command fails, print the underlying command that was executed and its exit status.
        type: "Proxy configuration type to retrieve. \n+\n  bootstrap            Retrieves bootstrap configuration for the Envoy in the specified pod \n clusters/cluster     Retrieves cluster configuration for the Envoy in the specified pod \n endpoints/endpoint   Retrieves endpoint configuration for the Envoy in the specified pod \n listeners/listener   Retrieves listener configuration for the Envoy in the specified pod \n log                  Retrieves logging levels of the Envoy in the specified pod \n routes/route         Retrieves route configuration for the Envoy in the specified pod \n secrets/secret       Retrieves secret configuration for the Envoy in the specified pod\n+\n_TYPE_ must be one of: *bootstrap*, *cluster*, *clusters*, *endpoint*, *endpoints*, *listener*, *listeners*, *log*, *route*, *routes*, *secret*, *secrets*."
