name: list-experiment-resolved-targets
description: Lists the resolved targets information of the specified experiment.
flags:
    --experiment-id=!: The ID of the experiment.
    --max-results=: The maximum number of results to return with a single call.
    --next-token=: The token for the next page of results.
    --target-name=: The name of the target.
documentation:
    command: Lists the resolved targets information of the specified experiment.
    flag:
        experiment-id: The ID of the experiment.
        max-results: The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned nextToken value.
        next-token: The token for the next page of results.
        target-name: The name of the target.
