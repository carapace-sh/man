name: update
description: '*(ALPHA)*  Update disk settings.'
flags:
    --access-location-policy=: The access location policy for disk settings.
    --add-access-locations=: Access locations to add to disk settings
    --region=: region for disk settings
    --remove-access-locations=: Access locations to remove from disk settings
    --zone=: Zone for disk settings
completion:
    flag:
        access-location-policy:
            - all-regions
            - specific-regions
documentation:
    command: '*(ALPHA)*  Update disk settings.'
    flag:
        access-location-policy: |-
            The access location policy for disk settings. _ACCESS_LOCATION_POLICY_ must be one of:
            +
            *all-regions*::: All regions will be allowed to access the source disk.
            *specific-regions*::: Only the specified regions will be allowed to access the source disk.
            :::
            +
        add-access-locations: Access locations to add to disk settings
        region: region for disk settings
        remove-access-locations: Access locations to remove from disk settings
        zone: Zone for disk settings
