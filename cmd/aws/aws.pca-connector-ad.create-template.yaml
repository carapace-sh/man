name: create-template
description: Creates an Active Directory compatible certificate template.
flags:
    --client-token=: Idempotency token.
    --connector-arn=!: The Amazon Resource Name (ARN) that was returned when you called [CreateConnector](https://docs.aws.amazon.com/pca-connector-ad/latest/APIReference/API_CreateConnector.html).
    --definition=!: Template configuration to define the information included in certificates.
    --name=!: Name of the template.
    --tags=: Metadata assigned to a template consisting of a key-value pair.
documentation:
    command: Creates an Active Directory compatible certificate template. The connectors issues certificates using these templates based on the requester’s Active Directory group membership.
    flag:
        client-token: Idempotency token.
        connector-arn: The Amazon Resource Name (ARN) that was returned when you called [CreateConnector](https://docs.aws.amazon.com/pca-connector-ad/latest/APIReference/API_CreateConnector.html).
        definition: Template configuration to define the information included in certificates. Define certificate validity and renewal periods, certificate request handling and enrollment options, key usage extensions, application policies, and cryptography settings.
        name: Name of the template. The template name must be unique.
        tags: Metadata assigned to a template consisting of a key-value pair.
