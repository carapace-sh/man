name: delete-distribution
description: Deletes your Amazon Lightsail content delivery network (CDN) distribution.
flags:
    --distribution-name=: The name of the distribution to delete.
documentation:
    command: Deletes your Amazon Lightsail content delivery network (CDN) distribution.
    flag:
        distribution-name: |-
            The name of the distribution to delete.

            Use the `GetDistributions` action to get a list of distribution names that you can specify.
