name: list-audit-suppressions
description: Lists your Device Defender audit listings.
flags:
    --ascending-order=: Determines whether suppressions are listed in ascending order by expiration date or not.
    --check-name=: ""
    --max-results=: The maximum number of results to return at one time.
    --next-token=: The token for the next set of results.
    --resource-identifier=: ""
documentation:
    command: |-
        Lists your Device Defender audit listings.

        Requires permission to access the [ListAuditSuppressions](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        ascending-order: Determines whether suppressions are listed in ascending order by expiration date or not. If parameter isn't provided, `ascendingOrder=true`.
        check-name: ""
        max-results: The maximum number of results to return at one time. The default is 25.
        next-token: The token for the next set of results.
        resource-identifier: ""
