name: activate-key-signing-key
description: Activates a key-signing key (KSK) so that it can be used for signing by DNSSEC.
flags:
    --hosted-zone-id=!: A unique string used to identify a hosted zone.
    --name=!: A string used to identify a key-signing key (KSK).
documentation:
    command: Activates a key-signing key (KSK) so that it can be used for signing by DNSSEC. This operation changes the KSK status to `ACTIVE`.
    flag:
        hosted-zone-id: A unique string used to identify a hosted zone.
        name: A string used to identify a key-signing key (KSK). `Name` can include numbers, letters, and underscores (\_). `Name` must be unique for each key-signing key in the same hosted zone.
