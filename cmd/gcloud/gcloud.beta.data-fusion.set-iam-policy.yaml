name: set-iam-policy
description: '*(BETA)*  Sets the IAM policy for a Cloud Data Fusion instance.'
flags:
    --location=: Compute Engine region in which to create the instance.
    --namespace=: CDAP Namespace whose IAM policy we wish to set.
documentation:
    command: |-
        ## EXAMPLES

        To set the policy for instance `my-instance` in project `my-project`, location
        in `my-location`, and zone in `my-zone` run:

        $ gcloud beta data-fusion set-iam-policy my-instance policy-file.yaml --project=my-project \
          --location=my-location

        To do the same in a particular namespace, run:
        $ gcloud beta data-fusion set-iam-policy my-instance policy-file.yaml --project=my-project \
          --location=my-location [--namespace=NAMESPACE]
    flag:
        location: |-
            Compute Engine region in which to create the instance.
            +
            To set the `location` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `datafusion/location`.
        namespace: 'CDAP Namespace whose IAM policy we wish to set. For example: `--namespace=my-namespace`.'
