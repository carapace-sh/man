name: delete-case-rule
description: Deletes a case rule.
flags:
    --case-rule-id=!: Unique identifier of a case rule.
    --domain-id=!: Unique identifier of a Cases domain.
documentation:
    command: Deletes a case rule. In the Amazon Connect admin website, case rules are known as *case field conditions*. For more information about case field conditions, see [Add case field conditions to a case template](https://docs.aws.amazon.com/connect/latest/adminguide/case-field-conditions.html).
    flag:
        case-rule-id: Unique identifier of a case rule.
        domain-id: Unique identifier of a Cases domain.
