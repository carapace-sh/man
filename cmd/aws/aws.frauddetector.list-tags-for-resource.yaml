name: list-tags-for-resource
description: Lists all tags associated with the resource.
flags:
    --max-results=: The maximum number of objects to return for the request.
    --next-token=: The next token from the previous results.
    --resource-arn=!: The ARN that specifies the resource whose tags you want to list.
documentation:
    command: Lists all tags associated with the resource. This is a paginated API. To get the next page results, provide the pagination token from the response as part of your request. A null pagination token fetches the records from the beginning.
    flag:
        max-results: The maximum number of objects to return for the request.
        next-token: The next token from the previous results.
        resource-arn: The ARN that specifies the resource whose tags you want to list.
