name: disassociate-enclave-certificate-iam-role
description: Disassociates an IAM role from an Certificate Manager (ACM) certificate.
flags:
    --certificate-arn=!: The ARN of the ACM certificate from which to disassociate the IAM role.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --role-arn=!: The ARN of the IAM role to disassociate.
documentation:
    command: Disassociates an IAM role from an Certificate Manager (ACM) certificate. Disassociating an IAM role from an ACM certificate removes the Amazon S3 object that contains the certificate, certificate chain, and encrypted private key from the Amazon S3 bucket. It also revokes the IAM role's permission to use the KMS key used to encrypt the private key. This effectively revokes the role's permission to use the certificate.
    flag:
        certificate-arn: The ARN of the ACM certificate from which to disassociate the IAM role.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        role-arn: The ARN of the IAM role to disassociate.
