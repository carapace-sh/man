name: create-transit-gateway-peering-attachment
description: Requests a transit gateway peering attachment between the specified transit gateway (requester) and a peer transit gateway (accepter).
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --options=: Requests a transit gateway peering attachment.
    --peer-account-id=!: The ID of the Amazon Web Services account that owns the peer transit gateway.
    --peer-region=!: The Region where the peer transit gateway is located.
    --peer-transit-gateway-id=!: The ID of the peer transit gateway with which to create the peering attachment.
    --tag-specifications=:
        description: The tags to apply to the transit gateway peering attachment.
        nargs: -1
    --transit-gateway-id=!: The ID of the transit gateway.
documentation:
    command: |-
        Requests a transit gateway peering attachment between the specified transit gateway (requester) and a peer transit gateway (accepter). The peer transit gateway can be in your account or a different Amazon Web Services account.

        After you create the peering attachment, the owner of the accepter transit gateway must accept the attachment request.
