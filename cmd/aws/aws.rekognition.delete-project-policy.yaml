name: delete-project-policy
description: This operation applies only to Amazon Rekognition Custom Labels.
flags:
    --policy-name=!: The name of the policy that you want to delete.
    --policy-revision-id=: The ID of the project policy revision that you want to delete.
    --project-arn=!: The Amazon Resource Name (ARN) of the project that the project policy you want to delete is attached to.
documentation:
    command: |-
        This operation applies only to Amazon Rekognition Custom Labels.

        Deletes an existing project policy.

        To get a list of project policies attached to a project, call [ListProjectPolicies](). To attach a project policy to a project, call [PutProjectPolicy]().

        This operation requires permissions to perform the `rekognition:DeleteProjectPolicy` action.
    flag:
        policy-name: The name of the policy that you want to delete.
        policy-revision-id: The ID of the project policy revision that you want to delete.
        project-arn: The Amazon Resource Name (ARN) of the project that the project policy you want to delete is attached to.
