name: create-safety-rule
description: Creates a safety rule in a control panel.
flags:
    --assertion-rule=: The assertion rule requested.
    --client-token=: A unique, case-sensitive string of up to 64 ASCII characters.
    --gating-rule=: The gating rule requested.
    --tags=: The tags associated with the safety rule.
documentation:
    command: |-
        Creates a safety rule in a control panel. Safety rules let you add safeguards around changing routing control states, and for enabling and disabling routing controls, to help prevent unexpected outcomes.

        There are two types of safety rules: assertion rules and gating rules.

        Assertion rule: An assertion rule enforces that, when you change a routing control state, that a certain criteria is met. For example, the criteria might be that at least one routing control state is On after the transaction so that traffic continues to flow to at least one cell for the application. This ensures that you avoid a fail-open scenario.

        Gating rule: A gating rule lets you configure a gating routing control as an overall "on/off" switch for a group of routing controls. Or, you can configure more complex gating scenarios, for example by configuring multiple gating routing controls.

        For more information, see [Safety rules](https://docs.aws.amazon.com/r53recovery/latest/dg/routing-control.safety-rules.html) in the Amazon Route 53 Application Recovery Controller Developer Guide.
    flag:
        assertion-rule: The assertion rule requested.
        client-token: A unique, case-sensitive string of up to 64 ASCII characters. To make an idempotent API request with an action, specify a client token in the request.
        gating-rule: The gating rule requested.
        tags: The tags associated with the safety rule.
