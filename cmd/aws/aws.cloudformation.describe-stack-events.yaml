name: describe-stack-events
description: Returns all stack related events for a specified stack in reverse chronological order.
flags:
    --next-token=: The token for the next set of items to return.
    --stack-name=!: 'The name or the unique stack ID that''s associated with the stack, which aren''t always interchangeable:'
documentation:
    command: |-
        Returns all stack related events for a specified stack in reverse chronological order. For more information about a stack's event history, see [Understand CloudFormation stack creation events](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stack-resource-configuration-complete.html) in the *CloudFormation User Guide*.

        You can list events for stacks that have failed to create or have been deleted by specifying the unique stack identifier (stack ID).
    flag:
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
        stack-name: |-
            The name or the unique stack ID that's associated with the stack, which aren't always interchangeable:

            - Running stacks: You can specify either the stack's name or its unique stack ID.
            - Deleted stacks: You must specify the unique stack ID.
