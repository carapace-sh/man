name: untag-resource
description: Deletes the metadata tags from the Amazon RDS Performance Insights resource.
flags:
    --resource-arn=!: The Amazon RDS Performance Insights resource that the tags are added to.
    --service-type=!: List the tags for the Amazon Web Services service for which Performance Insights returns metrics.
    --tag-keys=!: The metadata assigned to an Amazon RDS Performance Insights resource consisting of a key-value pair.
completion:
    flag:
        service-type:
            - RDS
            - DOCDB
documentation:
    command: Deletes the metadata tags from the Amazon RDS Performance Insights resource.
    flag:
        resource-arn: The Amazon RDS Performance Insights resource that the tags are added to. This value is an Amazon Resource Name (ARN). For information about creating an ARN, see [Constructing an RDS Amazon Resource Name (ARN)](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_Tagging.ARN.html#USER_Tagging.ARN.Constructing).
        service-type: List the tags for the Amazon Web Services service for which Performance Insights returns metrics. Valid value is `RDS`.
        tag-keys: The metadata assigned to an Amazon RDS Performance Insights resource consisting of a key-value pair.
