name: undeploy-model
description: '*(ALPHA)*  Undeploy a model from an existing Vertex AI endpoint.'
flags:
    --deployed-model-id=!: Id of the deployed model.
    --region=: Cloud region for the endpoint.
    --traffic-split=: List of pairs of deployed model id and value to set as traffic split.
documentation:
    command: |-
        ## EXAMPLES

        To undeploy a model ``456'' from an endpoint ``123'' under project ``example''
        in region ``us-central1'', run:

          $ gcloud alpha ai endpoints undeploy-model 123 --project=example --region=us-central1
          --deployed-model-id=456
    flag:
        deployed-model-id: Id of the deployed model.
        region: |-
            Cloud region for the endpoint.
            +
            To set the `region` attribute:
            * provide the argument `endpoint` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
        traffic-split: List of pairs of deployed model id and value to set as traffic split.
