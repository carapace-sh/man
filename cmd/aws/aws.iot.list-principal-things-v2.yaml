name: list-principal-things-v2
description: Lists the things associated with the specified principal.
flags:
    --max-results=: The maximum number of results to return in this operation.
    --next-token=: To retrieve the next set of results, the `nextToken` value from a previous response; otherwise **null** to receive the first set of results.
    --principal=!: The principal.
    --thing-principal-type=: The type of the relation you want to filter in the response.
completion:
    flag:
        thing-principal-type:
            - EXCLUSIVE_THING
            - NON_EXCLUSIVE_THING
documentation:
    command: |-
        Lists the things associated with the specified principal. A principal can be an X.509 certificate or an Amazon Cognito ID.

        Requires permission to access the [ListPrincipalThings](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        max-results: The maximum number of results to return in this operation.
        next-token: To retrieve the next set of results, the `nextToken` value from a previous response; otherwise **null** to receive the first set of results.
        principal: The principal. A principal can be an X.509 certificate or an Amazon Cognito ID.
        thing-principal-type: |-
            The type of the relation you want to filter in the response. If no value is provided in this field, the response will list all things, including both the `EXCLUSIVE_THING` and `NON_EXCLUSIVE_THING` attachment types.

            - `EXCLUSIVE_THING` - Attaches the specified principal to the specified thing, exclusively. The thing will be the only thing that’s attached to the principal.

            <!--THE END-->

            - `NON_EXCLUSIVE_THING` - Attaches the specified principal to the specified thing. Multiple things can be attached to the principal.
