name: delete-template
description: Deletes a template.
flags:
    --template-arn=!: The Amazon Resource Name (ARN) that was returned when you called [CreateTemplate](https://docs.aws.amazon.com/pca-connector-ad/latest/APIReference/API_CreateTemplate.html).
documentation:
    command: Deletes a template. Certificates issued using the template are still valid until they are revoked or expired.
    flag:
        template-arn: The Amazon Resource Name (ARN) that was returned when you called [CreateTemplate](https://docs.aws.amazon.com/pca-connector-ad/latest/APIReference/API_CreateTemplate.html).
