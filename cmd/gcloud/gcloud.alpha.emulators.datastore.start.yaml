name: start
description: '*(ALPHA)*  Start a local datastore emulator.'
flags:
    --consistency=: Fraction of eventually consistent operations that should succeed immediately.
    --data-dir=: The directory to be used to store/retrieve data/config for an emulator run.
    --host-port=: The host:port to which the emulator should be bound.
    --no-store-on-disk&: Whether data should be persisted to disk.
    --no-use-firestore-in-datastore-mode&: Runs the emulator in Cloud Firestore in Datastore Mode.
    --store-on-disk: Whether data should be persisted to disk.
    --use-firestore-in-datastore-mode: Runs the emulator in Cloud Firestore in Datastore Mode.
documentation:
    command: '*(ALPHA)*  This command starts a local datastore emulator.'
    flag:
        consistency: Fraction of eventually consistent operations that should succeed immediately. Setting to 1.0 can be useful for unit tests, but may mask incorrect assumptions about non-ancestor queries which are eventually consistent.
        data-dir: |-
            The directory to be used to store/retrieve data/config for an emulator run. The default value is `<USER_CONFIG_DIR>/emulators/datastore`. The value of USER_CONFIG_DIR can be found by running:
            +
              $ gcloud info --format='get(config.paths.global_config_dir)'
        host-port: |-
            The host:port to which the emulator should be bound. Can take the form of a single address (hostname, IPv4, or IPv6) and/or port:
            +
              [ADDRESS][:PORT]
            +
            In this format you must enclose IPv6 addresses in square brackets: e.g.
            +
              [2001:db8:0:0:0:ff00:42:8329]:8080
            +
            The default value is localhost:8081.
        no-store-on-disk: Whether data should be persisted to disk.
        no-use-firestore-in-datastore-mode: Runs the emulator in Cloud Firestore in Datastore Mode. Reads are always strongly consistent and --consistency flag may not be specified.
        store-on-disk: Whether data should be persisted to disk. Enabled by default, use *--no-store-on-disk* to disable.
        use-firestore-in-datastore-mode: Runs the emulator in Cloud Firestore in Datastore Mode. Reads are always strongly consistent and --consistency flag may not be specified.
