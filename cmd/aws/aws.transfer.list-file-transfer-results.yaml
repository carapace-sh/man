name: list-file-transfer-results
description: Returns real-time updates and detailed information on the status of each individual file being transferred in a specific file transfer operation.
flags:
    --connector-id=!: A unique identifier for a connector.
    --max-results=: The maximum number of files to return in a single page.
    --next-token=: If there are more file details than returned in this call, use this value for a subsequent call to `ListFileTransferResults` to retrieve them.
    --transfer-id=!: A unique identifier for a file transfer.
documentation:
    command: |-
        Returns real-time updates and detailed information on the status of each individual file being transferred in a specific file transfer operation. You specify the file transfer by providing its `ConnectorId` and its `TransferId`.

        File transfer results are available up to 7 days after an operation has been requested.
    flag:
        connector-id: A unique identifier for a connector. This value should match the value supplied to the corresponding `StartFileTransfer` call.
        max-results: The maximum number of files to return in a single page. Note that currently you can specify a maximum of 10 file paths in a single [StartFileTransfer](https://docs.aws.amazon.com/transfer/latest/APIReference/API_StartFileTransfer.html) operation. Thus, the maximum number of file transfer results that can be returned in a single page is 10.
        next-token: If there are more file details than returned in this call, use this value for a subsequent call to `ListFileTransferResults` to retrieve them.
        transfer-id: A unique identifier for a file transfer. This value should match the value supplied to the corresponding `StartFileTransfer` call.
