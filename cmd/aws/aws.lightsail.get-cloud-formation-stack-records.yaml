name: get-cloud-formation-stack-records
description: Returns the CloudFormation stack record created as a result of the `create cloud formation stack` operation.
flags:
    --page-token=: The token to advance to the next page of results from your request.
documentation:
    command: |-
        Returns the CloudFormation stack record created as a result of the `create cloud formation stack` operation.

        An AWS CloudFormation stack is used to create a new Amazon EC2 instance from an exported Lightsail snapshot.
    flag:
        page-token: |-
            The token to advance to the next page of results from your request.

            To get a page token, perform an initial `GetClouFormationStackRecords` request. If your results are paginated, the response will return a next page token that you can specify as the page token in a subsequent request.
