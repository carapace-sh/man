name: batch-create-channel-membership
description: Adds a specified number of users and bots to a channel.
flags:
    --channel-arn=!: The ARN of the channel to which you're adding users or bots.
    --chime-bearer=!: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --member-arns=!:
        description: The ARNs of the members you want to add to the channel.
        nargs: -1
    --sub-channel-id=: The ID of the SubChannel in the request.
    --type=: The membership type of a user, `DEFAULT` or `HIDDEN`.
completion:
    flag:
        type:
            - DEFAULT
            - HIDDEN
documentation:
    command: Adds a specified number of users and bots to a channel.
    flag:
        channel-arn: The ARN of the channel to which you're adding users or bots.
        chime-bearer: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        member-arns: The ARNs of the members you want to add to the channel. Only `AppInstanceUsers` and `AppInstanceBots` can be added as a channel member.
        sub-channel-id: |-
            The ID of the SubChannel in the request.

            Only required when creating membership in a SubChannel for a moderator in an elastic channel.
        type: The membership type of a user, `DEFAULT` or `HIDDEN`. Default members are always returned as part of `ListChannelMemberships`. Hidden members are only returned if the type filter in `ListChannelMemberships` equals `HIDDEN`. Otherwise hidden members are not returned. This is only supported by moderators.
