name: disassociate-aws-account-from-partner-account
description: Disassociates your AWS account from a partner account.
flags:
    --partner-account-id=!: The partner account ID to disassociate from the AWS account.
    --partner-type=!: The partner type.
completion:
    flag:
        partner-type:
            - Sidewalk
documentation:
    command: Disassociates your AWS account from a partner account. If `PartnerAccountId` and `PartnerType` are `null`, disassociates your AWS account from all partner accounts.
    flag:
        partner-account-id: The partner account ID to disassociate from the AWS account.
        partner-type: The partner type.
