name: analyze
description: '*(BETA)*  Analyze a batch job.'
hidden: true
flags:
    --location=: Dataproc location for the batch.
    --timeout=&: Client side timeout on how long to wait for Dataproc operations.
documentation:
    command: '*(BETA)*  Analyze a batch job.'
    flag:
        location: |-
            Dataproc location for the batch. Each Dataproc location constitutes an independent resource namespace constrained to deploying instances into Compute Engine zones inside the location. Overrides the default `dataproc/location` property value for this command invocation.
            +
            To set the `location` attribute:
            * provide the argument `batch` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataproc/location`.
        timeout: Client side timeout on how long to wait for Dataproc operations. See $ gcloud topic datetimes for information on duration formats.
