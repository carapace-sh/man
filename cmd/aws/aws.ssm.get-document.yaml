name: get-document
description: Gets the contents of the specified Amazon Web Services Systems Manager document (SSM document).
flags:
    --document-format=: Returns the document in the specified format.
    --document-version=: The document version for which you want information.
    --name=!: The name of the SSM document.
    --version-name=: An optional field specifying the version of the artifact associated with the document.
completion:
    flag:
        document-format:
            - YAML
            - JSON
            - TEXT
documentation:
    command: Gets the contents of the specified Amazon Web Services Systems Manager document (SSM document).
    flag:
        document-format: Returns the document in the specified format. The document format can be either JSON or YAML. JSON is the default format.
        document-version: The document version for which you want information.
        name: The name of the SSM document.
        version-name: An optional field specifying the version of the artifact associated with the document. For example, 12.6. This value is unique across all versions of a document and can't be changed.
