name: subscribe
description: '*(ALPHA)*  Stream messages from a Pub/Sub Lite subscription.'
flags:
    --auto-ack: Automatically ACK every message received on this subscription.
    --location=: ID of the location of the Pub/Sub Lite resource.
    --no-auto-ack&: Automatically ACK every message received on this subscription.
    --num-messages=: The number of messages to stream before exiting.
    --partitions=: The partitions this subscriber should connect to to receive
documentation:
    command: |
        *(ALPHA)*  Streams messages from a Pub/Sub Lite subscription. This command
        requires Python 3.6 or greater, and requires the grpcio Python package
        to be installed.

        For MacOS, Linux, and Cloud Shell users, to install the gRPC client
        libraries, run:

          $ sudo pip3 install grpcio
          $ export CLOUDSDK_PYTHON_SITEPACKAGES=1
    flag:
        auto-ack: Automatically ACK every message received on this subscription.
        location: |-
            ID of the location of the Pub/Sub Lite resource.
            +

            To set the `location` attribute:
            * provide the argument `subscription` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-auto-ack: Automatically ACK every message received on this subscription.
        num-messages: |-
            The number of messages to stream before exiting. This value must
                    be less than or equal to 1000.
        partitions: |-
            The partitions this subscriber should connect to to receive
                    messages. If empty, partitions will be automatically assigned.
