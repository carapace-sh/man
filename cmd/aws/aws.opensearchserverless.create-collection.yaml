name: create-collection
description: Creates a new OpenSearch Serverless collection.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Unique, case-sensitive identifier to ensure idempotency of the request.
    --description=: Description of the collection.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: Name of the collection.
    --standby-replicas=: Indicates whether standby replicas should be used for a collection.
    --tags=: An arbitrary set of tags (key–value pairs) to associate with the OpenSearch Serverless collection.
    --type=: The type of collection.
completion:
    flag:
        standby-replicas:
            - ENABLED
            - DISABLED
        type:
            - SEARCH
            - TIMESERIES
            - VECTORSEARCH
documentation:
    command: Creates a new OpenSearch Serverless collection. For more information, see [Creating and managing Amazon OpenSearch Serverless collections](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-manage.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
