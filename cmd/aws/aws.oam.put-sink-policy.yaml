name: put-sink-policy
description: Creates or updates the resource policy that grants permissions to source accounts to link to the monitoring account sink.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --policy=!: The JSON policy to use.
    --sink-identifier=!: The ARN of the sink to attach this policy to.
documentation:
    command: |-
        Creates or updates the resource policy that grants permissions to source accounts to link to the monitoring account sink. When you create a sink policy, you can grant permissions to all accounts in an organization or to individual accounts.

        You can also use a sink policy to limit the types of data that is shared. The six types of services with their respective resource types that you can allow or deny are:

        - **Metrics** - Specify with `AWS::CloudWatch::Metric`
        - **Log groups** - Specify with `AWS::Logs::LogGroup`
        - **Traces** - Specify with `AWS::XRay::Trace`
        - **Application Insights - Applications** - Specify with `AWS::ApplicationInsights::Application`
        - **Internet Monitor** - Specify with `AWS::InternetMonitor::Monitor`
        - **Application Signals** - Specify with `AWS::ApplicationSignals::Service` and `AWS::ApplicationSignals::ServiceLevelObjective`

        See the examples in this section to see how to specify permitted source accounts and data types.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        policy: |-
            The JSON policy to use. If you are updating an existing policy, the entire existing policy is replaced by what you specify here.

            The policy must be in JSON string format with quotation marks escaped and no newlines.

            For examples of different types of policies, see the **Examples** section on this page.
        sink-identifier: The ARN of the sink to attach this policy to.
