name: describe
description: Describe a Bare Metal Solution LUN.
flags:
    --region=: Region of the resource.
    --volume=: Bare Metal Solution volume.
documentation:
    command: |
        Describe a Bare Metal Solution logical unit number (LUN).
    flag:
        region: |-
            Region of the resource.
            +
            To set the `region` attribute:
            * provide the argument `lun` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
        volume: |-
            Bare Metal Solution volume.
            +
            To set the `volume` attribute:
            * provide the argument `lun` on the command line with a fully specified name;
            * provide the argument `--volume` on the command line.
