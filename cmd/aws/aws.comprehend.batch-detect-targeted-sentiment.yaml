name: batch-detect-targeted-sentiment
description: Inspects a batch of documents and returns a sentiment analysis for each entity identified in the documents.
flags:
    --language-code=!: The language of the input documents.
    --text-list=!: A list containing the UTF-8 encoded text of the input documents.
completion:
    flag:
        language-code:
            - en
            - es
            - fr
            - de
            - it
            - pt
            - ar
            - hi
            - ja
            - ko
            - zh
            - zh-TW
documentation:
    command: |-
        Inspects a batch of documents and returns a sentiment analysis for each entity identified in the documents.

        For more information about targeted sentiment, see [Targeted sentiment](https://docs.aws.amazon.com/comprehend/latest/dg/how-targeted-sentiment.html) in the *Amazon Comprehend Developer Guide*.
    flag:
        language-code: The language of the input documents. Currently, English is the only supported language.
        text-list: A list containing the UTF-8 encoded text of the input documents. The list can contain a maximum of 25 documents. The maximum size of each document is 5 KB.
