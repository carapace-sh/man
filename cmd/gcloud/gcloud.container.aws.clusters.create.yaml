name: create
description: '*(DEPRECATED)*  Create an Anthos cluster on AWS.'
flags:
    --admin-groups=: Groups of users that can perform operations as a cluster administrator.
    --admin-users=: Users that can perform operations as a cluster administrator.
    --annotations=: Annotations for the cluster.
    --async: Return immediately, without waiting for the operation in progress to
    --aws-region=!: AWS region to deploy the cluster.
    --binauthz-evaluation-mode=: Set Binary Authorization evaluation mode for this cluster.
    --cluster-version=!: Kubernetes version to use for the cluster.
    --config-encryption-kms-key-arn=!: Amazon Resource Name (ARN) of the AWS KMS key to encrypt the user data.
    --database-encryption-kms-key-arn=!: Amazon Resource Name (ARN) of the AWS KMS key to encrypt the cluster secrets.
    --description=: Description for the cluster.
    --disable-per-node-pool-sg-rules: Disable the default per node pool subnet security group rules on the control plane security group.
    --enable-managed-prometheus: Enables managed collection for Managed Service for Prometheus in the cluster.
    --fleet-project=!: ID or number of the Fleet host project where the cluster is registered.
    --iam-instance-profile=!: Name or ARN of the IAM instance profile associated with the cluster.
    --instance-type=: AWS EC2 instance type for the control plane's nodes.
    --location=: Google Cloud location for the cluster.
    --logging=: Set the components that have logging enabled.
    --main-volume-iops=: Number of I/O operations per second (IOPS) to provision for the main volume.
    --main-volume-kms-key-arn=: Amazon Resource Name (ARN) of the AWS KMS key to encrypt the main volume.
    --main-volume-size=: Size of the main volume.
    --main-volume-throughput=: Throughput to provision for the main volume, in MiB/s.
    --main-volume-type=: Type of the main volume.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-disable-per-node-pool-sg-rules&: Disable the default per node pool subnet security group rules on the control plane security group.
    --no-enable-managed-prometheus&: ""
    --no-validate-only&: Validate the cluster to create, but don't actually perform it.
    --pod-address-cidr-blocks=!: IP address range for the pods in this cluster in CIDR notation (e.g. 10.0.0.0/8).
    --proxy-secret-arn=!: ARN of the AWS Secrets Manager secret that contains a proxy configuration.
    --proxy-secret-version-id=!: Version ID string of the AWS Secrets Manager secret that contains a proxy configuration.
    --role-arn=!: Amazon Resource Name (ARN) of the IAM role to assume when managing AWS resources.
    --role-session-name=: Identifier for the assumed role session.
    --root-volume-iops=: Number of I/O operations per second (IOPS) to provision for the root volume.
    --root-volume-kms-key-arn=: Amazon Resource Name (ARN) of the AWS KMS key to encrypt the root volume.
    --root-volume-size=: Size of the root volume.
    --root-volume-throughput=: Throughput to provision for the root volume, in MiB/s.
    --root-volume-type=: Type of the root volume.
    --security-group-ids=: IDs of additional security groups to add to the control plane's nodes.
    --service-address-cidr-blocks=!: IP address range for the services IPs in CIDR notation (e.g. 10.0.0.0/8).
    --ssh-ec2-key-pair=: Name of the EC2 key pair authorized to login to the control plane's nodes.
    --subnet-ids=!: Subnet ID of an existing VNET to use for the cluster control plane.
    --tags=: Applies the given tags (comma separated) on the cluster.
    --validate-only: Validate the cluster to create, but don't actually perform it.
    --vpc-id=!: VPC associated with the cluster.
completion:
    flag:
        binauthz-evaluation-mode:
            - DISABLED
            - PROJECT_SINGLETON_POLICY_ENFORCE
        main-volume-type:
            - gp2
            - gp3
        root-volume-type:
            - gp2
            - gp3
documentation:
    command: |+
        *(DEPRECATED)*  Create an Anthos cluster on AWS.

        This command is deprecated. See https://cloud.google.com/kubernetes-engine/multi-cloud/docs/aws/deprecations/deprecation-announcement for more details.

    flag:
        admin-groups: Groups of users that can perform operations as a cluster administrator.
        admin-users: Users that can perform operations as a cluster administrator. If not specified, the value of property core/account is used.
        annotations: Annotations for the cluster.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        aws-region: AWS region to deploy the cluster.
        binauthz-evaluation-mode: 'Set Binary Authorization evaluation mode for this cluster. _BINAUTHZ_EVALUATION_MODE_ must be one of: *DISABLED*, *PROJECT_SINGLETON_POLICY_ENFORCE*.'
        cluster-version: Kubernetes version to use for the cluster.
        config-encryption-kms-key-arn: Amazon Resource Name (ARN) of the AWS KMS key to encrypt the user data.
        database-encryption-kms-key-arn: Amazon Resource Name (ARN) of the AWS KMS key to encrypt the cluster secrets.
        description: Description for the cluster.
        disable-per-node-pool-sg-rules: Disable the default per node pool subnet security group rules on the control plane security group. When disabled, at least one security group that allows node pools to send traffic to the control plane on ports TCP/443 and TCP/8132 must be provided.
        enable-managed-prometheus: |-
            Enables managed collection for Managed Service for Prometheus in the cluster.
            +
            See https://cloud.google.com/stackdriver/docs/managed-prometheus/setup-managed#enable-mgdcoll-gke
            for more info.
            +
            Managed Prometheus is enabled by default for cluster versions 1.27 or greater,
            use --no-enable-managed-prometheus to disable.
        fleet-project: ID or number of the Fleet host project where the cluster is registered.
        iam-instance-profile: Name or ARN of the IAM instance profile associated with the cluster.
        instance-type: AWS EC2 instance type for the control plane's nodes.
        location: |-
            Google Cloud location for the cluster.
            +
            To set the `location` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_aws/location`.
        logging: |-
            Set the components that have logging enabled.
            +
            Examples:
            +
              $ {command} --logging=SYSTEM
              $ {command} --logging=SYSTEM,WORKLOAD
            +
            _COMPONENT_ must be one of: *SYSTEM*, *WORKLOAD*.
        main-volume-iops: Number of I/O operations per second (IOPS) to provision for the main volume.
        main-volume-kms-key-arn: Amazon Resource Name (ARN) of the AWS KMS key to encrypt the main volume.
        main-volume-size: Size of the main volume. The value must be a whole number followed by a size unit of `GB` for gigabyte, or `TB` for terabyte. If no size unit is specified, GB is assumed.
        main-volume-throughput: Throughput to provision for the main volume, in MiB/s. Only valid if the volume type is GP3. If volume type is GP3 and throughput is not provided, it defaults to 125.
        main-volume-type: 'Type of the main volume. _MAIN_VOLUME_TYPE_ must be one of: *gp2*, *gp3*.'
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-disable-per-node-pool-sg-rules: Disable the default per node pool subnet security group rules on the control plane security group. When disabled, at least one security group that allows node pools to send traffic to the control plane on ports TCP/443 and TCP/8132 must be provided.
        no-enable-managed-prometheus: |
            Enables managed collection for Managed Service for Prometheus in the cluster.

            See https://cloud.google.com/stackdriver/docs/managed-prometheus/setup-managed#enable-mgdcoll-gke
            for more info.

            Managed Prometheus is enabled by default for cluster versions 1.27 or greater,
            use --no-enable-managed-prometheus to disable.
        no-validate-only: Validate the cluster to create, but don't actually perform it.
        pod-address-cidr-blocks: IP address range for the pods in this cluster in CIDR notation (e.g. 10.0.0.0/8).
        proxy-secret-arn: ARN of the AWS Secrets Manager secret that contains a proxy configuration.
        proxy-secret-version-id: Version ID string of the AWS Secrets Manager secret that contains a proxy configuration.
        role-arn: Amazon Resource Name (ARN) of the IAM role to assume when managing AWS resources.
        role-session-name: Identifier for the assumed role session.
        root-volume-iops: Number of I/O operations per second (IOPS) to provision for the root volume.
        root-volume-kms-key-arn: Amazon Resource Name (ARN) of the AWS KMS key to encrypt the root volume.
        root-volume-size: Size of the root volume. The value must be a whole number followed by a size unit of `GB` for gigabyte, or `TB` for terabyte. If no size unit is specified, GB is assumed.
        root-volume-throughput: Throughput to provision for the root volume, in MiB/s. Only valid if the volume type is GP3. If volume type is GP3 and throughput is not provided, it defaults to 125.
        root-volume-type: 'Type of the root volume. _ROOT_VOLUME_TYPE_ must be one of: *gp2*, *gp3*.'
        security-group-ids: IDs of additional security groups to add to the control plane's nodes.
        service-address-cidr-blocks: IP address range for the services IPs in CIDR notation (e.g. 10.0.0.0/8).
        ssh-ec2-key-pair: Name of the EC2 key pair authorized to login to the control plane's nodes.
        subnet-ids: Subnet ID of an existing VNET to use for the cluster control plane.
        tags: |-
            Applies the given tags (comma separated) on the cluster. Example:
            +
              $ {command} EXAMPLE_CLUSTER --tags=tag1=one,tag2=two
        validate-only: Validate the cluster to create, but don't actually perform it.
        vpc-id: VPC associated with the cluster.
