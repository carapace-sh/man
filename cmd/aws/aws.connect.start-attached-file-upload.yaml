name: start-attached-file-upload
description: Provides a pre-signed Amazon S3 URL in response for uploading your content.
flags:
    --associated-resource-arn=!: The resource to which the attached file is (being) uploaded to.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --created-by=: Represents the identity that created the file.
    --file-name=!: A case-sensitive name of the attached file being uploaded.
    --file-size-in-bytes=!: The size of the attached file in bytes.
    --file-use-case-type=!: The use case for the file.
    --instance-id=!: The unique identifier of the Amazon Connect instance.
    --tags=: The tags used to organize, track, or control access for this resource.
    --url-expiry-in-seconds=: Optional override for the expiry of the pre-signed S3 URL in seconds.
completion:
    flag:
        file-use-case-type:
            - EMAIL_MESSAGE
            - ATTACHMENT
documentation:
    command: |-
        Provides a pre-signed Amazon S3 URL in response for uploading your content.

        You may only use this API to upload attachments to an [Amazon Connect Case](https://docs.aws.amazon.com/connect/latest/APIReference/API_connect-cases_CreateCase.html) or [Amazon Connect Email](https://docs.aws.amazon.com/connect/latest/adminguide/setup-email-channel.html).
    flag:
        associated-resource-arn: |-
            The resource to which the attached file is (being) uploaded to. The supported resources are [Cases](https://docs.aws.amazon.com/connect/latest/adminguide/cases.html) and [Email](https://docs.aws.amazon.com/connect/latest/adminguide/setup-email-channel.html).

            This value must be a valid ARN.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If not provided, the Amazon Web Services SDK populates this field. For more information about idempotency, see [Making retries safe with idempotent APIs](https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/).
        created-by: Represents the identity that created the file.
        file-name: A case-sensitive name of the attached file being uploaded.
        file-size-in-bytes: The size of the attached file in bytes.
        file-use-case-type: |-
            The use case for the file.

            Only `ATTACHMENTS` are supported.
        instance-id: The unique identifier of the Amazon Connect instance.
        tags: 'The tags used to organize, track, or control access for this resource. For example, `{ "Tags": {"key1":"value1", "key2":"value2"} }`.'
        url-expiry-in-seconds: Optional override for the expiry of the pre-signed S3 URL in seconds. The default value is 300.
