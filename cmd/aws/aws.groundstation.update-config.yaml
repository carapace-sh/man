name: update-config
description: Updates the `Config` used when scheduling contacts.
flags:
    --config-data=!: Parameters of a `Config`.
    --config-id=!: UUID of a `Config`.
    --config-type=!: Type of a `Config`.
    --name=!: Name of a `Config`.
completion:
    flag:
        config-type:
            - antenna-downlink
            - antenna-downlink-demod-decode
            - tracking
            - dataflow-endpoint
            - antenna-uplink
            - uplink-echo
            - s3-recording
documentation:
    command: |-
        Updates the `Config` used when scheduling contacts.

        Updating a `Config` will not update the execution parameters for existing future contacts scheduled with this `Config`.
    flag:
        config-data: Parameters of a `Config`.
        config-id: UUID of a `Config`.
        config-type: Type of a `Config`.
        name: Name of a `Config`.
