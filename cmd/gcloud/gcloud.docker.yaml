name: docker
description: '*(DEPRECATED)*  Enable Docker CLI access to Google Container Registry.'
flags:
    --authorize-only: Configure Docker authorization only; do not launch the Docker command-line.
    --docker-host=: URL to connect to Docker Daemon.
    --no-authorize-only&: Configure Docker authorization only; do not launch the Docker command-line.
    --server=: Address of the Google Cloud Registry.
documentation:
    command: |-
        *(DEPRECATED)*  Enable Docker CLI access to Google Container Registry.

        `gcloud docker` will not be supported for Docker client versions above 18.03.

        As an alternative, use `gcloud auth configure-docker` to configure `docker` to
        use `gcloud` as a credential helper, then use `docker` as you would for non-GCR
        registries, e.g. `docker pull gcr.io/project-id/my-image`. Add
        `--verbosity=error` to silence this warning: `gcloud docker
        --verbosity=error -- pull gcr.io/project-id/my-image`.

        See: https://cloud.google.com/container-registry/docs/support/deprecation-notices#gcloud-docker


        gcloud docker wraps Docker commands so that `gcloud` can
        inject the appropriate fresh authentication token into requests that interact
        with the Docker registry.

        All Docker-specific flags are passed through to the underlying `docker`
        command. A full reference of Docker's command line options available after
        `--` can be found here:
        [](https://docs.docker.com/engine/reference/commandline/cli/). You may also
        run `gcloud docker -- --help` to view the Docker CLI's help directly.

        Detailed documentation on Container Registry can be found here:
        [](https://cloud.google.com/container-registry/docs/)

        ## EXAMPLES

        To pull the image '{registry}/google-containers/pause:1.0' from the docker
        registry, run:

        ```
        gcloud docker -- pull {registry}/google-containers/pause:1.0
        ```

        Push the image '{registry}/example-org/example-image:latest' to our private
        docker registry.

        ```
        gcloud docker -- push {registry}/example-org/example-image:latest
        ```

        Configure authentication, then simply use docker:

        ```
        gcloud docker --authorize-only
        docker push {registry}/example-org/example-image:latest
        ```
    flag:
        authorize-only: Configure Docker authorization only; do not launch the Docker command-line.
        docker-host: 'URL to connect to Docker Daemon. Format: tcp://host:port or unix:///path/to/socket.'
        no-authorize-only: Configure Docker authorization only; do not launch the Docker command-line.
        server: Address of the Google Cloud Registry.
