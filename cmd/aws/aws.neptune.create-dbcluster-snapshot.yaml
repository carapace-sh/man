name: create-dbcluster-snapshot
description: Creates a snapshot of a DB cluster.
flags:
    --dbcluster-identifier=!: The identifier of the DB cluster to create a snapshot for.
    --dbcluster-snapshot-identifier=!: The identifier of the DB cluster snapshot.
    --tags=: The tags to be assigned to the DB cluster snapshot.
documentation:
    command: Creates a snapshot of a DB cluster.
    flag:
        dbcluster-identifier: |-
            The identifier of the DB cluster to create a snapshot for. This parameter is not case-sensitive.

            Constraints:

            - Must match the identifier of an existing DBCluster.

            Example: `my-cluster1`
        dbcluster-snapshot-identifier: |-
            The identifier of the DB cluster snapshot. This parameter is stored as a lowercase string.

            Constraints:

            - Must contain from 1 to 63 letters, numbers, or hyphens.
            - First character must be a letter.
            - Cannot end with a hyphen or contain two consecutive hyphens.

            Example: `my-cluster1-snapshot1`
        tags: The tags to be assigned to the DB cluster snapshot.
