name: update-message-template
description: Updates the Amazon Q in Connect message template.
flags:
    --content=: The content of the message template.
    --default-attributes=: An object that specifies the default values to use for variables in the message template.
    --knowledge-base-id=!: The identifier of the knowledge base.
    --language=: The language code value for the language in which the quick response is written.
    --message-template-id=!: The identifier of the message template.
documentation:
    command: Updates the Amazon Q in Connect message template. Partial update is supported. If any field is not supplied, it will remain unchanged for the message template that is referenced by the `$LATEST` qualifier. Any modification will only apply to the message template that is referenced by the `$LATEST` qualifier. The fields for all available versions will remain unchanged.
    flag:
        content: The content of the message template.
        default-attributes: An object that specifies the default values to use for variables in the message template. This object contains different categories of key-value pairs. Each key defines a variable or placeholder in the message template. The corresponding value defines the default value for that variable.
        knowledge-base-id: The identifier of the knowledge base. Can be either the ID or the ARN. URLs cannot contain the ARN.
        language: The language code value for the language in which the quick response is written. The supported language codes include `de_DE`, `en_US`, `es_ES`, `fr_FR`, `id_ID`, `it_IT`, `ja_JP`, `ko_KR`, `pt_BR`, `zh_CN`, `zh_TW`
        message-template-id: The identifier of the message template. Can be either the ID or the ARN. It cannot contain any qualifier.
