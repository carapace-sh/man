name: get-resolver-rule-association
description: Gets information about an association between a specified Resolver rule and a VPC.
flags:
    --resolver-rule-association-id=!: The ID of the Resolver rule association that you want to get information about.
documentation:
    command: Gets information about an association between a specified Resolver rule and a VPC. You associate a Resolver rule and a VPC using [AssociateResolverRule](https://docs.aws.amazon.com/Route53/latest/APIReference/API_route53resolver_AssociateResolverRule.html).
    flag:
        resolver-rule-association-id: The ID of the Resolver rule association that you want to get information about.
