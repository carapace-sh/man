name: update-service-environment
description: Updates a service environment.
flags:
    --capacity-limits=: The capacity limits for the service environment.
    --service-environment=!: The name or ARN of the service environment to update.
    --state=: The state of the service environment.
completion:
    flag:
        state:
            - ENABLED
            - DISABLED
documentation:
    command: Updates a service environment. You can update the state of a service environment from `ENABLED` to `DISABLED` to prevent new service jobs from being placed in the service environment.
    flag:
        capacity-limits: The capacity limits for the service environment. This defines the maximum resources that can be used by service jobs in this environment.
        service-environment: The name or ARN of the service environment to update.
        state: The state of the service environment.
