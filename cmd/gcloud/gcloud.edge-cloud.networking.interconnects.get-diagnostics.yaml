name: get-diagnostics
description: Get the diagnostics of a specified Distributed Cloud Edge Network interconnect.
flags:
    --location=: The Cloud location for the interconnect.
    --zone=: The zone of the interconnect.
documentation:
    command: Get the diagnostics of a specified Distributed Cloud Edge Network interconnect.
    flag:
        location: |-
            The Cloud location for the interconnect.
            +
            To set the `location` attribute:
            * provide the argument `interconnect` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        zone: |-
            The zone of the interconnect.
            +
            To set the `zone` attribute:
            * provide the argument `interconnect` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line.
