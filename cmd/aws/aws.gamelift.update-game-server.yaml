name: update-game-server
description: '**This operation is used with the Amazon GameLift Servers FleetIQ solution and game server groups.**'
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --game-server-data=: A set of custom game server properties, formatted as a single string value.
    --game-server-group-name=!: A unique identifier for the game server group where the game server is running.
    --game-server-id=!: A custom string that uniquely identifies the game server to update.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --health-check=: Indicates health status of the game server.
    --utilization-status=: Indicates if the game server is available or is currently hosting gameplay.
completion:
    flag:
        health-check:
            - HEALTHY
        utilization-status:
            - AVAILABLE
            - UTILIZED
documentation:
    command: |-
        **This operation is used with the Amazon GameLift Servers FleetIQ solution and game server groups.**

        Updates information about a registered game server to help Amazon GameLift Servers FleetIQ track game server availability. This operation is called by a game server process that is running on an instance in a game server group.

        Use this operation to update the following types of game server information. You can make all three types of updates in the same request:

        - To update the game server's utilization status from `AVAILABLE` (when the game server is available to be claimed) to `UTILIZED` (when the game server is currently hosting games). Identify the game server and game server group and specify the new utilization status. You can't change the status from to `UTILIZED` to `AVAILABLE` .
        - To report health status, identify the game server and game server group and set health check to `HEALTHY`. If a game server does not report health status for a certain length of time, the game server is no longer considered healthy. As a result, it will be eventually deregistered from the game server group to avoid affecting utilization metrics. The best practice is to report health every 60 seconds.
        - To change game server metadata, provide updated game server data.

        Once a game server is successfully updated, the relevant statuses and timestamps are updated.

        **Learn more**

        [Amazon GameLift Servers FleetIQ Guide](https://docs.aws.amazon.com/gamelift/latest/fleetiqguide/gsg-intro.html)
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        game-server-data: A set of custom game server properties, formatted as a single string value. This data is passed to a game client or service when it requests information on game servers.
        game-server-group-name: A unique identifier for the game server group where the game server is running.
        game-server-id: A custom string that uniquely identifies the game server to update.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        health-check: Indicates health status of the game server. A request that includes this parameter updates the game server's *LastHealthCheckTime* timestamp.
        utilization-status: Indicates if the game server is available or is currently hosting gameplay. You can update a game server status from `AVAILABLE` to `UTILIZED`, but you can't change a the status from `UTILIZED` to `AVAILABLE`.
