name: update-pull-request-status
description: Updates the status of a pull request.
flags:
    --pull-request-id=!: The system-generated ID of the pull request.
    --pull-request-status=!: The status of the pull request.
completion:
    flag:
        pull-request-status:
            - OPEN
            - CLOSED
documentation:
    command: Updates the status of a pull request.
    flag:
        pull-request-id: The system-generated ID of the pull request. To get this ID, use [ListPullRequests]().
        pull-request-status: The status of the pull request. The only valid operations are to update the status from `OPEN` to `OPEN`, `OPEN` to `CLOSED` or from `CLOSED` to `CLOSED`.
