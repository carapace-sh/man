name: merge-profiles
description: 'Runs an AWS Lambda job that does the following:'
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-name=!: The unique name of the domain.
    --field-source-profile-ids=: The identifiers of the fields in the profile that has the information you want to apply to the merge.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --main-profile-id=!: The identifier of the profile to be taken.
    --profile-ids-to-be-merged=!:
        description: The identifier of the profile to be merged into MainProfileId.
        nargs: -1
documentation:
    command: "Runs an AWS Lambda job that does the following:\n\n1. All the profileKeys in the `ProfileToBeMerged` will be moved to the main profile.\n2. All the objects in the `ProfileToBeMerged` will be moved to the main profile.\n3. All the `ProfileToBeMerged` will be deleted at the end.\n4. All the profileKeys in the `ProfileIdsToBeMerged` will be moved to the main profile.\n5. Standard fields are merged as follows:\n   \n   1. Fields are always \"union\"-ed if there are no conflicts in standard fields or attributeKeys.\n   2. When there are conflicting fields:\n      \n      1. If no `SourceProfileIds` entry is specified, the main Profile value is always taken.\n      2. If a `SourceProfileIds` entry is specified, the specified profileId is always taken, even if it is a NULL value.\n\nYou can use MergeProfiles together with [GetMatches](https://docs.aws.amazon.com/customerprofiles/latest/APIReference/API_GetMatches.html), which returns potentially matching profiles, or use it with the results of another matching system. After profiles have been merged, they cannot be separated (unmerged)."
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain-name: The unique name of the domain.
        field-source-profile-ids: The identifiers of the fields in the profile that has the information you want to apply to the merge. For example, say you want to merge EmailAddress from Profile1 into MainProfile. This would be the identifier of the EmailAddress field in Profile1.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        main-profile-id: The identifier of the profile to be taken.
        profile-ids-to-be-merged: The identifier of the profile to be merged into MainProfileId.
