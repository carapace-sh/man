name: get-rule
description: Gets the details of a rule in Amazon DataZone.
flags:
    --domain-identifier=!: The ID of the domain where the `GetRule` action is to be invoked.
    --identifier=!: The ID of the rule.
    --revision=: The revision of the rule.
documentation:
    command: Gets the details of a rule in Amazon DataZone. A rule is a formal agreement that enforces specific requirements across user workflows (e.g., publishing assets to the catalog, requesting subscriptions, creating projects) within the Amazon DataZone data portal. These rules help maintain consistency, ensure compliance, and uphold governance standards in data management processes. For instance, a metadata enforcement rule can specify the required information for creating a subscription request or publishing a data asset to the catalog, ensuring alignment with organizational standards.
    flag:
        domain-identifier: The ID of the domain where the `GetRule` action is to be invoked.
        identifier: The ID of the rule.
        revision: The revision of the rule.
