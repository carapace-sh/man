name: update-job-shipment-state
description: Updates the state when a shipment state changes to a different state.
flags:
    --job-id=!: The job ID of the job whose shipment date you want to update, for example `JID123e4567-e89b-12d3-a456-426655440000`.
    --shipment-state=!: The state of a device when it is being shipped.
completion:
    flag:
        shipment-state:
            - RECEIVED
            - RETURNED
documentation:
    command: Updates the state when a shipment state changes to a different state.
    flag:
        job-id: The job ID of the job whose shipment date you want to update, for example `JID123e4567-e89b-12d3-a456-426655440000`.
        shipment-state: |-
            The state of a device when it is being shipped.

            Set to `RECEIVED` when the device arrives at your location.

            Set to `RETURNED` when you have returned the device to Amazon Web Services.
