name: update
description: '*(ALPHA)*  Update a condition in an alerting policy.'
flags:
    --display-name=: The display name for the Condition.
    --if=: One of "absent", "< THRESHOLD", "> THRESHOLD" where "THRESHOLD" is an integer or float.
    --policy=: Name of the alerting policy.
    --trigger-count=: The absolute number of time series that must fail the predicate for the condition to be triggered.
    --trigger-percent=: The percentage of time series that must fail the predicate for the condition to be triggered.
documentation:
    command: '*(ALPHA)*  Update a condition in an alerting policy.'
    flag:
        display-name: The display name for the Condition.
        if: One of "absent", "< THRESHOLD", "> THRESHOLD" where "THRESHOLD" is an integer or float.
        policy: |-
            Name of the alerting policy.
            +
            To set the `policy` attribute:
            * provide the argument `condition` on the command line with a fully specified name;
            * provide the argument `--policy` on the command line.
        trigger-count: The absolute number of time series that must fail the predicate for the condition to be triggered.
        trigger-percent: The percentage of time series that must fail the predicate for the condition to be triggered.
