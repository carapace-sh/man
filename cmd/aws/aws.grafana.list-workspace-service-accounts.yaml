name: list-workspace-service-accounts
description: Returns a list of service accounts for a workspace.
flags:
    --max-results=: The maximum number of service accounts to include in the results.
    --next-token=: The token for the next set of service accounts to return.
    --workspace-id=!: The workspace for which to list service accounts.
documentation:
    command: |-
        Returns a list of service accounts for a workspace.

        Service accounts are only available for workspaces that are compatible with Grafana version 9 and above.
    flag:
        max-results: The maximum number of service accounts to include in the results.
        next-token: The token for the next set of service accounts to return. (You receive this token from a previous `ListWorkspaceServiceAccounts` operation.)
        workspace-id: The workspace for which to list service accounts.
