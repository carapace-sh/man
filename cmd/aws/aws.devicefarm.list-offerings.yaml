name: list-offerings
description: Returns a list of products or offerings that the user can manage through the API.
flags:
    --next-token=: An identifier that was returned from the previous call to this operation, which can be used to return the next set of items in the list.
documentation:
    command: Returns a list of products or offerings that the user can manage through the API. Each offering record indicates the recurring price per unit and the frequency for that offering. The API returns a `NotEligible` error if the user is not permitted to invoke the operation. If you must be able to invoke this operation, contact [aws-devicefarm-support@amazon.com](mailto:aws-devicefarm-support@amazon.com).
    flag:
        next-token: An identifier that was returned from the previous call to this operation, which can be used to return the next set of items in the list.
