name: create-package-version
description: Creates a new version for an existing IoT software package.
flags:
    --artifact=: The various build components created during the build process such as libraries and configuration files that make up a software package version.
    --attributes=: Metadata that can be used to define a package version’s configuration.
    --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
    --description=: A summary of the package version being created.
    --package-name=!: The name of the associated software package.
    --recipe=: The inline job document associated with a software package version used for a quick job deployment.
    --tags=: Metadata that can be used to manage the package version.
    --version-name=!: The name of the new package version.
documentation:
    command: |-
        Creates a new version for an existing IoT software package.

        Requires permission to access the [CreatePackageVersion](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) and [GetIndexingConfiguration](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) actions.
    flag:
        artifact: The various build components created during the build process such as libraries and configuration files that make up a software package version.
        attributes: |-
            Metadata that can be used to define a package version’s configuration. For example, the S3 file location, configuration options that are being sent to the device or fleet.

            The combined size of all the attributes on a package version is limited to 3KB.
        client-token: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request. Don't reuse this client token if a new idempotent request is required.
        description: A summary of the package version being created. This can be used to outline the package's contents or purpose.
        package-name: The name of the associated software package.
        recipe: The inline job document associated with a software package version used for a quick job deployment.
        tags: Metadata that can be used to manage the package version.
        version-name: The name of the new package version.
