name: list-recovery-points-by-backup-vault
description: Returns detailed information about the recovery points stored in a backup vault.
flags:
    --backup-vault-account-id=: This parameter will sort the list of recovery points by account ID.
    --backup-vault-name=!: The name of a logical container where backups are stored.
    --by-backup-plan-id=: Returns only recovery points that match the specified backup plan ID.
    --by-created-after=: Returns only recovery points that were created after the specified timestamp.
    --by-created-before=: Returns only recovery points that were created before the specified timestamp.
    --by-parent-recovery-point-arn=: This returns only recovery points that match the specified parent (composite) recovery point Amazon Resource Name (ARN).
    --by-resource-arn=: Returns only recovery points that match the specified resource Amazon Resource Name (ARN).
    --by-resource-type=: 'Returns only recovery points that match the specified resource type(s):'
    --max-results=: The maximum number of items to be returned.
    --next-token=: The next item following a partial list of returned items.
documentation:
    command: Returns detailed information about the recovery points stored in a backup vault.
    flag:
        backup-vault-account-id: This parameter will sort the list of recovery points by account ID.
        backup-vault-name: |-
            The name of a logical container where backups are stored. Backup vaults are identified by names that are unique to the account used to create them and the Amazon Web Services Region where they are created.

            Backup vault name might not be available when a supported service creates the backup.
        by-backup-plan-id: Returns only recovery points that match the specified backup plan ID.
        by-created-after: Returns only recovery points that were created after the specified timestamp.
        by-created-before: Returns only recovery points that were created before the specified timestamp.
        by-parent-recovery-point-arn: This returns only recovery points that match the specified parent (composite) recovery point Amazon Resource Name (ARN).
        by-resource-arn: Returns only recovery points that match the specified resource Amazon Resource Name (ARN).
        by-resource-type: |-
            Returns only recovery points that match the specified resource type(s):

            - `Aurora` for Amazon Aurora
            - `CloudFormation` for CloudFormation
            - `DocumentDB` for Amazon DocumentDB (with MongoDB compatibility)
            - `DynamoDB` for Amazon DynamoDB
            - `EBS` for Amazon Elastic Block Store
            - `EC2` for Amazon Elastic Compute Cloud
            - `EFS` for Amazon Elastic File System
            - `FSx` for Amazon FSx
            - `Neptune` for Amazon Neptune
            - `RDS` for Amazon Relational Database Service
            - `Redshift` for Amazon Redshift
            - `S3` for Amazon Simple Storage Service (Amazon S3)
            - `SAP HANA on Amazon EC2` for SAP HANA databases on Amazon Elastic Compute Cloud instances
            - `Storage Gateway` for Storage Gateway
            - `Timestream` for Amazon Timestream
            - `VirtualMachine` for VMware virtual machines
        max-results: The maximum number of items to be returned.
        next-token: The next item following a partial list of returned items. For example, if a request is made to return `MaxResults` number of items, `NextToken` allows you to return more items in your list starting at the location pointed to by the next token.
