name: delete
description: '*(BETA)*  Deletes a Compute Engine delegated sub prefix.'
flags:
    --global-public-delegated-prefix: If set, the public delegated prefix is global.
    --no-global-public-delegated-prefix&: If set, the public delegated prefix is global.
    --public-delegated-prefix-region=: Region of the public delegated prefix to delete the delegate sub prefix for.
    --public-delegated-prefix=!: Name of the public delegated prefix to delete the delegate sub prefix for.
documentation:
    command: '*(BETA)*  Deletes a Compute Engine delegated sub prefix.'
    flag:
        global-public-delegated-prefix: If set, the public delegated prefix is global.
        no-global-public-delegated-prefix: If set, the public delegated prefix is global.
        public-delegated-prefix: Name of the public delegated prefix to delete the delegate sub prefix for.
        public-delegated-prefix-region: |-
            Region of the public delegated prefix to delete the delegate sub prefix for. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
