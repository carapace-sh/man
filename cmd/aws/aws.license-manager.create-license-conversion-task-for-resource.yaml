name: create-license-conversion-task-for-resource
description: Creates a new license conversion task.
flags:
    --destination-license-context=!: Information that identifies the license type you are converting to.
    --resource-arn=!: Amazon Resource Name (ARN) of the resource you are converting the license type for.
    --source-license-context=!: Information that identifies the license type you are converting from.
documentation:
    command: Creates a new license conversion task.
    flag:
        destination-license-context: Information that identifies the license type you are converting to. For the structure of the destination license, see [Convert a license type using the CLI](https://docs.aws.amazon.com/license-manager/latest/userguide/conversion-procedures.html#conversion-cli) in the *License Manager User Guide*.
        resource-arn: Amazon Resource Name (ARN) of the resource you are converting the license type for.
        source-license-context: Information that identifies the license type you are converting from. For the structure of the source license, see [Convert a license type using the CLI](https://docs.aws.amazon.com/license-manager/latest/userguide/conversion-procedures.html#conversion-cli) in the *License Manager User Guide*.
