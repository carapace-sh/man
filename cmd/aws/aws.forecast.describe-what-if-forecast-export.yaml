name: describe-what-if-forecast-export
description: Describes the what-if forecast export created using the [CreateWhatIfForecastExport]() operation.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --what-if-forecast-export-arn=!: The Amazon Resource Name (ARN) of the what-if forecast export that you are interested in.
documentation:
    command: |-
        Describes the what-if forecast export created using the [CreateWhatIfForecastExport]() operation.

        In addition to listing the properties provided in the `CreateWhatIfForecastExport` request, this operation lists the following properties:

        - `CreationTime`
        - `LastModificationTime`
        - `Message` - If an error occurred, information about the error.
        - `Status`
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
