name: modify-ipam-pool
description: Modify the configurations of an IPAM pool.
flags:
    --add-allocation-resource-tags=:
        description: Add tag allocation rules to a pool.
        nargs: -1
    --allocation-default-netmask-length=: The default netmask length for allocations added to this pool.
    --allocation-max-netmask-length=: The maximum netmask length possible for CIDR allocations in this IPAM pool to be compliant.
    --allocation-min-netmask-length=: The minimum netmask length required for CIDR allocations in this IPAM pool to be compliant.
    --auto-import: If true, IPAM will continuously look for resources within the CIDR range of this pool and automatically import them as allocations into your IPAM.
    --clear-allocation-default-netmask-length: Clear the default netmask length allocation rule for this pool.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The description of the IPAM pool you want to modify.
    --dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ipam-pool-id=!: The ID of the IPAM pool you want to modify.
    --no-auto-import: If true, IPAM will continuously look for resources within the CIDR range of this pool and automatically import them as allocations into your IPAM.
    --no-clear-allocation-default-netmask-length: Clear the default netmask length allocation rule for this pool.
    --no-dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --remove-allocation-resource-tags=:
        description: Remove tag allocation rules from a pool.
        nargs: -1
documentation:
    command: |-
        Modify the configurations of an IPAM pool.

        For more information, see [Modify a pool](https://docs.aws.amazon.com/vpc/latest/ipam/mod-pool-ipam.html) in the *Amazon VPC IPAM User Guide*.
    flag:
        add-allocation-resource-tags: Add tag allocation rules to a pool. For more information about allocation rules, see [Create a top-level pool](https://docs.aws.amazon.com/vpc/latest/ipam/create-top-ipam.html) in the *Amazon VPC IPAM User Guide*.
        allocation-default-netmask-length: The default netmask length for allocations added to this pool. If, for example, the CIDR assigned to this pool is 10.0.0.0/8 and you enter 16 here, new allocations will default to 10.0.0.0/16.
        allocation-max-netmask-length: The maximum netmask length possible for CIDR allocations in this IPAM pool to be compliant. Possible netmask lengths for IPv4 addresses are 0 - 32. Possible netmask lengths for IPv6 addresses are 0 - 128.The maximum netmask length must be greater than the minimum netmask length.
        allocation-min-netmask-length: The minimum netmask length required for CIDR allocations in this IPAM pool to be compliant. Possible netmask lengths for IPv4 addresses are 0 - 32. Possible netmask lengths for IPv6 addresses are 0 - 128. The minimum netmask length must be less than the maximum netmask length.
        auto-import: |-
            If true, IPAM will continuously look for resources within the CIDR range of this pool and automatically import them as allocations into your IPAM. The CIDRs that will be allocated for these resources must not already be allocated to other resources in order for the import to succeed. IPAM will import a CIDR regardless of its compliance with the pool's allocation rules, so a resource might be imported and subsequently marked as noncompliant. If IPAM discovers multiple CIDRs that overlap, IPAM will import the largest CIDR only. If IPAM discovers multiple CIDRs with matching CIDRs, IPAM will randomly import one of them only.

            A locale must be set on the pool for this feature to work.
        clear-allocation-default-netmask-length: Clear the default netmask length allocation rule for this pool.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The description of the IPAM pool you want to modify.
        dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ipam-pool-id: The ID of the IPAM pool you want to modify.
        remove-allocation-resource-tags: Remove tag allocation rules from a pool.
