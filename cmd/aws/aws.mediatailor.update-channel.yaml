name: update-channel
description: Updates a channel.
flags:
    --audiences=:
        description: The list of audiences defined in channel.
        nargs: -1
    --channel-name=!: The name of the channel.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --filler-slate=: The slate used to fill gaps between programs in the schedule.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --outputs=!:
        description: The channel's output properties.
        nargs: -1
    --time-shift-configuration=: The time-shifted viewing configuration you want to associate to the channel.
documentation:
    command: Updates a channel. For information about MediaTailor channels, see [Working with channels](https://docs.aws.amazon.com/mediatailor/latest/ug/channel-assembly-channels.html) in the *MediaTailor User Guide*.
    flag:
        audiences: The list of audiences defined in channel.
        channel-name: The name of the channel.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        filler-slate: The slate used to fill gaps between programs in the schedule. You must configure filler slate if your channel uses the `LINEAR` `PlaybackMode`. MediaTailor doesn't support filler slate for channels using the `LOOP` `PlaybackMode`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        outputs: The channel's output properties.
        time-shift-configuration: The time-shifted viewing configuration you want to associate to the channel.
