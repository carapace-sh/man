name: update
description: '*(ALPHA)*  Update a Security Command Center service.'
flags:
    --enablement-state=: Sets the enablement state of the Security Center service.
    --folder=: Folder associated with the custom module.
    --module-config-file=: Path to a JSON or YAML file that contains the module config to set for the given module and service.
    --no-validate-only&: If present, the request is validated (including IAM checks) but no action is taken.
    --organization=: Organization associated with the custom module.
    --parent=: Parent associated with the custom module.
    --validate-only: If present, the request is validated (including IAM checks) but no action is taken.
documentation:
    command: |-
        *(ALPHA)*  Update the enablement state of the Security Center service and its
        corresponding modules for the specified folder, project or organization.

        ## EXAMPLES

        To update a Security Center Service with name `sha` for organization 123, run:

            $ gcloud alpha scc manage services update sha
                --organization=organizations/123 --enablement-state="ENABLED"

        To update a Security Center Service with name `sha` and its modules for
        organization 123, run:

            $ gcloud alpha scc manage services update sha
                --organization=organizations/123 --enablement-state="ENABLED"
                --module-config-file=module_config.yaml

        To validate an update of Security Center Service with name `sha` and its
        modules for organization 123, run:

            $ gcloud alpha scc manage services update sha
                --organization=organizations/123 --enablement-state="ENABLED"
                --module-config-file=module_config.yaml --validate-only
    flag:
        enablement-state: |-
            Sets the enablement state of the Security Center service.
                  Valid options are ENABLED, DISABLED, OR INHERITED. The INHERITED
                  state is only valid when setting the enablement state at the project or folder level.
        folder: Folder associated with the custom module.
        module-config-file: Path to a JSON or YAML file that contains the module config to set for the given module and service. Use a full or relative path to a local file containing the value of module_config_file.
        no-validate-only: If present, the request is validated (including IAM checks) but no action is taken.
        organization: Organization associated with the custom module.
        parent: |-
            Parent associated with the custom module. Can be one of
                          organizations/<id>, projects/<id or name>, folders/<id>
        validate-only: If present, the request is validated (including IAM checks) but no action is taken.
