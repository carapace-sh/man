name: describe-account-limits
description: Retrieves your account's CloudFormation limits, such as the maximum number of stacks that you can create in your account.
flags:
    --next-token=: The token for the next set of items to return.
documentation:
    command: Retrieves your account's CloudFormation limits, such as the maximum number of stacks that you can create in your account. For more information about account limits, see [Understand CloudFormation quotas](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/cloudformation-limits.html) in the *CloudFormation User Guide*.
    flag:
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
