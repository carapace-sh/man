name: update-thing-groups-for-thing
description: Updates the groups to which the thing belongs.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-override-dynamic-groups: Override dynamic thing groups with static thing groups when 10-group limit is reached.
    --override-dynamic-groups: Override dynamic thing groups with static thing groups when 10-group limit is reached.
    --thing-groups-to-add=: The groups to which the thing will be added.
    --thing-groups-to-remove=: The groups from which the thing will be removed.
    --thing-name=: The thing whose group memberships will be updated.
documentation:
    command: |-
        Updates the groups to which the thing belongs.

        Requires permission to access the [UpdateThingGroupsForThing](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        override-dynamic-groups: Override dynamic thing groups with static thing groups when 10-group limit is reached. If a thing belongs to 10 thing groups, and one or more of those groups are dynamic thing groups, adding a thing to a static group removes the thing from the last dynamic group.
        thing-groups-to-add: The groups to which the thing will be added.
        thing-groups-to-remove: The groups from which the thing will be removed.
        thing-name: The thing whose group memberships will be updated.
