name: start-workspaces
description: Starts the specified WorkSpaces.
flags:
    --start-workspace-requests=!: The WorkSpaces to start.
documentation:
    command: |-
        Starts the specified WorkSpaces.

        You cannot start a WorkSpace unless it has a running mode of `AutoStop` or `Manual` and a state of `STOPPED`.
    flag:
        start-workspace-requests: The WorkSpaces to start. You can specify up to 25 WorkSpaces.
