name: delete
description: '*(ALPHA)*  Delete an Apigee organization.'
documentation:
    command: |+
        *(ALPHA)*  Delete an Apigee organization.

        `gcloud alpha apigee organizations delete` deletes an organization and all resources inside it. This
        is currently only supported for trial organizations.

        This is a long running operation. Once organization provisioning has
        begun, `gcloud alpha apigee organizations delete` will exit, returning the operation's ID and initial
        status. To continue monitoring the operation, run
        `{grandparent_command} operations describe OPERATION_NAME`.

