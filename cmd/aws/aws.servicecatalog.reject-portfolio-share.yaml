name: reject-portfolio-share
description: Rejects an offer to share the specified portfolio.
flags:
    --accept-language=: The language code.
    --portfolio-id=!: The portfolio identifier.
    --portfolio-share-type=: The type of shared portfolios to reject.
completion:
    flag:
        portfolio-share-type:
            - IMPORTED
            - AWS_SERVICECATALOG
            - AWS_ORGANIZATIONS
documentation:
    command: Rejects an offer to share the specified portfolio.
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        portfolio-id: The portfolio identifier.
        portfolio-share-type: |-
            The type of shared portfolios to reject. The default is to reject imported portfolios.

            - `AWS_ORGANIZATIONS` - Reject portfolios shared by the management account of your organization.
            - `IMPORTED` - Reject imported portfolios.
            - `AWS_SERVICECATALOG` - Not supported. (Throws ResourceNotFoundException.)

            For example, `aws servicecatalog reject-portfolio-share --portfolio-id "port-2qwzkwxt3y5fk" --portfolio-share-type AWS_ORGANIZATIONS`
