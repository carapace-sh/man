name: export
description: '*(BETA)*  Returns the .yaml definition of the specified delivery pipeline.'
flags:
    --destination=: Path to a YAML file where the configuration will be exported.
    --region=: The Cloud region for the delivery_pipeline.
documentation:
    command: '*(BETA)*  The exported yaml definition can be applied by ''deploy apply'' command.'
    flag:
        destination: |-
            Path to a YAML file where the configuration will be exported.
                      Alternatively, you may omit this flag to write to standard output.
        region: |-
            The Cloud region for the delivery_pipeline.  Alternatively, set the property [deploy/region].
            +
            To set the `region` attribute:
            * provide the argument `delivery_pipeline` on the command line with a fully specified name;
            * set the property `deploy/delivery_pipeline` with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `deploy/region`.
