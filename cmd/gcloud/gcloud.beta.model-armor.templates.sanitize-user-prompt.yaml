name: sanitize-user-prompt
description: '*(BETA)*  Sanitize User Prompt.'
flags:
    --byte-item-data-from-file=: Bytes Data.
    --byte-item-data-type=!: The type of byte data.
    --byte-item-data=: Bytes Data
    --location=: The location id of the template resource.
    --multi-language-detection-metadata-enable: Enable detection of multi-language prompts and responses.
    --multi-language-detection-metadata-source=: Optional Source language of the user prompt.
    --no-multi-language-detection-metadata-enable&: Enable detection of multi-language prompts and responses.
    --user-prompt-data-text=: Plaintext string data for sanitization.
completion:
    flag:
        byte-item-data-type:
            - csv
            - excel-document
            - pdf
            - plaintext-utf8
            - powerpoint-document
            - txt
            - word-document
documentation:
    command: '*(BETA)*  Sanitizes a user prompt.'
    flag:
        byte-item-data: Bytes Data
        byte-item-data-from-file: Bytes Data. Use a full or relative path to a local file containing the value of byte_item_data.
        byte-item-data-type: |-
            The type of byte data. _BYTE_ITEM_DATA_TYPE_ must be one of:
            +
            *csv*::: CSV
            *excel-document*::: XLSX, XLSM, XLTX, XLYM
            *pdf*::: PDF
            *plaintext-utf8*::: plain text
            *powerpoint-document*::: PPTX, PPTM, POTX, POTM, POT
            *txt*::: TXT
            *word-document*::: DOCX, DOCM, DOTX, DOTM
            :::
            +
        location: |-
            The location id of the template resource.
            +
            To set the `location` attribute:
            * provide the argument `template` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        multi-language-detection-metadata-enable: Enable detection of multi-language prompts and responses.
        multi-language-detection-metadata-source: |-
            Optional Source language of the user prompt.
            +
            If multi-language detection is enabled but language is not set in that case
            we would automatically detect the source language.
        no-multi-language-detection-metadata-enable: Enable detection of multi-language prompts and responses.
        user-prompt-data-text: Plaintext string data for sanitization.
