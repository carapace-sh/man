name: list-event-sources
description: You can use this to see all the partner event sources that have been shared with your Amazon Web Services account.
flags:
    --limit=: Specifying this limits the number of results returned by this operation.
    --name-prefix=: Specifying this limits the results to only those partner event sources with names that start with the specified prefix.
    --next-token=: The token returned by a previous call, which you can use to retrieve the next set of results.
documentation:
    command: You can use this to see all the partner event sources that have been shared with your Amazon Web Services account. For more information about partner event sources, see [CreateEventBus](https://docs.aws.amazon.com/eventbridge/latest/APIReference/API_CreateEventBus.html).
    flag:
        limit: Specifying this limits the number of results returned by this operation. The operation also returns a NextToken which you can use in a subsequent operation to retrieve the next set of results.
        name-prefix: Specifying this limits the results to only those partner event sources with names that start with the specified prefix.
        next-token: |-
            The token returned by a previous call, which you can use to retrieve the next set of results.

            The value of `nextToken` is a unique pagination token for each page. To retrieve the next page of results, make the call again using the returned token. Keep all other arguments unchanged.

            Using an expired pagination token results in an `HTTP 400 InvalidToken` error.
