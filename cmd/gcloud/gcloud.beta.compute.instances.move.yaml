name: move
description: '*(BETA)*  *(REMOVED)*  Move an instance and its attached persistent disks between zones.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --destination-zone=!: The zone to move the instance to.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --zone=: Zone of the instance to operate on.
documentation:
    command: |4
        *(BETA)*  *(REMOVED)*  This command has been removed. Please see https://cloud.google.com/compute/docs/instances/moving-instance-across-zones for an alternative method.


        *gcloud beta compute instances move* moves a Compute Engine virtual machine
        from one zone to another. Moving a virtual machine might incur downtime
        if the guest OS must be shut down in order to quiesce disk volumes
        prior to snapshotting.

        For example, running the following command moves the instance
        called `example-instance-1` with its attached persistent disks,
        currently running in `us-central1-b`, to `us-central1-f`.

           $ gcloud compute instances move example-instance-1 --zone=us-central1-b --destination-zone=us-central1-f

        Note: Moving VMs or disks by using the `gcloud beta compute instances move` command might
        cause unexpected behavior. For more information, see https://cloud.google.com/compute/docs/troubleshooting/known-issues#moving_vms_or_disks_using_the_moveinstance_api_or_the_causes_unexpected_behavior.

        Please note that gcloud compute instances move does not yet support
        instances which have regional persistent disks attached. Please see
        https://cloud.google.com/compute/docs/disks/regional-persistent-disk for
        more details.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        destination-zone: The zone to move the instance to.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        zone: |-
            Zone of the instance to operate on. If not specified, you might be prompted to select a zone (interactive mode
            only). `gcloud` attempts to identify the appropriate zone by searching for
            resources in your currently active project. If the zone cannot be determined,
            `gcloud` prompts you for a selection with all available Google Cloud Platform
            zones.
            +
            To avoid prompting when this flag is omitted, the user can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
