name: untag-resource
description: Removes one or more tags from the specified Amazon Verified Permissions resource.
flags:
    --resource-arn=!: The ARN of the resource from which you are removing tags.
    --tag-keys=!: The list of tag keys to remove from the resource.
documentation:
    command: Removes one or more tags from the specified Amazon Verified Permissions resource. In Verified Permissions, policy stores can be tagged.
    flag:
        resource-arn: The ARN of the resource from which you are removing tags.
        tag-keys: The list of tag keys to remove from the resource.
