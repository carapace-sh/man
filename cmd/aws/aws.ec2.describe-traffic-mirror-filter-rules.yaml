documentation:
    command: Describe traffic mirror filters that determine the traffic that is mirrored.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            Traffic mirror filters.

            - `traffic-mirror-filter-rule-id`: The ID of the Traffic Mirror rule.
            - `traffic-mirror-filter-id`: The ID of the filter that this rule is associated with.
            - `rule-number`: The number of the Traffic Mirror rule.
            - `rule-action`: The action taken on the filtered traffic. Possible actions are `accept` and `reject`.
            - `traffic-direction`: The traffic direction. Possible directions are `ingress` and `egress`.
            - `protocol`: The protocol, for example UDP, assigned to the Traffic Mirror rule.
            - `source-cidr-block`: The source CIDR block assigned to the Traffic Mirror rule.
            - `destination-cidr-block`: The destination CIDR block assigned to the Traffic Mirror rule.
            - `description`: The description of the Traffic Mirror rule.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned `nextToken` value.
        next-token: The token for the next page of results.
        traffic-mirror-filter-id: Traffic filter ID.
        traffic-mirror-filter-rule-ids: Traffic filter rule IDs.
