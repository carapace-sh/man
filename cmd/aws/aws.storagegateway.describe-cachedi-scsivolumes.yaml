name: describe-cachedi-scsivolumes
description: Returns a description of the gateway volumes specified in the request.
flags:
    --volume-arns=!: An array of strings where each string represents the Amazon Resource Name (ARN) of a cached volume.
documentation:
    command: |-
        Returns a description of the gateway volumes specified in the request. This operation is only supported in the cached volume gateway types.

        The list of gateway volumes in the request must be from one gateway. In the response, Storage Gateway returns volume information sorted by volume Amazon Resource Name (ARN).
    flag:
        volume-arns: An array of strings where each string represents the Amazon Resource Name (ARN) of a cached volume. All of the specified cached volumes must be from the same gateway. Use [ListVolumes]() to get volume ARNs for a gateway.
