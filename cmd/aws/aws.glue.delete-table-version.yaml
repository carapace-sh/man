name: delete-table-version
description: Deletes a specified version of a table.
flags:
    --catalog-id=: The ID of the Data Catalog where the tables reside.
    --database-name=!: The database in the catalog in which the table resides.
    --table-name=!: The name of the table.
    --version-id=!: The ID of the table version to be deleted.
documentation:
    command: Deletes a specified version of a table.
    flag:
        catalog-id: The ID of the Data Catalog where the tables reside. If none is provided, the Amazon Web Services account ID is used by default.
        database-name: The database in the catalog in which the table resides. For Hive compatibility, this name is entirely lowercase.
        table-name: The name of the table. For Hive compatibility, this name is entirely lowercase.
        version-id: The ID of the table version to be deleted. A `VersionID` is a string representation of an integer. Each version is incremented by 1.
