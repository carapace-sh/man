name: create-centralization-rule-for-organization
description: Creates a centralization rule that applies across an Amazon Web Services Organization.
flags:
    --rule-name=!: A unique name for the organization-wide centralization rule being created.
    --rule=!: The configuration details for the organization-wide centralization rule, including the source configuration and the destination configuration to centralize telemetry data across the organization.
    --tags=: The key-value pairs to associate with the organization telemetry rule resource for categorization and management purposes.
documentation:
    command: Creates a centralization rule that applies across an Amazon Web Services Organization. This operation can only be called by the organization's management account or a delegated administrator account.
    flag:
        rule: The configuration details for the organization-wide centralization rule, including the source configuration and the destination configuration to centralize telemetry data across the organization.
        rule-name: A unique name for the organization-wide centralization rule being created.
        tags: The key-value pairs to associate with the organization telemetry rule resource for categorization and management purposes.
