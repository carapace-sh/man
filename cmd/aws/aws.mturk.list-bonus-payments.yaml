name: list-bonus-payments
description: The `ListBonusPayments` operation retrieves the amounts of bonuses you have paid to Workers for a given HIT or assignment.
flags:
    --assignment-id=: The ID of the assignment associated with the bonus payments to retrieve.
    --hitid=: The ID of the HIT associated with the bonus payments to retrieve.
    --max-results=: ""
    --next-token=: Pagination token
documentation:
    command: The `ListBonusPayments` operation retrieves the amounts of bonuses you have paid to Workers for a given HIT or assignment.
    flag:
        assignment-id: The ID of the assignment associated with the bonus payments to retrieve. If specified, only bonus payments for the given assignment are returned. Either the HITId parameter or the AssignmentId parameter must be specified
        hitid: The ID of the HIT associated with the bonus payments to retrieve. If not specified, all bonus payments for all assignments for the given HIT are returned. Either the HITId parameter or the AssignmentId parameter must be specified
        max-results: ""
        next-token: Pagination token
