name: get-supported-languages
description: '*(BETA)*  Returns a list of supported languages for translation.'
flags:
    --display-language-code=: The language to use to return localized, human-readable name of supported languages.
    --model=: Get supported languages of specified model.
    --zone=: Location to make calls.
documentation:
    command: |
        *(BETA)*  List supported languages for translation.
    flag:
        display-language-code: |-
            The language to use to return localized, human-readable name of supported languages.
            If missing, then display names aren't returned in the response.
        model: |-
            Get supported languages of specified model.
            +
            Authorization requires one or more of the following Google IAM permissions on the specified
            resource model:
            +
              cloudtranslate.generalModels.get
            +
              automl.models.get
            +
            Defaults to 'general/base'.
            +
            Usage:
            +
              AutoML models: '--model=TRL321456789'
            +
              General models: '--model=general/nmt'
        zone: |-
            Location to make calls. Non-global location is required for requests using AutoML models.
            Currently, only 'us-central1' is supported as a non-global location. Defaults to 'global'.
