name: delete
description: '*(BETA)*  Delete an access level.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --policy=: The ID of the access policy.
documentation:
    command: '*(BETA)*  Delete an access level in a given access policy.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        policy: |-
            The ID of the access policy.
            +

            To set the `policy` attribute:
            * provide the argument `level` on the command line with a fully specified name;
            * provide the argument `--policy` on the command line;
            * set the property `access_context_manager/policy`;
            * automatically, if the current account belongs to an organization with exactly one access policy..
