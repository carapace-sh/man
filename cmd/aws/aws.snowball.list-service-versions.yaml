name: list-service-versions
description: Lists all supported versions for Snow on-device services.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dependent-services=:
        description: A list of names and versions of dependant services of the requested service.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of `ListServiceVersions` objects to return.
    --next-token=: Because HTTP requests are stateless, this is the starting point for the next list of returned `ListServiceVersionsRequest` versions.
    --service-name=!: The name of the service for which you're requesting supported versions.
completion:
    flag:
        service-name:
            - KUBERNETES
            - EKS_ANYWHERE
documentation:
    command: Lists all supported versions for Snow on-device services. Returns an array of `ServiceVersion` object containing the supported versions for a particular service.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dependent-services: A list of names and versions of dependant services of the requested service.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The maximum number of `ListServiceVersions` objects to return.
        next-token: Because HTTP requests are stateless, this is the starting point for the next list of returned `ListServiceVersionsRequest` versions.
        service-name: The name of the service for which you're requesting supported versions.
