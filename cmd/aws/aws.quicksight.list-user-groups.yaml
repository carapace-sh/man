name: list-user-groups
description: Lists the Amazon Quick Sight groups that an Amazon Quick Sight user is a member of.
flags:
    --aws-account-id=!: The Amazon Web Services account ID that the user is in.
    --max-results=: The maximum number of results to return from this request.
    --namespace=!: The namespace.
    --next-token=: A pagination token that can be used in a subsequent request.
    --user-name=!: The Amazon Quick Sight user name that you want to list group memberships for.
documentation:
    command: Lists the Amazon Quick Sight groups that an Amazon Quick Sight user is a member of.
    flag:
        aws-account-id: The Amazon Web Services account ID that the user is in. Currently, you use the ID for the Amazon Web Services account that contains your Amazon Quick Sight account.
        max-results: The maximum number of results to return from this request.
        namespace: The namespace. Currently, you should set this to `default`.
        next-token: A pagination token that can be used in a subsequent request.
        user-name: The Amazon Quick Sight user name that you want to list group memberships for.
