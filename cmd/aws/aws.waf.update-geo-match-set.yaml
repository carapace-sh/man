name: update-geo-match-set
description: This is **AWS WAF Classic** documentation.
flags:
    --change-token=!: The value returned by the most recent call to [GetChangeToken]().
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --geo-match-set-id=!: The `GeoMatchSetId` of the [GeoMatchSet]() that you want to update.
    --updates=!:
        description: An array of `GeoMatchSetUpdate` objects that you want to insert into or delete from an [GeoMatchSet]().
        nargs: -1
documentation:
    command: |-
        This is **AWS WAF Classic** documentation. For more information, see [AWS WAF Classic](https://docs.aws.amazon.com/waf/latest/developerguide/classic-waf-chapter.html) in the developer guide.

        **For the latest version of AWS WAF**, use the AWS WAFV2 API and see the [AWS WAF Developer Guide](https://docs.aws.amazon.com/waf/latest/developerguide/waf-chapter.html). With the latest version, AWS WAF has a single set of endpoints for regional and global use.

        Inserts or deletes [GeoMatchConstraint]() objects in an `GeoMatchSet`. For each `GeoMatchConstraint` object, you specify the following values:

        - Whether to insert or delete the object from the array. If you want to change an `GeoMatchConstraint` object, you delete the existing object and add a new one.
        - The `Type`. The only valid value for `Type` is `Country`.
        - The `Value`, which is a two character code for the country to add to the `GeoMatchConstraint` object. Valid codes are listed in [GeoMatchConstraint$Value]().

        To create and configure an `GeoMatchSet`, perform the following steps:

        1. Submit a [CreateGeoMatchSet]() request.
        2. Use [GetChangeToken]() to get the change token that you provide in the `ChangeToken` parameter of an [UpdateGeoMatchSet]() request.
        3. Submit an `UpdateGeoMatchSet` request to specify the country that you want AWS WAF to watch for.

        When you update an `GeoMatchSet`, you specify the country that you want to add and/or the country that you want to delete. If you want to change a country, you delete the existing country and add the new one.

        For more information about how to use the AWS WAF API to allow or block HTTP requests, see the [AWS WAF Developer Guide](https://docs.aws.amazon.com/waf/latest/developerguide/).
    flag:
        change-token: The value returned by the most recent call to [GetChangeToken]().
        cli-input-json: |-
            Reads arguments from the JSON string provided.
