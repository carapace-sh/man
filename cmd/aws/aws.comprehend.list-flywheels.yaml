name: list-flywheels
description: Gets a list of the flywheels that you have created.
flags:
    --filter=: Filters the flywheels that are returned.
    --max-results=: Maximum number of results to return in a response.
    --next-token=: Identifies the next page of results to return.
documentation:
    command: Gets a list of the flywheels that you have created.
    flag:
        filter: Filters the flywheels that are returned. You can filter flywheels on their status, or the date and time that they were submitted. You can only set one filter at a time.
        max-results: Maximum number of results to return in a response. The default is 100.
        next-token: Identifies the next page of results to return.
