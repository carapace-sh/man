documentation:
    command: |-
        *(ALPHA)*  Creates a new key within the given keyring.

        The flag `--purpose` is always required when creating a key.
        The flag `--default-algorithm` is required when creating a symmetric signing
        key, an asymmetric key, or an external key. Algorithm and purpose should be
        compatible.

        The optional flags `--rotation-period` and `--next-rotation-time` define a
        rotation schedule for the key. A schedule can also be defined
        by the `--create-rotation-schedule` command.

        The flag `--next-rotation-time` must be in ISO 8601 or RFC3339 format,
        and `rotation-period` must be in the form INTEGER[UNIT], where units
        can be one of seconds (s), minutes (m), hours (h) or days (d).

        The optional flag `--protection-level` specifies the physical environment
        where crypto operations with the key happen. The default is ``software''; use
        ``hsm'' to create a hardware-backed key, ``external'' to create an
        externally backed key, or ``external-vpc'' to create an external key over vpc.

        The optional flag `--labels` defines a user specified key/value pair for the
        given key.

        The flag `--skip-initial-version-creation` creates a CryptoKey with no
        versions. If you import into the CryptoKey, or create a new version in that
        CryptoKey, there will be no primary version until one is set using the
        `--set-primary-version` command. You must include
        `--skip-initial-version-creation` when creating a CryptoKey with protection
        level ``external'' or ``external-vpc''.

        The optional flag `--import-only` restricts the key to imported key versions
        only. To do so, the flag `--skip-initial-version-creation` must also be set.

        The optional flag `--destroy-scheduled-duration` defines the destroy schedule
        for the key, and must be in the form INTEGER[UNIT], where units can be one of
        seconds (s), minutes (m), hours (h) or days (d).

        The flag `--crypto-key-backend` defines the resource name for the
        backend where the key resides. Required for ``external-vpc'' keys.

        The optional flag `--allowed-access-reasons` defines the Key Access
        Justifications Policy for the key, and is specified as a comma separated list
        of zero or more justification codes defined in
        https://cloud.google.com/assured-workloads/key-access-justifications/docs/justification-codes.
        The key must be enrolled in Key Access Justifications to use this flag.

        ## EXAMPLES

        The following command creates a key named ``frodo'' with protection level
        ``software'' within the keyring ``fellowship'' and location ``us-east1'':

          $ gcloud alpha kms keys create frodo \
              --location=us-east1 \
              --keyring=fellowship \
              --purpose=encryption

        The following command creates a key named ``strider'' with protection level
        ``software'' within the keyring ``rangers'' and location ``global'' with a
        specified rotation schedule:

          $ gcloud alpha kms keys create strider \
              --location=global --keyring=rangers \
              --purpose=encryption \
              --rotation-period=30d \
              --next-rotation-time=2017-10-12T12:34:56.1234Z

        The following command creates a raw encryption key named ``foo'' with
        protection level ``software'' within the keyring ``fellowship'' and location
        ``us-east1'' with two specified labels:

          $ gcloud alpha kms keys create foo \
              --location=us-east1 \
              --keyring=fellowship \
              --purpose=raw-encryption \
              --default-algorithm=aes-128-cbc
              --labels=env=prod,team=kms

        The following command creates an asymmetric key named ``samwise'' with
        protection level ``software'' and default algorithm ``ec-sign-p256-sha256''
        within the keyring ``fellowship'' and location ``us-east1'':

          $ gcloud alpha kms keys create samwise \
              --location=us-east1 \
              --keyring=fellowship \
              --purpose=asymmetric-signing \
              --default-algorithm=ec-sign-p256-sha256

        The following command creates a key named ``gimli'' with protection level
        ``hsm'' and default algorithm ``google-symmetric-encryption'' within the
        keyring ``fellowship'' and location ``us-east1'':

          $ gcloud alpha kms keys create gimli \
              --location=us-east1 \
              --keyring=fellowship \
              --purpose=encryption \
              --protection-level=hsm

        The following command creates a key named ``legolas'' with protection level
        ``external'' and default algorithm ``external-symmetric-encryption'' within
        the keyring ``fellowship'' and location ``us-central1'':

          $ gcloud alpha kms keys create legolas \
              --location=us-central1 \
              --keyring=fellowship \
              --purpose=encryption \
              --default-algorithm=external-symmetric-encryption \
              --protection-level=external
              --skip-initial-version-creation

        The following command creates a key named ``bilbo'' with protection level
        ``external-vpc'' and default algorithm ``external-symmetric-encryption'' and
        an EkmConnection of ``eagles'' within the keyring ``fellowship'' and location
        ``us-central1'':

          $ gcloud alpha kms keys create bilbo \
              --location=us-central1 \
              --keyring=fellowship \
              --purpose=encryption \
              --default-algorithm=external-symmetric-encryption \
              --protection-level=external-vpc
              --skip-initial-version-creation
              --crypto-key-backend="projects/$(gcloud config get project)/
              locations/us-central1/ekmConnections/eagles"

        The following command creates a key named ``arwen'' with protection level
        ``software'' within the keyring ``fellowship'' and location ``us-east1'' with
        a Key Access Justifications policy that allows access reasons
        ``customer-initiated-access'' and ``google-initiated-system-operation'':

          $ gcloud alpha kms keys create arwen \
              --location=us-east1 \
              --keyring=fellowship \
              --purpose=encryption \
              --allowed-access-reasons=customer-initiated-access,google-initiated-system-operation
    flag:
        allowed-access-reasons: 'The list of allowed Key Access Justifications access reasons on the key. The key must be enrolled in Key Access Justifications to configure this field. By default, this field is absent, and all justification codes are allowed. For more information about justification codes, see https://cloud.google.com/assured-workloads/key-access-justifications/docs/justification-codes. _ALLOWED_ACCESS_REASONS_ must be one of: *customer-authorized-workflow-servicing*, *customer-initiated-access*, *customer-initiated-support*, *google-initiated-review*, *google-initiated-service*, *google-initiated-system-operation*, *google-response-to-production-alert*, *modified-customer-initiated-access*, *modified-google-initiated-system-operation*, *reason-not-expected*, *reason-unspecified*, *third-party-data-request*.'
        crypto-key-backend: The resource name of the backend environment where the key material for all CryptoKeyVersions associated with this CryptoKey reside and where all related cryptographic operations are performed. Currently only applicable for EXTERNAL_VPC and EkmConnection resource names.
        default-algorithm: 'The default algorithm for the crypto key. For more information about choosing an algorithm, see https://cloud.google.com/kms/docs/algorithms. _DEFAULT_ALGORITHM_ must be one of: *aes-128-cbc*, *aes-128-ctr*, *aes-128-gcm*, *aes-256-cbc*, *aes-256-ctr*, *aes-256-gcm*, *ec-sign-ed25519*, *ec-sign-p256-sha256*, *ec-sign-p384-sha384*, *ec-sign-secp256k1-sha256*, *external-symmetric-encryption*, *google-symmetric-encryption*, *hmac-sha1*, *hmac-sha224*, *hmac-sha256*, *hmac-sha384*, *hmac-sha512*, *kem-xwing*, *ml-kem-1024*, *ml-kem-768*, *pq-sign-hash-slh-dsa-sha2-128s-sha256*, *pq-sign-ml-dsa-65*, *pq-sign-slh-dsa-sha2-128s*, *rsa-decrypt-oaep-2048-sha1*, *rsa-decrypt-oaep-2048-sha256*, *rsa-decrypt-oaep-3072-sha1*, *rsa-decrypt-oaep-3072-sha256*, *rsa-decrypt-oaep-4096-sha1*, *rsa-decrypt-oaep-4096-sha256*, *rsa-decrypt-oaep-4096-sha512*, *rsa-sign-pkcs1-2048-sha256*, *rsa-sign-pkcs1-3072-sha256*, *rsa-sign-pkcs1-4096-sha256*, *rsa-sign-pkcs1-4096-sha512*, *rsa-sign-pss-2048-sha256*, *rsa-sign-pss-3072-sha256*, *rsa-sign-pss-4096-sha256*, *rsa-sign-pss-4096-sha512*, *rsa-sign-raw-pkcs1-2048*, *rsa-sign-raw-pkcs1-3072*, *rsa-sign-raw-pkcs1-4096*.'
        destroy-scheduled-duration: The amount of time that versions of the key should spend in the DESTROY_SCHEDULED state before transitioning to DESTROYED. See $ gcloud topic datetimes for information on duration formats.
        import-only: Restrict this key to imported versions only.
        keyring: |-
            The KMS keyring of the key.
            +
            To set the `keyring` attribute:
            * provide the argument `key` on the command line with a fully specified name;
            * provide the argument `--keyring` on the command line.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The Google Cloud location for the key.
            +
            To set the `location` attribute:
            * provide the argument `key` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        next-rotation-time: Next automatic rotation time of the key. See $ gcloud topic datetimes for information on time formats.
        no-import-only: Restrict this key to imported versions only.
        no-skip-initial-version-creation: Skip creating the first version in a key and setting it as primary during creation.
        protection-level: 'Protection level of the key. _PROTECTION_LEVEL_ must be one of: *software*, *hsm*, *external*, *external-vpc*.'
        purpose: 'The "purpose" of the key. _PURPOSE_ must be one of: *asymmetric-encryption*, *asymmetric-signing*, *encryption*, *key-encapsulation*, *mac*, *raw-encryption*.'
        rotation-period: Automatic rotation period of the key. See $ gcloud topic datetimes for information on duration formats.
        skip-initial-version-creation: Skip creating the first version in a key and setting it as primary during creation.
