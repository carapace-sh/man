name: list-organization-insights
description: Returns a list of insights associated with the account or OU Id.
flags:
    --account-ids=: The ID of the Amazon Web Services account.
    --max-results=: The maximum number of results to return with a single call.
    --next-token=: The pagination token to use to retrieve the next page of results for this operation.
    --organizational-unit-ids=: The ID of the organizational unit.
    --status-filter=!: ""
documentation:
    command: Returns a list of insights associated with the account or OU Id.
    flag:
        account-ids: The ID of the Amazon Web Services account.
        max-results: The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned `nextToken` value.
        next-token: The pagination token to use to retrieve the next page of results for this operation. If this value is null, it retrieves the first page.
        organizational-unit-ids: The ID of the organizational unit.
        status-filter: ""
