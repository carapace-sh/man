name: enroll
description: '*(ALPHA)*  Enroll a node pool of a standalone cluster in Anthos on bare metal.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --cluster=: cluster of the node_pool.
    --location=: Google Cloud location for the node_pool.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-validate-only&: If set, only validate the request, but do not actually perform the operation.
    --validate-only: If set, only validate the request, but do not actually perform the operation.
documentation:
    command: '*(ALPHA)*  Enroll a node pool of a standalone cluster in Anthos on bare metal.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        cluster: |-
            cluster of the node_pool.
            +
            To set the `cluster` attribute:
            * provide the argument `node_pool` on the command line with a fully specified name;
            * provide the argument `--cluster` on the command line.
        location: |-
            Google Cloud location for the node_pool.
            +
            To set the `location` attribute:
            * provide the argument `node_pool` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_bare_metal/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-validate-only: If set, only validate the request, but do not actually perform the operation.
        validate-only: If set, only validate the request, but do not actually perform the operation.
