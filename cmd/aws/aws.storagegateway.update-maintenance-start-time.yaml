name: update-maintenance-start-time
description: Updates a gateway's maintenance window schedule, with settings for monthly or weekly cadence, specific day and time to begin maintenance, and which types of updates to apply.
flags:
    --day-of-month=: The day of the month component of the maintenance start time represented as an ordinal number from 1 to 28, where 1 represents the first day of the month.
    --day-of-week=: The day of the week component of the maintenance start time week represented as an ordinal number from 0 to 6, where 0 represents Sunday and 6 represents Saturday.
    --gateway-arn=!: ""
    --hour-of-day=: The hour component of the maintenance start time represented as *hh*, where *hh* is the hour (00 to 23).
    --minute-of-hour=: The minute component of the maintenance start time represented as *mm*, where *mm* is the minute (00 to 59).
    --software-update-preferences=: A set of variables indicating the software update preferences for the gateway.
documentation:
    command: |-
        Updates a gateway's maintenance window schedule, with settings for monthly or weekly cadence, specific day and time to begin maintenance, and which types of updates to apply. Time configuration uses the gateway's time zone. You can pass values for a complete maintenance schedule, or update policy, or both. Previous values will persist for whichever setting you choose not to modify. If an incomplete or invalid maintenance schedule is passed, the entire request will be rejected with an error and no changes will occur.

        A complete maintenance schedule must include values for *both* `MinuteOfHour` and `HourOfDay`, and *either* `DayOfMonth` *or* `DayOfWeek`.

        We recommend keeping maintenance updates turned on, except in specific use cases where the brief disruptions caused by updating the gateway could critically impact your deployment.
    flag:
        day-of-month: The day of the month component of the maintenance start time represented as an ordinal number from 1 to 28, where 1 represents the first day of the month. It is not possible to set the maintenance schedule to start on days 29 through 31.
        day-of-week: The day of the week component of the maintenance start time week represented as an ordinal number from 0 to 6, where 0 represents Sunday and 6 represents Saturday.
        gateway-arn: ""
        hour-of-day: The hour component of the maintenance start time represented as *hh*, where *hh* is the hour (00 to 23). The hour of the day is in the time zone of the gateway.
        minute-of-hour: The minute component of the maintenance start time represented as *mm*, where *mm* is the minute (00 to 59). The minute of the hour is in the time zone of the gateway.
        software-update-preferences: |-
            A set of variables indicating the software update preferences for the gateway.

            Includes `AutomaticUpdatePolicy` field with the following inputs:

            `ALL_VERSIONS` - Enables regular gateway maintenance updates.

            `EMERGENCY_VERSIONS_ONLY` - Disables regular gateway maintenance updates. The gateway will still receive emergency version updates on rare occasions if necessary to remedy highly critical security or durability issues. You will be notified before an emergency version update is applied. These updates are applied during your gateway's scheduled maintenance window.
