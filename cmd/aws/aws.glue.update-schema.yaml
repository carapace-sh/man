name: update-schema
description: Updates the description, compatibility setting, or version checkpoint for a schema set.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --compatibility=: The new compatibility setting for the schema.
    --description=: The new description for the schema.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --schema-id=!: This is a wrapper structure to contain schema identity fields.
    --schema-version-number=: Version number required for check pointing.
completion:
    flag:
        compatibility:
            - NONE
            - DISABLED
            - BACKWARD
            - BACKWARD_ALL
            - FORWARD
            - FORWARD_ALL
            - FULL
            - FULL_ALL
documentation:
    command: |-
        Updates the description, compatibility setting, or version checkpoint for a schema set.

        For updating the compatibility setting, the call will not validate compatibility for the entire set of schema versions with the new compatibility setting. If the value for `Compatibility` is provided, the `VersionNumber` (a checkpoint) is also required. The API will validate the checkpoint version number for consistency.

        If the value for the `VersionNumber` (checkpoint) is provided, `Compatibility` is optional and this can be used to set/reset a checkpoint for the schema.

        This update will happen only if the schema is in the AVAILABLE state.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        compatibility: The new compatibility setting for the schema.
        description: The new description for the schema.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        schema-id: |-
            This is a wrapper structure to contain schema identity fields. The structure contains:

            - SchemaId$SchemaArn: The Amazon Resource Name (ARN) of the schema. One of `SchemaArn` or `SchemaName` has to be provided.
            - SchemaId$SchemaName: The name of the schema. One of `SchemaArn` or `SchemaName` has to be provided.
        schema-version-number: Version number required for check pointing. One of `VersionNumber` or `Compatibility` has to be provided.
