name: create
description: Create a connection.
flags:
    --application-template=: For resources [connection, destination-component-uri], provides fallback value for resource application-template attribute.
    --component=: The component id of the connection resource.
    --destination-component-parameters=: The parameters of the connection associated with the destination component.
    --destination-component-uri=!: ID of the component or fully qualified identifier for the component.
    --location=: For resources [connection, destination-component-uri], provides fallback value for resource location attribute.
    --source-component-parameters=: The parameters of the connection associated with the source component.
    --space=: For resources [connection, destination-component-uri], provides fallback value for resource space attribute.
documentation:
    command: Create a connection between components in an application template.
    flag:
        application-template: For resources [connection, destination-component-uri], provides fallback value for resource application-template attribute. When the resource's full URI path is not provided, application-template will fallback to this flag value.
        component: |-
            The component id of the connection resource.
            +
            To set the `component` attribute:
            * provide the argument `connection` on the command line with a fully specified name;
            * provide the argument `--component` on the command line.
        destination-component-parameters: |-
            The parameters of the connection associated with the destination component.
            +
            *key*:::
            The key of the parameter.
            +
            *value*:::
            The value of the parameter.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --destination-component-parameters=key=string,value={...} --destination-component-parameters=key=string,value={...}
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --destination-component-parameters='[{"key": "string", "value": {...}}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --destination-component-parameters=path_to_file.(yaml|json)
            +
            ```
        destination-component-uri: |-
            ID of the component or fully qualified identifier for the component.
            +
            To set the `component` attribute:
            * provide the argument `--destination-component-uri` on the command line.
        location: For resources [connection, destination-component-uri], provides fallback value for resource location attribute. When the resource's full URI path is not provided, location will fallback to this flag value.
        source-component-parameters: |-
            The parameters of the connection associated with the source component.
            +
            *key*:::
            The key of the parameter.
            +
            *value*:::
            The value of the parameter.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --source-component-parameters=key=string,value={...} --source-component-parameters=key=string,value={...}
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --source-component-parameters='[{"key": "string", "value": {...}}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --source-component-parameters=path_to_file.(yaml|json)
            +
            ```
        space: For resources [connection, destination-component-uri], provides fallback value for resource space attribute. When the resource's full URI path is not provided, space will fallback to this flag value.
