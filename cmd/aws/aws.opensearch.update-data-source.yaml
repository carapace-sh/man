name: update-data-source
description: Updates a direct-query data source.
flags:
    --data-source-type=!: The type of data source.
    --description=: A new description of the data source.
    --domain-name=!: The name of the domain.
    --name=!: The name of the data source to modify.
    --status=: The status of the data source update.
completion:
    flag:
        status:
            - ACTIVE
            - DISABLED
documentation:
    command: Updates a direct-query data source. For more information, see [Working with Amazon OpenSearch Service data source integrations with Amazon S3](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/direct-query-s3-creating.html).
    flag:
        data-source-type: The type of data source.
        description: A new description of the data source.
        domain-name: The name of the domain.
        name: The name of the data source to modify.
        status: The status of the data source update.
