name: wait
description: '*(BETA)*  Poll an operation for completion.'
flags:
    --location=: Google Cloud location for the operation.
documentation:
    command: '*(BETA)*  Poll an operation for completion.'
    flag:
        location: |-
            Google Cloud location for the operation.
            +
            To set the `location` attribute:
            * provide the argument `operation_id` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_bare_metal/location`.
