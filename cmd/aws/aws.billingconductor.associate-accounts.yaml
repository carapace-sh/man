name: associate-accounts
description: Connects an array of account IDs in a consolidated billing family to a predefined billing group.
flags:
    --account-ids=!: The associating array of account IDs.
    --arn=!: The Amazon Resource Name (ARN) of the billing group that associates the array of account IDs.
documentation:
    command: Connects an array of account IDs in a consolidated billing family to a predefined billing group. The account IDs must be a part of the consolidated billing family during the current month, and not already associated with another billing group. The maximum number of accounts that can be associated in one call is 30.
    flag:
        account-ids: The associating array of account IDs.
        arn: The Amazon Resource Name (ARN) of the billing group that associates the array of account IDs.
