name: import-terminology
description: Creates or updates a custom terminology, depending on whether one already exists for the given terminology name.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --data-file=!: The path to the file of the code you are uploading.
    --description=: The description of the custom terminology being imported.
    --encryption-key=: The encryption key for the custom terminology being imported.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --merge-strategy=!: The merge strategy of the custom terminology being imported.
    --name=!: The name of the custom terminology being imported.
    --tags=: Tags to be associated with this resource.
    --terminology-data=!: The terminology data for the custom terminology being imported.
completion:
    flag:
        merge-strategy:
            - OVERWRITE
documentation:
    command: |-
        Creates or updates a custom terminology, depending on whether one already exists for the given terminology name. Importing a terminology with the same name as an existing one will merge the terminologies based on the chosen merge strategy. The only supported merge strategy is OVERWRITE, where the imported terminology overwrites the existing terminology of the same name.

        If you import a terminology that overwrites an existing one, the new terminology takes up to 10 minutes to fully propagate. After that, translations have access to the new terminology.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The description of the custom terminology being imported.
        encryption-key: The encryption key for the custom terminology being imported.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        merge-strategy: The merge strategy of the custom terminology being imported. Currently, only the OVERWRITE merge strategy is supported. In this case, the imported terminology will overwrite an existing terminology of the same name.
        name: The name of the custom terminology being imported.
        tags: Tags to be associated with this resource. A tag is a key-value pair that adds metadata to a resource. Each tag key for the resource must be unique. For more information, see [Tagging your resources](https://docs.aws.amazon.com/translate/latest/dg/tagging.html).
        terminology-data: The terminology data for the custom terminology being imported.
