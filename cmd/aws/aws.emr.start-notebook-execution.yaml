name: start-notebook-execution
description: Starts a notebook execution.
flags:
    --editor-id=: The unique identifier of the Amazon EMR Notebook to use for notebook execution.
    --environment-variables=: The environment variables associated with the notebook execution.
    --execution-engine=!: Specifies the execution engine (cluster) that runs the notebook execution.
    --notebook-execution-name=: An optional name for the notebook execution.
    --notebook-instance-security-group-id=: The unique identifier of the Amazon EC2 security group to associate with the Amazon EMR Notebook for this notebook execution.
    --notebook-params=: Input parameters in JSON format passed to the Amazon EMR Notebook at runtime for execution.
    --notebook-s3-location=: The Amazon S3 location for the notebook execution input.
    --output-notebook-format=: The output format for the notebook execution.
    --output-notebook-s3-location=: The Amazon S3 location for the notebook execution output.
    --relative-path=: The path and file name of the notebook file for this execution, relative to the path specified for the Amazon EMR Notebook.
    --service-role=!: The name or ARN of the IAM role that is used as the service role for Amazon EMR (the Amazon EMR role) for the notebook execution.
    --tags=: A list of tags associated with a notebook execution.
completion:
    flag:
        output-notebook-format:
            - HTML
documentation:
    command: Starts a notebook execution.
    flag:
        editor-id: The unique identifier of the Amazon EMR Notebook to use for notebook execution.
        environment-variables: The environment variables associated with the notebook execution.
        execution-engine: Specifies the execution engine (cluster) that runs the notebook execution.
        notebook-execution-name: An optional name for the notebook execution.
        notebook-instance-security-group-id: The unique identifier of the Amazon EC2 security group to associate with the Amazon EMR Notebook for this notebook execution.
        notebook-params: Input parameters in JSON format passed to the Amazon EMR Notebook at runtime for execution.
        notebook-s3-location: The Amazon S3 location for the notebook execution input.
        output-notebook-format: The output format for the notebook execution.
        output-notebook-s3-location: The Amazon S3 location for the notebook execution output.
        relative-path: The path and file name of the notebook file for this execution, relative to the path specified for the Amazon EMR Notebook. For example, if you specify a path of `s3://MyBucket/MyNotebooks` when you create an Amazon EMR Notebook for a notebook with an ID of `e-ABCDEFGHIJK1234567890ABCD` (the `EditorID` of this request), and you specify a `RelativePath` of `my_notebook_executions/notebook_execution.ipynb`, the location of the file for the notebook execution is `s3://MyBucket/MyNotebooks/e-ABCDEFGHIJK1234567890ABCD/my_notebook_executions/notebook_execution.ipynb`.
        service-role: The name or ARN of the IAM role that is used as the service role for Amazon EMR (the Amazon EMR role) for the notebook execution.
        tags: A list of tags associated with a notebook execution. Tags are user-defined key-value pairs that consist of a required key string with a maximum of 128 characters and an optional value string with a maximum of 256 characters.
