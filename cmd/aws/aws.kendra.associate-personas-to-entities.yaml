name: associate-personas-to-entities
description: Defines the specific permissions of users or groups in your IAM Identity Center identity source with access to your Amazon Kendra experience.
flags:
    --id=!: The identifier of your Amazon Kendra experience.
    --index-id=!: The identifier of the index for your Amazon Kendra experience.
    --personas=!: The personas that define the specific permissions of users or groups in your IAM Identity Center identity source.
documentation:
    command: Defines the specific permissions of users or groups in your IAM Identity Center identity source with access to your Amazon Kendra experience. You can create an Amazon Kendra experience such as a search application. For more information on creating a search application experience, see [Building a search experience with no code](https://docs.aws.amazon.com/kendra/latest/dg/deploying-search-experience-no-code.html).
    flag:
        id: The identifier of your Amazon Kendra experience.
        index-id: The identifier of the index for your Amazon Kendra experience.
        personas: The personas that define the specific permissions of users or groups in your IAM Identity Center identity source. The available personas or access roles are `Owner` and `Viewer`. For more information on these personas, see [Providing access to your search page](https://docs.aws.amazon.com/kendra/latest/dg/deploying-search-experience-no-code.html#access-search-experience).
