name: create-partnership
description: Creates a partnership between a customer and a trading partner, based on the supplied parameters.
flags:
    --capabilities=!:
        description: Specifies a list of the capabilities associated with this partnership.
        nargs: -1
    --capability-options=: Specify the structure that contains the details for the associated capabilities.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Reserved for future use.
    --email=!: Specifies the email address associated with this trading partner.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: Specifies a descriptive name for the partnership.
    --phone=: Specifies the phone number associated with the partnership.
    --profile-id=!: Specifies the unique, system-generated identifier for the profile connected to this partnership.
    --tags=:
        description: Specifies the key-value pairs assigned to ARNs that you can use to group and search for resources by type.
        nargs: -1
documentation:
    command: Creates a partnership between a customer and a trading partner, based on the supplied parameters. A partnership represents the connection between you and your trading partner. It ties together a profile and one or more trading capabilities.
    flag:
        capabilities: Specifies a list of the capabilities associated with this partnership.
        capability-options: Specify the structure that contains the details for the associated capabilities.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Reserved for future use.
        email: Specifies the email address associated with this trading partner.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: Specifies a descriptive name for the partnership.
        phone: Specifies the phone number associated with the partnership.
        profile-id: Specifies the unique, system-generated identifier for the profile connected to this partnership.
        tags: Specifies the key-value pairs assigned to ARNs that you can use to group and search for resources by type. You can attach this metadata to resources (capabilities, partnerships, and so on) for any purpose.
