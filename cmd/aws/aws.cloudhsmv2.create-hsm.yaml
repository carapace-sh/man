name: create-hsm
description: Creates a new hardware security module (HSM) in the specified CloudHSM cluster.
flags:
    --availability-zone=!: The Availability Zone where you are creating the HSM.
    --cluster-id=!: The identifier (ID) of the HSM's cluster.
    --ip-address=: The HSM's IP address.
documentation:
    command: |-
        Creates a new hardware security module (HSM) in the specified CloudHSM cluster.

        **Cross-account use:** No. You cannot perform this operation on an CloudHSM cluster in a different Amazon Web Service account.
    flag:
        availability-zone: The Availability Zone where you are creating the HSM. To find the cluster's Availability Zones, use [DescribeClusters]().
        cluster-id: The identifier (ID) of the HSM's cluster. To find the cluster ID, use [DescribeClusters]().
        ip-address: The HSM's IP address. If you specify an IP address, use an available address from the subnet that maps to the Availability Zone where you are creating the HSM. If you don't specify an IP address, one is chosen for you from that subnet.
