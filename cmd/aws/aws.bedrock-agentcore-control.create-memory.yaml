name: create-memory
description: Creates a new Amazon Bedrock AgentCore Memory resource.
flags:
    --client-token=: A unique, case-sensitive identifier to ensure that the operation completes no more than one time.
    --description=: The description of the memory.
    --encryption-key-arn=: The Amazon Resource Name (ARN) of the KMS key used to encrypt the memory data.
    --event-expiry-duration=!: The duration after which memory events expire.
    --memory-execution-role-arn=: The Amazon Resource Name (ARN) of the IAM role that provides permissions for the memory to access Amazon Web Services services.
    --memory-strategies=: The memory strategies to use for this memory.
    --name=!: The name of the memory.
    --tags=: A map of tag keys and values to assign to an AgentCore Memory.
documentation:
    command: Creates a new Amazon Bedrock AgentCore Memory resource.
    flag:
        client-token: A unique, case-sensitive identifier to ensure that the operation completes no more than one time. If this token matches a previous request, Amazon Bedrock ignores the request but does not return an error.
        description: The description of the memory.
        encryption-key-arn: The Amazon Resource Name (ARN) of the KMS key used to encrypt the memory data.
        event-expiry-duration: The duration after which memory events expire. Specified as an ISO 8601 duration.
        memory-execution-role-arn: The Amazon Resource Name (ARN) of the IAM role that provides permissions for the memory to access Amazon Web Services services.
        memory-strategies: The memory strategies to use for this memory. Strategies define how information is extracted, processed, and consolidated.
        name: The name of the memory. The name must be unique within your account.
        tags: A map of tag keys and values to assign to an AgentCore Memory. Tags enable you to categorize your resources in different ways, for example, by purpose, owner, or environment.
