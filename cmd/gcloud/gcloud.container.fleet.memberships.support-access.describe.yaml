name: describe
description: Describe support access for the specified membership.
flags:
    --location=: The location of the membership resource, e.g. `us-central1`.
documentation:
    command: |-
        ## EXAMPLES

          To describe support access for membership `my-membership` run:

            $ gcloud container fleet memberships support-access describe my-membership
    flag:
        location: |-
            The location of the membership resource, e.g. `us-central1`.
            If not specified, defaults to `global`.
            +

            To set the `location` attribute:
            * provide the argument `MEMBERSHIP_NAME` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkehub/location`.
