name: add-attestation-rule
description: Add an attestation rule on a workload identity pool.
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --google-cloud-resource=!: A single workload running on Google Cloud.
    --location=: The location name.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: Add an attestation rule on a workload identity pool.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        google-cloud-resource: |-
            A single workload running on Google Cloud. This will be set
                            in the attestation rule to be added.
        location: |-
            The location name.
            +
            To set the `location` attribute:
            * provide the argument `workload_identity_pool` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
