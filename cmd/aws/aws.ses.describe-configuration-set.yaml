name: describe-configuration-set
description: Returns the details of the specified configuration set.
flags:
    --configuration-set-attribute-names=: A list of configuration set attributes to return.
    --configuration-set-name=!: The name of the configuration set to describe.
documentation:
    command: |-
        Returns the details of the specified configuration set. For information about using configuration sets, see the [Amazon SES Developer Guide](https://docs.aws.amazon.com/ses/latest/dg/monitor-sending-activity.html).

        You can execute this operation no more than once per second.
    flag:
        configuration-set-attribute-names: A list of configuration set attributes to return.
        configuration-set-name: The name of the configuration set to describe.
