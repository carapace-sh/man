name: untag-resource
description: Removes one or more tags (keys and values) from an Amazon Macie resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource.
    --tag-keys=!: One or more tags (keys) to remove from the resource.
documentation:
    command: Removes one or more tags (keys and values) from an Amazon Macie resource.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource.
        tag-keys: One or more tags (keys) to remove from the resource. In an HTTP request to remove multiple tags, append the tagKeys parameter and argument for each tag to remove, separated by an ampersand (&amp;).
