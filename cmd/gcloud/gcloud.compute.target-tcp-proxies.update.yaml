name: update
description: Update a target TCP proxy.
flags:
    --backend-service=: A backend service that will be used for connections to the target TCP
    --proxy-header=: The type of proxy protocol header to be sent to the backend.
completion:
    flag:
        proxy-header:
            - NONE
            - PROXY_V1
documentation:
    command: "\n*gcloud compute target-tcp-proxies update* is used to change the backend service or proxy header\nof existing target TCP proxies. A target TCP proxy is referenced\nby one or more forwarding rules which define which packets the\nproxy is responsible for routing. The target TCP proxy in turn\npoints to a backend service which will handle the requests.  "
    flag:
        backend-service: |-
            A backend service that will be used for connections to the target TCP
            proxy.
        proxy-header: |-
            The type of proxy protocol header to be sent to the backend. _PROXY_HEADER_ must be one of:
            +
            *NONE*::: No proxy header is added.
            *PROXY_V1*::: Enables PROXY protocol (version 1) for passing client connection information.
            :::
            +
