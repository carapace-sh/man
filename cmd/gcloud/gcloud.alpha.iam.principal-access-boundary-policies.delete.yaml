documentation:
    command: |
        *(ALPHA)*  Delete PrincipalAccessBoundaryPolicy instance.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        etag: |-
            The etag of the principal access boundary policy.
            If this is provided, it must match the server's etag.
        force: |-
            If set to true, the request will force the deletion of the policy even if
            the policy is referenced in policy bindings.
        location: |-
            The location id of the principalAccessBoundaryPolicy resource.
            +
            To set the `location` attribute:
            * provide the argument `principal_access_boundary_policy` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-force: |-
            If set to true, the request will force the deletion of the policy even if
            the policy is referenced in policy bindings.
        organization: |-
            The organization id of the principalAccessBoundaryPolicy resource.
            +
            To set the `organization` attribute:
            * provide the argument `principal_access_boundary_policy` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
