name: detach-certificate-from-distribution
description: Detaches an SSL/TLS certificate from your Amazon Lightsail content delivery network (CDN) distribution.
flags:
    --distribution-name=!: The name of the distribution from which to detach the certificate.
documentation:
    command: |-
        Detaches an SSL/TLS certificate from your Amazon Lightsail content delivery network (CDN) distribution.

        After the certificate is detached, your distribution stops accepting traffic for all of the domains that are associated with the certificate.
    flag:
        distribution-name: |-
            The name of the distribution from which to detach the certificate.

            Use the `GetDistributions` action to get a list of distribution names that you can specify.
