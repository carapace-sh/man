name: create-authorizer
description: Creates an authorizer.
flags:
    --authorizer-function-arn=!: The ARN of the authorizer's Lambda function.
    --authorizer-name=!: The authorizer name.
    --enable-caching-for-http=: When `true`, the result from the authorizer’s Lambda function is cached for clients that use persistent HTTP connections.
    --signing-disabled=: Specifies whether IoT validates the token signature in an authorization request.
    --status=: The status of the create authorizer request.
    --tags=: Metadata which can be used to manage the custom authorizer.
    --token-key-name=: The name of the token key used to extract the token from the HTTP headers.
    --token-signing-public-keys=: The public keys used to verify the digital signature returned by your custom authentication service.
completion:
    flag:
        status:
            - ACTIVE
            - INACTIVE
documentation:
    command: |-
        Creates an authorizer.

        Requires permission to access the [CreateAuthorizer](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        authorizer-function-arn: The ARN of the authorizer's Lambda function.
        authorizer-name: The authorizer name.
        enable-caching-for-http: |-
            When `true`, the result from the authorizer’s Lambda function is cached for clients that use persistent HTTP connections. The results are cached for the time specified by the Lambda function in `refreshAfterInSeconds`. This value does not affect authorization of clients that use MQTT connections.

            The default value is `false`.
        signing-disabled: Specifies whether IoT validates the token signature in an authorization request.
        status: The status of the create authorizer request.
        tags: |-
            Metadata which can be used to manage the custom authorizer.

            For URI Request parameters use format: ...key1=value1&amp;key2=value2...

            For the CLI command-line parameter use format: &amp;&amp;tags "key1=value1&amp;key2=value2..."

            For the cli-input-json file use format: "tags": "key1=value1&amp;key2=value2..."
        token-key-name: The name of the token key used to extract the token from the HTTP headers.
        token-signing-public-keys: The public keys used to verify the digital signature returned by your custom authentication service.
