name: start-file-transfer
description: Begins a file transfer between local Amazon Web Services storage and a remote AS2 or SFTP server.
flags:
    --connector-id=!: The unique identifier for the connector.
    --local-directory-path=: For an inbound transfer, the `LocaDirectoryPath` specifies the destination for one or more files that are transferred from the partner's SFTP server.
    --remote-directory-path=: For an outbound transfer, the `RemoteDirectoryPath` specifies the destination for one or more files that are transferred to the partner's SFTP server.
    --retrieve-file-paths=: One or more source paths for the partner's SFTP server.
    --send-file-paths=: One or more source paths for the Amazon S3 storage.
documentation:
    command: "Begins a file transfer between local Amazon Web Services storage and a remote AS2 or SFTP server.\n\n- For an AS2 connector, you specify the `ConnectorId` and one or more `SendFilePaths` to identify the files you want to transfer.\n- For an SFTP connector, the file transfer can be either outbound or inbound. In both cases, you specify the `ConnectorId`. Depending on the direction of the transfer, you also specify the following items:\n  \n  - If you are transferring file from a partner's SFTP server to Amazon Web Services storage, you specify one or more `RetrieveFilePaths` to identify the files you want to transfer, and a `LocalDirectoryPath` to specify the destination folder.\n  - If you are transferring file to a partner's SFTP server from Amazon Web Services storage, you specify one or more `SendFilePaths` to identify the files you want to transfer, and a `RemoteDirectoryPath` to specify the destination folder."
    flag:
        connector-id: The unique identifier for the connector.
        local-directory-path: For an inbound transfer, the `LocaDirectoryPath` specifies the destination for one or more files that are transferred from the partner's SFTP server.
        remote-directory-path: For an outbound transfer, the `RemoteDirectoryPath` specifies the destination for one or more files that are transferred to the partner's SFTP server. If you don't specify a `RemoteDirectoryPath`, the destination for transferred files is the SFTP user's home directory.
        retrieve-file-paths: One or more source paths for the partner's SFTP server. Each string represents a source file path for one inbound file transfer.
        send-file-paths: |-
            One or more source paths for the Amazon S3 storage. Each string represents a source file path for one outbound file transfer. For example, `amzn-s3-demo-bucket/myfile.txt`.

            Replace `amzn-s3-demo-bucket` with one of your actual buckets.
