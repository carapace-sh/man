name: get-plan
description: Gets code to perform a specified mapping.
flags:
    --additional-plan-options-map=: A map to hold additional optional key-value parameters.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --language=: The programming language of the code to perform the mapping.
    --location=: The parameters for the mapping.
    --mapping=!: The list of mappings from a source table to target tables.
    --sinks=: The target tables.
    --source=!: The source table.
completion:
    flag:
        language:
            - PYTHON
            - SCALA
documentation:
    command: Gets code to perform a specified mapping.
    flag:
        additional-plan-options-map: "A map to hold additional optional key-value parameters.\n\nCurrently, these key-value pairs are supported:\n\n- `inferSchema`  —  Specifies whether to set `inferSchema` to true or false for the default script generated by an Glue job. For example, to set `inferSchema` to true, pass the following key value pair:\n  \n  `--additional-plan-options-map '{\"inferSchema\":\"true\"}'`"
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        language: The programming language of the code to perform the mapping.
        location: The parameters for the mapping.
        mapping: The list of mappings from a source table to target tables.
        sinks: The target tables.
        source: The source table.
