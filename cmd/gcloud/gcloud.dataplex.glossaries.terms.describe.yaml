name: describe
description: Describes a glossary term.
flags:
    --glossary=: Identifier of the Dataplex Glossary resource.
    --location=: Location of the Dataplex resource.
documentation:
    command: |
        Describes a glossary term.
    flag:
        glossary: |-
            Identifier of the Dataplex Glossary resource.
            +

            To set the `glossary` attribute:
            * provide the argument `glossary_term` on the command line with a fully specified name;
            * provide the argument `--glossary` on the command line.
        location: |-
            Location of the Dataplex resource.
            +

            To set the `location` attribute:
            * provide the argument `glossary_term` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
