name: describe-action-targets
description: Returns a list of the custom action targets in Security Hub in your account.
flags:
    --action-target-arns=: A list of custom action target ARNs for the custom action targets to retrieve.
    --max-results=: The maximum number of results to return.
    --next-token=: The token that is required for pagination.
documentation:
    command: Returns a list of the custom action targets in Security Hub in your account.
    flag:
        action-target-arns: A list of custom action target ARNs for the custom action targets to retrieve.
        max-results: The maximum number of results to return.
        next-token: |-
            The token that is required for pagination. On your first call to the `DescribeActionTargets` operation, set the value of this parameter to `NULL`.

            For subsequent calls to the operation, to continue listing data, set the value of this parameter to the value returned from the previous response.
