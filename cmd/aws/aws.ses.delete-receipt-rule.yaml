name: delete-receipt-rule
description: Deletes the specified receipt rule.
flags:
    --rule-name=!: The name of the receipt rule to delete.
    --rule-set-name=!: The name of the receipt rule set that contains the receipt rule to delete.
documentation:
    command: |-
        Deletes the specified receipt rule.

        For information about managing receipt rules, see the [Amazon SES Developer Guide](https://docs.aws.amazon.com/ses/latest/dg/receiving-email-receipt-rules-console-walkthrough.html).

        You can execute this operation no more than once per second.
    flag:
        rule-name: The name of the receipt rule to delete.
        rule-set-name: The name of the receipt rule set that contains the receipt rule to delete.
