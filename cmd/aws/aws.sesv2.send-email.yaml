name: send-email
description: Sends an email message.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration-set-name=: The name of the configuration set to use when sending the email.
    --content=!: An object that contains the body of the message.
    --destination=: An object that contains the recipients of the email message.
    --email-tags=:
        description: A list of tags, in the form of name/value pairs, to apply to an email that you send using the `SendEmail` operation.
        nargs: -1
    --endpoint-id=: The ID of the multi-region endpoint (global-endpoint).
    --feedback-forwarding-email-address-identity-arn=: This parameter is used only for sending authorization.
    --feedback-forwarding-email-address=: The address that you want bounce and complaint notifications to be sent to.
    --from-email-address-identity-arn=: This parameter is used only for sending authorization.
    --from-email-address=: The email address to use as the "From" address for the email.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --list-management-options=: An object used to specify a list or topic to which an email belongs, which will be used when a contact chooses to unsubscribe.
    --reply-to-addresses=:
        description: The "Reply-to" email addresses for the message.
        nargs: -1
    --tenant-name=: The name of the tenant through which this email will be sent.
documentation:
    command: |-
        Sends an email message. You can use the Amazon SES API v2 to send the following types of messages:

        - **Simple** – A standard email message. When you create this type of message, you specify the sender, the recipient, and the message body, and Amazon SES assembles the message for you.
        - **Raw** – A raw, MIME-formatted email message. When you send this type of email, you have to specify all of the message headers, as well as the message body. You can use this message type to send messages that contain attachments. The message that you specify has to be a valid MIME message.
        - **Templated** – A message that contains personalization tags. When you send this type of email, Amazon SES API v2 automatically replaces the tags with values that you specify.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration-set-name: The name of the configuration set to use when sending the email.
        content: An object that contains the body of the message. You can send either a Simple message, Raw message, or a Templated message.
        destination: An object that contains the recipients of the email message.
        email-tags: A list of tags, in the form of name/value pairs, to apply to an email that you send using the `SendEmail` operation. Tags correspond to characteristics of the email that you define, so that you can publish email sending events.
        endpoint-id: The ID of the multi-region endpoint (global-endpoint).
        feedback-forwarding-email-address: The address that you want bounce and complaint notifications to be sent to.
        feedback-forwarding-email-address-identity-arn: |-
            This parameter is used only for sending authorization. It is the ARN of the identity that is associated with the sending authorization policy that permits you to use the email address specified in the `FeedbackForwardingEmailAddress` parameter.

            For example, if the owner of example.com (which has ARN arn:aws:ses:us-east-1:123456789012:identity/example.com) attaches a policy to it that authorizes you to use feedback@example.com, then you would specify the `FeedbackForwardingEmailAddressIdentityArn` to be arn:aws:ses:us-east-1:123456789012:identity/example.com, and the `FeedbackForwardingEmailAddress` to be feedback@example.com.

            For more information about sending authorization, see the [Amazon SES Developer Guide](https://docs.aws.amazon.com/ses/latest/DeveloperGuide/sending-authorization.html).
        from-email-address: The email address to use as the "From" address for the email. The address that you specify has to be verified.
        from-email-address-identity-arn: |-
            This parameter is used only for sending authorization. It is the ARN of the identity that is associated with the sending authorization policy that permits you to use the email address specified in the `FromEmailAddress` parameter.

            For example, if the owner of example.com (which has ARN arn:aws:ses:us-east-1:123456789012:identity/example.com) attaches a policy to it that authorizes you to use sender@example.com, then you would specify the `FromEmailAddressIdentityArn` to be arn:aws:ses:us-east-1:123456789012:identity/example.com, and the `FromEmailAddress` to be sender@example.com.

            For more information about sending authorization, see the [Amazon SES Developer Guide](https://docs.aws.amazon.com/ses/latest/DeveloperGuide/sending-authorization.html).

            For Raw emails, the `FromEmailAddressIdentityArn` value overrides the X-SES-SOURCE-ARN and X-SES-FROM-ARN headers specified in raw email message content.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        list-management-options: An object used to specify a list or topic to which an email belongs, which will be used when a contact chooses to unsubscribe.
        reply-to-addresses: The "Reply-to" email addresses for the message. When the recipient replies to the message, each Reply-to address receives the reply.
        tenant-name: |-
            The name of the tenant through which this email will be sent.

            The email sending operation will only succeed if all referenced resources (identities, configuration sets, and templates) are associated with this tenant.
