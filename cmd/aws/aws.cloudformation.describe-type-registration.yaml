name: describe-type-registration
description: Returns information about an extension's registration, including its current status and type and version identifiers.
flags:
    --registration-token=!: The identifier for this registration request.
documentation:
    command: |-
        Returns information about an extension's registration, including its current status and type and version identifiers.

        When you initiate a registration request using [RegisterType](), you can then use [DescribeTypeRegistration]() to monitor the progress of that registration request.

        Once the registration request has completed, use [DescribeType]() to return detailed information about an extension.
    flag:
        registration-token: |-
            The identifier for this registration request.

            This registration token is generated by CloudFormation when you initiate a registration request using [RegisterType]().
