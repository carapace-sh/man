name: stop-recommender
description: Stops a recommender that is ACTIVE.
flags:
    --recommender-arn=!: The Amazon Resource Name (ARN) of the recommender to stop.
documentation:
    command: Stops a recommender that is ACTIVE. Stopping a recommender halts billing and automatic retraining for the recommender.
    flag:
        recommender-arn: The Amazon Resource Name (ARN) of the recommender to stop.
