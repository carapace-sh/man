name: get-role-credentials
description: Returns the STS short-term credentials for a given role name that is assigned to the user.
flags:
    --access-token=!: The token issued by the `CreateToken` API call.
    --account-id=!: The identifier for the AWS account that is assigned to the user.
    --role-name=!: The friendly name of the role that is assigned to the user.
documentation:
    command: Returns the STS short-term credentials for a given role name that is assigned to the user.
    flag:
        access-token: The token issued by the `CreateToken` API call. For more information, see [CreateToken](https://docs.aws.amazon.com/singlesignon/latest/OIDCAPIReference/API_CreateToken.html) in the *IAM Identity Center OIDC API Reference Guide*.
        account-id: The identifier for the AWS account that is assigned to the user.
        role-name: The friendly name of the role that is assigned to the user.
