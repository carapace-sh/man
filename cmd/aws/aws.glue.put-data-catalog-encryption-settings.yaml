name: put-data-catalog-encryption-settings
description: Sets the security configuration for a specified catalog.
flags:
    --catalog-id=: The ID of the Data Catalog to set the security configuration for.
    --data-catalog-encryption-settings=!: The security configuration to set.
documentation:
    command: Sets the security configuration for a specified catalog. After the configuration has been set, the specified encryption is applied to every catalog write thereafter.
    flag:
        catalog-id: The ID of the Data Catalog to set the security configuration for. If none is provided, the Amazon Web Services account ID is used by default.
        data-catalog-encryption-settings: The security configuration to set.
