name: add-policy-statement
description: Adds a policy statement object.
flags:
    --action=!: The action that the principal can use on the resource.
    --arn=!: The Amazon Resource Name (ARN) of the resource that will be accessed by the principal.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --condition=: A set of condition keys that you can use in key policies.
    --effect=!: Determines whether the permissions specified in the policy are to be allowed (`Allow`) or denied (`Deny`).
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --principal=!: The Amazon Web Services service or Amazon Web Services account that can access the resource defined as ARN.
    --statement-id=!: A statement identifier that differentiates the statement from others in the same policy.
completion:
    flag:
        effect:
            - Allow
            - Deny
documentation:
    command: Adds a policy statement object. To retrieve a list of existing policy statements, use the `GetPolicy` API.
    flag:
        action: |-
            The action that the principal can use on the resource.

            For example, `entityresolution:GetIdMappingJob`, `entityresolution:GetMatchingJob`.
        arn: The Amazon Resource Name (ARN) of the resource that will be accessed by the principal.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        condition: A set of condition keys that you can use in key policies.
        effect: |-
            Determines whether the permissions specified in the policy are to be allowed (`Allow`) or denied (`Deny`).

            If you set the value of the `effect` parameter to `Deny` for the `AddPolicyStatement` operation, you must also set the value of the `effect` parameter in the `policy` to `Deny` for the `PutPolicy` operation.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        principal: The Amazon Web Services service or Amazon Web Services account that can access the resource defined as ARN.
        statement-id: A statement identifier that differentiates the statement from others in the same policy.
