name: list-security-control-definitions
description: Lists all of the security controls that apply to a specified standard.
flags:
    --max-results=: An optional parameter that limits the total results of the API response to the specified number.
    --next-token=: Optional pagination parameter.
    --standards-arn=: The Amazon Resource Name (ARN) of the standard that you want to view controls for.
documentation:
    command: Lists all of the security controls that apply to a specified standard.
    flag:
        max-results: An optional parameter that limits the total results of the API response to the specified number. If this parameter isn't provided in the request, the results include the first 25 security controls that apply to the specified standard. The results also include a `NextToken` parameter that you can use in a subsequent API call to get the next 25 controls. This repeats until all controls for the standard are returned.
        next-token: Optional pagination parameter.
        standards-arn: The Amazon Resource Name (ARN) of the standard that you want to view controls for.
