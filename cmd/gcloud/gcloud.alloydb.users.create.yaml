name: create
description: Creates a user in a given cluster.
flags:
    --cluster=!: AlloyDB cluster ID
    --db-roles=: Comma separated list of database roles this new user will be granted upon creation.
    --keep-extra-roles=: If the user already exists and has extra roles, keep them.
    --password=: Password for this database user.
    --region=!: Regional location (e.g. `asia-east1`, `us-east1`).
    --superuser=: If true, new user will have AlloyDB superuser privileges.
    --type=: Type corresponds to the user type.
completion:
    flag:
        type:
            - BUILT_IN
            - IAM_BASED
documentation:
    command: |-
        Creates a user in a given cluster with specified username, cluster, region,
        type, and password.
    flag:
        cluster: AlloyDB cluster ID
        db-roles: Comma separated list of database roles this new user will be granted upon creation.
        keep-extra-roles: If the user already exists and has extra roles, keep them.
        password: Password for this database user.
        region: Regional location (e.g. `asia-east1`, `us-east1`). See the full list of regions at https://cloud.google.com/sql/docs/instance-locations.
        superuser: If true, new user will have AlloyDB superuser privileges. Default value is false.
        type: |-
            Type corresponds to the user type. _TYPE_ must be one of:
            +
            *BUILT_IN*::: This database user can authenticate via password-based authentication
            *IAM_BASED*::: This database user can authenticate via IAM-based authentication
            :::
            +
