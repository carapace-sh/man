name: cancel
description: '*(ALPHA)*  Cancel a running hyperparameter tuning job.'
flags:
    --region=: Cloud region for the hyperparameter tuning job.
documentation:
    command: |-
        *(ALPHA)*  If the job is already finished, the command will not perform any operation.

        ## EXAMPLES

        To cancel a job ``123'' under project ``example'' in region
        ``us-central1'', run:

          $ gcloud alpha ai hp-tuning-jobs cancel 123 --project=example --region=us-central1
    flag:
        region: |-
            Cloud region for the hyperparameter tuning job.
            +
            To set the `region` attribute:
            * provide the argument `hptuning_job` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
