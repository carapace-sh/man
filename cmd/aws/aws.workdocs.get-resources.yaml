name: get-resources
description: Retrieves a collection of resources, including folders and documents.
flags:
    --authentication-token=: The Amazon WorkDocs authentication token.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --collection-type=: The collection type.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --limit=: The maximum number of resources to return.
    --marker=: The marker for the next set of results.
    --user-id=: The user ID for the resource collection.
completion:
    flag:
        collection-type:
            - SHARED_WITH_ME
documentation:
    command: Retrieves a collection of resources, including folders and documents. The only `CollectionType` supported is `SHARED_WITH_ME`.
    flag:
        authentication-token: The Amazon WorkDocs authentication token. Not required when using Amazon Web Services administrator credentials to access the API.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        collection-type: The collection type.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        limit: The maximum number of resources to return.
        marker: The marker for the next set of results. This marker was received from a previous call.
        user-id: The user ID for the resource collection. This is a required field for accessing the API operation using IAM credentials.
