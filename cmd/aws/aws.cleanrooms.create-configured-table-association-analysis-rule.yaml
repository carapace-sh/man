name: create-configured-table-association-analysis-rule
description: Creates a new analysis rule for an associated configured table.
flags:
    --analysis-rule-policy=!: The analysis rule policy that was created for the configured table association.
    --analysis-rule-type=!: The type of analysis rule.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configured-table-association-identifier=!: The unique ID for the configured table association.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --membership-identifier=!: A unique identifier for the membership that the configured table association belongs to.
completion:
    flag:
        analysis-rule-type:
            - AGGREGATION
            - LIST
            - CUSTOM
documentation:
    command: Creates a new analysis rule for an associated configured table.
    flag:
        analysis-rule-policy: The analysis rule policy that was created for the configured table association.
        analysis-rule-type: The type of analysis rule.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configured-table-association-identifier: The unique ID for the configured table association. Currently accepts the configured table association ID.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        membership-identifier: A unique identifier for the membership that the configured table association belongs to. Currently accepts the membership ID.
