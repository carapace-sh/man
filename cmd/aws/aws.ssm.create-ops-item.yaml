name: create-ops-item
description: Creates a new OpsItem.
flags:
    --account-id=: The target Amazon Web Services account where you want to create an OpsItem.
    --actual-end-time=: The time a runbook workflow ended.
    --actual-start-time=: The time a runbook workflow started.
    --category=: Specify a category to assign to an OpsItem.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=!: User-defined text that contains information about the OpsItem, in Markdown format.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --notifications=: The Amazon Resource Name (ARN) of an SNS topic where notifications are sent when this OpsItem is edited or changed.
    --operational-data=: Operational data is custom data that provides useful reference details about the OpsItem.
    --ops-item-type=: The type of OpsItem to create.
    --planned-end-time=: The time specified in a change request for a runbook workflow to end.
    --planned-start-time=: The time specified in a change request for a runbook workflow to start.
    --priority=: The importance of this OpsItem in relation to other OpsItems in the system.
    --related-ops-items=: One or more OpsItems that share something in common with the current OpsItems.
    --severity=: Specify a severity to assign to an OpsItem.
    --source=!: The origin of the OpsItem, such as Amazon EC2 or Systems Manager.
    --tags=: Optional metadata that you assign to a resource.
    --title=!: A short heading that describes the nature of the OpsItem and the impacted resource.
documentation:
    command: |-
        Creates a new OpsItem. You must have permission in Identity and Access Management (IAM) to create a new OpsItem. For more information, see [Set up OpsCenter](https://docs.aws.amazon.com/systems-manager/latest/userguide/OpsCenter-setup.html) in the *Amazon Web Services Systems Manager User Guide*.

        Operations engineers and IT professionals use Amazon Web Services Systems Manager OpsCenter to view, investigate, and remediate operational issues impacting the performance and health of their Amazon Web Services resources. For more information, see [Amazon Web Services Systems Manager OpsCenter](https://docs.aws.amazon.com/systems-manager/latest/userguide/OpsCenter.html) in the *Amazon Web Services Systems Manager User Guide*.
    flag:
        account-id: The target Amazon Web Services account where you want to create an OpsItem. To make this call, your account must be configured to work with OpsItems across accounts. For more information, see [Set up OpsCenter](https://docs.aws.amazon.com/systems-manager/latest/userguide/OpsCenter-setup.html) in the *Amazon Web Services Systems Manager User Guide*.
        actual-end-time: The time a runbook workflow ended. Currently reported only for the OpsItem type `/aws/changerequest`.
        actual-start-time: The time a runbook workflow started. Currently reported only for the OpsItem type `/aws/changerequest`.
        category: Specify a category to assign to an OpsItem.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: |-
            User-defined text that contains information about the OpsItem, in Markdown format.

            Provide enough information so that users viewing this OpsItem for the first time understand the issue.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        notifications: The Amazon Resource Name (ARN) of an SNS topic where notifications are sent when this OpsItem is edited or changed.
        operational-data: |-
            Operational data is custom data that provides useful reference details about the OpsItem. For example, you can specify log files, error strings, license keys, troubleshooting tips, or other relevant data. You enter operational data as key-value pairs. The key has a maximum length of 128 characters. The value has a maximum size of 20 KB.

            Operational data keys *can't* begin with the following: `amazon`, `aws`, `amzn`, `ssm`, `/amazon`, `/aws`, `/amzn`, `/ssm`.

            You can choose to make the data searchable by other users in the account or you can restrict search access. Searchable data means that all users with access to the OpsItem Overview page (as provided by the [DescribeOpsItems]() API operation) can view and search on the specified data. Operational data that isn't searchable is only viewable by users who have access to the OpsItem (as provided by the [GetOpsItem]() API operation).

            Use the `/aws/resources` key in OperationalData to specify a related resource in the request. Use the `/aws/automations` key in OperationalData to associate an Automation runbook with the OpsItem. To view Amazon Web Services CLI example commands that use these keys, see [Create OpsItems manually](https://docs.aws.amazon.com/systems-manager/latest/userguide/OpsCenter-manually-create-OpsItems.html) in the *Amazon Web Services Systems Manager User Guide*.
        ops-item-type: "The type of OpsItem to create. Systems Manager supports the following types of OpsItems:\n\n- `/aws/issue`\n  \n  This type of OpsItem is used for default OpsItems created by OpsCenter.\n- `/aws/insight`\n  \n  This type of OpsItem is used by OpsCenter for aggregating and reporting on duplicate OpsItems.\n- `/aws/changerequest`\n  \n  This type of OpsItem is used by Change Manager for reviewing and approving or rejecting change requests.\n  \n  Amazon Web Services Systems Manager Change Manager will no longer be open to new customers starting November 7, 2025. If you would like to use Change Manager, sign up prior to that date. Existing customers can continue to use the service as normal. For more information, see [Amazon Web Services Systems Manager Change Manager availability change](https://docs.aws.amazon.com/systems-manager/latest/userguide/change-manager-availability-change.html)."
        planned-end-time: The time specified in a change request for a runbook workflow to end. Currently supported only for the OpsItem type `/aws/changerequest`.
        planned-start-time: The time specified in a change request for a runbook workflow to start. Currently supported only for the OpsItem type `/aws/changerequest`.
        priority: The importance of this OpsItem in relation to other OpsItems in the system.
        related-ops-items: One or more OpsItems that share something in common with the current OpsItems. For example, related OpsItems can include OpsItems with similar error messages, impacted resources, or statuses for the impacted resource.
        severity: Specify a severity to assign to an OpsItem.
        source: |-
            The origin of the OpsItem, such as Amazon EC2 or Systems Manager.

            The source name can't contain the following strings: `aws`, `amazon`, and `amzn`.
        tags: |-
            Optional metadata that you assign to a resource.

            Tags use a key-value pair. For example:

            `Key=Department,Value=Finance`

            To add tags to a new OpsItem, a user must have IAM permissions for both the `ssm:CreateOpsItems` operation and the `ssm:AddTagsToResource` operation. To add tags to an existing OpsItem, use the [AddTagsToResource]() operation.
        title: A short heading that describes the nature of the OpsItem and the impacted resource.
