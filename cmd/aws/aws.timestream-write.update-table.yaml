name: update-table
description: Modifies the retention duration of the memory store and magnetic store for your Timestream table.
flags:
    --database-name=!: The name of the Timestream database.
    --magnetic-store-write-properties=: Contains properties to set on the table when enabling magnetic store writes.
    --retention-properties=: The retention duration of the memory store and the magnetic store.
    --schema=: The schema of the table.
    --table-name=!: The name of the Timestream table.
documentation:
    command: |-
        Modifies the retention duration of the memory store and magnetic store for your Timestream table. Note that the change in retention duration takes effect immediately. For example, if the retention period of the memory store was initially set to 2 hours and then changed to 24 hours, the memory store will be capable of holding 24 hours of data, but will be populated with 24 hours of data 22 hours after this change was made. Timestream does not retrieve data from the magnetic store to populate the memory store.

        See [code sample](https://docs.aws.amazon.com/timestream/latest/developerguide/code-samples.update-table.html) for details.
    flag:
        database-name: The name of the Timestream database.
        magnetic-store-write-properties: Contains properties to set on the table when enabling magnetic store writes.
        retention-properties: The retention duration of the memory store and the magnetic store.
        schema: The schema of the table.
        table-name: The name of the Timestream table.
