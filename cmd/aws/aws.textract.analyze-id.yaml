name: analyze-id
description: Analyzes identity documents for relevant information.
flags:
    --document-pages=!: The document being passed to AnalyzeID.
documentation:
    command: Analyzes identity documents for relevant information. This information is extracted and returned as `IdentityDocumentFields`, which records both the normalized field and value of the extracted text. Unlike other Amazon Textract operations, `AnalyzeID` doesn't return any Geometry data.
    flag:
        document-pages: The document being passed to AnalyzeID.
