name: submit
description: '*(BETA)*  Submit Dataproc jobs to execute on a cluster.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --bucket=: The Cloud Storage bucket to stage files in.
    --id=&: Set the ID of the job, which is usually autogenerated
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: Dataproc region to use.
documentation:
    command: |-
        *(BETA)*  Submit Dataproc jobs to execute on a cluster.

        ## EXAMPLES

        To submit a Hadoop MapReduce job, run:

          $ gcloud beta dataproc jobs submit hadoop --cluster my-cluster --jar my_jar.jar -- arg1 arg2

        To submit a Spark Scala or Java job, run:

          $ gcloud beta dataproc jobs submit spark --cluster my-cluster --jar my_jar.jar -- arg1 arg2

        To submit a PySpark job, run:

          $ gcloud beta dataproc jobs submit pyspark --cluster my-cluster my_script.py -- arg1 arg2

        To submit a Spark SQL job, run:

          $ gcloud beta dataproc jobs submit spark-sql --cluster my-cluster --file my_queries.q

        To submit a Pig job, run:

          $ gcloud beta dataproc jobs submit pig --cluster my-cluster --file my_script.pig

        To submit a Hive job, run:

          $ gcloud beta dataproc jobs submit hive --cluster my-cluster --file my_queries.q
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        bucket: The Cloud Storage bucket to stage files in. Defaults to the cluster's configured bucket.
        id: Set the ID of the job, which is usually autogenerated
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: Dataproc region to use. Each Dataproc region constitutes an independent resource namespace constrained to deploying instances into Compute Engine zones inside the region. Overrides the default *dataproc/region* property value for this command invocation.
