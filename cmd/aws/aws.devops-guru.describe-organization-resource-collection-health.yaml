name: describe-organization-resource-collection-health
description: Provides an overview of your system's health.
flags:
    --account-ids=: The ID of the Amazon Web Services account.
    --max-results=: The maximum number of results to return with a single call.
    --next-token=: The pagination token to use to retrieve the next page of results for this operation.
    --organization-resource-collection-type=!: An Amazon Web Services resource collection type.
    --organizational-unit-ids=: The ID of the organizational unit.
completion:
    flag:
        organization-resource-collection-type:
            - AWS_CLOUD_FORMATION
            - AWS_SERVICE
            - AWS_ACCOUNT
            - AWS_TAGS
documentation:
    command: Provides an overview of your system's health. If additional member accounts are part of your organization, you can filter those accounts using the `AccountIds` field.
    flag:
        account-ids: The ID of the Amazon Web Services account.
        max-results: The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned `nextToken` value.
        next-token: The pagination token to use to retrieve the next page of results for this operation. If this value is null, it retrieves the first page.
        organization-resource-collection-type: An Amazon Web Services resource collection type. This type specifies how analyzed Amazon Web Services resources are defined. The two types of Amazon Web Services resource collections supported are Amazon Web Services CloudFormation stacks and Amazon Web Services resources that contain the same Amazon Web Services tag. DevOps Guru can be configured to analyze the Amazon Web Services resources that are defined in the stacks or that are tagged using the same tag *key*. You can specify up to 500 Amazon Web Services CloudFormation stacks.
        organizational-unit-ids: The ID of the organizational unit.
