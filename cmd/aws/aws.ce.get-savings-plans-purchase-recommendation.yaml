name: get-savings-plans-purchase-recommendation
description: Retrieves the Savings Plans recommendations for your account.
flags:
    --account-scope=: The account scope that you want your recommendations for.
    --filter=: You can filter your recommendations by Account ID with the `LINKED_ACCOUNT` dimension.
    --lookback-period-in-days=!: The lookback period that's used to generate the recommendation.
    --next-page-token=: The token to retrieve the next set of results.
    --page-size=: The number of recommendations that you want returned in a single response object.
    --payment-option=!: The payment option that's used to generate these recommendations.
    --savings-plans-type=!: The Savings Plans recommendation type that's requested.
    --term-in-years=!: The savings plan recommendation term that's used to generate these recommendations.
completion:
    flag:
        account-scope:
            - PAYER
            - LINKED
        lookback-period-in-days:
            - SEVEN_DAYS
            - THIRTY_DAYS
            - SIXTY_DAYS
        payment-option:
            - NO_UPFRONT
            - PARTIAL_UPFRONT
            - ALL_UPFRONT
            - LIGHT_UTILIZATION
            - MEDIUM_UTILIZATION
            - HEAVY_UTILIZATION
        savings-plans-type:
            - COMPUTE_SP
            - EC2_INSTANCE_SP
            - SAGEMAKER_SP
        term-in-years:
            - ONE_YEAR
            - THREE_YEARS
documentation:
    command: Retrieves the Savings Plans recommendations for your account. First use `StartSavingsPlansPurchaseRecommendationGeneration` to generate a new set of recommendations, and then use `GetSavingsPlansPurchaseRecommendation` to retrieve them.
    flag:
        account-scope: The account scope that you want your recommendations for. Amazon Web Services calculates recommendations including the management account and member accounts if the value is set to `PAYER`. If the value is `LINKED`, recommendations are calculated for individual member accounts only.
        filter: |-
            You can filter your recommendations by Account ID with the `LINKED_ACCOUNT` dimension. To filter your recommendations by Account ID, specify `Key` as `LINKED_ACCOUNT` and `Value` as the comma-separated Acount ID(s) that you want to see Savings Plans purchase recommendations for.

            For GetSavingsPlansPurchaseRecommendation, the `Filter` doesn't include `CostCategories` or `Tags`. It only includes `Dimensions`. With `Dimensions`, `Key` must be `LINKED_ACCOUNT` and `Value` can be a single Account ID or multiple comma-separated Account IDs that you want to see Savings Plans Purchase Recommendations for. `AND` and `OR` operators are not supported.
        lookback-period-in-days: The lookback period that's used to generate the recommendation.
        next-page-token: The token to retrieve the next set of results. Amazon Web Services provides the token when the response from a previous call has more results than the maximum page size.
        page-size: The number of recommendations that you want returned in a single response object.
        payment-option: The payment option that's used to generate these recommendations.
        savings-plans-type: The Savings Plans recommendation type that's requested.
        term-in-years: The savings plan recommendation term that's used to generate these recommendations.
