name: submit-feedback
description: Enables you to provide feedback to Amazon Kendra to improve the performance of your index.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --click-feedback-items=:
        description: Tells Amazon Kendra that a particular search result link was chosen by the user.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --index-id=!: The identifier of the index that was queried.
    --query-id=!: The identifier of the specific query for which you are submitting feedback.
    --relevance-feedback-items=:
        description: Provides Amazon Kendra with relevant or not relevant feedback for whether a particular item was relevant to the search.
        nargs: -1
documentation:
    command: |-
        Enables you to provide feedback to Amazon Kendra to improve the performance of your index.

        `SubmitFeedback` is currently not supported in the Amazon Web Services GovCloud (US-West) region.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        click-feedback-items: Tells Amazon Kendra that a particular search result link was chosen by the user.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        index-id: The identifier of the index that was queried.
        query-id: The identifier of the specific query for which you are submitting feedback. The query ID is returned in the response to the `Query` API.
        relevance-feedback-items: Provides Amazon Kendra with relevant or not relevant feedback for whether a particular item was relevant to the search.
