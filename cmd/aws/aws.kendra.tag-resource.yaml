name: tag-resource
description: Adds the specified tag to the specified index, FAQ, data source, or other resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the index, FAQ, data source, or other resource to add a tag.
    --tags=!: A list of tag keys to add to the index, FAQ, data source, or other resource.
documentation:
    command: Adds the specified tag to the specified index, FAQ, data source, or other resource. If the tag already exists, the existing value is replaced with the new value.
    flag:
        resource-arn: 'The Amazon Resource Name (ARN) of the index, FAQ, data source, or other resource to add a tag. For example, the ARN of an index is constructed as follows: *arn:aws:kendra:your-region:your-account-id:index/index-id* For information on how to construct an ARN for all types of Amazon Kendra resources, see [Resource types](https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazonkendra.html#amazonkendra-resources-for-iam-policies).'
        tags: A list of tag keys to add to the index, FAQ, data source, or other resource. If a tag already exists, the existing value is replaced with the new value.
