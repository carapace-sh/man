name: spark
description: Add a Spark job to the workflow template.
flags:
    --archives=: Comma separated list of archives to be extracted into the working directory of each executor.
    --class=: The class containing the main method of the driver.
    --driver-log-levels=: List of package to log4j log level pairs to configure driver logging.
    --files=: Comma separated list of files to be placed in the working directory of both the app driver and executors.
    --jar=: The HCFS URI of jar file containing the driver jar.
    --jars=: Comma separated list of jar files to be provided to the executor and driver classpaths.
    --labels=: List of label KEY=VALUE pairs to add.
    --properties-file=: Path to a local file or a file in a Cloud Storage bucket containing
    --properties=: List of key value pairs to configure Spark.
    --region=: Dataproc region for the template.
    --start-after=: (Optional) List of step IDs to start this job after.
    --step-id=!: The step ID of the job in the workflow template.
    --workflow-template=!: ID of the template or fully qualified identifier for the template.
documentation:
    command: Add a Spark job to the workflow template.
    flag:
        archives: 'Comma separated list of archives to be extracted into the working directory of each executor. Must be one of the following file formats: .zip, .tar, .tar.gz, or .tgz.'
        class: The class containing the main method of the driver. Must be in a provided jar or jar that is already on the classpath
        driver-log-levels: 'List of package to log4j log level pairs to configure driver logging. For example: root=FATAL,com.example=INFO'
        files: Comma separated list of files to be placed in the working directory of both the app driver and executors.
        jar: The HCFS URI of jar file containing the driver jar.
        jars: Comma separated list of jar files to be provided to the executor and driver classpaths.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        properties: 'List of key value pairs to configure Spark. For a list of available properties, see: https://spark.apache.org/docs/latest/configuration.html#available-properties.'
        properties-file: |-
            Path to a local file or a file in a Cloud Storage bucket containing
            configuration properties for the job. The client machine running this command
            must have read permission to the file.
            +
            Specify properties in the form of property=value in the text file. For example:
            +
            ```
              # Properties to set for the job:
              key1=value1
              key2=value2
              # Comment out properties not used.
              # key3=value3
            ```
            +
            If a property is set in both `--properties` and `--properties-file`, the
            value defined in `--properties` takes precedence.
        region: |-
            Dataproc region for the template. Each Dataproc region constitutes an independent resource namespace constrained to deploying instances into Compute Engine zones inside the region. Overrides the default `dataproc/region` property value for this command invocation.
            +
            To set the `region` attribute:
            * provide the argument `--workflow-template` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `dataproc/region`.
        start-after: (Optional) List of step IDs to start this job after.
        step-id: The step ID of the job in the workflow template.
        workflow-template: |-
            ID of the template or fully qualified identifier for the template.
            +
            To set the `template` attribute:
            * provide the argument `--workflow-template` on the command line.
