name: list-members
description: Retrieves the list of member accounts for a behavior graph.
flags:
    --graph-arn=!: The ARN of the behavior graph for which to retrieve the list of member accounts.
    --max-results=: The maximum number of member accounts to include in the response.
    --next-token=: For requests to retrieve the next page of member account results, the pagination token that was returned with the previous page of results.
documentation:
    command: |-
        Retrieves the list of member accounts for a behavior graph.

        For invited accounts, the results do not include member accounts that were removed from the behavior graph.

        For the organization behavior graph, the results do not include organization accounts that the Detective administrator account has not enabled as member accounts.
    flag:
        graph-arn: The ARN of the behavior graph for which to retrieve the list of member accounts.
        max-results: The maximum number of member accounts to include in the response. The total must be less than the overall limit on the number of results to return, which is currently 200.
        next-token: For requests to retrieve the next page of member account results, the pagination token that was returned with the previous page of results. The initial request does not include a pagination token.
