name: update-security-profile
description: Updates a security profile.
flags:
    --allowed-access-control-hierarchy-group-id=: The identifier of the hierarchy group that a security profile uses to restrict access to resources in Amazon Connect.
    --allowed-access-control-tags=: The list of tags that a security profile uses to restrict access to resources in Amazon Connect.
    --applications=: A list of the third-party application's metadata.
    --description=: The description of the security profile.
    --hierarchy-restricted-resources=: The list of resources that a security profile applies hierarchy restrictions to in Amazon Connect.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --permissions=: The permissions granted to a security profile.
    --security-profile-id=!: The identifier for the security profle.
    --tag-restricted-resources=: The list of resources that a security profile applies tag restrictions to in Amazon Connect.
documentation:
    command: |-
        Updates a security profile.

        For information about security profiles, see [Security Profiles](https://docs.aws.amazon.com/connect/latest/adminguide/connect-security-profiles.html) in the *Amazon Connect Administrator Guide*. For a mapping of the API name and user interface name of the security profile permissions, see [List of security profile permissions](https://docs.aws.amazon.com/connect/latest/adminguide/security-profile-list.html).
    flag:
        allowed-access-control-hierarchy-group-id: The identifier of the hierarchy group that a security profile uses to restrict access to resources in Amazon Connect.
        allowed-access-control-tags: The list of tags that a security profile uses to restrict access to resources in Amazon Connect.
        applications: A list of the third-party application's metadata.
        description: The description of the security profile.
        hierarchy-restricted-resources: 'The list of resources that a security profile applies hierarchy restrictions to in Amazon Connect. Following are acceptable ResourceNames: `User`.'
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        permissions: The permissions granted to a security profile. For a list of valid permissions, see [List of security profile permissions](https://docs.aws.amazon.com/connect/latest/adminguide/security-profile-list.html).
        security-profile-id: The identifier for the security profle.
        tag-restricted-resources: The list of resources that a security profile applies tag restrictions to in Amazon Connect.
