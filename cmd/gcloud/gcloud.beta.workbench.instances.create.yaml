name: create
description: '*(BETA)*  Creates a workbench instance.'
flags:
    --accelerator-core-count=: Count of cores of this accelerator.
    --accelerator-type=: Type of this accelerator.
    --async: Return immediately, without waiting for the operation in progress to
    --boot-disk-encryption-key-keyring=: The KMS keyring of the key.
    --boot-disk-encryption-key-location=: The Google Cloud location for the key.
    --boot-disk-encryption-key-project=: The Google Cloud project for the key.
    --boot-disk-encryption=: Disk encryption method used on the boot disk, defaults to GMEK.
    --boot-disk-kms-key=!: ID of the key or fully qualified identifier for the key.
    --boot-disk-size=: Size of boot disk in GB attached to this instance, up to a maximum of 64000 GB (64 TB).
    --boot-disk-type=: Type of boot disk attached to this instance, defaults to standard persistent disk (`PD_STANDARD`).
    --confidential-compute-type=: String.
    --container-repository=!: The path to the container image repository.
    --container-tag=: The tag of the container image.
    --custom-gpu-driver-path=: Specify a custom Cloud Storage path where the GPU driver is stored.
    --data-disk-encryption-key-keyring=: The KMS keyring of the key.
    --data-disk-encryption-key-location=: The Google Cloud location for the key.
    --data-disk-encryption-key-project=: The Google Cloud project for the key.
    --data-disk-encryption=: Disk encryption method used on the data disk, defaults to GMEK.
    --data-disk-kms-key=!: ID of the key or fully qualified identifier for the key.
    --data-disk-resource-policies=: Resource policies to apply to the data disk.
    --data-disk-size=: Size of data disk in GB attached to this instance, up to a maximum of 64000 GB (64 TB).
    --data-disk-type=: Type of data disk attached to this instance, defaults to standard persistent disk (`PD_STANDARD`).
    --disable-proxy-access: If true, the notebook instance will not register with the proxy.
    --disable-public-ip: If specified, no public IP will be assigned to this instance.
    --enable-ip-forwarding: If specified, IP forwarding will be enabled for this instance.
    --enable-managed-euc: If true, the notebook instance will be created with managed end  user credentials enabled.
    --enable-third-party-identity: If true, the notebook instance provide a proxy endpoint which allows for third party identity.
    --install-gpu-driver: Whether the end user authorizes Google Cloud to install a GPU driver on this instance.
    --instance-owners=: The owners of this instance after creation.
    --labels=: Labels to apply to this instance.
    --location=: Google Cloud location of this environment https://cloud.google.com/compute/docs/regions-zones/#locations.
    --machine-type=: The [Compute Engine machine type](https://cloud.google.com/sdk/gcloud/reference/compute/machine-types) of this instance.
    --metadata=: Custom metadata to apply to this instance.
    --min-cpu-platform=: The minimum CPU platform to use for this instance.
    --network=!: ID of the network or fully qualified identifier for the network.
    --nic-type=: Type of the network interface card.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-disable-proxy-access&: If true, the notebook instance will not register with the proxy.
    --no-disable-public-ip&: If specified, no public IP will be assigned to this instance.
    --no-enable-ip-forwarding&: If specified, IP forwarding will be enabled for this instance.
    --no-enable-managed-euc&: If true, the notebook instance will be created with managed end  user credentials enabled.
    --no-enable-third-party-identity&: If true, the notebook instance provide a proxy endpoint which allows for third party identity.
    --no-install-gpu-driver&: Whether the end user authorizes Google Cloud to install a GPU driver on this instance.
    --reservation-key=: The label key of a reservation resource.
    --reservation-type=: Type of the reservation.
    --reservation-values=: The label value of a reservation resource.
    --service-account-email=: The service account on this instance, giving access to other Google Cloud services.
    --shielded-integrity-monitoring=: Boolean.
    --shielded-secure-boot=: Boolean.
    --shielded-vtpm=: Boolean.
    --subnet-region=: Google Cloud region of this subnetwork https://cloud.google.com/compute/docs/regions-zones/#locations.
    --subnet=!: ID of the subnetwork or fully qualified identifier for the subnetwork.
    --tags=: Tags to apply to this instance.
    --vm-image-family=: Use this VM image family to find the image; the newest image in this family will be used.
    --vm-image-name=: Use this VM image name to find the image.
    --vm-image-project=: The ID of the Google Cloud project that this VM image belongs to.
completion:
    flag:
        accelerator-type:
            - NVIDIA_TESLA_K80
            - NVIDIA_TESLA_P100
            - NVIDIA_TESLA_V100
            - NVIDIA_TESLA_P4
            - NVIDIA_TESLA_T4
            - NVIDIA_TESLA_A100
            - NVIDIA_A100_80GB
            - NVIDIA_TESLA_T4_VWS
            - NVIDIA_TESLA_P100_VWS
            - NVIDIA_TESLA_P4_VWS
            - NVIDIA_L4
            - NVIDIA_H100_80GB
            - NVIDIA_H100_MEGA_80GB
        boot-disk-encryption:
            - GMEK
            - CMEK
        boot-disk-type:
            - PD_STANDARD
            - PD_SSD
            - PD_BALANCED
            - PD_EXTREME
        data-disk-encryption:
            - GMEK
            - CMEK
        data-disk-type:
            - PD_STANDARD
            - PD_SSD
            - PD_BALANCED
            - PD_EXTREME
        nic-type:
            - VIRTIGO_NET
            - GVNIC
        reservation-type:
            - none
            - any
            - specific
documentation:
    command: |
        *(BETA)*  Creates a workbench instance.
    flag:
        accelerator-core-count: Count of cores of this accelerator.
        accelerator-type: 'Type of this accelerator. _ACCELERATOR_TYPE_ must be one of: *NVIDIA_TESLA_K80*, *NVIDIA_TESLA_P100*, *NVIDIA_TESLA_V100*, *NVIDIA_TESLA_P4*, *NVIDIA_TESLA_T4*, *NVIDIA_TESLA_A100*, *NVIDIA_A100_80GB*, *NVIDIA_TESLA_T4_VWS*, *NVIDIA_TESLA_P100_VWS*, *NVIDIA_TESLA_P4_VWS*, *NVIDIA_L4*, *NVIDIA_H100_80GB*, *NVIDIA_H100_MEGA_80GB*.'
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        boot-disk-encryption: 'Disk encryption method used on the boot disk, defaults to GMEK. _BOOT_DISK_ENCRYPTION_ must be one of: *GMEK*, *CMEK*.'
        boot-disk-encryption-key-keyring: |-
            The KMS keyring of the key.
            +
            To set the `kms-keyring` attribute:
            * provide the argument `--boot-disk-kms-key` on the command line with a fully specified name;
            * provide the argument `--boot-disk-encryption-key-keyring` on the command line.
        boot-disk-encryption-key-location: |-
            The Google Cloud location for the key.
            +
            To set the `kms-location` attribute:
            * provide the argument `--boot-disk-kms-key` on the command line with a fully specified name;
            * provide the argument `--boot-disk-encryption-key-location` on the command line.
        boot-disk-encryption-key-project: |-
            The Google Cloud project for the key.
            +
            To set the `kms-project` attribute:
            * provide the argument `--boot-disk-kms-key` on the command line with a fully specified name;
            * provide the argument `--boot-disk-encryption-key-project` on the command line;
            * set the property `core/project`.
        boot-disk-kms-key: |-
            ID of the key or fully qualified identifier for the key.
            +
            To set the `kms-key` attribute:
            * provide the argument `--boot-disk-kms-key` on the command line.
        boot-disk-size: Size of boot disk in GB attached to this instance, up to a maximum of 64000 GB (64 TB). The minimum recommended value is 100 GB. If not specified, this defaults to 100.
        boot-disk-type: 'Type of boot disk attached to this instance, defaults to standard persistent disk (`PD_STANDARD`). _BOOT_DISK_TYPE_ must be one of: *PD_STANDARD*, *PD_SSD*, *PD_BALANCED*, *PD_EXTREME*.'
        confidential-compute-type: 'String. VM instance with CC (Confidential Compute) of type. Supported values: `SEV`.'
        container-repository: 'The path to the container image repository. For example: gcr.io/`{project_id}`/`{image_name}`.'
        container-tag: The tag of the container image. If not specified, this defaults to the latest tag.
        custom-gpu-driver-path: Specify a custom Cloud Storage path where the GPU driver is stored. If not specified, we'll automatically choose from official GPU drivers.
        data-disk-encryption: 'Disk encryption method used on the data disk, defaults to GMEK. _DATA_DISK_ENCRYPTION_ must be one of: *GMEK*, *CMEK*.'
        data-disk-encryption-key-keyring: |-
            The KMS keyring of the key.
            +
            To set the `kms-keyring` attribute:
            * provide the argument `--data-disk-kms-key` on the command line with a fully specified name;
            * provide the argument `--data-disk-encryption-key-keyring` on the command line.
        data-disk-encryption-key-location: |-
            The Google Cloud location for the key.
            +
            To set the `kms-location` attribute:
            * provide the argument `--data-disk-kms-key` on the command line with a fully specified name;
            * provide the argument `--data-disk-encryption-key-location` on the command line.
        data-disk-encryption-key-project: |-
            The Google Cloud project for the key.
            +
            To set the `kms-project` attribute:
            * provide the argument `--data-disk-kms-key` on the command line with a fully specified name;
            * provide the argument `--data-disk-encryption-key-project` on the command line;
            * set the property `core/project`.
        data-disk-kms-key: |-
            ID of the key or fully qualified identifier for the key.
            +
            To set the `kms-key` attribute:
            * provide the argument `--data-disk-kms-key` on the command line.
        data-disk-resource-policies: 'Resource policies to apply to the data disk. Format: `projects/{project}/regions/{region}/resourcePolicies/{policy}`.'
        data-disk-size: Size of data disk in GB attached to this instance, up to a maximum of 64000 GB (64 TB). The minimum recommended value is 100 GB. If not specified, this defaults to 100.
        data-disk-type: 'Type of data disk attached to this instance, defaults to standard persistent disk (`PD_STANDARD`). _DATA_DISK_TYPE_ must be one of: *PD_STANDARD*, *PD_SSD*, *PD_BALANCED*, *PD_EXTREME*.'
        disable-proxy-access: If true, the notebook instance will not register with the proxy.
        disable-public-ip: If specified, no public IP will be assigned to this instance.
        enable-ip-forwarding: If specified, IP forwarding will be enabled for this instance.
        enable-managed-euc: If true, the notebook instance will be created with managed end  user credentials enabled.
        enable-third-party-identity: If true, the notebook instance provide a proxy endpoint which allows for third party identity.
        install-gpu-driver: Whether the end user authorizes Google Cloud to install a GPU driver on this instance. If this field is empty or set to false, the GPU driver won't be installed. Only applicable to instances with GPUs.
        instance-owners: 'The owners of this instance after creation. Format: `alias@example.com`. Currently supports one owner only. If not specified, all of the service account users of the VM instance''s service account can use the instance.'
        labels: Labels to apply to this instance. These can be later modified by the setLabels method.
        location: |-
            Google Cloud location of this environment https://cloud.google.com/compute/docs/regions-zones/#locations.
            +
            To set the `location` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `notebooks/location`.
        machine-type: The [Compute Engine machine type](https://cloud.google.com/sdk/gcloud/reference/compute/machine-types) of this instance.
        metadata: Custom metadata to apply to this instance.
        min-cpu-platform: The minimum CPU platform to use for this instance. The list of valid values can be found in https://cloud.google.com/compute/docs/instances/specify-min-cpu-platform#availablezones
        network: |-
            ID of the network or fully qualified identifier for the network.
            +
            To set the `network` attribute:
            * provide the argument `--network` on the command line.
        nic-type: 'Type of the network interface card. _NIC_TYPE_ must be one of: *VIRTIGO_NET*, *GVNIC*.'
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-disable-proxy-access: If true, the notebook instance will not register with the proxy.
        no-disable-public-ip: If specified, no public IP will be assigned to this instance.
        no-enable-ip-forwarding: If specified, IP forwarding will be enabled for this instance.
        no-enable-managed-euc: If true, the notebook instance will be created with managed end  user credentials enabled.
        no-enable-third-party-identity: If true, the notebook instance provide a proxy endpoint which allows for third party identity.
        no-install-gpu-driver: Whether the end user authorizes Google Cloud to install a GPU driver on this instance. If this field is empty or set to false, the GPU driver won't be installed. Only applicable to instances with GPUs.
        reservation-key: The label key of a reservation resource. To target a specific reservation by name, use compute.googleapis.com/reservation-name as the key and specify the name of your reservation as its value.
        reservation-type: 'Type of the reservation. _RESERVATION_TYPE_ must be one of: *none*, *any*, *specific*.'
        reservation-values: The label value of a reservation resource. To target a specific reservation by name, use compute.googleapis.com/reservation-name as the key and specify the name of your reservation as its value.
        service-account-email: The service account on this instance, giving access to other Google Cloud services. You can use any service account within the same project, but you must grant the service account user permission to use the instance. If not specified, the [Compute Engine default service account](/compute/docs/access/service-accounts#default_service_account) is used.
        shielded-integrity-monitoring: 'Boolean. Enable monitoring of the boot integrity of the instance. Supported values: `true`, `false`.'
        shielded-secure-boot: 'Boolean. Boot instance with secure boot enabled. Supported values: `true`, `false`.'
        shielded-vtpm: 'Boolean. Boot instance with TPM (Trusted Platform Module) enabled. Supported values: `true`, `false`.'
        subnet: |-
            ID of the subnetwork or fully qualified identifier for the subnetwork.
            +
            To set the `subnet` attribute:
            * provide the argument `--subnet` on the command line.
        subnet-region: |-
            Google Cloud region of this subnetwork https://cloud.google.com/compute/docs/regions-zones/#locations.
            +
            To set the `subnet-region` attribute:
            * provide the argument `--subnet` on the command line with a fully specified name;
            * provide the argument `--subnet-region` on the command line.
        tags: Tags to apply to this instance.
        vm-image-family: Use this VM image family to find the image; the newest image in this family will be used.
        vm-image-name: Use this VM image name to find the image.
        vm-image-project: 'The ID of the Google Cloud project that this VM image belongs to. Format: projects/`{project_id}`.'
