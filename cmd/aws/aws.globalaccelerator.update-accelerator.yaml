name: update-accelerator
description: 'Update an accelerator to make changes, such as the following:'
flags:
    --accelerator-arn=!: The Amazon Resource Name (ARN) of the accelerator to update.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --enabled: Indicates whether an accelerator is enabled.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ip-address-type=: The IP address type that an accelerator supports.
    --ip-addresses=: The IP addresses for an accelerator.
    --name=: The name of the accelerator.
    --no-enabled: Indicates whether an accelerator is enabled.
completion:
    flag:
        ip-address-type:
            - IPV4
            - DUAL_STACK
documentation:
    command: |-
        Update an accelerator to make changes, such as the following:

        - Change the name of the accelerator.
        - Disable the accelerator so that it no longer accepts or routes traffic, or so that you can delete it.
        - Enable the accelerator, if it is disabled.
        - Change the IP address type to dual-stack if it is IPv4, or change the IP address type to IPv4 if it's dual-stack.

        Be aware that static IP addresses remain assigned to your accelerator for as long as it exists, even if you disable the accelerator and it no longer accepts or routes traffic. However, when you delete the accelerator, you lose the static IP addresses that are assigned to it, so you can no longer route traffic by using them.

        Global Accelerator is a global service that supports endpoints in multiple Amazon Web Services Regions but you must specify the US West (Oregon) Region to create, update, or otherwise work with accelerators. That is, for example, specify `--region us-west-2` on Amazon Web Services CLI commands.
    flag:
        accelerator-arn: The Amazon Resource Name (ARN) of the accelerator to update.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        enabled: |-
            Indicates whether an accelerator is enabled. The value is true or false. The default value is true.

            If the value is set to true, the accelerator cannot be deleted. If set to false, the accelerator can be deleted.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ip-address-type: The IP address type that an accelerator supports. For a standard accelerator, the value can be IPV4 or DUAL\_STACK.
        ip-addresses: The IP addresses for an accelerator.
        name: The name of the accelerator. The name can have a maximum of 64 characters, must contain only alphanumeric characters, periods (.), or hyphens (-), and must not begin or end with a hyphen or period.
