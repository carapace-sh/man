name: set-iam-policy
description: Set the IAM policy for a workforce pool.
flags:
    --location=: The location for the workforce pool.
documentation:
    command: Set the IAM policy for a workforce pool.
    flag:
        location: |-
            The location for the workforce pool.
            +
            To set the `location` attribute:
            * provide the argument `workforce_pool` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
