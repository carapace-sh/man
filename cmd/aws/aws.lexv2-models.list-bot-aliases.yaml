name: list-bot-aliases
description: Gets a list of aliases for the specified bot.
flags:
    --bot-id=!: The identifier of the bot to list aliases for.
    --max-results=: The maximum number of aliases to return in each page of results.
    --next-token=: If the response from the `ListBotAliases` operation contains more results than specified in the `maxResults` parameter, a token is returned in the response.
documentation:
    command: Gets a list of aliases for the specified bot.
    flag:
        bot-id: The identifier of the bot to list aliases for.
        max-results: The maximum number of aliases to return in each page of results. If there are fewer results than the max page size, only the actual number of results are returned.
        next-token: If the response from the `ListBotAliases` operation contains more results than specified in the `maxResults` parameter, a token is returned in the response. Use that token in the `nextToken` parameter to return the next page of results.
