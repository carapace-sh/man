name: create-rule
description: Creates a rule for the specified listener.
flags:
    --actions=!: The actions.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --conditions=!: The conditions.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --listener-arn=!: The Amazon Resource Name (ARN) of the listener.
    --priority=!: The rule priority.
    --tags=: The tags to assign to the rule.
    --transforms=: The transforms to apply to requests that match this rule.
documentation:
    command: |-
        Creates a rule for the specified listener. The listener must be associated with an Application Load Balancer.

        Each rule consists of a priority, one or more actions, one or more conditions, and up to two optional transforms. Rules are evaluated in priority order, from the lowest value to the highest value. When the conditions for a rule are met, its actions are performed. If the conditions for no rules are met, the actions for the default rule are performed. For more information, see [Listener rules](https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-listeners.html#listener-rules) in the *Application Load Balancers Guide*.
    flag:
        actions: The actions.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        conditions: The conditions.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        listener-arn: The Amazon Resource Name (ARN) of the listener.
        priority: The rule priority. A listener can't have multiple rules with the same priority.
        tags: The tags to assign to the rule.
        transforms: The transforms to apply to requests that match this rule. You can add one host header rewrite transform and one URL rewrite transform.
