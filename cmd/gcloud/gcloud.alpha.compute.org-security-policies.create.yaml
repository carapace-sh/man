name: create
description: '*(ALPHA)*  Create a Compute Engine organization security policy.'
flags:
    --description=: An optional, textual description for the organization security policy.
    --display-name=: A textual name of the security policy.
    --file-format=: The format of the file to create the organization security policy config from.
    --file-name=: The name of the JSON or YAML file to create a organization security policy config from.
    --folder=: Folder in which the organization security policy is to be created.
    --organization=: Organization in which the organization security policy is to be created.
    --short-name=: A textual name of the security policy.
    --type=: The type indicates the intended use of the organization security policy.
completion:
    flag:
        file-format:
            - json
            - yaml
        type:
            - CLOUD_ARMOR
            - FIREWALL
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute org-security-policies create* is used to create organization security policies. An organization
        security policy is a set of rules that controls access to various resources.
    flag:
        description: An optional, textual description for the organization security policy.
        display-name: A textual name of the security policy.
        file-format: 'The format of the file to create the organization security policy config from. Specify either yaml or json. Defaults to yaml if not specified. Will be ignored if --file-name is not specified. _FILE_FORMAT_ must be one of: *json*, *yaml*.'
        file-name: The name of the JSON or YAML file to create a organization security policy config from.
        folder: Folder in which the organization security policy is to be created.
        organization: Organization in which the organization security policy is to be created.
        short-name: A textual name of the security policy.
        type: 'The type indicates the intended use of the organization security policy. _SECURITY_POLICY_TYPE_ must be one of: *CLOUD_ARMOR*, *FIREWALL*.'
