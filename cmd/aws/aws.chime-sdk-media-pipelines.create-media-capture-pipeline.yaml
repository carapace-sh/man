name: create-media-capture-pipeline
description: Creates a media pipeline.
flags:
    --chime-sdk-meeting-configuration=: The configuration for a specified media pipeline.
    --client-request-token=: The unique identifier for the client request.
    --sink-arn=!: The ARN of the sink type.
    --sink-iam-role-arn=: The Amazon Resource Name (ARN) of the sink role to be used with `AwsKmsKeyId` in `SseAwsKeyManagementParams`.
    --sink-type=!: Destination type to which the media artifacts are saved.
    --source-arn=!: ARN of the source from which the media artifacts are captured.
    --source-type=!: Source type from which the media artifacts are captured.
    --sse-aws-key-management-params=: An object that contains server side encryption parameters to be used by media capture pipeline.
    --tags=: The tag key-value pairs.
completion:
    flag:
        sink-type:
            - S3Bucket
        source-type:
            - ChimeSdkMeeting
documentation:
    command: Creates a media pipeline.
    flag:
        chime-sdk-meeting-configuration: The configuration for a specified media pipeline. `SourceType` must be `ChimeSdkMeeting`.
        client-request-token: The unique identifier for the client request. The token makes the API request idempotent. Use a unique token for each media pipeline request.
        sink-arn: The ARN of the sink type.
        sink-iam-role-arn: |-
            The Amazon Resource Name (ARN) of the sink role to be used with `AwsKmsKeyId` in `SseAwsKeyManagementParams`. Can only interact with `S3Bucket` sink type. The role must belong to the caller’s account and be able to act on behalf of the caller during the API call. All minimum policy permissions requirements for the caller to perform sink-related actions are the same for `SinkIamRoleArn`.

            Additionally, the role must have permission to `kms:GenerateDataKey` using KMS key supplied as `AwsKmsKeyId` in `SseAwsKeyManagementParams`. If media concatenation will be required later, the role must also have permission to `kms:Decrypt` for the same KMS key.
        sink-type: Destination type to which the media artifacts are saved. You must use an S3 bucket.
        source-arn: ARN of the source from which the media artifacts are captured.
        source-type: Source type from which the media artifacts are captured. A Chime SDK Meeting is the only supported source.
        sse-aws-key-management-params: An object that contains server side encryption parameters to be used by media capture pipeline. The parameters can also be used by media concatenation pipeline taking media capture pipeline as a media source.
        tags: The tag key-value pairs.
