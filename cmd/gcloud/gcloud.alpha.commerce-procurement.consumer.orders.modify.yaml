name: modify
description: '*(ALPHA)*  Modifies the order resource from the Modify API.'
hidden: true
flags:
    --billing-account=: Cloud Billing Account for the Procurement Order.
    --etag=: The weak etag for validation check, if specified.
    --new-quote-external-name=: The external name of the quote the order will use.
    --product-request=: Request about product info to modify order against.
    --quote-change-type=!: Change type on quote based purchase.
documentation:
    command: '*(ALPHA)*  Modifies the order resource from the Modify API.'
    flag:
        billing-account: |-
            Cloud Billing Account for the Procurement Order. Billing account id is required if order is not specified as full resource name.
            +
            To set the `billing-account` attribute:
            * provide the argument `order` on the command line with a fully specified name;
            * provide the argument `--billing-account` on the command line.
        etag: The weak etag for validation check, if specified.
        new-quote-external-name: The external name of the quote the order will use.
        product-request: Request about product info to modify order against.
        quote-change-type: Change type on quote based purchase.
