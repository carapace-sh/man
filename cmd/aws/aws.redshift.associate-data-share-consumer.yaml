name: associate-data-share-consumer
description: From a datashare consumer account, associates a datashare with the account (AssociateEntireAccount) or the specified namespace (ConsumerArn).
flags:
    --allow-writes: If set to true, allows write operations for a datashare.
    --associate-entire-account: A value that specifies whether the datashare is associated with the entire account.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --consumer-arn=: The Amazon Resource Name (ARN) of the consumer namespace associated with the datashare.
    --consumer-region=: From a datashare consumer account, associates a datashare with all existing and future namespaces in the specified Amazon Web Services Region.
    --data-share-arn=!: The Amazon Resource Name (ARN) of the datashare that the consumer is to use.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-allow-writes: If set to true, allows write operations for a datashare.
    --no-associate-entire-account: A value that specifies whether the datashare is associated with the entire account.
documentation:
    command: From a datashare consumer account, associates a datashare with the account (AssociateEntireAccount) or the specified namespace (ConsumerArn). If you make this association, the consumer can consume the datashare.
    flag:
        allow-writes: If set to true, allows write operations for a datashare.
        associate-entire-account: A value that specifies whether the datashare is associated with the entire account.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        consumer-arn: The Amazon Resource Name (ARN) of the consumer namespace associated with the datashare.
        consumer-region: From a datashare consumer account, associates a datashare with all existing and future namespaces in the specified Amazon Web Services Region.
        data-share-arn: The Amazon Resource Name (ARN) of the datashare that the consumer is to use.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
