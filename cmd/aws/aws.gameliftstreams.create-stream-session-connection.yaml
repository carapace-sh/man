name: create-stream-session-connection
description: Enables clients to reconnect to a stream session while preserving all session state and data in the disconnected session.
flags:
    --client-token=: A unique identifier that represents a client request.
    --identifier=!: '[Amazon Resource Name (ARN)](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference-arns.html) or ID that uniquely identifies the stream group resource.'
    --signal-request=!: A WebRTC ICE offer string to use when initializing a WebRTC connection.
    --stream-session-identifier=!: '[Amazon Resource Name (ARN)](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference-arns.html) or ID that uniquely identifies the stream session resource.'
documentation:
    command: "Enables clients to reconnect to a stream session while preserving all session state and data in the disconnected session. This reconnection process can be initiated when a stream session is in either `PENDING_CLIENT_RECONNECTION` or `ACTIVE` status. The process works as follows:\n\n1. Initial disconnect:\n   \n   - When a client disconnects or loses connection, the stream session transitions from `CONNECTED` to `PENDING_CLIENT_RECONNECTION`\n2. Reconnection time window:\n   \n   - Clients have `ConnectionTimeoutSeconds` (defined in [StartStreamSession](https://docs.aws.amazon.com/gameliftstreams/latest/apireference/API_StartStreamSession.html)) to reconnect before session termination\n   - Your backend server must call **CreateStreamSessionConnection** to initiate reconnection\n   - Session transitions to `RECONNECTING` status\n3. Reconnection completion:\n   \n   - On successful **CreateStreamSessionConnection**, session status changes to `ACTIVE`\n   - Provide the new connection information to the requesting client\n   - Client must establish connection within `ConnectionTimeoutSeconds`\n   - Session terminates automatically if client fails to connect in time\n\nFor more information about the stream session lifecycle, see [Stream sessions](https://docs.aws.amazon.com/gameliftstreams/latest/developerguide/stream-sessions.html) in the *Amazon GameLift Streams Developer Guide*.\n\nTo begin re-connecting to an existing stream session, specify the stream group ID and stream session ID that you want to reconnect to, and the signal request to use with the stream."
    flag:
        client-token: A unique identifier that represents a client request. The request is idempotent, which ensures that an API request completes only once. When users send a request, Amazon GameLift Streams automatically populates this field.
        identifier: |-
            [Amazon Resource Name (ARN)](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference-arns.html) or ID that uniquely identifies the stream group resource. Example ARN: `arn:aws:gameliftstreams:us-west-2:111122223333:streamgroup/sg-1AB2C3De4`. Example ID: `sg-1AB2C3De4`.

            The stream group that you want to run this stream session with. The stream group must be in `ACTIVE` status.
        signal-request: A WebRTC ICE offer string to use when initializing a WebRTC connection. The offer is a very long JSON string. Provide the string as a text value in quotes. The offer must be newly generated, not the same offer provided to `StartStreamSession`.
        stream-session-identifier: |-
            [Amazon Resource Name (ARN)](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference-arns.html) or ID that uniquely identifies the stream session resource. Example ARN: `arn:aws:gameliftstreams:us-west-2:111122223333:streamsession/sg-1AB2C3De4/ABC123def4567`. Example ID: `ABC123def4567`.

            The stream session must be in `PENDING_CLIENT_RECONNECTION` or `ACTIVE` status.
