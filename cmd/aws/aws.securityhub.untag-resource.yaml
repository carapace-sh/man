name: untag-resource
description: Removes one or more tags from a resource.
flags:
    --resource-arn=!: The ARN of the resource to remove the tags from.
    --tag-keys=!: The tag keys associated with the tags to remove from the resource.
documentation:
    command: Removes one or more tags from a resource.
    flag:
        resource-arn: The ARN of the resource to remove the tags from.
        tag-keys: The tag keys associated with the tags to remove from the resource. You can remove up to 50 tags at a time.
