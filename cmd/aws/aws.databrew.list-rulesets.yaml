name: list-rulesets
description: List all rulesets available in the current account or rulesets associated with a specific resource (dataset).
flags:
    --max-results=: The maximum number of results to return in this request.
    --next-token=: A token generated by DataBrew that specifies where to continue pagination if a previous request was truncated.
    --target-arn=: The Amazon Resource Name (ARN) of a resource (dataset).
documentation:
    command: List all rulesets available in the current account or rulesets associated with a specific resource (dataset).
    flag:
        max-results: The maximum number of results to return in this request.
        next-token: A token generated by DataBrew that specifies where to continue pagination if a previous request was truncated. To get the next set of pages, pass in the NextToken value from the response object of the previous page call.
        target-arn: The Amazon Resource Name (ARN) of a resource (dataset). Using this parameter indicates to return only those rulesets that are associated with the specified resource.
