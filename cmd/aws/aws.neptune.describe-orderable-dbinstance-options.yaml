name: describe-orderable-dbinstance-options
description: Returns a list of orderable DB instance options for the specified engine.
flags:
    --dbinstance-class=: The DB instance class filter value.
    --engine-version=: The engine version filter value.
    --engine=!: The name of the engine to retrieve DB instance options for.
    --filters=: This parameter is not currently supported.
    --license-model=: The license model filter value.
    --marker=: An optional pagination token provided by a previous DescribeOrderableDBInstanceOptions request.
    --max-records=: The maximum number of records to include in the response.
    --vpc=: The VPC filter value.
documentation:
    command: Returns a list of orderable DB instance options for the specified engine.
    flag:
        dbinstance-class: The DB instance class filter value. Specify this parameter to show only the available offerings matching the specified DB instance class.
        engine: The name of the engine to retrieve DB instance options for.
        engine-version: The engine version filter value. Specify this parameter to show only the available offerings matching the specified engine version.
        filters: This parameter is not currently supported.
        license-model: The license model filter value. Specify this parameter to show only the available offerings matching the specified license model.
        marker: An optional pagination token provided by a previous DescribeOrderableDBInstanceOptions request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords` .
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that the remaining results can be retrieved.

            Default: 100

            Constraints: Minimum 20, maximum 100.
        vpc: The VPC filter value. Specify this parameter to show only the available VPC or non-VPC offerings.
