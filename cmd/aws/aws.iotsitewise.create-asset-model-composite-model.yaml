name: create-asset-model-composite-model
description: Creates a custom composite model from specified property and hierarchy definitions.
flags:
    --asset-model-composite-model-description=: A description for the composite model.
    --asset-model-composite-model-external-id=: An external ID to assign to the composite model.
    --asset-model-composite-model-id=: The ID of the composite model.
    --asset-model-composite-model-name=!: A unique name for the composite model.
    --asset-model-composite-model-properties=: The property definitions of the composite model.
    --asset-model-composite-model-type=!: The composite model type.
    --asset-model-id=!: The ID of the asset model this composite model is a part of.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
    --composed-asset-model-id=: The ID of a component model which is reused to create this composite model.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --if-match=: The expected current entity tag (ETag) for the asset model’s latest or active version (specified using `matchForVersionType`).
    --if-none-match=: Accepts **\*** to reject the create request if an active version (specified using `matchForVersionType` as `ACTIVE`) already exists for the asset model.
    --match-for-version-type=: Specifies the asset model version type (`LATEST` or `ACTIVE`) used in conjunction with `If-Match` or `If-None-Match` headers to determine the target ETag for the create operation.
    --parent-asset-model-composite-model-id=: The ID of the parent composite model in this asset model relationship.
completion:
    flag:
        match-for-version-type:
            - LATEST
            - ACTIVE
documentation:
    command: |-
        Creates a custom composite model from specified property and hierarchy definitions. There are two types of custom composite models, `inline` and `component-model-based`.

        Use component-model-based custom composite models to define standard, reusable components. A component-model-based custom composite model consists of a name, a description, and the ID of the component model it references. A component-model-based custom composite model has no properties of its own; its referenced component model provides its associated properties to any created assets. For more information, see [Custom composite models (Components)](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/custom-composite-models.html) in the *IoT SiteWise User Guide*.

        Use inline custom composite models to organize the properties of an asset model. The properties of inline custom composite models are local to the asset model where they are included and can't be used to create multiple assets.

        To create a component-model-based model, specify the `composedAssetModelId` of an existing asset model with `assetModelType` of `COMPONENT_MODEL`.

        To create an inline model, specify the `assetModelCompositeModelProperties` and don't include an `composedAssetModelId`.
    flag:
        asset-model-composite-model-description: A description for the composite model.
        asset-model-composite-model-external-id: |-
            An external ID to assign to the composite model.

            If the composite model is a derived composite model, or one nested inside a component model, you can only set the external ID using `UpdateAssetModelCompositeModel` and specifying the derived ID of the model or property from the created model it's a part of.
        asset-model-composite-model-id: The ID of the composite model. IoT SiteWise automatically generates a unique ID for you, so this parameter is never required. However, if you prefer to supply your own ID instead, you can specify it here in UUID format. If you specify your own ID, it must be globally unique.
        asset-model-composite-model-name: A unique name for the composite model.
        asset-model-composite-model-properties: |-
            The property definitions of the composite model. For more information, see [Inline custom composite models](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/custom-composite-models.html#inline-composite-models) in the *IoT SiteWise User Guide*.

            You can specify up to 200 properties per composite model. For more information, see [Quotas](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/quotas.html) in the *IoT SiteWise User Guide*.
        asset-model-composite-model-type: The composite model type. Valid values are `AWS/ALARM`, `CUSTOM`, or `AWS/L4E_ANOMALY`.
        asset-model-id: The ID of the asset model this composite model is a part of.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request. Don't reuse this client token if a new idempotent request is required.
        composed-asset-model-id: The ID of a component model which is reused to create this composite model.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        if-match: The expected current entity tag (ETag) for the asset model’s latest or active version (specified using `matchForVersionType`). The create request is rejected if the tag does not match the latest or active version's current entity tag. See [Optimistic locking for asset model writes](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/opt-locking-for-model.html) in the *IoT SiteWise User Guide*.
        if-none-match: Accepts **\*** to reject the create request if an active version (specified using `matchForVersionType` as `ACTIVE`) already exists for the asset model.
        match-for-version-type: Specifies the asset model version type (`LATEST` or `ACTIVE`) used in conjunction with `If-Match` or `If-None-Match` headers to determine the target ETag for the create operation.
        parent-asset-model-composite-model-id: The ID of the parent composite model in this asset model relationship.
