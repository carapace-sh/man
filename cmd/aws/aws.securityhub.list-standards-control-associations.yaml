name: list-standards-control-associations
description: Specifies whether a control is currently enabled or disabled in each enabled standard in the calling account.
flags:
    --max-results=: An optional parameter that limits the total results of the API response to the specified number.
    --next-token=: Optional pagination parameter.
    --security-control-id=!: The identifier of the control (identified with `SecurityControlId`, `SecurityControlArn`, or a mix of both parameters) that you want to determine the enablement status of in each enabled standard.
documentation:
    command: |-
        Specifies whether a control is currently enabled or disabled in each enabled standard in the calling account.

        This operation omits standards control associations for standard subscriptions where `StandardsControlsUpdatable` has value `NOT_READY_FOR_UPDATES`.
    flag:
        max-results: An optional parameter that limits the total results of the API response to the specified number. If this parameter isn't provided in the request, the results include the first 25 standard and control associations. The results also include a `NextToken` parameter that you can use in a subsequent API call to get the next 25 associations. This repeats until all associations for the specified control are returned. The number of results is limited by the number of supported Security Hub standards that you've enabled in the calling account.
        next-token: Optional pagination parameter.
        security-control-id: The identifier of the control (identified with `SecurityControlId`, `SecurityControlArn`, or a mix of both parameters) that you want to determine the enablement status of in each enabled standard.
