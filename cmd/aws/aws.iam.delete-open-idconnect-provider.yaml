name: delete-open-idconnect-provider
description: Deletes an OpenID Connect identity provider (IdP) resource object in IAM.
flags:
    --open-idconnect-provider-arn=!: The Amazon Resource Name (ARN) of the IAM OpenID Connect provider resource object to delete.
documentation:
    command: |-
        Deletes an OpenID Connect identity provider (IdP) resource object in IAM.

        Deleting an IAM OIDC provider resource does not update any roles that reference the provider as a principal in their trust policies. Any attempt to assume a role that references a deleted provider fails.

        This operation is idempotent; it does not fail or return an error if you call the operation for a provider that does not exist.
    flag:
        open-idconnect-provider-arn: The Amazon Resource Name (ARN) of the IAM OpenID Connect provider resource object to delete. You can get a list of OpenID Connect provider resource ARNs by using the [ListOpenIDConnectProviders](https://docs.aws.amazon.com/IAM/latest/APIReference/API_ListOpenIDConnectProviders.html) operation.
