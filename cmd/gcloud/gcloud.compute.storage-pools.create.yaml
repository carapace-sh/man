name: create
description: Create a storage pool.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --capacity-provisioning-type=: Capacity provisioning type.
    --description=: Description of the storage pool.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --performance-provisioning-type=: Performance provisioning type.
    --provisioned-capacity=!: Provisioned capacity of the storage pool.
    --provisioned-iops=: IOPS with which to provision the pool.
    --provisioned-throughput=: Throughput in MB/s with which to provision the pool.
    --storage-pool-type=!: ID of the storage pool type or fully qualified identifier for the storage pool type.
    --zone=: For resources [storage-pool-type, storage_pool], provides fallback value for resource zone attribute.
completion:
    flag:
        capacity-provisioning-type:
            - advanced
            - standard
        performance-provisioning-type:
            - advanced
            - standard
documentation:
    command: Create a storage pool.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        capacity-provisioning-type: 'Capacity provisioning type. _CAPACITY_PROVISIONING_TYPE_ must be one of: *advanced*, *standard*.'
        description: Description of the storage pool.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        performance-provisioning-type: 'Performance provisioning type. _PERFORMANCE_PROVISIONING_TYPE_ must be one of: *advanced*, *standard*.'
        provisioned-capacity: Provisioned capacity of the storage pool.
        provisioned-iops: IOPS with which to provision the pool.
        provisioned-throughput: Throughput in MB/s with which to provision the pool.
        storage-pool-type: |-
            ID of the storage pool type or fully qualified identifier for the storage pool type.
            +
            To set the `storage-pool-type` attribute:
            * provide the argument `--storage-pool-type` on the command line.
        zone: For resources [storage-pool-type, storage_pool], provides fallback value for resource zone attribute. When the resource's full URI path is not provided, zone will fallback to this flag value.
