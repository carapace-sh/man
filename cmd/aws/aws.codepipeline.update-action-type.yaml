name: update-action-type
description: Updates an action type that was created with any supported integration model, where the action type is to be used by customers of the action type provider.
flags:
    --action-type=!: The action type definition for the action type to be updated.
documentation:
    command: Updates an action type that was created with any supported integration model, where the action type is to be used by customers of the action type provider. Use a JSON file with the action definition and `UpdateActionType` to provide the full structure.
    flag:
        action-type: The action type definition for the action type to be updated.
