name: delete
description: Delete a Distributed Cloud Edge Network interconnect attachment.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The global location name.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --zone=: The name of the Google Distributed Cloud Edge zone.
documentation:
    command: |
        Delete a Distributed Cloud Edge Network interconnect attachment.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The global location name.
            +
            To set the `location` attribute:
            * provide the argument `interconnect_attachment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        zone: |-
            The name of the Google Distributed Cloud Edge zone.
            +
            To set the `zone` attribute:
            * provide the argument `interconnect_attachment` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line.
