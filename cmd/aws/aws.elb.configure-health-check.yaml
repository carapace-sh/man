name: configure-health-check
description: Specifies the health check settings to use when evaluating the health state of your EC2 instances.
flags:
    --health-check=!: The configuration information.
    --load-balancer-name=!: The name of the load balancer.
documentation:
    command: |-
        Specifies the health check settings to use when evaluating the health state of your EC2 instances.

        For more information, see [Configure Health Checks for Your Load Balancer](https://docs.aws.amazon.com/elasticloadbalancing/latest/classic/elb-healthchecks.html) in the *Classic Load Balancers Guide*.
    flag:
        health-check: The configuration information.
        load-balancer-name: The name of the load balancer.
