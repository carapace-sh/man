name: update-table
description: Updates a metadata table in the Data Catalog.
flags:
    --catalog-id=: The ID of the Data Catalog where the table resides.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --database-name=!: The name of the catalog database in which the table resides.
    --force: A flag that can be set to true to ignore matching storage descriptor and subobject matching requirements.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=: The unique identifier for the table within the specified database that will be created in the Glue Data Catalog.
    --no-force: A flag that can be set to true to ignore matching storage descriptor and subobject matching requirements.
    --no-skip-archive: By default, `UpdateTable` always creates an archived version of the table before updating it.
    --skip-archive: By default, `UpdateTable` always creates an archived version of the table before updating it.
    --table-input=: An updated `TableInput` object to define the metadata table in the catalog.
    --transaction-id=: The transaction ID at which to update the table contents.
    --update-open-table-format-input=: ""
    --version-id=: The version ID at which to update the table contents.
    --view-update-action=: The operation to be performed when updating the view.
completion:
    flag:
        view-update-action:
            - ADD
            - REPLACE
            - ADD_OR_REPLACE
            - DROP
documentation:
    command: Updates a metadata table in the Data Catalog.
    flag:
        catalog-id: The ID of the Data Catalog where the table resides. If none is provided, the Amazon Web Services account ID is used by default.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        database-name: The name of the catalog database in which the table resides. For Hive compatibility, this name is entirely lowercase.
        force: A flag that can be set to true to ignore matching storage descriptor and subobject matching requirements.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The unique identifier for the table within the specified database that will be created in the Glue Data Catalog.
        skip-archive: By default, `UpdateTable` always creates an archived version of the table before updating it. However, if `skipArchive` is set to true, `UpdateTable` does not create the archived version.
        table-input: An updated `TableInput` object to define the metadata table in the catalog.
        transaction-id: The transaction ID at which to update the table contents.
        update-open-table-format-input: ""
        version-id: The version ID at which to update the table contents.
        view-update-action: The operation to be performed when updating the view.
