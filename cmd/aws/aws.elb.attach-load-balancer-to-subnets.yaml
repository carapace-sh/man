name: attach-load-balancer-to-subnets
description: Adds one or more subnets to the set of configured subnets for the specified load balancer.
flags:
    --load-balancer-name=!: The name of the load balancer.
    --subnets=!: The IDs of the subnets to add.
documentation:
    command: |-
        Adds one or more subnets to the set of configured subnets for the specified load balancer.

        The load balancer evenly distributes requests across all registered subnets. For more information, see [Add or Remove Subnets for Your Load Balancer in a VPC](https://docs.aws.amazon.com/elasticloadbalancing/latest/classic/elb-manage-subnets.html) in the *Classic Load Balancers Guide*.
    flag:
        load-balancer-name: The name of the load balancer.
        subnets: The IDs of the subnets to add. You can add only one subnet per Availability Zone.
