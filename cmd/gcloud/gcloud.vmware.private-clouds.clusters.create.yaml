name: create
description: Create a Google Cloud VMware Engine cluster.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --autoscaling-cool-down-period=&: Cool down period (in minutes) between consecutive cluster expansions/contractions
    --autoscaling-max-cluster-node-count=&: Maximum number of nodes in the cluster
    --autoscaling-min-cluster-node-count=&: Minimum number of nodes in the cluster
    --autoscaling-policy=&: Autoscaling policy to be applied to the cluster
    --autoscaling-settings-from-file=&: A YAML file containing the autoscaling settings to be applied to the cluster
    --location=: Location of the private cloud or cluster.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --node-type-config=!: Information about the type and number of nodes associated with the cluster.
    --private-cloud=: VMware Engine private cloud.
documentation:
    command: |
        Create a cluster in a VMware Engine private cloud. Successful creation of a cluster results in a cluster in READY state. Check the progress of a cluster using `gcloud vmware private-clouds clusters list`.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        autoscaling-cool-down-period: Cool down period (in minutes) between consecutive cluster expansions/contractions
        autoscaling-max-cluster-node-count: Maximum number of nodes in the cluster
        autoscaling-min-cluster-node-count: Minimum number of nodes in the cluster
        autoscaling-policy: Autoscaling policy to be applied to the cluster
        autoscaling-settings-from-file: A YAML file containing the autoscaling settings to be applied to the cluster
        location: |-
            Location of the private cloud or cluster.
            +
            To set the `location` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/zone`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        node-type-config: |-
            Information about the type and number of nodes associated with the cluster.
            +
            type (required): canonical identifier of the node type.
            +
            count (required): number of nodes of this type in the cluster.
            +
            custom-core-count (optional): customized number of cores available to each node of the type.
            To get a list of valid values for your node type,
            run the gcloud vmware node-types describe command and reference the
            availableCustomCoreCounts field in the output.
        private-cloud: |-
            VMware Engine private cloud.
            +
            To set the `private-cloud` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--private-cloud` on the command line.
