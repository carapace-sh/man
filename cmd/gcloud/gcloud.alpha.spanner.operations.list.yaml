name: list
description: '*(ALPHA)*  List the Cloud Spanner operations.'
flags:
    --backup=: For backup operations, the name of the backup the operations are executing on.
    --database=: For database operations, the name of the database the operations are executing on.
    --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
    --instance-config=: The ID of the instance configuration the operation is executing on.
    --instance-partition=: For instance partition operations, the name of the instance partition the operation is executing on.
    --instance=: The ID of the instance the operation is executing on.
    --limit=: Maximum number of resources to list.
    --no-uri&: Print a list of resource URIs instead of the default output, and change the
    --page-size=: Some services group resource list output into pages.
    --sort-by=: Comma-separated list of resource field key names to sort by.
    --ssd-cache=&: For SSD Cache operations, the SSD Cache ID.
    --type=: (optional) List only the operations of the given type.
    --uri: Print a list of resource URIs instead of the default output, and change the
completion:
    flag:
        type:
            - BACKUP
            - DATABASE
            - DATABASE_CHANGE_QUORUM
            - DATABASE_CREATE
            - DATABASE_RESTORE
            - DATABASE_UPDATE_DDL
            - INSTANCE
            - INSTANCE_CONFIG_CREATE
            - INSTANCE_CONFIG_UPDATE
            - INSTANCE_PARTITION
documentation:
    command: '*(ALPHA)*  List the Cloud Spanner operations.'
    flag:
        backup: For backup operations, the name of the backup the operations are executing on.
        database: For database operations, the name of the database the operations are executing on.
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        instance: The ID of the instance the operation is executing on.
        instance-config: The ID of the instance configuration the operation is executing on.
        instance-partition: For instance partition operations, the name of the instance partition the operation is executing on.
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        no-uri: |
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is determined by the
            service if it supports paging, otherwise it is *unlimited* (no paging).
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
        ssd-cache: For SSD Cache operations, the SSD Cache ID.
        type: "(optional) List only the operations of the given type. _TYPE_ must be one of:\n+\n*BACKUP*::: If only the instance is specified (--instance), returns all backup operations associated with backups in the instance. When a backup is specified (--backup), only the backup operations for the given backup are returned.\n*DATABASE*::: If only the instance is specified (--instance), returns all database operations associated with the databases in the instance. When a database is specified (--database), the command would return database operations for the given database.\n*DATABASE_CHANGE_QUORUM*::: Database change quorum operations are returned for all databases in the given instance (--instance only) or only those associated with the given database (--database).\n*DATABASE_CREATE*::: Database create operations are returned for all databases in the given instance (--instance only) or only those associated with the given database (--database)\n*DATABASE_RESTORE*::: Database restore operations are returned for all databases in the given instance (--instance only) or only those associated with the given database (--database)\n*DATABASE_UPDATE_DDL*::: Database update DDL operations are returned for all databases in the given instance (--instance only) or only those associated with the given database (--database)\n*INSTANCE*::: Returns instance operations for the given instance. Note, type=INSTANCE does not work with --database or --backup.\n*INSTANCE_CONFIG_CREATE*::: Instance configuration create operations are returned for the given instance configuration (--instance-config).\n*INSTANCE_CONFIG_UPDATE*::: Instance configuration update operations are returned for the given instance configuration (--instance-config).\n*INSTANCE_PARTITION*::: If only the instance is specified (--instance), returns all instance partition operations associated with instance partitions in the instance. When an instance partition is specified (--instance-partition), only the instance partition operations for the given instance partition are returned. \n:::\n+"
        uri: |-
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
