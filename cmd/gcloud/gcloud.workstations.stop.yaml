name: stop
description: Stop a workstation.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --cluster=: The cluster for the workstation.
    --config=: The config for the workstation.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: The region for the workstation.
documentation:
    command: |-
        Stop a workstation.

        ## EXAMPLES

          To stop a workstation, run

            $ gcloud workstations stop WORKSTATION
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        cluster: |-
            The cluster for the workstation.
            +
            To set the `cluster` attribute:
            * provide the argument `workstation` on the command line with a fully specified name;
            * provide the argument `--cluster` on the command line;
            * set the property `workstations/cluster`.
        config: |-
            The config for the workstation.
            +
            To set the `config` attribute:
            * provide the argument `workstation` on the command line with a fully specified name;
            * provide the argument `--config` on the command line;
            * set the property `workstations/config`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            The region for the workstation.
            +
            To set the `region` attribute:
            * provide the argument `workstation` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `workstations/region`.
