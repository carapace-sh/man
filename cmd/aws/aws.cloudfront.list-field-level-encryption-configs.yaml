name: list-field-level-encryption-configs
description: List all field-level encryption configurations that have been created in CloudFront for this account.
flags:
    --marker=: Use this when paginating results to indicate where to begin in your list of configurations.
    --max-items=: The maximum number of field-level encryption configurations you want in the response body.
documentation:
    command: List all field-level encryption configurations that have been created in CloudFront for this account.
    flag:
        marker: Use this when paginating results to indicate where to begin in your list of configurations. The results include configurations in the list that occur after the marker. To get the next page of results, set the `Marker` to the value of the `NextMarker` from the current page's response (which is also the ID of the last configuration on that page).
        max-items: The maximum number of field-level encryption configurations you want in the response body.
