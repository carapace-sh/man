name: describe-users
description: Retrieves a list that describes one or more specified users in the user pool.
flags:
    --authentication-type=!: The authentication type for the users in the user pool to describe.
    --max-results=: The maximum size of each page of results.
    --next-token=: The pagination token to use to retrieve the next page of results for this operation.
completion:
    flag:
        authentication-type:
            - API
            - SAML
            - USERPOOL
            - AWS_AD
documentation:
    command: Retrieves a list that describes one or more specified users in the user pool.
    flag:
        authentication-type: The authentication type for the users in the user pool to describe. You must specify USERPOOL.
        max-results: The maximum size of each page of results.
        next-token: The pagination token to use to retrieve the next page of results for this operation. If this value is null, it retrieves the first page.
