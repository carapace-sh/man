name: put-integration-response
description: Represents a put integration.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --content-handling=: Specifies how to handle response payload content type conversions.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --http-method=!: Specifies a put integration response request's HTTP method.
    --resource-id=!: Specifies a put integration response request's resource identifier.
    --response-parameters=: A key-value map specifying response parameters that are passed to the method response from the back end.
    --response-templates=: Specifies a put integration response's templates.
    --rest-api-id=!: The string identifier of the associated RestApi.
    --selection-pattern=: Specifies the selection pattern of a put integration response.
    --status-code=!: Specifies the status code that is used to map the integration response to an existing MethodResponse.
completion:
    flag:
        content-handling:
            - CONVERT_TO_BINARY
            - CONVERT_TO_TEXT
documentation:
    command: Represents a put integration.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        content-handling: |-
            Specifies how to handle response payload content type conversions. Supported values are `CONVERT_TO_BINARY` and `CONVERT_TO_TEXT`, with the following behaviors:

            If this property is not defined, the response payload will be passed through from the integration response to the method response without modification.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        http-method: Specifies a put integration response request's HTTP method.
        resource-id: Specifies a put integration response request's resource identifier.
        response-parameters: A key-value map specifying response parameters that are passed to the method response from the back end. The key is a method response header parameter name and the mapped value is an integration response header value, a static value enclosed within a pair of single quotes, or a JSON expression from the integration response body. The mapping key must match the pattern of `method.response.header.{name}`, where `name` is a valid and unique header name. The mapped non-static value must match the pattern of `integration.response.header.{name}` or `integration.response.body.{JSON-expression}`, where `name` must be a valid and unique response header name and `JSON-expression` a valid JSON expression without the `$` prefix.
        response-templates: Specifies a put integration response's templates.
        rest-api-id: The string identifier of the associated RestApi.
        selection-pattern: Specifies the selection pattern of a put integration response.
        status-code: Specifies the status code that is used to map the integration response to an existing MethodResponse.
