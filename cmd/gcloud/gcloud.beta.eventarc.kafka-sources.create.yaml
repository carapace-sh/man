name: create
description: '*(BETA)*  Create an Eventarc Kafka source.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --bootstrap-servers=!: The Kafka bootstrap server URIs, in the format <hostname>:<port>
    --consumer-group-id=: The Kafka consumer group ID.
    --initial-offset=: The initial offset for the Kafka Source.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location for the Eventarc kafka source, which should be one of the supported regions.
    --logging-config=: The logging config of the kafka source.
    --message-bus-project=: Project ID of the Google Cloud project for the message bus.
    --message-bus=!: ID of the message bus or fully qualified identifier for the message bus.
    --network-attachment=!: The network attachment associated with the Kafka source that allows access to the ingress VPC.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --sasl-mechanism=!: The SASL mechanism to use for authentication with the Kafka broker.
    --sasl-password=!: The SASL password to use for authentication with the Kafka broker.
    --sasl-username=!: The SASL username to use for authentication with the Kafka broker.
    --tls-client-certificate=!&: ""
    --tls-client-key=!&: ""
    --topics=!: The Kafka topic(s) to subscribe to.
completion:
    flag:
        initial-offset:
            - newest
            - oldest
        logging-config:
            - NONE
            - DEBUG
            - INFO
            - NOTICE
            - WARNING
            - ERROR
            - CRITICAL
            - ALERT
            - EMERGENCY
        sasl-mechanism:
            - PLAIN
            - SCRAM-SHA-256
            - SCRAM-SHA-512
documentation:
    command: '*(BETA)*  Create an Eventarc Kafka source.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        bootstrap-servers: |-
            The Kafka bootstrap server URIs, in the format <hostname>:<port>
            This flag can be repeated to add more URIs to the list, or comma-separated.
            At least one URI must be specified.
            +
            Examples:
            +
              $ gcloud eventarc kafka-sources create example-kafka-source --bootstrap-servers='broker-1.private:9092,broker-2.private:9092'
        consumer-group-id: |-
            The Kafka consumer group ID. If not specified, a random UUID will be generated.
            This consumer group ID is used by the Kafka cluster to record the current read
            offsets of any topics subscribed.
            Examples:
            +
            $ gcloud eventarc kafka-sources create example-kafka-source --consumer-group-id='my-consumer-group'
        initial-offset: |-
            The initial offset for the Kafka Source. If not specified, the default value is 'newest'.
            Examples:
            $ gcloud eventarc kafka-sources create example-kafka-source --initial-offset=oldest. _INITIAL_OFFSET_ must be one of: *newest*, *oldest*.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location for the Eventarc kafka source, which should be one of the supported regions. Alternatively, set the [eventarc/location] property.
            +
            To set the `location` attribute:
            * provide the argument `kafka_source` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `eventarc/location`.
        logging-config: 'The logging config of the kafka source. _LOGGING_CONFIG_ must be one of: *NONE*, *DEBUG*, *INFO*, *NOTICE*, *WARNING*, *ERROR*, *CRITICAL*, *ALERT*, *EMERGENCY*.'
        message-bus: |-
            ID of the message bus or fully qualified identifier for the message bus.
            +
            To set the `message-bus` attribute:
            * provide the argument `--message-bus` on the command line.
        message-bus-project: |-
            Project ID of the Google Cloud project for the message bus.
            +
            To set the `project` attribute:
            * provide the argument `--message-bus` on the command line with a fully specified name;
            * provide the argument `--message-bus-project` on the command line;
            * provide the argument `--project` on the command line;
            * set the property `core/project`.
        network-attachment: The network attachment associated with the Kafka source that allows access to the ingress VPC.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        sasl-mechanism: |-
            The SASL mechanism to use for authentication with the Kafka broker.
            This flag cannot be set if --tls-client-certificate is set (using mutual TLS for authentication).
            Examples:
            $ gcloud eventarc kafka-sources create example-kafka-source --sasl-mechanism=plain. _SASL_MECHANISM_ must be one of: *PLAIN*, *SCRAM-SHA-256*, *SCRAM-SHA-512*.
        sasl-password: |-
            The SASL password to use for authentication with the Kafka broker.
            This flag is required if --sasl-mechanism is set.
            Examples:
            $ gcloud eventarc kafka-sources create example-kafka-source --sasl-password='projects/123/secrets/my-secret/versions/1'
        sasl-username: |-
            The SASL username to use for authentication with the Kafka broker.
            This flag is required if --sasl-mechanism is set.
            Examples:
            $ gcloud eventarc kafka-sources create example-kafka-source --sasl-username='projects/123/secrets/my-username/versions/1'
        tls-client-certificate: |
            The mutual TLS Client Certificate to use for authentication with the Kafka broker.
            This option cannot be set if --sasl-mechanism is set.
            Examples:
            $ gcloud eventarc kafka-sources create example-kafka-source --tls-client-certificate='projects/123/secrets/my-certificate/versions/1'
        tls-client-key: |
            The mutual TLS Client Key to use for authentication with the Kafka broker.
            This option is required if --tls-client-certificate is set.
            Examples:
            $ gcloud eventarc kafka-sources create example-kafka-source --tls-client-key='projects/123/secrets/my-key/versions/1'
        topics: |-
            The Kafka topic(s) to subscribe to. At least one topic must be specified.
            Examples:
            +
            $ gcloud eventarc kafka-sources create example-kafka-source --topics='topic1,topic2'
