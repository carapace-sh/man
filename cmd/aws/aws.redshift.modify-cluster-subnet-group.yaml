name: modify-cluster-subnet-group
description: Modifies a cluster subnet group to include the specified list of VPC subnets.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cluster-subnet-group-name=!: The name of the subnet group to be modified.
    --description=: A text description of the subnet group to be modified.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --subnet-ids=!: An array of VPC subnet IDs.
documentation:
    command: |-
        Modifies a cluster subnet group to include the specified list of VPC subnets. The operation replaces the existing list of subnets with the new list of subnets.

        VPC Block Public Access (BPA) enables you to block resources in VPCs and subnets that you own in a Region from reaching or being reached from the internet through internet gateways and egress-only internet gateways. If a subnet group for a provisioned cluster is in an account with VPC BPA turned on, the following capabilities are blocked:

        - Creating a public cluster
        - Restoring a public cluster
        - Modifying a private cluster to be public
        - Adding a subnet with VPC BPA turned on to the subnet group when there's at least one public cluster within the group

        For more information about VPC BPA, see [Block public access to VPCs and subnets](https://docs.aws.amazon.com/vpc/latest/userguide/security-vpc-bpa.html) in the *Amazon VPC User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cluster-subnet-group-name: The name of the subnet group to be modified.
        description: A text description of the subnet group to be modified.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        subnet-ids: An array of VPC subnet IDs. A maximum of 20 subnets can be modified in a single request.
