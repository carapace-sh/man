name: promote
description: Promotes a data replication replica broker to the primary broker role.
flags:
    --broker-id=!: The unique ID that Amazon MQ generates for the broker.
    --mode=!: The Promote mode requested.
completion:
    flag:
        mode:
            - SWITCHOVER
            - FAILOVER
documentation:
    command: Promotes a data replication replica broker to the primary broker role.
    flag:
        broker-id: The unique ID that Amazon MQ generates for the broker.
        mode: 'The Promote mode requested. Note: Valid values for the parameter are SWITCHOVER, FAILOVER.'
