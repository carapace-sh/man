name: delete-campaign
description: Removes a campaign by deleting the solution deployment.
flags:
    --campaign-arn=!: The Amazon Resource Name (ARN) of the campaign to delete.
documentation:
    command: Removes a campaign by deleting the solution deployment. The solution that the campaign is based on is not deleted and can be redeployed when needed. A deleted campaign can no longer be specified in a [GetRecommendations](https://docs.aws.amazon.com/personalize/latest/dg/API_RS_GetRecommendations.html) request. For information on creating campaigns, see [CreateCampaign](https://docs.aws.amazon.com/personalize/latest/dg/API_CreateCampaign.html).
    flag:
        campaign-arn: The Amazon Resource Name (ARN) of the campaign to delete.
