name: delete-resource-policy
description: Removes an existing policy from a bot or bot alias.
flags:
    --expected-revision-id=: The identifier of the revision to edit.
    --resource-arn=!: The Amazon Resource Name (ARN) of the bot or bot alias that has the resource policy attached.
documentation:
    command: Removes an existing policy from a bot or bot alias. If the resource doesn't have a policy attached, Amazon Lex returns an exception.
    flag:
        expected-revision-id: |-
            The identifier of the revision to edit. If this ID doesn't match the current revision number, Amazon Lex returns an exception

            If you don't specify a revision ID, Amazon Lex will delete the current policy.
        resource-arn: The Amazon Resource Name (ARN) of the bot or bot alias that has the resource policy attached.
