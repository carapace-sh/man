name: create-channel-flow
description: Creates a channel flow, a container for processors.
flags:
    --app-instance-arn=!: The ARN of the channel flow request.
    --client-request-token=!: The client token for the request.
    --name=!: The name of the channel flow.
    --processors=!: Information about the processor Lambda functions.
    --tags=: The tags for the creation request.
documentation:
    command: |-
        Creates a channel flow, a container for processors. Processors are AWS Lambda functions that perform actions on chat messages, such as stripping out profanity. You can associate channel flows with channels, and the processors in the channel flow then take action on all messages sent to that channel. This is a developer API.

        Channel flows process the following items:

        1. New and updated messages
        2. Persistent and non-persistent messages
        3. The Standard message type

        Channel flows don't process Control or System messages. For more information about the message types provided by Chime SDK messaging, refer to [Message types](https://docs.aws.amazon.com/chime-sdk/latest/dg/using-the-messaging-sdk.html#msg-types) in the *Amazon Chime developer guide*.
    flag:
        app-instance-arn: The ARN of the channel flow request.
        client-request-token: The client token for the request. An Idempotency token.
        name: The name of the channel flow.
        processors: Information about the processor Lambda functions.
        tags: The tags for the creation request.
