name: stop-dbcluster
description: Stops the running cluster that is specified by `DBClusterIdentifier`.
flags:
    --dbcluster-identifier=!: The identifier of the cluster to stop.
documentation:
    command: Stops the running cluster that is specified by `DBClusterIdentifier`. The cluster must be in the *available* state. For more information, see [Stopping and Starting an Amazon DocumentDB Cluster](https://docs.aws.amazon.com/documentdb/latest/developerguide/db-cluster-stop-start.html).
    flag:
        dbcluster-identifier: 'The identifier of the cluster to stop. Example: `docdb-2019-05-28-15-24-52`'
