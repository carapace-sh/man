name: describe-entity-aggregates-for-organization
description: Returns a list of entity aggregates for your Organizations that are affected by each of the specified events.
flags:
    --aws-account-ids=: A list of 12-digit Amazon Web Services account numbers that contains the affected entities.
    --event-arns=!: A list of event ARNs (unique identifiers).
documentation:
    command: Returns a list of entity aggregates for your Organizations that are affected by each of the specified events.
    flag:
        aws-account-ids: A list of 12-digit Amazon Web Services account numbers that contains the affected entities.
        event-arns: 'A list of event ARNs (unique identifiers). For example: `"arn:aws:health:us-east-1::event/EC2/EC2_INSTANCE_RETIREMENT_SCHEDULED/EC2_INSTANCE_RETIREMENT_SCHEDULED_ABC123-CDE456", "arn:aws:health:us-west-1::event/EBS/AWS_EBS_LOST_VOLUME/AWS_EBS_LOST_VOLUME_CHI789_JKL101"`'
