name: delete-facet
description: Deletes a given [Facet]().
flags:
    --name=!: The name of the facet to delete.
    --schema-arn=!: The Amazon Resource Name (ARN) that is associated with the [Facet]().
documentation:
    command: Deletes a given [Facet](). All attributes and [Rule]()s that are associated with the facet will be deleted. Only development schema facets are allowed deletion.
    flag:
        name: The name of the facet to delete.
        schema-arn: The Amazon Resource Name (ARN) that is associated with the [Facet](). For more information, see [arns]().
