name: delete-registry
description: Delete the entire registry including schema and all of its versions.
flags:
    --registry-id=!: This is a wrapper structure that may contain the registry name and Amazon Resource Name (ARN).
documentation:
    command: Delete the entire registry including schema and all of its versions. To get the status of the delete operation, you can call the `GetRegistry` API after the asynchronous call. Deleting a registry will deactivate all online operations for the registry such as the `UpdateRegistry`, `CreateSchema`, `UpdateSchema`, and `RegisterSchemaVersion` APIs.
    flag:
        registry-id: This is a wrapper structure that may contain the registry name and Amazon Resource Name (ARN).
