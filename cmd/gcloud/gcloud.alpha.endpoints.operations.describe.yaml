name: describe
description: '*(ALPHA)*  Describes an operation resource for a given operation name.'
documentation:
    command: |-
        *(ALPHA)*  This command will return information about an operation given the name
        of that operation.

        Note that the `operations/` prefix of the operation name is optional
        and may be omitted.

        ## EXAMPLES
        To describe an operation resource named
        `operations/serviceConfigs.my-service.1`, run:

          $ gcloud alpha endpoints operations describe serviceConfigs.my-service.1
