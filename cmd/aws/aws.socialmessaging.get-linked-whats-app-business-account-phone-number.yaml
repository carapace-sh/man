name: get-linked-whats-app-business-account-phone-number
description: Use your WhatsApp phone number id to get the WABA account id and phone number details.
flags:
    --id=!: The unique identifier of the phone number.
documentation:
    command: Use your WhatsApp phone number id to get the WABA account id and phone number details.
    flag:
        id: The unique identifier of the phone number. Phone number identifiers are formatted as `phone-number-id-01234567890123456789012345678901`. Use [GetLinkedWhatsAppBusinessAccount](https://docs.aws.amazon.com/social-messaging/latest/APIReference/API_GetLinkedWhatsAppBusinessAccountPhoneNumber.html) to find a phone number's id.
