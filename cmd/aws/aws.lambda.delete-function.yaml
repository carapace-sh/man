name: delete-function
description: Deletes a Lambda function.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --function-name=!: The name or ARN of the Lambda function or version.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --qualifier=: Specify a version to delete.
documentation:
    command: |-
        Deletes a Lambda function. To delete a specific function version, use the `Qualifier` parameter. Otherwise, all versions and aliases are deleted. This doesn't require the user to have explicit permissions for [DeleteAlias]().

        A deleted Lambda function cannot be recovered. Ensure that you specify the correct function name and version before deleting.

        To delete Lambda event source mappings that invoke a function, use [DeleteEventSourceMapping](). For Amazon Web Services services and resources that invoke your function directly, delete the trigger in the service where you originally configured it.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        function-name: |-
            The name or ARN of the Lambda function or version.

            **Name formats**

            - **Function name** – `my-function` (name-only), `my-function:1` (with version).
            - **Function ARN** – `arn:aws:lambda:us-west-2:123456789012:function:my-function`.
            - **Partial ARN** – `123456789012:function:my-function`.

            You can append a version number or alias to any of the formats. The length constraint applies only to the full ARN. If you specify only the function name, it is limited to 64 characters in length.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        qualifier: Specify a version to delete. You can't delete a version that an alias references.
