name: untag-resource
description: Disassociates one or more specified tags from the specified AppStream 2.0 resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource.
    --tag-keys=!: The tag keys for the tags to disassociate.
documentation:
    command: |-
        Disassociates one or more specified tags from the specified AppStream 2.0 resource.

        To list the current tags for your resources, use [ListTagsForResource]().

        For more information about tags, see [Tagging Your Resources](https://docs.aws.amazon.com/appstream2/latest/developerguide/tagging-basic.html) in the *Amazon AppStream 2.0 Administration Guide*.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource.
        tag-keys: The tag keys for the tags to disassociate.
