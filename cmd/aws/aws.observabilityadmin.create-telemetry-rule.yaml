name: create-telemetry-rule
description: Creates a telemetry rule that defines how telemetry should be configured for Amazon Web Services resources in your account.
flags:
    --rule-name=!: A unique name for the telemetry rule being created.
    --rule=!: The configuration details for the telemetry rule, including the resource type, telemetry type, destination configuration, and selection criteria for which resources the rule applies to.
    --tags=: The key-value pairs to associate with the telemetry rule resource for categorization and management purposes.
documentation:
    command: Creates a telemetry rule that defines how telemetry should be configured for Amazon Web Services resources in your account. The rule specifies which resources should have telemetry enabled and how that telemetry data should be collected based on resource type, telemetry type, and selection criteria.
    flag:
        rule: The configuration details for the telemetry rule, including the resource type, telemetry type, destination configuration, and selection criteria for which resources the rule applies to.
        rule-name: A unique name for the telemetry rule being created.
        tags: The key-value pairs to associate with the telemetry rule resource for categorization and management purposes.
