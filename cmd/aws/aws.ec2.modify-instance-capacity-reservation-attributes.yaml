name: modify-instance-capacity-reservation-attributes
description: Modifies the Capacity Reservation settings for a stopped instance.
flags:
    --capacity-reservation-specification=!: Information about the Capacity Reservation targeting option.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --instance-id=!: The ID of the instance to be modified.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: Modifies the Capacity Reservation settings for a stopped instance. Use this action to configure an instance to target a specific Capacity Reservation, run in any `open` Capacity Reservation with matching attributes, run in On-Demand Instance capacity, or only run in a Capacity Reservation.
    flag:
        capacity-reservation-specification: Information about the Capacity Reservation targeting option.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        instance-id: The ID of the instance to be modified.
