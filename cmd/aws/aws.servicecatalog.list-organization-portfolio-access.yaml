name: list-organization-portfolio-access
description: Lists the organization nodes that have access to the specified portfolio.
flags:
    --accept-language=: The language code.
    --organization-node-type=!: The organization node type that will be returned in the output.
    --page-size=: The maximum number of items to return with this call.
    --page-token=: The page token for the next set of results.
    --portfolio-id=!: The portfolio identifier.
completion:
    flag:
        organization-node-type:
            - ORGANIZATION
            - ORGANIZATIONAL_UNIT
            - ACCOUNT
documentation:
    command: |-
        Lists the organization nodes that have access to the specified portfolio. This API can only be called by the management account in the organization or by a delegated admin.

        If a delegated admin is de-registered, they can no longer perform this operation.
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        organization-node-type: |-
            The organization node type that will be returned in the output.

            - `ORGANIZATION` - Organization that has access to the portfolio.
            - `ORGANIZATIONAL_UNIT` - Organizational unit that has access to the portfolio within your organization.
            - `ACCOUNT` - Account that has access to the portfolio within your organization.
        page-size: The maximum number of items to return with this call.
        page-token: The page token for the next set of results. To retrieve the first set of results, use null.
        portfolio-id: The portfolio identifier. For example, `port-2abcdext3y5fk`.
