flags:
    --location=: ID of the location of the Managed Service for Apache Kafka resource.
documentation:
    command: |
        *(ALPHA)*  Describe a Managed Service for Apache Kafka operation.
    flag:
        location: |-
            ID of the location of the Managed Service for Apache Kafka resource. See
            https://cloud.google.com/managed-service-for-apache-kafka/docs/locations for a list of supported
            locations.
