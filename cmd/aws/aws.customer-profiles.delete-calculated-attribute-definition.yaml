name: delete-calculated-attribute-definition
description: Deletes an existing calculated attribute definition.
flags:
    --calculated-attribute-name=!: The unique name of the calculated attribute.
    --domain-name=!: The unique name of the domain.
documentation:
    command: Deletes an existing calculated attribute definition. Note that deleting a default calculated attribute is possible, however once deleted, you will be unable to undo that action and will need to recreate it on your own using the CreateCalculatedAttributeDefinition API if you want it back.
    flag:
        calculated-attribute-name: The unique name of the calculated attribute.
        domain-name: The unique name of the domain.
