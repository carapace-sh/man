name: describe-association
description: Describes the association for the specified target or managed node.
flags:
    --association-id=: The association ID for which you want information.
    --association-version=: Specify the association version to retrieve.
    --instance-id=: The managed node ID.
    --name=: The name of the SSM document.
documentation:
    command: Describes the association for the specified target or managed node. If you created the association by using the `Targets` parameter, then you must retrieve the association by using the association ID.
    flag:
        association-id: The association ID for which you want information.
        association-version: Specify the association version to retrieve. To view the latest version, either specify `$LATEST` for this parameter, or omit this parameter. To view a list of all associations for a managed node, use [ListAssociations](). To get a list of versions for a specific association, use [ListAssociationVersions]().
        instance-id: The managed node ID.
        name: The name of the SSM document.
