name: get-query-state
description: Returns the state of a query previously submitted.
flags:
    --query-id=!: The ID of the plan query operation.
documentation:
    command: Returns the state of a query previously submitted. Clients are expected to poll `GetQueryState` to monitor the current state of the planning before retrieving the work units. A query state is only visible to the principal that made the initial call to `StartQueryPlanning`.
    flag:
        query-id: The ID of the plan query operation.
