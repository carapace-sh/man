name: remove-user-defined-field
description: Remove a user defined field from a Compute Engine security policy.
flags:
    --region=: Region of the security policy to update.
    --user-defined-field-name=!: The name of the user defined field to remove.
documentation:
    command: |-
        *gcloud compute security-policies remove-user-defined-field* is used to remove user defined fields from security policies.

        ## EXAMPLES

        To remove a user defined field run this:

          $ gcloud compute security-policies remove-user-defined-field SECURITY_POLICY --user-defined-field-name=my-field
    flag:
        region: Region of the security policy to update. Overrides the default *compute/region* property value for this command invocation.
        user-defined-field-name: The name of the user defined field to remove.
