name: create-edge-deployment-plan
description: Creates an edge deployment plan, consisting of multiple stages.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --device-fleet-name=!: The device fleet used for this edge deployment plan.
    --edge-deployment-plan-name=!: The name of the edge deployment plan.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --model-configs=!:
        description: List of models associated with the edge deployment plan.
        nargs: -1
    --stages=:
        description: List of stages of the edge deployment plan.
        nargs: -1
    --tags=:
        description: List of tags with which to tag the edge deployment plan.
        nargs: -1
documentation:
    command: Creates an edge deployment plan, consisting of multiple stages. Each stage may have a different deployment configuration and devices.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        device-fleet-name: The device fleet used for this edge deployment plan.
        edge-deployment-plan-name: The name of the edge deployment plan.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        model-configs: List of models associated with the edge deployment plan.
        stages: List of stages of the edge deployment plan. The number of stages is limited to 10 per deployment.
        tags: List of tags with which to tag the edge deployment plan.
