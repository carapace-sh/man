name: redeploy
description: '*(ALPHA)*  Redeploy the last release to a target.'
flags:
    --annotations=: Annotations to apply to the rollout.
    --delivery-pipeline=!: The name of the Cloud Deploy delivery pipeline
    --description=: Description of rollout created during a rollback.
    --labels=: Labels to apply to the rollout.
    --override-deploy-policies=: Deploy policies to override
    --region=: The Cloud region for the target.
    --rollout-id=: ID to assign to the generated rollout for promotion.
    --starting-phase-id=: If set, starts the created rollout at the specified phase.
documentation:
    command: |-
        *(ALPHA)*  Redeploy the last rollout that has a state of SUCCESSFUL or FAILED to a
        target.
        If rollout-id is not specified, a rollout ID will be generated.
    flag:
        annotations: |-
            Annotations to apply to the rollout. Annotations take the form of key/value string pairs.
            +
            Examples:
            +
            Add annotations:
            +
              $ {command} --annotations="from_target=test,status=stable"
        delivery-pipeline: The name of the Cloud Deploy delivery pipeline
        description: Description of rollout created during a rollback.
        labels: |-
            Labels to apply to the rollout. Labels take the form of key/value string pairs.
            +
            Examples:
            +
            Add labels:
            +
              $ {command} --labels="commit=abc123,author=foo"
        override-deploy-policies: Deploy policies to override
        region: |-
            The Cloud region for the target.  Alternatively, set the property [deploy/region].
            +
            To set the `region` attribute:
            * provide the argument `target` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `deploy/region`.
        rollout-id: ID to assign to the generated rollout for promotion.
        starting-phase-id: |-
            If set, starts the created rollout at the specified phase.
            +
            Start rollout at `stable` phase:
            +
              $ {command} --starting-phase-id=stable
