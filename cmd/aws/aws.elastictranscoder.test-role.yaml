name: test-role
description: The TestRole operation tests the IAM role used to create the pipeline.
flags:
    --input-bucket=!: The Amazon S3 bucket that contains media files to be transcoded.
    --output-bucket=!: The Amazon S3 bucket that Elastic Transcoder writes transcoded media files to.
    --role=!: The IAM Amazon Resource Name (ARN) for the role that you want Elastic Transcoder to test.
    --topics=!: The ARNs of one or more Amazon Simple Notification Service (Amazon SNS) topics that you want the action to send a test notification to.
documentation:
    command: |-
        The TestRole operation tests the IAM role used to create the pipeline.

        The `TestRole` action lets you determine whether the IAM role you are using has sufficient permissions to let Elastic Transcoder perform tasks associated with the transcoding process. The action attempts to assume the specified IAM role, checks read access to the input and output buckets, and tries to send a test notification to Amazon SNS topics that you specify.
    flag:
        input-bucket: The Amazon S3 bucket that contains media files to be transcoded. The action attempts to read from this bucket.
        output-bucket: The Amazon S3 bucket that Elastic Transcoder writes transcoded media files to. The action attempts to read from this bucket.
        role: The IAM Amazon Resource Name (ARN) for the role that you want Elastic Transcoder to test.
        topics: The ARNs of one or more Amazon Simple Notification Service (Amazon SNS) topics that you want the action to send a test notification to.
