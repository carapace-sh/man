name: get-data-lake-namespace
description: Enables you to programmatically view an Amazon Web Services Supply Chain data lake namespace.
flags:
    --instance-id=!: The Amazon Web Services Supply Chain instance identifier.
    --name=!: The name of the namespace.
documentation:
    command: Enables you to programmatically view an Amazon Web Services Supply Chain data lake namespace. Developers can view the data lake namespace information such as description for a given instance ID and namespace name.
    flag:
        instance-id: The Amazon Web Services Supply Chain instance identifier.
        name: |-
            The name of the namespace. Besides the namespaces user created, you can also specify the pre-defined namespaces:

            - **asc** - Pre-defined namespace containing Amazon Web Services Supply Chain supported datasets, see [https://docs.aws.amazon.com/aws-supply-chain/latest/userguide/data-model-asc.html](https://docs.aws.amazon.com/aws-supply-chain/latest/userguide/data-model-asc.html).
            - **default** - Pre-defined namespace containing datasets with custom user-defined schemas.
