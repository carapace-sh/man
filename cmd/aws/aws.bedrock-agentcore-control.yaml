            client-token: A unique, case-sensitive identifier to ensure that the API request completes no more than one time. If you don't specify this field, a value is randomly generated for you. If this token matches a previous request, the service ignores the request, but doesn't return an error. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html).
            description: The description of the evaluator that explains its purpose and evaluation criteria.
            evaluator-config: The configuration for the evaluator. Specify either LLM-as-a-Judge settings with instructions, rating scale, and model configuration, or code-based settings with a customer-managed Lambda function.
            evaluator-name: The name of the evaluator. Must be unique within your account.
            generate-cli-skeleton: |-
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            kms-key-arn: The Amazon Resource Name (ARN) of a customer managed KMS key to use for encrypting sensitive evaluator data, including instructions and rating scale. If you don't specify a KMS key, the evaluator data is encrypted with an Amazon Web Services owned key. Only symmetric encryption KMS keys are supported. For more information, see [Encryption at rest for AgentCore Evaluations](https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/evaluations-encryption.html).
            level: The evaluation level that determines the scope of evaluation. Valid values are `TOOL_CALL` for individual tool invocations, `TRACE` for single request-response interactions, or `SESSION` for entire conversation sessions.
            tags: A map of tag keys and values to assign to an AgentCore Evaluator. Tags enable you to categorize your resources in different ways, for example, by purpose, owner, or environment.
    - name: create-gateway
      description: Creates a gateway for Amazon Bedrock Agent.
      flags:
        --authorizer-configuration=: The authorizer configuration for the gateway.
        --authorizer-type=!: The type of authorizer to use for the gateway.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier to ensure that the API request completes no more than one time.
        --description=: The description of the gateway.
        --exception-level=: The level of detail in error messages returned when invoking the gateway.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --interceptor-configurations=:
            description: A list of configuration settings for a gateway interceptor.
            nargs: -1
        --kms-key-arn=: The Amazon Resource Name (ARN) of the KMS key used to encrypt data associated with the gateway.
        --name=!: The name of the gateway.
        --policy-engine-configuration=: The policy engine configuration for the gateway.
        --protocol-configuration=: The configuration settings for the protocol specified in the `protocolType` parameter.
        --protocol-type=: The protocol type for the gateway.
        --role-arn=!: The Amazon Resource Name (ARN) of the IAM role that provides permissions for the gateway to access Amazon Web Services services.
        --tags=: A map of key-value pairs to associate with the gateway as metadata tags.
      completion:
        flag:
            authorizer-type:
                - CUSTOM_JWT
                - AWS_IAM
                - NONE
                - AUTHENTICATE_ONLY
            exception-level:
                - DEBUG
            protocol-type:
                - MCP
      documentation:
        command: |-
            Creates a gateway for Amazon Bedrock Agent. A gateway serves as an integration point between your agent and external services.

            If you specify `CUSTOM_JWT` as the `authorizerType`, you must provide an `authorizerConfiguration`.
        flag:
            authorizer-configuration: The authorizer configuration for the gateway. Required if `authorizerType` is `CUSTOM_JWT`.
            authorizer-type: |-
                The type of authorizer to use for the gateway.

                - `CUSTOM_JWT` - Authorize with a bearer token.
                - `AWS_IAM` - Authorize with your Amazon Web Services IAM credentials.
                - `NONE` - No authorization
            cli-input-json: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            cli-input-yaml: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            client-token: A unique, case-sensitive identifier to ensure that the API request completes no more than one time. If you don't specify this field, a value is randomly generated for you. If this token matches a previous request, the service ignores the request, but doesn't return an error. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html).
            description: The description of the gateway.
            exception-level: |-
                The level of detail in error messages returned when invoking the gateway.

                - If the value is `DEBUG`, granular exception messages are returned to help a user debug the gateway.
                - If the value is omitted, a generic error message is returned to the end user.
            generate-cli-skeleton: |-
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            interceptor-configurations: A list of configuration settings for a gateway interceptor. Gateway interceptors allow custom code to be invoked during gateway invocations.
            kms-key-arn: The Amazon Resource Name (ARN) of the KMS key used to encrypt data associated with the gateway.
            name: The name of the gateway. The name must be unique within your account.
            policy-engine-configuration: The policy engine configuration for the gateway. A policy engine is a collection of policies that evaluates and authorizes agent tool calls. When associated with a gateway, the policy engine intercepts all agent requests and determines whether to allow or deny each action based on the defined policies.
            protocol-configuration: The configuration settings for the protocol specified in the `protocolType` parameter.
            protocol-type: The protocol type for the gateway.
            role-arn: The Amazon Resource Name (ARN) of the IAM role that provides permissions for the gateway to access Amazon Web Services services.
            tags: A map of key-value pairs to associate with the gateway as metadata tags.
