name: untag-contact
description: Removes the specified tags from the contact resource.
flags:
    --contact-id=!: The identifier of the contact in this instance of Amazon Connect.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --tag-keys=!: A list of tag keys.
documentation:
    command: Removes the specified tags from the contact resource. For more information about this API is used, see [Set up granular billing for a detailed view of your Amazon Connect usage](https://docs.aws.amazon.com/connect/latest/adminguide/granular-billing.html).
    flag:
        contact-id: The identifier of the contact in this instance of Amazon Connect.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        tag-keys: A list of tag keys. Existing tags on the contact whose keys are members of this list will be removed.
