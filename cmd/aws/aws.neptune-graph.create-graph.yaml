name: create-graph
description: Creates a new Neptune Analytics graph.
flags:
    --deletion-protection: Indicates whether or not to enable deletion protection on the graph.
    --graph-name=!: A name for the new Neptune Analytics graph to be created.
    --kms-key-identifier=: Specifies a KMS key to use to encrypt data in the new graph.
    --no-deletion-protection: Indicates whether or not to enable deletion protection on the graph.
    --no-public-connectivity: Specifies whether or not the graph can be reachable over the internet.
    --provisioned-memory=!: The provisioned memory-optimized Neptune Capacity Units (m-NCUs) to use for the graph.
    --public-connectivity: Specifies whether or not the graph can be reachable over the internet.
    --replica-count=: The number of replicas in other AZs.
    --tags=: Adds metadata tags to the new graph.
    --vector-search-configuration=: Specifies the number of dimensions for vector embeddings that will be loaded into the graph.
documentation:
    command: Creates a new Neptune Analytics graph.
    flag:
        deletion-protection: Indicates whether or not to enable deletion protection on the graph. The graph can’t be deleted when deletion protection is enabled. (`true` or `false`).
        graph-name: |-
            A name for the new Neptune Analytics graph to be created.

            The name must contain from 1 to 63 letters, numbers, or hyphens, and its first character must be a letter. It cannot end with a hyphen or contain two consecutive hyphens. Only lowercase letters are allowed.
        kms-key-identifier: Specifies a KMS key to use to encrypt data in the new graph.
        provisioned-memory: The provisioned memory-optimized Neptune Capacity Units (m-NCUs) to use for the graph. Min = 16
        public-connectivity: Specifies whether or not the graph can be reachable over the internet. All access to graphs is IAM authenticated. (`true` to enable, or `false` to disable.
        replica-count: |-
            The number of replicas in other AZs. Min =0, Max = 2, Default = 1.

            Additional charges equivalent to the m-NCUs selected for the graph apply for each replica.
        tags: Adds metadata tags to the new graph. These tags can also be used with cost allocation reporting, or used in a Condition statement in an IAM policy.
        vector-search-configuration: Specifies the number of dimensions for vector embeddings that will be loaded into the graph. The value is specified as `dimension=`value. Max = 65,535
