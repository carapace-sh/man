name: push-domain
description: Moves a domain from Amazon Web Services to another registrar.
flags:
    --domain-name=!: Name of the domain.
    --target=!: New IPS tag for the domain.
documentation:
    command: |-
        Moves a domain from Amazon Web Services to another registrar.

        Supported actions:

        - Changes the IPS tags of a .uk domain, and pushes it to transit. Transit means that the domain is ready to be transferred to another registrar.
    flag:
        domain-name: Name of the domain.
        target: New IPS tag for the domain.
