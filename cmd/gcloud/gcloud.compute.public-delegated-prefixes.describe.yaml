name: describe
description: Describes a Compute Engine public delegated prefix.
flags:
    --global: If set, the public delegated prefix is global.
    --no-global&: If set, the public delegated prefix is global.
    --region=: Region of the public delegated prefix to operate on.
documentation:
    command: |-
        ## EXAMPLES

        To describe a public delegated prefix:

          $ gcloud compute public-delegated-prefixes describe my-public-delegated-prefix --global
    flag:
        global: If set, the public delegated prefix is global.
        no-global: If set, the public delegated prefix is global.
        region: Region of the public delegated prefix to operate on. Overrides the default *compute/region* property value for this command invocation.
