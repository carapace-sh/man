name: list-resource-snapshot-jobs
description: Lists resource snapshot jobs owned by the customer.
flags:
    --catalog=!: Specifies the catalog related to the request.
    --engagement-identifier=: The identifier of the engagement to filter the response.
    --max-results=: The maximum number of results to return in a single call.
    --next-token=: The token for the next set of results.
    --sort=: Configures the sorting of the response.
    --status=: The status of the jobs to filter the response.
completion:
    flag:
        status:
            - Running
            - Stopped
documentation:
    command: Lists resource snapshot jobs owned by the customer. This operation supports various filtering scenarios, including listing all jobs owned by the caller, jobs for a specific engagement, jobs with a specific status, or any combination of these filters.
    flag:
        catalog: Specifies the catalog related to the request.
        engagement-identifier: The identifier of the engagement to filter the response.
        max-results: The maximum number of results to return in a single call. If omitted, defaults to 50.
        next-token: The token for the next set of results.
        sort: Configures the sorting of the response. If omitted, results are sorted by `CreatedDate` in descending order.
        status: The status of the jobs to filter the response.
