name: get-invocation-step
description: Retrieves the details of a specific invocation step within an invocation in a session.
flags:
    --invocation-identifier=!: The unique identifier for the invocation in UUID format.
    --invocation-step-id=!: The unique identifier (in UUID format) for the specific invocation step to retrieve.
    --session-identifier=!: The unique identifier for the invocation step's associated session.
documentation:
    command: Retrieves the details of a specific invocation step within an invocation in a session. For more information about sessions, see [Store and retrieve conversation history and context with Amazon Bedrock sessions](https://docs.aws.amazon.com/bedrock/latest/userguide/sessions.html).
    flag:
        invocation-identifier: The unique identifier for the invocation in UUID format.
        invocation-step-id: The unique identifier (in UUID format) for the specific invocation step to retrieve.
        session-identifier: The unique identifier for the invocation step's associated session. You can specify either the session's `sessionId` or its Amazon Resource Name (ARN).
