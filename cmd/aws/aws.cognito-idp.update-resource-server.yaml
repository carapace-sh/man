name: update-resource-server
description: Updates the name and scopes of a resource server.
flags:
    --identifier=!: A unique resource server identifier for the resource server.
    --name=!: The updated name of the resource server.
    --scopes=: An array of updated custom scope names and descriptions that you want to associate with your resource server.
    --user-pool-id=!: The ID of the user pool that contains the resource server that you want to update.
documentation:
    command: |-
        Updates the name and scopes of a resource server. All other fields are read-only. For more information about resource servers, see [Access control with resource servers](https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-define-resource-servers.html).

        If you don't provide a value for an attribute, it is set to the default value.

        Amazon Cognito evaluates Identity and Access Management (IAM) policies in requests for this API operation. For this operation, you must use IAM credentials to authorize requests, and you must grant yourself the corresponding IAM permission in a policy.

        **Learn more**

        - [Signing Amazon Web Services API Requests](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_aws-signing.html)
        - [Using the Amazon Cognito user pools API and user pool endpoints](https://docs.aws.amazon.com/cognito/latest/developerguide/user-pools-API-operations.html)
    flag:
        identifier: |-
            A unique resource server identifier for the resource server. The identifier can be an API friendly name like `solar-system-data`. You can also set an API URL like `https://solar-system-data-api.example.com` as your identifier.

            Amazon Cognito represents scopes in the access token in the format `$resource-server-identifier/$scope`. Longer scope-identifier strings increase the size of your access tokens.
        name: The updated name of the resource server.
        scopes: An array of updated custom scope names and descriptions that you want to associate with your resource server.
        user-pool-id: The ID of the user pool that contains the resource server that you want to update.
