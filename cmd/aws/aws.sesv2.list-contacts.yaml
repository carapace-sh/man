name: list-contacts
description: Lists the contacts present in a specific contact list.
flags:
    --contact-list-name=!: The name of the contact list.
    --filter=: A filter that can be applied to a list of contacts.
    --next-token=: A string token indicating that there might be additional contacts available to be listed.
    --page-size=: The number of contacts that may be returned at once, which is dependent on if there are more or less contacts than the value of the PageSize.
documentation:
    command: Lists the contacts present in a specific contact list.
    flag:
        contact-list-name: The name of the contact list.
        filter: A filter that can be applied to a list of contacts.
        next-token: A string token indicating that there might be additional contacts available to be listed. Use the token provided in the Response to use in the subsequent call to ListContacts with the same parameters to retrieve the next page of contacts.
        page-size: The number of contacts that may be returned at once, which is dependent on if there are more or less contacts than the value of the PageSize. Use this parameter to paginate results. If additional contacts exist beyond the specified limit, the `NextToken` element is sent in the response. Use the `NextToken` value in subsequent requests to retrieve additional contacts.
