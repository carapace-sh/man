name: batch-delete-read-set
description: Deletes one or more read sets.
flags:
    --ids=!: The read sets' IDs.
    --sequence-store-id=!: The read sets' sequence store ID.
documentation:
    command: Deletes one or more read sets. If the operation is successful, it returns a response with no body. If there is an error with deleting one of the read sets, the operation returns an error list. If the operation successfully deletes only a subset of files, it will return an error list for the remaining files that fail to be deleted. There is a limit of 100 read sets that can be deleted in each `BatchDeleteReadSet` API call.
    flag:
        ids: The read sets' IDs.
        sequence-store-id: The read sets' sequence store ID.
