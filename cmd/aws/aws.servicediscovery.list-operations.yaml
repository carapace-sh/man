name: list-operations
description: Lists operations that match the criteria that you specify.
flags:
    --filters=: A complex type that contains specifications for the operations that you want to list, for example, operations that you started between a specified start date and end date.
    --max-results=: The maximum number of items that you want Cloud Map to return in the response to a `ListOperations` request.
    --next-token=: For the first `ListOperations` request, omit this value.
documentation:
    command: Lists operations that match the criteria that you specify.
    flag:
        filters: |-
            A complex type that contains specifications for the operations that you want to list, for example, operations that you started between a specified start date and end date.

            If you specify more than one filter, an operation must match all filters to be returned by `ListOperations`.
        max-results: The maximum number of items that you want Cloud Map to return in the response to a `ListOperations` request. If you don't specify a value for `MaxResults`, Cloud Map returns up to 100 operations.
        next-token: |-
            For the first `ListOperations` request, omit this value.

            If the response contains `NextToken`, submit another `ListOperations` request to get the next group of results. Specify the value of `NextToken` from the previous response in the next request.

            Cloud Map gets `MaxResults` operations and then filters them based on the specified criteria. It's possible that no operations in the first `MaxResults` operations matched the specified criteria but that subsequent groups of `MaxResults` operations do contain operations that match the criteria.
