name: create-fhir-datastore
description: Create a FHIR-enabled data store.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: An optional user-provided token to ensure API idempotency.
    --datastore-name=: The data store name (user-generated).
    --datastore-type-version=!: The FHIR release version supported by the data store.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identity-provider-configuration=: The identity provider configuration to use for the data store.
    --preload-data-config=: An optional parameter to preload (import) open source Synthea FHIR data upon creation of the data store.
    --sse-configuration=: The server-side encryption key configuration for a customer-provided encryption key specified for creating a data store.
    --tags=: The resource tags applied to a data store when it is created.
completion:
    flag:
        datastore-type-version:
            - R4
documentation:
    command: Create a FHIR-enabled data store.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: An optional user-provided token to ensure API idempotency.
        datastore-name: The data store name (user-generated).
        datastore-type-version: The FHIR release version supported by the data store. Current support is for version `R4`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        identity-provider-configuration: The identity provider configuration to use for the data store.
        preload-data-config: An optional parameter to preload (import) open source Synthea FHIR data upon creation of the data store.
        sse-configuration: The server-side encryption key configuration for a customer-provided encryption key specified for creating a data store.
        tags: The resource tags applied to a data store when it is created.
