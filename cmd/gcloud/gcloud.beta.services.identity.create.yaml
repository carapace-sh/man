name: create
description: '*(BETA)*  Create a service identity for a consumer.'
flags:
    --folder=: Folder where the service identity will be used.
    --organization=: Organization where the service identity will be used.
    --service=!: The service to create a service identity for.
documentation:
    command: |-
        *(BETA)*  This command creates a service identity for a consumer. The supported
        consumers are projects, folders, and organizations.

        ## EXAMPLES

        To create a service identity for a project, run:

          $ gcloud beta services identity create --service=example.googleapis.com --project=helloworld

        Using a project number:

          $ gcloud beta services identity create --service=example.googleapis.com --project=1234567890

        To create a service identity for a folder, run:

          $ gcloud beta services identity create --service=example.googleapis.com --folder=1234567890

        To create a service identity for an organization, run:

          $ gcloud beta services identity create --service=example.googleapis.com --organization=1234567890
    flag:
        folder: Folder where the service identity will be used.
        organization: Organization where the service identity will be used.
        service: The service to create a service identity for.
