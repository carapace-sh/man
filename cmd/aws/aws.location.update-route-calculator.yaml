name: update-route-calculator
description: This operation is no longer current and may be deprecated in the future.
flags:
    --calculator-name=!: The name of the route calculator resource to update.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: Updates the description for the route calculator resource.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --pricing-plan=: No longer used.
completion:
    flag:
        pricing-plan:
            - RequestBasedUsage
            - MobileAssetTracking
            - MobileAssetManagement
documentation:
    command: |-
        This operation is no longer current and may be deprecated in the future. We recommend you upgrade to the Routes API V2 unless you require Grab data.

        - `UpdateRouteCalculator` is part of a previous Amazon Location Service Routes API (version 1) which has been superseded by a more intuitive, powerful, and complete API (version 2).
        - The Routes API version 2 has a simplified interface that can be used without creating or managing route calculator resources.
        - If you are using an Amazon Web Services SDK or the Amazon Web Services CLI, note that the Routes API version 2 is found under `geo-routes` or `geo_routes`, not under `location`.
        - Since Grab is not yet fully supported in Routes API version 2, we recommend you continue using API version 1 when using Grab.
        - Start your version 2 API journey with the Routes V2 [API Reference](/location/latest/APIReference/API_Operations_Amazon_Location_Service_Routes_V2.html) or the [Developer Guide](/location/latest/developerguide/routes.html).

        Updates the specified properties for a given route calculator resource.
    flag:
        calculator-name: The name of the route calculator resource to update.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: Updates the description for the route calculator resource.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        pricing-plan: No longer used. If included, the only allowed value is `RequestBasedUsage`.
