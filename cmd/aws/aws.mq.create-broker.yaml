name: create-broker
description: Creates a broker.
flags:
    --authentication-strategy=: Optional.
    --auto-minor-version-upgrade: Enables automatic upgrades to new patch versions for brokers as new versions are released and supported by Amazon MQ.
    --broker-name=!: Required.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration=: A list of information about the configuration.
    --creator-request-id=: The unique ID that the requester receives for the created broker.
    --data-replication-mode=: Defines whether this broker is a part of a data replication pair.
    --data-replication-primary-broker-arn=: The Amazon Resource Name (ARN) of the primary broker that is used to replicate data from in a data replication pair, and is applied to the replica broker.
    --deployment-mode=!: Required.
    --encryption-options=: Encryption options for the broker.
    --engine-type=!: Required.
    --engine-version=: The broker engine version.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --host-instance-type=!: Required.
    --ldap-server-metadata=: Optional.
    --logs=: Enables Amazon CloudWatch logging for brokers.
    --maintenance-window-start-time=: The parameters that determine the WeeklyStartTime.
    --no-auto-minor-version-upgrade: Enables automatic upgrades to new patch versions for brokers as new versions are released and supported by Amazon MQ.
    --no-publicly-accessible!: Enables connections from applications outside of the VPC that hosts the broker's subnets.
    --publicly-accessible!: Enables connections from applications outside of the VPC that hosts the broker's subnets.
    --security-groups=: The list of rules (1 minimum, 125 maximum) that authorize connections to brokers.
    --storage-type=: The broker's storage type.
    --subnet-ids=: The list of groups that define which subnets and IP ranges the broker can use from different Availability Zones.
    --tags=: Create tags when creating the broker.
    --users=: The list of broker users (persons or applications) who can access queues and topics.
completion:
    flag:
        authentication-strategy:
            - SIMPLE
            - LDAP
            - CONFIG_MANAGED
        data-replication-mode:
            - NONE
            - CRDR
        deployment-mode:
            - SINGLE_INSTANCE
            - ACTIVE_STANDBY_MULTI_AZ
            - CLUSTER_MULTI_AZ
        engine-type:
            - ACTIVEMQ
            - RABBITMQ
        storage-type:
            - EBS
            - EFS
documentation:
    command: "Creates a broker. Note: This API is asynchronous.\n\nTo create a broker, you must either use the AmazonMQFullAccess IAM policy or include the following EC2 permissions in your IAM policy.\n\n- ec2:CreateNetworkInterface\n  \n  This permission is required to allow Amazon MQ to create an elastic network interface (ENI) on behalf of your account.\n- ec2:CreateNetworkInterfacePermission\n  \n  This permission is required to attach the ENI to the broker instance.\n- ec2:DeleteNetworkInterface\n- ec2:DeleteNetworkInterfacePermission\n- ec2:DetachNetworkInterface\n- ec2:DescribeInternetGateways\n- ec2:DescribeNetworkInterfaces\n- ec2:DescribeNetworkInterfacePermissions\n- ec2:DescribeRouteTables\n- ec2:DescribeSecurityGroups\n- ec2:DescribeSubnets\n- ec2:DescribeVpcs\n\nFor more information, see [Create an IAM User and Get Your Amazon Web Services Credentials](https://docs.aws.amazon.com//amazon-mq/latest/developer-guide/amazon-mq-setting-up.html#create-iam-user) and [Never Modify or Delete the Amazon MQ Elastic Network Interface](https://docs.aws.amazon.com//amazon-mq/latest/developer-guide/connecting-to-amazon-mq.html#never-modify-delete-elastic-network-interface) in the *Amazon MQ Developer Guide*."
    flag:
        authentication-strategy: Optional. The authentication strategy used to secure the broker. The default is SIMPLE.
        auto-minor-version-upgrade: |-
            Enables automatic upgrades to new patch versions for brokers as new versions are released and supported by Amazon MQ. Automatic upgrades occur during the scheduled maintenance window or after a manual broker reboot. Set to true by default, if no value is specified.

            Must be set to true for ActiveMQ brokers version 5.18 and above and for RabbitMQ brokers version 3.13 and above.
        broker-name: |-
            Required. The broker's name. This value must be unique in your Amazon Web Services account, 1-50 characters long, must contain only letters, numbers, dashes, and underscores, and must not contain white spaces, brackets, wildcard characters, or special characters.

            Do not add personally identifiable information (PII) or other confidential or sensitive information in broker names. Broker names are accessible to other Amazon Web Services services, including CloudWatch Logs. Broker names are not intended to be used for private or sensitive data.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration: A list of information about the configuration.
        creator-request-id: |-
            The unique ID that the requester receives for the created broker. Amazon MQ passes your ID with the API action.

            We recommend using a Universally Unique Identifier (UUID) for the creatorRequestId. You may omit the creatorRequestId if your application doesn't require idempotency.
        data-replication-mode: Defines whether this broker is a part of a data replication pair.
        data-replication-primary-broker-arn: The Amazon Resource Name (ARN) of the primary broker that is used to replicate data from in a data replication pair, and is applied to the replica broker. Must be set when dataReplicationMode is set to CRDR.
        deployment-mode: Required. The broker's deployment mode.
        encryption-options: Encryption options for the broker.
        engine-type: Required. The type of broker engine. Currently, Amazon MQ supports ACTIVEMQ and RABBITMQ.
        engine-version: The broker engine version. Defaults to the latest available version for the specified broker engine type. For more information, see the [ActiveMQ version management](https://docs.aws.amazon.com//amazon-mq/latest/developer-guide/activemq-version-management.html) and the [RabbitMQ version management](https://docs.aws.amazon.com//amazon-mq/latest/developer-guide/rabbitmq-version-management.html) sections in the Amazon MQ Developer Guide.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        host-instance-type: Required. The broker's instance type.
        ldap-server-metadata: Optional. The metadata of the LDAP server used to authenticate and authorize connections to the broker. Does not apply to RabbitMQ brokers.
        logs: Enables Amazon CloudWatch logging for brokers.
        maintenance-window-start-time: The parameters that determine the WeeklyStartTime.
        publicly-accessible: Enables connections from applications outside of the VPC that hosts the broker's subnets. Set to false by default, if no value is provided.
        security-groups: The list of rules (1 minimum, 125 maximum) that authorize connections to brokers.
        storage-type: The broker's storage type.
        subnet-ids: |-
            The list of groups that define which subnets and IP ranges the broker can use from different Availability Zones. If you specify more than one subnet, the subnets must be in different Availability Zones. Amazon MQ will not be able to create VPC endpoints for your broker with multiple subnets in the same Availability Zone. A SINGLE\_INSTANCE deployment requires one subnet (for example, the default subnet). An ACTIVE\_STANDBY\_MULTI\_AZ Amazon MQ for ActiveMQ deployment requires two subnets. A CLUSTER\_MULTI\_AZ Amazon MQ for RabbitMQ deployment has no subnet requirements when deployed with public accessibility. Deployment without public accessibility requires at least one subnet.

            If you specify subnets in a [shared VPC](https://docs.aws.amazon.com/vpc/latest/userguide/vpc-sharing.html) for a RabbitMQ broker, the associated VPC to which the specified subnets belong must be owned by your Amazon Web Services account. Amazon MQ will not be able to create VPC endpoints in VPCs that are not owned by your Amazon Web Services account.
        tags: Create tags when creating the broker.
        users: The list of broker users (persons or applications) who can access queues and topics. For Amazon MQ for RabbitMQ brokers, an administrative user is required if using simple authentication and authorization. For brokers using OAuth2, this user is optional. When provided, one and only one administrative user is accepted and created when a broker is first provisioned. All subsequent broker users are created by making RabbitMQ API calls directly to brokers or via the RabbitMQ web console.
