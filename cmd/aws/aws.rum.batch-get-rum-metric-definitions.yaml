name: batch-get-rum-metric-definitions
description: Retrieves the list of metrics and dimensions that a RUM app monitor is sending to a single destination.
flags:
    --app-monitor-name=!: The name of the CloudWatch RUM app monitor that is sending the metrics.
    --destination-arn=: This parameter is required if `Destination` is `Evidently`.
    --destination=!: The type of destination that you want to view metrics for.
    --max-results=: The maximum number of results to return in one operation.
    --next-token=: Use the token returned by the previous operation to request the next page of results.
completion:
    flag:
        destination:
            - CloudWatch
            - Evidently
documentation:
    command: Retrieves the list of metrics and dimensions that a RUM app monitor is sending to a single destination.
    flag:
        app-monitor-name: The name of the CloudWatch RUM app monitor that is sending the metrics.
        destination: The type of destination that you want to view metrics for. Valid values are `CloudWatch` and `Evidently`.
        destination-arn: |-
            This parameter is required if `Destination` is `Evidently`. If `Destination` is `CloudWatch`, do not use this parameter.

            This parameter specifies the ARN of the Evidently experiment that corresponds to the destination.
        max-results: |-
            The maximum number of results to return in one operation. The default is 50. The maximum that you can specify is 100.

            To retrieve the remaining results, make another call with the returned `NextToken` value.
        next-token: Use the token returned by the previous operation to request the next page of results.
