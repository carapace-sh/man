name: create-cli-token
description: Creates a CLI token for the Airflow CLI.
flags:
    --name=!: The name of the Amazon MWAA environment.
documentation:
    command: Creates a CLI token for the Airflow CLI. To learn more, see [Creating an Apache Airflow CLI token](https://docs.aws.amazon.com/mwaa/latest/userguide/call-mwaa-apis-cli.html).
    flag:
        name: The name of the Amazon MWAA environment. For example, `MyMWAAEnvironment`.
