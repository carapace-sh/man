name: list-hosted-configuration-versions
description: Lists configurations stored in the AppConfig hosted configuration store by version.
flags:
    --application-id=!: The application ID.
    --configuration-profile-id=!: The configuration profile ID.
    --max-results=: The maximum number of items to return for this call.
    --next-token=: A token to start the list.
    --version-label=: An optional filter that can be used to specify the version label of an AppConfig hosted configuration version.
documentation:
    command: Lists configurations stored in the AppConfig hosted configuration store by version.
    flag:
        application-id: The application ID.
        configuration-profile-id: The configuration profile ID.
        max-results: The maximum number of items to return for this call. If `MaxResults` is not provided in the call, AppConfig returns the maximum of 50. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: A token to start the list. Use this token to get the next set of results.
        version-label: An optional filter that can be used to specify the version label of an AppConfig hosted configuration version. This parameter supports filtering by prefix using a wildcard, for example "v2\*". If you don't specify an asterisk at the end of the value, only an exact match is returned.
