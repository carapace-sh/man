name: delete-glossary-term
description: Deletes a business glossary term in Amazon DataZone.
flags:
    --domain-identifier=!: The ID of the Amazon DataZone domain in which the business glossary term is deleted.
    --identifier=!: The ID of the business glossary term that is deleted.
documentation:
    command: |-
        Deletes a business glossary term in Amazon DataZone.

        Prerequisites:

        - Glossary term must exist and be active.
        - The term must not be linked to other assets or child terms.
        - Caller must have delete permissions in the domain/glossary.
        - Ensure all associations (such as to assets or parent terms) are removed before deletion.
    flag:
        domain-identifier: The ID of the Amazon DataZone domain in which the business glossary term is deleted.
        identifier: The ID of the business glossary term that is deleted.
