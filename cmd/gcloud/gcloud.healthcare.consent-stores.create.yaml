name: create
description: Create a Cloud Healthcare API consent store.
flags:
    --dataset=: Cloud Healthcare dataset.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: Google Cloud location.
documentation:
    command: |
        Create a Cloud Healthcare API consent store.
    flag:
        dataset: |-
            Cloud Healthcare dataset.
            +
            To set the `dataset` attribute:
            * provide the argument `consent_store` on the command line with a fully specified name;
            * provide the argument `--dataset` on the command line.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `consent_store` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `healthcare/location`.
