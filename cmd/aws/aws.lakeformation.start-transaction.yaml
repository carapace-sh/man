name: start-transaction
description: Starts a new transaction and returns its transaction ID.
flags:
    --transaction-type=: Indicates whether this transaction should be read only or read and write.
completion:
    flag:
        transaction-type:
            - READ_AND_WRITE
            - READ_ONLY
documentation:
    command: Starts a new transaction and returns its transaction ID. Transaction IDs are opaque objects that you can use to identify a transaction.
    flag:
        transaction-type: Indicates whether this transaction should be read only or read and write. Writes made using a read-only transaction ID will be rejected. Read-only transactions do not need to be committed.
