name: update-build
description: |-
    **This API works with the following fleet types:** EC2

    Updates metadata in a build resource, including the build name and version.
flags:
    --build-id=!: A unique identifier for the build to update.
    --name=: A descriptive label that is associated with a build.
    --version=: Version information that is associated with a build or script.
documentation:
    command: |-
        **This API works with the following fleet types:** EC2

        Updates metadata in a build resource, including the build name and version. To update the metadata, specify the build ID to update and provide the new values. If successful, a build object containing the updated metadata is returned.

        **Learn more**

        [Upload a Custom Server Build](https://docs.aws.amazon.com/gamelift/latest/developerguide/gamelift-build-intro.html)

        [All APIs by task](https://docs.aws.amazon.com/gamelift/latest/developerguide/reference-awssdk.html#reference-awssdk-resources-fleets)
    flag:
        build-id: A unique identifier for the build to update. You can use either the build ID or ARN value.
        name: A descriptive label that is associated with a build. Build names do not need to be unique.
        version: Version information that is associated with a build or script. Version strings do not need to be unique.
