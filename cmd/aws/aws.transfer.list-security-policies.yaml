name: list-security-policies
description: Lists the security policies that are attached to your servers and SFTP connectors.
flags:
    --max-results=: Specifies the number of security policies to return as a response to the `ListSecurityPolicies` query.
    --next-token=: When additional results are obtained from the `ListSecurityPolicies` command, a `NextToken` parameter is returned in the output.
documentation:
    command: Lists the security policies that are attached to your servers and SFTP connectors. For more information about security policies, see [Working with security policies for servers](https://docs.aws.amazon.com/transfer/latest/userguide/security-policies.html) or [Working with security policies for SFTP connectors](https://docs.aws.amazon.com/transfer/latest/userguide/security-policies-connectors.html).
    flag:
        max-results: Specifies the number of security policies to return as a response to the `ListSecurityPolicies` query.
        next-token: When additional results are obtained from the `ListSecurityPolicies` command, a `NextToken` parameter is returned in the output. You can then pass the `NextToken` parameter in a subsequent command to continue listing additional security policies.
