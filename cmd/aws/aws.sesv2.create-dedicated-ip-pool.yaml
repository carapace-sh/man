name: create-dedicated-ip-pool
description: Create a new pool of dedicated IP addresses.
flags:
    --pool-name=!: The name of the dedicated IP pool.
    --scaling-mode=: The type of scaling mode.
    --tags=: An object that defines the tags (keys and values) that you want to associate with the pool.
completion:
    flag:
        scaling-mode:
            - STANDARD
            - MANAGED
documentation:
    command: Create a new pool of dedicated IP addresses. A pool can include one or more dedicated IP addresses that are associated with your Amazon Web Services account. You can associate a pool with a configuration set. When you send an email that uses that configuration set, the message is sent from one of the addresses in the associated pool.
    flag:
        pool-name: The name of the dedicated IP pool.
        scaling-mode: The type of scaling mode.
        tags: An object that defines the tags (keys and values) that you want to associate with the pool.
