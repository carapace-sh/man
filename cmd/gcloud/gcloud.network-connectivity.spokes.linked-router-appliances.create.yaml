name: create
description: Create a new Router appliance spoke.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: Description of the spoke to create.
    --exclude-export-ranges=&: Dynamic routes overlapped/encompassed by exclude export ranges are excluded during export to hub.
    --exclude-import-ranges=&: Hub routes overlapped/encompassed by exclude import ranges are excluded during import from hub.
    --group=: The group that the spoke will be added to.
    --hub=!: Hub that the spoke will attach to.
    --include-export-ranges=&: Dynamic routes fully encompassed by include export ranges are included during export to hub.
    --include-import-ranges=: IP address range(s) allowed to be imported from hub subnets.
    --labels=: List of label KEY=VALUE pairs to add.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-site-to-site-data-transfer&: Whether to enable site-to-site data transfer for this spoke.
    --region=: The location Id.
    --router-appliance=!: Router appliance instance(s) that the spoke provides connectivity to.
    --site-to-site-data-transfer: Whether to enable site-to-site data transfer for this spoke.
documentation:
    command: Create a new [Router appliance spoke](https://cloud.google.com/network-connectivity/docs/network-connectivity-center/how-to/working-with-hubs-spokes#create-ra-spoke).
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: Description of the spoke to create.
        exclude-export-ranges: |
            Dynamic routes overlapped/encompassed by exclude export ranges are excluded during export to hub.
        exclude-import-ranges: |
            Hub routes overlapped/encompassed by exclude import ranges are excluded during import from hub.
        group: |-
            The group that the spoke will be added to. The group must already exist. If unset, the spoke
            will be added to the ``default`` group.
        hub: Hub that the spoke will attach to. The hub must already exist.
        include-export-ranges: |
            Dynamic routes fully encompassed by include export ranges are included during export to hub.
            If it's empty, the spoke exports all dynamic routes to the hub.
        include-import-ranges: |-
            IP address range(s) allowed to be imported from hub subnets. Only ``ALL_IPV4_RANGES`` can be
            added to the list. If it's empty, the spoke does not import any subnets from the hub.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-site-to-site-data-transfer: |
            Whether to enable site-to-site data transfer for this spoke. Data transfer is available only
            in [supported locations](https://cloud.google.com/network-connectivity/docs/network-connectivity-center/concepts/locations).
        region: |-
            The location Id.
            +

            To set the `region` attribute:
            * provide the argument `spoke` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
        router-appliance: |-
            Router appliance instance(s) that the spoke provides connectivity to. The resources must already exist.
            +
            For example, use `--router-appliance=instance=ins_uri_1,ip=10.10.0.1` to add a single router appliance instance,
            or `--router-appliance=instance=ins_uri_1,ip=10.10.0.1 --router-appliance=instance=ins_uri_2,ip=10.10.0.2 ...`
            to add multiple instances.
        site-to-site-data-transfer: |-
            Whether to enable site-to-site data transfer for this spoke. Data transfer is available only
            in [supported locations](https://cloud.google.com/network-connectivity/docs/network-connectivity-center/concepts/locations).
