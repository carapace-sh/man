name: abort
description: Abort transaction.
flags:
    --transaction-file=: Path of the file which contains the transaction.
    --zone=!: Name of the managed zone whose record sets you want to manage.
documentation:
    command: |-
        This command aborts the transaction and deletes the transaction file.

        ## EXAMPLES

        To abort the transaction, run:

          $ gcloud dns record-sets transaction abort --zone=MANAGED_ZONE
    flag:
        transaction-file: Path of the file which contains the transaction.
        zone: Name of the managed zone whose record sets you want to manage.
