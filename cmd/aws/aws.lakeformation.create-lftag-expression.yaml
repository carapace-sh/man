name: create-lftag-expression
description: Creates a new LF-Tag expression with the provided name, description, catalog ID, and expression body.
flags:
    --catalog-id=: The identifier for the Data Catalog.
    --description=: A description with information about the LF-Tag expression.
    --expression=!: A list of LF-Tag conditions (key-value pairs).
    --name=!: A name for the expression.
documentation:
    command: |-
        Creates a new LF-Tag expression with the provided name, description, catalog ID, and expression body. This call fails if a LF-Tag expression with the same name already exists in the caller’s account or if the underlying LF-Tags don't exist. To call this API operation, caller needs the following Lake Formation permissions:

        `CREATE_LF_TAG_EXPRESSION` on the root catalog resource.

        `GRANT_WITH_LF_TAG_EXPRESSION` on all underlying LF-Tag key:value pairs included in the expression.
    flag:
        catalog-id: The identifier for the Data Catalog. By default, the account ID. The Data Catalog is the persistent metadata store. It contains database definitions, table definitions, and other control information to manage your Lake Formation environment.
        description: A description with information about the LF-Tag expression.
        expression: A list of LF-Tag conditions (key-value pairs).
        name: A name for the expression.
