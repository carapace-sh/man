name: start-assessment-run
description: Starts the assessment run specified by the ARN of the assessment template.
flags:
    --assessment-run-name=: You can specify the name for the assessment run.
    --assessment-template-arn=!: The ARN of the assessment template of the assessment run that you want to start.
documentation:
    command: Starts the assessment run specified by the ARN of the assessment template. For this API to function properly, you must not exceed the limit of running up to 500 concurrent agents per AWS account.
    flag:
        assessment-run-name: You can specify the name for the assessment run. The name must be unique for the assessment template whose ARN is used to start the assessment run.
        assessment-template-arn: The ARN of the assessment template of the assessment run that you want to start.
