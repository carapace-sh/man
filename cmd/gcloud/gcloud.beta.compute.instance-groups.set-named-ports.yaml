name: set-named-ports
description: '*(BETA)*  Sets the list of named ports for an instance group.'
flags:
    --named-ports=!: The comma-separated list of key:value pairs representing
    --region=: Region of the instance group to operate on.
    --zone=: Zone of the instance group to operate on.
documentation:
    command: |
        *(BETA)*  Named ports are key:value pairs metadata representing
        the service name and the port that it's running on. Named ports
        can be assigned to an instance group, which
        indicates that the service is available on all instances in the
        group. This information is used by Application Load Balancers
        and proxy Network Load Balancers.

        *gcloud beta compute instance-groups set-named-ports* sets the list of named ports for all instances
        in an instance group.

        Note: Running this command will clear all existing named ports.
    flag:
        named-ports: |-
            The comma-separated list of key:value pairs representing
            the service name and the port that it is running on.
            +
            To clear the list of named ports pass empty list as flag value.
            For example:
            +
              $ {command} example-instance-group --named-ports ""
        region: |-
            Region of the instance group to operate on. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            Overrides the default *compute/region* property value for this command invocation.
        zone: |-
            Zone of the instance group to operate on. If not specified, you might be prompted to select a zone (interactive mode
            only).
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            Overrides the default *compute/zone* property value for this command invocation.
