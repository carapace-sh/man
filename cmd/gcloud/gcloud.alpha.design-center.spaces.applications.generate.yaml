name: generate
description: '*(ALPHA)*  Generate IaC for an application.'
flags:
    --artifact-location-gcs-uri=: The Cloud Storage URI for storing the generated IaC.
    --connection=: The connection id of the gitRepositoryLink resource.
    --developer-connect-export-config-branch=: The branch in repo to which the content such as Infrastructure as Code
    --developer-connect-export-config-dir=!: Directory, relative to the source repo, where content such as
    --developer-connect-export-config-repo-uri=!: ID of the gitRepositoryLink or fully qualified identifier for the gitRepositoryLink.
    --gcs-uri=: The Cloud Storage URI to write the generated IaC to.
    --iac-format=: The IaC format to generate.
    --location=: For resources [application, developer-connect-export-config-repo-uri], provides fallback value for resource location attribute.
    --space=: The space id of the application resource.
completion:
    flag:
        iac-format:
            - helm
            - terraform
documentation:
    command: '*(ALPHA)*  Generates Terraform files for an application in a space.'
    flag:
        artifact-location-gcs-uri: The Cloud Storage URI for storing the generated IaC.
        connection: |-
            The connection id of the gitRepositoryLink resource.
            +
            To set the `connection` attribute:
            * provide the argument `--developer-connect-export-config-repo-uri` on the command line with a fully specified name;
            * provide the argument `--connection` on the command line.
        developer-connect-export-config-branch: |-
            The branch in repo to which the content such as Infrastructure as Code
            (IaC) should be written to. If empty, ADC will create a branch and push the
            changes.
        developer-connect-export-config-dir: |-
            Directory, relative to the source repo, where content such as
            Infrastructure as Code (IaC) will be stored.
            This must be a relative path.To specify the root directory, use '/'.
            If the path or any subdirectories do not exist, they will be created.
        developer-connect-export-config-repo-uri: |-
            ID of the gitRepositoryLink or fully qualified identifier for the gitRepositoryLink.
            +
            To set the `git-repository-link` attribute:
            * provide the argument `--developer-connect-export-config-repo-uri` on the command line.
        gcs-uri: |-
            The Cloud Storage URI to write the generated IaC to.
            +
            DEPRECATED: Use the 'artifact_location' field instead.
        iac-format: |-
            The IaC format to generate. _IAC_FORMAT_ must be one of:
            +
            *helm*::: IaC format is HELM.
            *terraform*::: IaC format is Terraform.
            :::
            +
        location: For resources [application, developer-connect-export-config-repo-uri], provides fallback value for resource location attribute. When the resource's full URI path is not provided, location will fallback to this flag value.
        space: |-
            The space id of the application resource.
            +
            To set the `space` attribute:
            * provide the argument `application` on the command line with a fully specified name;
            * provide the argument `--space` on the command line.
