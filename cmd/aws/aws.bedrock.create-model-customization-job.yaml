name: create-model-customization-job
description: Creates a fine-tuning job to customize a base model.
flags:
    --base-model-identifier=!: Name of the base model.
    --client-request-token=: A unique, case-sensitive identifier to ensure that the API request completes no more than one time.
    --custom-model-kms-key-id=: The custom model is encrypted at rest using this key.
    --custom-model-name=!: A name for the resulting custom model.
    --custom-model-tags=: Tags to attach to the resulting custom model.
    --customization-config=: The customization configuration for the model customization job.
    --customization-type=: The customization type.
    --hyper-parameters=: Parameters related to tuning the model.
    --job-name=!: A name for the fine-tuning job.
    --job-tags=: Tags to attach to the job.
    --output-data-config=!: S3 location for the output data.
    --role-arn=!: The Amazon Resource Name (ARN) of an IAM service role that Amazon Bedrock can assume to perform tasks on your behalf.
    --training-data-config=!: Information about the training dataset.
    --validation-data-config=: Information about the validation dataset.
    --vpc-config=: The configuration of the Virtual Private Cloud (VPC) that contains the resources that you're using for this job.
completion:
    flag:
        customization-type:
            - FINE_TUNING
            - CONTINUED_PRE_TRAINING
            - DISTILLATION
            - IMPORTED
documentation:
    command: |-
        Creates a fine-tuning job to customize a base model.

        You specify the base foundation model and the location of the training data. After the model-customization job completes successfully, your custom model resource will be ready to use. Amazon Bedrock returns validation loss metrics and output generations after the job completes.

        For information on the format of training and validation data, see [Prepare the datasets](https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-prepare.html).

        Model-customization jobs are asynchronous and the completion time depends on the base model and the training/validation data size. To monitor a job, use the `GetModelCustomizationJob` operation to retrieve the job status.

        For more information, see [Custom models](https://docs.aws.amazon.com/bedrock/latest/userguide/custom-models.html) in the [Amazon Bedrock User Guide](https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-service.html).
    flag:
        base-model-identifier: Name of the base model.
        client-request-token: A unique, case-sensitive identifier to ensure that the API request completes no more than one time. If this token matches a previous request, Amazon Bedrock ignores the request, but does not return an error. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html).
        custom-model-kms-key-id: The custom model is encrypted at rest using this key.
        custom-model-name: A name for the resulting custom model.
        custom-model-tags: Tags to attach to the resulting custom model.
        customization-config: The customization configuration for the model customization job.
        customization-type: The customization type.
        hyper-parameters: Parameters related to tuning the model. For details on the format for different models, see [Custom model hyperparameters](https://docs.aws.amazon.com/bedrock/latest/userguide/custom-models-hp.html).
        job-name: A name for the fine-tuning job.
        job-tags: Tags to attach to the job.
        output-data-config: S3 location for the output data.
        role-arn: The Amazon Resource Name (ARN) of an IAM service role that Amazon Bedrock can assume to perform tasks on your behalf. For example, during model training, Amazon Bedrock needs your permission to read input data from an S3 bucket, write model artifacts to an S3 bucket. To pass this role to Amazon Bedrock, the caller of this API must have the `iam:PassRole` permission.
        training-data-config: Information about the training dataset.
        validation-data-config: Information about the validation dataset.
        vpc-config: The configuration of the Virtual Private Cloud (VPC) that contains the resources that you're using for this job. For more information, see [Protect your model customization jobs using a VPC](https://docs.aws.amazon.com/bedrock/latest/userguide/vpc-model-customization.html).
