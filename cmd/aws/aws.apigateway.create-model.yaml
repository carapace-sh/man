name: create-model
description: Adds a new Model resource to an existing RestApi resource.
flags:
    --content-type=!: The content-type for the model.
    --description=: The description of the model.
    --name=!: The name of the model.
    --rest-api-id=!: The RestApi identifier under which the Model will be created.
    --schema=: The schema for the model.
documentation:
    command: Adds a new Model resource to an existing RestApi resource.
    flag:
        content-type: The content-type for the model.
        description: The description of the model.
        name: The name of the model. Must be alphanumeric.
        rest-api-id: The RestApi identifier under which the Model will be created.
        schema: The schema for the model. For `application/json` models, this should be JSON schema draft 4 model. The maximum size of the model is 400 KB.
