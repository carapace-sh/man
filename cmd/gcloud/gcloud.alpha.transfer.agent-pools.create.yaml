name: create
description: '*(ALPHA)*  Create a Transfer Service agent pool.'
flags:
    --bandwidth-limit=: Set how much of your bandwidth to make available to this pool's agents.
    --display-name=: A modifiable name to help you identify this pool.
    --no-async: Block other tasks in your terminal until the pool has been created.
documentation:
    command: |
        *(ALPHA)*  Create an agent pool -- a group of agents used to connect to a source or
        destination filesystem.
    flag:
        bandwidth-limit: Set how much of your bandwidth to make available to this pool's agents. A bandwidth limit applies to all agents in a pool and can help prevent the pool's transfer workload from disrupting other operations that share your bandwidth. For example, enter '50' to set a bandwidth limit of 50 MB/s. By leaving this flag unspecified, this flag unspecified, this pool's agents will use all bandwidth available to them.
        display-name: A modifiable name to help you identify this pool. You can include details that might not fit in the pool's unique full resource name.
        no-async: Block other tasks in your terminal until the pool has been created. If not included, pool creation will run asynchronously.
