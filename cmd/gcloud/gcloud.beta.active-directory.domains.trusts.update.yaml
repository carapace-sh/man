name: update
description: '*(BETA)*  Update target DNS IP addresses for a Managed Microsoft AD trust.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --target-dns-ip-addresses=!: DNS server IP addresses that can resolve the target domain.
    --target-domain-name=!: Target domain name for the Managed Microsoft AD trust you want to update.
documentation:
    command: |
        *(BETA)*  Update target DNS IP addresses for a Managed Microsoft AD trust between the
        managed domain and the target domain.

         This command can fail for the following reasons:
           * The domain specified does not exist.
           * The active account does not have permission to access the given
             domain.
           * The AD trust specified does not exist.
           * The active account does not have permission to access the given
             AD trust.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        target-dns-ip-addresses: |-
            DNS server IP addresses that can resolve the target domain.
            +
            Only IPv4 is supported.
        target-domain-name: Target domain name for the Managed Microsoft AD trust you want to update.
