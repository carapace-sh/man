name: describe-opted-out-numbers
description: Describes the specified opted out destination numbers or all opted out destination numbers in an opt-out list.
flags:
    --filters=: An array of OptedOutFilter objects to filter the results on.
    --max-results=: The maximum number of results to return per each request.
    --next-token=: The token to be used for the next set of paginated results.
    --opt-out-list-name=!: The OptOutListName or OptOutListArn of the OptOutList.
    --opted-out-numbers=: An array of phone numbers to search for in the OptOutList.
documentation:
    command: |-
        Describes the specified opted out destination numbers or all opted out destination numbers in an opt-out list.

        If you specify opted out numbers, the output includes information for only the specified opted out numbers. If you specify filters, the output includes information for only those opted out numbers that meet the filter criteria. If you don't specify opted out numbers or filters, the output includes information for all opted out destination numbers in your opt-out list.

        If you specify an opted out number that isn't valid, an exception is returned.
    flag:
        filters: An array of OptedOutFilter objects to filter the results on.
        max-results: The maximum number of results to return per each request.
        next-token: The token to be used for the next set of paginated results. You don't need to supply a value for this field in the initial request.
        opt-out-list-name: |-
            The OptOutListName or OptOutListArn of the OptOutList. You can use [DescribeOptOutLists]() to find the values for OptOutListName and OptOutListArn.

            If you are using a shared End User MessagingSMS resource then you must use the full Amazon Resource Name(ARN).
        opted-out-numbers: |-
            An array of phone numbers to search for in the OptOutList.

            If you specify an opted out number that isn't valid, an exception is returned.
