name: list-backup-plan-versions
description: Returns version metadata of your backup plans, including Amazon Resource Names (ARNs), backup plan IDs, creation and deletion dates, plan names, and version IDs.
flags:
    --backup-plan-id=!: Uniquely identifies a backup plan.
    --max-results=: The maximum number of items to be returned.
    --next-token=: The next item following a partial list of returned items.
documentation:
    command: Returns version metadata of your backup plans, including Amazon Resource Names (ARNs), backup plan IDs, creation and deletion dates, plan names, and version IDs.
    flag:
        backup-plan-id: Uniquely identifies a backup plan.
        max-results: The maximum number of items to be returned.
        next-token: The next item following a partial list of returned items. For example, if a request is made to return `MaxResults` number of items, `NextToken` allows you to return more items in your list starting at the location pointed to by the next token.
