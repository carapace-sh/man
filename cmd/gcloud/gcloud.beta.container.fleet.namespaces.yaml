name: namespaces
description: '*(BETA)*  *(REMOVED)*  Fleet namespaces are the fleet equivalent of k8s cluster namespaces.'
hidden: true
documentation:
    command: |-
        *(BETA)*  *(REMOVED)*  Fleet namespaces are the fleet equivalent of k8s cluster namespaces.

        This command has been removed as of version 447.0.0. Use `gcloud fleet scopes namespaces` instead.

        This command group allows for manipulation of fleet namespaces.

        ## EXAMPLES

        Manage fleet namespaces:

          $ gcloud beta container fleet namespaces --help

        Manage RBAC RoleBindings in a fleet namespace:

          $ gcloud beta container fleet namespaces rbacrolebindings --help
