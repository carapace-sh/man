name: describe
description: '*(ALPHA)*  Get details about a single QuotaPreference.'
flags:
    --folder=: Folder of the quota preference to describe.
    --organization=: Organization of the quota preference to describe.
documentation:
    command: |-
        ## EXAMPLES

        To get the details about quota preference `my-preference` for
        `projects/12321`, run:

          $ gcloud alpha quotas preferences describe my-preference --project=12321
          $ gcloud alpha quotas preferences describe my-preference --project=my-project-id


        To get the details about quota preference `my-preference` for `folders/123`,
        run:

          $ gcloud alpha quotas preferences describe my-preference --folder=123
    flag:
        folder: Folder of the quota preference to describe.
        organization: Organization of the quota preference to describe.
