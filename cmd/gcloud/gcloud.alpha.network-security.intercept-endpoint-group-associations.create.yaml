name: create
description: '*(ALPHA)*  Create an Intercept Endpoint Group Association.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --intercept-endpoint-group-location=: Location of the intercept endpoint group.
    --intercept-endpoint-group=!: ID of the intercept endpoint group or fully qualified identifier for the intercept endpoint group.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: Location of the intercept endpoint group association.
    --max-wait=: Time to synchronously wait for the operation to complete, after which the operation continues asynchronously.
    --network=!: ID of the network or fully qualified identifier for the network.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |+
        *(ALPHA)*  Create an intercept endpoint group association. Successful creation of an association results
        in an association in ACTIVE state. Check the progress of association creation
        by using `gcloud network-security intercept-endpoint-group-associations list`.

        For more examples, refer to the EXAMPLES section below.

    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        intercept-endpoint-group: |-
            ID of the intercept endpoint group or fully qualified identifier for the intercept endpoint group.
            +
            To set the `id` attribute:
            * provide the argument `--intercept-endpoint-group` on the command line.
        intercept-endpoint-group-location: |-
            Location of the intercept endpoint group.
            +
            To set the `location` attribute:
            * provide the argument `--intercept-endpoint-group` on the command line with a fully specified name;
            * provide the argument `--intercept-endpoint-group-location` on the command line;
            * provide the argument `--location` on the command line;
            * provide the argument `networksecurity.projects.locations.interceptEndpointGroupAssociations` on the command line with a fully specified name.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            Location of the intercept endpoint group association.
            +
            To set the `location` attribute:
            * provide the argument `INTERCEPT_ENDPOINT_GROUP_ASSOCIATION` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        max-wait: Time to synchronously wait for the operation to complete, after which the operation continues asynchronously. Ignored if --no-async isn't specified. See $ gcloud topic datetimes for information on time formats.
        network: |-
            ID of the network or fully qualified identifier for the network.
            +
            To set the `network-name` attribute:
            * provide the argument `--network` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
