name: describe
description: '*(ALPHA)*  Show metadata for a Memorystore Redis operation.'
flags:
    --region=: The name of the Redis region of the operation.
documentation:
    command: |
        *(ALPHA)*  Display all metadata associated with a Redis operation given a valid
        operation name.

        This command can fail for the following reasons:
        * The operation specified does not exist.
        * The active account does not have permission to access the given
          operation.
    flag:
        region: |-
            The name of the Redis region of the operation. Overrides the default
            redis/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `redis/region`.
