name: delete
description: '*(ALPHA)*  Delete network edge security services.'
flags:
    --region=: Region of the network edge security service to delete.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute network-edge-security-services delete* deletes Compute Engine network edge security services.

        ## EXAMPLES

        To delete a network edge security service with the name 'my-service' in region
        'us-central1', run:

          $ gcloud alpha compute network-edge-security-services delete my-service \
            --region=us-central1
    flag:
        region: Region of the network edge security service to delete. Overrides the default *compute/region* property value for this command invocation.
