    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=: ""
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the snapshot to update.
    --snapshot-id=!: The ID of the snapshot that you want to update, in the format `fsvolsnap-0123456789abcdef0`.
documentation:
    command: Updates the name of an Amazon FSx for OpenZFS snapshot.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
