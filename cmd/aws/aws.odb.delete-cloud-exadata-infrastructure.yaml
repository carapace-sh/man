name: delete-cloud-exadata-infrastructure
description: Deletes the specified Exadata infrastructure.
flags:
    --cloud-exadata-infrastructure-id=!: The unique identifier of the Exadata infrastructure to delete.
documentation:
    command: Deletes the specified Exadata infrastructure. Before you use this operation, make sure to delete all of the VM clusters that are hosted on this Exadata infrastructure.
    flag:
        cloud-exadata-infrastructure-id: The unique identifier of the Exadata infrastructure to delete.
