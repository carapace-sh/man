name: detach-policy
description: Detaches a policy from the specified target.
flags:
    --policy-name=!: The policy to detach.
    --target=!: The target from which the policy will be detached.
documentation:
    command: |-
        Detaches a policy from the specified target.

        Because of the distributed nature of Amazon Web Services, it can take up to five minutes after a policy is detached before it's ready to be deleted.

        Requires permission to access the [DetachPolicy](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        policy-name: The policy to detach.
        target: The target from which the policy will be detached.
