name: update
description: '*(BETA)*  Updates a Compute Engine public advertised prefix.'
flags:
    --announce-prefix: Specify if the prefix will be announced.
    --no-announce-prefix&: Specify if the prefix will be announced.
    --no-withdraw-prefix&: Specify if the prefix will be withdrawn.
    --status=: The status of public advertised prefix.
    --withdraw-prefix: Specify if the prefix will be withdrawn.
completion:
    flag:
        status:
            - ptr-configured
documentation:
    command: |-
        ## EXAMPLES

        To update a public advertised prefix:

          $ gcloud beta compute public-advertised-prefixes update my-pap --status=ptr-configured

        To announce a public advertised prefix:

          $ gcloud beta compute public-advertised-prefixes update my-pap --announce-prefix

        To withdraw a public advertised prefix:

          $ gcloud beta compute public-advertised-prefixes update my-pap --withdraw-prefix
    flag:
        announce-prefix: Specify if the prefix will be announced. Default is false.
        no-announce-prefix: Specify if the prefix will be announced. Default is false.
        no-withdraw-prefix: Specify if the prefix will be withdrawn. Default is false.
        status: 'The status of public advertised prefix. _STATUS_ must be (only one value is supported): *ptr-configured*.'
        withdraw-prefix: Specify if the prefix will be withdrawn. Default is false.
