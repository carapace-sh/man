name: restart-app-server
description: Causes the environment to restart the application container server running on each Amazon EC2 instance.
flags:
    --environment-id=: The ID of the environment to restart the server for.
    --environment-name=: The name of the environment to restart the server for.
documentation:
    command: Causes the environment to restart the application container server running on each Amazon EC2 instance.
    flag:
        environment-id: |-
            The ID of the environment to restart the server for.

            Condition: You must specify either this or an EnvironmentName, or both. If you do not specify either, AWS Elastic Beanstalk returns `MissingRequiredParameter` error.
        environment-name: |-
            The name of the environment to restart the server for.

            Condition: You must specify either this or an EnvironmentId, or both. If you do not specify either, AWS Elastic Beanstalk returns `MissingRequiredParameter` error.
