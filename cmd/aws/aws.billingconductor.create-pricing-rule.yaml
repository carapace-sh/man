name: create-pricing-rule
description: Creates a pricing rule can be associated to a pricing plan, or a set of pricing plans.
flags:
    --billing-entity=: The seller of services provided by Amazon Web Services, their affiliates, or third-party providers selling services via Amazon Web Services Marketplace.
    --client-token=: A unique, case-sensitive identifier that you specify to ensure idempotency of the request.
    --description=: The pricing rule description.
    --modifier-percentage=: A percentage modifier that's applied on the public pricing rates.
    --name=!: The pricing rule name.
    --operation=: Operation is the specific Amazon Web Services action covered by this line item.
    --scope=!: The scope of pricing rule that indicates if it's globally applicable, or it's service-specific.
    --service=: If the `Scope` attribute is set to `SERVICE` or `SKU`, the attribute indicates which service the `PricingRule` is applicable for.
    --tags=: A map that contains tag keys and tag values that are attached to a pricing rule.
    --tiering=: The set of tiering configurations for the pricing rule.
    --type=!: The type of pricing rule.
    --usage-type=: Usage type is the unit that each service uses to measure the usage of a specific type of resource.
completion:
    flag:
        scope:
            - GLOBAL
            - SERVICE
            - BILLING_ENTITY
            - SKU
        type:
            - MARKUP
            - DISCOUNT
            - TIERING
documentation:
    command: Creates a pricing rule can be associated to a pricing plan, or a set of pricing plans.
    flag:
        billing-entity: The seller of services provided by Amazon Web Services, their affiliates, or third-party providers selling services via Amazon Web Services Marketplace.
        client-token: A unique, case-sensitive identifier that you specify to ensure idempotency of the request. Idempotency ensures that an API request completes no more than one time. With an idempotent request, if the original request completes successfully, any subsequent retries complete successfully without performing any further actions.
        description: The pricing rule description.
        modifier-percentage: A percentage modifier that's applied on the public pricing rates. Your entry will be rounded to the nearest 2 decimal places.
        name: The pricing rule name. The names must be unique to each pricing rule.
        operation: |-
            Operation is the specific Amazon Web Services action covered by this line item. This describes the specific usage of the line item.

            If the `Scope` attribute is set to `SKU`, this attribute indicates which operation the `PricingRule` is modifying. For example, a value of `RunInstances:0202` indicates the operation of running an Amazon EC2 instance.
        scope: The scope of pricing rule that indicates if it's globally applicable, or it's service-specific.
        service: If the `Scope` attribute is set to `SERVICE` or `SKU`, the attribute indicates which service the `PricingRule` is applicable for.
        tags: A map that contains tag keys and tag values that are attached to a pricing rule.
        tiering: The set of tiering configurations for the pricing rule.
        type: The type of pricing rule.
        usage-type: |-
            Usage type is the unit that each service uses to measure the usage of a specific type of resource.

            If the `Scope` attribute is set to `SKU`, this attribute indicates which usage type the `PricingRule` is modifying. For example, `USW2-BoxUsage:m2.2xlarge` describes an`M2 High Memory Double Extra Large` instance in the US West (Oregon) Region.
