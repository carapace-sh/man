name: describe-endpoint-access
description: Describes a Redshift-managed VPC endpoint.
flags:
    --cluster-identifier=: The cluster identifier associated with the described endpoint.
    --endpoint-name=: The name of the endpoint to be described.
    --marker=: An optional pagination token provided by a previous `DescribeEndpointAccess` request.
    --max-records=: The maximum number of records to include in the response.
    --resource-owner=: The Amazon Web Services account ID of the owner of the cluster.
    --vpc-id=: The virtual private cloud (VPC) identifier with access to the cluster.
documentation:
    command: Describes a Redshift-managed VPC endpoint.
    flag:
        cluster-identifier: The cluster identifier associated with the described endpoint.
        endpoint-name: The name of the endpoint to be described.
        marker: An optional pagination token provided by a previous `DescribeEndpointAccess` request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by the `MaxRecords` parameter.
        max-records: The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a `Marker` is included in the response so that the remaining results can be retrieved.
        resource-owner: The Amazon Web Services account ID of the owner of the cluster.
        vpc-id: The virtual private cloud (VPC) identifier with access to the cluster.
