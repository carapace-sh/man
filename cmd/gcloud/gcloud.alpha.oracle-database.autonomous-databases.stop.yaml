name: stop
description: '*(ALPHA)*  Stops an AutonomousDatabase.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location id of the autonomousDatabase resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: '*(ALPHA)*  Stops an AutonomousDatabase which is in Running state.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location id of the autonomousDatabase resource.
            +
            To set the `location` attribute:
            * provide the argument `autonomous_database` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
