name: export
description: '*(ALPHA)*  Export an SSL policy.'
flags:
    --destination=: Path to a YAML file where the configuration will be exported.
    --global: If set, the SSL policy is global.
    --no-global&: If set, the SSL policy is global.
    --region=: Region of the SSL policy to export.
documentation:
    command: |-
        *(ALPHA)*  Exports an SSL policy's configuration to a file.
        This configuration can be imported at a later time.
    flag:
        destination: |-
            Path to a YAML file where the configuration will be exported.
                      Alternatively, you may omit this flag to write to standard output. For a schema describing the export/import format, see:
                      $CLOUDSDKROOT/lib/googlecloudsdk/schemas/compute/alpha/SslPolicy.yaml.
        global: If set, the SSL policy is global.
        no-global: If set, the SSL policy is global.
        region: Region of the SSL policy to export. Overrides the default *compute/region* property value for this command invocation.
