name: import-disk-image
description: Import a Windows operating system image from a verified Microsoft ISO disk file.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=!: Unique, case-sensitive identifier you provide to ensure idempotency of the request.
    --description=: The description for your disk image import.
    --execution-role=: The name or Amazon Resource Name (ARN) for the IAM role you create that grants Image Builder access to perform workflow actions to import an image from a Microsoft ISO file.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --infrastructure-configuration-arn=!: The Amazon Resource Name (ARN) of the infrastructure configuration resource that's used for launching the EC2 instance on which the ISO image is built.
    --logging-configuration=: Define logging configuration for the image build process.
    --name=!: The name of the image resource that's created from the import.
    --os-version=!: The operating system version for the imported image.
    --platform=!: The operating system platform for the imported image.
    --semantic-version=!: The semantic version to attach to the image that's created during the import process.
    --tags=: Tags that are attached to image resources created from the import.
    --uri=!: The `uri` of the ISO disk file that's stored in Amazon S3.
documentation:
    command: |-
        Import a Windows operating system image from a verified Microsoft ISO disk file. The following disk images are supported:

        - Windows 11 Enterprise
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Unique, case-sensitive identifier you provide to ensure idempotency of the request. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html) in the *Amazon EC2 API Reference*.
        description: The description for your disk image import.
        execution-role: The name or Amazon Resource Name (ARN) for the IAM role you create that grants Image Builder access to perform workflow actions to import an image from a Microsoft ISO file.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        infrastructure-configuration-arn: The Amazon Resource Name (ARN) of the infrastructure configuration resource that's used for launching the EC2 instance on which the ISO image is built.
        logging-configuration: Define logging configuration for the image build process.
        name: The name of the image resource that's created from the import.
        os-version: 'The operating system version for the imported image. Allowed values include the following: `Microsoft Windows 11`.'
        platform: 'The operating system platform for the imported image. Allowed values include the following: `Windows`.'
        semantic-version: The semantic version to attach to the image that's created during the import process. This version follows the semantic version syntax.
        tags: Tags that are attached to image resources created from the import.
        uri: The `uri` of the ISO disk file that's stored in Amazon S3.
