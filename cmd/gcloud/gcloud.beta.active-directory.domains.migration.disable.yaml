name: disable
description: '*(BETA)*  Disable domain migration permissions on a Managed Microsoft AD domain.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(BETA)*  Disable domain migration permissions on a Managed Microsoft AD domain.

        This command can fail for the following reasons:
          * The specified domain doesn't exist.
          * The specified domain is either being created or updated.
          * The active account doesn't have permission to disable migration permissions on the specified domain.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
