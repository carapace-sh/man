name: list-clusters
description: Returns a list of running clusters in your account.
flags:
    --max-results=: The maximum number of results that are returned per call.
    --next-token=: The value of `nextToken` is a unique pagination token for each page of results returned.
documentation:
    command: Returns a list of running clusters in your account.
    flag:
        max-results: The maximum number of results that are returned per call. You can use `nextToken` to obtain further pages of results. The default is 10 results, and the maximum allowed page size is 100 results. A value of 0 uses the default.
        next-token: The value of `nextToken` is a unique pagination token for each page of results returned. If `nextToken` is returned, there are more results available. Make the call again using the returned token to retrieve the next page. Keep all other arguments unchanged. Each pagination token expires after 24 hours. Using an expired pagination token returns an `HTTP 400 InvalidToken` error.
