name: get-tile
description: Gets a web mercator tile for the given Earth Observation job.
flags:
    --arn=!: The Amazon Resource Name (ARN) of the tile operation.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --execution-role-arn=: The Amazon Resource Name (ARN) of the IAM role that you specify.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --image-assets=!: The particular assets or bands to tile.
    --image-mask: Determines whether or not to return a valid data mask.
    --no-image-mask: Determines whether or not to return a valid data mask.
    --output-data-type=: The output data type of the tile operation.
    --output-format=: The data format of the output tile.
    --property-filters=: Property filters for the imagery to tile.
    --target=!: Determines what part of the Earth Observation job to tile.
    --time-range-filter=: Time range filter applied to imagery to find the images to tile.
    --x=!: The x coordinate of the tile input.
    --y=!: The y coordinate of the tile input.
    --z=!: The z coordinate of the tile input.
completion:
    flag:
        output-data-type:
            - INT32
            - FLOAT32
            - INT16
            - FLOAT64
            - UINT16
        target:
            - INPUT
            - OUTPUT
documentation:
    command: Gets a web mercator tile for the given Earth Observation job.
    flag:
        arn: The Amazon Resource Name (ARN) of the tile operation.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        execution-role-arn: The Amazon Resource Name (ARN) of the IAM role that you specify.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        image-assets: The particular assets or bands to tile.
        image-mask: Determines whether or not to return a valid data mask.
        output-data-type: The output data type of the tile operation.
        output-format: The data format of the output tile. The formats include .npy, .png and .jpg.
        property-filters: Property filters for the imagery to tile.
        target: Determines what part of the Earth Observation job to tile. 'INPUT' or 'OUTPUT' are the valid options.
        time-range-filter: Time range filter applied to imagery to find the images to tile.
        x: The x coordinate of the tile input.
        "y": The y coordinate of the tile input.
        z: The z coordinate of the tile input.
