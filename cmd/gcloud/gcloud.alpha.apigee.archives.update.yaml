name: update
description: '*(ALPHA)*  Update an existing Apigee archive deployment.'
flags:
    --clear-labels: Remove all labels.
    --environment=: Deployment environment of the archive deployment.
    --no-clear-labels&: Remove all labels.
    --organization=: Apigee organization containing the archive deployment.
    --remove-labels=: List of label keys to remove.
    --update-labels=: List of label KEY=VALUE pairs to update.
documentation:
    command: |-
        *(ALPHA)*  Update an existing Apigee archive deployment.

        `gcloud alpha apigee archives update` updates an Apigee archive deployment.
    flag:
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        environment: |-
            Deployment environment of the archive deployment.
            +
            To set the `environment` attribute:
            * provide the argument `archive_deployment` on the command line with a fully specified name;
            * provide the argument `--environment` on the command line.
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        organization: |-
            Apigee organization containing the archive deployment. If unspecified, the Cloud Platform project's associated organization will be used.
            +
            To set the `organization` attribute:
            * provide the argument `archive_deployment` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line;
            * set the property [project] or provide the argument [--project] on the command line, using a Cloud Platform project with an associated Apigee organization.
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        update-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
