name: send-cis-session-health
description: Sends a CIS session health.
flags:
    --scan-job-id=!: A unique identifier for the scan job.
    --session-token=!: The unique token that identifies the CIS session.
documentation:
    command: Sends a CIS session health. This API is used by the Amazon Inspector SSM plugin to communicate with the Amazon Inspector service. The Amazon Inspector SSM plugin calls this API to start a CIS scan session for the scan ID supplied by the service.
    flag:
        scan-job-id: A unique identifier for the scan job.
        session-token: The unique token that identifies the CIS session.
