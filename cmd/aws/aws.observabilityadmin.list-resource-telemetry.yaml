name: list-resource-telemetry
description: Returns a list of telemetry configurations for Amazon Web Services resources supported by telemetry config.
flags:
    --max-results=: A number field used to limit the number of results within the returned list.
    --next-token=: The token for the next set of items to return.
    --resource-identifier-prefix=: A string used to filter resources which have a `ResourceIdentifier` starting with the `ResourceIdentifierPrefix`.
    --resource-tags=: A key-value pair to filter resources based on tags associated with the resource.
    --resource-types=: A list of resource types used to filter resources supported by telemetry config.
    --telemetry-configuration-state=: A key-value pair to filter resources based on the telemetry type and the state of the telemetry configuration.
documentation:
    command: Returns a list of telemetry configurations for Amazon Web Services resources supported by telemetry config. For more information, see [Auditing CloudWatch telemetry configurations](https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/telemetry-config-cloudwatch.html).
    flag:
        max-results: A number field used to limit the number of results within the returned list.
        next-token: The token for the next set of items to return. A previous call generates this token.
        resource-identifier-prefix: A string used to filter resources which have a `ResourceIdentifier` starting with the `ResourceIdentifierPrefix`.
        resource-tags: A key-value pair to filter resources based on tags associated with the resource. For more information about tags, see [What are tags?](https://docs.aws.amazon.com/whitepapers/latest/tagging-best-practices/what-are-tags.html)
        resource-types: A list of resource types used to filter resources supported by telemetry config. If this parameter is provided, the resources will be returned in the same order used in the request.
        telemetry-configuration-state: A key-value pair to filter resources based on the telemetry type and the state of the telemetry configuration. The key is the telemetry type and the value is the state.
