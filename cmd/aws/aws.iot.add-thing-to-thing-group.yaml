name: add-thing-to-thing-group
description: Adds a thing to a thing group.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-override-dynamic-groups: Override dynamic thing groups with static thing groups when 10-group limit is reached.
    --override-dynamic-groups: Override dynamic thing groups with static thing groups when 10-group limit is reached.
    --thing-arn=: The ARN of the thing to add to a group.
    --thing-group-arn=: The ARN of the group to which you are adding a thing.
    --thing-group-name=: The name of the group to which you are adding a thing.
    --thing-name=: The name of the thing to add to a group.
documentation:
    command: |-
        Adds a thing to a thing group.

        Requires permission to access the [AddThingToThingGroup](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        override-dynamic-groups: Override dynamic thing groups with static thing groups when 10-group limit is reached. If a thing belongs to 10 thing groups, and one or more of those groups are dynamic thing groups, adding a thing to a static group removes the thing from the last dynamic group.
        thing-arn: The ARN of the thing to add to a group.
        thing-group-arn: The ARN of the group to which you are adding a thing.
        thing-group-name: The name of the group to which you are adding a thing.
        thing-name: The name of the thing to add to a group.
