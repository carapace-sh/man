name: delete-replication-config
description: Deletes an DMS Serverless replication configuration.
flags:
    --replication-config-arn=!: The replication config to delete.
documentation:
    command: Deletes an DMS Serverless replication configuration. This effectively deprovisions any and all replications that use this configuration. You can't delete the configuration for an DMS Serverless replication that is ongoing. You can delete the configuration when the replication is in a non-RUNNING and non-STARTING state.
    flag:
        replication-config-arn: The replication config to delete.
