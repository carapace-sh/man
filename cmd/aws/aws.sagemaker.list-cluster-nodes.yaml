name: list-cluster-nodes
description: Retrieves the list of instances (also called *nodes* interchangeably) in a SageMaker HyperPod cluster.
flags:
    --cluster-name=!: The string name or the Amazon Resource Name (ARN) of the SageMaker HyperPod cluster in which you want to retrieve the list of nodes.
    --creation-time-after=: A filter that returns nodes in a SageMaker HyperPod cluster created after the specified time.
    --creation-time-before=: A filter that returns nodes in a SageMaker HyperPod cluster created before the specified time.
    --include-node-logical-ids=: Specifies whether to include nodes that are still being provisioned in the response.
    --instance-group-name-contains=: A filter that returns the instance groups whose name contain a specified string.
    --max-results=: The maximum number of nodes to return in the response.
    --next-token=: If the result of the previous `ListClusterNodes` request was truncated, the response includes a `NextToken`.
    --sort-by=: The field by which to sort results.
    --sort-order=: The sort order for results.
completion:
    flag:
        sort-by:
            - CREATION_TIME
            - NAME
        sort-order:
            - Ascending
            - Descending
documentation:
    command: Retrieves the list of instances (also called *nodes* interchangeably) in a SageMaker HyperPod cluster.
    flag:
        cluster-name: The string name or the Amazon Resource Name (ARN) of the SageMaker HyperPod cluster in which you want to retrieve the list of nodes.
        creation-time-after: |-
            A filter that returns nodes in a SageMaker HyperPod cluster created after the specified time. Timestamps are formatted according to the ISO 8601 standard.

            Acceptable formats include:

            - `YYYY-MM-DDThh:mm:ss.sssTZD` (UTC), for example, `2014-10-01T20:30:00.000Z`
            - `YYYY-MM-DDThh:mm:ss.sssTZD` (with offset), for example, `2014-10-01T12:30:00.000-08:00`
            - `YYYY-MM-DD`, for example, `2014-10-01`
            - Unix time in seconds, for example, `1412195400`. This is also referred to as Unix Epoch time and represents the number of seconds since midnight, January 1, 1970 UTC.

            For more information about the timestamp format, see [Timestamp](https://docs.aws.amazon.com/cli/latest/userguide/cli-usage-parameters-types.html#parameter-type-timestamp) in the *Amazon Web Services Command Line Interface User Guide*.
        creation-time-before: A filter that returns nodes in a SageMaker HyperPod cluster created before the specified time. The acceptable formats are the same as the timestamp formats for `CreationTimeAfter`. For more information about the timestamp format, see [Timestamp](https://docs.aws.amazon.com/cli/latest/userguide/cli-usage-parameters-types.html#parameter-type-timestamp) in the *Amazon Web Services Command Line Interface User Guide*.
        include-node-logical-ids: Specifies whether to include nodes that are still being provisioned in the response. When set to true, the response includes all nodes regardless of their provisioning status. When set to `False` (default), only nodes with assigned `InstanceIds` are returned.
        instance-group-name-contains: A filter that returns the instance groups whose name contain a specified string.
        max-results: The maximum number of nodes to return in the response.
        next-token: If the result of the previous `ListClusterNodes` request was truncated, the response includes a `NextToken`. To retrieve the next set of cluster nodes, use the token in the next request.
        sort-by: The field by which to sort results. The default value is `CREATION_TIME`.
        sort-order: The sort order for results. The default value is `Ascending`.
