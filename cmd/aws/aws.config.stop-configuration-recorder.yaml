name: stop-configuration-recorder
description: Stops the customer managed configuration recorder.
flags:
    --configuration-recorder-name=!: The name of the customer managed configuration recorder that you want to stop.
documentation:
    command: Stops the customer managed configuration recorder. The customer managed configuration recorder will stop recording configuration changes for the resource types you have specified.
    flag:
        configuration-recorder-name: The name of the customer managed configuration recorder that you want to stop.
