name: get-access-grants-instance-for-prefix
description: Retrieve the S3 Access Grants instance that contains a particular prefix.
flags:
    --account-id=!: The ID of the Amazon Web Services account that is making this request.
    --s3-prefix=!: The S3 prefix of the access grants that you would like to retrieve.
documentation:
    command: |-
        Retrieve the S3 Access Grants instance that contains a particular prefix.

        Permissions

        You must have the `s3:GetAccessGrantsInstanceForPrefix` permission for the caller account to use this operation.

        Additional Permissions

        The prefix owner account must grant you the following permissions to their S3 Access Grants instance: `s3:GetAccessGrantsInstanceForPrefix`.

        You must URL encode any signed header values that contain spaces. For example, if your header value is `my file.txt`, containing two spaces after `my`, you must URL encode this value to `my%20%20file.txt`.
    flag:
        account-id: The ID of the Amazon Web Services account that is making this request.
        s3-prefix: The S3 prefix of the access grants that you would like to retrieve.
