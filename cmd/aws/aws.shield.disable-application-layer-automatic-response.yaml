name: disable-application-layer-automatic-response
description: Disable the Shield Advanced automatic application layer DDoS mitigation feature for the protected resource.
flags:
    --resource-arn=!: The ARN (Amazon Resource Name) of the protected resource.
documentation:
    command: Disable the Shield Advanced automatic application layer DDoS mitigation feature for the protected resource. This stops Shield Advanced from creating, verifying, and applying WAF rules for attacks that it detects for the resource.
    flag:
        resource-arn: The ARN (Amazon Resource Name) of the protected resource.
