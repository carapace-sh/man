name: create
description: '*(BETA)*  Create a hyperparameter tuning job.'
flags:
    --algorithm=: Search algorithm specified for the given study.
    --config=!: Path to the job configuration file.
    --display-name=!: Display name of the hyperparameter tuning job to create.
    --enable-dashboard-access: Whether you want Vertex AI to enable dashboard built on the training containers.
    --enable-web-access: Whether you want Vertex AI to enable [interactive shell access](https://cloud.google.com/vertex-ai/docs/training/monitor-debug-interactive-shell)
    --kms-key=!: ID of the key or fully qualified identifier for the key.
    --kms-keyring=: The KMS keyring of the key.
    --kms-location=: The Google Cloud location for the key.
    --kms-project=: The Google Cloud project for the key.
    --labels=: List of label KEY=VALUE pairs to add.
    --max-trial-count=: Desired total number of trials.
    --network=: Full name of the Google Compute Engine network to which the Job
    --no-enable-dashboard-access&: Whether you want Vertex AI to enable dashboard built on the training containers.
    --no-enable-web-access&: Whether you want Vertex AI to enable [interactive shell access](https://cloud.google.com/vertex-ai/docs/training/monitor-debug-interactive-shell)
    --parallel-trial-count=: Desired number of Trials to run in parallel.
    --region=: ID of the region or fully qualified identifier for the region.
    --service-account=: The email address of a service account to use when running the
completion:
    flag:
        algorithm:
            - algorithm-unspecified
            - grid-search
            - random-search
documentation:
    command: '*(BETA)*  Create a hyperparameter tuning job.'
    flag:
        algorithm: 'Search algorithm specified for the given study. _ALGORITHM_ must be one of: *algorithm-unspecified*, *grid-search*, *random-search*.'
        config: |-
            Path to the job configuration file. This file should be a YAML document containing a HyperparameterTuningSpec.
            If an option is specified both in the configuration file **and** via command line arguments, the command line arguments
            override the configuration file.
            +
            Example(YAML):
            +
              displayName: TestHpTuningJob
              maxTrialCount: 1
              parallelTrialCount: 1
              studySpec:
                metrics:
                - metricId: x
                  goal: MINIMIZE
                parameters:
                - parameterId: z
                  integerValueSpec:
                    minValue: 1
                    maxValue: 100
                algorithm: RANDOM_SEARCH
              trialJobSpec:
                workerPoolSpecs:
                - machineSpec:
                    machineType: n1-standard-4
                  replicaCount: 1
                  containerSpec:
                    imageUri: gcr.io/ucaip-test/ucaip-training-test
        display-name: Display name of the hyperparameter tuning job to create.
        enable-dashboard-access: |-
            Whether you want Vertex AI to enable dashboard built on the training containers. If set to ``true'', you can access
            the dashboard at the URIs given by CustomJob.web_access_uris or
            Trial.web_access_uris (within HyperparameterTuningJob.trials).
        enable-web-access: |-
            Whether you want Vertex AI to enable [interactive shell access](https://cloud.google.com/vertex-ai/docs/training/monitor-debug-interactive-shell)
            to training containers. If set to ``true'', you can access
            interactive shells at the URIs given by CustomJob.web_access_uris or
            Trial.web_access_uris (within HyperparameterTuningJob.trials).
        kms-key: |-
            ID of the key or fully qualified identifier for the key.
            +
            To set the `kms-key` attribute:
            * provide the argument `--kms-key` on the command line.
        kms-keyring: |-
            The KMS keyring of the key.
            +
            To set the `kms-keyring` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-keyring` on the command line.
        kms-location: |-
            The Google Cloud location for the key.
            +
            To set the `kms-location` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-location` on the command line.
        kms-project: |-
            The Google Cloud project for the key.
            +
            To set the `kms-project` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-project` on the command line;
            * set the property `core/project`.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        max-trial-count: Desired total number of trials. The default value is 1.
        network: |-
            Full name of the Google Compute Engine network to which the Job
            is peered with. Private services access must already have been configured.
            If unspecified, the Job is not peered with any network.
        no-enable-dashboard-access: |
            Whether you want Vertex AI to enable dashboard built on the training containers. If set to ``true'', you can access
            the dashboard at the URIs given by CustomJob.web_access_uris or
            Trial.web_access_uris (within HyperparameterTuningJob.trials).
        no-enable-web-access: |
            Whether you want Vertex AI to enable [interactive shell access](https://cloud.google.com/vertex-ai/docs/training/monitor-debug-interactive-shell)
            to training containers. If set to ``true'', you can access
            interactive shells at the URIs given by CustomJob.web_access_uris or
            Trial.web_access_uris (within HyperparameterTuningJob.trials).
        parallel-trial-count: Desired number of Trials to run in parallel. The default value is 1.
        region: |-
            ID of the region or fully qualified identifier for the region.
            +
            To set the `region` attribute:
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
        service-account: |-
            The email address of a service account to use when running the
            training appplication. You must have the `iam.serviceAccounts.actAs`
            permission for the specified service account.
