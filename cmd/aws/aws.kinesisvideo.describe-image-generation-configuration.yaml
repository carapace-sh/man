name: describe-image-generation-configuration
description: Gets the `ImageGenerationConfiguration` for a given Kinesis video stream.
flags:
    --stream-arn=: The Amazon Resource Name (ARN) of the Kinesis video stream from which to retrieve the image generation configuration.
    --stream-name=: The name of the stream from which to retrieve the image generation configuration.
documentation:
    command: Gets the `ImageGenerationConfiguration` for a given Kinesis video stream.
    flag:
        stream-arn: The Amazon Resource Name (ARN) of the Kinesis video stream from which to retrieve the image generation configuration. You must specify either the `StreamName` or the `StreamARN`.
        stream-name: The name of the stream from which to retrieve the image generation configuration. You must specify either the `StreamName` or the `StreamARN`.
