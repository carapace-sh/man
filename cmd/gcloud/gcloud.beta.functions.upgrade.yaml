name: upgrade
description: '*(BETA)*  Upgrade a 1st gen Cloud Function to the Cloud Run function.'
flags:
    --abort: Undoes all steps of the upgrade process done so far.
    --commit: Finishes the upgrade process and permanently deletes the original 1st gen copy of the function.
    --no-abort&: Undoes all steps of the upgrade process done so far.
    --no-commit&: Finishes the upgrade process and permanently deletes the original 1st gen copy of the function.
    --no-redirect-traffic&: Redirects production traffic to the 2nd gen copy of the function.
    --no-rollback-traffic&: Rolls back production traffic to the original 1st gen copy of the function.
    --no-setup-config&: Sets up the function upgrade config by creating a 2nd gen copy of the function's code and configuration.
    --redirect-traffic: Redirects production traffic to the 2nd gen copy of the function.
    --region=: The Cloud region for the function.
    --rollback-traffic: Rolls back production traffic to the original 1st gen copy of the function.
    --setup-config: Sets up the function upgrade config by creating a 2nd gen copy of the function's code and configuration.
    --trigger-service-account=: The email address of the IAM service account associated with the Eventarc
documentation:
    command: '*(BETA)*  Upgrade a 1st gen Cloud Function to the Cloud Run function.'
    flag:
        abort: Undoes all steps of the upgrade process done so far. All traffic will point to the original 1st gen function copy and the 2nd gen function copy will be deleted.
        commit: Finishes the upgrade process and permanently deletes the original 1st gen copy of the function.
        no-abort: Undoes all steps of the upgrade process done so far. All traffic will point to the original 1st gen function copy and the 2nd gen function copy will be deleted.
        no-commit: Finishes the upgrade process and permanently deletes the original 1st gen copy of the function.
        no-redirect-traffic: Redirects production traffic to the 2nd gen copy of the function.
        no-rollback-traffic: Rolls back production traffic to the original 1st gen copy of the function. The 2nd gen copy will still be available for testing.
        no-setup-config: Sets up the function upgrade config by creating a 2nd gen copy of the function's code and configuration.
        redirect-traffic: Redirects production traffic to the 2nd gen copy of the function.
        region: |-
            The Cloud region for the function. Overrides the default `functions/region` property value for this command invocation.
            +
            To set the `region` attribute:
            * provide the argument `NAME` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `functions/region`.
        rollback-traffic: Rolls back production traffic to the original 1st gen copy of the function. The 2nd gen copy will still be available for testing.
        setup-config: Sets up the function upgrade config by creating a 2nd gen copy of the function's code and configuration.
        trigger-service-account: |-
            The email address of the IAM service account associated with the Eventarc
            trigger for the function. This is used for authenticated invocation.
            +
            If not provided, the function will use the project's default service
            account for Compute Engine.
