name: delete-task-set
description: Deletes a specified task set within a service.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cluster=!: The short name or full Amazon Resource Name (ARN) of the cluster that hosts the service that the task set found in to delete.
    --force: If `true`, you can delete a task set even if it hasn't been scaled down to zero.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-force: If `true`, you can delete a task set even if it hasn't been scaled down to zero.
    --service=!: The short name or full Amazon Resource Name (ARN) of the service that hosts the task set to delete.
    --task-set=!: The task set ID or full Amazon Resource Name (ARN) of the task set to delete.
documentation:
    command: Deletes a specified task set within a service. This is used when a service uses the `EXTERNAL` deployment controller type. For more information, see [Amazon ECS deployment types](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/deployment-types.html) in the *Amazon Elastic Container Service Developer Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cluster: The short name or full Amazon Resource Name (ARN) of the cluster that hosts the service that the task set found in to delete.
        force: If `true`, you can delete a task set even if it hasn't been scaled down to zero.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        service: The short name or full Amazon Resource Name (ARN) of the service that hosts the task set to delete.
        task-set: The task set ID or full Amazon Resource Name (ARN) of the task set to delete.
