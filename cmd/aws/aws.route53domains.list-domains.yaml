name: list-domains
description: This operation returns all the domain names registered with Amazon Route 53 for the current Amazon Web Services account if no filtering conditions are used.
flags:
    --filter-conditions=: A complex type that contains information about the filters applied during the `ListDomains` request.
    --marker=: For an initial request for a list of domains, omit this element.
    --max-items=: Number of domains to be returned.
    --sort-condition=: A complex type that contains information about the requested ordering of domains in the returned list.
documentation:
    command: This operation returns all the domain names registered with Amazon Route 53 for the current Amazon Web Services account if no filtering conditions are used.
    flag:
        filter-conditions: A complex type that contains information about the filters applied during the `ListDomains` request. The filter conditions can include domain name and domain expiration.
        marker: |-
            For an initial request for a list of domains, omit this element. If the number of domains that are associated with the current Amazon Web Services account is greater than the value that you specified for `MaxItems`, you can use `Marker` to return additional domains. Get the value of `NextPageMarker` from the previous response, and submit another request that includes the value of `NextPageMarker` in the `Marker` element.

            Constraints: The marker must match the value specified in the previous request.
        max-items: |-
            Number of domains to be returned.

            Default: 20
        sort-condition: A complex type that contains information about the requested ordering of domains in the returned list.
