name: cancel-mailbox-export-job
description: Cancels a mailbox export job.
flags:
    --client-token=!: The idempotency token for the client request.
    --job-id=!: The job ID.
    --organization-id=!: The organization ID.
documentation:
    command: |-
        Cancels a mailbox export job.

        If the mailbox export job is near completion, it might not be possible to cancel it.
    flag:
        client-token: The idempotency token for the client request.
        job-id: The job ID.
        organization-id: The organization ID.
