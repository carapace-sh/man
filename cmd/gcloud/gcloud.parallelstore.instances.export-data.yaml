name: export-data
description: Exports data from Parallelstore instance to Cloud Storage.
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --destination-gcs-bucket-uri=!: 'URI to a Cloud Storage bucket in the format:'
    --location=: The location id of the instance resource.
    --metadata-options-gid=: The GID preservation behavior.
    --metadata-options-mode=: The mode preservation behavior.
    --metadata-options-uid=: The UID preservation behavior.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --request-id=: An optional request ID to identify requests.
    --service-account=!: ID of the serviceAccount or fully qualified identifier for the serviceAccount.
    --source-parallelstore-path=: Root directory path to the Paralellstore filesystem, starting with `/`.
completion:
    flag:
        metadata-options-gid:
            - gid-number-preserve
            - gid-skip
        metadata-options-mode:
            - mode-preserve
            - mode-skip
        metadata-options-uid:
            - uid-number-preserve
            - uid-skip
documentation:
    command: |
        Exports data from Parallelstore instance to Cloud Storage.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        destination-gcs-bucket-uri: |-
            URI to a Cloud Storage bucket in the format:
            `gs://<bucket_name>/<path_inside_bucket>`. The path inside the bucket is
            optional.
        location: |-
            The location id of the instance resource.
            +
            To set the `location` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        metadata-options-gid: |-
            The GID preservation behavior. _METADATA_OPTIONS_GID_ must be one of:
            +
            *gid-number-preserve*::: Preserve GID that is in number format during a transfer job.
            *gid-skip*::: Do not preserve GID during a transfer job.
            :::
            +
        metadata-options-mode: |-
            The mode preservation behavior. _METADATA_OPTIONS_MODE_ must be one of:
            +
            *mode-preserve*::: Preserve mode during a transfer job.
            *mode-skip*::: Do not preserve mode during a transfer job.
            :::
            +
        metadata-options-uid: |-
            The UID preservation behavior. _METADATA_OPTIONS_UID_ must be one of:
            +
            *uid-number-preserve*::: Preserve UID that is in number format during a transfer job.
            *uid-skip*::: Do not preserve UID during a transfer job.
            :::
            +
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        request-id: |-
            An optional request ID to identify requests. Specify a unique request ID
            so that if you must retry your request, the server will know to ignore
            the request if it has already been completed. The server will guarantee
            that for at least 60 minutes since the first request.
            +
            For example, consider a situation where you make an initial request and t
            he request times out. If you make the request again with the same request
            ID, the server can check if original operation with the same request ID
            was received, and if so, will ignore the second request. This prevents
            clients from accidentally creating duplicate commitments.
            +
            The request ID must be a valid UUID with the exception that zero UUID is
            not supported (00000000-0000-0000-0000-000000000000).
        service-account: |-
            ID of the serviceAccount or fully qualified identifier for the serviceAccount.
            +
            To set the `service-account` attribute:
            * provide the argument `--service-account` on the command line.
        source-parallelstore-path: |-
            Root directory path to the Paralellstore filesystem, starting with `/`.
            Defaults to `/` if unset.
