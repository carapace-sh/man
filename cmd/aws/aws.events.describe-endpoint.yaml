name: describe-endpoint
description: Get the information about an existing global endpoint.
flags:
    --home-region=: The primary Region of the endpoint you want to get information about.
    --name=!: The name of the endpoint you want to get information about.
documentation:
    command: Get the information about an existing global endpoint. For more information about global endpoints, see [Making applications Regional-fault tolerant with global endpoints and event replication](https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-global-endpoints.html) in the *Amazon EventBridge User Guide* .
    flag:
        home-region: 'The primary Region of the endpoint you want to get information about. For example `"HomeRegion": "us-east-1"`.'
        name: The name of the endpoint you want to get information about. For example, `"Name":"us-east-2-custom_bus_A-endpoint"`.
