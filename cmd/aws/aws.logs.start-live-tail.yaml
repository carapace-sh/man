name: start-live-tail
description: Starts a Live Tail streaming session for one or more log groups.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --log-event-filter-pattern=: An optional pattern to use to filter the results to include only log events that match the pattern.
    --log-group-identifiers=!: An array where each item in the array is a log group to include in the Live Tail session.
    --log-stream-name-prefixes=: If you specify this parameter, then only log events in the log streams that have names that start with the prefixes that you specify here are included in the Live Tail session.
    --log-stream-names=: If you specify this parameter, then only log events in the log streams that you specify here are included in the Live Tail session.
documentation:
    command: "Starts a Live Tail streaming session for one or more log groups. A Live Tail session returns a stream of log events that have been recently ingested in the log groups. For more information, see [Use Live Tail to view logs in near real time](https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatchLogs_LiveTail.html).\n\nThe response to this operation is a response stream, over which the server sends live log events and the client receives them.\n\nThe following objects are sent over the stream:\n\n- A single [LiveTailSessionStart](https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_LiveTailSessionStart.html) object is sent at the start of the session.\n- Every second, a [LiveTailSessionUpdate](https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_LiveTailSessionUpdate.html) object is sent. Each of these objects contains an array of the actual log events.\n  \n  If no new log events were ingested in the past second, the `LiveTailSessionUpdate` object will contain an empty array.\n  \n  The array of log events contained in a `LiveTailSessionUpdate` can include as many as 500 log events. If the number of log events matching the request exceeds 500 per second, the log events are sampled down to 500 log events to be included in each `LiveTailSessionUpdate` object.\n  \n  If your client consumes the log events slower than the server produces them, CloudWatch Logs buffers up to 10 `LiveTailSessionUpdate` events or 5000 log events, after which it starts dropping the oldest events.\n- A [SessionStreamingException](https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_StartLiveTailResponseStream.html#CWL-Type-StartLiveTailResponseStream-SessionStreamingException) object is returned if an unknown error occurs on the server side.\n- A [SessionTimeoutException](https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_StartLiveTailResponseStream.html#CWL-Type-StartLiveTailResponseStream-SessionTimeoutException) object is returned when the session times out, after it has been kept open for three hours.\n\nThe `StartLiveTail` API routes requests to `streaming-logs.Region.amazonaws.com` using SDK host prefix injection. VPC endpoint support is not available for this API.\n\nYou can end a session before it times out by closing the session stream or by closing the client that is receiving the stream. The session also ends if the established connection between the client and the server breaks.\n\nFor examples of using an SDK to start a Live Tail session, see [Start a Live Tail session using an Amazon Web Services SDK](https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/example_cloudwatch-logs_StartLiveTail_section.html)."
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        log-event-filter-pattern: |-
            An optional pattern to use to filter the results to include only log events that match the pattern. For example, a filter pattern of `error 404` causes only log events that include both `error` and `404` to be included in the Live Tail stream.

            Regular expression filter patterns are supported.

            For more information about filter pattern syntax, see [Filter and Pattern Syntax](https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/FilterAndPatternSyntax.html).
        log-group-identifiers: |-
            An array where each item in the array is a log group to include in the Live Tail session.

            Specify each log group by its ARN.

            If you specify an ARN, the ARN can't end with an asterisk (\*).

            You can include up to 10 log groups.
        log-stream-name-prefixes: |-
            If you specify this parameter, then only log events in the log streams that have names that start with the prefixes that you specify here are included in the Live Tail session.

            If you specify this field, you can't also specify the `logStreamNames` field.

            You can specify this parameter only if you specify only one log group in `logGroupIdentifiers`.
        log-stream-names: |-
            If you specify this parameter, then only log events in the log streams that you specify here are included in the Live Tail session.

            If you specify this field, you can't also specify the `logStreamNamePrefixes` field.

            You can specify this parameter only if you specify only one log group in `logGroupIdentifiers`.
