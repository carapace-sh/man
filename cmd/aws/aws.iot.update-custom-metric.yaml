name: update-custom-metric
description: Updates a Device Defender detect custom metric.
flags:
    --display-name=!: Field represents a friendly name in the console for the custom metric, it doesn't have to be unique.
    --metric-name=!: The name of the custom metric.
documentation:
    command: |-
        Updates a Device Defender detect custom metric.

        Requires permission to access the [UpdateCustomMetric](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        display-name: Field represents a friendly name in the console for the custom metric, it doesn't have to be unique. Don't use this name as the metric identifier in the device metric report. Can be updated.
        metric-name: The name of the custom metric. Cannot be updated.
