name: describe-repository
description: Returns a `RepositoryDescription` object that contains detailed information about the requested repository.
flags:
    --domain-owner=: The 12-digit account number of the Amazon Web Services account that owns the domain.
    --domain=!: The name of the domain that contains the repository to describe.
    --repository=!: A string that specifies the name of the requested repository.
documentation:
    command: Returns a `RepositoryDescription` object that contains detailed information about the requested repository.
    flag:
        domain: The name of the domain that contains the repository to describe.
        domain-owner: The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces.
        repository: A string that specifies the name of the requested repository.
