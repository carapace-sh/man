name: calculate-isolines
description: Use the `CalculateIsolines` action to find service areas that can be reached in a given threshold of time, distance.
flags:
    --allow=: Features that are allowed while calculating an isoline.
    --arrival-time=: Time of arrival at the destination.
    --avoid=: Features that are avoided while calculating a route.
    --depart-now=: Uses the current time as the time of departure.
    --departure-time=: Time of departure from thr origin.
    --destination-options=: Destination related options.
    --destination=: The final position for the route.
    --isoline-geometry-format=: The format of the returned IsolineGeometry.
    --isoline-granularity=: Defines the granularity of the returned Isoline.
    --key=: 'Optional: The API key to be used for authorization.'
    --optimize-isoline-for=: Specifies the optimization criteria for when calculating an isoline.
    --optimize-routing-for=: Specifies the optimization criteria for calculating a route.
    --origin-options=: Origin related options.
    --origin=: The start position for the route.
    --thresholds=!: Threshold to be used for the isoline calculation.
    --traffic=: Traffic related options.
    --travel-mode-options=: Travel mode related options for the provided travel mode.
    --travel-mode=: Specifies the mode of transport when calculating a route.
completion:
    flag:
        isoline-geometry-format:
            - FlexiblePolyline
            - Simple
        optimize-isoline-for:
            - AccurateCalculation
            - BalancedCalculation
            - FastCalculation
        optimize-routing-for:
            - FastestRoute
            - ShortestRoute
        travel-mode:
            - Car
            - Pedestrian
            - Scooter
            - Truck
documentation:
    command: Use the `CalculateIsolines` action to find service areas that can be reached in a given threshold of time, distance.
    flag:
        allow: Features that are allowed while calculating an isoline.
        arrival-time: |-
            Time of arrival at the destination.

            Time format: `YYYY-MM-DDThh:mm:ss.sssZ | YYYY-MM-DDThh:mm:ss.sss+hh:mm`

            Examples:

            `2020-04-22T17:57:24Z`

            `2020-04-22T17:57:24+02:00`
        avoid: Features that are avoided while calculating a route. Avoidance is on a best-case basis. If an avoidance can't be satisfied for a particular case, it violates the avoidance and the returned response produces a notice for the violation.
        depart-now: Uses the current time as the time of departure.
        departure-time: |-
            Time of departure from thr origin.

            Time format:`YYYY-MM-DDThh:mm:ss.sssZ | YYYY-MM-DDThh:mm:ss.sss+hh:mm`

            Examples:

            `2020-04-22T17:57:24Z`

            `2020-04-22T17:57:24+02:00`
        destination: 'The final position for the route. In the World Geodetic System (WGS 84) format: `[longitude, latitude]`.'
        destination-options: Destination related options.
        isoline-geometry-format: |-
            The format of the returned IsolineGeometry.

            Default Value:`FlexiblePolyline`
        isoline-granularity: Defines the granularity of the returned Isoline.
        key: 'Optional: The API key to be used for authorization. Either an API key or valid SigV4 signature must be provided when making a request.'
        optimize-isoline-for: |-
            Specifies the optimization criteria for when calculating an isoline. AccurateCalculation generates an isoline of higher granularity that is more precise. FastCalculation generates an isoline faster by reducing the granularity, and in turn the quality of the isoline. BalancedCalculation generates an isoline by balancing between quality and performance.

            Default Value: `BalancedCalculation`
        optimize-routing-for: |-
            Specifies the optimization criteria for calculating a route.

            Default Value: `FastestRoute`
        origin: The start position for the route.
        origin-options: Origin related options.
        thresholds: |-
            Threshold to be used for the isoline calculation. Up to 3 thresholds per provided type can be requested.

            You incur a calculation charge for each threshold. Using a large amount of thresholds in a request can lead you to incur unexpected charges. See [Amazon Location's pricing page](https://docs.aws.amazon.com/location/latest/developerguide/routes-pricing.html%60) for more information.
        traffic: Traffic related options.
        travel-mode: |-
            Specifies the mode of transport when calculating a route. Used in estimating the speed of travel and road compatibility.

            The mode `Scooter` also applies to motorcycles, set to `Scooter` when wanted to calculate options for motorcycles.

            Default Value: `Car`
        travel-mode-options: Travel mode related options for the provided travel mode.
