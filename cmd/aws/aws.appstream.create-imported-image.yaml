name: create-imported-image
description: Creates a custom WorkSpaces Applications image by importing an EC2 AMI.
flags:
    --agent-software-version=: The version of the WorkSpaces Applications agent to use for the imported image.
    --app-catalog-config=:
        description: Configuration for the application catalog of the imported image.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: An optional description for the imported image.
    --display-name=: An optional display name for the imported image.
    --dry-run: When set to true, performs validation checks without actually creating the imported image.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --iam-role-arn=!: The ARN of the IAM role that allows WorkSpaces Applications to access your AMI.
    --name=!: A unique name for the imported image.
    --no-dry-run: When set to true, performs validation checks without actually creating the imported image.
    --runtime-validation-config=: Configuration for runtime validation of the imported image.
    --source-ami-id=!: The ID of the EC2 AMI to import.
    --tags=: The tags to apply to the imported image.
completion:
    flag:
        agent-software-version:
            - CURRENT_LATEST
            - ALWAYS_LATEST
documentation:
    command: Creates a custom WorkSpaces Applications image by importing an EC2 AMI. This allows you to use your own customized AMI to create WorkSpaces Applications images that support additional instance types beyond the standard stream.* instances.
    flag:
        agent-software-version: The version of the WorkSpaces Applications agent to use for the imported image. Choose CURRENT\_LATEST to use the agent version available at the time of import, or ALWAYS\_LATEST to automatically update to the latest agent version when new versions are released.
        app-catalog-config: Configuration for the application catalog of the imported image. This allows you to specify applications available for streaming, including their paths, icons, and launch parameters. This field contains sensitive data.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: An optional description for the imported image. The description must match approved regex patterns and can be up to 256 characters.
        display-name: An optional display name for the imported image. The display name must match approved regex patterns and can be up to 100 characters.
        dry-run: When set to true, performs validation checks without actually creating the imported image. Use this to verify your configuration before executing the actual import operation.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        iam-role-arn: The ARN of the IAM role that allows WorkSpaces Applications to access your AMI. The role must have permissions to modify image attributes and describe images, with a trust relationship allowing appstream.amazonaws.com to assume the role.
        name: A unique name for the imported image. The name must be between 1 and 100 characters and can contain letters, numbers, underscores, periods, and hyphens.
        runtime-validation-config: Configuration for runtime validation of the imported image. When specified, WorkSpaces Applications provisions an instance to test streaming functionality, which helps ensure the image is suitable for use.
        source-ami-id: The ID of the EC2 AMI to import. The AMI must meet specific requirements including Windows Server 2022 Full Base, UEFI boot mode, TPM 2.0 support, and proper drivers.
        tags: The tags to apply to the imported image. Tags help you organize and manage your WorkSpaces Applications resources.
