name: update-task-set
description: Modifies a task set.
flags:
    --cluster=!: The short name or full Amazon Resource Name (ARN) of the cluster that hosts the service that the task set is found in.
    --scale=!: A floating-point percentage of the desired number of tasks to place and keep running in the task set.
    --service=!: The short name or full Amazon Resource Name (ARN) of the service that the task set is found in.
    --task-set=!: The short name or full Amazon Resource Name (ARN) of the task set to update.
documentation:
    command: Modifies a task set. This is used when a service uses the `EXTERNAL` deployment controller type. For more information, see [Amazon ECS Deployment Types](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/deployment-types.html) in the *Amazon Elastic Container Service Developer Guide*.
    flag:
        cluster: The short name or full Amazon Resource Name (ARN) of the cluster that hosts the service that the task set is found in.
        scale: A floating-point percentage of the desired number of tasks to place and keep running in the task set.
        service: The short name or full Amazon Resource Name (ARN) of the service that the task set is found in.
        task-set: The short name or full Amazon Resource Name (ARN) of the task set to update.
