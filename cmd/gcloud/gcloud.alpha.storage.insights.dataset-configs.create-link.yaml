name: create-link
description: '*(ALPHA)*  Create a link to a BigQuery instance.'
flags:
    --location=: Insights supported Google Cloud location for the dataset-config.
documentation:
    command: |
        *(ALPHA)*  Create link to the customer BigQuery instance for Insights dataset config.
    flag:
        location: |-
            Insights supported Google Cloud location for the dataset-config.
            +
            To set the `location` attribute:
            * provide the argument `dataset_config` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
