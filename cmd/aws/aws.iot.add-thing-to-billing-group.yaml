name: add-thing-to-billing-group
description: Adds a thing to a billing group.
flags:
    --billing-group-arn=: The ARN of the billing group.
    --billing-group-name=: The name of the billing group.
    --thing-arn=: The ARN of the thing to be added to the billing group.
    --thing-name=: The name of the thing to be added to the billing group.
documentation:
    command: |-
        Adds a thing to a billing group.

        Requires permission to access the [AddThingToBillingGroup](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        billing-group-arn: The ARN of the billing group.
        billing-group-name: |-
            The name of the billing group.

            This call is asynchronous. It might take several seconds for the detachment to propagate.
        thing-arn: The ARN of the thing to be added to the billing group.
        thing-name: The name of the thing to be added to the billing group.
