name: list-tunnels
description: List all tunnels for an Amazon Web Services account.
flags:
    --max-results=: The maximum number of results to return at once.
    --next-token=: To retrieve the next set of results, the nextToken value from a previous response; otherwise null to receive the first set of results.
    --thing-name=: The name of the IoT thing associated with the destination device.
documentation:
    command: |-
        List all tunnels for an Amazon Web Services account. Tunnels are listed by creation time in descending order, newer tunnels will be listed before older tunnels.

        Requires permission to access the [ListTunnels](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        max-results: The maximum number of results to return at once.
        next-token: To retrieve the next set of results, the nextToken value from a previous response; otherwise null to receive the first set of results.
        thing-name: The name of the IoT thing associated with the destination device.
