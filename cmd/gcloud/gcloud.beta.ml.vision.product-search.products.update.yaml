name: update
description: '*(BETA)*  update a product.'
flags:
    --add-product-labels=: List of product labels to add.
    --clear-product-labels: Remove all product labels.
    --description=: An optional description of this product.
    --display-name=: The display name of this product.
    --location=: The location of product.
    --no-clear-product-labels&: Remove all product labels.
    --remove-product-labels=: List of product labels to remove.
documentation:
    command: '*(BETA)*  update a product.'
    flag:
        add-product-labels: |-
            List of product labels to add. If a label already exists, it is
            silently ignored.
            +
            For example, to add the product labels 'foo=baz' and 'baz=qux':
            +
                $ {command} --add-product-labels='foo=baz,baz=qux'
            +
            To change the product label 'foo=baz' to 'foo=qux':
            +
                $ {command} --remove-product-labels='foo=baz' --add-product-labels='foo-qux'
        clear-product-labels: |-
            Remove all product labels. If `--add-product-labels` is also specified, then
            `--clear-product-labels` is applied first.
            +
            For example, to remove all product labels:
            +
                $ {command} --clear-product-labels
            +
            To set the product labels to exactly "foo" and "baz":
            +
                $ {command} --clear-product-labels --add-product-labels='foo=bar,baz=qux'
        description: An optional description of this product. It can be up to 4096 characters long.
        display-name: |-
            The display name of this product. It must not be empty and can be up to 4096 characters
            long.
        location: |-
            The location of product.
            +
            To set the `location` attribute:
            * provide the argument `product` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-clear-product-labels: |
            Remove all product labels. If `--add-product-labels` is also specified, then
            `--clear-product-labels` is applied first.

            For example, to remove all product labels:

                $ {command} --clear-product-labels

            To set the product labels to exactly "foo" and "baz":

                $ {command} --clear-product-labels --add-product-labels='foo=bar,baz=qux'
        remove-product-labels: |-
            List of product labels to remove. If `--add-product-labels` is also
            specified, then `--remove-product-labels` is applied first. If a label does
            not exist it is silently ignored. Because each key can be associated
            with multiple values, both key and value need to be specified to
            remove the product label.
            +
            For example, to remove the product labels 'foo=baz' and 'baz=qux':
            +
                $ {command} --remove-product-labels='foo=baz,baz=qux'
