name: stop-inference-experiment
description: Stops an inference experiment.
flags:
    --desired-model-variants=: An array of `ModelVariantConfig` objects.
    --desired-state=: The desired state of the experiment after stopping.
    --model-variant-actions=!: Array of key-value pairs, with names of variants mapped to actions.
    --name=!: The name of the inference experiment to stop.
    --reason=: The reason for stopping the experiment.
completion:
    flag:
        desired-state:
            - Completed
            - Cancelled
documentation:
    command: Stops an inference experiment.
    flag:
        desired-model-variants: An array of `ModelVariantConfig` objects. There is one for each variant that you want to deploy after the inference experiment stops. Each `ModelVariantConfig` describes the infrastructure configuration for deploying the corresponding variant.
        desired-state: |-
            The desired state of the experiment after stopping. The possible states are the following:

            - `Completed`: The experiment completed successfully
            - `Cancelled`: The experiment was canceled
        model-variant-actions: |-
            Array of key-value pairs, with names of variants mapped to actions. The possible actions are the following:

            - `Promote` - Promote the shadow variant to a production variant
            - `Remove` - Delete the variant
            - `Retain` - Keep the variant as it is
        name: The name of the inference experiment to stop.
        reason: The reason for stopping the experiment.
