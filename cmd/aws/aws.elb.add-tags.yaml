name: add-tags
description: Adds the specified tags to the specified load balancer.
flags:
    --load-balancer-names=!: The name of the load balancer.
    --tags=!: The tags.
documentation:
    command: |-
        Adds the specified tags to the specified load balancer. Each load balancer can have a maximum of 10 tags.

        Each tag consists of a key and an optional value. If a tag with the same key is already associated with the load balancer, `AddTags` updates its value.

        For more information, see [Tag Your Classic Load Balancer](https://docs.aws.amazon.com/elasticloadbalancing/latest/classic/add-remove-tags.html) in the *Classic Load Balancers Guide*.
    flag:
        load-balancer-names: The name of the load balancer. You can specify one load balancer only.
        tags: The tags.
