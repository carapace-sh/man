documentation:
    command: '*(BETA)*  Create a new VPC spoke.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: Description of the spoke to create.
        exclude-export-ranges: |-
            Subnet IP address range(s) to hide from other VPC networks that are
                    connected through Network Connectivity Center.
        global: Indicates that the spoke is global.
        group: Group that the spoke will be part of. The group must already exist.
        hub: Hub that the spoke will attach to. The hub must already exist.
        include-export-ranges: |-
            Subnet IP address range(s) to export to other VPC networks that are
                    connected through Network Connectivity Center.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: A Google Cloud region. To see the names of regions, see [Viewing a list of available regions](https://cloud.google.com/compute/docs/regions-zones/viewing-regions-zones#viewing_a_list_of_available_regions).
        vpc-network: |-
            VPC network that the spoke provides connectivity to.
                  The resource must already exist.
