name: delete-subscriber
description: Deletes the subscription permission and all notification settings for accounts that are already enabled in Amazon Security Lake.
flags:
    --subscriber-id=!: A value created by Security Lake that uniquely identifies your `DeleteSubscriber` API request.
documentation:
    command: Deletes the subscription permission and all notification settings for accounts that are already enabled in Amazon Security Lake. When you run `DeleteSubscriber`, the subscriber will no longer consume data from Security Lake and the subscriber is removed. This operation deletes the subscriber and removes access to data in the current Amazon Web Services Region.
    flag:
        subscriber-id: A value created by Security Lake that uniquely identifies your `DeleteSubscriber` API request.
