name: list-queues
description: Retrieve a JSON array of up to twenty of your queues.
flags:
    --list-by=: Optional.
    --max-results=: Optional.
    --next-token=: Use this string, provided with the response to a previous request, to request the next batch of queues.
    --order=: Optional.
completion:
    flag:
        list-by:
            - NAME
            - CREATION_DATE
        order:
            - ASCENDING
            - DESCENDING
documentation:
    command: Retrieve a JSON array of up to twenty of your queues. This will return the queues themselves, not just a list of them. To retrieve the next twenty queues, use the nextToken string returned with the array.
    flag:
        list-by: Optional. When you request a list of queues, you can choose to list them alphabetically by NAME or chronologically by CREATION\_DATE. If you don't specify, the service will list them by creation date.
        max-results: Optional. Number of queues, up to twenty, that will be returned at one time.
        next-token: Use this string, provided with the response to a previous request, to request the next batch of queues.
        order: Optional. When you request lists of resources, you can specify whether they are sorted in ASCENDING or DESCENDING order. Default varies by resource.
