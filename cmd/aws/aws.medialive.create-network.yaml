name: create-network
description: Create as many Networks as you need.
flags:
    --ip-pools=: An array of IpPoolCreateRequests that identify a collection of IP addresses in your network that you want to reserve for use in MediaLive Anywhere.
    --name=: Specify a name that is unique in the AWS account.
    --request-id=: An ID that you assign to a create request.
    --routes=: An array of routes that MediaLive Anywhere needs to know about in order to route encoding traffic.
    --tags=: A collection of key-value pairs.
documentation:
    command: Create as many Networks as you need. You will associate one or more Clusters with each Network.Each Network provides MediaLive Anywhere with required information about the network in your organization that you are using for video encoding using MediaLive.
    flag:
        ip-pools: An array of IpPoolCreateRequests that identify a collection of IP addresses in your network that you want to reserve for use in MediaLive Anywhere. MediaLiveAnywhere uses these IP addresses for Push inputs (in both Bridge and NATnetworks) and for output destinations (only in Bridge networks). EachIpPoolUpdateRequest specifies one CIDR block.
        name: Specify a name that is unique in the AWS account. We recommend that you assign a name that hints at the type of traffic on the network. Names are case-sensitive.
        request-id: An ID that you assign to a create request. This ID ensures idempotency when creating resources.
        routes: An array of routes that MediaLive Anywhere needs to know about in order to route encoding traffic.
        tags: A collection of key-value pairs.
