name: create-image-pipeline
description: Creates a new image pipeline.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=!: Unique, case-sensitive identifier you provide to ensure idempotency of the request.
    --container-recipe-arn=: The Amazon Resource Name (ARN) of the container recipe that is used to configure images created by this container pipeline.
    --description=: The description of the image pipeline.
    --distribution-configuration-arn=: The Amazon Resource Name (ARN) of the distribution configuration that will be used to configure and distribute images created by this image pipeline.
    --enhanced-image-metadata-enabled: Collects additional information about the image being created, including the operating system (OS) version and package list.
    --execution-role=: The name or Amazon Resource Name (ARN) for the IAM role you create that grants Image Builder access to perform workflow actions.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --image-recipe-arn=: The Amazon Resource Name (ARN) of the image recipe that will be used to configure images created by this image pipeline.
    --image-scanning-configuration=: Contains settings for vulnerability scans.
    --image-tests-configuration=: The image test configuration of the image pipeline.
    --infrastructure-configuration-arn=!: The Amazon Resource Name (ARN) of the infrastructure configuration that will be used to build images created by this image pipeline.
    --logging-configuration=: Define logging configuration for the image build process.
    --name=!: The name of the image pipeline.
    --no-enhanced-image-metadata-enabled: Collects additional information about the image being created, including the operating system (OS) version and package list.
    --schedule=: The schedule of the image pipeline.
    --status=: The status of the image pipeline.
    --tags=: The tags of the image pipeline.
    --workflows=: Contains an array of workflow configuration objects.
completion:
    flag:
        status:
            - DISABLED
            - ENABLED
documentation:
    command: Creates a new image pipeline. Image pipelines enable you to automate the creation and distribution of images.
