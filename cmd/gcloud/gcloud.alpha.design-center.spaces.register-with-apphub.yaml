name: register-with-apphub
description: '*(ALPHA)*  Register deployed resources with an AppHub application using application or application template as source in a space.'
hidden: true
flags:
    --adc-application-uri=: The Application Design Center application URI to register the deployed resources with the AppHub application using Application Design Center application as source in the space.
    --apphub-application-uri=: AppHub application URI to register the deployed resource using application template as source in the space.
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The Cloud location for the space.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --tfstate-location=: Path to the Terraform state file (e.g., `terraform.tfstate`).
documentation:
    command: '*(ALPHA)*  Register deployed resources with an AppHub application using application or application template as source in a space'
    flag:
        adc-application-uri: 'The Application Design Center application URI to register the deployed resources with the AppHub application using Application Design Center application as source in the space. Format: `projects/{projectId}/locations/{locationId}/spaces/{spaceId}/applications/{applicationId}`'
        apphub-application-uri: 'AppHub application URI to register the deployed resource using application template as source in the space. Format: `projects/{projectId}/locations/{locationId}/applications/{applicationId}'
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The Cloud location for the space.
            +
            To set the `location` attribute:
            * provide the argument `space` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        tfstate-location: Path to the Terraform state file (e.g., `terraform.tfstate`).
