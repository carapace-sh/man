name: delete-detector
description: Deletes an Amazon GuardDuty detector that is specified by the detector ID.
flags:
    --detector-id=!: The unique ID of the detector that you want to delete.
documentation:
    command: Deletes an Amazon GuardDuty detector that is specified by the detector ID.
    flag:
        detector-id: |-
            The unique ID of the detector that you want to delete.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
