name: delete-mobile-device-access-override
description: Deletes the mobile device access override for the given WorkMail organization, user, and device.
flags:
    --device-id=!: The mobile device for which you delete the override.
    --organization-id=!: The WorkMail organization for which the access override will be deleted.
    --user-id=!: The WorkMail user for which you want to delete the override.
documentation:
    command: |-
        Deletes the mobile device access override for the given WorkMail organization, user, and device.

        Deleting already deleted and non-existing overrides does not produce an error. In those cases, the service sends back an HTTP 200 response with an empty HTTP body.
    flag:
        device-id: The mobile device for which you delete the override. `DeviceId` is case insensitive.
        organization-id: The WorkMail organization for which the access override will be deleted.
        user-id: |-
            The WorkMail user for which you want to delete the override. Accepts the following types of user identities:

            - User ID: `12345678-1234-1234-1234-123456789012` or `S-1-1-12-1234567890-123456789-123456789-1234`
            - Email address: `user@domain.tld`
            - User name: `user`
