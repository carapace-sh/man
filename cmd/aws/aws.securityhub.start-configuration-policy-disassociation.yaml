name: start-configuration-policy-disassociation
description: Disassociates a target account, organizational unit, or the root from a specified configuration.
flags:
    --configuration-policy-identifier=!: The Amazon Resource Name (ARN) of a configuration policy, the universally unique identifier (UUID) of a configuration policy, or a value of `SELF_MANAGED_SECURITY_HUB` for a self-managed configuration.
    --target=: The identifier of the target account, organizational unit, or the root to disassociate from the specified configuration.
documentation:
    command: Disassociates a target account, organizational unit, or the root from a specified configuration. When you disassociate a configuration from its target, the target inherits the configuration of the closest parent. If there’s no configuration to inherit, the target retains its settings but becomes a self-managed account. A target can be disassociated from a configuration policy or self-managed behavior. Only the Security Hub delegated administrator can invoke this operation from the home Region.
    flag:
        configuration-policy-identifier: The Amazon Resource Name (ARN) of a configuration policy, the universally unique identifier (UUID) of a configuration policy, or a value of `SELF_MANAGED_SECURITY_HUB` for a self-managed configuration.
        target: The identifier of the target account, organizational unit, or the root to disassociate from the specified configuration.
