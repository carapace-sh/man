name: export-auto-scaling-group-recommendations
description: Exports optimization recommendations for Amazon EC2 Auto Scaling groups.
flags:
    --account-ids=:
        description: The IDs of the Amazon Web Services accounts for which to export Amazon EC2 Auto Scaling group recommendations.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --fields-to-export=:
        description: The recommendations data to include in the export file.
        nargs: -1
    --file-format=: The format of the export file.
    --filters=:
        description: An array of objects to specify a filter that exports a more specific set of Amazon EC2 Auto Scaling group recommendations.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --include-member-accounts: Indicates whether to include recommendations for resources in all member accounts of the organization if your account is the management account of an organization.
    --no-include-member-accounts: Indicates whether to include recommendations for resources in all member accounts of the organization if your account is the management account of an organization.
    --recommendation-preferences=: An object to specify the preferences for the Amazon EC2 Auto Scaling group recommendations to export.
    --s3-destination-config=!: An object to specify the destination Amazon Simple Storage Service (Amazon S3) bucket name and key prefix for the export job.
completion:
    flag:
        file-format:
            - Csv
documentation:
    command: |-
        Exports optimization recommendations for Amazon EC2 Auto Scaling groups.

        Recommendations are exported in a comma-separated values (.csv) file, and its metadata in a JavaScript Object Notation (JSON) (.json) file, to an existing Amazon Simple Storage Service (Amazon S3) bucket that you specify. For more information, see [Exporting Recommendations](https://docs.aws.amazon.com/compute-optimizer/latest/ug/exporting-recommendations.html) in the *Compute Optimizer User Guide*.

        You can have only one Amazon EC2 Auto Scaling group export job in progress per Amazon Web Services Region.
    flag:
        account-ids: |-
            The IDs of the Amazon Web Services accounts for which to export Amazon EC2 Auto Scaling group recommendations.

            If your account is the management account of an organization, use this parameter to specify the member account for which you want to export recommendations.

            This parameter cannot be specified together with the include member accounts parameter. The parameters are mutually exclusive.

            Recommendations for member accounts are not included in the export if this parameter, or the include member accounts parameter, is omitted.

            You can specify multiple account IDs per request.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        fields-to-export: The recommendations data to include in the export file. For more information about the fields that can be exported, see [Exported files](https://docs.aws.amazon.com/compute-optimizer/latest/ug/exporting-recommendations.html#exported-files) in the *Compute Optimizer User Guide*.
        file-format: |-
            The format of the export file.

            The only export file format currently supported is `Csv`.
        filters: An array of objects to specify a filter that exports a more specific set of Amazon EC2 Auto Scaling group recommendations.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        include-member-accounts: |-
            Indicates whether to include recommendations for resources in all member accounts of the organization if your account is the management account of an organization.

            The member accounts must also be opted in to Compute Optimizer, and trusted access for Compute Optimizer must be enabled in the organization account. For more information, see [Compute Optimizer and Amazon Web Services Organizations trusted access](https://docs.aws.amazon.com/compute-optimizer/latest/ug/security-iam.html#trusted-service-access) in the *Compute Optimizer User Guide*.

            Recommendations for member accounts of the organization are not included in the export file if this parameter is omitted.

            This parameter cannot be specified together with the account IDs parameter. The parameters are mutually exclusive.

            Recommendations for member accounts are not included in the export if this parameter, or the account IDs parameter, is omitted.
        recommendation-preferences: An object to specify the preferences for the Amazon EC2 Auto Scaling group recommendations to export.
        s3-destination-config: |-
            An object to specify the destination Amazon Simple Storage Service (Amazon S3) bucket name and key prefix for the export job.

            You must create the destination Amazon S3 bucket for your recommendations export before you create the export job. Compute Optimizer does not create the S3 bucket for you. After you create the S3 bucket, ensure that it has the required permissions policy to allow Compute Optimizer to write the export file to it. If you plan to specify an object prefix when you create the export job, you must include the object prefix in the policy that you add to the S3 bucket. For more information, see [Amazon S3 Bucket Policy for Compute Optimizer](https://docs.aws.amazon.com/compute-optimizer/latest/ug/create-s3-bucket-policy-for-compute-optimizer.html) in the *Compute Optimizer User Guide*.
