name: get-canary
description: Retrieves complete information about one canary.
flags:
    --dry-run-id=: The DryRunId associated with an existing canary’s dry run.
    --name=!: The name of the canary that you want details for.
documentation:
    command: Retrieves complete information about one canary. You must specify the name of the canary that you want. To get a list of canaries and their names, use [DescribeCanaries](https://docs.aws.amazon.com/AmazonSynthetics/latest/APIReference/API_DescribeCanaries.html).
    flag:
        dry-run-id: The DryRunId associated with an existing canary’s dry run. You can use this DryRunId to retrieve information about the dry run.
        name: The name of the canary that you want details for.
