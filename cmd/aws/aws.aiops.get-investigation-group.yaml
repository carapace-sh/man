name: get-investigation-group
description: Returns the configuration information for the specified investigation group.
flags:
    --identifier=!: Specify either the name or the ARN of the investigation group that you want to view.
documentation:
    command: Returns the configuration information for the specified investigation group.
    flag:
        identifier: Specify either the name or the ARN of the investigation group that you want to view. This is used to set the name of the investigation group.
