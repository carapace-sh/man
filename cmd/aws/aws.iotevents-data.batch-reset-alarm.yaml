name: batch-reset-alarm
description: Resets one or more alarms.
flags:
    --reset-action-requests=!: The list of reset action requests.
documentation:
    command: Resets one or more alarms. The alarms return to the `NORMAL` state after you reset them.
    flag:
        reset-action-requests: The list of reset action requests. You can specify up to 10 requests per operation.
