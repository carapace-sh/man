name: update-mltransform
description: Updates an existing machine learning transform.
flags:
    --description=: A description of the transform.
    --glue-version=: This value determines which version of Glue this machine learning transform is compatible with.
    --max-capacity=: The number of Glue data processing units (DPUs) that are allocated to task runs for this transform.
    --max-retries=: The maximum number of times to retry a task for this transform after a task run fails.
    --name=: The unique name that you gave the transform when you created it.
    --number-of-workers=: The number of workers of a defined `workerType` that are allocated when this task runs.
    --parameters=: The configuration parameters that are specific to the transform type (algorithm) used.
    --role=: The name or Amazon Resource Name (ARN) of the IAM role with the required permissions.
    --timeout=: The timeout for a task run for this transform in minutes.
    --transform-id=!: A unique identifier that was generated when the transform was created.
    --worker-type=: The type of predefined worker that is allocated when this task runs.
completion:
    flag:
        worker-type:
            - Standard
            - G.1X
            - G.2X
            - G.025X
            - G.4X
            - G.8X
            - Z.2X
documentation:
    command: |-
        Updates an existing machine learning transform. Call this operation to tune the algorithm parameters to achieve better results.

        After calling this operation, you can call the `StartMLEvaluationTaskRun` operation to assess how well your new parameters achieved your goals (such as improving the quality of your machine learning transform, or making it more cost-effective).
    flag:
        description: A description of the transform. The default is an empty string.
        glue-version: This value determines which version of Glue this machine learning transform is compatible with. Glue 1.0 is recommended for most customers. If the value is not set, the Glue compatibility defaults to Glue 0.9. For more information, see [Glue Versions](https://docs.aws.amazon.com/glue/latest/dg/release-notes.html#release-notes-versions) in the developer guide.
        max-capacity: |-
            The number of Glue data processing units (DPUs) that are allocated to task runs for this transform. You can allocate from 2 to 100 DPUs; the default is 10. A DPU is a relative measure of processing power that consists of 4 vCPUs of compute capacity and 16 GB of memory. For more information, see the [Glue pricing page](https://aws.amazon.com/glue/pricing/).

            When the `WorkerType` field is set to a value other than `Standard`, the `MaxCapacity` field is set automatically and becomes read-only.
        max-retries: The maximum number of times to retry a task for this transform after a task run fails.
        name: The unique name that you gave the transform when you created it.
        number-of-workers: The number of workers of a defined `workerType` that are allocated when this task runs.
        parameters: The configuration parameters that are specific to the transform type (algorithm) used. Conditionally dependent on the transform type.
        role: The name or Amazon Resource Name (ARN) of the IAM role with the required permissions.
        timeout: The timeout for a task run for this transform in minutes. This is the maximum time that a task run for this transform can consume resources before it is terminated and enters `TIMEOUT` status. The default is 2,880 minutes (48 hours).
        transform-id: A unique identifier that was generated when the transform was created.
        worker-type: |-
            The type of predefined worker that is allocated when this task runs. Accepts a value of Standard, G.1X, or G.2X.

            - For the `Standard` worker type, each worker provides 4 vCPU, 16 GB of memory and a 50GB disk, and 2 executors per worker.
            - For the `G.1X` worker type, each worker provides 4 vCPU, 16 GB of memory and a 64GB disk, and 1 executor per worker.
            - For the `G.2X` worker type, each worker provides 8 vCPU, 32 GB of memory and a 128GB disk, and 1 executor per worker.
