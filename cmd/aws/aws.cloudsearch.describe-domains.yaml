name: describe-domains
description: Gets information about the search domains owned by this account.
flags:
    --domain-names=: The names of the domains you want to include in the response.
documentation:
    command: 'Gets information about the search domains owned by this account. Can be limited to specific domains. Shows all domains by default. To get the number of searchable documents in a domain, use the console or submit a `matchall` request to your domain''s search endpoint: `q=matchall&amp;q.parser=structured&amp;size=0`. For more information, see [Getting Information about a Search Domain](http://docs.aws.amazon.com/cloudsearch/latest/developerguide/getting-domain-info.html) in the *Amazon CloudSearch Developer Guide*.'
    flag:
        domain-names: The names of the domains you want to include in the response.
