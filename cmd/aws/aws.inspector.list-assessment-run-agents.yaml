name: list-assessment-run-agents
description: Lists the agents of the assessment runs that are specified by the ARNs of the assessment runs.
flags:
    --assessment-run-arn=!: The ARN that specifies the assessment run whose agents you want to list.
    --filter=: You can use this parameter to specify a subset of data to be included in the action's response.
    --max-results=: You can use this parameter to indicate the maximum number of items that you want in the response.
    --next-token=: You can use this parameter when paginating results.
documentation:
    command: Lists the agents of the assessment runs that are specified by the ARNs of the assessment runs.
    flag:
        assessment-run-arn: The ARN that specifies the assessment run whose agents you want to list.
        filter: |-
            You can use this parameter to specify a subset of data to be included in the action's response.

            For a record to match a filter, all specified filter attributes must match. When multiple values are specified for a filter attribute, any of the values can match.
        max-results: You can use this parameter to indicate the maximum number of items that you want in the response. The default value is 10. The maximum value is 500.
        next-token: You can use this parameter when paginating results. Set the value of this parameter to null on your first call to the **ListAssessmentRunAgents** action. Subsequent calls to the action fill **nextToken** in the request with the value of **NextToken** from the previous response to continue listing data.
