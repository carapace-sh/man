name: create-aiagent-version
description: Creates and Amazon Q in Connect AI Agent version.
flags:
    --ai-agent-id=!: The identifier of the Amazon Q in Connect AI Agent.
    --assistant-id=!: The identifier of the Amazon Q in Connect assistant.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --modified-time=: The modification time of the AI Agent should be tracked for version creation.
documentation:
    command: Creates and Amazon Q in Connect AI Agent version.
    flag:
        ai-agent-id: The identifier of the Amazon Q in Connect AI Agent.
        assistant-id: The identifier of the Amazon Q in Connect assistant. Can be either the ID or the ARN. URLs cannot contain the ARN.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If not provided, the Amazon Web Services SDK populates this field. For more information about idempotency, see [Making retries safe with idempotent APIs](http://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/)..
        modified-time: The modification time of the AI Agent should be tracked for version creation. This field should be specified to avoid version creation when simultaneous update to the underlying AI Agent are possible. The value should be the modifiedTime returned from the request to create or update an AI Agent so that version creation can fail if an update to the AI Agent post the specified modification time has been made.
