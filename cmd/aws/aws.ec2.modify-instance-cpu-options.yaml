name: modify-instance-cpu-options
description: By default, all vCPUs for the instance type are active when you launch an instance.
flags:
    --core-count=!: The number of CPU cores to activate for the specified instance.
    --dry-run: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response.
    --instance-id=!: The ID of the instance to update.
    --no-dry-run&: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response.
    --threads-per-core=!: The number of threads to run for each CPU core.
documentation:
    command: |-
        By default, all vCPUs for the instance type are active when you launch an instance. When you configure the number of active vCPUs for the instance, it can help you save on licensing costs and optimize performance. The base cost of the instance remains unchanged.

        The number of active vCPUs equals the number of threads per CPU core multiplied by the number of cores. The instance must be in a `Stopped` state before you make changes.

        Some instance type options do not support this capability. For more information, see [Supported CPU options](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/cpu-options-supported-instances-values.html) in the *Amazon EC2 User Guide*.
    flag:
        core-count: The number of CPU cores to activate for the specified instance.
        dry-run: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        instance-id: The ID of the instance to update.
        threads-per-core: The number of threads to run for each CPU core.
