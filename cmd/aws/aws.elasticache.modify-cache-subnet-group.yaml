name: modify-cache-subnet-group
description: Modifies an existing cache subnet group.
flags:
    --cache-subnet-group-description=: A description of the cache subnet group.
    --cache-subnet-group-name=!: The name for the cache subnet group.
    --subnet-ids=: The EC2 subnet IDs for the cache subnet group.
documentation:
    command: Modifies an existing cache subnet group.
    flag:
        cache-subnet-group-description: A description of the cache subnet group.
        cache-subnet-group-name: |-
            The name for the cache subnet group. This value is stored as a lowercase string.

            Constraints: Must contain no more than 255 alphanumeric characters or hyphens.

            Example: `mysubnetgroup`
        subnet-ids: The EC2 subnet IDs for the cache subnet group.
