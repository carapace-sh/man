name: get-metric-data-v2
description: Gets metric data from the specified Amazon Connect instance.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --end-time=!: The timestamp, in UNIX Epoch time format, at which to end the reporting interval for the retrieval of historical metrics data.
    --filters=!: The filters to apply to returned metrics.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --groupings=: The grouping applied to the metrics that are returned.
    --interval=: The interval period and timezone to apply to returned metrics.
    --max-results=: The maximum number of results to return per page.
    --metrics=!: The metrics to retrieve.
    --next-token=: The token for the next set of results.
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource.
    --start-time=!: The timestamp, in UNIX Epoch time format, at which to start the reporting interval for the retrieval of historical metrics data.
documentation:
    command: "Gets metric data from the specified Amazon Connect instance.\n\n`GetMetricDataV2` offers more features than [GetMetricData](https://docs.aws.amazon.com/connect/latest/APIReference/API_GetMetricData.html), the previous version of this API. It has new metrics, offers filtering at a metric level, and offers the ability to filter and group data by channels, queues, routing profiles, agents, and agent hierarchy levels. It can retrieve historical data for the last 3 months, at varying intervals. It does not support agent queues.\n\nFor a description of the historical metrics that are supported by `GetMetricDataV2` and `GetMetricData`, see [Metrics definitions](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html) in the *Amazon Connect Administrator Guide*.\n\nWhen you make a successful API request, you can expect the following metric values in the response:\n\n1. **Metric value is null**: The calculation cannot be performed due to divide by zero or insufficient data\n2. **Metric value is a number (including 0) of defined type**: The number provided is the calculation result\n3. **MetricResult list is empty**: The request cannot find any data in the system\n\nThe following guidelines can help you work with the API:\n\n- Each dimension in the metric response must contain a value\n- Each item in MetricResult must include all requested metrics\n- If the response is slow due to large result sets, try these approaches:\n  \n  - Narrow the time range of your request\n  - Add filters to reduce the amount of data returned"
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        end-time: The timestamp, in UNIX Epoch time format, at which to end the reporting interval for the retrieval of historical metrics data. The time must be later than the start time timestamp. It cannot be later than the current timestamp.
        filters: "The filters to apply to returned metrics. You can filter on the following resources:\n\n- Agents\n- Campaigns\n- Channels\n- Feature\n- Queues\n- Routing profiles\n- Routing step expression\n- User hierarchy groups\n\nAt least one filter must be passed from queues, routing profiles, agents, or user hierarchy groups.\n\nFor metrics for outbound campaigns analytics, you can also use campaigns to satisfy at least one filter requirement.\n\nTo filter by phone number, see [Create a historical metrics report](https://docs.aws.amazon.com/connect/latest/adminguide/create-historical-metrics-report.html) in the *Amazon Connect Administrator Guide*.\n\nNote the following limits:\n\n- **Filter keys**: A maximum of 5 filter keys are supported in a single request. Valid filter keys: `AGENT` | `AGENT_HIERARCHY_LEVEL_ONE` | `AGENT_HIERARCHY_LEVEL_TWO` | `AGENT_HIERARCHY_LEVEL_THREE` | `AGENT_HIERARCHY_LEVEL_FOUR` | `AGENT_HIERARCHY_LEVEL_FIVE` | `ANSWERING_MACHINE_DETECTION_STATUS` | `BOT_ID` | `BOT_ALIAS` | `BOT_VERSION` | `BOT_LOCALE` | `BOT_INTENT_NAME` | `CAMPAIGN` | `CAMPAIGN_DELIVERY_EVENT_TYPE` | `CAMPAIGN_EXCLUDED_EVENT_TYPE` | `CASE_TEMPLATE_ARN` | `CASE_STATUS` | `CHANNEL` | `contact/segmentAttributes/connect:Subtype` | `DISCONNECT_REASON` | `EVALUATION_FORM` | `EVALUATION_SECTION` | `EVALUATION_QUESTION` | `EVALUATION_SOURCE` | `FEATURE` | `FLOW_ACTION_ID` | `FLOW_TYPE` | `FLOWS_MODULE_RESOURCE_ID` | `FLOWS_NEXT_RESOURCE_ID` | `FLOWS_NEXT_RESOURCE_QUEUE_ID` | `FLOWS_OUTCOME_TYPE` | `FLOWS_RESOURCE_ID` | `FORM_VERSION` | `INITIATION_METHOD` | `INVOKING_RESOURCE_PUBLISHED_TIMESTAMP` | `INVOKING_RESOURCE_TYPE` | `PARENT_FLOWS_RESOURCE_ID` | `RESOURCE_PUBLISHED_TIMESTAMP` | `ROUTING_PROFILE` | `ROUTING_STEP_EXPRESSION` | `QUEUE` | `Q_CONNECT_ENABLED` |\n- **Filter values**: A maximum of 100 filter values are supported in a single request. VOICE, CHAT, and TASK are valid `filterValue` for the CHANNEL filter key. They do not count towards limitation of 100 filter values. For example, a GetMetricDataV2 request can filter by 50 queues, 35 agents, and 15 routing profiles for a total of 100 filter values, along with 3 channel filters.\n  \n  `contact_lens_conversational_analytics` is a valid filterValue for the `FEATURE` filter key. It is available only to contacts analyzed by Contact Lens conversational analytics.\n  \n  `connect:Chat`, `connect:SMS`, `connect:Telephony`, and `connect:WebRTC` are valid `filterValue` examples (not exhaustive) for the `contact/segmentAttributes/connect:Subtype filter` key.\n  \n  `ROUTING_STEP_EXPRESSION` is a valid filter key with a filter value up to 3000 length. This filter is case and order sensitive. JSON string fields must be sorted in ascending order and JSON array order should be kept as is.\n  \n  `Q_CONNECT_ENABLED`. TRUE and FALSE are the only valid filterValues for the `Q_CONNECT_ENABLED` filter key.\n  \n  - TRUE includes all contacts that had Amazon Q in Connect enabled as part of the flow.\n  - FALSE includes all contacts that did not have Amazon Q in Connect enabled as part of the flow\n  \n  This filter is available only for contact record-driven metrics.\n  \n  [Campaign](https://docs.aws.amazon.com/connect/latest/APIReference/API_connect-outbound-campaigns_Campaign.html) ARNs are valid `filterValues` for the `CAMPAIGN` filter key."
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        groupings: |-
            The grouping applied to the metrics that are returned. For example, when results are grouped by queue, the metrics returned are grouped by queue. The values that are returned apply to the metrics for each queue. They are not aggregated for all queues.

            If no grouping is specified, a summary of all metrics is returned.

            Valid grouping keys: `AGENT` | `AGENT_HIERARCHY_LEVEL_ONE` | `AGENT_HIERARCHY_LEVEL_TWO` | `AGENT_HIERARCHY_LEVEL_THREE` | `AGENT_HIERARCHY_LEVEL_FOUR` | `AGENT_HIERARCHY_LEVEL_FIVE` | `ANSWERING_MACHINE_DETECTION_STATUS` | `BOT_ID` | `BOT_ALIAS` | `BOT_VERSION` | `BOT_LOCALE` | `BOT_INTENT_NAME` | `CAMPAIGN` | `CAMPAIGN_DELIVERY_EVENT_TYPE` | `CAMPAIGN_EXCLUDED_EVENT_TYPE` | `CAMPAIGN_EXECUTION_TIMESTAMP` | `CASE_TEMPLATE_ARN` | `CASE_STATUS` | `CHANNEL` | `contact/segmentAttributes/connect:Subtype` | `DISCONNECT_REASON` | `EVALUATION_FORM` | `EVALUATION_SECTION` | `EVALUATION_QUESTION` | `EVALUATION_SOURCE` | `FLOWS_RESOURCE_ID` | `FLOWS_MODULE_RESOURCE_ID` | `FLOW_ACTION_ID` | `FLOW_TYPE` | `FLOWS_OUTCOME_TYPE` | `FORM_VERSION` | `INITIATION_METHOD` | `INVOKING_RESOURCE_PUBLISHED_TIMESTAMP` | `INVOKING_RESOURCE_TYPE` | `PARENT_FLOWS_RESOURCE_ID` | `Q_CONNECT_ENABLED` | `QUEUE` | `RESOURCE_PUBLISHED_TIMESTAMP` | `ROUTING_PROFILE` | `ROUTING_STEP_EXPRESSION`

            Type: Array of strings

            Array Members: Maximum number of 4 items

            Required: No
        interval: "The interval period and timezone to apply to returned metrics.\n\n- `IntervalPeriod`: An aggregated grouping applied to request metrics. Valid `IntervalPeriod` values are: `FIFTEEN_MIN` | `THIRTY_MIN` | `HOUR` | `DAY` | `WEEK` | `TOTAL`.\n  \n  For example, if `IntervalPeriod` is selected `THIRTY_MIN`, `StartTime` and `EndTime` differs by 1 day, then Amazon Connect returns 48 results in the response. Each result is aggregated by the THIRTY\\_MIN period. By default Amazon Connect aggregates results based on the `TOTAL` interval period.\n  \n  The following list describes restrictions on `StartTime` and `EndTime` based on which `IntervalPeriod` is requested.\n  \n  - `FIFTEEN_MIN`: The difference between `StartTime` and `EndTime` must be less than 3 days.\n  - `THIRTY_MIN`: The difference between `StartTime` and `EndTime` must be less than 3 days.\n  - `HOUR`: The difference between `StartTime` and `EndTime` must be less than 3 days.\n  - `DAY`: The difference between `StartTime` and `EndTime` must be less than 35 days.\n  - `WEEK`: The difference between `StartTime` and `EndTime` must be less than 35 days.\n  - `TOTAL`: The difference between `StartTime` and `EndTime` must be less than 35 days.\n- `TimeZone`: The timezone applied to requested metrics."
        max-results: The maximum number of results to return per page.
        metrics: |-
            The metrics to retrieve. Specify the name, groupings, and filters for each metric. The following historical metrics are available. For a description of each metric, see [Metrics definition](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html) in the *Amazon Connect Administrator Guide*.

            ABANDONMENT\_RATE

            Unit: Percent

            Valid groupings and filters: Queue, Channel, Routing Profile, Agent, Agent Hierarchy, Feature, contact/segmentAttributes/connect:Subtype, Q in Connect

            UI name: [Abandonment rate](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#abandonment-rate)

            AGENT\_ADHERENT\_TIME

            This metric is available only in Amazon Web Services Regions where [Forecasting, capacity planning, and scheduling](https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#optimization_region) is available.

            Unit: Seconds

            Valid groupings and filters: Queue, Channel, Routing Profile, Agent, Agent Hierarchy

            UI name: [Adherent time](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#adherent-time)

            AGENT\_ANSWER\_RATE

            Unit: Percent

            Valid groupings and filters: Queue, Channel, Routing Profile, Agent, Agent Hierarchy

            UI name: [Agent answer rate](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#agent-answer-rate)

            AGENT\_NON\_ADHERENT\_TIME

            Unit: Seconds

            Valid groupings and filters: Queue, Channel, Routing Profile, Agent, Agent Hierarchy

            UI name: [Non-adherent time](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#non-adherent-time)

            AGENT\_NON\_RESPONSE

            Unit: Count

            Valid groupings and filters: Queue, Channel, Routing Profile, Agent, Agent Hierarchy

            UI name: [Agent non-response](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#agent-non-response)

            AGENT\_NON\_RESPONSE\_WITHOUT\_CUSTOMER\_ABANDONS

            Unit: Count

            Valid groupings and filters: Queue, Channel, Routing Profile, Agent, Agent Hierarchy

            Data for this metric is available starting from October 1, 2023 0:00:00 GMT.

            UI name: [Agent non-response without customer abandons](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#agent-non-response-without-customer-abandons)

            AGENT\_OCCUPANCY

            Unit: Percentage

            Valid groupings and filters: Routing Profile, Agent, Agent Hierarchy

            UI name: [Occupancy](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#occupancy)

            AGENT\_SCHEDULE\_ADHERENCE

            This metric is available only in Amazon Web Services Regions where [Forecasting, capacity planning, and scheduling](https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#optimization_region) is available.

            Unit: Percent

            Valid groupings and filters: Queue, Channel, Routing Profile, Agent, Agent Hierarchy

            UI name: [Adherence](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#adherence)

            AGENT\_SCHEDULED\_TIME

            This metric is available only in Amazon Web Services Regions where [Forecasting, capacity planning, and scheduling](https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#optimization_region) is available.

            Unit: Seconds

            Valid groupings and filters: Queue, Channel, Routing Profile, Agent, Agent Hierarchy

            UI name: [Scheduled time](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#scheduled-time)

            AVG\_ABANDON\_TIME

            Unit: Seconds

            Valid groupings and filters: Queue, Channel, Routing Profile, Agent, Agent Hierarchy, Feature, contact/segmentAttributes/connect:Subtype, Q in Connect

            Valid metric filter key: `INITIATION_METHOD`

            UI name: [Average queue abandon time](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-queue-abandon-time)

            AVG\_ACTIVE\_TIME

            Unit: Seconds

            Valid groupings and filters: Queue, Channel, Routing Profile, Agent, Agent Hierarchy, Q in Connect

            UI name: [Average active time](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-active-time)

            AVG\_AFTER\_CONTACT\_WORK\_TIME

            Unit: Seconds

            Valid metric filter key: `INITIATION_METHOD`

            Valid groupings and filters: Queue, Channel, Routing Profile, Agent, Agent Hierarchy, Feature, contact/segmentAttributes/connect:Subtype, Q in Connect

            UI name: [Average after contact work time](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#after-contact-work-time)

            Feature is a valid filter but not a valid grouping.

            AVG\_AGENT\_CONNECTING\_TIME

            Unit: Seconds

            Valid metric filter key: `INITIATION_METHOD`. For now, this metric only supports the following as `INITIATION_METHOD`: `INBOUND` | `OUTBOUND` | `CALLBACK` | `API`

            Valid groupings and filters: Queue, Channel, Routing Profile, Agent, Agent Hierarchy

            UI name: [Average agent API connecting time](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-agent-api-connecting-time)

            The `Negate` key in metric-level filters is not applicable for this metric.

            AVG\_AGENT\_PAUSE\_TIME

            Unit: Seconds

            Valid groupings and filters: Queue, Channel, Routing Profile, Agent, Agent Hierarchy, Q in Connect

            UI name: [Average agent pause time](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-agent-pause-time)

            AVG\_BOT\_CONVERSATION\_TIME

            Unit: Seconds

            Valid groupings and filters: Channel, contact/segmentAttributes/connect:Subtype, Bot ID, Bot alias, Bot version, Bot locale, Flows resource ID, Flows module resource ID, Flow type, Flow action ID, Invoking resource published timestamp, Initiation method, Invoking resource type, Parent flows resource ID

            UI name: [Average bot conversation time](https://docs.aws.amazon.com/connect/latest/adminguide/bot-metrics.html#average-bot-conversation-time)

            AVG\_BOT\_CONVERSATION\_TURNS

            Unit: Count

            Valid groupings and filters: Channel, contact/segmentAttributes/connect:Subtype, Bot ID, Bot alias, Bot version, Bot locale, Flows resource ID, Flows module resource ID, Flow type, Flow action ID, Invoking resource published timestamp, Initiation method, Invoking resource type, Parent flows resource ID

            UI name: [Average bot conversation turns](https://docs.aws.amazon.com/connect/latest/adminguide/bot-metrics.html#average-bot-conversation-turns)

            AVG\_CASE\_RELATED\_CONTACTS

            Unit: Count

            Required filter key: CASE\_TEMPLATE\_ARN

            Valid groupings and filters: CASE\_TEMPLATE\_ARN, CASE\_STATUS

            UI name: [Average contacts per case](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-contacts-per-case)

            AVG\_CASE\_RESOLUTION\_TIME

            Unit: Seconds

            Required filter key: CASE\_TEMPLATE\_ARN

            Valid groupings and filters: CASE\_TEMPLATE\_ARN, CASE\_STATUS

            UI name: [Average case resolution time](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-case-resolution-time)

            AVG\_CONTACT\_DURATION

            Unit: Seconds

            Valid groupings and filters: Queue, Channel, Routing Profile, Agent, Agent Hierarchy, Feature, contact/segmentAttributes/connect:Subtype, Q in Connect

            UI name: [Average contact duration](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-contact-duration)

            Feature is a valid filter but not a valid grouping.

            AVG\_CONTACT\_FIRST\_RESPONSE\_TIME\_AGENT

            Unit: Seconds

            Valid groupings and filters: Agent, Agent Hierarchy, Channel, contact/segmentAttributes/connect:Subtype, Disconnect Reason, Feature, RoutingStepExpression, Initiation method, Routing Profile, Queue, Q in Connect

            UI name: [Agent average contact first response wait time](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#agent-average-contact-first-response-wait-time)

            AVG\_CONVERSATION\_CLOSE\_TIME

            Unit: Seconds

            Valid groupings and filters: Agent, Agent Hierarchy, Channel, contact/segmentAttributes/connect:Subtype, Disconnect Reason, Feature, RoutingStepExpression, Initiation method, Routing Profile, Queue, Q in Connect

            UI name: [Average conversation close time](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-conversation-close-time)

            AVG\_CONVERSATION\_DURATION

            Unit: Seconds

            Valid groupings and filters: Queue, Channel, Routing Profile, Agent, Agent Hierarchy, Feature, contact/segmentAttributes/connect:Subtype, Q in Connect

            UI name: [Average conversation duration](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-conversation-duration)

            AVG\_DIALS\_PER\_MINUTE

            This metric is available only for outbound campaigns that use the agent assisted voice and automated voice delivery modes.

            Unit: Count

            Valid groupings and filters: Agent, Campaign, Queue, Routing Profile

            UI name: [Average dials per minute](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-dials-per-minute)

            AVG\_EVALUATION\_SCORE

            Unit: Percent

            Valid groupings and filters: Agent, Agent Hierarchy, Channel, Evaluation Form ID, Evaluation Section ID, Evaluation Question ID, Evaluation Source, Form Version, Queue, Routing Profile

            UI name: [Average evaluation score](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-evaluation-score)

            AVG\_FIRST\_RESPONSE\_TIME\_AGENT

            Unit: Seconds

            Valid groupings and filters: Agent, Agent Hierarchy, Channel, contact/segmentAttributes/connect:Subtype, Disconnect Reason, Feature, RoutingStepExpression, Initiation method, Routing Profile, Queue, Q in Connect

            UI name: [Average agent first response time](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-agent-first-response-time)

            AVG\_FLOW\_TIME

            Unit: Seconds

            Valid groupings and filters: Channel, contact/segmentAttributes/connect:Subtype, Flow type, Flows module resource ID, Flows next resource ID, Flows next resource queue ID, Flows outcome type, Flows resource ID, Initiation method, Resource published timestamp

            UI name: [Average flow time](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-flow-time)

            AVG\_GREETING\_TIME\_AGENT

            This metric is available only for contacts analyzed by Contact Lens conversational analytics.

            Unit: Seconds

            Valid groupings and filters: Queue, Channel, Routing Profile, Agent, Agent Hierarchy, contact/segmentAttributes/connect:Subtype, Q in Connect

            UI name: [Average agent greeting time](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-agent-greeting-time)

            AVG\_HANDLE\_TIME

            Unit: Seconds

            Valid groupings and filters: Queue, Channel, Routing Profile, Agent, Agent Hierarchy, Feature, contact/segmentAttributes/connect:Subtype, RoutingStepExpression

            UI name: [Average handle time](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-handle-time)

            Feature is a valid filter but not a valid grouping.

            AVG\_HOLD\_TIME

            Unit: Seconds

            Valid groupings and filters: Queue, Channel, Routing Profile, Agent, Agent Hierarchy, Feature, contact/segmentAttributes/connect:Subtype, Q in Connect

            UI name: [Average customer hold time](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-customer-hold-time)

            Feature is a valid filter but not a valid grouping.

            AVG\_HOLD\_TIME\_ALL\_CONTACTS

            Unit: Seconds

            Valid groupings and filters: Queue, Channel, Routing Profile, Agent, Agent Hierarchy, contact/segmentAttributes/connect:Subtype, Q in Connect

            UI name: [Average customer hold time all contacts](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-customer-hold-time-all-contacts)

            AVG\_HOLDS

            Unit: Count

            Valid groupings and filters: Queue, Channel, Routing Profile, Agent, Agent Hierarchy, Feature, contact/segmentAttributes/connect:Subtype, Q in Connect

            UI name: [Average holds](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-holds)

            Feature is a valid filter but not a valid grouping.

            AVG\_INTERACTION\_AND\_HOLD\_TIME

            Unit: Seconds

            Valid groupings and filters: Queue, Channel, Routing Profile, Agent, Agent Hierarchy, contact/segmentAttributes/connect:Subtype, Q in Connect

            UI name: [Average agent interaction and customer hold time](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-agent-interaction-and-customer-hold-time)

            AVG\_INTERACTION\_TIME

            Unit: Seconds

            Valid metric filter key: `INITIATION_METHOD`

            Valid groupings and filters: Queue, Channel, Routing Profile, Feature, contact/segmentAttributes/connect:Subtype, Q in Connect

            UI name: [Average agent interaction time](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-agent-interaction-time)

            Feature is a valid filter but not a valid grouping.

            AVG\_INTERRUPTIONS\_AGENT

            This metric is available only for contacts analyzed by Contact Lens conversational analytics.

            Unit: Count

            Valid groupings and filters: Queue, Channel, Routing Profile, Agent, Agent Hierarchy, contact/segmentAttributes/connect:Subtype, Q in Connect

            UI name: [Average agent interruptions](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-agent-interruptions)

            AVG\_INTERRUPTION\_TIME\_AGENT

            This metric is available only for contacts analyzed by Contact Lens conversational analytics.

            Unit: Seconds

            Valid groupings and filters: Queue, Channel, Routing Profile, Agent, Agent Hierarchy, contact/segmentAttributes/connect:Subtype, Q in Connect

            UI name: [Average agent interruption time](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-agent-interruption-time)

            AVG\_MESSAGE\_LENGTH\_AGENT

            Unit: Count

            Valid groupings and filters: Agent, Agent Hierarchy, Channel, contact/segmentAttributes/connect:Subtype, Disconnect Reason, Feature, RoutingStepExpression, Initiation method, Routing Profile, Queue, Q in Connect

            UI name: [Average agent message length](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-agent-message-length)

            AVG\_MESSAGE\_LENGTH\_CUSTOMER

            Unit: Count

            Valid groupings and filters: Agent, Agent Hierarchy, Channel, contact/segmentAttributes/connect:Subtype, Disconnect Reason, Feature, RoutingStepExpression, Initiation method, Routing Profile, Queue, Q in Connect

            UI name: [Average customer message length](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-customer-message-length)

            AVG\_MESSAGES

            Unit: Count

            Valid groupings and filters: Agent, Agent Hierarchy, Channel, contact/segmentAttributes/connect:Subtype, Disconnect Reason, Feature, RoutingStepExpression, Initiation method, Routing Profile, Queue, Q in Connect

            UI name: [Average messages](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-messages)

            AVG\_MESSAGES\_AGENT

            Unit: Count

            Valid groupings and filters: Agent, Agent Hierarchy, Channel, contact/segmentAttributes/connect:Subtype, Disconnect Reason, Feature, RoutingStepExpression, Initiation method, Routing Profile, Queue, Q in Connect

            UI name: [Average agent messages](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-agent-messages)

            AVG\_MESSAGES\_BOT

            Unit: Count

            Valid groupings and filters: Agent, Agent Hierarchy, Channel, contact/segmentAttributes/connect:Subtype, Disconnect Reason, Feature, RoutingStepExpression, Initiation method, Routing Profile, Queue, Q in Connect

            UI name: [Average bot messages](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-bot-messages)

            AVG\_MESSAGES\_CUSTOMER

            Unit: Count

            Valid groupings and filters: Agent, Agent Hierarchy, Channel, contact/segmentAttributes/connect:Subtype, Disconnect Reason, Feature, RoutingStepExpression, Initiation method, Routing Profile, Queue, Q in Connect

            UI name: [Average customer messages](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-customer-messages)

            AVG\_NON\_TALK\_TIME

            This metric is available only for contacts analyzed by Contact Lens conversational analytics.

            Unit: Seconds

            Valid groupings and filters: Queue, Channel, Routing Profile, Agent, Agent Hierarchy, contact/segmentAttributes/connect:Subtype, Q in Connect

            UI name: [Average non-talk time](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-non-talk-time)

            AVG\_QUEUE\_ANSWER\_TIME

            Unit: Seconds

            Valid groupings and filters: Queue, Channel, Routing Profile, Feature, contact/segmentAttributes/connect:Subtype, Q in Connect

            UI name: [Average queue answer time](https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html#average-queue-answer-time)

            Valid metric level filters: `INITIATION_METHOD`, `FEATURE`, `DISCONNECT_REASON`

            Feature is a valid filter but not a valid grouping.

            AVG\_QUEUE\_ANSWER\_TIME\_CUSTOMER\_FIRST\_CALLBACK

