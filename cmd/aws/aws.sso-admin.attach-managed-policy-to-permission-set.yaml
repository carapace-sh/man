name: attach-managed-policy-to-permission-set
description: Attaches an Amazon Web Services managed policy ARN to a permission set.
flags:
    --instance-arn=!: The ARN of the IAM Identity Center instance under which the operation will be executed.
    --managed-policy-arn=!: The Amazon Web Services managed policy ARN to be attached to a permission set.
    --permission-set-arn=!: The ARN of the [PermissionSet]() that the managed policy should be attached to.
documentation:
    command: |-
        Attaches an Amazon Web Services managed policy ARN to a permission set.

        If the permission set is already referenced by one or more account assignments, you will need to call `ProvisionPermissionSet` after this operation. Calling `ProvisionPermissionSet` applies the corresponding IAM policy updates to all assigned accounts.
    flag:
        instance-arn: The ARN of the IAM Identity Center instance under which the operation will be executed. For more information about ARNs, see [Amazon Resource Names (ARNs) and Amazon Web Services Service Namespaces](/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference*.
        managed-policy-arn: The Amazon Web Services managed policy ARN to be attached to a permission set.
        permission-set-arn: The ARN of the [PermissionSet]() that the managed policy should be attached to.
