name: list-connections
description: Lists connections.
flags:
    --domain-identifier=!: The ID of the domain where you want to list connections.
    --environment-identifier=: The ID of the environment where you want to list connections.
    --max-results=: The maximum number of connections to return in a single call to ListConnections.
    --name=: The name of the connection.
    --next-token=: When the number of connections is greater than the default value for the MaxResults parameter, or if you explicitly specify a value for MaxResults that is less than the number of connections, the response includes a pagination token named NextToken.
    --project-identifier=: The ID of the project where you want to list connections.
    --scope=: The scope of the connection.
    --sort-by=: Specifies how you want to sort the listed connections.
    --sort-order=: Specifies the sort order for the listed connections.
    --type=: The type of connection.
completion:
    flag:
        scope:
            - DOMAIN
            - PROJECT
        sort-by:
            - NAME
        sort-order:
            - ASCENDING
            - DESCENDING
        type:
            - ATHENA
            - BIGQUERY
            - DATABRICKS
            - DOCUMENTDB
            - DYNAMODB
            - HYPERPOD
            - IAM
            - MYSQL
            - OPENSEARCH
            - ORACLE
            - POSTGRESQL
            - REDSHIFT
            - S3
            - SAPHANA
            - SNOWFLAKE
            - SPARK
            - SQLSERVER
            - TERADATA
            - VERTICA
            - WORKFLOWS_MWAA
            - AMAZON_Q
            - MLFLOW
documentation:
    command: Lists connections. In Amazon DataZone, a connection enables you to connect your resources (domains, projects, and environments) to external resources and services.
    flag:
        domain-identifier: The ID of the domain where you want to list connections.
        environment-identifier: The ID of the environment where you want to list connections.
        max-results: The maximum number of connections to return in a single call to ListConnections. When the number of connections to be listed is greater than the value of MaxResults, the response contains a NextToken value that you can use in a subsequent call to ListConnections to list the next set of connections.
        name: The name of the connection.
        next-token: When the number of connections is greater than the default value for the MaxResults parameter, or if you explicitly specify a value for MaxResults that is less than the number of connections, the response includes a pagination token named NextToken. You can specify this NextToken value in a subsequent call to ListConnections to list the next set of connections.
        project-identifier: The ID of the project where you want to list connections.
        scope: The scope of the connection.
        sort-by: Specifies how you want to sort the listed connections.
        sort-order: Specifies the sort order for the listed connections.
        type: The type of connection.
