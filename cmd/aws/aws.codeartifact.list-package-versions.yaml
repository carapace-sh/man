name: list-package-versions
description: Returns a list of [PackageVersionSummary](https://docs.aws.amazon.com/codeartifact/latest/APIReference/API_PackageVersionSummary.html) objects for package versions in a repository that match the request parameters.
flags:
    --domain-owner=: The 12-digit account number of the Amazon Web Services account that owns the domain.
    --domain=!: The name of the domain that contains the repository that contains the requested package versions.
    --format=!: The format of the package versions you want to list.
    --max-results=: The maximum number of results to return per page.
    --namespace=: The namespace of the package that contains the requested package versions.
    --next-token=: The token for the next set of results.
    --origin-type=: The `originType` used to filter package versions.
    --package=!: The name of the package for which you want to request package versions.
    --repository=!: The name of the repository that contains the requested package versions.
    --sort-by=: How to sort the requested list of package versions.
    --status=: A string that filters the requested package versions by status.
completion:
    flag:
        format:
            - npm
            - pypi
            - maven
            - nuget
            - generic
            - ruby
            - swift
            - cargo
        origin-type:
            - INTERNAL
            - EXTERNAL
            - UNKNOWN
        sort-by:
            - PUBLISHED_TIME
        status:
            - Published
            - Unfinished
            - Unlisted
            - Archived
            - Disposed
            - Deleted
documentation:
    command: Returns a list of [PackageVersionSummary](https://docs.aws.amazon.com/codeartifact/latest/APIReference/API_PackageVersionSummary.html) objects for package versions in a repository that match the request parameters. Package versions of all statuses will be returned by default when calling `list-package-versions` with no `--status` parameter.
    flag:
        domain: The name of the domain that contains the repository that contains the requested package versions.
        domain-owner: The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces.
        format: The format of the package versions you want to list.
        max-results: The maximum number of results to return per page.
        namespace: |-
            The namespace of the package that contains the requested package versions. The package component that specifies its namespace depends on its type. For example:

            The namespace is required when deleting package versions of the following formats:

            - Maven
            - Swift
            - generic

            <!--THE END-->

            - The namespace of a Maven package version is its `groupId`.
            - The namespace of an npm or Swift package version is its `scope`.
            - The namespace of a generic package is its `namespace`.
            - Python, NuGet, Ruby, and Cargo package versions do not contain a corresponding component, package versions of those formats do not have a namespace.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        origin-type: The `originType` used to filter package versions. Only package versions with the provided `originType` will be returned.
        package: The name of the package for which you want to request package versions.
        repository: The name of the repository that contains the requested package versions.
        sort-by: How to sort the requested list of package versions.
        status: A string that filters the requested package versions by status.
