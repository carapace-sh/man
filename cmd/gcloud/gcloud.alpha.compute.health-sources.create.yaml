name: create
description: '*(ALPHA)*  Create a health source.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: A textual description of the HealthSource.
    --health-aggregation-policy=!: URL to the health aggregation policy resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: The name of the Google Compute Engine region.
    --source-type=: Specifies the type of the HealthSource.
    --sources=!: URLs to the source resources.
completion:
    flag:
        source-type:
            - backend-service
documentation:
    command: '*(ALPHA)*  Create a health source.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: A textual description of the HealthSource.
        health-aggregation-policy: |-
            URL to the health aggregation policy resource. Must be set. Must be
            regional and in the same region as the HealthSource. Can be mutated.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            The name of the Google Compute Engine region.
            +
            To set the `region` attribute:
            * provide the argument `health_source` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `compute/region`.
        source-type: |-
            Specifies the type of the HealthSource. The only allowed value is
            BACKEND_SERVICE. Must be specified when the HealthSource is created,
            and cannot be mutated. _SOURCE_TYPE_ must be (only one value is supported): *backend-service*.
        sources: |-
            URLs to the source resources. Must be size 1. Must be a BackendService
            if the sourceType is BACKEND_SERVICE. The BackendService must have load
            balancing scheme INTERNAL or INTERNAL_MANAGED and must be regional and
            in the same region as the HealthSource (cross-region deployment for
            INTERNAL_MANAGED is not supported). The BackendService may use only IGs,
            MIGs, or NEGs of type GCE_VM_IP or GCE_VM_IP_PORT. The BackendService
            may not use haPolicy. Can be mutated.
