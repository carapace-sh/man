name: create-node-registration-script
description: Create the Register Node script for all the nodes intended for a specific Cluster.
flags:
    --cluster-id=!: The ID of the cluster
    --id=: If you're generating a re-registration script for an already existing node, this is where you provide the id.
    --name=: Specify a pattern for MediaLive Anywhere to use to assign a name to each Node in the Cluster.
    --node-interface-mappings=: Documentation update needed
    --request-id=: An ID that you assign to a create request.
    --role=: The initial role of the Node in the Cluster.
completion:
    flag:
        role:
            - BACKUP
            - ACTIVE
documentation:
    command: Create the Register Node script for all the nodes intended for a specific Cluster. You will then run the script on each hardware unit that is intended for that Cluster. The script creates a Node in the specified Cluster. It then binds the Node to this hardware unit, and activates the node hardware for use with MediaLive Anywhere.
    flag:
        cluster-id: The ID of the cluster
        id: If you're generating a re-registration script for an already existing node, this is where you provide the id.
        name: Specify a pattern for MediaLive Anywhere to use to assign a name to each Node in the Cluster. The pattern can include the variables $hn (hostname of the node hardware) and $ts for the date and time that the Node is created, in UTC (for example, 2024-08-20T23:35:12Z).
        node-interface-mappings: Documentation update needed
        request-id: An ID that you assign to a create request. This ID ensures idempotency when creating resources.
        role: The initial role of the Node in the Cluster. ACTIVE means the Node is available for encoding. BACKUP means the Node is a redundant Node and might get used if an ACTIVE Node fails.
