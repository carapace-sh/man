name: create
description: '*(ALPHA)*  Create a Filestore snapshot.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --file-share=!: File share name on the Filestore instance to snapshot.
    --instance-zone=!: Zone of the Filestore instance.
    --instance=!: Share name of the Filestore instance you want to snapshot.
    --labels=: List of label KEY=VALUE pairs to add.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: Region (e.g. us-central1) for the regional snapshot.
documentation:
    command: |
        *(ALPHA)*  Take a Filestore snapshot of an instance file share.

        This command can fail for the following reasons:
          * An instance with the same name already exists.
          * The active account does not have permission to create snapshots.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        file-share: File share name on the Filestore instance to snapshot.
        instance: Share name of the Filestore instance you want to snapshot.
        instance-zone: Zone of the Filestore instance.
        labels: List of label KEY=VALUE pairs to add.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: Region (e.g. us-central1) for the regional snapshot.
