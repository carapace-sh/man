name: describe-workspace-configuration
description: Use this operation to return information about the configuration of a workspace.
flags:
    --workspace-id=!: The ID of the workspace that you want to retrieve information for.
documentation:
    command: Use this operation to return information about the configuration of a workspace. The configuration details returned include workspace configuration status, label set limits, and retention period.
    flag:
        workspace-id: The ID of the workspace that you want to retrieve information for. To find the IDs of your workspaces, use the [ListWorkspaces](https://docs.aws.amazon.com/prometheus/latest/APIReference/API_ListWorkspaces.htm) operation.
