name: update-managed-instance-role
description: Changes the Identity and Access Management (IAM) role that is assigned to the on-premises server, edge device, or virtual machines (VM).
flags:
    --iam-role=!: The name of the Identity and Access Management (IAM) role that you want to assign to the managed node.
    --instance-id=!: The ID of the managed node where you want to update the role.
documentation:
    command: Changes the Identity and Access Management (IAM) role that is assigned to the on-premises server, edge device, or virtual machines (VM). IAM roles are first assigned to these hybrid nodes during the activation process. For more information, see [CreateActivation]().
    flag:
        iam-role: |-
            The name of the Identity and Access Management (IAM) role that you want to assign to the managed node. This IAM role must provide AssumeRole permissions for the Amazon Web Services Systems Manager service principal `ssm.amazonaws.com`. For more information, see [Create the IAM service role required for Systems Manager in hybrid and multicloud environments](https://docs.aws.amazon.com/systems-manager/latest/userguide/hybrid-multicloud-service-role.html) in the *Amazon Web Services Systems Manager User Guide*.

            You can't specify an IAM service-linked role for this parameter. You must create a unique role.
        instance-id: The ID of the managed node where you want to update the role.
