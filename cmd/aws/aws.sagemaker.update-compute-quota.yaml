name: update-compute-quota
description: Update the compute allocation definition.
flags:
    --activation-state=: The state of the compute allocation being described.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --compute-quota-config=: Configuration of the compute allocation definition.
    --compute-quota-id=!: ID of the compute allocation definition.
    --compute-quota-target=: The target entity to allocate compute resources to.
    --description=: Description of the compute allocation definition.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --target-version=!: Target version.
completion:
    flag:
        activation-state:
            - Enabled
            - Disabled
documentation:
    command: Update the compute allocation definition.
    flag:
        activation-state: |-
            The state of the compute allocation being described. Use to enable or disable compute allocation.

            Default is `Enabled`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        compute-quota-config: Configuration of the compute allocation definition. This includes the resource sharing option, and the setting to preempt low priority tasks.
        compute-quota-id: ID of the compute allocation definition.
        compute-quota-target: The target entity to allocate compute resources to.
        description: Description of the compute allocation definition.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        target-version: Target version.
