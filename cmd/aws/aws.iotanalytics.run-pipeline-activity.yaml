name: run-pipeline-activity
description: Simulates the results of running a pipeline activity on a message payload.
flags:
    --payloads=!: The sample message payloads on which the pipeline activity is run.
    --pipeline-activity=!: The pipeline activity that is run.
documentation:
    command: Simulates the results of running a pipeline activity on a message payload.
    flag:
        payloads: The sample message payloads on which the pipeline activity is run.
        pipeline-activity: The pipeline activity that is run. This must not be a channel activity or a data store activity because these activities are used in a pipeline only to load the original message and to store the (possibly) transformed message. If a Lambda activity is specified, only short-running Lambda functions (those with a timeout of less than 30 seconds or less) can be used.
