name: wait
description: Poll a long-running Bare Metal Solution operation until it completes.
flags:
    --region=: Region of the resource.
documentation:
    command: |
        Poll a long-running Bare Metal Solution operation until it completes. When
        the operation is complete, this command will display the results of the
        operation.
    flag:
        region: |-
            Region of the resource.
            +
            To set the `region` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * global is the only supported location.
