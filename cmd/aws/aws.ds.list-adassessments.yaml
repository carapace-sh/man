name: list-adassessments
description: Retrieves a list of directory assessments for the specified directory or all assessments in your account.
flags:
    --directory-id=: The identifier of the directory for which to list assessments.
    --limit=: The maximum number of assessment summaries to return.
    --next-token=: The pagination token from a previous request to [ListADAssessments]().
documentation:
    command: Retrieves a list of directory assessments for the specified directory or all assessments in your account. Use this operation to monitor assessment status and manage multiple assessments.
    flag:
        directory-id: The identifier of the directory for which to list assessments. If not specified, all assessments in your account are returned.
        limit: The maximum number of assessment summaries to return.
        next-token: The pagination token from a previous request to [ListADAssessments](). Pass null if this is the first request.
