name: update-service-instance
description: Update a service instance.
flags:
    --client-token=: The client token of the service instance to update.
    --deployment-type=!: The deployment type.
    --name=!: The name of the service instance to update.
    --service-name=!: The name of the service that the service instance belongs to.
    --spec=: The formatted specification that defines the service instance update.
    --template-major-version=: The major version of the service template to update.
    --template-minor-version=: The minor version of the service template to update.
completion:
    flag:
        deployment-type:
            - NONE
            - CURRENT_VERSION
            - MINOR_VERSION
            - MAJOR_VERSION
documentation:
    command: |-
        Update a service instance.

        There are a few modes for updating a service instance. The `deploymentType` field defines the mode.

        You can't update a service instance while its deployment status, or the deployment status of a component attached to it, is `IN_PROGRESS`.

        For more information about components, see [Proton components](https://docs.aws.amazon.com/proton/latest/userguide/ag-components.html) in the *Proton User Guide*.
    flag:
        client-token: The client token of the service instance to update.
        deployment-type: |-
            The deployment type. It defines the mode for updating a service instance, as follows:

            `NONE`

            In this mode, a deployment *doesn't* occur. Only the requested metadata parameters are updated.

            `CURRENT_VERSION`

            In this mode, the service instance is deployed and updated with the new spec that you provide. Only requested parameters are updated. *Don’t* include major or minor version parameters when you use this deployment type.

            `MINOR_VERSION`

            In this mode, the service instance is deployed and updated with the published, recommended (latest) minor version of the current major version in use, by default. You can also specify a different minor version of the current major version in use.

            `MAJOR_VERSION`

            In this mode, the service instance is deployed and updated with the published, recommended (latest) major and minor version of the current template, by default. You can specify a different major version that's higher than the major version in use and a minor version.
        name: The name of the service instance to update.
        service-name: The name of the service that the service instance belongs to.
        spec: The formatted specification that defines the service instance update.
        template-major-version: The major version of the service template to update.
        template-minor-version: The minor version of the service template to update.
