name: update-cluster
description: Modifies the settings for a cluster.
flags:
    --aclname=: The Access Control List that is associated with the cluster.
    --cluster-name=!: The name of the cluster to update.
    --description=: The description of the cluster to update.
    --engine-version=: The upgraded version of the engine to be run on the nodes.
    --engine=: The name of the engine to be used for the cluster.
    --ip-discovery=: The mechanism for discovering IP addresses for the cluster discovery protocol.
    --maintenance-window=: Specifies the weekly time range during which maintenance on the cluster is performed.
    --node-type=: A valid node type that you want to scale this cluster up or down to.
    --parameter-group-name=: The name of the parameter group to update.
    --replica-configuration=: The number of replicas that will reside in each shard.
    --security-group-ids=: The SecurityGroupIds to update.
    --shard-configuration=: The number of shards in the cluster.
    --snapshot-retention-limit=: The number of days for which MemoryDB retains automatic cluster snapshots before deleting them.
    --snapshot-window=: The daily time range (in UTC) during which MemoryDB begins taking a daily snapshot of your cluster.
    --sns-topic-arn=: The SNS topic ARN to update.
    --sns-topic-status=: The status of the Amazon SNS notification topic.
completion:
    flag:
        ip-discovery:
            - ipv4
            - ipv6
documentation:
    command: Modifies the settings for a cluster. You can use this operation to change one or more cluster configuration settings by specifying the settings and the new values.
    flag:
        aclname: The Access Control List that is associated with the cluster.
        cluster-name: The name of the cluster to update.
        description: The description of the cluster to update.
        engine: The name of the engine to be used for the cluster.
        engine-version: The upgraded version of the engine to be run on the nodes. You can upgrade to a newer engine version, but you cannot downgrade to an earlier engine version. If you want to use an earlier engine version, you must delete the existing cluster and create it anew with the earlier engine version.
        ip-discovery: The mechanism for discovering IP addresses for the cluster discovery protocol. Valid values are 'ipv4' or 'ipv6'. When set to 'ipv4', cluster discovery functions such as cluster slots, cluster shards, and cluster nodes will return IPv4 addresses for cluster nodes. When set to 'ipv6', the cluster discovery functions return IPv6 addresses for cluster nodes. The value must be compatible with the NetworkType parameter. If not specified, the default is 'ipv4'.
        maintenance-window: |-
            Specifies the weekly time range during which maintenance on the cluster is performed. It is specified as a range in the format ddd:hh24:mi-ddd:hh24:mi (24H Clock UTC). The minimum maintenance window is a 60 minute period.

            Valid values for `ddd` are:

            - `sun`
            - `mon`
            - `tue`
            - `wed`
            - `thu`
            - `fri`
            - `sat`

            Example: `sun:23:00-mon:01:30`
        node-type: A valid node type that you want to scale this cluster up or down to.
        parameter-group-name: The name of the parameter group to update.
        replica-configuration: The number of replicas that will reside in each shard.
        security-group-ids: The SecurityGroupIds to update.
        shard-configuration: The number of shards in the cluster.
        snapshot-retention-limit: The number of days for which MemoryDB retains automatic cluster snapshots before deleting them. For example, if you set SnapshotRetentionLimit to 5, a snapshot that was taken today is retained for 5 days before being deleted.
        snapshot-window: The daily time range (in UTC) during which MemoryDB begins taking a daily snapshot of your cluster.
        sns-topic-arn: The SNS topic ARN to update.
        sns-topic-status: The status of the Amazon SNS notification topic. Notifications are sent only if the status is active.
