name: load
description: '*(BETA)*  Load a snapshot into the environment.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Region where Composer environment runs or in which to create the environment.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-skip-airflow-overrides-setting&: When specified, skips setting Airflow overrides from the snapshot.
    --no-skip-environment-variables-setting&: When specified, skips setting environment variables from the snapshot.
    --no-skip-gcs-data-copying&: When specified, skips copying dags, plugins and data folders from
    --no-skip-pypi-packages-installation&: When specified, skips the installation of custom PyPI packages from
    --skip-airflow-overrides-setting: When specified, skips setting Airflow overrides from the snapshot.
    --skip-environment-variables-setting: When specified, skips setting environment variables from the snapshot.
    --skip-gcs-data-copying: When specified, skips copying dags, plugins and data folders from
    --skip-pypi-packages-installation: When specified, skips the installation of custom PyPI packages from
    --snapshot-path=!: The Cloud Storage path to load the snapshot from.
documentation:
    command: '*(BETA)*  Load a snapshot into the environment.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            Region where Composer environment runs or in which to create the environment.
            +
            To set the `location` attribute:
            * provide the argument `environment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `composer/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-skip-airflow-overrides-setting: |
            When specified, skips setting Airflow overrides from the snapshot.
        no-skip-environment-variables-setting: |
            When specified, skips setting environment variables from the snapshot.
        no-skip-gcs-data-copying: |
            When specified, skips copying dags, plugins and data folders from
            the snapshot.
        no-skip-pypi-packages-installation: |
            When specified, skips the installation of custom PyPI packages from
            the snapshot.
        skip-airflow-overrides-setting: When specified, skips setting Airflow overrides from the snapshot.
        skip-environment-variables-setting: When specified, skips setting environment variables from the snapshot.
        skip-gcs-data-copying: |-
            When specified, skips copying dags, plugins and data folders from
            the snapshot.
        skip-pypi-packages-installation: |-
            When specified, skips the installation of custom PyPI packages from
            the snapshot.
        snapshot-path: The Cloud Storage path to load the snapshot from. It must start with prefix gs:// and one needs to specify a single snapshot that should be loaded.
