name: deregister-instance
description: Deletes the Amazon Route 53 DNS records and health check, if any, that Cloud Map created for the specified instance.
flags:
    --instance-id=!: The value that you specified for `Id` in the [RegisterInstance](https://docs.aws.amazon.com/cloud-map/latest/api/API_RegisterInstance.html) request.
    --service-id=!: The ID or Amazon Resource Name (ARN) of the service that the instance is associated with.
documentation:
    command: Deletes the Amazon Route 53 DNS records and health check, if any, that Cloud Map created for the specified instance.
    flag:
        instance-id: The value that you specified for `Id` in the [RegisterInstance](https://docs.aws.amazon.com/cloud-map/latest/api/API_RegisterInstance.html) request.
        service-id: The ID or Amazon Resource Name (ARN) of the service that the instance is associated with. If the namespace associated with the service is shared with your account, specify the service ARN. For more information about shared namespaces, see [Cross-account Cloud Map namespace sharing](https://docs.aws.amazon.com/cloud-map/latest/dg/sharing-namespaces.html) in the *Cloud Map Developer Guide*.
