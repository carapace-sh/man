name: remove-flow-output
description: Removes an output from an existing flow.
flags:
    --flow-arn=!: The Amazon Resource Name (ARN) of the flow that you want to remove an output from.
    --output-arn=!: The ARN of the output that you want to remove.
documentation:
    command: Removes an output from an existing flow. This request can be made only on an output that does not have an entitlement associated with it. If the output has an entitlement, you must revoke the entitlement instead. When an entitlement is revoked from a flow, the service automatically removes the associated output.
    flag:
        flow-arn: The Amazon Resource Name (ARN) of the flow that you want to remove an output from.
        output-arn: The ARN of the output that you want to remove.
