name: start-job-run
description: Starts a job run.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=!: The client idempotency token of the job run request.
    --configuration-overrides=: The configuration overrides for the job run.
    --execution-role-arn=: The execution role ARN for the job run.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --job-driver=: The job driver for the job run.
    --job-template-id=: The job template ID to be used to start the job run.
    --job-template-parameters=: The values of job template parameters to start a job run.
    --name=: The name of the job run.
    --release-label=: The Amazon EMR release version to use for the job run.
    --retry-policy-configuration=: The retry policy configuration for the job run.
    --tags=: The tags assigned to job runs.
    --virtual-cluster-id=!: The virtual cluster ID for which the job run request is submitted.
documentation:
    command: Starts a job run. A job run is a unit of work, such as a Spark jar, PySpark script, or SparkSQL query, that you submit to Amazon EMR on EKS.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: The client idempotency token of the job run request.
        configuration-overrides: The configuration overrides for the job run.
        execution-role-arn: The execution role ARN for the job run.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        job-driver: The job driver for the job run.
        job-template-id: The job template ID to be used to start the job run.
        job-template-parameters: The values of job template parameters to start a job run.
        name: The name of the job run.
        release-label: The Amazon EMR release version to use for the job run.
        retry-policy-configuration: The retry policy configuration for the job run.
        tags: The tags assigned to job runs.
        virtual-cluster-id: The virtual cluster ID for which the job run request is submitted.
