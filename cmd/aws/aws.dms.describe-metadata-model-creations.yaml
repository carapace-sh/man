name: describe-metadata-model-creations
description: Returns a paginated list of metadata model creation requests for a migration project.
flags:
    --filters=: Filters applied to the metadata model creation requests described in the form of key-value pairs.
    --marker=: Specifies the unique pagination token that makes it possible to display the next page of metadata model creation requests.
    --max-records=: The maximum number of metadata model creation requests to include in the response.
    --migration-project-identifier=!: The migration project name or Amazon Resource Name (ARN).
documentation:
    command: Returns a paginated list of metadata model creation requests for a migration project.
    flag:
        filters: Filters applied to the metadata model creation requests described in the form of key-value pairs. The supported filters are request-id and status.
        marker: Specifies the unique pagination token that makes it possible to display the next page of metadata model creation requests. If Marker is returned by a previous response, there are more metadata model creation requests available.
        max-records: The maximum number of metadata model creation requests to include in the response. If more requests exist than the specified MaxRecords value, a pagination token is provided in the response so that you can retrieve the remaining results.
        migration-project-identifier: The migration project name or Amazon Resource Name (ARN).
