name: get-history
description: '*(ALPHA)*  Get the update history of assets that overlaps a time window.'
flags:
    --asset-names=!: A list of full names of the assets to get the history for.
    --content-type=!: Asset content type.
    --end-time=: End time of the time window (exclusive) for the asset history.
    --organization=: The ID of the organization which is the root asset.
    --relationship-types=: A list of relationship types (i.e., "INSTANCE_TO_INSTANCEGROUP") to take a snapshot.
    --start-time=!: Start time of the time window (inclusive) for the asset history.
completion:
    flag:
        content-type:
            - resource
            - iam-policy
            - org-policy
            - access-policy
            - os-inventory
            - relationship
documentation:
    command: '*(ALPHA)*  Get the update history of assets that overlaps a time window.'
    flag:
        asset-names: 'A list of full names of the assets to get the history for. For more information, see: https://cloud.google.com/apis/design/resource_names#full_resource_name'
        content-type: 'Asset content type. Specifying `resource` will export resource metadata, specifying `iam-policy` will export the IAM policy for each child asset, specifying `org-policy` will export the Org Policy set on child assets, specifying `access-policy` will export the Access Policy set on child assets, specifying `os-inventory` will export the OS inventory of VM instances, and specifying `relationship` will export relationships of the assets. _CONTENT_TYPE_ must be one of: *resource*, *iam-policy*, *org-policy*, *access-policy*, *os-inventory*, *relationship*.'
        end-time: End time of the time window (exclusive) for the asset history. Defaults to current time if not specified. See $ gcloud topic datetimes for information on time formats.
        organization: The ID of the organization which is the root asset.
        relationship-types: A list of relationship types (i.e., "INSTANCE_TO_INSTANCEGROUP") to take a snapshot. This argument will only be honoured if content_type=RELATIONSHIP. If specified and non-empty, only relationships matching the specified types will be returned. See http://cloud.google.com/asset-inventory/docs/supported-asset-types for supported relationship types.
        start-time: Start time of the time window (inclusive) for the asset history. Must be after the current time minus 35 days. See $ gcloud topic datetimes for information on time formats.
