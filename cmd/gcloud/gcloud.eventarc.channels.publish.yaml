name: publish
description: Publish to an Eventarc channel.
hidden: true
flags:
    --event-attributes=: Event attributes.
    --event-data=!: An event data.
    --event-id=!: An event id.
    --event-source=!: An event source.
    --event-type=!: An event type.
    --location=: The location for the Eventarc channel, which should be either ``global'' or one of the supported regions.
documentation:
    command: Publish to an Eventarc channel.
    flag:
        event-attributes: Event attributes. The event attributes of a published event.This flag can be repeated to add more attributes.
        event-data: An event data. The event data of a published event.
        event-id: An event id. The id of a published event.
        event-source: An event source. The event source of a published event.
        event-type: An event type. The event type of a published event.
        location: |-
            The location for the Eventarc channel, which should be either ``global'' or one of the supported regions. Alternatively, set the [eventarc/location] property.
            +
            To set the `location` attribute:
            * provide the argument `channel` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `eventarc/location`.
