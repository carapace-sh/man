name: list-model-packages
description: Lists the model packages that have been created.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --creation-time-after=: A filter that returns only model packages created after the specified time (timestamp).
    --creation-time-before=: A filter that returns only model packages created before the specified time (timestamp).
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of model packages to return in the response.
    --model-approval-status=: A filter that returns only the model packages with the specified approval status.
    --model-package-group-name=: A filter that returns only model versions that belong to the specified model group.
    --model-package-type=: A filter that returns only the model packages of the specified type.
    --name-contains=: A string in the model package name.
    --next-token=: If the response to a previous `ListModelPackages` request was truncated, the response includes a `NextToken`.
    --page-size=: The size of each page to get in the AWS service call.
    --sort-by=: The parameter by which to sort the results.
    --sort-order=: The sort order for the results.
    --starting-token=: A token to specify where to start paginating.
completion:
    flag:
        model-approval-status:
            - Approved
            - Rejected
            - PendingManualApproval
        model-package-type:
            - Versioned
            - Unversioned
            - Both
        sort-by:
            - Name
            - CreationTime
        sort-order:
            - Ascending
            - Descending
documentation:
    command: Lists the model packages that have been created.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        creation-time-after: A filter that returns only model packages created after the specified time (timestamp).
        creation-time-before: A filter that returns only model packages created before the specified time (timestamp).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of model packages to return in the response.
        model-approval-status: A filter that returns only the model packages with the specified approval status.
        model-package-group-name: A filter that returns only model versions that belong to the specified model group.
        model-package-type: |-
            A filter that returns only the model packages of the specified type. This can be one of the following values.

            - `UNVERSIONED` - List only unversioined models. This is the default value if no `ModelPackageType` is specified.
            - `VERSIONED` - List only versioned models.
            - `BOTH` - List both versioned and unversioned models.
        name-contains: A string in the model package name. This filter returns only model packages whose name contains the specified string.
        next-token: If the response to a previous `ListModelPackages` request was truncated, the response includes a `NextToken`. To retrieve the next set of model packages, use the token in the next request.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        sort-by: The parameter by which to sort the results. The default is `CreationTime`.
        sort-order: The sort order for the results. The default is `Ascending`.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
