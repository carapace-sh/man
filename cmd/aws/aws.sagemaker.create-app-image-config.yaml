name: create-app-image-config
description: Creates a configuration for running a SageMaker AI image as a KernelGateway app.
flags:
    --app-image-config-name=!: The name of the AppImageConfig.
    --code-editor-app-image-config=: The `CodeEditorAppImageConfig`.
    --jupyter-lab-app-image-config=: The `JupyterLabAppImageConfig`.
    --kernel-gateway-image-config=: The KernelGatewayImageConfig.
    --tags=: A list of tags to apply to the AppImageConfig.
documentation:
    command: Creates a configuration for running a SageMaker AI image as a KernelGateway app. The configuration specifies the Amazon Elastic File System storage volume on the image, and a list of the kernels in the image.
    flag:
        app-image-config-name: The name of the AppImageConfig. Must be unique to your account.
        code-editor-app-image-config: The `CodeEditorAppImageConfig`. You can only specify one image kernel in the AppImageConfig API. This kernel is shown to users before the image starts. After the image runs, all kernels are visible in Code Editor.
        jupyter-lab-app-image-config: The `JupyterLabAppImageConfig`. You can only specify one image kernel in the `AppImageConfig` API. This kernel is shown to users before the image starts. After the image runs, all kernels are visible in JupyterLab.
        kernel-gateway-image-config: The KernelGatewayImageConfig. You can only specify one image kernel in the AppImageConfig API. This kernel will be shown to users before the image starts. Once the image runs, all kernels are visible in JupyterLab.
        tags: A list of tags to apply to the AppImageConfig.
