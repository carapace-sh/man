name: create-container-service
description: Creates an Amazon Lightsail container service.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --deployment=: An object that describes a deployment for the container service.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --power=!: The power specification for the container service.
    --private-registry-access=: An object to describe the configuration for the container service to access private container image repositories, such as Amazon Elastic Container Registry (Amazon ECR) private repositories.
    --public-domain-names=: The public domain names to use with the container service, such as `example.com` and `www.example.com`.
    --scale=!: The scale specification for the container service.
    --service-name=!: The name for the container service.
    --tags=: The tag keys and optional values to add to the container service during create.
completion:
    flag:
        power:
            - nano
            - micro
            - small
            - medium
            - large
            - xlarge
documentation:
    command: |-
        Creates an Amazon Lightsail container service.

        A Lightsail container service is a compute resource to which you can deploy containers. For more information, see [Container services in Amazon Lightsail](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-container-services) in the *Lightsail Dev Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        deployment: |-
            An object that describes a deployment for the container service.

            A deployment specifies the containers that will be launched on the container service and their settings, such as the ports to open, the environment variables to apply, and the launch command to run. It also specifies the container that will serve as the public endpoint of the deployment and its settings, such as the HTTP or HTTPS port to use, and the health check configuration.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        power: |-
            The power specification for the container service.

            The power specifies the amount of memory, vCPUs, and base monthly cost of each node of the container service. The `power` and `scale` of a container service makes up its configured capacity. To determine the monthly price of your container service, multiply the base price of the `power` with the `scale` (the number of nodes) of the service.

            Use the `GetContainerServicePowers` action to get a list of power options that you can specify using this parameter, and their base monthly cost.
        private-registry-access: |-
            An object to describe the configuration for the container service to access private container image repositories, such as Amazon Elastic Container Registry (Amazon ECR) private repositories.

            For more information, see [Configuring access to an Amazon ECR private repository for an Amazon Lightsail container service](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-container-service-ecr-private-repo-access) in the *Amazon Lightsail Developer Guide*.
        public-domain-names: |-
            The public domain names to use with the container service, such as `example.com` and `www.example.com`.

            You can specify up to four public domain names for a container service. The domain names that you specify are used when you create a deployment with a container configured as the public endpoint of your container service.

            If you don't specify public domain names, then you can use the default domain of the container service.

            You must create and validate an SSL/TLS certificate before you can use public domain names with your container service. Use the `CreateCertificate` action to create a certificate for the public domain names you want to use with your container service.

            You can specify public domain names using a string to array map as shown in the example later on this page.
        scale: |-
            The scale specification for the container service.

            The scale specifies the allocated compute nodes of the container service. The `power` and `scale` of a container service makes up its configured capacity. To determine the monthly price of your container service, multiply the base price of the `power` with the `scale` (the number of nodes) of the service.
        service-name: |-
            The name for the container service.

            The name that you specify for your container service will make up part of its default domain. The default domain of a container service is typically `https://<ServiceName>.<RandomGUID>.<AWSRegion>.cs.amazonlightsail.com`. If the name of your container service is `container-service-1`, and it's located in the US East (Ohio) Amazon Web Services Region (`us-east-2`), then the domain for your container service will be like the following example: `https://container-service-1.ur4EXAMPLE2uq.us-east-2.cs.amazonlightsail.com`

            The following are the requirements for container service names:

            - Must be unique within each Amazon Web Services Region in your Lightsail account.
            - Must contain 1 to 63 characters.
            - Must contain only alphanumeric characters and hyphens.
            - A hyphen (-) can separate words but cannot be at the start or end of the name.
        tags: |-
            The tag keys and optional values to add to the container service during create.

            Use the `TagResource` action to tag a resource after it's created.

            For more information about tags in Lightsail, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-tags).
