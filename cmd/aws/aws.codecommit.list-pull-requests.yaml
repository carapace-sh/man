name: list-pull-requests
description: Returns a list of pull requests for a specified repository.
flags:
    --author-arn=: Optional.
    --max-results=: A non-zero, non-negative integer used to limit the number of returned results.
    --next-token=: An enumeration token that, when provided in a request, returns the next batch of the results.
    --pull-request-status=: Optional.
    --repository-name=!: The name of the repository for which you want to list pull requests.
completion:
    flag:
        pull-request-status:
            - OPEN
            - CLOSED
documentation:
    command: Returns a list of pull requests for a specified repository. The return list can be refined by pull request status or pull request author ARN.
    flag:
        author-arn: Optional. The Amazon Resource Name (ARN) of the user who created the pull request. If used, this filters the results to pull requests created by that user.
        max-results: A non-zero, non-negative integer used to limit the number of returned results.
        next-token: An enumeration token that, when provided in a request, returns the next batch of the results.
        pull-request-status: Optional. The status of the pull request. If used, this refines the results to the pull requests that match the specified status.
        repository-name: The name of the repository for which you want to list pull requests.
