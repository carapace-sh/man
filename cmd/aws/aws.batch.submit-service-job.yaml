name: submit-service-job
description: Submits a service job to a specified job queue to run on SageMaker AI.
flags:
    --client-token=: A unique identifier for the request.
    --job-name=!: The name of the service job.
    --job-queue=!: The job queue into which the service job is submitted.
    --retry-strategy=: The retry strategy to use for failed service jobs that are submitted with this service job request.
    --scheduling-priority=: The scheduling priority of the service job.
    --service-job-type=!: The type of service job.
    --service-request-payload=!: The request, in JSON, for the service that the SubmitServiceJob operation is queueing.
    --share-identifier=: The share identifier for the service job.
    --tags=: The tags that you apply to the service job request.
    --timeout-config=: The timeout configuration for the service job.
completion:
    flag:
        service-job-type:
            - SAGEMAKER_TRAINING
documentation:
    command: Submits a service job to a specified job queue to run on SageMaker AI. A service job is a unit of work that you submit to Batch for execution on SageMaker AI.
    flag:
        client-token: A unique identifier for the request. This token is used to ensure idempotency of requests. If this parameter is specified and two submit requests with identical payloads and `clientToken`s are received, these requests are considered the same request and the second request is rejected.
        job-name: The name of the service job. It can be up to 128 characters long. It can contain uppercase and lowercase letters, numbers, hyphens (-), and underscores (\_).
        job-queue: The job queue into which the service job is submitted. You can specify either the name or the ARN of the queue. The job queue must have the type `SAGEMAKER_TRAINING`.
        retry-strategy: The retry strategy to use for failed service jobs that are submitted with this service job request.
        scheduling-priority: The scheduling priority of the service job. Valid values are integers between 0 and 9999.
        service-job-type: The type of service job. For SageMaker Training jobs, specify `SAGEMAKER_TRAINING`.
        service-request-payload: The request, in JSON, for the service that the SubmitServiceJob operation is queueing.
        share-identifier: The share identifier for the service job. Don't specify this parameter if the job queue doesn't have a fair-share scheduling policy. If the job queue has a fair-share scheduling policy, then this parameter must be specified.
        tags: The tags that you apply to the service job request. Each tag consists of a key and an optional value. For more information, see [Tagging your Batch resources](https://docs.aws.amazon.com/batch/latest/userguide/using-tags.html).
        timeout-config: The timeout configuration for the service job. If none is specified, Batch defers to the default timeout of the underlying service handling the job.
