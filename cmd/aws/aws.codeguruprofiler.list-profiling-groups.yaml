name: list-profiling-groups
description: Returns a list of profiling groups.
flags:
    --include-description: A `Boolean` value indicating whether to include a description.
    --max-results=: The maximum number of profiling groups results returned by `ListProfilingGroups` in paginated output.
    --next-token=: The `nextToken` value returned from a previous paginated `ListProfilingGroups` request where `maxResults` was used and the results exceeded the value of that parameter.
    --no-include-description&: A `Boolean` value indicating whether to include a description.
documentation:
    command: Returns a list of profiling groups. The profiling groups are returned as [`ProfilingGroupDescription`](https://docs.aws.amazon.com/codeguru/latest/profiler-api/API_ProfilingGroupDescription.html) objects.
    flag:
        include-description: A `Boolean` value indicating whether to include a description. If `true`, then a list of [`ProfilingGroupDescription`](https://docs.aws.amazon.com/codeguru/latest/profiler-api/API_ProfilingGroupDescription.html) objects that contain detailed information about profiling groups is returned. If `false`, then a list of profiling group names is returned.
        max-results: The maximum number of profiling groups results returned by `ListProfilingGroups` in paginated output. When this parameter is used, `ListProfilingGroups` only returns `maxResults` results in a single page along with a `nextToken` response element. The remaining results of the initial request can be seen by sending another `ListProfilingGroups` request with the returned `nextToken` value.
        next-token: |-
            The `nextToken` value returned from a previous paginated `ListProfilingGroups` request where `maxResults` was used and the results exceeded the value of that parameter. Pagination continues from the end of the previous results that returned the `nextToken` value.

            This token should be treated as an opaque identifier that is only used to retrieve the next items in a list and not for other programmatic purposes.
