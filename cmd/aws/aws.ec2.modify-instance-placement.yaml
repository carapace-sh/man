name: modify-instance-placement
description: Modifies the placement attributes for a specified instance.
flags:
    --affinity=: The affinity setting for the instance.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --group-id=: The Group Id of a placement group.
    --group-name=: The name of the placement group in which to place the instance.
    --host-id=: The ID of the Dedicated Host with which to associate the instance.
    --host-resource-group-arn=: The ARN of the host resource group in which to place the instance.
    --instance-id=!: The ID of the instance that you are modifying.
    --partition-number=: The number of the partition in which to place the instance.
    --tenancy=: The tenancy for the instance.
completion:
    flag:
        affinity:
            - default
            - host
        tenancy:
            - default
            - dedicated
            - host
documentation:
    command: |-
        Modifies the placement attributes for a specified instance. You can do the following:

        - Modify the affinity between an instance and a [Dedicated Host](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-hosts-overview.html). When affinity is set to `host` and the instance is not associated with a specific Dedicated Host, the next time the instance is started, it is automatically associated with the host on which it lands. If the instance is restarted or rebooted, this relationship persists.
        - Change the Dedicated Host with which an instance is associated.
        - Change the instance tenancy of an instance.
        - Move an instance to or from a [placement group](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/placement-groups.html).

        At least one attribute for affinity, host ID, tenancy, or placement group name must be specified in the request. Affinity and tenancy can be modified in the same request.

        To modify the host ID, tenancy, placement group, or partition for an instance, the instance must be in the `stopped` state.
    flag:
        affinity: The affinity setting for the instance. For more information, see [Host affinity](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/how-dedicated-hosts-work.html#dedicated-hosts-affinity) in the *Amazon EC2 User Guide*.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        group-id: The Group Id of a placement group. You must specify the Placement Group **Group Id** to launch an instance in a shared placement group.
        group-name: |-
            The name of the placement group in which to place the instance. For spread placement groups, the instance must have a tenancy of `default`. For cluster and partition placement groups, the instance must have a tenancy of `default` or `dedicated`.

            To remove an instance from a placement group, specify an empty string ("").
        host-id: The ID of the Dedicated Host with which to associate the instance.
        host-resource-group-arn: The ARN of the host resource group in which to place the instance. The instance must have a tenancy of `host` to specify this parameter.
        instance-id: The ID of the instance that you are modifying.
        partition-number: The number of the partition in which to place the instance. Valid only if the placement group strategy is set to `partition`.
        tenancy: |-
            The tenancy for the instance.

            For T3 instances, you must launch the instance on a Dedicated Host to use a tenancy of `host`. You can't change the tenancy from `host` to `dedicated` or `default`. Attempting to make one of these unsupported tenancy changes results in an `InvalidRequest` error code.
