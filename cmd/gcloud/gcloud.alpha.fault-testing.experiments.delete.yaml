name: delete
description: '*(ALPHA)*  Delete an experiment.'
hidden: true
flags:
    --force: Should always be set to true.
    --location=: The location id of the experiment resource.
    --no-force&: Should always be set to true.
documentation:
    command: |
        *(ALPHA)*  Delete an experiment
    flag:
        force: |-
            Should always be set to true. If set to true, any AffectedResources under
            this Experiment will also be deleted. (Otherwise, the request will only
            work if the Experiment has no AffectedResources.)
        location: |-
            The location id of the experiment resource.
            +
            To set the `location` attribute:
            * provide the argument `experiment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-force: |-
            Should always be set to true. If set to true, any AffectedResources under
            this Experiment will also be deleted. (Otherwise, the request will only
            work if the Experiment has no AffectedResources.)
