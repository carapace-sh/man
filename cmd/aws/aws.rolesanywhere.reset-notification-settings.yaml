name: reset-notification-settings
description: Resets the *custom notification setting* to IAM Roles Anywhere default setting.
flags:
    --notification-setting-keys=!: A list of notification setting keys to reset.
    --trust-anchor-id=!: The unique identifier of the trust anchor.
documentation:
    command: |-
        Resets the *custom notification setting* to IAM Roles Anywhere default setting.

        **Required permissions:** `rolesanywhere:ResetNotificationSettings`.
    flag:
        notification-setting-keys: A list of notification setting keys to reset. A notification setting key includes the event and the channel.
        trust-anchor-id: The unique identifier of the trust anchor.
