name: delete-dbcluster
description: The DeleteDBCluster action deletes a previously provisioned DB cluster.
flags:
    --dbcluster-identifier=!: The DB cluster identifier for the DB cluster to be deleted.
    --delete-automated-backups=: Specifies whether to remove automated backups immediately after the DB cluster is deleted.
    --final-dbsnapshot-identifier=: The DB cluster snapshot identifier of the new DB cluster snapshot created when `SkipFinalSnapshot` is disabled.
    --no-skip-final-snapshot: Specifies whether to skip the creation of a final DB cluster snapshot before RDS deletes the DB cluster.
    --skip-final-snapshot: Specifies whether to skip the creation of a final DB cluster snapshot before RDS deletes the DB cluster.
documentation:
    command: |-
        The DeleteDBCluster action deletes a previously provisioned DB cluster. When you delete a DB cluster, all automated backups for that DB cluster are deleted and can't be recovered. Manual DB cluster snapshots of the specified DB cluster are not deleted.

        If you're deleting a Multi-AZ DB cluster with read replicas, all cluster members are terminated and read replicas are promoted to standalone instances.

        For more information on Amazon Aurora, see [What is Amazon Aurora?](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_AuroraOverview.html) in the *Amazon Aurora User Guide*.

        For more information on Multi-AZ DB clusters, see [Multi-AZ DB cluster deployments](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/multi-az-db-clusters-concepts.html) in the *Amazon RDS User Guide*.
    flag:
        dbcluster-identifier: |-
            The DB cluster identifier for the DB cluster to be deleted. This parameter isn't case-sensitive.

            Constraints:

            - Must match an existing DBClusterIdentifier.
        delete-automated-backups: Specifies whether to remove automated backups immediately after the DB cluster is deleted. This parameter isn't case-sensitive. The default is to remove automated backups immediately after the DB cluster is deleted, unless the Amazon Web Services Backup policy specifies a point-in-time restore rule.
        final-dbsnapshot-identifier: |-
            The DB cluster snapshot identifier of the new DB cluster snapshot created when `SkipFinalSnapshot` is disabled.

            If you specify this parameter and also skip the creation of a final DB cluster snapshot with the `SkipFinalShapshot` parameter, the request results in an error.

            Constraints:

            - Must be 1 to 255 letters, numbers, or hyphens.
            - First character must be a letter
            - Can't end with a hyphen or contain two consecutive hyphens
        skip-final-snapshot: |-
            Specifies whether to skip the creation of a final DB cluster snapshot before RDS deletes the DB cluster. If you set this value to `true`, RDS doesn't create a final DB cluster snapshot. If you set this value to `false` or don't specify it, RDS creates a DB cluster snapshot before it deletes the DB cluster. By default, this parameter is disabled, so RDS creates a final DB cluster snapshot.

            If `SkipFinalSnapshot` is disabled, you must specify a value for the `FinalDBSnapshotIdentifier` parameter.
