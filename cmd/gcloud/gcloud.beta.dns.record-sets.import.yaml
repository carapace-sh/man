name: import
description: '*(BETA)*  Import record-sets into your managed-zone.'
flags:
    --delete-all-existing: Indicates that all existing record-sets should be deleted before importing the record-sets in the records-file.
    --location=: Specifies the desired service location the request is sent to.
    --no-delete-all-existing&: Indicates that all existing record-sets should be deleted before importing the record-sets in the records-file.
    --no-replace-origin-ns&: Indicates that NS records for the origin of a zone should be imported if defined
    --no-zone-file-format&: Indicates that the input records-file is in BIND zone format.
    --replace-origin-ns: Indicates that NS records for the origin of a zone should be imported if defined
    --zone-file-format: Indicates that the input records-file is in BIND zone format.
    --zone=!: Name of the managed zone whose record sets you want to manage.
documentation:
    command: |-
        *(BETA)*  This command imports record-sets contained within the specified record-sets
        file into your managed-zone. Note that NS records for the origin of the zone
        and the SOA NS field are not imported since name-servers are managed by
        Cloud DNS. By default, record-sets cannot be imported if there are any
        conflicts. A conflict exists if an existing record-set has the same name and
        type as a record-set that is being imported. In contrast, if the
        --delete-all-existing flag is used, the imported record-sets will replace all
        the records-sets currently in the managed-zone.

        ## EXAMPLES

        To import record-sets from a yaml record-sets file, run:

          $ gcloud beta dns record-sets import YAML_RECORDS_FILE --zone=MANAGED_ZONE

        To import record-sets from a zone file, run:

          $ gcloud beta dns record-sets import ZONE_FILE --zone-file-format --zone=MANAGED_ZONE

        To replace all the record-sets in your zone with records from a yaml
        file, run:

          $ gcloud beta dns record-sets import YAML_RECORDS_FILE --delete-all-existing --zone=MANAGED_ZONE
    flag:
        delete-all-existing: Indicates that all existing record-sets should be deleted before importing the record-sets in the records-file.
        location: Specifies the desired service location the request is sent to. Defaults to Cloud DNS global service. Use --location=global if you want to target the global service.
        no-delete-all-existing: Indicates that all existing record-sets should be deleted before importing the record-sets in the records-file.
        no-replace-origin-ns: Indicates that NS records for the origin of a zone should be imported if defined
        no-zone-file-format: Indicates that the input records-file is in BIND zone format. If omitted, indicates that the records-file is in YAML format.
        replace-origin-ns: Indicates that NS records for the origin of a zone should be imported if defined
        zone: Name of the managed zone whose record sets you want to manage.
        zone-file-format: Indicates that the input records-file is in BIND zone format. If omitted, indicates that the records-file is in YAML format.
