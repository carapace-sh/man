name: swap-environment-cnames
description: Swaps the CNAMEs of two environments.
flags:
    --destination-environment-id=: The ID of the destination environment.
    --destination-environment-name=: The name of the destination environment.
    --source-environment-id=: The ID of the source environment.
    --source-environment-name=: The name of the source environment.
documentation:
    command: Swaps the CNAMEs of two environments.
    flag:
        destination-environment-id: |-
            The ID of the destination environment.

            Condition: You must specify at least the `DestinationEnvironmentID` or the `DestinationEnvironmentName`. You may also specify both. You must specify the `SourceEnvironmentId` with the `DestinationEnvironmentId`.
        destination-environment-name: |-
            The name of the destination environment.

            Condition: You must specify at least the `DestinationEnvironmentID` or the `DestinationEnvironmentName`. You may also specify both. You must specify the `SourceEnvironmentName` with the `DestinationEnvironmentName`.
        source-environment-id: |-
            The ID of the source environment.

            Condition: You must specify at least the `SourceEnvironmentID` or the `SourceEnvironmentName`. You may also specify both. If you specify the `SourceEnvironmentId`, you must specify the `DestinationEnvironmentId`.
        source-environment-name: |-
            The name of the source environment.

            Condition: You must specify at least the `SourceEnvironmentID` or the `SourceEnvironmentName`. You may also specify both. If you specify the `SourceEnvironmentName`, you must specify the `DestinationEnvironmentName`.
