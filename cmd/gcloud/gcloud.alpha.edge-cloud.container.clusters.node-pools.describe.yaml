name: describe
description: '*(ALPHA)*  Show details about the nodePool.'
flags:
    --cluster=: Kubernetes cluster.
    --location=: The global location name.
documentation:
    command: '*(ALPHA)*  Show details about the nodePool.'
    flag:
        cluster: |-
            Kubernetes cluster.
            +
            To set the `cluster` attribute:
            * provide the argument `node_pool` on the command line with a fully specified name;
            * provide the argument `--cluster` on the command line.
        location: |-
            The global location name.
            +
            To set the `location` attribute:
            * provide the argument `node_pool` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `edge_container/location`.
