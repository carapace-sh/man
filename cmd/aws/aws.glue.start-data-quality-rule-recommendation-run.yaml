name: start-data-quality-rule-recommendation-run
description: Starts a recommendation run that is used to generate rules when you don't know what rules to write.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Used for idempotency and is recommended to be set to a random ID (such as a UUID) to avoid creating or starting multiple instances of the same resource.
    --created-ruleset-name=: A name for the ruleset.
    --data-quality-security-configuration=: The name of the security configuration created with the data quality encryption option.
    --data-source=!: The data source (Glue table) associated with this run.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --number-of-workers=: The number of `G.1X` workers to be used in the run.
    --role=!: An IAM role supplied to encrypt the results of the run.
    --timeout=: The timeout for a run in minutes.
documentation:
    command: |-
        Starts a recommendation run that is used to generate rules when you don't know what rules to write. Glue Data Quality analyzes the data and comes up with recommendations for a potential ruleset. You can then triage the ruleset and modify the generated ruleset to your liking.

        Recommendation runs are automatically deleted after 90 days.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Used for idempotency and is recommended to be set to a random ID (such as a UUID) to avoid creating or starting multiple instances of the same resource.
        created-ruleset-name: A name for the ruleset.
        data-quality-security-configuration: The name of the security configuration created with the data quality encryption option.
        data-source: The data source (Glue table) associated with this run.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        number-of-workers: The number of `G.1X` workers to be used in the run. The default is 5.
        role: An IAM role supplied to encrypt the results of the run.
        timeout: The timeout for a run in minutes. This is the maximum time that a run can consume resources before it is terminated and enters `TIMEOUT` status. The default is 2,880 minutes (48 hours).
