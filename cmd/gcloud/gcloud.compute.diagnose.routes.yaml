name: routes
description: Routes to/from Compute Engine virtual machine instances.
flags:
    --container=: The name or ID of a container inside of the virtual machine instance
    --dry-run: Print the equivalent scp/ssh command that would be run to stdout, instead of executing it.
    --external-route-ip=: For reverse traceroute, this will be the ip given to the VM instance to traceroute to.
    --force-key-file-overwrite: If enabled, the gcloud command-line tool will regenerate and overwrite
    --no-dry-run&: Print the equivalent scp/ssh command that would be run to stdout, instead of executing it.
    --no-force-key-file-overwrite&: If enabled, the gcloud command-line tool will regenerate and overwrite
    --no-plain&: Suppress the automatic addition of *ssh(1)*/*scp(1)* flags.
    --no-reverse-traceroute&: If enabled, will also run traceroute from the VM to the host
    --plain: Suppress the automatic addition of *ssh(1)*/*scp(1)* flags.
    --regexp=: Regular expression to filter the names of the results on.
    --reverse-traceroute: If enabled, will also run traceroute from the VM to the host
    --ssh-flag=: Additional flags to be passed to *ssh(1)*.
    --ssh-key-expiration=: The time when the ssh key will be valid until, such as
    --ssh-key-expire-after=: The maximum length of time an SSH key is valid for once created and
    --ssh-key-file=: The path to the SSH key file.
    --strict-host-key-checking=: Override the default behavior of StrictHostKeyChecking for the
    --user=: User for login to the selected VMs.
    --zones=: If provided, only resources from the given zones are queried.
completion:
    flag:
        strict-host-key-checking:
            - "yes"
            - "no"
            - ask
documentation:
    command: |-
        Routes to/from Compute Engine virtual machine instances.

        NOTE: The name filtering will cycle through all the VMs in the project.
        Depending on the size of the project, this could be a considerable amount
        of work.

        If that is the case, use the --regexp flag to filter down the amount
        of VMs considered in the filtering.
    flag:
        container: |-
            The name or ID of a container inside of the virtual machine instance
            to connect to. This only applies to virtual machines that are using
            a Container-Optimized OS virtual machine image.
            For more information, see
            [](https://cloud.google.com/compute/docs/containers)
        dry-run: Print the equivalent scp/ssh command that would be run to stdout, instead of executing it.
        external-route-ip: For reverse traceroute, this will be the ip given to the VM instance to traceroute to. This will override all obtained ips.
        force-key-file-overwrite: |-
            If enabled, the gcloud command-line tool will regenerate and overwrite
            the files associated with a broken SSH key without asking for
            confirmation in both interactive and non-interactive environments.
            +
            If disabled, the files associated with a broken SSH key will not be
            regenerated and will fail in both interactive and non-interactive
            environments.
        no-dry-run: Print the equivalent scp/ssh command that would be run to stdout, instead of executing it.
        no-force-key-file-overwrite: |-
            If enabled, the gcloud command-line tool will regenerate and overwrite
            the files associated with a broken SSH key without asking for
            confirmation in both interactive and non-interactive environments.

            If disabled, the files associated with a broken SSH key will not be
            regenerated and will fail in both interactive and non-interactive
            environments.
        no-plain: |
            Suppress the automatic addition of *ssh(1)*/*scp(1)* flags. This flag
            is useful if you want to take care of authentication yourself or
            use specific ssh/scp features.
        no-reverse-traceroute: If enabled, will also run traceroute from the VM to the host
        plain: |-
            Suppress the automatic addition of *ssh(1)*/*scp(1)* flags. This flag
            is useful if you want to take care of authentication yourself or
            use specific ssh/scp features.
        regexp: |-
            Regular expression to filter the names of the results on. Any names
            that do not match the entire regular expression will be filtered out.
        reverse-traceroute: If enabled, will also run traceroute from the VM to the host
        ssh-flag: |-
            Additional flags to be passed to *ssh(1)*. It is recommended that flags
            be passed using an assignment operator and quotes. This flag will
            replace occurences of ``%USER%'' and ``%INSTANCE%'' with their
            dereferenced values. Example:
            +
              $ {command} example-instance --zone us-central1-a           --ssh-flag="-vvv" --ssh-flag="-L 80:%INSTANCE%:80"
            +
            is equivalent to passing the flags ``--vvv'' and ``-L
            80:162.222.181.197:80'' to *ssh(1)* if the external IP address of
            'example-instance' is 162.222.181.197.
        ssh-key-expiration: |-
            The time when the ssh key will be valid until, such as
            "2017-08-29T18:52:51.142Z." This is only valid if the instance is not
            using OS Login. See $ gcloud topic datetimes for information on time
            formats.
        ssh-key-expire-after: |-
            The maximum length of time an SSH key is valid for once created and
            installed, e.g. 2m for 2 minutes. See $ gcloud topic datetimes for
            information on duration formats.
        ssh-key-file: The path to the SSH key file. By default, this is ``~/.ssh/google_compute_engine''.
        strict-host-key-checking: |-
            Override the default behavior of StrictHostKeyChecking for the
            connection. By default, StrictHostKeyChecking is set to 'no' the first
            time you connect to an instance, and will be set to 'yes' for all
            subsequent connections. _STRICT_HOST_KEY_CHECKING_ must be one of: *yes*, *no*, *ask*.
        user: |-
            User for login to the selected VMs.
            If not specified, the default user will be used.
        zones: If provided, only resources from the given zones are queried.
