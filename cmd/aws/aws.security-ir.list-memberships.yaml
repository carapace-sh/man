name: list-memberships
description: Returns the memberships that the calling principal can access.
flags:
    --max-results=: Request element for ListMemberships to limit the number of responses.
    --next-token=: An optional string that, if supplied, must be copied from the output of a previous call to ListMemberships.
documentation:
    command: Returns the memberships that the calling principal can access.
    flag:
        max-results: Request element for ListMemberships to limit the number of responses.
        next-token: An optional string that, if supplied, must be copied from the output of a previous call to ListMemberships. When provided in this manner, the API fetches the next page of results.
