name: delete-backup-plan
description: Deletes a backup plan.
flags:
    --backup-plan-id=!: Uniquely identifies a backup plan.
documentation:
    command: Deletes a backup plan. A backup plan can only be deleted after all associated selections of resources have been deleted. Deleting a backup plan deletes the current version of a backup plan. Previous versions, if any, will still exist.
    flag:
        backup-plan-id: Uniquely identifies a backup plan.
