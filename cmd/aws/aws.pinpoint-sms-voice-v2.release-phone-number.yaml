name: release-phone-number
description: Releases an existing origination phone number in your account.
flags:
    --phone-number-id=!: The PhoneNumberId or PhoneNumberArn of the phone number to release.
documentation:
    command: |-
        Releases an existing origination phone number in your account. Once released, a phone number is no longer available for sending messages.

        If the origination phone number has deletion protection enabled or is associated with a pool, an error is returned.
    flag:
        phone-number-id: |-
            The PhoneNumberId or PhoneNumberArn of the phone number to release. You can use [DescribePhoneNumbers]() to get the values for PhoneNumberId and PhoneNumberArn.

            If you are using a shared End User MessagingSMS resource then you must use the full Amazon Resource Name(ARN).
