name: modify-event-subscription
description: Modifies an existing Amazon DocumentDB event notification subscription.
flags:
    --enabled=: A Boolean value; set to `true` to activate the subscription.
    --event-categories=: A list of event categories for a `SourceType` that you want to subscribe to.
    --sns-topic-arn=: The Amazon Resource Name (ARN) of the SNS topic created for event notification.
    --source-type=: The type of source that is generating the events.
    --subscription-name=!: The name of the Amazon DocumentDB event notification subscription.
documentation:
    command: Modifies an existing Amazon DocumentDB event notification subscription.
    flag:
        enabled: A Boolean value; set to `true` to activate the subscription.
        event-categories: A list of event categories for a `SourceType` that you want to subscribe to.
        sns-topic-arn: The Amazon Resource Name (ARN) of the SNS topic created for event notification. The ARN is created by Amazon SNS when you create a topic and subscribe to it.
        source-type: |-
            The type of source that is generating the events. For example, if you want to be notified of events generated by an instance, set this parameter to `db-instance`. If this value is not specified, all events are returned.

            Valid values: `db-instance`, `db-parameter-group`, `db-security-group`
        subscription-name: The name of the Amazon DocumentDB event notification subscription.
