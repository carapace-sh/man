name: describe-instance-patches
description: Retrieves information about the patches on the specified managed node and their state relative to the patch baseline being used for the node.
flags:
    --filters=: Each element in the array is a structure containing a key-value pair.
    --instance-id=!: The ID of the managed node whose patch state information should be retrieved.
    --max-results=: The maximum number of patches to return (per page).
    --next-token=: The token for the next set of items to return.
documentation:
    command: Retrieves information about the patches on the specified managed node and their state relative to the patch baseline being used for the node.
    flag:
        filters: "Each element in the array is a structure containing a key-value pair.\n\nSupported keys for `DescribeInstancePatches`include the following:\n\n- **`Classification`**\n  \n  Sample values: `Security` | `SecurityUpdates`\n- **`KBId`**\n  \n  Sample values: `KB4480056` | `java-1.7.0-openjdk.x86_64`\n- **`Severity`**\n  \n  Sample values: `Important` | `Medium` | `Low`\n- **`State`**\n  \n  Sample values: `Installed` | `InstalledOther` | `InstalledPendingReboot`\n  \n  For lists of all `State` values, see [Patch compliance state values](https://docs.aws.amazon.com/systems-manager/latest/userguide/patch-manager-compliance-states.html) in the *Amazon Web Services Systems Manager User Guide*."
        instance-id: The ID of the managed node whose patch state information should be retrieved.
        max-results: The maximum number of patches to return (per page).
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
