name: detect-text-tiff
description: '*(ALPHA)*  Detect and transcribe text from TIFF files stored in Google Cloud Storage.'
flags:
    --batch-size=: Maximum number of response protos to put into each output JSON file on
    --model-version=: Model version to use for the feature.
completion:
    flag:
        model-version:
            - builtin/latest
            - builtin/stable
documentation:
    command: |
        *(ALPHA)*  Detect and transcribe text from TIFF files stored in Google Cloud Storage.

        The Vision API accepts TIFF files up to 2000 pages.
        Larger files will return an error.
    flag:
        batch-size: |-
            Maximum number of response protos to put into each output JSON file on
            Google Cloud Storage.
            The valid range is [1, 100]. If not specified, the default value is 20.
        model-version: 'Model version to use for the feature. _MODEL_VERSION_ must be one of: *builtin/latest*, *builtin/stable*.'
