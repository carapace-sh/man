name: delete
description: '*(BETA)*  Delete a Compute Engine network peering.'
flags:
    --network=!: The name of the network in the current project containing the peering.
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute networks peerings delete* deletes a Compute Engine network peering.

        ## EXAMPLES

        To delete a network peering with the name 'peering-name' on the network
        'local-network', run:

          $ gcloud beta compute networks peerings delete peering-name \
            --network=local-network
    flag:
        network: The name of the network in the current project containing the peering.
