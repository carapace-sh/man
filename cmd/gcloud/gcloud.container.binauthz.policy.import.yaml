name: import
description: Import a Binary Authorization policy to the current project.
flags:
    --no-strict-validation&: Whether to perform additional checks on the validity of policy contents.
    --strict-validation: Whether to perform additional checks on the validity of policy contents.
documentation:
    command: |-
        This command accepts a description of the desired policy in the form of a
        YAML-formatted file. A representation of the current policy can be retrieved
        using the  $ gcloud container binauthz policy export  command. One method of modifying the
        policy is to run `$ gcloud container binauthz policy export`, dump the contents to a file,
        modify the policy file to reflect the desired new policy, and provide this
        modified file to `$ gcloud container binauthz policy import`.

        ## EXAMPLES

        To update the current project's policy:

          $ gcloud container binauthz policy export > my_policy.yaml

          $ edit my_policy.yaml

          $ gcloud container binauthz policy import my_policy.yaml
    flag:
        no-strict-validation: Whether to perform additional checks on the validity of policy contents.
        strict-validation: Whether to perform additional checks on the validity of policy contents.
