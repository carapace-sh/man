name: update-group
description: Updates group information.
flags:
    --client-token=: A unique and case-sensitive identifier that you provide to make sure the idempotency of the request, so multiple identical calls have the same effect as one single call.
    --directory-id=!: The identifier (ID) of the directory that's associated with the group.
    --group-scope=: The scope of the AD group.
    --group-type=: The AD group type.
    --other-attributes=: An expression that defines one or more attributes with the data type and the value of each attribute.
    --samaccount-name=!: The name of the group.
    --update-type=: The type of update to be performed.
completion:
    flag:
        group-scope:
            - DomainLocal
            - Global
            - Universal
            - BuiltinLocal
        group-type:
            - Distribution
            - Security
        update-type:
            - ADD
            - REPLACE
            - REMOVE
documentation:
    command: Updates group information.
    flag:
        client-token: |-
            A unique and case-sensitive identifier that you provide to make sure the idempotency of the request, so multiple identical calls have the same effect as one single call.

            A client token is valid for 8 hours after the first request that uses it completes. After 8 hours, any request with the same client token is treated as a new request. If the request succeeds, any future uses of that token will be idempotent for another 8 hours.

            If you submit a request with the same client token but change one of the other parameters within the 8-hour idempotency window, Directory Service Data returns an `ConflictException`.

            This parameter is optional when using the CLI or SDK.
        directory-id: The identifier (ID) of the directory that's associated with the group.
        group-scope: The scope of the AD group. For details, see [Active Directory security groups](https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-groups#group-scope).
        group-type: The AD group type. For details, see [Active Directory security group type](https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-groups#how-active-directory-security-groups-work).
        other-attributes: An expression that defines one or more attributes with the data type and the value of each attribute.
        samaccount-name: The name of the group.
        update-type: The type of update to be performed. If no value exists for the attribute, use `ADD`. Otherwise, use `REPLACE` to change an attribute value or `REMOVE` to clear the attribute value.
