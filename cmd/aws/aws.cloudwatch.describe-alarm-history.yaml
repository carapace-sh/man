name: describe-alarm-history
description: Retrieves the history for the specified alarm.
flags:
    --alarm-contributor-id=: The unique identifier of a specific alarm contributor to filter the alarm history results.
    --alarm-name=: The name of the alarm.
    --alarm-types=:
        description: Use this parameter to specify whether you want the operation to return metric alarms or composite alarms.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --end-date=: The ending date to retrieve alarm history.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --history-item-type=: The type of alarm histories to retrieve.
    --max-items=: The  total number of items to return in the command's output.
    --max-records=: The maximum number of alarm history records to retrieve.
    --next-token=: The token returned by a previous call to indicate that there is more data available.
    --page-size=: The size of each page to get in the AWS service call.
    --scan-by=: Specified whether to return the newest or oldest alarm history first.
    --start-date=: The starting date to retrieve alarm history.
    --starting-token=: A token to specify where to start paginating.
completion:
    flag:
        history-item-type:
            - ConfigurationUpdate
            - StateUpdate
            - Action
            - AlarmContributorStateUpdate
            - AlarmContributorAction
        scan-by:
            - TimestampDescending
            - TimestampAscending
documentation:
    command: |-
        Retrieves the history for the specified alarm. You can filter the results by date range or item type. If an alarm name is not specified, the histories for either all metric alarms or all composite alarms are returned.

        CloudWatch retains the history of an alarm even if you delete the alarm.

        To use this operation and return information about a composite alarm, you must be signed on with the `cloudwatch:DescribeAlarmHistory` permission that is scoped to `*`. You can't return information about composite alarms if your `cloudwatch:DescribeAlarmHistory` permission has a narrower scope.
    flag:
        alarm-contributor-id: The unique identifier of a specific alarm contributor to filter the alarm history results.
        alarm-name: The name of the alarm.
        alarm-types: Use this parameter to specify whether you want the operation to return metric alarms or composite alarms. If you omit this parameter, only metric alarms are returned.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        end-date: The ending date to retrieve alarm history.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        history-item-type: The type of alarm histories to retrieve.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-records: The maximum number of alarm history records to retrieve.
        next-token: The token returned by a previous call to indicate that there is more data available.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        scan-by: Specified whether to return the newest or oldest alarm history first. Specify `TimestampDescending` to have the newest event history returned first, and specify `TimestampAscending` to have the oldest history returned first.
        start-date: The starting date to retrieve alarm history.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
