name: create-token
description: Creates a long-lived token.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=!: Idempotency token, valid for 10 minutes.
    --expiration-in-days=: Token expiration, in days, counted from token creation.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --license-arn=!: Amazon Resource Name (ARN) of the license.
    --role-arns=:
        description: Amazon Resource Name (ARN) of the IAM roles to embed in the token.
        nargs: -1
    --token-properties=:
        description: Data specified by the caller to be included in the JWT token.
        nargs: -1
documentation:
    command: |-
        Creates a long-lived token.

        A refresh token is a JWT token used to get an access token. With an access token, you can call AssumeRoleWithWebIdentity to get role credentials that you can use to call License Manager to manage the specified license.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Idempotency token, valid for 10 minutes.
        expiration-in-days: Token expiration, in days, counted from token creation. The default is 365 days.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        license-arn: Amazon Resource Name (ARN) of the license. The ARN is mapped to the aud claim of the JWT token.
        role-arns: Amazon Resource Name (ARN) of the IAM roles to embed in the token. License Manager does not check whether the roles are in use.
        token-properties: Data specified by the caller to be included in the JWT token. The data is mapped to the amr claim of the JWT token.
