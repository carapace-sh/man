name: modify-redshift-idc-application
description: Changes an existing Amazon Redshift IAM Identity Center application.
flags:
    --authorized-token-issuer-list=:
        description: The authorized token issuer list for the Amazon Redshift IAM Identity Center application to change.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --iam-role-arn=: The IAM role ARN associated with the Amazon Redshift IAM Identity Center application to change.
    --idc-display-name=: The display name for the Amazon Redshift IAM Identity Center application to change.
    --identity-namespace=: The namespace for the Amazon Redshift IAM Identity Center application to change.
    --redshift-idc-application-arn=!: The ARN for the Redshift application that integrates with IAM Identity Center.
    --service-integrations=:
        description: A collection of service integrations associated with the application.
        nargs: -1
documentation:
    command: Changes an existing Amazon Redshift IAM Identity Center application.
    flag:
        authorized-token-issuer-list: The authorized token issuer list for the Amazon Redshift IAM Identity Center application to change.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        iam-role-arn: The IAM role ARN associated with the Amazon Redshift IAM Identity Center application to change. It has the required permissions to be assumed and invoke the IDC Identity Center API.
        idc-display-name: The display name for the Amazon Redshift IAM Identity Center application to change. It appears on the console.
        identity-namespace: The namespace for the Amazon Redshift IAM Identity Center application to change. It determines which managed application verifies the connection token.
        redshift-idc-application-arn: The ARN for the Redshift application that integrates with IAM Identity Center.
        service-integrations: A collection of service integrations associated with the application.
