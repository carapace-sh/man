name: describe-certificates
description: Provides a description of the certificate.
flags:
    --filters=: Filters applied to the certificates described in the form of key-value pairs.
    --marker=: An optional pagination token provided by a previous request.
    --max-records=: The maximum number of records to include in the response.
documentation:
    command: Provides a description of the certificate.
    flag:
        filters: Filters applied to the certificates described in the form of key-value pairs. Valid values are `certificate-arn` and `certificate-id`.
        marker: An optional pagination token provided by a previous request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that the remaining results can be retrieved.

            Default: 10
