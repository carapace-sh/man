name: describe-policies
description: Gets information about the scaling policies in the account and Region.
flags:
    --auto-scaling-group-name=: The name of the Auto Scaling group.
    --max-records=: The maximum number of items to be returned with each call.
    --next-token=: The token for the next set of items to return.
    --policy-names=: The names of one or more policies.
    --policy-types=: One or more policy types.
documentation:
    command: Gets information about the scaling policies in the account and Region.
    flag:
        auto-scaling-group-name: The name of the Auto Scaling group.
        max-records: The maximum number of items to be returned with each call. The default value is `50` and the maximum value is `100`.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
        policy-names: |-
            The names of one or more policies. If you omit this property, all policies are described. If a group name is provided, the results are limited to that group. If you specify an unknown policy name, it is ignored with no error.

            Array Members: Maximum number of 50 items.
        policy-types: One or more policy types. The valid values are `SimpleScaling`, `StepScaling`, `TargetTrackingScaling`, and `PredictiveScaling`.
