name: list-users
description: Lists the users that belong to the specified Amazon Chime account.
flags:
    --account-id=!: The Amazon Chime account ID.
    --max-results=: The maximum number of results to return in a single call.
    --next-token=: The token to use to retrieve the next page of results.
    --user-email=: Optional.
    --user-type=: The user type.
completion:
    flag:
        user-type:
            - PrivateUser
            - SharedDevice
documentation:
    command: Lists the users that belong to the specified Amazon Chime account. You can specify an email address to list only the user that the email address belongs to.
    flag:
        account-id: The Amazon Chime account ID.
        max-results: The maximum number of results to return in a single call. Defaults to 100.
        next-token: The token to use to retrieve the next page of results.
        user-email: Optional. The user email address used to filter results. Maximum 1.
        user-type: The user type.
