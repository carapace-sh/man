name: create-task-template
description: Creates a new task template in the specified Amazon Connect instance.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --constraints=: Constraints that are applicable to the fields listed.
    --contact-flow-id=: The identifier of the flow that runs by default when a task is created by referencing this template.
    --defaults=: The default values for fields when a task is created by referencing this template.
    --description=: The description of the task template.
    --fields=!:
        description: Fields that are part of the template.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --name=!: The name of the task template.
    --self-assign-flow-id=: The ContactFlowId for the flow that will be run if this template is used to create a self-assigned task.
    --status=: Marks a template as `ACTIVE` or `INACTIVE` for a task to refer to it.
completion:
    flag:
        status:
            - ACTIVE
            - INACTIVE
documentation:
    command: Creates a new task template in the specified Amazon Connect instance.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If not provided, the Amazon Web Services SDK populates this field. For more information about idempotency, see [Making retries safe with idempotent APIs](https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/).
        constraints: Constraints that are applicable to the fields listed.
        contact-flow-id: The identifier of the flow that runs by default when a task is created by referencing this template.
        defaults: The default values for fields when a task is created by referencing this template.
        description: The description of the task template.
        fields: Fields that are part of the template.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        name: The name of the task template.
        self-assign-flow-id: The ContactFlowId for the flow that will be run if this template is used to create a self-assigned task.
        status: Marks a template as `ACTIVE` or `INACTIVE` for a task to refer to it. Tasks can only be created from `ACTIVE` templates. If a template is marked as `INACTIVE`, then a task that refers to this template cannot be created.
