name: describe
description: '*(BETA)*  Describe an SSH Public Key from an OS Login Profile.'
flags:
    --key-file=: The path to a file containing an SSH public key to describe from the
    --key=: The SSH public key to describe from the OS Login Profile.
documentation:
    command: |
        *(BETA)*  *gcloud beta compute os-login ssh-keys describe* accepts either a string containing an SSH Public
        Key or a filename for an SSH Public key and displays that key from the
        user's OS Login Profile. The key value used can either be the
        full SSH key or the OS Login fingerprint for that key.
    flag:
        key: The SSH public key to describe from the OS Login Profile. Key value can either be the SSH key or the OS Login fingerprint of the key.
        key-file: |-
            The path to a file containing an SSH public key to describe from the
            OS Login Profile. Key value can either be the SSH key or the OS Login fingerprint of the key.
