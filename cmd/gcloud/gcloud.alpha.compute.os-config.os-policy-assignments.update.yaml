documentation:
    command: |
        *(ALPHA)*  Update an OS policy assignment

        ## EXAMPLES

        To update an OS policy assignment `my-assignment` in location `us-central1-a` with config file `/path/to/file/config.yaml`, run:

          $ gcloud alpha compute os-config os-policy-assignments update my-assignment --location=us-central1-a --file=/path/to/file/config.yaml
    flag:
        allow-missing: |-
            If set to true, and the OS policy assignment is not found, the new policy assignment
            resource will be created.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        file: |-
            Absolute path to the OS policy assignment file on your local client. File must be in either JSON
            or YAML format. This file defines the OS policies that you want to apply to your VMs, the target
            VMs that you want to apply the policies to, and the rollout rate at which to apply the OS
            policies. For more information about this resource and sample OS policy assignment files,
            see https://cloud.google.com/compute/docs/os-configuration-management/working-with-os-policies#os-policy-assignment.
        location: |-
            Location of the OS policy assignment.
            +

            To set the `location` attribute:
            * provide the argument `os_policy_assignment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/zone`.
        no-allow-missing: |
            If set to true, and the OS policy assignment is not found, the new policy assignment
            resource will be created.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
