name: delete
description: '*(ALPHA)*  Delete a quota override for a consumer.'
flags:
    --consumer=!: The consumer to delete a quota override for.
    --force: Force override deletion even if the change results in a substantial decrease in available quota.
    --metric=!: The metric to delete a quota override for.
    --no-force&: Force override deletion even if the change results in a substantial decrease in available quota.
    --override-id=!: The override ID of the override previous created.
    --service=!: The service to delete a quota override for.
    --unit=!: The unit of a metric to delete a quota override for.
documentation:
    command: |-
        *(ALPHA)*  This command deletes a quota override for a consumer. The supported consumers
        are projects, folders, and organizations. The override ID can be found from
        list command output.

        ## EXAMPLES

        To delete a quota override for a project with project number, run:

          $ gcloud alpha services quota delete --service=example.googleapis.com --consumer=projects/12321
              --metric=example.googleapis.com/default_requests
              --unit=1/min/{project}

        To delete a quota override for a project with project ID, run:

          $ gcloud alpha services quota delete --service=example.googleapis.com --consumer=projects/hello
              --metric=example.googleapis.com/default_requests
              --unit=1/min/{project}

        To delete a quota override for an organization, run:

          $ gcloud alpha services quota delete --service=example.googleapis.com --consumer=organizations/555
              --metric=example.googleapis.com/default_requests
              --unit=1/min/{project}

        To force the deletion of a quota override, run:

          $ gcloud alpha services quota delete --service=example.googleapis.com --consumer=projects/12321
              --metric=example.googleapis.com/default_requests
              --unit=1/min/{project} --force
    flag:
        consumer: The consumer to delete a quota override for.
        force: Force override deletion even if the change results in a substantial decrease in available quota.
        metric: The metric to delete a quota override for.
        no-force: Force override deletion even if the change results in a substantial decrease in available quota.
        override-id: The override ID of the override previous created.
        service: The service to delete a quota override for.
        unit: The unit of a metric to delete a quota override for.
