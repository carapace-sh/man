name: update-playback-restriction-policy
description: Updates a specified playback restriction policy.
flags:
    --allowed-countries=:
        description: A list of country codes that control geoblocking restriction.
        nargs: -1
    --allowed-origins=:
        description: A list of origin sites that control CORS restriction.
        nargs: -1
    --arn=!: ARN of the playback-restriction-policy to be updated.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --enable-strict-origin-enforcement: Whether channel playback is constrained by origin site.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=: Playback-restriction-policy name.
    --no-enable-strict-origin-enforcement: Whether channel playback is constrained by origin site.
documentation:
    command: Updates a specified playback restriction policy.
    flag:
        allowed-countries: 'A list of country codes that control geoblocking restriction. Allowed values are the officially assigned [ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) codes. Default: All countries (an empty array).'
        allowed-origins: 'A list of origin sites that control CORS restriction. Allowed values are the same as valid values of the Origin header defined at [https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Origin](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Origin). Default: All origins (an empty array).'
        arn: ARN of the playback-restriction-policy to be updated.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        enable-strict-origin-enforcement: 'Whether channel playback is constrained by origin site. Default: `false`.'
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: Playback-restriction-policy name. The value does not need to be unique.
