name: resize
description: Resize the number of nodes in the node group.
flags:
    --cluster=: The Cluster name.
    --graceful-decommission-timeout=: Graceful decommission timeout for a node group scale-down resize.
    --region=: Dataproc region for the node_group.
    --size=!: New size for a node group.
    --timeout=&: Client side timeout on how long to wait for Dataproc operations.
documentation:
    command: Resize the number of nodes in the node group.
    flag:
        cluster: |-
            The Cluster name.
            +
            To set the `cluster` attribute:
            * provide the argument `node_group` on the command line with a fully specified name;
            * provide the argument `--cluster` on the command line.
        graceful-decommission-timeout: Graceful decommission timeout for a node group scale-down resize.
        region: |-
            Dataproc region for the node_group. Each Dataproc region constitutes an independent resource namespace constrained to deploying instances into Compute Engine zones inside the region. Overrides the default `dataproc/region` property value for this command invocation.
            +
            To set the `region` attribute:
            * provide the argument `node_group` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `dataproc/region`.
        size: New size for a node group.
        timeout: Client side timeout on how long to wait for Dataproc operations. See $ gcloud topic datetimes for information on duration formats.
