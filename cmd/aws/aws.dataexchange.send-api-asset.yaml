name: send-api-asset
description: This operation invokes an API Gateway API asset.
flags:
    --asset-id=!: Asset ID value for the API request.
    --body=: The request body.
    --data-set-id=!: Data set ID value for the API request.
    --method=: HTTP method value for the API request.
    --path=: URI path value for the API request.
    --query-string-parameters=: Attach query string parameters to the end of the URI (for example, /v1/examplePath?exampleParam=exampleValue).
    --request-headers=: Any header value prefixed with x-amzn-dataexchange-header- will have that stripped before sending the Asset API request.
    --revision-id=!: Revision ID value for the API request.
documentation:
    command: This operation invokes an API Gateway API asset. The request is proxied to the provider’s API Gateway API.
    flag:
        asset-id: Asset ID value for the API request.
        body: The request body.
        data-set-id: Data set ID value for the API request.
        method: HTTP method value for the API request. Alternatively, you can use the appropriate verb in your request.
        path: URI path value for the API request. Alternatively, you can set the URI path directly by invoking /v1/{pathValue}.
        query-string-parameters: Attach query string parameters to the end of the URI (for example, /v1/examplePath?exampleParam=exampleValue).
        request-headers: Any header value prefixed with x-amzn-dataexchange-header- will have that stripped before sending the Asset API request. Use this when you want to override a header that AWS Data Exchange uses. Alternatively, you can use the header without a prefix to the HTTP request.
        revision-id: Revision ID value for the API request.
