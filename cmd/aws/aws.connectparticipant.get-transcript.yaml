name: get-transcript
description: Retrieves a transcript of the session, including details about any attachments.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --connection-token=!: The authentication token associated with the participant's connection.
    --contact-id=: The contactId from the current contact chain for which transcript is needed.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of results to return in the page.
    --next-token=: The pagination token.
    --scan-direction=: The direction from StartPosition from which to retrieve message.
    --sort-order=: The sort order for the records.
    --start-position=: A filtering option for where to start.
completion:
    flag:
        scan-direction:
            - FORWARD
            - BACKWARD
        sort-order:
            - DESCENDING
            - ASCENDING
documentation:
    command: |-
        Retrieves a transcript of the session, including details about any attachments. For information about accessing past chat contact transcripts for a persistent chat, see [Enable persistent chat](https://docs.aws.amazon.com/connect/latest/adminguide/chat-persistence.html).

        For security recommendations, see [Amazon Connect Chat security best practices](https://docs.aws.amazon.com/connect/latest/adminguide/security-best-practices.html#bp-security-chat).

        If you have a process that consumes events in the transcript of an chat that has ended, note that chat transcripts contain the following event content types if the event has occurred during the chat session:

        - `application/vnd.amazonaws.connect.event.participant.invited`
        - `application/vnd.amazonaws.connect.event.participant.joined`
        - `application/vnd.amazonaws.connect.event.participant.left`
        - `application/vnd.amazonaws.connect.event.chat.ended`
        - `application/vnd.amazonaws.connect.event.transfer.succeeded`
        - `application/vnd.amazonaws.connect.event.transfer.failed`

        `ConnectionToken` is used for invoking this API instead of `ParticipantToken`.

        The Amazon Connect Participant Service APIs do not use [Signature Version 4 authentication](https://docs.aws.amazon.com/general/latest/gr/signature-version-4.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        connection-token: The authentication token associated with the participant's connection.
        contact-id: The contactId from the current contact chain for which transcript is needed.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: 'The maximum number of results to return in the page. Default: 10.'
        next-token: The pagination token. Use the value returned previously in the next subsequent request to retrieve the next set of results.
        scan-direction: 'The direction from StartPosition from which to retrieve message. Default: BACKWARD when no StartPosition is provided, FORWARD with StartPosition.'
        sort-order: 'The sort order for the records. Default: DESCENDING.'
        start-position: A filtering option for where to start.
