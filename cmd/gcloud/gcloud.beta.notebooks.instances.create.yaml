            - GMEK
            - CMEK
        reservation-affinity:
            - TYPE_UNSPECIFIED
            - NO_RESERVATION
            - ANY_RESERVATION
            - SPECIFIC_RESERVATION
documentation:
    command: |4
        *(BETA)*  *(DEPRECATED)*  This command is deprecated. Please use `gcloud notebooks` instead.


        Request for creating notebook instances.
    flag:
        accelerator-core-count: Count of cores of this accelerator.
        accelerator-type: 'Type of this accelerator. _ACCELERATOR_TYPE_ must be one of: *NVIDIA_TESLA_A100*, *NVIDIA_TESLA_K80*, *NVIDIA_TESLA_P100*, *NVIDIA_TESLA_V100*, *NVIDIA_TESLA_P4*, *NVIDIA_TESLA_T4*, *NVIDIA_TESLA_T4_VWS*, *NVIDIA_TESLA_P100_VWS*, *NVIDIA_TESLA_P4_VWS*, *TPU_V2*, *TPU_V3*, *NVIDIA_L4*, *NVIDIA_H100_80GB*, *NVIDIA_H100_MEGA_80GB*.'
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        boot-disk-size: Size of boot disk in GB attached to this instance, up to a maximum of 64000 GB (64 TB). The minimum recommended value is 100 GB. If not specified, this defaults to 100.
        boot-disk-type: 'Type of boot disk attached to this instance, defaults to standard persistent disk (`PD_STANDARD`). _BOOT_DISK_TYPE_ must be one of: *PD_STANDARD*, *PD_SSD*, *PD_BALANCED*, *PD_EXTREME*.'
        container-repository: 'The path to the container image repository. For example: gcr.io/`{project_id}`/`{image_name}`.'
        container-tag: The tag of the container image. If not specified, this defaults to the latest tag.
        custom-gpu-driver-path: Specify a custom Cloud Storage path where the GPU driver is stored. If not specified, we'll automatically choose from official GPU drivers.
        data-disk-size: Size of data disk in GB attached to this instance, up to a maximum of 64000 GB (64 TB). The minimum recommended value is 100 GB. If not specified, this defaults to 100.
        data-disk-type: 'Type of data disk attached to this instance, defaults to standard persistent disk (`PD_STANDARD`). _DATA_DISK_TYPE_ must be one of: *PD_STANDARD*, *PD_SSD*, *PD_BALANCED*, *PD_EXTREME*.'
        disk-encryption: 'Disk encryption method used on the boot disk, defaults to GMEK. _DISK_ENCRYPTION_ must be one of: *GMEK*, *CMEK*.'
        environment: |-
            ID of the environment or fully qualified identifier for the environment.
            +
            To set the `environment` attribute:
            * provide the argument `--environment` on the command line.
        environment-location: |-
            Google Cloud location of this environment https://cloud.google.com/compute/docs/regions-zones/#locations.
            +
            To set the `environment-location` attribute:
            * provide the argument `--environment` on the command line with a fully specified name;
            * provide the argument `--environment-location` on the command line;
            * provide the argument `--location` on the command line;
            * set the property `notebooks/location`.
        install-gpu-driver: Whether the end user authorizes Google Cloud to install a GPU driver on this instance. If this field is empty or set to false, the GPU driver won't be installed. Only applicable to instances with GPUs.
        instance-owners: The owners of this instance after creation. Format:`alias@example.com`. Currently supports one owner only.If not specified, all of the service account users of the VM instance's service account can use the instance.
        kms-key: |-
            ID of the key or fully qualified identifier for the key.
            +
            To set the `kms-key` attribute:
            * provide the argument `--kms-key` on the command line.
        kms-keyring: |-
            The KMS keyring of the key.
            +
            To set the `kms-keyring` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-keyring` on the command line.
        kms-location: |-
            The Google Cloud location for the key.
            +
            To set the `kms-location` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-location` on the command line.
        kms-project: |-
            The Google Cloud project for the key.
            +
            To set the `kms-project` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-project` on the command line;
            * set the property `core/project`.
        labels: Labels to apply to this instance. These can be later modified by the setLabels method.
        location: |-
            Google Cloud location of this environment https://cloud.google.com/compute/docs/regions-zones/#locations.
            +
            To set the `location` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `notebooks/location`.
        machine-type: The [Compute Engine machine type](https://cloud.google.com/sdk/gcloud/reference/compute/machine-types) of this instance.
        metadata: |-
            Custom metadata to apply to this instance.
            +
            For example, to specify a Cloud Storage bucket for automatic backup,
            you can use the `gcs-data-bucket` metadata tag. Format:
            `"--metadata=gcs-data-bucket=``BUCKET''"`.
        network: |-
            ID of the network or fully qualified identifier for the network.
            +
            To set the `network` attribute:
            * provide the argument `--network` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-install-gpu-driver: Whether the end user authorizes Google Cloud to install a GPU driver on this instance. If this field is empty or set to false, the GPU driver won't be installed. Only applicable to instances with GPUs.
        no-proxy-access: If true, the notebook instance will not register with the proxy.
        no-public-ip: If specified, no public IP will be assigned to this instance.
        no-remove-data-disk: If true, the data disk will not be auto deleted when deleting the instance.
        no-shielded-integrity-monitoring: Enable monitoring of the boot integrity of the instance.
        no-shielded-secure-boot: Boot instance with secure boot enabled. Disabled by default.
        no-shielded-vtpm: Boot instance with TPM (Trusted Platform Module) enabled.
        post-startup-script: Path to a Bash script that automatically runs after a notebook instance fully boots up. The path must be a URL or Cloud Storage path (gs://`path-to-file`/`file-name`).
        reservation: The name of the reservation, required when `--reservation-affinity=SPECIFIC_RESERVATION`.
        reservation-affinity: 'The type of reservation for the instance. _RESERVATION_AFFINITY_ must be one of: *TYPE_UNSPECIFIED*, *NO_RESERVATION*, *ANY_RESERVATION*, *SPECIFIC_RESERVATION*.'
        service-account: The service account on this instance, giving access to other Google Cloud services. You can use any service account within the same project, but you must have the service account user permission to use the instance. If not specified, the [Compute Engine default service account](/compute/docs/access/service-accounts#default_service_account) is used.
        shielded-integrity-monitoring: Enable monitoring of the boot integrity of the instance. Enabled by default, use *--no-shielded-integrity-monitoring* to disable.
        shielded-secure-boot: Boot instance with secure boot enabled. Disabled by default.
        shielded-vtpm: Boot instance with TPM (Trusted Platform Module) enabled. Enabled by default, use *--no-shielded-vtpm* to disable.
        subnet: |-
            ID of the subnetwork or fully qualified identifier for the subnetwork.
            +
            To set the `subnet` attribute:
            * provide the argument `--subnet` on the command line.
        subnet-region: |-
            Google Cloud region of this subnetwork https://cloud.google.com/compute/docs/regions-zones/#locations.
            +
            To set the `subnet-region` attribute:
            * provide the argument `--subnet` on the command line with a fully specified name;
            * provide the argument `--subnet-region` on the command line.
        tags: Tags to apply to this instance.
        vm-image-family: Use this VM image family to find the image; the newest image in this family will be used.
        vm-image-name: Use this VM image name to find the image.
        vm-image-project: 'The ID of the Google Cloud project that this VM image belongs to. Format: projects/`{project_id}`.'
