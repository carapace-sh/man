name: create-dashboard
description: Creates a dashboard in an IoT SiteWise Monitor project.
flags:
    --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
    --dashboard-definition=!: The dashboard definition specified in a JSON literal.
    --dashboard-description=: A description for the dashboard.
    --dashboard-name=!: A friendly name for the dashboard.
    --project-id=!: The ID of the project in which to create the dashboard.
    --tags=: A list of key-value pairs that contain metadata for the dashboard.
documentation:
    command: Creates a dashboard in an IoT SiteWise Monitor project.
    flag:
        client-token: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request. Don't reuse this client token if a new idempotent request is required.
        dashboard-definition: |-
            The dashboard definition specified in a JSON literal.

            - IoT SiteWise Monitor (Classic) see [Create dashboards (CLI)](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/create-dashboards-using-aws-cli.html)
            - IoT SiteWise Monitor (AI-aware) see [Create dashboards (CLI)](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/create-dashboards-ai-dashboard-cli.html)

            in the *IoT SiteWise User Guide*
        dashboard-description: A description for the dashboard.
        dashboard-name: A friendly name for the dashboard.
        project-id: The ID of the project in which to create the dashboard.
        tags: A list of key-value pairs that contain metadata for the dashboard. For more information, see [Tagging your IoT SiteWise resources](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/tag-resources.html) in the *IoT SiteWise User Guide*.
