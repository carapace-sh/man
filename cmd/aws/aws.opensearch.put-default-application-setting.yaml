name: put-default-application-setting
description: Sets the default application to the application with the specified ARN.
flags:
    --application-arn=!: ""
    --no-set-as-default!&: Set to true to set the specified ARN as the default application.
    --set-as-default!: Set to true to set the specified ARN as the default application.
documentation:
    command: |-
        Sets the default application to the application with the specified ARN.

        To remove the default application, use the `GetDefaultApplicationSetting` operation to get the current default and then call the `PutDefaultApplicationSetting` with the current applications ARN and the `setAsDefault` parameter set to `false`.
    flag:
        application-arn: ""
        set-as-default: Set to true to set the specified ARN as the default application. Set to false to clear the default application.
