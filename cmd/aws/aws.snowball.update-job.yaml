name: update-job
description: While a job's `JobState` value is `New`, you can update some of the information associated with a job.
flags:
    --address-id=: The ID of the updated [Address]() object.
    --description=: The updated description of this job's [JobMetadata]() object.
    --forwarding-address-id=: The updated ID for the forwarding address for a job.
    --job-id=!: The job ID of the job that you want to update, for example `JID123e4567-e89b-12d3-a456-426655440000`.
    --notification=: The new or updated [Notification]() object.
    --on-device-service-configuration=: Specifies the service or services on the Snow Family device that your transferred data will be exported from or imported into.
    --pickup-details=: ""
    --resources=: The updated `JobResource` object, or the updated [JobResource]() object.
    --role-arn=: The new role Amazon Resource Name (ARN) that you want to associate with this job.
    --shipping-option=: The updated shipping option value of this job's [ShippingDetails]() object.
    --snowball-capacity-preference=: The updated `SnowballCapacityPreference` of this job's [JobMetadata]() object.
completion:
    flag:
        shipping-option:
            - SECOND_DAY
            - NEXT_DAY
            - EXPRESS
            - STANDARD
        snowball-capacity-preference:
            - T50
            - T80
            - T100
            - T42
            - T98
            - T8
            - T14
            - T32
            - NoPreference
            - T240
            - T13
documentation:
    command: While a job's `JobState` value is `New`, you can update some of the information associated with a job. Once the job changes to a different job state, usually within 60 minutes of the job being created, this action is no longer available.
    flag:
        address-id: The ID of the updated [Address]() object.
        description: The updated description of this job's [JobMetadata]() object.
        forwarding-address-id: The updated ID for the forwarding address for a job. This field is not supported in most regions.
        job-id: The job ID of the job that you want to update, for example `JID123e4567-e89b-12d3-a456-426655440000`.
        notification: The new or updated [Notification]() object.
        on-device-service-configuration: Specifies the service or services on the Snow Family device that your transferred data will be exported from or imported into. Amazon Web Services Snow Family supports Amazon S3 and NFS (Network File System) and the Amazon Web Services Storage Gateway service Tape Gateway type.
        pickup-details: ""
        resources: The updated `JobResource` object, or the updated [JobResource]() object.
        role-arn: The new role Amazon Resource Name (ARN) that you want to associate with this job. To create a role ARN, use the [CreateRole](https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateRole.html)Identity and Access Management (IAM) API action.
        shipping-option: The updated shipping option value of this job's [ShippingDetails]() object.
        snowball-capacity-preference: |-
            The updated `SnowballCapacityPreference` of this job's [JobMetadata]() object. The 50 TB Snowballs are only available in the US regions.

            For more information, see "https://docs.aws.amazon.com/snowball/latest/snowcone-guide/snow-device-types.html" (Snow Family Devices and Capacity) in the *Snowcone User Guide* or "https://docs.aws.amazon.com/snowball/latest/developer-guide/snow-device-types.html" (Snow Family Devices and Capacity) in the *Snowcone User Guide*.
