name: untag-resource
description: Removes tags from the resource with the specified ARN.
flags:
    --resource-arn=!: The ARN of the resource to be untagged.
    --tag-keys=!: Array of tags to be removed.
documentation:
    command: Removes tags from the resource with the specified ARN.
    flag:
        resource-arn: The ARN of the resource to be untagged. The ARN must be URL-encoded.
        tag-keys: Array of tags to be removed. Array of maps, each of the form `string:string (key:value)`. See [Best practices and strategies](https://docs.aws.amazon.com/tag-editor/latest/userguide/best-practices-and-strats.html) in *Tagging Amazon Web Services Resources and Tag Editor* for details, including restrictions that apply to tags and "Tag naming limits and requirements"; Amazon IVS Chat has no constraints beyond what is documented there.
