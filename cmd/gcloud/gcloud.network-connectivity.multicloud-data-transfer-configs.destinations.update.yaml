    --description=: A description of this resource.
    --endpoints=: Set endpoints to new value.
    --etag=: The etag is computed by the server, and might be sent with update and
    --labels=: Set labels to new value.
    --location=: The location id of the destination resource.
    --multicloud-data-transfer-config=: The multicloudDataTransferConfig id of the destination resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-endpoints&: Clear endpoints value and set to empty list.
