name: delete
description: '*(ALPHA)*  Deletes a Cloud Firestore user creds.'
flags:
    --database=!: The database to operate on.
documentation:
    command: |-
        ## EXAMPLES

        To delete user creds 'test-user-creds-id' under
        database testdb.

            $ gcloud alpha firestore user-creds delete test-user-creds-id --database='testdb'
    flag:
        database: |-
            The database to operate on.
            +
            For example, to operate on database `foo`:
            +
              $ {command} --database='foo'
