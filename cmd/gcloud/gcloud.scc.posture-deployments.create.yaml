name: create
description: Create a Cloud Security Command Center (SCC) posture deployment.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: User-provided description of the posture deployment.
    --location=: ID of the location where the resource exists (for example, global).
    --no-async&: Return immediately, without waiting for the operation in progress to
    --organization=: ID of the organization which is the parent of the resource.
    --posture-name=!: Posture that needs to be deployed.
    --posture-revision-id=!: Posture revision that needs to be deployed.
    --target-resource=!: Name of the workload on which posture deployment is to be created.
documentation:
    command: |
        Create a  Cloud Security Command Center (SCC) posture deployment. First argument is the parent of the posture deployment to
        be created. Second argument is the name of the posture deployment to be created. It is followed by details of the posture to be deployed and the target_resource to be deployed on.

        LRO operation ID is returned as the response of the command.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: User-provided description of the posture deployment.
        location: |-
            ID of the location where the resource exists (for example, global).
            +

            To set the `location` attribute:
            * provide the argument `posture_deployment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        organization: |-
            ID of the organization which is the parent of the resource.
            +

            To set the `organization` attribute:
            * provide the argument `posture_deployment` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
        posture-name: |-
            Posture that needs to be deployed. Format:
            organizations/<organizationID>/locations/<location>/postures/<postureID>
        posture-revision-id: Posture revision that needs to be deployed.
        target-resource: |-
            Name of the workload on which posture deployment is to be created. It could be an organization, folder or a project.
            Possible formats: |
              organizations/<organizationID> |
              folders/<folderID> |
              projects/<projectID>
            The above mentioned IDs need to have numeric format.
