name: create-custom-entity-type
description: Creates a custom pattern that is used to detect sensitive data across the columns and rows of your structured data.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --context-words=: A list of context words.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: A name for the custom pattern that allows it to be retrieved or deleted later.
    --regex-string=!: A regular expression string that is used for detecting sensitive data in a custom pattern.
    --tags=: A list of tags applied to the custom entity type.
documentation:
    command: |-
        Creates a custom pattern that is used to detect sensitive data across the columns and rows of your structured data.

        Each custom pattern you create specifies a regular expression and an optional list of context words. If no context words are passed only a regular expression is checked.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        context-words: |-
            A list of context words. If none of these context words are found within the vicinity of the regular expression the data will not be detected as sensitive data.

            If no context words are passed only a regular expression is checked.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: A name for the custom pattern that allows it to be retrieved or deleted later. This name must be unique per Amazon Web Services account.
        regex-string: A regular expression string that is used for detecting sensitive data in a custom pattern.
        tags: A list of tags applied to the custom entity type.
