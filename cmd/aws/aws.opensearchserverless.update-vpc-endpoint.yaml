name: update-vpc-endpoint
description: Updates an OpenSearch Serverless-managed interface endpoint.
flags:
    --add-security-group-ids=:
        description: The unique identifiers of the security groups to add to the endpoint.
        nargs: -1
    --add-subnet-ids=:
        description: The ID of one or more subnets to add to the endpoint.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Unique, case-sensitive identifier to ensure idempotency of the request.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --id=!: The unique identifier of the interface endpoint to update.
    --remove-security-group-ids=:
        description: The unique identifiers of the security groups to remove from the endpoint.
        nargs: -1
    --remove-subnet-ids=:
        description: The unique identifiers of the subnets to remove from the endpoint.
        nargs: -1
documentation:
    command: Updates an OpenSearch Serverless-managed interface endpoint. For more information, see [Access Amazon OpenSearch Serverless using an interface endpoint](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-vpc.html).
    flag:
        add-security-group-ids: The unique identifiers of the security groups to add to the endpoint. Security groups define the ports, protocols, and sources for inbound traffic that you are authorizing into your endpoint.
        add-subnet-ids: The ID of one or more subnets to add to the endpoint.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Unique, case-sensitive identifier to ensure idempotency of the request.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        id: The unique identifier of the interface endpoint to update.
        remove-security-group-ids: The unique identifiers of the security groups to remove from the endpoint.
        remove-subnet-ids: The unique identifiers of the subnets to remove from the endpoint.
