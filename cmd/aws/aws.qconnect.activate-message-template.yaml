name: activate-message-template
description: Activates a specific version of the Amazon Q in Connect message template.
flags:
    --knowledge-base-id=!: The identifier of the knowledge base.
    --message-template-id=!: The identifier of the message template.
    --version-number=!: The version number of the message template version to activate.
documentation:
    command: Activates a specific version of the Amazon Q in Connect message template. After the version is activated, the previous active version will be deactivated automatically. You can use the `$ACTIVE_VERSION` qualifier later to reference the version that is in active status.
    flag:
        knowledge-base-id: The identifier of the knowledge base. Can be either the ID or the ARN. URLs cannot contain the ARN.
        message-template-id: The identifier of the message template. Can be either the ID or the ARN. It cannot contain any qualifier.
        version-number: The version number of the message template version to activate.
