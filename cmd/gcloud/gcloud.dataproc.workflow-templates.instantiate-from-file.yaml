name: instantiate-from-file
description: Instantiate a workflow template from a file.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --file=!: The YAML file containing the workflow template to run
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: Dataproc region to use.
documentation:
    command: Instantiate a workflow template from a file.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        file: The YAML file containing the workflow template to run
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: Dataproc region to use. Each Dataproc region constitutes an independent resource namespace constrained to deploying instances into Compute Engine zones inside the region. Overrides the default *dataproc/region* property value for this command invocation.
