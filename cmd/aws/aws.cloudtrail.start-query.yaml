name: start-query
description: Starts a CloudTrail Lake query.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --delivery-s3-uri=: The URI for the S3 bucket where CloudTrail delivers the query results.
    --event-data-store-owner-account-id=: The account ID of the event data store owner.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --query-alias=: The alias that identifies a query template.
    --query-parameters=: The query parameters for the specified `QueryAlias`.
    --query-statement=: The SQL code of your query.
documentation:
    command: |-
        Starts a CloudTrail Lake query. Use the `QueryStatement` parameter to provide your SQL query, enclosed in single quotation marks. Use the optional `DeliveryS3Uri` parameter to deliver the query results to an S3 bucket.

        `StartQuery` requires you specify either the `QueryStatement` parameter, or a `QueryAlias` and any `QueryParameters`. In the current release, the `QueryAlias` and `QueryParameters` parameters are used only for the queries that populate the CloudTrail Lake dashboards.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        delivery-s3-uri: The URI for the S3 bucket where CloudTrail delivers the query results.
        event-data-store-owner-account-id: The account ID of the event data store owner.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        query-alias: The alias that identifies a query template.
        query-parameters: The query parameters for the specified `QueryAlias`.
        query-statement: The SQL code of your query.
