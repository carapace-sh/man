name: start-attachment-upload
description: Provides a pre-signed Amazon S3 URL in response for uploading the file directly to S3.
flags:
    --attachment-name=!: A case-sensitive name of the attachment being uploaded.
    --attachment-size-in-bytes=!: The size of the attachment in bytes.
    --client-token=!: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --connection-token=!: The authentication token associated with the participant's connection.
    --content-type=!: Describes the MIME file type of the attachment.
documentation:
    command: |-
        Provides a pre-signed Amazon S3 URL in response for uploading the file directly to S3.

        For security recommendations, see [Amazon Connect Chat security best practices](https://docs.aws.amazon.com/connect/latest/adminguide/security-best-practices.html#bp-security-chat).

        `ConnectionToken` is used for invoking this API instead of `ParticipantToken`.

        The Amazon Connect Participant Service APIs do not use [Signature Version 4 authentication](https://docs.aws.amazon.com/general/latest/gr/signature-version-4.html).
    flag:
        attachment-name: A case-sensitive name of the attachment being uploaded.
        attachment-size-in-bytes: The size of the attachment in bytes.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If not provided, the Amazon Web Services SDK populates this field. For more information about idempotency, see [Making retries safe with idempotent APIs](https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/).
        connection-token: The authentication token associated with the participant's connection.
        content-type: Describes the MIME file type of the attachment. For a list of supported file types, see [Feature specifications](https://docs.aws.amazon.com/connect/latest/adminguide/feature-limits.html) in the *Amazon Connect Administrator Guide*.
