name: export
description: '*(BETA)*  Export Security Profile.'
flags:
    --destination=: Path to a YAML file where the configuration will be exported.
    --location=: Location ID of the resource.
    --organization=: Organization number.
documentation:
    command: |
        *(BETA)*  Export a Security Profile.
    flag:
        destination: |-
            Path to a YAML file where the configuration will be exported.
            The exported data will not contain any output-only fields.
            Alternatively, you may omit this flag to write to standard output.
            For a schema describing the export/import format, see
            $CLOUDSDKROOT/lib/googlecloudsdk/schemas/...
        location: |-
            Location ID of the resource.
            +

            To set the `location` attribute:
            * provide the argument `security_profile` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * use default global location
            .
        organization: |-
            Organization number.
            +

            To set the `organization` attribute:
            * provide the argument `security_profile` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
