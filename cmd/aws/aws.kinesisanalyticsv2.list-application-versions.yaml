name: list-application-versions
description: Lists all the versions for the specified application, including versions that were rolled back.
flags:
    --application-name=!: The name of the application for which you want to list all versions.
    --limit=: The maximum number of versions to list in this invocation of the operation.
    --next-token=: If a previous invocation of this operation returned a pagination token, pass it into this value to retrieve the next set of results.
documentation:
    command: |-
        Lists all the versions for the specified application, including versions that were rolled back. The response also includes a summary of the configuration associated with each version.

        To get the complete description of a specific application version, invoke the [DescribeApplicationVersion]() operation.

        This operation is supported only for Managed Service for Apache Flink.
    flag:
        application-name: The name of the application for which you want to list all versions.
        limit: The maximum number of versions to list in this invocation of the operation.
        next-token: If a previous invocation of this operation returned a pagination token, pass it into this value to retrieve the next set of results. For more information about pagination, see [Using the Amazon Command Line Interface's Pagination Options](https://docs.aws.amazon.com/cli/latest/userguide/pagination.html).
