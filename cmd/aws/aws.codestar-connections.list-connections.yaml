name: list-connections
description: Lists the connections associated with your account.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --host-arn-filter=: Filters the list of connections to those associated with a specified host.
    --max-results=: The maximum number of results to return in a single call.
    --next-token=: The token that was returned from the previous `ListConnections` call, which can be used to return the next set of connections in the list.
    --provider-type-filter=: Filters the list of connections to those associated with a specified provider, such as Bitbucket.
completion:
    flag:
        provider-type-filter:
            - Bitbucket
            - GitHub
            - GitHubEnterpriseServer
            - GitLab
            - GitLabSelfManaged
documentation:
    command: Lists the connections associated with your account.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        host-arn-filter: Filters the list of connections to those associated with a specified host.
        max-results: The maximum number of results to return in a single call. To retrieve the remaining results, make another call with the returned `nextToken` value.
        next-token: The token that was returned from the previous `ListConnections` call, which can be used to return the next set of connections in the list.
        provider-type-filter: Filters the list of connections to those associated with a specified provider, such as Bitbucket.
