name: get-content-summary
description: Retrieves summary information about the content.
flags:
    --content-id=!: The identifier of the content.
    --knowledge-base-id=!: The identifier of the knowledge base.
documentation:
    command: Retrieves summary information about the content.
    flag:
        content-id: The identifier of the content. Can be either the ID or the ARN. URLs cannot contain the ARN.
        knowledge-base-id: The identifier of the knowledge base. This should not be a QUICK\_RESPONSES type knowledge base if you're storing Wisdom Content resource to it. Can be either the ID or the ARN. URLs cannot contain the ARN.
