name: undelete
description: Undelete a root Certificate Authority.
flags:
    --location=: The location of the CERTIFICATE_AUTHORITY.
    --pool=: The parent CA Pool of the CERTIFICATE_AUTHORITY.
documentation:
    command: |-
        Restores a root Certificate Authority that has been deleted. A Certificate
        Authority can be undeleted within 30 days of being deleted. Use this command
        to halt the deletion process. An undeleted CA will move to DISABLED state.

        ## EXAMPLES

        To undelete a root CA:

            $ gcloud privateca roots undelete prod-root --location=us-west1 --pool=my-pool
    flag:
        location: |-
            The location of the CERTIFICATE_AUTHORITY.
            +
            To set the `location` attribute:
            * provide the argument `CERTIFICATE_AUTHORITY` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `privateca/location`.
        pool: |-
            The parent CA Pool of the CERTIFICATE_AUTHORITY.
            +
            To set the `pool` attribute:
            * provide the argument `CERTIFICATE_AUTHORITY` on the command line with a fully specified name;
            * provide the argument `--pool` on the command line.
