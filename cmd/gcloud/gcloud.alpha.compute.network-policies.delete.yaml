name: delete
description: '*(ALPHA)*  Delete a Compute Engine network policy.'
flags:
    --region=: Region of the network policy to delete.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute network-policies delete* is used to delete network policies. A network
        policy is a set of rules that classifies network traffic.
    flag:
        region: Region of the network policy to delete. Overrides the default *compute/region* property value for this command invocation.
