name: describe
description: '*(ALPHA)*  Describe an EncryptionConfig.'
flags:
    --location=: Location of the Dataplex resource.
    --organization=: Name of the Cloud organization to use.
documentation:
    command: |
        *(ALPHA)*  Describe an EncryptionConfig.
        Displays all the details of an EncryptionConfig used for CMEK with valid organization and location.
    flag:
        location: |-
            Location of the Dataplex resource.
            +

            To set the `location` attribute:
            * provide the argument `encryption_config` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
        organization: |-
            Name of the Cloud organization to use.
            +

            To set the `organization` attribute:
            * provide the argument `encryption_config` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
