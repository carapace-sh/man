name: describe-field-indexes
description: Returns a list of custom and default field indexes which are discovered in log data.
flags:
    --log-group-identifiers=!: An array containing the names or ARNs of the log groups that you want to retrieve field indexes for.
    --next-token=: ""
documentation:
    command: Returns a list of custom and default field indexes which are discovered in log data. For more information about field index policies, see [PutIndexPolicy](https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_PutIndexPolicy.html).
    flag:
        log-group-identifiers: An array containing the names or ARNs of the log groups that you want to retrieve field indexes for.
        next-token: ""
