name: modify-volume
description: You can modify several parameters of an existing EBS volume, including volume size, volume type, and IOPS capacity.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --iops=: The target IOPS rate of the volume.
    --multi-attach-enabled: Specifies whether to enable Amazon EBS Multi-Attach.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-multi-attach-enabled: Specifies whether to enable Amazon EBS Multi-Attach.
    --size=: The target size of the volume, in GiB.
    --throughput=: The target throughput of the volume, in MiB/s.
    --volume-id=!: The ID of the volume.
    --volume-type=: The target EBS volume type of the volume.
completion:
    flag:
        volume-type:
            - standard
            - io1
            - io2
            - gp2
            - sc1
            - st1
            - gp3
documentation:
    command: |-
        You can modify several parameters of an existing EBS volume, including volume size, volume type, and IOPS capacity. If your EBS volume is attached to a current-generation EC2 instance type, you might be able to apply these changes without stopping the instance or detaching the volume from it. For more information about modifying EBS volumes, see [Amazon EBS Elastic Volumes](https://docs.aws.amazon.com/ebs/latest/userguide/ebs-modify-volume.html) in the *Amazon EBS User Guide*.

        When you complete a resize operation on your volume, you need to extend the volume's file-system size to take advantage of the new storage capacity. For more information, see [Extend the file system](https://docs.aws.amazon.com/ebs/latest/userguide/recognize-expanded-volume-linux.html).

        For more information, see [Monitor the progress of volume modifications](https://docs.aws.amazon.com/ebs/latest/userguide/monitoring-volume-modifications.html) in the *Amazon EBS User Guide*.

        With previous-generation instance types, resizing an EBS volume might require detaching and reattaching the volume or stopping and restarting the instance.

        After modifying a volume, you must wait at least six hours and ensure that the volume is in the `in-use` or `available` state before you can modify the same volume. This is sometimes referred to as a cooldown period.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        iops: |-
            The target IOPS rate of the volume. This parameter is valid only for `gp3`, `io1`, and `io2` volumes.

            The following are the supported values for each volume type:

            - `gp3`: 3,000 - 80,000 IOPS
            - `io1`: 100 - 64,000 IOPS
            - `io2`: 100 - 256,000 IOPS

            [Instances built on the Nitro System](https://docs.aws.amazon.com/ec2/latest/instancetypes/ec2-nitro-instances.html) can support up to 256,000 IOPS. Other instances can support up to 32,000 IOPS.

            Default: The existing value is retained if you keep the same volume type. If you change the volume type to `io1`, `io2`, or `gp3`, the default is 3,000.
        multi-attach-enabled: Specifies whether to enable Amazon EBS Multi-Attach. If you enable Multi-Attach, you can attach the volume to up to 16 [Nitro-based instances](https://docs.aws.amazon.com/ec2/latest/instancetypes/ec2-nitro-instances.html) in the same Availability Zone. This parameter is supported with `io1` and `io2` volumes only. For more information, see [Amazon EBS Multi-Attach](https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volumes-multi.html) in the *Amazon EBS User Guide*.
        size: |-
            The target size of the volume, in GiB. The target volume size must be greater than or equal to the existing size of the volume.

            The following are the supported volumes sizes for each volume type:

            - `gp2`: 1 - 16,384 GiB
            - `gp3`: 1 - 65,536 GiB
            - `io1`: 4 - 16,384 GiB
            - `io2`: 4 - 65,536 GiB
            - `st1` and `sc1`: 125 - 16,384 GiB
            - `standard`: 1 - 1024 GiB

            Default: The existing size is retained.
        throughput: |-
            The target throughput of the volume, in MiB/s. This parameter is valid only for `gp3` volumes. The maximum value is 2,000.

            Default: The existing value is retained if the source and target volume type is `gp3`. Otherwise, the default value is 125.

            Valid Range: Minimum value of 125. Maximum value of 2,000.
        volume-id: The ID of the volume.
        volume-type: |-
            The target EBS volume type of the volume. For more information, see [Amazon EBS volume types](https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volume-types.html) in the *Amazon EBS User Guide*.

            Default: The existing type is retained.
