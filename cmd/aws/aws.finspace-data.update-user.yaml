name: update-user
description: Modifies the details of the specified user.
flags:
    --api-access-principal-arn=: The ARN identifier of an AWS user or role that is allowed to call the `GetProgrammaticAccessCredentials` API to obtain a credentials token for a specific FinSpace user.
    --api-access=: The option to indicate whether the user can use the `GetProgrammaticAccessCredentials` API to obtain credentials that can then be used to access other FinSpace Data API operations.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A token that ensures idempotency.
    --first-name=: The first name of the user.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --last-name=: The last name of the user.
    --type=: The option to indicate the type of user.
    --user-id=!: The unique identifier for the user that you want to update.
completion:
    flag:
        api-access:
            - ENABLED
            - DISABLED
        type:
            - SUPER_USER
            - APP_USER
documentation:
    command: Modifies the details of the specified user. You cannot update the `userId` for a user.
    flag:
        api-access: |-
            The option to indicate whether the user can use the `GetProgrammaticAccessCredentials` API to obtain credentials that can then be used to access other FinSpace Data API operations.

            - `ENABLED` – The user has permissions to use the APIs.
            - `DISABLED` – The user does not have permissions to use any APIs.
        api-access-principal-arn: The ARN identifier of an AWS user or role that is allowed to call the `GetProgrammaticAccessCredentials` API to obtain a credentials token for a specific FinSpace user. This must be an IAM role within your FinSpace account.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A token that ensures idempotency. This token expires in 10 minutes.
        first-name: The first name of the user.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        last-name: The last name of the user.
        type: |-
            The option to indicate the type of user.

            - `SUPER_USER`– A user with permission to all the functionality and data in FinSpace.
            - `APP_USER` – A user with specific permissions in FinSpace. The users are assigned permissions by adding them to a permission group.
        user-id: The unique identifier for the user that you want to update.
