name: update-timeline-event
description: Updates a timeline event.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A token that ensures that a client calls the operation only once with the specified details.
    --event-data=: A short description of the event.
    --event-id=!: The ID of the event to update.
    --event-references=:
        description: Updates all existing references in a `TimelineEvent`.
        nargs: -1
    --event-time=: The timestamp for when the event occurred.
    --event-type=: The type of event.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --incident-record-arn=!: The Amazon Resource Name (ARN) of the incident that includes the timeline event.
documentation:
    command: Updates a timeline event. You can update events of type `Custom Event`.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A token that ensures that a client calls the operation only once with the specified details.
        event-data: A short description of the event.
        event-id: The ID of the event to update. You can use `ListTimelineEvents` to find an event's ID.
        event-references: |-
            Updates all existing references in a `TimelineEvent`. A reference is an Amazon Web Services resource involved or associated with the incident. To specify a reference, enter its Amazon Resource Name (ARN). You can also specify a related item associated with that resource. For example, to specify an Amazon DynamoDB (DynamoDB) table as a resource, use its ARN. You can also specify an Amazon CloudWatch metric associated with the DynamoDB table as a related item.

            This update action overrides all existing references. If you want to keep existing references, you must specify them in the call. If you don't, this action removes any existing references and enters only new references.
        event-time: The timestamp for when the event occurred.
        event-type: The type of event. You can update events of type `Custom Event` and `Note`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        incident-record-arn: The Amazon Resource Name (ARN) of the incident that includes the timeline event.
