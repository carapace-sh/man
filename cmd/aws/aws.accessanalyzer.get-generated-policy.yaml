name: get-generated-policy
description: Retrieves the policy that was generated using `StartPolicyGeneration`.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --include-resource-placeholders: The level of detail that you want to generate.
    --include-service-level-template: The level of detail that you want to generate.
    --job-id=!: The `JobId` that is returned by the `StartPolicyGeneration` operation.
    --no-include-resource-placeholders: The level of detail that you want to generate.
    --no-include-service-level-template: The level of detail that you want to generate.
documentation:
    command: Retrieves the policy that was generated using `StartPolicyGeneration`.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        include-resource-placeholders: |-
            The level of detail that you want to generate. You can specify whether to generate policies with placeholders for resource ARNs for actions that support resource level granularity in policies.

            For example, in the resource section of a policy, you can receive a placeholder such as `"Resource":"arn:aws:s3:::${BucketName}"` instead of `"*"`.
        include-service-level-template: |-
            The level of detail that you want to generate. You can specify whether to generate service-level policies.

            IAM Access Analyzer uses `iam:servicelastaccessed` to identify services that have been used recently to create this service-level template.
        job-id: The `JobId` that is returned by the `StartPolicyGeneration` operation. The `JobId` can be used with `GetGeneratedPolicy` to retrieve the generated policies or used with `CancelPolicyGeneration` to cancel the policy generation request.
