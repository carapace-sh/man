name: tag-resource
description: Creates or updates a resource tag.
flags:
    --resource-arn=!: Amazon Resource Name (ARN) for the resource you want to tag.
    --tags=!: Tags that you have added to the specified resource.
documentation:
    command: Creates or updates a resource tag. Each tag is a label consisting of a user-defined key and value. Tags can help you manage, identify, organize, search for, and filter resources.
    flag:
        resource-arn: Amazon Resource Name (ARN) for the resource you want to tag.
        tags: Tags that you have added to the specified resource.
