name: modify-dbshard-group
description: Modifies the settings of an Aurora Limitless Database DB shard group.
flags:
    --compute-redundancy=: Specifies whether to create standby DB shard groups for the DB shard group.
    --dbshard-group-identifier=!: The name of the DB shard group to modify.
    --max-acu=: The maximum capacity of the DB shard group in Aurora capacity units (ACUs).
    --min-acu=: The minimum capacity of the DB shard group in Aurora capacity units (ACUs).
documentation:
    command: Modifies the settings of an Aurora Limitless Database DB shard group. You can change one or more settings by specifying these parameters and the new values in the request.
    flag:
        compute-redundancy: |-
            Specifies whether to create standby DB shard groups for the DB shard group. Valid values are the following:

            - 0 - Creates a DB shard group without a standby DB shard group. This is the default value.
            - 1 - Creates a DB shard group with a standby DB shard group in a different Availability Zone (AZ).
            - 2 - Creates a DB shard group with two standby DB shard groups in two different AZs.
        dbshard-group-identifier: The name of the DB shard group to modify.
        max-acu: The maximum capacity of the DB shard group in Aurora capacity units (ACUs).
        min-acu: The minimum capacity of the DB shard group in Aurora capacity units (ACUs).
