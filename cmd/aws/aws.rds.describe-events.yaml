name: describe-events
description: Returns events related to DB instances, DB clusters, DB parameter groups, DB security groups, DB snapshots, DB cluster snapshots, and RDS Proxies for the past 14 days.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --duration=: The number of minutes to retrieve events for.
    --end-time=: The end of the time interval for which to retrieve events, specified in ISO 8601 format.
    --event-categories=:
        description: A list of event categories that trigger notifications for a event notification subscription.
        nargs: -1
    --filters=:
        description: This parameter isn't currently supported.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --marker=: An optional pagination token provided by a previous DescribeEvents request.
    --max-items=: The  total number of items to return in the command's output.
    --max-records=: The maximum number of records to include in the response.
    --page-size=: The size of each page to get in the AWS service call.
    --source-identifier=: The identifier of the event source for which events are returned.
    --source-type=: The event source to retrieve events for.
    --start-time=: The beginning of the time interval to retrieve events for, specified in ISO 8601 format.
    --starting-token=: A token to specify where to start paginating.
completion:
    flag:
        source-type:
            - db-instance
            - db-parameter-group
            - db-security-group
            - db-snapshot
            - db-cluster
            - db-cluster-snapshot
            - custom-engine-version
            - db-proxy
            - blue-green-deployment
            - db-shard-group
            - zero-etl
documentation:
    command: |-
        Returns events related to DB instances, DB clusters, DB parameter groups, DB security groups, DB snapshots, DB cluster snapshots, and RDS Proxies for the past 14 days. Events specific to a particular DB instance, DB cluster, DB parameter group, DB security group, DB snapshot, DB cluster snapshot group, or RDS Proxy can be obtained by providing the name as a parameter.

        For more information on working with events, see [Monitoring Amazon RDS events](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/working-with-events.html) in the *Amazon RDS User Guide* and [Monitoring Amazon Aurora events](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/working-with-events.html) in the *Amazon Aurora User Guide*.

        By default, RDS returns events that were generated in the past hour.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        duration: |-
            The number of minutes to retrieve events for.

            Default: 60
        end-time: |-
            The end of the time interval for which to retrieve events, specified in ISO 8601 format. For more information about ISO 8601, go to the [ISO8601 Wikipedia page.](http://en.wikipedia.org/wiki/ISO_8601)

            Example: 2009-07-08T18:00Z
        event-categories: A list of event categories that trigger notifications for a event notification subscription.
        filters: This parameter isn't currently supported.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        marker: An optional pagination token provided by a previous DescribeEvents request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that you can retrieve the remaining results.

            Default: 100

            Constraints: Minimum 20, maximum 100.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        source-identifier: |-
            The identifier of the event source for which events are returned. If not specified, then all sources are included in the response.

            Constraints:

            - If `SourceIdentifier` is supplied, `SourceType` must also be provided.
            - If the source type is a DB instance, a `DBInstanceIdentifier` value must be supplied.
            - If the source type is a DB cluster, a `DBClusterIdentifier` value must be supplied.
            - If the source type is a DB parameter group, a `DBParameterGroupName` value must be supplied.
            - If the source type is a DB security group, a `DBSecurityGroupName` value must be supplied.
            - If the source type is a DB snapshot, a `DBSnapshotIdentifier` value must be supplied.
            - If the source type is a DB cluster snapshot, a `DBClusterSnapshotIdentifier` value must be supplied.
            - If the source type is an RDS Proxy, a `DBProxyName` value must be supplied.
            - Can't end with a hyphen or contain two consecutive hyphens.
        source-type: The event source to retrieve events for. If no value is specified, all events are returned.
        start-time: |-
            The beginning of the time interval to retrieve events for, specified in ISO 8601 format. For more information about ISO 8601, go to the [ISO8601 Wikipedia page.](http://en.wikipedia.org/wiki/ISO_8601)

            Example: 2009-07-08T18:00Z
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
