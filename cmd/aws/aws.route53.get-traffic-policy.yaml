name: get-traffic-policy
description: Gets information about a specific traffic policy version.
flags:
    --id=!: The ID of the traffic policy that you want to get information about.
    --version=!: The version number of the traffic policy that you want to get information about.
documentation:
    command: |-
        Gets information about a specific traffic policy version.

        For information about how of deleting a traffic policy affects the response from `GetTrafficPolicy`, see [DeleteTrafficPolicy](https://docs.aws.amazon.com/Route53/latest/APIReference/API_DeleteTrafficPolicy.html).
    flag:
        id: The ID of the traffic policy that you want to get information about.
        version: The version number of the traffic policy that you want to get information about.
