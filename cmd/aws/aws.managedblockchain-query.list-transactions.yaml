name: list-transactions
description: Lists all the transaction events for a transaction.
flags:
    --address=!: The address (either a contract or wallet), whose transactions are being requested.
    --confirmation-status-filter=: This filter is used to include transactions in the response that haven't reached [*finality*](https://docs.aws.amazon.com/managed-blockchain/latest/ambq-dg/key-concepts.html#finality) .
    --from-blockchain-instant=: ""
    --max-results=: The maximum number of transactions to list.
    --network=!: The blockchain network where the transactions occurred.
    --next-token=: The pagination token that indicates the next set of results to retrieve.
    --sort=: The order by which the results will be sorted.
    --to-blockchain-instant=: ""
completion:
    flag:
        network:
            - ETHEREUM_MAINNET
            - ETHEREUM_SEPOLIA_TESTNET
            - BITCOIN_MAINNET
            - BITCOIN_TESTNET
documentation:
    command: Lists all the transaction events for a transaction.
    flag:
        address: The address (either a contract or wallet), whose transactions are being requested.
        confirmation-status-filter: This filter is used to include transactions in the response that haven't reached [*finality*](https://docs.aws.amazon.com/managed-blockchain/latest/ambq-dg/key-concepts.html#finality) . Transactions that have reached finality are always part of the response.
        from-blockchain-instant: ""
        max-results: |-
            The maximum number of transactions to list.

            Default: `100`

            Even if additional results can be retrieved, the request can return less results than `maxResults` or an empty array of results.

            To retrieve the next set of results, make another request with the returned `nextToken` value. The value of `nextToken` is `null` when there are no more results to return
        network: The blockchain network where the transactions occurred.
        next-token: The pagination token that indicates the next set of results to retrieve.
        sort: The order by which the results will be sorted.
        to-blockchain-instant: ""
