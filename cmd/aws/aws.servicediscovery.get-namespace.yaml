name: get-namespace
description: Gets information about a namespace.
flags:
    --id=!: The ID or Amazon Resource Name (ARN) of the namespace that you want to get information about.
documentation:
    command: Gets information about a namespace.
    flag:
        id: The ID or Amazon Resource Name (ARN) of the namespace that you want to get information about. For namespaces shared with your Amazon Web Services account, specify the namespace ARN. For more information about shared namespaces, see [Cross-account Cloud Map namespace sharing](https://docs.aws.amazon.com/cloud-map/latest/dg/sharing-namespaces.html) in the *Cloud Map Developer Guide*
