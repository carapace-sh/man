name: delete-comment-content
description: Deletes the content of a comment made on a change, file, or commit in a repository.
flags:
    --comment-id=!: The unique, system-generated ID of the comment.
documentation:
    command: Deletes the content of a comment made on a change, file, or commit in a repository.
    flag:
        comment-id: The unique, system-generated ID of the comment. To get this ID, use [GetCommentsForComparedCommit]() or [GetCommentsForPullRequest]().
