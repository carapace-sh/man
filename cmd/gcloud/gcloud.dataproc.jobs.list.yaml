name: list
description: List jobs in a project.
flags:
    --cluster=: Restrict to the jobs of this Dataproc cluster.
    --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
    --limit=: Maximum number of resources to list.
    --page-size=: Some services group resource list output into pages.
    --region=: Dataproc region to use.
    --sort-by=: Comma-separated list of resource field key names to sort by.
    --state-filter=: Filter by job state.
completion:
    flag:
        state-filter:
            - active
            - inactive
documentation:
    command: |-
        List jobs in a project. An optional filter can be used to constrain the jobs
        returned. Filters are case-sensitive and have the following syntax:

          [field = value] AND [field [= value]] ...

        where `field` is `status.state` or `labels.[KEY]`, and `[KEY]` is a label
        key. `value` can be ```*``` to match all values. `status.state` can be either
        `ACTIVE` or `INACTIVE`. Only the logical `AND` operator is supported;
        space-separated items are treated as having an implicit `AND` operator.

        ## EXAMPLES

        To see the list of all jobs in Dataproc's 'us-central1' region, run:

          $ gcloud dataproc jobs list --region=us-central1

        To see a list of all active jobs in cluster 'mycluster' with a label
        `env=staging` located in 'us-central1', run:

          $ gcloud dataproc jobs list --region=us-central1 --filter='status.state = ACTIVE AND
              placement.clusterName = 'mycluster' AND labels.env = staging'
    flag:
        cluster: Restrict to the jobs of this Dataproc cluster.
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is *100*.
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        region: Dataproc region to use. Each Dataproc region constitutes an independent resource namespace constrained to deploying instances into Compute Engine zones inside the region. Overrides the default *dataproc/region* property value for this command invocation.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
        state-filter: 'Filter by job state. _STATE_FILTER_ must be one of: *active*, *inactive*.'
