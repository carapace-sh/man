name: describe-clusters
description: Describes one or more of your clusters.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --clusters=: A list of up to 100 cluster names or full cluster Amazon Resource Name (ARN) entries.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --include=: Determines whether to include additional information about the clusters in the response.
documentation:
    command: |-
        Describes one or more of your clusters.

        For CLI examples, see [describe-clusters.rst](https://github.com/aws/aws-cli/blob/develop/awscli/examples/ecs/describe-clusters.rst) on GitHub.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        clusters: A list of up to 100 cluster names or full cluster Amazon Resource Name (ARN) entries. If you do not specify a cluster, the default cluster is assumed.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        include: |-
            Determines whether to include additional information about the clusters in the response. If this field is omitted, this information isn't included.

            If `ATTACHMENTS` is specified, the attachments for the container instances or tasks within the cluster are included, for example the capacity providers.

            If `SETTINGS` is specified, the settings for the cluster are included.

            If `CONFIGURATIONS` is specified, the configuration for the cluster is included.

            If `STATISTICS` is specified, the task and service count is included, separated by launch type.

            If `TAGS` is specified, the metadata tags associated with the cluster are included.
