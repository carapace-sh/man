name: create-repository
description: Creates a repository.
flags:
    --encryption-configuration=: The encryption configuration for the repository.
    --image-scanning-configuration=: The image scanning configuration for the repository.
    --image-tag-mutability-exclusion-filters=: Creates a repository with a list of filters that define which image tags can override the default image tag mutability setting.
    --image-tag-mutability=: The tag mutability setting for the repository.
    --registry-id=: The Amazon Web Services account ID associated with the registry to create the repository.
    --repository-name=!: The name to use for the repository.
    --tags=: The metadata that you apply to the repository to help you categorize and organize them.
completion:
    flag:
        image-tag-mutability:
            - MUTABLE
            - IMMUTABLE
            - IMMUTABLE_WITH_EXCLUSION
            - MUTABLE_WITH_EXCLUSION
documentation:
    command: Creates a repository. For more information, see [Amazon ECR repositories](https://docs.aws.amazon.com/AmazonECR/latest/userguide/Repositories.html) in the *Amazon Elastic Container Registry User Guide*.
    flag:
        encryption-configuration: The encryption configuration for the repository. This determines how the contents of your repository are encrypted at rest.
        image-scanning-configuration: The image scanning configuration for the repository. This determines whether images are scanned for known vulnerabilities after being pushed to the repository.
        image-tag-mutability: The tag mutability setting for the repository. If this parameter is omitted, the default setting of `MUTABLE` will be used which will allow image tags to be overwritten. If `IMMUTABLE` is specified, all image tags within the repository will be immutable which will prevent them from being overwritten.
        image-tag-mutability-exclusion-filters: Creates a repository with a list of filters that define which image tags can override the default image tag mutability setting.
        registry-id: The Amazon Web Services account ID associated with the registry to create the repository. If you do not specify a registry, the default registry is assumed.
        repository-name: |-
            The name to use for the repository. The repository name may be specified on its own (such as `nginx-web-app`) or it can be prepended with a namespace to group the repository into a category (such as `project-a/nginx-web-app`).

            The repository name must start with a letter and can only contain lowercase letters, numbers, hyphens, underscores, and forward slashes.
        tags: The metadata that you apply to the repository to help you categorize and organize them. Each tag consists of a key and an optional value, both of which you define. Tag keys can have a maximum character length of 128 characters, and tag values can have a maximum length of 256 characters.
