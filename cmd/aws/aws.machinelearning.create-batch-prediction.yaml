name: create-batch-prediction
description: Generates predictions for a group of observations.
flags:
    --batch-prediction-data-source-id=!: The ID of the `DataSource` that points to the group of observations to predict.
    --batch-prediction-id=!: A user-supplied ID that uniquely identifies the `BatchPrediction`.
    --batch-prediction-name=: A user-supplied name or description of the `BatchPrediction`.
    --mlmodel-id=!: The ID of the `MLModel` that will generate predictions for the group of observations.
    --output-uri=!: The location of an Amazon Simple Storage Service (Amazon S3) bucket or directory to store the batch prediction results.
documentation:
    command: |-
        Generates predictions for a group of observations. The observations to process exist in one or more data files referenced by a `DataSource`. This operation creates a new `BatchPrediction`, and uses an `MLModel` and the data files referenced by the `DataSource` as information sources.

        `CreateBatchPrediction` is an asynchronous operation. In response to `CreateBatchPrediction`, Amazon Machine Learning (Amazon ML) immediately returns and sets the `BatchPrediction` status to `PENDING`. After the `BatchPrediction` completes, Amazon ML sets the status to `COMPLETED`.

        You can poll for status updates by using the [GetBatchPrediction]() operation and checking the `Status` parameter of the result. After the `COMPLETED` status appears, the results are available in the location specified by the `OutputUri` parameter.
    flag:
        batch-prediction-data-source-id: The ID of the `DataSource` that points to the group of observations to predict.
        batch-prediction-id: A user-supplied ID that uniquely identifies the `BatchPrediction`.
        batch-prediction-name: A user-supplied name or description of the `BatchPrediction`. `BatchPredictionName` can only use the UTF-8 character set.
        mlmodel-id: The ID of the `MLModel` that will generate predictions for the group of observations.
        output-uri: |-
            The location of an Amazon Simple Storage Service (Amazon S3) bucket or directory to store the batch prediction results. The following substrings are not allowed in the `s3 key` portion of the `outputURI` field: ':', '//', '/./', '/../'.

            Amazon ML needs permissions to store and retrieve the logs on your behalf. For information about how to set permissions, see the [Amazon Machine Learning Developer Guide](https://docs.aws.amazon.com/machine-learning/latest/dg).
