name: describe-event-categories
description: Displays a list of event categories for all event source types, or for a specified source type.
flags:
    --source-type=: The source type, such as cluster or parameter group, to which the described event categories apply.
documentation:
    command: Displays a list of event categories for all event source types, or for a specified source type. For a list of the event categories and source types, go to [Amazon Redshift Event Notifications](https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-event-notifications.html).
    flag:
        source-type: |-
            The source type, such as cluster or parameter group, to which the described event categories apply.

            Valid values: cluster, cluster-snapshot, cluster-parameter-group, cluster-security-group, and scheduled-action.
