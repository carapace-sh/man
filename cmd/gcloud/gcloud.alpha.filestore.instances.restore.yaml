name: restore
description: '*(ALPHA)*  Restore a Filestore instance from a snapshot or backup.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --file-share=!: File share to restore from the snapshot or backup.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --source-backup-region=!: Region of the Filestore backup to restore from.
    --source-backup=!: Name of the Filestore backup to restore from.
    --source-snapshot-region=: Region of the Filestore snapshot to restore from.
    --source-snapshot=!: Name of the Filestore snapshot to restore from.
    --zone=: The zone of the Filestore instance.
documentation:
    command: |
        *(ALPHA)*  Restore an existing Filestore instance from an existing snapshot
        or backup.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        file-share: File share to restore from the snapshot or backup.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        source-backup: Name of the Filestore backup to restore from.
        source-backup-region: Region of the Filestore backup to restore from.
        source-snapshot: Name of the Filestore snapshot to restore from.
        source-snapshot-region: |-
            Region of the Filestore snapshot to restore from. If unspecified, it
            is assumed that the Filestore snapshot is local.
        zone: |-
            The zone of the Filestore instance.
            +

            To set the `zone` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line;
            * set the property `filestore/zone`.
