name: list-allowed-node-type-modifications
description: Lists all available node types that you can scale with your cluster's replication group's current node type.
flags:
    --cache-cluster-id=: The name of the cluster you want to scale up to a larger node instanced type.
    --replication-group-id=: The name of the replication group want to scale up to a larger node type.
documentation:
    command: |-
        Lists all available node types that you can scale with your cluster's replication group's current node type.

        When you use the `ModifyCacheCluster` or `ModifyReplicationGroup` operations to scale your cluster or replication group, the value of the `CacheNodeType` parameter must be one of the node types returned by this operation.
    flag:
        cache-cluster-id: |-
            The name of the cluster you want to scale up to a larger node instanced type. ElastiCache uses the cluster id to identify the current node type of this cluster and from that to create a list of node types you can scale up to.

            You must provide a value for either the `CacheClusterId` or the `ReplicationGroupId`.
        replication-group-id: |-
            The name of the replication group want to scale up to a larger node type. ElastiCache uses the replication group id to identify the current node type being used by this replication group, and from that to create a list of node types you can scale up to.

            You must provide a value for either the `CacheClusterId` or the `ReplicationGroupId`.
