name: describe
description: Describe transcoder jobs.
flags:
    --location=: Transcoder location for resources
documentation:
    command: Describe transcoder jobs.
    flag:
        location: |-
            Transcoder location for resources
            +
            To set the `location` attribute:
            * provide the argument `job_name` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `transcoder/location`.
