name: delete
description: '*(ALPHA)*  Delete one or more Google Compute Engine network attachments.'
flags:
    --region=: Region of the network attachments to delete.
documentation:
    command: '*(ALPHA)*  Delete one or more Google Compute Engine network attachments.'
    flag:
        region: |-
            Region of the network attachments to delete. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
