name: delete
description: '*(ALPHA)*  Delete a condition in an alerting policy.'
flags:
    --policy=: Name of the alerting policy.
documentation:
    command: |-
        *(ALPHA)*  Delete a condition in an alerting policy. If the specified condition does
        not exist, this command will fail with an error. This will not delete
        the policy if no conditions exist.
    flag:
        policy: |-
            Name of the alerting policy.
            +
            To set the `policy` attribute:
            * provide the argument `condition` on the command line with a fully specified name;
            * provide the argument `--policy` on the command line.
