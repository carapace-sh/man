name: modify-cluster
description: Modifies CloudHSM cluster.
flags:
    --backup-retention-policy=: A policy that defines how the service retains backups.
    --cluster-id=!: The identifier (ID) of the cluster that you want to modify.
    --hsm-type=: The desired HSM type of the cluster.
documentation:
    command: |-
        Modifies CloudHSM cluster.

        **Cross-account use:** No. You cannot perform this operation on an CloudHSM cluster in a different Amazon Web Services account.
    flag:
        backup-retention-policy: A policy that defines how the service retains backups.
        cluster-id: The identifier (ID) of the cluster that you want to modify. To find the cluster ID, use [DescribeClusters]().
        hsm-type: The desired HSM type of the cluster.
