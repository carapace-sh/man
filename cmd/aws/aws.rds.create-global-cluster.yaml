name: create-global-cluster
description: Creates an Aurora global database spread across multiple Amazon Web Services Regions.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --database-name=: The name for your database of up to 64 alphanumeric characters.
    --deletion-protection: Specifies whether to enable deletion protection for the new global database cluster.
    --engine-lifecycle-support=: The life cycle type for this global database cluster.
    --engine-version=: The engine version to use for this global database cluster.
    --engine=: The database engine to use for this global database cluster.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --global-cluster-identifier=!: The cluster identifier for this global database cluster.
    --no-deletion-protection: Specifies whether to enable deletion protection for the new global database cluster.
    --no-storage-encrypted: Specifies whether to enable storage encryption for the new global database cluster.
    --source-db-cluster-identifier=: The Amazon Resource Name (ARN) to use as the primary cluster of the global database.
    --storage-encrypted: Specifies whether to enable storage encryption for the new global database cluster.
    --tags=:
        description: Tags to assign to the global cluster.
        nargs: -1
documentation:
    command: |-
        Creates an Aurora global database spread across multiple Amazon Web Services Regions. The global database contains a single primary cluster with read-write capability, and a read-only secondary cluster that receives data from the primary cluster through high-speed replication performed by the Aurora storage subsystem.

        You can create a global database that is initially empty, and then create the primary and secondary DB clusters in the global database. Or you can specify an existing Aurora cluster during the create operation, and this cluster becomes the primary cluster of the global database.

        This operation applies only to Aurora DB clusters.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        database-name: |-
            The name for your database of up to 64 alphanumeric characters. If you don't specify a name, Amazon Aurora doesn't create a database in the global database cluster.

            Constraints:

            - Can't be specified if `SourceDBClusterIdentifier` is specified. In this case, Amazon Aurora uses the database name from the source DB cluster.
        deletion-protection: Specifies whether to enable deletion protection for the new global database cluster. The global database can't be deleted when deletion protection is enabled.
        engine: |-
            The database engine to use for this global database cluster.

            Valid Values: `aurora-mysql | aurora-postgresql`

            Constraints:

            - Can't be specified if `SourceDBClusterIdentifier` is specified. In this case, Amazon Aurora uses the engine of the source DB cluster.
        engine-lifecycle-support: |-
            The life cycle type for this global database cluster.

            By default, this value is set to `open-source-rds-extended-support`, which enrolls your global cluster into Amazon RDS Extended Support. At the end of standard support, you can avoid charges for Extended Support by setting the value to `open-source-rds-extended-support-disabled`. In this case, creating the global cluster will fail if the DB major version is past its end of standard support date.

            This setting only applies to Aurora PostgreSQL-based global databases.

            You can use this setting to enroll your global cluster into Amazon RDS Extended Support. With RDS Extended Support, you can run the selected major engine version on your global cluster past the end of standard support for that engine version. For more information, see [Amazon RDS Extended Support with Amazon Aurora](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/extended-support.html) in the *Amazon Aurora User Guide*.

            Valid Values: `open-source-rds-extended-support | open-source-rds-extended-support-disabled`

            Default: `open-source-rds-extended-support`
        engine-version: |-
            The engine version to use for this global database cluster.

            Constraints:

            - Can't be specified if `SourceDBClusterIdentifier` is specified. In this case, Amazon Aurora uses the engine version of the source DB cluster.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        global-cluster-identifier: The cluster identifier for this global database cluster. This parameter is stored as a lowercase string.
        source-db-cluster-identifier: |-
            The Amazon Resource Name (ARN) to use as the primary cluster of the global database.

            If you provide a value for this parameter, don't specify values for the following settings because Amazon Aurora uses the values from the specified source DB cluster:

            - `DatabaseName`
            - `Engine`
            - `EngineVersion`
            - `StorageEncrypted`
        storage-encrypted: |-
            Specifies whether to enable storage encryption for the new global database cluster.

            Constraints:

            - Can't be specified if `SourceDBClusterIdentifier` is specified. In this case, Amazon Aurora uses the setting from the source DB cluster.
        tags: Tags to assign to the global cluster.
