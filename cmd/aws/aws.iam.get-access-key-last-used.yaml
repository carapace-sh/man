name: get-access-key-last-used
description: Retrieves information about when the specified access key was last used.
flags:
    --access-key-id=!: The identifier of an access key.
documentation:
    command: Retrieves information about when the specified access key was last used. The information includes the date and time of last use, along with the Amazon Web Services service and Region that were specified in the last request made with that key.
    flag:
        access-key-id: |-
            The identifier of an access key.

            This parameter allows (through its [regex pattern](http://wikipedia.org/wiki/regex)) a string of characters that can consist of any upper or lowercased letter or digit.
