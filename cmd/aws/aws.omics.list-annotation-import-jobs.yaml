name: list-annotation-import-jobs
description: Amazon Web Services HealthOmics variant stores and annotation stores will no longer be open to new customers starting November 7, 2025. If you would like to use variant stores or annotation stores, sign up prior to that date.
flags:
    --filter=: A filter to apply to the list.
    --ids=: IDs of annotation import jobs to retrieve.
    --max-results=: The maximum number of jobs to return in one page of results.
    --next-token=: Specifies the pagination token from a previous request to retrieve the next page of results.
documentation:
    command: |-
        Amazon Web Services HealthOmics variant stores and annotation stores will no longer be open to new customers starting November 7, 2025. If you would like to use variant stores or annotation stores, sign up prior to that date. Existing customers can continue to use the service as normal. For more information, see [Amazon Web Services HealthOmics variant store and annotation store availability change](https://docs.aws.amazon.com/omics/latest/dev/variant-store-availability-change.html).

        Retrieves a list of annotation import jobs.
    flag:
        filter: A filter to apply to the list.
        ids: IDs of annotation import jobs to retrieve.
        max-results: The maximum number of jobs to return in one page of results.
        next-token: Specifies the pagination token from a previous request to retrieve the next page of results.
