name: tag-resource
description: Adds one or more tags to a signaling channel.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the signaling channel to which you want to add tags.
    --tags=!: A list of tags to associate with the specified signaling channel.
documentation:
    command: Adds one or more tags to a signaling channel. A *tag* is a key-value pair (the value is optional) that you can define and assign to Amazon Web Services resources. If you specify a tag that already exists, the tag value is replaced with the value that you specify in the request. For more information, see [Using Cost Allocation Tags](https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-alloc-tags.html) in the *Billing and Cost Management and Cost Management User Guide*.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the signaling channel to which you want to add tags.
        tags: A list of tags to associate with the specified signaling channel. Each tag is a key-value pair.
