name: send-cis-session-telemetry
description: Sends a CIS session telemetry.
flags:
    --messages=!: The CIS session telemetry messages.
    --scan-job-id=!: A unique identifier for the scan job.
    --session-token=!: The unique token that identifies the CIS session.
documentation:
    command: Sends a CIS session telemetry. This API is used by the Amazon Inspector SSM plugin to communicate with the Amazon Inspector service. The Amazon Inspector SSM plugin calls this API to start a CIS scan session for the scan ID supplied by the service.
    flag:
        messages: The CIS session telemetry messages.
        scan-job-id: A unique identifier for the scan job.
        session-token: The unique token that identifies the CIS session.
