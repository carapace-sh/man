name: list-keyspaces
description: The `ListKeyspaces` operation returns a list of keyspaces.
flags:
    --max-results=: The total number of keyspaces to return in the output.
    --next-token=: The pagination token.
documentation:
    command: The `ListKeyspaces` operation returns a list of keyspaces.
    flag:
        max-results: The total number of keyspaces to return in the output. If the total number of keyspaces available is more than the value specified, a `NextToken` is provided in the output. To resume pagination, provide the `NextToken` value as an argument of a subsequent API invocation.
        next-token: The pagination token. To resume pagination, provide the `NextToken` value as argument of a subsequent API invocation.
