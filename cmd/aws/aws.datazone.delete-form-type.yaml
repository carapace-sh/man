name: delete-form-type
description: Deletes and metadata form type in Amazon DataZone.
flags:
    --domain-identifier=!: The ID of the Amazon DataZone domain in which the metadata form type is deleted.
    --form-type-identifier=!: The ID of the metadata form type that is deleted.
documentation:
    command: |-
        Deletes and metadata form type in Amazon DataZone.

        Prerequisites:

        - The form type must exist in the domain.
        - The form type must not be in use by any asset types or assets.
        - The domain must be valid and accessible.
        - User must have delete permissions on the form type.
        - Any dependencies (such as linked asset types) must be removed first.
    flag:
        domain-identifier: The ID of the Amazon DataZone domain in which the metadata form type is deleted.
        form-type-identifier: The ID of the metadata form type that is deleted.
