name: describe
description: Describe settingBindings.
flags:
    --location=: The location id of the settingBinding resource.
    --logging-setting=: The loggingSetting id of the settingBinding resource.
documentation:
    command: Describe a settingBinding
    flag:
        location: |-
            The location id of the settingBinding resource.
            +
            To set the `location` attribute:
            * provide the argument `setting_binding` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        logging-setting: |-
            The loggingSetting id of the settingBinding resource.
            +
            To set the `logging-setting` attribute:
            * provide the argument `setting_binding` on the command line with a fully specified name;
            * provide the argument `--logging-setting` on the command line.
