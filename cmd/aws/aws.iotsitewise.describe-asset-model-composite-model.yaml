name: describe-asset-model-composite-model
description: Retrieves information about an asset model composite model (also known as an asset model component).
flags:
    --asset-model-composite-model-id=!: The ID of a composite model on this asset model.
    --asset-model-id=!: The ID of the asset model.
    --asset-model-version=: The version alias that specifies the latest or active version of the asset model.
documentation:
    command: Retrieves information about an asset model composite model (also known as an asset model component). For more information, see [Custom composite models (Components)](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/custom-composite-models.html) in the *IoT SiteWise User Guide*.
    flag:
        asset-model-composite-model-id: The ID of a composite model on this asset model. This can be either the actual ID in UUID format, or else `externalId:` followed by the external ID, if it has one. For more information, see [Referencing objects with external IDs](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/object-ids.html#external-id-references) in the *IoT SiteWise User Guide*.
        asset-model-id: The ID of the asset model. This can be either the actual ID in UUID format, or else `externalId:` followed by the external ID, if it has one. For more information, see [Referencing objects with external IDs](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/object-ids.html#external-id-references) in the *IoT SiteWise User Guide*.
        asset-model-version: The version alias that specifies the latest or active version of the asset model. The details are returned in the response. The default value is `LATEST`. See [Asset model versions](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/model-active-version.html) in the *IoT SiteWise User Guide*.
