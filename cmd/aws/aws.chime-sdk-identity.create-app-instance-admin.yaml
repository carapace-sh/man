name: create-app-instance-admin
description: Promotes an `AppInstanceUser` or `AppInstanceBot` to an `AppInstanceAdmin`.
flags:
    --app-instance-admin-arn=!: The ARN of the administrator of the current `AppInstance`.
    --app-instance-arn=!: The ARN of the `AppInstance`.
documentation:
    command: |-
        Promotes an `AppInstanceUser` or `AppInstanceBot` to an `AppInstanceAdmin`. The promoted entity can perform the following actions.

        - `ChannelModerator` actions across all channels in the `AppInstance`.
        - `DeleteChannelMessage` actions.

        Only an `AppInstanceUser` and `AppInstanceBot` can be promoted to an `AppInstanceAdmin` role.
    flag:
        app-instance-admin-arn: The ARN of the administrator of the current `AppInstance`.
        app-instance-arn: The ARN of the `AppInstance`.
