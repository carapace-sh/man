name: upgrade
description: '*(ALPHA)*  Upgrade the Kubernetes version of an existing container cluster.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --cluster-version=: The GKE release version to which to upgrade the cluster's node pools or master.
    --control-plane-soak-duration=&: The soak duration for the rollback-able control plane upgrade.
    --image-project=&: /
    --image-type=: The image type to use for the cluster/node pool.
    --image=&: A specific image to use on the new instances.
    --location=: Compute zone or region (e.g. us-central1-a or us-central1) for the cluster.
    --master: Upgrade the cluster's master.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-master&: Upgrade the cluster's master.
    --no-security-profile-runtime-rules&: Apply runtime rules in the specified security profile to the cluster.
    --node-pool=: The node pool to upgrade.
    --region=: Compute region (e.g. us-central1) for a regional cluster.
    --security-profile-runtime-rules: Apply runtime rules in the specified security profile to the cluster.
    --security-profile=: Name and version of the security profile to be applied to the cluster.
    --timeout=&: Timeout (seconds) for waiting on the operation to complete.
    --zone=: Compute zone (e.g. us-central1-a) for a zonal cluster.
documentation:
    command: |
        *(ALPHA)*  Upgrades the Kubernetes version of an existing container cluster.

        This command upgrades the Kubernetes version of the *node pools* or *master* of
        a cluster. Note that the Kubernetes version of the cluster's *master* is
        also periodically upgraded automatically as new releases are available.

        If desired cluster version is omitted, *node pool* upgrades default to the
        current *master* version and *master* upgrades default to the default
        cluster version, which can be found in the server config.

        *During node pool upgrades, nodes will be deleted and recreated.* While
        persistent Kubernetes resources, such as
        Pods backed by replication controllers, will be rescheduled onto new
        nodes, a small cluster may experience a few minutes where there are
        insufficient nodes available to run all of the scheduled Kubernetes
        resources.

        *Please ensure that any data you wish to keep is stored on a persistent*
        *disk before upgrading the cluster.* Ephemeral Kubernetes resources--in
        particular, Pods without replication controllers--will be lost, while
        persistent Kubernetes resources will get rescheduled.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        cluster-version: |-
            The GKE release version to which to upgrade the cluster's node pools or master.
            +
            If desired cluster version is omitted, *node pool* upgrades default to the current
            *master* version and *master* upgrades default to the default cluster version,
            which can be found in the server config.
            +
            You can find the list of allowed versions for upgrades by running:
            +
              $ gcloud container get-server-config
        control-plane-soak-duration: |
            The soak duration for the rollback-able control plane upgrade.
            It only applies to minor version upgrades.
            Setting this flag will trigger a control plane upgrade with emulated version.
            The cluster is rollback-able during the soak period. The soak period can be
            set between 6 hours and 7 days.
        image: |
            A specific image to use on the new instances.
        image-project: |
            /
            A specific project from which contains the os image or image family.  This is
            required when using --image-type=CUSTOM.
        image-type: |-
            The image type to use for the cluster/node pool. Defaults to server-specified.
            +
            Image Type specifies the base OS that the nodes in the cluster/node pool will run on.
            If an image type is specified, that will be assigned to the cluster/node pool and all
            future upgrades will use the specified image type. If it is not specified the
            server will pick the default image type.
            +
            The default image type and the list of valid image types are available
            using the following command.
            +
              $ gcloud container get-server-config
        location: Compute zone or region (e.g. us-central1-a or us-central1) for the cluster. Overrides the default compute/region or compute/zone value for this command invocation. Prefer using this flag over the --region or --zone flags.
        master: Upgrade the cluster's master. Node pools cannot be upgraded at the  same time as the master.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-master: Upgrade the cluster's master. Node pools cannot be upgraded at the  same time as the master.
        no-security-profile-runtime-rules: |
            Apply runtime rules in the specified security profile to the cluster.
            When enabled, a security profile controller and webhook
            are deployed on the cluster to enforce the runtime rules. If
            --no-security-profile-runtime-rules is specified to disable this
            feature, only bootstrapping rules are applied, and no security profile
            controller or webhook are installed.
        node-pool: The node pool to upgrade.
        region: Compute region (e.g. us-central1) for a regional cluster. Overrides the default compute/region property value for this command invocation.
        security-profile: |-
            Name and version of the security profile to be applied to the cluster.
            If not specified, the current security profile settings are preserved.
            If the current security profile is not supported in the new cluster
            version, this option must be explicitly specified with a supported
            security profile, otherwise the operation will fail.
            +
            Examples:
            +
              $ {command} example-cluster --security-profile=default-1.0-gke.1
        security-profile-runtime-rules: |-
            Apply runtime rules in the specified security profile to the cluster.
            When enabled, a security profile controller and webhook
            are deployed on the cluster to enforce the runtime rules. If
            --no-security-profile-runtime-rules is specified to disable this
            feature, only bootstrapping rules are applied, and no security profile
            controller or webhook are installed.
        timeout: Timeout (seconds) for waiting on the operation to complete.
        zone: Compute zone (e.g. us-central1-a) for a zonal cluster. Overrides the default compute/zone property value for this command invocation.
