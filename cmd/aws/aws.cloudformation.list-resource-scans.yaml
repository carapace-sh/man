name: list-resource-scans
description: List the resource scans from newest to oldest.
flags:
    --max-results=: If the number of available results exceeds this maximum, the response includes a `NextToken` value that you can use for the `NextToken` parameter to get the next set of results.
    --next-token=: The token for the next set of items to return.
    --scan-type-filter=: The scan type that you want to get summary information about.
completion:
    flag:
        scan-type-filter:
            - FULL
            - PARTIAL
documentation:
    command: List the resource scans from newest to oldest. By default it will return up to 10 resource scans.
    flag:
        max-results: If the number of available results exceeds this maximum, the response includes a `NextToken` value that you can use for the `NextToken` parameter to get the next set of results. The default value is 10. The maximum value is 100.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
        scan-type-filter: The scan type that you want to get summary information about. The default is `FULL`.
