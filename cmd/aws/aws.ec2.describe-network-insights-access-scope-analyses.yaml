name: describe-network-insights-access-scope-analyses
description: Describes the specified Network Access Scope analyses.
flags:
    --analysis-start-time-begin=: Filters the results based on the start time.
    --analysis-start-time-end=: Filters the results based on the start time.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
