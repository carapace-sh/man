name: set-password
description: Changes a user's password in a given instance.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --discard-dual-password: Discard the user's secondary password.
    --host=: Cloud SQL user's hostname expressed as a specific IP address or address range.
    --instance=!: Cloud SQL instance ID.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-discard-dual-password&: Discard the user's secondary password.
    --no-prompt-for-password&: Prompt for the Cloud SQL user's password with character echo disabled.
    --no-retain-password&: Retain the old password when changing to the new password.
    --password=: Cloud SQL user's password.
    --prompt-for-password: Prompt for the Cloud SQL user's password with character echo disabled.
    --retain-password: Retain the old password when changing to the new password.
documentation:
    command: |-
        Changes a user's password in a given instance with specified username and
        host.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        discard-dual-password: Discard the user's secondary password. Cannot set password and set this flag. This flag is only available for MySQL 8.0.
        host: Cloud SQL user's hostname expressed as a specific IP address or address range. `%` denotes an unrestricted hostname. Applicable flag for MySQL instances; ignored for all other engines. Note, if you connect to your instance using IP addresses, you must add your client IP address as an authorized address, even if your hostname is unrestricted. For more information, see [Configure IP](https://cloud.google.com/sql/docs/mysql/configure-ip).
        instance: Cloud SQL instance ID.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-discard-dual-password: Discard the user's secondary password. Cannot set password and set this flag. This flag is only available for MySQL 8.0.
        no-prompt-for-password: Prompt for the Cloud SQL user's password with character echo disabled. The password is all typed characters up to but not including the RETURN or ENTER key.
        no-retain-password: Retain the old password when changing to the new password. Must set password with this flag. This flag is only available for MySQL 8.0.
        password: Cloud SQL user's password.
        prompt-for-password: Prompt for the Cloud SQL user's password with character echo disabled. The password is all typed characters up to but not including the RETURN or ENTER key.
        retain-password: Retain the old password when changing to the new password. Must set password with this flag. This flag is only available for MySQL 8.0.
