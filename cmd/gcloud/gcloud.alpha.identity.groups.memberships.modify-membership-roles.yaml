name: modify-membership-roles
description: '*(ALPHA)*  Add/remove/modify membership roles of a membership in a group.'
flags:
    --add-roles=: Membership roles to be added.
    --group-email=!: The email address of the group that member-email belongs to.
    --member-email=!: The email address of the group or user that is being updated
    --remove-roles=: Membership role names to be removed.
    --update-roles-params=: Resource representing the parameters to update membership roles.
documentation:
    command: '*(ALPHA)*  Add/remove/modify membership roles OR update expiry details of membership in a group.'
    flag:
        add-roles: |-
            Membership roles to be added.
            Currently supported MembershipRole: 'MEMBER', 'OWNER', 'MANAGER'.
        group-email: The email address of the group that member-email belongs to.
        member-email: The email address of the group or user that is being updated
        remove-roles: |-
            Membership role names to be removed.
            Currently supported MembershipRole: 'OWNER', 'MANAGER'.
            MEMBER-less owner is not supported so removing just MEMBER role won't be possible.
        update-roles-params: |-
            Resource representing the parameters to update membership roles.
            An example would be ``--update-roles-params MEMBER=expiry_details.expire_time''.
