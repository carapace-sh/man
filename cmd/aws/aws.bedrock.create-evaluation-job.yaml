name: create-evaluation-job
description: Creates an evaluation job.
flags:
    --application-type=: Specifies whether the evaluation job is for evaluating a model or evaluating a knowledge base (retrieval and response generation).
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=: A unique, case-sensitive identifier to ensure that the API request completes no more than one time.
    --customer-encryption-key-id=: Specify your customer managed encryption key Amazon Resource Name (ARN) that will be used to encrypt your evaluation job.
    --evaluation-config=!: Contains the configuration details of either an automated or human-based evaluation job.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --inference-config=!: Contains the configuration details of the inference model for the evaluation job.
    --job-description=: A description of the evaluation job.
    --job-name=!: A name for the evaluation job.
    --job-tags=:
        description: Tags to attach to the model evaluation job.
        nargs: -1
    --output-data-config=!: Contains the configuration details of the Amazon S3 bucket for storing the results of the evaluation job.
    --role-arn=!: The Amazon Resource Name (ARN) of an IAM service role that Amazon Bedrock can assume to perform tasks on your behalf.
completion:
    flag:
        application-type:
            - ModelEvaluation
            - RagEvaluation
documentation:
    command: Creates an evaluation job.
    flag:
        application-type: Specifies whether the evaluation job is for evaluating a model or evaluating a knowledge base (retrieval and response generation).
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: A unique, case-sensitive identifier to ensure that the API request completes no more than one time. If this token matches a previous request, Amazon Bedrock ignores the request, but does not return an error. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html).
        customer-encryption-key-id: Specify your customer managed encryption key Amazon Resource Name (ARN) that will be used to encrypt your evaluation job.
        evaluation-config: Contains the configuration details of either an automated or human-based evaluation job.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        inference-config: |-
            Contains the configuration details of the inference model for the evaluation job.

            For model evaluation jobs, automated jobs support a single model or [inference profile](https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html), and jobs that use human workers support two models or inference profiles.
        job-description: A description of the evaluation job.
        job-name: A name for the evaluation job. Names must unique with your Amazon Web Services account, and your account's Amazon Web Services region.
        job-tags: Tags to attach to the model evaluation job.
        output-data-config: Contains the configuration details of the Amazon S3 bucket for storing the results of the evaluation job.
        role-arn: The Amazon Resource Name (ARN) of an IAM service role that Amazon Bedrock can assume to perform tasks on your behalf. To learn more about the required permissions, see [Required permissions for model evaluations](https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-security.html).
