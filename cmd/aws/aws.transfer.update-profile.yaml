name: update-profile
description: Updates some of the parameters for an existing profile.
flags:
    --certificate-ids=: An array of identifiers for the imported certificates.
    --profile-id=!: The identifier of the profile object that you are updating.
documentation:
    command: Updates some of the parameters for an existing profile. Provide the `ProfileId` for the profile that you want to update, along with the new values for the parameters to update.
    flag:
        certificate-ids: An array of identifiers for the imported certificates. You use this identifier for working with profiles and partner profiles.
        profile-id: The identifier of the profile object that you are updating.
