name: list-configuration-history
description: Lists the INFO, WARN, and ERROR events for periodic configuration updates performed by Application Insights.
flags:
    --account-id=: The Amazon Web Services account ID for the resource group owner.
    --end-time=: The end time of the event.
    --event-status=: The status of the configuration update event.
    --max-results=: The maximum number of results returned by `ListConfigurationHistory` in paginated output.
    --next-token=: The `NextToken` value returned from a previous paginated `ListConfigurationHistory` request where `MaxResults` was used and the results exceeded the value of that parameter.
    --resource-group-name=: Resource group to which the application belongs.
    --start-time=: The start time of the event.
completion:
    flag:
        event-status:
            - INFO
            - WARN
            - ERROR
documentation:
    command: |-
        Lists the INFO, WARN, and ERROR events for periodic configuration updates performed by Application Insights. Examples of events represented are:

        - INFO: creating a new alarm or updating an alarm threshold.
        - WARN: alarm not created due to insufficient data points used to predict thresholds.
        - ERROR: alarm not created due to permission errors or exceeding quotas.
    flag:
        account-id: The Amazon Web Services account ID for the resource group owner.
        end-time: The end time of the event.
        event-status: The status of the configuration update event. Possible values include INFO, WARN, and ERROR.
        max-results: The maximum number of results returned by `ListConfigurationHistory` in paginated output. When this parameter is used, `ListConfigurationHistory` returns only `MaxResults` in a single page along with a `NextToken` response element. The remaining results of the initial request can be seen by sending another `ListConfigurationHistory` request with the returned `NextToken` value. If this parameter is not used, then `ListConfigurationHistory` returns all results.
        next-token: The `NextToken` value returned from a previous paginated `ListConfigurationHistory` request where `MaxResults` was used and the results exceeded the value of that parameter. Pagination continues from the end of the previous results that returned the `NextToken` value. This value is `null` when there are no more results to return.
        resource-group-name: Resource group to which the application belongs.
        start-time: The start time of the event.
