name: describe
description: '*(ALPHA)*  Describe a Filestore snapshot.'
flags:
    --region=: Region (e.g. us-central1) for the snapshot.
    --zone=: Zone (e.g. us-central1-c) for the snapshot.
documentation:
    command: |
        *(ALPHA)*  Displays all data associated with a Filestore snapshot given a valid snapshot name.

        This command can fail for the following reasons:
          * The snapshot specified does not exist.
          * The active account does not have permission to access the given
            snapshot.
    flag:
        region: Region (e.g. us-central1) for the snapshot.
        zone: Zone (e.g. us-central1-c) for the snapshot.
