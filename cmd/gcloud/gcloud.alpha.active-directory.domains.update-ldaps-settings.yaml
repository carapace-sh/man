name: update-ldaps-settings
description: '*(ALPHA)*  Update the LDAPS settings for a domain.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --certificate-password=: Password used to encrypt the PKCS#12 certificate.
    --certificate-pfx-file=!: PKCS#12-formatted pfx file that specifies the certificate chain used to configure LDAPS.
    --clear-certificates: Disable LDAPS by deleting all existing certificates.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-certificates&: Disable LDAPS by deleting all existing certificates.
documentation:
    command: |
        *(ALPHA)*  Update a Managed Microsoft AD domain's Lightweight Directory Access Protocol over TLS/SSL (LDAPS) settings.
        You must be safelisted for the Managed AD LDAPS Alpha in order to use this feature.
        Consult the API documentation for a list of certificate requirements.

        This command can fail for the following reasons:
          * The certificate is invalid.
          * The domain specified does not exist.
          * The active account does not have permission to view LDAPS settings for the domain.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        certificate-password: Password used to encrypt the PKCS#12 certificate. If not specified, command will prompt user for secret.
        certificate-pfx-file: |-
            PKCS#12-formatted pfx file that specifies the certificate chain used to configure LDAPS.
            If certificate-password is not specified, command will prompt user for secret. Use a full or relative path to a local file containing the value of certificate_pfx_file.
        clear-certificates: Disable LDAPS by deleting all existing certificates. Certificates will need to be re-uploaded if LDAPS is to be re-enabled.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-certificates: |
            Disable LDAPS by deleting all existing certificates. Certificates will need to be re-uploaded if LDAPS is to be re-enabled.
