name: create-channel-namespace
description: Creates a `ChannelNamespace` for an `Api`.
flags:
    --api-id=!: The `Api` ID.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --code-handlers=: The event handler functions that run custom business logic to process published events and subscribe requests.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --handler-configs=: The configuration for the `OnPublish` and `OnSubscribe` handlers.
    --name=!: The name of the `ChannelNamespace`.
    --publish-auth-modes=: The authorization mode to use for publishing messages on the channel namespace.
    --subscribe-auth-modes=: The authorization mode to use for subscribing to messages on the channel namespace.
    --tags=: ""
documentation:
    command: Creates a `ChannelNamespace` for an `Api`.
    flag:
        api-id: The `Api` ID.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        code-handlers: The event handler functions that run custom business logic to process published events and subscribe requests.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        handler-configs: The configuration for the `OnPublish` and `OnSubscribe` handlers.
        name: The name of the `ChannelNamespace`. This name must be unique within the `Api`
        publish-auth-modes: The authorization mode to use for publishing messages on the channel namespace. This configuration overrides the default `Api` authorization configuration.
        subscribe-auth-modes: The authorization mode to use for subscribing to messages on the channel namespace. This configuration overrides the default `Api` authorization configuration.
        tags: ""
