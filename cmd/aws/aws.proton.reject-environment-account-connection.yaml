name: reject-environment-account-connection
description: In a management account, reject an environment account connection from another environment account.
flags:
    --id=!: The ID of the environment account connection to reject.
documentation:
    command: |-
        In a management account, reject an environment account connection from another environment account.

        After you reject an environment account connection request, you *can't* accept or use the rejected environment account connection.

        You *can’t* reject an environment account connection that's connected to an environment.

        For more information, see [Environment account connections](https://docs.aws.amazon.com/proton/latest/userguide/ag-env-account-connections.html) in the *Proton User guide*.
    flag:
        id: The ID of the environment account connection to reject.
