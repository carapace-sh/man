name: remove-flow-vpc-interface
description: Removes a VPC Interface from an existing flow.
flags:
    --flow-arn=!: The Amazon Resource Name (ARN) of the flow that you want to remove a VPC interface from.
    --vpc-interface-name=!: The name of the VPC interface that you want to remove.
documentation:
    command: Removes a VPC Interface from an existing flow. This request can be made only on a VPC interface that does not have a Source or Output associated with it. If the VPC interface is referenced by a Source or Output, you must first delete or update the Source or Output to no longer reference the VPC interface.
    flag:
        flow-arn: The Amazon Resource Name (ARN) of the flow that you want to remove a VPC interface from.
        vpc-interface-name: The name of the VPC interface that you want to remove.
