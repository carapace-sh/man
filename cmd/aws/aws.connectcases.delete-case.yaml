name: delete-case
description: The DeleteCase API permanently deletes a case and all its associated resources from the cases data store.
flags:
    --case-id=!: A unique identifier of the case.
    --domain-id=!: A unique identifier of the Cases domain.
documentation:
    command: |-
        The DeleteCase API permanently deletes a case and all its associated resources from the cases data store. After a successful deletion, you cannot:

        - Retrieve related items
        - Access audit history
        - Perform any operations that require the CaseID

        This action is irreversible. After you delete a case, you cannot recover its data.
    flag:
        case-id: A unique identifier of the case.
        domain-id: A unique identifier of the Cases domain.
