name: list-application-components
description: Retrieves a list of all the application components (processes).
flags:
    --application-component-criteria=: Criteria for filtering the list of application components.
    --filter-value=: Specify the value based on the application component criteria type.
    --group-id-filter=: The group ID specified in to filter on.
    --max-results=: The maximum number of items to include in the response.
    --next-token=: The token from a previous call that you use to retrieve the next set of results.
    --sort=: Specifies whether to sort by ascending (`ASC`) or descending (`DESC`) order.
completion:
    flag:
        application-component-criteria:
            - NOT_DEFINED
            - APP_NAME
            - SERVER_ID
            - APP_TYPE
            - STRATEGY
            - DESTINATION
            - ANALYSIS_STATUS
            - ERROR_CATEGORY
        sort:
            - ASC
            - DESC
documentation:
    command: Retrieves a list of all the application components (processes).
    flag:
        application-component-criteria: Criteria for filtering the list of application components.
        filter-value: Specify the value based on the application component criteria type. For example, if `applicationComponentCriteria` is set to `SERVER_ID` and `filterValue` is set to `server1`, then [ListApplicationComponents]() returns all the application components running on server1.
        group-id-filter: The group ID specified in to filter on.
        max-results: The maximum number of items to include in the response. The maximum value is 100.
        next-token: The token from a previous call that you use to retrieve the next set of results. For example, if a previous call to this action returned 100 items, but you set `maxResults` to 10. You'll receive a set of 10 results along with a token. You then use the returned token to retrieve the next set of 10.
        sort: Specifies whether to sort by ascending (`ASC`) or descending (`DESC`) order.
