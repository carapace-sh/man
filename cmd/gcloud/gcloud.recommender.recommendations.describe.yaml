name: describe
description: Describe a recommendation for a Cloud project.
flags:
    --billing-account=: The Google Cloud Platform billing account ID to use for this invocation.
    --folder=: The Google Cloud Platform folder ID to use for this invocation.
    --location=!: Location
    --organization=: The Google Cloud Platform organization ID to use for this invocation.
    --recommender=!: Recommender of the recommendations
documentation:
    command: |-
        Describe a recommendation. This currently supports the following parent
        entities: project, billing account, folder, and organization.

        ## EXAMPLES
        To describe a recommendation:

         $ gcloud recommender recommendations describe RECOMMENDATION_ID --project=${PROJECT} --location=${LOCATION}
         --recommender=${RECOMMENDER}
    flag:
        billing-account: The Google Cloud Platform billing account ID to use for this invocation.
        folder: The Google Cloud Platform folder ID to use for this invocation.
        location: Location
        organization: The Google Cloud Platform organization ID to use for this invocation.
        recommender: Recommender of the recommendations
