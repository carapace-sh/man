name: describe-capacity-manager-data-exports
description: Describes one or more Capacity Manager data export configurations.
flags:
    --capacity-manager-data-export-ids=: The IDs of the data export configurations to describe.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: One or more filters to narrow the results.
    --max-results=: The maximum number of results to return in a single call.
    --next-token=: The token for the next page of results.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: Describes one or more Capacity Manager data export configurations. Returns information about export settings, delivery status, and recent export activity.
    flag:
        capacity-manager-data-export-ids: The IDs of the data export configurations to describe. If not specified, all export configurations are returned.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: One or more filters to narrow the results. Supported filters include export status, creation date, and S3 bucket name.
        max-results: The maximum number of results to return in a single call. If not specified, up to 1000 results are returned.
        next-token: The token for the next page of results. Use this value in a subsequent call to retrieve additional results.
