name: delete-resolver-rule
description: Deletes a Resolver rule.
flags:
    --resolver-rule-id=!: The ID of the Resolver rule that you want to delete.
documentation:
    command: Deletes a Resolver rule. Before you can delete a Resolver rule, you must disassociate it from all the VPCs that you associated the Resolver rule with. For more information, see [DisassociateResolverRule](https://docs.aws.amazon.com/Route53/latest/APIReference/API_route53resolver_DisassociateResolverRule.html).
    flag:
        resolver-rule-id: The ID of the Resolver rule that you want to delete.
