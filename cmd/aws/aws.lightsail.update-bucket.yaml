name: update-bucket
description: Updates an existing Amazon Lightsail bucket.
flags:
    --access-log-config=: An object that describes the access log configuration for the bucket.
    --access-rules=: An object that sets the public accessibility of objects in the specified bucket.
    --bucket-name=!: The name of the bucket to update.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cors=: Sets the cross-origin resource sharing (CORS) configuration for your bucket.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --readonly-access-accounts=:
        description: An array of strings to specify the Amazon Web Services account IDs that can access the bucket.
        nargs: -1
    --versioning=: Specifies whether to enable or suspend versioning of objects in the bucket.
documentation:
    command: |-
        Updates an existing Amazon Lightsail bucket.

        Use this action to update the configuration of an existing bucket, such as versioning, public accessibility, and the Amazon Web Services accounts that can access the bucket.
    flag:
        access-log-config: An object that describes the access log configuration for the bucket.
        access-rules: An object that sets the public accessibility of objects in the specified bucket.
        bucket-name: The name of the bucket to update.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cors: |-
            Sets the cross-origin resource sharing (CORS) configuration for your bucket. If a CORS configuration exists, it is replaced with the specified configuration. For AWS CLI operations, this parameter can also be passed as a file. For more information, see [Configuring cross-origin resource sharing (CORS)](https://docs.aws.amazon.com/lightsail/latest/userguide/configure-cors.html).

            CORS information is only returned in a response when you update the CORS policy.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        readonly-access-accounts: |-
            An array of strings to specify the Amazon Web Services account IDs that can access the bucket.

            You can give a maximum of 10 Amazon Web Services accounts access to a bucket.
        versioning: |-
            Specifies whether to enable or suspend versioning of objects in the bucket.

            The following options can be specified:

            - `Enabled` - Enables versioning of objects in the specified bucket.
            - `Suspended` - Suspends versioning of objects in the specified bucket. Existing object versions are retained.
