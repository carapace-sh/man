name: list-permissions
description: Retrieves a list of available RAM permissions that you can use for the supported resource types.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: Specifies the total number of results that you want included on each page of the response.
    --next-token=: Specifies that you want to receive the next page of results.
    --permission-type=: 'Specifies that you want to list only permissions of this type:'
    --resource-type=: Specifies that you want to list only those permissions that apply to the specified resource type.
completion:
    flag:
        permission-type:
            - ALL
            - AWS_MANAGED
            - CUSTOMER_MANAGED
documentation:
    command: Retrieves a list of available RAM permissions that you can use for the supported resource types.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: Specifies the total number of results that you want included on each page of the response. If you do not include this parameter, it defaults to a value that is specific to the operation. If additional items exist beyond the number you specify, the `NextToken` response element is returned with a value (not null). Include the specified value as the `NextToken` request parameter in the next call to the operation to get the next part of the results. Note that the service might return fewer results than the maximum even when there are more results available. You should check `NextToken` after every operation to ensure that you receive all of the results.
        next-token: Specifies that you want to receive the next page of results. Valid only if you received a `NextToken` response in the previous request. If you did, it indicates that more output is available. Set this parameter to the value provided by the previous call's `NextToken` response to request the next page of results.
        permission-type: |-
            Specifies that you want to list only permissions of this type:

            - `AWS` – returns only Amazon Web Services managed permissions.
            - `LOCAL` – returns only customer managed permissions
            - `ALL` – returns both Amazon Web Services managed permissions and customer managed permissions.

            If you don't specify this parameter, the default is `All`.
        resource-type: |-
            Specifies that you want to list only those permissions that apply to the specified resource type. This parameter is not case sensitive.

            For example, to list only permissions that apply to Amazon EC2 subnets, specify `ec2:subnet`. You can use the [ListResourceTypes]() operation to get the specific string required.
