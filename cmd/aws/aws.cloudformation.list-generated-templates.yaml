documentation:
    command: Lists your generated templates in this Region.
    flag:
        max-results: If the number of available results exceeds this maximum, the response includes a `NextToken` value that you can use for the `NextToken` parameter to get the next set of results. By default the `ListGeneratedTemplates` API action will return at most 50 results in each response. The maximum value is 100.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
