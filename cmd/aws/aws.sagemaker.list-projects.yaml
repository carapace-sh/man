name: list-projects
description: Gets a list of the projects in an Amazon Web Services account.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --creation-time-after=: A filter that returns the projects that were created after a specified time.
    --creation-time-before=: A filter that returns the projects that were created before a specified time.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of projects to return in the response.
    --name-contains=: A filter that returns the projects whose name contains a specified string.
    --next-token=: If the result of the previous `ListProjects` request was truncated, the response includes a `NextToken`.
    --sort-by=: The field by which to sort results.
    --sort-order=: The sort order for results.
completion:
    flag:
        sort-by:
            - Name
            - CreationTime
        sort-order:
            - Ascending
            - Descending
documentation:
    command: Gets a list of the projects in an Amazon Web Services account.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        creation-time-after: A filter that returns the projects that were created after a specified time.
        creation-time-before: A filter that returns the projects that were created before a specified time.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The maximum number of projects to return in the response.
        name-contains: A filter that returns the projects whose name contains a specified string.
        next-token: If the result of the previous `ListProjects` request was truncated, the response includes a `NextToken`. To retrieve the next set of projects, use the token in the next request.
        sort-by: The field by which to sort results. The default is `CreationTime`.
        sort-order: The sort order for results. The default is `Ascending`.
