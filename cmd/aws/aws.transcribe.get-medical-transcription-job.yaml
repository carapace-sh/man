name: get-medical-transcription-job
description: Provides information about the specified medical transcription job.
flags:
    --medical-transcription-job-name=!: The name of the medical transcription job you want information about.
documentation:
    command: |-
        Provides information about the specified medical transcription job.

        To view the status of the specified medical transcription job, check the `TranscriptionJobStatus` field. If the status is `COMPLETED`, the job is finished. You can find the results at the location specified in `TranscriptFileUri`. If the status is `FAILED`, `FailureReason` provides details on why your transcription job failed.

        To get a list of your medical transcription jobs, use the operation.
    flag:
        medical-transcription-job-name: The name of the medical transcription job you want information about. Job names are case sensitive.
