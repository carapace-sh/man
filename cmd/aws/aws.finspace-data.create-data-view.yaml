name: create-data-view
description: Creates a Dataview for a Dataset.
flags:
    --as-of-timestamp=: Beginning time to use for the Dataview.
    --auto-update: Flag to indicate Dataview should be updated automatically.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A token that ensures idempotency.
    --dataset-id=!: The unique Dataset identifier that is used to create a Dataview.
    --destination-type-params=!: Options that define the destination type for the Dataview.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-auto-update: Flag to indicate Dataview should be updated automatically.
    --partition-columns=: Ordered set of column names used to partition data.
    --sort-columns=: Columns to be used for sorting the data.
documentation:
    command: Creates a Dataview for a Dataset.
    flag:
        as-of-timestamp: Beginning time to use for the Dataview. The value is determined as epoch time in milliseconds. For example, the value for Monday, November 1, 2021 12:00:00 PM UTC is specified as 1635768000000.
        auto-update: Flag to indicate Dataview should be updated automatically.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A token that ensures idempotency. This token expires in 10 minutes.
        dataset-id: The unique Dataset identifier that is used to create a Dataview.
        destination-type-params: Options that define the destination type for the Dataview.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        partition-columns: Ordered set of column names used to partition data.
        sort-columns: Columns to be used for sorting the data.
