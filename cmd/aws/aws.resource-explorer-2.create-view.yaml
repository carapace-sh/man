name: create-view
description: Creates a view that users can query by using the [Search]() operation.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: This value helps ensure idempotency.
    --filters=: An array of strings that specify which resources are included in the results of queries made using this view.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --included-properties=: Specifies optional fields that you want included in search results from this view.
    --scope=: The root ARN of the account, an organizational unit (OU), or an organization ARN.
    --tags=: Tag key and value pairs that are attached to the view.
    --view-name=!: The name of the new view.
documentation:
    command: |-
        Creates a view that users can query by using the [Search]() operation. Results from queries that you make using this view include only resources that match the view's `Filters`. For more information about Amazon Web Services Resource Explorer views, see [Managing views](https://docs.aws.amazon.com/resource-explorer/latest/userguide/manage-views.html) in the *Amazon Web Services Resource Explorer User Guide*.

        Only the principals with an IAM identity-based policy that grants `Allow` to the `Search` action on a `Resource` with the [Amazon resource name (ARN)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) of this view can [Search]() using views you create with this operation.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: This value helps ensure idempotency. Resource Explorer uses this value to prevent the accidental creation of duplicate versions. We recommend that you generate a [UUID-type value](https://wikipedia.org/wiki/Universally_unique_identifier) to ensure the uniqueness of your views.
        filters: |-
            An array of strings that specify which resources are included in the results of queries made using this view. When you use this view in a [Search]() operation, the filter string is combined with the search's `QueryString` parameter using a logical `AND` operator.

            For information about the supported syntax, see [Search query reference for Resource Explorer](https://docs.aws.amazon.com/resource-explorer/latest/userguide/using-search-query-syntax.html) in the *Amazon Web Services Resource Explorer User Guide*.

            This query string in the context of this operation supports only [filter prefixes](https://docs.aws.amazon.com/resource-explorer/latest/userguide/using-search-query-syntax.html#query-syntax-filters) with optional [operators](https://docs.aws.amazon.com/resource-explorer/latest/userguide/using-search-query-syntax.html#query-syntax-operators). It doesn't support free-form text. For example, the string `region:us* service:ec2 -tag:stage=prod` includes all Amazon EC2 resources in any Amazon Web Services Region that begins with the letters `us` and is *not* tagged with a key `Stage` that has the value `prod`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        included-properties: |-
            Specifies optional fields that you want included in search results from this view. It is a list of objects that each describe a field to include.

            The default is an empty list, with no optional fields included in the results.
        scope: The root ARN of the account, an organizational unit (OU), or an organization ARN. If left empty, the default is account.
        tags: Tag key and value pairs that are attached to the view.
        view-name: |-
            The name of the new view. This name appears in the list of views in Resource Explorer.

            The name must be no more than 64 characters long, and can include letters, digits, and the dash (-) character. The name must be unique within its Amazon Web Services Region.
