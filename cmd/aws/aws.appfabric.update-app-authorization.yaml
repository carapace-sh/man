name: update-app-authorization
description: Updates an app authorization within an app bundle, which allows AppFabric to connect to an application.
flags:
    --app-authorization-identifier=!: The Amazon Resource Name (ARN) or Universal Unique Identifier (UUID) of the app authorization to use for the request.
    --app-bundle-identifier=!: The Amazon Resource Name (ARN) or Universal Unique Identifier (UUID) of the app bundle to use for the request.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --credential=: Contains credentials for the application, such as an API key or OAuth2 client ID and secret.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --tenant=: Contains information about an application tenant, such as the application display name and identifier.
documentation:
    command: |-
        Updates an app authorization within an app bundle, which allows AppFabric to connect to an application.

        If the app authorization was in a `connected` state, updating the app authorization will set it back to a `PendingConnect` state.
    flag:
        app-authorization-identifier: The Amazon Resource Name (ARN) or Universal Unique Identifier (UUID) of the app authorization to use for the request.
        app-bundle-identifier: The Amazon Resource Name (ARN) or Universal Unique Identifier (UUID) of the app bundle to use for the request.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        credential: |-
            Contains credentials for the application, such as an API key or OAuth2 client ID and secret.

            Specify credentials that match the authorization type of the app authorization to update. For example, if the authorization type of the app authorization is OAuth2 (`oauth2`), then you should provide only the OAuth2 credentials.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        tenant: Contains information about an application tenant, such as the application display name and identifier.
