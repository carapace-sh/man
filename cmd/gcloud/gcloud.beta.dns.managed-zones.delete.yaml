name: delete
description: '*(BETA)*  Delete an empty Cloud DNS managed-zone.'
flags:
    --location=: Specifies the desired service location the request is sent to.
documentation:
    command: |-
        *(BETA)*  This command deletes an empty Cloud DNS managed-zone. An empty managed-zone
        has only SOA and NS record-sets.

        ## EXAMPLES

        To delete an empty managed-zone, run:

          $ gcloud beta dns managed-zones delete my-zone

        To delete an empty zonal managed-zone in us-east1-c, run:

          $ gcloud beta dns managed-zones delete my-zone --location=us-east1-c
    flag:
        location: Specifies the desired service location the request is sent to. Defaults to Cloud DNS global service. Use --location=global if you want to target the global service.
