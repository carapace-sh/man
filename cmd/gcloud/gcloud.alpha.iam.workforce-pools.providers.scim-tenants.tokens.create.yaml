    --location=: The location for the workforce pool.
    --provider=: The ID to use for the workforce pool provider, which becomes the final component of the
    --scim-tenant=: The ID for the SCIM tenant, which becomes the final component of the resource name.
    --workforce-pool=: The ID to use for the workforce pool, which becomes the final component of the
documentation:
    command: |
        *(ALPHA)*  Create a new SCIM token associated with a specific workforce identity pool provider SCIM tenant.

        Upon successful creation, the command returns the created SCIM token resource.
    flag:
        display-name: Optional, user-specified display name for the SCIM token (max 32 characters).
        location: |-
            The location for the workforce pool.
            +
            To set the `location` attribute:
            * provide the argument `token` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        provider: |-
            The ID to use for the workforce pool provider, which becomes the final component of the
            resource name. This value must be unique within the workforce pool, 4-32 characters in length,
            and may contain the characters [a-z0-9-]. The prefix `gcp-` is reserved for use by Google,
            and may not be specified.
            +

            To set the `provider` attribute:
            * provide the argument `token` on the command line with a fully specified name;
            * provide the argument `--provider` on the command line.
        scim-tenant: |-
            The ID for the SCIM tenant, which becomes the final component of the resource name.
            This value must be 4-32 characters, alphanumeric ([a-z0-9-]), and cannot start with gcp-.
            +

            To set the `scim-tenant` attribute:
            * provide the argument `token` on the command line with a fully specified name;
            * provide the argument `--scim-tenant` on the command line.
        workforce-pool: |-
            The ID to use for the workforce pool, which becomes the final component of the
            resource name. This value must be a globally unique string of 6 to 63 lowercase letters,
            digits, or hyphens. It must start with a letter, and cannot have a trailing hyphen.
            The prefix `gcp-` is reserved for use by Google, and may not be specified.
            +

            To set the `workforce-pool` attribute:
            * provide the argument `token` on the command line with a fully specified name;
            * provide the argument `--workforce-pool` on the command line.
