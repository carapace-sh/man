name: update-state-machine-alias
description: Updates the configuration of an existing state machine [alias](https://docs.aws.amazon.com/step-functions/latest/dg/concepts-state-machine-alias.html) by modifying its `description` or `routingConfiguration`.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description of the state machine alias.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --routing-configuration=:
        description: The routing configuration of the state machine alias.
        nargs: -1
    --state-machine-alias-arn=!: The Amazon Resource Name (ARN) of the state machine alias.
documentation:
    command: |-
        Updates the configuration of an existing state machine [alias](https://docs.aws.amazon.com/step-functions/latest/dg/concepts-state-machine-alias.html) by modifying its `description` or `routingConfiguration`.

        You must specify at least one of the `description` or `routingConfiguration` parameters to update a state machine alias.

        `UpdateStateMachineAlias` is an idempotent API. Step Functions bases the idempotency check on the `stateMachineAliasArn`, `description`, and `routingConfiguration` parameters. Requests with the same parameters return an idempotent response.

        This operation is eventually consistent. All [StartExecution]() requests made within a few seconds use the latest alias configuration. Executions started immediately after calling `UpdateStateMachineAlias` may use the previous routing configuration.

        **Related operations:**

        - [CreateStateMachineAlias]()
        - [DescribeStateMachineAlias]()
        - [ListStateMachineAliases]()
        - [DeleteStateMachineAlias]()
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description of the state machine alias.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        routing-configuration: |-
            The routing configuration of the state machine alias.

            An array of `RoutingConfig` objects that specifies up to two state machine versions that the alias starts executions for.
        state-machine-alias-arn: The Amazon Resource Name (ARN) of the state machine alias.
