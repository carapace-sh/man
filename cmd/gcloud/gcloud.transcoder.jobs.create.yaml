name: create
description: Create Transcoder jobs.
flags:
    --batch-mode-priority=: Processing priority of a batch mode transcoder job.
    --file=: Path to job config.
    --input-uri=: Google Cloud Storage URI.
    --json=: Job config in json format.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: ID of the location or fully qualified identifier for the location.
    --mode=: Processing mode of transcode job.
    --optimization=: Optimization strategy of transcode job.
    --output-uri=: Google Cloud Storage directory URI (followed by a trailing forward slash).
    --priority=&: (REMOVED) Job priority, default 0.
    --template-id=: Job template id.
completion:
    flag:
        mode:
            - PROCESSING_MODE_INTERACTIVE
            - PROCESSING_MODE_BATCH
        optimization:
            - AUTODETECT
            - DISABLED
documentation:
    command: Create Transcoder jobs.
    flag:
        batch-mode-priority: Processing priority of a batch mode transcoder job. This value will override batch mode priority in job config.
        file: Path to job config.
        input-uri: Google Cloud Storage URI. This value will override input URI in job config.
        json: Job config in json format.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line;
            * set the property `transcoder/location`.
        mode: 'Processing mode of transcode job. This value will override mode in job config. _MODE_ must be one of: *PROCESSING_MODE_INTERACTIVE*, *PROCESSING_MODE_BATCH*.'
        optimization: 'Optimization strategy of transcode job. This value will override optimization in job config. _OPTIMIZATION_ must be one of: *AUTODETECT*, *DISABLED*.'
        output-uri: Google Cloud Storage directory URI (followed by a trailing forward slash). This value will override output URI in job config.
        priority: |-
            (REMOVED) Job priority, default 0.
            +
            The --region option is removed.
        template-id: Job template id.
