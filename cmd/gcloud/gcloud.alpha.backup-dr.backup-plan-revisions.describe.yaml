name: describe
description: '*(ALPHA)*  Show details of the backup plan revision.'
flags:
    --backup-plan=: The ID of the Backup Plan
    --location=: Location ID of the resource.
documentation:
    command: '*(ALPHA)*  Show all data associated with the specified backup plan revision.'
    flag:
        backup-plan: |-
            The ID of the Backup Plan
            +
            To set the `backup_plan` attribute:
            * provide the argument `backup_plan_revision` on the command line with a fully specified name;
            * provide the argument `--backup_plan` on the command line.
        location: |-
            Location ID of the resource.
            +

            To set the `location` attribute:
            * provide the argument `backup_plan_revision` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
