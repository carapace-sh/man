name: list-assistant-associations
description: Lists information about assistant associations.
flags:
    --assistant-id=!: The identifier of the Wisdom assistant.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
documentation:
    command: Lists information about assistant associations.
    flag:
        assistant-id: The identifier of the Wisdom assistant. Can be either the ID or the ARN. URLs cannot contain the ARN.
        max-results: The maximum number of results to return per page.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
