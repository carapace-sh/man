name: associate-package
description: Associates a package with an Amazon OpenSearch Service domain.
flags:
    --association-configuration=: The configuration for associating a package with an Amazon OpenSearch Service domain.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-name=!: Name of the domain to associate the package with.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --package-id=!: Internal ID of the package to associate with a domain.
    --prerequisite-package-id-list=:
        description: A list of package IDs that must be associated with the domain before the package specified in the request can be associated.
        nargs: -1
documentation:
    command: Associates a package with an Amazon OpenSearch Service domain. For more information, see [Custom packages for Amazon OpenSearch Service](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/custom-packages.html).
    flag:
        association-configuration: The configuration for associating a package with an Amazon OpenSearch Service domain.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain-name: Name of the domain to associate the package with.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        package-id: Internal ID of the package to associate with a domain. Use `DescribePackages` to find this value.
        prerequisite-package-id-list: A list of package IDs that must be associated with the domain before the package specified in the request can be associated.
