name: delete
description: '*(ALPHA)*  *(DEPRECATED)*  Delete Cloud Storage objects and buckets.'
hidden: true
flags:
    --additional-headers=: Includes arbitrary headers in storage API calls.
    --no-recursive&: Recursively delete the contents of any directories that match the path expression.
    --num-threads=&: The number of threads to use for the delete.
    --recursive: Recursively delete the contents of any directories that match the path expression.
documentation:
    command: |4
        *(ALPHA)*  *(DEPRECATED)*  This command is deprecated. Use `gcloud alpha storage rm` instead.

        *gcloud alpha storage delete* lets you delete Cloud Storage objects and buckets. You can
        specify one or more paths (including wildcards) and all matching objects
        and buckets will be deleted.
    flag:
        additional-headers: Includes arbitrary headers in storage API calls. Accepts a comma separated list of key=value pairs, e.g. `header1=value1,header2=value2`. Overrides the default *storage/additional_headers* property value for this command invocation.
        no-recursive: Recursively delete the contents of any directories that match the path expression.
        num-threads: The number of threads to use for the delete.
        recursive: Recursively delete the contents of any directories that match the path expression.
