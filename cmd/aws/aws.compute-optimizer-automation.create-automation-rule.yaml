name: create-automation-rule
description: Creates a new automation rule to apply recommended actions to resources based on specified criteria.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique identifier to ensure idempotency of the request.
    --criteria=: A set of conditions that specify which recommended action qualify for implementation.
    --description=: A description of the automation rule.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the automation rule.
    --organization-configuration=: Configuration for organization-level rules.
    --priority=: A string representation of a decimal number between 0 and 1 (having up to 30 digits after the decimal point) that determines the priority of the rule.
    --recommended-action-types=!:
        description: The types of recommended actions this rule will automate.
        nargs: -1
    --rule-type=!: The type of rule.
    --schedule=!: The schedule for when the rule should run.
    --status=!: The status of the rule
    --tags=:
        description: The tags to associate with the rule.
        nargs: -1
completion:
    flag:
        rule-type:
            - OrganizationRule
            - AccountRule
        status:
            - Active
            - Inactive
documentation:
    command: Creates a new automation rule to apply recommended actions to resources based on specified criteria.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique identifier to ensure idempotency of the request.
        criteria: A set of conditions that specify which recommended action qualify for implementation. When a rule is active and a recommended action matches these criteria, Compute Optimizer implements the action at the scheduled run time.
        description: A description of the automation rule.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the automation rule.
        organization-configuration: Configuration for organization-level rules. Required for OrganizationRule type.
        priority: A string representation of a decimal number between 0 and 1 (having up to 30 digits after the decimal point) that determines the priority of the rule. When multiple rules match the same recommended action, Compute Optimizer assigns the action to the rule with the lowest priority value (highest priority), even if that rule is scheduled to run later than other matching rules.
        recommended-action-types: The types of recommended actions this rule will automate.
        rule-type: |-
            The type of rule.

            Only the management account or a delegated administrator can set the ruleType to be OrganizationRule.
        schedule: The schedule for when the rule should run.
        status: The status of the rule
        tags: The tags to associate with the rule.
