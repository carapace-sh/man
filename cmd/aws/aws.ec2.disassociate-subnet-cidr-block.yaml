name: disassociate-subnet-cidr-block
description: Disassociates a CIDR block from a subnet.
flags:
    --association-id=!: The association ID for the CIDR block.
documentation:
    command: Disassociates a CIDR block from a subnet. Currently, you can disassociate an IPv6 CIDR block only. You must detach or delete all gateways and resources that are associated with the CIDR block before you can disassociate it.
    flag:
        association-id: The association ID for the CIDR block.
