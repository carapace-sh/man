name: create-app-cookie-stickiness-policy
description: Generates a stickiness policy with sticky session lifetimes that follow that of an application-generated cookie.
flags:
    --cookie-name=!: The name of the application cookie used for stickiness.
    --load-balancer-name=!: The name of the load balancer.
    --policy-name=!: The name of the policy being created.
documentation:
    command: |-
        Generates a stickiness policy with sticky session lifetimes that follow that of an application-generated cookie. This policy can be associated only with HTTP/HTTPS listeners.

        This policy is similar to the policy created by [CreateLBCookieStickinessPolicy](), except that the lifetime of the special Elastic Load Balancing cookie, `AWSELB`, follows the lifetime of the application-generated cookie specified in the policy configuration. The load balancer only inserts a new stickiness cookie when the application response includes a new application cookie.

        If the application cookie is explicitly removed or expires, the session stops being sticky until a new application cookie is issued.

        For more information, see [Application-Controlled Session Stickiness](https://docs.aws.amazon.com/elasticloadbalancing/latest/classic/elb-sticky-sessions.html#enable-sticky-sessions-application) in the *Classic Load Balancers Guide*.
    flag:
        cookie-name: The name of the application cookie used for stickiness.
        load-balancer-name: The name of the load balancer.
        policy-name: The name of the policy being created. Policy names must consist of alphanumeric characters and dashes (-). This name must be unique within the set of policies for this load balancer.
