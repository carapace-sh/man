name: update-image-set-metadata
description: Update image set metadata attributes.
flags:
    --datastore-id=!: The data store identifier.
    --force: 'Setting this flag will force the `UpdateImageSetMetadata` operation for the following attributes:'
    --image-set-id=!: The image set identifier.
    --latest-version-id=!: The latest image set version identifier.
    --no-force&: 'Setting this flag will force the `UpdateImageSetMetadata` operation for the following attributes:'
    --update-image-set-metadata-updates=!: Update image set metadata updates.
documentation:
    command: Update image set metadata attributes.
    flag:
        datastore-id: The data store identifier.
        force: |-
            Setting this flag will force the `UpdateImageSetMetadata` operation for the following attributes:

            - `Tag.StudyInstanceUID`, `Tag.SeriesInstanceUID`, `Tag.SOPInstanceUID`, and `Tag.StudyID`
            - Adding, removing, or updating private tags for an individual SOP Instance
        image-set-id: The image set identifier.
        latest-version-id: The latest image set version identifier.
        update-image-set-metadata-updates: Update image set metadata updates.
