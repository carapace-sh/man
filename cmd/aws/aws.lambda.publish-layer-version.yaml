name: publish-layer-version
description: Creates an [Lambda layer](https://docs.aws.amazon.com/lambda/latest/dg/configuration-layers.html) from a ZIP archive.
flags:
    --compatible-architectures=: A list of compatible [instruction set architectures](https://docs.aws.amazon.com/lambda/latest/dg/foundation-arch.html).
    --compatible-runtimes=: A list of compatible [function runtimes](https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html). Used for filtering with [ListLayers]() and [ListLayerVersions]().
    --content=!: The function layer archive.
    --description=: The description of the version.
    --layer-name=!: The name or Amazon Resource Name (ARN) of the layer.
    --license-info=: The layer's software license.
documentation:
    command: |-
        Creates an [Lambda layer](https://docs.aws.amazon.com/lambda/latest/dg/configuration-layers.html) from a ZIP archive. Each time you call `PublishLayerVersion` with the same layer name, a new version is created.

        Add layers to your function with [CreateFunction]() or [UpdateFunctionConfiguration]().
    flag:
        compatible-architectures: A list of compatible [instruction set architectures](https://docs.aws.amazon.com/lambda/latest/dg/foundation-arch.html).
        compatible-runtimes: |-
            A list of compatible [function runtimes](https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html). Used for filtering with [ListLayers]() and [ListLayerVersions]().

            The following list includes deprecated runtimes. For more information, see [Runtime deprecation policy](https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html#runtime-support-policy).
        content: The function layer archive.
        description: The description of the version.
        layer-name: The name or Amazon Resource Name (ARN) of the layer.
        license-info: |-
            The layer's software license. It can be any of the following:

            - An [SPDX license identifier](https://spdx.org/licenses/). For example, `MIT`.
            - The URL of a license hosted on the internet. For example, `https://opensource.org/licenses/MIT`.
            - The full text of the license.
