name: list-custom-metrics
description: Lists your Device Defender detect custom metrics.
flags:
    --max-results=: The maximum number of results to return at one time.
    --next-token=: The token for the next set of results.
documentation:
    command: |-
        Lists your Device Defender detect custom metrics.

        Requires permission to access the [ListCustomMetrics](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        max-results: The maximum number of results to return at one time. The default is 25.
        next-token: The token for the next set of results.
