name: describe-stack-resources
description: Returns Amazon Web Services resource descriptions for running and deleted stacks.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --logical-resource-id=: The logical name of the resource as specified in the template.
    --physical-resource-id=: The name or unique identifier that corresponds to a physical instance ID of a resource supported by CloudFormation.
    --stack-name=: 'The name or the unique stack ID that is associated with the stack, which aren''t always interchangeable:'
documentation:
    command: |-
        Returns Amazon Web Services resource descriptions for running and deleted stacks. If `StackName` is specified, all the associated resources that are part of the stack are returned. If `PhysicalResourceId` is specified, the associated resources of the stack that the resource belongs to are returned.

        Only the first 100 resources will be returned. If your stack has more resources than this, you should use `ListStackResources` instead.

        For deleted stacks, `DescribeStackResources` returns resource information for up to 90 days after the stack has been deleted.

        You must specify either `StackName` or `PhysicalResourceId`, but not both. In addition, you can specify `LogicalResourceId` to filter the returned result. For more information about resources, the `LogicalResourceId` and `PhysicalResourceId`, see the [CloudFormation User Guide](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/).

        A `ValidationError` is returned if you specify both `StackName` and `PhysicalResourceId` in the same request.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        logical-resource-id: The logical name of the resource as specified in the template.
        physical-resource-id: |-
            The name or unique identifier that corresponds to a physical instance ID of a resource supported by CloudFormation.

            For example, for an Amazon Elastic Compute Cloud (EC2) instance, `PhysicalResourceId` corresponds to the `InstanceId`. You can pass the EC2 `InstanceId` to `DescribeStackResources` to find which stack the instance belongs to and what other resources are part of the stack.

            Required: Conditional. If you don't specify `PhysicalResourceId`, you must specify `StackName`.
        stack-name: |-
            The name or the unique stack ID that is associated with the stack, which aren't always interchangeable:

            - Running stacks: You can specify either the stack's name or its unique stack ID.
            - Deleted stacks: You must specify the unique stack ID.

            Required: Conditional. If you don't specify `StackName`, you must specify `PhysicalResourceId`.
