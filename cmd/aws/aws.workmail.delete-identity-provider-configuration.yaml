name: delete-identity-provider-configuration
description: Disables the integration between IdC and WorkMail.
flags:
    --organization-id=!: The Organization ID.
documentation:
    command: Disables the integration between IdC and WorkMail. Authentication will continue with the directory as it was before the IdC integration. You might have to reset your directory passwords and reconfigure your desktop and mobile email clients.
    flag:
        organization-id: The Organization ID.
