name: describe
description: '*(ALPHA)*  Describe a Dataplex datascan job.'
flags:
    --datascan=: Datascan ID of the Dataplex datascan resource.
    --location=: Location of the Dataplex resource.
    --view=: Displays spec and result data based on the argument value.
completion:
    flag:
        view:
            - basic
            - full
documentation:
    command: |
        *(ALPHA)*  Describe a Dataplex datascan job.

        Displays all details of a Dataplex job given a valid job ID.
    flag:
        datascan: |-
            Datascan ID of the Dataplex datascan resource.
            +

            To set the `datascan` attribute:
            * provide the argument `job` on the command line with a fully specified name;
            * provide the argument `--datascan` on the command line.
        location: |-
            Location of the Dataplex resource.
            +

            To set the `location` attribute:
            * provide the argument `job` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
        view: |-
            Displays spec and result data based on the argument value. The default view is 'basic'. _VIEW_ must be one of:
            +
            *basic*::: Does not include spec and result data in response.
            +
            *full*::: Includes spec and result data in response.
            +
            :::
            +
