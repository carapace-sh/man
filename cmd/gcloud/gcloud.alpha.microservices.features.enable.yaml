name: enable
description: '*(ALPHA)*  Enable a microservices feature.'
hidden: true
documentation:
    command: |-
        *(ALPHA)*  This command can fail for the following reasons:
        * The feature specified does not exist.
        * The active account does not have permission to enable the feature.

        ## EXAMPLES

        The following command enables the `observability` feature:

          $ gcloud alpha microservices features enable observability
