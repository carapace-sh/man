name: delete-stream-processor
description: Deletes the stream processor identified by `Name`.
flags:
    --name=!: The name of the stream processor you want to delete.
documentation:
    command: Deletes the stream processor identified by `Name`. You assign the value for `Name` when you create the stream processor with [CreateStreamProcessor](). You might not be able to use the same name for a stream processor for a few seconds after calling `DeleteStreamProcessor`.
    flag:
        name: The name of the stream processor you want to delete.
