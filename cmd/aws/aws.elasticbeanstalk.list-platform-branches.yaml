name: list-platform-branches
description: Lists the platform branches available for your account in an AWS Region.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --filters=:
        description: Criteria for restricting the resulting list of platform branches.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-records=: The maximum number of platform branch values returned in one call.
    --next-token=: For a paginated request.
documentation:
    command: |-
        Lists the platform branches available for your account in an AWS Region. Provides summary information about each platform branch.

        For definitions of platform branch and other platform-related terms, see [AWS Elastic Beanstalk Platforms Glossary](https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/platforms-glossary.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        filters: "Criteria for restricting the resulting list of platform branches. The filter is evaluated as a logical conjunction (AND) of the separate `SearchFilter` terms.\n\nThe following list shows valid attribute values for each of the `SearchFilter` terms. Most operators take a single value. The `in` and `not_in` operators can take multiple values.\n\n- `Attribute = BranchName`:\n  \n  - `Operator`: `=` | `!=` | `begins_with` | `ends_with` | `contains` | `in` | `not_in`\n- `Attribute = LifecycleState`:\n  \n  - `Operator`: `=` | `!=` | `in` | `not_in`\n  - `Values`: `beta` | `supported` | `deprecated` | `retired`\n- `Attribute = PlatformName`:\n  \n  - `Operator`: `=` | `!=` | `begins_with` | `ends_with` | `contains` | `in` | `not_in`\n- `Attribute = TierType`:\n  \n  - `Operator`: `=` | `!=`\n  - `Values`: `WebServer/Standard` | `Worker/SQS/HTTP`\n\nArray size: limited to 10 `SearchFilter` objects.\n\nWithin each `SearchFilter` item, the `Values` array is limited to 10 items."
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-records: The maximum number of platform branch values returned in one call.
        next-token: |-
            For a paginated request. Specify a token from a previous response page to retrieve the next response page. All other parameter values must be identical to the ones specified in the initial request.

            If no `NextToken` is specified, the first page is retrieved.
