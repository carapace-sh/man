name: register-domain
description: This operation registers a domain.
flags:
    --admin-contact=!: Provides detailed contact information.
    --auto-renew: Indicates whether the domain will be automatically renewed (`true`) or not (`false`).
    --billing-contact=: Provides detailed contact information.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-name=!: The domain name that you want to register.
    --duration-in-years=!: The number of years that you want to register the domain for.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --idn-lang-code=: Reserved for future use.
    --no-auto-renew: Indicates whether the domain will be automatically renewed (`true`) or not (`false`).
    --no-privacy-protect-admin-contact: Whether you want to conceal contact information from WHOIS queries.
    --no-privacy-protect-billing-contact: Whether you want to conceal contact information from WHOIS queries.
    --no-privacy-protect-registrant-contact: Whether you want to conceal contact information from WHOIS queries.
    --no-privacy-protect-tech-contact: Whether you want to conceal contact information from WHOIS queries.
    --privacy-protect-admin-contact: Whether you want to conceal contact information from WHOIS queries.
    --privacy-protect-billing-contact: Whether you want to conceal contact information from WHOIS queries.
    --privacy-protect-registrant-contact: Whether you want to conceal contact information from WHOIS queries.
    --privacy-protect-tech-contact: Whether you want to conceal contact information from WHOIS queries.
    --registrant-contact=!: Provides detailed contact information.
    --tech-contact=!: Provides detailed contact information.
documentation:
    command: "This operation registers a domain. For some top-level domains (TLDs), this operation requires extra parameters.\n\nWhen you register a domain, Amazon Route 53 does the following:\n\n- Creates a Route 53 hosted zone that has the same name as the domain. Route 53 assigns four name servers to your hosted zone and automatically updates your domain registration with the names of these name servers.\n- Enables auto renew, so your domain registration will renew automatically each year. We'll notify you in advance of the renewal date so you can choose whether to renew the registration.\n- Optionally enables privacy protection, so WHOIS queries return contact for the registrar or the phrase \"REDACTED FOR PRIVACY\", or \"On behalf of &lt;domain name&gt; owner.\" If you don't enable privacy protection, WHOIS queries return the information that you entered for the administrative, registrant, and technical contacts.\n  \n  While some domains may allow different privacy settings per contact, we recommend specifying the same privacy setting for all contacts.\n- If registration is successful, returns an operation ID that you can use to track the progress and completion of the action. If the request is not completed successfully, the domain registrant is notified by email.\n- Charges your Amazon Web Services account an amount based on the top-level domain. For more information, see [Amazon Route 53 Pricing](http://aws.amazon.com/route53/pricing/)."
    flag:
        admin-contact: Provides detailed contact information. For information about the values that you specify for each element, see [ContactDetail](https://docs.aws.amazon.com/Route53/latest/APIReference/API_domains_ContactDetail.html).
        auto-renew: |-
            Indicates whether the domain will be automatically renewed (`true`) or not (`false`). Auto renewal only takes effect after the account is charged.

            Default: `true`
        billing-contact: Provides detailed contact information. For information about the values that you specify for each element, see [ContactDetail](https://docs.aws.amazon.com/Route53/latest/APIReference/API_domains_ContactDetail.html).
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain-name: |-
            The domain name that you want to register. The top-level domain (TLD), such as .com, must be a TLD that Route 53 supports. For a list of supported TLDs, see [Domains that You Can Register with Amazon Route 53](https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/registrar-tld-list.html) in the *Amazon Route 53 Developer Guide*.

            The domain name can contain only the following characters:

            - Letters a through z. Domain names are not case sensitive.
            - Numbers 0 through 9.
            - Hyphen (-). You can't specify a hyphen at the beginning or end of a label.
            - Period (.) to separate the labels in the name, such as the `.` in `example.com`.

            Internationalized domain names are not supported for some top-level domains. To determine whether the TLD that you want to use supports internationalized domain names, see [Domains that You Can Register with Amazon Route 53](https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/registrar-tld-list.html). For more information, see [Formatting Internationalized Domain Names](https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/DomainNameFormat.html#domain-name-format-idns).
        duration-in-years: |-
            The number of years that you want to register the domain for. Domains are registered for a minimum of one year. The maximum period depends on the top-level domain. For the range of valid values for your domain, see [Domains that You Can Register with Amazon Route 53](https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/registrar-tld-list.html) in the *Amazon Route 53 Developer Guide*.

            Default: 1
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        idn-lang-code: Reserved for future use.
        privacy-protect-admin-contact: |-
            Whether you want to conceal contact information from WHOIS queries. If you specify `true`, WHOIS ("who is") queries return contact information either for Amazon Registrar or for our registrar associate, Gandi. If you specify `false`, WHOIS queries return the information that you entered for the admin contact.

            You must specify the same privacy setting for the administrative, billing, registrant, and technical contacts.

            Default: `true`
        privacy-protect-billing-contact: |-
            Whether you want to conceal contact information from WHOIS queries. If you specify `true`, WHOIS ("who is") queries return contact information either for Amazon Registrar or for our registrar associate, Gandi. If you specify `false`, WHOIS queries return the information that you entered for the billing contact.

            You must specify the same privacy setting for the administrative, billing, registrant, and technical contacts.
        privacy-protect-registrant-contact: |-
            Whether you want to conceal contact information from WHOIS queries. If you specify `true`, WHOIS ("who is") queries return contact information either for Amazon Registrar or for our registrar associate, Gandi. If you specify `false`, WHOIS queries return the information that you entered for the registrant contact (the domain owner).

            You must specify the same privacy setting for the administrative, billing, registrant, and technical contacts.

            Default: `true`
        privacy-protect-tech-contact: |-
            Whether you want to conceal contact information from WHOIS queries. If you specify `true`, WHOIS ("who is") queries return contact information either for Amazon Registrar or for our registrar associate, Gandi. If you specify `false`, WHOIS queries return the information that you entered for the technical contact.

            You must specify the same privacy setting for the administrative, billing, registrant, and technical contacts.

            Default: `true`
        registrant-contact: Provides detailed contact information. For information about the values that you specify for each element, see [ContactDetail](https://docs.aws.amazon.com/Route53/latest/APIReference/API_domains_ContactDetail.html).
        tech-contact: Provides detailed contact information. For information about the values that you specify for each element, see [ContactDetail](https://docs.aws.amazon.com/Route53/latest/APIReference/API_domains_ContactDetail.html).
