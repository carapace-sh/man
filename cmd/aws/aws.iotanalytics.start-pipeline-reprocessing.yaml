name: start-pipeline-reprocessing
description: Starts the reprocessing of raw message data through the pipeline.
flags:
    --channel-messages=: Specifies one or more sets of channel messages that you want to reprocess.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --end-time=: The end time (exclusive) of raw message data that is reprocessed.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --pipeline-name=!: The name of the pipeline on which to start reprocessing.
    --start-time=: The start time (inclusive) of raw message data that is reprocessed.
documentation:
    command: Starts the reprocessing of raw message data through the pipeline.
    flag:
        channel-messages: |-
            Specifies one or more sets of channel messages that you want to reprocess.

            If you use the `channelMessages` object, you must not specify a value for `startTime` and `endTime`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        end-time: |-
            The end time (exclusive) of raw message data that is reprocessed.

            If you specify a value for the `endTime` parameter, you must not use the `channelMessages` object.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        pipeline-name: The name of the pipeline on which to start reprocessing.
        start-time: |-
            The start time (inclusive) of raw message data that is reprocessed.

            If you specify a value for the `startTime` parameter, you must not use the `channelMessages` object.
