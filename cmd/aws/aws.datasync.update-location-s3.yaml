name: update-location-s3
description: Modifies the following configuration parameters of the Amazon S3 transfer location that you're using with DataSync.
flags:
    --location-arn=!: Specifies the Amazon Resource Name (ARN) of the Amazon S3 transfer location that you're updating.
    --s3-config=: ""
    --s3-storage-class=: Specifies the storage class that you want your objects to use when Amazon S3 is a transfer destination.
    --subdirectory=: Specifies a prefix in the S3 bucket that DataSync reads from or writes to (depending on whether the bucket is a source or destination location).
completion:
    flag:
        s3-storage-class:
            - STANDARD
            - STANDARD_IA
            - ONEZONE_IA
            - INTELLIGENT_TIERING
            - GLACIER
            - DEEP_ARCHIVE
            - OUTPOSTS
            - GLACIER_INSTANT_RETRIEVAL
documentation:
    command: |-
        Modifies the following configuration parameters of the Amazon S3 transfer location that you're using with DataSync.

        Before you begin, make sure that you read the following topics:

        - [Storage class considerations with Amazon S3 locations](https://docs.aws.amazon.com/datasync/latest/userguide/create-s3-location.html#using-storage-classes)
        - [Evaluating S3 request costs when using DataSync](https://docs.aws.amazon.com/datasync/latest/userguide/create-s3-location.html#create-s3-location-s3-requests)
    flag:
        location-arn: Specifies the Amazon Resource Name (ARN) of the Amazon S3 transfer location that you're updating.
        s3-config: ""
        s3-storage-class: |-
            Specifies the storage class that you want your objects to use when Amazon S3 is a transfer destination.

            For buckets in Amazon Web Services Regions, the storage class defaults to `STANDARD`. For buckets on Outposts, the storage class defaults to `OUTPOSTS`.

            For more information, see [Storage class considerations with Amazon S3 transfers](https://docs.aws.amazon.com/datasync/latest/userguide/create-s3-location.html#using-storage-classes).
        subdirectory: |-
            Specifies a prefix in the S3 bucket that DataSync reads from or writes to (depending on whether the bucket is a source or destination location).

            DataSync can't transfer objects with a prefix that begins with a slash (`/`) or includes `//`, `/./`, or `/../` patterns. For example:

            - `/photos`
            - `photos//2006/January`
            - `photos/./2006/February`
            - `photos/../2006/March`
