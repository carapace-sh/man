name: describe-domains
description: Returns domain configuration information about the specified Amazon OpenSearch Service domains.
flags:
    --domain-names=!: Array of OpenSearch Service domain names that you want information about.
documentation:
    command: Returns domain configuration information about the specified Amazon OpenSearch Service domains.
    flag:
        domain-names: Array of OpenSearch Service domain names that you want information about. You must specify at least one domain name.
