name: list-group-resources
description: This operation returns a list of the ARNs of the canaries that are associated with the specified group.
flags:
    --group-identifier=!: Specifies the group to return information for.
    --max-results=: Specify this parameter to limit how many canary ARNs are returned each time you use the `ListGroupResources` operation.
    --next-token=: A token that indicates that there is more data available.
documentation:
    command: This operation returns a list of the ARNs of the canaries that are associated with the specified group.
    flag:
        group-identifier: Specifies the group to return information for. You can specify the group name, the ARN, or the group ID as the `GroupIdentifier`.
        max-results: Specify this parameter to limit how many canary ARNs are returned each time you use the `ListGroupResources` operation. If you omit this parameter, the default of 20 is used.
        next-token: A token that indicates that there is more data available. You can use this token in a subsequent operation to retrieve the next set of results.
