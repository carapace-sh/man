name: list-connection-types
description: The `ListConnectionTypes` API provides a discovery mechanism to learn available connection types in Glue.
flags:
    --max-results=: The maximum number of results to return.
    --next-token=: A continuation token, if this is a continuation call.
documentation:
    command: The `ListConnectionTypes` API provides a discovery mechanism to learn available connection types in Glue. The response contains a list of connection types with high-level details of what is supported for each connection type. The connection types listed are the set of supported options for the `ConnectionType` value in the `CreateConnection` API.
    flag:
        max-results: The maximum number of results to return.
        next-token: A continuation token, if this is a continuation call.
