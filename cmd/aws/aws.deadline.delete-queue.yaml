name: delete-queue
description: Deletes a queue.
flags:
    --farm-id=!: The ID of the farm from which to remove the queue.
    --queue-id=!: The queue ID of the queue to delete.
documentation:
    command: |-
        Deletes a queue.

        You can't recover the jobs in a queue if you delete the queue. Deleting the queue also deletes the jobs in that queue.
    flag:
        farm-id: The ID of the farm from which to remove the queue.
        queue-id: The queue ID of the queue to delete.
