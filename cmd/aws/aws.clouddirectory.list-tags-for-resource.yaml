name: list-tags-for-resource
description: Returns tags for a resource.
flags:
    --max-results=: The `MaxResults` parameter sets the maximum number of results returned in a single page.
    --next-token=: The pagination token.
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource.
documentation:
    command: Returns tags for a resource. Tagging is currently supported only for directories with a limit of 50 tags per directory. All 50 tags are returned for a given directory with this API call.
    flag:
        max-results: The `MaxResults` parameter sets the maximum number of results returned in a single page. This is for future use and is not supported currently.
        next-token: The pagination token. This is for future use. Currently pagination is not supported for tagging.
        resource-arn: The Amazon Resource Name (ARN) of the resource. Tagging is only supported for directories.
