name: get-temporary-glue-table-credentials
description: Allows a caller in a secure environment to assume a role with permission to access Amazon S3.
flags:
    --audit-context=: A structure representing context to access a resource (column names, query ID, etc).
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --duration-seconds=: The time period, between 900 and 21,600 seconds, for the timeout of the temporary credentials.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --permissions=:
        description: Filters the request based on the user having been granted a list of specified permissions on the requested resource(s).
        nargs: -1
    --query-session-context=: A structure used as a protocol between query engines and Lake Formation or Glue.
    --s3-path=: The Amazon S3 path for the table.
    --supported-permission-types=:
        description: A list of supported permission types for the table.
        nargs: -1
    --table-arn=!: The ARN identifying a table in the Data Catalog for the temporary credentials request.
documentation:
    command: |-
        Allows a caller in a secure environment to assume a role with permission to access Amazon S3. In order to vend such credentials, Lake Formation assumes the role associated with a registered location, for example an Amazon S3 bucket, with a scope down policy which restricts the access to a single prefix.

        To call this API, the role that the service assumes must have `lakeformation:GetDataAccess` permission on the resource.
    flag:
        audit-context: A structure representing context to access a resource (column names, query ID, etc).
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        duration-seconds: The time period, between 900 and 21,600 seconds, for the timeout of the temporary credentials.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        permissions: Filters the request based on the user having been granted a list of specified permissions on the requested resource(s).
        query-session-context: A structure used as a protocol between query engines and Lake Formation or Glue. Contains both a Lake Formation generated authorization identifier and information from the request's authorization context.
        s3-path: The Amazon S3 path for the table.
        supported-permission-types: A list of supported permission types for the table. Valid values are `COLUMN_PERMISSION` and `CELL_FILTER_PERMISSION`.
        table-arn: The ARN identifying a table in the Data Catalog for the temporary credentials request.
