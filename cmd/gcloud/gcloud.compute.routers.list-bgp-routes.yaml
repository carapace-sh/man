name: list-bgp-routes
description: List routes advertised and learned on individual BGP sessions, both pre- and post-policy evaluation.
flags:
    --address-family=!: Limit results to routes learned for this Address Family Identifier.
    --destination-range=: Limit results to prefixes.
    --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
    --limit=: Maximum number of resources to list.
    --no-policy-applied&: Routes returned are post-policy evaluation.
    --no-uri&: Print a list of resource URIs instead of the default output, and change the
    --page-size=: Some services group resource list output into pages.
    --peer=!: Limit results to routes learned from this peer (name).
    --policy-applied: Routes returned are post-policy evaluation.
    --region=: Region of the router to list.
    --route-direction=!: Limit results to routes in this direction.
    --sort-by=: Comma-separated list of resource field key names to sort by.
    --uri: Print a list of resource URIs instead of the default output, and change the
completion:
    flag:
        address-family:
            - IPV4
            - IPV6
        route-direction:
            - INBOUND
            - OUTBOUND
documentation:
    command: |
        *gcloud compute routers list-bgp-routes* lists routes advertised and learned on individual BGP sessions, both pre- and post-policy evaluation.
    flag:
        address-family: |-
            Limit results to routes learned for this Address Family Identifier. _ADDRESS_FAMILY_ must be one of:
            +
            *IPV4*::: Interface with IPv4-based BGP.
            *IPV6*::: Interface with IPv6-based BGP.
            :::
            +
        destination-range: Limit results to prefixes.
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        no-policy-applied: Routes returned are post-policy evaluation.
        no-uri: |
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is determined by the
            service if it supports paging, otherwise it is *unlimited* (no paging).
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        peer: Limit results to routes learned from this peer (name).
        policy-applied: Routes returned are post-policy evaluation. Enabled by default, use *--no-policy-applied* to disable.
        region: |-
            Region of the router to list. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        route-direction: |-
            Limit results to routes in this direction. _ROUTE_DIRECTION_ must be one of:
            +
            *INBOUND*::: Learned routes.
            *OUTBOUND*::: Advertised routes.
            :::
            +
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
        uri: |-
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
