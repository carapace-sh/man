name: update-cost-category-definition
description: Updates an existing Cost Category.
flags:
    --cost-category-arn=!: The unique identifier for your Cost Category.
    --default-value=: ""
    --effective-start=: The Cost Category's effective start date.
    --rule-version=!: ""
    --rules=!: The `Expression` object used to categorize costs.
    --split-charge-rules=: The split charge rules used to allocate your charges between your Cost Category values.
completion:
    flag:
        rule-version:
            - CostCategoryExpression.v1
documentation:
    command: Updates an existing Cost Category. Changes made to the Cost Category rules will be used to categorize the current month’s expenses and future expenses. This won’t change categorization for the previous months.
    flag:
        cost-category-arn: The unique identifier for your Cost Category.
        default-value: ""
        effective-start: The Cost Category's effective start date. It can only be a billing start date (first day of the month). If the date isn't provided, it's the first day of the current month. Dates can't be before the previous twelve months, or in the future.
        rule-version: ""
        rules: The `Expression` object used to categorize costs. For more information, see [CostCategoryRule](https://docs.aws.amazon.com/aws-cost-management/latest/APIReference/API_CostCategoryRule.html) .
        split-charge-rules: The split charge rules used to allocate your charges between your Cost Category values.
