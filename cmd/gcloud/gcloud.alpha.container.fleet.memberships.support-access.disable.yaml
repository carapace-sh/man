name: disable
description: '*(ALPHA)*  Disable support access for the specified membership.'
flags:
    --location=: The location of the membership resource, e.g. `us-central1`.
documentation:
    command: |-
        ## EXAMPLES

          To disable support access for membership `my-membership` run:

            $ gcloud alpha container fleet memberships support-access disable my-membership
    flag:
        location: |-
            The location of the membership resource, e.g. `us-central1`.
            If not specified, defaults to `global`.
            +

            To set the `location` attribute:
            * provide the argument `MEMBERSHIP_NAME` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkehub/location`.
