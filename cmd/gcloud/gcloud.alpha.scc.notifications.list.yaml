name: list
description: '*(ALPHA)*  List Security Command Center notification configs.'
flags:
    --api-version=&: ""
    --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
    --folder=: Folder where the notification config resides.
    --limit=: Maximum number of resources to list.
    --location=: Required if either data residency is enabled or the `notificationConfig`
    --organization=: Organization where the notification config resides.
    --page-size=: Some services group resource list output into pages.
    --sort-by=: Comma-separated list of resource field key names to sort by.
completion:
    flag:
        api-version:
            - v1
            - v2enabled
documentation:
    command: |
        *(ALPHA)*  List Security Command Center notification configs.

              Notification Configs that are created with Security Command Center API V2
              and later include a `location` attribute. Include the `--location` flag to
              list Notification Configs with `location` attribute other than `global`.
    flag:
        api-version: |-
            This is a temporary flag to be used for testing the Security Command
            Center v2 api before its launch.
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        folder: |-
            Folder where the notification config resides. Formatted as
            ``folders/456'' or just ``456''.
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        location: |-
            Required if either data residency is enabled or the `notificationConfig`
            resources were created by using the API v2.
            +
            If data residency is enabled, specify the Security Command Center location
            in which the notifications are stored.
            +
            If data residency is not enabled, including `/locations/```LOCATION'' in
            the name or the `--location` flag in the command lists only the
            `notificationConfig` resources that were created by using the Security
            Command Center API v2 and the only valid location is `global`.
        organization: |-
            Organization where the notification config resides. Formatted as
            ``organizations/123'' or just ``123''.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is determined by the
            service if it supports paging, otherwise it is *unlimited* (no paging).
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
