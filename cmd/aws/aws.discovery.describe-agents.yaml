name: describe-agents
description: Lists agents or collectors as specified by ID or other filters.
flags:
    --agent-ids=: The agent or the collector IDs for which you want information.
    --filters=: You can filter the request using various logical operators and a *key*-*value* format.
    --max-results=: The total number of agents/collectors to return in a single page of output.
    --next-token=: Token to retrieve the next set of results.
documentation:
    command: Lists agents or collectors as specified by ID or other filters. All agents/collectors associated with your user can be listed if you call `DescribeAgents` as is without passing any parameters.
    flag:
        agent-ids: The agent or the collector IDs for which you want information. If you specify no IDs, the system returns information about all agents/collectors associated with your user.
        filters: |-
            You can filter the request using various logical operators and a *key*-*value* format. For example:

            `{"key": "collectionStatus", "value": "STARTED"}`
        max-results: The total number of agents/collectors to return in a single page of output. The maximum value is 100.
        next-token: Token to retrieve the next set of results. For example, if you previously specified 100 IDs for `DescribeAgentsRequest$agentIds` but set `DescribeAgentsRequest$maxResults` to 10, you received a set of 10 results along with a token. Use that token in this query to get the next set of 10.
