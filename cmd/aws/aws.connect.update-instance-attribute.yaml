name: update-instance-attribute
description: This API is in preview release for Amazon Connect and is subject to change.
flags:
    --attribute-type=!: The type of attribute.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --value=!: The value for the attribute.
completion:
    flag:
        attribute-type:
            - INBOUND_CALLS
            - OUTBOUND_CALLS
            - CONTACTFLOW_LOGS
            - CONTACT_LENS
            - AUTO_RESOLVE_BEST_VOICES
            - USE_CUSTOM_TTS_VOICES
            - EARLY_MEDIA
            - MULTI_PARTY_CONFERENCE
            - HIGH_VOLUME_OUTBOUND
            - ENHANCED_CONTACT_MONITORING
            - ENHANCED_CHAT_MONITORING
            - MULTI_PARTY_CHAT_CONFERENCE
documentation:
    command: |-
        This API is in preview release for Amazon Connect and is subject to change.

        Updates the value for the specified attribute type.
    flag:
        attribute-type: |-
            The type of attribute.

            Only allowlisted customers can consume USE\_CUSTOM\_TTS\_VOICES. To access this feature, contact Amazon Web Services Support for allowlisting.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If not provided, the Amazon Web Services SDK populates this field. For more information about idempotency, see [Making retries safe with idempotent APIs](https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        value: The value for the attribute. Maximum character limit is 100.
