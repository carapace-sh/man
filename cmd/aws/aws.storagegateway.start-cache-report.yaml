name: start-cache-report
description: Starts generating a report of the file metadata currently cached by an S3 File Gateway for a specific file share.
flags:
    --bucket-region=!: The Amazon Web Services Region of the Amazon S3 bucket where you want to save the cache report.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=!: A unique identifier that you use to ensure idempotent report generation if you need to retry an unsuccessful `StartCacheReport` request.
    --exclusion-filters=:
        description: The list of filters and parameters that determine which files are excluded from the report.
        nargs: -1
    --file-share-arn=!: ""
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --inclusion-filters=:
        description: The list of filters and parameters that determine which files are included in the report.
        nargs: -1
    --location-arn=!: The ARN of the Amazon S3 bucket where you want to save the cache report.
    --role=!: The ARN of the IAM role used when saving the cache report to Amazon S3.
    --tags=:
        description: A list of up to 50 key/value tags that you can assign to the cache report.
        nargs: -1
    --vpc-endpoint-dns-name=: The DNS name of the VPC endpoint associated with the Amazon S3 where you want to save the cache report.
documentation:
    command: |-
        Starts generating a report of the file metadata currently cached by an S3 File Gateway for a specific file share. You can use this report to identify and resolve issues if you have files failing upload from your gateway to Amazon S3. The report is a CSV file containing a list of files which match the set of filter parameters you specify in the request.

        The **Files Failing Upload** flag is reset every 24 hours and during gateway reboot. If this report captures the files after the reset, but before they become flagged again, they will not be reported as **Files Failing Upload**.

        The following requirements must be met to successfully generate a cache report:

        - You must have `s3:PutObject` and `s3:AbortMultipartUpload` permissions for the Amazon S3 bucket where you want to store the cache report.
        - No other cache reports can currently be in-progress for the specified file share.
        - There must be fewer than 10 existing cache reports for the specified file share.
        - The gateway must be online and connected to Amazon Web Services.
        - The root disk must have at least 20GB of free space when report generation starts.
        - You must specify at least one value for `InclusionFilters` or `ExclusionFilters` in the request.
    flag:
        bucket-region: The Amazon Web Services Region of the Amazon S3 bucket where you want to save the cache report.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique identifier that you use to ensure idempotent report generation if you need to retry an unsuccessful `StartCacheReport` request. If you retry a request, use the same `ClientToken` you specified in the initial request.
        exclusion-filters: The list of filters and parameters that determine which files are excluded from the report. You must specify at least one value for `InclusionFilters` or `ExclusionFilters` in a `StartCacheReport` request.
        file-share-arn: ""
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        inclusion-filters: The list of filters and parameters that determine which files are included in the report. You must specify at least one value for `InclusionFilters` or `ExclusionFilters` in a `StartCacheReport` request.
        location-arn: |-
            The ARN of the Amazon S3 bucket where you want to save the cache report.

            We do not recommend saving the cache report to the same Amazon S3 bucket for which you are generating the report.

            This field does not accept access point ARNs.
        role: The ARN of the IAM role used when saving the cache report to Amazon S3.
        tags: A list of up to 50 key/value tags that you can assign to the cache report. Using tags can help you categorize your reports and more easily locate them in search results.
        vpc-endpoint-dns-name: The DNS name of the VPC endpoint associated with the Amazon S3 where you want to save the cache report. Optional.
