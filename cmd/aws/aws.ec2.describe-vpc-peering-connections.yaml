name: describe-vpc-peering-connections
description: Describes your VPC peering connections.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: The filters.
    --max-results=: The maximum number of items to return for this request.
    --next-token=: The token returned from a previous paginated request.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --vpc-peering-connection-ids=: The IDs of the VPC peering connections.
documentation:
    command: Describes your VPC peering connections. The default is to describe all your VPC peering connections. Alternatively, you can specify specific VPC peering connection IDs or filter the results to include only the VPC peering connections that match specific criteria.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            The filters.

            - `accepter-vpc-info.cidr-block` - The IPv4 CIDR block of the accepter VPC.
            - `accepter-vpc-info.owner-id` - The ID of the Amazon Web Services account that owns the accepter VPC.
            - `accepter-vpc-info.vpc-id` - The ID of the accepter VPC.
            - `expiration-time` - The expiration date and time for the VPC peering connection.
            - `requester-vpc-info.cidr-block` - The IPv4 CIDR block of the requester's VPC.
            - `requester-vpc-info.owner-id` - The ID of the Amazon Web Services account that owns the requester VPC.
            - `requester-vpc-info.vpc-id` - The ID of the requester VPC.
            - `status-code` - The status of the VPC peering connection (`pending-acceptance` | `failed` | `expired` | `provisioning` | `active` | `deleting` | `deleted` | `rejected`).
            - `status-message` - A message that provides more information about the status of the VPC peering connection, if applicable.
            - `tag` - The key/value combination of a tag assigned to the resource. Use the tag key in the filter name and the tag value as the filter value. For example, to find all resources that have a tag with the key `Owner` and the value `TeamA`, specify `tag:Owner` for the filter name and `TeamA` for the filter value.
            - `tag-key` - The key of a tag assigned to the resource. Use this filter to find all resources assigned a tag with a specific key, regardless of the tag value.
            - `vpc-peering-connection-id` - The ID of the VPC peering connection.
        max-results: The maximum number of items to return for this request. To get the next page of items, make another request with the token returned in the output. For more information, see [Pagination](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Query-Requests.html#api-pagination).
        next-token: The token returned from a previous paginated request. Pagination continues from the end of the items returned by the previous request.
        vpc-peering-connection-ids: |-
            The IDs of the VPC peering connections.

            Default: Describes all your VPC peering connections.
