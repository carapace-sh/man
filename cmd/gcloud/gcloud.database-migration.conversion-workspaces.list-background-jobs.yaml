name: list-background-jobs
description: List background jobs in the conversion workspaces.
flags:
    --max-size=: The maximum number of jobs to return.
    --most-recent-per-job-type: Returns only the most recent job per job type.
    --no-most-recent-per-job-type&: Returns only the most recent job per job type.
    --region=: The name of the region.
documentation:
    command: List background jobs in the conversion workspaces.
    flag:
        max-size: |-
            The maximum number of jobs to return. The service may return fewer than this value. If
            unspecified, at most 100 jobs will be returned. The maximum value is 100; values above 100
            will be coerced to 100.
        most-recent-per-job-type: Returns only the most recent job per job type.
        no-most-recent-per-job-type: |
            Returns only the most recent job per job type.
        region: |-
            The name of the region.
            +
            To set the `region` attribute:
            * provide the argument `conversion_workspace` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
