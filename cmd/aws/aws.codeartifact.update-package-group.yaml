name: update-package-group
description: Updates a package group.
flags:
    --contact-info=: Contact information which you want to update the requested package group with.
    --description=: The description you want to update the requested package group with.
    --domain-owner=: The 12-digit account number of the Amazon Web Services account that owns the domain.
    --domain=!: The name of the domain which contains the package group to be updated.
    --package-group=!: The pattern of the package group to be updated.
documentation:
    command: Updates a package group. This API cannot be used to update a package group's origin configuration or pattern. To update a package group's origin configuration, use [UpdatePackageGroupOriginConfiguration](https://docs.aws.amazon.com/codeartifact/latest/APIReference/API_UpdatePackageGroupOriginConfiguration.html).
    flag:
        contact-info: Contact information which you want to update the requested package group with.
        description: The description you want to update the requested package group with.
        domain: The name of the domain which contains the package group to be updated.
        domain-owner: The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces.
        package-group: The pattern of the package group to be updated.
