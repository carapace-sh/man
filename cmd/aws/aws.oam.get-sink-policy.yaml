name: get-sink-policy
description: Returns the current sink policy attached to this sink.
flags:
    --sink-identifier=!: The ARN of the sink to retrieve the policy of.
documentation:
    command: Returns the current sink policy attached to this sink. The sink policy specifies what accounts can attach to this sink as source accounts, and what types of data they can share.
    flag:
        sink-identifier: The ARN of the sink to retrieve the policy of.
