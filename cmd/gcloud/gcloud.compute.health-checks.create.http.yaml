    --no-global&: If set, the HTTP health check is global.
    --no-use-serving-port&: 'If given, use the "serving port" for health checks:'
    --port-name=: The port name that this health check monitors.
    --port=: The TCP port number that this health check monitors.
    --proxy-header=: The type of proxy protocol header to be sent to the backend.
