name: update-analysis
description: Updates an analysis in Amazon Quick Sight
flags:
    --analysis-id=!: The ID for the analysis that you're updating.
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the analysis that you're updating.
    --definition=: The definition of an analysis.
    --name=!: A descriptive name for the analysis that you're updating.
    --parameters=: The parameter names and override values that you want to use.
    --source-entity=: A source entity to use for the analysis that you're updating.
    --theme-arn=: The Amazon Resource Name (ARN) for the theme to apply to the analysis that you're creating.
    --validation-strategy=: The option to relax the validation needed to update an analysis with definition objects.
documentation:
    command: Updates an analysis in Amazon Quick Sight
    flag:
        analysis-id: The ID for the analysis that you're updating. This ID displays in the URL of the analysis.
        aws-account-id: The ID of the Amazon Web Services account that contains the analysis that you're updating.
        definition: |-
            The definition of an analysis.

            A definition is the data model of all features in a Dashboard, Template, or Analysis.
        name: A descriptive name for the analysis that you're updating. This name displays for the analysis in the Amazon Quick Sight console.
        parameters: The parameter names and override values that you want to use. An analysis can have any parameter type, and some parameters might accept multiple values.
        source-entity: A source entity to use for the analysis that you're updating. This metadata structure contains details that describe a source template and one or more datasets.
        theme-arn: The Amazon Resource Name (ARN) for the theme to apply to the analysis that you're creating. To see the theme in the Amazon Quick Sight console, make sure that you have access to it.
        validation-strategy: The option to relax the validation needed to update an analysis with definition objects. This skips the validation step for specific errors.
