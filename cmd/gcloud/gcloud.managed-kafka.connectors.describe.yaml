name: describe
description: Describe a Managed Service for Apache Kafka connector.
flags:
    --connect-cluster=: The connect cluster name.
    --location=: ID of the location of the Managed Service for Apache Kafka resource.
documentation:
    command: |
        Describe a Managed Service for Apache Kafka connector.
    flag:
        connect-cluster: |-
            The connect cluster name.
            +

            To set the `connect-cluster` attribute:
            * provide the argument `connector` on the command line with a fully specified name;
            * provide the argument `--connect-cluster` on the command line.
        location: |-
            ID of the location of the Managed Service for Apache Kafka resource. See
            https://cloud.google.com/managed-service-for-apache-kafka/docs/locations for a list of supported
            locations.
            +

            To set the `location` attribute:
            * provide the argument `connector` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
