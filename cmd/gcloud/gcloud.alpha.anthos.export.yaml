name: export
description: '*(ALPHA)*  Export current configuration of an Anthos cluster.'
flags:
    --location=: Specifies the Google Cloud location to use.
    --no-show-exec-error&: If true and command fails, print the underlying command that was executed and its exit status.
    --output-directory=: The output directory of the cluster resources.
    --show-exec-error&: If true and command fails, print the underlying command that was executed and its exit status.
documentation:
    command: '*(ALPHA)*  Export current configuration of an Anthos cluster.'
    flag:
        location: Specifies the Google Cloud location to use. If notspecified will use the current compute/zone property.
        no-show-exec-error: If true and command fails, print the underlying command that was executed and its exit status.
        output-directory: The output directory of the cluster resources. If empty will export files to ./CLUSTER_NAME
        show-exec-error: If true and command fails, print the underlying command that was executed and its exit status.
