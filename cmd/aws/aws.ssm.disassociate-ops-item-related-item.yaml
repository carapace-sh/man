name: disassociate-ops-item-related-item
description: Deletes the association between an OpsItem and a related item.
flags:
    --association-id=!: The ID of the association for which you want to delete an association between the OpsItem and a related item.
    --ops-item-id=!: The ID of the OpsItem for which you want to delete an association between the OpsItem and a related item.
documentation:
    command: Deletes the association between an OpsItem and a related item. For example, this API operation can delete an Incident Manager incident from an OpsItem. Incident Manager is a tool in Amazon Web Services Systems Manager.
    flag:
        association-id: The ID of the association for which you want to delete an association between the OpsItem and a related item.
        ops-item-id: The ID of the OpsItem for which you want to delete an association between the OpsItem and a related item.
