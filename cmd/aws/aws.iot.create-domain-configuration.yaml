name: create-domain-configuration
description: Creates a domain configuration.
flags:
    --application-protocol=: An enumerated string that speciﬁes the application-layer protocol.
    --authentication-type=: An enumerated string that speciﬁes the authentication type.
    --authorizer-config=: An object that specifies the authorization service for a domain.
    --client-certificate-config=: An object that speciﬁes the client certificate conﬁguration for a domain.
    --domain-configuration-name=!: The name of the domain configuration.
    --domain-name=: The name of the domain.
    --server-certificate-arns=: The ARNs of the certificates that IoT passes to the device during the TLS handshake.
    --server-certificate-config=: The server certificate configuration.
    --service-type=: The type of service delivered by the endpoint.
    --tags=: Metadata which can be used to manage the domain configuration.
    --tls-config=: An object that specifies the TLS configuration for a domain.
    --validation-certificate-arn=: The certificate used to validate the server certificate and prove domain name ownership.
completion:
    flag:
        application-protocol:
            - SECURE_MQTT
            - MQTT_WSS
            - HTTPS
            - DEFAULT
        authentication-type:
            - CUSTOM_AUTH_X509
            - CUSTOM_AUTH
            - AWS_X509
            - AWS_SIGV4
            - DEFAULT
        service-type:
            - DATA
            - CREDENTIAL_PROVIDER
            - JOBS
documentation:
    command: |-
        Creates a domain configuration.

        Requires permission to access the [CreateDomainConfiguration](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        application-protocol: |-
            An enumerated string that speciﬁes the application-layer protocol.

            - `SECURE_MQTT` - MQTT over TLS.

            <!--THE END-->

            - `MQTT_WSS` - MQTT over WebSocket.

            <!--THE END-->

            - `HTTPS` - HTTP over TLS.

            <!--THE END-->

            - `DEFAULT` - Use a combination of port and Application Layer Protocol Negotiation (ALPN) to specify application\_layer protocol. For more information, see [Device communication protocols](https://docs.aws.amazon.com/iot/latest/developerguide/protocols.html).
        authentication-type: |-
            An enumerated string that speciﬁes the authentication type.

            - `CUSTOM_AUTH_X509` - Use custom authentication and authorization with additional details from the X.509 client certificate.

            <!--THE END-->

            - `CUSTOM_AUTH` - Use custom authentication and authorization. For more information, see [Custom authentication and authorization](https://docs.aws.amazon.com/iot/latest/developerguide/custom-authentication.html).

            <!--THE END-->

            - `AWS_X509` - Use X.509 client certificates without custom authentication and authorization. For more information, see [X.509 client certificates](https://docs.aws.amazon.com/iot/latest/developerguide/x509-client-certs.html).

            <!--THE END-->

            - `AWS_SIGV4` - Use Amazon Web Services Signature Version 4. For more information, see [IAM users, groups, and roles](https://docs.aws.amazon.com/iot/latest/developerguide/custom-authentication.html).

            <!--THE END-->

            - `DEFAULT` - Use a combination of port and Application Layer Protocol Negotiation (ALPN) to specify authentication type. For more information, see [Device communication protocols](https://docs.aws.amazon.com/iot/latest/developerguide/protocols.html).
        authorizer-config: An object that specifies the authorization service for a domain.
        client-certificate-config: An object that speciﬁes the client certificate conﬁguration for a domain.
        domain-configuration-name: The name of the domain configuration. This value must be unique to a region.
        domain-name: The name of the domain.
        server-certificate-arns: The ARNs of the certificates that IoT passes to the device during the TLS handshake. Currently you can specify only one certificate ARN. This value is not required for Amazon Web Services-managed domains.
        server-certificate-config: The server certificate configuration.
        service-type: |-
            The type of service delivered by the endpoint.

            Amazon Web Services IoT Core currently supports only the `DATA` service type.
        tags: |-
            Metadata which can be used to manage the domain configuration.

            For URI Request parameters use format: ...key1=value1&amp;key2=value2...

            For the CLI command-line parameter use format: &amp;&amp;tags "key1=value1&amp;key2=value2..."

            For the cli-input-json file use format: "tags": "key1=value1&amp;key2=value2..."
        tls-config: An object that specifies the TLS configuration for a domain.
        validation-certificate-arn: The certificate used to validate the server certificate and prove domain name ownership. This certificate must be signed by a public certificate authority. This value is not required for Amazon Web Services-managed domains.
