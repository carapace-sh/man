name: list-asset-revisions
description: Lists the revisions for the asset.
flags:
    --domain-identifier=!: The identifier of the domain.
    --identifier=!: The identifier of the asset.
    --max-results=: The maximum number of revisions to return in a single call to `ListAssetRevisions`.
    --next-token=: When the number of revisions is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of revisions, the response includes a pagination token named `NextToken`.
documentation:
    command: |-
        Lists the revisions for the asset.

        Prerequisites:

        - The asset must exist in the domain.
        - There must be at least one revision of the asset (which happens automatically after creation).
        - The domain must be valid and active.
        - User must have permissions on the asset and domain.
    flag:
        domain-identifier: The identifier of the domain.
        identifier: The identifier of the asset.
        max-results: The maximum number of revisions to return in a single call to `ListAssetRevisions`. When the number of revisions to be listed is greater than the value of `MaxResults`, the response contains a `NextToken` value that you can use in a subsequent call to `ListAssetRevisions` to list the next set of revisions.
        next-token: When the number of revisions is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of revisions, the response includes a pagination token named `NextToken`. You can specify this `NextToken` value in a subsequent call to `ListAssetRevisions` to list the next set of revisions.
