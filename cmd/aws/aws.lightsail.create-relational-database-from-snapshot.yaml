name: create-relational-database-from-snapshot
description: Creates a new database from an existing database snapshot in Amazon Lightsail.
flags:
    --availability-zone=: The Availability Zone in which to create your new database.
    --no-publicly-accessible: Specifies the accessibility options for your new database.
    --no-use-latest-restorable-time: Specifies whether your database is restored from the latest backup time.
    --publicly-accessible: Specifies the accessibility options for your new database.
    --relational-database-bundle-id=: The bundle ID for your new database.
    --relational-database-name=!: The name to use for your new Lightsail database resource.
    --relational-database-snapshot-name=: The name of the database snapshot from which to create your new database.
    --restore-time=: The date and time to restore your database from.
    --source-relational-database-name=: The name of the source database.
    --tags=: The tag keys and optional values to add to the resource during create.
    --use-latest-restorable-time: Specifies whether your database is restored from the latest backup time.
documentation:
    command: |-
        Creates a new database from an existing database snapshot in Amazon Lightsail.

        You can create a new database from a snapshot in if something goes wrong with your original database, or to change it to a different plan, such as a high availability or standard plan.

        The `create relational database from snapshot` operation supports tag-based access control via request tags and resource tags applied to the resource identified by relationalDatabaseSnapshotName. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-controlling-access-using-tags).
    flag:
        availability-zone: |-
            The Availability Zone in which to create your new database. Use the `us-east-2a` case-sensitive format.

            You can get a list of Availability Zones by using the `get regions` operation. Be sure to add the `include relational database Availability Zones` parameter to your request.
        publicly-accessible: Specifies the accessibility options for your new database. A value of `true` specifies a database that is available to resources outside of your Lightsail account. A value of `false` specifies a database that is available only to your Lightsail resources in the same region as your database.
        relational-database-bundle-id: |-
            The bundle ID for your new database. A bundle describes the performance specifications for your database.

            You can get a list of database bundle IDs by using the `get relational database bundles` operation.

            When creating a new database from a snapshot, you cannot choose a bundle that is smaller than the bundle of the source database.
        relational-database-name: |-
            The name to use for your new Lightsail database resource.

            Constraints:

            - Must contain from 2 to 255 alphanumeric characters, or hyphens.
            - The first and last character must be a letter or number.
        relational-database-snapshot-name: The name of the database snapshot from which to create your new database.
        restore-time: "The date and time to restore your database from.\n\nConstraints:\n\n- Must be before the latest restorable time for the database.\n- Cannot be specified if the `use latest restorable time` parameter is `true`.\n- Specified in Coordinated Universal Time (UTC).\n- Specified in the Unix time format.\n  \n  For example, if you wish to use a restore time of October 1, 2018, at 8 PM UTC, then you input `1538424000` as the restore time."
        source-relational-database-name: The name of the source database.
        tags: |-
            The tag keys and optional values to add to the resource during create.

            Use the `TagResource` action to tag a resource after it's created.
        use-latest-restorable-time: |-
            Specifies whether your database is restored from the latest backup time. A value of `true` restores from the latest backup time.

            Default: `false`

            Constraints: Cannot be specified if the `restore time` parameter is provided.
