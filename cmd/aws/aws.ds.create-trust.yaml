name: create-trust
description: Directory Service for Microsoft Active Directory allows you to configure trust relationships.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --conditional-forwarder-ip-addrs=: The IP addresses of the remote DNS server associated with RemoteDomainName.
    --conditional-forwarder-ipv6-addrs=: The IPv6 addresses of the remote DNS server associated with RemoteDomainName.
    --directory-id=!: The Directory ID of the Managed Microsoft AD directory for which to establish the trust relationship.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --remote-domain-name=!: The Fully Qualified Domain Name (FQDN) of the external domain for which to create the trust relationship.
    --selective-auth=: Optional parameter to enable selective authentication for the trust.
    --trust-direction=!: The direction of the trust relationship.
    --trust-password=!: The trust password.
    --trust-type=: The trust relationship type.
completion:
    flag:
        selective-auth:
            - Enabled
            - Disabled
        trust-direction:
            - 'One-Way: Outgoing'
            - 'One-Way: Incoming'
            - Two-Way
        trust-type:
            - Forest
            - External
documentation:
    command: |-
        Directory Service for Microsoft Active Directory allows you to configure trust relationships. For example, you can establish a trust between your Managed Microsoft AD directory, and your existing self-managed Microsoft Active Directory. This would allow you to provide users and groups access to resources in either domain, with a single set of credentials.

        This action initiates the creation of the Amazon Web Services side of a trust relationship between an Managed Microsoft AD directory and an external domain. You can create either a forest trust or an external trust.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        conditional-forwarder-ip-addrs: The IP addresses of the remote DNS server associated with RemoteDomainName.
        conditional-forwarder-ipv6-addrs: The IPv6 addresses of the remote DNS server associated with RemoteDomainName.
        directory-id: The Directory ID of the Managed Microsoft AD directory for which to establish the trust relationship.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        remote-domain-name: The Fully Qualified Domain Name (FQDN) of the external domain for which to create the trust relationship.
        selective-auth: Optional parameter to enable selective authentication for the trust.
        trust-direction: The direction of the trust relationship.
        trust-password: The trust password. The trust password must be the same password that was used when creating the trust relationship on the external domain.
        trust-type: The trust relationship type. `Forest` is the default.
