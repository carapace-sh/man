name: delete-model
description: Deletes a machine learning model currently available for Amazon Lookout for Equipment.
flags:
    --model-name=!: The name of the machine learning model to be deleted.
documentation:
    command: Deletes a machine learning model currently available for Amazon Lookout for Equipment. This will prevent it from being used with an inference scheduler, even one that is already set up.
    flag:
        model-name: The name of the machine learning model to be deleted.
