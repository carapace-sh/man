name: create-option-group
description: Creates a new option group.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --engine-name=!: The name of the engine to associate this option group with.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --major-engine-version=!: Specifies the major version of the engine that this option group should be associated with.
    --option-group-description=!: The description of the option group.
    --option-group-name=!: Specifies the name of the option group to be created.
    --tags=:
        description: Tags to assign to the option group.
        nargs: -1
documentation:
    command: |-
        Creates a new option group. You can create up to 20 option groups.

        This command doesn't apply to RDS Custom.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        engine-name: |-
            The name of the engine to associate this option group with.

            Valid Values:

            - `db2-ae`
            - `db2-se`
            - `mariadb`
            - `mysql`
            - `oracle-ee`
            - `oracle-ee-cdb`
            - `oracle-se2`
            - `oracle-se2-cdb`
            - `postgres`
            - `sqlserver-ee`
            - `sqlserver-se`
            - `sqlserver-ex`
            - `sqlserver-web`
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        major-engine-version: Specifies the major version of the engine that this option group should be associated with.
        option-group-description: The description of the option group.
        option-group-name: |-
            Specifies the name of the option group to be created.

            Constraints:

            - Must be 1 to 255 letters, numbers, or hyphens
            - First character must be a letter
            - Can't end with a hyphen or contain two consecutive hyphens

            Example: `myoptiongroup`
        tags: Tags to assign to the option group.
