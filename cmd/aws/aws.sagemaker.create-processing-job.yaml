name: create-processing-job
description: Creates a processing job.
flags:
    --app-specification=!: Configures the processing job to run a specified Docker container image.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --environment=: The environment variables to set in the Docker container.
    --experiment-config=: ""
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --network-config=: Networking options for a processing job, such as whether to allow inbound and outbound network calls to and from processing containers, and the VPC subnets and security groups to use for VPC-enabled processing jobs.
    --processing-inputs=: An array of inputs configuring the data to download into the processing container.
    --processing-job-name=!: The name of the processing job.
    --processing-output-config=: Output configuration for the processing job.
    --processing-resources=!: Identifies the resources, ML compute instances, and ML storage volumes to deploy for a processing job.
    --role-arn=!: The Amazon Resource Name (ARN) of an IAM role that Amazon SageMaker can assume to perform tasks on your behalf.
    --stopping-condition=: The time limit for how long the processing job is allowed to run.
    --tags=: (Optional) An array of key-value pairs.
documentation:
    command: Creates a processing job.
    flag:
        app-specification: Configures the processing job to run a specified Docker container image.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        environment: |-
            The environment variables to set in the Docker container. Up to 100 key and values entries in the map are supported.

            Do not include any security-sensitive information including account access IDs, secrets, or tokens in any environment fields. As part of the shared responsibility model, you are responsible for any potential exposure, unauthorized access, or compromise of your sensitive data if caused by security-sensitive information included in the request environment variable or plain text fields.
        experiment-config: ""
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        network-config: Networking options for a processing job, such as whether to allow inbound and outbound network calls to and from processing containers, and the VPC subnets and security groups to use for VPC-enabled processing jobs.
        processing-inputs: An array of inputs configuring the data to download into the processing container.
        processing-job-name: The name of the processing job. The name must be unique within an Amazon Web Services Region in the Amazon Web Services account.
        processing-output-config: Output configuration for the processing job.
        processing-resources: Identifies the resources, ML compute instances, and ML storage volumes to deploy for a processing job. In distributed training, you specify more than one instance.
        role-arn: The Amazon Resource Name (ARN) of an IAM role that Amazon SageMaker can assume to perform tasks on your behalf.
        stopping-condition: The time limit for how long the processing job is allowed to run.
        tags: |-
            (Optional) An array of key-value pairs. For more information, see [Using Cost Allocation Tags](https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-alloc-tags.html#allocation-whatURL) in the *Amazon Web Services Billing and Cost Management User Guide*.

            Do not include any security-sensitive information including account access IDs, secrets, or tokens in any tags. As part of the shared responsibility model, you are responsible for any potential exposure, unauthorized access, or compromise of your sensitive data if caused by security-sensitive information included in the request tag variable or plain text fields.
