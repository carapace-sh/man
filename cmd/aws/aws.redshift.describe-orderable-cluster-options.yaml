name: describe-orderable-cluster-options
description: Returns a list of orderable cluster options.
flags:
    --cluster-version=: The version filter value.
    --marker=: An optional parameter that specifies the starting point to return a set of response records.
    --max-records=: The maximum number of response records to return in each call.
    --node-type=: The node type filter value.
documentation:
    command: Returns a list of orderable cluster options. Before you create a new cluster you can use this operation to find what options are available, such as the EC2 Availability Zones (AZ) in the specific Amazon Web Services Region that you can specify, and the node types you can request. The node types differ by available storage, memory, CPU and price. With the cost involved you might want to obtain a list of cluster options in the specific region and specify values when creating a cluster. For more information about managing clusters, go to [Amazon Redshift Clusters](https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-clusters.html) in the *Amazon Redshift Cluster Management Guide*.
    flag:
        cluster-version: |-
            The version filter value. Specify this parameter to show only the available offerings matching the specified version.

            Default: All versions.

            Constraints: Must be one of the version returned from [DescribeClusterVersions]().
        marker: An optional parameter that specifies the starting point to return a set of response records. When the results of a [DescribeOrderableClusterOptions]() request exceed the value specified in `MaxRecords`, Amazon Web Services returns a value in the `Marker` field of the response. You can retrieve the next set of response records by providing the returned marker value in the `Marker` parameter and retrying the request.
        max-records: |-
            The maximum number of response records to return in each call. If the number of remaining response records exceeds the specified `MaxRecords` value, a value is returned in a `marker` field of the response. You can retrieve the next set of records by retrying the command with the returned marker value.

            Default: `100`

            Constraints: minimum 20, maximum 100.
        node-type: The node type filter value. Specify this parameter to show only the available offerings matching the specified node type.
