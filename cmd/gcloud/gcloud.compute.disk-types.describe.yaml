name: describe
description: Describe a Compute Engine disk type.
flags:
    --zone=: Zone of the disk type to describe.
documentation:
    command: |
        *gcloud compute disk-types describe* displays all data associated with a Compute Engine
        disk type.
    flag:
        zone: Zone of the disk type to describe. Overrides the default *compute/zone* property value for this command invocation.
