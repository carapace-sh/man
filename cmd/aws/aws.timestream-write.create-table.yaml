name: create-table
description: Adds a new table to an existing database in your account.
flags:
    --database-name=!: The name of the Timestream database.
    --magnetic-store-write-properties=: Contains properties to set on the table when enabling magnetic store writes.
    --retention-properties=: The duration for which your time-series data must be stored in the memory store and the magnetic store.
    --schema=: The schema of the table.
    --table-name=!: The name of the Timestream table.
    --tags=: A list of key-value pairs to label the table.
documentation:
    command: Adds a new table to an existing database in your account. In an Amazon Web Services account, table names must be at least unique within each Region if they are in the same database. You might have identical table names in the same Region if the tables are in separate databases. While creating the table, you must specify the table name, database name, and the retention properties. [Service quotas apply](https://docs.aws.amazon.com/timestream/latest/developerguide/ts-limits.html). See [code sample](https://docs.aws.amazon.com/timestream/latest/developerguide/code-samples.create-table.html) for details.
    flag:
        database-name: The name of the Timestream database.
        magnetic-store-write-properties: Contains properties to set on the table when enabling magnetic store writes.
        retention-properties: The duration for which your time-series data must be stored in the memory store and the magnetic store.
        schema: The schema of the table.
        table-name: The name of the Timestream table.
        tags: A list of key-value pairs to label the table.
