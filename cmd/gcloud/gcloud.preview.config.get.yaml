name: get
description: '*(PREVIEW)*  Print the value of a Google Cloud CLI property.'
documentation:
    command: |-
        *(PREVIEW)*  gcloud preview config get prints the property value from your active client side configuration
        only.

        ## AVAILABLE PROPERTIES

        {properties}

        ## EXAMPLES

        To print the project property in the core section, run:

          $ gcloud preview config get project

        To print the zone property in the compute section, run:

          $ gcloud preview config get compute/zone
