name: update-tags-for-domain
description: This operation adds or updates tags for a specified domain.
flags:
    --domain-name=!: The domain for which you want to add or update tags.
    --tags-to-update=: A list of the tag keys and values that you want to add or update.
documentation:
    command: |-
        This operation adds or updates tags for a specified domain.

        All tag operations are eventually consistent; subsequent operations might not immediately represent all issued operations.
    flag:
        domain-name: The domain for which you want to add or update tags.
        tags-to-update: A list of the tag keys and values that you want to add or update. If you specify a key that already exists, the corresponding value will be replaced.
