name: query-lineage
description: Use this action to inspect your lineage and discover relationships between entities.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --direction=: Associations between lineage entities have a direction.
    --filters=: A set of filtering parameters that allow you to specify which entities should be returned.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --include-edges: Setting this value to `True` retrieves not only the entities of interest but also the [Associations](https://docs.aws.amazon.com/sagemaker/latest/dg/lineage-tracking-entities.html) and lineage entities on the path.
    --max-depth=: The maximum depth in lineage relationships from the `StartArns` that are traversed.
    --max-results=: Limits the number of vertices in the results.
    --next-token=: Limits the number of vertices in the request.
    --no-include-edges: Setting this value to `True` retrieves not only the entities of interest but also the [Associations](https://docs.aws.amazon.com/sagemaker/latest/dg/lineage-tracking-entities.html) and lineage entities on the path.
    --start-arns=:
        description: A list of resource Amazon Resource Name (ARN) that represent the starting point for your lineage query.
        nargs: -1
completion:
    flag:
        direction:
            - Both
            - Ascendants
            - Descendants
documentation:
    command: Use this action to inspect your lineage and discover relationships between entities. For more information, see [Querying Lineage Entities](https://docs.aws.amazon.com/sagemaker/latest/dg/querying-lineage-entities.html) in the *Amazon SageMaker Developer Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        direction: Associations between lineage entities have a direction. This parameter determines the direction from the StartArn(s) that the query traverses.
        filters: |-
            A set of filtering parameters that allow you to specify which entities should be returned.

            - Properties - Key-value pairs to match on the lineage entities' properties.
            - LineageTypes - A set of lineage entity types to match on. For example: `TrialComponent`, `Artifact`, or `Context`.
            - CreatedBefore - Filter entities created before this date.
            - ModifiedBefore - Filter entities modified before this date.
            - ModifiedAfter - Filter entities modified after this date.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        include-edges: Setting this value to `True` retrieves not only the entities of interest but also the [Associations](https://docs.aws.amazon.com/sagemaker/latest/dg/lineage-tracking-entities.html) and lineage entities on the path. Set to `False` to only return lineage entities that match your query.
        max-depth: The maximum depth in lineage relationships from the `StartArns` that are traversed. Depth is a measure of the number of `Associations` from the `StartArn` entity to the matched results.
        max-results: Limits the number of vertices in the results. Use the `NextToken` in a response to to retrieve the next page of results.
        next-token: Limits the number of vertices in the request. Use the `NextToken` in a response to to retrieve the next page of results.
        start-arns: A list of resource Amazon Resource Name (ARN) that represent the starting point for your lineage query.
