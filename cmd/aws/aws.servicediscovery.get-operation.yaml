name: get-operation
description: Gets information about any operation that returns an operation ID in the response, such as a `CreateHttpNamespace` request.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --operation-id=!: The ID of the operation that you want to get more information about.
    --owner-account=: The ID of the Amazon Web Services account that owns the namespace associated with the operation, as specified in the namespace `ResourceOwner` field.
documentation:
    command: |-
        Gets information about any operation that returns an operation ID in the response, such as a `CreateHttpNamespace` request.

        To get a list of operations that match specified criteria, see [ListOperations](https://docs.aws.amazon.com/cloud-map/latest/api/API_ListOperations.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        operation-id: The ID of the operation that you want to get more information about.
        owner-account: The ID of the Amazon Web Services account that owns the namespace associated with the operation, as specified in the namespace `ResourceOwner` field. For operations associated with namespaces that are shared with your account, you must specify an `OwnerAccount`.
