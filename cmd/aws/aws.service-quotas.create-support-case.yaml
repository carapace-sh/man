name: create-support-case
description: Creates a Support case for an existing quota increase request.
flags:
    --request-id=!: The ID of the pending quota increase request for which you want to open a Support case.
documentation:
    command: Creates a Support case for an existing quota increase request. This call only creates a Support case if the request has a `Pending` status.
    flag:
        request-id: The ID of the pending quota increase request for which you want to open a Support case.
