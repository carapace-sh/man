name: describe
description: '*(ALPHA)*  Describe a Compute Engine snapshot.'
flags:
    --global: If set, the snapshot is global.
    --no-global&: If set, the snapshot is global.
    --region=: Region of the snapshot to describe.
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute snapshots describe* displays all data associated with a Compute Engine snapshot
        in a project.

        Given an existing snapshot is queried, successful output of this command
        looks like the following:

        ```
        creationTimestamp: '2018-05-07T10:45:46.988-07:00'
        diskSizeGb: '500'
        id: '1234567891234567890'
        kind: compute#snapshot
        labelFingerprint: 12345abcdWW=
        name: zs9utdhb8r1x
        selfLink: https://www.googleapis.com/compute/v1/projects/test-project-name/global/snapshots/snapshot-number
        sourceDisk: https://www.googleapis.com/compute/v1/projects/test-project-name/zones/us-central1-c/disks/test
        sourceDiskId: '1234567891234567890'
        status: READY
        storageBytes: '0'
        storageBytesStatus: UP_TO_DATE
        ```
    flag:
        global: If set, the snapshot is global.
        no-global: If set, the snapshot is global.
        region: Region of the snapshot to describe. Overrides the default *compute/region* property value for this command invocation.
