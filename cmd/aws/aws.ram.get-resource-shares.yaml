name: get-resource-shares
description: Retrieves details about the resource shares that you own or that are shared with you.
flags:
    --max-results=: Specifies the total number of results that you want included on each page of the response.
    --name=: Specifies the name of an individual resource share that you want to retrieve details about.
    --next-token=: Specifies that you want to receive the next page of results.
    --permission-arn=: Specifies that you want to retrieve details of only those resource shares that use the managed permission with this [Amazon Resource Name (ARN)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html).
    --permission-version=: Specifies that you want to retrieve details for only those resource shares that use the specified version of the managed permission.
    --resource-owner=!: 'Specifies that you want to retrieve details of only those resource shares that match the following:'
    --resource-share-arns=: Specifies the [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) of individual resource shares that you want information about.
    --resource-share-status=: Specifies that you want to retrieve details of only those resource shares that have this status.
    --tag-filters=: Specifies that you want to retrieve details of only those resource shares that match the specified tag keys and values.
completion:
    flag:
        resource-owner:
            - SELF
            - OTHER-ACCOUNTS
        resource-share-status:
            - PENDING
            - ACTIVE
            - FAILED
            - DELETING
            - DELETED
documentation:
    command: Retrieves details about the resource shares that you own or that are shared with you.
    flag:
        max-results: Specifies the total number of results that you want included on each page of the response. If you do not include this parameter, it defaults to a value that is specific to the operation. If additional items exist beyond the number you specify, the `NextToken` response element is returned with a value (not null). Include the specified value as the `NextToken` request parameter in the next call to the operation to get the next part of the results. Note that the service might return fewer results than the maximum even when there are more results available. You should check `NextToken` after every operation to ensure that you receive all of the results.
        name: Specifies the name of an individual resource share that you want to retrieve details about.
        next-token: Specifies that you want to receive the next page of results. Valid only if you received a `NextToken` response in the previous request. If you did, it indicates that more output is available. Set this parameter to the value provided by the previous call's `NextToken` response to request the next page of results.
        permission-arn: Specifies that you want to retrieve details of only those resource shares that use the managed permission with this [Amazon Resource Name (ARN)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html).
        permission-version: Specifies that you want to retrieve details for only those resource shares that use the specified version of the managed permission.
        resource-owner: |-
            Specifies that you want to retrieve details of only those resource shares that match the following:

            - **`SELF`** – resource shares that your account shares with other accounts
            - **`OTHER-ACCOUNTS`** – resource shares that other accounts share with your account
        resource-share-arns: Specifies the [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) of individual resource shares that you want information about.
        resource-share-status: Specifies that you want to retrieve details of only those resource shares that have this status.
        tag-filters: Specifies that you want to retrieve details of only those resource shares that match the specified tag keys and values.
