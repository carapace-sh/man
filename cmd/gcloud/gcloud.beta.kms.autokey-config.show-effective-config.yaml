name: show-effective-config
description: '*(BETA)*  Gets the effective Cloud KMS AutokeyConfig for a given project.'
documentation:
    command: |-
        *(BETA)*  gcloud beta kms autokey-config show-effective-config can be used to get the effective Cloud KMS AutokeyConfig for a given
        project.

        ## EXAMPLES

        The following command retrieves the effective Cloud KMS AutokeyConfig for a
        given project `my-project`:

        $ gcloud beta kms autokey-config show-effective-config --project=my-project

        If --project flag is not provided, then the current project will be used.
