name: get-builtin-slot-types
description: Gets a list of built-in slot types that meet the specified criteria.
flags:
    --locale=: A list of locales that the slot type supports.
    --max-results=: The maximum number of slot types to return in the response.
    --next-token=: A pagination token that fetches the next page of slot types.
    --signature-contains=: Substring to match in built-in slot type signatures.
completion:
    flag:
        locale:
            - de-DE
            - en-AU
            - en-GB
            - en-IN
            - en-US
            - es-419
            - es-ES
            - es-US
            - fr-FR
            - fr-CA
            - it-IT
            - ja-JP
            - ko-KR
documentation:
    command: |-
        Gets a list of built-in slot types that meet the specified criteria.

        For a list of built-in slot types, see [Slot Type Reference](https://developer.amazon.com/public/solutions/alexa/alexa-skills-kit/docs/built-in-intent-ref/slot-type-reference) in the *Alexa Skills Kit*.

        This operation requires permission for the `lex:GetBuiltInSlotTypes` action.
    flag:
        locale: A list of locales that the slot type supports.
        max-results: The maximum number of slot types to return in the response. The default is 10.
        next-token: A pagination token that fetches the next page of slot types. If the response to this API call is truncated, Amazon Lex returns a pagination token in the response. To fetch the next page of slot types, specify the pagination token in the next request.
        signature-contains: Substring to match in built-in slot type signatures. A slot type will be returned if any part of its signature matches the substring. For example, "xyz" matches both "xyzabc" and "abcxyz."
