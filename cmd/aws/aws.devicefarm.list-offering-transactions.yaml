name: list-offering-transactions
description: Returns a list of all historical purchases, renewals, and system renewal transactions for an AWS account.
flags:
    --next-token=: An identifier that was returned from the previous call to this operation, which can be used to return the next set of items in the list.
documentation:
    command: Returns a list of all historical purchases, renewals, and system renewal transactions for an AWS account. The list is paginated and ordered by a descending timestamp (most recent transactions are first). The API returns a `NotEligible` error if the user is not permitted to invoke the operation. If you must be able to invoke this operation, contact [aws-devicefarm-support@amazon.com](mailto:aws-devicefarm-support@amazon.com).
    flag:
        next-token: An identifier that was returned from the previous call to this operation, which can be used to return the next set of items in the list.
