name: get-custom-verification-email-template
description: Returns the custom email verification template for the template name you specify.
flags:
    --template-name=!: The name of the custom verification email template that you want to retrieve.
documentation:
    command: |-
        Returns the custom email verification template for the template name you specify.

        For more information about custom verification email templates, see [Using custom verification email templates](https://docs.aws.amazon.com/ses/latest/dg/creating-identities.html#send-email-verify-address-custom) in the *Amazon SES Developer Guide*.

        You can execute this operation no more than once per second.
    flag:
        template-name: The name of the custom verification email template that you want to retrieve.
