name: create
description: '*(BETA)*  Creates a Parallelstore instance.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --capacity-gib=!: The instance's storage capacity in Gibibytes (GiB).
    --deployment-type=: The deployment type of the instance.
    --description=: The description of the instance.
    --directory-stripe-level=: Stripe level for directories.
    --file-stripe-level=: Stripe level for files.
    --labels=: Cloud Labels are a flexible and lightweight mechanism for organizing cloud
    --location=: The location id of the instance resource.
    --network=!: ID of the network or fully qualified identifier for the network.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: The region id of the address resource.
    --request-id=: An optional request ID to identify requests.
    --reserved-ip-range=!: ID of the address or fully qualified identifier for the address.
completion:
    flag:
        deployment-type:
            - persistent
            - scratch
        directory-stripe-level:
            - directory-stripe-level-balanced
            - directory-stripe-level-max
            - directory-stripe-level-min
        file-stripe-level:
            - file-stripe-level-balanced
            - file-stripe-level-max
            - file-stripe-level-min
documentation:
    command: |
        *(BETA)*  Creates a Parallelstore instance.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        capacity-gib: |-
            The instance's storage capacity in Gibibytes (GiB). Allowed values are
            between 12000 and 100000, in multiples of 4000; e.g., 12000, 16000,
            20000, ...
        deployment-type: |-
            The deployment type of the instance. Allowed values are:
            +
            * `SCRATCH`: the instance is a scratch instance.
            * `PERSISTENT`: the instance is a persistent instance.
            +
            _DEPLOYMENT_TYPE_ must be one of:
            +
            *persistent*::: Persistent
            *scratch*::: Scratch
            :::
            +
        description: The description of the instance. 2048 characters or less.
        directory-stripe-level: |-
            Stripe level for directories. Allowed values are:
            +
            * `DIRECTORY_STRIPE_LEVEL_MIN`: recommended when directories contain a
              small number of files.
            * `DIRECTORY_STRIPE_LEVEL_BALANCED`: balances performance for workloads
              involving a mix of small and large directories.
            * `DIRECTORY_STRIPE_LEVEL_MAX`: recommended for directories with a large
              number of files.
            +
            _DIRECTORY_STRIPE_LEVEL_ must be one of:
            +
            *directory-stripe-level-balanced*::: Medium directory striping
            *directory-stripe-level-max*::: Maximum directory striping
            *directory-stripe-level-min*::: Minimum directory striping
            :::
            +
        file-stripe-level: |-
            Stripe level for files. Allowed values are:
            +
            * `FILE_STRIPE_LEVEL_MIN`: offers the best performance for small size
              files.
            * `FILE_STRIPE_LEVEL_BALANCED`: balances performance for workloads
              involving a mix of small and large files.
            * `FILE_STRIPE_LEVEL_MAX`: higher throughput performance for larger files.
            +
            _FILE_STRIPE_LEVEL_ must be one of:
            +
            *file-stripe-level-balanced*::: Medium file striping
            *file-stripe-level-max*::: Maximum file striping
            *file-stripe-level-min*::: Minimum file striping
            :::
            +
        labels: |-
            Cloud Labels are a flexible and lightweight mechanism for organizing cloud
            resources into groups that reflect a customer's organizational needs and
            deployment strategies. See
            https://cloud.google.com/resource-manager/docs/labels-overview for details.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: |-
            The location id of the instance resource.
            +
            To set the `location` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        network: |-
            ID of the network or fully qualified identifier for the network.
            +
            To set the `network` attribute:
            * provide the argument `--network` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            The region id of the address resource.
            +
            To set the `region` attribute:
            * provide the argument `--reserved-ip-range` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
        request-id: |-
            An optional request ID to identify requests. Specify a unique request ID
            so that if you must retry your request, the server will know to ignore
            the request if it has already been completed. The server will guarantee
            that for at least 60 minutes since the first request.
            +
            For example, consider a situation where you make an initial request and t
            he request times out. If you make the request again with the same request
            ID, the server can check if original operation with the same request ID
            was received, and if so, will ignore the second request. This prevents
            clients from accidentally creating duplicate commitments.
            +
            The request ID must be a valid UUID with the exception that zero UUID is
            not supported (00000000-0000-0000-0000-000000000000).
        reserved-ip-range: |-
            ID of the address or fully qualified identifier for the address.
            +
            To set the `address` attribute:
            * provide the argument `--reserved-ip-range` on the command line.
