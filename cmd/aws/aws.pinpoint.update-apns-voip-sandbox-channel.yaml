name: update-apns-voip-sandbox-channel
description: Enables the APNs VoIP sandbox channel for an application or updates the status and settings of the APNs VoIP sandbox channel for an application.
flags:
    --apnsvoip-sandbox-channel-request=!: ""
    --application-id=!: The unique identifier for the application.
documentation:
    command: Enables the APNs VoIP sandbox channel for an application or updates the status and settings of the APNs VoIP sandbox channel for an application.
    flag:
        apnsvoip-sandbox-channel-request: ""
        application-id: The unique identifier for the application. This identifier is displayed as the **Project ID** on the Amazon Pinpoint console.
