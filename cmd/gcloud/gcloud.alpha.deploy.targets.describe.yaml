name: describe
description: '*(ALPHA)*  Describes details specific to the individual target, delivery pipeline qualified.'
flags:
    --delivery-pipeline=: The name of the Cloud Deploy delivery pipeline
    --list-all-pipelines: List all Delivery Pipelines associated with a target.
    --no-list-all-pipelines&: List all Delivery Pipelines associated with a target.
    --no-skip-pipeline-lookup&: If set, skip fetching details of associated pipelines when describing a target.
    --region=: The Cloud region for the target.
    --skip-pipeline-lookup: If set, skip fetching details of associated pipelines when describing a target.
documentation:
    command: |-
        *(ALPHA)*  The output contains four sections:

        Target:

          detail of the target to be described.

        Latest Release:

          the detail of the active release in the target.

        Latest Rollout:

          the detail of the active rollout in the target.

        Deployed:

          timestamp of the last successful deployment.

        Pending Approvals:

          list of the rollouts that require approval.
    flag:
        delivery-pipeline: The name of the Cloud Deploy delivery pipeline
        list-all-pipelines: |-
            List all Delivery Pipelines associated with a target.
            +
            Usage:
            +
              $ {command} --list-all-pipelines
        no-list-all-pipelines: |+
            List all Delivery Pipelines associated with a target.

            Usage:

              $ {command} --list-all-pipelines

        no-skip-pipeline-lookup: |+
            If set, skip fetching details of associated pipelines when describing a target.

            Usage:

              $ {command} --skip-pipeline-lookup

        region: |-
            The Cloud region for the target.  Alternatively, set the property [deploy/region].
            +
            To set the `region` attribute:
            * provide the argument `target` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `deploy/region`.
        skip-pipeline-lookup: |-
            If set, skip fetching details of associated pipelines when describing a target.
            +
            Usage:
            +
              $ {command} --skip-pipeline-lookup
