name: attach-disk
description: '*(ALPHA)*  Attach disk to TPU VM.'
flags:
    --disk=!: The name of the disk to attach to the TPU VM.
    --mode=: Specifies the mode of the disk.
    --zone=: The Cloud zone for the TPU.
completion:
    flag:
        mode:
            - read-only
            - read-write
documentation:
    command: |+
        *(ALPHA)*  *gcloud alpha compute tpus tpu-vm attach-disk* is used to attach a disk to a TPU VM. For example,

          $ gcloud compute tpus tpu-vm attach-disk example-tpu --disk=example-disk --mode=read-only --zone=us-central1-a

        attaches the disk named 'example-disk' to a TPU VM named
        'example-tpu' in read-only mode in zone ``us-central1-a''.

    flag:
        disk: The name of the disk to attach to the TPU VM.
        mode: |-
            Specifies the mode of the disk. _MODE_ must be one of:
            +
            *read-only*::: Read-only.
            *read-write*::: Read-write. It is an error to attach a disk in read-write mode to more than one TPU VM.
            :::
            +
        zone: |-
            The Cloud zone for the TPU.
            +
            To set the `zone` attribute:
            * provide the argument `tpu` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line.
