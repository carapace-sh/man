name: describe
description: '*(ALPHA)*  Describe a Compute Engine firewall rule.'
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute firewall-rules describe* displays all data associated with a Compute Engine
        firewall rule in a project.

        ## EXAMPLES

        To describe a firewall rule, run:

          $ gcloud alpha compute firewall-rules describe my-firewall-rule
