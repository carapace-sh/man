name: disable
description: '*(BETA)*  Disable Service Mesh Feature.'
flags:
    --fleet-default-member-config: If specified, deletes the default membership
    --force: Disable this feature, even if it is currently in use.
    --no-fleet-default-member-config&: If specified, deletes the default membership
    --no-force&: Disable this feature, even if it is currently in use.
documentation:
    command: |-
        *(BETA)*  Disable the Service Mesh Feature in a fleet.

        ## EXAMPLES

        To disable the Service Mesh Feature, run:

          $ gcloud beta container hub mesh disable

        To delete the fleet-level default Membership configuration, run:

          $ gcloud beta container hub mesh disable --fleet-default-member-config
    flag:
        fleet-default-member-config: |-
            If specified, deletes the default membership
                    configuration present in your fleet.
            +
                    To delete the fleet-level default Membership configuration present in
                    your fleet, run:
            +
                      $ {command} --fleet-default-member-config
        force: Disable this feature, even if it is currently in use. Force disablement may result in unexpected behavior.
        no-fleet-default-member-config: |-
            If specified, deletes the default membership
                    configuration present in your fleet.

                    To delete the fleet-level default Membership configuration present in
                    your fleet, run:

                      $ {command} --fleet-default-member-config
        no-force: Disable this feature, even if it is currently in use. Force disablement may result in unexpected behavior.
