name: create-connection-alias
description: Creates the specified connection alias for use with cross-Region redirection.
flags:
    --connection-string=!: A connection string in the form of a fully qualified domain name (FQDN), such as `www.example.com`.
    --tags=: The tags to associate with the connection alias.
documentation:
    command: Creates the specified connection alias for use with cross-Region redirection. For more information, see [Cross-Region Redirection for Amazon WorkSpaces](https://docs.aws.amazon.com/workspaces/latest/adminguide/cross-region-redirection.html).
    flag:
        connection-string: |-
            A connection string in the form of a fully qualified domain name (FQDN), such as `www.example.com`.

            After you create a connection string, it is always associated to your Amazon Web Services account. You cannot recreate the same connection string with a different account, even if you delete all instances of it from the original account. The connection string is globally reserved for your account.
        tags: The tags to associate with the connection alias.
