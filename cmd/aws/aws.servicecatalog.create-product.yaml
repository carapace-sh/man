name: create-product
description: Creates a product.
flags:
    --accept-language=: The language code.
    --description=: The description of the product.
    --distributor=: The distributor of the product.
    --idempotency-token=!: A unique identifier that you provide to ensure idempotency.
    --name=!: The name of the product.
    --owner=!: The owner of the product.
    --product-type=!: The type of product.
    --provisioning-artifact-parameters=: The configuration of the provisioning artifact.
    --source-connection=: Specifies connection details for the created product and syncs the product to the connection source artifact.
    --support-description=: The support information about the product.
    --support-email=: The contact email for product support.
    --support-url=: The contact URL for product support.
    --tags=: One or more tags.
completion:
    flag:
        product-type:
            - CLOUD_FORMATION_TEMPLATE
            - MARKETPLACE
            - TERRAFORM_OPEN_SOURCE
            - TERRAFORM_CLOUD
            - EXTERNAL
documentation:
    command: |-
        Creates a product.

        A delegated admin is authorized to invoke this command.

        The user or role that performs this operation must have the `cloudformation:GetTemplate` IAM policy permission. This policy permission is required when using the `ImportFromPhysicalId` template source in the information data section.
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        description: The description of the product.
        distributor: The distributor of the product.
        idempotency-token: A unique identifier that you provide to ensure idempotency. If multiple requests differ only by the idempotency token, the same response is returned for each repeated request.
        name: The name of the product.
        owner: The owner of the product.
        product-type: The type of product.
        provisioning-artifact-parameters: The configuration of the provisioning artifact.
        source-connection: |-
            Specifies connection details for the created product and syncs the product to the connection source artifact. This automatically manages the product's artifacts based on changes to the source. The `SourceConnection` parameter consists of the following sub-fields.

            - `Type`
            - `ConnectionParamters`
        support-description: The support information about the product.
        support-email: The contact email for product support.
        support-url: |-
            The contact URL for product support.

            `^https?:\/\//`/ is the pattern used to validate SupportUrl.
        tags: One or more tags.
