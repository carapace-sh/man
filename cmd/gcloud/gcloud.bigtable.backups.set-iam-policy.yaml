name: set-iam-policy
description: Set an IAM policy on a Cloud Bigtable Backup.
flags:
    --cluster=: Name of the Bigtable cluster.
    --instance=: Name of the Bigtable instance.
documentation:
    command: |
        Set an IAM policy on a Cloud Bigtable Backup.
    flag:
        cluster: |-
            Name of the Bigtable cluster.
            +
            To set the `cluster` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--cluster` on the command line.
        instance: |-
            Name of the Bigtable instance.
            +
            To set the `instance` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line.
