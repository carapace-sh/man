name: describe-patch-properties
description: Lists the properties of available patches organized by product, product family, classification, severity, and other properties of available patches.
flags:
    --max-results=: The maximum number of items to return for this call.
    --next-token=: The token for the next set of items to return.
    --operating-system=!: The operating system type for which to list patches.
    --patch-set=: Indicates whether to list patches for the Windows operating system or for applications released by Microsoft.
    --property=!: The patch property for which you want to view patch details.
completion:
    flag:
        operating-system:
            - WINDOWS
            - AMAZON_LINUX
            - AMAZON_LINUX_2
            - AMAZON_LINUX_2022
            - UBUNTU
            - REDHAT_ENTERPRISE_LINUX
            - SUSE
            - CENTOS
            - ORACLE_LINUX
            - DEBIAN
            - MACOS
            - RASPBIAN
            - ROCKY_LINUX
            - ALMA_LINUX
            - AMAZON_LINUX_2023
        patch-set:
            - OS
            - APPLICATION
        property:
            - PRODUCT
            - PRODUCT_FAMILY
            - CLASSIFICATION
            - MSRC_SEVERITY
            - PRIORITY
            - SEVERITY
documentation:
    command: |-
        Lists the properties of available patches organized by product, product family, classification, severity, and other properties of available patches. You can use the reported properties in the filters you specify in requests for operations such as [CreatePatchBaseline](), [UpdatePatchBaseline](), [DescribeAvailablePatches](), and [DescribePatchBaselines]().

        The following section lists the properties that can be used in filters for each major operating system type:

        AMAZON\_LINUX

        Valid properties: `PRODUCT` | `CLASSIFICATION` | `SEVERITY`

        AMAZON\_LINUX\_2

        Valid properties: `PRODUCT` | `CLASSIFICATION` | `SEVERITY`

        AMAZON\_LINUX\_2023

        Valid properties: `PRODUCT` | `CLASSIFICATION` | `SEVERITY`

        CENTOS

        Valid properties: `PRODUCT` | `CLASSIFICATION` | `SEVERITY`

        DEBIAN

        Valid properties: `PRODUCT` | `PRIORITY`

        MACOS

        Valid properties: `PRODUCT` | `CLASSIFICATION`

        ORACLE\_LINUX

        Valid properties: `PRODUCT` | `CLASSIFICATION` | `SEVERITY`

        REDHAT\_ENTERPRISE\_LINUX

        Valid properties: `PRODUCT` | `CLASSIFICATION` | `SEVERITY`

        SUSE

        Valid properties: `PRODUCT` | `CLASSIFICATION` | `SEVERITY`

        UBUNTU

        Valid properties: `PRODUCT` | `PRIORITY`

        WINDOWS

        Valid properties: `PRODUCT` | `PRODUCT_FAMILY` | `CLASSIFICATION` | `MSRC_SEVERITY`
    flag:
        max-results: The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
        operating-system: The operating system type for which to list patches.
        patch-set: Indicates whether to list patches for the Windows operating system or for applications released by Microsoft. Not applicable for the Linux or macOS operating systems.
        property: The patch property for which you want to view patch details.
