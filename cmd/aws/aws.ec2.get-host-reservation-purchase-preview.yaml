name: get-host-reservation-purchase-preview
description: Preview a reservation purchase with configurations that match those of your Dedicated Host.
flags:
    --host-id-set=!: The IDs of the Dedicated Hosts with which the reservation is associated.
    --offering-id=!: The offering ID of the reservation.
documentation:
    command: |-
        Preview a reservation purchase with configurations that match those of your Dedicated Host. You must have active Dedicated Hosts in your account before you purchase a reservation.

        This is a preview of the [PurchaseHostReservation]() action and does not result in the offering being purchased.
    flag:
        host-id-set: The IDs of the Dedicated Hosts with which the reservation is associated.
        offering-id: The offering ID of the reservation.
