name: get-user-endpoints
description: Retrieves information about all the endpoints that are associated with a specific user ID.
flags:
    --application-id=!: The unique identifier for the application.
    --user-id=!: The unique identifier for the user.
documentation:
    command: Retrieves information about all the endpoints that are associated with a specific user ID.
    flag:
        application-id: The unique identifier for the application. This identifier is displayed as the **Project ID** on the Amazon Pinpoint console.
        user-id: The unique identifier for the user.
