name: enable-domain-transfer-lock
description: This operation sets the transfer lock on the domain (specifically the `clientTransferProhibited` status) to prevent domain transfers.
flags:
    --domain-name=!: The name of the domain that you want to set the transfer lock for.
documentation:
    command: This operation sets the transfer lock on the domain (specifically the `clientTransferProhibited` status) to prevent domain transfers. Successful submission returns an operation ID that you can use to track the progress and completion of the action. If the request is not completed successfully, the domain registrant will be notified by email.
    flag:
        domain-name: The name of the domain that you want to set the transfer lock for.
