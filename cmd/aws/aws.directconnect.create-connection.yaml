name: create-connection
description: Creates a connection between a customer network and a specific Direct Connect location.
flags:
    --bandwidth=!: The bandwidth of the connection.
    --connection-name=!: The name of the connection.
    --lag-id=: The ID of the LAG.
    --location=!: The location of the connection.
    --provider-name=: The name of the service provider associated with the requested connection.
    --request-macsec=: Indicates whether you want the connection to support MAC Security (MACsec).
    --tags=: The tags to associate with the lag.
documentation:
    command: |-
        Creates a connection between a customer network and a specific Direct Connect location.

        A connection links your internal network to an Direct Connect location over a standard Ethernet fiber-optic cable. One end of the cable is connected to your router, the other to an Direct Connect router.

        To find the locations for your Region, use [DescribeLocations]().

        You can automatically add the new connection to a link aggregation group (LAG) by specifying a LAG ID in the request. This ensures that the new connection is allocated on the same Direct Connect endpoint that hosts the specified LAG. If there are no available ports on the endpoint, the request fails and no connection is created.
    flag:
        bandwidth: The bandwidth of the connection.
        connection-name: The name of the connection.
        lag-id: The ID of the LAG.
        location: The location of the connection.
        provider-name: The name of the service provider associated with the requested connection.
        request-macsec: |-
            Indicates whether you want the connection to support MAC Security (MACsec).

            MAC Security (MACsec) is unavailable on hosted connections. For information about MAC Security (MACsec) prerequisites, see [MAC Security in Direct Connect](https://docs.aws.amazon.com/directconnect/latest/UserGuide/MACSec.html) in the *Direct Connect User Guide*.
        tags: The tags to associate with the lag.
