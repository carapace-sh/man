name: list
description: '*(ALPHA)*  List Google Cloud CLI properties for the currently active configuration.'
flags:
    --all: List all set and unset properties that match the arguments.
    --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
    --limit=: Maximum number of resources to list.
    --no-all&: List all set and unset properties that match the arguments.
    --sort-by=: Comma-separated list of resource field key names to sort by.
documentation:
    command: |-
        *(ALPHA)*  gcloud alpha config list lists the properties of the specified section using the
        active configuration. These include the account used to authorize access to
        Google Cloud, the current Google Cloud project, and the default Compute Engine
        region and zone, if set. See `gcloud topic configurations` for more about
        configurations.

        ## AVAILABLE PROPERTIES

        {properties}

        ## EXAMPLES

        To list the set project property in the core section, run:

          $ gcloud alpha config list project

        To list the set zone property in the compute section, run:

          $ gcloud alpha config list compute/zone

        To list all the set properties in the compute section, run:

        $ gcloud alpha config list compute/

        To list all the properties in the compute section, run:

        $ gcloud alpha config list compute/ --all

        To list all the properties, run:

          $ gcloud alpha config list --all

        Note, you cannot specify both `--all` and a property name. Only a section name
        and the `--all` flag can be used together in the format `gcloud config list
        <SECTION>/ --all`.
    flag:
        all: List all set and unset properties that match the arguments.
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        no-all: List all set and unset properties that match the arguments.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
