name: describe
description: '*(BETA)*  Describe a runtime.'
flags:
    --region=: Cloud region for the runtime.
documentation:
    command: |
        *(BETA)*  Describe a Colab Enterprise notebook runtime.
    flag:
        region: |-
            Cloud region for the runtime.
            +
            To set the `region` attribute:
            * provide the argument `runtime` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `colab/region`.
