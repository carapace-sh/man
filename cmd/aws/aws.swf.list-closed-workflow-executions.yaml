name: list-closed-workflow-executions
description: Returns a list of closed workflow executions in the specified domain that meet the filtering criteria.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --close-status-filter=: If specified, only workflow executions that match this *close status* are listed.
    --close-time-filter=: If specified, the workflow executions are included in the returned results based on whether their close times are within the range specified by this filter.
    --domain=!: The name of the domain that contains the workflow executions to list.
    --execution-filter=: If specified, only workflow executions matching the workflow ID specified in the filter are returned.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-items=: The  total number of items to return in the command's output.
    --maximum-page-size=: The maximum number of results that are returned per call.
    --next-page-token=: If `NextPageToken` is returned there are more results available.
    --no-reverse-order: When set to `true`, returns the results in reverse order.
    --page-size=: The size of each page to get in the AWS service call.
    --reverse-order: When set to `true`, returns the results in reverse order.
    --start-time-filter=: If specified, the workflow executions are included in the returned results based on whether their start times are within the range specified by this filter.
    --starting-token=: A token to specify where to start paginating.
    --tag-filter=: If specified, only executions that have the matching tag are listed.
    --type-filter=: If specified, only executions of the type specified in the filter are returned.
documentation:
    command: "Returns a list of closed workflow executions in the specified domain that meet the filtering criteria. The results may be split into multiple pages. To retrieve subsequent pages, make the call again using the nextPageToken returned by the initial call.\n\nThis operation is eventually consistent. The results are best effort and may not exactly reflect recent updates and changes.\n\n**Access Control**\n\nYou can use IAM policies to control this action's access to Amazon SWF resources as follows:\n\n- Use a `Resource` element with the domain name to limit the action to only specified domains.\n- Use an `Action` element to allow or deny permission to call this action.\n- Constrain the following parameters by using a `Condition` element with the appropriate keys.\n  \n  - `tagFilter.tag`: String constraint. The key is `swf:tagFilter.tag`.\n  - `typeFilter.name`: String constraint. The key is `swf:typeFilter.name`.\n  - `typeFilter.version`: String constraint. The key is `swf:typeFilter.version`.\n\nIf the caller doesn't have sufficient permissions to invoke the action, or the parameter values fall outside the specified constraints, the action fails. The associated event attribute's `cause` parameter is set to `OPERATION_NOT_PERMITTED`. For details and example IAM policies, see [Using IAM to Manage Access to Amazon SWF Workflows](https://docs.aws.amazon.com/amazonswf/latest/developerguide/swf-dev-iam.html) in the *Amazon SWF Developer Guide*."
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        close-status-filter: |-
            If specified, only workflow executions that match this *close status* are listed. For example, if TERMINATED is specified, then only TERMINATED workflow executions are listed.

            `closeStatusFilter`, `executionFilter`, `typeFilter` and `tagFilter` are mutually exclusive. You can specify at most one of these in a request.
        close-time-filter: |-
            If specified, the workflow executions are included in the returned results based on whether their close times are within the range specified by this filter. Also, if this parameter is specified, the returned results are ordered by their close times.

            `startTimeFilter` and `closeTimeFilter` are mutually exclusive. You must specify one of these in a request but not both.
        domain: The name of the domain that contains the workflow executions to list.
        execution-filter: |-
            If specified, only workflow executions matching the workflow ID specified in the filter are returned.

            `closeStatusFilter`, `executionFilter`, `typeFilter` and `tagFilter` are mutually exclusive. You can specify at most one of these in a request.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        maximum-page-size: The maximum number of results that are returned per call. Use `nextPageToken` to obtain further pages of results.
        next-page-token: |-
            If `NextPageToken` is returned there are more results available. The value of `NextPageToken` is a unique pagination token for each page. Make the call again using the returned token to retrieve the next page. Keep all other arguments unchanged. Each pagination token expires after 24 hours. Using an expired pagination token will return a `400` error: "`Specified token has exceeded its maximum lifetime`".

            The configured `maximumPageSize` determines how many results can be returned in a single call.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        reverse-order: When set to `true`, returns the results in reverse order. By default the results are returned in descending order of the start or the close time of the executions.
        start-time-filter: |-
            If specified, the workflow executions are included in the returned results based on whether their start times are within the range specified by this filter. Also, if this parameter is specified, the returned results are ordered by their start times.

            `startTimeFilter` and `closeTimeFilter` are mutually exclusive. You must specify one of these in a request but not both.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        tag-filter: |-
            If specified, only executions that have the matching tag are listed.

            `closeStatusFilter`, `executionFilter`, `typeFilter` and `tagFilter` are mutually exclusive. You can specify at most one of these in a request.
        type-filter: |-
            If specified, only executions of the type specified in the filter are returned.

            `closeStatusFilter`, `executionFilter`, `typeFilter` and `tagFilter` are mutually exclusive. You can specify at most one of these in a request.
