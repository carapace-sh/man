name: describe-remediation-exceptions
description: Returns the details of one or more remediation exceptions.
flags:
    --config-rule-name=!: The name of the Config rule.
    --limit=: The maximum number of RemediationExceptionResourceKey returned on each page.
    --next-token=: The `nextToken` string returned in a previous request that you use to request the next page of results in a paginated response.
    --resource-keys=: An exception list of resource exception keys to be processed with the current request.
documentation:
    command: |-
        Returns the details of one or more remediation exceptions. A detailed view of a remediation exception for a set of resources that includes an explanation of an exception and the time when the exception will be deleted. When you specify the limit and the next token, you receive a paginated response.

        Config generates a remediation exception when a problem occurs executing a remediation action to a specific resource. Remediation exceptions blocks auto-remediation until the exception is cleared.

        When you specify the limit and the next token, you receive a paginated response.

        Limit and next token are not applicable if you request resources in batch. It is only applicable, when you request all resources.
    flag:
        config-rule-name: The name of the Config rule.
        limit: The maximum number of RemediationExceptionResourceKey returned on each page. The default is 25. If you specify 0, Config uses the default.
        next-token: The `nextToken` string returned in a previous request that you use to request the next page of results in a paginated response.
        resource-keys: An exception list of resource exception keys to be processed with the current request. Config adds exception for each resource key. For example, Config adds 3 exceptions for 3 resource keys.
