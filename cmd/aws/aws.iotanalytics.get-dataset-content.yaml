name: get-dataset-content
description: Retrieves the contents of a dataset as presigned URIs.
flags:
    --dataset-name=!: The name of the dataset whose contents are retrieved.
    --version-id=: The version of the dataset whose contents are retrieved.
documentation:
    command: Retrieves the contents of a dataset as presigned URIs.
    flag:
        dataset-name: The name of the dataset whose contents are retrieved.
        version-id: The version of the dataset whose contents are retrieved. You can also use the strings "$LATEST" or "$LATEST\_SUCCEEDED" to retrieve the contents of the latest or latest successfully completed dataset. If not specified, "$LATEST\_SUCCEEDED" is the default.
