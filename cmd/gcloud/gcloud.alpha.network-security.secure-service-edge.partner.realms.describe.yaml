name: describe
description: '*(ALPHA)*  Describe a partner SSE realm.'
hidden: true
flags:
    --location=: The location Id.
documentation:
    command: |
        *(ALPHA)*  Show details for the specified partner SSE realm.
    flag:
        location: |-
            The location Id.
            +

            To set the `location` attribute:
            * provide the argument `partner_sse_realm` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * location is global by default.
