name: update
description: '*(ALPHA)*  Update dataproc gdc application environment controller.'
hidden: true
flags:
    --annotations=: Set annotations to new value.
    --clear-annotations: Clear annotations value and set to empty map.
    --clear-labels: Clear labels value and set to empty map.
    --clear-spark-application-environment-config-default-properties: Clear spark_application_environment_config_default_properties value and set to empty map.
    --display-name=: User-provided human-readable name to be used in user interfaces.
    --labels=: Set labels to new value.
    --location=: locations TBD
    --namespace=: The name of the namespace in which to create this ApplicationEnvironment.
    --no-clear-annotations&: Clear annotations value and set to empty map.
    --no-clear-labels&: Clear labels value and set to empty map.
    --no-clear-spark-application-environment-config-default-properties&: Clear spark_application_environment_config_default_properties value and set to empty map.
    --remove-annotations=: Remove existing value from map annotations.
    --remove-labels=: Remove existing value from map labels.
    --remove-spark-application-environment-config-default-properties=: Remove existing value from map spark_application_environment_config_default_properties.
    --service-instance=: serviceInstances TBD
    --spark-application-environment-config-default-properties=: Set spark_application_environment_config_default_properties to new value.
    --spark-application-environment-config-default-version=: The default Dataproc version to use for applications submitted to this
    --update-annotations=: Update annotations value or add key value pair.
    --update-labels=: Update labels value or add key value pair.
    --update-spark-application-environment-config-default-properties=: Update spark_application_environment_config_default_properties value or add key value pair.
documentation:
    command: |
        *(ALPHA)*  Update dataproc gdc application environment controller.
    flag:
        annotations: |-
            Set annotations to new value. The annotations to associate with this application environment. Annotations
            may be used to store client information, but are not used by the server.
            +
            *KEY*:::
            Sets `KEY` value.
            +
            *VALUE*:::
            Sets `VALUE` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --annotations=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --annotations='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --annotations=path_to_file.(yaml|json)
            +
            ```
        clear-annotations: Clear annotations value and set to empty map.
        clear-labels: Clear labels value and set to empty map.
        clear-spark-application-environment-config-default-properties: Clear spark_application_environment_config_default_properties value and set to empty map.
        display-name: User-provided human-readable name to be used in user interfaces.
        labels: |-
            Set labels to new value. The labels to associate with this application environment. Labels may be
            used for filtering and billing tracking.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: |-
            locations TBD
            +
            To set the `location` attribute:
            * provide the argument `application_environment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        namespace: |-
            The name of the namespace in which to create this ApplicationEnvironment.
            This namespace must already exist in the cluster
        no-clear-annotations: Clear annotations value and set to empty map.
        no-clear-labels: Clear labels value and set to empty map.
        no-clear-spark-application-environment-config-default-properties: Clear spark_application_environment_config_default_properties value and set to empty map.
        remove-annotations: |-
            Remove existing value from map annotations. Sets `remove_annotations` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-annotations=string,string
            +
            ```
