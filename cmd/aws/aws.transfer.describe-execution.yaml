name: describe-execution
description: You can use `DescribeExecution` to check the details of the execution of the specified workflow.
flags:
    --execution-id=!: A unique identifier for the execution of a workflow.
    --workflow-id=!: A unique identifier for the workflow.
documentation:
    command: |-
        You can use `DescribeExecution` to check the details of the execution of the specified workflow.

        This API call only returns details for in-progress workflows.

        If you provide an ID for an execution that is not in progress, or if the execution doesn't match the specified workflow ID, you receive a `ResourceNotFound` exception.
    flag:
        execution-id: A unique identifier for the execution of a workflow.
        workflow-id: A unique identifier for the workflow.
