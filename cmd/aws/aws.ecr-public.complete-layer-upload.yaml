name: complete-layer-upload
description: Informs Amazon ECR that the image layer upload is complete for a specified public registry, repository name, and upload ID.
flags:
    --layer-digests=!: The `sha256` digest of the image layer.
    --registry-id=: The Amazon Web Services account ID, or registry alias, associated with the registry where layers are uploaded.
    --repository-name=!: The name of the repository in a public registry to associate with the image layer.
    --upload-id=!: The upload ID from a previous [InitiateLayerUpload]() operation to associate with the image layer.
documentation:
    command: |-
        Informs Amazon ECR that the image layer upload is complete for a specified public registry, repository name, and upload ID. You can optionally provide a `sha256` digest of the image layer for data validation purposes.

        When an image is pushed, the CompleteLayerUpload API is called once for each new image layer to verify that the upload is complete.

        This operation is used by the Amazon ECR proxy and is not generally used by customers for pulling and pushing images. In most cases, you should use the `docker` CLI to pull, tag, and push images.
    flag:
        layer-digests: The `sha256` digest of the image layer.
        registry-id: The Amazon Web Services account ID, or registry alias, associated with the registry where layers are uploaded. If you do not specify a registry, the default public registry is assumed.
        repository-name: The name of the repository in a public registry to associate with the image layer.
        upload-id: The upload ID from a previous [InitiateLayerUpload]() operation to associate with the image layer.
