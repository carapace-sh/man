name: tag-contact
description: Adds the specified tags to the contact resource.
flags:
    --contact-id=!: The identifier of the contact in this instance of Amazon Connect.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --tags=!: The tags to be assigned to the contact resource.
documentation:
    command: Adds the specified tags to the contact resource. For more information about this API is used, see [Set up granular billing for a detailed view of your Amazon Connect usage](https://docs.aws.amazon.com/connect/latest/adminguide/granular-billing.html).
    flag:
        contact-id: The identifier of the contact in this instance of Amazon Connect.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        tags: |-
            The tags to be assigned to the contact resource. For example, { "Tags": {"key1":"value1", "key2":"value2"} }.

            Authorization is not supported by this tag.
