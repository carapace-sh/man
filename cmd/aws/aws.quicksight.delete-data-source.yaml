name: delete-data-source
description: Deletes the data source permanently.
flags:
    --aws-account-id=!: The Amazon Web Services account ID.
    --data-source-id=!: The ID of the data source.
documentation:
    command: Deletes the data source permanently. This operation breaks all the datasets that reference the deleted data source.
    flag:
        aws-account-id: The Amazon Web Services account ID.
        data-source-id: The ID of the data source. This ID is unique per Amazon Web Services Region for each Amazon Web Services account.
