name: delete-column-statistics-for-partition
description: Delete the partition column statistics of a column.
flags:
    --catalog-id=: The ID of the Data Catalog where the partitions in question reside.
    --column-name=!: Name of the column.
    --database-name=!: The name of the catalog database where the partitions reside.
    --partition-values=!: A list of partition values identifying the partition.
    --table-name=!: The name of the partitions' table.
documentation:
    command: |-
        Delete the partition column statistics of a column.

        The Identity and Access Management (IAM) permission required for this operation is `DeletePartition`.
    flag:
        catalog-id: The ID of the Data Catalog where the partitions in question reside. If none is supplied, the Amazon Web Services account ID is used by default.
        column-name: Name of the column.
        database-name: The name of the catalog database where the partitions reside.
        partition-values: A list of partition values identifying the partition.
        table-name: The name of the partitions' table.
