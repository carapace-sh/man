name: list-message-move-tasks
description: Gets the most recent message movement tasks (up to 10) under a specific source queue.
flags:
    --max-results=: The maximum number of results to include in the response.
    --source-arn=!: The ARN of the queue whose message movement tasks are to be listed.
documentation:
    command: |-
        Gets the most recent message movement tasks (up to 10) under a specific source queue.

        - This action is currently limited to supporting message redrive from [dead-letter queues (DLQs)](https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html) only. In this context, the source queue is the dead-letter queue (DLQ), while the destination queue can be the original source queue (from which the messages were driven to the dead-letter-queue), or a custom destination queue.
        - Only one active message movement task is supported per queue at any given time.
    flag:
        max-results: The maximum number of results to include in the response. The default is 1, which provides the most recent message movement task. The upper limit is 10.
        source-arn: The ARN of the queue whose message movement tasks are to be listed.
