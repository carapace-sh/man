    flag:
        annotations: Annotations for the node pool.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        clear-annotations: Clear the annotations for the node pool.
        cluster: |-
            cluster of the nodepool.
            +
            To set the `cluster` attribute:
            * provide the argument `node_pool` on the command line with a fully specified name;
            * provide the argument `--cluster` on the command line.
        enable-autorepair: |-
            Enable node autorepair feature for a node pool. Use --no-enable-autorepair to disable.
            +
              $ {command} --enable-autorepair
        location: |-
            Google Cloud location for the nodepool.
            +
            To set the `location` attribute:
            * provide the argument `node_pool` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_azure/location`.
        max-nodes: Maximum number of nodes in the node pool.
        min-nodes: Minimum number of nodes in the node pool.
