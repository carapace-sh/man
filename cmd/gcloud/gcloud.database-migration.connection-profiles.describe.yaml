name: describe
description: Show details about a Database Migration Service connection profile.
flags:
    --region=: The name of the region.
documentation:
    command: Show details about a connection profile.
    flag:
        region: |-
            The name of the region.
            +
            To set the `region` attribute:
            * provide the argument `connection_profile` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
