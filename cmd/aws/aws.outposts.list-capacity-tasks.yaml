name: list-capacity-tasks
description: Lists the capacity tasks for your Amazon Web Services account.
flags:
    --capacity-task-status-filter=: A list of statuses.
    --max-results=: ""
    --next-token=: ""
    --outpost-identifier-filter=: Filters the results by an Outpost ID or an Outpost ARN.
documentation:
    command: |-
        Lists the capacity tasks for your Amazon Web Services account.

        Use filters to return specific results. If you specify multiple filters, the results include only the resources that match all of the specified filters. For a filter where you can specify multiple values, the results include items that match any of the values that you specify for the filter.
    flag:
        capacity-task-status-filter: A list of statuses. For example, `REQUESTED` or `WAITING_FOR_EVACUATION`.
        max-results: ""
        next-token: ""
        outpost-identifier-filter: Filters the results by an Outpost ID or an Outpost ARN.
