name: delete
description: '*(ALPHA)*  Delete an API key.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Location of the key.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |-
        *(ALPHA)*  Delete an API key.

        ## EXAMPLES

         Delete an API Key :

         $ gcloud alpha services api-keys delete projects/myproject/locations/global/keys/1234

         $ gcloud alpha services api-keys delete 1234
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            Location of the key.
            +
            To set the `location` attribute:
            * provide the argument `key` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * location will default to global.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
