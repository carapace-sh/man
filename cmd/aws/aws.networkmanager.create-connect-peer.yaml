name: create-connect-peer
description: Creates a core network Connect peer for a specified core network connect attachment between a core network and an appliance.
flags:
    --bgp-options=: The Connect peer BGP options.
    --client-token=: The client token associated with the request.
    --connect-attachment-id=!: The ID of the connection attachment.
    --core-network-address=: A Connect peer core network address.
    --inside-cidr-blocks=: The inside IP addresses used for BGP peering.
    --peer-address=!: The Connect peer address.
    --subnet-arn=: The subnet ARN for the Connect peer.
    --tags=: The tags associated with the peer request.
documentation:
    command: Creates a core network Connect peer for a specified core network connect attachment between a core network and an appliance. The peer address and transit gateway address must be the same IP address family (IPv4 or IPv6).
    flag:
        bgp-options: The Connect peer BGP options. This only applies only when the protocol is `GRE`.
        client-token: The client token associated with the request.
        connect-attachment-id: The ID of the connection attachment.
        core-network-address: A Connect peer core network address. This only applies only when the protocol is `GRE`.
        inside-cidr-blocks: The inside IP addresses used for BGP peering.
        peer-address: The Connect peer address.
        subnet-arn: The subnet ARN for the Connect peer. This only applies only when the protocol is NO\_ENCAP.
        tags: The tags associated with the peer request.
