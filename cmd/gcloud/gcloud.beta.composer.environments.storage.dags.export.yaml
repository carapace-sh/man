name: export
description: '*(BETA)*  Export DAGs from an environment into local storage or Cloud Storage.'
flags:
    --destination=!: The path to an existing local directory or a Cloud Storage
    --environment=!: ID of the environment or fully qualified identifier for the environment.
    --location=: Region where Composer environment runs or in which to create the environment.
    --source=: An optional relative path to a file or directory to be exported from the
documentation:
    command: |-
        *(BETA)*  If the SOURCE is a directory, it and its contents are are exported
        recursively. If no SOURCE is provided, the entire contents of the
        environment's DAGs directory will be exported. Colliding files in the
        DESTINATION will be overwritten. If a file exists in the DESTINATION but
        there is no corresponding file to overwrite it, it is untouched.

        ## EXAMPLES
        Suppose the environment `myenv`'s Cloud Storage bucket has the following
        structure:

          gs://the-bucket
          |
          +-- dags
          |   |
          |   +-- file1.py
          |   +-- file2.py
          |   |
          |   +-- subdir1
          |   |   |
          |   |   +-- file3.py
          |   |   +-- file4.py

        And the local directory '/foo' has the following
        structure:

          /foo
          |
          +-- file1.py
          +-- fileX.py
          |   |
          |   +-- subdir1
          |   |   |
          |   |   +-- file3.py
          |   |   +-- fileY.py

        The following command:

          gcloud beta composer environments storage dags export myenv --destination=/foo

        would result in the following structure in the local '/foo' directory:

          /foo
          |
          +-- file1.py
          +-- file2.py
          +-- fileX.py
          |   |
          |   +-- subdir1
          |   |   |
          |   |   +-- file3.py
          |   |   +-- file4.py
          |   |   +-- fileY.py

        The local files '/foo/file1.py' and '/foo/subdir1/file3.py' will be
        overwritten with the contents of the corresponding files in the Cloud Storage
        bucket.

        If instead we had run

          gcloud beta composer environments storage dags export myenv --source=subdir1/file3.py --destination=/foo

        the resulting local directory structure would be the following:

          /foo
          |
          +-- file1.py
          +-- file3.py
          +-- fileX.py
          |   |
          |   +-- subdir1
          |   |   |
          |   |   +-- file3.py
          |   |   +-- fileY.py

        No local files would be overwritten since
        'gs://the-bucket/dags/subdir1/file3.py' was written to '/foo/file3.py'
        instead of 'foo/subdir1/file3.py'.
    flag:
        destination: |-
            The path to an existing local directory or a Cloud Storage
            bucket/directory into which to export files.
        environment: |-
            ID of the environment or fully qualified identifier for the environment.
            +
            To set the `environment` attribute:
            * provide the argument `--environment` on the command line.
        location: |-
            Region where Composer environment runs or in which to create the environment.
            +
            To set the `location` attribute:
            * provide the argument `--environment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `composer/location`.
        source: |-
            An optional relative path to a file or directory to be exported from the
            dags/ subdirectory in the environment's Cloud Storage bucket.
