name: get-folder-path
description: Retrieves the path information (the hierarchy from the root folder) for the specified folder.
flags:
    --authentication-token=: Amazon WorkDocs authentication token.
    --fields=: A comma-separated list of values.
    --folder-id=!: The ID of the folder.
    --limit=: The maximum number of levels in the hierarchy to return.
    --marker=: This value is not supported.
documentation:
    command: |-
        Retrieves the path information (the hierarchy from the root folder) for the specified folder.

        By default, Amazon WorkDocs returns a maximum of 100 levels upwards from the requested folder and only includes the IDs of the parent folders in the path. You can limit the maximum number of levels. You can also request the parent folder names.
    flag:
        authentication-token: Amazon WorkDocs authentication token. Not required when using Amazon Web Services administrator credentials to access the API.
        fields: A comma-separated list of values. Specify "NAME" to include the names of the parent folders.
        folder-id: The ID of the folder.
        limit: The maximum number of levels in the hierarchy to return.
        marker: This value is not supported.
