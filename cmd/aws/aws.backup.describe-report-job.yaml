name: describe-report-job
description: Returns the details associated with creating a report as specified by its `ReportJobId`.
flags:
    --report-job-id=!: The identifier of the report job.
documentation:
    command: Returns the details associated with creating a report as specified by its `ReportJobId`.
    flag:
        report-job-id: The identifier of the report job. A unique, randomly generated, Unicode, UTF-8 encoded string that is at most 1,024 bytes long. The report job ID cannot be edited.
