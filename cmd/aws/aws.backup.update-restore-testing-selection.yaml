name: update-restore-testing-selection
description: Updates the specified restore testing selection.
flags:
    --restore-testing-plan-name=!: The restore testing plan name is required to update the indicated testing plan.
    --restore-testing-selection-name=!: The required restore testing selection name of the restore testing selection you wish to update.
    --restore-testing-selection=!: To update your restore testing selection, you can use either protected resource ARNs or conditions, but not both.
documentation:
    command: |-
        Updates the specified restore testing selection.

        Most elements except the `RestoreTestingSelectionName` can be updated with this request.

        You can use either protected resource ARNs or conditions, but not both.
    flag:
        restore-testing-plan-name: The restore testing plan name is required to update the indicated testing plan.
        restore-testing-selection: To update your restore testing selection, you can use either protected resource ARNs or conditions, but not both. That is, if your selection has `ProtectedResourceArns`, requesting an update with the parameter `ProtectedResourceConditions` will be unsuccessful.
        restore-testing-selection-name: The required restore testing selection name of the restore testing selection you wish to update.
