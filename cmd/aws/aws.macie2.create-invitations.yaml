name: create-invitations
description: Sends an Amazon Macie membership invitation to one or more accounts.
flags:
    --account-ids=!:
        description: An array that lists Amazon Web Services account IDs, one for each account to send the invitation to.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --disable-email-notification: Specifies whether to send the invitation as an email message.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --message=: Custom text to include in the email message that contains the invitation.
    --no-disable-email-notification: Specifies whether to send the invitation as an email message.
documentation:
    command: Sends an Amazon Macie membership invitation to one or more accounts.
    flag:
        account-ids: An array that lists Amazon Web Services account IDs, one for each account to send the invitation to.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        disable-email-notification: Specifies whether to send the invitation as an email message. If this value is false, Amazon Macie sends the invitation (as an email message) to the email address that you specified for the recipient's account when you associated the account with your account. The default value is false.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        message: Custom text to include in the email message that contains the invitation. The text can contain as many as 80 alphanumeric characters.
