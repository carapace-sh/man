name: delete-assistant-association
description: Deletes an assistant association.
flags:
    --assistant-association-id=!: The identifier of the assistant association.
    --assistant-id=!: The identifier of the Amazon Q in Connect assistant.
documentation:
    command: Deletes an assistant association.
    flag:
        assistant-association-id: The identifier of the assistant association. Can be either the ID or the ARN. URLs cannot contain the ARN.
        assistant-id: The identifier of the Amazon Q in Connect assistant. Can be either the ID or the ARN. URLs cannot contain the ARN.
