name: copy-snapshot
description: Makes a copy of an existing snapshot.
flags:
    --kms-key-id=: The ID of the KMS key used to encrypt the target snapshot.
    --source-snapshot-name=!: The name of an existing snapshot from which to make a copy.
    --tags=: A list of tags to be added to this resource.
    --target-bucket=: The Amazon S3 bucket to which the snapshot is exported.
    --target-snapshot-name=!: A name for the snapshot copy.
documentation:
    command: Makes a copy of an existing snapshot.
    flag:
        kms-key-id: The ID of the KMS key used to encrypt the target snapshot.
        source-snapshot-name: The name of an existing snapshot from which to make a copy.
        tags: A list of tags to be added to this resource. A tag is a key-value pair. A tag key must be accompanied by a tag value, although null is accepted.
        target-bucket: 'The Amazon S3 bucket to which the snapshot is exported. This parameter is used only when exporting a snapshot for external access. When using this parameter to export a snapshot, be sure MemoryDB has the needed permissions to this S3 bucket. For more information, see [Step 2: Grant MemoryDB Access to Your Amazon S3 Bucket](https://docs.aws.amazon.com/MemoryDB/latest/devguide/snapshots-exporting.html).'
        target-snapshot-name: A name for the snapshot copy. MemoryDB does not permit overwriting a snapshot, therefore this name must be unique within its context - MemoryDB or an Amazon S3 bucket if exporting.
