name: delete-application
description: This documentation is for version 1 of the Amazon Kinesis Data Analytics API, which only supports SQL applications.
flags:
    --application-name=!: Name of the Amazon Kinesis Analytics application to delete.
    --create-timestamp=!: You can use the `DescribeApplication` operation to get this value.
documentation:
    command: |-
        This documentation is for version 1 of the Amazon Kinesis Data Analytics API, which only supports SQL applications. Version 2 of the API supports SQL and Java applications. For more information about version 2, see [Amazon Kinesis Data Analytics API V2 Documentation](/kinesisanalytics/latest/apiv2/Welcome.html).

        Deletes the specified application. Amazon Kinesis Analytics halts application execution and deletes the application, including any application artifacts (such as in-application streams, reference table, and application code).

        This operation requires permissions to perform the `kinesisanalytics:DeleteApplication` action.
    flag:
        application-name: Name of the Amazon Kinesis Analytics application to delete.
        create-timestamp: You can use the `DescribeApplication` operation to get this value.
