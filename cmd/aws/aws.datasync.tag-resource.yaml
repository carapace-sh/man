name: tag-resource
description: Applies a *tag* to an Amazon Web Services resource.
flags:
    --resource-arn=!: Specifies the Amazon Resource Name (ARN) of the resource to apply the tag to.
    --tags=!: Specifies the tags that you want to apply to the resource.
documentation:
    command: |-
        Applies a *tag* to an Amazon Web Services resource. Tags are key-value pairs that can help you manage, filter, and search for your resources.

        These include DataSync resources, such as locations, tasks, and task executions.
    flag:
        resource-arn: Specifies the Amazon Resource Name (ARN) of the resource to apply the tag to.
        tags: Specifies the tags that you want to apply to the resource.
