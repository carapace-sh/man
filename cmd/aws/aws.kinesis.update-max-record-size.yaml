name: update-max-record-size
description: This allows you to update the `MaxRecordSize` of a single record that you can write to, and read from a stream.
flags:
    --max-record-size-in-ki-b=!: The maximum record size of a single record in KiB that you can write to, and read from a stream.
    --stream-arn=: The Amazon Resource Name (ARN) of the stream for the `MaxRecordSize` update.
documentation:
    command: This allows you to update the `MaxRecordSize` of a single record that you can write to, and read from a stream. You can ingest and digest single records up to 10240 KiB.
    flag:
        max-record-size-in-ki-b: The maximum record size of a single record in KiB that you can write to, and read from a stream. Specify a value between 1024 and 10240 KiB (1 to 10 MiB). If you specify a value that is out of this range, `UpdateMaxRecordSize` sends back an `ValidationException` message.
        stream-arn: The Amazon Resource Name (ARN) of the stream for the `MaxRecordSize` update.
