name: accept-page
description: Used to acknowledge an engagement to a contact channel during an incident.
flags:
    --accept-code-validation=: An optional field that Incident Manager uses to `ENFORCE` `AcceptCode` validation when acknowledging an page.
    --accept-code=!: A 6-digit code used to acknowledge the page.
    --accept-type=!: The type indicates if the page was `DELIVERED` or `READ`.
    --contact-channel-id=: The ARN of the contact channel.
    --note=: Information provided by the user when the user acknowledges the page.
    --page-id=!: The Amazon Resource Name (ARN) of the engagement to a contact channel.
completion:
    flag:
        accept-code-validation:
            - IGNORE
            - ENFORCE
        accept-type:
            - DELIVERED
            - READ
documentation:
    command: Used to acknowledge an engagement to a contact channel during an incident.
    flag:
        accept-code: A 6-digit code used to acknowledge the page.
        accept-code-validation: |-
            An optional field that Incident Manager uses to `ENFORCE` `AcceptCode` validation when acknowledging an page. Acknowledgement can occur by replying to a page, or when entering the AcceptCode in the console. Enforcing AcceptCode validation causes Incident Manager to verify that the code entered by the user matches the code sent by Incident Manager with the page.

            Incident Manager can also `IGNORE` `AcceptCode` validation. Ignoring `AcceptCode` validation causes Incident Manager to accept any value entered for the `AcceptCode`.
        accept-type: The type indicates if the page was `DELIVERED` or `READ`.
        contact-channel-id: The ARN of the contact channel.
        note: Information provided by the user when the user acknowledges the page.
        page-id: The Amazon Resource Name (ARN) of the engagement to a contact channel.
