name: create-route-server
description: Creates a new route server to manage dynamic routing in a VPC.
flags:
    --amazon-side-asn=!: The private Autonomous System Number (ASN) for the Amazon side of the BGP session.
    --client-token=: Unique, case-sensitive identifier to ensure idempotency of the request.
    --dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --no-dry-run&: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --no-sns-notifications-enabled&: Indicates whether SNS notifications should be enabled for route server events.
    --persist-routes-duration=: The number of minutes a route server will wait after BGP is re-established to unpersist the routes in the FIB and RIB.
    --persist-routes=: Indicates whether routes should be persisted after all BGP sessions are terminated.
    --sns-notifications-enabled: Indicates whether SNS notifications should be enabled for route server events.
    --tag-specifications=: The tags to apply to the route server during creation.
completion:
    flag:
        persist-routes:
            - enable
            - disable
            - reset
documentation:
    command: |-
        Creates a new route server to manage dynamic routing in a VPC.

        Amazon VPC Route Server simplifies routing for traffic between workloads that are deployed within a VPC and its internet gateways. With this feature, VPC Route Server dynamically updates VPC and internet gateway route tables with your preferred IPv4 or IPv6 routes to achieve routing fault tolerance for those workloads. This enables you to automatically reroute traffic within a VPC, which increases the manageability of VPC routing and interoperability with third-party workloads.

        Route server supports the follow route table types:

        - VPC route tables not associated with subnets
        - Subnet route tables
        - Internet gateway route tables

        Route server does not support route tables associated with virtual private gateways. To propagate routes into a transit gateway route table, use [Transit Gateway Connect](https://docs.aws.amazon.com/vpc/latest/tgw/tgw-connect.html).

        For more information see [Dynamic routing in your VPC with VPC Route Server](https://docs.aws.amazon.com/vpc/latest/userguide/dynamic-routing-route-server.html) in the *Amazon VPC User Guide*.
    flag:
        amazon-side-asn: The private Autonomous System Number (ASN) for the Amazon side of the BGP session. Valid values are from 1 to 4294967295. We recommend using a private ASN in the 64512–65534 (16-bit ASN) or 4200000000–4294967294 (32-bit ASN) range.
        client-token: Unique, case-sensitive identifier to ensure idempotency of the request.
        dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        persist-routes: Indicates whether routes should be persisted after all BGP sessions are terminated.
        persist-routes-duration: |-
            The number of minutes a route server will wait after BGP is re-established to unpersist the routes in the FIB and RIB. Value must be in the range of 1-5. Required if PersistRoutes is `enabled`.

            If you set the duration to 1 minute, then when your network appliance re-establishes BGP with route server, it has 1 minute to relearn it's adjacent network and advertise those routes to route server before route server resumes normal functionality. In most cases, 1 minute is probably sufficient. If, however, you have concerns that your BGP network may not be capable of fully re-establishing and re-learning everything in 1 minute, you can increase the duration up to 5 minutes.
        sns-notifications-enabled: Indicates whether SNS notifications should be enabled for route server events. Enabling SNS notifications persists BGP status changes to an SNS topic provisioned by Amazon Web Services.
        tag-specifications: The tags to apply to the route server during creation.
