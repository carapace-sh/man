name: list-tape-pools
description: Lists custom tape pools.
flags:
    --limit=: An optional number limit for the tape pools in the list returned by this call.
    --marker=: A string that indicates the position at which to begin the returned list of tape pools.
    --pool-arns=: The Amazon Resource Name (ARN) of each of the custom tape pools you want to list.
documentation:
    command: |-
        Lists custom tape pools. You specify custom tape pools to list by specifying one or more custom tape pool Amazon Resource Names (ARNs). If you don't specify a custom tape pool ARN, the operation lists all custom tape pools.

        This operation supports pagination. You can optionally specify the `Limit` parameter in the body to limit the number of tape pools in the response. If the number of tape pools returned in the response is truncated, the response includes a `Marker` element that you can use in your subsequent request to retrieve the next set of tape pools.
    flag:
        limit: An optional number limit for the tape pools in the list returned by this call.
        marker: A string that indicates the position at which to begin the returned list of tape pools.
        pool-arns: The Amazon Resource Name (ARN) of each of the custom tape pools you want to list. If you don't specify a custom tape pool ARN, the response lists all custom tape pools.
