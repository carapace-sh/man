name: put-resource-log-level
description: Sets the log-level override for a resource ID and resource type.
flags:
    --log-level=!: ""
    --resource-identifier=!: ""
    --resource-type=!: The type of resource, which can be `WirelessDevice`, `WirelessGateway`, or `FuotaTask`.
completion:
    flag:
        log-level:
            - INFO
            - ERROR
            - DISABLED
documentation:
    command: Sets the log-level override for a resource ID and resource type. A limit of 200 log level override can be set per account.
    flag:
        log-level: ""
        resource-identifier: ""
        resource-type: The type of resource, which can be `WirelessDevice`, `WirelessGateway`, or `FuotaTask`.
