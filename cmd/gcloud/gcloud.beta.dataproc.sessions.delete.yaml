name: delete
description: '*(BETA)*  Delete a session.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Dataproc location for the session.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --timeout=&: Client side timeout on how long to wait for Dataproc operations.
documentation:
    command: '*(BETA)*  Delete a session.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            Dataproc location for the session. Each Dataproc location constitutes an independent resource namespace constrained to deploying instances into Compute Engine zones inside the location. Overrides the default `dataproc/location` property value for this command invocation.
            +
            To set the `location` attribute:
            * provide the argument `session` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataproc/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        timeout: Client side timeout on how long to wait for Dataproc operations. See $ gcloud topic datetimes for information on duration formats.
