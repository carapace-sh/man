name: create
description: '*(BETA)*  *(DEPRECATED)*  Create a Datastream private connection route.'
flags:
    --destination-address=!: Destination address for connection.
    --destination-port=: Destination port for connection.
    --display-name=!: Friendly name for the route.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The Cloud location for the route.
    --private-connection=: The private connection of the route.
documentation:
    command: |4-
        *(BETA)*  *(DEPRECATED)*  Datastream beta version is deprecated. Please use`gcloud datastream routes create` command instead.

        Create a Datastream private connection route
    flag:
        destination-address: Destination address for connection.
        destination-port: Destination port for connection.
        display-name: Friendly name for the route.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The Cloud location for the route.
            +
            To set the `location` attribute:
            * provide the argument `route` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        private-connection: |-
            The private connection of the route.
            +
            To set the `private-connection` attribute:
            * provide the argument `route` on the command line with a fully specified name;
            * provide the argument `--private-connection` on the command line.
