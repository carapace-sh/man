name: delete-slack-channel-configuration
description: Deletes a Slack channel configuration from your Amazon Web Services account.
flags:
    --channel-id=!: The channel ID in Slack.
    --team-id=!: The team ID in Slack.
documentation:
    command: Deletes a Slack channel configuration from your Amazon Web Services account. This operation doesn't delete your Slack channel.
    flag:
        channel-id: The channel ID in Slack. This ID identifies a channel within a Slack workspace.
        team-id: The team ID in Slack. This ID uniquely identifies a Slack workspace, such as `T012ABCDEFG`.
