name: delete-application-output
description: Deletes the output destination configuration from your SQL-based Kinesis Data Analytics application's configuration.
flags:
    --application-name=!: The application name.
    --current-application-version-id=!: The application version.
    --output-id=!: The ID of the configuration to delete.
documentation:
    command: Deletes the output destination configuration from your SQL-based Kinesis Data Analytics application's configuration. Kinesis Data Analytics will no longer write data from the corresponding in-application stream to the external output destination.
    flag:
        application-name: The application name.
        current-application-version-id: The application version. You can use the [DescribeApplication]() operation to get the current application version. If the version specified is not the current version, the `ConcurrentModificationException` is returned.
        output-id: The ID of the configuration to delete. Each output configuration that is added to the application (either when the application is created or later) using the [AddApplicationOutput]() operation has a unique ID. You need to provide the ID to uniquely identify the output configuration that you want to delete from the application configuration. You can use the [DescribeApplication]() operation to get the specific `OutputId`.
