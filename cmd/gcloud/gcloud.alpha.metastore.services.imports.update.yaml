name: update
description: '*(ALPHA)*  *(DEPRECATED)*  Update a metadata import.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: The description of the metadata import.
    --location=: The location of the Dataproc Metastore service.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --service=: The identifier of the Dataproc Metastore service
documentation:
    command: |4
        *(ALPHA)*  *(DEPRECATED)*  This command has been deprecated.
        Please use `gcloud metastore services import` command group instead.


        Update the parameters of a metadata import. Only the description
        field of a metadata import is supported to be updated.

        If run asynchronously with `--async`, exits after printing
        one operation name that can be used to poll the status of the
        update via:

          {top_command} metastore operations describe
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: The description of the metadata import.
        location: |-
            The location of the Dataproc Metastore service.
            +
            If not specified, will use `default` metastore/location.
            +

            To set the `location` attribute:
            * provide the argument `import` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `metastore/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        service: |-
            The identifier of the Dataproc Metastore service
            +
            To set the `service` attribute:
            * provide the argument `import` on the command line with a fully specified name;
            * provide the argument `--service` on the command line.
