name: list-asset-relationships
description: Retrieves a paginated list of asset relationships for an asset.
flags:
    --asset-id=!: The ID of the asset.
    --max-results=: The maximum number of results to return for each paginated request.
    --next-token=: The token to be used for the next set of paginated results.
    --traversal-type=!: The type of traversal to use to identify asset relationships.
completion:
    flag:
        traversal-type:
            - PATH_TO_ROOT
documentation:
    command: Retrieves a paginated list of asset relationships for an asset. You can use this operation to identify an asset's root asset and all associated assets between that asset and its root.
    flag:
        asset-id: The ID of the asset. This can be either the actual ID in UUID format, or else `externalId:` followed by the external ID, if it has one. For more information, see [Referencing objects with external IDs](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/object-ids.html#external-id-references) in the *IoT SiteWise User Guide*.
        max-results: The maximum number of results to return for each paginated request.
        next-token: The token to be used for the next set of paginated results.
        traversal-type: |-
            The type of traversal to use to identify asset relationships. Choose the following option:

            - `PATH_TO_ROOT` – Identify the asset's parent assets up to the root asset. The asset that you specify in `assetId` is the first result in the list of `assetRelationshipSummaries`, and the root asset is the last result.
