name: list-insights
description: Returns a list of insights in your Amazon Web Services account.
flags:
    --max-results=: The maximum number of results to return with a single call.
    --next-token=: The pagination token to use to retrieve the next page of results for this operation.
    --status-filter=!: A filter used to filter the returned insights by their status.
documentation:
    command: Returns a list of insights in your Amazon Web Services account. You can specify which insights are returned by their start time and status (`ONGOING`, `CLOSED`, or `ANY`).
    flag:
        max-results: The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned `nextToken` value.
        next-token: The pagination token to use to retrieve the next page of results for this operation. If this value is null, it retrieves the first page.
        status-filter: A filter used to filter the returned insights by their status. You can specify one status filter.
