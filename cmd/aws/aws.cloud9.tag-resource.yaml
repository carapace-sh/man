name: tag-resource
description: Adds tags to an Cloud9 development environment.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the Cloud9 development environment to add tags to.
    --tags=!: The list of tags to add to the given Cloud9 development environment.
documentation:
    command: |-
        Adds tags to an Cloud9 development environment.

        Cloud9 is no longer available to new customers. Existing customers of Cloud9 can continue to use the service as normal. [Learn more"](http://aws.amazon.com/blogs/devops/how-to-migrate-from-aws-cloud9-to-aws-ide-toolkits-or-aws-cloudshell/)

        Tags that you add to an Cloud9 environment by using this method will NOT be automatically propagated to underlying resources.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the Cloud9 development environment to add tags to.
        tags: The list of tags to add to the given Cloud9 development environment.
