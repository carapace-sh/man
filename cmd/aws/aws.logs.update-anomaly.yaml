name: update-anomaly
description: Use this operation to *suppress* anomaly detection for a specified anomaly or pattern.
flags:
    --anomaly-detector-arn=!: The ARN of the anomaly detector that this operation is to act on.
    --anomaly-id=: If you are suppressing or unsuppressing an anomaly, specify its unique ID here.
    --baseline=: Set this to `true` to prevent CloudWatch Logs from displaying this behavior as an anomaly in the future.
    --pattern-id=: If you are suppressing or unsuppressing an pattern, specify its unique ID here.
    --suppression-period=: If you are temporarily suppressing an anomaly or pattern, use this structure to specify how long the suppression is to last.
    --suppression-type=: Use this to specify whether the suppression to be temporary or infinite.
completion:
    flag:
        suppression-type:
            - LIMITED
            - INFINITE
documentation:
    command: |-
        Use this operation to *suppress* anomaly detection for a specified anomaly or pattern. If you suppress an anomaly, CloudWatch Logs won't report new occurrences of that anomaly and won't update that anomaly with new data. If you suppress a pattern, CloudWatch Logs won't report any anomalies related to that pattern.

        You must specify either `anomalyId` or `patternId`, but you can't specify both parameters in the same operation.

        If you have previously used this operation to suppress detection of a pattern or anomaly, you can use it again to cause CloudWatch Logs to end the suppression. To do this, use this operation and specify the anomaly or pattern to stop suppressing, and omit the `suppressionType` and `suppressionPeriod` parameters.
    flag:
        anomaly-detector-arn: The ARN of the anomaly detector that this operation is to act on.
        anomaly-id: If you are suppressing or unsuppressing an anomaly, specify its unique ID here. You can find anomaly IDs by using the [ListAnomalies](https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_ListAnomalies.html) operation.
        baseline: |-
            Set this to `true` to prevent CloudWatch Logs from displaying this behavior as an anomaly in the future. The behavior is then treated as baseline behavior. However, if similar but more severe occurrences of this behavior occur in the future, those will still be reported as anomalies.

            The default is `false`
        pattern-id: If you are suppressing or unsuppressing an pattern, specify its unique ID here. You can find pattern IDs by using the [ListAnomalies](https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_ListAnomalies.html) operation.
        suppression-period: If you are temporarily suppressing an anomaly or pattern, use this structure to specify how long the suppression is to last.
        suppression-type: Use this to specify whether the suppression to be temporary or infinite. If you specify `LIMITED`, you must also specify a `suppressionPeriod`. If you specify `INFINITE`, any value for `suppressionPeriod` is ignored.
