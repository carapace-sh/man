name: create-prompt
description: Creates a prompt.
flags:
    --description=: The description of the prompt.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --name=!: The name of the prompt.
    --s3-uri=!: The URI for the S3 bucket where the prompt is stored.
    --tags=: The tags used to organize, track, or control access for this resource.
documentation:
    command: Creates a prompt. For more information about prompts, such as supported file types and maximum length, see [Create prompts](https://docs.aws.amazon.com/connect/latest/adminguide/prompts.html) in the *Amazon Connect Administrator Guide*.
    flag:
        description: The description of the prompt.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        name: The name of the prompt.
        s3-uri: The URI for the S3 bucket where the prompt is stored. You can provide S3 pre-signed URLs returned by the [GetPromptFile](https://docs.aws.amazon.com/connect/latest/APIReference/API_GetPromptFile.html) API instead of providing S3 URIs.
        tags: 'The tags used to organize, track, or control access for this resource. For example, { "Tags": {"key1":"value1", "key2":"value2"} }.'
