name: update-security-config
description: Updates a security configuration for OpenSearch Serverless.
flags:
    --client-token=: Unique, case-sensitive identifier to ensure idempotency of the request.
    --config-version=!: The version of the security configuration to be updated.
    --description=: A description of the security configuration.
    --iam-federation-options=: Describes IAM federation options in the form of a key-value map for updating an existing security configuration.
    --iam-identity-center-options-updates=: Describes IAM Identity Center options in the form of a key-value map.
    --id=!: The security configuration identifier.
    --saml-options=: SAML options in in the form of a key-value map.
documentation:
    command: Updates a security configuration for OpenSearch Serverless. For more information, see [SAML authentication for Amazon OpenSearch Serverless](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-saml.html).
    flag:
        client-token: Unique, case-sensitive identifier to ensure idempotency of the request.
        config-version: The version of the security configuration to be updated. You can find the most recent version of a security configuration using the `GetSecurityPolicy` command.
        description: A description of the security configuration.
        iam-federation-options: Describes IAM federation options in the form of a key-value map for updating an existing security configuration. Use this field to modify IAM federation settings for the security configuration.
        iam-identity-center-options-updates: Describes IAM Identity Center options in the form of a key-value map.
        id: The security configuration identifier. For SAML the ID will be `saml/<accountId>/<idpProviderName>`. For example, `saml/123456789123/OKTADev`.
        saml-options: SAML options in in the form of a key-value map.
