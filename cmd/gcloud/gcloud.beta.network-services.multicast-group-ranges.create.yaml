name: create
description: '*(BETA)*  Create a multicast group range.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --consumer-accept-list=: An optional list of consumer projects that can use this multicast group range.
    --description=: The description for the multicast group range.
    --distribution-scope=: Distribution scope of this multicast group range.
    --enable-logging: Whether to enable logging for this multicast group range.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location Id.
    --multicast-domain=!: The multicast domain to be used.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-enable-logging&: Whether to enable logging for this multicast group range.
    --no-require-explicit-accept&: Whether an empty consumer accept list will reject all consumer projects.
    --require-explicit-accept: Whether an empty consumer accept list will reject all consumer projects.
    --reserved-internal-range=!: The reserved internal range to be used.
completion:
    flag:
        distribution-scope:
            - distribution-scope-unspecified
            - intra-region
            - intra-zone
documentation:
    command: |
        *(BETA)*  Create a multicast group range in the specified location of the current project.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        consumer-accept-list: An optional list of consumer projects that can use this multicast group range.
        description: The description for the multicast group range.
        distribution-scope: 'Distribution scope of this multicast group range. _DISTRIBUTION_SCOPE_ must be one of: *distribution-scope-unspecified*, *intra-region*, *intra-zone*.'
        enable-logging: Whether to enable logging for this multicast group range. Use *--enable-logging* to enable and *--no-enable-logging* to disable.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location Id.
            +
            To set the `location` attribute:
            * provide the argument `multicast_group_range` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        multicast-domain: The multicast domain to be used.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-enable-logging: Whether to enable logging for this multicast group range.
        no-require-explicit-accept: Whether an empty consumer accept list will reject all consumer projects.
        require-explicit-accept: Whether an empty consumer accept list will reject all consumer projects.
        reserved-internal-range: The reserved internal range to be used.
