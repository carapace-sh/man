name: create
description: '*(ALPHA)*  Create a cluster in a VMware Engine private cloud.'
hidden: true
flags:
    --labels=: List of label KEY=VALUE pairs to add.
    --node-count=!: Initial number of nodes in the cluster
    --privatecloud=: VMware Engine private cloud.
    --region=: Region of the private cloud or cluster.
    --zone=!: Zone in which to create nodes in the cluster
documentation:
    command: |
        *(ALPHA)*  Create a cluster in a VMware Engine private cloud. Successful creation
        of a cluster results in a cluster in READY state. Check the progress
        of a cluster using `gcloud alpha vmware sddc clusters list`.

        For more examples, refer to the EXAMPLES section below.
    flag:
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        node-count: Initial number of nodes in the cluster
        privatecloud: |-
            VMware Engine private cloud.
            +
            To set the `privatecloud` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--privatecloud` on the command line.
        region: |-
            Region of the private cloud or cluster.
            +
            To set the `region` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `vmware/region`.
        zone: Zone in which to create nodes in the cluster
