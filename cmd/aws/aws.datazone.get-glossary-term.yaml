name: get-glossary-term
description: Gets a business glossary term in Amazon DataZone.
flags:
    --domain-identifier=!: The ID of the Amazon DataZone domain in which this business glossary term exists.
    --identifier=!: The ID of the business glossary term.
documentation:
    command: |-
        Gets a business glossary term in Amazon DataZone.

        Prerequisites:

        - Glossary term with identifier must exist in the domain.
        - User must have permission on the glossary term.
        - Domain must be accessible and active.
    flag:
        domain-identifier: The ID of the Amazon DataZone domain in which this business glossary term exists.
        identifier: The ID of the business glossary term.
