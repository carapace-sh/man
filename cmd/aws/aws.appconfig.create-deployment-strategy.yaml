name: create-deployment-strategy
description: Creates a deployment strategy that defines important criteria for rolling out your configuration to the designated targets.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --deployment-duration-in-minutes=!: Total amount of time for a deployment to last.
    --description=: A description of the deployment strategy.
    --final-bake-time-in-minutes=: Specifies the amount of time AppConfig monitors for Amazon CloudWatch alarms after the configuration has been deployed to 100% of its targets, before considering the deployment to be complete.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --growth-factor=!: The percentage of targets to receive a deployed configuration during each interval.
    --growth-type=: The algorithm used to define how percentage grows over time.
    --name=!: A name for the deployment strategy.
    --replicate-to=: Save the deployment strategy to a Systems Manager (SSM) document.
    --tags=: Metadata to assign to the deployment strategy.
completion:
    flag:
        growth-type:
            - LINEAR
            - EXPONENTIAL
        replicate-to:
            - NONE
            - SSM_DOCUMENT
documentation:
    command: Creates a deployment strategy that defines important criteria for rolling out your configuration to the designated targets. A deployment strategy includes the overall duration required, a percentage of targets to receive the deployment during each interval, an algorithm that defines how percentage grows, and bake time.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        deployment-duration-in-minutes: Total amount of time for a deployment to last.
        description: A description of the deployment strategy.
        final-bake-time-in-minutes: Specifies the amount of time AppConfig monitors for Amazon CloudWatch alarms after the configuration has been deployed to 100% of its targets, before considering the deployment to be complete. If an alarm is triggered during this time, AppConfig rolls back the deployment. You must configure permissions for AppConfig to roll back based on CloudWatch alarms. For more information, see [Configuring permissions for rollback based on Amazon CloudWatch alarms](https://docs.aws.amazon.com/appconfig/latest/userguide/getting-started-with-appconfig-cloudwatch-alarms-permissions.html) in the *AppConfig User Guide*.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        growth-factor: The percentage of targets to receive a deployed configuration during each interval.
        growth-type: |-
            The algorithm used to define how percentage grows over time. AppConfig supports the following growth types:

            **Linear**: For this type, AppConfig processes the deployment by dividing the total number of targets by the value specified for `Step percentage`. For example, a linear deployment that uses a `Step percentage` of 10 deploys the configuration to 10 percent of the hosts. After those deployments are complete, the system deploys the configuration to the next 10 percent. This continues until 100% of the targets have successfully received the configuration.

            **Exponential**: For this type, AppConfig processes the deployment exponentially using the following formula: `G*(2^N)`. In this formula, `G` is the growth factor specified by the user and `N` is the number of steps until the configuration is deployed to all targets. For example, if you specify a growth factor of 2, then the system rolls out the configuration as follows:

            `2*(2^0)`

            `2*(2^1)`

            `2*(2^2)`

            Expressed numerically, the deployment rolls out as follows: 2% of the targets, 4% of the targets, 8% of the targets, and continues until the configuration has been deployed to all targets.
        name: A name for the deployment strategy.
        replicate-to: Save the deployment strategy to a Systems Manager (SSM) document.
        tags: Metadata to assign to the deployment strategy. Tags help organize and categorize your AppConfig resources. Each tag consists of a key and an optional value, both of which you define.
