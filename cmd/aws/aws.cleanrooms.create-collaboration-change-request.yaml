name: create-collaboration-change-request
description: Creates a new change request to modify an existing collaboration.
flags:
    --changes=!: The list of changes to apply to the collaboration.
    --collaboration-identifier=!: The identifier of the collaboration that the change request is made against.
documentation:
    command: Creates a new change request to modify an existing collaboration. This enables post-creation modifications to collaborations through a structured API-driven approach.
    flag:
        changes: The list of changes to apply to the collaboration. Each change specifies the type of modification and the details of what should be changed.
        collaboration-identifier: The identifier of the collaboration that the change request is made against.
