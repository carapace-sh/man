name: describe-edge-configuration
description: Describes a stream’s edge configuration that was set using the `StartEdgeConfigurationUpdate` API and the latest status of the edge agent's recorder and uploader jobs.
flags:
    --stream-arn=: The Amazon Resource Name (ARN) of the stream.
    --stream-name=: The name of the stream whose edge configuration you want to update.
documentation:
    command: Describes a stream’s edge configuration that was set using the `StartEdgeConfigurationUpdate` API and the latest status of the edge agent's recorder and uploader jobs. Use this API to get the status of the configuration to determine if the configuration is in sync with the Edge Agent. Use this API to evaluate the health of the Edge Agent.
    flag:
        stream-arn: The Amazon Resource Name (ARN) of the stream. Specify either the `StreamName`or the `StreamARN`.
        stream-name: The name of the stream whose edge configuration you want to update. Specify either the `StreamName` or the `StreamARN`.
