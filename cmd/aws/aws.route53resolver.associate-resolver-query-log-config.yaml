name: associate-resolver-query-log-config
description: Associates an Amazon VPC with a specified query logging configuration.
flags:
    --resolver-query-log-config-id=!: The ID of the query logging configuration that you want to associate a VPC with.
    --resource-id=!: The ID of an Amazon VPC that you want this query logging configuration to log queries for.
documentation:
    command: |-
        Associates an Amazon VPC with a specified query logging configuration. Route 53 Resolver logs DNS queries that originate in all of the Amazon VPCs that are associated with a specified query logging configuration. To associate more than one VPC with a configuration, submit one `AssociateResolverQueryLogConfig` request for each VPC.

        The VPCs that you associate with a query logging configuration must be in the same Region as the configuration.

        To remove a VPC from a query logging configuration, see [DisassociateResolverQueryLogConfig](https://docs.aws.amazon.com/Route53/latest/APIReference/API_route53resolver_DisassociateResolverQueryLogConfig.html).
    flag:
        resolver-query-log-config-id: The ID of the query logging configuration that you want to associate a VPC with.
        resource-id: |-
            The ID of an Amazon VPC that you want this query logging configuration to log queries for.

            The VPCs and the query logging configuration must be in the same Region.
