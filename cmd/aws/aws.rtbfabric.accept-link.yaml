name: accept-link
description: Accepts a link request between gateways.
flags:
    --attributes=: Attributes of the link.
    --gateway-id=!: The unique identifier of the gateway.
    --link-id=!: The unique identifier of the link.
    --log-settings=!: Settings for the application logs.
documentation:
    command: |-
        Accepts a link request between gateways.

        When a requester gateway requests to link with a responder gateway, the responder can use this operation to accept the link request and establish the connection.
    flag:
        attributes: Attributes of the link.
        gateway-id: The unique identifier of the gateway.
        link-id: The unique identifier of the link.
        log-settings: Settings for the application logs.
