name: associate-custom-domain
description: Associate your own domain name with the App Runner subdomain URL of your App Runner service.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-name=!: A custom domain endpoint to associate.
    --enable-www-subdomain: Set to `true` to associate the subdomain `www.DomainName` with the App Runner service in addition to the base domain.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-enable-www-subdomain: Set to `true` to associate the subdomain `www.DomainName` with the App Runner service in addition to the base domain.
    --service-arn=!: The Amazon Resource Name (ARN) of the App Runner service that you want to associate a custom domain name with.
documentation:
    command: |-
        Associate your own domain name with the App Runner subdomain URL of your App Runner service.

        After you call `AssociateCustomDomain` and receive a successful response, use the information in the [CustomDomain]() record that's returned to add CNAME records to your Domain Name System (DNS). For each mapped domain name, add a mapping to the target App Runner subdomain and one or more certificate validation records. App Runner then performs DNS validation to verify that you own or control the domain name that you associated. App Runner tracks domain validity in a certificate stored in [AWS Certificate Manager (ACM)](https://docs.aws.amazon.com/acm/latest/userguide).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain-name: A custom domain endpoint to associate. Specify a root domain (for example, `example.com`), a subdomain (for example, `login.example.com` or `admin.login.example.com`), or a wildcard (for example, `*.example.com`).
        enable-www-subdomain: |-
            Set to `true` to associate the subdomain `www.DomainName` with the App Runner service in addition to the base domain.

            Default: `true`
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        service-arn: The Amazon Resource Name (ARN) of the App Runner service that you want to associate a custom domain name with.
