name: list-rule-types
description: Lists the rules for the condition.
flags:
    --region-filter=: The rule Region to filter on.
    --rule-owner-filter=: The rule owner to filter on.
completion:
    flag:
        rule-owner-filter:
            - AWS
documentation:
    command: Lists the rules for the condition. For more information about conditions, see [Stage conditions](https://docs.aws.amazon.com/codepipeline/latest/userguide/stage-conditions.html) and [How do stage conditions work?](https://docs.aws.amazon.com/codepipeline/latest/userguide/concepts-how-it-works-conditions.html).For more information about rules, see the [CodePipeline rule reference](https://docs.aws.amazon.com/codepipeline/latest/userguide/rule-reference.html).
    flag:
        region-filter: The rule Region to filter on.
        rule-owner-filter: The rule owner to filter on.
