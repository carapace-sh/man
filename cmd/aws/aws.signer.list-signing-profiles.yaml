name: list-signing-profiles
description: Lists all available signing profiles in your AWS account.
flags:
    --include-canceled=: Designates whether to include profiles with the status of `CANCELED`.
    --max-results=: The maximum number of profiles to be returned.
    --next-token=: Value for specifying the next set of paginated results to return.
    --platform-id=: Filters results to return only signing jobs initiated for a specified signing platform.
    --statuses=: Filters results to return only signing jobs with statuses in the specified list.
documentation:
    command: Lists all available signing profiles in your AWS account. Returns only profiles with an `ACTIVE` status unless the `includeCanceled` request field is set to `true`. If additional jobs remain to be listed, AWS Signer returns a `nextToken` value. Use this value in subsequent calls to `ListSigningJobs` to fetch the remaining values. You can continue calling `ListSigningJobs` with your `maxResults` parameter and with new values that Signer returns in the `nextToken` parameter until all of your signing jobs have been returned.
    flag:
        include-canceled: Designates whether to include profiles with the status of `CANCELED`.
        max-results: The maximum number of profiles to be returned.
        next-token: Value for specifying the next set of paginated results to return. After you receive a response with truncated results, use this parameter in a subsequent request. Set it to the value of `nextToken` from the response that you just received.
        platform-id: Filters results to return only signing jobs initiated for a specified signing platform.
        statuses: Filters results to return only signing jobs with statuses in the specified list.
