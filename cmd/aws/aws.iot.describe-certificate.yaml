name: describe-certificate
description: Gets information about the specified certificate.
flags:
    --certificate-id=!: The ID of the certificate.
documentation:
    command: |-
        Gets information about the specified certificate.

        Requires permission to access the [DescribeCertificate](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        certificate-id: The ID of the certificate. (The last part of the certificate ARN contains the certificate ID.)
