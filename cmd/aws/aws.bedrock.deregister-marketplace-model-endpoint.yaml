name: deregister-marketplace-model-endpoint
description: Deregisters an endpoint for a model from Amazon Bedrock Marketplace.
flags:
    --endpoint-arn=!: The Amazon Resource Name (ARN) of the endpoint you want to deregister.
documentation:
    command: Deregisters an endpoint for a model from Amazon Bedrock Marketplace. This operation removes the endpoint's association with Amazon Bedrock but does not delete the underlying Amazon SageMaker endpoint.
    flag:
        endpoint-arn: The Amazon Resource Name (ARN) of the endpoint you want to deregister.
