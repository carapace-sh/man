name: list-build-batches-for-project
description: Retrieves the identifiers of the build batches for a specific project.
flags:
    --filter=: A `BuildBatchFilter` object that specifies the filters for the search.
    --max-results=: The maximum number of results to return.
    --next-token=: The `nextToken` value returned from a previous call to `ListBuildBatchesForProject`.
    --project-name=: The name of the project.
    --sort-order=: Specifies the sort order of the returned items.
completion:
    flag:
        sort-order:
            - ASCENDING
            - DESCENDING
documentation:
    command: Retrieves the identifiers of the build batches for a specific project.
    flag:
        filter: A `BuildBatchFilter` object that specifies the filters for the search.
        max-results: The maximum number of results to return.
        next-token: The `nextToken` value returned from a previous call to `ListBuildBatchesForProject`. This specifies the next item to return. To return the beginning of the list, exclude this parameter.
        project-name: The name of the project.
        sort-order: |-
            Specifies the sort order of the returned items. Valid values include:

            - `ASCENDING`: List the batch build identifiers in ascending order by identifier.
            - `DESCENDING`: List the batch build identifiers in descending order by identifier.
