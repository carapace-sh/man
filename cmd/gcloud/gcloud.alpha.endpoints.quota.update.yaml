name: update
description: '*(ALPHA)*  Update a quota override for a consumer.'
flags:
    --consumer=!: The consumer to update override for.
    --dimensions=: The dimensions of the override, e.g. for specific locations.
    --force: Force override update even if the change results in a substantial decrease in available quota.
    --metric=!: The metric to update a quota override for.
    --no-force&: Force override update even if the change results in a substantial decrease in available quota.
    --service=!: The service to update a quota override for.
    --unit=!: The unit of a metric to update a quota override for.
    --value=!: The value of the override.
documentation:
    command: |-
        *(ALPHA)*  This command updates a quota override for a consumer. The supported consumers
        are projects, folders, and organizations. The override ID can be
        found from list command output.

        ## EXAMPLES

        To update a quota override for project with project number, run:

          $ gcloud alpha endpoints quota update --service=example.googleapis.com --consumer=projects/12321
            --metric=example.googleapis.com/default_requests
            --unit=1/min/{project} --override-id=hello123 --value=360

        To update a quota override for project with project ID, run:

          $ gcloud alpha endpoints quota update --service=example.googleapis.com --consumer=projects/hello
            --metric=example.googleapis.com/default_requests
            --unit=1/min/{project} --override-id=hello123 --value=360

        To update a quota override for an organization, run:

          $ gcloud alpha endpoints quota update --service=example.googleapis.com --consumer=organizations/555
            --metric=example.googleapis.com/default_requests
            --unit=1/min/{project} --override-id=hello123 --value=360

        To force the update of a quota override, run:

          $ gcloud alpha endpoints quota update --service=example.googleapis.com --consumer=projects/12321
            --metric=example.googleapis.com/default_requests
            --unit=1/min/{project}  --override-id=hello123
            --dimensions=regions=us-central1
            --dimensions=zones=us-central1-c --value=360 --force
    flag:
        consumer: The consumer to update override for.
        dimensions: The dimensions of the override, e.g. for specific locations.
        force: Force override update even if the change results in a substantial decrease in available quota.
        metric: The metric to update a quota override for.
        no-force: Force override update even if the change results in a substantial decrease in available quota.
        service: The service to update a quota override for.
        unit: The unit of a metric to update a quota override for.
        value: The value of the override.
