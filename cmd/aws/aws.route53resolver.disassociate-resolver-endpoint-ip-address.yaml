name: disassociate-resolver-endpoint-ip-address
description: Removes IP addresses from an inbound or an outbound Resolver endpoint.
flags:
    --ip-address=!: The IPv4 address that you want to remove from a Resolver endpoint.
    --resolver-endpoint-id=!: The ID of the Resolver endpoint that you want to disassociate an IP address from.
documentation:
    command: |-
        Removes IP addresses from an inbound or an outbound Resolver endpoint. If you want to remove more than one IP address, submit one `DisassociateResolverEndpointIpAddress` request for each IP address.

        To add an IP address to an endpoint, see [AssociateResolverEndpointIpAddress](https://docs.aws.amazon.com/Route53/latest/APIReference/API_route53resolver_AssociateResolverEndpointIpAddress.html).
    flag:
        ip-address: The IPv4 address that you want to remove from a Resolver endpoint.
        resolver-endpoint-id: The ID of the Resolver endpoint that you want to disassociate an IP address from.
