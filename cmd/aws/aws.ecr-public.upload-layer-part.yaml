name: upload-layer-part
description: Uploads an image layer part to Amazon ECR.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --layer-part-blob=!: The base64-encoded layer part payload.
    --part-first-byte=!: The position of the first byte of the layer part witin the overall image layer.
    --part-last-byte=!: The position of the last byte of the layer part within the overall image layer.
    --registry-id=: The Amazon Web Services account ID, or registry alias, that's associated with the registry that you're uploading layer parts to.
    --repository-name=!: The name of the repository that you're uploading layer parts to.
    --upload-id=!: The upload ID from a previous [InitiateLayerUpload]() operation to associate with the layer part upload.
documentation:
    command: |-
        Uploads an image layer part to Amazon ECR.

        When an image is pushed, each new image layer is uploaded in parts. The maximum size of each image layer part can be 20971520 bytes (about 20MB). The UploadLayerPart API is called once for each new image layer part.

        This operation is used by the Amazon ECR proxy and is not generally used by customers for pulling and pushing images. In most cases, you should use the `docker` CLI to pull, tag, and push images.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        layer-part-blob: The base64-encoded layer part payload.
        part-first-byte: The position of the first byte of the layer part witin the overall image layer.
        part-last-byte: The position of the last byte of the layer part within the overall image layer.
        registry-id: The Amazon Web Services account ID, or registry alias, that's associated with the registry that you're uploading layer parts to. If you do not specify a registry, the default public registry is assumed.
        repository-name: The name of the repository that you're uploading layer parts to.
        upload-id: The upload ID from a previous [InitiateLayerUpload]() operation to associate with the layer part upload.
