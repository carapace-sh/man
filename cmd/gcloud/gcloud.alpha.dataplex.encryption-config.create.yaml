name: create
description: '*(ALPHA)*  Create a Dataplex encryption config resource.'
flags:
    --key=: The KMS key to use for encryption.
    --location=: The location of the Dataplex resource.
    --organization=: The name of encryption config to use.
documentation:
    command: '*(ALPHA)*  An EncryptionConfig is created only for CMEK opted in organizations.'
    flag:
        key: The KMS key to use for encryption.
        location: |-
            The location of the Dataplex resource.
            +
            To set the `location` attribute:
            * provide the argument `encryption_config` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
        organization: |-
            The name of encryption config to use.
            +
            To set the `organization` attribute:
            * provide the argument `encryption_config` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
