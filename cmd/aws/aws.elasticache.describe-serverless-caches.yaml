name: describe-serverless-caches
description: Returns information about a specific serverless cache.
flags:
    --max-results=: The maximum number of records in the response.
    --next-token=: An optional marker returned from a prior request to support pagination of results from this operation.
    --serverless-cache-name=: The identifier for the serverless cache.
documentation:
    command: Returns information about a specific serverless cache. If no identifier is specified, then the API returns information on all the serverless caches belonging to this Amazon Web Services account.
    flag:
        max-results: The maximum number of records in the response. If more records exist than the specified max-records value, the next token is included in the response so that remaining results can be retrieved. The default is 50.
        next-token: An optional marker returned from a prior request to support pagination of results from this operation. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by MaxResults.
        serverless-cache-name: 'The identifier for the serverless cache. If this parameter is specified, only information about that specific serverless cache is returned. Default: NULL'
