name: update-thing-group
description: Update a thing group.
flags:
    --expected-version=: The expected version of the thing group.
    --thing-group-name=!: The thing group to update.
    --thing-group-properties=!: The thing group properties.
documentation:
    command: |-
        Update a thing group.

        Requires permission to access the [UpdateThingGroup](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        expected-version: The expected version of the thing group. If this does not match the version of the thing group being updated, the update will fail.
        thing-group-name: The thing group to update.
        thing-group-properties: The thing group properties.
