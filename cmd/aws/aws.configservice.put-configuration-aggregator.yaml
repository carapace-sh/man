name: put-configuration-aggregator
description: Creates and updates the configuration aggregator with the selected source accounts and regions.
flags:
    --account-aggregation-sources=:
        description: A list of AccountAggregationSource object.
        nargs: -1
    --aggregator-filters=: An object to filter configuration recorders in an aggregator.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration-aggregator-name=!: The name of the configuration aggregator.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --organization-aggregation-source=: An OrganizationAggregationSource object.
    --tags=:
        description: An array of tag object.
        nargs: -1
documentation:
    command: |-
        Creates and updates the configuration aggregator with the selected source accounts and regions. The source account can be individual account(s) or an organization.

        `accountIds` that are passed will be replaced with existing accounts. If you want to add additional accounts into the aggregator, call `DescribeConfigurationAggregators` to get the previous accounts and then append new ones.

        Config should be enabled in source accounts and regions you want to aggregate.

        If your source type is an organization, you must be signed in to the management account or a registered delegated administrator and all the features must be enabled in your organization. If the caller is a management account, Config calls `EnableAwsServiceAccess` API to enable integration between Config and Organizations. If the caller is a registered delegated administrator, Config calls `ListDelegatedAdministrators` API to verify whether the caller is a valid delegated administrator.

        To register a delegated administrator, see [Register a Delegated Administrator](https://docs.aws.amazon.com/config/latest/developerguide/set-up-aggregator-cli.html#register-a-delegated-administrator-cli) in the *Config developer guide*.

        **Tags are added at creation and cannot be updated with this operation**

        `PutConfigurationAggregator` is an idempotent API. Subsequent requests won’t create a duplicate resource if one was already created. If a following request has different `tags` values, Config will ignore these differences and treat it as an idempotent request of the previous. In this case, `tags` will not be updated, even if they are different.

        Use [TagResource](https://docs.aws.amazon.com/config/latest/APIReference/API_TagResource.html) and [UntagResource](https://docs.aws.amazon.com/config/latest/APIReference/API_UntagResource.html) to update tags after creation.
    flag:
        account-aggregation-sources: A list of AccountAggregationSource object.
        aggregator-filters: An object to filter configuration recorders in an aggregator. Either `ResourceType` or `ServicePrincipal` is required.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration-aggregator-name: The name of the configuration aggregator.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        organization-aggregation-source: An OrganizationAggregationSource object.
        tags: An array of tag object.
