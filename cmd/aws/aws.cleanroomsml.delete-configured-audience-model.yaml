name: delete-configured-audience-model
description: Deletes the specified configured audience model.
flags:
    --configured-audience-model-arn=!: The Amazon Resource Name (ARN) of the configured audience model that you want to delete.
documentation:
    command: Deletes the specified configured audience model. You can't delete a configured audience model if there are any lookalike models that use the configured audience model. If you delete a configured audience model, it will be removed from any collaborations that it is associated to.
    flag:
        configured-audience-model-arn: The Amazon Resource Name (ARN) of the configured audience model that you want to delete.
