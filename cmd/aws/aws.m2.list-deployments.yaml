name: list-deployments
description: Returns a list of all deployments of a specific application.
flags:
    --application-id=!: The application identifier.
    --max-results=: The maximum number of objects to return.
    --next-token=: A pagination token returned from a previous call to this operation.
documentation:
    command: Returns a list of all deployments of a specific application. A deployment is a combination of a specific application and a specific version of that application. Each deployment is mapped to a particular application version.
    flag:
        application-id: The application identifier.
        max-results: The maximum number of objects to return.
        next-token: A pagination token returned from a previous call to this operation. This specifies the next item to return. To return to the beginning of the list, exclude this parameter.
