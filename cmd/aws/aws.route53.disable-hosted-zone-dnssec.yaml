name: disable-hosted-zone-dnssec
description: Disables DNSSEC signing in a specific hosted zone.
flags:
    --hosted-zone-id=!: A unique string used to identify a hosted zone.
documentation:
    command: Disables DNSSEC signing in a specific hosted zone. This action does not deactivate any key-signing keys (KSKs) that are active in the hosted zone.
    flag:
        hosted-zone-id: A unique string used to identify a hosted zone.
