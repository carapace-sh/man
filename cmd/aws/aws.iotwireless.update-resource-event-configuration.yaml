name: update-resource-event-configuration
description: Update the event configuration for a particular resource identifier.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --connection-status=: Event configuration for the connection status event.
    --device-registration-state=: Event configuration for the device registration state event.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identifier-type=!: Identifier type of the particular resource identifier for event configuration.
    --identifier=!: Resource identifier to opt in for event messaging.
    --join=: Event configuration for the join event.
    --message-delivery-status=: Event configuration for the message delivery status event.
    --partner-type=: Partner type of the resource if the identifier type is `PartnerAccountId`
    --proximity=: Event configuration for the proximity event.
completion:
    flag:
        identifier-type:
            - PartnerAccountId
            - DevEui
            - GatewayEui
            - WirelessDeviceId
            - WirelessGatewayId
        partner-type:
            - Sidewalk
documentation:
    command: Update the event configuration for a particular resource identifier.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        connection-status: Event configuration for the connection status event.
        device-registration-state: Event configuration for the device registration state event.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        identifier: Resource identifier to opt in for event messaging.
        identifier-type: Identifier type of the particular resource identifier for event configuration.
        join: Event configuration for the join event.
        message-delivery-status: Event configuration for the message delivery status event.
        partner-type: Partner type of the resource if the identifier type is `PartnerAccountId`
        proximity: Event configuration for the proximity event.
