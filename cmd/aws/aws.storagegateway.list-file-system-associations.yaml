name: list-file-system-associations
description: Gets a list of `FileSystemAssociationSummary` objects.
flags:
    --gateway-arn=: ""
    --limit=: The maximum number of file system associations to return in the response.
    --marker=: Opaque pagination token returned from a previous `ListFileSystemAssociations` operation.
documentation:
    command: Gets a list of `FileSystemAssociationSummary` objects. Each object contains a summary of a file system association. This operation is only supported for FSx File Gateways.
    flag:
        gateway-arn: ""
        limit: The maximum number of file system associations to return in the response. If present, `Limit` must be an integer with a value greater than zero. Optional.
        marker: Opaque pagination token returned from a previous `ListFileSystemAssociations` operation. If present, `Marker` specifies where to continue the list from after a previous call to `ListFileSystemAssociations`. Optional.
