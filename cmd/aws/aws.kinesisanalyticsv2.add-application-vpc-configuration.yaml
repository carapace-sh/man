name: add-application-vpc-configuration
description: Adds a Virtual Private Cloud (VPC) configuration to the application.
flags:
    --application-name=!: The name of an existing application.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --conditional-token=: A value you use to implement strong concurrency for application updates.
    --current-application-version-id=: The version of the application to which you want to add the VPC configuration.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --vpc-configuration=!: Description of the VPC to add to the application.
documentation:
    command: |-
        Adds a Virtual Private Cloud (VPC) configuration to the application. Applications can use VPCs to store and access resources securely.

        Note the following about VPC configurations for Managed Service for Apache Flink applications:

        - VPC configurations are not supported for SQL applications.
        - When a VPC is added to a Managed Service for Apache Flink application, the application can no longer be accessed from the Internet directly. To enable Internet access to the application, add an Internet gateway to your VPC.
    flag:
        application-name: The name of an existing application.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        conditional-token: A value you use to implement strong concurrency for application updates. You must provide the `ApplicationVersionID` or the `ConditionalToken`. You get the application's current `ConditionalToken` using [DescribeApplication](). For better concurrency support, use the `ConditionalToken` parameter instead of `CurrentApplicationVersionId`.
        current-application-version-id: The version of the application to which you want to add the VPC configuration. You must provide the `CurrentApplicationVersionId` or the `ConditionalToken`. You can use the [DescribeApplication]() operation to get the current application version. If the version specified is not the current version, the `ConcurrentModificationException` is returned. For better concurrency support, use the `ConditionalToken` parameter instead of `CurrentApplicationVersionId`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        vpc-configuration: Description of the VPC to add to the application.
