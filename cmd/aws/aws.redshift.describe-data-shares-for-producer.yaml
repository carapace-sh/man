name: describe-data-shares-for-producer
description: Returns a list of datashares when the account identifier being called is a producer account identifier.
flags:
    --marker=: An optional parameter that specifies the starting point to return a set of response records.
    --max-records=: The maximum number of response records to return in each call.
    --producer-arn=: The Amazon Resource Name (ARN) of the producer namespace that returns in the list of datashares.
    --status=: An identifier giving the status of a datashare in the producer.
completion:
    flag:
        status:
            - ACTIVE
            - AUTHORIZED
            - PENDING_AUTHORIZATION
            - DEAUTHORIZED
            - REJECTED
documentation:
    command: Returns a list of datashares when the account identifier being called is a producer account identifier.
    flag:
        marker: An optional parameter that specifies the starting point to return a set of response records. When the results of a [DescribeDataSharesForProducer]() request exceed the value specified in `MaxRecords`, Amazon Web Services returns a value in the `Marker` field of the response. You can retrieve the next set of response records by providing the returned marker value in the `Marker` parameter and retrying the request.
        max-records: The maximum number of response records to return in each call. If the number of remaining response records exceeds the specified `MaxRecords` value, a value is returned in a `marker` field of the response. You can retrieve the next set of records by retrying the command with the returned marker value.
        producer-arn: The Amazon Resource Name (ARN) of the producer namespace that returns in the list of datashares.
        status: An identifier giving the status of a datashare in the producer. If this field is specified, Amazon Redshift returns the list of datashares that have the specified status.
