name: update
description: '*(ALPHA)*  Update a composite health check.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: A textual description of this resource.
    --health-destination=: URL to the destination resource.
    --health-sources=: URLs to the HealthSource resources whose results are AND'ed.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: The name of the Google Compute Engine region.
documentation:
    command: '*(ALPHA)*  Update a composite health check.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: A textual description of this resource.
        health-destination: |-
            URL to the destination resource. Must be set. Must be a ForwardingRule. The ForwardingRule
            must have load balancing scheme INTERNAL or INTERNAL_MANAGED and must be regional and in the
            same region as the CompositeHealthCheck (cross-region deployment for INTERNAL_MANAGED is not
            supported). Can be mutated.
        health-sources: |-
            URLs to the HealthSource resources whose results are AND'ed. I.e. the aggregated result is
            HEALTHY only if all sources are HEALTHY. Must have at least 1. Must not have more than 10.
            Must be regional and in the same region as the CompositeHealthCheck. Can be mutated.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            The name of the Google Compute Engine region.
            +
            To set the `region` attribute:
            * provide the argument `composite_health_check` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `compute/region`.
