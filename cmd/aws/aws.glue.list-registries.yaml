name: list-registries
description: Returns a list of registries that you have created, with minimal registry information.
flags:
    --max-results=: Maximum number of results required per page.
    --next-token=: A continuation token, if this is a continuation call.
documentation:
    command: Returns a list of registries that you have created, with minimal registry information. Registries in the `Deleting` status will not be included in the results. Empty results will be returned if there are no registries available.
    flag:
        max-results: Maximum number of results required per page. If the value is not supplied, this will be defaulted to 25 per page.
        next-token: A continuation token, if this is a continuation call.
