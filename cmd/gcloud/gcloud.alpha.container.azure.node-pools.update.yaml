    --async: Return immediately, without waiting for the operation in progress to
    --clear-annotations: Clear the annotations for the node pool.
    --cluster=: cluster of the nodepool.
    --enable-autorepair: Enable node autorepair feature for a node pool.
    --location=: Google Cloud location for the nodepool.
    --max-nodes=: Maximum number of nodes in the node pool.
    --min-nodes=: Minimum number of nodes in the node pool.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-annotations&: Clear the annotations for the node pool.
    --no-enable-autorepair&: Enable node autorepair feature for a node pool.
    --no-validate-only&: Validate the update of the node pool, but don't actually perform it.
    --node-version=: Kubernetes version to use for the node pool.
    --ssh-public-key=: SSH public key to use for authentication.
    --validate-only: Validate the update of the node pool, but don't actually perform it.
documentation:
