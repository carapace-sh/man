name: create-custom-domain-association
description: Used to create a custom domain name for a cluster.
flags:
    --cluster-identifier=!: The cluster identifier that the custom domain is associated with.
    --custom-domain-certificate-arn=!: The certificate Amazon Resource Name (ARN) for the custom domain name association.
    --custom-domain-name=!: The custom domain name for a custom domain association.
documentation:
    command: Used to create a custom domain name for a cluster. Properties include the custom domain name, the cluster the custom domain is associated with, and the certificate Amazon Resource Name (ARN).
    flag:
        cluster-identifier: The cluster identifier that the custom domain is associated with.
        custom-domain-certificate-arn: The certificate Amazon Resource Name (ARN) for the custom domain name association.
        custom-domain-name: The custom domain name for a custom domain association.
