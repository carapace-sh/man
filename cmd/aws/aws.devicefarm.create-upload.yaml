name: create-upload
description: Uploads an app or test scripts.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --content-type=: The upload's content type (for example, `application/octet-stream`).
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The upload's file name.
    --project-arn=!: The ARN of the project for the upload.
    --type=!: The upload's upload type.
completion:
    flag:
        type:
            - ANDROID_APP
            - IOS_APP
            - WEB_APP
            - EXTERNAL_DATA
            - APPIUM_JAVA_JUNIT_TEST_PACKAGE
            - APPIUM_JAVA_TESTNG_TEST_PACKAGE
            - APPIUM_PYTHON_TEST_PACKAGE
            - APPIUM_NODE_TEST_PACKAGE
            - APPIUM_RUBY_TEST_PACKAGE
            - APPIUM_WEB_JAVA_JUNIT_TEST_PACKAGE
            - APPIUM_WEB_JAVA_TESTNG_TEST_PACKAGE
            - APPIUM_WEB_PYTHON_TEST_PACKAGE
            - APPIUM_WEB_NODE_TEST_PACKAGE
            - APPIUM_WEB_RUBY_TEST_PACKAGE
            - CALABASH_TEST_PACKAGE
            - INSTRUMENTATION_TEST_PACKAGE
            - UIAUTOMATION_TEST_PACKAGE
            - UIAUTOMATOR_TEST_PACKAGE
            - XCTEST_TEST_PACKAGE
            - XCTEST_UI_TEST_PACKAGE
            - APPIUM_JAVA_JUNIT_TEST_SPEC
            - APPIUM_JAVA_TESTNG_TEST_SPEC
            - APPIUM_PYTHON_TEST_SPEC
            - APPIUM_NODE_TEST_SPEC
            - APPIUM_RUBY_TEST_SPEC
            - APPIUM_WEB_JAVA_JUNIT_TEST_SPEC
            - APPIUM_WEB_JAVA_TESTNG_TEST_SPEC
            - APPIUM_WEB_PYTHON_TEST_SPEC
            - APPIUM_WEB_NODE_TEST_SPEC
            - APPIUM_WEB_RUBY_TEST_SPEC
            - INSTRUMENTATION_TEST_SPEC
            - XCTEST_UI_TEST_SPEC
documentation:
    command: Uploads an app or test scripts.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        content-type: The upload's content type (for example, `application/octet-stream`).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The upload's file name. The name should not contain any forward slashes (`/`). If you are uploading an iOS app, the file name must end with the `.ipa` extension. If you are uploading an Android app, the file name must end with the `.apk` extension. For all others, the file name must end with the `.zip` file extension.
        project-arn: The ARN of the project for the upload.
        type: |-
            The upload's upload type.

            Must be one of the following values:

            - ANDROID\_APP
            - IOS\_APP
            - WEB\_APP
            - EXTERNAL\_DATA
            - APPIUM\_JAVA\_JUNIT\_TEST\_PACKAGE
            - APPIUM\_JAVA\_TESTNG\_TEST\_PACKAGE
            - APPIUM\_PYTHON\_TEST\_PACKAGE
            - APPIUM\_NODE\_TEST\_PACKAGE
            - APPIUM\_RUBY\_TEST\_PACKAGE
            - APPIUM\_WEB\_JAVA\_JUNIT\_TEST\_PACKAGE
            - APPIUM\_WEB\_JAVA\_TESTNG\_TEST\_PACKAGE
            - APPIUM\_WEB\_PYTHON\_TEST\_PACKAGE
            - APPIUM\_WEB\_NODE\_TEST\_PACKAGE
            - APPIUM\_WEB\_RUBY\_TEST\_PACKAGE
            - INSTRUMENTATION\_TEST\_PACKAGE
            - XCTEST\_TEST\_PACKAGE
            - XCTEST\_UI\_TEST\_PACKAGE
            - APPIUM\_JAVA\_JUNIT\_TEST\_SPEC
            - APPIUM\_JAVA\_TESTNG\_TEST\_SPEC
            - APPIUM\_PYTHON\_TEST\_SPEC
            - APPIUM\_NODE\_TEST\_SPEC
            - APPIUM\_RUBY\_TEST\_SPEC
            - APPIUM\_WEB\_JAVA\_JUNIT\_TEST\_SPEC
            - APPIUM\_WEB\_JAVA\_TESTNG\_TEST\_SPEC
            - APPIUM\_WEB\_PYTHON\_TEST\_SPEC
            - APPIUM\_WEB\_NODE\_TEST\_SPEC
            - APPIUM\_WEB\_RUBY\_TEST\_SPEC
            - INSTRUMENTATION\_TEST\_SPEC
            - XCTEST\_UI\_TEST\_SPEC

            If you call `CreateUpload` with `WEB_APP` specified, AWS Device Farm throws an `ArgumentException` error.
