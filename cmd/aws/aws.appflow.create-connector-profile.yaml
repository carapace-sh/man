name: create-connector-profile
description: Creates a new connector profile associated with your Amazon Web Services account.
flags:
    --client-token=: The `clientToken` parameter is an idempotency token.
    --connection-mode=!: Indicates the connection mode and specifies whether it is public or private.
    --connector-label=: The label of the connector.
    --connector-profile-config=!: Defines the connector-specific configuration and credentials.
    --connector-profile-name=!: The name of the connector profile.
    --connector-type=!: The type of connector, such as Salesforce, Amplitude, and so on.
    --kms-arn=: The ARN (Amazon Resource Name) of the Key Management Service (KMS) key you provide for encryption.
completion:
    flag:
        connection-mode:
            - Public
            - Private
        connector-type:
            - Salesforce
            - Singular
            - Slack
            - Redshift
            - S3
            - Marketo
            - Googleanalytics
            - Zendesk
            - Servicenow
            - Datadog
            - Trendmicro
            - Snowflake
            - Dynatrace
            - Infornexus
            - Amplitude
            - Veeva
            - EventBridge
            - LookoutMetrics
            - Upsolver
            - Honeycode
            - CustomerProfiles
            - SAPOData
            - CustomConnector
            - Pardot
documentation:
    command: Creates a new connector profile associated with your Amazon Web Services account. There is a soft quota of 100 connector profiles per Amazon Web Services account. If you need more connector profiles than this quota allows, you can submit a request to the Amazon AppFlow team through the Amazon AppFlow support channel. In each connector profile that you create, you can provide the credentials and properties for only one connector.
    flag:
        client-token: |-
            The `clientToken` parameter is an idempotency token. It ensures that your `CreateConnectorProfile` request completes only once. You choose the value to pass. For example, if you don't receive a response from your request, you can safely retry the request with the same `clientToken` parameter value.

            If you omit a `clientToken` value, the Amazon Web Services SDK that you are using inserts a value for you. This way, the SDK can safely retry requests multiple times after a network error. You must provide your own value for other use cases.

            If you specify input parameters that differ from your first request, an error occurs. If you use a different value for `clientToken`, Amazon AppFlow considers it a new call to `CreateConnectorProfile`. The token is active for 8 hours.
        connection-mode: Indicates the connection mode and specifies whether it is public or private. Private flows use Amazon Web Services PrivateLink to route data over Amazon Web Services infrastructure without exposing it to the public internet.
        connector-label: The label of the connector. The label is unique for each `ConnectorRegistration` in your Amazon Web Services account. Only needed if calling for CUSTOMCONNECTOR connector type/.
        connector-profile-config: Defines the connector-specific configuration and credentials.
        connector-profile-name: The name of the connector profile. The name is unique for each `ConnectorProfile` in your Amazon Web Services account.
        connector-type: The type of connector, such as Salesforce, Amplitude, and so on.
        kms-arn: The ARN (Amazon Resource Name) of the Key Management Service (KMS) key you provide for encryption. This is required if you do not want to use the Amazon AppFlow-managed KMS key. If you don't provide anything here, Amazon AppFlow uses the Amazon AppFlow-managed KMS key.
