name: create-restore-image-task
description: |-
    Starts a task that restores an AMI from an Amazon S3 object that was previously created by using [CreateStoreImageTask](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_CreateStoreImageTask.html).

    To use this API, you must have the required permissions.
flags:
    --bucket=!: The name of the Amazon S3 bucket that contains the stored AMI object.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --name=: The name for the restored AMI.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --object-key=!: The name of the stored AMI object in the bucket.
    --tag-specifications=: The tags to apply to the AMI and snapshots on restoration.
documentation:
    command: |-
        Starts a task that restores an AMI from an Amazon S3 object that was previously created by using [CreateStoreImageTask](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_CreateStoreImageTask.html).

        To use this API, you must have the required permissions. For more information, see [Permissions for storing and restoring AMIs using S3](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/work-with-ami-store-restore.html#ami-s3-permissions) in the *Amazon EC2 User Guide*.

        For more information, see [Store and restore an AMI using S3](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ami-store-restore.html) in the *Amazon EC2 User Guide*.
    flag:
        bucket: The name of the Amazon S3 bucket that contains the stored AMI object.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        name: The name for the restored AMI. The name must be unique for AMIs in the Region for this account. If you do not provide a name, the new AMI gets the same name as the original AMI.
        object-key: The name of the stored AMI object in the bucket.
        tag-specifications: |-
            The tags to apply to the AMI and snapshots on restoration. You can tag the AMI, the snapshots, or both.

            - To tag the AMI, the value for `ResourceType` must be `image`.
            - To tag the snapshots, the value for `ResourceType` must be `snapshot`. The same tag is applied to all of the snapshots that are created.
