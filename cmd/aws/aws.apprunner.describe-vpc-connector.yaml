name: describe-vpc-connector
description: Return a description of an App Runner VPC connector resource.
flags:
    --vpc-connector-arn=!: The Amazon Resource Name (ARN) of the App Runner VPC connector that you want a description for.
documentation:
    command: Return a description of an App Runner VPC connector resource.
    flag:
        vpc-connector-arn: |-
            The Amazon Resource Name (ARN) of the App Runner VPC connector that you want a description for.

            The ARN must be a full VPC connector ARN.
