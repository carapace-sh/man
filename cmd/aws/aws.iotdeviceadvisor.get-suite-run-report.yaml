name: get-suite-run-report
description: Gets a report download link for a successful Device Advisor qualifying test suite run.
flags:
    --suite-definition-id=!: Suite definition ID of the test suite.
    --suite-run-id=!: Suite run ID of the test suite run.
documentation:
    command: |-
        Gets a report download link for a successful Device Advisor qualifying test suite run.

        Requires permission to access the [GetSuiteRunReport](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        suite-definition-id: Suite definition ID of the test suite.
        suite-run-id: Suite run ID of the test suite run.
