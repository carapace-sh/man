name: delete-recommender
description: Deactivates and removes a recommender.
flags:
    --recommender-arn=!: The Amazon Resource Name (ARN) of the recommender to delete.
documentation:
    command: Deactivates and removes a recommender. A deleted recommender can no longer be specified in a [GetRecommendations](https://docs.aws.amazon.com/personalize/latest/dg/API_RS_GetRecommendations.html) request.
    flag:
        recommender-arn: The Amazon Resource Name (ARN) of the recommender to delete.
