name: list-finding-aggregators
description: If cross-Region aggregation is enabled, then `ListFindingAggregators` returns the Amazon Resource Name (ARN) of the finding aggregator.
flags:
    --max-results=: The maximum number of results to return.
    --next-token=: The token returned with the previous set of results.
documentation:
    command: If cross-Region aggregation is enabled, then `ListFindingAggregators` returns the Amazon Resource Name (ARN) of the finding aggregator. You can run this operation from any Amazon Web Services Region.
    flag:
        max-results: The maximum number of results to return. This operation currently only returns a single result.
        next-token: The token returned with the previous set of results. Identifies the next set of results to return.
