name: reject-spoke-update
description: '*(BETA)*  Reject a proposal to update a spoke in a hub.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --details=: Additional details behind the rejection
    --no-async&: Return immediately, without waiting for the operation in progress to
    --spoke-etag=!: Etag of the spoke to reject update
    --spoke=!: URI of the spoke to reject update
documentation:
    command: |-
        *(BETA)*  Reject a VPC spoke update proposal. By rejecting a spoke update,
        you prevent updating the connectivity between the associated VPC network and
        any other VPC networks that are attached to the same hub.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        details: Additional details behind the rejection
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        spoke: URI of the spoke to reject update
        spoke-etag: Etag of the spoke to reject update
