name: get-entities
description: Gets definitions of the specified entities.
flags:
    --ids=!: An array of entity IDs.
    --namespace-version=: The version of the user's namespace.
documentation:
    command: |-
        Gets definitions of the specified entities. Uses the latest version of the user's namespace by default. This API returns the following TDM entities.

        - Properties
        - States
        - Events
        - Actions
        - Capabilities
        - Mappings
        - Devices
        - Device Models
        - Services

        This action doesn't return definitions for systems, flows, and deployments.
    flag:
        ids: |-
            An array of entity IDs.

            The IDs should be in the following format.

            `urn:tdm:REGION/ACCOUNT ID/default:device:DEVICENAME`
        namespace-version: The version of the user's namespace. Defaults to the latest version of the user's namespace.
