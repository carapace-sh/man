name: set-iam-policy
description: '*(BETA)*  Set the IAM policy for a Policy Tag taxonomy.'
flags:
    --location=: Location of the taxonomy.
documentation:
    command: |
        *(BETA)*  Set the IAM policy for the given Policy Tag taxonomy as
        defined in a JSON or YAML file.
    flag:
        location: |-
            Location of the taxonomy.
            +

            To set the `location` attribute:
            * provide the argument `taxonomy` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
