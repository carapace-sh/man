name: test-enabled
description: '*(BETA)*  Test a service against the result of merging MCP policies in the resource hierarchy.'
hidden: true
flags:
    --folder=: The Google Cloud Platform folder ID to use for this invocation.
    --organization=: The Google Cloud Platform organization ID to use for this invocation.
documentation:
    command: |-
        *(BETA)*  Test a service against the result of merging MCP policies in the resource
        hierarchy.

        ## EXAMPLES

        Test for service my-service for current project:

          $ gcloud beta services mcp policies test-enabled my-service

        Test for service my-service for project `my-project`:

          $ gcloud beta services mcp policies test-enabled my-service --project=my-project
    flag:
        folder: The Google Cloud Platform folder ID to use for this invocation.
        organization: The Google Cloud Platform organization ID to use for this invocation.
