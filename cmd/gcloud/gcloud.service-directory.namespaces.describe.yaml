name: describe
description: Describes a namespace.
flags:
    --location=: The name of the region for the namespace.
documentation:
    command: Describes a namespace.
    flag:
        location: |-
            The name of the region for the namespace.
            +
            To set the `location` attribute:
            * provide the argument `namespace` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
