name: create-cluster
description: Creates an empty cluster.
flags:
    --address-id=!: The ID for the address that you want the cluster shipped to.
    --description=: An optional description of this specific cluster, for example `Environmental Data Cluster-01`.
    --force-create-jobs: Force to create cluster when user attempts to overprovision or underprovision a cluster.
    --forwarding-address-id=: The forwarding address ID for a cluster.
    --initial-cluster-size=: If provided, each job will be automatically created and associated with the new cluster.
    --job-type=!: The type of job for this cluster.
    --kms-key-arn=: The `KmsKeyARN` value that you want to associate with this cluster.
    --long-term-pricing-ids=: Lists long-term pricing id that will be used to associate with jobs automatically created for the new cluster.
    --no-force-create-jobs: Force to create cluster when user attempts to overprovision or underprovision a cluster.
    --notification=: The Amazon Simple Notification Service (Amazon SNS) notification settings for this cluster.
    --on-device-service-configuration=: Specifies the service or services on the Snow Family device that your transferred data will be exported from or imported into.
    --remote-management=: Allows you to securely operate and manage Snow devices in a cluster remotely from outside of your internal network.
    --resources=: The resources associated with the cluster job.
    --role-arn=: The `RoleARN` that you want to associate with this cluster.
    --shipping-option=!: The shipping speed for each node in this cluster.
    --snowball-capacity-preference=: If your job is being created in one of the US regions, you have the option of specifying what size Snow device you'd like for this job.
    --snowball-type=!: The type of Snow Family devices to use for this cluster.
    --tax-documents=: The tax documents required in your Amazon Web Services Region.
completion:
    flag:
        job-type:
            - IMPORT
            - EXPORT
            - LOCAL_USE
        remote-management:
            - INSTALLED_ONLY
            - INSTALLED_AUTOSTART
            - NOT_INSTALLED
        shipping-option:
            - SECOND_DAY
            - NEXT_DAY
            - EXPRESS
            - STANDARD
        snowball-capacity-preference:
            - T50
            - T80
            - T100
            - T42
            - T98
            - T8
            - T14
            - T32
            - NoPreference
            - T240
            - T13
        snowball-type:
            - STANDARD
            - EDGE
            - EDGE_C
            - EDGE_CG
            - EDGE_S
            - SNC1_HDD
            - SNC1_SSD
            - V3_5C
            - V3_5S
            - RACK_5U_C
documentation:
    command: Creates an empty cluster. Each cluster supports five nodes. You use the [CreateJob]() action separately to create the jobs for each of these nodes. The cluster does not ship until these five node jobs have been created.
    flag:
        address-id: The ID for the address that you want the cluster shipped to.
        description: An optional description of this specific cluster, for example `Environmental Data Cluster-01`.
        force-create-jobs: Force to create cluster when user attempts to overprovision or underprovision a cluster. A cluster is overprovisioned or underprovisioned if the initial size of the cluster is more (overprovisioned) or less (underprovisioned) than what needed to meet capacity requirement specified with `OnDeviceServiceConfiguration`.
        forwarding-address-id: The forwarding address ID for a cluster. This field is not supported in most regions.
        initial-cluster-size: If provided, each job will be automatically created and associated with the new cluster. If not provided, will be treated as 0.
        job-type: |-
            The type of job for this cluster. Currently, the only job type supported for clusters is `LOCAL_USE`.

            For more information, see "https://docs.aws.amazon.com/snowball/latest/snowcone-guide/snow-device-types.html" (Snow Family Devices and Capacity) in the *Snowcone User Guide* or "https://docs.aws.amazon.com/snowball/latest/developer-guide/snow-device-types.html" (Snow Family Devices and Capacity) in the *Snowcone User Guide*.
        kms-key-arn: The `KmsKeyARN` value that you want to associate with this cluster. `KmsKeyARN` values are created by using the [CreateKey](https://docs.aws.amazon.com/kms/latest/APIReference/API_CreateKey.html) API action in Key Management Service (KMS).
        long-term-pricing-ids: Lists long-term pricing id that will be used to associate with jobs automatically created for the new cluster.
        notification: The Amazon Simple Notification Service (Amazon SNS) notification settings for this cluster.
        on-device-service-configuration: Specifies the service or services on the Snow Family device that your transferred data will be exported from or imported into. Amazon Web Services Snow Family device clusters support Amazon S3 and NFS (Network File System).
        remote-management: Allows you to securely operate and manage Snow devices in a cluster remotely from outside of your internal network. When set to `INSTALLED_AUTOSTART`, remote management will automatically be available when the device arrives at your location. Otherwise, you need to use the Snowball Client to manage the device.
        resources: The resources associated with the cluster job. These resources include Amazon S3 buckets and optional Lambda functions written in the Python language.
        role-arn: The `RoleARN` that you want to associate with this cluster. `RoleArn` values are created by using the [CreateRole](https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateRole.html) API action in Identity and Access Management (IAM).
        shipping-option: |-
            The shipping speed for each node in this cluster. This speed doesn't dictate how soon you'll get each Snowball Edge device, rather it represents how quickly each device moves to its destination while in transit. Regional shipping speeds are as follows:

            - In Australia, you have access to express shipping. Typically, Snow devices shipped express are delivered in about a day.
            - In the European Union (EU), you have access to express shipping. Typically, Snow devices shipped express are delivered in about a day. In addition, most countries in the EU have access to standard shipping, which typically takes less than a week, one way.
            - In India, Snow devices are delivered in one to seven days.
            - In the United States of America (US), you have access to one-day shipping and two-day shipping.

            <!--THE END-->

            - In Australia, you have access to express shipping. Typically, devices shipped express are delivered in about a day.
            - In the European Union (EU), you have access to express shipping. Typically, Snow devices shipped express are delivered in about a day. In addition, most countries in the EU have access to standard shipping, which typically takes less than a week, one way.
            - In India, Snow devices are delivered in one to seven days.
            - In the US, you have access to one-day shipping and two-day shipping.
        snowball-capacity-preference: |-
            If your job is being created in one of the US regions, you have the option of specifying what size Snow device you'd like for this job. In all other regions, Snowballs come with 80 TB in storage capacity.

            For more information, see "https://docs.aws.amazon.com/snowball/latest/snowcone-guide/snow-device-types.html" (Snow Family Devices and Capacity) in the *Snowcone User Guide* or "https://docs.aws.amazon.com/snowball/latest/developer-guide/snow-device-types.html" (Snow Family Devices and Capacity) in the *Snowcone User Guide*.
        snowball-type: |-
            The type of Snow Family devices to use for this cluster.

            For cluster jobs, Amazon Web Services Snow Family currently supports only the `EDGE` device type.

            For more information, see "https://docs.aws.amazon.com/snowball/latest/snowcone-guide/snow-device-types.html" (Snow Family Devices and Capacity) in the *Snowcone User Guide* or "https://docs.aws.amazon.com/snowball/latest/developer-guide/snow-device-types.html" (Snow Family Devices and Capacity) in the *Snowcone User Guide*.
        tax-documents: The tax documents required in your Amazon Web Services Region.
