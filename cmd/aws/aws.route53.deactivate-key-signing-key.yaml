name: deactivate-key-signing-key
description: Deactivates a key-signing key (KSK) so that it will not be used for signing by DNSSEC.
flags:
    --hosted-zone-id=!: A unique string used to identify a hosted zone.
    --name=!: A string used to identify a key-signing key (KSK).
documentation:
    command: Deactivates a key-signing key (KSK) so that it will not be used for signing by DNSSEC. This operation changes the KSK status to `INACTIVE`.
    flag:
        hosted-zone-id: A unique string used to identify a hosted zone.
        name: A string used to identify a key-signing key (KSK).
