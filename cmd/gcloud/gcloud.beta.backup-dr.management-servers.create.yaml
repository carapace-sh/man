name: create
description: '*(BETA)*  Create a new management server in the project.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location of the Management Server.
    --network=: (DEPRECATED) Name of an existing VPC network with private service access configured in the format - projects/<project>/global/networks/<network>.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: '*(BETA)*  Create a new management server in the project. A management server is required to access the management console. It can only be created in locations where Backup and DR is available. Resources in other locations can be backed up.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        location: |-
            The location of the Management Server.
            +
            To set the `location` attribute:
            * provide the argument `management_server` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        network: |-
            (DEPRECATED) Name of an existing VPC network with private service access configured in the format - projects/<project>/global/networks/<network>. This VPC network allows the management console to communicate with all backup/recovery appliances and requires a minimum IP range of /23. This value cannot be changed after you deploy the management server. If you don't have private service access, configure one. [Learn more] (https://cloud.google.com/vpc/docs/configure-private-services-access)
            +
            Flag --network is deprecated.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
