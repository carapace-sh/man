name: list-jobs
description: Retrieve a JSON array of up to twenty of your most recently created jobs.
flags:
    --max-results=: Optional.
    --next-token=: Optional.
    --order=: Optional.
    --queue=: Optional.
    --status=: Optional.
completion:
    flag:
        order:
            - ASCENDING
            - DESCENDING
        status:
            - SUBMITTED
            - PROGRESSING
            - COMPLETE
            - CANCELED
            - ERROR
documentation:
    command: Retrieve a JSON array of up to twenty of your most recently created jobs. This array includes in-process, completed, and errored jobs. This will return the jobs themselves, not just a list of the jobs. To retrieve the twenty next most recent jobs, use the nextToken string returned with the array.
    flag:
        max-results: Optional. Number of jobs, up to twenty, that will be returned at one time.
        next-token: Optional. Use this string, provided with the response to a previous request, to request the next batch of jobs.
        order: Optional. When you request lists of resources, you can specify whether they are sorted in ASCENDING or DESCENDING order. Default varies by resource.
        queue: Optional. Provide a queue name to get back only jobs from that queue.
        status: Optional. A job's status can be SUBMITTED, PROGRESSING, COMPLETE, CANCELED, or ERROR.
