name: start-dev-environment
description: Starts a specified Dev Environment and puts it into an active state.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --id=!: The system-generated unique ID of the Dev Environment.
    --ides=:
        description: Information about the integrated development environment (IDE) configured for a Dev Environment.
        nargs: -1
    --inactivity-timeout-minutes=: The amount of time the Dev Environment will run without any activity detected before stopping, in minutes.
    --instance-type=: The Amazon EC2 instace type to use for the Dev Environment.
    --project-name=!: The name of the project in the space.
    --space-name=!: The name of the space.
completion:
    flag:
        instance-type:
            - dev.standard1.small
            - dev.standard1.medium
            - dev.standard1.large
            - dev.standard1.xlarge
documentation:
    command: Starts a specified Dev Environment and puts it into an active state.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        id: The system-generated unique ID of the Dev Environment.
        ides: Information about the integrated development environment (IDE) configured for a Dev Environment.
        inactivity-timeout-minutes: The amount of time the Dev Environment will run without any activity detected before stopping, in minutes. Only whole integers are allowed. Dev Environments consume compute minutes when running.
        instance-type: The Amazon EC2 instace type to use for the Dev Environment.
        project-name: The name of the project in the space.
        space-name: The name of the space.
