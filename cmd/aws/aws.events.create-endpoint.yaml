name: create-endpoint
description: Creates a global endpoint.
flags:
    --description=: A description of the global endpoint.
    --event-buses=!: Define the event buses used.
    --name=!: The name of the global endpoint.
    --replication-config=: Enable or disable event replication.
    --role-arn=: The ARN of the role used for replication.
    --routing-config=!: Configure the routing policy, including the health check and secondary Region..
documentation:
    command: Creates a global endpoint. Global endpoints improve your application's availability by making it regional-fault tolerant. To do this, you define a primary and secondary Region with event buses in each Region. You also create a Amazon Route 53 health check that will tell EventBridge to route events to the secondary Region when an "unhealthy" state is encountered and events will be routed back to the primary Region when the health check reports a "healthy" state.
    flag:
        description: A description of the global endpoint.
        event-buses: |-
            Define the event buses used.

            The names of the event buses must be identical in each Region.
        name: The name of the global endpoint. For example, `"Name":"us-east-2-custom_bus_A-endpoint"`.
        replication-config: Enable or disable event replication. The default state is `ENABLED` which means you must supply a `RoleArn`. If you don't have a `RoleArn` or you don't want event replication enabled, set the state to `DISABLED`.
        role-arn: The ARN of the role used for replication.
        routing-config: Configure the routing policy, including the health check and secondary Region..
