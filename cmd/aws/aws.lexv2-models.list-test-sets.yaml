name: list-test-sets
description: The list of the test sets
flags:
    --max-results=: The maximum number of test sets to return in each page.
    --next-token=: If the response from the ListTestSets operation contains more results than specified in the maxResults parameter, a token is returned in the response.
    --sort-by=: The sort order for the list of test sets.
documentation:
    command: The list of the test sets
    flag:
        max-results: The maximum number of test sets to return in each page. If there are fewer results than the max page size, only the actual number of results are returned.
        next-token: If the response from the ListTestSets operation contains more results than specified in the maxResults parameter, a token is returned in the response. Use that token in the nextToken parameter to return the next page of results.
        sort-by: The sort order for the list of test sets.
