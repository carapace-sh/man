name: describe-database
description: Returns information about the database, including the database name, time that the database was created, and the total number of tables found within the database.
flags:
    --database-name=!: The name of the Timestream database.
documentation:
    command: Returns information about the database, including the database name, time that the database was created, and the total number of tables found within the database. [Service quotas apply](https://docs.aws.amazon.com/timestream/latest/developerguide/ts-limits.html). See [code sample](https://docs.aws.amazon.com/timestream/latest/developerguide/code-samples.describe-db.html) for details.
    flag:
        database-name: The name of the Timestream database.
