name: delete-trial
description: Deletes the specified trial.
flags:
    --trial-name=!: The name of the trial to delete.
documentation:
    command: Deletes the specified trial. All trial components that make up the trial must be deleted first. Use the [DescribeTrialComponent](https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_DescribeTrialComponent.html) API to get the list of trial components.
    flag:
        trial-name: The name of the trial to delete.
