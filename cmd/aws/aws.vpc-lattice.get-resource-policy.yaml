name: get-resource-policy
description: Retrieves information about the specified resource policy.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the service network or service.
documentation:
    command: Retrieves information about the specified resource policy. The resource policy is an IAM policy created on behalf of the resource owner when they share a resource.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the service network or service.
