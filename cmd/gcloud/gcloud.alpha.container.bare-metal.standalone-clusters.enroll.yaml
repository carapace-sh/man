name: enroll
description: '*(ALPHA)*  Enroll an Anthos on bare metal standalone cluster.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Google Cloud location for the standalone_cluster.
    --membership-location=: Google Cloud location for the membership.
    --membership-project=: Google Cloud project for the membership.
    --membership=!: ID of the membership or fully qualified identifier for the membership.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: '*(ALPHA)*  Enroll an Anthos on bare metal standalone cluster.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            Google Cloud location for the standalone_cluster.
            +
            To set the `location` attribute:
            * provide the argument `standalone_cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_bare_metal/location`.
        membership: |-
            ID of the membership or fully qualified identifier for the membership.
            +
            To set the `membership` attribute:
            * provide the argument `--membership` on the command line.
        membership-location: |-
            Google Cloud location for the membership.
            +
            To set the `location` attribute:
            * provide the argument `--membership` on the command line with a fully specified name;
            * provide the argument `--membership-location` on the command line.
        membership-project: |-
            Google Cloud project for the membership.
            +
            To set the `project` attribute:
            * provide the argument `--membership` on the command line with a fully specified name;
            * provide the argument `--membership-project` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
