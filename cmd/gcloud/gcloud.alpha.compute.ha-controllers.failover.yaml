name: failover
description: '*(ALPHA)*  Initiate the failover of the virtual machine (VM) instance to a designated failover zone.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --failover-to-zone=!: The destination zone for the failover.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: The name of the Google Compute Engine region where the HA Controller exists.
documentation:
    command: '*(ALPHA)*  Initiate the failover of the VM to a designated zone by using a High Availability (HA) Controller. Regional disks attached to the other preconfigured zone are included in this failover.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        failover-to-zone: The destination zone for the failover. This must be the pre-configured secondary zone for the HA Controller.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            The name of the Google Compute Engine region where the HA Controller exists.
            +
            Overrides the default compute/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `ha_controller` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `compute/region`.
