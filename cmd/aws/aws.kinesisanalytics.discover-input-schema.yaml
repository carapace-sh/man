name: discover-input-schema
description: This documentation is for version 1 of the Amazon Kinesis Data Analytics API, which only supports SQL applications.
flags:
    --input-processing-configuration=: The [InputProcessingConfiguration](https://docs.aws.amazon.com/kinesisanalytics/latest/dev/API_InputProcessingConfiguration.html) to use to preprocess the records before discovering the schema of the records.
    --input-starting-position-configuration=: Point at which you want Amazon Kinesis Analytics to start reading records from the specified streaming source discovery purposes.
    --resource-arn=: Amazon Resource Name (ARN) of the streaming source.
    --role-arn=: ARN of the IAM role that Amazon Kinesis Analytics can assume to access the stream on your behalf.
    --s3-configuration=: Specify this parameter to discover a schema from data in an Amazon S3 object.
documentation:
    command: |-
        This documentation is for version 1 of the Amazon Kinesis Data Analytics API, which only supports SQL applications. Version 2 of the API supports SQL and Java applications. For more information about version 2, see [Amazon Kinesis Data Analytics API V2 Documentation](/kinesisanalytics/latest/apiv2/Welcome.html).

        Infers a schema by evaluating sample records on the specified streaming source (Amazon Kinesis stream or Amazon Kinesis Firehose delivery stream) or S3 object. In the response, the operation returns the inferred schema and also the sample records that the operation used to infer the schema.

        You can use the inferred schema when configuring a streaming source for your application. For conceptual information, see [Configuring Application Input](https://docs.aws.amazon.com/kinesisanalytics/latest/dev/how-it-works-input.html). Note that when you create an application using the Amazon Kinesis Analytics console, the console uses this operation to infer a schema and show it in the console user interface.

        This operation requires permissions to perform the `kinesisanalytics:DiscoverInputSchema` action.
    flag:
        input-processing-configuration: The [InputProcessingConfiguration](https://docs.aws.amazon.com/kinesisanalytics/latest/dev/API_InputProcessingConfiguration.html) to use to preprocess the records before discovering the schema of the records.
        input-starting-position-configuration: Point at which you want Amazon Kinesis Analytics to start reading records from the specified streaming source discovery purposes.
        resource-arn: Amazon Resource Name (ARN) of the streaming source.
        role-arn: ARN of the IAM role that Amazon Kinesis Analytics can assume to access the stream on your behalf.
        s3-configuration: Specify this parameter to discover a schema from data in an Amazon S3 object.
