name: ssh
description: '*(BETA)*  SSH into the VM of an App Engine Flexible instance.'
flags:
    --container=: Name of the container within the VM to connect to.
    --no-tunnel-through-iap&: Tunnel the ssh connection through Identity-Aware Proxy for TCP forwarding.
    --service=: The service ID.
    --tunnel-through-iap: Tunnel the ssh connection through Identity-Aware Proxy for TCP forwarding.
documentation:
    command: |-
        *(BETA)*  *gcloud beta app instances ssh* lets you remotely log in to your running App Engine Flexible
        instances under two conditions:
        * The instance is running.
        * The instance has an external IP address. To check from the Cloud
        Console, go to the Instances page and confirm that there is an IP
        address listed in the VM IP column. To check from your app.yaml, open
        your app.yaml and look at the network settings. The *instance_ip_mode*
        field must be either not listed or set to ``external''.

        *gcloud beta app instances ssh* resolves the instance's IP address and pre-populates the
        VM with a public key managed by gcloud. If the gcloud managed key pair
        does not exist, it is generated the first time an SSH command is run,
        which may prompt you for a passphrase for the private key encryption.

        All SSH commands require the OpenSSH client suite to be installed on
        Linux and Mac OS X. On Windows, the Google Cloud CLI comes with a bundled
        PuTTY suite instead, so it has no external dependencies.
    flag:
        container: Name of the container within the VM to connect to.
        no-tunnel-through-iap: |
            Tunnel the ssh connection through Identity-Aware Proxy for TCP forwarding.

            To learn more, see the
            [IAP for TCP forwarding documentation](https://cloud.google.com/iap/docs/tcp-forwarding-overview).
        service: The service ID.
        tunnel-through-iap: |-
            Tunnel the ssh connection through Identity-Aware Proxy for TCP forwarding.
            +
            To learn more, see the
            [IAP for TCP forwarding documentation](https://cloud.google.com/iap/docs/tcp-forwarding-overview).
