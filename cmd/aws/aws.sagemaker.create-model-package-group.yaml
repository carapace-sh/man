name: create-model-package-group
description: Creates a model group.
flags:
    --model-package-group-description=: A description for the model group.
    --model-package-group-name=!: The name of the model group.
    --tags=: A list of key value pairs associated with the model group.
documentation:
    command: Creates a model group. A model group contains a group of model versions.
    flag:
        model-package-group-description: A description for the model group.
        model-package-group-name: The name of the model group.
        tags: A list of key value pairs associated with the model group. For more information, see [Tagging Amazon Web Services resources](https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html) in the *Amazon Web Services General Reference Guide*.
