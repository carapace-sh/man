name: set-security-policy
description: '*(ALPHA)*  *(DEPRECATED)*  Set the security policy for a backend service.'
flags:
    --global: If set, the backend service is global.
    --no-global&: If set, the backend service is global.
    --region=: Region of the backend service to operate on.
    --security-policy=!: The security policy that will be set for this backend service.
documentation:
    command: "\n\n*(ALPHA)*  *(DEPRECATED)*  This command is deprecated and will not be promoted to beta. Please use \"gcloud beta backend-services update\" instead.\n\n\n*gcloud alpha compute backend-services set-security-policy* is used to set the security policy for a backend service.\nSetting an empty string will clear the existing security policy.  "
    flag:
        global: If set, the backend service is global.
        no-global: If set, the backend service is global.
        region: Region of the backend service to operate on. Overrides the default *compute/region* property value for this command invocation.
        security-policy: The security policy that will be set for this backend service.
