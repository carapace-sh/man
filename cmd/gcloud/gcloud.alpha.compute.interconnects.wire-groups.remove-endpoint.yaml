name: remove-endpoint
description: '*(ALPHA)*  Remove endpoint from a Compute Engine wire group.'
flags:
    --cross-site-network=!: Name of the crossSiteNetwork to operate on.
    --endpoint-label=!: The endpoint label for the wire group.
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute interconnects wire-groups remove-endpoint* is used to remove endpoints from a wire group.

        For an example, refer to the *EXAMPLES* section below.
    flag:
        cross-site-network: Name of the crossSiteNetwork to operate on.
        endpoint-label: The endpoint label for the wire group.
