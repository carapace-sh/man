name: create-fleet
description: Creates a fleet that represents a group of vehicles.
flags:
    --description=: A brief description of the fleet to create.
    --fleet-id=!: The unique ID of the fleet to create.
    --signal-catalog-arn=!: The Amazon Resource Name (ARN) of a signal catalog.
    --tags=: Metadata that can be used to manage the fleet.
documentation:
    command: |-
        Creates a fleet that represents a group of vehicles.

        You must create both a signal catalog and vehicles before you can create a fleet.

        For more information, see [Fleets](https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/fleets.html) in the *Amazon Web Services IoT FleetWise Developer Guide*.
    flag:
        description: A brief description of the fleet to create.
        fleet-id: The unique ID of the fleet to create.
        signal-catalog-arn: The Amazon Resource Name (ARN) of a signal catalog.
        tags: Metadata that can be used to manage the fleet.
