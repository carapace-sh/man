name: list-gi-versions
description: Returns information about Oracle Grid Infrastructure (GI) software versions that are available for a VM cluster for the specified shape.
flags:
    --max-results=: The maximum number of items to return for this request.
    --next-token=: The token returned from a previous paginated request.
    --shape=: The shape to return GI versions for.
documentation:
    command: Returns information about Oracle Grid Infrastructure (GI) software versions that are available for a VM cluster for the specified shape.
    flag:
        max-results: |-
            The maximum number of items to return for this request. To get the next page of items, make another request with the token returned in the output.

            Default: `10`
        next-token: The token returned from a previous paginated request. Pagination continues from the end of the items returned by the previous request.
        shape: The shape to return GI versions for. For a list of valid shapes, use the `ListDbSystemShapes` operation..
