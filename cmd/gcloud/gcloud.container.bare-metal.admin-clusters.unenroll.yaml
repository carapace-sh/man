name: unenroll
description: Unenroll an Anthos on bare metal admin cluster so that it is no longer managed by the Anthos On-Prem API.
flags:
    --allow-missing: If set, and the Bare Metal cluster is not found, the request will succeed but no action will be taken.
    --async: Return immediately, without waiting for the operation in progress to
    --ignore-errors: If set, the unenrollment of a bare metal admin cluster resource will succeed even if errors occur during unenrollment.
    --location=: Google Cloud location for the admin_cluster.
    --no-allow-missing&: If set, and the Bare Metal cluster is not found, the request will succeed but no action will be taken.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-ignore-errors&: If set, the unenrollment of a bare metal admin cluster resource will succeed even if errors occur during unenrollment.
    --no-validate-only&: If set, only validate the request, but do not actually perform the operation.
    --validate-only: If set, only validate the request, but do not actually perform the operation.
documentation:
    command: Unenroll an Anthos on bare metal admin cluster so that it is no longer managed by the Anthos On-Prem API.
    flag:
        allow-missing: If set, and the Bare Metal cluster is not found, the request will succeed but no action will be taken.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        ignore-errors: If set, the unenrollment of a bare metal admin cluster resource will succeed even if errors occur during unenrollment.
        location: |-
            Google Cloud location for the admin_cluster.
            +
            To set the `location` attribute:
            * provide the argument `admin_cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_bare_metal/location`.
        no-allow-missing: If set, and the Bare Metal cluster is not found, the request will succeed but no action will be taken.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-ignore-errors: If set, the unenrollment of a bare metal admin cluster resource will succeed even if errors occur during unenrollment.
        no-validate-only: If set, only validate the request, but do not actually perform the operation.
        validate-only: If set, only validate the request, but do not actually perform the operation.
