name: create-geofence-collection
description: Creates a geofence collection, which manages and stores geofences.
flags:
    --collection-name=!: A custom name for the geofence collection.
    --description=: An optional description for the geofence collection.
    --kms-key-id=: A key identifier for an [Amazon Web Services KMS customer managed key](https://docs.aws.amazon.com/kms/latest/developerguide/create-keys.html).
    --pricing-plan-data-source=: This parameter is no longer used.
    --pricing-plan=: No longer used.
    --tags=: Applies one or more tags to the geofence collection.
completion:
    flag:
        pricing-plan:
            - RequestBasedUsage
            - MobileAssetTracking
            - MobileAssetManagement
documentation:
    command: Creates a geofence collection, which manages and stores geofences.
    flag:
        collection-name: |-
            A custom name for the geofence collection.

            Requirements:

            - Contain only alphanumeric characters (A–Z, a–z, 0–9), hyphens (-), periods (.), and underscores (\_).
            - Must be a unique geofence collection name.
            - No spaces allowed. For example, `ExampleGeofenceCollection`.
        description: An optional description for the geofence collection.
        kms-key-id: A key identifier for an [Amazon Web Services KMS customer managed key](https://docs.aws.amazon.com/kms/latest/developerguide/create-keys.html). Enter a key ID, key ARN, alias name, or alias ARN.
        pricing-plan: No longer used. If included, the only allowed value is `RequestBasedUsage`.
        pricing-plan-data-source: This parameter is no longer used.
        tags: |-
            Applies one or more tags to the geofence collection. A tag is a key-value pair helps manage, identify, search, and filter your resources by labelling them.

            Format: `"key" : "value"`

            Restrictions:

            - Maximum 50 tags per resource
            - Each resource tag must be unique with a maximum of one value.
            - Maximum key length: 128 Unicode characters in UTF-8
            - Maximum value length: 256 Unicode characters in UTF-8
            - Can use alphanumeric characters (A–Z, a–z, 0–9), and the following characters: + - = . _ : / @.
            - Cannot use "aws:" as a prefix for a key.
