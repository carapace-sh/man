name: update-trail
description: Updates trail settings that control what events you are logging, and how to handle log files.
flags:
    --cloud-watch-logs-log-group-arn=: Specifies a log group name using an Amazon Resource Name (ARN), a unique identifier that represents the log group to which CloudTrail logs are delivered.
    --cloud-watch-logs-role-arn=: Specifies the role for the CloudWatch Logs endpoint to assume to write to a user's log group.
    --enable-log-file-validation: Specifies whether log file validation is enabled.
    --include-global-service-events: Specifies whether the trail is publishing events from global services such as IAM to the log files.
    --is-multi-region-trail: Specifies whether the trail applies only to the current Region or to all Regions.
    --is-organization-trail: Specifies whether the trail is applied to all accounts in an organization in Organizations, or only for the current Amazon Web Services account.
    --kms-key-id=: Specifies the KMS key ID to use to encrypt the logs delivered by CloudTrail.
    --name=!: Specifies the name of the trail or trail ARN.
    --no-enable-log-file-validation&: Specifies whether log file validation is enabled.
    --no-include-global-service-events&: Specifies whether the trail is publishing events from global services such as IAM to the log files.
    --no-is-multi-region-trail&: Specifies whether the trail applies only to the current Region or to all Regions.
    --no-is-organization-trail&: Specifies whether the trail is applied to all accounts in an organization in Organizations, or only for the current Amazon Web Services account.
    --s3-bucket-name=: Specifies the name of the Amazon S3 bucket designated for publishing log files.
    --s3-key-prefix=: Specifies the Amazon S3 key prefix that comes after the name of the bucket you have designated for log file delivery.
    --sns-topic-name=: Specifies the name or ARN of the Amazon SNS topic defined for notification of log file delivery.
documentation:
    command: Updates trail settings that control what events you are logging, and how to handle log files. Changes to a trail do not require stopping the CloudTrail service. Use this action to designate an existing bucket for log delivery. If the existing bucket has previously been a target for CloudTrail log files, an IAM policy exists for the bucket. `UpdateTrail` must be called from the Region in which the trail was created; otherwise, an `InvalidHomeRegionException` is thrown.
    flag:
        cloud-watch-logs-log-group-arn: |-
            Specifies a log group name using an Amazon Resource Name (ARN), a unique identifier that represents the log group to which CloudTrail logs are delivered. You must use a log group that exists in your account.

            Not required unless you specify `CloudWatchLogsRoleArn`.
        cloud-watch-logs-role-arn: Specifies the role for the CloudWatch Logs endpoint to assume to write to a user's log group. You must use a role that exists in your account.
        enable-log-file-validation: |-
            Specifies whether log file validation is enabled. The default is false.

            When you disable log file integrity validation, the chain of digest files is broken after one hour. CloudTrail does not create digest files for log files that were delivered during a period in which log file integrity validation was disabled. For example, if you enable log file integrity validation at noon on January 1, disable it at noon on January 2, and re-enable it at noon on January 10, digest files will not be created for the log files delivered from noon on January 2 to noon on January 10. The same applies whenever you stop CloudTrail logging or delete a trail.
        include-global-service-events: Specifies whether the trail is publishing events from global services such as IAM to the log files.
        is-multi-region-trail: Specifies whether the trail applies only to the current Region or to all Regions. The default is false. If the trail exists only in the current Region and this value is set to true, shadow trails (replications of the trail) will be created in the other Regions. If the trail exists in all Regions and this value is set to false, the trail will remain in the Region where it was created, and its shadow trails in other Regions will be deleted. As a best practice, consider using trails that log events in all Regions.
        is-organization-trail: |-
            Specifies whether the trail is applied to all accounts in an organization in Organizations, or only for the current Amazon Web Services account. The default is false, and cannot be true unless the call is made on behalf of an Amazon Web Services account that is the management account for an organization in Organizations. If the trail is not an organization trail and this is set to `true`, the trail will be created in all Amazon Web Services accounts that belong to the organization. If the trail is an organization trail and this is set to `false`, the trail will remain in the current Amazon Web Services account but be deleted from all member accounts in the organization.

            Only the management account for the organization can convert an organization trail to a non-organization trail, or convert a non-organization trail to an organization trail.
        kms-key-id: |-
            Specifies the KMS key ID to use to encrypt the logs delivered by CloudTrail. The value can be an alias name prefixed by "alias/", a fully specified ARN to an alias, a fully specified ARN to a key, or a globally unique identifier.

            CloudTrail also supports KMS multi-Region keys. For more information about multi-Region keys, see [Using multi-Region keys](https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-overview.html) in the *Key Management Service Developer Guide*.

            Examples:

            - alias/MyAliasName
            - arn:aws:kms:us-east-2:123456789012:alias/MyAliasName
            - arn:aws:kms:us-east-2:123456789012:key/12345678-1234-1234-1234-123456789012
            - 12345678-1234-1234-1234-123456789012
        name: |-
            Specifies the name of the trail or trail ARN. If `Name` is a trail name, the string must meet the following requirements:

            - Contain only ASCII letters (a-z, A-Z), numbers (0-9), periods (.), underscores (\_), or dashes (-)
            - Start with a letter or number, and end with a letter or number
            - Be between 3 and 128 characters
            - Have no adjacent periods, underscores or dashes. Names like `my-_namespace` and `my--namespace` are not valid.
            - Not be in IP address format (for example, 192.168.5.4)

            If `Name` is a trail ARN, it must be in the following format.

            `arn:aws:cloudtrail:us-east-2:123456789012:trail/MyTrail`
        s3-bucket-name: Specifies the name of the Amazon S3 bucket designated for publishing log files. See [Amazon S3 Bucket naming rules](https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucketnamingrules.html).
        s3-key-prefix: Specifies the Amazon S3 key prefix that comes after the name of the bucket you have designated for log file delivery. For more information, see [Finding Your CloudTrail Log Files](https://docs.aws.amazon.com/awscloudtrail/latest/userguide/get-and-view-cloudtrail-log-files.html#cloudtrail-find-log-files). The maximum length is 200 characters.
        sns-topic-name: Specifies the name or ARN of the Amazon SNS topic defined for notification of log file delivery. The maximum length is 256 characters.
