name: stop
description: '*(ALPHA)*  Cancel a running experiment.'
hidden: true
flags:
    --location=: The location id of the experiment resource.
documentation:
    command: |
        *(ALPHA)*  Cancel a running experiment.
    flag:
        location: |-
            The location id of the experiment resource.
            +
            To set the `location` attribute:
            * provide the argument `experiment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
