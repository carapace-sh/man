name: cancel-harvest-job
description: Cancels an in-progress harvest job.
flags:
    --channel-group-name=!: The name of the channel group containing the channel from which the harvest job is running.
    --channel-name=!: The name of the channel from which the harvest job is running.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --e-tag=: The current Entity Tag (ETag) associated with the harvest job.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --harvest-job-name=!: The name of the harvest job to cancel.
    --origin-endpoint-name=!: The name of the origin endpoint that the harvest job is harvesting from.
documentation:
    command: Cancels an in-progress harvest job.
    flag:
        channel-group-name: The name of the channel group containing the channel from which the harvest job is running.
        channel-name: The name of the channel from which the harvest job is running.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        e-tag: The current Entity Tag (ETag) associated with the harvest job. Used for concurrency control.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        harvest-job-name: The name of the harvest job to cancel. This name must be unique within the channel and cannot be changed after the harvest job is submitted.
        origin-endpoint-name: The name of the origin endpoint that the harvest job is harvesting from. This cannot be changed after the harvest job is submitted.
