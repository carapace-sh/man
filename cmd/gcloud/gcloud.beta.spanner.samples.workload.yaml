name: workload
description: '*(BETA)*  Generate gRPC traffic for a given sample app''s backend service.'
flags:
    --duration=: Duration of time allowed to run before stopping the workload.
    --port=: Port of the running backend service.
    --target-qps=: Target requests per second.
documentation:
    command: |-
        *(BETA)*  Before sending traffic to the backend service, create the database and
        start the service with:

            $ gcloud beta spanner samples init APPNAME --instance-id=INSTANCE_ID
            $ gcloud beta spanner samples backend APPNAME --instance-id=INSTANCE_ID

        To run all three steps together, use:

            $ gcloud beta spanner samples run APPNAME --instance-id=INSTANCE_ID
    flag:
        duration: Duration of time allowed to run before stopping the workload.
        port: Port of the running backend service.
        target-qps: Target requests per second.
