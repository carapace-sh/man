name: list-model-quality-job-definitions
description: Gets a list of model quality monitoring job definitions in your account.
flags:
    --creation-time-after=: A filter that returns only model quality monitoring job definitions created after the specified time.
    --creation-time-before=: A filter that returns only model quality monitoring job definitions created before the specified time.
    --endpoint-name=: A filter that returns only model quality monitoring job definitions that are associated with the specified endpoint.
    --max-results=: The maximum number of results to return in a call to `ListModelQualityJobDefinitions`.
    --name-contains=: A string in the transform job name.
    --next-token=: If the result of the previous `ListModelQualityJobDefinitions` request was truncated, the response includes a `NextToken`.
    --sort-by=: The field to sort results by.
    --sort-order=: Whether to sort the results in `Ascending` or `Descending` order.
completion:
    flag:
        sort-by:
            - Name
            - CreationTime
        sort-order:
            - Ascending
            - Descending
documentation:
    command: Gets a list of model quality monitoring job definitions in your account.
    flag:
        creation-time-after: A filter that returns only model quality monitoring job definitions created after the specified time.
        creation-time-before: A filter that returns only model quality monitoring job definitions created before the specified time.
        endpoint-name: A filter that returns only model quality monitoring job definitions that are associated with the specified endpoint.
        max-results: The maximum number of results to return in a call to `ListModelQualityJobDefinitions`.
        name-contains: A string in the transform job name. This filter returns only model quality monitoring job definitions whose name contains the specified string.
        next-token: If the result of the previous `ListModelQualityJobDefinitions` request was truncated, the response includes a `NextToken`. To retrieve the next set of model quality monitoring job definitions, use the token in the next request.
        sort-by: The field to sort results by. The default is `CreationTime`.
        sort-order: Whether to sort the results in `Ascending` or `Descending` order. The default is `Descending`.
