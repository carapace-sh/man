name: deregister-devices
description: Deregisters the specified devices.
flags:
    --device-fleet-name=!: The name of the fleet the devices belong to.
    --device-names=!: The unique IDs of the devices.
documentation:
    command: Deregisters the specified devices. After you deregister a device, you will need to re-register the devices.
    flag:
        device-fleet-name: The name of the fleet the devices belong to.
        device-names: The unique IDs of the devices.
