name: untag-resource
description: You can delete tags for an Amazon Web Services Supply chain resource such as instance, data flow, or dataset in AWS Supply Chain.
flags:
    --resource-arn=!: The Amazon Web Services Supply chain resource ARN that needs to be untagged.
    --tag-keys=!: The list of tag keys to be deleted for an Amazon Web Services Supply Chain resource.
documentation:
    command: You can delete tags for an Amazon Web Services Supply chain resource such as instance, data flow, or dataset in AWS Supply Chain. During the data ingestion process, you can delete tags such as dev, test, or prod to data flows created during the data ingestion process in the AWS Supply Chain datasets.
    flag:
        resource-arn: The Amazon Web Services Supply chain resource ARN that needs to be untagged.
        tag-keys: The list of tag keys to be deleted for an Amazon Web Services Supply Chain resource.
