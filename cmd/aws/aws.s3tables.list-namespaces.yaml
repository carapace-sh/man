name: list-namespaces
description: Lists the namespaces within a table bucket.
flags:
    --continuation-token=: '`ContinuationToken` indicates to Amazon S3 that the list is being continued on this bucket with a token.'
    --max-namespaces=: The maximum number of namespaces to return in the list.
    --prefix=: The prefix of the namespaces.
    --table-bucket-arn=!: The Amazon Resource Name (ARN) of the table bucket.
documentation:
    command: |-
        Lists the namespaces within a table bucket. For more information, see [Table namespaces](https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-tables-namespace.html) in the *Amazon Simple Storage Service User Guide*.

        Permissions

        You must have the `s3tables:ListNamespaces` permission to use this operation.
    flag:
        continuation-token: '`ContinuationToken` indicates to Amazon S3 that the list is being continued on this bucket with a token. `ContinuationToken` is obfuscated and is not a real key. You can use this `ContinuationToken` for pagination of the list results.'
        max-namespaces: The maximum number of namespaces to return in the list.
        prefix: The prefix of the namespaces.
        table-bucket-arn: The Amazon Resource Name (ARN) of the table bucket.
