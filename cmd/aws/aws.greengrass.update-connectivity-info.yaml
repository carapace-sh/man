name: update-connectivity-info
description: Updates the connectivity information for the core.
flags:
    --connectivity-info=: A list of connectivity info.
    --thing-name=!: The thing name.
documentation:
    command: Updates the connectivity information for the core. Any devices that belong to the group which has this core will receive this information in order to find the location of the core and connect to it.
    flag:
        connectivity-info: A list of connectivity info.
        thing-name: The thing name.
