documentation:
    command: |
        *(ALPHA)*  Update a workforce pool installed app.
    flag:
        description: A description for the workforce pool installed app. Cannot exceed 256 characters in length.
        display-name: A display name for the workforce pool installed app. Cannot exceed 32 characters in length.
        location: |-
            The location for the workforce pool.
            +
            To set the `location` attribute:
            * provide the argument `installed_app` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        workforce-pool: |-
            The ID to use for the workforce pool, which becomes the final component of the
            resource name. This value must be a globally unique string of 6 to 63 lowercase letters,
            digits, or hyphens. It must start with a letter, and cannot have a trailing hyphen.
            The prefix `gcp-` is reserved for use by Google, and may not be specified.
            +

            To set the `workforce-pool` attribute:
            * provide the argument `installed_app` on the command line with a fully specified name;
            * provide the argument `--workforce-pool` on the command line.
