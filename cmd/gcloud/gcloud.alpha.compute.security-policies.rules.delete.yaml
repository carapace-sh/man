name: delete
description: '*(ALPHA)*  Delete Compute Engine security policy rules.'
flags:
    --region=: Region of the security policy to delete.
    --security-policy=: The security policy that this rule belongs to.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute security-policies rules delete* is used to delete security policy rules.

        ## EXAMPLES

        To delete the rule at priority 1000, run:

          $ gcloud alpha compute security-policies rules delete 1000 \
             --security-policy=my-policy
    flag:
        region: |-
            Region of the security policy to delete. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            Overrides the default *compute/region* property value for this command invocation.
        security-policy: The security policy that this rule belongs to.
