name: describe-game-server
description: |-
    **This API works with the following fleet types:** EC2 (FleetIQ)

    Retrieves information for a registered game server.
flags:
    --game-server-group-name=!: A unique identifier for the game server group where the game server is running.
    --game-server-id=!: A custom string that uniquely identifies the game server information to be retrieved.
documentation:
    command: |-
        **This API works with the following fleet types:** EC2 (FleetIQ)

        Retrieves information for a registered game server. Information includes game server status, health check info, and the instance that the game server is running on.

        To retrieve game server information, specify the game server ID. If successful, the requested game server object is returned.

        **Learn more**

        [Amazon GameLift Servers FleetIQ Guide](https://docs.aws.amazon.com/gamelift/latest/fleetiqguide/gsg-intro.html)
    flag:
        game-server-group-name: A unique identifier for the game server group where the game server is running.
        game-server-id: A custom string that uniquely identifies the game server information to be retrieved.
