name: create-app
description: Creates a new Amplify app.
flags:
    --access-token=: The personal access token for a GitHub repository for an Amplify app.
    --auto-branch-creation-config=: The automated branch creation configuration for an Amplify app.
    --auto-branch-creation-patterns=: The automated branch creation glob patterns for an Amplify app.
    --basic-auth-credentials=: The credentials for basic authorization for an Amplify app.
    --build-spec=: The build specification (build spec) for an Amplify app.
    --cache-config=: The cache configuration for the Amplify app.
    --compute-role-arn=: The Amazon Resource Name (ARN) of the IAM role to assign to an SSR app.
    --custom-headers=: The custom HTTP headers for an Amplify app.
    --custom-rules=: The custom rewrite and redirect rules for an Amplify app.
    --description=: The description of the Amplify app.
    --enable-auto-branch-creation=: Enables automated branch creation for an Amplify app.
    --enable-basic-auth=: Enables basic authorization for an Amplify app.
    --enable-branch-auto-build=: Enables the auto building of branches for an Amplify app.
    --enable-branch-auto-deletion=: Automatically disconnects a branch in the Amplify console when you delete a branch from your Git repository.
    --environment-variables=: The environment variables map for an Amplify app.
    --iam-service-role-arn=: The Amazon Resource Name (ARN) of the IAM service role for the Amplify app.
    --job-config=: Describes the configuration details that apply to the jobs for an Amplify app.
    --name=!: The name of the Amplify app.
    --oauth-token=: The OAuth token for a third-party source control system for an Amplify app.
    --platform=: The platform for the Amplify app.
    --repository=: The Git repository for the Amplify app.
    --tags=: The tag for an Amplify app.
completion:
    flag:
        platform:
            - WEB
            - WEB_DYNAMIC
            - WEB_COMPUTE
documentation:
    command: Creates a new Amplify app.
    flag:
        access-token: |-
            The personal access token for a GitHub repository for an Amplify app. The personal access token is used to authorize access to a GitHub repository using the Amplify GitHub App. The token is not stored.

            Use `accessToken` for GitHub repositories only. To authorize access to a repository provider such as Bitbucket or CodeCommit, use `oauthToken`.

            You must specify either `accessToken` or `oauthToken` when you create a new app.

            Existing Amplify apps deployed from a GitHub repository using OAuth continue to work with CI/CD. However, we strongly recommend that you migrate these apps to use the GitHub App. For more information, see [Migrating an existing OAuth app to the Amplify GitHub App](https://docs.aws.amazon.com/amplify/latest/userguide/setting-up-GitHub-access.html#migrating-to-github-app-auth) in the *Amplify User Guide* .
        auto-branch-creation-config: The automated branch creation configuration for an Amplify app.
        auto-branch-creation-patterns: The automated branch creation glob patterns for an Amplify app.
        basic-auth-credentials: The credentials for basic authorization for an Amplify app. You must base64-encode the authorization credentials and provide them in the format `user:password`.
        build-spec: The build specification (build spec) for an Amplify app.
        cache-config: The cache configuration for the Amplify app.
        compute-role-arn: The Amazon Resource Name (ARN) of the IAM role to assign to an SSR app. The SSR Compute role allows the Amplify Hosting compute service to securely access specific Amazon Web Services resources based on the role's permissions. For more information about the SSR Compute role, see [Adding an SSR Compute role](https://docs.aws.amazon.com/amplify/latest/userguide/amplify-SSR-compute-role.html) in the *Amplify User Guide*.
        custom-headers: The custom HTTP headers for an Amplify app.
        custom-rules: The custom rewrite and redirect rules for an Amplify app.
        description: The description of the Amplify app.
        enable-auto-branch-creation: Enables automated branch creation for an Amplify app.
        enable-basic-auth: Enables basic authorization for an Amplify app. This will apply to all branches that are part of this app.
        enable-branch-auto-build: Enables the auto building of branches for an Amplify app.
        enable-branch-auto-deletion: Automatically disconnects a branch in the Amplify console when you delete a branch from your Git repository.
        environment-variables: |-
            The environment variables map for an Amplify app.

            For a list of the environment variables that are accessible to Amplify by default, see [Amplify Environment variables](https://docs.aws.amazon.com/amplify/latest/userguide/amplify-console-environment-variables.html) in the *Amplify Hosting User Guide*.
        iam-service-role-arn: The Amazon Resource Name (ARN) of the IAM service role for the Amplify app.
        job-config: Describes the configuration details that apply to the jobs for an Amplify app.
        name: The name of the Amplify app.
        oauth-token: |-
            The OAuth token for a third-party source control system for an Amplify app. The OAuth token is used to create a webhook and a read-only deploy key using SSH cloning. The OAuth token is not stored.

            Use `oauthToken` for repository providers other than GitHub, such as Bitbucket or CodeCommit. To authorize access to GitHub as your repository provider, use `accessToken`.

            You must specify either `oauthToken` or `accessToken` when you create a new app.

            Existing Amplify apps deployed from a GitHub repository using OAuth continue to work with CI/CD. However, we strongly recommend that you migrate these apps to use the GitHub App. For more information, see [Migrating an existing OAuth app to the Amplify GitHub App](https://docs.aws.amazon.com/amplify/latest/userguide/setting-up-GitHub-access.html#migrating-to-github-app-auth) in the *Amplify User Guide* .
        platform: |-
            The platform for the Amplify app. For a static app, set the platform type to `WEB`. For a dynamic server-side rendered (SSR) app, set the platform type to `WEB_COMPUTE`. For an app requiring Amplify Hosting's original SSR support only, set the platform type to `WEB_DYNAMIC`.

            If you are deploying an SSG only app with Next.js version 14 or later, you must set the platform type to `WEB_COMPUTE` and set the artifacts `baseDirectory` to `.next` in the application's build settings. For an example of the build specification settings, see [Amplify build settings for a Next.js 14 SSG application](https://docs.aws.amazon.com/amplify/latest/userguide/deploy-nextjs-app.html#build-setting-detection-ssg-14) in the *Amplify Hosting User Guide*.
        repository: The Git repository for the Amplify app.
        tags: The tag for an Amplify app.
