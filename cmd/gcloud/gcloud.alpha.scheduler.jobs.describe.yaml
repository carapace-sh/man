name: describe
description: '*(ALPHA)*  Show details about a job.'
flags:
    --location=: The location of the job.
documentation:
    command: '*(ALPHA)*  Show details about a job.'
    flag:
        location: |-
            The location of the job. By default, uses the location of the current project's App Engine app
            if there is an associated app.
            +

            To set the `location` attribute:
            * provide the argument `job` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * defaults to App Engine's app location if not provided & an app exists.
