name: describe-publishing-destination
description: Returns information about the publishing destination specified by the provided `destinationId`.
flags:
    --destination-id=!: The ID of the publishing destination to retrieve.
    --detector-id=!: The unique ID of the detector associated with the publishing destination to retrieve.
documentation:
    command: Returns information about the publishing destination specified by the provided `destinationId`.
    flag:
        destination-id: The ID of the publishing destination to retrieve.
        detector-id: |-
            The unique ID of the detector associated with the publishing destination to retrieve.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
