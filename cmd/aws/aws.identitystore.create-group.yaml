name: create-group
description: Creates a group within the specified identity store.
flags:
    --description=: A string containing the description of the group.
    --display-name=: A string containing the name of the group.
    --identity-store-id=!: The globally unique identifier for the identity store.
documentation:
    command: Creates a group within the specified identity store.
    flag:
        description: A string containing the description of the group.
        display-name: A string containing the name of the group. This value is commonly displayed when the group is referenced. `Administrator` and `AWSAdministrators` are reserved names and can't be used for users or groups.
        identity-store-id: The globally unique identifier for the identity store.
