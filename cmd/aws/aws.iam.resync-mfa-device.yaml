name: resync-mfa-device
description: Synchronizes the specified MFA device with its IAM resource object on the Amazon Web Services servers.
flags:
    --authentication-code1=!: An authentication code emitted by the device.
    --authentication-code2=!: A subsequent authentication code emitted by the device.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --serial-number=!: Serial number that uniquely identifies the MFA device.
    --user-name=!: The name of the user whose MFA device you want to resynchronize.
documentation:
    command: |-
        Synchronizes the specified MFA device with its IAM resource object on the Amazon Web Services servers.

        For more information about creating and working with virtual MFA devices, see [Using a virtual MFA device](https://docs.aws.amazon.com/IAM/latest/UserGuide/Using_VirtualMFA.html) in the *IAM User Guide*.
    flag:
        authentication-code1: |-
            An authentication code emitted by the device.

            The format for this parameter is a sequence of six digits.
        authentication-code2: |-
            A subsequent authentication code emitted by the device.

            The format for this parameter is a sequence of six digits.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        serial-number: |-
            Serial number that uniquely identifies the MFA device.

            This parameter allows (through its [regex pattern](http://wikipedia.org/wiki/regex)) a string of characters consisting of upper and lowercase alphanumeric characters with no spaces. You can also include any of the following characters: \_+=,.@-
        user-name: |-
            The name of the user whose MFA device you want to resynchronize.

            This parameter allows (through its [regex pattern](http://wikipedia.org/wiki/regex)) a string of characters consisting of upper and lowercase alphanumeric characters with no spaces. You can also include any of the following characters: \_+=,.@-
