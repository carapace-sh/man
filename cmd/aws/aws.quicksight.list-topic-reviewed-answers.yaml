name: list-topic-reviewed-answers
description: Lists all reviewed answers for a Q Topic.
flags:
    --aws-account-id=!: The ID of the Amazon Web Services account that containd the reviewed answers that you want listed.
    --topic-id=!: The ID for the topic that contains the reviewed answer that you want to list.
documentation:
    command: Lists all reviewed answers for a Q Topic.
    flag:
        aws-account-id: The ID of the Amazon Web Services account that containd the reviewed answers that you want listed.
        topic-id: The ID for the topic that contains the reviewed answer that you want to list. This ID is unique per Amazon Web Services Region for each Amazon Web Services account.
