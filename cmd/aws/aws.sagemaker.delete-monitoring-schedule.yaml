name: delete-monitoring-schedule
description: Deletes a monitoring schedule.
flags:
    --monitoring-schedule-name=!: The name of the monitoring schedule to delete.
documentation:
    command: Deletes a monitoring schedule. Also stops the schedule had not already been stopped. This does not delete the job execution history of the monitoring schedule.
    flag:
        monitoring-schedule-name: The name of the monitoring schedule to delete.
