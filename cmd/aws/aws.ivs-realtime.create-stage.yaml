name: create-stage
description: Creates a new stage (and optionally participant tokens).
flags:
    --auto-participant-recording-configuration=: Configuration object for individual participant recording, to attach to the new stage.
    --name=: Optional name that can be specified for the stage being created.
    --participant-token-configurations=: Array of participant token configuration objects to attach to the new stage.
    --tags=: Tags attached to the resource.
documentation:
    command: Creates a new stage (and optionally participant tokens).
    flag:
        auto-participant-recording-configuration: Configuration object for individual participant recording, to attach to the new stage.
        name: Optional name that can be specified for the stage being created.
        participant-token-configurations: Array of participant token configuration objects to attach to the new stage.
        tags: Tags attached to the resource. Array of maps, each of the form `string:string (key:value)`. See [Best practices and strategies](https://docs.aws.amazon.com/tag-editor/latest/userguide/best-practices-and-strats.html) in *Tagging AWS Resources and Tag Editor* for details, including restrictions that apply to tags and "Tag naming limits and requirements"; Amazon IVS has no constraints on tags beyond what is documented there.
