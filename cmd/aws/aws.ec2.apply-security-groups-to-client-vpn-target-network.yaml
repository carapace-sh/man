name: apply-security-groups-to-client-vpn-target-network
description: Applies a security group to the association between the target network and the Client VPN endpoint.
flags:
    --client-vpn-endpoint-id=!: The ID of the Client VPN endpoint.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --security-group-ids=!: The IDs of the security groups to apply to the associated target network.
    --vpc-id=!: The ID of the VPC in which the associated target network is located.
documentation:
    command: Applies a security group to the association between the target network and the Client VPN endpoint. This action replaces the existing security groups with the specified security groups.
    flag:
        client-vpn-endpoint-id: The ID of the Client VPN endpoint.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        security-group-ids: The IDs of the security groups to apply to the associated target network. Up to 5 security groups can be applied to an associated target network.
        vpc-id: The ID of the VPC in which the associated target network is located.
