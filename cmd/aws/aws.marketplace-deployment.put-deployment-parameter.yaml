name: put-deployment-parameter
description: Creates or updates a deployment parameter and is targeted by `catalog` and `agreementId`.
flags:
    --agreement-id=!: The unique identifier of the agreement.
    --catalog=!: The catalog related to the request.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: The idempotency token for deployment parameters.
    --deployment-parameter=!: The deployment parameter targeted to the acceptor of an agreement for which to create the AWS Secret Manager resource.
    --expiration-date=: The date when deployment parameters expire and are scheduled for deletion.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --product-id=!: The product for which AWS Marketplace will save secrets for the buyer’s account.
    --tags=: A map of key-value pairs, where each pair represents a tag saved to the resource.
documentation:
    command: Creates or updates a deployment parameter and is targeted by `catalog` and `agreementId`.
    flag:
        agreement-id: The unique identifier of the agreement.
        catalog: 'The catalog related to the request. Fixed value: `AWSMarketplace`'
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: |-
            The idempotency token for deployment parameters. A unique identifier for the new version.

            This field is not required if you're calling using an AWS SDK. Otherwise, a `clientToken` must be provided with the request.
        deployment-parameter: The deployment parameter targeted to the acceptor of an agreement for which to create the AWS Secret Manager resource.
        expiration-date: The date when deployment parameters expire and are scheduled for deletion.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        product-id: The product for which AWS Marketplace will save secrets for the buyer’s account.
        tags: A map of key-value pairs, where each pair represents a tag saved to the resource. Tags will only be applied for create operations, and they'll be ignored if the resource already exists.
