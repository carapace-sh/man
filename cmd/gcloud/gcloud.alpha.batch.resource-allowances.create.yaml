name: create
description: '*(ALPHA)*  Create a Batch resource allowance.'
flags:
    --config=!: The config file of a resource allowance.
    --location=: Google Cloud location for the resourceAllowance.
documentation:
    command: |-
        *(ALPHA)*  This command creates a Batch resource allowance.

        ## EXAMPLES

        The following command submit a resource allowance with config.json sample
        config file
        `projects/foo/locations/us-central1/resousrceAllowances/bar`:

          $ gcloud alpha batch resource-allowances create projects/foo/locations/us-central1/resousrceAllowances/bar
          --config config.json
    flag:
        config: The config file of a resource allowance. Use a full or relative path to a local file containing the value of config.
        location: |-
            Google Cloud location for the resourceAllowance.
            +
            To set the `location` attribute:
            * provide the argument `RESOURCE_ALLOWANCE` on the command line with a fully specified name;
            * resource allowance ID is optional and will be generated if not specified with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `batch/location`.
