name: undelete
description: '*(BETA)*  Undelete a bucket.'
flags:
    --billing-account=: Billing account of the bucket to undelete.
    --folder=: Folder of the bucket to undelete.
    --location=!: Location of the bucket.
    --organization=: Organization of the bucket to undelete.
documentation:
    command: |-
        ## EXAMPLES

        To undelete bucket 'my-bucket' in location 'global', run:

          $ gcloud beta logging buckets undelete my-bucket --location=global
    flag:
        billing-account: Billing account of the bucket to undelete.
        folder: Folder of the bucket to undelete.
        location: Location of the bucket.
        organization: Organization of the bucket to undelete.
