name: delete
description: '*(BETA)*  Delete one or more Dataproc Metastore federations.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Location to which the federations belongs.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |-
        *(BETA)*  If run asynchronously with `--async`, exits after printing
        one or more operation names that can be used to poll the status of the
        deletion(s) via:

          {top_command} metastore operations describe
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            Location to which the federations belongs.
            +
            To set the `location` attribute:
            * provide the argument `federations` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `metastore/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
