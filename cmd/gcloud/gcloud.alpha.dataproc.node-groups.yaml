name: node-groups
description: '*(ALPHA)*  Manage Dataproc node groups.'
documentation:
    command: |-
        *(ALPHA)*  Manage and modify Dataproc node groups created with a parent cluster.

        ## EXAMPLES

        To describe a node group:

          $ gcloud alpha dataproc node-groups describe NODE_GROUP_ID --cluster cluster_name --region region

        To resize a node group:

          $ gcloud alpha dataproc node-groups resize NODE_GROUP_ID --cluster cluster_name --region region
          --size new_size
