name: create-field
description: Creates a field in the Cases domain.
flags:
    --description=: The description of the field.
    --domain-id=!: The unique identifier of the Cases domain.
    --name=!: The name of the field.
    --type=!: Defines the data type, some system constraints, and default display of the field.
completion:
    flag:
        type:
            - Text
            - Number
            - Boolean
            - DateTime
            - SingleSelect
            - Url
            - User
documentation:
    command: Creates a field in the Cases domain. This field is used to define the case object model (that is, defines what data can be captured on cases) in a Cases domain.
    flag:
        description: The description of the field.
        domain-id: The unique identifier of the Cases domain.
        name: The name of the field.
        type: Defines the data type, some system constraints, and default display of the field.
