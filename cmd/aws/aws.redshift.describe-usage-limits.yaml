name: describe-usage-limits
description: Shows usage limits on a cluster.
flags:
    --cluster-identifier=: The identifier of the cluster for which you want to describe usage limits.
    --feature-type=: The feature type for which you want to describe usage limits.
    --marker=: An optional parameter that specifies the starting point to return a set of response records.
    --max-records=: The maximum number of response records to return in each call.
    --tag-keys=: A tag key or keys for which you want to return all matching usage limit objects that are associated with the specified key or keys.
    --tag-values=: A tag value or values for which you want to return all matching usage limit objects that are associated with the specified tag value or values.
    --usage-limit-id=: The identifier of the usage limit to describe.
completion:
    flag:
        feature-type:
            - spectrum
            - concurrency-scaling
            - cross-region-datasharing
documentation:
    command: |-
        Shows usage limits on a cluster. Results are filtered based on the combination of input usage limit identifier, cluster identifier, and feature type parameters:

        - If usage limit identifier, cluster identifier, and feature type are not provided, then all usage limit objects for the current account in the current region are returned.
        - If usage limit identifier is provided, then the corresponding usage limit object is returned.
        - If cluster identifier is provided, then all usage limit objects for the specified cluster are returned.
        - If cluster identifier and feature type are provided, then all usage limit objects for the combination of cluster and feature are returned.
    flag:
        cluster-identifier: The identifier of the cluster for which you want to describe usage limits.
        feature-type: The feature type for which you want to describe usage limits.
        marker: An optional parameter that specifies the starting point to return a set of response records. When the results of a [DescribeUsageLimits]() request exceed the value specified in `MaxRecords`, Amazon Web Services returns a value in the `Marker` field of the response. You can retrieve the next set of response records by providing the returned marker value in the `Marker` parameter and retrying the request.
        max-records: |-
            The maximum number of response records to return in each call. If the number of remaining response records exceeds the specified `MaxRecords` value, a value is returned in a `marker` field of the response. You can retrieve the next set of records by retrying the command with the returned marker value.

            Default: `100`

            Constraints: minimum 20, maximum 100.
        tag-keys: A tag key or keys for which you want to return all matching usage limit objects that are associated with the specified key or keys. For example, suppose that you have parameter groups that are tagged with keys called `owner` and `environment`. If you specify both of these tag keys in the request, Amazon Redshift returns a response with the usage limit objects have either or both of these tag keys associated with them.
        tag-values: A tag value or values for which you want to return all matching usage limit objects that are associated with the specified tag value or values. For example, suppose that you have parameter groups that are tagged with values called `admin` and `test`. If you specify both of these tag values in the request, Amazon Redshift returns a response with the usage limit objects that have either or both of these tag values associated with them.
        usage-limit-id: The identifier of the usage limit to describe.
