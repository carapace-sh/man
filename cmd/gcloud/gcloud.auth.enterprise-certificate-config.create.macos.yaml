name: macos
description: Create an enterprise-certificate configuration file for MacOS.
flags:
    --ecp-client=: Provide a custom path to the enterprise-certificate-proxy shared client library.
    --ecp=: Provide a custom path to the enterprise-certificate-proxy binary.
    --issuer=!: The certificate issuer.
    --keychain-type=: Specify the target keychain(s) for certificate lookup.Accepted values are "login", "system", or "all".
    --output-file=: Override the file path that the enterprise-certificate-proxy configuration is written to.
    --tls-offload=: Provide a custom path to the enterprise-certificate-proxy shared tls offload library.
documentation:
    command: |-
        This command creates a configuration file used by gcloud to use the
        enterprise-certificate-proxy component for mTLS.
    flag:
        ecp: Provide a custom path to the enterprise-certificate-proxy binary. This flag must be the full path to the binary.
        ecp-client: Provide a custom path to the enterprise-certificate-proxy shared client library. This flag must be the full path to the shared library.
        issuer: The certificate issuer.
        keychain-type: Specify the target keychain(s) for certificate lookup.Accepted values are "login", "system", or "all". If omitted,defaults to "all". Use "all" to include custom keychains.
        output-file: Override the file path that the enterprise-certificate-proxy configuration is written to.
        tls-offload: Provide a custom path to the enterprise-certificate-proxy shared tls offload library. This flag must be the full path to the shared library.
