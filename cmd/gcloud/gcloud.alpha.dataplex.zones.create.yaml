name: create
description: '*(ALPHA)*  Create a zone.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --csv-delimiter=: The delimiter being used to separate values.
    --csv-disable-type-inference: Whether to disable the inference of data type for CSV data.
    --csv-encoding=: The character encoding of the data.
    --csv-header-rows=: The number of rows to interpret as header rows that should be skipped when reading data rows.
    --description=: Description of the zone.
    --discovery-enabled: Whether discovery is enabled.
    --discovery-exclude-patterns=: The list of patterns to apply for selecting data to exclude
    --discovery-include-patterns=: The list of patterns to apply for selecting data to include
    --discovery-schedule=: '[Cron schedule](https://en.wikipedia.org/wiki/Cron) for running'
    --display-name=: Display name of the zone.
    --json-disable-type-inference: Whether to disable the inference of data type for Json data.
    --json-encoding=: The character encoding of the data.
    --labels=: List of label KEY=VALUE pairs to add.
    --lake=: The identifier of the Dataplex lake resource.
    --location=: The location of the Dataplex resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-csv-disable-type-inference&: Whether to disable the inference of data type for CSV data.
    --no-discovery-enabled&: Whether discovery is enabled.
    --no-json-disable-type-inference&: Whether to disable the inference of data type for Json data.
    --no-validate-only&: Validate the create action, but don't actually perform it.
    --resource-location-type=!: Location type of the resources attached to a zone.
    --type=!: Type.
    --validate-only: Validate the create action, but don't actually perform it.
completion:
    flag:
        resource-location-type:
            - MULTI_REGION
            - SINGLE_REGION
        type:
            - CURATED
            - RAW
documentation:
    command: |-
        *(ALPHA)*  A zone represents a logical group of related assets within a lake. A zone can
        be used to map to organizational structure or represent stages of data
        readiness from raw to curated. It provides managing behavior that is shared
        or inherited by all contained assets.

        The Zone ID is used to generate names such as database and dataset names
        when publishing metadata to Hive Metastore and BigQuery.
         * Must contain only lowercase letters, numbers, and hyphens.
         * Must start with a letter.
         * Must end with a number or a letter.
         * Must be between 1-63 characters.
         * Must be unique across all lakes from all locations in a project.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        csv-delimiter: The delimiter being used to separate values. This defaults to ','.
        csv-disable-type-inference: Whether to disable the inference of data type for CSV data. If true, all columns will be registered as strings. Use *--csv-disable-type-inference* to enable and *--no-csv-disable-type-inference* to disable.
        csv-encoding: The character encoding of the data. The default is UTF-8.
        csv-header-rows: The number of rows to interpret as header rows that should be skipped when reading data rows.
        description: Description of the zone.
        discovery-enabled: Whether discovery is enabled. Use *--discovery-enabled* to enable and *--no-discovery-enabled* to disable.
        discovery-exclude-patterns: |-
            The list of patterns to apply for selecting data to exclude
                    during discovery. For Cloud Storage bucket assets, these are interpreted
                    as glob patterns used to match object names. For BigQuery dataset
                    assets, these are interpreted as patterns to match table names.
        discovery-include-patterns: |-
            The list of patterns to apply for selecting data to include
                    during discovery if only a subset of the data should considered. For
                    Cloud Storage bucket assets, these are interpreted as glob patterns
                    used to match object names. For BigQuery dataset assets, these are
                    interpreted as patterns to match table names.
        discovery-schedule: |-
            [Cron schedule](https://en.wikipedia.org/wiki/Cron) for running
                            discovery jobs periodically. Discovery jobs must be scheduled at
                            least 30 minutes apart.
        display-name: Display name of the zone.
        json-disable-type-inference: Whether to disable the inference of data type for Json data. If true, all columns will be registered as their primitive types (strings, number or boolean). Use *--json-disable-type-inference* to enable and *--no-json-disable-type-inference* to disable.
        json-encoding: The character encoding of the data. The default is UTF-8.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        lake: |-
            The identifier of the Dataplex lake resource.
            +
            To set the `lake` attribute:
            * provide the argument `zone` on the command line with a fully specified name;
            * provide the argument `--lake` on the command line.
        location: |-
            The location of the Dataplex resource.
            +
            To set the `location` attribute:
            * provide the argument `zone` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-csv-disable-type-inference: Whether to disable the inference of data type for CSV data. If true, all columns will be registered as strings.
        no-discovery-enabled: Whether discovery is enabled.
        no-json-disable-type-inference: Whether to disable the inference of data type for Json data. If true, all columns will be registered as their primitive types (strings, number or boolean).
        no-validate-only: Validate the create action, but don't actually perform it.
        resource-location-type: |-
            Location type of the resources attached to a zone. _RESOURCE_LOCATION_TYPE_ must be one of:
            +
            *MULTI_REGION*::: Resources that are associated with a multi-region location.
            *SINGLE_REGION*::: Resources that are associated with a single region.
            :::
            +
        type: |-
            Type. _TYPE_ must be one of:
            +
            *CURATED*::: A zone that contains data that is considered to be ready for
                               broader consumption and analytics workloads. Curated
                               structured data stored in Cloud Storage must conform to
                               certain file formats (Parquet, Avro, and Orc) and organized
                               in a hive-compatible directory layout.
            *RAW*::: A zone that contains data that needs further processing
                               before it is considered generally ready for consumption and
                               analytics workloads.
            :::
            +
        validate-only: Validate the create action, but don't actually perform it.
