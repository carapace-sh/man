name: start-dbcluster
description: Starts an Amazon Neptune DB cluster that was stopped using the Amazon console, the Amazon CLI stop-db-cluster command, or the StopDBCluster API.
flags:
    --dbcluster-identifier=!: The DB cluster identifier of the Neptune DB cluster to be started.
documentation:
    command: Starts an Amazon Neptune DB cluster that was stopped using the Amazon console, the Amazon CLI stop-db-cluster command, or the StopDBCluster API.
    flag:
        dbcluster-identifier: The DB cluster identifier of the Neptune DB cluster to be started. This parameter is stored as a lowercase string.
