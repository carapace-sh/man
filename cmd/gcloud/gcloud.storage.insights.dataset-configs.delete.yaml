name: delete
description: Delete dataset config for Insights.
flags:
    --auto-delete-link: Delete the BigQuery instance links before the config gets deleted explicitly.
    --force: Force delete the config by skipping the consent.
    --location=: Insights supported Google Cloud location for the dataset-config.
    --no-auto-delete-link&: Delete the BigQuery instance links before the config gets deleted explicitly.
    --no-force&: Force delete the config by skipping the consent.
documentation:
    command: |
        Delete an Insights dataset config.
    flag:
        auto-delete-link: Delete the BigQuery instance links before the config gets deleted explicitly.
        force: Force delete the config by skipping the consent.
        location: |-
            Insights supported Google Cloud location for the dataset-config.
            +
            To set the `location` attribute:
            * provide the argument `dataset_config` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-auto-delete-link: Delete the BigQuery instance links before the config gets deleted explicitly.
        no-force: Force delete the config by skipping the consent.
