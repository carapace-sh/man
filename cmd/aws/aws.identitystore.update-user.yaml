name: update-user
description: Updates the specified user metadata and attributes in the specified identity store.
flags:
    --identity-store-id=!: The globally unique identifier for the identity store.
    --operations=!: A list of `AttributeOperation` objects to apply to the requested user.
    --user-id=!: The identifier for a user in the identity store.
documentation:
    command: Updates the specified user metadata and attributes in the specified identity store.
    flag:
        identity-store-id: The globally unique identifier for the identity store.
        operations: A list of `AttributeOperation` objects to apply to the requested user. These operations might add, replace, or remove an attribute. For more information on the attributes that can be added, replaced, or removed, see [User](https://docs.aws.amazon.com/singlesignon/latest/IdentityStoreAPIReference/API_User.html).
        user-id: The identifier for a user in the identity store.
