name: describe-direct-connect-gateway-association-proposals
description: Describes one or more association proposals for connection between a virtual private gateway or transit gateway and a Direct Connect gateway.
flags:
    --associated-gateway-id=: The ID of the associated gateway.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --direct-connect-gateway-id=: The ID of the Direct Connect gateway.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of results to return with a single call.
    --next-token=: The token for the next page of results.
    --proposal-id=: The ID of the proposal.
documentation:
    command: Describes one or more association proposals for connection between a virtual private gateway or transit gateway and a Direct Connect gateway.
    flag:
        associated-gateway-id: The ID of the associated gateway.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        direct-connect-gateway-id: The ID of the Direct Connect gateway.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: |-
            The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned `nextToken` value.

            If `MaxResults` is given a value larger than 100, only 100 results are returned.
        next-token: The token for the next page of results.
        proposal-id: The ID of the proposal.
