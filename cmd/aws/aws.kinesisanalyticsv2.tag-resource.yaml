name: tag-resource
description: Adds one or more key-value tags to a Managed Service for Apache Flink application.
flags:
    --resource-arn=!: The ARN of the application to assign the tags.
    --tags=!: The key-value tags to assign to the application.
documentation:
    command: Adds one or more key-value tags to a Managed Service for Apache Flink application. Note that the maximum number of application tags includes system tags. The maximum number of user-defined application tags is 50. For more information, see [Using Tagging](https://docs.aws.amazon.com/kinesisanalytics/latest/java/how-tagging.html).
    flag:
        resource-arn: The ARN of the application to assign the tags.
        tags: The key-value tags to assign to the application.
