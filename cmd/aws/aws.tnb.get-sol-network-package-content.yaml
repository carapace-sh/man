name: get-sol-network-package-content
description: Gets the contents of a network package.
flags:
    --accept=!: The format of the package you want to download from the network package.
    --nsd-info-id=!: ID of the network service descriptor in the network package.
completion:
    flag:
        accept:
            - application/zip
documentation:
    command: |-
        Gets the contents of a network package.

        A network package is a .zip file in CSAR (Cloud Service Archive) format defines the function packages you want to deploy and the Amazon Web Services infrastructure you want to deploy them on.
    flag:
        accept: The format of the package you want to download from the network package.
        nsd-info-id: ID of the network service descriptor in the network package.
