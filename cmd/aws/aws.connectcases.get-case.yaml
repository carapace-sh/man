name: get-case
description: Returns information about a specific case if it exists.
flags:
    --case-id=!: A unique identifier of the case.
    --domain-id=!: The unique identifier of the Cases domain.
    --fields=!: A list of unique field identifiers.
    --next-token=: The token for the next set of results.
documentation:
    command: Returns information about a specific case if it exists.
    flag:
        case-id: A unique identifier of the case.
        domain-id: The unique identifier of the Cases domain.
        fields: A list of unique field identifiers.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
