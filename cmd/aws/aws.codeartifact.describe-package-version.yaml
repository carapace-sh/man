name: describe-package-version
description: Returns a [PackageVersionDescription](https://docs.aws.amazon.com/codeartifact/latest/APIReference/API_PackageVersionDescription.html) object that contains information about the requested package version.
flags:
    --domain-owner=: The 12-digit account number of the Amazon Web Services account that owns the domain.
    --domain=!: The name of the domain that contains the repository that contains the package version.
    --format=!: A format that specifies the type of the requested package version.
    --namespace=: The namespace of the requested package version.
    --package-version=!: A string that contains the package version (for example, `3.5.2`).
    --package=!: The name of the requested package version.
    --repository=!: The name of the repository that contains the package version.
completion:
    flag:
        format:
            - npm
            - pypi
            - maven
            - nuget
            - generic
            - ruby
            - swift
            - cargo
documentation:
    command: Returns a [PackageVersionDescription](https://docs.aws.amazon.com/codeartifact/latest/APIReference/API_PackageVersionDescription.html) object that contains information about the requested package version.
    flag:
        domain: The name of the domain that contains the repository that contains the package version.
        domain-owner: The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces.
        format: A format that specifies the type of the requested package version.
        namespace: |-
            The namespace of the requested package version. The package component that specifies its namespace depends on its type. For example:

            The namespace is required when requesting package versions of the following formats:

            - Maven
            - Swift
            - generic

            <!--THE END-->

            - The namespace of a Maven package version is its `groupId`.
            - The namespace of an npm or Swift package version is its `scope`.
            - The namespace of a generic package is its `namespace`.
            - Python, NuGet, Ruby, and Cargo package versions do not contain a corresponding component, package versions of those formats do not have a namespace.
        package: The name of the requested package version.
        package-version: A string that contains the package version (for example, `3.5.2`).
        repository: The name of the repository that contains the package version.
