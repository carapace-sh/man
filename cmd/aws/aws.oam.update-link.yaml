name: update-link
description: Use this operation to change what types of data are shared from a source account to its linked monitoring account sink.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identifier=!: The ARN of the link that you want to update.
    --include-tags: Specifies whether to include the tags associated with the link in the response after the update operation.
    --link-configuration=: Use this structure to filter which metric namespaces and which log groups are to be shared from the source account to the monitoring account.
    --no-include-tags: Specifies whether to include the tags associated with the link in the response after the update operation.
    --resource-types=!: An array of strings that define which types of data that the source account will send to the monitoring account.
documentation:
    command: |-
        Use this operation to change what types of data are shared from a source account to its linked monitoring account sink. You can't change the sink or change the monitoring account with this operation.

        When you update a link, you can optionally specify filters that specify which metric namespaces and which log groups are shared from the source account to the monitoring account.

        To update the list of tags associated with the sink, use [TagResource](https://docs.aws.amazon.com/OAM/latest/APIReference/API_TagResource.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        identifier: The ARN of the link that you want to update.
        include-tags: |-
            Specifies whether to include the tags associated with the link in the response after the update operation. When `IncludeTags` is set to `true` and the caller has the required permission, `oam:ListTagsForResource`, the API will return the tags for the specified resource. If the caller doesn't have the required permission, `oam:ListTagsForResource`, the API will raise an exception.

            The default value is `false`.
        link-configuration: Use this structure to filter which metric namespaces and which log groups are to be shared from the source account to the monitoring account.
        resource-types: |-
            An array of strings that define which types of data that the source account will send to the monitoring account.

            Your input here replaces the current set of data types that are shared.
