name: list-integration-associations
description: Provides summary information about the Amazon Web Services resource associations for the specified Amazon Connect instance.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --integration-arn=: The Amazon Resource Name (ARN) of the integration.
    --integration-type=: The integration type.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
completion:
    flag:
        integration-type:
            - EVENT
            - VOICE_ID
            - PINPOINT_APP
            - WISDOM_ASSISTANT
            - WISDOM_KNOWLEDGE_BASE
            - WISDOM_QUICK_RESPONSES
            - Q_MESSAGE_TEMPLATES
            - CASES_DOMAIN
            - APPLICATION
            - FILE_SCANNER
            - SES_IDENTITY
            - ANALYTICS_CONNECTOR
            - CALL_TRANSFER_CONNECTOR
            - COGNITO_USER_POOL
documentation:
    command: Provides summary information about the Amazon Web Services resource associations for the specified Amazon Connect instance.
    flag:
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        integration-arn: The Amazon Resource Name (ARN) of the integration.
        integration-type: The integration type.
        max-results: The maximum number of results to return per page.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
