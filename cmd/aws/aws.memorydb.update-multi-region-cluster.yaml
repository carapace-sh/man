name: update-multi-region-cluster
description: Updates the configuration of an existing multi-Region cluster.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A new description for the multi-Region cluster.
    --engine-version=: The new engine version to be used for the multi-Region cluster.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --multi-region-cluster-name=!: The name of the multi-Region cluster to be updated.
    --multi-region-parameter-group-name=: The new multi-Region parameter group to be associated with the cluster.
    --node-type=: The new node type to be used for the multi-Region cluster.
    --shard-configuration=: ""
    --update-strategy=: The strategy to use for the update operation.
completion:
    flag:
        update-strategy:
            - coordinated
            - uncoordinated
documentation:
    command: Updates the configuration of an existing multi-Region cluster.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A new description for the multi-Region cluster.
        engine-version: The new engine version to be used for the multi-Region cluster.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        multi-region-cluster-name: The name of the multi-Region cluster to be updated.
        multi-region-parameter-group-name: The new multi-Region parameter group to be associated with the cluster.
        node-type: The new node type to be used for the multi-Region cluster.
        shard-configuration: ""
        update-strategy: The strategy to use for the update operation. Supported values are "coordinated" or "uncoordinated".
