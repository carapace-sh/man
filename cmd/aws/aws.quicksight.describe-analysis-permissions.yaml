name: describe-analysis-permissions
description: Provides the read and write permissions for an analysis.
flags:
    --analysis-id=!: The ID of the analysis whose permissions you're describing.
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the analysis whose permissions you're describing.
documentation:
    command: Provides the read and write permissions for an analysis.
    flag:
        analysis-id: The ID of the analysis whose permissions you're describing. The ID is part of the analysis URL.
        aws-account-id: The ID of the Amazon Web Services account that contains the analysis whose permissions you're describing. You must be using the Amazon Web Services account that the analysis is in.
