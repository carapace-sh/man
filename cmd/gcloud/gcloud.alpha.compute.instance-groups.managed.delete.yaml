name: delete
description: '*(ALPHA)*  Delete Compute Engine managed instance groups.'
flags:
    --region=: Region of the managed instance groups to delete.
    --zone=: Zone of the managed instance groups to delete.
documentation:
    command: |4
                *(ALPHA)*  *gcloud alpha compute instance-groups managed delete* deletes one or more Compute Engine managed instance
        groups.
    flag:
        region: |-
            Region of the managed instance groups to delete. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            Overrides the default *compute/region* property value for this command invocation.
        zone: |-
            Zone of the managed instance groups to delete. If not specified, you might be prompted to select a zone (interactive mode
            only).
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            Overrides the default *compute/zone* property value for this command invocation.
