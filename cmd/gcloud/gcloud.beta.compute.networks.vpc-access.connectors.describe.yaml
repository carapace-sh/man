name: describe
description: '*(BETA)*  Show metadata for a VPC Access connector.'
flags:
    --region=: Compute region (e.g. us-central1) for the connector.
documentation:
    command: |
        *(BETA)*  Display all metadata associated with a VPC Access connector
        given a valid connector name.

        This command can fail for the following reasons:
        * The connector specified does not exist.
        * The active account does not have permission to access the given
          operation.
    flag:
        region: |-
            Compute region (e.g. us-central1) for the connector.
            +

            To set the `region` attribute:
            * provide the argument `connector` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
