name: unlabel-parameter-version
description: Remove a label or labels from a parameter.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --labels=!:
        description: One or more labels to delete from the specified parameter version.
        nargs: -1
    --name=!: The name of the parameter from which you want to delete one or more labels.
    --parameter-version=!: The specific version of the parameter which you want to delete one or more labels from.
documentation:
    command: |-
        Remove a label or labels from a parameter.

        Parameter names can't contain spaces. The service removes any spaces specified for the beginning or end of a parameter name. If the specified name for a parameter contains spaces between characters, the request fails with a `ValidationException` error.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        labels: One or more labels to delete from the specified parameter version.
        name: |-
            The name of the parameter from which you want to delete one or more labels.

            You can't enter the Amazon Resource Name (ARN) for a parameter, only the parameter name itself.
        parameter-version: The specific version of the parameter which you want to delete one or more labels from. If it isn't present, the call will fail.
