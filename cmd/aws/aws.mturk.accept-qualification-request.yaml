name: accept-qualification-request
description: The `AcceptQualificationRequest` operation approves a Worker's request for a Qualification.
flags:
    --integer-value=: The value of the Qualification.
    --qualification-request-id=!: The ID of the Qualification request, as returned by the `GetQualificationRequests` operation.
documentation:
    command: |-
        The `AcceptQualificationRequest` operation approves a Worker's request for a Qualification.

        Only the owner of the Qualification type can grant a Qualification request for that type.

        A successful request for the `AcceptQualificationRequest` operation returns with no errors and an empty body.
    flag:
        integer-value: The value of the Qualification. You can omit this value if you are using the presence or absence of the Qualification as the basis for a HIT requirement.
        qualification-request-id: The ID of the Qualification request, as returned by the `GetQualificationRequests` operation.
