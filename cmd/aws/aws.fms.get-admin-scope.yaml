name: get-admin-scope
description: Returns information about the specified account's administrative scope.
flags:
    --admin-account=!: The administrator account that you want to get the details for.
documentation:
    command: Returns information about the specified account's administrative scope. The administrative scope defines the resources that an Firewall Manager administrator can manage.
    flag:
        admin-account: The administrator account that you want to get the details for.
