name: describe-user-stack-associations
description: Retrieves a list that describes the UserStackAssociation objects.
flags:
    --authentication-type=: The authentication type for the user who is associated with the stack.
    --max-results=: The maximum size of each page of results.
    --next-token=: The pagination token to use to retrieve the next page of results for this operation.
    --stack-name=: The name of the stack that is associated with the user.
    --user-name=: The email address of the user who is associated with the stack.
completion:
    flag:
        authentication-type:
            - API
            - SAML
            - USERPOOL
            - AWS_AD
documentation:
    command: |-
        Retrieves a list that describes the UserStackAssociation objects. You must specify either or both of the following:

        - The stack name
        - The user name (email address of the user associated with the stack) and the authentication type for the user
    flag:
        authentication-type: The authentication type for the user who is associated with the stack. You must specify USERPOOL.
        max-results: The maximum size of each page of results.
        next-token: The pagination token to use to retrieve the next page of results for this operation. If this value is null, it retrieves the first page.
        stack-name: The name of the stack that is associated with the user.
        user-name: |-
            The email address of the user who is associated with the stack.

            Users' email addresses are case-sensitive.
