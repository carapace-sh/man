name: send-email
description: Sends an email message.
flags:
    --configuration-set-name=: The name of the configuration set that you want to use when sending the email.
    --content=!: An object that contains the body of the message.
    --destination=!: An object that contains the recipients of the email message.
    --email-tags=: A list of tags, in the form of name/value pairs, to apply to an email that you send using the `SendEmail` operation.
    --feedback-forwarding-email-address=: The address that Amazon Pinpoint should send bounce and complaint notifications to.
    --from-email-address=: The email address that you want to use as the "From" address for the email.
    --reply-to-addresses=: The "Reply-to" email addresses for the message.
documentation:
    command: |-
        Sends an email message. You can use the Amazon Pinpoint Email API to send two types of messages:

        - **Simple** – A standard email message. When you create this type of message, you specify the sender, the recipient, and the message body, and Amazon Pinpoint assembles the message for you.
        - **Raw** – A raw, MIME-formatted email message. When you send this type of email, you have to specify all of the message headers, as well as the message body. You can use this message type to send messages that contain attachments. The message that you specify has to be a valid MIME message.
    flag:
        configuration-set-name: The name of the configuration set that you want to use when sending the email.
        content: An object that contains the body of the message. You can send either a Simple message or a Raw message.
        destination: An object that contains the recipients of the email message.
        email-tags: A list of tags, in the form of name/value pairs, to apply to an email that you send using the `SendEmail` operation. Tags correspond to characteristics of the email that you define, so that you can publish email sending events.
        feedback-forwarding-email-address: The address that Amazon Pinpoint should send bounce and complaint notifications to.
        from-email-address: The email address that you want to use as the "From" address for the email. The address that you specify has to be verified.
        reply-to-addresses: The "Reply-to" email addresses for the message. When the recipient replies to the message, each Reply-to address receives the reply.
