name: delete-access-control-rule
description: Deletes an access control rule for the specified WorkMail organization.
flags:
    --name=!: The name of the access control rule.
    --organization-id=!: The identifier for the organization.
documentation:
    command: |-
        Deletes an access control rule for the specified WorkMail organization.

        Deleting already deleted and non-existing rules does not produce an error. In those cases, the service sends back an HTTP 200 response with an empty HTTP body.
    flag:
        name: The name of the access control rule.
        organization-id: The identifier for the organization.
