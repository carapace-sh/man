name: start-data-quality-ruleset-evaluation-run
description: Once you have a ruleset definition (either recommended or your own), you call this operation to evaluate the ruleset against a data source (Glue table).
flags:
    --additional-data-sources=: A map of reference strings to additional data sources you can specify for an evaluation run.
    --additional-run-options=: Additional run options you can specify for an evaluation run.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Used for idempotency and is recommended to be set to a random ID (such as a UUID) to avoid creating or starting multiple instances of the same resource.
    --data-source=!: The data source (Glue table) associated with this run.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --number-of-workers=: The number of `G.1X` workers to be used in the run.
    --role=!: An IAM role supplied to encrypt the results of the run.
    --ruleset-names=!: A list of ruleset names.
    --timeout=: The timeout for a run in minutes.
documentation:
    command: Once you have a ruleset definition (either recommended or your own), you call this operation to evaluate the ruleset against a data source (Glue table). The evaluation computes results which you can retrieve with the `GetDataQualityResult` API.
    flag:
        additional-data-sources: A map of reference strings to additional data sources you can specify for an evaluation run.
        additional-run-options: Additional run options you can specify for an evaluation run.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Used for idempotency and is recommended to be set to a random ID (such as a UUID) to avoid creating or starting multiple instances of the same resource.
        data-source: The data source (Glue table) associated with this run.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        number-of-workers: The number of `G.1X` workers to be used in the run. The default is 5.
        role: An IAM role supplied to encrypt the results of the run.
        ruleset-names: A list of ruleset names.
        timeout: The timeout for a run in minutes. This is the maximum time that a run can consume resources before it is terminated and enters `TIMEOUT` status. The default is 2,880 minutes (48 hours).
