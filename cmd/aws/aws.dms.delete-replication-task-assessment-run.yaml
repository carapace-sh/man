name: delete-replication-task-assessment-run
description: Deletes the record of a single premigration assessment run.
flags:
    --replication-task-assessment-run-arn=!: Amazon Resource Name (ARN) of the premigration assessment run to be deleted.
documentation:
    command: |-
        Deletes the record of a single premigration assessment run.

        This operation removes all metadata that DMS maintains about this assessment run. However, the operation leaves untouched all information about this assessment run that is stored in your Amazon S3 bucket.
    flag:
        replication-task-assessment-run-arn: Amazon Resource Name (ARN) of the premigration assessment run to be deleted.
