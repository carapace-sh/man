name: remove-members
description: '*(ALPHA)*  Remove member interconnects from a Compute Engine interconnect group.'
flags:
    --interconnects=!: Member interconnects to add to or remove from the interconnect group.
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute interconnects groups remove-members* is used to remove member interconnects from an interconnect
        group.

        For an example, refer to the *EXAMPLES* section below.
    flag:
        interconnects: Member interconnects to add to or remove from the interconnect group.
