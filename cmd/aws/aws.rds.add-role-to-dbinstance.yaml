name: add-role-to-dbinstance
description: Associates an Amazon Web Services Identity and Access Management (IAM) role with a DB instance.
flags:
    --dbinstance-identifier=!: The name of the DB instance to associate the IAM role with.
    --feature-name=!: The name of the feature for the DB instance that the IAM role is to be associated with.
    --role-arn=!: The Amazon Resource Name (ARN) of the IAM role to associate with the DB instance, for example `arn:aws:iam::123456789012:role/AccessRole`.
documentation:
    command: |-
        Associates an Amazon Web Services Identity and Access Management (IAM) role with a DB instance.

        To add a role to a DB instance, the status of the DB instance must be `available`.

        This command doesn't apply to RDS Custom.
    flag:
        dbinstance-identifier: The name of the DB instance to associate the IAM role with.
        feature-name: The name of the feature for the DB instance that the IAM role is to be associated with. For information about supported feature names, see [DBEngineVersion]().
        role-arn: The Amazon Resource Name (ARN) of the IAM role to associate with the DB instance, for example `arn:aws:iam::123456789012:role/AccessRole`.
