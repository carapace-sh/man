name: get-relational-database-master-user-password
description: Returns the current, previous, or pending versions of the master user password for a Lightsail database.
flags:
    --password-version=: The password version to return.
    --relational-database-name=!: The name of your database for which to get the master user password.
completion:
    flag:
        password-version:
            - CURRENT
            - PREVIOUS
            - PENDING
documentation:
    command: |-
        Returns the current, previous, or pending versions of the master user password for a Lightsail database.

        The `GetRelationalDatabaseMasterUserPassword` operation supports tag-based access control via resource tags applied to the resource identified by relationalDatabaseName.
    flag:
        password-version: |-
            The password version to return.

            Specifying `CURRENT` or `PREVIOUS` returns the current or previous passwords respectively. Specifying `PENDING` returns the newest version of the password that will rotate to `CURRENT`. After the `PENDING` password rotates to `CURRENT`, the `PENDING` password is no longer available.

            Default: `CURRENT`
        relational-database-name: The name of your database for which to get the master user password.
