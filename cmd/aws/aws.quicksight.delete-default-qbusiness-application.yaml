name: delete-default-qbusiness-application
description: Deletes a linked Amazon Q Business application from an Quick Sight account
flags:
    --aws-account-id=!: The ID of the Quick Sight account that you want to disconnect from a Amazon Q Business application.
    --namespace=: The Quick Sight namespace that you want to delete a linked Amazon Q Business application from.
documentation:
    command: Deletes a linked Amazon Q Business application from an Quick Sight account
    flag:
        aws-account-id: The ID of the Quick Sight account that you want to disconnect from a Amazon Q Business application.
        namespace: The Quick Sight namespace that you want to delete a linked Amazon Q Business application from. If this field is left blank, the Amazon Q Business application is deleted from the default namespace. Currently, the default namespace is the only valid value for this parameter.
