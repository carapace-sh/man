name: change-password
description: Changes the password for the currently signed-in user.
flags:
    --access-token=!: A valid access token that Amazon Cognito issued to the user whose password you want to change.
    --previous-password=: The user's previous password.
    --proposed-password=!: A new password that you prompted the user to enter in your application.
documentation:
    command: |-
        Changes the password for the currently signed-in user.

        Authorize this action with a signed-in user's access token. It must include the scope `aws.cognito.signin.user.admin`.

        Amazon Cognito doesn't evaluate Identity and Access Management (IAM) policies in requests for this API operation. For this operation, you can't use IAM credentials to authorize requests, and you can't grant IAM permissions in policies. For more information about authorization models in Amazon Cognito, see [Using the Amazon Cognito user pools API and user pool endpoints](https://docs.aws.amazon.com/cognito/latest/developerguide/user-pools-API-operations.html).
    flag:
        access-token: A valid access token that Amazon Cognito issued to the user whose password you want to change.
        previous-password: The user's previous password. Required if the user has a password. If the user has no password and only signs in with passwordless authentication options, you can omit this parameter.
        proposed-password: A new password that you prompted the user to enter in your application.
