name: active-peering-zones
description: '*(ALPHA)*  Manage your Cloud DNS active-peering-zones.'
documentation:
    command: |-
        *(ALPHA)*  Manage your Cloud DNS active-peering-zones.

        ## EXAMPLES

        To list the consumer active-peering-zones targeting a producer network, run:

          $ gcloud alpha dns active-peering-zones list --target-network="my-producer-network"

        To revoke a peering connection from the producer by deactivating
        an active-peering-zone, run:

          $ gcloud alpha dns active-peering-zones deactivate consumer_zone_id
