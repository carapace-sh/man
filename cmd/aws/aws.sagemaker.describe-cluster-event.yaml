name: describe-cluster-event
description: Retrieves detailed information about a specific event for a given HyperPod cluster.
flags:
    --cluster-name=!: The name or Amazon Resource Name (ARN) of the HyperPod cluster associated with the event.
    --event-id=!: The unique identifier (UUID) of the event to describe.
documentation:
    command: Retrieves detailed information about a specific event for a given HyperPod cluster. This functionality is only supported when the `NodeProvisioningMode` is set to `Continuous`.
    flag:
        cluster-name: The name or Amazon Resource Name (ARN) of the HyperPod cluster associated with the event.
        event-id: The unique identifier (UUID) of the event to describe. This ID can be obtained from the `ListClusterEvents` operation.
