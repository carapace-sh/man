name: update-action-connector-permissions
description: Updates the permissions for an action connector by granting or revoking access for specific users and groups.
flags:
    --action-connector-id=!: The unique identifier of the action connector whose permissions you want to update.
    --aws-account-id=!: The Amazon Web Services account ID that contains the action connector.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --grant-permissions=:
        description: The permissions to grant to users and groups for this action connector.
        nargs: -1
    --revoke-permissions=:
        description: The permissions to revoke from users and groups for this action connector.
        nargs: -1
documentation:
    command: Updates the permissions for an action connector by granting or revoking access for specific users and groups. You can control who can view, use, or manage the action connector.
    flag:
        action-connector-id: The unique identifier of the action connector whose permissions you want to update.
        aws-account-id: The Amazon Web Services account ID that contains the action connector.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        grant-permissions: The permissions to grant to users and groups for this action connector.
        revoke-permissions: The permissions to revoke from users and groups for this action connector.
