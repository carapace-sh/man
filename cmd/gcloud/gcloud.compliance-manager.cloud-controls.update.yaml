name: update
description: Update a cloud control.
hidden: true
flags:
    --add-categories=: Add new value to categories list.
    --add-parameter-spec=: Add new value to parameter_spec list.
    --add-rules=: Add new value to rules list.
    --add-supported-cloud-providers=: Add new value to supported_cloud_providers list.
    --add-supported-target-resource-types=: Add new value to supported_target_resource_types list.
    --categories=: Set categories to new value.
    --clear-categories: Clear categories value and set to empty list.
    --clear-parameter-spec: Clear parameter_spec value and set to empty list.
    --clear-rules: Clear rules value and set to empty list.
    --clear-supported-cloud-providers: Clear supported_cloud_providers value and set to empty list.
    --clear-supported-target-resource-types: Clear supported_target_resource_types value and set to empty list.
    --description=: A description of the cloud control.
    --display-name=: The friendly name of the cloud control.
    --finding-category=: The finding category for the cloud control findings.
    --location=: The location id of the cloudControl resource.
    --no-clear-categories&: Clear categories value and set to empty list.
    --no-clear-parameter-spec&: Clear parameter_spec value and set to empty list.
    --no-clear-rules&: Clear rules value and set to empty list.
    --no-clear-supported-cloud-providers&: Clear supported_cloud_providers value and set to empty list.
    --no-clear-supported-target-resource-types&: Clear supported_target_resource_types value and set to empty list.
    --organization=: The organization id of the cloudControl resource.
    --parameter-spec=: Set parameter_spec to new value.
    --remediation-steps=: The remediation steps for the cloud control findings.
    --remove-categories=: Remove existing value from categories list.
    --remove-parameter-spec=: Remove existing value from parameter_spec list.
    --remove-rules=: Remove existing value from rules list.
    --remove-supported-cloud-providers=: Remove existing value from supported_cloud_providers list.
    --remove-supported-target-resource-types=: Remove existing value from supported_target_resource_types list.
    --rules=: Set rules to new value.
    --severity=: The severity of the findings that are generated by the cloud control.
    --supported-cloud-providers=: Set supported_cloud_providers to new value.
    --supported-target-resource-types=: Set supported_target_resource_types to new value.
completion:
    flag:
        severity:
            - critical
            - high
            - low
            - medium
documentation:
    command: |
        Update a specific cloud control.
    flag:
        add-categories: |-
            Add new value to categories list. _ADD_CATEGORIES_ must be one of:
            +
            *cc-category-artificial-intelligence*::: The artificial intelligence category.
            *cc-category-bcdr*::: The business continuity and disaster recovery (BCDR) category.
            *cc-category-data-security*::: The data security category.
            *cc-category-encryption*::: The encryption category.
            *cc-category-hr-admin-and-processes*::: The HR, admin, and processes category.
            *cc-category-identity-and-access-management*::: The identity and access management category.
            *cc-category-incident-management*::: The incident management category.
            *cc-category-infrastructure*::: The infrastructure security category.
            *cc-category-legal-and-disclosures*::: The legal and disclosures category.
            *cc-category-logs-management-and-infrastructure*::: The logs management and infrastructure category.
            *cc-category-network-security*::: The network security category.
            *cc-category-physical-security*::: The physical security category.
            *cc-category-privacy*::: The privacy category.
            *cc-category-third-party-and-sub-processor-management*::: The third-party and sub-processor management category.
            *cc-category-vulnerability-management*::: The vulnerability management category.
            :::
            +
        add-parameter-spec: |-
            Add new value to parameter_spec list. The parameter specifications for the cloud control.
            +
            *defaultValue*:::
            The default value of the parameter.
            +
            *boolValue*::::
            A boolean value.
            +
            *numberValue*::::
            A double value.
            +
            *stringListValue*::::
            A repeated string.
            +
            *values*:::::
            The strings in the list.
            +
            *stringValue*::::
            A string value.
            +
            *description*:::
            The description of the parameter. The maximum length is 2000 characters.
            +
            *displayName*:::
            The friendly name of the parameter. The maximum length is 200 characters.
            +
            *isRequired*:::
            Whether the parameter is required.
            +
            *name*:::
            The name of the parameter.
            +
            *substitutionRules*:::
            The list of parameter substitutions.
            +
            *attributeSubstitutionRule*::::
            The attribute substitution rule.
            +
            *attribute*:::::
            The fully qualified proto attribute path, in dot notation.
            For example: `rules[0].cel_expression.resource_types_values`.
            +
            *placeholderSubstitutionRule*::::
            The placeholder substitution rule.
            +
            *attribute*:::::
            The fully qualified proto attribute path, in dot notation.
            +
            *validation*:::
            The permitted set of values for the parameter.
            +
            *allowedValues*::::
            The permitted set of values for the parameter.
            +
            *values*:::::
            The list of allowed values for the parameter.
            +
            *boolValue*::::::
            A boolean value.
            +
            *numberValue*::::::
            A double value.
            +
            *stringListValue*::::::
            A repeated string.
            +
            *values*:::::::
            The strings in the list.
            +
            *stringValue*::::::
            A string value.
            +
            *intRange*::::
            The permitted range for numeric parameters.
            +
            *max*:::::
            The maximum permitted value for the numeric parameter (inclusive).
            +
            *min*:::::
            The minimum permitted value for the numeric parameter (inclusive).
            +
            *regexpPattern*::::
            The regular expression for string parameters.
            +
            *pattern*:::::
            The regex pattern to match the values of the parameter with.
            +
            *valueType*:::
            The parameter value type.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --add-parameter-spec=defaultValue={boolValue=boolean,numberValue=float,stringListValue={values=[string]},stringValue=string},description=string,displayName=string,isRequired=boolean,name=string,substitutionRules=[{attributeSubstitutionRule={attribute=string},placeholderSubstitutionRule={attribute=string}}],validation={allowedValues={values=[{boolValue=boolean,numberValue=float,stringListValue={values=[string]},stringValue=string}]},intRange={max=int,min=int},regexpPattern={pattern=string}},valueType=string --add-parameter-spec=defaultValue={boolValue=boolean,numberValue=float,stringListValue={values=[string]},stringValue=string},description=string,displayName=string,isRequired=boolean,name=string,substitutionRules=[{attributeSubstitutionRule={attribute=string},placeholderSubstitutionRule={attribute=string}}],validation={allowedValues={values=[{boolValue=boolean,numberValue=float,stringListValue={values=[string]},stringValue=string}]},intRange={max=int,min=int},regexpPattern={pattern=string}},valueType=string
