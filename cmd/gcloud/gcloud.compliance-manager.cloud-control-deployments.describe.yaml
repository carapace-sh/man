name: describe
description: Get a cloud control deployment.
flags:
    --location=: The location id of the cloudControlDeployment resource.
    --organization=: The organization id of the cloudControlDeployment resource.
documentation:
    command: |
        Get the details for a specific cloud control deployment.
    flag:
        location: |-
            The location id of the cloudControlDeployment resource.
            +
            To set the `location` attribute:
            * provide the argument `cloud_control_deployment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        organization: |-
            The organization id of the cloudControlDeployment resource.
            +
            To set the `organization` attribute:
            * provide the argument `cloud_control_deployment` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
