name: modify-default-credit-specification
description: Modifies the default credit option for CPU usage of burstable performance instances.
flags:
    --cpu-credits=!: The credit option for CPU usage of the instance family.
    --dry-run: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response.
    --instance-family=!: The instance family.
    --no-dry-run&: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response.
completion:
    flag:
        instance-family:
            - t2
            - t3
            - t3a
            - t4g
documentation:
    command: |-
        Modifies the default credit option for CPU usage of burstable performance instances. The default credit option is set at the account level per Amazon Web Services Region, and is specified per instance family. All new burstable performance instances in the account launch using the default credit option.

        `ModifyDefaultCreditSpecification` is an asynchronous operation, which works at an Amazon Web Services Region level and modifies the credit option for each Availability Zone. All zones in a Region are updated within five minutes. But if instances are launched during this operation, they might not get the new credit option until the zone is updated. To verify whether the update has occurred, you can call `GetDefaultCreditSpecification` and check `DefaultCreditSpecification` for updates.

        For more information, see [Burstable performance instances](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/burstable-performance-instances.html) in the *Amazon EC2 User Guide*.
    flag:
        cpu-credits: |-
            The credit option for CPU usage of the instance family.

            Valid Values: `standard` | `unlimited`
        dry-run: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        instance-family: The instance family.
