name: update-feature
description: Updates an existing feature.
flags:
    --add-or-update-variations=:
        description: To update variation configurations for this feature, or add new ones, specify this structure.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --default-variation=: The name of the variation to use as the default variation.
    --description=: An optional description of the feature.
    --entity-overrides=: Specified users that should always be served a specific variation of a feature.
    --evaluation-strategy=: Specify `ALL_RULES` to activate the traffic allocation specified by any ongoing launches or experiments.
    --feature=!: The name of the feature to be updated.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --project=!: The name or ARN of the project that contains the feature to be updated.
    --remove-variations=:
        description: Removes a variation from the feature.
        nargs: -1
completion:
    flag:
        evaluation-strategy:
            - ALL_RULES
            - DEFAULT_VARIATION
documentation:
    command: |-
        Updates an existing feature.

        You can't use this operation to update the tags of an existing feature. Instead, use [TagResource](https://docs.aws.amazon.com/cloudwatchevidently/latest/APIReference/API_TagResource.html).
    flag:
        add-or-update-variations: To update variation configurations for this feature, or add new ones, specify this structure. In this array, include any variations that you want to add or update. If the array includes a variation name that already exists for this feature, it is updated. If it includes a new variation name, it is added as a new variation.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        default-variation: The name of the variation to use as the default variation. The default variation is served to users who are not allocated to any ongoing launches or experiments of this feature.
        description: An optional description of the feature.
        entity-overrides: |-
            Specified users that should always be served a specific variation of a feature. Each user is specified by a key-value pair . For each key, specify a user by entering their user ID, account ID, or some other identifier. For the value, specify the name of the variation that they are to be served.

            This parameter is limited to 2500 overrides or a total of 40KB. The 40KB limit includes an overhead of 6 bytes per override.
        evaluation-strategy: Specify `ALL_RULES` to activate the traffic allocation specified by any ongoing launches or experiments. Specify `DEFAULT_VARIATION` to serve the default variation to all users instead.
        feature: The name of the feature to be updated.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        project: The name or ARN of the project that contains the feature to be updated.
        remove-variations: |-
            Removes a variation from the feature. If the variation you specify doesn't exist, then this makes no change and does not report an error.

            This operation fails if you try to remove a variation that is part of an ongoing launch or experiment.
