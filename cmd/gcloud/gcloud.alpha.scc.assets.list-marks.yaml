documentation:
    command: |4-
        *(ALPHA)*  *(DEPRECATED)*  Security Command Center Asset APIs are deprecated and will be removed on or after
        June 26, 2024. Use Cloud Asset Inventory instead [(gcloud asset)](https://cloud.google.com/sdk/gcloud/reference/asset).
        For more information, [see the deprecation notice at Assets Page](https://cloud.google.com/security-command-center/docs/how-to-use-security-command-center#assets_page).


        List an assets's security marks.
    flag:
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        organization: |-
            (Optional) If the full resource name isn't provided e.g. organizations/123, then provide the
            organization id which is the suffix of the organization. Example: organizations/123, the id is
            123.
            +

            To set the `organization` attribute:
            * provide the argument `asset` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line;
            * Set the organization property in configuration using `gcloud config set scc/organization` if it is not specified in command line..
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is determined by the
            service if it supports paging, otherwise it is *unlimited* (no paging).
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        page-token: |-
            Response objects will return a non-null value for page-token to indicate that there is at least
            one additional page of data. User can either directly request that page by specifying the
            page-token explicitly or let gcloud fetch one-page-at-a-time.
        read-time: |-
            Time used as a reference point when filtering. Absence of this field will default to the API's
            version of NOW. See `$ gcloud topic datetimes` for information on supported time formats.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
