name: list-application-operations
description: Lists all the operations performed for the specified application such as UpdateApplication, StartApplication etc.
flags:
    --application-name=!: ""
    --limit=: ""
    --next-token=: ""
    --operation-status=: ""
    --operation=: ""
completion:
    flag:
        operation-status:
            - IN_PROGRESS
            - CANCELLED
            - SUCCESSFUL
            - FAILED
documentation:
    command: |-
        Lists all the operations performed for the specified application such as UpdateApplication, StartApplication etc. The response also includes a summary of the operation.

        To get the complete description of a specific operation, invoke the [DescribeApplicationOperation]() operation.

        This operation is supported only for Managed Service for Apache Flink.
    flag:
        application-name: ""
        limit: ""
        next-token: ""
        operation: ""
        operation-status: ""
