name: describe-conditional-forwarders
description: Obtains information about the conditional forwarders for this account.
flags:
    --directory-id=!: The directory ID for which to get the list of associated conditional forwarders.
    --remote-domain-names=: The fully qualified domain names (FQDN) of the remote domains for which to get the list of associated conditional forwarders.
documentation:
    command: |-
        Obtains information about the conditional forwarders for this account.

        If no input parameters are provided for RemoteDomainNames, this request describes all conditional forwarders for the specified directory ID.
    flag:
        directory-id: The directory ID for which to get the list of associated conditional forwarders.
        remote-domain-names: The fully qualified domain names (FQDN) of the remote domains for which to get the list of associated conditional forwarders. If this member is null, all conditional forwarders are returned.
