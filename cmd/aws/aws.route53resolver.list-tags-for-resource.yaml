name: list-tags-for-resource
description: Lists the tags that you associated with the specified resource.
flags:
    --max-results=: The maximum number of tags that you want to return in the response to a `ListTagsForResource` request.
    --next-token=: For the first `ListTagsForResource` request, omit this value.
    --resource-arn=!: The Amazon Resource Name (ARN) for the resource that you want to list tags for.
documentation:
    command: Lists the tags that you associated with the specified resource.
    flag:
        max-results: The maximum number of tags that you want to return in the response to a `ListTagsForResource` request. If you don't specify a value for `MaxResults`, Resolver returns up to 100 tags.
        next-token: |-
            For the first `ListTagsForResource` request, omit this value.

            If you have more than `MaxResults` tags, you can submit another `ListTagsForResource` request to get the next group of tags for the resource. In the next request, specify the value of `NextToken` from the previous response.
        resource-arn: The Amazon Resource Name (ARN) for the resource that you want to list tags for.
