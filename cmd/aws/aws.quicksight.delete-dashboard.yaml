name: delete-dashboard
description: Deletes a dashboard.
flags:
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the dashboard that you're deleting.
    --dashboard-id=!: The ID for the dashboard.
    --version-number=: The version number of the dashboard.
documentation:
    command: Deletes a dashboard.
    flag:
        aws-account-id: The ID of the Amazon Web Services account that contains the dashboard that you're deleting.
        dashboard-id: The ID for the dashboard.
        version-number: The version number of the dashboard. If the version number property is provided, only the specified version of the dashboard is deleted.
