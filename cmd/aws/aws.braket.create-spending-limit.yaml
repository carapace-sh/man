name: create-spending-limit
description: Creates a spending limit for a specified quantum device.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=!: A unique, case-sensitive identifier to ensure that the operation completes no more than one time.
    --device-arn=!: The Amazon Resource Name (ARN) of the quantum device to apply the spending limit to.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --spending-limit=!: The maximum amount that can be spent on the specified device, in USD.
    --tags=: The tags to apply to the spending limit.
    --time-period=: The time period during which the spending limit is active, including start and end dates.
documentation:
    command: Creates a spending limit for a specified quantum device. Spending limits help you control costs by setting maximum amounts that can be spent on quantum computing tasks within a specified time period. Simulators do not support spending limits.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier to ensure that the operation completes no more than one time. If this token matches a previous request, Amazon Braket ignores the request, but does not return an error.
        device-arn: The Amazon Resource Name (ARN) of the quantum device to apply the spending limit to.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        spending-limit: The maximum amount that can be spent on the specified device, in USD.
        tags: The tags to apply to the spending limit. Each tag consists of a key and an optional value.
        time-period: The time period during which the spending limit is active, including start and end dates.
