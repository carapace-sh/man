name: bitbucket-data-center
description: '*(ALPHA)*  Update a Cloud Build Connection of type Bitbucket Data Center.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --authorizer-token-secret-version=: Secret containing the REPO_ADMIN personal access token.
    --host-uri=: URI of the Bitbucket Data Center instance.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --read-authorizer-token-secret-version=: Secret containing the REPO_READ personal access token.
    --region=: The Google Cloud region.
    --service-directory-service=: Service Directory service resource to use for accessing the Bitbucket Data Center.
    --ssl-ca-file=: File containing the SSL_CA to be used.
documentation:
    command: |
        *(ALPHA)*  Update a Cloud Build Connection of type Bitbucket Data Center.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        authorizer-token-secret-version: Secret containing the REPO_ADMIN personal access token.
        host-uri: URI of the Bitbucket Data Center instance.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        read-authorizer-token-secret-version: Secret containing the REPO_READ personal access token.
        region: |-
            The Google Cloud region.
            +
            To set the `region` attribute:
            * provide the argument `connection` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `builds/region`.
        service-directory-service: Service Directory service resource to use for accessing the Bitbucket Data Center. Necessary only if the server has no public access from the internet.
        ssl-ca-file: File containing the SSL_CA to be used.
