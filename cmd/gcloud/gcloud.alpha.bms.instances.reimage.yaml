name: reimage
description: '*(ALPHA)*  Reimage a Bare Metal Solution instance.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --kms-crypto-key-version=: Resource ID of a KMS CryptoKeyVersion used to encrypt the initial password.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --os-image=!: OS image to install on the server.
    --region=: Region of the resource.
    --ssh-keys=!: IDs of the SSH keys or fully qualified identifiers for the SSH keys.
documentation:
    command: |
        *(ALPHA)*  Reimage a Bare Metal Solution instance.

        This call returns immediately, but the reimage operation may take
        several minutes to complete. To check if the operation is complete,
        use the `describe` command for the instance.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        kms-crypto-key-version: |-
            Resource ID of a KMS CryptoKeyVersion used to encrypt the initial password.
            +
            https://cloud.google.com/kms/docs/resource-hierarchy#key_versions
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        os-image: |-
            OS image to install on the server.
            +
            To list all OS image codes supported by BMS, run:
            +
                $ gcloud bms os-images list
        region: |-
            Region of the resource.
            +
            To set the `region` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
        ssh-keys: |-
            IDs of the SSH keys or fully qualified identifiers for the SSH keys.
            +
            To set the `ssh_key` attribute:
            * provide the argument `--ssh-keys` on the command line.
