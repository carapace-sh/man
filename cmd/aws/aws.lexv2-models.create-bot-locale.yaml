name: create-bot-locale
description: Creates a locale in the bot.
flags:
    --bot-id=!: The identifier of the bot to create the locale for.
    --bot-version=!: The version of the bot to create the locale for.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description of the bot locale.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --generative-ai-settings=: ""
    --locale-id=!: The identifier of the language and locale that the bot will be used in.
    --nlu-intent-confidence-threshold=!: Determines the threshold where Amazon Lex will insert the `AMAZON.FallbackIntent`, `AMAZON.KendraSearchIntent`, or both when returning alternative intents.
    --speech-detection-sensitivity=: The sensitivity level for voice activity detection (VAD) in the bot locale.
    --voice-settings=: The Amazon Polly voice ID that Amazon Lex uses for voice interaction with the user.
completion:
    flag:
        speech-detection-sensitivity:
            - Default
            - HighNoiseTolerance
            - MaximumNoiseTolerance
documentation:
    command: Creates a locale in the bot. The locale contains the intents and slot types that the bot uses in conversations with users in the specified language and locale. You must add a locale to a bot before you can add intents and slot types to the bot.
    flag:
        bot-id: The identifier of the bot to create the locale for.
        bot-version: The version of the bot to create the locale for. This can only be the draft version of the bot.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description of the bot locale. Use this to help identify the bot locale in lists.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generative-ai-settings: ""
        locale-id: The identifier of the language and locale that the bot will be used in. The string must match one of the supported locales. All of the intents, slot types, and slots used in the bot must have the same locale. For more information, see [Supported languages](https://docs.aws.amazon.com/lexv2/latest/dg/how-languages.html).
        nlu-intent-confidence-threshold: |-
            Determines the threshold where Amazon Lex will insert the `AMAZON.FallbackIntent`, `AMAZON.KendraSearchIntent`, or both when returning alternative intents. `AMAZON.FallbackIntent` and `AMAZON.KendraSearchIntent` are only inserted if they are configured for the bot.

            For example, suppose a bot is configured with the confidence threshold of 0.80 and the `AMAZON.FallbackIntent`. Amazon Lex returns three alternative intents with the following confidence scores: IntentA (0.70), IntentB (0.60), IntentC (0.50). The response from the `RecognizeText` operation would be:

            - AMAZON.FallbackIntent
            - IntentA
            - IntentB
            - IntentC
        speech-detection-sensitivity: The sensitivity level for voice activity detection (VAD) in the bot locale. This setting helps optimize speech recognition accuracy by adjusting how the system responds to background noise during voice interactions.
        voice-settings: The Amazon Polly voice ID that Amazon Lex uses for voice interaction with the user.
