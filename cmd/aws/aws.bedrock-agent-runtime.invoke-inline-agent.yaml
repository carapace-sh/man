name: invoke-inline-agent
description: Invokes an inline Amazon Bedrock agent using the configurations you provide with the request.
flags:
    --action-groups=: A list of action groups with each action group defining the action the inline agent needs to carry out.
    --agent-collaboration=: Defines how the inline collaborator agent handles information across multiple collaborator agents to coordinate a final response.
    --agent-name=: The name for the agent.
    --bedrock-model-configurations=: Model settings for the request.
    --collaborator-configurations=: Settings for an inline agent collaborator called with [InvokeInlineAgent](https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_InvokeInlineAgent.html).
    --collaborators=: List of collaborator inline agents.
    --custom-orchestration=: Contains details of the custom orchestration configured for the agent.
    --customer-encryption-key-arn=: The Amazon Resource Name (ARN) of the Amazon Web Services KMS key to use to encrypt your inline agent.
    --enable-trace: Specifies whether to turn on the trace or not to track the agent's reasoning process.
    --end-session: Specifies whether to end the session with the inline agent or not.
    --foundation-model=!: The [model identifier (ID)](https://docs.aws.amazon.com/bedrock/latest/userguide/model-ids.html#model-ids-arns) of the model to use for orchestration by the inline agent.
    --guardrail-configuration=: The [guardrails](https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html) to assign to the inline agent.
    --idle-session-ttlin-seconds=: The number of seconds for which the inline agent should maintain session information.
    --inline-session-state=: Parameters that specify the various attributes of a sessions.
    --input-text=: The prompt text to send to the agent.
    --instruction=!: The instructions that tell the inline agent what it should do and how it should interact with users.
    --knowledge-bases=: Contains information of the knowledge bases to associate with.
    --no-enable-trace: Specifies whether to turn on the trace or not to track the agent's reasoning process.
    --no-end-session: Specifies whether to end the session with the inline agent or not.
    --orchestration-type=: Specifies the type of orchestration strategy for the agent.
    --prompt-creation-configurations=: Specifies parameters that control how the service populates the agent prompt for an `InvokeInlineAgent` request.
    --prompt-override-configuration=: Configurations for advanced prompts used to override the default prompts to enhance the accuracy of the inline agent.
    --session-id=!: The unique identifier of the session.
    --streaming-configurations=: Specifies the configurations for streaming.
completion:
    flag:
        agent-collaboration:
            - SUPERVISOR
            - SUPERVISOR_ROUTER
            - DISABLED
        orchestration-type:
            - DEFAULT
            - CUSTOM_ORCHESTRATION
documentation:
    command: "Invokes an inline Amazon Bedrock agent using the configurations you provide with the request.\n\n- Specify the following fields for security purposes.\n  \n  - (Optional) `customerEncryptionKeyArn` – The Amazon Resource Name (ARN) of a KMS key to encrypt the creation of the agent.\n  - (Optional) `idleSessionTTLinSeconds` – Specify the number of seconds for which the agent should maintain session information. After this time expires, the subsequent `InvokeInlineAgent` request begins a new session.\n- To override the default prompt behavior for agent orchestration and to use advanced prompts, include a `promptOverrideConfiguration` object. For more information, see [Advanced prompts](https://docs.aws.amazon.com/bedrock/latest/userguide/advanced-prompts.html).\n- The agent instructions will not be honored if your agent has only one knowledge base, uses default prompts, has no action group, and user input is disabled."
    flag:
        action-groups: A list of action groups with each action group defining the action the inline agent needs to carry out.
        agent-collaboration: Defines how the inline collaborator agent handles information across multiple collaborator agents to coordinate a final response. The inline collaborator agent can also be the supervisor.
        agent-name: The name for the agent.
        bedrock-model-configurations: Model settings for the request.
        collaborator-configurations: Settings for an inline agent collaborator called with [InvokeInlineAgent](https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_InvokeInlineAgent.html).
        collaborators: List of collaborator inline agents.
        custom-orchestration: Contains details of the custom orchestration configured for the agent.
        customer-encryption-key-arn: The Amazon Resource Name (ARN) of the Amazon Web Services KMS key to use to encrypt your inline agent.
        enable-trace: Specifies whether to turn on the trace or not to track the agent's reasoning process. For more information, see [Using trace](https://docs.aws.amazon.com/bedrock/latest/userguide/trace-events.html).
        end-session: Specifies whether to end the session with the inline agent or not.
        foundation-model: The [model identifier (ID)](https://docs.aws.amazon.com/bedrock/latest/userguide/model-ids.html#model-ids-arns) of the model to use for orchestration by the inline agent. For example, `meta.llama3-1-70b-instruct-v1:0`.
        guardrail-configuration: The [guardrails](https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html) to assign to the inline agent.
        idle-session-ttlin-seconds: |-
            The number of seconds for which the inline agent should maintain session information. After this time expires, the subsequent `InvokeInlineAgent` request begins a new session.

            A user interaction remains active for the amount of time specified. If no conversation occurs during this time, the session expires and the data provided before the timeout is deleted.
        inline-session-state: |-
            Parameters that specify the various attributes of a sessions. You can include attributes for the session or prompt or, if you configured an action group to return control, results from invocation of the action group. For more information, see [Control session context](https://docs.aws.amazon.com/bedrock/latest/userguide/agents-session-state.html).

            If you include `returnControlInvocationResults` in the `sessionState` field, the `inputText` field will be ignored.
        input-text: |-
            The prompt text to send to the agent.

            If you include `returnControlInvocationResults` in the `sessionState` field, the `inputText` field will be ignored.
        instruction: The instructions that tell the inline agent what it should do and how it should interact with users.
        knowledge-bases: Contains information of the knowledge bases to associate with.
        orchestration-type: Specifies the type of orchestration strategy for the agent. This is set to DEFAULT orchestration type, by default.
        prompt-creation-configurations: Specifies parameters that control how the service populates the agent prompt for an `InvokeInlineAgent` request. You can control which aspects of previous invocations in the same agent session the service uses to populate the agent prompt. This gives you more granular control over the contextual history that is used to process the current request.
        prompt-override-configuration: Configurations for advanced prompts used to override the default prompts to enhance the accuracy of the inline agent.
        session-id: The unique identifier of the session. Use the same value across requests to continue the same conversation.
        streaming-configurations: |-
            Specifies the configurations for streaming.

            To use agent streaming, you need permissions to perform the `bedrock:InvokeModelWithResponseStream` action.
