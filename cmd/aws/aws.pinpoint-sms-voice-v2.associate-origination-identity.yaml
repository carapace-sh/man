name: associate-origination-identity
description: Associates the specified origination identity with a pool.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --iso-country-code=!: The new two-character code, in ISO 3166-1 alpha-2 format, for the country or region of the origination identity.
    --origination-identity=!: The origination identity to use, such as PhoneNumberId, PhoneNumberArn, SenderId, or SenderIdArn.
    --pool-id=!: The pool to update with the new Identity.
documentation:
    command: |-
        Associates the specified origination identity with a pool.

        If the origination identity is a phone number and is already associated with another pool, an error is returned. A sender ID can be associated with multiple pools.

        If the origination identity configuration doesn't match the pool's configuration, an error is returned.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If you don't specify a client token, a randomly generated token is used for the request to ensure idempotency.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        iso-country-code: The new two-character code, in ISO 3166-1 alpha-2 format, for the country or region of the origination identity.
        origination-identity: |-
            The origination identity to use, such as PhoneNumberId, PhoneNumberArn, SenderId, or SenderIdArn. You can use [DescribePhoneNumbers]() to find the values for PhoneNumberId and PhoneNumberArn, while [DescribeSenderIds]() can be used to get the values for SenderId and SenderIdArn.

            If you are using a shared End User MessagingSMS resource then you must use the full Amazon Resource Name(ARN).
        pool-id: |-
            The pool to update with the new Identity. This value can be either the PoolId or PoolArn, and you can find these values using [DescribePools](https://docs.aws.amazon.com/pinpoint/latest/apireference_smsvoicev2/API_DescribePools.html).

            If you are using a shared End User MessagingSMS; resource then you must use the full Amazon Resource Name(ARN).
