name: setup
description: '*(ALPHA)*  Setup SAS Analytics for the current project.'
hidden: true
flags:
    --user-id=: User ID to provision analytics for.
documentation:
    command: |-
        *(ALPHA)*  This will create the necessary Pub/Sub Schemas/Topics/Subscriptions and the
        BigQuery tables that will store the data.

        ## EXAMPLES

          $ gcloud cbrs-spectrum-access analytics setup
    flag:
        user-id: User ID to provision analytics for. This is useful when reusing the same project to provision analytics for multiple user IDs. Otherwise the user ID associated with the current Google Cloud project is used.
