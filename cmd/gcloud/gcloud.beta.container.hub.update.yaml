name: update
description: '*(BETA)*  Update a fleet.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --binauthz-evaluation-mode=: Configure binary authorization mode for clusters to onboard the fleet,
    --binauthz-policy-bindings=: The relative resource name of the Binary Authorization policy to audit
    --clear-labels: Remove all labels.
    --compliance-standards=&: To configure compliance standards for clusters in the fleet supply a
    --compliance=&: To enable compliance for clusters in the fleet,
    --display-name=: Display name of the fleet to be created (optional).
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-labels&: Remove all labels.
    --remove-labels=: List of label keys to remove.
    --security-posture=: To apply standard security posture to clusters in the fleet,
    --update-labels=: List of label KEY=VALUE pairs to update.
    --workload-vulnerability-scanning=: To apply standard vulnerability scanning to clusters in the fleet,
completion:
    flag:
        binauthz-evaluation-mode:
            - disabled
            - policy-bindings
        compliance:
            - enabled
            - disabled
        security-posture:
            - disabled
            - standard
            - enterprise
        workload-vulnerability-scanning:
            - disabled
            - standard
            - enterprise
documentation:
    command: |-
        *(BETA)*  This command can fail for the following reasons:
        * The project specified does not exist.
        * The project specified already has a fleet.
        * The active account does not have permission to access the given project.

        ## EXAMPLES

        To update the display name of the fleet in project `example-foo-bar-1`
        to `updated-name`, run:

          $ gcloud beta container hub update --display-name=updated-name --project=example-foo-bar-1
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        binauthz-evaluation-mode: |-
            Configure binary authorization mode for clusters to onboard the fleet,
            +
              $ {command} --binauthz-evaluation-mode=policy-bindings
            +
            _BINAUTHZ_EVALUATION_MODE_ must be one of: *disabled*, *policy-bindings*.
        binauthz-policy-bindings: |-
            The relative resource name of the Binary Authorization policy to audit
            and/or enforce. GKE policies have the following format:
            `projects/{project_number}/platforms/gke/policies/{policy_id}`.
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        compliance: |+
            To enable compliance for clusters in the fleet,

              $ {command} --compliance=enabled

            To disable compliance for clusters in the fleet,

              $ {command} --compliance=disabled

        compliance-standards: |
            To configure compliance standards for clusters in the fleet supply a
            comma-delimited list:

              $ {command} --compliance-standards=standard-1,standard-2

            If this flag is supplied, it cannot be empty.
        display-name: Display name of the fleet to be created (optional). 4-30 characters, alphanumeric and [ '"!-] only.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        security-posture: |-
            To apply standard security posture to clusters in the fleet,
            +
              $ {command} --security-posture=standard
            +
            _SECURITY_POSTURE_ must be one of: *disabled*, *standard*, *enterprise*.
        update-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        workload-vulnerability-scanning: |-
            To apply standard vulnerability scanning to clusters in the fleet,
            +
              $ {command} --workload-vulnerability-scanning=standard
            +
            _WORKLOAD_VULNERABILITY_SCANNING_ must be one of: *disabled*, *standard*, *enterprise*.
