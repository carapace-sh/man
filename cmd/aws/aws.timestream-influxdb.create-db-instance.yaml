name: create-db-instance
description: Creates a new Timestream for InfluxDB DB instance.
flags:
    --allocated-storage=!: The amount of storage to allocate for your DB storage type in GiB (gibibytes).
    --bucket=: The name of the initial InfluxDB bucket.
    --db-instance-type=!: The Timestream for InfluxDB DB instance type to run InfluxDB on.
    --db-parameter-group-identifier=: The id of the DB parameter group to assign to your DB instance.
    --db-storage-type=: The Timestream for InfluxDB DB storage type to read and write InfluxDB data.
    --deployment-type=: Specifies whether the DB instance will be deployed as a standalone instance or with a Multi-AZ standby for high availability.
    --log-delivery-configuration=: Configuration for sending InfluxDB engine logs to a specified S3 bucket.
    --name=!: The name that uniquely identifies the DB instance when interacting with the Amazon Timestream for InfluxDB API and CLI commands.
    --network-type=: Specifies whether the networkType of the Timestream for InfluxDB instance is IPV4, which can communicate over IPv4 protocol only, or DUAL, which can communicate over both IPv4 and IPv6 protocols.
    --no-publicly-accessible&: Configures the DB instance with a public IP to facilitate access.
    --organization=: The name of the initial organization for the initial admin user in InfluxDB.
    --password=!: The password of the initial admin user created in InfluxDB v2.
    --port=: The port number on which InfluxDB accepts connections.
    --publicly-accessible: Configures the DB instance with a public IP to facilitate access.
    --tags=: A list of key-value pairs to associate with the DB instance.
    --username=: The username of the initial admin user created in InfluxDB.
    --vpc-security-group-ids=!: A list of VPC security group IDs to associate with the DB instance.
    --vpc-subnet-ids=!: A list of VPC subnet IDs to associate with the DB instance.
completion:
    flag:
        db-instance-type:
            - db.influx.medium
            - db.influx.large
            - db.influx.xlarge
            - db.influx.2xlarge
            - db.influx.4xlarge
            - db.influx.8xlarge
            - db.influx.12xlarge
            - db.influx.16xlarge
            - db.influx.24xlarge
        db-storage-type:
            - InfluxIOIncludedT1
            - InfluxIOIncludedT2
            - InfluxIOIncludedT3
        deployment-type:
            - SINGLE_AZ
            - WITH_MULTIAZ_STANDBY
        network-type:
            - IPV4
            - DUAL
documentation:
    command: Creates a new Timestream for InfluxDB DB instance.
    flag:
        allocated-storage: The amount of storage to allocate for your DB storage type in GiB (gibibytes).
        bucket: The name of the initial InfluxDB bucket. All InfluxDB data is stored in a bucket. A bucket combines the concept of a database and a retention period (the duration of time that each data point persists). A bucket belongs to an organization.
        db-instance-type: The Timestream for InfluxDB DB instance type to run InfluxDB on.
        db-parameter-group-identifier: The id of the DB parameter group to assign to your DB instance. DB parameter groups specify how the database is configured. For example, DB parameter groups can specify the limit for query concurrency.
        db-storage-type: |-
            The Timestream for InfluxDB DB storage type to read and write InfluxDB data.

            You can choose between 3 different types of provisioned Influx IOPS included storage according to your workloads requirements:

            - Influx IO Included 3000 IOPS
            - Influx IO Included 12000 IOPS
            - Influx IO Included 16000 IOPS
        deployment-type: Specifies whether the DB instance will be deployed as a standalone instance or with a Multi-AZ standby for high availability.
        log-delivery-configuration: Configuration for sending InfluxDB engine logs to a specified S3 bucket.
        name: The name that uniquely identifies the DB instance when interacting with the Amazon Timestream for InfluxDB API and CLI commands. This name will also be a prefix included in the endpoint. DB instance names must be unique per customer and per region.
        network-type: Specifies whether the networkType of the Timestream for InfluxDB instance is IPV4, which can communicate over IPv4 protocol only, or DUAL, which can communicate over both IPv4 and IPv6 protocols.
        organization: The name of the initial organization for the initial admin user in InfluxDB. An InfluxDB organization is a workspace for a group of users.
        password: The password of the initial admin user created in InfluxDB v2. This password will allow you to access the InfluxDB UI to perform various administrative tasks and also use the InfluxDB CLI to create an operator token. These attributes will be stored in a Secret created in Secrets Manager in your account.
        port: |-
            The port number on which InfluxDB accepts connections.

            Valid Values: 1024-65535

            Default: 8086

            Constraints: The value can't be 2375-2376, 7788-7799, 8090, or 51678-51680
        publicly-accessible: Configures the DB instance with a public IP to facilitate access.
        tags: A list of key-value pairs to associate with the DB instance.
        username: The username of the initial admin user created in InfluxDB. Must start with a letter and can't end with a hyphen or contain two consecutive hyphens. For example, my-user1. This username will allow you to access the InfluxDB UI to perform various administrative tasks and also use the InfluxDB CLI to create an operator token. These attributes will be stored in a Secret created in Amazon Secrets Manager in your account.
        vpc-security-group-ids: A list of VPC security group IDs to associate with the DB instance.
        vpc-subnet-ids: A list of VPC subnet IDs to associate with the DB instance. Provide at least two VPC subnet IDs in different availability zones when deploying with a Multi-AZ standby.
