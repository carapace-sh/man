name: create-email-contact
description: Creates an email contact for the provided email address.
flags:
    --email-address=!: The email address this email contact points to.
    --name=!: The name of the email contact.
    --tags=: A map of tags assigned to a resource.
documentation:
    command: Creates an email contact for the provided email address.
    flag:
        email-address: |-
            The email address this email contact points to. The activation email and any subscribed emails are sent here.

            This email address can't receive emails until it's activated.
        name: The name of the email contact.
        tags: A map of tags assigned to a resource. A tag is a string-to-string map of key-value pairs.
