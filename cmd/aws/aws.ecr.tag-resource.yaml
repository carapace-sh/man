name: tag-resource
description: Adds specified tags to a resource with the specified ARN.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the the resource to which to add tags.
    --tags=!: The tags to add to the resource.
documentation:
    command: Adds specified tags to a resource with the specified ARN. Existing tags on a resource are not changed if they are not specified in the request parameters.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the the resource to which to add tags. Currently, the only supported resource is an Amazon ECR repository.
        tags: The tags to add to the resource. A tag is an array of key-value pairs. Tag keys can have a maximum character length of 128 characters, and tag values can have a maximum length of 256 characters.
