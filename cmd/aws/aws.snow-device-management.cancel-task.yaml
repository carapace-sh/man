name: cancel-task
description: Sends a cancel request for a specified task.
flags:
    --task-id=!: The ID of the task that you are attempting to cancel.
documentation:
    command: |-
        Sends a cancel request for a specified task. You can cancel a task only if it's still in a `QUEUED` state. Tasks that are already running can't be cancelled.

        A task might still run if it's processed from the queue before the `CancelTask` operation changes the task's state.
    flag:
        task-id: The ID of the task that you are attempting to cancel. You can retrieve a task ID by using the `ListTasks` operation.
