name: batch-update-standards-control-associations
description: For a batch of security controls and standards, this operation updates the enablement status of a control in a standard.
flags:
    --standards-control-association-updates=!: Updates the enablement status of a security control in a specified standard.
documentation:
    command: For a batch of security controls and standards, this operation updates the enablement status of a control in a standard.
    flag:
        standards-control-association-updates: |-
            Updates the enablement status of a security control in a specified standard.

            Calls to this operation return a `RESOURCE_NOT_FOUND_EXCEPTION` error when the standard subscription for the control has `StandardsControlsUpdatable` value `NOT_READY_FOR_UPDATES`.
