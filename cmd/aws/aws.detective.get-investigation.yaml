name: get-investigation
description: Detective investigations lets you investigate IAM users and IAM roles using indicators of compromise.
flags:
    --graph-arn=!: The Amazon Resource Name (ARN) of the behavior graph.
    --investigation-id=!: The investigation ID of the investigation report.
documentation:
    command: Detective investigations lets you investigate IAM users and IAM roles using indicators of compromise. An indicator of compromise (IOC) is an artifact observed in or on a network, system, or environment that can (with a high level of confidence) identify malicious activity or a security incident. `GetInvestigation` returns the investigation results of an investigation for a behavior graph.
    flag:
        graph-arn: The Amazon Resource Name (ARN) of the behavior graph.
        investigation-id: The investigation ID of the investigation report.
