name: list-traffic-distribution-group-users
description: Lists traffic distribution group users.
flags:
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
    --traffic-distribution-group-id=!: The identifier of the traffic distribution group.
documentation:
    command: Lists traffic distribution group users.
    flag:
        max-results: The maximum number of results to return per page.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        traffic-distribution-group-id: The identifier of the traffic distribution group. This can be the ID or the ARN if the API is being called in the Region where the traffic distribution group was created. The ARN must be provided if the call is from the replicated Region.
