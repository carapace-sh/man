name: get-config
description: '*(ALPHA)*  Get the Cloud Deploy config for the provided region and project.'
flags:
    --region=: ID of the location or fully qualified identifier for the location.
documentation:
    command: '*(ALPHA)*  Get the Cloud Deploy config for the provided region and project.'
    flag:
        region: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `region` attribute:
            * provide the argument `--region` on the command line;
            * set the property `deploy/region`.
