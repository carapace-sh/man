name: create-identity-center-application
description: Creates the WorkMail application in IAM Identity Center that can be used later in the WorkMail - IdC integration.
flags:
    --client-token=: The idempotency token associated with the request.
    --instance-arn=!: The Amazon Resource Name (ARN) of the instance.
    --name=!: The name of the IAM Identity Center application.
documentation:
    command: Creates the WorkMail application in IAM Identity Center that can be used later in the WorkMail - IdC integration. For more information, see PutIdentityProviderConfiguration. This action does not affect the authentication settings for any WorkMail organizations.
    flag:
        client-token: The idempotency token associated with the request.
        instance-arn: The Amazon Resource Name (ARN) of the instance.
        name: The name of the IAM Identity Center application.
