name: get-execution-history
description: Returns the history of the specified execution as a list of events.
flags:
    --execution-arn=!: The Amazon Resource Name (ARN) of the execution.
    --include-execution-data=: You can select whether execution data (input or output of a history event) is returned.
    --max-results=: The maximum number of results that are returned per call.
    --next-token=: If `nextToken` is returned, there are more results available.
    --reverse-order=: Lists events in descending order of their `timeStamp`.
documentation:
    command: |-
        Returns the history of the specified execution as a list of events. By default, the results are returned in ascending order of the `timeStamp` of the events. Use the `reverseOrder` parameter to get the latest events first.

        If `nextToken` is returned, there are more results available. The value of `nextToken` is a unique pagination token for each page. Make the call again using the returned token to retrieve the next page. Keep all other arguments unchanged. Each pagination token expires after 24 hours. Using an expired pagination token will return an *HTTP 400 InvalidToken* error.

        This API action is not supported by `EXPRESS` state machines.
    flag:
        execution-arn: The Amazon Resource Name (ARN) of the execution.
        include-execution-data: You can select whether execution data (input or output of a history event) is returned. The default is `true`.
        max-results: |-
            The maximum number of results that are returned per call. You can use `nextToken` to obtain further pages of results. The default is 100 and the maximum allowed page size is 1000. A value of 0 uses the default.

            This is only an upper limit. The actual number of results returned per call might be fewer than the specified maximum.
        next-token: If `nextToken` is returned, there are more results available. The value of `nextToken` is a unique pagination token for each page. Make the call again using the returned token to retrieve the next page. Keep all other arguments unchanged. Each pagination token expires after 24 hours. Using an expired pagination token will return an *HTTP 400 InvalidToken* error.
        reverse-order: Lists events in descending order of their `timeStamp`.
