name: detect-syntax
description: Inspects text for syntax and the part of speech of words in the document.
flags:
    --language-code=!: The language code of the input documents.
    --text=!: A UTF-8 string.
completion:
    flag:
        language-code:
            - en
            - es
            - fr
            - de
            - it
            - pt
documentation:
    command: Inspects text for syntax and the part of speech of words in the document. For more information, see [Syntax](https://docs.aws.amazon.com/comprehend/latest/dg/how-syntax.html) in the Comprehend Developer Guide.
    flag:
        language-code: 'The language code of the input documents. You can specify any of the following languages supported by Amazon Comprehend: German ("de"), English ("en"), Spanish ("es"), French ("fr"), Italian ("it"), or Portuguese ("pt").'
        text: A UTF-8 string. The maximum string size is 5 KB.
