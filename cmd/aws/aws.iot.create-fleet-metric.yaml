name: create-fleet-metric
description: Creates a fleet metric.
flags:
    --aggregation-field=!: The field to aggregate.
    --aggregation-type=!: The type of the aggregation query.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The fleet metric description.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --index-name=: The name of the index to search.
    --metric-name=!: The name of the fleet metric to create.
    --period=!: The time in seconds between fleet metric emissions.
    --query-string=!: The search query string.
    --query-version=: The query version.
    --tags=:
        description: Metadata, which can be used to manage the fleet metric.
        nargs: -1
    --unit=: Used to support unit transformation such as milliseconds to seconds.
completion:
    flag:
        unit:
            - Seconds
            - Microseconds
            - Milliseconds
            - Bytes
            - Kilobytes
            - Megabytes
            - Gigabytes
            - Terabytes
            - Bits
            - Kilobits
            - Megabits
            - Gigabits
            - Terabits
            - Percent
            - Count
            - Bytes/Second
            - Kilobytes/Second
            - Megabytes/Second
            - Gigabytes/Second
            - Terabytes/Second
            - Bits/Second
            - Kilobits/Second
            - Megabits/Second
            - Gigabits/Second
            - Terabits/Second
            - Count/Second
            - None
documentation:
    command: |-
        Creates a fleet metric.

        Requires permission to access the [CreateFleetMetric](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        aggregation-field: The field to aggregate.
        aggregation-type: The type of the aggregation query.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The fleet metric description.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        index-name: The name of the index to search.
        metric-name: The name of the fleet metric to create.
        period: The time in seconds between fleet metric emissions. Range \[60(1 min), 86400(1 day)] and must be multiple of 60.
        query-string: The search query string.
        query-version: The query version.
        tags: Metadata, which can be used to manage the fleet metric.
        unit: Used to support unit transformation such as milliseconds to seconds. The unit must be supported by [CW metric](https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/API_MetricDatum.html). Default to null.
