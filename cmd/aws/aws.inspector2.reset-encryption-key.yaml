name: reset-encryption-key
description: Resets an encryption key.
flags:
    --resource-type=!: The resource type the key encrypts.
    --scan-type=!: The scan type the key encrypts.
completion:
    flag:
        resource-type:
            - AWS_EC2_INSTANCE
            - AWS_ECR_CONTAINER_IMAGE
            - AWS_ECR_REPOSITORY
            - AWS_LAMBDA_FUNCTION
            - CODE_REPOSITORY
        scan-type:
            - NETWORK
            - PACKAGE
            - CODE
documentation:
    command: Resets an encryption key. After the key is reset your resources will be encrypted by an Amazon Web Services owned key.
    flag:
        resource-type: The resource type the key encrypts.
        scan-type: The scan type the key encrypts.
