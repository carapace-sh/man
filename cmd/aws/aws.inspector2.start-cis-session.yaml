name: start-cis-session
description: Starts a CIS session.
flags:
    --message=!: The start CIS session message.
    --scan-job-id=!: A unique identifier for the scan job.
documentation:
    command: Starts a CIS session. This API is used by the Amazon Inspector SSM plugin to communicate with the Amazon Inspector service. The Amazon Inspector SSM plugin calls this API to start a CIS scan session for the scan ID supplied by the service.
    flag:
        message: The start CIS session message.
        scan-job-id: A unique identifier for the scan job.
