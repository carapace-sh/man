name: create
description: Create a TagHold resource.
flags:
    --help-link=: A URL where an end user can learn more about removing this hold.
    --holder=!: The name of the resource where the TagValue is being used.
    --location=: Region or zone where the TagHold will be stored.
    --origin=: An optional string representing the origin of this request.
documentation:
    command: |-
        Create a TagHold under a TagValue, indicating that the TagValue is being
        used by a holder (cloud resource) from an (optional) origin. The TagValue
        can be represented with its numeric id or its namespaced name of
        {parent_namespace}/{tag_key_short_name}/{tag_value_short_name}.
    flag:
        help-link: A URL where an end user can learn more about removing this hold.
        holder: The name of the resource where the TagValue is being used. Must be less than 200 characters.
        location: Region or zone where the TagHold will be stored. If not provided, the TagHold will be stored in a "global" region.
        origin: An optional string representing the origin of this request. This field should include human-understandable information to distinguish origins from each other. Must be less than 200 characters.
