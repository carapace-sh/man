name: describe-dashboard-snapshot-job
description: Describes an existing snapshot job.
flags:
    --aws-account-id=!: The ID of the Amazon Web Services account that the dashboard snapshot job is executed in.
    --dashboard-id=!: The ID of the dashboard that you have started a snapshot job for.
    --snapshot-job-id=!: The ID of the job to be described.
documentation:
    command: |-
        Describes an existing snapshot job.

        Poll job descriptions after a job starts to know the status of the job. For information on available status codes, see `JobStatus`.
    flag:
        aws-account-id: The ID of the Amazon Web Services account that the dashboard snapshot job is executed in.
        dashboard-id: The ID of the dashboard that you have started a snapshot job for.
        snapshot-job-id: The ID of the job to be described. The job ID is set when you start a new job with a `StartDashboardSnapshotJob` API call.
