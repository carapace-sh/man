name: modify-event-subscription
description: Modifies an existing Amazon Redshift event notification subscription.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --enabled: A Boolean value indicating if the subscription is enabled.
    --event-categories=: Specifies the Amazon Redshift event categories to be published by the event notification subscription.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-enabled: A Boolean value indicating if the subscription is enabled.
    --severity=: Specifies the Amazon Redshift event severity to be published by the event notification subscription.
    --sns-topic-arn=: The Amazon Resource Name (ARN) of the SNS topic to be used by the event notification subscription.
    --source-ids=: A list of one or more identifiers of Amazon Redshift source objects.
    --source-type=: The type of source that will be generating the events.
    --subscription-name=!: The name of the modified Amazon Redshift event notification subscription.
documentation:
    command: Modifies an existing Amazon Redshift event notification subscription.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        enabled: A Boolean value indicating if the subscription is enabled. `true` indicates the subscription is enabled
        event-categories: |-
            Specifies the Amazon Redshift event categories to be published by the event notification subscription.

            Values: configuration, management, monitoring, security, pending
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        severity: |-
            Specifies the Amazon Redshift event severity to be published by the event notification subscription.

            Values: ERROR, INFO
        sns-topic-arn: The Amazon Resource Name (ARN) of the SNS topic to be used by the event notification subscription.
        source-ids: |-
            A list of one or more identifiers of Amazon Redshift source objects. All of the objects must be of the same type as was specified in the source type parameter. The event subscription will return only events generated by the specified objects. If not specified, then events are returned for all objects within the source type specified.

            Example: my-cluster-1, my-cluster-2

            Example: my-snapshot-20131010
        source-type: |-
            The type of source that will be generating the events. For example, if you want to be notified of events generated by a cluster, you would set this parameter to cluster. If this value is not specified, events are returned for all Amazon Redshift objects in your Amazon Web Services account. You must specify a source type in order to specify source IDs.

            Valid values: cluster, cluster-parameter-group, cluster-security-group, cluster-snapshot, and scheduled-action.
        subscription-name: The name of the modified Amazon Redshift event notification subscription.
