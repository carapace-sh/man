name: delete-multi-region-endpoint
description: Deletes a multi-region endpoint (global-endpoint).
flags:
    --endpoint-name=!: The name of the multi-region endpoint (global-endpoint) to be deleted.
documentation:
    command: |-
        Deletes a multi-region endpoint (global-endpoint).

        Only multi-region endpoints (global-endpoints) whose primary region is the AWS-Region where operation is executed can be deleted.
    flag:
        endpoint-name: The name of the multi-region endpoint (global-endpoint) to be deleted.
