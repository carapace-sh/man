name: confirm-private-virtual-interface
description: Accepts ownership of a private virtual interface created by another Amazon Web Services account.
flags:
    --direct-connect-gateway-id=: The ID of the Direct Connect gateway.
    --virtual-gateway-id=: The ID of the virtual private gateway.
    --virtual-interface-id=!: The ID of the virtual interface.
documentation:
    command: |-
        Accepts ownership of a private virtual interface created by another Amazon Web Services account.

        After the virtual interface owner makes this call, the virtual interface is created and attached to the specified virtual private gateway or Direct Connect gateway, and is made available to handle traffic.
    flag:
        direct-connect-gateway-id: The ID of the Direct Connect gateway.
        virtual-gateway-id: The ID of the virtual private gateway.
        virtual-interface-id: The ID of the virtual interface.
