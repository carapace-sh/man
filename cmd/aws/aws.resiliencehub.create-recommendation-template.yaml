name: create-recommendation-template
description: Creates a new recommendation template for the Resilience Hub application.
flags:
    --assessment-arn=!: Amazon Resource Name (ARN) of the assessment.
    --bucket-name=: The name of the Amazon S3 bucket that will contain the recommendation template.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Used for an idempotency token.
    --format=: The format for the recommendation template.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name for the recommendation template.
    --recommendation-ids=:
        description: Identifiers for the recommendations used to create a recommendation template.
        nargs: -1
    --recommendation-types=:
        description: An array of strings that specify the recommendation template type or types.
        nargs: -1
    --tags=: Tags assigned to the resource.
completion:
    flag:
        format:
            - CfnYaml
            - CfnJson
documentation:
    command: Creates a new recommendation template for the Resilience Hub application.
    flag:
        assessment-arn: 'Amazon Resource Name (ARN) of the assessment. The format for this ARN is: arn:`partition`:resiliencehub:`region`:`account`:app-assessment/`app-id`. For more information about ARNs, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference* guide.'
        bucket-name: The name of the Amazon S3 bucket that will contain the recommendation template.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Used for an idempotency token. A client token is a unique, case-sensitive string of up to 64 ASCII characters. You should not reuse the same client token for other API requests.
        format: |-
            The format for the recommendation template.

            CfnJson

            The template is CloudFormation JSON.

            CfnYaml

            The template is CloudFormation YAML.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name for the recommendation template.
        recommendation-ids: Identifiers for the recommendations used to create a recommendation template.
        recommendation-types: |-
            An array of strings that specify the recommendation template type or types.

            Alarm

            The template is an [AlarmRecommendation]() template.

            Sop

            The template is a [SopRecommendation]() template.

            Test

            The template is a [TestRecommendation]() template.
        tags: Tags assigned to the resource. A tag is a label that you assign to an Amazon Web Services resource. Each tag consists of a key/value pair.
