name: list-thing-groups-for-thing
description: List the thing groups to which the specified thing belongs.
flags:
    --max-results=: The maximum number of results to return at one time.
    --next-token=: To retrieve the next set of results, the `nextToken` value from a previous response; otherwise **null** to receive the first set of results.
    --thing-name=!: The thing name.
documentation:
    command: |-
        List the thing groups to which the specified thing belongs.

        Requires permission to access the [ListThingGroupsForThing](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        max-results: The maximum number of results to return at one time.
        next-token: To retrieve the next set of results, the `nextToken` value from a previous response; otherwise **null** to receive the first set of results.
        thing-name: The thing name.
