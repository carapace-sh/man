name: describe-interconnects
description: Lists the interconnects owned by the Amazon Web Services account or only the specified interconnect.
flags:
    --interconnect-id=: The ID of the interconnect.
    --max-results=: The maximum number of results to return with a single call.
    --next-token=: The token for the next page of results.
documentation:
    command: Lists the interconnects owned by the Amazon Web Services account or only the specified interconnect.
    flag:
        interconnect-id: The ID of the interconnect.
        max-results: |-
            The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned `nextToken` value.

            If `MaxResults` is given a value larger than 100, only 100 results are returned.
        next-token: The token for the next page of results.
