name: define-suggester
description: Configures a suggester for a domain.
flags:
    --domain-name=!: ""
    --suggester=!: ""
documentation:
    command: Configures a suggester for a domain. A suggester enables you to display possible matches before users finish typing their queries. When you configure a suggester, you must specify the name of the text field you want to search for possible matches and a unique name for the suggester. For more information, see [Getting Search Suggestions](http://docs.aws.amazon.com/cloudsearch/latest/developerguide/getting-suggestions.html) in the *Amazon CloudSearch Developer Guide*.
    flag:
        domain-name: ""
        suggester: ""
