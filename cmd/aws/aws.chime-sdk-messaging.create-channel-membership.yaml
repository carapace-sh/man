name: create-channel-membership
description: Adds a member to a channel.
flags:
    --channel-arn=!: The ARN of the channel to which you're adding users.
    --chime-bearer=!: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --member-arn=!: The `AppInstanceUserArn` of the member you want to add to the channel.
    --sub-channel-id=: The ID of the SubChannel in the request.
    --type=!: The membership type of a user, `DEFAULT` or `HIDDEN`.
completion:
    flag:
        type:
            - DEFAULT
            - HIDDEN
documentation:
    command: |-
        Adds a member to a channel. The `InvitedBy` field in `ChannelMembership` is derived from the request header. A channel member can:

        - List messages
        - Send messages
        - Receive messages
        - Edit their own messages
        - Leave the channel

        Privacy settings impact this action as follows:

        - Public Channels: You do not need to be a member to list messages, but you must be a member to send messages.
        - Private Channels: You must be a member to list or send messages.

        The `x-amz-chime-bearer` request header is mandatory. Use the ARN of the `AppInstanceUserArn` or `AppInstanceBot` that makes the API call as the value in the header.
    flag:
        channel-arn: The ARN of the channel to which you're adding users.
        chime-bearer: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        member-arn: The `AppInstanceUserArn` of the member you want to add to the channel.
        sub-channel-id: |-
            The ID of the SubChannel in the request.

            Only required when creating membership in a SubChannel for a moderator in an elastic channel.
        type: The membership type of a user, `DEFAULT` or `HIDDEN`. Default members are always returned as part of `ListChannelMemberships`. Hidden members are only returned if the type filter in `ListChannelMemberships` equals `HIDDEN`. Otherwise hidden members are not returned. This is only supported by moderators.
