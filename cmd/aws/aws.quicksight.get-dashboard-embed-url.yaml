name: get-dashboard-embed-url
description: Generates a temporary session URL and authorization code(bearer token) that you can use to embed an Amazon Quick Sight read-only dashboard in your website or application.
flags:
    --additional-dashboard-ids=: A list of one or more dashboard IDs that you want anonymous users to have tempporary access to.
    --aws-account-id=!: The ID for the Amazon Web Services account that contains the dashboard that you're embedding.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dashboard-id=!: The ID for the dashboard, also added to the Identity and Access Management (IAM) policy.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identity-type=!: The authentication method that the user uses to sign in.
    --namespace=: The Amazon Quick Sight namespace that contains the dashboard IDs in this request.
    --no-reset-disabled: Remove the reset button on the embedded dashboard.
    --no-state-persistence-enabled: Adds persistence of state for the user session in an embedded dashboard.
    --no-undo-redo-disabled: Remove the undo/redo button on the embedded dashboard.
    --reset-disabled: Remove the reset button on the embedded dashboard.
    --session-lifetime-in-minutes=: How many minutes the session is valid.
    --state-persistence-enabled: Adds persistence of state for the user session in an embedded dashboard.
    --undo-redo-disabled: Remove the undo/redo button on the embedded dashboard.
    --user-arn=: The Amazon Quick Suite user's Amazon Resource Name (ARN), for use with `QUICKSIGHT` identity type.
completion:
    flag:
        identity-type:
            - IAM
            - QUICKSIGHT
            - ANONYMOUS
documentation:
    command: |-
        Generates a temporary session URL and authorization code(bearer token) that you can use to embed an Amazon Quick Sight read-only dashboard in your website or application. Before you use this command, make sure that you have configured the dashboards and permissions.

        Currently, you can use `GetDashboardEmbedURL` only from the server, not from the user's browser. The following rules apply to the generated URL:

        - They must be used together.
        - They can be used one time only.
        - They are valid for 5 minutes after you run this command.
        - You are charged only when the URL is used or there is interaction with Quick Suite.
        - The resulting user session is valid for 15 minutes (default) up to 10 hours (maximum). You can use the optional `SessionLifetimeInMinutes` parameter to customize session duration.

        For more information, see [Embedding Analytics Using GetDashboardEmbedUrl](https://docs.aws.amazon.com/quicksight/latest/user/embedded-analytics-deprecated.html) in the *Amazon Quick Suite User Guide*.

        For more information about the high-level steps for embedding and for an interactive demo of the ways you can customize embedding, visit the [Amazon Quick Suite Developer Portal](https://docs.aws.amazon.com/quicksight/latest/user/quicksight-dev-portal.html).
    flag:
        additional-dashboard-ids: A list of one or more dashboard IDs that you want anonymous users to have tempporary access to. Currently, the `IdentityType` parameter must be set to `ANONYMOUS` because other identity types authenticate as Quick Suite or IAM users. For example, if you set "`--dashboard-id dash_id1 --dashboard-id dash_id2 dash_id3 identity-type ANONYMOUS`", the session can access all three dashboards.
        aws-account-id: The ID for the Amazon Web Services account that contains the dashboard that you're embedding.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dashboard-id: The ID for the dashboard, also added to the Identity and Access Management (IAM) policy.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        identity-type: The authentication method that the user uses to sign in.
        namespace: The Amazon Quick Sight namespace that contains the dashboard IDs in this request. If you're not using a custom namespace, set `Namespace = default`.
        reset-disabled: Remove the reset button on the embedded dashboard. The default is FALSE, which enables the reset button.
        session-lifetime-in-minutes: How many minutes the session is valid. The session lifetime must be 15-600 minutes.
        state-persistence-enabled: Adds persistence of state for the user session in an embedded dashboard. Persistence applies to the sheet and the parameter settings. These are control settings that the dashboard subscriber (Amazon Quick Sight reader) chooses while viewing the dashboard. If this is set to `TRUE`, the settings are the same when the subscriber reopens the same dashboard URL. The state is stored in Amazon Quick Sight, not in a browser cookie. If this is set to FALSE, the state of the user session is not persisted. The default is `FALSE`.
        undo-redo-disabled: Remove the undo/redo button on the embedded dashboard. The default is FALSE, which enables the undo/redo button.
        user-arn: |-
            The Amazon Quick Suite user's Amazon Resource Name (ARN), for use with `QUICKSIGHT` identity type. You can use this for any Amazon Quick Suite users in your account (readers, authors, or admins) authenticated as one of the following:

            - Active Directory (AD) users or group members
            - Invited nonfederated users
            - IAM users and IAM role-based sessions authenticated through Federated Single Sign-On using SAML, OpenID Connect, or IAM federation.

            Omit this parameter for users in the third group – IAM users and IAM role-based sessions.
