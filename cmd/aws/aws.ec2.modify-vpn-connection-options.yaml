name: modify-vpn-connection-options
description: Modifies the connection options for your Site-to-Site VPN connection.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --local-ipv4-network-cidr=: The IPv4 CIDR on the customer gateway (on-premises) side of the VPN connection.
    --local-ipv6-network-cidr=: The IPv6 CIDR on the customer gateway (on-premises) side of the VPN connection.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --remote-ipv4-network-cidr=: The IPv4 CIDR on the Amazon Web Services side of the VPN connection.
    --remote-ipv6-network-cidr=: The IPv6 CIDR on the Amazon Web Services side of the VPN connection.
    --vpn-connection-id=!: The ID of the Site-to-Site VPN connection.
documentation:
    command: |-
        Modifies the connection options for your Site-to-Site VPN connection.

        When you modify the VPN connection options, the VPN endpoint IP addresses on the Amazon Web Services side do not change, and the tunnel options do not change. Your VPN connection will be temporarily unavailable for a brief period while the VPN connection is updated.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        local-ipv4-network-cidr: |-
            The IPv4 CIDR on the customer gateway (on-premises) side of the VPN connection.

            Default: `0.0.0.0/0`
        local-ipv6-network-cidr: |-
            The IPv6 CIDR on the customer gateway (on-premises) side of the VPN connection.

            Default: `::/0`
        remote-ipv4-network-cidr: |-
            The IPv4 CIDR on the Amazon Web Services side of the VPN connection.

            Default: `0.0.0.0/0`
        remote-ipv6-network-cidr: |-
            The IPv6 CIDR on the Amazon Web Services side of the VPN connection.

            Default: `::/0`
        vpn-connection-id: The ID of the Site-to-Site VPN connection.
