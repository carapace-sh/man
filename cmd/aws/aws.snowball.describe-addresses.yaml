name: describe-addresses
description: Returns a specified number of `ADDRESS` objects.
flags:
    --max-results=: The number of `ADDRESS` objects to return.
    --next-token=: HTTP requests are stateless.
documentation:
    command: Returns a specified number of `ADDRESS` objects. Calling this API in one of the US regions will return addresses from the list of all addresses associated with this account in all US regions.
    flag:
        max-results: The number of `ADDRESS` objects to return.
        next-token: HTTP requests are stateless. To identify what object comes "next" in the list of `ADDRESS` objects, you have the option of specifying a value for `NextToken` as the starting point for your list of returned addresses.
