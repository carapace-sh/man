name: create-flow-alias
description: Creates an alias of a flow for deployment.
flags:
    --client-token=: A unique, case-sensitive identifier to ensure that the API request completes no more than one time.
    --concurrency-configuration=: The configuration that specifies how nodes in the flow are executed in parallel.
    --description=: A description for the alias.
    --flow-identifier=!: The unique identifier of the flow for which to create an alias.
    --name=!: A name for the alias.
    --routing-configuration=!: Contains information about the version to which to map the alias.
    --tags=: Any tags that you want to attach to the alias of the flow.
documentation:
    command: Creates an alias of a flow for deployment. For more information, see [Deploy a flow in Amazon Bedrock](https://docs.aws.amazon.com/bedrock/latest/userguide/flows-deploy.html) in the Amazon Bedrock User Guide.
    flag:
        client-token: A unique, case-sensitive identifier to ensure that the API request completes no more than one time. If this token matches a previous request, Amazon Bedrock ignores the request, but does not return an error. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html).
        concurrency-configuration: The configuration that specifies how nodes in the flow are executed in parallel.
        description: A description for the alias.
        flow-identifier: The unique identifier of the flow for which to create an alias.
        name: A name for the alias.
        routing-configuration: Contains information about the version to which to map the alias.
        tags: Any tags that you want to attach to the alias of the flow. For more information, see [Tagging resources in Amazon Bedrock](https://docs.aws.amazon.com/bedrock/latest/userguide/tagging.html).
