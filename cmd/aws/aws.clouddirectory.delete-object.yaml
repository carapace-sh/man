name: delete-object
description: Deletes an object and its associated attributes.
flags:
    --directory-arn=!: The Amazon Resource Name (ARN) that is associated with the [Directory]() where the object resides.
    --object-reference=!: A reference that identifies the object.
documentation:
    command: Deletes an object and its associated attributes. Only objects with no children and no parents can be deleted. The maximum number of attributes that can be deleted during an object deletion is 30. For more information, see [Amazon Cloud Directory Limits](https://docs.aws.amazon.com/clouddirectory/latest/developerguide/limits.html).
    flag:
        directory-arn: The Amazon Resource Name (ARN) that is associated with the [Directory]() where the object resides. For more information, see [arns]().
        object-reference: A reference that identifies the object.
