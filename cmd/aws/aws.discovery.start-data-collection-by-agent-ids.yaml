name: start-data-collection-by-agent-ids
description: Instructs the specified agents to start collecting data.
flags:
    --agent-ids=!: The IDs of the agents from which to start collecting data.
documentation:
    command: Instructs the specified agents to start collecting data.
    flag:
        agent-ids: The IDs of the agents from which to start collecting data. If you send a request to an agent ID that you do not have permission to contact, according to your Amazon Web Services account, the service does not throw an exception. Instead, it returns the error in the *Description* field. If you send a request to multiple agents and you do not have permission to contact some of those agents, the system does not throw an exception. Instead, the system shows `Failed` in the *Description* field.
