name: export
description: '*(BETA)*  Export a session template.'
flags:
    --destination=: Path to a YAML file where the configuration will be exported.
    --location=: Dataproc location for the session template.
documentation:
    command: |-
        *(BETA)*  Exporting a session template is similar to describing one, except that export
        omits output only fields, such as the template id and resource name. This
        is to allow piping the output of export directly into import, which requires
        that output only fields are omitted.

        ## EXAMPLES

        The following command saves the contents of session template
        `example-session-template` to a file so that it can be imported later:

          $ gcloud beta dataproc session-templates export example-session-template --destination=saved-template.yaml
    flag:
        destination: |-
            Path to a YAML file where the configuration will be exported.
                      Alternatively, you may omit this flag to write to standard output.
        location: |-
            Dataproc location for the session template. Each Dataproc location constitutes an independent resource namespace constrained to deploying instances into Compute Engine zones inside the location. Overrides the default `dataproc/location` property value for this command invocation.
            +
            To set the `location` attribute:
            * provide the argument `session_template` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataproc/location`.
