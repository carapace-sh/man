name: describe-dbproxy-endpoints
description: Returns information about DB proxy endpoints.
flags:
    --dbproxy-endpoint-name=: The name of a DB proxy endpoint to describe.
    --dbproxy-name=: The name of the DB proxy whose endpoints you want to describe.
    --filters=: This parameter is not currently supported.
    --marker=: An optional pagination token provided by a previous request.
    --max-records=: The maximum number of records to include in the response.
documentation:
    command: Returns information about DB proxy endpoints.
    flag:
        dbproxy-endpoint-name: The name of a DB proxy endpoint to describe. If you omit this parameter, the output includes information about all DB proxy endpoints associated with the specified proxy.
        dbproxy-name: The name of the DB proxy whose endpoints you want to describe. If you omit this parameter, the output includes information about all DB proxy endpoints associated with all your DB proxies.
        filters: This parameter is not currently supported.
        marker: An optional pagination token provided by a previous request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that the remaining results can be retrieved.

            Default: 100

            Constraints: Minimum 20, maximum 100.
