name: list-asset-properties
description: Retrieves a paginated list of properties associated with an asset.
flags:
    --asset-id=!: The ID of the asset.
    --filter=: Filters the requested list of asset properties.
    --max-results=: The maximum number of results to return for each paginated request.
    --next-token=: The token to be used for the next set of paginated results.
completion:
    flag:
        filter:
            - ALL
            - BASE
documentation:
    command: Retrieves a paginated list of properties associated with an asset. If you update properties associated with the model before you finish listing all the properties, you need to start all over again.
    flag:
        asset-id: The ID of the asset. This can be either the actual ID in UUID format, or else `externalId:` followed by the external ID, if it has one. For more information, see [Referencing objects with external IDs](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/object-ids.html#external-id-references) in the *IoT SiteWise User Guide*.
        filter: |-
            Filters the requested list of asset properties. You can choose one of the following options:

            - `ALL` – The list includes all asset properties for a given asset model ID.
            - `BASE` – The list includes only base asset properties for a given asset model ID.

            Default: `BASE`
        max-results: The maximum number of results to return for each paginated request. If not specified, the default value is 50.
        next-token: The token to be used for the next set of paginated results.
