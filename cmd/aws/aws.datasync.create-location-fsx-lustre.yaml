name: create-location-fsx-lustre
description: Creates a transfer *location* for an Amazon FSx for Lustre file system.
flags:
    --fsx-filesystem-arn=!: Specifies the Amazon Resource Name (ARN) of the FSx for Lustre file system.
    --security-group-arns=!: Specifies the Amazon Resource Names (ARNs) of up to five security groups that provide access to your FSx for Lustre file system.
    --subdirectory=: Specifies a mount path for your FSx for Lustre file system.
    --tags=: Specifies labels that help you categorize, filter, and search for your Amazon Web Services resources.
documentation:
    command: |-
        Creates a transfer *location* for an Amazon FSx for Lustre file system. DataSync can use this location as a source or destination for transferring data.

        Before you begin, make sure that you understand how DataSync [accesses FSx for Lustre file systems](https://docs.aws.amazon.com/datasync/latest/userguide/create-lustre-location.html#create-lustre-location-access).
    flag:
        fsx-filesystem-arn: Specifies the Amazon Resource Name (ARN) of the FSx for Lustre file system.
        security-group-arns: |-
            Specifies the Amazon Resource Names (ARNs) of up to five security groups that provide access to your FSx for Lustre file system.

            The security groups must be able to access the file system's ports. The file system must also allow access from the security groups. For information about file system access, see the [*Amazon FSx for Lustre User Guide*](https://docs.aws.amazon.com/fsx/latest/LustreGuide/limit-access-security-groups.html) .
        subdirectory: |-
            Specifies a mount path for your FSx for Lustre file system. The path can include subdirectories.

            When the location is used as a source, DataSync reads data from the mount path. When the location is used as a destination, DataSync writes data to the mount path. If you don't include this parameter, DataSync uses the file system's root directory (`/`).
        tags: Specifies labels that help you categorize, filter, and search for your Amazon Web Services resources. We recommend creating at least a name tag for your location.
