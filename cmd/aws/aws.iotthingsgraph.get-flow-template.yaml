name: get-flow-template
description: Gets the latest version of the `DefinitionDocument` and `FlowTemplateSummary` for the specified workflow.
flags:
    --id=!: The ID of the workflow.
    --revision-number=: The number of the workflow revision to retrieve.
documentation:
    command: Gets the latest version of the `DefinitionDocument` and `FlowTemplateSummary` for the specified workflow.
    flag:
        id: |-
            The ID of the workflow.

            The ID should be in the following format.

            `urn:tdm:REGION/ACCOUNT ID/default:workflow:WORKFLOWNAME`
        revision-number: The number of the workflow revision to retrieve.
