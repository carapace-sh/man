name: describe-cache-clusters
description: Returns information about all provisioned clusters if no cluster identifier is specified, or about a specific cache cluster if a cluster identifier is supplied.
flags:
    --cache-cluster-id=: The user-supplied cluster identifier.
    --marker=: An optional marker returned from a prior request.
    --max-records=: The maximum number of records to include in the response.
    --show-cache-clusters-not-in-replication-groups=: 'An optional flag that can be included in the `DescribeCacheCluster` request to show only nodes (API/CLI: clusters) that are not members of a replication group.'
    --show-cache-node-info=: An optional flag that can be included in the `DescribeCacheCluster` request to retrieve information about the individual cache nodes.
documentation:
    command: |-
        Returns information about all provisioned clusters if no cluster identifier is specified, or about a specific cache cluster if a cluster identifier is supplied.

        By default, abbreviated information about the clusters is returned. You can use the optional *ShowCacheNodeInfo* flag to retrieve detailed information about the cache nodes associated with the clusters. These details include the DNS address and port for the cache node endpoint.

        If the cluster is in the *creating* state, only cluster-level information is displayed until all of the nodes are successfully provisioned.

        If the cluster is in the *deleting* state, only cluster-level information is displayed.

        If cache nodes are currently being added to the cluster, node endpoint information and creation time for the additional nodes are not displayed until they are completely provisioned. When the cluster state is *available*, the cluster is ready for use.

        If cache nodes are currently being removed from the cluster, no endpoint information for the removed nodes is displayed.
    flag:
        cache-cluster-id: The user-supplied cluster identifier. If this parameter is specified, only information about that specific cluster is returned. This parameter isn't case sensitive.
        marker: An optional marker returned from a prior request. Use this marker for pagination of results from this operation. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a marker is included in the response so that the remaining results can be retrieved.

            Default: 100

            Constraints: minimum 20; maximum 100.
        show-cache-clusters-not-in-replication-groups: 'An optional flag that can be included in the `DescribeCacheCluster` request to show only nodes (API/CLI: clusters) that are not members of a replication group. In practice, this means Memcached and single node Valkey or Redis OSS clusters.'
        show-cache-node-info: An optional flag that can be included in the `DescribeCacheCluster` request to retrieve information about the individual cache nodes.
