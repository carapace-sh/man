name: update
description: '*(ALPHA)*  Update a local package with changes from a remote source repo.'
hidden: true
flags:
    --dry-run: If true and command fails print the underlying command that was executed and its exit status.
    --no-dry-run&: If true and command fails print the underlying command that was executed and its exit status.
    --no-show-exec-error&: If true and command fails, print the underlying command that was executed and its exit status.
    --repo-uri=: git repo url for updating contents.
    --show-exec-error&: If true and command fails, print the underlying command that was executed and its exit status.
    --strategy=: Controls how changes to the local package are handled.
completion:
    flag:
        strategy:
            - alpha-git-patch
            - fast-forward
            - force-delete-replace
            - resource-merge
documentation:
    command: '*(ALPHA)*  Update a local package with changes from a remote source repo.'
    flag:
        dry-run: If true and command fails print the underlying command that was executed and its exit status.
        no-dry-run: If true and command fails print the underlying command that was executed and its exit status.
        no-show-exec-error: If true and command fails, print the underlying command that was executed and its exit status.
        repo-uri: git repo url for updating contents. Defaults to the url the package was fetched from.
        show-exec-error: If true and command fails, print the underlying command that was executed and its exit status.
        strategy: "Controls how changes to the local package are handled. _STRATEGY_ must be one of:\n+\n*alpha-git-patch*::: use 'git format-patch' and 'git am' to apply a patch of the changes between the source version and destination version. Requires the local package to have been committed to a local git repo.\n*fast-forward*::: fail without updating if the local package was modified since it was fetched.\n*force-delete-replace*::: This will wipe all local changes to the package. Deletes the contents of local package from PACKAGE_DIR and replace them with the remote \n*resource-merge*::: perform a structural comparison of the original/updated Resources, and merge the changes into the local package.\n:::\n+"
