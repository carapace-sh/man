name: batch-delete-connection
description: Deletes a list of connection definitions from the Data Catalog.
flags:
    --catalog-id=: The ID of the Data Catalog in which the connections reside.
    --connection-name-list=!: A list of names of the connections to delete.
documentation:
    command: Deletes a list of connection definitions from the Data Catalog.
    flag:
        catalog-id: The ID of the Data Catalog in which the connections reside. If none is provided, the Amazon Web Services account ID is used by default.
        connection-name-list: A list of names of the connections to delete.
