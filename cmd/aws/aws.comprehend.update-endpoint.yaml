name: update-endpoint
description: Updates information about the specified endpoint.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --desired-data-access-role-arn=: Data access role ARN to use in case the new model is encrypted with a customer CMK.
    --desired-inference-units=: The desired number of inference units to be used by the model using this endpoint.
    --desired-model-arn=: The ARN of the new model to use when updating an existing endpoint.
    --endpoint-arn=!: The Amazon Resource Number (ARN) of the endpoint being updated.
    --flywheel-arn=: The Amazon Resource Number (ARN) of the flywheel
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
documentation:
    command: Updates information about the specified endpoint. For information about endpoints, see [Managing endpoints](https://docs.aws.amazon.com/comprehend/latest/dg/manage-endpoints.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        desired-data-access-role-arn: Data access role ARN to use in case the new model is encrypted with a customer CMK.
        desired-inference-units: The desired number of inference units to be used by the model using this endpoint. Each inference unit represents of a throughput of 100 characters per second.
        desired-model-arn: The ARN of the new model to use when updating an existing endpoint.
        endpoint-arn: The Amazon Resource Number (ARN) of the endpoint being updated.
        flywheel-arn: The Amazon Resource Number (ARN) of the flywheel
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
