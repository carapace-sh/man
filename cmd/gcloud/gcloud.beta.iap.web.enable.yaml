name: enable
description: '*(BETA)*  Enable Cloud Identity-Aware Proxy (Cloud IAP) on an IAP resource.'
flags:
    --oauth2-client-id=!: OAuth 2.0 client ID to use.
    --oauth2-client-secret=!: OAuth 2.0 client secret to use.
    --region=: Region name.
    --resource-type=!: Resource type of the IAP resource.
    --service=: Service name.
completion:
    flag:
        resource-type:
            - app-engine
            - backend-services
documentation:
    command: |-
        *(BETA)*  This command enables Cloud Identity-Aware Proxy on an IAP resource. OAuth 2.0
        credentials must be set, or must have been previously set, to enable IAP.
    flag:
        oauth2-client-id: OAuth 2.0 client ID to use.
        oauth2-client-secret: OAuth 2.0 client secret to use.
        region: Region name. Not applicable for ``app-engine''. Optional when ``resource-type'' is ``compute''.
        resource-type: 'Resource type of the IAP resource. _RESOURCE_TYPE_ must be one of: *app-engine*, *backend-services*.'
        service: Service name. Required with `--resource-type=backend-services`.
