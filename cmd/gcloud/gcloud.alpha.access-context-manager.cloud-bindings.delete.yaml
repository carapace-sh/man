name: delete
description: '*(ALPHA)*  Delete a cloud access binding.'
flags:
    --binding=!: ID of the cloud-access-binding or fully qualified identifier for the cloud-access-binding.
    --organization=: The ID of the organization.
documentation:
    command: |
        *(ALPHA)*  Delete an existing cloud access binding.

        ## EXAMPLES

        To delete an existing cloud access binding, run:

          $ gcloud alpha access-context-manager cloud-bindings delete --binding=binding-id
    flag:
        binding: |-
            ID of the cloud-access-binding or fully qualified identifier for the cloud-access-binding.
            +
            To set the `binding` attribute:
            * provide the argument `--binding` on the command line.
        organization: |-
            The ID of the organization.
            +

            To set the `organization` attribute:
            * provide the argument `--binding` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line;
            * set the property `access_context_manager/organization`.
