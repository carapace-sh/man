name: describe-client-vpn-endpoints
description: Describes one or more Client VPN endpoints in the account.
flags:
    --client-vpn-endpoint-ids=: The ID of the Client VPN endpoint.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: One or more filters.
    --max-results=: The maximum number of results to return for the request in a single page.
    --next-token=: The token to retrieve the next page of results.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: Describes one or more Client VPN endpoints in the account.
    flag:
        client-vpn-endpoint-ids: The ID of the Client VPN endpoint.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            One or more filters. Filter names and values are case-sensitive.

            - `endpoint-id` - The ID of the Client VPN endpoint.
            - `transport-protocol` - The transport protocol (`tcp` | `udp`).
        max-results: The maximum number of results to return for the request in a single page. The remaining results can be seen by sending another request with the nextToken value.
        next-token: The token to retrieve the next page of results.
