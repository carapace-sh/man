name: create-project
description: Creates an empty Amazon Lookout for Vision project.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: ClientToken is an idempotency token that ensures a call to `CreateProject` completes only once.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --project-name=!: The name for the project.
documentation:
    command: |-
        Creates an empty Amazon Lookout for Vision project. After you create the project, add a dataset by calling [CreateDataset]().

        This operation requires permissions to perform the `lookoutvision:CreateProject` operation.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: |-
            ClientToken is an idempotency token that ensures a call to `CreateProject` completes only once. You choose the value to pass. For example, An issue might prevent you from getting a response from `CreateProject`. In this case, safely retry your call to `CreateProject` by using the same `ClientToken` parameter value.

            If you don't supply a value for `ClientToken`, the AWS SDK you are using inserts a value for you. This prevents retries after a network error from making multiple project creation requests. You'll need to provide your own value for other use cases.

            An error occurs if the other input parameters are not the same as in the first request. Using a different value for `ClientToken` is considered a new call to `CreateProject`. An idempotency token is active for 8 hours.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        project-name: The name for the project.
