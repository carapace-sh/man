name: create
description: '*(ALPHA)*  Create a Compute Engine partner interconnect attachment.'
flags:
    --admin-enabled&: (DEPRECATED) Use --enable-admin instead.
    --candidate-cloud-router-ip-address=: Single IPv4 address + prefix length to be configured on the cloud
    --candidate-cloud-router-ipv6-address=: Single IPv6 address + prefix length to be configured on the cloud
    --candidate-customer-router-ip-address=: Single IPv4 address + prefix length to be configured on the customer
    --candidate-customer-router-ipv6-address=: Single IPv6 address + prefix length to be configured on the customer
    --description=: Human-readable plain-text description of attachment.
    --dry-run: If supplied, validates the attachment without creating it.
    --edge-availability-domain=!: 'Desired edge availability domain for this attachment:'
    --enable-admin: Administrative status of the interconnect attachment.
    --encryption=: Indicates the user-supplied encryption option for this interconnect
    --ipsec-internal-addresses=: List of IP address range names that have been reserved for the interconnect
    --mtu=: Maximum transmission unit (MTU) is the size of the largest IP packet
    --no-admin-enabled&: (DEPRECATED) Use --enable-admin instead.
    --no-dry-run&: If supplied, validates the attachment without creating it.
    --no-enable-admin&: Administrative status of the interconnect attachment.
    --region=: Region of the interconnect attachment to create.
    --resource-manager-tags=: A comma-separated list of Resource Manager tags to apply to the interconnect.
    --router-region=&: Region of the router to operate on.
    --router=!: Google Cloud Router to use for dynamic routing.
    --stack-type=: Stack type of the protocol(s) enabled on this interconnect attachment.
completion:
    flag:
        edge-availability-domain:
            - any
            - availability-domain-1
            - availability-domain-2
        encryption:
            - IPSEC
            - NONE
        stack-type:
            - IPV4_IPV6
            - IPV4_ONLY
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute interconnects attachments partner create* is used to create partner interconnect attachments. A partner
        interconnect attachment binds the underlying connectivity of a provider's
        Interconnect to a path into and out of the customer's cloud network.
    flag:
        admin-enabled: (DEPRECATED) Use --enable-admin instead.
        candidate-cloud-router-ip-address: |-
            Single IPv4 address + prefix length to be configured on the cloud
            router interface for this interconnect attachment. Example:
            203.0.113.1/29
        candidate-cloud-router-ipv6-address: |-
            Single IPv6 address + prefix length to be configured on the cloud
            router interface for this interconnect attachment. Example:
            2001:db8::1/125
        candidate-customer-router-ip-address: |-
            Single IPv4 address + prefix length to be configured on the customer
            router interface for this interconnect attachment. Example:
            203.0.113.2/29
        candidate-customer-router-ipv6-address: |-
            Single IPv6 address + prefix length to be configured on the customer
            router interface for this interconnect attachment. Example:
            2001:db8::2/125
        description: Human-readable plain-text description of attachment.
        dry-run: If supplied, validates the attachment without creating it.
        edge-availability-domain: |-
            Desired edge availability domain for this attachment:
            `availability-domain-1`, `availability-domain-2`, `any`.
            +
            In each metro where the Partner can connect to Google, there are two sets
            of redundant hardware. These sets are described as edge availability
            domain 1 and 2. Within a metro, Google will only schedule maintenance in
            one availability domain at a time. This guarantee does not apply to
            availability domains outside the metro; Google may perform maintenance in
            (say) New York availability domain 1 at the same time as Chicago
            availability domain 1.
            +
            _AVAILABILITY_DOMAIN_ must be one of:
            +
            *any*::: Any Availability Domain
            *availability-domain-1*::: Edge Availability Domain 1
            *availability-domain-2*::: Edge Availability Domain 2
            :::
            +
        enable-admin: |-
            Administrative status of the interconnect attachment. If not provided
            on creation, defaults to disabled.
            When this is enabled, the attachment is operational and will carry
            traffic. Use --no-enable-admin to disable it.
        encryption: |-
            Indicates the user-supplied encryption option for this interconnect
            attachment (VLAN attachment).
            +
            Possible values are:
            +
            `NONE` - This is the default value, which means the interconnect attachment
            carries unencrypted traffic. VMs can send traffic to or
            receive traffic from such interconnect attachment.
            +
            `IPSEC` - The interconnect attachment carries only traffic that is encrypted
            by an IPsec device; for example, an HA VPN gateway or third-party
            IPsec VPN. VMs cannot directly send traffic to or receive traffic from such
            an interconnect attachment. To use HA VPN over Cloud Interconnect,
            the interconnect attachment must be created with this option.
            +
            _ENCRYPTION_ must be one of: *IPSEC*, *NONE*.
        ipsec-internal-addresses: |-
            List of IP address range names that have been reserved for the interconnect
            attachment (VLAN attachment). Use this option only for an interconnect
            attachment that has its encryption option set as IPSEC. Currently only one
            internal IP address range can be specified for each attachment.
            When creating an HA VPN gateway for the interconnect attachment, if the
            attachment is configured to use a regional internal IP address, then the VPN
            gateway's IP address is allocated from the IP address range specified here.
            If this field is not specified when creating the interconnect attachment,
            then when creating any HA VPN gateways for this interconnect attachment,
            the HA VPN gateway's IP address is allocated from a regional external IP
            address pool.
        mtu: |-
            Maximum transmission unit (MTU) is the size of the largest IP packet
            passing through this interconnect attachment. Must be one of 1440, 1460,
            1500, or 8896. If not specified, the value will default to 1440.
        no-admin-enabled: (DEPRECATED) Use --enable-admin instead.
        no-dry-run: If supplied, validates the attachment without creating it.
        no-enable-admin: |
            Administrative status of the interconnect attachment. If not provided
            on creation, defaults to disabled.
            When this is enabled, the attachment is operational and will carry
            traffic. Use --no-enable-admin to disable it.
        region: |-
            Region of the interconnect attachment to create. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        resource-manager-tags: A comma-separated list of Resource Manager tags to apply to the interconnect.
        router: Google Cloud Router to use for dynamic routing.
        router-region: Region of the router to operate on. Should be the same as --region, if not specified, it will be inherited from --region.
        stack-type: |-
            Stack type of the protocol(s) enabled on this interconnect attachment. _STACK_TYPE_ must be one of:
            +
            *IPV4_IPV6*::: Both IPv4 and IPv6 protocols are enabled on this attachment.
            *IPV4_ONLY*::: Only IPv4 protocol is enabled on this attachment.
            :::
            +
