name: list-trained-model-versions
description: Returns a list of trained model versions for a specified trained model.
flags:
    --max-results=: The maximum number of trained model versions to return in a single page.
    --membership-identifier=!: The membership identifier for the collaboration that contains the trained model.
    --next-token=: The pagination token from a previous `ListTrainedModelVersions` request.
    --status=: Filter the results to only include trained model versions with the specified status.
    --trained-model-arn=!: The Amazon Resource Name (ARN) of the trained model for which to list versions.
completion:
    flag:
        status:
            - CREATE_PENDING
            - CREATE_IN_PROGRESS
            - CREATE_FAILED
            - ACTIVE
            - DELETE_PENDING
            - DELETE_IN_PROGRESS
            - DELETE_FAILED
            - INACTIVE
            - CANCEL_PENDING
            - CANCEL_IN_PROGRESS
            - CANCEL_FAILED
documentation:
    command: Returns a list of trained model versions for a specified trained model. This operation allows you to view all versions of a trained model, including information about their status and creation details. You can use this to track the evolution of your trained models and select specific versions for inference or further training.
    flag:
        max-results: The maximum number of trained model versions to return in a single page. The default value is 10, and the maximum value is 100.
        membership-identifier: The membership identifier for the collaboration that contains the trained model.
        next-token: The pagination token from a previous `ListTrainedModelVersions` request. Use this token to retrieve the next page of results.
        status: Filter the results to only include trained model versions with the specified status. Valid values include `CREATE_PENDING`, `CREATE_IN_PROGRESS`, `ACTIVE`, `CREATE_FAILED`, and others.
        trained-model-arn: The Amazon Resource Name (ARN) of the trained model for which to list versions.
