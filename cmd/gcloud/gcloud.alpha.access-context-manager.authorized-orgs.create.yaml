name: create
description: '*(ALPHA)*  Create a new authorized organizations description.'
flags:
    --asset-type=!: The asset type of this authorized organizations description.
    --async: Return immediately, without waiting for the operation in progress to
    --authorization-direction=!: Authorization direction of this authorization relationship.
    --authorization-type=!: The authorization type of the authorized organizations description.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --orgs=: 'Comma-separated list of organizations (in the following format: `organizations/<organizationnumber>`).'
    --policy=: The ID of the access policy.
completion:
    flag:
        asset-type:
            - asset-type-credential-strength
            - asset-type-device
            - asset-type-unspecified
        authorization-direction:
            - authorization-direction-from
            - authorization-direction-to
            - authorization-direction-unspecified
        authorization-type:
            - authorization-type-trust
            - authorization-type-unspecified
documentation:
    command: |
        *(ALPHA)*  Create a new authorized organizations description in a given access policy.
    flag:
        asset-type: 'The asset type of this authorized organizations description. For example, device, or credential strength. _ASSET_TYPE_ must be one of: *asset-type-credential-strength*, *asset-type-device*, *asset-type-unspecified*.'
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        authorization-direction: 'Authorization direction of this authorization relationship. Specifies whether to allow specified organizations to evaluate this organization''s traffic, or allow specified organizations traffic to be evaluated by this org. _AUTHORIZATION_DIRECTION_ must be one of: *authorization-direction-from*, *authorization-direction-to*, *authorization-direction-unspecified*.'
        authorization-type: 'The authorization type of the authorized organizations description. For example, trust, troubleshooting or logging. _AUTHORIZATION_TYPE_ must be one of: *authorization-type-trust*, *authorization-type-unspecified*.'
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        orgs: 'Comma-separated list of organizations (in the following format: `organizations/<organizationnumber>`).'
        policy: |-
            The ID of the access policy.
            +

            To set the `policy` attribute:
            * provide the argument `authorized_orgs_desc` on the command line with a fully specified name;
            * provide the argument `--policy` on the command line;
            * set the property `access_context_manager/policy`;
            * automatically, if the current account belongs to an organization with exactly one access policy..
