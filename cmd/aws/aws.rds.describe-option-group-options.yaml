name: describe-option-group-options
description: Describes all available options for the specified engine.
flags:
    --engine-name=!: The name of the engine to describe options for.
    --filters=: This parameter isn't currently supported.
    --major-engine-version=: If specified, filters the results to include only options for the specified major engine version.
    --marker=: An optional pagination token provided by a previous request.
    --max-records=: The maximum number of records to include in the response.
documentation:
    command: Describes all available options for the specified engine.
    flag:
        engine-name: |-
            The name of the engine to describe options for.

            Valid Values:

            - `db2-ae`
            - `db2-se`
            - `mariadb`
            - `mysql`
            - `oracle-ee`
            - `oracle-ee-cdb`
            - `oracle-se2`
            - `oracle-se2-cdb`
            - `postgres`
            - `sqlserver-ee`
            - `sqlserver-se`
            - `sqlserver-ex`
            - `sqlserver-web`
        filters: This parameter isn't currently supported.
        major-engine-version: If specified, filters the results to include only options for the specified major engine version.
        marker: An optional pagination token provided by a previous request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that you can retrieve the remaining results.

            Default: 100

            Constraints: Minimum 20, maximum 100.
