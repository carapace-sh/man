name: update-size-constraint-set
description: This is **AWS WAF Classic** documentation.
flags:
    --change-token=!: The value returned by the most recent call to [GetChangeToken]().
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --size-constraint-set-id=!: The `SizeConstraintSetId` of the [SizeConstraintSet]() that you want to update.
    --updates=!: An array of `SizeConstraintSetUpdate` objects that you want to insert into or delete from a [SizeConstraintSet]().
documentation:
    command: "This is **AWS WAF Classic** documentation. For more information, see [AWS WAF Classic](https://docs.aws.amazon.com/waf/latest/developerguide/classic-waf-chapter.html) in the developer guide.\n\n**For the latest version of AWS WAF**, use the AWS WAFV2 API and see the [AWS WAF Developer Guide](https://docs.aws.amazon.com/waf/latest/developerguide/waf-chapter.html). With the latest version, AWS WAF has a single set of endpoints for regional and global use.\n\nInserts or deletes [SizeConstraint]() objects (filters) in a [SizeConstraintSet](). For each `SizeConstraint` object, you specify the following values:\n\n- Whether to insert or delete the object from the array. If you want to change a `SizeConstraintSetUpdate` object, you delete the existing object and add a new one.\n- The part of a web request that you want AWS WAF to evaluate, such as the length of a query string or the length of the `User-Agent` header.\n- Whether to perform any transformations on the request, such as converting it to lowercase, before checking its length. Note that transformations of the request body are not supported because the AWS resource forwards only the first `8192` bytes of your request to AWS WAF.\n  \n  You can only specify a single type of TextTransformation.\n- A `ComparisonOperator` used for evaluating the selected part of the request against the specified `Size`, such as equals, greater than, less than, and so on.\n- The length, in bytes, that you want AWS WAF to watch for in selected part of the request. The length is computed after applying the transformation.\n\nFor example, you can add a `SizeConstraintSetUpdate` object that matches web requests in which the length of the `User-Agent` header is greater than 100 bytes. You can then configure AWS WAF to block those requests.\n\nTo create and configure a `SizeConstraintSet`, perform the following steps:\n\n1. Create a `SizeConstraintSet.` For more information, see [CreateSizeConstraintSet]().\n2. Use [GetChangeToken]() to get the change token that you provide in the `ChangeToken` parameter of an `UpdateSizeConstraintSet` request.\n3. Submit an `UpdateSizeConstraintSet` request to specify the part of the request that you want AWS WAF to inspect (for example, the header or the URI) and the value that you want AWS WAF to watch for.\n\nFor more information about how to use the AWS WAF API to allow or block HTTP requests, see the [AWS WAF Developer Guide](https://docs.aws.amazon.com/waf/latest/developerguide/)."
    flag:
        change-token: The value returned by the most recent call to [GetChangeToken]().
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        size-constraint-set-id: The `SizeConstraintSetId` of the [SizeConstraintSet]() that you want to update. `SizeConstraintSetId` is returned by [CreateSizeConstraintSet]() and by [ListSizeConstraintSets]().
        updates: |-
            An array of `SizeConstraintSetUpdate` objects that you want to insert into or delete from a [SizeConstraintSet](). For more information, see the applicable data types:

            - [SizeConstraintSetUpdate](): Contains `Action` and `SizeConstraint`
            - [SizeConstraint](): Contains `FieldToMatch`, `TextTransformation`, `ComparisonOperator`, and `Size`
            - [FieldToMatch](): Contains `Data` and `Type`
