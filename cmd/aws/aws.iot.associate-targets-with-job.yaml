name: associate-targets-with-job
description: Associates a group with a continuous job.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --comment=: An optional comment string describing why the job was associated with the targets.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --job-id=!: The unique identifier you assigned to this job when it was created.
    --namespace-id=: The namespace used to indicate that a job is a customer-managed job.
    --targets=!: A list of thing group ARNs that define the targets of the job.
documentation:
    command: |-
        Associates a group with a continuous job. The following criteria must be met:

        - The job must have been created with the `targetSelection` field set to "CONTINUOUS".
        - The job status must currently be "IN\_PROGRESS".
        - The total number of targets associated with a job must not exceed 100.

        Requires permission to access the [AssociateTargetsWithJob](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        comment: An optional comment string describing why the job was associated with the targets.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        job-id: The unique identifier you assigned to this job when it was created.
        namespace-id: |-
            The namespace used to indicate that a job is a customer-managed job.

            When you specify a value for this parameter, Amazon Web Services IoT Core sends jobs notifications to MQTT topics that contain the value in the following format.

            `$aws/things/THING_NAME/jobs/JOB_ID/notify-namespace-NAMESPACE_ID/`

            The `namespaceId` feature is only supported by IoT Greengrass at this time. For more information, see [Setting up IoT Greengrass core devices.](https://docs.aws.amazon.com/greengrass/v2/developerguide/setting-up.html)
        targets: A list of thing group ARNs that define the targets of the job.
