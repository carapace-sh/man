name: export
description: '*(ALPHA)*  Export an HA Controller.'
hidden: true
flags:
    --destination=: Path to a YAML file where the configuration will be exported.
    --region=: The name of the Google Compute Engine region where the HA Controller exists.
documentation:
    command: |
        *(ALPHA)*  Exports an High Availability (HA) Controller's configuration to a
        file. This configuration can be imported at a later time.
    flag:
        destination: |-
            Path to a YAML file where the configuration will be exported.
                      Alternatively, you may omit this flag to write to standard output. For a schema describing the export/import format, see:
                      $CLOUDSDKROOT/lib/googlecloudsdk/schemas/compute/alpha/HaController.yaml.
        region: |-
            The name of the Google Compute Engine region where the HA Controller exists.
            +
            Overrides the default compute/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `ha_controller` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `compute/region`.
