name: get-capacity-manager-metric-dimensions
description: Retrieves the available dimension values for capacity metrics within a specified time range.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --end-time=!: The end time for the dimension query, in ISO 8601 format.
    --filter-by=: Conditions to filter which dimension values are returned.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --group-by=!: The dimensions to group by when retrieving available dimension values.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of dimension combinations to return.
    --metric-names=!: The metric names to use as an additional filter when retrieving dimensions.
    --next-token=: The token for the next page of results.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --page-size=: The size of each page to get in the AWS service call.
    --start-time=!: The start time for the dimension query, in ISO 8601 format.
    --starting-token=: A token to specify where to start paginating.
documentation:
    command: Retrieves the available dimension values for capacity metrics within a specified time range. This is useful for discovering what accounts, regions, instance families, and other dimensions have data available for filtering and grouping.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        end-time: The end time for the dimension query, in ISO 8601 format. Only dimensions with data in this time range will be returned.
        filter-by: Conditions to filter which dimension values are returned. Each filter specifies a dimension, comparison operator, and values to match against.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        group-by: The dimensions to group by when retrieving available dimension values. This determines which dimension combinations are returned. Required parameter.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of dimension combinations to return. Valid range is 1 to 1000. Use with NextToken for pagination.
        metric-names: The metric names to use as an additional filter when retrieving dimensions. Only dimensions that have data for these metrics will be returned. Required parameter with maximum size of 1 for v1.
        next-token: The token for the next page of results. Use this value in a subsequent call to retrieve additional dimension values.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        start-time: The start time for the dimension query, in ISO 8601 format. Only dimensions with data in this time range will be returned.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
