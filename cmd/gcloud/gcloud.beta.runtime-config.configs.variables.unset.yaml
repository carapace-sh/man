name: unset
description: '*(BETA)*  Delete variable resources.'
flags:
    --config-name=!: The name of the configuration resource to use.
    --fail-if-absent: Fail if a variable with the specified name does not exist.
    --no-fail-if-absent&: Fail if a variable with the specified name does not exist.
    --no-recursive&: Delete a parent node and all of its children.
    --recursive: Delete a parent node and all of its children.
documentation:
    command: '*(BETA)*  This command deletes the variable resource with the specified name.'
    flag:
        config-name: The name of the configuration resource to use.
        fail-if-absent: Fail if a variable with the specified name does not exist.
        no-fail-if-absent: Fail if a variable with the specified name does not exist.
        no-recursive: Delete a parent node and all of its children.
        recursive: Delete a parent node and all of its children.
