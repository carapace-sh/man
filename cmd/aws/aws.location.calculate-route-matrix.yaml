name: calculate-route-matrix
description: This operation is no longer current and may be deprecated in the future.
flags:
    --calculator-name=!: The name of the route calculator resource that you want to use to calculate the route matrix.
    --car-mode-options=: Specifies route preferences when traveling by `Car`, such as avoiding routes that use ferries or tolls.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --depart-now: Sets the time of departure as the current time.
    --departure-positions=!: The list of departure (origin) positions for the route matrix.
    --departure-time=: Specifies the desired time of departure.
    --destination-positions=!: The list of destination positions for the route matrix.
    --distance-unit=: Set the unit system to specify the distance.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --key=: The optional [API key](https://docs.aws.amazon.com/location/previous/developerguide/using-apikeys.html) to authorize the request.
    --no-depart-now: Sets the time of departure as the current time.
    --travel-mode=: Specifies the mode of transport when calculating a route.
    --truck-mode-options=: Specifies route preferences when traveling by `Truck`, such as avoiding routes that use ferries or tolls, and truck specifications to consider when choosing an optimal road.
completion:
    flag:
        distance-unit:
            - Kilometers
            - Miles
        travel-mode:
            - Car
            - Truck
            - Walking
            - Bicycle
            - Motorcycle
documentation:
    command: "This operation is no longer current and may be deprecated in the future. We recommend you upgrade to the [V2 `CalculateRouteMatrix`](/location/latest/APIReference/API_CalculateRouteMatrix.html) unless you require Grab data.\n\n- This version of `CalculateRouteMatrix` is part of a previous Amazon Location Service Routes API (version 1) which has been superseded by a more intuitive, powerful, and complete API (version 2).\n- The version 2 `CalculateRouteMatrix` operation gives better results for matrix routing calculations.\n- If you are using an Amazon Web Services SDK or the Amazon Web Services CLI, note that the Routes API version 2 is found under `geo-routes` or `geo_routes`, not under `location`.\n- Since Grab is not yet fully supported in Routes API version 2, we recommend you continue using API version 1 when using Grab.\n- Start your version 2 API journey with the Routes V2 [API Reference](/location/latest/APIReference/API_Operations_Amazon_Location_Service_Routes_V2.html) or the [Developer Guide](/location/latest/developerguide/routes.html).\n\n[Calculates a route matrix](https://docs.aws.amazon.com/location/previous/developerguide/calculate-route-matrix.html) given the following required parameters: `DeparturePositions` and `DestinationPositions`. `CalculateRouteMatrix` calculates routes and returns the travel time and travel distance from each departure position to each destination position in the request. For example, given departure positions A and B, and destination positions X and Y, `CalculateRouteMatrix` will return time and distance for routes from A to X, A to Y, B to X, and B to Y (in that order). The number of results returned (and routes calculated) will be the number of `DeparturePositions` times the number of `DestinationPositions`.\n\nYour account is charged for each route calculated, not the number of requests.\n\nRequires that you first [create a route calculator resource](https://docs.aws.amazon.com/location-routes/latest/APIReference/API_CreateRouteCalculator.html).\n\nBy default, a request that doesn't specify a departure time uses the best time of day to travel with the best traffic conditions when calculating routes.\n\nAdditional options include:\n\n- [Specifying a departure time](https://docs.aws.amazon.com/location/previous/developerguide/departure-time.html) using either `DepartureTime` or `DepartNow`. This calculates routes based on predictive traffic data at the given time.\n  \n  You can't specify both `DepartureTime` and `DepartNow` in a single request. Specifying both parameters returns a validation error.\n- [Specifying a travel mode](https://docs.aws.amazon.com/location/previous/developerguide/travel-mode.html) using TravelMode sets the transportation mode used to calculate the routes. This also lets you specify additional route preferences in `CarModeOptions` if traveling by `Car`, or `TruckModeOptions` if traveling by `Truck`."
    flag:
        calculator-name: The name of the route calculator resource that you want to use to calculate the route matrix.
        car-mode-options: |-
            Specifies route preferences when traveling by `Car`, such as avoiding routes that use ferries or tolls.

            Requirements: `TravelMode` must be specified as `Car`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        depart-now: |-
            Sets the time of departure as the current time. Uses the current time to calculate the route matrix. You can't set both `DepartureTime` and `DepartNow`. If neither is set, the best time of day to travel with the best traffic conditions is used to calculate the route matrix.

            Default Value: `false`

            Valid Values: `false` | `true`
        departure-positions: |-
            The list of departure (origin) positions for the route matrix. An array of points, each of which is itself a 2-value array defined in [WGS 84](https://earth-info.nga.mil/GandG/wgs84/index.html) format: `[longitude, latitude]`. For example, `[-123.115, 49.285]`.

            Depending on the data provider selected in the route calculator resource there may be additional restrictions on the inputs you can choose. See [Position restrictions](https://docs.aws.amazon.com/location/previous/developerguide/calculate-route-matrix.html#matrix-routing-position-limits) in the *Amazon Location Service Developer Guide*.

            For route calculators that use Esri as the data provider, if you specify a departure that's not located on a road, Amazon Location [moves the position to the nearest road](https://docs.aws.amazon.com/location/previous/developerguide/snap-to-nearby-road.html). The snapped value is available in the result in `SnappedDeparturePositions`.

            Valid Values: `[-180 to 180,-90 to 90]`
        departure-time: |-
            Specifies the desired time of departure. Uses the given time to calculate the route matrix. You can't set both `DepartureTime` and `DepartNow`. If neither is set, the best time of day to travel with the best traffic conditions is used to calculate the route matrix.

            Setting a departure time in the past returns a `400 ValidationException` error.

            - In [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) format: `YYYY-MM-DDThh:mm:ss.sssZ`. For example, `2020–07-2T12:15:20.000Z+01:00`
        destination-positions: |-
            The list of destination positions for the route matrix. An array of points, each of which is itself a 2-value array defined in [WGS 84](https://earth-info.nga.mil/GandG/wgs84/index.html) format: `[longitude, latitude]`. For example, `[-122.339, 47.615]`

            Depending on the data provider selected in the route calculator resource there may be additional restrictions on the inputs you can choose. See [Position restrictions](https://docs.aws.amazon.com/location/previous/developerguide/calculate-route-matrix.html#matrix-routing-position-limits) in the *Amazon Location Service Developer Guide*.

            For route calculators that use Esri as the data provider, if you specify a destination that's not located on a road, Amazon Location [moves the position to the nearest road](https://docs.aws.amazon.com/location/previous/developerguide/snap-to-nearby-road.html). The snapped value is available in the result in `SnappedDestinationPositions`.

            Valid Values: `[-180 to 180,-90 to 90]`
        distance-unit: |-
            Set the unit system to specify the distance.

            Default Value: `Kilometers`
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        key: The optional [API key](https://docs.aws.amazon.com/location/previous/developerguide/using-apikeys.html) to authorize the request.
        travel-mode: |-
            Specifies the mode of transport when calculating a route. Used in estimating the speed of travel and road compatibility.

            The `TravelMode` you specify also determines how you specify route preferences:

            - If traveling by `Car` use the `CarModeOptions` parameter.
            - If traveling by `Truck` use the `TruckModeOptions` parameter.

            `Bicycle` or `Motorcycle` are only valid when using `Grab` as a data provider, and only within Southeast Asia.

            `Truck` is not available for Grab.

            For more information about using Grab as a data provider, see [GrabMaps](https://docs.aws.amazon.com/location/previous/developerguide/grab.html) in the *Amazon Location Service Developer Guide*.

            Default Value: `Car`
        truck-mode-options: |-
            Specifies route preferences when traveling by `Truck`, such as avoiding routes that use ferries or tolls, and truck specifications to consider when choosing an optimal road.

            Requirements: `TravelMode` must be specified as `Truck`.
