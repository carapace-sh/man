name: update
description: Update an existing  CA Pool.
flags:
    --clear-labels: Remove all labels.
    --encryption-key=&: The full resource name of the Cloud KMS key to use for encrypting certificate data at rest.
    --issuance-policy=: A YAML file describing this CA Pool's issuance policy.
    --location=: The location of the CA_POOL.
    --no-clear-labels&: Remove all labels.
    --no-publish-ca-cert&: ""
    --no-publish-crl&: ""
    --publish-ca-cert: 'If this is enabled, the following will happen:'
    --publish-crl: 'If this gets enabled, the following will happen:'
    --publishing-encoding-format=: The encoding format of the content published to storage buckets.
    --remove-labels=: List of label keys to remove.
    --update-labels=: List of label KEY=VALUE pairs to update.
completion:
    flag:
        publishing-encoding-format:
            - der
            - pem
documentation:
    command: |-
        ## EXAMPLES
          To update labels on a CA pool:

            $ gcloud privateca pools update my-pool \
              --location=us-west1 \
              --update-labels=foo=bar

          To disable publishing CRLs on a CA pool:

            $ gcloud privateca pools update my-pool \
              --location=us-west1 \
              --no-publish-crl
    flag:
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        encryption-key: The full resource name of the Cloud KMS key to use for encrypting certificate data at rest. The key must be in the same region as the CA pool.
        issuance-policy: A YAML file describing this CA Pool's issuance policy.
        location: |-
            The location of the CA_POOL.
            +
            To set the `location` attribute:
            * provide the argument `CA_POOL` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `privateca/location`.
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        no-publish-ca-cert: |
            If this is enabled, the following will happen:
            1) The CA certificates will be written to a known location within the CA distribution point.
            2) The AIA extension in all issued certificates will point to the CA cert URL in that distribution point.

            If this gets disabled, the AIA extension will not be written to any future certificates issued
            by this CA. However, an existing bucket will not be deleted, and the CA certificates will not
            be removed from that bucket.

            Note that the same bucket may be used for the CRLs if --publish-crl is set.
        no-publish-crl: |
            If this gets enabled, the following will happen:
            1) CRLs will be written to a known location within the CA distribution point.
            2) The CDP extension in all future issued certificates will point to the CRL URL in that distribution point.

            If this gets disabled, the CDP extension will not be written to any future certificates issued
            by CAs in this pool, and new CRLs will not be published to that bucket (which affects existing certs).
            However, an existing bucket will not be deleted, and any existing CRLs will not be removed
            from that bucket.

            Note that the same bucket may be used for the CA cert if --publish-ca-cert is set.

            CRL publication is not supported for CAs in the DevOps tier.
        publish-ca-cert: |-
            If this is enabled, the following will happen:
            1) The CA certificates will be written to a known location within the CA distribution point.
            2) The AIA extension in all issued certificates will point to the CA cert URL in that distribution point.
            +
            If this gets disabled, the AIA extension will not be written to any future certificates issued
            by this CA. However, an existing bucket will not be deleted, and the CA certificates will not
            be removed from that bucket.
            +
            Note that the same bucket may be used for the CRLs if --publish-crl is set.
            +
            Enabled by default, use *--no-publish-ca-cert* to disable.
        publish-crl: |-
            If this gets enabled, the following will happen:
            1) CRLs will be written to a known location within the CA distribution point.
            2) The CDP extension in all future issued certificates will point to the CRL URL in that distribution point.
            +
            If this gets disabled, the CDP extension will not be written to any future certificates issued
            by CAs in this pool, and new CRLs will not be published to that bucket (which affects existing certs).
            However, an existing bucket will not be deleted, and any existing CRLs will not be removed
            from that bucket.
            +
            Note that the same bucket may be used for the CA cert if --publish-ca-cert is set.
            +
            CRL publication is not supported for CAs in the DevOps tier.
            +
            Enabled by default, use *--no-publish-crl* to disable.
        publishing-encoding-format: 'The encoding format of the content published to storage buckets. _PUBLISHING_ENCODING_FORMAT_ must be one of: *der*, *pem*.'
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        update-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
