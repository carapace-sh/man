name: update-lftag
description: Updates the list of possible values for the specified LF-tag key.
flags:
    --catalog-id=: The identifier for the Data Catalog.
    --tag-key=!: The key-name for the LF-tag for which to add or delete values.
    --tag-values-to-add=: A list of LF-tag values to add from the LF-tag.
    --tag-values-to-delete=: A list of LF-tag values to delete from the LF-tag.
documentation:
    command: Updates the list of possible values for the specified LF-tag key. If the LF-tag does not exist, the operation throws an EntityNotFoundException. The values in the delete key values will be deleted from list of possible values. If any value in the delete key values is attached to a resource, then API errors out with a 400 Exception - "Update not allowed". Untag the attribute before deleting the LF-tag key's value.
    flag:
        catalog-id: The identifier for the Data Catalog. By default, the account ID. The Data Catalog is the persistent metadata store. It contains database definitions, table definitions, and other control information to manage your Lake Formation environment.
        tag-key: The key-name for the LF-tag for which to add or delete values.
        tag-values-to-add: A list of LF-tag values to add from the LF-tag.
        tag-values-to-delete: A list of LF-tag values to delete from the LF-tag.
