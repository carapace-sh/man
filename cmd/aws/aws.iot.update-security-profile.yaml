name: update-security-profile
description: Updates a Device Defender security profile.
flags:
    --additional-metrics-to-retain-v2=:
        description: A list of metrics whose data is retained (stored).
        nargs: -1
    --additional-metrics-to-retain=:
        description: '*Please use [UpdateSecurityProfileRequest$additionalMetricsToRetainV2]() instead.*'
        nargs: -1
    --alert-targets=: Where the alerts are sent.
    --behaviors=:
        description: Specifies the behaviors that, when violated by a device (thing), cause an alert.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --delete-additional-metrics-to-retain: If true, delete all `additionalMetricsToRetain` defined for this security profile.
    --delete-alert-targets: If true, delete all `alertTargets` defined for this security profile.
    --delete-behaviors: If true, delete all `behaviors` defined for this security profile.
    --delete-metrics-export-config: Set the value as true to delete metrics export related configurations.
    --expected-version=: The expected version of the security profile.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --metrics-export-config=: Specifies the MQTT topic and role ARN required for metric export.
    --no-delete-additional-metrics-to-retain: If true, delete all `additionalMetricsToRetain` defined for this security profile.
    --no-delete-alert-targets: If true, delete all `alertTargets` defined for this security profile.
    --no-delete-behaviors: If true, delete all `behaviors` defined for this security profile.
    --no-delete-metrics-export-config: Set the value as true to delete metrics export related configurations.
    --security-profile-description=: A description of the security profile.
    --security-profile-name=!: The name of the security profile you want to update.
documentation:
    command: |-
        Updates a Device Defender security profile.

        Requires permission to access the [UpdateSecurityProfile](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        additional-metrics-to-retain: |-
            *Please use [UpdateSecurityProfileRequest$additionalMetricsToRetainV2]() instead.*

            A list of metrics whose data is retained (stored). By default, data is retained for any metric used in the profile's `behaviors`, but it is also retained for any metric specified here. Can be used with custom metrics; cannot be used with dimensions.
        additional-metrics-to-retain-v2: A list of metrics whose data is retained (stored). By default, data is retained for any metric used in the profile's behaviors, but it is also retained for any metric specified here. Can be used with custom metrics; cannot be used with dimensions.
        alert-targets: Where the alerts are sent. (Alerts are always sent to the console.)
        behaviors: Specifies the behaviors that, when violated by a device (thing), cause an alert.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        delete-additional-metrics-to-retain: If true, delete all `additionalMetricsToRetain` defined for this security profile. If any `additionalMetricsToRetain` are defined in the current invocation, an exception occurs.
        delete-alert-targets: If true, delete all `alertTargets` defined for this security profile. If any `alertTargets` are defined in the current invocation, an exception occurs.
        delete-behaviors: If true, delete all `behaviors` defined for this security profile. If any `behaviors` are defined in the current invocation, an exception occurs.
        delete-metrics-export-config: Set the value as true to delete metrics export related configurations.
        expected-version: The expected version of the security profile. A new version is generated whenever the security profile is updated. If you specify a value that is different from the actual version, a `VersionConflictException` is thrown.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        metrics-export-config: Specifies the MQTT topic and role ARN required for metric export.
        security-profile-description: A description of the security profile.
        security-profile-name: The name of the security profile you want to update.
