name: create-dataset
description: This operation applies only to Amazon Rekognition Custom Labels.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dataset-source=: The source files for the dataset.
    --dataset-type=!: The type of the dataset.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --project-arn=!: The ARN of the Amazon Rekognition Custom Labels project to which you want to asssign the dataset.
    --tags=: A set of tags (key-value pairs) that you want to attach to the dataset.
completion:
    flag:
        dataset-type:
            - TRAIN
            - TEST
documentation:
    command: |-
        This operation applies only to Amazon Rekognition Custom Labels.

        Creates a new Amazon Rekognition Custom Labels dataset. You can create a dataset by using an Amazon Sagemaker format manifest file or by copying an existing Amazon Rekognition Custom Labels dataset.

        To create a training dataset for a project, specify `TRAIN` for the value of `DatasetType`. To create the test dataset for a project, specify `TEST` for the value of `DatasetType`.

        The response from `CreateDataset` is the Amazon Resource Name (ARN) for the dataset. Creating a dataset takes a while to complete. Use [DescribeDataset]() to check the current status. The dataset created successfully if the value of `Status` is `CREATE_COMPLETE`.

        To check if any non-terminal errors occurred, call [ListDatasetEntries]() and check for the presence of `errors` lists in the JSON Lines.

        Dataset creation fails if a terminal error occurs (`Status` = `CREATE_FAILED`). Currently, you can't access the terminal error information.

        For more information, see Creating dataset in the *Amazon Rekognition Custom Labels Developer Guide*.

        This operation requires permissions to perform the `rekognition:CreateDataset` action. If you want to copy an existing dataset, you also require permission to perform the `rekognition:ListDatasetEntries` action.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dataset-source: The source files for the dataset. You can specify the ARN of an existing dataset or specify the Amazon S3 bucket location of an Amazon Sagemaker format manifest file. If you don't specify `datasetSource`, an empty dataset is created. To add labeled images to the dataset, You can use the console or call [UpdateDatasetEntries]().
        dataset-type: The type of the dataset. Specify `TRAIN` to create a training dataset. Specify `TEST` to create a test dataset.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        project-arn: The ARN of the Amazon Rekognition Custom Labels project to which you want to asssign the dataset.
        tags: A set of tags (key-value pairs) that you want to attach to the dataset.
