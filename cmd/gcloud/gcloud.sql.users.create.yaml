name: create
description: Creates a user in a given instance.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --database-roles=&: A comma-separated list of database roles to be assigned to the user.
    --host=: Cloud SQL user's hostname expressed as a specific IP address or address range.
    --instance=!: Cloud SQL instance ID.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-password-policy-enable-failed-attempts-check&: Enables the failed login attempts check if set to true.
    --no-password-policy-enable-password-verification&: The current password must be specified when altering the password.
    --password-policy-allowed-failed-attempts=: Number of failed login attempts allowed before a user is locked out.
    --password-policy-enable-failed-attempts-check: Enables the failed login attempts check if set to true.
    --password-policy-enable-password-verification: The current password must be specified when altering the password.
    --password-policy-password-expiration-duration=: Expiration duration after a password is updated, for example,
    --password=: Cloud SQL user's password.
    --type=: Cloud SQL user's type.
documentation:
    command: |-
        Creates a user in a given instance with specified username, host,
        type, and password.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        database-roles: |
            A comma-separated list of database roles to be assigned to the user.
            This option is only available for MySQL and PostgreSQL instances. You
            can include predefined Cloud SQL roles, like cloudsqlsuperuser, or your
            own custom roles. Custom roles must be created in the database before
            you can assign them. You can create roles using the CREATE ROLE
            statement for both MySQL and PostgreSQL.
        host: Cloud SQL user's hostname expressed as a specific IP address or address range. `%` denotes an unrestricted hostname. Applicable flag for MySQL instances; ignored for all other engines. Note, if you connect to your instance using IP addresses, you must add your client IP address as an authorized address, even if your hostname is unrestricted. For more information, see [Configure IP](https://cloud.google.com/sql/docs/mysql/configure-ip).
        instance: Cloud SQL instance ID.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-password-policy-enable-failed-attempts-check: Enables the failed login attempts check if set to true.
        no-password-policy-enable-password-verification: The current password must be specified when altering the password.
        password: Cloud SQL user's password.
        password-policy-allowed-failed-attempts: Number of failed login attempts allowed before a user is locked out.
        password-policy-enable-failed-attempts-check: Enables the failed login attempts check if set to true. Use *--password-policy-enable-failed-attempts-check* to enable and *--no-password-policy-enable-failed-attempts-check* to disable.
        password-policy-enable-password-verification: The current password must be specified when altering the password. Use *--password-policy-enable-password-verification* to enable and *--no-password-policy-enable-password-verification* to disable.
        password-policy-password-expiration-duration: |-
            Expiration duration after a password is updated, for example,
            2d for 2 days. See `gcloud topic datetimes` for information on
            duration formats.
        type: Cloud SQL user's type. It determines the method to authenticate the user during login. See the list of user types at https://cloud.google.com/sql/docs/postgres/admin-api/rest/v1beta4/SqlUserType
