name: delete-policy
description: Deletes the specified policy from the policy store.
flags:
    --policy-id=!: Specifies the ID of the policy that you want to delete.
    --policy-store-id=!: Specifies the ID of the policy store that contains the policy that you want to delete.
documentation:
    command: |-
        Deletes the specified policy from the policy store.

        This operation is idempotent; if you specify a policy that doesn't exist, the request response returns a successful `HTTP 200` status code.
    flag:
        policy-id: Specifies the ID of the policy that you want to delete.
        policy-store-id: Specifies the ID of the policy store that contains the policy that you want to delete.
