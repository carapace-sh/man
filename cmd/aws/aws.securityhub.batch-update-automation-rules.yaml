name: batch-update-automation-rules
description: Updates one or more automation rules based on rule Amazon Resource Names (ARNs) and input parameters.
flags:
    --update-automation-rules-request-items=!: An array of ARNs for the rules that are to be updated.
documentation:
    command: Updates one or more automation rules based on rule Amazon Resource Names (ARNs) and input parameters.
    flag:
        update-automation-rules-request-items: An array of ARNs for the rules that are to be updated. Optionally, you can also include `RuleStatus` and `RuleOrder`.
