name: get-current-user-data
description: Gets the real-time active user data from the specified Amazon Connect instance.
flags:
    --filters=!: The filters to apply to returned user data.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
documentation:
    command: Gets the real-time active user data from the specified Amazon Connect instance.
    flag:
        filters: |-
            The filters to apply to returned user data. You can filter up to the following limits:

            - Queues: 100
            - Routing profiles: 100
            - Agents: 100
            - Contact states: 9
            - User hierarchy groups: 1

            The user data is retrieved for only the specified values/resources in the filter. A maximum of one filter can be passed from queues, routing profiles, agents, and user hierarchy groups.

            Currently tagging is only supported on the resources that are passed in the filter.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        max-results: The maximum number of results to return per page.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
