name: list-partnerships
description: Lists the partnerships associated with your Amazon Web Services account for your current or specified region.
flags:
    --max-results=: Specifies the maximum number of capabilities to return.
    --next-token=: When additional results are obtained from the command, a `NextToken` parameter is returned in the output.
    --profile-id=: Specifies the unique, system-generated identifier for the profile connected to this partnership.
documentation:
    command: Lists the partnerships associated with your Amazon Web Services account for your current or specified region. A partnership represents the connection between you and your trading partner. It ties together a profile and one or more trading capabilities.
    flag:
        max-results: Specifies the maximum number of capabilities to return.
        next-token: When additional results are obtained from the command, a `NextToken` parameter is returned in the output. You can then pass the `NextToken` parameter in a subsequent command to continue listing additional resources.
        profile-id: Specifies the unique, system-generated identifier for the profile connected to this partnership.
