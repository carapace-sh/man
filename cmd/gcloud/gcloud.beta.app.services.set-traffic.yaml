name: set-traffic
description: '*(BETA)*  Set traffic splitting settings.'
flags:
    --migrate: The migrate flag determines whether or not to use traffic migration
    --no-migrate&: The migrate flag determines whether or not to use traffic migration
    --split-by=: Whether to split traffic based on cookie, IP address or random.
    --splits=!: Key-value pairs describing what proportion of traffic should go to
completion:
    flag:
        split-by:
            - cookie
            - ip
            - random
documentation:
    command: '*(BETA)*  This command sets the traffic split of versions across a service or a project.'
    flag:
        migrate: |-
            The migrate flag determines whether or not to use traffic migration
            during the operation. Traffic migration will attempt to automatically
            migrate traffic from the previous version to the new version, giving
            the autoscaler time to respond. See the documentation here:
            [](https://cloud.google.com/appengine/docs/python/console/trafficmigration)
            for more information.
        no-migrate: |-
            The migrate flag determines whether or not to use traffic migration
            during the operation. Traffic migration will attempt to automatically
            migrate traffic from the previous version to the new version, giving
            the autoscaler time to respond. See the documentation here:
            [](https://cloud.google.com/appengine/docs/python/console/trafficmigration)
            for more information.
        split-by: 'Whether to split traffic based on cookie, IP address or random. _SPLIT_BY_ must be one of: *cookie*, *ip*, *random*.'
        splits: |-
            Key-value pairs describing what proportion of traffic should go to
            each version. The split values are added together and used as
            weights. The exact values do not matter, only their relation to each
            other. For example, v1=2,v2=2 is equivalent to v1=.5,v2=.5
