name: enable-security-hub
description: Enables Security Hub for your account in the current Region or the Region you specify in the request.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --control-finding-generator=: This field, used when enabling Security Hub, specifies whether the calling account has consolidated control findings turned on.
    --enable-default-standards: Whether to enable the security standards that Security Hub has designated as automatically enabled.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-enable-default-standards: Whether to enable the security standards that Security Hub has designated as automatically enabled.
    --tags=: The tags to add to the hub resource when you enable Security Hub.
completion:
    flag:
        control-finding-generator:
            - STANDARD_CONTROL
            - SECURITY_CONTROL
documentation:
    command: |-
        Enables Security Hub for your account in the current Region or the Region you specify in the request.

        When you enable Security Hub, you grant to Security Hub the permissions necessary to gather findings from other services that are integrated with Security Hub.

        When you use the `EnableSecurityHub` operation to enable Security Hub, you also automatically enable the following standards:

        - Center for Internet Security (CIS) Amazon Web Services Foundations Benchmark v1.2.0
        - Amazon Web Services Foundational Security Best Practices

        Other standards are not automatically enabled.

        To opt out of automatically enabled standards, set `EnableDefaultStandards` to `false`.

        After you enable Security Hub, to enable a standard, use the `BatchEnableStandards` operation. To disable a standard, use the `BatchDisableStandards` operation.

        To learn more, see the [setup information](https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-settingup.html) in the *Security Hub User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        control-finding-generator: |-
            This field, used when enabling Security Hub, specifies whether the calling account has consolidated control findings turned on. If the value for this field is set to `SECURITY_CONTROL`, Security Hub generates a single finding for a control check even when the check applies to multiple enabled standards.

            If the value for this field is set to `STANDARD_CONTROL`, Security Hub generates separate findings for a control check when the check applies to multiple enabled standards.

            The value for this field in a member account matches the value in the administrator account. For accounts that aren't part of an organization, the default value of this field is `SECURITY_CONTROL` if you enabled Security Hub on or after February 23, 2023.
        enable-default-standards: Whether to enable the security standards that Security Hub has designated as automatically enabled. If you don't provide a value for `EnableDefaultStandards`, it is set to `true`. To not enable the automatically enabled standards, set `EnableDefaultStandards` to `false`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        tags: The tags to add to the hub resource when you enable Security Hub.
