name: get-identity-center-auth-token
description: Generates an encrypted authentication token that propagates the caller's Amazon Web Services IAM Identity Center identity to Amazon Redshift clusters.
flags:
    --cluster-ids=!: A list of cluster identifiers that the generated token can be used with.
documentation:
    command: |-
        Generates an encrypted authentication token that propagates the caller's Amazon Web Services IAM Identity Center identity to Amazon Redshift clusters. This API extracts the Amazon Web Services IAM Identity Center identity from enhanced credentials and creates a secure token that Amazon Redshift drivers can use for authentication.

        The token is encrypted using Key Management Service (KMS) and can only be decrypted by the specified Amazon Redshift clusters. The token contains the caller's Amazon Web Services IAM Identity Center identity information and is valid for a limited time period.

        This API is exclusively for use with Amazon Web Services IAM Identity Center enhanced credentials. If the caller is not using enhanced credentials with embedded Amazon Web Services IAM Identity Center identity, the API will return an error.
    flag:
        cluster-ids: "A list of cluster identifiers that the generated token can be used with. The token will be scoped to only allow authentication to the specified clusters.\n\nConstraints:\n\n- `ClusterIds` must contain at least 1 cluster identifier.\n- `ClusterIds` can hold a maximum of 20 cluster identifiers.\n- Cluster identifiers must be 1 to 63 characters in length.\n- The characters accepted for cluster identifiers are the following:\n  \n  - Alphanumeric characters\n  - Hyphens\n- Cluster identifiers must start with a letter.\n- Cluster identifiers can't end with a hyphen or contain two consecutive hyphens."
