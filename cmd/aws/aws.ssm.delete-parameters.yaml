name: delete-parameters
description: Delete a list of parameters.
flags:
    --names=!: The names of the parameters to delete.
documentation:
    command: Delete a list of parameters. After deleting a parameter, wait for at least 30 seconds to create a parameter with the same name.
    flag:
        names: |-
            The names of the parameters to delete. After deleting a parameter, wait for at least 30 seconds to create a parameter with the same name.

            You can't enter the Amazon Resource Name (ARN) for a parameter, only the parameter name itself.
