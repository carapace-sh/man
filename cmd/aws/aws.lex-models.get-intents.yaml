name: get-intents
description: |-
    Returns intent information as follows:

    - If you specify the `nameContains` field, returns the `$LATEST` version of all intents that contain the specified string.
flags:
    --max-results=: The maximum number of intents to return in the response.
    --name-contains=: Substring to match in intent names.
    --next-token=: A pagination token that fetches the next page of intents.
documentation:
    command: |-
        Returns intent information as follows:

        - If you specify the `nameContains` field, returns the `$LATEST` version of all intents that contain the specified string.
        - If you don't specify the `nameContains` field, returns information about the `$LATEST` version of all intents.

        The operation requires permission for the `lex:GetIntents` action.
    flag:
        max-results: The maximum number of intents to return in the response. The default is 10.
        name-contains: Substring to match in intent names. An intent will be returned if any part of its name matches the substring. For example, "xyz" matches both "xyzabc" and "abcxyz."
        next-token: A pagination token that fetches the next page of intents. If the response to this API call is truncated, Amazon Lex returns a pagination token in the response. To fetch the next page of intents, specify the pagination token in the next request.
