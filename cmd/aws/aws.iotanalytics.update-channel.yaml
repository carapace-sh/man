name: update-channel
description: Used to update the settings of a channel.
flags:
    --channel-name=!: The name of the channel to be updated.
    --channel-storage=: Where channel data is stored.
    --retention-period=: How long, in days, message data is kept for the channel.
documentation:
    command: Used to update the settings of a channel.
    flag:
        channel-name: The name of the channel to be updated.
        channel-storage: Where channel data is stored. You can choose one of `serviceManagedS3` or `customerManagedS3` storage. If not specified, the default is `serviceManagedS3`. You can't change this storage option after the channel is created.
        retention-period: How long, in days, message data is kept for the channel. The retention period can't be updated if the channel's Amazon S3 storage is customer-managed.
