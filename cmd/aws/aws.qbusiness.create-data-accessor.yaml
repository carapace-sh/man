name: create-data-accessor
description: Creates a new data accessor for an ISV to access data from a Amazon Q Business application.
flags:
    --action-configurations=!: A list of action configurations specifying the allowed actions and any associated filters.
    --application-id=!: The unique identifier of the Amazon Q Business application.
    --authentication-detail=: The authentication configuration details for the data accessor.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier you provide to ensure idempotency of the request.
    --display-name=!: A friendly name for the data accessor.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --principal=!: The Amazon Resource Name (ARN) of the IAM role for the ISV that will be accessing the data.
    --tags=: The tags to associate with the data accessor.
documentation:
    command: Creates a new data accessor for an ISV to access data from a Amazon Q Business application. The data accessor is an entity that represents the ISV's access to the Amazon Q Business application's data. It includes the IAM role ARN for the ISV, a friendly name, and a set of action configurations that define the specific actions the ISV is allowed to perform and any associated data filters. When the data accessor is created, an IAM Identity Center application is also created to manage the ISV's identity and authentication for accessing the Amazon Q Business application.
    flag:
        action-configurations: A list of action configurations specifying the allowed actions and any associated filters.
        application-id: The unique identifier of the Amazon Q Business application.
        authentication-detail: The authentication configuration details for the data accessor. This specifies how the ISV will authenticate when accessing data through this data accessor.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier you provide to ensure idempotency of the request.
        display-name: A friendly name for the data accessor.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        principal: The Amazon Resource Name (ARN) of the IAM role for the ISV that will be accessing the data.
        tags: The tags to associate with the data accessor.
