name: changes
description: '*(ALPHA)*  View details about changes to your Cloud DNS record-sets.'
documentation:
    command: |-
        *(ALPHA)*  View details about changes to your Cloud DNS record-sets.

        ## EXAMPLES

        To view the details of a particular change, run:

          $ gcloud alpha dns record-sets changes describe CHANGE_ID --zone=MANAGED_ZONE

        To view the list of all changes, run:

          $ gcloud alpha dns record-sets changes list --zone=MANAGED_ZONE
