name: delete-dbparameter-group
description: Deletes a specified DBParameterGroup.
flags:
    --dbparameter-group-name=!: The name of the DB parameter group.
documentation:
    command: Deletes a specified DBParameterGroup. The DBParameterGroup to be deleted can't be associated with any DB instances.
    flag:
        dbparameter-group-name: |-
            The name of the DB parameter group.

            Constraints:

            - Must be the name of an existing DB parameter group
            - You can't delete a default DB parameter group
            - Cannot be associated with any DB instances
