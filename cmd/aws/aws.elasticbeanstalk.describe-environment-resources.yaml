name: describe-environment-resources
description: Returns AWS resources for this environment.
flags:
    --environment-id=: The ID of the environment to retrieve AWS resource usage data.
    --environment-name=: The name of the environment to retrieve AWS resource usage data.
documentation:
    command: Returns AWS resources for this environment.
    flag:
        environment-id: |-
            The ID of the environment to retrieve AWS resource usage data.

            Condition: You must specify either this or an EnvironmentName, or both. If you do not specify either, AWS Elastic Beanstalk returns `MissingRequiredParameter` error.
        environment-name: |-
            The name of the environment to retrieve AWS resource usage data.

            Condition: You must specify either this or an EnvironmentId, or both. If you do not specify either, AWS Elastic Beanstalk returns `MissingRequiredParameter` error.
