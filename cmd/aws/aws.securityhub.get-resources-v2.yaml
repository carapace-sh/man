name: get-resources-v2
description: Returns a list of resources.
flags:
    --filters=: Filters resources based on a set of criteria.
    --max-results=: The maximum number of results to return.
    --next-token=: The token required for pagination.
    --sort-criteria=: The finding attributes used to sort the list of returned findings.
documentation:
    command: Returns a list of resources. This API is in public preview and subject to change.
    flag:
        filters: Filters resources based on a set of criteria.
        max-results: The maximum number of results to return.
        next-token: The token required for pagination. On your first call, set the value of this parameter to `NULL`. For subsequent calls, to continue listing data, set the value of this parameter to the value returned in the previous response.
        sort-criteria: The finding attributes used to sort the list of returned findings.
