name: tag-resource
description: Associate a set of tags with a Timestream resource.
flags:
    --resource-arn=!: Identifies the Timestream resource to which tags should be added.
    --tags=!: The tags to be assigned to the Timestream resource.
documentation:
    command: Associate a set of tags with a Timestream resource. You can then activate these user-defined tags so that they appear on the Billing and Cost Management console for cost allocation tracking.
    flag:
        resource-arn: Identifies the Timestream resource to which tags should be added. This value is an Amazon Resource Name (ARN).
        tags: The tags to be assigned to the Timestream resource.
