name: list-operations
description: Returns information about all of the operations that return an operation ID and that have ever been performed on domains that were registered by the current account.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --marker=: For an initial request for a list of operations, omit this element.
    --max-items=: Number of domains to be returned.
    --page-size=: The size of each page to get in the AWS service call.
    --sort-by=: The sort type for returned values.
    --sort-order=: The sort order for returned values, either ascending or descending.
    --starting-token=: A token to specify where to start paginating.
    --status=: The status of the operations.
    --submitted-since=: An optional parameter that lets you get information about all the operations that you submitted after a specified date and time.
    --type=: An arrays of the domains operation types.
completion:
    flag:
        sort-by:
            - SubmittedDate
        sort-order:
            - ASC
            - DESC
documentation:
    command: |-
        Returns information about all of the operations that return an operation ID and that have ever been performed on domains that were registered by the current account.

        This command runs only in the us-east-1 Region.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        marker: For an initial request for a list of operations, omit this element. If the number of operations that are not yet complete is greater than the value that you specified for `MaxItems`, you can use `Marker` to return additional operations. Get the value of `NextPageMarker` from the previous response, and submit another request that includes the value of `NextPageMarker` in the `Marker` element.
        max-items: |-
            Number of domains to be returned.

            Default: 20
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        sort-by: The sort type for returned values.
        sort-order: The sort order for returned values, either ascending or descending.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        status: The status of the operations.
        submitted-since: An optional parameter that lets you get information about all the operations that you submitted after a specified date and time. Specify the date and time in Unix time format and Coordinated Universal time (UTC).
        type: An arrays of the domains operation types.
