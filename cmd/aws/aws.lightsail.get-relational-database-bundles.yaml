name: get-relational-database-bundles
description: Returns the list of bundles that are available in Amazon Lightsail.
flags:
    --include-inactive=: A Boolean value that indicates whether to include inactive (unavailable) bundles in the response of your request.
    --page-token=: The token to advance to the next page of results from your request.
documentation:
    command: |-
        Returns the list of bundles that are available in Amazon Lightsail. A bundle describes the performance specifications for a database.

        You can use a bundle ID to create a new database with explicit performance specifications.
    flag:
        include-inactive: A Boolean value that indicates whether to include inactive (unavailable) bundles in the response of your request.
        page-token: |-
            The token to advance to the next page of results from your request.

            To get a page token, perform an initial `GetRelationalDatabaseBundles` request. If your results are paginated, the response will return a next page token that you can specify as the page token in a subsequent request.
