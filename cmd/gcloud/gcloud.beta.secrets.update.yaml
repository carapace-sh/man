name: update
description: '*(BETA)*  Update a secret''s metadata.'
flags:
    --add-topics=: List of Pub/Sub topics to add to the secret.
    --clear-annotations: Remove all Annotations.
    --clear-labels: Remove all labels.
    --clear-topics: Clear all Pub/Sub topics from the secret.
    --clear-version-aliases: Remove all Version Aliases.
    --etag=: Current entity tag (ETag) of the secret.
    --expire-time=: Timestamp at which to automatically delete the secret.
    --location=!: ID of the location or fully qualified identifier for the location.
    --next-rotation-time=: Timestamp at which to send rotation notification.
    --no-clear-annotations&: Remove all Annotations.
    --no-clear-labels&: Remove all labels.
    --no-clear-topics&: Clear all Pub/Sub topics from the secret.
    --no-clear-version-aliases&: Remove all Version Aliases.
    --no-remove-expiration&: If set, removes scheduled expiration from secret (if it had one).
    --no-remove-next-rotation-time&: Remove timestamp at which to send rotation notification.
    --no-remove-regional-kms-key-name&: If set, removes the regional kms key.
    --no-remove-rotation-period&: If set, removes the rotation period, cancelling all rotations except for the next one.
    --no-remove-rotation-schedule&: If set, removes rotation policy from a secret.
    --no-remove-version-destroy-ttl&: If set, removes the version destroy TTL from the secret.
    --regional-kms-key-name=: regional kms key name for regional secret.
    --remove-annotations=: List of Annotations to be removed.
    --remove-expiration: If set, removes scheduled expiration from secret (if it had one).
    --remove-labels=: List of label keys to remove.
    --remove-next-rotation-time: Remove timestamp at which to send rotation notification.
    --remove-regional-kms-key-name: If set, removes the regional kms key.
    --remove-rotation-period: If set, removes the rotation period, cancelling all rotations except for the next one.
    --remove-rotation-schedule: If set, removes rotation policy from a secret.
    --remove-topics=: List of Pub/Sub topics to remove from the secret.
    --remove-version-aliases=: List of Version Aliases to be removed.
    --remove-version-destroy-ttl: If set, removes the version destroy TTL from the secret.
    --rotation-period=: Duration of time (in seconds) between rotation notifications.
    --ttl=: Duration of time (in seconds) from the running of the command until the secret is automatically deleted.
    --update-annotations=: List of key-value pairs to set as Annotations.
    --update-labels=: List of label KEY=VALUE pairs to update.
    --update-version-aliases=: List of key-value pairs to set as Version Aliases.
    --version-destroy-ttl=: Secret Version TTL after destruction request.
documentation:
    command: |-
        *(BETA)*  Update a secret's metadata (e.g. labels). This command will
        return an error if given a secret that does not exist.

        ## EXAMPLES

            Update the label of a secret named `my-secret`.

          $ gcloud beta secrets update my-secret --update-labels=foo=bar

        Update the label of a secret using etag.

              $ gcloud beta secrets update my-secret --update-labels=foo=bar --etag=123

        Update the expiration of a secret named 'my-secret' using a ttl.

          $ gcloud beta secrets update my-secret --ttl="600s"

        Update the expiration of a secret named 'my-secret' using an expire-time.

          $ gcloud beta secrets update my-secret --expire-time="2030-01-01T08:15:30-05:00"

        Remove the expiration of a secret named 'my-secret'.

          $ gcloud beta secrets update my-secret --remove-expiration

        Update a secret to have a next-rotation-time:

          $ gcloud beta secrets update my-secret --next-rotation-time="2030-01-01T15:30:00-05:00"

        Update a secret to have a next-rotation-time and rotation-period:

          $ gcloud beta secrets update my-secret --next-rotation-time="2030-01-01T15:30:00-05:00"
          --rotation-period="7200s"

        Update a secret to remove the next-rotation-time:

          $ gcloud beta secrets update my-secret --remove-next-rotation-time

        Update a secret to clear rotation policy:

          $ gcloud beta secrets update my-secret --remove-rotation-schedule

        Update version destroy ttl of a secret:

          $ gcloud beta secrets update my-secret --version-destroy-ttl="86400s"

        Disable delayed secret version destroy:

          $ gcloud beta secrets update my-secret --remove-version-destroy-ttl
    flag:
        add-topics: List of Pub/Sub topics to add to the secret.
        clear-annotations: Remove all Annotations.
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        clear-topics: Clear all Pub/Sub topics from the secret.
        clear-version-aliases: Remove all Version Aliases.
        etag: Current entity tag (ETag) of the secret. If specified, the secret is updated only if the ETag provided matches the current secret's ETag.
        expire-time: Timestamp at which to automatically delete the secret.
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line.
        next-rotation-time: Timestamp at which to send rotation notification.
        no-clear-annotations: Remove all Annotations.
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        no-clear-topics: Clear all Pub/Sub topics from the secret.
        no-clear-version-aliases: Remove all Version Aliases.
        no-remove-expiration: If set, removes scheduled expiration from secret (if it had one).
        no-remove-next-rotation-time: Remove timestamp at which to send rotation notification.
        no-remove-regional-kms-key-name: If set, removes the regional kms key.
        no-remove-rotation-period: If set, removes the rotation period, cancelling all rotations except for the next one.
        no-remove-rotation-schedule: If set, removes rotation policy from a secret.
        no-remove-version-destroy-ttl: If set, removes the version destroy TTL from the secret.
        regional-kms-key-name: regional kms key name for regional secret.
        remove-annotations: List of Annotations to be removed.
        remove-expiration: If set, removes scheduled expiration from secret (if it had one).
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        remove-next-rotation-time: Remove timestamp at which to send rotation notification.
        remove-regional-kms-key-name: If set, removes the regional kms key.
        remove-rotation-period: If set, removes the rotation period, cancelling all rotations except for the next one.
        remove-rotation-schedule: If set, removes rotation policy from a secret.
        remove-topics: List of Pub/Sub topics to remove from the secret.
        remove-version-aliases: List of Version Aliases to be removed.
        remove-version-destroy-ttl: If set, removes the version destroy TTL from the secret.
        rotation-period: Duration of time (in seconds) between rotation notifications.
        ttl: Duration of time (in seconds) from the running of the command until the secret is automatically deleted.
        update-annotations: List of key-value pairs to set as Annotations.
        update-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        update-version-aliases: List of key-value pairs to set as Version Aliases.
        version-destroy-ttl: Secret Version TTL after destruction request. For secret with TTL>0, version destruction does not happen immediately on calling destroy; instead, the version goes to a disabled state and destruction happens after the TTL expires. See `$ gcloud topic datetimes` for information on duration formats.
