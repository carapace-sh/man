name: list-email-identities
description: Returns a list of all of the email identities that are associated with your Amazon Pinpoint account.
flags:
    --next-token=: A token returned from a previous call to `ListEmailIdentities` to indicate the position in the list of identities.
    --page-size=: The number of results to show in a single call to `ListEmailIdentities`.
documentation:
    command: Returns a list of all of the email identities that are associated with your Amazon Pinpoint account. An identity can be either an email address or a domain. This operation returns identities that are verified as well as those that aren't.
    flag:
        next-token: A token returned from a previous call to `ListEmailIdentities` to indicate the position in the list of identities.
        page-size: |-
            The number of results to show in a single call to `ListEmailIdentities`. If the number of results is larger than the number you specified in this parameter, then the response includes a `NextToken` element, which you can use to obtain additional results.

            The value you specify has to be at least 0, and can be no more than 1000.
