name: describe-organization-overview
description: Returns an overview of your organization's history based on the specified time range.
flags:
    --account-ids=:
        description: The ID of the Amazon Web Services account.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --from-time=!: The start of the time range passed in.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --organizational-unit-ids=:
        description: The ID of the organizational unit.
        nargs: -1
    --to-time=: The end of the time range passed in.
documentation:
    command: Returns an overview of your organization's history based on the specified time range. The overview includes the total reactive and proactive insights.
    flag:
        account-ids: The ID of the Amazon Web Services account.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        from-time: The start of the time range passed in. The start time granularity is at the day level. The floor of the start time is used. Returned information occurred after this day.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        organizational-unit-ids: The ID of the organizational unit.
        to-time: The end of the time range passed in. The start time granularity is at the day level. The floor of the start time is used. Returned information occurred before this day. If this is not specified, then the current day is used.
