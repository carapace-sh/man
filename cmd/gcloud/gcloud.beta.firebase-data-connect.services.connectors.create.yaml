    --display-name=: Mutable human-readable name.
    --labels=: Labels as key value pairs.
    --location=: The location id of the connector resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-validate-only&: If set, validate the request and preview the Connector, but do not
    --request-id=: An optional request ID to identify requests.
    --service=: The service id of the connector resource.
    --source-files=!: Required, The files that comprise the source set.
