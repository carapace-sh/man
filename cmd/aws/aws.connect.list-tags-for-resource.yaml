name: list-tags-for-resource
description: Lists the tags for the specified resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource.
documentation:
    command: |-
        Lists the tags for the specified resource.

        For sample policies that use tags, see [Amazon Connect Identity-Based Policy Examples](https://docs.aws.amazon.com/connect/latest/adminguide/security_iam_id-based-policy-examples.html) in the *Amazon Connect Administrator Guide*.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource. All Amazon Connect resources (instances, queues, flows, routing profiles, etc) have an ARN. To locate the ARN for an instance, for example, see [Find your Amazon Connect instance ID/ARN](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html).
