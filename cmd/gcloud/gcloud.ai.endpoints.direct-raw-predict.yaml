name: direct-raw-predict
description: Run Vertex AI online direct raw prediction.
flags:
    --json-request=!: Path to a local file containing the body of a JSON request.
    --region=: Cloud region for the endpoint.
documentation:
    command: |-
        `gcloud ai endpoints direct-raw-predict` sends a direct raw prediction request to Vertex AI endpoint for
           the given input. The request limit is 10MB.

        ## EXAMPLES

        To direct predict against an endpoint ``123'' under project ``example'' in
        region ``us-central1'', run:

          $ gcloud ai endpoints direct-raw-predict 123 --project=example --region=us-central1
          --json-request=input.json
    flag:
        json-request: |-
            Path to a local file containing the body of a JSON request.
            +
            An example of a JSON request:
            +
                {
                  "method_name": "my.method.Predict",
                  "input": "my request bytes"
                }
            +
            This flag accepts "-" for stdin.
        region: |-
            Cloud region for the endpoint.
            +
            To set the `region` attribute:
            * provide the argument `endpoint` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
