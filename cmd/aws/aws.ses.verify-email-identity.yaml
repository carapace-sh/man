name: verify-email-identity
description: Adds an email address to the list of identities for your Amazon SES account in the current Amazon Web Services Region and attempts to verify it.
flags:
    --email-address=!: The email address to be verified.
documentation:
    command: |-
        Adds an email address to the list of identities for your Amazon SES account in the current Amazon Web Services Region and attempts to verify it. As a result of executing this operation, a verification email is sent to the specified address.

        You can execute this operation no more than once per second.
    flag:
        email-address: The email address to be verified.
