name: update-matching-workflow
description: Updates an existing matching workflow.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description of the workflow.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --incremental-run-config=: Optional.
    --input-source-config=!:
        description: A list of `InputSource` objects, which have the fields `InputSourceARN` and `SchemaName`.
        nargs: -1
    --output-source-config=!:
        description: A list of `OutputSource` objects, each of which contains fields `outputS3Path`, `applyNormalization`, `KMSArn`, and `output`.
        nargs: -1
    --resolution-techniques=!: An object which defines the `resolutionType` and the `ruleBasedProperties`.
    --role-arn=!: The Amazon Resource Name (ARN) of the IAM role.
    --workflow-name=!: The name of the workflow to be retrieved.
documentation:
    command: |-
        Updates an existing matching workflow. The workflow must already exist for this operation to succeed.

        For workflows where `resolutionType` is `ML_MATCHING` or `PROVIDER`, incremental processing is not supported.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description of the workflow.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        incremental-run-config: |-
            Optional. An object that defines the incremental run type. This object contains only the `incrementalRunType` field, which appears as "Automatic" in the console.

            For workflows where `resolutionType` is `ML_MATCHING` or `PROVIDER`, incremental processing is not supported.
        input-source-config: A list of `InputSource` objects, which have the fields `InputSourceARN` and `SchemaName`.
        output-source-config: A list of `OutputSource` objects, each of which contains fields `outputS3Path`, `applyNormalization`, `KMSArn`, and `output`.
        resolution-techniques: An object which defines the `resolutionType` and the `ruleBasedProperties`.
        role-arn: The Amazon Resource Name (ARN) of the IAM role. Entity Resolution assumes this role to create resources on your behalf as part of workflow execution.
        workflow-name: The name of the workflow to be retrieved.
