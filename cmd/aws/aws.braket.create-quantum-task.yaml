name: create-quantum-task
description: Creates a quantum task.
flags:
    --action=!: The action associated with the quantum task.
    --associations=: The list of Amazon Braket resources associated with the quantum task.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=!: The client token associated with the request.
    --device-arn=!: The ARN of the device to run the quantum task on.
    --device-parameters=: The parameters for the device to run the quantum task on.
    --experimental-capabilities=: Enable experimental capabilities for the quantum task.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --job-token=: The token for an Amazon Braket hybrid job that associates it with the quantum task.
    --output-s3-bucket=!: The S3 bucket to store quantum task result files in.
    --output-s3-key-prefix=!: The key prefix for the location in the S3 bucket to store quantum task results in.
    --shots=!: The number of shots to use for the quantum task.
    --tags=: Tags to be added to the quantum task you're creating.
documentation:
    command: Creates a quantum task.
    flag:
        action: The action associated with the quantum task.
        associations: The list of Amazon Braket resources associated with the quantum task.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: The client token associated with the request.
        device-arn: The ARN of the device to run the quantum task on.
        device-parameters: The parameters for the device to run the quantum task on.
        experimental-capabilities: Enable experimental capabilities for the quantum task.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
