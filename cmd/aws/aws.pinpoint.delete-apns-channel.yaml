name: delete-apns-channel
description: Disables the APNs channel for an application and deletes any existing settings for the channel.
flags:
    --application-id=!: The unique identifier for the application.
documentation:
    command: Disables the APNs channel for an application and deletes any existing settings for the channel.
    flag:
        application-id: The unique identifier for the application. This identifier is displayed as the **Project ID** on the Amazon Pinpoint console.
