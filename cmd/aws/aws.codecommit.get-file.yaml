name: get-file
description: Returns the base-64 encoded contents of a specified file and its metadata.
flags:
    --commit-specifier=: The fully quaified reference that identifies the commit that contains the file.
    --file-path=!: The fully qualified path to the file, including the full name and extension of the file.
    --repository-name=!: The name of the repository that contains the file.
documentation:
    command: Returns the base-64 encoded contents of a specified file and its metadata.
    flag:
        commit-specifier: The fully quaified reference that identifies the commit that contains the file. For example, you can specify a full commit ID, a tag, a branch name, or a reference such as refs/heads/main. If none is provided, the head commit is used.
        file-path: The fully qualified path to the file, including the full name and extension of the file. For example, /examples/file.md is the fully qualified path to a file named file.md in a folder named examples.
        repository-name: The name of the repository that contains the file.
