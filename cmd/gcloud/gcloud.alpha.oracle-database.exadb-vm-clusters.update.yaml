documentation:
    command: '*(ALPHA)*  Update an exadbVmCluster'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        clear-labels: Clear labels value and set to empty map.
        clear-properties: Set exadbVmCluster.properties back to default value.
        labels: |-
            Set labels to new value. The labels or tags associated with the ExadbVmCluster.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: |-
            The location id of the exadbVmCluster resource.
            +
            To set the `location` attribute:
            * provide the argument `exadb_vm_cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-labels: Clear labels value and set to empty map.
        no-clear-properties: Set exadbVmCluster.properties back to default value.
        properties-node-count: The number of nodes/VMs in the ExadbVmCluster.
        remove-labels: |-
            Remove existing value from map labels. Sets `remove_labels` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-labels=string,string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-labels=["string"]
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-labels=path_to_file.(yaml|json)
            +
            ```
        request-id: |-
            An optional ID to identify the request. This value is used to identify
            duplicate requests. If you make a request with the same request ID
            and the original request is still in progress or completed, the server
            ignores the second request. This prevents clients from
            accidentally creating duplicate commitments.
            +
            The request ID must be a valid UUID with the exception that zero UUID is
            not supported (00000000-0000-0000-0000-000000000000).
        update-labels: |-
            Update labels value or add key value pair. The labels or tags associated with the ExadbVmCluster.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --update-labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --update-labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --update-labels=path_to_file.(yaml|json)
            +
            ```
