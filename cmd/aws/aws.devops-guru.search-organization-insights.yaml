name: search-organization-insights
description: Returns a list of insights in your organization.
flags:
    --account-ids=!: The ID of the Amazon Web Services account.
    --filters=: A `SearchOrganizationInsightsFilters` object that is used to set the severity and status filters on your insight search.
    --max-results=: The maximum number of results to return with a single call.
    --next-token=: The pagination token to use to retrieve the next page of results for this operation.
    --start-time-range=!: ""
    --type=!: The type of insights you are searching for (`REACTIVE` or `PROACTIVE`).
completion:
    flag:
        type:
            - REACTIVE
            - PROACTIVE
documentation:
    command: |-
        Returns a list of insights in your organization. You can specify which insights are returned by their start time, one or more statuses (`ONGOING`, `CLOSED`, and `CLOSED`), one or more severities (`LOW`, `MEDIUM`, and `HIGH`), and type (`REACTIVE` or `PROACTIVE`).

        Use the `Filters` parameter to specify status and severity search parameters. Use the `Type` parameter to specify `REACTIVE` or `PROACTIVE` in your search.
    flag:
        account-ids: The ID of the Amazon Web Services account.
        filters: A `SearchOrganizationInsightsFilters` object that is used to set the severity and status filters on your insight search.
        max-results: The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned `nextToken` value.
        next-token: The pagination token to use to retrieve the next page of results for this operation. If this value is null, it retrieves the first page.
        start-time-range: ""
        type: The type of insights you are searching for (`REACTIVE` or `PROACTIVE`).
