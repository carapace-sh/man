flags:
    --no-use-docker&: Use the Cloud Spanner emulator docker image even if the platform has a native binary available in the gcloud CLI.
    --use-docker: Use the Cloud Spanner emulator docker image even if the platform has a native binary available in the gcloud CLI.
documentation:
    command: '*(BETA)*  Print third-party notices for the local Cloud Spanner emulator.'
    flag:
        no-use-docker: Use the Cloud Spanner emulator docker image even if the platform has a native binary available in the gcloud CLI. Currently we only provide a native binary for Linux. For other systems, you must install Docker for your platform before starting the emulator.
        use-docker: Use the Cloud Spanner emulator docker image even if the platform has a native binary available in the gcloud CLI. Currently we only provide a native binary for Linux. For other systems, you must install Docker for your platform before starting the emulator.
