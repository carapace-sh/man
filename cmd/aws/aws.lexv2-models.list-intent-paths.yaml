name: list-intent-paths
description: Retrieves summary statistics for a path of intents that users take over sessions with your bot.
flags:
    --bot-id=!: The identifier for the bot for which you want to retrieve intent path metrics.
    --end-date-time=!: The date and time that marks the end of the range of time for which you want to see intent path metrics.
    --filters=: A list of objects, each describes a condition by which you want to filter the results.
    --intent-path=!: The intent path for which you want to retrieve metrics.
    --start-date-time=!: The date and time that marks the beginning of the range of time for which you want to see intent path metrics.
documentation:
    command: |-
        Retrieves summary statistics for a path of intents that users take over sessions with your bot. The following fields are required:

        - `startDateTime` and `endDateTime` – Define a time range for which you want to retrieve results.
        - `intentPath` – Define an order of intents for which you want to retrieve metrics. Separate intents in the path with a forward slash. For example, populate the `intentPath` field with `/BookCar/BookHotel` to see details about how many times users invoked the `BookCar` and `BookHotel` intents in that order.

        Use the optional `filters` field to filter the results.
    flag:
        bot-id: The identifier for the bot for which you want to retrieve intent path metrics.
        end-date-time: The date and time that marks the end of the range of time for which you want to see intent path metrics.
        filters: A list of objects, each describes a condition by which you want to filter the results.
        intent-path: |-
            The intent path for which you want to retrieve metrics. Use a forward slash to separate intents in the path. For example:

            - /BookCar
            - /BookCar/BookHotel
            - /BookHotel/BookCar
        start-date-time: The date and time that marks the beginning of the range of time for which you want to see intent path metrics.
