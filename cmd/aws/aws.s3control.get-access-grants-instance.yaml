name: get-access-grants-instance
description: Retrieves the S3 Access Grants instance for a Region in your account.
flags:
    --account-id=!: The Amazon Web Services account ID of the S3 Access Grants instance.
documentation:
    command: |-
        Retrieves the S3 Access Grants instance for a Region in your account.

        Permissions

        You must have the `s3:GetAccessGrantsInstance` permission to use this operation.

        `GetAccessGrantsInstance` is not supported for cross-account access. You can only call the API from the account that owns the S3 Access Grants instance.

        You must URL encode any signed header values that contain spaces. For example, if your header value is `my file.txt`, containing two spaces after `my`, you must URL encode this value to `my%20%20file.txt`.
    flag:
        account-id: The Amazon Web Services account ID of the S3 Access Grants instance.
