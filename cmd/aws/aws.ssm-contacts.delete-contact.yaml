name: delete-contact
description: To remove a contact from Incident Manager, you can delete the contact.
flags:
    --contact-id=!: The Amazon Resource Name (ARN) of the contact that you're deleting.
documentation:
    command: To remove a contact from Incident Manager, you can delete the contact. However, deleting a contact does not remove it from escalation plans and related response plans. Deleting an escalation plan also does not remove it from all related response plans. To modify an escalation plan, we recommend using the [UpdateContact]() action to specify a different existing contact.
    flag:
        contact-id: The Amazon Resource Name (ARN) of the contact that you're deleting.
