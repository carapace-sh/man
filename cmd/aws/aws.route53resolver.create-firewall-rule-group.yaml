name: create-firewall-rule-group
description: Creates an empty DNS Firewall rule group for filtering DNS network traffic in a VPC.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --creator-request-id=!: A unique string defined by you to identify the request.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: A name that lets you identify the rule group, to manage and use it.
    --tags=: A list of the tag keys and values that you want to associate with the rule group.
documentation:
    command: Creates an empty DNS Firewall rule group for filtering DNS network traffic in a VPC. You can add rules to the new rule group by calling [CreateFirewallRule]().
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
