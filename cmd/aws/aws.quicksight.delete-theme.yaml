name: delete-theme
description: Deletes a theme.
flags:
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the theme that you're deleting.
    --theme-id=!: An ID for the theme that you want to delete.
    --version-number=: The version of the theme that you want to delete.
documentation:
    command: Deletes a theme.
    flag:
        aws-account-id: The ID of the Amazon Web Services account that contains the theme that you're deleting.
        theme-id: An ID for the theme that you want to delete.
        version-number: |-
            The version of the theme that you want to delete.

            **Note:** If you don't provide a version number, you're using this call to `DeleteTheme` to delete all versions of the theme.
