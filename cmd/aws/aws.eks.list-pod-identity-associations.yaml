name: list-pod-identity-associations
description: List the EKS Pod Identity associations in a cluster.
flags:
    --cluster-name=!: The name of the cluster that the associations are in.
    --max-results=: The maximum number of EKS Pod Identity association results returned by `ListPodIdentityAssociations` in paginated output.
    --namespace=: The name of the Kubernetes namespace inside the cluster that the associations are in.
    --next-token=: The `nextToken` value returned from a previous paginated `ListUpdates` request where `maxResults` was used and the results exceeded the value of that parameter.
    --service-account=: The name of the Kubernetes service account that the associations use.
documentation:
    command: List the EKS Pod Identity associations in a cluster. You can filter the list by the namespace that the association is in or the service account that the association uses.
    flag:
        cluster-name: The name of the cluster that the associations are in.
        max-results: The maximum number of EKS Pod Identity association results returned by `ListPodIdentityAssociations` in paginated output. When you use this parameter, `ListPodIdentityAssociations` returns only `maxResults` results in a single page along with a `nextToken` response element. You can see the remaining results of the initial request by sending another `ListPodIdentityAssociations` request with the returned `nextToken` value. This value can be between 1 and 100. If you don't use this parameter, `ListPodIdentityAssociations` returns up to 100 results and a `nextToken` value if applicable.
        namespace: The name of the Kubernetes namespace inside the cluster that the associations are in.
        next-token: |-
            The `nextToken` value returned from a previous paginated `ListUpdates` request where `maxResults` was used and the results exceeded the value of that parameter. Pagination continues from the end of the previous results that returned the `nextToken` value.

            This token should be treated as an opaque identifier that is used only to retrieve the next items in a list and not for other programmatic purposes.
        service-account: The name of the Kubernetes service account that the associations use.
