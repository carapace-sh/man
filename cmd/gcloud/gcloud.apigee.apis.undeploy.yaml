name: undeploy
description: Undeploy an Apigee API proxy from an environment.
flags:
    --api=: API proxy to be undeployed.
    --environment=: Environment from which to undeploy the API proxy.
    --organization=: Apigee organization of the proxy and environment.
documentation:
    command: Undeploy an Apigee API proxy from an environment.
    flag:
        api: |-
            API proxy to be undeployed. Must currently be deployed. To get a list of available deployed proxies, run `{grandparent_command} deployments list --environment=ENV`.
            +
            To set the `api` attribute:
            * provide the argument `REVISION` on the command line with a fully specified name;
            * leave the argument unspecified for it to be chosen automatically with a fully specified name;
            * provide the argument `--api` on the command line.
        environment: |-
            Environment from which to undeploy the API proxy. To get a list of available environments, run `{grandparent_command} environments list`.
            +
            To set the `environment` attribute:
            * provide the argument `REVISION` on the command line with a fully specified name;
            * leave the argument unspecified for it to be chosen automatically with a fully specified name;
            * provide the argument `--environment` on the command line.
        organization: |-
            Apigee organization of the proxy and environment.
            +
            To set the `organization` attribute:
            * provide the argument `REVISION` on the command line with a fully specified name;
            * leave the argument unspecified for it to be chosen automatically with a fully specified name;
            * provide the argument `--organization` on the command line;
            * set the property [project] or provide the argument [--project] on the command line, using a Cloud Platform project with an associated Apigee organization.
