name: untag-resource
description: Removes one or more tags (keys and values) from an application, campaign, message template, or segment.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource.
    --tag-keys=!: The key of the tag to remove from the resource.
documentation:
    command: Removes one or more tags (keys and values) from an application, campaign, message template, or segment.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource.
        tag-keys: The key of the tag to remove from the resource. To remove multiple tags, append the tagKeys parameter and argument for each additional tag to remove, separated by an ampersand (&amp;).
