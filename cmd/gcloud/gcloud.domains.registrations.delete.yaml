name: delete
description: Delete a Cloud Domains registration.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |-
        Delete a registration resource.

        Delete can only be called on registrations in state EXPORTED with expire_time
        in the past.
        It also works for registrations in state REGISTRATION_FAILED, TRANSFER_FAILED,
        and TRANSFER_PENDING.

        ## EXAMPLES

        To delete a registration for ``example.com'', run:

          $ gcloud domains registrations delete example.com
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
