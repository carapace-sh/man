name: untag-role
description: Removes the specified tags from the role.
flags:
    --role-name=!: The name of the IAM role from which you want to remove tags.
    --tag-keys=!: A list of key names as a simple array of strings.
documentation:
    command: Removes the specified tags from the role. For more information about tagging, see [Tagging IAM resources](https://docs.aws.amazon.com/IAM/latest/UserGuide/id_tags.html) in the *IAM User Guide*.
    flag:
        role-name: |-
            The name of the IAM role from which you want to remove tags.

            This parameter accepts (through its [regex pattern](http://wikipedia.org/wiki/regex)) a string of characters that consist of upper and lowercase alphanumeric characters with no spaces. You can also include any of the following characters: \_+=,.@-
        tag-keys: A list of key names as a simple array of strings. The tags with matching keys are removed from the specified role.
