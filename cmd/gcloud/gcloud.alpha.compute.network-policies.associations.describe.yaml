name: describe
description: '*(ALPHA)*  Describe an association between a network policy and a network.'
flags:
    --name=!: Name of the association to describe.
    --network-policy-region=: Region of the network policy to describe.
    --network-policy=!: Network Policy ID with which to describe association.
documentation:
    command: '*(ALPHA)*  *gcloud alpha compute network-policies associations describe* is used to describe network policy associations.'
    flag:
        name: Name of the association to describe.
        network-policy: Network Policy ID with which to describe association.
        network-policy-region: Region of the network policy to describe. Overrides the default *compute/region* property value for this command invocation.
