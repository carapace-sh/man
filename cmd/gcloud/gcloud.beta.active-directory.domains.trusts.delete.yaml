name: delete
description: '*(BETA)*  Delete an Active Directory Trust between a Managed Microsoft AD domain and a target domain.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --target-domain-name=!: Target domain name for the Managed Microsoft AD trust you want to delete.
documentation:
    command: |
        *(BETA)*  Delete an Active Directory trust between a Managed Microsoft AD domain and a target domain.

        This command can fail for the following reasons:
          * The domain specified does not exist.
          * The active account does not have permission to access the given
            domain.
          * The AD trust specified does not exist.
          * The active account does not have permission to access the given
            AD trust.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        target-domain-name: Target domain name for the Managed Microsoft AD trust you want to delete.
