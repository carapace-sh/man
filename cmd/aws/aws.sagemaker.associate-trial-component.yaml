name: associate-trial-component
description: Associates a trial component with a trial.
flags:
    --trial-component-name=!: The name of the component to associated with the trial.
    --trial-name=!: The name of the trial to associate with.
documentation:
    command: Associates a trial component with a trial. A trial component can be associated with multiple trials. To disassociate a trial component from a trial, call the [DisassociateTrialComponent](https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_DisassociateTrialComponent.html) API.
    flag:
        trial-component-name: The name of the component to associated with the trial.
        trial-name: The name of the trial to associate with.
