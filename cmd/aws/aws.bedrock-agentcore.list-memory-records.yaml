name: list-memory-records
description: Lists memory records in an AgentCore Memory resource based on specified criteria.
flags:
    --max-results=: The maximum number of results to return in a single call.
    --memory-id=!: The identifier of the AgentCore Memory resource for which to list memory records.
    --memory-strategy-id=: The memory strategy identifier to filter memory records by.
    --namespace=!: The namespace to filter memory records by.
    --next-token=: The token for the next set of results.
documentation:
    command: |-
        Lists memory records in an AgentCore Memory resource based on specified criteria. We recommend using pagination to ensure that the operation returns quickly and successfully.

        To use this operation, you must have the `bedrock-agentcore:ListMemoryRecords` permission.
    flag:
        max-results: The maximum number of results to return in a single call. Minimum value of 1, maximum value of 100. Default is 20.
        memory-id: The identifier of the AgentCore Memory resource for which to list memory records.
        memory-strategy-id: The memory strategy identifier to filter memory records by. If specified, only memory records with this strategy ID are returned.
        namespace: The namespace to filter memory records by. If specified, only memory records in this namespace are returned.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
