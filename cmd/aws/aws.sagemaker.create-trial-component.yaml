name: create-trial-component
description: Creates a *trial component*, which is a stage of a machine learning *trial*.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --display-name=: The name of the component as displayed.
    --end-time=: When the component ended.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --input-artifacts=: The input artifacts for the component.
    --metadata-properties=: ""
    --output-artifacts=: The output artifacts for the component.
    --parameters=: The hyperparameters for the component.
    --start-time=: When the component started.
    --status=: The status of the component.
    --tags=:
        description: A list of tags to associate with the component.
        nargs: -1
    --trial-component-name=!: The name of the component.
documentation:
    command: |-
        Creates a *trial component*, which is a stage of a machine learning *trial*. A trial is composed of one or more trial components. A trial component can be used in multiple trials.

        Trial components include pre-processing jobs, training jobs, and batch transform jobs.

        When you use SageMaker Studio or the SageMaker Python SDK, all experiments, trials, and trial components are automatically tracked, logged, and indexed. When you use the Amazon Web Services SDK for Python (Boto), you must use the logging APIs provided by the SDK.

        You can add tags to a trial component and then use the [Search](https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_Search.html) API to search for the tags.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        display-name: The name of the component as displayed. The name doesn't need to be unique. If `DisplayName` isn't specified, `TrialComponentName` is displayed.
        end-time: When the component ended.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        input-artifacts: The input artifacts for the component. Examples of input artifacts are datasets, algorithms, hyperparameters, source code, and instance types.
        metadata-properties: ""
        output-artifacts: The output artifacts for the component. Examples of output artifacts are metrics, snapshots, logs, and images.
        parameters: The hyperparameters for the component.
        start-time: When the component started.
        status: |-
            The status of the component. States include:

            - InProgress
            - Completed
            - Failed
        tags: A list of tags to associate with the component. You can use [Search](https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_Search.html) API to search on the tags.
        trial-component-name: The name of the component. The name must be unique in your Amazon Web Services account and is not case-sensitive.
