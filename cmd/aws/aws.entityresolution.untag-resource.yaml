name: untag-resource
description: Removes one or more tags from the specified Entity Resolution resource.
flags:
    --resource-arn=!: The ARN of the resource for which you want to untag.
    --tag-keys=!: The list of tag keys to remove from the resource.
documentation:
    command: Removes one or more tags from the specified Entity Resolution resource. In Entity Resolution, `SchemaMapping`, and `MatchingWorkflow` can be tagged.
    flag:
        resource-arn: The ARN of the resource for which you want to untag.
        tag-keys: The list of tag keys to remove from the resource.
