name: delete-call-analytics-job
description: Deletes a Call Analytics job.
flags:
    --call-analytics-job-name=!: The name of the Call Analytics job you want to delete.
documentation:
    command: Deletes a Call Analytics job. To use this operation, specify the name of the job you want to delete using `CallAnalyticsJobName`. Job names are case sensitive.
    flag:
        call-analytics-job-name: The name of the Call Analytics job you want to delete. Job names are case sensitive.
