name: batch-update-exclusion-windows
description: Add or remove time window exclusions for one or more Service Level Objectives (SLOs).
flags:
    --add-exclusion-windows=: A list of exclusion windows to add to the specified SLOs.
    --remove-exclusion-windows=: A list of exclusion windows to remove from the specified SLOs.
    --slo-ids=!: The list of SLO IDs to add or remove exclusion windows from.
documentation:
    command: Add or remove time window exclusions for one or more Service Level Objectives (SLOs).
    flag:
        add-exclusion-windows: A list of exclusion windows to add to the specified SLOs. You can add up to 10 exclusion windows per SLO.
        remove-exclusion-windows: A list of exclusion windows to remove from the specified SLOs. The window configuration must match an existing exclusion window.
        slo-ids: The list of SLO IDs to add or remove exclusion windows from.
