name: describe
description: '*(BETA)*  Describe a health aggregation policy.'
flags:
    --region=: The name of the Google Compute Engine region.
documentation:
    command: '*(BETA)*  Describe a health aggregation policy.'
    flag:
        region: |-
            The name of the Google Compute Engine region.
            +
            To set the `region` attribute:
            * provide the argument `health_aggregation_policy` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `compute/region`.
