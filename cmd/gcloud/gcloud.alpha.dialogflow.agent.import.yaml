name: import
description: '*(ALPHA)*  Import a Dialogflow agent from a zip file.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-replace-all&: If true, replace the current agent version with a new one.
    --replace-all: If true, replace the current agent version with a new one.
    --source=!: Path to a file or the URI to a Google Cloud Storage file containing the agent to import.
documentation:
    command: |
        *(ALPHA)*  Import a Dialogflow agent from a ZIP file and upload it to the agent of the current project.
        By default, uploads new intents and entity types without deleting the existing ones. Intents
        and entity types with the same name are replaced with the new versions.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-replace-all: |
            If true, replace the current agent version with a new one. All the intents and entity types
            in the older version will be deleted.
        replace-all: |-
            If true, replace the current agent version with a new one. All the intents and entity types
            in the older version will be deleted.
        source: |-
            Path to a file or the URI to a Google Cloud Storage file containing the agent to import.
            Note: A URI must start with "gs://".
