name: untag-resource
description: Removes metadata tags from a FinSpace resource.
flags:
    --resource-arn=!: A FinSpace resource from which you want to remove a tag or tags.
    --tag-keys=!: The tag keys (names) of one or more tags to be removed.
documentation:
    command: Removes metadata tags from a FinSpace resource.
    flag:
        resource-arn: A FinSpace resource from which you want to remove a tag or tags. The value for this parameter is an Amazon Resource Name (ARN).
        tag-keys: The tag keys (names) of one or more tags to be removed.
