name: update-content
description: Updates information about the content.
flags:
    --content-id=!: The identifier of the content.
    --knowledge-base-id=!: The identifier of the knowledge base.
    --metadata=: A key/value map to store attributes without affecting tagging or recommendations.
    --no-remove-override-link-out-uri: Unset the existing `overrideLinkOutUri` if it exists.
    --override-link-out-uri=: The URI for the article.
    --remove-override-link-out-uri: Unset the existing `overrideLinkOutUri` if it exists.
    --revision-id=: The `revisionId` of the content resource to update, taken from an earlier call to `GetContent`, `GetContentSummary`, `SearchContent`, or `ListContents`.
    --title=: The title of the content.
    --upload-id=: A pointer to the uploaded asset.
documentation:
    command: Updates information about the content.
    flag:
        content-id: The identifier of the content. Can be either the ID or the ARN. URLs cannot contain the ARN.
        knowledge-base-id: The identifier of the knowledge base. This should not be a QUICK\_RESPONSES type knowledge base if you're storing Wisdom Content resource to it. Can be either the ID or the ARN
        metadata: A key/value map to store attributes without affecting tagging or recommendations. For example, when synchronizing data between an external system and Wisdom, you can store an external version identifier as metadata to utilize for determining drift.
        override-link-out-uri: The URI for the article. If the knowledge base has a templateUri, setting this argument overrides it for this piece of content. To remove an existing `overrideLinkOurUri`, exclude this argument and set `removeOverrideLinkOutUri` to true.
        remove-override-link-out-uri: Unset the existing `overrideLinkOutUri` if it exists.
        revision-id: The `revisionId` of the content resource to update, taken from an earlier call to `GetContent`, `GetContentSummary`, `SearchContent`, or `ListContents`. If included, this argument acts as an optimistic lock to ensure content was not modified since it was last read. If it has been modified, this API throws a `PreconditionFailedException`.
        title: The title of the content.
        upload-id: A pointer to the uploaded asset. This value is returned by [StartContentUpload](https://docs.aws.amazon.com/wisdom/latest/APIReference/API_StartContentUpload.html).
