name: is-member-in-groups
description: Checks the user's membership in all requested groups and returns if the member exists in all queried groups.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --group-ids=!:
        description: A list of identifiers for groups in the identity store.
        nargs: -1
    --identity-store-id=!: The globally unique identifier for the identity store.
    --member-id=!: An object containing the identifier of a group member.
documentation:
    command: |-
        Checks the user's membership in all requested groups and returns if the member exists in all queried groups.

        If you have access to a member account, you can use this API operation from the member account. For more information, see [Limiting access to the identity store from member accounts](https://docs.aws.amazon.com/singlesignon/latest/userguide/manage-your-accounts.html#limiting-access-from-member-accounts) in the *IAM Identity Center User Guide*.
