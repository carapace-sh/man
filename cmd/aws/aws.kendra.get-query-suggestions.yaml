name: get-query-suggestions
description: Fetches the queries that are suggested to your users.
flags:
    --attribute-suggestions-config=: Configuration information for the document fields/attributes that you want to base query suggestions on.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --index-id=!: The identifier of the index you want to get query suggestions from.
    --max-suggestions-count=: The maximum number of query suggestions you want to show to your users.
    --query-text=!: The text of a user's query to generate query suggestions.
    --suggestion-types=: The suggestions type to base query suggestions on.
documentation:
    command: |-
        Fetches the queries that are suggested to your users.

        `GetQuerySuggestions` is currently not supported in the Amazon Web Services GovCloud (US-West) region.
    flag:
        attribute-suggestions-config: Configuration information for the document fields/attributes that you want to base query suggestions on.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        index-id: The identifier of the index you want to get query suggestions from.
        max-suggestions-count: The maximum number of query suggestions you want to show to your users.
        query-text: |-
            The text of a user's query to generate query suggestions.

            A query is suggested if the query prefix matches what a user starts to type as their query.

            Amazon Kendra does not show any suggestions if a user types fewer than two characters or more than 60 characters. A query must also have at least one search result and contain at least one word of more than four characters.
        suggestion-types: |-
            The suggestions type to base query suggestions on. The suggestion types are query history or document fields/attributes. You can set one type or the other.

            If you set query history as your suggestions type, Amazon Kendra suggests queries relevant to your users based on popular queries in the query history.

            If you set document fields/attributes as your suggestions type, Amazon Kendra suggests queries relevant to your users based on the contents of document fields.
