name: associate-security-group-vpc
description: Associates a security group with another VPC in the same Region.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --group-id=!: A security group ID.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --vpc-id=!: A VPC ID.
documentation:
    command: |-
        Associates a security group with another VPC in the same Region. This enables you to use the same security group with network interfaces and instances in the specified VPC.

        - The VPC you want to associate the security group with must be in the same Region.
        - You can associate the security group with another VPC if your account owns the VPC or if the VPC was shared with you.
        - You must own the security group.
        - You cannot use this feature with default security groups.
        - You cannot use this feature with the default VPC.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        group-id: A security group ID.
        vpc-id: A VPC ID.
