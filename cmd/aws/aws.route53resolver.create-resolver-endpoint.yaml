name: create-resolver-endpoint
description: Creates a Resolver endpoint.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --creator-request-id=!: A unique string that identifies the request and that allows failed requests to be retried without the risk of running the operation twice.
    --direction=!: 'Specify the applicable value:'
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ip-addresses=!: The subnets and IP addresses in your VPC that DNS queries originate from (for outbound endpoints) or that you forward DNS queries to (for inbound endpoints).
    --name=: A friendly name that lets you easily find a configuration in the Resolver dashboard in the Route 53 console.
    --outpost-arn=: The Amazon Resource Name (ARN) of the Outpost.
    --preferred-instance-type=: The instance type.
    --protocols=: The protocols you want to use for the endpoint.
    --resolver-endpoint-type=: For the endpoint type you can choose either IPv4, IPv6, or dual-stack.
    --security-group-ids=!: The ID of one or more security groups that you want to use to control access to this VPC.
    --tags=: A list of the tag keys and values that you want to associate with the endpoint.
completion:
    flag:
        direction:
            - INBOUND
            - OUTBOUND
            - INBOUND_DELEGATION
        resolver-endpoint-type:
            - IPV6
            - IPV4
            - DUALSTACK
documentation:
    command: |-
        Creates a Resolver endpoint. There are two types of Resolver endpoints, inbound and outbound:

        - An *inbound Resolver endpoint* forwards DNS queries to the DNS service for a VPC from your network.
        - An *outbound Resolver endpoint* forwards DNS queries from the DNS service for a VPC to your network.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        creator-request-id: A unique string that identifies the request and that allows failed requests to be retried without the risk of running the operation twice. `CreatorRequestId` can be any unique string, for example, a date/time stamp.
        direction: |-
            Specify the applicable value:

            - `INBOUND`: Resolver forwards DNS queries to the DNS service for a VPC from your network.
            - `OUTBOUND`: Resolver forwards DNS queries from the DNS service for a VPC to your network.
            - `INBOUND_DELEGATION`: Resolver delegates queries to Route 53 private hosted zones from your network.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ip-addresses: |-
            The subnets and IP addresses in your VPC that DNS queries originate from (for outbound endpoints) or that you forward DNS queries to (for inbound endpoints). The subnet ID uniquely identifies a VPC.

            Even though the minimum is 1, Route 53 requires that you create at least two.
        name: A friendly name that lets you easily find a configuration in the Resolver dashboard in the Route 53 console.
        outpost-arn: The Amazon Resource Name (ARN) of the Outpost. If you specify this, you must also specify a value for the `PreferredInstanceType`.
        preferred-instance-type: The instance type. If you specify this, you must also specify a value for the `OutpostArn`.
        protocols: |-
            The protocols you want to use for the endpoint. DoH-FIPS is applicable for default inbound endpoints only.

            For a default inbound endpoint you can apply the protocols as follows:

            - Do53 and DoH in combination.
            - Do53 and DoH-FIPS in combination.
            - Do53 alone.
            - DoH alone.
            - DoH-FIPS alone.
            - None, which is treated as Do53.

            For a delegation inbound endpoint you can use Do53 only.

            For an outbound endpoint you can apply the protocols as follows:

            - Do53 and DoH in combination.
            - Do53 alone.
            - DoH alone.
            - None, which is treated as Do53.
        resolver-endpoint-type: For the endpoint type you can choose either IPv4, IPv6, or dual-stack. A dual-stack endpoint means that it will resolve via both IPv4 and IPv6. This endpoint type is applied to all IP addresses.
        security-group-ids: |-
            The ID of one or more security groups that you want to use to control access to this VPC. The security group that you specify must include one or more inbound rules (for inbound Resolver endpoints) or outbound rules (for outbound Resolver endpoints). Inbound and outbound rules must allow TCP and UDP access. For inbound access, open port 53. For outbound access, open the port that you're using for DNS queries on your network.

            Some security group rules will cause your connection to be tracked. For outbound resolver endpoint, it can potentially impact the maximum queries per second from outbound endpoint to your target name server. For inbound resolver endpoint, it can bring down the overall maximum queries per second per IP address to as low as 1500. To avoid connection tracking caused by security group, see [Untracked connections](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/security-group-connection-tracking.html#untracked-connectionsl).
        tags: A list of the tag keys and values that you want to associate with the endpoint.
