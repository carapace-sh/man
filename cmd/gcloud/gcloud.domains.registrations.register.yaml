name: register
description: Register a new domain.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --cloud-dns-zone=: The name of the Cloud DNS managed-zone to set as the name server for the domain.
    --contact-data-from-file=: 'A YAML file containing the contact data for the domain''s three contacts:'
    --contact-privacy=: The contact privacy mode to use.
    --disable-dnssec: Use this flag to disable DNSSEC, or to skip enabling it when switching
    --labels=: List of label KEY=VALUE pairs to add.
    --name-servers=: List of DNS name servers for the domain.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-disable-dnssec&: Use this flag to disable DNSSEC, or to skip enabling it when switching
    --no-use-google-domains-dns&: (REMOVED) Use free name servers provided by Google Domains.
    --no-validate-only&: Don't actually create registration.
    --notices=: Notices about special properties of certain domains or contacts.
    --use-google-domains-dns: (REMOVED) Use free name servers provided by Google Domains.
    --validate-only: Don't actually create registration.
    --yearly-price=: Accept the domain's yearly price in the interactive flow or by using this flag.
completion:
    flag:
        contact-privacy:
            - private-contact-data
            - public-contact-data
            - redacted-contact-data
documentation:
    command: |-
        Create a new Cloud Domains registration resource by registering a new domain.
        The new resource's ID will be equal to the domain name.

        After this command executes, the resource will be in state
        REGISTRATION_PENDING. The registration process should complete in less than 5
        minutes. After that the resource will be in state ACTIVE. In rare
        cases this process can take much longer due, for example, to a downtime of the
        domain registry.

        Also in rare cases, the domain may end up in state REGISTRATION_FAILED. In
        that case, delete the registration resource and try again.

        When using Cloud DNS Zone DNSSEC will be enabled by default whenever the Zone
        is DNSSEC signed. You can choose to not enable DNSSEC by using the
        --disable-dnssec flag.

        ## EXAMPLES

        To register ``example.com'' interactively, run:

          $ gcloud domains registrations register example.com

        To register ``example.com'' using contact data from a YAML file
        ``contacts.yaml'', run:

          $ gcloud domains registrations register example.com --contact-data-from-file=contacts.yaml

        To register ``example.com'' with interactive prompts disabled, provide
        --contact-data-from-file, --contact-privacy, --yearly-price flags and one of
        the flags for setting authoritative name servers. Sometimes also --notices
        flag is required. For example, run:

          $ gcloud domains registrations register example.com --contact-data-from-file=contacts.yaml --contact-privacy=private-contact-data --yearly-price="12.00 USD" --cloud-dns-zone=example-com --quiet
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        cloud-dns-zone: |-
            The name of the Cloud DNS managed-zone to set as the name server for the domain.
            If it's in the same project, you can use short name. If not, use the full resource name, e.g.: --cloud-dns-zone=projects/example-project/managedZones/example-zone.
            If the zone is signed, DNSSEC will be enabled by default unless you pass --disable-dnssec.
        contact-data-from-file: |-
            A YAML file containing the contact data for the domain's three contacts:
            registrant, admin, and technical.
            +
            The file can either specify a single set of contact data with label
            'allContacts', or three separate sets of contact data with labels
            'adminContact' and 'technicalContact'.
            +
            Each contact data must contain values for all required fields: email,
            phoneNumber and postalAddress in google.type.PostalAddress format.
            +
            For more guidance on how to specify postalAddress, please see:
            https://support.google.com/business/answer/6397478
            +
            Examples of file contents:
            +
            ```
            allContacts:
              email: 'example@example.com'
              phoneNumber: '+1.8005550123'
              postalAddress:
                regionCode: 'US'
                postalCode: '94043'
                administrativeArea: 'CA'
                locality: 'Mountain View'
                addressLines: ['1600 Amphitheatre Pkwy']
                recipients: ['Jane Doe']
            ```
            +
            ```
            registrantContact:
              email: 'registrant@example.com'
              phoneNumber: '+1.8005550123'
              postalAddress:
                regionCode: 'US'
                postalCode: '94043'
                administrativeArea: 'CA'
                locality: 'Mountain View'
                addressLines: ['1600 Amphitheatre Pkwy']
                recipients: ['Registrant Jane Doe']
            adminContact:
              email: 'admin@example.com'
              phoneNumber: '+1.8005550123'
              postalAddress:
                regionCode: 'US'
                postalCode: '94043'
                administrativeArea: 'CA'
                locality: 'Mountain View'
                addressLines: ['1600 Amphitheatre Pkwy']
                recipients: ['Admin Jane Doe']
            technicalContact:
              email: 'technical@example.com'
              phoneNumber: '+1.8005550123'
              postalAddress:
                regionCode: 'US'
                postalCode: '94043'
                administrativeArea: 'CA'
                locality: 'Mountain View'
                addressLines: ['1600 Amphitheatre Pkwy']
                recipients: ['Technic Jane Doe']
            ```
        contact-privacy: |-
            The contact privacy mode to use. Supported privacy modes depend on the domain. _CONTACT_PRIVACY_ must be one of:
            +
            *private-contact-data*::: (DEPRECATED) Your contact info won't be available to the public. To help protect your info and prevent spam, a third party provides alternate (proxy) contact info for your domain in the public directory at no extra cost. They will forward received messages to you. The private-contact-data option is deprecated; See https://cloud.google.com/domains/docs/deprecations/feature-deprecations.
            *public-contact-data*::: All the data from contact config is publicly available. To set this value, you must also pass the --notices flag with value public-contact-data-acknowledgement or agree to the notice interactively.
            *redacted-contact-data*::: Limited personal information will be available to the public. The actual information redacted depends on the domain. For more information see https://support.google.com/domains/answer/3251242.
            :::
            +
        disable-dnssec: |-
            Use this flag to disable DNSSEC, or to skip enabling it when switching
            to a Cloud DNS Zone or Google Domains nameservers.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        name-servers: List of DNS name servers for the domain.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-disable-dnssec: |
            Use this flag to disable DNSSEC, or to skip enabling it when switching
            to a Cloud DNS Zone or Google Domains nameservers.
        no-use-google-domains-dns: |-
            (REMOVED) Use free name servers provided by Google Domains.
            If the zone is signed, DNSSEC will be enabled by default unless you pass --disable-dnssec.
            +
            Flag --use-google-domains-dns has been removed.
        no-validate-only: Don't actually create registration. Only validate arguments.
        notices: |-
            Notices about special properties of certain domains or contacts. _NOTICE_ must be one of:
            +
            *public-contact-data-acknowledgement*::: By sending this notice you acknowledge that using public-contact-data contact privacy makes all the data from contact config publicly available.
            *hsts-preloaded*::: By sending this notice you acknowledge that the domain is preloaded on the HTTP Strict Transport Security list in browsers. Serving a website on such domain will require an SSL certificate. See https://support.google.com/domains/answer/7638036 for details.
            :::
            +
        use-google-domains-dns: |-
            (REMOVED) Use free name servers provided by Google Domains.
            If the zone is signed, DNSSEC will be enabled by default unless you pass --disable-dnssec.
            +
            Flag --use-google-domains-dns has been removed.
        validate-only: Don't actually create registration. Only validate arguments.
        yearly-price: Accept the domain's yearly price in the interactive flow or by using this flag. Use a number followed by a currency code, for example, "12.00 USD". Get the price using the get-register-parameters command.
