name: update
description: '*(BETA)*  Update the definition of a logs-based metric.'
flags:
    --bucket-name=: The Log Bucket name which owns the log-based metric.
    --config-from-file=: A path to a YAML file specifying the updates to be made to the logs-based metric.
    --description=: A new description for the metric.
    --log-filter=: A new filter string for the metric.
documentation:
    command: |
        *(BETA)*  Update the description or the filter expression of an existing
        logs-based metric.
    flag:
        bucket-name: The Log Bucket name which owns the log-based metric.
        config-from-file: A path to a YAML file specifying the updates to be made to the logs-based metric. Use a full or relative path to a local file containing the value of config.
        description: A new description for the metric. If omitted, the description is not changed.
        log-filter: A new filter string for the metric. If omitted, the filter is not changed.
