name: get
description: '*(BETA)*  Print the value of a Google Cloud CLI property.'
documentation:
    command: |-
        *(BETA)*  gcloud beta config get prints the property value from your active client side configuration
        only.

        ## AVAILABLE PROPERTIES

        {properties}

        ## EXAMPLES

        To print the project property in the core section, run:

          $ gcloud beta config get project

        To print the zone property in the compute section, run:

          $ gcloud beta config get compute/zone
