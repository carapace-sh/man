name: get-access-grants-location
description: Retrieves the details of a particular location registered in your S3 Access Grants instance.
flags:
    --access-grants-location-id=!: The ID of the registered location that you are retrieving.
    --account-id=!: The Amazon Web Services account ID of the S3 Access Grants instance.
documentation:
    command: |-
        Retrieves the details of a particular location registered in your S3 Access Grants instance.

        Permissions

        You must have the `s3:GetAccessGrantsLocation` permission to use this operation.

        You must URL encode any signed header values that contain spaces. For example, if your header value is `my file.txt`, containing two spaces after `my`, you must URL encode this value to `my%20%20file.txt`.
    flag:
        access-grants-location-id: The ID of the registered location that you are retrieving. S3 Access Grants assigns this ID when you register the location. S3 Access Grants assigns the ID `default` to the default location `s3://` and assigns an auto-generated ID to other locations that you register.
        account-id: The Amazon Web Services account ID of the S3 Access Grants instance.
