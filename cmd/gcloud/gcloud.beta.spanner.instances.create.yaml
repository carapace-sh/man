name: create
description: '*(BETA)*  Create a Cloud Spanner instance.'
flags:
    --asymmetric-autoscaling-option=: Specifies the asymmetric autoscaling option for the instance.
    --async: Return immediately, without waiting for the operation in progress to
    --autoscaling-high-priority-cpu-target=: Specifies the target percentage of high-priority CPU the autoscaled instance can utilize.
    --autoscaling-max-nodes=!: Maximum number of nodes for the autoscaled instance.
    --autoscaling-max-processing-units=!: Maximum number of processing units for the autoscaled instance.
    --autoscaling-min-nodes=!: Minimum number of nodes for the autoscaled instance.
    --autoscaling-min-processing-units=!: Minimum number of processing units for the autoscaled instance.
    --autoscaling-storage-target=!: Specifies the target percentage of storage the autoscaled instance can utilize.
    --autoscaling-total-cpu-target=&: Specifies the target percentage of total CPU the autoscaled instance can utilize.
    --config=!: Instance configuration defines the geographic placement and replication of the databases in that instance.
    --default-backup-schedule-type=: The default backup schedule type that is used in the instance.
    --description=!: Description of the instance.
    --disable-downscaling&: Set the flag to disable downscaling for the autoscaled instance.
    --edition=: Spanner edition.
    --expire-behavior=: The expire behavior of a free trial instance.
    --instance-type=: Specifies the type for this instance.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-disable-downscaling&: Set the flag to disable downscaling for the autoscaled instance.
    --nodes=: Number of nodes for the instance.
    --processing-units=: Number of processing units for the instance.
    --tags=&: List of tags KEY=VALUE pairs to bind.
completion:
    flag:
        default-backup-schedule-type:
            - AUTOMATIC
            - DEFAULT_BACKUP_SCHEDULE_TYPE_UNSPECIFIED
            - NONE
        edition:
            - EDITION_UNSPECIFIED
            - ENTERPRISE
            - ENTERPRISE_PLUS
            - STANDARD
        expire-behavior:
            - free-to-provisioned
            - remove-after-grace-period
        instance-type:
            - free-instance
            - provisioned
documentation:
    command: '*(BETA)*  Create a Cloud Spanner instance.'
    flag:
        asymmetric-autoscaling-option: Specifies the asymmetric autoscaling option for the instance.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        autoscaling-high-priority-cpu-target: Specifies the target percentage of high-priority CPU the autoscaled instance can utilize.
        autoscaling-max-nodes: Maximum number of nodes for the autoscaled instance.
        autoscaling-max-processing-units: Maximum number of processing units for the autoscaled instance.
        autoscaling-min-nodes: Minimum number of nodes for the autoscaled instance.
        autoscaling-min-processing-units: Minimum number of processing units for the autoscaled instance.
        autoscaling-storage-target: Specifies the target percentage of storage the autoscaled instance can utilize.
        autoscaling-total-cpu-target: Specifies the target percentage of total CPU the autoscaled instance can utilize.
        config: Instance configuration defines the geographic placement and replication of the databases in that instance. Available configurations can be found by running "gcloud spanner instance-configs list"
        default-backup-schedule-type: |-
            The default backup schedule type that is used in the instance. _DEFAULT_BACKUP_SCHEDULE_TYPE_ must be one of:
            +
            *AUTOMATIC*::: A default backup schedule is created automatically when a new database is created in an instance. You can edit or delete the default backup schedule once it's created. The default backup schedule creates a full backup every 24 hours. These full backups are retained for 7 days.
            *DEFAULT_BACKUP_SCHEDULE_TYPE_UNSPECIFIED*::: Not specified.
            *NONE*::: No default backup schedule is created automatically when a new database is created in an instance.
            :::
            +
        description: Description of the instance.
        disable-downscaling: Set the flag to disable downscaling for the autoscaled instance.
        edition: |-
            Spanner edition. _EDITION_ must be one of:
            +
            *EDITION_UNSPECIFIED*::: Spanner's legacy pricing model. For more information, see the [Spanner editions overview](https://cloud.google.com/spanner/docs/editions-overview)
            *ENTERPRISE*::: Enterprise edition
            *ENTERPRISE_PLUS*::: Enterprise Plus edition
            *STANDARD*::: Standard edition
            :::
            +
        expire-behavior: |-
            The expire behavior of a free trial instance. _EXPIRE_BEHAVIOR_ must be one of:
            +
            *free-to-provisioned*::: When the free trial instance expires, upgrade the instance to a provisioned instance.
            *remove-after-grace-period*::: When the free trial instance expires, disable the instance, and delete it after the grace period passes if it has not been upgraded to a provisioned instance.
            :::
            +
        instance-type: |-
            Specifies the type for this instance. _INSTANCE_TYPE_ must be one of:
            +
            *free-instance*::: Free trial instances provide no guarantees for dedicated resources, both node_count and processing_units should be 0. They come with stricter usage limits and limited support.
            *provisioned*::: Provisioned instances have dedicated resources, standard usage limits, and support.
            :::
            +
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-disable-downscaling: Set the flag to disable downscaling for the autoscaled instance.
        nodes: Number of nodes for the instance.
        processing-units: Number of processing units for the instance.
        tags: |
            List of tags KEY=VALUE pairs to bind.
            Each item must be expressed as either
            ID: `<tag-key-id>=<tag-value-id>` or

            Namespaced name: `<tag-key-namespaced-name>=<tag-value-short-name>`.

            Example: `tagKeys/123=tagValues/223`

            Example: `123/environment=production,123/costCenter=marketing`
