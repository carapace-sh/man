completion:
    flag:
        api-version:
            - v1
            - v2enabled
documentation:
    command: |-
        *(ALPHA)*  List an organization or source's findings. To list across all
        sources provide a '-' as the source id.
    flag:
        api-version: |-
            This is a temporary flag to be used for testing the Security Command
            Center v2 api before its launch.
        compare-duration: "(DEPRECATED) \n      When compare_duration is set, the result's \"state_change\" attribute is\n      updated to indicate whether the finding had its state changed, the\n      finding's state remained unchanged, or if the finding was added during\n      the compare_duration period of time that precedes the read_time. This\n      is the time between (read_time - compare_duration) and read_time. The\n      state_change value is derived based on the presence and state of the\n      finding at the two points in time. Intermediate state changes between\n      the two times don't affect the result. For example, the results aren't\n      affected if the finding is made inactive and then active again.\n      Possible \"state_change\" values when compare_duration is specified:\n+\n      * 'CHANGED': indicates that the finding was present at the start of\n        compare_duration, but changed its state at read_time.\n+\n      * 'UNCHANGED': indicates that the finding was present at the start of\n        compare_duration and did not change state at read_time.\n+\n      * 'ADDED': indicates that the finding was not present at the start of\n        compare_duration, but was present at read_time.\n+\n      * 'REMOVED': indicates that the finding was present at the start of\n        compare_duration, but was not present at read_time.\n+\n      If compare_duration is not specified, then the only possible\n      state_change is 'UNUSED', which will be the state_change set for all\n      findings present at read_time. If this field is set then 'state_change'\n      must be a specified field in 'group_by'. See $ gcloud topic datetimes\n      for information on supported duration formats.\n+\nThe --compare-duration option is deprecated.\nFor more information, [see the deprecation notice](https://cloud.google.com/security-command-center/docs/release-notes#April_15_2024)\non the SCC release notes page."
        field-mask: |-
            Field mask to specify the finding fields listed in the response. An
            empty field mask will list all fields. For example:
            --field-mask="finding.category,finding.resource_name" will only output
            category and resource_name for the findings in addition to default
            attributes. Notice the difference between hyphens (-) used with flags
            v/s camel case used in field masks. An empty or missing field mask will
            list all fields.
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        folder: The folder ID (e.g., 456) that contains the finding.
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        location: |-
            When data residency controls are enabled, this attribute specifies the location in which
            the resource is located and applicable. The `location` attribute can be
            provided as part of the fully specified resource name or with the `--location`
            argument on the command line. The default location is `global`.
            +
            NOTE: If you override the endpoint to a [regional endpoint](https://cloud.google.com/security-command-center/docs/reference/rest/index.html?rep_location=global#regional-service-endpoint)
            you must specify the correct [data location](https://cloud.google.com/security-command-center/docs/data-residency-support#locations) using this flag.
            The default location on this command is unrelated to the default location
            that is specified when data residency controls are enabled
            for Security Command Center.
            +
            NOTE: If no location is specified, the default location is `global` AND
            the request will be routed to the SCC V1 API. To use the SCC V2 API - please explicitly specify the flag.
        order-by: |-
            Expression that defines what fields and order to use for sorting.
            String value should follow SQL syntax: comma separated list of fields.
            For example: "name,resource_properties.a_property". The default sorting
            order is ascending. To specify descending order for a field, a suffix "
            desc" should be appended to the field name. For example:
            --order-by="name desc,source_properties.a_property" will order by name
            in descending order while source_properties.a_property in ascending
            order.
        organization: The organization ID (e.g., 123) that contains the finding.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is determined by the
            service if it supports paging, otherwise it is *unlimited* (no paging).
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        page-token: |-
            Response objects will return a non-null value for page-token to
            indicate that there is at least one additional page of data. User can
            either directly request that page by specifying the page-token
            explicitly or let gcloud fetch one-page-at-a-time.
        read-time: "(DEPRECATED) \n      Time used as a reference point when filtering. Absence of this field\n      will default to the API's version of NOW. See $ gcloud topic datetimes\n      for information on supported time formats.\n+\nThe --read-time option is deprecated.\nFor more information, [see the deprecation notice](https://cloud.google.com/security-command-center/docs/release-notes#April_15_2024)\non the SCC release notes page."
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
        source: Source id. Defaults to all sources.
