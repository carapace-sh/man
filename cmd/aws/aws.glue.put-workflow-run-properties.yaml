name: put-workflow-run-properties
description: Puts the specified workflow run properties for the given workflow run.
flags:
    --name=!: Name of the workflow which was run.
    --run-id=!: The ID of the workflow run for which the run properties should be updated.
    --run-properties=!: The properties to put for the specified run.
documentation:
    command: Puts the specified workflow run properties for the given workflow run. If a property already exists for the specified run, then it overrides the value otherwise adds the property to existing properties.
    flag:
        name: Name of the workflow which was run.
        run-id: The ID of the workflow run for which the run properties should be updated.
        run-properties: |-
            The properties to put for the specified run.

            Run properties may be logged. Do not pass plaintext secrets as properties. Retrieve secrets from a Glue Connection, Amazon Web Services Secrets Manager or other secret management mechanism if you intend to use them within the workflow run.
