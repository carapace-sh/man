name: describe-jobs
description: Returns a list of Jobs.
flags:
    --account-id=: Request to describe job log items by Account ID.
    --filters=: Request to describe Job log filters.
    --max-results=: Request to describe job log items by max results.
    --next-token=: Request to describe job log items by next token.
documentation:
    command: Returns a list of Jobs. Use the JobsID and fromDate and toData filters to limit which jobs are returned. The response is sorted by creationDataTime - latest date first. Jobs are normally created by the StartTest, StartCutover, and TerminateTargetInstances APIs. Jobs are also created by DiagnosticLaunch and TerminateDiagnosticInstances, which are APIs available only to \*Support* and only used in response to relevant support tickets.
    flag:
        account-id: Request to describe job log items by Account ID.
        filters: Request to describe Job log filters.
        max-results: Request to describe job log items by max results.
        next-token: Request to describe job log items by next token.
