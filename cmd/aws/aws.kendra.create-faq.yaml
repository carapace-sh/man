name: create-faq
description: Creates a set of frequently ask questions (FAQs) using a specified FAQ file stored in an Amazon S3 bucket.
flags:
    --client-token=: A token that you provide to identify the request to create a FAQ.
    --description=: A description for the FAQ.
    --file-format=: The format of the FAQ input file.
    --index-id=!: The identifier of the index for the FAQ.
    --language-code=: The code for a language.
    --name=!: A name for the FAQ.
    --role-arn=!: The Amazon Resource Name (ARN) of an IAM role with permission to access the S3 bucket that contains the FAQ file.
    --s3-path=!: The path to the FAQ file in S3.
    --tags=: A list of key-value pairs that identify the FAQ.
completion:
    flag:
        file-format:
            - CSV
            - CSV_WITH_HEADER
            - JSON
documentation:
    command: |-
        Creates a set of frequently ask questions (FAQs) using a specified FAQ file stored in an Amazon S3 bucket.

        Adding FAQs to an index is an asynchronous operation.

        For an example of adding an FAQ to an index using Python and Java SDKs, see [Using your FAQ file](https://docs.aws.amazon.com/kendra/latest/dg/in-creating-faq.html#using-faq-file).
    flag:
        client-token: A token that you provide to identify the request to create a FAQ. Multiple calls to the `CreateFaqRequest` API with the same client token will create only one FAQ.
        description: A description for the FAQ.
        file-format: |-
            The format of the FAQ input file. You can choose between a basic CSV format, a CSV format that includes customs attributes in a header, and a JSON format that includes custom attributes.

            The default format is CSV.

            The format must match the format of the file stored in the S3 bucket identified in the `S3Path` parameter.

            For more information, see [Adding questions and answers](https://docs.aws.amazon.com/kendra/latest/dg/in-creating-faq.html).
        index-id: The identifier of the index for the FAQ.
        language-code: The code for a language. This allows you to support a language for the FAQ document. English is supported by default. For more information on supported languages, including their codes, see [Adding documents in languages other than English](https://docs.aws.amazon.com/kendra/latest/dg/in-adding-languages.html).
        name: A name for the FAQ.
        role-arn: The Amazon Resource Name (ARN) of an IAM role with permission to access the S3 bucket that contains the FAQ file. For more information, see [IAM access roles for Amazon Kendra](https://docs.aws.amazon.com/kendra/latest/dg/iam-roles.html).
        s3-path: The path to the FAQ file in S3.
        tags: A list of key-value pairs that identify the FAQ. You can use the tags to identify and organize your resources and to control access to resources.
