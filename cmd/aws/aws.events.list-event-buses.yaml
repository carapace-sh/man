name: list-event-buses
description: Lists all the event buses in your account, including the default event bus, custom event buses, and partner event buses.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --limit=: Specifying this limits the number of results returned by this operation.
    --name-prefix=: Specifying this limits the results to only those event buses with names that start with the specified prefix.
    --next-token=: The token returned by a previous call, which you can use to retrieve the next set of results.
documentation:
    command: Lists all the event buses in your account, including the default event bus, custom event buses, and partner event buses.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        limit: Specifying this limits the number of results returned by this operation. The operation also returns a NextToken which you can use in a subsequent operation to retrieve the next set of results.
        name-prefix: Specifying this limits the results to only those event buses with names that start with the specified prefix.
        next-token: |-
            The token returned by a previous call, which you can use to retrieve the next set of results.

            The value of `nextToken` is a unique pagination token for each page. To retrieve the next page of results, make the call again using the returned token. Keep all other arguments unchanged.

            Using an expired pagination token results in an `HTTP 400 InvalidToken` error.
