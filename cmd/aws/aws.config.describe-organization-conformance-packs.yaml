name: describe-organization-conformance-packs
description: Returns a list of organization conformance packs.
flags:
    --limit=: The maximum number of organization config packs returned on each page.
    --next-token=: The nextToken string returned on a previous page that you use to get the next page of results in a paginated response.
    --organization-conformance-pack-names=: The name that you assign to an organization conformance pack.
documentation:
    command: |-
        Returns a list of organization conformance packs.

        When you specify the limit and the next token, you receive a paginated response.

        Limit and next token are not applicable if you specify organization conformance packs names. They are only applicable, when you request all the organization conformance packs.

        *For accounts within an organization*

        If you deploy an organizational rule or conformance pack in an organization administrator account, and then establish a delegated administrator and deploy an organizational rule or conformance pack in the delegated administrator account, you won't be able to see the organizational rule or conformance pack in the organization administrator account from the delegated administrator account or see the organizational rule or conformance pack in the delegated administrator account from organization administrator account. The `DescribeOrganizationConfigRules` and `DescribeOrganizationConformancePacks` APIs can only see and interact with the organization-related resource that were deployed from within the account calling those APIs.
    flag:
        limit: The maximum number of organization config packs returned on each page. If you do no specify a number, Config uses the default. The default is 100.
        next-token: The nextToken string returned on a previous page that you use to get the next page of results in a paginated response.
        organization-conformance-pack-names: The name that you assign to an organization conformance pack.
