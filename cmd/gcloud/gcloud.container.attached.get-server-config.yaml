name: get-server-config
description: Get Anthos Multi-Cloud server configuration for Attached clusters.
flags:
    --location=: ID of the location or fully qualified identifier for the location.
documentation:
    command: Get Anthos Multi-Cloud server configuration for Attached clusters.
    flag:
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line;
            * set the property `container_attached/location`.
