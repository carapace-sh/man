name: get-aiagent
description: Gets an Amazon Q in Connect AI Agent.
flags:
    --ai-agent-id=!: The identifier of the Amazon Q in Connect AI Agent (with or without a version qualifier).
    --assistant-id=!: The identifier of the Amazon Q in Connect assistant.
documentation:
    command: Gets an Amazon Q in Connect AI Agent.
    flag:
        ai-agent-id: The identifier of the Amazon Q in Connect AI Agent (with or without a version qualifier). Can be either the ID or the ARN. URLs cannot contain the ARN.
        assistant-id: The identifier of the Amazon Q in Connect assistant. Can be either the ID or the ARN. URLs cannot contain the ARN.
