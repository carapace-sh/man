name: send-event
description: Sends an event to a room.
flags:
    --attributes=: Application-defined metadata to attach to the event sent to clients.
    --event-name=!: Application-defined name of the event to send to clients.
    --room-identifier=!: Identifier of the room to which the event will be sent.
documentation:
    command: Sends an event to a room. Use this within your application’s business logic to send events to clients of a room; e.g., to notify clients to change the way the chat UI is rendered.
    flag:
        attributes: Application-defined metadata to attach to the event sent to clients. The maximum length of the metadata is 1 KB total.
        event-name: Application-defined name of the event to send to clients.
        room-identifier: Identifier of the room to which the event will be sent. Currently this must be an ARN.
