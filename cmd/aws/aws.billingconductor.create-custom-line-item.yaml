name: create-custom-line-item
description: Creates a custom line item that can be used to create a one-time fixed charge that can be applied to a single billing group for the current or previous billing period.
flags:
    --account-id=: The Amazon Web Services account in which this custom line item will be applied to.
    --billing-group-arn=!: The Amazon Resource Name (ARN) that references the billing group where the custom line item applies to.
    --billing-period-range=: A time range for which the custom line item is effective.
    --charge-details=!: A `CustomLineItemChargeDetails` that describes the charge details for a custom line item.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier that you specify to ensure idempotency of the request.
    --computation-rule=: Specifies how the custom line item charges are computed.
    --description=!: The description of the custom line item.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the custom line item.
    --presentation-details=: Details controlling how the custom line item charges are presented in the bill.
    --tags=: A map that contains tag keys and tag values that are attached to a custom line item.
completion:
    flag:
        computation-rule:
            - CONSOLIDATED
documentation:
    command: Creates a custom line item that can be used to create a one-time fixed charge that can be applied to a single billing group for the current or previous billing period. The one-time fixed charge is either a fee or discount.
    flag:
        account-id: The Amazon Web Services account in which this custom line item will be applied to.
        billing-group-arn: The Amazon Resource Name (ARN) that references the billing group where the custom line item applies to.
        billing-period-range: A time range for which the custom line item is effective.
        charge-details: A `CustomLineItemChargeDetails` that describes the charge details for a custom line item.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier that you specify to ensure idempotency of the request. Idempotency ensures that an API request completes no more than one time. With an idempotent request, if the original request completes successfully, any subsequent retries complete successfully without performing any further actions.
        computation-rule: Specifies how the custom line item charges are computed.
        description: The description of the custom line item. This is shown on the Bills page in association with the charge value.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the custom line item.
        presentation-details: Details controlling how the custom line item charges are presented in the bill. Contains specifications for which service the charges will be shown under.
        tags: A map that contains tag keys and tag values that are attached to a custom line item.
