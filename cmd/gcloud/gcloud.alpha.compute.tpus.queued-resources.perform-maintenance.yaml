name: perform-maintenance
description: '*(ALPHA)*  Performs maintenance on a Cloud TPU Queued Resource.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --node-names=: The nodes you want to perform maintenance on.
    --zone=: The compute/zone of the Cloud TPU.
documentation:
    command: '*(ALPHA)*  Performs maintenance on the list of nodes provided within the Cloud TPU Queued Resource..'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        node-names: The nodes you want to perform maintenance on.
        zone: |-
            The compute/zone of the Cloud TPU.
            +
            If not specified, will use `default` compute/zone.
            +

            To set the `zone` attribute:
            * provide the argument `queued_resource` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line;
            * set the property `compute/zone`.
