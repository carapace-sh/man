name: get-members
description: Returns the membership details for specified member accounts for a behavior graph.
flags:
    --account-ids=!: The list of Amazon Web Services account identifiers for the member account for which to return member details.
    --graph-arn=!: The ARN of the behavior graph for which to request the member details.
documentation:
    command: Returns the membership details for specified member accounts for a behavior graph.
    flag:
        account-ids: |-
            The list of Amazon Web Services account identifiers for the member account for which to return member details. You can request details for up to 50 member accounts at a time.

            You cannot use `GetMembers` to retrieve information about member accounts that were removed from the behavior graph.
        graph-arn: The ARN of the behavior graph for which to request the member details.
