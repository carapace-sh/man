name: list-review-policy-results-for-hit
description: The `ListReviewPolicyResultsForHIT` operation retrieves the computed results and the actions taken in the course of executing your Review Policies for a given HIT.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --hit-id=!: The unique identifier of the HIT to retrieve review results for.
    --max-results=: Limit the number of results returned.
    --next-token=: Pagination token
    --no-retrieve-actions: Specify if the operation should retrieve a list of the actions taken executing the Review Policies and their outcomes.
    --no-retrieve-results: Specify if the operation should retrieve a list of the results computed by the Review Policies.
    --policy-levels=:
        description: The Policy Level(s) to retrieve review results for - HIT or Assignment.
        nargs: -1
    --retrieve-actions: Specify if the operation should retrieve a list of the actions taken executing the Review Policies and their outcomes.
    --retrieve-results: Specify if the operation should retrieve a list of the results computed by the Review Policies.
documentation:
    command: The `ListReviewPolicyResultsForHIT` operation retrieves the computed results and the actions taken in the course of executing your Review Policies for a given HIT. For information about how to specify Review Policies when you call CreateHIT, see Review Policies. The ListReviewPolicyResultsForHIT operation can return results for both Assignment-level and HIT-level review results.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        hit-id: The unique identifier of the HIT to retrieve review results for.
        max-results: Limit the number of results returned.
        next-token: Pagination token
        policy-levels: The Policy Level(s) to retrieve review results for - HIT or Assignment. If omitted, the default behavior is to retrieve all data for both policy levels. For a list of all the described policies, see Review Policies.
        retrieve-actions: Specify if the operation should retrieve a list of the actions taken executing the Review Policies and their outcomes.
        retrieve-results: Specify if the operation should retrieve a list of the results computed by the Review Policies.
