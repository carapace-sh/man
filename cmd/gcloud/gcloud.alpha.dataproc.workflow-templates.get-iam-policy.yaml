name: get-iam-policy
description: '*(ALPHA)*  Get IAM policy for a workflow template.'
flags:
    --region=: Dataproc region for the template.
documentation:
    command: |-
        *(ALPHA)*  Gets the IAM policy for a workflow template, given a template ID.

        ## EXAMPLES

        The following command prints the IAM policy for a workflow template with the
        ID `example-workflow`:

          $ gcloud alpha dataproc workflow-templates get-iam-policy example-workflow
    flag:
        region: |-
            Dataproc region for the template. Each Dataproc region constitutes an independent resource namespace constrained to deploying instances into Compute Engine zones inside the region. Overrides the default `dataproc/region` property value for this command invocation.
            +
            To set the `region` attribute:
            * provide the argument `template` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `dataproc/region`.
