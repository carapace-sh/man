name: create-launch-configuration-template
description: Creates a new Launch Configuration Template.
flags:
    --associate-public-ip-address: Associate public Ip address.
    --boot-mode=: Launch configuration template boot mode.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --copy-private-ip: Copy private Ip.
    --copy-tags: Copy tags.
    --enable-map-auto-tagging: Enable map auto tagging.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --large-volume-conf=: Large volume config.
    --launch-disposition=: Launch disposition.
    --licensing=: ""
    --map-auto-tagging-mpe-id=: Launch configuration template map auto tagging MPE ID.
    --no-associate-public-ip-address: Associate public Ip address.
    --no-copy-private-ip: Copy private Ip.
    --no-copy-tags: Copy tags.
    --no-enable-map-auto-tagging: Enable map auto tagging.
    --post-launch-actions=: Launch configuration template post launch actions.
    --small-volume-conf=: Small volume config.
    --small-volume-max-size=: Small volume maximum size.
    --tags=: Request to associate tags during creation of a Launch Configuration Template.
    --target-instance-type-right-sizing-method=: Target instance type right-sizing method.
completion:
    flag:
        boot-mode:
            - LEGACY_BIOS
            - UEFI
            - USE_SOURCE
        launch-disposition:
            - STOPPED
            - STARTED
        target-instance-type-right-sizing-method:
            - NONE
            - BASIC
documentation:
    command: Creates a new Launch Configuration Template.
    flag:
        associate-public-ip-address: Associate public Ip address.
        boot-mode: Launch configuration template boot mode.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        copy-private-ip: Copy private Ip.
        copy-tags: Copy tags.
        enable-map-auto-tagging: Enable map auto tagging.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        large-volume-conf: Large volume config.
        launch-disposition: Launch disposition.
        licensing: ""
        map-auto-tagging-mpe-id: Launch configuration template map auto tagging MPE ID.
        post-launch-actions: Launch configuration template post launch actions.
        small-volume-conf: Small volume config.
        small-volume-max-size: Small volume maximum size.
        tags: Request to associate tags during creation of a Launch Configuration Template.
        target-instance-type-right-sizing-method: Target instance type right-sizing method.
