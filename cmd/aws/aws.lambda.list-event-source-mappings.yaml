name: list-event-source-mappings
description: Lists event source mappings.
flags:
    --event-source-arn=: The Amazon Resource Name (ARN) of the event source.
    --function-name=: The name or ARN of the Lambda function.
    --marker=: A pagination token returned by a previous call.
    --max-items=: The maximum number of event source mappings to return.
documentation:
    command: Lists event source mappings. Specify an `EventSourceArn` to show only event source mappings for a single event source.
    flag:
        event-source-arn: |-
            The Amazon Resource Name (ARN) of the event source.

            - **Amazon Kinesis** – The ARN of the data stream or a stream consumer.
            - **Amazon DynamoDB Streams** – The ARN of the stream.
            - **Amazon Simple Queue Service** – The ARN of the queue.
            - **Amazon Managed Streaming for Apache Kafka** – The ARN of the cluster or the ARN of the VPC connection (for [cross-account event source mappings](https://docs.aws.amazon.com/lambda/latest/dg/with-msk.html#msk-multi-vpc)).
            - **Amazon MQ** – The ARN of the broker.
            - **Amazon DocumentDB** – The ARN of the DocumentDB change stream.
        function-name: |-
            The name or ARN of the Lambda function.

            **Name formats**

            - **Function name** – `MyFunction`.
            - **Function ARN** – `arn:aws:lambda:us-west-2:123456789012:function:MyFunction`.
            - **Version or Alias ARN** – `arn:aws:lambda:us-west-2:123456789012:function:MyFunction:PROD`.
            - **Partial ARN** – `123456789012:function:MyFunction`.

            The length constraint applies only to the full ARN. If you specify only the function name, it's limited to 64 characters in length.
        marker: A pagination token returned by a previous call.
        max-items: The maximum number of event source mappings to return. Note that ListEventSourceMappings returns a maximum of 100 items in each response, even if you set the number higher.
