name: delete
description: '*(BETA)*  Delete a Cloud Spanner instance configuration.'
flags:
    --etag=: Used for optimistic concurrency control as a way to help prevent simultaneous deletes of an instance config from overwriting each other.
    --no-validate-only&: If specified, validate that the deletion will succeed without deleting the instance config.
    --validate-only: If specified, validate that the deletion will succeed without deleting the instance config.
