name: describe-what-if-forecast-export
description: Describes the what-if forecast export created using the [CreateWhatIfForecastExport]() operation.
flags:
    --what-if-forecast-export-arn=!: The Amazon Resource Name (ARN) of the what-if forecast export that you are interested in.
documentation:
    command: |-
        Describes the what-if forecast export created using the [CreateWhatIfForecastExport]() operation.

        In addition to listing the properties provided in the `CreateWhatIfForecastExport` request, this operation lists the following properties:

        - `CreationTime`
        - `LastModificationTime`
        - `Message` - If an error occurred, information about the error.
        - `Status`
    flag:
        what-if-forecast-export-arn: The Amazon Resource Name (ARN) of the what-if forecast export that you are interested in.
