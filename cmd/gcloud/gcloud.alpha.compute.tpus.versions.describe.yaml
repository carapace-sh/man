name: describe
description: '*(ALPHA)*  Describe a Tensorflow version available for Cloud TPUs.'
flags:
    --zone=: The compute/zone of the Cloud TPU.
documentation:
    command: |
        *(ALPHA)*  Get details on a Tensorflow version.

        To get a list of available Tesnorflow versions for your location run:

          $ gcloud alpha compute tpus versions list
    flag:
        zone: |-
            The compute/zone of the Cloud TPU.
            +
            If not specified, will use `default` compute/zone.
            +

            To set the `zone` attribute:
            * provide the argument `version` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line;
            * set the property `compute/zone`.
