name: delete
description: '*(BETA)*  Delete an Anthos cluster on bare metal.'
flags:
    --allow-missing: If set, and the Bare Metal cluster is not found, the request will succeed but no action will be taken.
    --async: Return immediately, without waiting for the operation in progress to
