name: stop-bulk-deployment
description: Stops the execution of a bulk deployment.
flags:
    --bulk-deployment-id=!: The ID of the bulk deployment.
documentation:
    command: Stops the execution of a bulk deployment. This action returns a status of ''Stopping'' until the deployment is stopped. You cannot start a new bulk deployment while a previous deployment is in the ''Stopping'' state. This action doesn't rollback completed deployments or cancel pending deployments.
    flag:
        bulk-deployment-id: The ID of the bulk deployment.
