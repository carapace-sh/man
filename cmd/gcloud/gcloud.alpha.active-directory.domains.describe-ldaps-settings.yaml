name: describe-ldaps-settings
description: '*(ALPHA)*  Describe the LDAPS settings of a Managed Microsoft AD domain.'
documentation:
    command: |
        *(ALPHA)*  Describe the Lightweight Directory Access Protocol over TLS/SSL (LDAPS) settings of a Managed Microsoft AD domain.

        This command can fail for the following reasons:
          * The domain specified does not exist.
          * The active account does not have permission to view LDAPS settings for the domain.
