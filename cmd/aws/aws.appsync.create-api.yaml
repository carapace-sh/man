name: create-api
description: Creates an `Api` object.
flags:
    --event-config=: The Event API configuration.
    --name=!: The name for the `Api`.
    --owner-contact=: The owner contact information for the `Api`.
    --tags=: ""
documentation:
    command: Creates an `Api` object. Use this operation to create an AppSync API with your preferred configuration, such as an Event API that provides real-time message publishing and message subscriptions over WebSockets.
    flag:
        event-config: The Event API configuration. This includes the default authorization configuration for connecting, publishing, and subscribing to an Event API.
        name: The name for the `Api`.
        owner-contact: The owner contact information for the `Api`.
        tags: ""
