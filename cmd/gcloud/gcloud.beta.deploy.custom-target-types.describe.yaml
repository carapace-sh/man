name: describe
description: '*(BETA)*  Show details for a custom target type.'
flags:
    --region=: Location of the custom target type.
documentation:
    command: '*(BETA)*  Show details for a specified custom target type.'
    flag:
        region: |-
            Location of the custom target type.
            +

            To set the `region` attribute:
            * provide the argument `custom_target_type` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `deploy/region`.
