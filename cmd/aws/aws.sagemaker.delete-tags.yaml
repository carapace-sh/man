name: delete-tags
description: Deletes the specified tags from an SageMaker resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource whose tags you want to delete.
    --tag-keys=!: An array or one or more tag keys to delete.
documentation:
    command: |-
        Deletes the specified tags from an SageMaker resource.

        To list a resource's tags, use the `ListTags` API.

        When you call this API to delete tags from a hyperparameter tuning job, the deleted tags are not removed from training jobs that the hyperparameter tuning job launched before you called this API.

        When you call this API to delete tags from a SageMaker Domain or User Profile, the deleted tags are not removed from Apps that the SageMaker Domain or User Profile launched before you called this API.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource whose tags you want to delete.
        tag-keys: An array or one or more tag keys to delete.
