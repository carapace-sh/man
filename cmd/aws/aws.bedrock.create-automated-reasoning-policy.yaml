name: create-automated-reasoning-policy
description: Creates an Automated Reasoning policy for Amazon Bedrock Guardrails.
flags:
    --client-request-token=: A unique, case-sensitive identifier to ensure that the operation completes no more than once.
    --description=: A description of the Automated Reasoning policy.
    --kms-key-id=: The identifier of the KMS key to use for encrypting the automated reasoning policy and its associated artifacts.
    --name=!: A unique name for the Automated Reasoning policy.
    --policy-definition=: The policy definition that contains the formal logic rules, variables, and custom variable types used to validate foundation model responses in your application.
    --tags=: A list of tags to associate with the Automated Reasoning policy.
documentation:
    command: |-
        Creates an Automated Reasoning policy for Amazon Bedrock Guardrails. Automated Reasoning policies use mathematical techniques to detect hallucinations, suggest corrections, and highlight unstated assumptions in the responses of your GenAI application.

        To create a policy, you upload a source document that describes the rules that you're encoding. Automated Reasoning extracts important concepts from the source document that will become variables in the policy and infers policy rules.
    flag:
        client-request-token: A unique, case-sensitive identifier to ensure that the operation completes no more than once. If this token matches a previous request, Amazon Bedrock ignores the request but doesn't return an error.
        description: A description of the Automated Reasoning policy. Use this to provide context about the policy's purpose and the types of validations it performs.
        kms-key-id: The identifier of the KMS key to use for encrypting the automated reasoning policy and its associated artifacts. If you don't specify a KMS key, Amazon Bedrock uses an KMS managed key for encryption. For enhanced security and control, you can specify a customer managed KMS key.
        name: A unique name for the Automated Reasoning policy. The name must be between 1 and 63 characters and can contain letters, numbers, hyphens, and underscores.
        policy-definition: The policy definition that contains the formal logic rules, variables, and custom variable types used to validate foundation model responses in your application.
        tags: A list of tags to associate with the Automated Reasoning policy. Tags help you organize and manage your policies.
