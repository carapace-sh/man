name: update-capability
description: Updates some of the parameters for a capability, based on the specified parameters.
flags:
    --capability-id=!: Specifies a system-assigned unique identifier for the capability.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration=: Specifies a structure that contains the details for a capability.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instructions-documents=: Specifies one or more locations in Amazon S3, each specifying an EDI document that can be used with this capability.
    --name=: Specifies a new name for the capability, to replace the existing name.
documentation:
    command: Updates some of the parameters for a capability, based on the specified parameters. A trading capability contains the information required to transform incoming EDI documents into JSON or XML outputs.
    flag:
        capability-id: Specifies a system-assigned unique identifier for the capability.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration: Specifies a structure that contains the details for a capability.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instructions-documents: Specifies one or more locations in Amazon S3, each specifying an EDI document that can be used with this capability. Each item contains the name of the bucket and the key, to identify the document's location.
        name: Specifies a new name for the capability, to replace the existing name.
