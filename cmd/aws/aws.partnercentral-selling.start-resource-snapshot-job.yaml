name: start-resource-snapshot-job
description: Starts a resource snapshot job that has been previously created.
flags:
    --catalog=!: Specifies the catalog related to the request.
    --resource-snapshot-job-identifier=!: The identifier of the resource snapshot job to start.
documentation:
    command: Starts a resource snapshot job that has been previously created.
    flag:
        catalog: |-
            Specifies the catalog related to the request. Valid values are:

            - AWS: Starts the request from the production AWS environment.
            - Sandbox: Starts the request from a sandbox environment used for testing or development purposes.
        resource-snapshot-job-identifier: The identifier of the resource snapshot job to start.
