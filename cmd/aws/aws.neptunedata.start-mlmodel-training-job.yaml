name: start-mlmodel-training-job
description: Creates a new Neptune ML model training job.
flags:
    --base-processing-instance-type=: The type of ML instance used in preparing and managing training of ML models.
    --custom-model-training-parameters=: The configuration for custom model training.
    --data-processing-job-id=!: The job ID of the completed data-processing job that has created the data that the training will work with.
    --enable-managed-spot-training: Optimizes the cost of training machine-learning models by using Amazon Elastic Compute Cloud spot instances.
    --id=: A unique identifier for the new job.
    --max-hponumber-of-training-jobs=: Maximum total number of training jobs to start for the hyperparameter tuning job.
    --max-hpoparallel-training-jobs=: Maximum number of parallel training jobs to start for the hyperparameter tuning job.
    --neptune-iam-role-arn=: The ARN of an IAM role that provides Neptune access to SageMaker and Amazon S3 resources.
    --no-enable-managed-spot-training: Optimizes the cost of training machine-learning models by using Amazon Elastic Compute Cloud spot instances.
    --previous-model-training-job-id=: The job ID of a completed model-training job that you want to update incrementally based on updated data.
    --s3-output-encryption-kmskey=: The Amazon Key Management Service (KMS) key that SageMaker uses to encrypt the output of the processing job.
    --sagemaker-iam-role-arn=: The ARN of an IAM role for SageMaker execution.This must be listed in your DB cluster parameter group or an error will occur.
    --security-group-ids=: The VPC security group IDs.
    --subnets=: The IDs of the subnets in the Neptune VPC.
    --train-model-s3-location=!: The location in Amazon S3 where the model artifacts are to be stored.
    --training-instance-type=: The type of ML instance used for model training.
    --training-instance-volume-size-in-gb=: The disk volume size of the training instance.
    --training-time-out-in-seconds=: Timeout in seconds for the training job.
    --volume-encryption-kmskey=: The Amazon Key Management Service (KMS) key that SageMaker uses to encrypt data on the storage volume attached to the ML compute instances that run the training job.
documentation:
    command: |-
        Creates a new Neptune ML model training job. See [Model training using the `modeltraining` command](https://docs.aws.amazon.com/neptune/latest/userguide/machine-learning-api-modeltraining.html).

        When invoking this operation in a Neptune cluster that has IAM authentication enabled, the IAM user or role making the request must have a policy attached that allows the [neptune-db:StartMLModelTrainingJob](https://docs.aws.amazon.com/neptune/latest/userguide/iam-dp-actions.html#startmlmodeltrainingjob) IAM action in that cluster.
    flag:
        base-processing-instance-type: The type of ML instance used in preparing and managing training of ML models. This is a CPU instance chosen based on memory requirements for processing the training data and model.
        custom-model-training-parameters: The configuration for custom model training. This is a JSON object.
        data-processing-job-id: The job ID of the completed data-processing job that has created the data that the training will work with.
        enable-managed-spot-training: Optimizes the cost of training machine-learning models by using Amazon Elastic Compute Cloud spot instances. The default is `False`.
        id: A unique identifier for the new job. The default is An autogenerated UUID.
        max-hponumber-of-training-jobs: Maximum total number of training jobs to start for the hyperparameter tuning job. The default is 2. Neptune ML automatically tunes the hyperparameters of the machine learning model. To obtain a model that performs well, use at least 10 jobs (in other words, set `maxHPONumberOfTrainingJobs` to 10). In general, the more tuning runs, the better the results.
        max-hpoparallel-training-jobs: Maximum number of parallel training jobs to start for the hyperparameter tuning job. The default is 2. The number of parallel jobs you can run is limited by the available resources on your training instance.
        neptune-iam-role-arn: The ARN of an IAM role that provides Neptune access to SageMaker and Amazon S3 resources. This must be listed in your DB cluster parameter group or an error will occur.
        previous-model-training-job-id: The job ID of a completed model-training job that you want to update incrementally based on updated data.
        s3-output-encryption-kmskey: The Amazon Key Management Service (KMS) key that SageMaker uses to encrypt the output of the processing job. The default is none.
        sagemaker-iam-role-arn: The ARN of an IAM role for SageMaker execution.This must be listed in your DB cluster parameter group or an error will occur.
        security-group-ids: The VPC security group IDs. The default is None.
        subnets: The IDs of the subnets in the Neptune VPC. The default is None.
        train-model-s3-location: The location in Amazon S3 where the model artifacts are to be stored.
        training-instance-type: The type of ML instance used for model training. All Neptune ML models support CPU, GPU, and multiGPU training. The default is `ml.p3.2xlarge`. Choosing the right instance type for training depends on the task type, graph size, and your budget.
        training-instance-volume-size-in-gb: The disk volume size of the training instance. Both input data and the output model are stored on disk, so the volume size must be large enough to hold both data sets. The default is 0. If not specified or 0, Neptune ML selects a disk volume size based on the recommendation generated in the data processing step.
        training-time-out-in-seconds: Timeout in seconds for the training job. The default is 86,400 (1 day).
        volume-encryption-kmskey: The Amazon Key Management Service (KMS) key that SageMaker uses to encrypt data on the storage volume attached to the ML compute instances that run the training job. The default is None.
