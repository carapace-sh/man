name: update
description: '*(ALPHA)*  Update a Data Catalog crawler.'
flags:
    --add-buckets=: List of buckets to add to the crawl scope.
    --add-bundle-specs=: A list of bundling specifications to add to the existing ones.
    --clear-buckets: If specified, clear the existing list of buckets in the crawl scope.
    --clear-bundle-specs: If specified, clear the existing list of bundling specifications.
    --crawl-scope=: Scope of the crawler.
    --description=: Textual description of the crawler.
    --display-name=: Human-readable display name for the crawler.
    --no-clear-buckets&: If specified, clear the existing list of buckets in the crawl scope.
    --no-clear-bundle-specs&: If specified, clear the existing list of bundling specifications.
    --remove-buckets=: List of buckets to remove from the crawl scope.
    --remove-bundle-specs=: A list of bundling specifications to remove from the existing ones.
    --run-option=: Run option of the crawler.
    --run-schedule=: Schedule for the crawler run.
completion:
    flag:
        crawl-scope:
            - bucket
            - organization
            - project
        run-option:
            - manual
            - scheduled
        run-schedule:
            - daily
            - weekly
documentation:
    command: '*(ALPHA)*  Update a Data Catalog crawler.'
    flag:
        add-buckets: List of buckets to add to the crawl scope.
        add-bundle-specs: A list of bundling specifications to add to the existing ones.
        clear-buckets: If specified, clear the existing list of buckets in the crawl scope.
        clear-bundle-specs: If specified, clear the existing list of bundling specifications.
        crawl-scope: |-
            Scope of the crawler. _CRAWL_SCOPE_ must be one of:
            +
            *bucket*::: Directs the crawler to crawl specific buckets within the project that owns the crawler.
            *organization*::: Directs the crawler to crawl all the buckets of the projects in the organization that owns the crawler.
            *project*::: Directs the crawler to crawl all the buckets of the project that owns the crawler.
            :::
            +
        description: Textual description of the crawler.
        display-name: Human-readable display name for the crawler.
        no-clear-buckets: If specified, clear the existing list of buckets in the crawl scope.
        no-clear-bundle-specs: If specified, clear the existing list of bundling specifications.
        remove-buckets: List of buckets to remove from the crawl scope.
        remove-bundle-specs: A list of bundling specifications to remove from the existing ones.
        run-option: |-
            Run option of the crawler. _RUN_OPTION_ must be one of:
            +
            *manual*::: The crawler run will have to be triggered manually.
            *scheduled*::: The crawler will run automatically on a schedule.
            :::
            +
        run-schedule: 'Schedule for the crawler run. This argument can be provided only if the crawler run option will be scheduled after updating. _RUN_SCHEDULE_ must be one of: *daily*, *weekly*.'
