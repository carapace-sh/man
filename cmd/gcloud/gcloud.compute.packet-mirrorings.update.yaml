name: update
description: Update a Compute Engine packet mirroring policy.
flags:
    --add-filter-cidr-ranges=: List of filter CIDR ranges to add to the packet mirroring.
    --add-filter-protocols=: List of filter IP protocols to add to the packet mirroring.
    --add-mirrored-instances=: List of instances to add to the packet mirroring.
    --add-mirrored-subnets=: List of subnets to add to the packet mirroring.
    --add-mirrored-tags=: List of tags to add to the packet mirroring.
    --async: Return immediately, without waiting for the operation in progress to
    --clear-filter-cidr-ranges: If specified, clear the existing filter CIDR ranges from the packet
    --clear-filter-protocols: If specified, clear the existing filter IP protocols from the packet
    --clear-mirrored-instances: If specified, clear the existing instances from the packet mirroring.
    --clear-mirrored-subnets: If specified, clear the existing subnets from the packet mirroring.
    --clear-mirrored-tags: If specified, clear the existing tags from the packet mirroring.
    --collector-ilb=: Forwarding rule configured as collector.
    --description=: Optional, textual description for the packet mirroring.
    --enable: Enable or disable the packet-mirroring.
    --filter-direction=: '- For `ingress`, only ingress traffic is mirrored.'
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-filter-cidr-ranges&: If specified, clear the existing filter CIDR ranges from the packet
    --no-clear-filter-protocols&: If specified, clear the existing filter IP protocols from the packet
    --no-clear-mirrored-instances&: If specified, clear the existing instances from the packet mirroring.
    --no-clear-mirrored-subnets&: If specified, clear the existing subnets from the packet mirroring.
    --no-clear-mirrored-tags&: If specified, clear the existing tags from the packet mirroring.
    --no-enable&: Enable or disable the packet-mirroring.
    --region=: Region of the packet mirroring to update.
    --remove-filter-cidr-ranges=: List of filter CIDR ranges to remove from the packet mirroring.
    --remove-filter-protocols=: List of filter IP protocols to remove from the packet mirroring.
    --remove-mirrored-instances=: List of instances to remove from the packet mirroring.
    --remove-mirrored-subnets=: List of subnets to remove from the packet mirroring.
    --remove-mirrored-tags=: List of tags to remove from the packet mirroring.
    --set-filter-cidr-ranges=: List of filter CIDR ranges to be mirrored on the packet mirroring.
    --set-filter-protocols=: List of filter IP protocols to be mirrored on the packet mirroring.
    --set-mirrored-instances=: List of instances to be mirrored on the packet mirroring.
    --set-mirrored-subnets=: List of subnets to be mirrored on the packet mirroring.
    --set-mirrored-tags=: List of tags to be mirrored on the packet mirroring.
completion:
    flag:
        filter-direction:
            - both
            - egress
            - ingress
documentation:
    command: Update a Compute Engine packet mirroring policy.
    flag:
        add-filter-cidr-ranges: List of filter CIDR ranges to add to the packet mirroring.
        add-filter-protocols: |-
            List of filter IP protocols to add to the packet mirroring.
            PROTOCOL can be one of tcp, udp, icmp, esp, ah, ipip, sctp, or an IANA
            protocol number.
        add-mirrored-instances: List of instances to add to the packet mirroring.
        add-mirrored-subnets: List of subnets to add to the packet mirroring.
        add-mirrored-tags: List of tags to add to the packet mirroring.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        clear-filter-cidr-ranges: |-
            If specified, clear the existing filter CIDR ranges from the packet
            mirroring.
        clear-filter-protocols: |-
            If specified, clear the existing filter IP protocols from the packet
            mirroring.
        clear-mirrored-instances: If specified, clear the existing instances from the packet mirroring.
        clear-mirrored-subnets: If specified, clear the existing subnets from the packet mirroring.
        clear-mirrored-tags: If specified, clear the existing tags from the packet mirroring.
        collector-ilb: |-
            Forwarding rule configured as collector. This must be a regional
            forwarding rule (in the same region) with load balancing scheme INTERNAL
            and isMirroringCollector set to true.
            +
            You can provide this as the full URL to the forwarding rule, partial URL,
            or name.
            For example, the following are valid values:
              * https://compute.googleapis.com/compute/v1/projects/myproject/
                regions/us-central1/forwardingRules/fr-1
              * projects/myproject/regions/us-central1/forwardingRules/fr-1
              * fr-1
        description: Optional, textual description for the packet mirroring.
        enable: Enable or disable the packet-mirroring.
        filter-direction: |-
            - For `ingress`, only ingress traffic is mirrored.
            - For `egress`, only egress traffic is mirrored.
            - For `both` (default), both directions are mirrored. _DIRECTION_ must be one of: *both*, *egress*, *ingress*.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-filter-cidr-ranges: |
            If specified, clear the existing filter CIDR ranges from the packet
            mirroring.
        no-clear-filter-protocols: |
            If specified, clear the existing filter IP protocols from the packet
            mirroring.
        no-clear-mirrored-instances: If specified, clear the existing instances from the packet mirroring.
        no-clear-mirrored-subnets: If specified, clear the existing subnets from the packet mirroring.
        no-clear-mirrored-tags: If specified, clear the existing tags from the packet mirroring.
        no-enable: Enable or disable the packet-mirroring.
        region: Region of the packet mirroring to update. Overrides the default *compute/region* property value for this command invocation.
        remove-filter-cidr-ranges: List of filter CIDR ranges to remove from the packet mirroring.
        remove-filter-protocols: |-
            List of filter IP protocols to remove from the packet mirroring.
            PROTOCOL can be one of tcp, udp, icmp, esp, ah, ipip, sctp, or an IANA
            protocol number.
        remove-mirrored-instances: List of instances to remove from the packet mirroring.
        remove-mirrored-subnets: List of subnets to remove from the packet mirroring.
        remove-mirrored-tags: List of tags to remove from the packet mirroring.
        set-filter-cidr-ranges: List of filter CIDR ranges to be mirrored on the packet mirroring.
        set-filter-protocols: |-
            List of filter IP protocols to be mirrored on the packet mirroring.
            PROTOCOL can be one of tcp, udp, icmp, esp, ah, ipip, sctp, or an IANA
            protocol number.
        set-mirrored-instances: List of instances to be mirrored on the packet mirroring.
        set-mirrored-subnets: List of subnets to be mirrored on the packet mirroring.
        set-mirrored-tags: List of tags to be mirrored on the packet mirroring.
