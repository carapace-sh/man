name: create
description: Create a Compute Engine security policy.
flags:
    --description=: An optional, textual description for the security policy.
    --file-format=: The format of the file to create the security policy config from.
    --file-name=: The name of the JSON or YAML file to create a security policy config from.
    --global: If set, the security policy is global.
    --no-global&: If set, the security policy is global.
    --region=: Region of the security policy to create.
    --type=: The type indicates the intended use of the security policy.
completion:
    flag:
        file-format:
            - json
            - yaml
        type:
            - CLOUD_ARMOR
            - CLOUD_ARMOR_EDGE
            - CLOUD_ARMOR_NETWORK
documentation:
    command: |-
        *gcloud compute security-policies create* is used to create security policies. A security policy policy is a
        set of rules that controls access to various resources.

        ## EXAMPLES

        To create a security policy with a given type and description, run:

          $ gcloud compute security-policies create my-policy \
             --type=CLOUD_ARMOR_EDGE \
             --description="policy description"

        To create a security from an input file, run:

          $ gcloud compute security-policies create my-policy \
             --file-name=my-file-name
    flag:
        description: An optional, textual description for the security policy.
        file-format: 'The format of the file to create the security policy config from. Specify either yaml or json. Defaults to yaml if not specified. Will be ignored if --file-name is not specified. _FILE_FORMAT_ must be one of: *json*, *yaml*.'
        file-name: The name of the JSON or YAML file to create a security policy config from.
        global: If set, the security policy is global.
        no-global: If set, the security policy is global.
        region: Region of the security policy to create. Overrides the default *compute/region* property value for this command invocation.
        type: 'The type indicates the intended use of the security policy. _SECURITY_POLICY_TYPE_ must be one of: *CLOUD_ARMOR*, *CLOUD_ARMOR_EDGE*, *CLOUD_ARMOR_NETWORK*.'
