name: create
description: Creating a content.
flags:
    --data-text=!: Content data in string format
    --description=: Description of the Content
    --kernel-type=!: Kernel Type of the notebook.
    --labels=: List of label KEY=VALUE pairs to add.
    --lake=!: ID of the lakes or fully qualified identifier for the lakes.
    --location=: The location of the Dataplex resource.
    --no-validate-only&: Validate the create action, but don't actually perform it.
    --path=!: The path for the Content file, represented as directory structure
    --query-engine=!: Query Engine to be used for the Sql Query.
    --validate-only: Validate the create action, but don't actually perform it.
completion:
    flag:
        kernel-type:
            - PYTHON3
        query-engine:
            - SPARK
documentation:
    command: Creating a content.
    flag:
        data-text: Content data in string format
        description: Description of the Content
        kernel-type: |-
            Kernel Type of the notebook. _KERNEL_TYPE_ must be (only one value is supported):
            +
            *PYTHON3*::: python3
            :::
            +
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        lake: |-
            ID of the lakes or fully qualified identifier for the lakes.
            +
            To set the `lake` attribute:
            * provide the argument `--lake` on the command line.
        location: |-
            The location of the Dataplex resource.
            +
            To set the `location` attribute:
            * provide the argument `--lake` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
        no-validate-only: Validate the create action, but don't actually perform it.
        path: The path for the Content file, represented as directory structure
        query-engine: |-
            Query Engine to be used for the Sql Query. _QUERY_ENGINE_ must be (only one value is supported):
            +
            *SPARK*::: spark
            :::
            +
        validate-only: Validate the create action, but don't actually perform it.
