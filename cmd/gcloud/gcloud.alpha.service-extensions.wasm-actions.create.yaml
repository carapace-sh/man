name: create
description: '*(ALPHA)*  Create a `WasmAction` resource.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: A human-readable description of the resource.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location ID.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --supported-events=: Specify the portion of the request/response payload to be processed by
    --wasm-plugin=!: ID of the WasmPlugin or fully qualified identifier for the WasmPlugin.
documentation:
    command: |
        *(ALPHA)*  Create a `WasmAction` resource that uses the specified plugin.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: A human-readable description of the resource.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location ID.
            +

            To set the `location` attribute:
            * provide the argument `wasm_action` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * use global location.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        supported-events: |-
            Specify the portion of the request/response payload to be processed by
            the plugin. _EVENT_ must be one of: *request-headers*, *response-headers*.
        wasm-plugin: |-
            ID of the WasmPlugin or fully qualified identifier for the WasmPlugin.
            +
            To set the `wasm_plugin` attribute:
            * provide the argument `--wasm-plugin` on the command line.
