documentation:
    command: |
        *(ALPHA)*  Describes a PolicyPorter translation, useful for understanding translation status.
    flag:
        location: |-
            The location id of the translation resource.
            +
            To set the `location` attribute:
            * provide the argument `translation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        policy-porter: |-
            The policyPorter id of the translation resource.
            +
            To set the `policy-porter` attribute:
            * provide the argument `translation` on the command line with a fully specified name;
            * provide the argument `--policy-porter` on the command line.
