name: set-keep-job-flow-alive-when-no-steps
description: You can use the `SetKeepJobFlowAliveWhenNoSteps` to configure a cluster (job flow) to terminate after the step execution, i.e., all your steps are executed.
flags:
    --job-flow-ids=!: A list of strings that uniquely identify the clusters to protect.
    --keep-job-flow-alive-when-no-steps!: A Boolean that indicates whether to terminate the cluster after all steps are executed.
    --no-keep-job-flow-alive-when-no-steps!: A Boolean that indicates whether to terminate the cluster after all steps are executed.
documentation:
    command: |-
        You can use the `SetKeepJobFlowAliveWhenNoSteps` to configure a cluster (job flow) to terminate after the step execution, i.e., all your steps are executed. If you want a transient cluster that shuts down after the last of the current executing steps are completed, you can configure `SetKeepJobFlowAliveWhenNoSteps` to false. If you want a long running cluster, configure `SetKeepJobFlowAliveWhenNoSteps` to true.

        For more information, see [Managing Cluster Termination](https://docs.aws.amazon.com/emr/latest/ManagementGuide/UsingEMR_TerminationProtection.html) in the *Amazon EMR Management Guide*.
    flag:
        job-flow-ids: A list of strings that uniquely identify the clusters to protect. This identifier is returned by [RunJobFlow](https://docs.aws.amazon.com/emr/latest/APIReference/API_RunJobFlow.html) and can also be obtained from [DescribeJobFlows](https://docs.aws.amazon.com/emr/latest/APIReference/API_DescribeJobFlows.html).
        keep-job-flow-alive-when-no-steps: A Boolean that indicates whether to terminate the cluster after all steps are executed.
