name: describe
description: '*(ALPHA)*  Describe a backup.'
flags:
    --backup-plan=: Backup Plan name.
    --location=: Google Cloud location.
documentation:
    command: |
        *(ALPHA)*  Describe a Backup for GKE backup.

        ## EXAMPLES

        To describe a backup ``my-backup'' in project ``my-project'' in location ``us-central1'' under backup plan ``my-backup-plan'', run:

          $ gcloud alpha container backup-restore backups describe my-backup --backup-plan=my-backup-plan --project=my-project --location=us-central1
    flag:
        backup-plan: |-
            Backup Plan name.
            +
            To set the `backup-plan` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--backup-plan` on the command line;
            * set the property `gkebackup/backup_plan`.
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkebackup/location`.
