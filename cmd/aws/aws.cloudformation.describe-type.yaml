name: describe-type
description: Returns detailed information about an extension from the CloudFormation registry in your current account and Region.
flags:
    --arn=: The Amazon Resource Name (ARN) of the extension.
    --public-version-number=: The version number of a public third-party extension.
    --publisher-id=: The publisher ID of the extension publisher.
    --type-name=: The name of the extension.
    --type=: The kind of extension.
    --version-id=: The ID of a specific version of the extension.
completion:
    flag:
        type:
            - RESOURCE
            - MODULE
            - HOOK
documentation:
    command: |-
        Returns detailed information about an extension from the CloudFormation registry in your current account and Region.

        If you specify a `VersionId`, `DescribeType` returns information about that specific extension version. Otherwise, it returns information about the default extension version.

        For more information, see [Edit configuration data for extensions in your account](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/registry-set-configuration.html) in the *CloudFormation User Guide*.
    flag:
        arn: |-
            The Amazon Resource Name (ARN) of the extension.

            Conditional: You must specify either `TypeName` and `Type`, or `Arn`.
        public-version-number: The version number of a public third-party extension.
        publisher-id: |-
            The publisher ID of the extension publisher.

            Extensions provided by Amazon Web Services are not assigned a publisher ID.
        type: |-
            The kind of extension.

            Conditional: You must specify either `TypeName` and `Type`, or `Arn`.
        type-name: |-
            The name of the extension.

            Conditional: You must specify either `TypeName` and `Type`, or `Arn`.
        version-id: |-
            The ID of a specific version of the extension. The version ID is the value at the end of the Amazon Resource Name (ARN) assigned to the extension version when it is registered.

            If you specify a `VersionId`, `DescribeType` returns information about that specific extension version. Otherwise, it returns information about the default extension version.
