name: start-incident
description: Used to start an incident from CloudWatch alarms, EventBridge events, or manually.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A token ensuring that the operation is called only once with the specified details.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --impact=: Defines the impact to the customers.
    --related-items=:
        description: Add related items to the incident for other responders to use.
        nargs: -1
    --response-plan-arn=!: The Amazon Resource Name (ARN) of the response plan that pre-defines summary, chat channels, Amazon SNS topics, runbooks, title, and impact of the incident.
    --title=: Provide a title for the incident.
    --trigger-details=: Details of what created the incident record in Incident Manager.
documentation:
    command: Used to start an incident from CloudWatch alarms, EventBridge events, or manually.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A token ensuring that the operation is called only once with the specified details.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        impact: |-
            Defines the impact to the customers. Providing an impact overwrites the impact provided by a response plan.

            **Supported impact codes**

            - `1` - Critical
            - `2` - High
            - `3` - Medium
            - `4` - Low
            - `5` - No Impact
        related-items: Add related items to the incident for other responders to use. Related items are Amazon Web Services resources, external links, or files uploaded to an Amazon S3 bucket.
        response-plan-arn: The Amazon Resource Name (ARN) of the response plan that pre-defines summary, chat channels, Amazon SNS topics, runbooks, title, and impact of the incident.
        title: Provide a title for the incident. Providing a title overwrites the title provided by the response plan.
        trigger-details: Details of what created the incident record in Incident Manager.
