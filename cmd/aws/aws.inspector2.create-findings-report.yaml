name: create-findings-report
description: Creates a finding report.
flags:
    --filter-criteria=: The filter criteria to apply to the results of the finding report.
    --report-format=!: The format to generate the report in.
    --s3-destination=!: The Amazon S3 export destination for the report.
completion:
    flag:
        report-format:
            - CSV
            - JSON
documentation:
    command: Creates a finding report. By default only `ACTIVE` findings are returned in the report. To see `SUPRESSED` or `CLOSED` findings you must specify a value for the `findingStatus` filter criteria.
    flag:
        filter-criteria: The filter criteria to apply to the results of the finding report.
        report-format: The format to generate the report in.
        s3-destination: The Amazon S3 export destination for the report.
