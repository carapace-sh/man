name: list-resources-for-web-acl
description: Retrieves an array of the Amazon Resource Names (ARNs) for the resources that are associated with the specified web ACL.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --resource-type=: Retrieves the web ACLs that are used by the specified resource type.
    --web-acl-arn=!: The Amazon Resource Name (ARN) of the web ACL.
completion:
    flag:
        resource-type:
            - APPLICATION_LOAD_BALANCER
            - API_GATEWAY
            - APPSYNC
            - COGNITO_USER_POOL
            - APP_RUNNER_SERVICE
            - VERIFIED_ACCESS_INSTANCE
            - AMPLIFY
documentation:
    command: |-
        Retrieves an array of the Amazon Resource Names (ARNs) for the resources that are associated with the specified web ACL.

        For Amazon CloudFront, don't use this call. Instead, use the CloudFront call `ListDistributionsByWebACLId`. For information, see [ListDistributionsByWebACLId](https://docs.aws.amazon.com/cloudfront/latest/APIReference/API_ListDistributionsByWebACLId.html) in the *Amazon CloudFront API Reference*.

        **Required permissions for customer-managed IAM policies**

        This call requires permissions that are specific to the protected resource type. For details, see [Permissions for ListResourcesForWebACL](https://docs.aws.amazon.com/waf/latest/developerguide/security_iam_service-with-iam.html#security_iam_action-ListResourcesForWebACL) in the *WAF Developer Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        resource-type: |-
            Retrieves the web ACLs that are used by the specified resource type.

            For Amazon CloudFront, don't use this call. Instead, use the CloudFront call `ListDistributionsByWebACLId`. For information, see [ListDistributionsByWebACLId](https://docs.aws.amazon.com/cloudfront/latest/APIReference/API_ListDistributionsByWebACLId.html) in the *Amazon CloudFront API Reference*.

            If you don't provide a resource type, the call uses the resource type `APPLICATION_LOAD_BALANCER`.

            Default: `APPLICATION_LOAD_BALANCER`
        web-acl-arn: The Amazon Resource Name (ARN) of the web ACL.
