name: generate
description: Generate Audit Report.
flags:
    --compliance-framework=!: Compliance Framework against which the Report must be generated.
    --folder=: Folder Id for which to generate audit report
    --gcs-uri=: Destination Cloud storage bucket where report and evidence must be uploaded.
    --location=!: The location where the report should be generated.
    --report-format=!: The format in which the audit report should be created.
completion:
    flag:
        report-format:
            - odf
documentation:
    command: Generate a new Audit Report.
    flag:
        compliance-framework: 'Compliance Framework against which the Report must be generated. Eg: FEDRAMP_MODERATE'
        folder: Folder Id for which to generate audit report
        gcs-uri: Destination Cloud storage bucket where report and evidence must be uploaded. The Cloud storage bucket provided here must be selected among the buckets entered during the enrollment process.
        location: The location where the report should be generated.
        report-format: 'The format in which the audit report should be created. _REPORT_FORMAT_ must be (only one value is supported): *odf*.'
