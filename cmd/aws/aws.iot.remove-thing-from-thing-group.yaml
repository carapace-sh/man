name: remove-thing-from-thing-group
description: Remove the specified thing from the specified group.
flags:
    --thing-arn=: The ARN of the thing to remove from the group.
    --thing-group-arn=: The group ARN.
    --thing-group-name=: The group name.
    --thing-name=: The name of the thing to remove from the group.
documentation:
    command: |-
        Remove the specified thing from the specified group.

        You must specify either a `thingGroupArn` or a `thingGroupName` to identify the thing group and either a `thingArn` or a `thingName` to identify the thing to remove from the thing group.

        Requires permission to access the [RemoveThingFromThingGroup](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        thing-arn: The ARN of the thing to remove from the group.
        thing-group-arn: The group ARN.
        thing-group-name: The group name.
        thing-name: The name of the thing to remove from the group.
