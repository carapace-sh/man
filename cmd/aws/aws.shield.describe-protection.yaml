name: describe-protection
description: Lists the details of a [Protection]() object.
flags:
    --protection-id=: The unique identifier (ID) for the [Protection]() object to describe.
    --resource-arn=: The ARN (Amazon Resource Name) of the protected Amazon Web Services resource.
documentation:
    command: Lists the details of a [Protection]() object.
    flag:
        protection-id: The unique identifier (ID) for the [Protection]() object to describe. You must provide either the `ResourceArn` of the protected resource or the `ProtectionID` of the protection, but not both.
        resource-arn: The ARN (Amazon Resource Name) of the protected Amazon Web Services resource. You must provide either the `ResourceArn` of the protected resource or the `ProtectionID` of the protection, but not both.
