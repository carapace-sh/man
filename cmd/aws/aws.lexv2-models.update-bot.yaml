name: update-bot
description: Updates the configuration of an existing bot.
flags:
    --bot-id=!: The unique identifier of the bot to update.
    --bot-members=: The list of bot members in the network associated with the update action.
    --bot-name=!: The new name of the bot.
    --bot-type=: The type of the bot to be updated.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --data-privacy=!: Provides information on additional privacy protections Amazon Lex should use with the bot's data.
    --description=: A description of the bot.
    --error-log-settings=: Allows you to modify how Amazon Lex logs errors during bot interactions, including destinations for error logs and the types of errors to be captured.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --idle-session-ttl-in-seconds=!: The time, in seconds, that Amazon Lex should keep information about a user's conversation with the bot.
    --role-arn=!: The Amazon Resource Name (ARN) of an IAM role that has permissions to access the bot.
completion:
    flag:
        bot-type:
            - Bot
            - BotNetwork
documentation:
    command: Updates the configuration of an existing bot.
    flag:
        bot-id: The unique identifier of the bot to update. This identifier is returned by the [CreateBot](https://docs.aws.amazon.com/lexv2/latest/APIReference/API_CreateBot.html) operation.
        bot-members: The list of bot members in the network associated with the update action.
        bot-name: The new name of the bot. The name must be unique in the account that creates the bot.
        bot-type: The type of the bot to be updated.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        data-privacy: Provides information on additional privacy protections Amazon Lex should use with the bot's data.
        description: A description of the bot.
        error-log-settings: Allows you to modify how Amazon Lex logs errors during bot interactions, including destinations for error logs and the types of errors to be captured.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        idle-session-ttl-in-seconds: |-
            The time, in seconds, that Amazon Lex should keep information about a user's conversation with the bot.

            A user interaction remains active for the amount of time specified. If no conversation occurs during this time, the session expires and Amazon Lex deletes any data provided before the timeout.

            You can specify between 60 (1 minute) and 86,400 (24 hours) seconds.
        role-arn: The Amazon Resource Name (ARN) of an IAM role that has permissions to access the bot.
