name: associate-resource
description: Associates a canary with a group.
flags:
    --group-identifier=!: Specifies the group.
    --resource-arn=!: The ARN of the canary that you want to associate with the specified group.
documentation:
    command: |-
        Associates a canary with a group. Using groups can help you with managing and automating your canaries, and you can also view aggregated run results and statistics for all canaries in a group.

        You must run this operation in the Region where the canary exists.
    flag:
        group-identifier: Specifies the group. You can specify the group name, the ARN, or the group ID as the `GroupIdentifier`.
        resource-arn: The ARN of the canary that you want to associate with the specified group.
