name: describe
description: '*(ALPHA)*  Returns the Operation object resulting from the Get API.'
hidden: true
flags:
    --order-operation-billing-account=: Cloud Billing account for the Procurement order-operation.
    --order-operation-order=: Procurement Order for the order-operation.
    --order-operation=!: ID of the order-operation or fully qualified identifier for the order-operation.
documentation:
    command: '*(ALPHA)*  Returns the Operation object resulting from the Get API.'
    flag:
        order-operation: |-
            ID of the order-operation or fully qualified identifier for the order-operation.
            +
            To set the `operation` attribute:
            * provide the argument `--order-operation` on the command line.
        order-operation-billing-account: |-
            Cloud Billing account for the Procurement order-operation.
            +
            To set the `order-operation-billing-account` attribute:
            * provide the argument `--order-operation` on the command line with a fully specified name;
            * provide the argument `--order-operation-billing-account` on the command line.
        order-operation-order: |-
            Procurement Order for the order-operation.
            +
            To set the `order-operation-order` attribute:
            * provide the argument `--order-operation` on the command line with a fully specified name;
            * provide the argument `--order-operation-order` on the command line.
