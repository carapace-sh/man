name: create-wireless-device
description: Provisions a wireless device.
flags:
    --client-request-token=: Each resource must have a unique client request token.
    --description=: The description of the new resource.
    --destination-name=!: The name of the destination to assign to the new wireless device.
    --lo-ra-wan=: The device configuration information to use to create the wireless device.
    --name=: The name of the new resource.
    --positioning=: The integration status of the Device Location feature for LoRaWAN and Sidewalk devices.
    --sidewalk=: The device configuration information to use to create the Sidewalk device.
    --tags=: The tags to attach to the new wireless device.
    --type=!: The wireless device type.
completion:
    flag:
        positioning:
            - Enabled
            - Disabled
        type:
            - Sidewalk
            - LoRaWAN
documentation:
    command: Provisions a wireless device.
    flag:
        client-request-token: Each resource must have a unique client request token. The client token is used to implement idempotency. It ensures that the request completes no more than one time. If you retry a request with the same token and the same parameters, the request will complete successfully. However, if you try to create a new resource using the same token but different parameters, an HTTP 409 conflict occurs. If you omit this value, AWS SDKs will automatically generate a unique client request. For more information about idempotency, see [Ensuring idempotency in Amazon EC2 API requests](https://docs.aws.amazon.com/ec2/latest/devguide/ec2-api-idempotency.html).
        description: The description of the new resource.
        destination-name: The name of the destination to assign to the new wireless device.
        lo-ra-wan: The device configuration information to use to create the wireless device.
        name: |-
            The name of the new resource.

            The following special characters aren't accepted: `<>^#~$`
        positioning: The integration status of the Device Location feature for LoRaWAN and Sidewalk devices.
        sidewalk: The device configuration information to use to create the Sidewalk device.
        tags: The tags to attach to the new wireless device. Tags are metadata that you can use to manage a resource.
        type: The wireless device type.
