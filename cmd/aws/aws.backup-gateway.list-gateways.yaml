name: list-gateways
description: Lists backup gateways owned by an Amazon Web Services account in an Amazon Web Services Region.
flags:
    --max-results=: The maximum number of gateways to list.
    --next-token=: The next item following a partial list of returned resources.
documentation:
    command: Lists backup gateways owned by an Amazon Web Services account in an Amazon Web Services Region. The returned list is ordered by gateway Amazon Resource Name (ARN).
    flag:
        max-results: The maximum number of gateways to list.
        next-token: The next item following a partial list of returned resources. For example, if a request is made to return `MaxResults` number of resources, `NextToken` allows you to return more items in your list starting at the location pointed to by the next token.
