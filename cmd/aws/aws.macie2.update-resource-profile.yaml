name: update-resource-profile
description: Updates the sensitivity score for an S3 bucket.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the S3 bucket that the request applies to.
    --sensitivity-score-override=: The new sensitivity score for the bucket.
documentation:
    command: Updates the sensitivity score for an S3 bucket.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the S3 bucket that the request applies to.
        sensitivity-score-override: 'The new sensitivity score for the bucket. Valid values are: 100, assign the maximum score and apply the *Sensitive* label to the bucket; and, null (empty), assign a score that Amazon Macie calculates automatically after you submit the request.'
