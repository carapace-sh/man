name: list-tenants
description: List all tenants associated with your account in the current Amazon Web Services Region.
flags:
    --next-token=: A token returned from a previous call to `ListTenants` to indicate the position in the list of tenants.
    --page-size=: The number of results to show in a single call to `ListTenants`.
documentation:
    command: |-
        List all tenants associated with your account in the current Amazon Web Services Region.

        This operation returns basic information about each tenant, such as tenant name, ID, ARN, and creation timestamp.
    flag:
        next-token: A token returned from a previous call to `ListTenants` to indicate the position in the list of tenants.
        page-size: The number of results to show in a single call to `ListTenants`. If the number of results is larger than the number you specified in this parameter, then the response includes a `NextToken` element, which you can use to obtain additional results.
