name: create-dbcluster-snapshot
description: Creates a snapshot of a DB cluster.
flags:
    --dbcluster-identifier=!: The identifier of the DB cluster to create a snapshot for.
    --dbcluster-snapshot-identifier=!: The identifier of the DB cluster snapshot.
    --tags=: The tags to be assigned to the DB cluster snapshot.
documentation:
    command: |-
        Creates a snapshot of a DB cluster.

        For more information on Amazon Aurora, see [What is Amazon Aurora?](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_AuroraOverview.html) in the *Amazon Aurora User Guide*.

        For more information on Multi-AZ DB clusters, see [Multi-AZ DB cluster deployments](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/multi-az-db-clusters-concepts.html) in the *Amazon RDS User Guide*.
    flag:
        dbcluster-identifier: |-
            The identifier of the DB cluster to create a snapshot for. This parameter isn't case-sensitive.

            Constraints:

            - Must match the identifier of an existing DBCluster.

            Example: `my-cluster1`
        dbcluster-snapshot-identifier: |-
            The identifier of the DB cluster snapshot. This parameter is stored as a lowercase string.

            Constraints:

            - Must contain from 1 to 63 letters, numbers, or hyphens.
            - First character must be a letter.
            - Can't end with a hyphen or contain two consecutive hyphens.

            Example: `my-cluster1-snapshot1`
        tags: The tags to be assigned to the DB cluster snapshot.
