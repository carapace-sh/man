name: create-configured-audience-model-association
description: Provides the details necessary to create a configured audience model association.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configured-audience-model-arn=!: A unique identifier for the configured audience model that you want to associate.
    --configured-audience-model-association-name=!: The name of the configured audience model association.
    --description=: A description of the configured audience model association.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --manage-resource-policies!: When `TRUE`, indicates that the resource policy for the configured audience model resource being associated is configured for Clean Rooms to manage permissions related to the given collaboration.
    --membership-identifier=!: A unique identifier for one of your memberships for a collaboration.
    --no-manage-resource-policies!: When `TRUE`, indicates that the resource policy for the configured audience model resource being associated is configured for Clean Rooms to manage permissions related to the given collaboration.
    --tags=: An optional label that you can assign to a resource when you create it.
documentation:
    command: Provides the details necessary to create a configured audience model association.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configured-audience-model-arn: A unique identifier for the configured audience model that you want to associate.
        configured-audience-model-association-name: The name of the configured audience model association.
        description: A description of the configured audience model association.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        manage-resource-policies: |-
            When `TRUE`, indicates that the resource policy for the configured audience model resource being associated is configured for Clean Rooms to manage permissions related to the given collaboration. When `FALSE`, indicates that the configured audience model resource owner will manage permissions related to the given collaboration.

            Setting this to `TRUE` requires you to have permissions to create, update, and delete the resource policy for the `cleanrooms-ml` resource when you call the [DeleteConfiguredAudienceModelAssociation]() resource. In addition, if you are the collaboration creator and specify `TRUE`, you must have the same permissions when you call the [DeleteMember]() and [DeleteCollaboration]() APIs.
        membership-identifier: A unique identifier for one of your memberships for a collaboration. The configured audience model is associated to the collaboration that this membership belongs to. Accepts a membership ID.
        tags: An optional label that you can assign to a resource when you create it. Each tag consists of a key and an optional value, both of which you define. When you use tagging, you can also use tag-based access control in IAM policies to control access to this resource.
