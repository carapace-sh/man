    --cli-input-yaml=: Read arguments from the YAML string provided.
    --filters=:
        description: The filters.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --host-ids=:
        description: The IDs of the EC2 Mac Dedicated Hosts.
        nargs: -1
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of results to return for the request in a single page.
    --next-token=: The token to use to retrieve the next page of results.
