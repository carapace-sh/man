name: describe
description: Describe a Google Cloud VMware Engine network.
flags:
    --location=: The resource name of the location.
documentation:
    command: |
        Describe a VMware Engine network.
    flag:
        location: |-
            The resource name of the location.
            +
            To set the `location` attribute:
            * provide the argument `vmware_engine_network` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set location as 'global' (default) or a region.
