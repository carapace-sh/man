name: create-pipeline
description: Creates a pipeline.
flags:
    --pipeline-activities=!: A list of `PipelineActivity` objects.
    --pipeline-name=!: The name of the pipeline.
    --tags=: Metadata which can be used to manage the pipeline.
documentation:
    command: Creates a pipeline. A pipeline consumes messages from a channel and allows you to process the messages before storing them in a data store. You must specify both a `channel` and a `datastore` activity and, optionally, as many as 23 additional activities in the `pipelineActivities` array.
    flag:
        pipeline-activities: |-
            A list of `PipelineActivity` objects. Activities perform transformations on your messages, such as removing, renaming or adding message attributes; filtering messages based on attribute values; invoking your Lambda unctions on messages for advanced processing; or performing mathematical transformations to normalize device data.

            The list can be 2-25 `PipelineActivity` objects and must contain both a `channel` and a `datastore` activity. Each entry in the list must contain only one activity. For example:

            `pipelineActivities = [ { "channel": { ... } }, { "lambda": { ... } }, ... ]`
        pipeline-name: The name of the pipeline.
        tags: Metadata which can be used to manage the pipeline.
