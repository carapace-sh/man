name: update-anycast-ip-list
description: Updates an Anycast static IP list.
flags:
    --id=!: The ID of the Anycast static IP list.
    --if-match=!: The current version (ETag value) of the Anycast static IP list that you are updating.
    --ip-address-type=: The IP address type for the Anycast static IP list.
completion:
    flag:
        ip-address-type:
            - ipv4
            - ipv6
            - dualstack
documentation:
    command: Updates an Anycast static IP list.
    flag:
        id: The ID of the Anycast static IP list.
        if-match: The current version (ETag value) of the Anycast static IP list that you are updating.
        ip-address-type: |-
            The IP address type for the Anycast static IP list. You can specify one of the following options:

            - `ipv4` - Allocate a list of only IPv4 addresses
            - `ipv6` - Allocate a list of only IPv4 addresses
            - `dualstack` - Allocate a list of both IPv4 and IPv6 addresses
