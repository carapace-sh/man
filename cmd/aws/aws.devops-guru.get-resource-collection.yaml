name: get-resource-collection
description: Returns lists Amazon Web Services resources that are of the specified resource collection type.
flags:
    --next-token=: The pagination token to use to retrieve the next page of results for this operation.
    --resource-collection-type=!: The type of Amazon Web Services resource collections to return.
completion:
    flag:
        resource-collection-type:
            - AWS_CLOUD_FORMATION
            - AWS_SERVICE
            - AWS_TAGS
documentation:
    command: Returns lists Amazon Web Services resources that are of the specified resource collection type. The two types of Amazon Web Services resource collections supported are Amazon Web Services CloudFormation stacks and Amazon Web Services resources that contain the same Amazon Web Services tag. DevOps Guru can be configured to analyze the Amazon Web Services resources that are defined in the stacks or that are tagged using the same tag *key*. You can specify up to 500 Amazon Web Services CloudFormation stacks.
    flag:
        next-token: The pagination token to use to retrieve the next page of results for this operation. If this value is null, it retrieves the first page.
        resource-collection-type: The type of Amazon Web Services resource collections to return. The one valid value is `CLOUD_FORMATION` for Amazon Web Services CloudFormation stacks.
