name: create
description: Create a ManagedOrganization resource.
hidden: true
flags:
    --admins=: List of organization admins.
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location id of the managedOrganization resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --organization-display-name=!: The display name of the
    --organization=: The organization id of the managedOrganization resource.
documentation:
    command: Create a ManagedOrganization resource and a corresponding Cloud Resource Manager organization resource.
    flag:
        admins: |-
            List of organization admins.
            +
            *member*:::
            Valid IAM principles. See member field under
            https://cloud.google.com/iam/docs/reference/sts/rest/v1/Binding.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --admins=member=string --admins=member=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --admins='[{"member": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --admins=path_to_file.(yaml|json)
            +
            ```
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location id of the managedOrganization resource.
            +
            To set the `location` attribute:
            * provide the argument `managed_organization` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        organization: |-
            The organization id of the managedOrganization resource.
            +
            To set the `organization` attribute:
            * provide the argument `managed_organization` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
        organization-display-name: |-
            The display name of the
            cloudresourcemanager.googleapis.com/Organization created on behalf
            of the customer.
