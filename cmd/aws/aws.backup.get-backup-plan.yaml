name: get-backup-plan
description: Returns `BackupPlan` details for the specified `BackupPlanId`.
flags:
    --backup-plan-id=!: Uniquely identifies a backup plan.
    --max-scheduled-runs-preview=: Number of future scheduled backup runs to preview.
    --version-id=: Unique, randomly generated, Unicode, UTF-8 encoded strings that are at most 1,024 bytes long.
documentation:
    command: Returns `BackupPlan` details for the specified `BackupPlanId`. The details are the body of a backup plan in JSON format, in addition to plan metadata.
    flag:
        backup-plan-id: Uniquely identifies a backup plan.
        max-scheduled-runs-preview: Number of future scheduled backup runs to preview. When set to 0 (default), no scheduled runs preview is included in the response. Valid range is 0-10.
        version-id: Unique, randomly generated, Unicode, UTF-8 encoded strings that are at most 1,024 bytes long. Version IDs cannot be edited.
