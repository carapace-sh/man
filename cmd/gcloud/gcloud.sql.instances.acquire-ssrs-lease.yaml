name: acquire-ssrs-lease
description: Acquires a SQL Server Reporting Services lease on a Cloud SQL instance.
flags:
    --duration=: Time duration, in hours, that the lease will be active to allow SSRS setup.
    --report-database=!: Existing or new report database name in the Cloud SQL for SQL Server instance that is used for SSRS setup.
    --service-login=!: Existing login in the Cloud SQL for SQL Server instance that is used as the service login for SSRS setup.
    --setup-login=!: Existing login in the Cloud SQL for SQL Server instance that is used as the setup login for SSRS setup.
documentation:
    command: |
        Acquire a SQL Server Reporting Services lease on a Cloud SQL instance.
    flag:
        duration: Time duration, in hours, that the lease will be active to allow SSRS setup. Default lease duration is 5 hours if this flag is not specified.
        report-database: Existing or new report database name in the Cloud SQL for SQL Server instance that is used for SSRS setup.
        service-login: Existing login in the Cloud SQL for SQL Server instance that is used as the service login for SSRS setup.
        setup-login: Existing login in the Cloud SQL for SQL Server instance that is used as the setup login for SSRS setup.
