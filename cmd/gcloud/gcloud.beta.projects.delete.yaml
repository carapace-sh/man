name: delete
description: '*(BETA)*  Delete a project.'
flags:
    --recommend=: If true, checks Active Assist recommendation for the risk level of project deletion, and issues a warning in the prompt.
documentation:
    command: |-
        *(BETA)*  Deletes the project with the given project ID.

        This command can fail for the following reasons:
        * The project specified does not exist.
        * The active account does not have IAM role `role/owner` or another IAM role
          with the `resourcemanager.projects.delete` permission for the given project.

        See [Access control for projects using
        IAM](https://cloud.google.com/resource-manager/docs/access-control-proj) for
        more information.

        ## EXAMPLES

        The following command deletes the project with the ID `example-foo-bar-1`:

          $ gcloud beta projects delete example-foo-bar-1

        ## SEE ALSO

        {see_also}
    flag:
        recommend: If true, checks Active Assist recommendation for the risk level of project deletion, and issues a warning in the prompt. Optional flag is set to false by default. For details see https://cloud.google.com/recommender/docs/change-risk-recommendations
