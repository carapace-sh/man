name: update
description: '*(BETA)*  *(REMOVED)*  Update a Cloud Run Integration.'
hidden: true
flags:
    --add-service=: Name of the Cloud Run service to attach to the integration.
    --parameters=: Comma-separated list of parameter names and values.
    --region=: Region in which the resource can be found.
    --remove-service=: Name of the Cloud Run service to remove from the integration.
    --service-account=: Name of the service account to use when deploying the integration.
documentation:
    command: |4+
        *(BETA)*  *(REMOVED)*  Cloud Run integrations are no longer supported.

        *(BETA)*  *(REMOVED)*  Update a Cloud Run Integration.

        Cloud Run integrations are no longer supported.


    flag:
        add-service: Name of the Cloud Run service to attach to the integration.
        parameters: Comma-separated list of parameter names and values. Names must be one of the parameters shown when describing the integration type. Only simple values can be specified with this flag.
        region: Region in which the resource can be found. Alternatively, set the property [run/region].
        remove-service: Name of the Cloud Run service to remove from the integration.
        service-account: Name of the service account to use when deploying the integration.
