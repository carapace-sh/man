name: update-dataset
description: Updates the settings of a dataset.
flags:
    --actions=!: A list of `DatasetAction` objects.
    --content-delivery-rules=: When dataset contents are created, they are delivered to destinations specified here.
    --dataset-name=!: The name of the dataset to update.
    --late-data-rules=: A list of data rules that send notifications to CloudWatch, when data arrives late.
    --retention-period=: How long, in days, dataset contents are kept for the dataset.
    --triggers=: A list of `DatasetTrigger` objects.
    --versioning-configuration=: Optional.
documentation:
    command: Updates the settings of a dataset.
    flag:
        actions: A list of `DatasetAction` objects.
        content-delivery-rules: When dataset contents are created, they are delivered to destinations specified here.
        dataset-name: The name of the dataset to update.
        late-data-rules: A list of data rules that send notifications to CloudWatch, when data arrives late. To specify `lateDataRules`, the dataset must use a [DeltaTimer](https://docs.aws.amazon.com/iotanalytics/latest/APIReference/API_DeltaTime.html) filter.
        retention-period: How long, in days, dataset contents are kept for the dataset.
        triggers: A list of `DatasetTrigger` objects. The list can be empty or can contain up to five `DatasetTrigger` objects.
        versioning-configuration: Optional. How many versions of dataset contents are kept. If not specified or set to null, only the latest version plus the latest succeeded version (if they are different) are kept for the time period specified by the `retentionPeriod` parameter. For more information, see [Keeping Multiple Versions of IoT Analytics datasets](https://docs.aws.amazon.com/iotanalytics/latest/userguide/getting-started.html#aws-iot-analytics-dataset-versions) in the *IoT Analytics User Guide*.
