name: modify-cluster
description: Modifies the number of steps that can be executed concurrently for the cluster specified using ClusterID.
flags:
    --cluster-id=!: The unique identifier of the cluster.
    --extended-support=: Reserved.
    --step-concurrency-level=: The number of steps that can be executed concurrently.
documentation:
    command: Modifies the number of steps that can be executed concurrently for the cluster specified using ClusterID.
    flag:
        cluster-id: The unique identifier of the cluster.
        extended-support: Reserved.
        step-concurrency-level: The number of steps that can be executed concurrently. You can specify a minimum of 1 step and a maximum of 256 steps. We recommend that you do not change this parameter while steps are running or the `ActionOnFailure` setting may not behave as expected. For more information see [Step$ActionOnFailure]().
