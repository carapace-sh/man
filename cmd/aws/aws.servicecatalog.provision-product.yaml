name: provision-product
description: Provisions the specified product.
flags:
    --accept-language=: The language code.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --notification-arns=:
        description: Passed to CloudFormation.
        nargs: -1
    --path-id=: The path identifier of the product.
    --path-name=: The name of the path.
    --product-id=: The product identifier.
    --product-name=: The name of the product.
    --provision-token=!: An idempotency token that uniquely identifies the provisioning request.
    --provisioned-product-name=!: A user-friendly name for the provisioned product.
    --provisioning-artifact-id=: The identifier of the provisioning artifact.
    --provisioning-artifact-name=: The name of the provisioning artifact.
    --provisioning-parameters=:
        description: Parameters specified by the administrator that are required for provisioning the product.
        nargs: -1
    --provisioning-preferences=: An object that contains information about the provisioning preferences for a stack set.
    --tags=:
        description: One or more tags.
        nargs: -1
documentation:
    command: |-
        Provisions the specified product.

        A provisioned product is a resourced instance of a product. For example, provisioning a product that's based on an CloudFormation template launches an CloudFormation stack and its underlying resources. You can check the status of this request using [DescribeRecord]().

        If the request contains a tag key with an empty list of values, there's a tag conflict for that key. Don't include conflicted keys as tags, or this will cause the error "Parameter validation failed: Missing required parameter in Tags\[*N*]:*Value*".

        When provisioning a product that's been added to a portfolio, you must grant your user, group, or role access to the portfolio. For more information, see [Granting users access](https://docs.aws.amazon.com/servicecatalog/latest/adminguide/catalogs_portfolios_users.html) in the *Service Catalog User Guide*.
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        notification-arns: Passed to CloudFormation. The SNS topic ARNs to which to publish stack-related events.
        path-id: The path identifier of the product. This value is optional if the product has a default path, and required if the product has more than one path. To list the paths for a product, use [ListLaunchPaths](). You must provide the name or ID, but not both.
        path-name: The name of the path. You must provide the name or ID, but not both.
        product-id: The product identifier. You must provide the name or ID, but not both.
        product-name: The name of the product. You must provide the name or ID, but not both.
        provision-token: An idempotency token that uniquely identifies the provisioning request.
        provisioned-product-name: A user-friendly name for the provisioned product. This value must be unique for the Amazon Web Services account and cannot be updated after the product is provisioned.
        provisioning-artifact-id: The identifier of the provisioning artifact. You must provide the name or ID, but not both.
        provisioning-artifact-name: The name of the provisioning artifact. You must provide the name or ID, but not both.
        provisioning-parameters: Parameters specified by the administrator that are required for provisioning the product.
        provisioning-preferences: An object that contains information about the provisioning preferences for a stack set.
        tags: One or more tags.
