name: disable-user
description: Disables the specified user in the user pool.
flags:
    --authentication-type=!: The authentication type for the user.
    --user-name=!: The email address of the user.
completion:
    flag:
        authentication-type:
            - API
            - SAML
            - USERPOOL
            - AWS_AD
documentation:
    command: Disables the specified user in the user pool. Users can't sign in to AppStream 2.0 until they are re-enabled. This action does not delete the user.
    flag:
        authentication-type: The authentication type for the user. You must specify USERPOOL.
        user-name: |-
            The email address of the user.

            Users' email addresses are case-sensitive.
