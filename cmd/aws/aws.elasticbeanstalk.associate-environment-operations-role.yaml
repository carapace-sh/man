name: associate-environment-operations-role
description: Add or change the operations role used by an environment.
flags:
    --environment-name=!: The name of the environment to which to set the operations role.
    --operations-role=!: The Amazon Resource Name (ARN) of an existing IAM role to be used as the environment's operations role.
documentation:
    command: Add or change the operations role used by an environment. After this call is made, Elastic Beanstalk uses the associated operations role for permissions to downstream services during subsequent calls acting on this environment. For more information, see [Operations roles](https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/iam-operationsrole.html) in the *AWS Elastic Beanstalk Developer Guide*.
    flag:
        environment-name: The name of the environment to which to set the operations role.
        operations-role: The Amazon Resource Name (ARN) of an existing IAM role to be used as the environment's operations role.
