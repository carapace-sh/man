name: delete
description: '*(ALPHA)*  Delete existing images.'
flags:
    --force-delete-tags: If there are tags pointing to an image to be deleted then they must all be specified explicitly, or this flag must be specified, for the command to succeed.
    --no-force-delete-tags&: If there are tags pointing to an image to be deleted then they must all be specified explicitly, or this flag must be specified, for the command to succeed.
documentation:
    command: |
        *(ALPHA)*  The container images delete command deletes the specified image from
        the registry. All associated tags are also deleted.
    flag:
        force-delete-tags: If there are tags pointing to an image to be deleted then they must all be specified explicitly, or this flag must be specified, for the command to succeed.
        no-force-delete-tags: If there are tags pointing to an image to be deleted then they must all be specified explicitly, or this flag must be specified, for the command to succeed.
