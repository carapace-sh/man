name: confirm-topic-rule-destination
description: Confirms a topic rule destination.
flags:
    --confirmation-token=!: The token used to confirm ownership or access to the topic rule confirmation URL.
documentation:
    command: |-
        Confirms a topic rule destination. When you create a rule requiring a destination, IoT sends a confirmation message to the endpoint or base address you specify. The message includes a token which you pass back when calling `ConfirmTopicRuleDestination` to confirm that you own or have access to the endpoint.

        Requires permission to access the [ConfirmTopicRuleDestination](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        confirmation-token: The token used to confirm ownership or access to the topic rule confirmation URL.
