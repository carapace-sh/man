name: stop-application
description: Request is an operation to stop an application.
flags:
    --application-id=!: The ID of the application.
    --include-ec2-instance-shutdown: Boolean.
    --no-include-ec2-instance-shutdown&: Boolean.
    --stop-connected-entity=: Specify the `ConnectedEntityType`.
completion:
    flag:
        stop-connected-entity:
            - DBMS
documentation:
    command: |-
        Request is an operation to stop an application.

        Parameter `ApplicationId` is required. Parameters `StopConnectedEntity` and `IncludeEc2InstanceShutdown` are optional.
    flag:
        application-id: The ID of the application.
        include-ec2-instance-shutdown: Boolean. If included and if set to `True`, the StopApplication operation will shut down the associated Amazon EC2 instance in addition to the application.
        stop-connected-entity: |-
            Specify the `ConnectedEntityType`. Accepted type is `DBMS`.

            If this parameter is included, the connected DBMS (Database Management System) will be stopped.
