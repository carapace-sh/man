name: patch
description: '*(BETA)*  Update the Final backup of a Cloud SQL project.'
flags:
    --backup-description=: Provides description for the backup going to be taken.
    --expiry-time=: Specifies when the final backup expires.
    --ttl-days=: Specifies the number of days to retain the final backup.
documentation:
    command: '*(BETA)*  Update the Final backup of a Cloud SQL project.'
    flag:
        backup-description: Provides description for the backup going to be taken.
        expiry-time: 'Specifies when the final backup expires. The Maximum time allowed is 365 days from now. Format: YYYY-MM-DDTHH:MM:SS. Provide either ttl-days or expiry-time.'
        ttl-days: Specifies the number of days to retain the final backup. The valid range is between 1 and 365. The Default value is 30 days. Provide either ttl-days or expiry-time.
