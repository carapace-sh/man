name: describe-products
description: Returns information about product integrations in Security Hub.
flags:
    --max-results=: The maximum number of results to return.
    --next-token=: The token that is required for pagination.
    --product-arn=: The ARN of the integration to return.
documentation:
    command: |-
        Returns information about product integrations in Security Hub.

        You can optionally provide an integration ARN. If you provide an integration ARN, then the results only include that integration.

        If you don't provide an integration ARN, then the results include all of the available product integrations.
    flag:
        max-results: The maximum number of results to return.
        next-token: |-
            The token that is required for pagination. On your first call to the `DescribeProducts` operation, set the value of this parameter to `NULL`.

            For subsequent calls to the operation, to continue listing data, set the value of this parameter to the value returned from the previous response.
        product-arn: The ARN of the integration to return.
