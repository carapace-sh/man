name: update-ip-restriction
description: Updates the content and status of IP rules.
flags:
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the IP rules.
    --enabled=: A value that specifies whether IP rules are turned on.
    --ip-restriction-rule-map=: A map that describes the updated IP rules with CIDR ranges and descriptions.
    --vpc-endpoint-id-restriction-rule-map=: A map of allowed VPC endpoint IDs and their corresponding rule descriptions.
    --vpc-id-restriction-rule-map=: A map of VPC IDs and their corresponding rules.
documentation:
    command: Updates the content and status of IP rules. Traffic from a source is allowed when the source satisfies either the `IpRestrictionRule`, `VpcIdRestrictionRule`, or `VpcEndpointIdRestrictionRule`. To use this operation, you must provide the entire map of rules. You can use the `DescribeIpRestriction` operation to get the current rule map.
    flag:
        aws-account-id: The ID of the Amazon Web Services account that contains the IP rules.
        enabled: A value that specifies whether IP rules are turned on.
        ip-restriction-rule-map: A map that describes the updated IP rules with CIDR ranges and descriptions.
        vpc-endpoint-id-restriction-rule-map: A map of allowed VPC endpoint IDs and their corresponding rule descriptions.
        vpc-id-restriction-rule-map: A map of VPC IDs and their corresponding rules. When you configure this parameter, traffic from all VPC endpoints that are present in the specified VPC is allowed.
