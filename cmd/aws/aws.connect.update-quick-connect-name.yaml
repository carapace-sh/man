name: update-quick-connect-name
description: Updates the name and description of a quick connect.
flags:
    --description=: The description of the quick connect.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --name=: The name of the quick connect.
    --quick-connect-id=!: The identifier for the quick connect.
documentation:
    command: Updates the name and description of a quick connect. The request accepts the following data in JSON format. At least `Name` or `Description` must be provided.
    flag:
        description: The description of the quick connect.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        name: The name of the quick connect.
        quick-connect-id: The identifier for the quick connect.
