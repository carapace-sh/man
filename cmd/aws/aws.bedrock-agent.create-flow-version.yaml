name: create-flow-version
description: Creates a version of the flow that you can deploy.
flags:
    --client-token=: A unique, case-sensitive identifier to ensure that the API request completes no more than one time.
    --description=: A description of the version of the flow.
    --flow-identifier=!: The unique identifier of the flow that you want to create a version of.
documentation:
    command: Creates a version of the flow that you can deploy. For more information, see [Deploy a flow in Amazon Bedrock](https://docs.aws.amazon.com/bedrock/latest/userguide/flows-deploy.html) in the Amazon Bedrock User Guide.
    flag:
        client-token: A unique, case-sensitive identifier to ensure that the API request completes no more than one time. If this token matches a previous request, Amazon Bedrock ignores the request, but does not return an error. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html).
        description: A description of the version of the flow.
        flow-identifier: The unique identifier of the flow that you want to create a version of.
