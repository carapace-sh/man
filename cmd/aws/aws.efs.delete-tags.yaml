name: delete-tags
description: DEPRECATED - `DeleteTags` is deprecated and not maintained.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --file-system-id=!: The ID of the file system whose tags you want to delete (String).
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --tag-keys=!: A list of tag keys to delete.
documentation:
    command: |-
        DEPRECATED - `DeleteTags` is deprecated and not maintained. To remove tags from EFS resources, use the API action.

        Deletes the specified tags from a file system. If the `DeleteTags` request includes a tag key that doesn't exist, Amazon EFS ignores it and doesn't cause an error. For more information about tags and related restrictions, see [Tag restrictions](https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-alloc-tags.html) in the *Billing and Cost Management User Guide*.

        This operation requires permissions for the `elasticfilesystem:DeleteTags` action.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
