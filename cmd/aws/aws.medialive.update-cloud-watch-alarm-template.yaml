name: update-cloud-watch-alarm-template
description: Updates the specified cloudwatch alarm template.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --comparison-operator=: ""
    --datapoints-to-alarm=: The number of datapoints within the evaluation period that must be breaching to trigger the alarm.
    --description=: A resource's optional description.
    --evaluation-periods=: The number of periods over which data is compared to the specified threshold.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --group-identifier=: A cloudwatch alarm template group's identifier.
    --identifier=!: A cloudwatch alarm template's identifier.
    --metric-name=: The name of the metric associated with the alarm.
    --name=: A resource's name.
    --period=: The period, in seconds, over which the specified statistic is applied.
    --statistic=: ""
    --target-resource-type=: ""
    --threshold=: The threshold value to compare with the specified statistic.
    --treat-missing-data=: ""
completion:
    flag:
        comparison-operator:
            - GreaterThanOrEqualToThreshold
            - GreaterThanThreshold
            - LessThanThreshold
            - LessThanOrEqualToThreshold
        statistic:
            - SampleCount
            - Average
            - Sum
            - Minimum
            - Maximum
        target-resource-type:
            - CLOUDFRONT_DISTRIBUTION
            - MEDIALIVE_MULTIPLEX
            - MEDIALIVE_CHANNEL
            - MEDIALIVE_INPUT_DEVICE
            - MEDIAPACKAGE_CHANNEL
            - MEDIAPACKAGE_ORIGIN_ENDPOINT
            - MEDIACONNECT_FLOW
            - S3_BUCKET
            - MEDIATAILOR_PLAYBACK_CONFIGURATION
        treat-missing-data:
            - notBreaching
            - breaching
            - ignore
            - missing
documentation:
    command: Updates the specified cloudwatch alarm template.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        comparison-operator: ""
        datapoints-to-alarm: The number of datapoints within the evaluation period that must be breaching to trigger the alarm.
        description: A resource's optional description.
        evaluation-periods: The number of periods over which data is compared to the specified threshold.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        group-identifier: A cloudwatch alarm template group's identifier. Can be either be its id or current name.
        identifier: A cloudwatch alarm template's identifier. Can be either be its id or current name.
        metric-name: The name of the metric associated with the alarm. Must be compatible with targetResourceType.
        name: A resource's name. Names must be unique within the scope of a resource type in a specific region.
        period: The period, in seconds, over which the specified statistic is applied.
        statistic: ""
        target-resource-type: ""
        threshold: The threshold value to compare with the specified statistic.
        treat-missing-data: ""
