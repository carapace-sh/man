name: delete
description: '*(ALPHA)*  *(DEPRECATED)*  Remove the Config Management feature spec for the given membership.'
flags:
    --location=: Location for the membership.
    --membership=!: ID of the membership or fully qualified identifier for the membership.
documentation:
    command: |-
        *(ALPHA)*  *(DEPRECATED)*  Remove the Config Management feature spec for the given membership.

        This command has been deprecated. Please use `unmanage` instead.

        Remove the Config Management feature spec for the given membership. The
        existing ConfigManagement resources in the clusters will become unmanaged.

        ## EXAMPLES

        To remove the Config Management feature spec for a membership, run:

          $ gcloud alpha container hub config-management delete --membership=MEMBERSHIP_NAME
    flag:
        location: |-
            Location for the membership.
            +
            To set the `location` attribute:
            * provide the argument `--membership` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkehub/location`.
        membership: |-
            ID of the membership or fully qualified identifier for the membership.
            +
            To set the `membership` attribute:
            * provide the argument `--membership` on the command line.
