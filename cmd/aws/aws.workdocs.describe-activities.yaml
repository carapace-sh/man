name: describe-activities
description: Describes the user activities in a specified time period.
flags:
    --activity-types=: Specifies which activity types to include in the response.
    --authentication-token=: Amazon WorkDocs authentication token.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --end-time=: The timestamp that determines the end time of the activities.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --include-indirect-activities: Includes indirect activities.
    --limit=: The maximum number of items to return.
    --marker=: The marker for the next set of results.
    --max-items=: The  total number of items to return in the command's output.
    --no-include-indirect-activities: Includes indirect activities.
    --organization-id=: The ID of the organization.
    --page-size=: The size of each page to get in the AWS service call.
    --resource-id=: The document or folder ID for which to describe activity types.
    --start-time=: The timestamp that determines the starting time of the activities.
    --starting-token=: A token to specify where to start paginating.
    --user-id=: The ID of the user who performed the action.
documentation:
    command: Describes the user activities in a specified time period.
    flag:
        activity-types: Specifies which activity types to include in the response. If this field is left empty, all activity types are returned.
        authentication-token: Amazon WorkDocs authentication token. Not required when using Amazon Web Services administrator credentials to access the API.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        end-time: The timestamp that determines the end time of the activities. The response includes the activities performed before the specified timestamp.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        include-indirect-activities: Includes indirect activities. An indirect activity results from a direct activity performed on a parent resource. For example, sharing a parent folder (the direct activity) shares all of the subfolders and documents within the parent folder (the indirect activity).
        limit: The maximum number of items to return.
        marker: The marker for the next set of results.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        organization-id: The ID of the organization. This is a mandatory parameter when using administrative API (SigV4) requests.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        resource-id: The document or folder ID for which to describe activity types.
        start-time: The timestamp that determines the starting time of the activities. The response includes the activities performed after the specified timestamp.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        user-id: The ID of the user who performed the action. The response includes activities pertaining to this user. This is an optional parameter and is only applicable for administrative API (SigV4) requests.
