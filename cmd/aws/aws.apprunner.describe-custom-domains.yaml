name: describe-custom-domains
description: Return a description of custom domain names that are associated with an App Runner service.
flags:
    --max-results=: The maximum number of results that each response (result page) can include.
    --next-token=: A token from a previous result page.
    --service-arn=!: The Amazon Resource Name (ARN) of the App Runner service that you want associated custom domain names to be described for.
documentation:
    command: Return a description of custom domain names that are associated with an App Runner service.
    flag:
        max-results: |-
            The maximum number of results that each response (result page) can include. It's used for a paginated request.

            If you don't specify `MaxResults`, the request retrieves all available results in a single response.
        next-token: |-
            A token from a previous result page. It's used for a paginated request. The request retrieves the next result page. All other parameter values must be identical to the ones that are specified in the initial request.

            If you don't specify `NextToken`, the request retrieves the first result page.
        service-arn: The Amazon Resource Name (ARN) of the App Runner service that you want associated custom domain names to be described for.
