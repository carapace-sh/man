name: list-accessors
description: Returns a list of the accessors and their properties.
flags:
    --max-results=: The maximum number of accessors to list.
    --network-type=: The blockchain network that the `Accessor` token is created for.
    --next-token=: The pagination token that indicates the next set of results to retrieve.
completion:
    flag:
        network-type:
            - ETHEREUM_GOERLI
            - ETHEREUM_MAINNET
            - ETHEREUM_MAINNET_AND_GOERLI
            - POLYGON_MAINNET
            - POLYGON_MUMBAI
documentation:
    command: Returns a list of the accessors and their properties. Accessor objects are containers that have the information required for token based access to your Ethereum nodes.
    flag:
        max-results: The maximum number of accessors to list.
        network-type: |-
            The blockchain network that the `Accessor` token is created for.

            Use the value `ETHEREUM_MAINNET_AND_GOERLI` for all existing `Accessors` tokens that were created before the `networkType` property was introduced.
        next-token: The pagination token that indicates the next set of results to retrieve.
