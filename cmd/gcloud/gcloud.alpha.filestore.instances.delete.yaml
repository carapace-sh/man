name: delete
description: '*(ALPHA)*  Delete a Filestore instance.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Location of the Cloud Filestore instance/operation.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: Region of the Cloud Filestore instance.
    --zone=: The zone of the instance.
documentation:
    command: '*(ALPHA)*  Delete a Filestore instance.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: Location of the Cloud Filestore instance/operation.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: Region of the Cloud Filestore instance.
        zone: |-
            The zone of the instance.
            +
            To set the `zone` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line;
            * provide the argument `region` on the command line;
            * provide the argument `location` on the command line;
            * set the property `filestore/zone`;
            * set the property `filestore/region`;
            * set the property `filestore/location`.
