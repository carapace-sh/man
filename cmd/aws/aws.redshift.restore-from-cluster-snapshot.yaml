name: restore-from-cluster-snapshot
description: Creates a new cluster from a snapshot.
flags:
    --additional-info=: Reserved.
    --allow-version-upgrade: If `true`, major version upgrades can be applied during the maintenance window to the Amazon Redshift engine that is running on the cluster.
    --aqua-configuration-status=: This parameter is retired.
    --automated-snapshot-retention-period=: The number of days that automated snapshots are retained.
    --availability-zone-relocation: The option to enable relocation for an Amazon Redshift cluster between Availability Zones after the cluster is restored.
    --availability-zone=: The Amazon EC2 Availability Zone in which to restore the cluster.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cluster-identifier=!: The identifier of the cluster that will be created from restoring the snapshot.
    --cluster-parameter-group-name=: The name of the parameter group to be associated with this cluster.
    --cluster-security-groups=: A list of security groups to be associated with this cluster.
    --cluster-subnet-group-name=: The name of the subnet group where you want to cluster restored.
    --default-iam-role-arn=: The Amazon Resource Name (ARN) for the IAM role that was set as default for the cluster when the cluster was last modified while it was restored from a snapshot.
    --elastic-ip=: The Elastic IP (EIP) address for the cluster.
    --encrypted: Enables support for restoring an unencrypted snapshot to a cluster encrypted with Key Management Service (KMS) and a customer managed key.
    --enhanced-vpc-routing: An option that specifies whether to create the cluster with enhanced VPC routing enabled.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --hsm-client-certificate-identifier=: Specifies the name of the HSM client certificate the Amazon Redshift cluster uses to retrieve the data encryption keys stored in an HSM.
    --hsm-configuration-identifier=: Specifies the name of the HSM configuration that contains the information the Amazon Redshift cluster can use to retrieve and store keys in an HSM.
    --iam-roles=: A list of Identity and Access Management (IAM) roles that can be used by the cluster to access other Amazon Web Services services.
    --ip-address-type=: The IP address type for the cluster.
    --kms-key-id=: The Key Management Service (KMS) key ID of the encryption key that encrypts data in the cluster restored from a shared snapshot.
    --maintenance-track-name=: The name of the maintenance track for the restored cluster.
    --manage-master-password: If `true`, Amazon Redshift uses Secrets Manager to manage the restored cluster's admin credentials.
    --manual-snapshot-retention-period=: The default number of days to retain a manual snapshot.
    --master-password-secret-kms-key-id=: The ID of the Key Management Service (KMS) key used to encrypt and store the cluster's admin credentials secret.
    --multi-az: If true, the snapshot will be restored to a cluster deployed in two Availability Zones.
    --no-allow-version-upgrade: If `true`, major version upgrades can be applied during the maintenance window to the Amazon Redshift engine that is running on the cluster.
    --no-availability-zone-relocation: The option to enable relocation for an Amazon Redshift cluster between Availability Zones after the cluster is restored.
    --no-encrypted: Enables support for restoring an unencrypted snapshot to a cluster encrypted with Key Management Service (KMS) and a customer managed key.
    --no-enhanced-vpc-routing: An option that specifies whether to create the cluster with enhanced VPC routing enabled.
    --no-manage-master-password: If `true`, Amazon Redshift uses Secrets Manager to manage the restored cluster's admin credentials.
    --no-multi-az: If true, the snapshot will be restored to a cluster deployed in two Availability Zones.
    --no-publicly-accessible: If `true`, the cluster can be accessed from a public network.
    --node-type=: The node type that the restored cluster will be provisioned with.
    --number-of-nodes=: The number of nodes specified when provisioning the restored cluster.
    --owner-account=: The Amazon Web Services account used to create or copy the snapshot.
    --port=: The port number on which the cluster accepts connections.
    --preferred-maintenance-window=: The weekly time range (in UTC) during which automated cluster maintenance can occur.
    --publicly-accessible: If `true`, the cluster can be accessed from a public network.
    --reserved-node-id=: The identifier of the target reserved node offering.
    --snapshot-arn=: The Amazon Resource Name (ARN) of the snapshot associated with the message to restore from a cluster.
    --snapshot-cluster-identifier=: The name of the cluster the source snapshot was created from.
    --snapshot-identifier=: The name of the snapshot from which to create the new cluster.
    --snapshot-schedule-identifier=: A unique identifier for the snapshot schedule.
    --target-reserved-node-offering-id=: The identifier of the target reserved node offering.
    --vpc-security-group-ids=: A list of Virtual Private Cloud (VPC) security groups to be associated with the cluster.
completion:
    flag:
        aqua-configuration-status:
            - enabled
            - disabled
            - auto
documentation:
    command: |-
        Creates a new cluster from a snapshot. By default, Amazon Redshift creates the resulting cluster with the same configuration as the original cluster from which the snapshot was created, except that the new cluster is created with the default cluster security and parameter groups. After Amazon Redshift creates the cluster, you can use the [ModifyCluster]() API to associate a different security group and different parameter group with the restored cluster. If you are using a DS node type, you can also choose to change to another DS node type of the same size during restore.

        If you restore a cluster into a VPC, you must provide a cluster subnet group where you want the cluster restored.

        VPC Block Public Access (BPA) enables you to block resources in VPCs and subnets that you own in a Region from reaching or being reached from the internet through internet gateways and egress-only internet gateways. If a subnet group for a provisioned cluster is in an account with VPC BPA turned on, the following capabilities are blocked:

        - Creating a public cluster
        - Restoring a public cluster
        - Modifying a private cluster to be public
        - Adding a subnet with VPC BPA turned on to the subnet group when there's at least one public cluster within the group

        For more information about VPC BPA, see [Block public access to VPCs and subnets](https://docs.aws.amazon.com/vpc/latest/userguide/security-vpc-bpa.html) in the *Amazon VPC User Guide*.

        For more information about working with snapshots, go to [Amazon Redshift Snapshots](https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-snapshots.html) in the *Amazon Redshift Cluster Management Guide*.
    flag:
        additional-info: Reserved.
        allow-version-upgrade: |-
            If `true`, major version upgrades can be applied during the maintenance window to the Amazon Redshift engine that is running on the cluster.

            Default: `true`
        aqua-configuration-status: This parameter is retired. It does not set the AQUA configuration status. Amazon Redshift automatically determines whether to use AQUA (Advanced Query Accelerator).
        automated-snapshot-retention-period: |-
            The number of days that automated snapshots are retained. If the value is 0, automated snapshots are disabled. Even if automated snapshots are disabled, you can still create manual snapshots when you want with [CreateClusterSnapshot]().

            You can't disable automated snapshots for RA3 node types. Set the automated retention period from 1-35 days.

            Default: The value selected for the cluster from which the snapshot was taken.

            Constraints: Must be a value from 0 to 35.
        availability-zone: |-
            The Amazon EC2 Availability Zone in which to restore the cluster.

            Default: A random, system-chosen Availability Zone.

            Example: `us-east-2a`
        availability-zone-relocation: The option to enable relocation for an Amazon Redshift cluster between Availability Zones after the cluster is restored.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cluster-identifier: |-
            The identifier of the cluster that will be created from restoring the snapshot.

            Constraints:

            - Must contain from 1 to 63 alphanumeric characters or hyphens.
            - Alphabetic characters must be lowercase.
            - First character must be a letter.
            - Cannot end with a hyphen or contain two consecutive hyphens.
            - Must be unique for all clusters within an Amazon Web Services account.
        cluster-parameter-group-name: |-
            The name of the parameter group to be associated with this cluster.

            Default: The default Amazon Redshift cluster parameter group. For information about the default parameter group, go to [Working with Amazon Redshift Parameter Groups](https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-parameter-groups.html).

            Constraints:

            - Must be 1 to 255 alphanumeric characters or hyphens.
            - First character must be a letter.
            - Cannot end with a hyphen or contain two consecutive hyphens.
        cluster-security-groups: |-
            A list of security groups to be associated with this cluster.

            Default: The default cluster security group for Amazon Redshift.

            Cluster security groups only apply to clusters outside of VPCs.
        cluster-subnet-group-name: |-
            The name of the subnet group where you want to cluster restored.

            A snapshot of cluster in VPC can be restored only in VPC. Therefore, you must provide subnet group name where you want the cluster restored.
        default-iam-role-arn: The Amazon Resource Name (ARN) for the IAM role that was set as default for the cluster when the cluster was last modified while it was restored from a snapshot.
        elastic-ip: The Elastic IP (EIP) address for the cluster. Don't specify the Elastic IP address for a publicly accessible cluster with availability zone relocation turned on.
        encrypted: Enables support for restoring an unencrypted snapshot to a cluster encrypted with Key Management Service (KMS) and a customer managed key.
        enhanced-vpc-routing: |-
            An option that specifies whether to create the cluster with enhanced VPC routing enabled. To create a cluster that uses enhanced VPC routing, the cluster must be in a VPC. For more information, see [Enhanced VPC Routing](https://docs.aws.amazon.com/redshift/latest/mgmt/enhanced-vpc-routing.html) in the Amazon Redshift Cluster Management Guide.

            If this option is `true`, enhanced VPC routing is enabled.

            Default: false
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        hsm-client-certificate-identifier: Specifies the name of the HSM client certificate the Amazon Redshift cluster uses to retrieve the data encryption keys stored in an HSM.
        hsm-configuration-identifier: Specifies the name of the HSM configuration that contains the information the Amazon Redshift cluster can use to retrieve and store keys in an HSM.
        iam-roles: |-
            A list of Identity and Access Management (IAM) roles that can be used by the cluster to access other Amazon Web Services services. You must supply the IAM roles in their Amazon Resource Name (ARN) format.

            The maximum number of IAM roles that you can associate is subject to a quota. For more information, go to [Quotas and limits](https://docs.aws.amazon.com/redshift/latest/mgmt/amazon-redshift-limits.html) in the *Amazon Redshift Cluster Management Guide*.
        ip-address-type: The IP address type for the cluster. Possible values are `ipv4` and `dualstack`.
        kms-key-id: The Key Management Service (KMS) key ID of the encryption key that encrypts data in the cluster restored from a shared snapshot. You can also provide the key ID when you restore from an unencrypted snapshot to an encrypted cluster in the same account. Additionally, you can specify a new KMS key ID when you restore from an encrypted snapshot in the same account in order to change it. In that case, the restored cluster is encrypted with the new KMS key ID.
        maintenance-track-name: The name of the maintenance track for the restored cluster. When you take a snapshot, the snapshot inherits the `MaintenanceTrack` value from the cluster. The snapshot might be on a different track than the cluster that was the source for the snapshot. For example, suppose that you take a snapshot of a cluster that is on the current track and then change the cluster to be on the trailing track. In this case, the snapshot and the source cluster are on different tracks.
        manage-master-password: If `true`, Amazon Redshift uses Secrets Manager to manage the restored cluster's admin credentials. If `ManageMasterPassword` is false or not set, Amazon Redshift uses the admin credentials the cluster had at the time the snapshot was taken.
        manual-snapshot-retention-period: |-
            The default number of days to retain a manual snapshot. If the value is -1, the snapshot is retained indefinitely. This setting doesn't change the retention period of existing snapshots.

            The value must be either -1 or an integer between 1 and 3,653.
        master-password-secret-kms-key-id: The ID of the Key Management Service (KMS) key used to encrypt and store the cluster's admin credentials secret. You can only use this parameter if `ManageMasterPassword` is true.
        multi-az: If true, the snapshot will be restored to a cluster deployed in two Availability Zones.
        node-type: |-
            The node type that the restored cluster will be provisioned with.

            If you have a DC instance type, you must restore into that same instance type and size. In other words, you can only restore a dc2.large node type into another dc2 type. For more information about node types, see [About Clusters and Nodes](https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-clusters.html#rs-about-clusters-and-nodes) in the *Amazon Redshift Cluster Management Guide*.
        number-of-nodes: The number of nodes specified when provisioning the restored cluster.
        owner-account: The Amazon Web Services account used to create or copy the snapshot. Required if you are restoring a snapshot you do not own, optional if you own the snapshot.
        port: |-
            The port number on which the cluster accepts connections.

            Default: The same port as the original cluster.

            Valid values: For clusters with DC2 nodes, must be within the range `1150`-`65535`. For clusters with ra3 nodes, must be within the ranges `5431`-`5455` or `8191`-`8215`.
        preferred-maintenance-window: |-
            The weekly time range (in UTC) during which automated cluster maintenance can occur.

            Format: `ddd:hh24:mi-ddd:hh24:mi`

            Default: The value selected for the cluster from which the snapshot was taken. For more information about the time blocks for each region, see [Maintenance Windows](https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-clusters.html#rs-maintenance-windows) in Amazon Redshift Cluster Management Guide.

            Valid Days: Mon | Tue | Wed | Thu | Fri | Sat | Sun

            Constraints: Minimum 30-minute window.
        publicly-accessible: |-
            If `true`, the cluster can be accessed from a public network.

            Default: false
        reserved-node-id: The identifier of the target reserved node offering.
        snapshot-arn: The Amazon Resource Name (ARN) of the snapshot associated with the message to restore from a cluster. You must specify this parameter or `snapshotIdentifier`, but not both.
        snapshot-cluster-identifier: The name of the cluster the source snapshot was created from. This parameter is required if your IAM user has a policy containing a snapshot resource element that specifies anything other than * for the cluster name.
        snapshot-identifier: |-
            The name of the snapshot from which to create the new cluster. This parameter isn't case sensitive. You must specify this parameter or `snapshotArn`, but not both.

            Example: `my-snapshot-id`
        snapshot-schedule-identifier: A unique identifier for the snapshot schedule.
        target-reserved-node-offering-id: The identifier of the target reserved node offering.
        vpc-security-group-ids: |-
            A list of Virtual Private Cloud (VPC) security groups to be associated with the cluster.

            Default: The default VPC security group is associated with the cluster.

            VPC security groups only apply to clusters in VPCs.
