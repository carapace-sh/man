name: update-knowledge-base
description: Updates the configuration of a knowledge base with the fields that you specify.
flags:
    --description=: Specifies a new description for the knowledge base.
    --knowledge-base-configuration=!: Specifies the configuration for the embeddings model used for the knowledge base.
    --knowledge-base-id=!: The unique identifier of the knowledge base to update.
    --name=!: Specifies a new name for the knowledge base.
    --role-arn=!: Specifies a different Amazon Resource Name (ARN) of the IAM role with permissions to invoke API operations on the knowledge base.
    --storage-configuration=: Specifies the configuration for the vector store used for the knowledge base.
documentation:
    command: |-
        Updates the configuration of a knowledge base with the fields that you specify. Because all fields will be overwritten, you must include the same values for fields that you want to keep the same.

        You can change the following fields:

        - `name`
        - `description`
        - `roleArn`

        You can't change the `knowledgeBaseConfiguration` or `storageConfiguration` fields, so you must specify the same configurations as when you created the knowledge base. You can send a [GetKnowledgeBase](https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent_GetKnowledgeBase.html) request and copy the same configurations.
    flag:
        description: Specifies a new description for the knowledge base.
        knowledge-base-configuration: Specifies the configuration for the embeddings model used for the knowledge base. You must use the same configuration as when the knowledge base was created.
        knowledge-base-id: The unique identifier of the knowledge base to update.
        name: Specifies a new name for the knowledge base.
        role-arn: Specifies a different Amazon Resource Name (ARN) of the IAM role with permissions to invoke API operations on the knowledge base.
        storage-configuration: Specifies the configuration for the vector store used for the knowledge base. You must use the same configuration as when the knowledge base was created.
