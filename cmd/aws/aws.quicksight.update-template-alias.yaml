name: update-template-alias
description: Updates the template alias of a template.
flags:
    --alias-name=!: The alias of the template that you want to update.
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the template alias that you're updating.
    --template-id=!: The ID for the template.
    --template-version-number=!: The version number of the template.
documentation:
    command: Updates the template alias of a template.
    flag:
        alias-name: The alias of the template that you want to update. If you name a specific alias, you update the version that the alias points to. You can specify the latest version of the template by providing the keyword `$LATEST` in the `AliasName` parameter. The keyword `$PUBLISHED` doesn't apply to templates.
        aws-account-id: The ID of the Amazon Web Services account that contains the template alias that you're updating.
        template-id: The ID for the template.
        template-version-number: The version number of the template.
