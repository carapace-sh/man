completion:
    flag:
        default-squash-mode:
            - all-users-squash
            - no-squash
            - root-squash
documentation:
    command: |
        *(ALPHA)*  Updates the parameters of a single Managed Lustre instance.
    flag:
        access-rules: |-
            Set access_rules to new value. The access rules for the instance.
            +
            *accessMode*:::
            The access mode for the access rule nodemap.
            Default is [READ_WRITE][google.cloud.lustre.v1alpha.AccessRulesOptions.AccessRule.AccessMode.READ_WRITE].
            +
            *ipAddressRanges*:::
            The IP address ranges to which to apply this access rule. Accepts
            non-overlapping CIDR ranges (e.g., `192.168.1.0/24`) and IP addresses
            (e.g., `192.168.1.0`).
            +
            *mountableSubdirectories*:::
            The list of non-root directories that can be mounted from
            clients in this NID range subset. Currently, there can be only a single
            directory at most. If no directory is mentioned, then the root directory
            will be accessible.
            +
            *name*:::
            The name of the access rule policy group.
            Must be 16 characters or less and include only alphanumeric characters
            or '_'.
            +
            *squashGid*:::
            Squash GID for the access rule. If the squash mode for this rule is
            [ROOT_SQUASH][google.cloud.lustre.v1alpha.AccessRulesOptions.SquashMode.ROOT_SQUASH], root users matching the
            [ip_address_ranges][google.cloud.lustre.v1alpha.AccessRulesOptions.AccessRule.ip_address_ranges] are squashed to this
            GID. Defaults to 0 (no root squash).
            +
            *squashMode*:::
            Squash mode for the access rule.
            +
            *squashUid*:::
            Squash UID for the access rule. If the squash mode for this rule is
            [ROOT_SQUASH][google.cloud.lustre.v1alpha.AccessRulesOptions.SquashMode.ROOT_SQUASH], root users matching the
            [ip_address_ranges][google.cloud.lustre.v1alpha.AccessRulesOptions.AccessRule.ip_address_ranges] are squashed to this
            UID. Defaults to 0 (no root squash).
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --access-rules=accessMode=string,ipAddressRanges=[string],mountableSubdirectories=[string],name=string,squashGid=int,squashMode=string,squashUid=int --access-rules=accessMode=string,ipAddressRanges=[string],mountableSubdirectories=[string],name=string,squashGid=int,squashMode=string,squashUid=int
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --access-rules='[{"accessMode": "string", "ipAddressRanges": ["string"], "mountableSubdirectories": ["string"], "name": "string", "squashGid": int, "squashMode": "string", "squashUid": int}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --access-rules=path_to_file.(yaml|json)
            +
            ```
        add-access-rules: |-
            Add new value to access_rules list. The access rules for the instance.
            +
            *accessMode*:::
            The access mode for the access rule nodemap.
            Default is [READ_WRITE][google.cloud.lustre.v1alpha.AccessRulesOptions.AccessRule.AccessMode.READ_WRITE].
            +
            *ipAddressRanges*:::
            The IP address ranges to which to apply this access rule. Accepts
            non-overlapping CIDR ranges (e.g., `192.168.1.0/24`) and IP addresses
            (e.g., `192.168.1.0`).
            +
            *mountableSubdirectories*:::
            The list of non-root directories that can be mounted from
            clients in this NID range subset. Currently, there can be only a single
            directory at most. If no directory is mentioned, then the root directory
            will be accessible.
            +
            *name*:::
            The name of the access rule policy group.
            Must be 16 characters or less and include only alphanumeric characters
            or '_'.
            +
            *squashGid*:::
            Squash GID for the access rule. If the squash mode for this rule is
            [ROOT_SQUASH][google.cloud.lustre.v1alpha.AccessRulesOptions.SquashMode.ROOT_SQUASH], root users matching the
            [ip_address_ranges][google.cloud.lustre.v1alpha.AccessRulesOptions.AccessRule.ip_address_ranges] are squashed to this
            GID. Defaults to 0 (no root squash).
            +
            *squashMode*:::
            Squash mode for the access rule.
            +
            *squashUid*:::
            Squash UID for the access rule. If the squash mode for this rule is
            [ROOT_SQUASH][google.cloud.lustre.v1alpha.AccessRulesOptions.SquashMode.ROOT_SQUASH], root users matching the
            [ip_address_ranges][google.cloud.lustre.v1alpha.AccessRulesOptions.AccessRule.ip_address_ranges] are squashed to this
            UID. Defaults to 0 (no root squash).
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --add-access-rules=accessMode=string,ipAddressRanges=[string],mountableSubdirectories=[string],name=string,squashGid=int,squashMode=string,squashUid=int --add-access-rules=accessMode=string,ipAddressRanges=[string],mountableSubdirectories=[string],name=string,squashGid=int,squashMode=string,squashUid=int
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --add-access-rules='[{"accessMode": "string", "ipAddressRanges": ["string"], "mountableSubdirectories": ["string"], "name": "string", "squashGid": int, "squashMode": "string", "squashUid": int}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --add-access-rules=path_to_file.(yaml|json)
            +
            ```
        add-default-mountable-subdirectories: Add new value to default_mountable_subdirectories list.
        add-maintenance-policy-deny-periods: Add new value to maintenance_policy_deny_periods list.
        add-maintenance-policy-windows: Add new value to maintenance_policy_windows list.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        capacity-gib: |-
            The storage capacity of the instance in gibibytes (GiB). Allowed values
            are from `18000` to `7632000`, depending on the `perUnitStorageThroughput`.
            See [Performance tiers and maximum storage
            capacities](https://cloud.google.com/managed-lustre/docs/create-instance#performance-tiers)
            for specific minimums, maximums, and step sizes for each performance tier.
        clear-: Set instance.accessRulesOptions back to default value.
        clear-access-rules: Clear access_rules value and set to empty list.
        clear-default-mountable-subdirectories: Clear default_mountable_subdirectories value and set to empty list.
        clear-labels: Clear labels value and set to empty map.
        clear-maintenance-policy: Set instance.maintenancePolicy back to default value.
        clear-maintenance-policy-deny-periods: Clear maintenance_policy_deny_periods value and set to empty list.
        clear-maintenance-policy-windows: Clear maintenance_policy_windows value and set to empty list.
        default-mountable-subdirectories: Set default_mountable_subdirectories to new value.
        default-squash-gid: |-
            The user squash GID for the default access rule.
            This user squash GID applies to all root users connecting from clients
            that are not matched by any of the access rules. If not set, the default
            is 0 (no GID squash).
        default-squash-mode: |-
            The squash mode for the default access rule. _DEFAULT_SQUASH_MODE_ must be one of:
            +
            *no-squash*::: Squash is disabled.
            +
            If set inside an [AccessRule][google.cloud.lustre.v1alpha.AccessRulesOptions.AccessRule], root users matching the
            [ip_ranges][AccessRule.ip_ranges] are not squashed.
            +
            If set as the [default_squash_mode][google.cloud.lustre.v1alpha.AccessRulesOptions.default_squash_mode], root squash is
            disabled for this instance.
            +
            If the default squash mode is `NO_SQUASH`, do not set the
            [default_squash_uid][google.cloud.lustre.v1alpha.AccessRulesOptions.default_squash_uid] or
            [default_squash_gid][google.cloud.lustre.v1alpha.AccessRulesOptions.default_squash_gid], or an `invalid argument` error
            is returned.
            *root-squash*::: Root user squash is enabled.
            +
            Not supported inside an [AccessRule][google.cloud.lustre.v1alpha.AccessRulesOptions.AccessRule].
            +
            If set as the [default_squash_mode][google.cloud.lustre.v1alpha.AccessRulesOptions.default_squash_mode],
            root users not matching any of the [access_rules][google.cloud.lustre.v1alpha.AccessRulesOptions.access_rules] are
            squashed to the [default_squash_uid][google.cloud.lustre.v1alpha.AccessRulesOptions.default_squash_uid] and
            [default_squash_gid][google.cloud.lustre.v1alpha.AccessRulesOptions.default_squash_gid].
            :::
            +
        default-squash-uid: |-
            The user squash UID for the default access rule.
            This user squash UID applies to all root users connecting from clients
            that are not matched by any of the access rules. If not set, the default
            is 0 (no UID squash).
        description: A user-readable description of the instance.
        gke-support-enabled: |-
            Indicates whether you want to enable support for GKE clients. By default,
            GKE clients are not supported.
            Deprecated. No longer required for GKE instance creation. Use *--gke-support-enabled* to enable and *--no-gke-support-enabled* to disable.
        labels: |-
            Set labels to new value. Labels as key value pairs.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: |-
            The location id of the instance resource.
            +
            To set the `location` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        maintenance-policy-deny-periods: Set maintenance_policy_deny_periods to new value.
        maintenance-policy-windows: Set maintenance_policy_windows to new value.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-: Set instance.accessRulesOptions back to default value.
        no-clear-access-rules: Clear access_rules value and set to empty list.
        no-clear-default-mountable-subdirectories: Clear default_mountable_subdirectories value and set to empty list.
        no-clear-labels: Clear labels value and set to empty map.
        no-clear-maintenance-policy: Set instance.maintenancePolicy back to default value.
        no-clear-maintenance-policy-deny-periods: Clear maintenance_policy_deny_periods value and set to empty list.
        no-clear-maintenance-policy-windows: Clear maintenance_policy_windows value and set to empty list.
        no-gke-support-enabled: |-
            Indicates whether you want to enable support for GKE clients. By default,
            GKE clients are not supported.
            Deprecated. No longer required for GKE instance creation.
        per-unit-storage-throughput: |-
            The throughput of the instance in MB/s/TiB. Valid values are 125, 250,
            500, 1000.
            See [Performance tiers and maximum storage
            capacities](https://cloud.google.com/managed-lustre/docs/create-instance#performance-tiers)
            for more information.
        placement-policy: |-
            The placement policy name for the instance in the format of
            projects/{project}/locations/{location}/resourcePolicies/{resource_policy}
        remove-access-rules: |-
            Remove existing value from access_rules list. The access rules for the instance.
            +
            *accessMode*:::
            The access mode for the access rule nodemap.
            Default is [READ_WRITE][google.cloud.lustre.v1alpha.AccessRulesOptions.AccessRule.AccessMode.READ_WRITE].
            +
            *ipAddressRanges*:::
            The IP address ranges to which to apply this access rule. Accepts
            non-overlapping CIDR ranges (e.g., `192.168.1.0/24`) and IP addresses
            (e.g., `192.168.1.0`).
            +
            *mountableSubdirectories*:::
            The list of non-root directories that can be mounted from
            clients in this NID range subset. Currently, there can be only a single
            directory at most. If no directory is mentioned, then the root directory
            will be accessible.
            +
            *name*:::
            The name of the access rule policy group.
            Must be 16 characters or less and include only alphanumeric characters
            or '_'.
            +
            *squashGid*:::
            Squash GID for the access rule. If the squash mode for this rule is
            [ROOT_SQUASH][google.cloud.lustre.v1alpha.AccessRulesOptions.SquashMode.ROOT_SQUASH], root users matching the
            [ip_address_ranges][google.cloud.lustre.v1alpha.AccessRulesOptions.AccessRule.ip_address_ranges] are squashed to this
            GID. Defaults to 0 (no root squash).
            +
            *squashMode*:::
            Squash mode for the access rule.
            +
            *squashUid*:::
            Squash UID for the access rule. If the squash mode for this rule is
            [ROOT_SQUASH][google.cloud.lustre.v1alpha.AccessRulesOptions.SquashMode.ROOT_SQUASH], root users matching the
            [ip_address_ranges][google.cloud.lustre.v1alpha.AccessRulesOptions.AccessRule.ip_address_ranges] are squashed to this
            UID. Defaults to 0 (no root squash).
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-access-rules=accessMode=string,ipAddressRanges=[string],mountableSubdirectories=[string],name=string,squashGid=int,squashMode=string,squashUid=int --remove-access-rules=accessMode=string,ipAddressRanges=[string],mountableSubdirectories=[string],name=string,squashGid=int,squashMode=string,squashUid=int
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-access-rules='[{"accessMode": "string", "ipAddressRanges": ["string"], "mountableSubdirectories": ["string"], "name": "string", "squashGid": int, "squashMode": "string", "squashUid": int}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-access-rules=path_to_file.(yaml|json)
            +
            ```
        remove-default-mountable-subdirectories: Remove existing value from default_mountable_subdirectories list.
        remove-labels: |-
            Remove existing value from map labels. Sets `remove_labels` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-labels=string,string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-labels=["string"]
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-labels=path_to_file.(yaml|json)
            +
            ```
        remove-maintenance-policy-deny-periods: Remove existing value from maintenance_policy_deny_periods list.
        remove-maintenance-policy-windows: Remove existing value from maintenance_policy_windows list.
        request-id: |-
            An optional request ID to identify requests. Specify a unique request ID
            so that if you must retry your request, the server will know to ignore
            the request if it has already been completed. The server will guarantee
            that for at least 60 minutes since the first request.
            +
            For example, consider a situation where you make an initial request and the
            request times out. If you make the request again with the same request
            ID, the server can check if original operation with the same request ID
            was received, and if so, will ignore the second request. This prevents
            clients from accidentally creating duplicate commitments.
            +
            The request ID must be a valid UUID with the exception that zero UUID is
            not supported (00000000-0000-0000-0000-000000000000).
        update-labels: |-
            Update labels value or add key value pair. Labels as key value pairs.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --update-labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --update-labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --update-labels=path_to_file.(yaml|json)
            +
            ```
