name: update-primary-email-address
description: Updates the primary email for a user, group, or resource.
flags:
    --email=!: The value of the email to be updated as primary.
    --entity-id=!: The user, group, or resource to update.
    --organization-id=!: The organization that contains the user, group, or resource to update.
documentation:
    command: Updates the primary email for a user, group, or resource. The current email is moved into the list of aliases (or swapped between an existing alias and the current primary email), and the email provided in the input is promoted as the primary.
    flag:
        email: The value of the email to be updated as primary.
        entity-id: |-
            The user, group, or resource to update.

            The identifier can accept *UseriD, ResourceId, or GroupId*, *Username, Resourcename, or Groupname*, or *email*. The following identity formats are available:

            - Entity ID: 12345678-1234-1234-1234-123456789012, r-0123456789a0123456789b0123456789, or S-1-1-12-1234567890-123456789-123456789-1234
            - Email address: entity@domain.tld
            - Entity name: entity
        organization-id: The organization that contains the user, group, or resource to update.
