    --name=!: A name for the data source.
documentation:
    command: Creates a new direct-query data source to the specified domain. For more information, see [Creating Amazon OpenSearch Service data source integrations with Amazon S3](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/direct-query-s3-creating.html).
    flag:
        data-source-type: The type of data source.
