name: list-environment-blueprint-configurations
description: Lists blueprint configurations for a Amazon DataZone environment.
flags:
    --domain-identifier=!: The identifier of the Amazon DataZone domain.
    --max-results=: The maximum number of blueprint configurations to return in a single call to `ListEnvironmentBlueprintConfigurations`.
    --next-token=: When the number of blueprint configurations is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of configurations, the response includes a pagination token named `NextToken`.
documentation:
    command: Lists blueprint configurations for a Amazon DataZone environment.
    flag:
        domain-identifier: The identifier of the Amazon DataZone domain.
        max-results: The maximum number of blueprint configurations to return in a single call to `ListEnvironmentBlueprintConfigurations`. When the number of configurations to be listed is greater than the value of `MaxResults`, the response contains a `NextToken` value that you can use in a subsequent call to `ListEnvironmentBlueprintConfigurations` to list the next set of configurations.
        next-token: When the number of blueprint configurations is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of configurations, the response includes a pagination token named `NextToken`. You can specify this `NextToken` value in a subsequent call to `ListEnvironmentBlueprintConfigurations` to list the next set of configurations.
