name: list-model-metadata
description: Lists the domain, framework, task, and model name of standard machine learning models found in common model zoos.
flags:
    --max-results=: The maximum number of models to return in the response.
    --next-token=: If the response to a previous `ListModelMetadataResponse` request was truncated, the response includes a NextToken.
    --search-expression=: One or more filters that searches for the specified resource or resources in a search.
documentation:
    command: Lists the domain, framework, task, and model name of standard machine learning models found in common model zoos.
    flag:
        max-results: The maximum number of models to return in the response.
        next-token: If the response to a previous `ListModelMetadataResponse` request was truncated, the response includes a NextToken. To retrieve the next set of model metadata, use the token in the next request.
        search-expression: One or more filters that searches for the specified resource or resources in a search. All resource objects that satisfy the expression's condition are included in the search results. Specify the Framework, FrameworkVersion, Domain or Task to filter supported. Filter names and values are case-sensitive.
