name: list-runs
description: Retrieves a list of runs and returns each run's metadata and status.
flags:
    --max-results=: The maximum number of runs to return in one page of results.
    --name=: Filter the list by run name.
    --run-group-id=: Filter the list by run group ID.
    --starting-token=: Specify the pagination token from a previous request to retrieve the next page of results.
    --status=: The status of a run.
completion:
    flag:
        status:
            - PENDING
            - STARTING
            - RUNNING
            - STOPPING
            - COMPLETED
            - DELETED
            - CANCELLED
            - FAILED
documentation:
    command: |-
        Retrieves a list of runs and returns each run's metadata and status.

        Amazon Web Services HealthOmics stores a configurable number of runs, as determined by service limits, that are available to the console and API. If the `ListRuns` response doesn't include specific runs that you expected, you can find all run logs in the CloudWatch logs. For more information about viewing the run logs, see [CloudWatch logs](https://docs.aws.amazon.com/omics/latest/dev/monitoring-cloudwatch-logs.html) in the *Amazon Web Services HealthOmics User Guide*.
    flag:
        max-results: The maximum number of runs to return in one page of results.
        name: Filter the list by run name.
        run-group-id: Filter the list by run group ID.
        starting-token: Specify the pagination token from a previous request to retrieve the next page of results.
        status: The status of a run.
