name: create-simulation-job
description: 'End of support notice: On September 10, 2025, Amazon Web Services will discontinue support for Amazon Web Services RoboMaker.'
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --compute=: Compute information for the simulation job.
    --data-sources=: Specify data sources to mount read-only files from S3 into your simulation.
    --failure-behavior=: The failure behavior the simulation job.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --iam-role=!: The IAM role name that allows the simulation instance to call the AWS APIs that are specified in its associated policies on your behalf.
    --logging-config=: The logging configuration.
    --max-job-duration-in-seconds=!: The maximum simulation job duration in seconds (up to 14 days or 1,209,600 seconds.
    --output-location=: Location for output files generated by the simulation job.
    --robot-applications=: The robot application to use in the simulation job.
    --simulation-applications=: The simulation application to use in the simulation job.
    --tags=: A map that contains tag keys and tag values that are attached to the simulation job.
    --vpc-config=: If your simulation job accesses resources in a VPC, you provide this parameter identifying the list of security group IDs and subnet IDs.
completion:
    flag:
        failure-behavior:
            - Fail
            - Continue
documentation:
    command: |-
        End of support notice: On September 10, 2025, Amazon Web Services will discontinue support for Amazon Web Services RoboMaker. After September 10, 2025, you will no longer be able to access the Amazon Web Services RoboMaker console or Amazon Web Services RoboMaker resources. For more information on transitioning to Batch to help run containerized simulations, visit [https://aws.amazon.com/blogs/hpc/run-simulations-using-multiple-containers-in-a-single-aws-batch-job/](https://aws.amazon.com/blogs/hpc/run-simulations-using-multiple-containers-in-a-single-aws-batch-job/).

        Creates a simulation job.

        After 90 days, simulation jobs expire and will be deleted. They will no longer be accessible.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        compute: Compute information for the simulation job.
        data-sources: |-
            Specify data sources to mount read-only files from S3 into your simulation. These files are available under `/opt/robomaker/datasources/data_source_name`.

            There is a limit of 100 files and a combined size of 25GB for all `DataSourceConfig` objects.
        failure-behavior: |-
            The failure behavior the simulation job.

            Continue

            Leaves the instance running for its maximum timeout duration after a `4XX` error code.

            Fail

            Stop the simulation job and terminate the instance.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        iam-role: The IAM role name that allows the simulation instance to call the AWS APIs that are specified in its associated policies on your behalf. This is how credentials are passed in to your simulation job.
        logging-config: The logging configuration.
        max-job-duration-in-seconds: The maximum simulation job duration in seconds (up to 14 days or 1,209,600 seconds. When `maxJobDurationInSeconds` is reached, the simulation job will status will transition to `Completed`.
        output-location: Location for output files generated by the simulation job.
        robot-applications: The robot application to use in the simulation job.
        simulation-applications: The simulation application to use in the simulation job.
        tags: A map that contains tag keys and tag values that are attached to the simulation job.
        vpc-config: If your simulation job accesses resources in a VPC, you provide this parameter identifying the list of security group IDs and subnet IDs. These must belong to the same VPC. You must provide at least one security group and one subnet ID.
