name: remove-resource-policies
description: '*(ALPHA)*  Remove resource policies from a Compute Engine disk.'
flags:
    --region=: Region of the disk to remove resource policies from.
    --resource-policies=!: A list of resource policy names to be removed from the disk.
    --zone=: Zone of the disk to remove resource policies from.
documentation:
    command: |
        *(ALPHA)*  Remove resource policies from a Compute Engine disk.

        *gcloud alpha compute disks remove-resource-policies* removes resource policies from a Compute Engine disk.
    flag:
        region: |-
            Region of the disk to remove resource policies from. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        resource-policies: A list of resource policy names to be removed from the disk. The policies must exist in the same region as the disk.
        zone: |-
            Zone of the disk to remove resource policies from. If not specified and the ``compute/zone'' property isn't set, you
            might be prompted to select a zone (interactive mode only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
