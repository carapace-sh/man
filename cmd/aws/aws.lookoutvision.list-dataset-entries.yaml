name: list-dataset-entries
description: Lists the JSON Lines within a dataset.
flags:
    --after-creation-date=: Only includes entries after the specified date in the response.
    --anomaly-class=: Specify `normal` to include only normal images.
    --before-creation-date=: Only includes entries before the specified date in the response.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dataset-type=!: The type of the dataset that you want to list.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --labeled: Specify `true` to include labeled entries, otherwise specify `false`.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of results to return per paginated call.
    --next-token=: If the previous response was incomplete (because there is more data to retrieve), Amazon Lookout for Vision returns a pagination token in the response.
    --no-labeled: Specify `true` to include labeled entries, otherwise specify `false`.
    --page-size=: The size of each page to get in the AWS service call.
    --project-name=!: The name of the project that contains the dataset that you want to list.
    --source-ref-contains=: Perform a "contains" search on the values of the `source-ref` key within the dataset.
    --starting-token=: A token to specify where to start paginating.
documentation:
    command: |-
        Lists the JSON Lines within a dataset. An Amazon Lookout for Vision JSON Line contains the anomaly information for a single image, including the image location and the assigned label.

        This operation requires permissions to perform the `lookoutvision:ListDatasetEntries` operation.
    flag:
        after-creation-date: Only includes entries after the specified date in the response. For example, `2020-06-23T00:00:00`.
        anomaly-class: Specify `normal` to include only normal images. Specify `anomaly` to only include anomalous entries. If you don't specify a value, Amazon Lookout for Vision returns normal and anomalous images.
        before-creation-date: Only includes entries before the specified date in the response. For example, `2020-06-23T00:00:00`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dataset-type: The type of the dataset that you want to list. Specify `train` to list the training dataset. Specify `test` to list the test dataset. If you have a single dataset project, specify `train`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        labeled: Specify `true` to include labeled entries, otherwise specify `false`. If you don't specify a value, Lookout for Vision returns all entries.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of results to return per paginated call. The largest value you can specify is 100. If you specify a value greater than 100, a ValidationException error occurs. The default value is 100.
        next-token: If the previous response was incomplete (because there is more data to retrieve), Amazon Lookout for Vision returns a pagination token in the response. You can use this pagination token to retrieve the next set of dataset entries.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        project-name: The name of the project that contains the dataset that you want to list.
        source-ref-contains: Perform a "contains" search on the values of the `source-ref` key within the dataset. For example a value of "IMG\_17" returns all JSON Lines where the `source-ref` key value matches *\*IMG\_17\**.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
