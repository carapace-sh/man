name: describe-security-configuration
description: Displays detailed information about a specified security configuration.
flags:
    --id=!: The ID of the security configuration.
documentation:
    command: Displays detailed information about a specified security configuration. Security configurations in Amazon EMR on EKS are templates for different security setups. You can use security configurations to configure the Lake Formation integration setup. You can also create a security configuration to re-use a security setup each time you create a virtual cluster.
    flag:
        id: The ID of the security configuration.
