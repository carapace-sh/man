name: start-stream-session
description: This action initiates a new stream session and outputs connection information that clients can use to access the stream.
flags:
    --additional-environment-variables=: A set of options that you can use to control the stream session runtime environment, expressed as a set of key-value pairs.
    --additional-launch-args=: A list of CLI arguments that are sent to the streaming server when a stream session launches.
    --application-identifier=!: An [Amazon Resource Name (ARN)](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference-arns.html) or ID that uniquely identifies the application resource.
    --client-token=: A unique identifier that represents a client request.
    --connection-timeout-seconds=: Length of time (in seconds) that Amazon GameLift Streams should wait for a client to connect or reconnect to the stream session.
    --description=: A human-readable label for the stream session.
    --identifier=!: The stream group to run this stream session with.
    --locations=: A list of locations, in order of priority, where you want Amazon GameLift Streams to start a stream from.
    --protocol=!: The data transport protocol to use for the stream session.
    --session-length-seconds=: The maximum duration of a session.
    --signal-request=!: A WebRTC ICE offer string to use when initializing a WebRTC connection.
    --user-id=: An opaque, unique identifier for an end-user, defined by the developer.
completion:
    flag:
        protocol:
            - WebRTC
documentation:
    command: "This action initiates a new stream session and outputs connection information that clients can use to access the stream. A stream session refers to an instance of a stream that Amazon GameLift Streams transmits from the server to the end-user. A stream session runs on a compute resource that a stream group has allocated. The start stream session process works as follows:\n\n1. Prerequisites:\n   \n   - You must have a stream group in `ACTIVE` status\n   - You must have idle or on-demand capacity in a stream group in the location you want to stream from\n   - You must have at least one application associated to the stream group (use [AssociateApplications](https://docs.aws.amazon.com/gameliftstreams/latest/apireference/API_AssociateApplications.html) if needed)\n2. Start stream request:\n   \n   - Your backend server calls **StartStreamSession** to initiate connection\n   - Amazon GameLift Streams creates the stream session resource, assigns an Amazon Resource Name (ARN) value, and begins searching for available stream capacity to run the stream\n   - Session transitions to `ACTIVATING` status\n3. Placement completion:\n   \n   - If Amazon GameLift Streams is successful in finding capacity for the stream, the stream session status changes to `ACTIVE` status and **StartStreamSession** returns stream connection information\n   - If Amazon GameLift Streams was not successful in finding capacity within the placement timeout period (defined according to the capacity type and platform type), the stream session status changes to `ERROR` status and **StartStreamSession** returns a `StatusReason` of `placementTimeout`\n4. Connection completion:\n   \n   - Provide the new connection information to the requesting client\n   - Client must establish connection within `ConnectionTimeoutSeconds` (specified in **StartStreamSession** parameters)\n   - Session terminates automatically if client fails to connect in time\n\nFor more information about the stream session lifecycle, see [Stream sessions](https://docs.aws.amazon.com/gameliftstreams/latest/developerguide/stream-sessions.html) in the *Amazon GameLift Streams Developer Guide*.\n\nTimeouts to be aware of that affect a stream session:\n\n- **Placement timeout**: The amount of time that Amazon GameLift Streams has to find capacity for a stream request. Placement timeout varies based on the capacity type used to fulfill your stream request:\n  \n  - **Always-on capacity**: 75 seconds\n  - **On-demand capacity**:\n    \n    - Linux/Proton runtimes: 90 seconds\n    - Windows runtime: 10 minutes\n- **Connection timeout**: The amount of time that Amazon GameLift Streams waits for a client to connect to a stream session in `ACTIVE` status, or reconnect to a stream session in `PENDING_CLIENT_RECONNECTION` status, the latter of which occurs when a client disconnects or loses connection from a stream session. If no client connects before the timeout, Amazon GameLift Streams terminates the stream session. This value is specified by `ConnectionTimeoutSeconds` in the `StartStreamSession` parameters.\n- **Idle timeout**: A stream session will be terminated if no user input has been received for 60 minutes.\n- **Maximum session length**: A stream session will be terminated after this amount of time has elapsed since it started, regardless of any existing client connections. This value is specified by `SessionLengthSeconds` in the `StartStreamSession` parameters.\n\nTo start a new stream session, specify a stream group ID and application ID, along with the transport protocol and signal request to use with the stream session.\n\nFor stream groups that have multiple locations, provide a set of locations ordered by priority using a `Locations` parameter. Amazon GameLift Streams will start a single stream session in the next available location. An application must be finished replicating to a remote location before the remote location can host a stream.\n\nTo reconnect to a stream session after a client disconnects or loses connection, use [CreateStreamSessionConnection](https://docs.aws.amazon.com/gameliftstreams/latest/apireference/API_CreateStreamSessionConnection.html)."
    flag:
        additional-environment-variables: |-
            A set of options that you can use to control the stream session runtime environment, expressed as a set of key-value pairs. You can use this to configure the application or stream session details. You can also provide custom environment variables that Amazon GameLift Streams passes to your game client.

            If you want to debug your application with environment variables, we recommend that you do so in a local environment outside of Amazon GameLift Streams. For more information, refer to the Compatibility Guidance in the troubleshooting section of the Developer Guide.

            `AdditionalEnvironmentVariables` and `AdditionalLaunchArgs` have similar purposes. `AdditionalEnvironmentVariables` passes data using environment variables; while `AdditionalLaunchArgs` passes data using command-line arguments.
        additional-launch-args: |-
            A list of CLI arguments that are sent to the streaming server when a stream session launches. You can use this to configure the application or stream session details. You can also provide custom arguments that Amazon GameLift Streams passes to your game client.

            `AdditionalEnvironmentVariables` and `AdditionalLaunchArgs` have similar purposes. `AdditionalEnvironmentVariables` passes data using environment variables; while `AdditionalLaunchArgs` passes data using command-line arguments.
        application-identifier: 'An [Amazon Resource Name (ARN)](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference-arns.html) or ID that uniquely identifies the application resource. Example ARN: `arn:aws:gameliftstreams:us-west-2:111122223333:application/a-9ZY8X7Wv6`. Example ID: `a-9ZY8X7Wv6`.'
        client-token: A unique identifier that represents a client request. The request is idempotent, which ensures that an API request completes only once. When users send a request, Amazon GameLift Streams automatically populates this field.
        connection-timeout-seconds: Length of time (in seconds) that Amazon GameLift Streams should wait for a client to connect or reconnect to the stream session. Applies to both connection and reconnection scenarios. This time span starts when the stream session reaches `ACTIVE` state. If no client connects before the timeout, Amazon GameLift Streams terminates the stream session. Default value is 120.
        description: A human-readable label for the stream session. You can update this value later.
        identifier: |-
            The stream group to run this stream session with.

            This value is an [Amazon Resource Name (ARN)](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference-arns.html) or ID that uniquely identifies the stream group resource. Example ARN: `arn:aws:gameliftstreams:us-west-2:111122223333:streamgroup/sg-1AB2C3De4`. Example ID: `sg-1AB2C3De4`.
        locations: |-
            A list of locations, in order of priority, where you want Amazon GameLift Streams to start a stream from. For example, `us-east-1`. Amazon GameLift Streams selects the location with the next available capacity to start a single stream session in. If this value is empty, Amazon GameLift Streams attempts to start a stream session in the primary location.

            For a complete list of locations that Amazon GameLift Streams supports, refer to [Regions, quotas, and limitations](https://docs.aws.amazon.com/gameliftstreams/latest/developerguide/regions-quotas.html) in the *Amazon GameLift Streams Developer Guide*.
        protocol: The data transport protocol to use for the stream session.
        session-length-seconds: The maximum duration of a session. Amazon GameLift Streams will automatically terminate a session after this amount of time has elapsed, regardless of any existing client connections. Default value is 43200 (12 hours).
        signal-request: |-
            A WebRTC ICE offer string to use when initializing a WebRTC connection. Typically, the offer is a very long JSON string. Provide the string as a text value in quotes.

            Amazon GameLift Streams also supports setting the field to "NO\_CLIENT\_CONNECTION". This will create a session without needing any browser request or Web SDK integration. The session starts up as usual and waits for a reconnection from a browser, which is accomplished using [CreateStreamSessionConnection](https://docs.aws.amazon.com/gameliftstreams/latest/apireference/API_CreateStreamSessionConnection.html).
        user-id: An opaque, unique identifier for an end-user, defined by the developer.
