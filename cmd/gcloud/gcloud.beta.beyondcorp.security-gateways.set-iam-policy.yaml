name: set-iam-policy
description: '*(BETA)*  Set the IAM policy for a security gateway.'
flags:
    --location=: The location id of the securityGateway resource.
documentation:
    command: '*(BETA)*  Sets the IAM policy for the given security gateway.'
    flag:
        location: |-
            The location id of the securityGateway resource. We support only global location.
            +
            To set the `location` attribute:
            * provide the argument `security_gateway` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
