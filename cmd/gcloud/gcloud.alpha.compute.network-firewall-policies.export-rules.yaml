name: export-rules
description: '*(ALPHA)*  Export Compute Engine network firewall policy rules.'
flags:
    --destination=: Path to a YAML file where the configuration will be exported.
    --global: If set, the firewall policy is global.
    --no-global&: If set, the firewall policy is global.
    --region=: Region of the firewall policy to export-rules.
documentation:
    command: |
        *(ALPHA)*  Exports Firewall Policy rules configuration to a file.
    flag:
        destination: |-
            Path to a YAML file where the configuration will be exported.
                      Alternatively, you may omit this flag to write to standard output. For a schema describing the export/import format, see:
                      $CLOUDSDKROOT/lib/googlecloudsdk/schemas/compute/alpha/FirewallPolicy.yaml.
        global: If set, the firewall policy is global.
        no-global: If set, the firewall policy is global.
        region: Region of the firewall policy to export-rules. Overrides the default *compute/region* property value for this command invocation.
