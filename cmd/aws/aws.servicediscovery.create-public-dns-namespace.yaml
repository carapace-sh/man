name: create-public-dns-namespace
description: Creates a public namespace based on DNS, which is visible on the internet.
flags:
    --creator-request-id=: A unique string that identifies the request and that allows failed `CreatePublicDnsNamespace` requests to be retried without the risk of running the operation twice.
    --description=: A description for the namespace.
    --name=!: The name that you want to assign to this namespace.
    --properties=: Properties for the public DNS namespace.
    --tags=: The tags to add to the namespace.
documentation:
    command: |-
        Creates a public namespace based on DNS, which is visible on the internet. The namespace defines your service naming scheme. For example, if you name your namespace `example.com` and name your service `backend`, the resulting DNS name for the service is `backend.example.com`. You can discover instances that were registered with a public DNS namespace by using either a `DiscoverInstances` request or using DNS. For the current quota on the number of namespaces that you can create using the same Amazon Web Services account, see [Cloud Map quotas](https://docs.aws.amazon.com/cloud-map/latest/dg/cloud-map-limits.html) in the *Cloud Map Developer Guide*.

        The `CreatePublicDnsNamespace` API operation is not supported in the Amazon Web Services GovCloud (US) Regions.
    flag:
        creator-request-id: A unique string that identifies the request and that allows failed `CreatePublicDnsNamespace` requests to be retried without the risk of running the operation twice. `CreatorRequestId` can be any unique string (for example, a date/timestamp).
        description: A description for the namespace.
        name: |-
            The name that you want to assign to this namespace.

            Do not include sensitive information in the name. The name is publicly available using DNS queries.
        properties: Properties for the public DNS namespace.
        tags: The tags to add to the namespace. Each tag consists of a key and an optional value that you define. Tags keys can be up to 128 characters in length, and tag values can be up to 256 characters in length.
