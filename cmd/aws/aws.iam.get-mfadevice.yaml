name: get-mfadevice
description: Retrieves information about an MFA device for a specified user.
flags:
    --serial-number=!: Serial number that uniquely identifies the MFA device.
    --user-name=: The friendly name identifying the user.
documentation:
    command: Retrieves information about an MFA device for a specified user.
    flag:
        serial-number: Serial number that uniquely identifies the MFA device. For this API, we only accept FIDO security key [ARNs](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference-arns.html).
        user-name: The friendly name identifying the user.
