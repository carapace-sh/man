name: describe-export-tasks
description: Returns information about a snapshot or cluster export to Amazon S3.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --export-task-identifier=: The identifier of the snapshot or cluster export task to be described.
    --filters=: Filters specify one or more snapshot or cluster exports to describe.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --marker=: An optional pagination token provided by a previous `DescribeExportTasks` request.
    --max-items=: The  total number of items to return in the command's output.
    --max-records=: The maximum number of records to include in the response.
    --page-size=: The size of each page to get in the AWS service call.
    --source-arn=: The Amazon Resource Name (ARN) of the snapshot or cluster exported to Amazon S3.
    --source-type=: The type of source for the export.
    --starting-token=: A token to specify where to start paginating.
completion:
    flag:
        source-type:
            - SNAPSHOT
            - CLUSTER
documentation:
    command: Returns information about a snapshot or cluster export to Amazon S3. This API operation supports pagination.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        export-task-identifier: The identifier of the snapshot or cluster export task to be described.
        filters: "Filters specify one or more snapshot or cluster exports to describe. The filters are specified as name-value pairs that define what to include in the output. Filter names and values are case-sensitive.\n\nSupported filters include the following:\n\n- `export-task-identifier` - An identifier for the snapshot or cluster export task.\n- `s3-bucket` - The Amazon S3 bucket the data is exported to.\n- `source-arn` - The Amazon Resource Name (ARN) of the snapshot or cluster exported to Amazon S3.\n- `status` - The status of the export task. Must be lowercase. Valid statuses are the following:\n  \n  - `canceled`\n  - `canceling`\n  - `complete`\n  - `failed`\n  - `in_progress`\n  - `starting`"
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        marker: An optional pagination token provided by a previous `DescribeExportTasks` request. If you specify this parameter, the response includes only records beyond the marker, up to the value specified by the `MaxRecords` parameter.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified value, a pagination token called a marker is included in the response. You can use the marker in a later `DescribeExportTasks` request to retrieve the remaining results.

            Default: 100

            Constraints: Minimum 20, maximum 100.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        source-arn: The Amazon Resource Name (ARN) of the snapshot or cluster exported to Amazon S3.
        source-type: The type of source for the export.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
