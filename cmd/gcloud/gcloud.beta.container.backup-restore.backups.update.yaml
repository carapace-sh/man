name: update
description: '*(BETA)*  Update a backup.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --backup-plan=: Backup Plan name.
    --clear-labels: Remove all labels.
    --delete-lock-days=: Delete lock days specifies the number of days from the createTime of this
    --description=: Optional text description for the backup.
    --etag=: The etag is used for optimistic concurrency control as a way to help
    --location=: Google Cloud location.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-labels&: Remove all labels.
    --remove-labels=: List of label keys to remove.
    --retain-days=: Retain days specifies the desired number of days from the createTime of
    --update-labels=: List of label KEY=VALUE pairs to update.
documentation:
    command: |
        *(BETA)*  Update a Backup for GKE backup.

        ## EXAMPLES

        To update a backup ``my-backup'' in project ``my-project'' in location ``us-central1'' under backup plan ``my-backup-plan'' to add new description, run:

          $ gcloud beta container backup-restore backups update 'my-backup' --backup-plan=my-backup-plan --project=my-project --location=us-central1 --description="New description"
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        backup-plan: |-
            Backup Plan name.
            +
            To set the `backup-plan` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--backup-plan` on the command line;
            * set the property `gkebackup/backup_plan`.
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        delete-lock-days: |-
            Delete lock days specifies the number of days from the createTime of this
            Backup before which deletion will be blocked. Must be >= the value in
            the backup plan. If not specified, inherited from the backup plan.
            Manual creation of a backup with this field unspecified causes the service
            to use the value of backupPlan.RetentionPolicy.backupDeleteBlockDays.
            Creation of a backup with this field set to a value SMALLER than
            backupPlan.RetentionPolicy.backupDeleteBlockDays results in an invalid
            response from the service.
            This field MUST be an int value between 0-90(inclusive).
            This field may only be INCREASED in an update command, or an invalid
            response will be returned by the service.
        description: Optional text description for the backup.
        etag: |-
            The etag is used for optimistic concurrency control as a way to help
            prevent simultaneous updates or deletes of a resource from overwriting each other.
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkebackup/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        retain-days: |-
            Retain days specifies the desired number of days from the createTime of
            this backup after which it will be automatically deleted.
            If not specified or set to 0, it means the backup will NOT be
            automatically deleted.
            Manual creation of a backup with this field unspecified causes the
            service to use the value of backupPlan.retentionPolicy.backupRetainDays.
            Creation of a backup with this field set to a value SMALLER than
            deleteLockDays results in an invalid response from the service.
            This field may ONLY be increased in an Update command, or an invalid
            response will be returned by the service immediately.
            Default to 0.
        update-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
