name: create-security-profile
description: Creates a Device Defender security profile.
flags:
    --additional-metrics-to-retain-v2=:
        description: A list of metrics whose data is retained (stored).
        nargs: -1
    --additional-metrics-to-retain=:
        description: '*Please use [CreateSecurityProfileRequest$additionalMetricsToRetainV2]() instead.*'
        nargs: -1
    --alert-targets=: Specifies the destinations to which alerts are sent.
    --behaviors=:
        description: Specifies the behaviors that, when violated by a device (thing), cause an alert.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --metrics-export-config=: Specifies the MQTT topic and role ARN required for metric export.
    --security-profile-description=: A description of the security profile.
    --security-profile-name=!: The name you are giving to the security profile.
    --tags=:
        description: Metadata that can be used to manage the security profile.
        nargs: -1
documentation:
    command: |-
        Creates a Device Defender security profile.

        Requires permission to access the [CreateSecurityProfile](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        additional-metrics-to-retain: |-
            *Please use [CreateSecurityProfileRequest$additionalMetricsToRetainV2]() instead.*

            A list of metrics whose data is retained (stored). By default, data is retained for any metric used in the profile's `behaviors`, but it is also retained for any metric specified here. Can be used with custom metrics; cannot be used with dimensions.
        additional-metrics-to-retain-v2: A list of metrics whose data is retained (stored). By default, data is retained for any metric used in the profile's `behaviors`, but it is also retained for any metric specified here. Can be used with custom metrics; cannot be used with dimensions.
        alert-targets: Specifies the destinations to which alerts are sent. (Alerts are always sent to the console.) Alerts are generated when a device (thing) violates a behavior.
        behaviors: Specifies the behaviors that, when violated by a device (thing), cause an alert.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        metrics-export-config: Specifies the MQTT topic and role ARN required for metric export.
        security-profile-description: A description of the security profile.
        security-profile-name: The name you are giving to the security profile.
        tags: Metadata that can be used to manage the security profile.
