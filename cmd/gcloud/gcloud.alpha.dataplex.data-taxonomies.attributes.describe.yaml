name: describe
description: '*(ALPHA)*  Describe a Dataplex Data Attribute.'
flags:
    --data-taxonomy=: Identifier of the Dataplex DataTaxonomy resource.
    --location=: Location of the Dataplex resource.
documentation:
    command: |
        *(ALPHA)*  Describe a Dataplex Data Attribute.
    flag:
        data-taxonomy: |-
            Identifier of the Dataplex DataTaxonomy resource.
            +

            To set the `data_taxonomy` attribute:
            * provide the argument `data_attribute` on the command line with a fully specified name;
            * provide the argument `--data_taxonomy` on the command line.
        location: |-
            Location of the Dataplex resource.
            +

            To set the `location` attribute:
            * provide the argument `data_attribute` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
