name: hybrid-ad-updated
description: Retrieves information about update activities for a hybrid directory.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --directory-id=!: The identifier of the hybrid directory for which to retrieve update information.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --next-token=: The pagination token from a previous request to [DescribeHybridADUpdate]().
    --update-type=: The type of update activities to retrieve.
completion:
    flag:
        update-type:
            - SelfManagedInstances
            - HybridAdministratorAccount
documentation:
    command: Retrieves information about update activities for a hybrid directory. This operation provides details about configuration changes, administrator account updates, and self-managed instance settings (IDs and DNS IPs).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        directory-id: The identifier of the hybrid directory for which to retrieve update information.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        next-token: The pagination token from a previous request to [DescribeHybridADUpdate](). Pass null if this is the first request.
        update-type: The type of update activities to retrieve. Valid values include `SelfManagedInstances` and `HybridAdministratorAccount`.
