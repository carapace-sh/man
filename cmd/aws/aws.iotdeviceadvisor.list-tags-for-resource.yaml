name: list-tags-for-resource
description: Lists the tags attached to an IoT Device Advisor resource.
flags:
    --resource-arn=!: The resource ARN of the IoT Device Advisor resource.
documentation:
    command: |-
        Lists the tags attached to an IoT Device Advisor resource.

        Requires permission to access the [ListTagsForResource](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        resource-arn: The resource ARN of the IoT Device Advisor resource. This can be SuiteDefinition ARN or SuiteRun ARN.
