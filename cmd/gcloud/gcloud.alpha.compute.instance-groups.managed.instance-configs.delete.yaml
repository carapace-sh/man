name: delete
description: '*(ALPHA)*  Delete per-instance configs from a managed instance group.'
flags:
    --instance-update-minimal-action=: Perform at least this action on the instance while updating, if
    --instances=!: Names of instances to delete instance-configs from.
    --no-update-instance&: ""
    --region=: Region of the managed instance group to delete.
    --update-instance: Apply the configuration changes immediately to the instance.
    --zone=: Zone of the managed instance group to delete.
completion:
    flag:
        instance-update-minimal-action:
            - none
            - refresh
            - replace
            - restart
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute instance-groups managed instance-configs delete* deletes one or more per-instance configs from a Google
        Compute Engine managed instance group.

        Changes are applied immediately to the corresponding instances, by
        performing the necessary action (for example, REFRESH), unless
        overridden by providing the ``--no-update-instance'' flag.
    flag:
        instance-update-minimal-action: |-
            Perform at least this action on the instance while updating, if
            `--update-instance` is set to `true`. _INSTANCE_UPDATE_MINIMAL_ACTION_ must be one of:
            +
            *none*::: No action
            *refresh*::: Apply the new configuration without stopping VMs, if possible. For example, use ``refresh`` to apply changes that only affect metadata or additional disks.
            *restart*::: Apply the new configuration without replacing VMs, if possible. For example, stopping VMs and starting them again is sufficient to apply changes to machine type.
            *replace*::: Replace old VMs according to the --replacement-method flag.
            :::
            +
        instances: Names of instances to delete instance-configs from.
        no-update-instance: |-
            Apply the configuration changes immediately to the instance. If you
            disable this flag, the managed instance group will apply the
            configuration update when you next recreate or update the instance.

            Example: say you have an instance with a disk attached to it and you
            created a stateful configuration for the disk. If you decide to
            delete the stateful configuration for the disk and you provide this
            flag, the group immediately refreshes the instance and removes the
            stateful configuration for the disk. Similarly if you have attached
            a new disk or changed its definition, with this flag the group
            immediately refreshes the instance with the new configuration.
        region: |-
            Region of the managed instance group to delete. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            Overrides the default *compute/region* property value for this command invocation.
        update-instance: |-
            Apply the configuration changes immediately to the instance. If you
            disable this flag, the managed instance group will apply the
            configuration update when you next recreate or update the instance.
            +
            Example: say you have an instance with a disk attached to it and you
            created a stateful configuration for the disk. If you decide to
            delete the stateful configuration for the disk and you provide this
            flag, the group immediately refreshes the instance and removes the
            stateful configuration for the disk. Similarly if you have attached
            a new disk or changed its definition, with this flag the group
            immediately refreshes the instance with the new configuration.
            +
            Enabled by default, use *--no-update-instance* to disable.
        zone: |-
            Zone of the managed instance group to delete. If not specified, you might be prompted to select a zone (interactive mode
            only).
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            Overrides the default *compute/zone* property value for this command invocation.
