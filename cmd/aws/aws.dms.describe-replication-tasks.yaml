name: describe-replication-tasks
description: Returns information about replication tasks for your account in the current region.
flags:
    --filters=: Filters applied to replication tasks.
    --marker=: An optional pagination token provided by a previous request.
    --max-records=: The maximum number of records to include in the response.
    --without-settings=: An option to set to avoid returning information about settings.
documentation:
    command: Returns information about replication tasks for your account in the current region.
    flag:
        filters: |-
            Filters applied to replication tasks.

            Valid filter names: replication-task-arn | replication-task-id | migration-type | endpoint-arn | replication-instance-arn
        marker: An optional pagination token provided by a previous request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that the remaining results can be retrieved.

            Default: 100

            Constraints: Minimum 20, maximum 100.
        without-settings: An option to set to avoid returning information about settings. Use this to reduce overhead when setting information is too large. To use this option, choose `true`; otherwise, choose `false` (the default).
