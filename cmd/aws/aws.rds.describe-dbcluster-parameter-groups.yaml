name: describe-dbcluster-parameter-groups
description: Returns a list of `DBClusterParameterGroup` descriptions.
flags:
    --dbcluster-parameter-group-name=: The name of a specific DB cluster parameter group to return details for.
    --filters=: This parameter isn't currently supported.
    --marker=: An optional pagination token provided by a previous `DescribeDBClusterParameterGroups` request.
    --max-records=: The maximum number of records to include in the response.
documentation:
    command: |-
        Returns a list of `DBClusterParameterGroup` descriptions. If a `DBClusterParameterGroupName` parameter is specified, the list will contain only the description of the specified DB cluster parameter group.

        For more information on Amazon Aurora, see [What is Amazon Aurora?](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_AuroraOverview.html) in the *Amazon Aurora User Guide*.

        For more information on Multi-AZ DB clusters, see [Multi-AZ DB cluster deployments](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/multi-az-db-clusters-concepts.html) in the *Amazon RDS User Guide*.
    flag:
        dbcluster-parameter-group-name: |-
            The name of a specific DB cluster parameter group to return details for.

            Constraints:

            - If supplied, must match the name of an existing DBClusterParameterGroup.
        filters: This parameter isn't currently supported.
        marker: An optional pagination token provided by a previous `DescribeDBClusterParameterGroups` request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so you can retrieve the remaining results.

            Default: 100

            Constraints: Minimum 20, maximum 100.
