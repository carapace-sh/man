name: describe-snapshots
description: Returns information about cluster or replication group snapshots.
flags:
    --cache-cluster-id=: A user-supplied cluster identifier.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --marker=: An optional marker returned from a prior request.
    --max-items=: The  total number of items to return in the command's output.
    --max-records=: The maximum number of records to include in the response.
    --no-show-node-group-config: A Boolean value which if true, the node group (shard) configuration is included in the snapshot description.
    --page-size=: The size of each page to get in the AWS service call.
    --replication-group-id=: A user-supplied replication group identifier.
    --show-node-group-config: A Boolean value which if true, the node group (shard) configuration is included in the snapshot description.
    --snapshot-name=: A user-supplied name of the snapshot.
    --snapshot-source=: If set to `system`, the output shows snapshots that were automatically created by ElastiCache.
    --starting-token=: A token to specify where to start paginating.
documentation:
    command: |-
        Returns information about cluster or replication group snapshots. By default, `DescribeSnapshots` lists all of your snapshots; it can optionally describe a single snapshot, or just the snapshots associated with a particular cache cluster.

        This operation is valid for Valkey or Redis OSS only.
    flag:
        cache-cluster-id: A user-supplied cluster identifier. If this parameter is specified, only snapshots associated with that specific cluster are described.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        marker: An optional marker returned from a prior request. Use this marker for pagination of results from this operation. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a marker is included in the response so that the remaining results can be retrieved.

            Default: 50

            Constraints: minimum 20; maximum 50.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        replication-group-id: A user-supplied replication group identifier. If this parameter is specified, only snapshots associated with that specific replication group are described.
        show-node-group-config: A Boolean value which if true, the node group (shard) configuration is included in the snapshot description.
        snapshot-name: A user-supplied name of the snapshot. If this parameter is specified, only this snapshot are described.
        snapshot-source: If set to `system`, the output shows snapshots that were automatically created by ElastiCache. If set to `user` the output shows snapshots that were manually created. If omitted, the output shows both automatically and manually created snapshots.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
