name: get-instance
description: Gets information about a specified instance.
flags:
    --instance-id=!: The ID of the instance that you want to get information about.
    --service-id=!: The ID or Amazon Resource Name (ARN) of the service that the instance is associated with.
documentation:
    command: Gets information about a specified instance.
    flag:
        instance-id: The ID of the instance that you want to get information about.
        service-id: The ID or Amazon Resource Name (ARN) of the service that the instance is associated with. For services created in a shared namespace, specify the service ARN. For more information about shared namespaces, see [Cross-account Cloud Map namespace sharing](https://docs.aws.amazon.com/cloud-map/latest/dg/sharing-namespaces.html) in the *Cloud Map Developer Guide*.
