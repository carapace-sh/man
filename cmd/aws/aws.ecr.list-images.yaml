name: list-images
description: Lists all the image IDs for the specified repository.
flags:
    --filter=: The filter key and value with which to filter your `ListImages` results.
    --max-results=: The maximum number of image results returned by `ListImages` in paginated output.
    --next-token=: The `nextToken` value returned from a previous paginated `ListImages` request where `maxResults` was used and the results exceeded the value of that parameter.
    --registry-id=: The Amazon Web Services account ID associated with the registry that contains the repository in which to list images.
    --repository-name=!: The repository with image IDs to be listed.
documentation:
    command: |-
        Lists all the image IDs for the specified repository.

        You can filter images based on whether or not they are tagged by using the `tagStatus` filter and specifying either `TAGGED`, `UNTAGGED` or `ANY`. For example, you can filter your results to return only `UNTAGGED` images and then pipe that result to a [BatchDeleteImage]() operation to delete them. Or, you can filter your results to return only `TAGGED` images to list all of the tags in your repository.
    flag:
        filter: The filter key and value with which to filter your `ListImages` results.
        max-results: The maximum number of image results returned by `ListImages` in paginated output. When this parameter is used, `ListImages` only returns `maxResults` results in a single page along with a `nextToken` response element. The remaining results of the initial request can be seen by sending another `ListImages` request with the returned `nextToken` value. This value can be between 1 and 1000. If this parameter is not used, then `ListImages` returns up to 100 results and a `nextToken` value, if applicable.
        next-token: |-
            The `nextToken` value returned from a previous paginated `ListImages` request where `maxResults` was used and the results exceeded the value of that parameter. Pagination continues from the end of the previous results that returned the `nextToken` value. This value is `null` when there are no more results to return.

            This token should be treated as an opaque identifier that is only used to retrieve the next items in a list and not for other programmatic purposes.
        registry-id: The Amazon Web Services account ID associated with the registry that contains the repository in which to list images. If you do not specify a registry, the default registry is assumed.
        repository-name: The repository with image IDs to be listed.
