name: create-configuration-profile
description: Creates a configuration profile, which is information that enables AppConfig to access the configuration source.
flags:
    --application-id=!: The application ID.
    --description=: A description of the configuration profile.
    --kms-key-identifier=: The identifier for an Key Management Service key to encrypt new configuration data versions in the AppConfig hosted configuration store.
    --location-uri=!: A URI to locate the configuration.
    --name=!: A name for the configuration profile.
    --retrieval-role-arn=: The ARN of an IAM role with permission to access the configuration at the specified `LocationUri`.
    --tags=: Metadata to assign to the configuration profile.
    --type=: The type of configurations contained in the profile.
    --validators=: A list of methods for validating the configuration.
documentation:
    command: |-
        Creates a configuration profile, which is information that enables AppConfig to access the configuration source. Valid configuration sources include the following:

        - Configuration data in YAML, JSON, and other formats stored in the AppConfig hosted configuration store
        - Configuration data stored as objects in an Amazon Simple Storage Service (Amazon S3) bucket
        - Pipelines stored in CodePipeline
        - Secrets stored in Secrets Manager
        - Standard and secure string parameters stored in Amazon Web Services Systems Manager Parameter Store
        - Configuration data in SSM documents stored in the Systems Manager document store

        A configuration profile includes the following information:

        - The URI location of the configuration data.
        - The Identity and Access Management (IAM) role that provides access to the configuration data.
        - A validator for the configuration data. Available validators include either a JSON Schema or an Amazon Web Services Lambda function.

        For more information, see [Create a Configuration and a Configuration Profile](http://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-creating-configuration-and-profile.html) in the *AppConfig User Guide*.
    flag:
        application-id: The application ID.
        description: A description of the configuration profile.
        kms-key-identifier: The identifier for an Key Management Service key to encrypt new configuration data versions in the AppConfig hosted configuration store. This attribute is only used for `hosted` configuration types. The identifier can be an KMS key ID, alias, or the Amazon Resource Name (ARN) of the key ID or alias. To encrypt data managed in other configuration stores, see the documentation for how to specify an KMS key for that particular service.
        location-uri: |-
            A URI to locate the configuration. You can specify the following:

            - For the AppConfig hosted configuration store and for feature flags, specify `hosted`.
            - For an Amazon Web Services Systems Manager Parameter Store parameter, specify either the parameter name in the format `ssm-parameter://<parameter name>` or the ARN.
            - For an Amazon Web Services CodePipeline pipeline, specify the URI in the following format: `codepipeline`://&lt;pipeline name&gt;.
            - For an Secrets Manager secret, specify the URI in the following format: `secretsmanager`://&lt;secret name&gt;.
            - For an Amazon S3 object, specify the URI in the following format: `s3://<bucket>/<objectKey>`. Here is an example: `s3://amzn-s3-demo-bucket/my-app/us-east-1/my-config.json`
            - For an SSM document, specify either the document name in the format `ssm-document://<document name>` or the Amazon Resource Name (ARN).
        name: A name for the configuration profile.
        retrieval-role-arn: |-
            The ARN of an IAM role with permission to access the configuration at the specified `LocationUri`.

            A retrieval role ARN is not required for configurations stored in CodePipeline or the AppConfig hosted configuration store. It is required for all other sources that store your configuration.
        tags: Metadata to assign to the configuration profile. Tags help organize and categorize your AppConfig resources. Each tag consists of a key and an optional value, both of which you define.
        type: |-
            The type of configurations contained in the profile. AppConfig supports `feature flags` and `freeform` configurations. We recommend you create feature flag configurations to enable or disable new features and freeform configurations to distribute configurations to an application. When calling this API, enter one of the following values for `Type`:

            `AWS.AppConfig.FeatureFlags`

            `AWS.Freeform`
        validators: A list of methods for validating the configuration.
