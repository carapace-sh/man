name: delete-package-versions
description: Deletes one or more versions of a package.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-owner=: The 12-digit account number of the Amazon Web Services account that owns the domain.
    --domain=!: The name of the domain that contains the package to delete.
    --expected-status=: The expected status of the package version to delete.
    --format=!: The format of the package versions to delete.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --namespace=: The namespace of the package versions to be deleted.
    --package=!: The name of the package with the versions to delete.
    --repository=!: The name of the repository that contains the package versions to delete.
    --versions=!:
        description: An array of strings that specify the versions of the package to delete.
        nargs: -1
completion:
    flag:
        expected-status:
            - Published
            - Unfinished
            - Unlisted
            - Archived
            - Disposed
            - Deleted
        format:
            - npm
            - pypi
            - maven
            - nuget
            - generic
            - ruby
            - swift
            - cargo
documentation:
    command: Deletes one or more versions of a package. A deleted package version cannot be restored in your repository. If you want to remove a package version from your repository and be able to restore it later, set its status to `Archived`. Archived packages cannot be downloaded from a repository and don't show up with list package APIs (for example, [ListPackageVersions](https://docs.aws.amazon.com/codeartifact/latest/APIReference/API_ListPackageVersions.html)), but you can restore them using [UpdatePackageVersionsStatus](https://docs.aws.amazon.com/codeartifact/latest/APIReference/API_UpdatePackageVersionsStatus.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain: The name of the domain that contains the package to delete.
        domain-owner: The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces.
        expected-status: The expected status of the package version to delete.
        format: The format of the package versions to delete.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        namespace: |-
            The namespace of the package versions to be deleted. The package component that specifies its namespace depends on its type. For example:

            The namespace is required when deleting package versions of the following formats:

            - Maven
            - Swift
            - generic

            <!--THE END-->

            - The namespace of a Maven package version is its `groupId`.
            - The namespace of an npm or Swift package version is its `scope`.
            - The namespace of a generic package is its `namespace`.
            - Python, NuGet, Ruby, and Cargo package versions do not contain a corresponding component, package versions of those formats do not have a namespace.
        package: The name of the package with the versions to delete.
        repository: The name of the repository that contains the package versions to delete.
        versions: An array of strings that specify the versions of the package to delete.
