name: list-event-rules
description: Returns a list of `EventRules` according to specified filters, in reverse chronological order (newest first).
flags:
    --max-results=: The maximum number of results to be returned in this call.
    --next-token=: The start token for paginated calls.
    --notification-configuration-arn=!: The Amazon Resource Name (ARN) of the `NotificationConfiguration`.
documentation:
    command: Returns a list of `EventRules` according to specified filters, in reverse chronological order (newest first).
    flag:
        max-results: The maximum number of results to be returned in this call. The default value is 20.
        next-token: The start token for paginated calls. Retrieved from the response of a previous `ListEventRules` call. Next token uses Base64 encoding.
        notification-configuration-arn: The Amazon Resource Name (ARN) of the `NotificationConfiguration`.
