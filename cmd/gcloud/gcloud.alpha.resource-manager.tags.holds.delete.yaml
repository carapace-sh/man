name: delete
description: '*(ALPHA)*  Delete a TagHold.'
flags:
    --location=: Region where the TagHold is stored.
documentation:
    command: |-
        *(ALPHA)*  Delete a TagHold given its full name, specified as
        tagValues/{tag_value_id}/tagHolds/{tag_hold_id}.
    flag:
        location: Region where the TagHold is stored. If not provided, the API will attempt to find and delete the specified TagHold from the "global" region.
