name: list-discovered-resources
description: Lists discovered resources associated with the given `MigrationTask`.
flags:
    --max-results=: The maximum number of results returned per page.
    --migration-task-name=!: The name of the MigrationTask.
    --next-token=: If a `NextToken` was returned by a previous call, there are more results available.
    --progress-update-stream=!: The name of the ProgressUpdateStream.
documentation:
    command: Lists discovered resources associated with the given `MigrationTask`.
    flag:
        max-results: The maximum number of results returned per page.
        migration-task-name: The name of the MigrationTask. *Do not store personal data in this field.*
        next-token: If a `NextToken` was returned by a previous call, there are more results available. To retrieve the next page of results, make the call again using the returned token in `NextToken`.
        progress-update-stream: The name of the ProgressUpdateStream.
