name: update-id-mapping-workflow
description: Updates an existing `IdMappingWorkflow`.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description of the workflow.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --id-mapping-techniques=!: An object which defines the ID mapping technique and any additional configurations.
    --incremental-run-config=: The incremental run configuration for the update ID mapping workflow.
    --input-source-config=!:
        description: A list of `InputSource` objects, which have the fields `InputSourceARN` and `SchemaName`.
        nargs: -1
    --output-source-config=:
        description: A list of `OutputSource` objects, each of which contains fields `outputS3Path` and `KMSArn`.
        nargs: -1
    --role-arn=: The Amazon Resource Name (ARN) of the IAM role.
    --workflow-name=!: The name of the workflow.
documentation:
    command: |-
        Updates an existing `IdMappingWorkflow`. This method is identical to CreateIdMappingWorkflow, except it uses an HTTP `PUT` request instead of a `POST` request, and the `IdMappingWorkflow` must already exist for the method to succeed.

        Incremental processing is not supported for ID mapping workflows.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
