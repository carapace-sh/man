documentation:
    command: '*(BETA)*  Update a securityGateway'
    flag:
        add-proxy-protocol-config-allowed-client-headers: Add new value to proxy_protocol_config_allowed_client_headers list.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        clear-hubs: Clear hubs value and set to empty map.
        clear-proxy-protocol-config: Set googleCloudBeyondcorpSecuritygatewaysV1SecurityGateway.proxyProtocolConfig back to default value.
        clear-proxy-protocol-config-allowed-client-headers: Clear proxy_protocol_config_allowed_client_headers value and set to empty list.
        clear-proxy-protocol-config-metadata-headers: Clear proxy_protocol_config_metadata_headers value and set to empty map.
        clear-service-discovery: Set googleCloudBeyondcorpSecuritygatewaysV1SecurityGateway.serviceDiscovery back to default value.
        contextual-headers-output-type: |-
            Default output type for all enabled headers. _CONTEXTUAL_HEADERS_OUTPUT_TYPE_ must be one of:
            +
            *json*::: JSON output type.
            *none*::: Explicitly disable header output.
            *protobuf*::: Protobuf output type.
            :::
            +
        device-info-output-type: |-
            The output type of the delegated device info. _DEVICE_INFO_OUTPUT_TYPE_ must be one of:
            +
            *json*::: JSON output type.
            *none*::: Explicitly disable header output.
            *protobuf*::: Protobuf output type.
            :::
            +
        display-name: |-
            An arbitrary user-provided name for the SecurityGateway.
            Cannot exceed 64 characters.
        group-info-output-type: |-
            The output type of the delegated group info. _GROUP_INFO_OUTPUT_TYPE_ must be one of:
            +
            *json*::: JSON output type.
            *none*::: Explicitly disable header output.
            *protobuf*::: Protobuf output type.
            :::
            +
        hubs: |-
            Set hubs to new value. Map of Hubs that represents regional data path deployment with Google Cloud Platform region
            as a key.
            +
            *KEY*:::
            Sets `KEY` value.
            +
            *VALUE*:::
            Sets `VALUE` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --hubs=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --hubs='{"string": {}}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --hubs=path_to_file.(yaml|json)
            +
            ```
        location: |-
            The location id of the securityGateway resource. We support only global location.
            +
            To set the `location` attribute:
            * provide the argument `security_gateway` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-hubs: Clear hubs value and set to empty map.
        no-clear-proxy-protocol-config: Set googleCloudBeyondcorpSecuritygatewaysV1SecurityGateway.proxyProtocolConfig back to default value.
        no-clear-proxy-protocol-config-allowed-client-headers: Clear proxy_protocol_config_allowed_client_headers value and set to empty list.
        no-clear-proxy-protocol-config-metadata-headers: Clear proxy_protocol_config_metadata_headers value and set to empty map.
        no-clear-service-discovery: Set googleCloudBeyondcorpSecuritygatewaysV1SecurityGateway.serviceDiscovery back to default value.
        no-proxy-protocol-config-client-ip: Client IP configuration. The client IP address is included if true.
        proxy-protocol-config-allowed-client-headers: Set proxy_protocol_config_allowed_client_headers to new value.
        proxy-protocol-config-client-ip: Client IP configuration. The client IP address is included if true. Use *--proxy-protocol-config-client-ip* to enable and *--no-proxy-protocol-config-client-ip* to disable.
        proxy-protocol-config-gateway-identity: |-
            Gateway identity configuration. _PROXY_PROTOCOL_CONFIG_GATEWAY_IDENTITY_ must be (only one value is supported):
            +
            *resource-name*::: Resource name for gateway identity, in the format:
            projects/{project_id}/locations/{location_id}/securityGateways/{security_gateway_id}
            :::
            +
        proxy-protocol-config-metadata-headers: |-
            Set proxy_protocol_config_metadata_headers to new value. Custom resource specific headers along with the values.
            The names should conform to RFC 9110:
            > Field names SHOULD constrain themselves to alphanumeric characters, "-",
            and ".", and SHOULD begin with a letter.
            Field values SHOULD contain only ASCII printable characters and tab.
            +
            *KEY*:::
            Sets `KEY` value.
            +
            *VALUE*:::
            Sets `VALUE` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --proxy-protocol-config-metadata-headers=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --proxy-protocol-config-metadata-headers='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --proxy-protocol-config-metadata-headers=path_to_file.(yaml|json)
            +
            ```
        remove-hubs: |-
            Remove existing value from map hubs. Sets `remove_hubs` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-hubs=string,string
            +
            ```
            +
            *JSON Example:*
