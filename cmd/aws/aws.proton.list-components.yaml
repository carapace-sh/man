name: list-components
description: List components with summary data.
flags:
    --environment-name=: The name of an environment for result list filtering.
    --max-results=: The maximum number of components to list.
    --next-token=: A token that indicates the location of the next component in the array of components, after the list of components that was previously requested.
    --service-instance-name=: The name of a service instance for result list filtering.
    --service-name=: The name of a service for result list filtering.
documentation:
    command: |-
        List components with summary data. You can filter the result list by environment, service, or a single service instance.

        For more information about components, see [Proton components](https://docs.aws.amazon.com/proton/latest/userguide/ag-components.html) in the *Proton User Guide*.
    flag:
        environment-name: The name of an environment for result list filtering. Proton returns components associated with the environment or attached to service instances running in it.
        max-results: The maximum number of components to list.
        next-token: A token that indicates the location of the next component in the array of components, after the list of components that was previously requested.
        service-instance-name: The name of a service instance for result list filtering. Proton returns the component attached to the service instance, if any.
        service-name: The name of a service for result list filtering. Proton returns components attached to service instances of the service.
