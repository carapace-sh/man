name: register-mail-domain
description: Registers a new domain in WorkMail and SES, and configures it for use by WorkMail.
flags:
    --client-token=: Idempotency token used when retrying requests.
    --domain-name=!: The name of the mail domain to create in WorkMail and SES.
    --organization-id=!: The WorkMail organization under which you're creating the domain.
documentation:
    command: Registers a new domain in WorkMail and SES, and configures it for use by WorkMail. Emails received by SES for this domain are routed to the specified WorkMail organization, and WorkMail has permanent permission to use the specified domain for sending your users' emails.
    flag:
        client-token: Idempotency token used when retrying requests.
        domain-name: The name of the mail domain to create in WorkMail and SES.
        organization-id: The WorkMail organization under which you're creating the domain.
