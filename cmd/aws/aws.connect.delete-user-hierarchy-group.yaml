name: delete-user-hierarchy-group
description: Deletes an existing user hierarchy group.
flags:
    --hierarchy-group-id=!: The identifier of the hierarchy group.
    --instance-id=!: The identifier of the Amazon Connect instance.
documentation:
    command: Deletes an existing user hierarchy group. It must not be associated with any agents or have any active child groups.
    flag:
        hierarchy-group-id: The identifier of the hierarchy group.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
