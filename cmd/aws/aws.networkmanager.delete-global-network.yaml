name: delete-global-network
description: Deletes an existing global network.
flags:
    --global-network-id=!: The ID of the global network.
documentation:
    command: Deletes an existing global network. You must first delete all global network objects (devices, links, and sites), deregister all transit gateways, and delete any core networks.
    flag:
        global-network-id: The ID of the global network.
