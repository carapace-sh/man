name: get-automated-reasoning-policy
description: Retrieves details about an Automated Reasoning policy or policy version.
flags:
    --policy-arn=!: The Amazon Resource Name (ARN) of the Automated Reasoning policy to retrieve.
documentation:
    command: Retrieves details about an Automated Reasoning policy or policy version. Returns information including the policy definition, metadata, and timestamps.
    flag:
        policy-arn: The Amazon Resource Name (ARN) of the Automated Reasoning policy to retrieve. Can be either the unversioned ARN for the draft policy or an ARN for a specific policy version.
