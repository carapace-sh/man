name: list-backup-jobs
description: Returns a list of existing backup jobs for an authenticated account for the last 30 days.
flags:
    --by-account-id=: The account ID to list the jobs from.
    --by-backup-vault-name=: Returns only backup jobs that will be stored in the specified backup vault.
    --by-complete-after=: Returns only backup jobs completed after a date expressed in Unix format and Coordinated Universal Time (UTC).
    --by-complete-before=: Returns only backup jobs completed before a date expressed in Unix format and Coordinated Universal Time (UTC).
    --by-created-after=: Returns only backup jobs that were created after the specified date.
    --by-created-before=: Returns only backup jobs that were created before the specified date.
    --by-message-category=: This is an optional parameter that can be used to filter out jobs with a MessageCategory which matches the value you input.
    --by-parent-job-id=: This is a filter to list child (nested) jobs based on parent job ID.
    --by-resource-arn=: Returns only backup jobs that match the specified resource Amazon Resource Name (ARN).
    --by-resource-type=: 'Returns only backup jobs for the specified resources:'
    --by-state=: Returns only backup jobs that are in the specified state.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of items to be returned.
    --next-token=: The next item following a partial list of returned items.
    --page-size=: The size of each page to get in the AWS service call.
    --starting-token=: A token to specify where to start paginating.
completion:
    flag:
        by-state:
            - CREATED
            - PENDING
            - RUNNING
            - ABORTING
            - ABORTED
            - COMPLETED
            - FAILED
            - EXPIRED
            - PARTIAL
documentation:
    command: Returns a list of existing backup jobs for an authenticated account for the last 30 days. For a longer period of time, consider using these [monitoring tools](https://docs.aws.amazon.com/aws-backup/latest/devguide/monitoring.html).
    flag:
        by-account-id: |-
            The account ID to list the jobs from. Returns only backup jobs associated with the specified account ID.

            If used from an Organizations management account, passing `*` returns all jobs across the organization.
        by-backup-vault-name: Returns only backup jobs that will be stored in the specified backup vault. Backup vaults are identified by names that are unique to the account used to create them and the Amazon Web Services Region where they are created.
        by-complete-after: Returns only backup jobs completed after a date expressed in Unix format and Coordinated Universal Time (UTC).
        by-complete-before: Returns only backup jobs completed before a date expressed in Unix format and Coordinated Universal Time (UTC).
        by-created-after: Returns only backup jobs that were created after the specified date.
        by-created-before: Returns only backup jobs that were created before the specified date.
        by-message-category: |-
            This is an optional parameter that can be used to filter out jobs with a MessageCategory which matches the value you input.

            Example strings may include `AccessDenied`, `SUCCESS`, `AGGREGATE_ALL`, and `InvalidParameters`.

            View [Monitoring](https://docs.aws.amazon.com/aws-backup/latest/devguide/monitoring.html)

            The wildcard () returns count of all message categories.

            `AGGREGATE_ALL` aggregates job counts for all message categories and returns the sum.
        by-parent-job-id: This is a filter to list child (nested) jobs based on parent job ID.
        by-resource-arn: Returns only backup jobs that match the specified resource Amazon Resource Name (ARN).
        by-resource-type: |-
            Returns only backup jobs for the specified resources:

            - `Aurora` for Amazon Aurora
            - `CloudFormation` for CloudFormation
            - `DocumentDB` for Amazon DocumentDB (with MongoDB compatibility)
            - `DynamoDB` for Amazon DynamoDB
            - `EBS` for Amazon Elastic Block Store
            - `EC2` for Amazon Elastic Compute Cloud
            - `EFS` for Amazon Elastic File System
            - `FSx` for Amazon FSx
            - `Neptune` for Amazon Neptune
            - `RDS` for Amazon Relational Database Service
            - `Redshift` for Amazon Redshift
            - `S3` for Amazon Simple Storage Service (Amazon S3)
            - `SAP HANA on Amazon EC2` for SAP HANA databases on Amazon Elastic Compute Cloud instances
            - `Storage Gateway` for Storage Gateway
            - `Timestream` for Amazon Timestream
            - `VirtualMachine` for VMware virtual machines
        by-state: |-
            Returns only backup jobs that are in the specified state.

            `Completed with issues` is a status found only in the Backup console. For API, this status refers to jobs with a state of `COMPLETED` and a `MessageCategory` with a value other than `SUCCESS`; that is, the status is completed but comes with a status message.

            To obtain the job count for `Completed with issues`, run two GET requests, and subtract the second, smaller number:

            GET /backup-jobs/?state=COMPLETED

            GET /backup-jobs/?messageCategory=SUCCESS&amp;state=COMPLETED
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of items to be returned.
        next-token: The next item following a partial list of returned items. For example, if a request is made to return `MaxResults` number of items, `NextToken` allows you to return more items in your list starting at the location pointed to by the next token.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
