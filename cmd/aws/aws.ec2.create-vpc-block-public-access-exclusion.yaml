name: create-vpc-block-public-access-exclusion
description: Create a VPC Block Public Access (BPA) exclusion.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --internet-gateway-exclusion-mode=!: The exclusion mode for internet gateway traffic.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --subnet-id=: A subnet ID.
    --tag-specifications=: '`tag` - The key/value combination of a tag assigned to the resource.'
    --vpc-id=: A VPC ID.
completion:
    flag:
        internet-gateway-exclusion-mode:
            - allow-bidirectional
            - allow-egress
documentation:
    command: Create a VPC Block Public Access (BPA) exclusion. A VPC BPA exclusion is a mode that can be applied to a single VPC or subnet that exempts it from the account’s BPA mode and will allow bidirectional or egress-only access. You can create BPA exclusions for VPCs and subnets even when BPA is not enabled on the account to ensure that there is no traffic disruption to the exclusions when VPC BPA is turned on. To learn more about VPC BPA, see [Block public access to VPCs and subnets](https://docs.aws.amazon.com/vpc/latest/userguide/security-vpc-bpa.html) in the *Amazon VPC User Guide*.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        internet-gateway-exclusion-mode: |-
            The exclusion mode for internet gateway traffic.

            - `allow-bidirectional`: Allow all internet traffic to and from the excluded VPCs and subnets.
            - `allow-egress`: Allow outbound internet traffic from the excluded VPCs and subnets. Block inbound internet traffic to the excluded VPCs and subnets. Only applies when VPC Block Public Access is set to Bidirectional.
        subnet-id: A subnet ID.
        tag-specifications: '`tag` - The key/value combination of a tag assigned to the resource. Use the tag key in the filter name and the tag value as the filter value. For example, to find all resources that have a tag with the key `Owner` and the value `TeamA`, specify `tag:Owner` for the filter name and `TeamA` for the filter value.'
        vpc-id: A VPC ID.
