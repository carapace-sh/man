name: accept-vpc-peering-connection
description: Accept a VPC peering connection request.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --vpc-peering-connection-id=!: The ID of the VPC peering connection.
documentation:
    command: |-
        Accept a VPC peering connection request. To accept a request, the VPC peering connection must be in the `pending-acceptance` state, and you must be the owner of the peer VPC. Use [DescribeVpcPeeringConnections]() to view your outstanding VPC peering connection requests.

        For an inter-Region VPC peering connection request, you must accept the VPC peering connection in the Region of the accepter VPC.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        vpc-peering-connection-id: The ID of the VPC peering connection. You must specify this parameter in the request.
