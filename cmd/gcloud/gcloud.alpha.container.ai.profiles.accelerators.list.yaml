    --limit=: Maximum number of resources to list.
    --max-ntpot-milliseconds=: The maximum normalized time per output token (NTPOT) in milliseconds.
    --model-server-version=: The model server version.
    --model-server=: The model server.
    --model=!: The model.
    --no-uri&: Print a list of resource URIs instead of the default output, and change the
    --page-size=: Some services group resource list output into pages.
    --pricing-model=&: The pricing model to use to calculate token cost.
    --sort-by=: Comma-separated list of resource field key names to sort by.
    --target-cost-per-million-input-tokens=&: The target cost per million input tokens to filter profiles by, unit is 1 USD up to 5 decimal places.
    --target-cost-per-million-output-tokens=&: The target cost per million output tokens to filter profiles by, unit is 1 USD up to 5 decimal places.
