name: start-reference-import-job
description: Imports a reference genome from Amazon S3 into a specified reference store.
flags:
    --client-token=: To ensure that jobs don't run multiple times, specify a unique token for each job.
    --reference-store-id=!: The job's reference store ID.
    --role-arn=!: A service role for the job.
    --sources=!: The job's source files.
documentation:
    command: Imports a reference genome from Amazon S3 into a specified reference store. You can have multiple reference genomes in a reference store. You can only import reference genomes one at a time into each reference store. Monitor the status of your reference import job by using the `GetReferenceImportJob` API operation.
    flag:
        client-token: To ensure that jobs don't run multiple times, specify a unique token for each job.
        reference-store-id: The job's reference store ID.
        role-arn: A service role for the job.
        sources: The job's source files.
