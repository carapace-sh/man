name: untag-resource
description: Given tag IDs that you previously assigned to a user pool, removes them.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --resource-arn=!: The Amazon Resource Name (ARN) of the user pool that the tags are assigned to.
    --tag-keys=!:
        description: An array of tag keys that you want to remove from the user pool.
        nargs: -1
documentation:
    command: Given tag IDs that you previously assigned to a user pool, removes them.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
