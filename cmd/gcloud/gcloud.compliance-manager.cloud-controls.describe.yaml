name: describe
description: Get a cloud control.
flags:
    --location=: The location id of the cloudControl resource.
    --major-revision-id=: The major version of the cloud control to retrieve.
    --organization=: The organization id of the cloudControl resource.
documentation:
    command: |
        Get the details for a specific cloud control.
    flag:
        location: |-
            The location id of the cloudControl resource.
            +
            To set the `location` attribute:
            * provide the argument `cloud_control` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        major-revision-id: |-
            The major version of the cloud control to retrieve. If not specified,
            the most recently updated `revision_id` is retrieved.
        organization: |-
            The organization id of the cloudControl resource.
            +
            To set the `organization` attribute:
            * provide the argument `cloud_control` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
