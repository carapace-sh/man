name: delete-resource-policy
description: Deletes a resource policy from this account.
flags:
    --expected-revision-id=: The expected revision ID of the resource policy.
    --policy-name=: The name of the policy to be revoked.
    --resource-arn=: The ARN of the CloudWatch Logs resource for which the resource policy needs to be deleted
documentation:
    command: Deletes a resource policy from this account. This revokes the access of the identities in that policy to put log events to this account.
    flag:
        expected-revision-id: The expected revision ID of the resource policy. Required when deleting a resource-scoped policy to prevent concurrent modifications.
        policy-name: The name of the policy to be revoked. This parameter is required.
        resource-arn: The ARN of the CloudWatch Logs resource for which the resource policy needs to be deleted
