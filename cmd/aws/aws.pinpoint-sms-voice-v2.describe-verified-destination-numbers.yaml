name: describe-verified-destination-numbers
description: Retrieves the specified verified destination numbers.
flags:
    --destination-phone-numbers=: An array of verified destination phone number, in E.164 format.
    --filters=: An array of VerifiedDestinationNumberFilter objects to filter the results.
    --max-results=: The maximum number of results to return per each request.
    --next-token=: The token to be used for the next set of paginated results.
    --verified-destination-number-ids=: An array of VerifiedDestinationNumberid to retrieve.
documentation:
    command: Retrieves the specified verified destination numbers.
    flag:
        destination-phone-numbers: An array of verified destination phone number, in E.164 format.
        filters: An array of VerifiedDestinationNumberFilter objects to filter the results.
        max-results: The maximum number of results to return per each request.
        next-token: The token to be used for the next set of paginated results. You don't need to supply a value for this field in the initial request.
        verified-destination-number-ids: An array of VerifiedDestinationNumberid to retrieve.
