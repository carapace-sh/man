name: tag-resource
description: Tags a resource (either an [entity](https://docs.aws.amazon.com/marketplace-catalog/latest/api-reference/welcome.html#catalog-api-entities) or [change set](https://docs.aws.amazon.com/marketplace-catalog/latest/api-reference/welcome.html#working-with-change-sets)).
flags:
    --resource-arn=!: Required.
    --tags=!: Required.
documentation:
    command: Tags a resource (either an [entity](https://docs.aws.amazon.com/marketplace-catalog/latest/api-reference/welcome.html#catalog-api-entities) or [change set](https://docs.aws.amazon.com/marketplace-catalog/latest/api-reference/welcome.html#working-with-change-sets)).
    flag:
        resource-arn: Required. The Amazon Resource Name (ARN) associated with the resource you want to tag.
        tags: 'Required. A list of objects specifying each key name and value. Number of objects allowed: 1-50.'
