name: create-instance-access-control-attribute-configuration
description: Enables the attributes-based access control (ABAC) feature for the specified IAM Identity Center instance.
flags:
    --instance-access-control-attribute-configuration=!: Specifies the IAM Identity Center identity store attributes to add to your ABAC configuration.
    --instance-arn=!: The ARN of the IAM Identity Center instance under which the operation will be executed.
documentation:
    command: |-
        Enables the attributes-based access control (ABAC) feature for the specified IAM Identity Center instance. You can also specify new attributes to add to your ABAC configuration during the enabling process. For more information about ABAC, see [Attribute-Based Access Control](/singlesignon/latest/userguide/abac.html) in the *IAM Identity Center User Guide*.

        After a successful response, call `DescribeInstanceAccessControlAttributeConfiguration` to validate that `InstanceAccessControlAttributeConfiguration` was created.
    flag:
        instance-access-control-attribute-configuration: Specifies the IAM Identity Center identity store attributes to add to your ABAC configuration. When using an external identity provider as an identity source, you can pass attributes through the SAML assertion. Doing so provides an alternative to configuring attributes from the IAM Identity Center identity store. If a SAML assertion passes any of these attributes, IAM Identity Center will replace the attribute value with the value from the IAM Identity Center identity store.
        instance-arn: The ARN of the IAM Identity Center instance under which the operation will be executed.
