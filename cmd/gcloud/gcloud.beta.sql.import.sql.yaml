name: sql
description: '*(BETA)*  Imports data into a Cloud SQL instance from a SQL dump file.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --clean: Option to clean (DROP) database objects before recreating them.
    --database=: Database to which the import is made.
    --if-exists: Include an SQL statement (IF EXISTS) with each DROP statement produced by --clean; corresponds to the if-exists flag for pg_restore.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clean&: Option to clean (DROP) database objects before recreating them.
    --no-if-exists&: Include an SQL statement (IF EXISTS) with each DROP statement produced by --clean; corresponds to the if-exists flag for pg_restore.
    --no-parallel&: Perform a parallel import.
    --parallel: Perform a parallel import.
    --threads=: Specifies the number of threads to use for the parallel import.
    --user=: PostgreSQL user for this import operation.
documentation:
    command: |
        *(BETA)*  gcloud beta sql import sql imports data into a Cloud SQL instance from a SQL dump file
        in Google Cloud Storage.

        NOTE: Certain roles and permissions are required to import data into
        Google Cloud SQL. For more information on importing data into Google
        Cloud SQL see [Import a SQL dump file](https://cloud.google.com/sql/docs/mysql/import-export/import-export-sql#gcloud_1).

        For detailed help on importing data into Cloud SQL, refer to this
        guide: https://cloud.google.com/sql/docs/mysql/import-export/importing
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        clean: Option to clean (DROP) database objects before recreating them. corresponds to the clean flag for pg_restore. Only applies if --parallel is set. PostgreSQL only.
        database: Database to which the import is made. The database needs to be created before importing. If not set, it is assumed that the database is specified in the file to be imported. If your SQL dump file includes a database statement, it will override the database set in this flag.
        if-exists: Include an SQL statement (IF EXISTS) with each DROP statement produced by --clean; corresponds to the if-exists flag for pg_restore. Only applies if --parallel is set. PostgreSQL only.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clean: Option to clean (DROP) database objects before recreating them. corresponds to the clean flag for pg_restore. Only applies if --parallel is set. PostgreSQL only.
        no-if-exists: Include an SQL statement (IF EXISTS) with each DROP statement produced by --clean; corresponds to the if-exists flag for pg_restore. Only applies if --parallel is set. PostgreSQL only.
        no-parallel: Perform a parallel import. This flag is only applicable to MySQL and Postgres.
        parallel: Perform a parallel import. This flag is only applicable to MySQL and Postgres.
        threads: Specifies the number of threads to use for the parallel import. If `--parallel` is specified and this flag is not provided, Cloud SQL uses a default thread count to optimize performance.
        user: PostgreSQL user for this import operation.
