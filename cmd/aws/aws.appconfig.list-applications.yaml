name: list-applications
description: Lists all applications in your Amazon Web Services account.
flags:
    --max-results=: The maximum number of items to return for this call.
    --next-token=: A token to start the list.
documentation:
    command: Lists all applications in your Amazon Web Services account.
    flag:
        max-results: The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: A token to start the list. Next token is a pagination token generated by AppConfig to describe what page the previous List call ended on. For the first List request, the nextToken should not be set. On subsequent calls, the nextToken parameter should be set to the previous responses nextToken value. Use this token to get the next set of results.
