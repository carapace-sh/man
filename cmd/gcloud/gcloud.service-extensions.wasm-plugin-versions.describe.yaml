name: describe
description: Show details about a `WasmPluginVersion` resource.
flags:
    --location=: The location ID.
    --wasm-plugin=: The ID of the `WasmPlugin`.
documentation:
    command: Show details about a `WasmPluginVersion` resource.
    flag:
        location: |-
            The location ID.
            +

            To set the `location` attribute:
            * provide the argument `wasm_plugin_version` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * use global location.
        wasm-plugin: |-
            The ID of the `WasmPlugin`.
            +
            To set the `wasm-plugin` attribute:
            * provide the argument `wasm_plugin_version` on the command line with a fully specified name;
            * provide the argument `--wasm-plugin` on the command line.
