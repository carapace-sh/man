name: put-compliance-items
description: Registers a compliance type and other compliance details on a designated resource.
flags:
    --compliance-type=!: Specify the compliance type.
    --execution-summary=!: 'A summary of the call execution that includes an execution ID, the type of execution (for example, `Command`), and the date/time of the execution using a datetime object that is saved in the following format: `yyyy-MM-dd''T''HH:mm:ss''Z''`'
    --item-content-hash=: MD5 or SHA-256 content hash.
    --items=!: Information about the compliance as defined by the resource type.
    --resource-id=!: Specify an ID for this resource.
    --resource-type=!: Specify the type of resource.
    --upload-type=: The mode for uploading compliance items.
completion:
    flag:
        upload-type:
            - COMPLETE
            - PARTIAL
documentation:
    command: "Registers a compliance type and other compliance details on a designated resource. This operation lets you register custom compliance details with a resource. This call overwrites existing compliance information on the resource, so you must provide a full list of compliance items each time that you send the request.\n\nComplianceType can be one of the following:\n\n- ExecutionId: The execution ID when the patch, association, or custom compliance item was applied.\n- ExecutionType: Specify patch, association, or Custom:`string`.\n- ExecutionTime. The time the patch, association, or custom compliance item was applied to the managed node.\n  \n  For State Manager associations, this represents the time when compliance status was captured by the Systems Manager service during its internal compliance aggregation workflow, not necessarily when the association was executed on the managed node. State Manager updates compliance information for all associations on an instance whenever any association executes, which may result in multiple associations showing the same execution time.\n- Id: The patch, association, or custom compliance ID.\n- Title: A title.\n- Status: The status of the compliance item. For example, `approved` for patches, or `Failed` for associations.\n- Severity: A patch severity. For example, `Critical`.\n- DocumentName: An SSM document name. For example, `AWS-RunPatchBaseline`.\n- DocumentVersion: An SSM document version number. For example, 4.\n- Classification: A patch classification. For example, `security updates`.\n- PatchBaselineId: A patch baseline ID.\n- PatchSeverity: A patch severity. For example, `Critical`.\n- PatchState: A patch state. For example, `InstancesWithFailedPatches`.\n- PatchGroup: The name of a patch group.\n- InstalledTime: The time the association, patch, or custom compliance item was applied to the resource. Specify the time by using the following format: `yyyy-MM-dd'T'HH:mm:ss'Z'`"
    flag:
        compliance-type: Specify the compliance type. For example, specify Association (for a State Manager association), Patch, or Custom:`string`.
        execution-summary: 'A summary of the call execution that includes an execution ID, the type of execution (for example, `Command`), and the date/time of the execution using a datetime object that is saved in the following format: `yyyy-MM-dd''T''HH:mm:ss''Z''`'
        item-content-hash: MD5 or SHA-256 content hash. The content hash is used to determine if existing information should be overwritten or ignored. If the content hashes match, the request to put compliance information is ignored.
        items: Information about the compliance as defined by the resource type. For example, for a patch compliance type, `Items` includes information about the PatchSeverity, Classification, and so on.
        resource-id: Specify an ID for this resource. For a managed node, this is the node ID.
        resource-type: Specify the type of resource. `ManagedInstance` is currently the only supported resource type.
        upload-type: |-
            The mode for uploading compliance items. You can specify `COMPLETE` or `PARTIAL`. In `COMPLETE` mode, the system overwrites all existing compliance information for the resource. You must provide a full list of compliance items each time you send the request.

            In `PARTIAL` mode, the system overwrites compliance information for a specific association. The association must be configured with `SyncCompliance` set to `MANUAL`. By default, all requests use `COMPLETE` mode.

            This attribute is only valid for association compliance.
