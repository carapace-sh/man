name: put-label
description: Creates or updates label.
flags:
    --description=: The label description.
    --name=!: The label name.
    --tags=: A collection of key and value pairs.
documentation:
    command: Creates or updates label. A label classifies an event as fraudulent or legitimate. Labels are associated with event types and used to train supervised machine learning models in Amazon Fraud Detector.
    flag:
        description: The label description.
        name: The label name.
        tags: A collection of key and value pairs.
