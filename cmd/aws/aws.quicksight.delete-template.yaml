name: delete-template
description: Deletes a template.
flags:
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the template that you're deleting.
    --template-id=!: An ID for the template you want to delete.
    --version-number=: Specifies the version of the template that you want to delete.
documentation:
    command: Deletes a template.
    flag:
        aws-account-id: The ID of the Amazon Web Services account that contains the template that you're deleting.
        template-id: An ID for the template you want to delete.
        version-number: Specifies the version of the template that you want to delete. If you don't provide a version number, `DeleteTemplate` deletes all versions of the template.
