name: get-key-group-config
description: Gets a key group configuration.
flags:
    --id=!: The identifier of the key group whose configuration you are getting.
documentation:
    command: |-
        Gets a key group configuration.

        To get a key group configuration, you must provide the key group's identifier. If the key group is referenced in a distribution's cache behavior, you can get the key group's identifier using `ListDistributions` or `GetDistribution`. If the key group is not referenced in a cache behavior, you can get the identifier using `ListKeyGroups`.
    flag:
        id: The identifier of the key group whose configuration you are getting. To get the identifier, use `ListKeyGroups`.
