name: describe
description: '*(BETA)*  Gets detailed index information about the given operation id.'
flags:
    --index-endpoint=: ID of the index endpoint.
    --index=: ID of the index.
    --region=: Cloud region for the operation.
documentation:
    command: |-
        ## EXAMPLES

        To describe an operation `123` of project `example` in region
        `us-central1`, run:

          $ gcloud beta ai operations describe 123 --project=example --region=us-central1

        To describe an operation `123` belongs to parent index resource `456` of
        project `example` in region `us-central1`, run:

          $ gcloud beta ai operations describe 123 --index=456 --project=example --region=us-central1
    flag:
        index: ID of the index. Applies to operations belongs to an index resource. Do not set otherwise.
        index-endpoint: ID of the index endpoint. Applies to operations belongs to an index endpoint resource. Do not set otherwise.
        region: |-
            Cloud region for the operation.
            +
            To set the `region` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
