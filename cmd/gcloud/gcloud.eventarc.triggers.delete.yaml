name: delete
description: Delete an Eventarc trigger.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location for the Eventarc trigger, which should be either ``global'' or one of the supported regions.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: Delete an Eventarc trigger.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location for the Eventarc trigger, which should be either ``global'' or one of the supported regions. Alternatively, set the [eventarc/location] property.
            +
            To set the `location` attribute:
            * provide the argument `trigger` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `eventarc/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
