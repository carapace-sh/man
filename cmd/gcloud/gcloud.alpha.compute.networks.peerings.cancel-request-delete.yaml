name: cancel-request-delete
description: '*(ALPHA)*  Cancel deletion request of a Compute Engine network peering.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --network=!: The name of the network in the current project containing the peering.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute networks peerings cancel-request-delete* is used to cancel a request to delete a consensus network peering
        connection between two networks.

        ## EXAMPLES
          To cancel a deletion request of a consensus peering with the name
          'peering-name' between the network 'local-network' and the network
          'peer-network', run:

              $ gcloud alpha compute networks peerings cancel-request-delete peering-name --network=local-network

              $ gcloud alpha compute networks peerings cancel-request-delete peering-name --network=peer-network
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        network: The name of the network in the current project containing the peering.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
