name: create-project
description: Creates a build project.
flags:
    --artifacts=!: Information about the build output artifacts for the build project.
    --auto-retry-limit=: The maximum number of additional automatic retries after a failed build.
    --badge-enabled=: Set this to true to generate a publicly accessible URL for your project's build badge.
    --build-batch-config=: A [ProjectBuildBatchConfig]() object that defines the batch build options for the project.
    --cache=: Stores recently used information so that it can be quickly accessed at a later time.
    --concurrent-build-limit=: The maximum number of concurrent builds that are allowed for this project.
    --description=: A description that makes the build project easy to identify.
    --encryption-key=: The Key Management Service customer master key (CMK) to be used for encrypting the build output artifacts.
    --environment=!: Information about the build environment for the build project.
    --file-system-locations=: An array of `ProjectFileSystemLocation` objects for a CodeBuild build project.
    --logs-config=: Information about logs for the build project.
    --name=!: The name of the build project.
    --queued-timeout-in-minutes=: The number of minutes a build is allowed to be queued before it times out.
    --secondary-artifacts=: An array of `ProjectArtifacts` objects.
    --secondary-source-versions=: An array of `ProjectSourceVersion` objects.
    --secondary-sources=: An array of `ProjectSource` objects.
    --service-role=!: The ARN of the IAM role that enables CodeBuild to interact with dependent Amazon Web Services services on behalf of the Amazon Web Services account.
    --source-version=: A version of the build input to be built for this project.
    --source=!: Information about the build input source code for the build project.
    --tags=: A list of tag key and value pairs associated with this build project.
    --timeout-in-minutes=: How long, in minutes, from 5 to 2160 (36 hours), for CodeBuild to wait before it times out any build that has not been marked as completed.
    --vpc-config=: VpcConfig enables CodeBuild to access resources in an Amazon VPC.
documentation:
    command: Creates a build project.
    flag:
        artifacts: Information about the build output artifacts for the build project.
        auto-retry-limit: The maximum number of additional automatic retries after a failed build. For example, if the auto-retry limit is set to 2, CodeBuild will call the `RetryBuild` API to automatically retry your build for up to 2 additional times.
        badge-enabled: Set this to true to generate a publicly accessible URL for your project's build badge.
        build-batch-config: A [ProjectBuildBatchConfig]() object that defines the batch build options for the project.
        cache: Stores recently used information so that it can be quickly accessed at a later time.
        concurrent-build-limit: |-
            The maximum number of concurrent builds that are allowed for this project.

            New builds are only started if the current number of builds is less than or equal to this limit. If the current build count meets this limit, new builds are throttled and are not run.
        description: A description that makes the build project easy to identify.
        encryption-key: |-
            The Key Management Service customer master key (CMK) to be used for encrypting the build output artifacts.

            You can use a cross-account KMS key to encrypt the build output artifacts if your service role has permission to that key.

            You can specify either the Amazon Resource Name (ARN) of the CMK or, if available, the CMK's alias (using the format `alias/<alias-name>`).
        environment: Information about the build environment for the build project.
        file-system-locations: An array of `ProjectFileSystemLocation` objects for a CodeBuild build project. A `ProjectFileSystemLocation` object specifies the `identifier`, `location`, `mountOptions`, `mountPoint`, and `type` of a file system created using Amazon Elastic File System.
        logs-config: Information about logs for the build project. These can be logs in CloudWatch Logs, logs uploaded to a specified S3 bucket, or both.
        name: The name of the build project.
        queued-timeout-in-minutes: The number of minutes a build is allowed to be queued before it times out.
        secondary-artifacts: An array of `ProjectArtifacts` objects.
        secondary-source-versions: An array of `ProjectSourceVersion` objects. If `secondarySourceVersions` is specified at the build level, then they take precedence over these `secondarySourceVersions` (at the project level).
        secondary-sources: An array of `ProjectSource` objects.
        service-role: The ARN of the IAM role that enables CodeBuild to interact with dependent Amazon Web Services services on behalf of the Amazon Web Services account.
        source: Information about the build input source code for the build project.
        source-version: |-
            A version of the build input to be built for this project. If not specified, the latest version is used. If specified, it must be one of:

            - For CodeCommit: the commit ID, branch, or Git tag to use.
            - For GitHub: the commit ID, pull request ID, branch name, or tag name that corresponds to the version of the source code you want to build. If a pull request ID is specified, it must use the format `pr/pull-request-ID` (for example `pr/25`). If a branch name is specified, the branch's HEAD commit ID is used. If not specified, the default branch's HEAD commit ID is used.
            - For GitLab: the commit ID, branch, or Git tag to use.
            - For Bitbucket: the commit ID, branch name, or tag name that corresponds to the version of the source code you want to build. If a branch name is specified, the branch's HEAD commit ID is used. If not specified, the default branch's HEAD commit ID is used.
            - For Amazon S3: the version ID of the object that represents the build input ZIP file to use.

            If `sourceVersion` is specified at the build level, then that version takes precedence over this `sourceVersion` (at the project level).

            For more information, see [Source Version Sample with CodeBuild](https://docs.aws.amazon.com/codebuild/latest/userguide/sample-source-version.html) in the *CodeBuild User Guide*.
        tags: |-
            A list of tag key and value pairs associated with this build project.

            These tags are available for use by Amazon Web Services services that support CodeBuild build project tags.
        timeout-in-minutes: How long, in minutes, from 5 to 2160 (36 hours), for CodeBuild to wait before it times out any build that has not been marked as completed. The default is 60 minutes.
        vpc-config: |-
            VpcConfig enables CodeBuild to access resources in an Amazon VPC.

            If you're using compute fleets during project creation, do not provide vpcConfig.
