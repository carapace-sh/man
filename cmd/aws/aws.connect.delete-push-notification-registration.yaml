    --instance-id=!: The identifier of the Amazon Connect instance.
    --registration-id=!: The identifier for the registration.
documentation:
    command: Deletes registration for a device token and a chat contact.
    flag:
        contact-id: The identifier of the contact within the Amazon Connect instance.
