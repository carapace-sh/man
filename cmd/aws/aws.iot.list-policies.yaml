name: list-policies
description: Lists your policies.
flags:
    --ascending-order=: Specifies the order for results.
    --marker=: The marker for the next set of results.
    --page-size=: The result page size.
documentation:
    command: |-
        Lists your policies.

        Requires permission to access the [ListPolicies](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        ascending-order: Specifies the order for results. If true, the results are returned in ascending creation order.
        marker: The marker for the next set of results.
        page-size: The result page size.
