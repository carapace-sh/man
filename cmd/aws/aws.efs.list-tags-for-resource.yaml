name: list-tags-for-resource
description: Lists all tags for a top-level EFS resource.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: (Optional) Specifies the maximum number of tag objects to return in the response.
    --next-token=: (Optional) You can use `NextToken` in a subsequent request to fetch the next page of access point descriptions if the response payload was paginated.
    --resource-id=!: Specifies the EFS resource you want to retrieve tags for.
documentation:
    command: |-
        Lists all tags for a top-level EFS resource. You must provide the ID of the resource that you want to retrieve the tags for.

        This operation requires permissions for the `elasticfilesystem:DescribeAccessPoints` action.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: (Optional) Specifies the maximum number of tag objects to return in the response. The default value is 100.
        next-token: (Optional) You can use `NextToken` in a subsequent request to fetch the next page of access point descriptions if the response payload was paginated.
        resource-id: Specifies the EFS resource you want to retrieve tags for. You can retrieve tags for EFS file systems and access points using this API endpoint.
