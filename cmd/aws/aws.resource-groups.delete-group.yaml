name: delete-group
description: Deletes the specified resource group.
flags:
    --group-name=: Deprecated - don't use this parameter.
    --group=: The name or the Amazon resource name (ARN) of the resource group to delete.
documentation:
    command: |-
        Deletes the specified resource group. Deleting a resource group does not delete any resources that are members of the group; it only deletes the group structure.

        **Minimum permissions**

        To run this command, you must have the following permissions:

        - `resource-groups:DeleteGroup`
    flag:
        group: The name or the Amazon resource name (ARN) of the resource group to delete.
        group-name: Deprecated - don't use this parameter. Use `Group` instead.
