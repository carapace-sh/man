        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-items: (Optional) The maximum number of hosted zones that you want Amazon Route 53 to return. If the specified VPC is associated with more than `MaxItems` hosted zones, the response includes a `NextToken` element. `NextToken` contains an encrypted token that identifies the first hosted zone that Route 53 will return if you submit another request.
        next-token: |-
            If the previous response included a `NextToken` element, the specified VPC is associated with more hosted zones. To get more hosted zones, submit another `ListHostedZonesByVPC` request.

            For the value of `NextToken`, specify the value of `NextToken` from the previous response.

            If the previous response didn't include a `NextToken` element, there are no more hosted zones to get.
        vpc-id: The ID of the Amazon VPC that you want to list hosted zones for.
        vpc-region: For the Amazon VPC that you specified for `VPCId`, the Amazon Web Services Region that you created the VPC in.
