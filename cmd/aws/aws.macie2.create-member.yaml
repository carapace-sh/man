name: create-member
description: Associates an account with an Amazon Macie administrator account.
flags:
    --account=!: The details of the account to associate with the administrator account.
    --tags=: A map of key-value pairs that specifies the tags to associate with the account in Amazon Macie.
documentation:
    command: Associates an account with an Amazon Macie administrator account.
    flag:
        account: The details of the account to associate with the administrator account.
        tags: |-
            A map of key-value pairs that specifies the tags to associate with the account in Amazon Macie.

            An account can have a maximum of 50 tags. Each tag consists of a tag key and an associated tag value. The maximum length of a tag key is 128 characters. The maximum length of a tag value is 256 characters.
