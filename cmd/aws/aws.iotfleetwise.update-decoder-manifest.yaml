name: update-decoder-manifest
description: Updates a decoder manifest.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --default-for-unmapped-signals=: Use default decoders for all unmapped signals in the model.
    --description=: A brief description of the decoder manifest to update.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the decoder manifest to update.
    --network-interfaces-to-add=:
        description: A list of information about the network interfaces to add to the decoder manifest.
        nargs: -1
    --network-interfaces-to-remove=:
        description: A list of network interfaces to remove from the decoder manifest.
        nargs: -1
    --network-interfaces-to-update=:
        description: A list of information about the network interfaces to update in the decoder manifest.
        nargs: -1
    --signal-decoders-to-add=:
        description: A list of information about decoding additional signals to add to the decoder manifest.
        nargs: -1
    --signal-decoders-to-remove=:
        description: A list of signal decoders to remove from the decoder manifest.
        nargs: -1
    --signal-decoders-to-update=:
        description: A list of updated information about decoding signals to update in the decoder manifest.
        nargs: -1
    --status=: The state of the decoder manifest.
completion:
    flag:
        default-for-unmapped-signals:
            - CUSTOM_DECODING
        status:
            - ACTIVE
            - DRAFT
            - INVALID
            - VALIDATING
documentation:
    command: |-
        Updates a decoder manifest.

        A decoder manifest can only be updated when the status is `DRAFT`. Only `ACTIVE` decoder manifests can be associated with vehicles.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        default-for-unmapped-signals: |-
            Use default decoders for all unmapped signals in the model. You don't need to provide any detailed decoding information.

            Access to certain Amazon Web Services IoT FleetWise features is currently gated. For more information, see [Amazon Web Services Region and feature availability](https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/fleetwise-regions.html) in the *Amazon Web Services IoT FleetWise Developer Guide*.
        description: A brief description of the decoder manifest to update.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the decoder manifest to update.
        network-interfaces-to-add: A list of information about the network interfaces to add to the decoder manifest.
        network-interfaces-to-remove: A list of network interfaces to remove from the decoder manifest.
        network-interfaces-to-update: A list of information about the network interfaces to update in the decoder manifest.
        signal-decoders-to-add: A list of information about decoding additional signals to add to the decoder manifest.
        signal-decoders-to-remove: A list of signal decoders to remove from the decoder manifest.
        signal-decoders-to-update: A list of updated information about decoding signals to update in the decoder manifest.
        status: The state of the decoder manifest. If the status is `ACTIVE`, the decoder manifest can't be edited. If the status is `DRAFT`, you can edit the decoder manifest.
