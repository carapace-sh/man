name: reject-spoke
description: Reject a spoke from a hub.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --details=: Additional details behind the rejection
    --no-async&: Return immediately, without waiting for the operation in progress to
    --spoke=!: URI of the spoke to reject
documentation:
    command: |-
        Reject a VPC spoke. By rejecting a spoke,
        you prevent or remove connectivity between the associated VPC network
        and any other VPC networks that are attached to the same hub.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        details: Additional details behind the rejection
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        spoke: URI of the spoke to reject
