name: untag-resource
description: Remove tags from the specified Amazon SNS topic.
flags:
    --resource-arn=!: The ARN of the topic from which to remove tags.
    --tag-keys=!: The list of tag keys to remove from the specified topic.
documentation:
    command: Remove tags from the specified Amazon SNS topic. For an overview, see [Amazon SNS Tags](https://docs.aws.amazon.com/sns/latest/dg/sns-tags.html) in the *Amazon SNS Developer Guide*.
    flag:
        resource-arn: The ARN of the topic from which to remove tags.
        tag-keys: The list of tag keys to remove from the specified topic.
