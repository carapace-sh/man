name: remove-layer7-ddos-defense-threshold-config
description: Remove a layer7 ddos defense threshold config from a Compute Engine security policy.
flags:
    --threshold-config-name=!: The name for the threshold config.
documentation:
    command: |-
        *gcloud compute security-policies remove-layer7-ddos-defense-threshold-config* is used to remove layer7 ddos defense threshold configs from security policies.

        ## EXAMPLES

        To remove a layer7 ddos defense threshold config run the following command:

          $ gcloud compute security-policies remove-layer7-ddos-defense-threshold-config NAME \
             --threshold-config-name=my-threshold-config-name
    flag:
        threshold-config-name: The name for the threshold config.
