name: cancel-metadata-generation-run
description: Cancels the metadata generation run.
flags:
    --domain-identifier=!: The ID of the Amazon DataZone domain in which the metadata generation run is to be cancelled.
    --identifier=!: The ID of the metadata generation run.
documentation:
    command: |-
        Cancels the metadata generation run.

        Prerequisites:

        - The run must exist and be in a cancelable status (e.g., SUBMITTED, IN\_PROGRESS).
        - Runs in SUCCEEDED status cannot be cancelled.
        - User must have access to the run and cancel permissions.
    flag:
        domain-identifier: The ID of the Amazon DataZone domain in which the metadata generation run is to be cancelled.
        identifier: The ID of the metadata generation run.
