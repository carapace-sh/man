name: check-no-public-access
description: Checks whether a resource policy can grant public access to the specified resource type.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --policy-document=!: The JSON policy document to evaluate for public access.
    --resource-type=!: The type of resource to evaluate for public access.
completion:
    flag:
        resource-type:
            - AWS::DynamoDB::Table
            - AWS::DynamoDB::Stream
            - AWS::EFS::FileSystem
            - AWS::OpenSearchService::Domain
            - AWS::Kinesis::Stream
            - AWS::Kinesis::StreamConsumer
            - AWS::KMS::Key
            - AWS::Lambda::Function
            - AWS::S3::Bucket
            - AWS::S3::AccessPoint
            - AWS::S3Express::DirectoryBucket
            - AWS::S3::Glacier
            - AWS::S3Outposts::Bucket
            - AWS::S3Outposts::AccessPoint
            - AWS::SecretsManager::Secret
            - AWS::SNS::Topic
            - AWS::SQS::Queue
            - AWS::IAM::AssumeRolePolicyDocument
            - AWS::S3Tables::TableBucket
            - AWS::ApiGateway::RestApi
            - AWS::CodeArtifact::Domain
            - AWS::Backup::BackupVault
            - AWS::CloudTrail::Dashboard
            - AWS::CloudTrail::EventDataStore
            - AWS::S3Tables::Table
            - AWS::S3Express::AccessPoint
documentation:
    command: Checks whether a resource policy can grant public access to the specified resource type.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        policy-document: The JSON policy document to evaluate for public access.
        resource-type: |-
            The type of resource to evaluate for public access. For example, to check for public access to Amazon S3 buckets, you can choose `AWS::S3::Bucket` for the resource type.

            For resource types not supported as valid values, IAM Access Analyzer will return an error.
