name: copy-bundled-python
description: Make a temporary copy of bundled Python installation.
hidden: true
flags:
    --architecture-override=&: THIS ARGUMENT NEEDS HELP TEXT.
    --operating-system-override=&: THIS ARGUMENT NEEDS HELP TEXT.
    --sdk-root-override=&: THIS ARGUMENT NEEDS HELP TEXT.
    --snapshot-url-override=&: THIS ARGUMENT NEEDS HELP TEXT.
documentation:
    command: |-
        Also print its location.

        If the Python installation used to execute this command is *not* bundled, do
        not make a copy. Instead, print the location of the current Python
        installation.
