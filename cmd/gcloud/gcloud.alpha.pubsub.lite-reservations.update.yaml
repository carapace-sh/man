name: update
description: '*(ALPHA)*  Update a Pub/Sub Lite reservation.'
flags:
    --location=: ID of the location of the Pub/Sub Lite resource.
    --throughput-capacity=: Reservation throughput capacity.
documentation:
    command: '*(ALPHA)*  Update a Pub/Sub Lite reservation.'
    flag:
        location: |-
            ID of the location of the Pub/Sub Lite resource.
            +

            To set the `location` attribute:
            * provide the argument `reservation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        throughput-capacity: |-
            Reservation throughput capacity. Every unit of throughput capacity is equivalent to 1 MiB/s of
            published messages or 2 MiB/s of subscribed messages.
