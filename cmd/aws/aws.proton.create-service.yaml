name: create-service
description: Create an Proton service.
flags:
    --branch-name=: The name of the code repository branch that holds the code that's deployed in Proton.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description of the Proton service.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The service name.
    --repository-connection-arn=: The Amazon Resource Name (ARN) of the repository connection.
    --repository-id=: The ID of the code repository.
    --spec=!: A link to a spec file that provides inputs as defined in the service template bundle schema file.
    --tags=:
        description: An optional list of metadata items that you can associate with the Proton service.
        nargs: -1
    --template-major-version=!: The major version of the service template that was used to create the service.
    --template-minor-version=: The minor version of the service template that was used to create the service.
    --template-name=!: The name of the service template that's used to create the service.
documentation:
    command: Create an Proton service. An Proton service is an instantiation of a service template and often includes several service instances and pipeline. For more information, see [Services](https://docs.aws.amazon.com/proton/latest/userguide/ag-services.html) in the *Proton User Guide*.
    flag:
        branch-name: The name of the code repository branch that holds the code that's deployed in Proton. *Don't* include this parameter if your service template *doesn't* include a service pipeline.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description of the Proton service.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The service name.
        repository-connection-arn: The Amazon Resource Name (ARN) of the repository connection. For more information, see [Setting up an AWS CodeStar connection](https://docs.aws.amazon.com/proton/latest/userguide/setting-up-for-service.html#setting-up-vcontrol) in the *Proton User Guide*. *Don't* include this parameter if your service template *doesn't* include a service pipeline.
        repository-id: The ID of the code repository. *Don't* include this parameter if your service template *doesn't* include a service pipeline.
        spec: A link to a spec file that provides inputs as defined in the service template bundle schema file. The spec file is in YAML format. *Don’t* include pipeline inputs in the spec if your service template *doesn’t* include a service pipeline. For more information, see [Create a service](https://docs.aws.amazon.com/proton/latest/userguide/ag-create-svc.html) in the *Proton User Guide*.
        tags: |-
            An optional list of metadata items that you can associate with the Proton service. A tag is a key-value pair.

            For more information, see [Proton resources and tagging](https://docs.aws.amazon.com/proton/latest/userguide/resources.html) in the *Proton User Guide*.
        template-major-version: The major version of the service template that was used to create the service.
        template-minor-version: The minor version of the service template that was used to create the service.
        template-name: The name of the service template that's used to create the service.
