name: add-dns-peering-zone
description: '*(ALPHA)*  Add a DNS peering zone to a SSE Environment.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --dns-network=: Fully qualified name of the network for the DNS peering zone (like `projects/my-project/global/networks/my-network`).
    --dns-suffix=!: Name of the DNS suffix for the DNS peering zone (like example.com).
    --location=: The location Id.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(ALPHA)*  Add the specified DNS peering zone to an existing SSE environment by providing the DNS suffix and optionally the network to target with the peering.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        dns-network: Fully qualified name of the network for the DNS peering zone (like `projects/my-project/global/networks/my-network`). Defaults to the partnerNetwork of this SSE Environment.
        dns-suffix: Name of the DNS suffix for the DNS peering zone (like example.com).
        location: |-
            The location Id.
            +

            To set the `location` attribute:
            * provide the argument `partner_sse_environment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * location is global by default.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
