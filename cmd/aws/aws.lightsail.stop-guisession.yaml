name: stop-guisession
description: Terminates a web-based Amazon DCV session that’s used to access a virtual computer’s operating system or application.
flags:
    --resource-name=!: The resource name.
documentation:
    command: Terminates a web-based Amazon DCV session that’s used to access a virtual computer’s operating system or application. The session will close and any unsaved data will be lost.
