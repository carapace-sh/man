name: describe-applications
description: Describes the specified applications by filtering based on their compute types, license availability, operating systems, and owners.
flags:
    --application-ids=: The identifiers of one or more applications.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --compute-type-names=: The compute types supported by the applications.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --license-type=: The license availability for the applications.
    --max-results=: The maximum number of applications to return.
    --next-token=: If you received a `NextToken` from a previous call that was paginated, provide this token to receive the next set of results.
    --operating-system-names=: The operating systems supported by the applications.
    --owner=: The owner of the applications.
completion:
    flag:
        license-type:
            - LICENSED
            - UNLICENSED
documentation:
    command: Describes the specified applications by filtering based on their compute types, license availability, operating systems, and owners.
    flag:
        application-ids: The identifiers of one or more applications.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        compute-type-names: The compute types supported by the applications.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        license-type: The license availability for the applications.
        max-results: The maximum number of applications to return.
        next-token: If you received a `NextToken` from a previous call that was paginated, provide this token to receive the next set of results.
        operating-system-names: The operating systems supported by the applications.
        owner: The owner of the applications.
