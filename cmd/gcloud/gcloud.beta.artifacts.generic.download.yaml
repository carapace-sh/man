name: download
description: '*(BETA)*  Download a generic artifact from a generic artifact repository.'
flags:
    --chunk-size=: If specified, the chunk size (bytes) to use for downloading the package.
    --destination=!: The path where you want to save the downloaded file.
    --location=: Location of the repository.
    --name=: If specified, the file name within the artifact to download.
    --package=!: The artifact to download.
    --parallelism=: Specifies the number of threads to use for downloading the file in parallel.
    --repository=: ID of the repository or fully qualified identifier for the repository.
documentation:
    command: '*(BETA)*  Download a generic artifact from a generic artifact repository.'
    flag:
        chunk-size: If specified, the chunk size (bytes) to use for downloading the package.
        destination: The path where you want to save the downloaded file.
        location: |-
            Location of the repository.
            +
            To set the `location` attribute:
            * provide the argument `--repository` on the command line with a fully specified name;
            * set the property `artifacts/repository` with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `artifacts/location`.
        name: If specified, the file name within the artifact to download.
        package: The artifact to download.
        parallelism: Specifies the number of threads to use for downloading the file in parallel.
        repository: |-
            ID of the repository or fully qualified identifier for the repository.
            +
            To set the `repository` attribute:
            * provide the argument `--repository` on the command line;
            * set the property `artifacts/repository`.
