name: get-mltransforms
description: Gets a sortable, filterable list of existing Glue machine learning transforms.
flags:
    --filter=: The filter transformation criteria.
    --max-results=: The maximum number of results to return.
    --next-token=: A paginated token to offset the results.
    --sort=: The sorting criteria.
documentation:
    command: Gets a sortable, filterable list of existing Glue machine learning transforms. Machine learning transforms are a special type of transform that use machine learning to learn the details of the transformation to be performed by learning from examples provided by humans. These transformations are then saved by Glue, and you can retrieve their metadata by calling `GetMLTransforms`.
    flag:
        filter: The filter transformation criteria.
        max-results: The maximum number of results to return.
        next-token: A paginated token to offset the results.
        sort: The sorting criteria.
