name: invoke-assistant
description: Invokes SiteWise Assistant to start or continue a conversation.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --conversation-id=: The ID assigned to a conversation.
    --enable-trace: Specifies if to turn trace on or not.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --message=!: A text message sent to the SiteWise Assistant by the user.
    --no-enable-trace: Specifies if to turn trace on or not.
documentation:
    command: Invokes SiteWise Assistant to start or continue a conversation.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        conversation-id: The ID assigned to a conversation. IoT SiteWise automatically generates a unique ID for you, and this parameter is never required. However, if you prefer to have your own ID, you must specify it here in UUID format. If you specify your own ID, it must be globally unique.
        enable-trace: Specifies if to turn trace on or not. It is used to track the SiteWise Assistant's reasoning, and data access process.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        message: A text message sent to the SiteWise Assistant by the user.
