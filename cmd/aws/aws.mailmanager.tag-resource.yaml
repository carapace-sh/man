name: tag-resource
description: Adds one or more tags (keys and values) to a specified resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource that you want to tag.
    --tags=!: The tags used to organize, track, or control access for the resource.
documentation:
    command: Adds one or more tags (keys and values) to a specified resource.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource that you want to tag.
