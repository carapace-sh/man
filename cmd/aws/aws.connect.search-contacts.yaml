name: search-contacts
description: Searches contacts in an Amazon Connect instance.
flags:
    --instance-id=!: The identifier of Amazon Connect instance.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
    --search-criteria=: The search criteria to be used to return contacts.
    --sort=: Specifies a field to sort by and a sort order.
    --time-range=!: Time range that you want to search results.
documentation:
    command: Searches contacts in an Amazon Connect instance.
    flag:
        instance-id: The identifier of Amazon Connect instance. You can find the instance ID in the Amazon Resource Name (ARN) of the instance.
        max-results: The maximum number of results to return per page.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        search-criteria: The search criteria to be used to return contacts.
        sort: Specifies a field to sort by and a sort order.
        time-range: Time range that you want to search results.
