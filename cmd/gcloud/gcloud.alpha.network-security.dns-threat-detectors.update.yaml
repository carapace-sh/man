name: update
description: '*(ALPHA)*  Update a DnsThreatDetector resource.'
flags:
    --add-excluded-networks=: Add new value to excluded_networks list.
    --clear-excluded-networks: Clear excluded_networks value and set to empty list.
    --clear-labels: Clear labels value and set to empty map.
    --excluded-networks=: Set excluded_networks to new value.
    --labels=: Set labels to new value.
    --location=: The location id of the dnsThreatDetector resource.
    --no-clear-excluded-networks&: Clear excluded_networks value and set to empty list.
    --no-clear-labels&: Clear labels value and set to empty map.
    --provider=: The provider used for DNS threat analysis.
    --remove-excluded-networks=: Remove existing value from excluded_networks list.
    --remove-labels=: Remove existing value from map labels.
    --update-labels=: Update labels value or add key value pair.
completion:
    flag:
        provider:
            - infoblox
documentation:
    command: '*(ALPHA)*  Update a DnsThreatDetector resource.'
    flag:
        add-excluded-networks: Add new value to excluded_networks list.
        clear-excluded-networks: Clear excluded_networks value and set to empty list.
        clear-labels: Clear labels value and set to empty map.
        excluded-networks: Set excluded_networks to new value.
        labels: |-
            Set labels to new value. Labels as key value pairs.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: |-
            The location id of the dnsThreatDetector resource.
            +
            To set the `location` attribute:
            * provide the argument `dns_threat_detector` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-clear-excluded-networks: Clear excluded_networks value and set to empty list.
        no-clear-labels: Clear labels value and set to empty map.
        provider: |-
            The provider used for DNS threat analysis. _PROVIDER_ must be (only one value is supported):
            +
            *infoblox*::: The Infoblox DNS threat detecter.
            :::
            +
        remove-excluded-networks: Remove existing value from excluded_networks list.
        remove-labels: |-
            Remove existing value from map labels. Sets `remove_labels` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-labels=string,string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-labels=["string"]
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-labels=path_to_file.(yaml|json)
            +
            ```
        update-labels: |-
            Update labels value or add key value pair. Labels as key value pairs.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --update-labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --update-labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --update-labels=path_to_file.(yaml|json)
            +
            ```
