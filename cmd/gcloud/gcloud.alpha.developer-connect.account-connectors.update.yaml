documentation:
    command: '*(ALPHA)*  Update an accountConnector'
    flag:
        allow-missing: |-
            If set to true, and the accountConnector is not found a new
            accountConnector will be created. In this situation `update_mask` is
            ignored. The creation will succeed only if the input accountConnector has
            all the necessary. Use *--allow-missing* to enable and *--no-allow-missing* to disable.
        annotations: |-
            Set annotations to new value. Allows users to store small amounts of arbitrary data.
            +
            *KEY*:::
            Sets `KEY` value.
            +
            *VALUE*:::
            Sets `VALUE` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --annotations=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --annotations='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --annotations=path_to_file.(yaml|json)
            +
            ```
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        clear-annotations: Clear annotations value and set to empty map.
        clear-custom-oauth-config: Set accountConnector.customOauthConfig back to default value.
        clear-labels: Clear labels value and set to empty map.
        clear-provider-oauth-config: Set accountConnector.providerOauthConfig back to default value.
        custom-oauth-config-client-id: The client ID of the OAuth application.
        custom-oauth-config-client-secret: |-
            The client secret of the OAuth application.
            It will be provided as plain text, but encrypted and stored in developer
            connect. As INPUT_ONLY field, it will not be included in the output.
        custom-oauth-config-host-uri: The host URI of the OAuth application.
        custom-oauth-config-pkce-disabled: Disable PKCE for this OAuth config. PKCE is enabled by default.
        custom-oauth-config-scm-provider: The type of the SCM provider.
        custom-oauth-config-scopes: The scopes to be requested during OAuth.
        etag: |-
            This checksum is computed by the server based on the value of other
            fields, and may be sent on update and delete requests to ensure the
            client has an up-to-date value before proceeding.
        labels: |-
            Set labels to new value. Labels as key value pairs.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: |-
            The location id of the accountConnector resource.
            +
            To set the `location` attribute:
            * provide the argument `account_connector` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-allow-missing: |-
            If set to true, and the accountConnector is not found a new
            accountConnector will be created. In this situation `update_mask` is
            ignored. The creation will succeed only if the input accountConnector has
            all the necessary
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-annotations: Clear annotations value and set to empty map.
        no-clear-custom-oauth-config: Set accountConnector.customOauthConfig back to default value.
        no-clear-labels: Clear labels value and set to empty map.
        no-clear-provider-oauth-config: Set accountConnector.providerOauthConfig back to default value.
        no-custom-oauth-config-pkce-disabled: Disable PKCE for this OAuth config. PKCE is enabled by default.
        no-validate-only: If set, validate the request, but do not actually post it.
        provider-oauth-config-scopes: |-
            User selected scopes to apply to the Oauth config
            In the event of changing scopes, user records under AccountConnector will
            be deleted and users will re-auth again.
        remove-annotations: |-
            Remove existing value from map annotations. Sets `remove_annotations` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-annotations=string,string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-annotations=["string"]
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-annotations=path_to_file.(yaml|json)
            +
            ```
        remove-labels: |-
            Remove existing value from map labels. Sets `remove_labels` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-labels=string,string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-labels=["string"]
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-labels=path_to_file.(yaml|json)
            +
            ```
        request-id: |-
            An optional request ID to identify requests. Specify a unique request ID
            so that if you must retry your request, the server will know to ignore
            the request if it has already been completed. The server will guarantee
            that for at least 60 minutes since the first request.
            +
            For example, consider a situation where you make an initial request and the
            request times out. If you make the request again with the same request
            ID, the server can check if original operation with the same request ID
            was received, and if so, will ignore the second request. This prevents
            clients from accidentally creating duplicate commitments.
            +
            The request ID must be a valid UUID with the exception that zero UUID is
            not supported (00000000-0000-0000-0000-000000000000).
        update-annotations: |-
            Update annotations value or add key value pair. Allows users to store small amounts of arbitrary data.
            +
            *KEY*:::
            Sets `KEY` value.
            +
            *VALUE*:::
            Sets `VALUE` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --update-annotations=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --update-annotations='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --update-annotations=path_to_file.(yaml|json)
            +
            ```
        update-labels: |-
            Update labels value or add key value pair. Labels as key value pairs.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --update-labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --update-labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --update-labels=path_to_file.(yaml|json)
            +
            ```
        validate-only: If set, validate the request, but do not actually post it. Use *--validate-only* to enable and *--no-validate-only* to disable.
