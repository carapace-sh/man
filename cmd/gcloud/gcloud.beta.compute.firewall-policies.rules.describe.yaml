name: describe
description: '*(BETA)*  Describes a Compute Engine organization firewall policy rule.'
flags:
    --firewall-policy=!: Short name of the firewall policy into which the rule should be described.
    --organization=: Organization which the organization firewall policy belongs to.
documentation:
    command: '*(BETA)*  *gcloud beta compute firewall-policies rules describe* is used to describe organization firewall policy rules.'
    flag:
        firewall-policy: Short name of the firewall policy into which the rule should be described.
        organization: Organization which the organization firewall policy belongs to. Must be set if FIREWALL_POLICY is short name.
