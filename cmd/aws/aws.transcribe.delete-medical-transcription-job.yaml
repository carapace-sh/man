name: delete-medical-transcription-job
description: Deletes a medical transcription job.
flags:
    --medical-transcription-job-name=!: The name of the medical transcription job you want to delete.
documentation:
    command: Deletes a medical transcription job. To use this operation, specify the name of the job you want to delete using `MedicalTranscriptionJobName`. Job names are case sensitive.
    flag:
        medical-transcription-job-name: The name of the medical transcription job you want to delete. Job names are case sensitive.
