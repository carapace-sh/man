name: create
description: '*(ALPHA)*  Create a Backup and DR backup vault.'
flags:
    --access-restriction=: Authorize certain sources and destinations for data being sent into, or restored from, the backup vault being created.
    --backup-min-enforced-retention=!: Backups will be kept for this minimum period before they can be deleted.
    --backup-retention-inheritance=: The inheritance mode for enforced retention end time of the backup within this backup vault.
    --description=: Optional description for the backup vault (2048 characters or less).
    --effective-time=: The time at which the enforced retention period becomes locked.
    --kms-key=: The Cloud KMS key resource name to be used for encryption.
    --labels=: Optional resource labels to represent metadata provided by the user.
    --location=: The location of the Backup Vault.
    --no-async: Wait for the operation in progress to complete.
completion:
    flag:
        access-restriction:
            - within-project
            - within-org
            - unrestricted
            - within-org-but-unrestricted-for-ba
        backup-retention-inheritance:
            - inherit-vault-retention
            - match-backup-expire-time
documentation:
    command: '*(ALPHA)*  Create a Backup and DR backup vault.'
    flag:
        access-restriction: 'Authorize certain sources and destinations for data being sent into, or restored from, the backup vault being created. This choice  determines the type of resources that can be stored. Restricting access to within your project or organization limits the resources to those managed through the Google Cloud console (e.g., Compute Engine VMs). Unrestricted access is required for resources managed through the management console (e.g., VMware Engine VMs, databases, and file systems). _ACCESS_RESTRICTION_ must be one of: *within-project*, *within-org*, *unrestricted*, *within-org-but-unrestricted-for-ba*.'
        backup-min-enforced-retention: Backups will be kept for this minimum period before they can be deleted. Once the effective time is reached, the enforced retention period cannot be decreased or removed. The value must be specified in relative time format (e.g. p1d, p1m, p1m1d).
        backup-retention-inheritance: 'The inheritance mode for enforced retention end time of the backup within this backup vault. Once set, the inheritance mode cannot be changed. Default is inherit-vault-retention. If set to inherit-vault-retention, the backup retention period will be inherited from the backup vault. If set to match-backup-expire-time, the backup retention period will  be the same as the backup expiration time. _BACKUP_RETENTION_INHERITANCE_ must be one of: *inherit-vault-retention*, *match-backup-expire-time*.'
        description: Optional description for the backup vault (2048 characters or less).
        effective-time: The time at which the enforced retention period becomes locked. This flag is mutually exclusive with --unlock-backup-min-enforced-retention.
        kms-key: 'The Cloud KMS key resource name to be used for encryption. Format: projects/{project}/locations/{location}/keyRings/{ring}/cryptoKeys/{key}'
        labels: Optional resource labels to represent metadata provided by the user.
        location: |-
            The location of the Backup Vault.
            +
            To set the `location` attribute:
            * provide the argument `backup_vault` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: Wait for the operation in progress to complete.
