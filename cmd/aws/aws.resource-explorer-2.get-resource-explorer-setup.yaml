name: get-resource-explorer-setup
description: Retrieves the status and details of a Resource Explorer setup operation.
flags:
    --max-results=: The maximum number of Region status results to return in a single response.
    --next-token=: The pagination token from a previous `GetResourceExplorerSetup` response.
    --task-id=!: The unique identifier of the setup task to retrieve status information for.
documentation:
    command: Retrieves the status and details of a Resource Explorer setup operation. This operation returns information about the progress of creating or deleting Resource Explorer configurations across Regions.
    flag:
        max-results: The maximum number of Region status results to return in a single response. Valid values are between `1` and `100`.
        next-token: The pagination token from a previous `GetResourceExplorerSetup` response. Use this token to retrieve the next set of results.
        task-id: The unique identifier of the setup task to retrieve status information for. This ID is returned by `CreateResourceExplorerSetup` or `DeleteResourceExplorerSetup` operations.
