name: list-account-activities
description: Returns a list of activities that are available.
flags:
    --filter-activity-statuses=: The activity status filter.
    --language-code=: The language code used to return translated titles.
    --max-results=: The maximum number of items to return for this request.
    --next-token=: A token from a previous paginated response.
completion:
    flag:
        language-code:
            - en-US
            - en-GB
            - id-ID
            - de-DE
            - es-ES
            - fr-FR
            - ja-JP
            - it-IT
            - pt-PT
            - ko-KR
            - zh-CN
            - zh-TW
            - tr-TR
documentation:
    command: Returns a list of activities that are available. This operation supports pagination and filtering by status.
    flag:
        filter-activity-statuses: The activity status filter. This field can be used to filter the response by activities status.
        language-code: The language code used to return translated titles.
        max-results: The maximum number of items to return for this request. To get the next page of items, make another request with the token returned in the output.
        next-token: A token from a previous paginated response. If this is specified, the response includes records beginning from this token (inclusive), up to the number specified by `maxResults`.
