name: update-service
description: "Submits a request to perform the following operations:\n\n- Update the TTL setting for existing `DnsRecords` configurations\n- Add, update, or delete `HealthCheckConfig` for a specified service\n  \n  You can't add, update, or delete a `HealthCheckCustomConfig` configuration."
flags:
    --id=!: The ID or Amazon Resource Name (ARN) of the service that you want to update.
    --service=!: A complex type that contains the new settings for the service.
documentation:
    command: "Submits a request to perform the following operations:\n\n- Update the TTL setting for existing `DnsRecords` configurations\n- Add, update, or delete `HealthCheckConfig` for a specified service\n  \n  You can't add, update, or delete a `HealthCheckCustomConfig` configuration.\n\nFor public and private DNS namespaces, note the following:\n\n- If you omit any existing `DnsRecords` or `HealthCheckConfig` configurations from an `UpdateService` request, the configurations are deleted from the service.\n- If you omit an existing `HealthCheckCustomConfig` configuration from an `UpdateService` request, the configuration isn't deleted from the service.\n\nYou can't call `UpdateService` and update settings in the following scenarios:\n\n- When the service is associated with an HTTP namespace\n- When the service is associated with a shared namespace and contains instances that were registered by Amazon Web Services accounts other than the account making the `UpdateService` call\n\nWhen you update settings for a service, Cloud Map also updates the corresponding settings in all the records and health checks that were created by using the specified service."
    flag:
        id: The ID or Amazon Resource Name (ARN) of the service that you want to update. If the namespace associated with the service is shared with your Amazon Web Services account, specify the service ARN. For more information about shared namespaces, see [Cross-account Cloud Map namespace sharing](https://docs.aws.amazon.com/cloud-map/latest/dg/sharing-namespaces.html) in the *Cloud Map Developer Guide*
        service: A complex type that contains the new settings for the service. You can specify a maximum of 30 attributes (key-value pairs).
