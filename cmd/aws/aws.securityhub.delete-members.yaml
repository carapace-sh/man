name: delete-members
description: Deletes the specified member accounts from Security Hub.
flags:
    --account-ids=!: The list of account IDs for the member accounts to delete.
documentation:
    command: |-
        Deletes the specified member accounts from Security Hub.

        You can invoke this API only to delete accounts that became members through invitation. You can't invoke this API to delete accounts that belong to an Organizations organization.
    flag:
        account-ids: The list of account IDs for the member accounts to delete.
