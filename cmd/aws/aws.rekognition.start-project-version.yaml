name: start-project-version
description: This operation applies only to Amazon Rekognition Custom Labels.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-inference-units=: The maximum number of inference units to use for auto-scaling the model.
    --min-inference-units=!: The minimum number of inference units to use.
    --project-version-arn=!: The Amazon Resource Name(ARN) of the model version that you want to start.
documentation:
    command: |-
        This operation applies only to Amazon Rekognition Custom Labels.

        Starts the running of the version of a model. Starting a model takes a while to complete. To check the current state of the model, use [DescribeProjectVersions]().

        Once the model is running, you can detect custom labels in new images by calling [DetectCustomLabels]().

        You are charged for the amount of time that the model is running. To stop a running model, call [StopProjectVersion]().

        This operation requires permissions to perform the `rekognition:StartProjectVersion` action.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-inference-units: The maximum number of inference units to use for auto-scaling the model. If you don't specify a value, Amazon Rekognition Custom Labels doesn't auto-scale the model.
        min-inference-units: |-
            The minimum number of inference units to use. A single inference unit represents 1 hour of processing.

            Use a higher number to increase the TPS throughput of your model. You are charged for the number of inference units that you use.
        project-version-arn: The Amazon Resource Name(ARN) of the model version that you want to start.
