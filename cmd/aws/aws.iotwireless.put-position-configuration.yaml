name: put-position-configuration
description: Put position configuration for a given resource.
flags:
    --destination=: The position data destination that describes the AWS IoT rule that processes the device's position data for use by AWS IoT Core for LoRaWAN.
    --resource-identifier=!: Resource identifier used to update the position configuration.
    --resource-type=!: Resource type of the resource for which you want to update the position configuration.
    --solvers=: The positioning solvers used to update the position configuration of the resource.
completion:
    flag:
        resource-type:
            - WirelessDevice
            - WirelessGateway
documentation:
    command: |-
        Put position configuration for a given resource.

        This action is no longer supported. Calls to update the position configuration should use the [UpdateResourcePosition](https://docs.aws.amazon.com/iot-wireless/latest/apireference/API_UpdateResourcePosition.html) API operation instead.
    flag:
        destination: The position data destination that describes the AWS IoT rule that processes the device's position data for use by AWS IoT Core for LoRaWAN.
        resource-identifier: Resource identifier used to update the position configuration.
        resource-type: Resource type of the resource for which you want to update the position configuration.
        solvers: The positioning solvers used to update the position configuration of the resource.
