documentation:
    command: '*(ALPHA)*  Get transcripts of short (less than 60 seconds) audio from an audio file.'
    flag:
        audio: Location of the audio file to transcribe. Must be a audio data bytes, local file, or Google Cloud Storage URL (in the format gs://bucket/object).
        audio-channel-count: Number of channels present in the audio data sent for recognition. Required if --encoding flag is specified and is not AUTO. Must be set to a value between 1 and 8.
        enable-automatic-punctuation: If set, adds punctuation to recognition result hypotheses. Use *--enable-automatic-punctuation* to enable and *--no-enable-automatic-punctuation* to disable.
        enable-spoken-emojis: If set, adds spoken emoji formatting. Use *--enable-spoken-emojis* to enable and *--no-enable-spoken-emojis* to disable.
        enable-spoken-punctuation: If set, replaces spoken punctuation with the corresponding symbols in the request. Use *--enable-spoken-punctuation* to enable and *--no-enable-spoken-punctuation* to disable.
        enable-word-confidence: |-
            If set, the top result includes a list of words and the confidence for
            those words. Use *--enable-word-confidence* to enable and *--no-enable-word-confidence* to disable.
        enable-word-time-offsets: If set, the top result includes a list of words and their timestamps. Use *--enable-word-time-offsets* to enable and *--no-enable-word-time-offsets* to disable.
        encoding: |-
            Encoding format of the provided audio.
            For headerless formats, must be set to `LINEAR16`, `MULAW,` or `ALAW`.
            For other formats, set to `AUTO`. Overrides the recognizer
            configuration if present, else uses recognizer encoding.
        hint-boost: |-
            Boost value for the phrases passed to --phrases.
            Can have a value between 1 and 20.
        hint-phrase-sets: A list of phrase set resource names to use for speech recognition.
        hint-phrases: |-
            A list of strings containing word and phrase "hints" so that the '
            'speech recognition is more likely to recognize them. This can be '
            'used to improve the accuracy for specific words and phrases, '
            'for example, if specific commands are typically spoken by '
            'the user. This can also be used to add additional words to the '
            'vocabulary of the recognizer. '
            'See https://cloud.google.com/speech/limits#content.
        language-codes: |-
            Language code is one of `en-US`, `en-GB`, `fr-FR`.
            Check [documentation](https://cloud.google.com/speech-to-text/docs/multiple-languages)
            for using more than one language code.
        location: |-
            Location of the recognizer.
            +

            To set the `location` attribute:
            * provide the argument `recognizer` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        max-alternatives: Maximum number of recognition hypotheses to be returned. Must be set to a value between 1 and 30.
        max-speaker-count: Maximum number of speakers in the conversation. Must be greater than or equal to --min-speaker-count. Must be set to a value between 1 and 6.
        min-speaker-count: Minimum number of speakers in the conversation. Must be less than or equal to --max-speaker-count. Must be set to a value between 1 and 6.
        model: |-
            Which model to use for recognition requests.
            Select the model best suited to your domain to get best results.
            Guidance for choosing which model to use can be found in the
            [Transcription Models Documentation](https://cloud.google.com/speech-to-text/v2/docs/transcription-model)
            and the models supported in each region can be found in the
            [Table Of Supported Models](https://cloud.google.com/speech-to-text/v2/docs/speech-to-text-supported-languages).
        no-enable-automatic-punctuation: |
            If set, adds punctuation to recognition result hypotheses.
        no-enable-spoken-emojis: |
            If set, adds spoken emoji formatting.
        no-enable-spoken-punctuation: |
            If set, replaces spoken punctuation with the corresponding symbols in the request.
        no-enable-word-confidence: |
            If set, the top result includes a list of words and the confidence for
            those words.
        no-enable-word-time-offsets: |
            If set, the top result includes a list of words and their timestamps.
        no-profanity-filter: |
            If set, the server will censor profanities.
        no-separate-channel-recognition: |
            Mode for recognizing multi-channel audio using Separate Channel Recognition.
            When set, the service will recognize each channel independently.
        profanity-filter: If set, the server will censor profanities. Use *--profanity-filter* to enable and *--no-profanity-filter* to disable.
        sample-rate: Sample rate in Hertz of the audio data sent for recognition. Required if --encoding flag is specified and is not AUTO. Must be set to a value between 8000 and 48000.
        separate-channel-recognition: |-
            Mode for recognizing multi-channel audio using Separate Channel Recognition.
            When set, the service will recognize each channel independently. Use *--separate-channel-recognition* to enable and *--no-separate-channel-recognition* to disable.
