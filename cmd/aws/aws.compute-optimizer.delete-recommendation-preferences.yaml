name: delete-recommendation-preferences
description: Deletes a recommendation preference, such as enhanced infrastructure metrics.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --recommendation-preference-names=!: The name of the recommendation preference to delete.
    --resource-type=!: The target resource type of the recommendation preference to delete.
    --scope=: An object that describes the scope of the recommendation preference to delete.
completion:
    flag:
        resource-type:
            - Ec2Instance
            - AutoScalingGroup
            - EbsVolume
            - LambdaFunction
            - NotApplicable
            - EcsService
            - License
            - RdsDBInstance
            - AuroraDBClusterStorage
            - Idle
documentation:
    command: |-
        Deletes a recommendation preference, such as enhanced infrastructure metrics.

        For more information, see [Activating enhanced infrastructure metrics](https://docs.aws.amazon.com/compute-optimizer/latest/ug/enhanced-infrastructure-metrics.html) in the *Compute Optimizer User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        recommendation-preference-names: The name of the recommendation preference to delete.
        resource-type: |-
            The target resource type of the recommendation preference to delete.

            The `Ec2Instance` option encompasses standalone instances and instances that are part of Amazon EC2 Auto Scaling groups. The `AutoScalingGroup` option encompasses only instances that are part of an Amazon EC2 Auto Scaling group.
        scope: |-
            An object that describes the scope of the recommendation preference to delete.

            You can delete recommendation preferences that are created at the organization level (for management accounts of an organization only), account level, and resource level. For more information, see [Activating enhanced infrastructure metrics](https://docs.aws.amazon.com/compute-optimizer/latest/ug/enhanced-infrastructure-metrics.html) in the *Compute Optimizer User Guide*.
