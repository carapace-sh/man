name: list
description: Route View for a Mesh or Gateway.
flags:
    --gateway=!: ID of the gateway or fully qualified identifier for the gateway.
    --limit=: Maximum number of resources to list.
    --location=!: ID of the location or fully qualified identifier for the location.
    --mesh=!: ID of the mesh or fully qualified identifier for the mesh.
    --page-size=: Some services group resource list output into pages.
documentation:
    command: |-
        List all Route Views for a Mesh or Gateway

        ## EXAMPLES

        List Route Views for a mesh.

          $ gcloud network-services route-views list --mesh projects/-/locations/-/meshes/mesh1
          $ gcloud network-services route-views list --project $PROJECT --location $LOCATION --mesh
          projects/-/locations/-/meshes/mesh1
        List Route Views for a gateway.

          $ gcloud network-services route-views list --gateway projects/-/locations/-/gateways/gateway1
          $ gcloud network-services route-views list --project $PROJECT --location $LOCATION --gateway
          projects/-/locations/-/gateways/gateway1
    flag:
        gateway: |-
            ID of the gateway or fully qualified identifier for the gateway.
            +
            To set the `gateway` attribute:
            * provide the argument `--gateway` on the command line.
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line.
        mesh: |-
            ID of the mesh or fully qualified identifier for the mesh.
            +
            To set the `mesh` attribute:
            * provide the argument `--mesh` on the command line.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is determined by the
            service if it supports paging, otherwise it is *unlimited* (no paging).
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
