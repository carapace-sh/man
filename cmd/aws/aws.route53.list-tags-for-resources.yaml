name: list-tags-for-resources
description: Lists tags for up to 10 health checks or hosted zones.
flags:
    --resource-ids=!: A complex type that contains the ResourceId element for each resource for which you want to get a list of tags.
    --resource-type=!: The type of the resources.
completion:
    flag:
        resource-type:
            - healthcheck
            - hostedzone
documentation:
    command: |-
        Lists tags for up to 10 health checks or hosted zones.

        For information about using tags for cost allocation, see [Using Cost Allocation Tags](https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-alloc-tags.html) in the *Billing and Cost Management User Guide*.
    flag:
        resource-ids: A complex type that contains the ResourceId element for each resource for which you want to get a list of tags.
        resource-type: |-
            The type of the resources.

            - The resource type for health checks is `healthcheck`.
            - The resource type for hosted zones is `hostedzone`.
