name: tag-resource
description: Adds metadata tags to a DataBrew resource, such as a dataset, project, recipe, job, or schedule.
flags:
    --resource-arn=!: The DataBrew resource to which tags should be added.
    --tags=!: One or more tags to be assigned to the resource.
documentation:
    command: Adds metadata tags to a DataBrew resource, such as a dataset, project, recipe, job, or schedule.
    flag:
        resource-arn: The DataBrew resource to which tags should be added. The value for this parameter is an Amazon Resource Name (ARN). For DataBrew, you can tag a dataset, a job, a project, or a recipe.
        tags: One or more tags to be assigned to the resource.
