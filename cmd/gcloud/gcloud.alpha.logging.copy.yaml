name: copy
description: '*(ALPHA)*  Copy log entries.'
flags:
    --billing-account=: Billing account of the log entries to copy.
    --folder=: Folder of the log entries to copy.
    --location=!: Location of the log bucket.
    --log-filter=: A filter specifying which log entries to copy.
    --organization=: Organization of the log entries to copy.
documentation:
    command: |
        *(ALPHA)*  gcloud alpha logging copy starts the process to copy log entries from a log bucket to a destination.
    flag:
        billing-account: Billing account of the log entries to copy.
        folder: Folder of the log entries to copy.
        location: Location of the log bucket.
        log-filter: A filter specifying which log entries to copy. The filter must be no more than 20k characters. An empty filter matches all log entries.
        organization: Organization of the log entries to copy.
