name: batch-update-member-ec2-deep-inspection-status
description: Activates or deactivates Amazon Inspector deep inspection for the provided member accounts in your organization.
flags:
    --account-ids=!: The unique identifiers for the Amazon Web Services accounts to change Amazon Inspector deep inspection status for.
documentation:
    command: Activates or deactivates Amazon Inspector deep inspection for the provided member accounts in your organization. You must be the delegated administrator of an organization in Amazon Inspector to use this API.
    flag:
        account-ids: The unique identifiers for the Amazon Web Services accounts to change Amazon Inspector deep inspection status for.
