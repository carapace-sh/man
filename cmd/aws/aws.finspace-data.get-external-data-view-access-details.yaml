name: get-external-data-view-access-details
description: Returns the credentials to access the external Dataview from an S3 location.
flags:
    --data-view-id=!: The unique identifier for the Dataview that you want to access.
    --dataset-id=!: The unique identifier for the Dataset.
documentation:
    command: |-
        Returns the credentials to access the external Dataview from an S3 location. To call this API:

        - You must retrieve the programmatic credentials.
        - You must be a member of a FinSpace user group, where the dataset that you want to access has `Read Dataset Data` permissions.
    flag:
        data-view-id: The unique identifier for the Dataview that you want to access.
        dataset-id: The unique identifier for the Dataset.
