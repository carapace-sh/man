name: describe
description: '*(ALPHA)*  Describe a backup plan binding.'
flags:
    --backup-channel=: Backup Channel name.
    --location=: Google Cloud location.
documentation:
    command: |
        *(ALPHA)*  Describe a Backup for GKE backup plan binding.

        ## EXAMPLES

        To describe a backup plan binding ``my-backup-plan-binding'' in project ``my-project'' in location ``us-central1'' under backup channel ``my-backup-channel'', run:

          $ gcloud alpha container backup-restore backup-plan-bindings describe my-backup-plan-binding --backup-channel=my-backup-channel --project=my-project --location=us-central1
    flag:
        backup-channel: |-
            Backup Channel name.
            +
            To set the `backup-channel` attribute:
            * provide the argument `backup_plan_binding` on the command line with a fully specified name;
            * provide the argument `--backup-channel` on the command line.
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `backup_plan_binding` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkebackup/location`.
