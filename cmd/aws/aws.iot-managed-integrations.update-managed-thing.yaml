name: update-managed-thing
description: Update the attributes and capabilities associated with a managed thing.
flags:
    --brand=: The brand of the device.
    --capabilities=: The capabilities of the device such as light bulb.
    --capability-report=: A report of the capabilities for the managed thing.
    --capability-schemas=: The updated capability schemas that define the functionality and features supported by the managed thing.
    --classification=: The classification of the managed thing such as light bulb or thermostat.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --credential-locker-id=: The identifier of the credential for the managed thing.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --hub-network-mode=: The network mode for the hub-connected device.
    --identifier=!: The id of the managed thing.
    --meta-data=: The metadata for the managed thing.
    --model=: The model of the device.
    --name=: The name of the managed thing representing the physical device.
    --owner=: Owner of the device, usually an indication of whom the device belongs to.
    --serial-number=: The serial number of the device.
completion:
    flag:
        hub-network-mode:
            - STANDARD
            - NETWORK_WIDE_EXCLUSION
documentation:
    command: Update the attributes and capabilities associated with a managed thing.
    flag:
        brand: The brand of the device.
        capabilities: The capabilities of the device such as light bulb.
        capability-report: A report of the capabilities for the managed thing.
        capability-schemas: The updated capability schemas that define the functionality and features supported by the managed thing.
        classification: The classification of the managed thing such as light bulb or thermostat.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        credential-locker-id: The identifier of the credential for the managed thing.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        hub-network-mode: The network mode for the hub-connected device.
        identifier: The id of the managed thing.
        meta-data: The metadata for the managed thing.
        model: The model of the device.
        name: The name of the managed thing representing the physical device.
        owner: Owner of the device, usually an indication of whom the device belongs to. This value should not contain personal identifiable information.
        serial-number: The serial number of the device.
