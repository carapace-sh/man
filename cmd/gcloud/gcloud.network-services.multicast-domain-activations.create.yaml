name: create
description: Create a multicast domain activation.
flags:
    --aggr-egress-pps=!: Aggregated egress Packet-Per-Second for all multicast groups in the domain in this zone.
    --aggr-ingress-pps=: Aggregated ingress Packet-Per-Second for all multicast groups in the domain in this zone.
    --async: Return immediately, without waiting for the operation in progress to
    --avg-packet-size=: Average packet size (defaults to 512 bytes).
    --description=: The description for the multicast domain activation.
    --disable-placement-policy: True to disable the use of the placement policy for this multicast domain activation.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location Id.
    --max-per-group-ingress-pps=: Maximum ingress Packet-Per-Second for a single multicast group in this zone.
    --max-per-group-subscribers=: Maximum number of subscribers for a single multicast group in this zone.
    --multicast-domain=!: The multicast domain to be used.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-disable-placement-policy&: True to disable the use of the placement policy for this multicast domain activation.
documentation:
    command: |
        Create a multicast domain activation in the specified location of the current project.
    flag:
        aggr-egress-pps: Aggregated egress Packet-Per-Second for all multicast groups in the domain in this zone.
        aggr-ingress-pps: Aggregated ingress Packet-Per-Second for all multicast groups in the domain in this zone.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        avg-packet-size: Average packet size (defaults to 512 bytes).
        description: The description for the multicast domain activation.
        disable-placement-policy: True to disable the use of the placement policy for this multicast domain activation.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location Id.
            +
            To set the `location` attribute:
            * provide the argument `multicast_domain_activation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        max-per-group-ingress-pps: Maximum ingress Packet-Per-Second for a single multicast group in this zone.
        max-per-group-subscribers: Maximum number of subscribers for a single multicast group in this zone.
        multicast-domain: The multicast domain to be used.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-disable-placement-policy: |
            True to disable the use of the placement policy for this multicast domain activation.
