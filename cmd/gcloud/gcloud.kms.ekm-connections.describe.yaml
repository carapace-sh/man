name: describe
description: Get metadata for an ekmconnection.
flags:
    --location=: The Google Cloud location for the ekmconnection.
documentation:
    command: |-
        Returns metadata for the given ekmconnection.

        ## EXAMPLES

        The following command returns the metadata for the ekmconnection `laplace`
        in the location `us-east1`:

          $ gcloud kms ekm-connections describe laplace --location=us-east1
    flag:
        location: |-
            The Google Cloud location for the ekmconnection.
            +
            To set the `location` attribute:
            * provide the argument `ekm_connection` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
