name: update-application-component-config
description: Updates the configuration of an application component.
flags:
    --app-type=: The type of known component.
    --application-component-id=!: The ID of the application component.
    --configure-only: Update the configuration request of an application component.
    --inclusion-status=: Indicates whether the application component has been included for server recommendation or not.
    --no-configure-only&: Update the configuration request of an application component.
    --secrets-manager-key=: Database credentials.
    --source-code-list=: The list of source code configurations to update for the application component.
    --strategy-option=: The preferred strategy options for the application component.
completion:
    flag:
        app-type:
            - DotNetFramework
            - Java
            - SQLServer
            - IIS
            - Oracle
            - Other
            - Tomcat
            - JBoss
            - Spring
            - Mongo DB
            - DB2
            - Maria DB
            - MySQL
            - Sybase
            - PostgreSQLServer
            - Cassandra
            - IBM WebSphere
            - Oracle WebLogic
            - Visual Basic
            - Unknown
            - DotnetCore
            - Dotnet
        inclusion-status:
            - excludeFromAssessment
            - includeInAssessment
documentation:
    command: Updates the configuration of an application component.
    flag:
        app-type: The type of known component.
        application-component-id: The ID of the application component. The ID is unique within an AWS account.
        configure-only: Update the configuration request of an application component. If it is set to true, the source code and/or database credentials are updated. If it is set to false, the source code and/or database credentials are updated and an analysis is initiated.
        inclusion-status: Indicates whether the application component has been included for server recommendation or not.
        secrets-manager-key: Database credentials.
        source-code-list: The list of source code configurations to update for the application component.
        strategy-option: The preferred strategy options for the application component. Use values from the [GetApplicationComponentStrategies]() response.
