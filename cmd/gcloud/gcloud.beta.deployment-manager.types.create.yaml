name: create
description: '*(BETA)*  Create a type.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: Optional description of the composite type.
    --labels=: List of label KEY=VALUE pairs to add.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --status=: Optional status for a composite type.
    --template=!: Path to a python or jinja file (local or via URL) that defines the composite type.
completion:
    flag:
        status:
            - DEPRECATED
            - EXPERIMENTAL
            - SUPPORTED
documentation:
    command: |-
        *(BETA)*  This command inserts (creates) a new composite type based on a provided
        configuration file.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: Optional description of the composite type.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        status: 'Optional status for a composite type. _STATUS_ must be one of: *DEPRECATED*, *EXPERIMENTAL*, *SUPPORTED*.'
        template: 'Path to a python or jinja file (local or via URL) that defines the composite type. If you want to provide a schema, that file must be in the same location: e.g. "--template=./foobar.jinja" means "./foobar.jinja.schema" should also exist. The file must end in either ".jinja" or ".py" to be interpreted correctly.'
