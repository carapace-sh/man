name: list-insights-metric-data
description: Returns Insights metrics data for trails that have enabled Insights.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --data-type=: Type of data points to return.
    --end-time=: Specifies, in UTC, the end time for time-series data.
    --error-code=: Conditionally required if the `InsightType` parameter is set to `ApiErrorRateInsight`.
    --event-name=!: The name of the event, typically the Amazon Web Services API on which unusual levels of activity were recorded.
    --event-source=!: The Amazon Web Services service to which the request was made, such as `iam.amazonaws.com` or `s3.amazonaws.com`.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --insight-type=!: The type of CloudTrail Insights event, which is either `ApiCallRateInsight` or `ApiErrorRateInsight`.
    --max-results=: The maximum number of data points to return.
    --next-token=: Returned if all datapoints can't be returned in a single call.
    --period=: Granularity of data to retrieve, in seconds.
    --start-time=: Specifies, in UTC, the start time for time-series data.
    --trail-name=: The Amazon Resource Name(ARN) or name of the trail for which you want to retrieve Insights metrics data.
completion:
    flag:
        data-type:
            - FillWithZeros
            - NonZeroData
        insight-type:
            - ApiCallRateInsight
            - ApiErrorRateInsight
documentation:
    command: |-
        Returns Insights metrics data for trails that have enabled Insights. The request must include the `EventSource`, `EventName`, and `InsightType` parameters.

        If the `InsightType` is set to `ApiErrorRateInsight`, the request must also include the `ErrorCode` parameter.

        The following are the available time periods for `ListInsightsMetricData`. Each cutoff is inclusive.

        - Data points with a period of 60 seconds (1-minute) are available for 15 days.
        - Data points with a period of 300 seconds (5-minute) are available for 63 days.
        - Data points with a period of 3600 seconds (1 hour) are available for 90 days.

        To use `ListInsightsMetricData` operation, you must have the following permissions:

        - If `ListInsightsMetricData` is invoked with `TrailName` parameter, access to the `ListInsightsMetricData` API operation is linked to the `cloudtrail:LookupEvents` action and `cloudtrail:ListInsightsData`. To use this operation, you must have permissions to perform the `cloudtrail:LookupEvents` and `cloudtrail:ListInsightsData` action on the specific trail.
        - If `ListInsightsMetricData` is invoked without `TrailName` parameter, access to the `ListInsightsMetricData` API operation is linked to the `cloudtrail:LookupEvents` action only. To use this operation, you must have permissions to perform the `cloudtrail:LookupEvents` action.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        data-type: Type of data points to return. Valid values are `NonZeroData` and `FillWithZeros`. The default is `NonZeroData`.
        end-time: |-
            Specifies, in UTC, the end time for time-series data. The value specified is exclusive; results include data points up to the specified time stamp.

            The default is the time of request.
        error-code: |-
            Conditionally required if the `InsightType` parameter is set to `ApiErrorRateInsight`.

            If returning metrics for the `ApiErrorRateInsight` Insights type, this is the error to retrieve data for. For example, `AccessDenied`.
        event-name: The name of the event, typically the Amazon Web Services API on which unusual levels of activity were recorded.
        event-source: The Amazon Web Services service to which the request was made, such as `iam.amazonaws.com` or `s3.amazonaws.com`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        insight-type: The type of CloudTrail Insights event, which is either `ApiCallRateInsight` or `ApiErrorRateInsight`. The `ApiCallRateInsight` Insights type analyzes write-only management API calls that are aggregated per minute against a baseline API call volume. The `ApiErrorRateInsight` Insights type analyzes management API calls that result in error codes.
        max-results: The maximum number of data points to return. Valid values are integers from 1 to 21600. The default value is 21600.
        next-token: |-
            Returned if all datapoints can't be returned in a single call. For example, due to reaching `MaxResults`.

            Add this parameter to the request to continue retrieving results starting from the last evaluated point.
        period: Granularity of data to retrieve, in seconds. Valid values are `60`, `300`, and `3600`. If you specify any other value, you will get an error. The default is 3600 seconds.
        start-time: |-
            Specifies, in UTC, the start time for time-series data. The value specified is inclusive; results include data points with the specified time stamp.

            The default is 90 days before the time of request.
        trail-name: The Amazon Resource Name(ARN) or name of the trail for which you want to retrieve Insights metrics data. This parameter should only be provided to fetch Insights metrics data generated on trails logging data events. This parameter is not required for Insights metric data generated on trails logging management events.
