documentation:
    command: '*(ALPHA)*  Update a Security Command Center finding.'
    flag:
        api-version: |-
            This is a temporary flag to be used for testing the Security Command
            Center v2 api before its launch.
        event-time: |-
            Time at which the event took place. For example, if the finding
              represents an open firewall it would capture the time the open firewall
              was detected. If event-time is not provided, it will default to UTC
              version of NOW. See `$ gcloud topic datetimes` for information on
              supported time formats.
        external-uri: |-
            URI that, if available, points to a web page outside of Cloud SCC (Security Command Center)
                where additional information about the finding can be found. This field is guaranteed to be
                either empty or a well formed URL.
        folder: The folder ID (e.g., 456) that contains the finding.
        location: |-
            When data residency controls are enabled, this attribute specifies the location in which
            the resource is located and applicable. The `location` attribute can be
            provided as part of the fully specified resource name or with the `--location`
            argument on the command line. The default location is `global`.
            +
            NOTE: If you override the endpoint to a [regional endpoint](https://cloud.google.com/security-command-center/docs/reference/rest/index.html?rep_location=global#regional-service-endpoint)
            you must specify the correct [data location](https://cloud.google.com/security-command-center/docs/data-residency-support#locations) using this flag.
            The default location on this command is unrelated to the default location
            that is specified when data residency controls are enabled
            for Security Command Center.
            +
            NOTE: If no location is specified, the default location is `global` AND
            the request will be routed to the SCC V1 API. To use the SCC V2 API - please explicitly specify the flag.
        organization: The organization ID (e.g., 123) that contains the finding.
        source: Source id. Defaults to all sources.
        source-properties: |-
            Source specific properties. These properties are managed by the
                  source that writes the finding. The key names in the source_properties map
                  must be between 1 and 255 characters, and must start with a letter and
                  contain alphanumeric characters or underscores only. For example
                  "key1=val1,key2=val2"
        state: 'State is one of: [ACTIVE, INACTIVE]. _STATE_ must be one of: *active*, *inactive*, *state-unspecified*.'
        update-mask: |-
            Optional: If left unspecified (default), an update-mask is automatically
            created using the flags specified in the command and only those values
            are updated. For example: --external-uri='<some-uri>'
            --event-time='<some-time>' would automatically generate
            --update-mask='external_uri,event_time'. Note that as a result, only
            external-uri and event-time are updated for the given finding and
            everything else remains untouched. If you want to delete
            attributes/properties (that are not being changed in the update command)
            use an empty update-mask (''). That will delete all the mutable
            properties/attributes that aren't specified as flags in the update
            command. In the above example it would delete source-properties.
            State can be toggled from ACTIVE to INACTIVE and vice-versa but it
            cannot be deleted.
