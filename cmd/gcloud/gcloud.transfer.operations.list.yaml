name: list
description: List Transfer Service transfer operations.
flags:
    --expand-table: Include additional table columns (operation name, start time, status, data copied, status, has errors, job name) in command output.
    --job-names=: The names of the jobs whose operations you want to list.
    --limit=: Return the first items from the API up to this limit.
    --no-expand-table&: Include additional table columns (operation name, start time, status, data copied, status, has errors, job name) in command output.
    --operation-names=: The names of operations you want to list.
    --operation-statuses=: List only transfer operations with the statuses you specify.
    --page-size=: Retrieve batches of this many items from the API.
documentation:
    command: |
        List Transfer Service transfer operations to view their progress details
        at a glance.
    flag:
        expand-table: 'Include additional table columns (operation name, start time, status, data copied, status, has errors, job name) in command output. Tip: increase the size of your terminal before running the command.'
        job-names: The names of the jobs whose operations you want to list. Separate multiple job names with commas (e.g., --job-names=foo,bar). If not specified, operations for all jobs are listed.
        limit: Return the first items from the API up to this limit.
        no-expand-table: 'Include additional table columns (operation name, start time, status, data copied, status, has errors, job name) in command output. Tip: increase the size of your terminal before running the command.'
        operation-names: The names of operations you want to list. Separate multiple operation names with commas (e.g., --operation-names-name=foo,bar). If not specified, all operations are listed.
        operation-statuses: List only transfer operations with the statuses you specify. Options include 'in_progress', 'paused', 'success','failed', 'aborted'. Separate multiple statuses with commas (e.g., --operation-statuses=failed,aborted).
        page-size: Retrieve batches of this many items from the API.
