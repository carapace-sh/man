name: respond-decision-task-completed
description: Used by deciders to tell the service that the [DecisionTask]() identified by the `taskToken` has successfully completed.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --decisions=:
        description: The list of decisions (possibly empty) made by the decider while processing this decision task.
        nargs: -1
    --execution-context=: User defined context to add to workflow execution.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --task-list-schedule-to-start-timeout=: Specifies a timeout (in seconds) for the task list override.
    --task-list=: The task list to use for the future decision tasks of this workflow execution.
    --task-token=!: The `taskToken` from the [DecisionTask]().
documentation:
    command: |-
        Used by deciders to tell the service that the [DecisionTask]() identified by the `taskToken` has successfully completed. The `decisions` argument specifies the list of decisions made while processing the task.

        A `DecisionTaskCompleted` event is added to the workflow history. The `executionContext` specified is attached to the event in the workflow execution history.

        **Access Control**

        If an IAM policy grants permission to use `RespondDecisionTaskCompleted`, it can express permissions for the list of decisions in the `decisions` parameter. Each of the decisions has one or more parameters, much like a regular API call. To allow for policies to be as readable as possible, you can express permissions on decisions as if they were actual API calls, including applying conditions to some parameters. For more information, see [Using IAM to Manage Access to Amazon SWF Workflows](https://docs.aws.amazon.com/amazonswf/latest/developerguide/swf-dev-iam.html) in the *Amazon SWF Developer Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        decisions: The list of decisions (possibly empty) made by the decider while processing this decision task. See the docs for the [Decision]() structure for details.
        execution-context: User defined context to add to workflow execution.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        task-list: The task list to use for the future decision tasks of this workflow execution. This list overrides the original task list you specified while starting the workflow execution.
        task-list-schedule-to-start-timeout: |-
            Specifies a timeout (in seconds) for the task list override. When this parameter is missing, the task list override is permanent. This parameter makes it possible to temporarily override the task list. If a decision task scheduled on the override task list is not started within the timeout, the decision task will time out. Amazon SWF will revert the override and schedule a new decision task to the original task list.

            If a decision task scheduled on the override task list is started within the timeout, but not completed within the start-to-close timeout, Amazon SWF will also revert the override and schedule a new decision task to the original task list.
        task-token: |-
            The `taskToken` from the [DecisionTask]().

            `taskToken` is generated by the service and should be treated as an opaque value. If the task is passed to another process, its `taskToken` must also be passed. This enables it to provide its progress and respond with results.
