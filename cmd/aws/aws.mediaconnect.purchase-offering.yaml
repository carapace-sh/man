name: purchase-offering
description: Submits a request to purchase an offering.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --offering-arn=!: The Amazon Resource Name (ARN) of the offering.
    --reservation-name=!: The name that you want to use for the reservation.
    --start=!: The date and time that you want the reservation to begin, in Coordinated Universal Time (UTC).
documentation:
    command: Submits a request to purchase an offering. If you already have an active reservation, you can't purchase another offering.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        offering-arn: The Amazon Resource Name (ARN) of the offering.
        reservation-name: The name that you want to use for the reservation.
        start: |-
            The date and time that you want the reservation to begin, in Coordinated Universal Time (UTC).

            You can specify any date and time between 12:00am on the first day of the current month to the current time on today's date, inclusive. Specify the start in a 24-hour notation. Use the following format: `YYYY-MM-DDTHH:mm:SSZ`, where `T` and `Z` are literal characters. For example, to specify 11:30pm on March 5, 2020, enter `2020-03-05T23:30:00Z`.
