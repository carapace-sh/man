name: list-anomalies-for-insight
description: Returns a list of the anomalies that belong to an insight that you specify using its ID.
flags:
    --account-id=: The ID of the Amazon Web Services account.
    --filters=: Specifies one or more service names that are used to list anomalies.
    --insight-id=!: The ID of the insight.
    --max-results=: The maximum number of results to return with a single call.
    --next-token=: The pagination token to use to retrieve the next page of results for this operation.
    --start-time-range=: A time range used to specify when the requested anomalies started.
documentation:
    command: Returns a list of the anomalies that belong to an insight that you specify using its ID.
    flag:
        account-id: The ID of the Amazon Web Services account.
        filters: Specifies one or more service names that are used to list anomalies.
        insight-id: The ID of the insight. The returned anomalies belong to this insight.
        max-results: The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned `nextToken` value.
        next-token: The pagination token to use to retrieve the next page of results for this operation. If this value is null, it retrieves the first page.
        start-time-range: A time range used to specify when the requested anomalies started. All returned anomalies started during this time range.
