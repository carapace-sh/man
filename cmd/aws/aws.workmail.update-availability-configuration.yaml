name: update-availability-configuration
description: Updates an existing `AvailabilityConfiguration` for the given WorkMail organization and domain.
flags:
    --domain-name=!: The domain to which the provider applies the availability configuration.
    --ews-provider=: The EWS availability provider definition.
    --lambda-provider=: The Lambda availability provider definition.
    --organization-id=!: The WorkMail organization for which the `AvailabilityConfiguration` will be updated.
documentation:
    command: Updates an existing `AvailabilityConfiguration` for the given WorkMail organization and domain.
    flag:
        domain-name: The domain to which the provider applies the availability configuration.
        ews-provider: The EWS availability provider definition. The request must contain exactly one provider definition, either `EwsProvider` or `LambdaProvider`. The previously stored provider will be overridden by the one provided.
        lambda-provider: The Lambda availability provider definition. The request must contain exactly one provider definition, either `EwsProvider` or `LambdaProvider`. The previously stored provider will be overridden by the one provided.
        organization-id: The WorkMail organization for which the `AvailabilityConfiguration` will be updated.
