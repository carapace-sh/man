name: import-dataset
description: Imports a dataset.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=!: A unique identifier for the request.
    --dataset-name=: The name of the machine learning dataset to be created.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --server-side-kms-key-id=: Provides the identifier of the KMS key key used to encrypt model data by Amazon Lookout for Equipment.
    --source-dataset-arn=!: The Amazon Resource Name (ARN) of the dataset to import.
    --tags=: Any tags associated with the dataset to be created.
documentation:
    command: Imports a dataset.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique identifier for the request. If you do not set the client request token, Amazon Lookout for Equipment generates one.
        dataset-name: The name of the machine learning dataset to be created. If the dataset already exists, Amazon Lookout for Equipment overwrites the existing dataset. If you don't specify this field, it is filled with the name of the source dataset.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        server-side-kms-key-id: Provides the identifier of the KMS key key used to encrypt model data by Amazon Lookout for Equipment.
        source-dataset-arn: The Amazon Resource Name (ARN) of the dataset to import.
        tags: Any tags associated with the dataset to be created.
