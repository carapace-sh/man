name: create-presigned-notebook-url
description: Gets an authentication token and the URL at which the notebook can be accessed.
flags:
    --session-id=!: The session ID.
documentation:
    command: Gets an authentication token and the URL at which the notebook can be accessed. During programmatic access, `CreatePresignedNotebookUrl` must be called every 10 minutes to refresh the authentication token. For information about granting programmatic access, see [Grant programmatic access](https://docs.aws.amazon.com/athena/latest/ug/setting-up.html#setting-up-grant-programmatic-access).
    flag:
        session-id: The session ID.
