name: get-repository-endpoint
description: Returns the endpoint of a repository for a specific package format.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-owner=: The 12-digit account number of the Amazon Web Services account that owns the domain that contains the repository.
    --domain=!: The name of the domain that contains the repository.
    --endpoint-type=: A string that specifies the type of endpoint.
    --format=!: Returns which endpoint of a repository to return.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --repository=!: The name of the repository.
completion:
    flag:
        endpoint-type:
            - dualstack
            - ipv4
        format:
            - npm
            - pypi
            - maven
            - nuget
            - generic
            - ruby
            - swift
            - cargo
documentation:
    command: |-
        Returns the endpoint of a repository for a specific package format. A repository has one endpoint for each package format:

        - `cargo`
        - `generic`
        - `maven`
        - `npm`
        - `nuget`
        - `pypi`
        - `ruby`
        - `swift`
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain: The name of the domain that contains the repository.
        domain-owner: The 12-digit account number of the Amazon Web Services account that owns the domain that contains the repository. It does not include dashes or spaces.
        endpoint-type: A string that specifies the type of endpoint.
        format: Returns which endpoint of a repository to return. A repository has one endpoint for each package format.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        repository: The name of the repository.
