name: tag-resource
description: Applies tags to an existing Amazon Web Services X-Ray group or sampling rule.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --resource-arn=!: The Amazon Resource Number (ARN) of an X-Ray group or sampling rule.
    --tags=!: A map that contains one or more tag keys and tag values to attach to an X-Ray group or sampling rule.
documentation:
    command: Applies tags to an existing Amazon Web Services X-Ray group or sampling rule.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        resource-arn: The Amazon Resource Number (ARN) of an X-Ray group or sampling rule.
        tags: |-
            A map that contains one or more tag keys and tag values to attach to an X-Ray group or sampling rule. For more information about ways to use tags, see [Tagging Amazon Web Services resources](https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html) in the *Amazon Web Services General Reference*.

            The following restrictions apply to tags:

            - Maximum number of user-applied tags per resource: 50
            - Maximum tag key length: 128 Unicode characters
            - Maximum tag value length: 256 Unicode characters
            - Valid values for key and value: a-z, A-Z, 0-9, space, and the following characters: _ . : / = + - and @
            - Tag keys and values are case sensitive.
            - Don't use `aws:` as a prefix for keys; it's reserved for Amazon Web Services use. You cannot edit or delete system tags.
