name: delete-destination
description: Deletes the specified destination, and eventually disables all the subscription filters that publish to it.
flags:
    --destination-name=!: The name of the destination.
documentation:
    command: Deletes the specified destination, and eventually disables all the subscription filters that publish to it. This operation does not delete the physical resource encapsulated by the destination.
    flag:
        destination-name: The name of the destination.
