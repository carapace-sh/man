name: list-monitoring-executions
description: Returns list of all monitoring job executions.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --creation-time-after=: A filter that returns only jobs created after a specified time.
    --creation-time-before=: A filter that returns only jobs created before a specified time.
    --endpoint-name=: Name of a specific endpoint to fetch jobs for.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --last-modified-time-after=: A filter that returns only jobs modified before a specified time.
    --last-modified-time-before=: A filter that returns only jobs modified after a specified time.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of jobs to return in the response.
    --monitoring-job-definition-name=: Gets a list of the monitoring job runs of the specified monitoring job definitions.
    --monitoring-schedule-name=: Name of a specific schedule to fetch jobs for.
    --monitoring-type-equals=: A filter that returns only the monitoring job runs of the specified monitoring type.
    --next-token=: The token returned if the response is truncated.
    --page-size=: The size of each page to get in the AWS service call.
    --scheduled-time-after=: Filter for jobs scheduled after a specified time.
    --scheduled-time-before=: Filter for jobs scheduled before a specified time.
    --sort-by=: Whether to sort the results by the `Status`, `CreationTime`, or `ScheduledTime` field.
    --sort-order=: Whether to sort the results in `Ascending` or `Descending` order.
    --starting-token=: A token to specify where to start paginating.
    --status-equals=: A filter that retrieves only jobs with a specific status.
completion:
    flag:
        monitoring-type-equals:
            - DataQuality
            - ModelQuality
            - ModelBias
            - ModelExplainability
        sort-by:
            - CreationTime
            - ScheduledTime
            - Status
        sort-order:
            - Ascending
            - Descending
        status-equals:
            - Pending
            - Completed
            - CompletedWithViolations
            - InProgress
            - Failed
            - Stopping
            - Stopped
documentation:
    command: Returns list of all monitoring job executions.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        creation-time-after: A filter that returns only jobs created after a specified time.
        creation-time-before: A filter that returns only jobs created before a specified time.
        endpoint-name: Name of a specific endpoint to fetch jobs for.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        last-modified-time-after: A filter that returns only jobs modified before a specified time.
        last-modified-time-before: A filter that returns only jobs modified after a specified time.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of jobs to return in the response. The default value is 10.
        monitoring-job-definition-name: Gets a list of the monitoring job runs of the specified monitoring job definitions.
        monitoring-schedule-name: Name of a specific schedule to fetch jobs for.
        monitoring-type-equals: A filter that returns only the monitoring job runs of the specified monitoring type.
        next-token: The token returned if the response is truncated. To retrieve the next set of job executions, use it in the next request.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        scheduled-time-after: Filter for jobs scheduled after a specified time.
        scheduled-time-before: Filter for jobs scheduled before a specified time.
        sort-by: Whether to sort the results by the `Status`, `CreationTime`, or `ScheduledTime` field. The default is `CreationTime`.
        sort-order: Whether to sort the results in `Ascending` or `Descending` order. The default is `Descending`.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        status-equals: A filter that retrieves only jobs with a specific status.
