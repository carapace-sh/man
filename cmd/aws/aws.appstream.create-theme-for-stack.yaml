name: create-theme-for-stack
description: Creates custom branding that customizes the appearance of the streaming application catalog page.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --favicon-s3-location=!: The S3 location of the favicon.
    --footer-links=:
        description: The links that are displayed in the footer of the streaming application catalog page.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --organization-logo-s3-location=!: The organization logo that appears on the streaming application catalog page.
    --stack-name=!: The name of the stack for the theme.
    --theme-styling=!: The color theme that is applied to website links, text, and buttons.
    --title-text=!: The title that is displayed at the top of the browser tab during users' application streaming sessions.
completion:
    flag:
        theme-styling:
            - LIGHT_BLUE
            - BLUE
            - PINK
            - RED
documentation:
    command: Creates custom branding that customizes the appearance of the streaming application catalog page.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        favicon-s3-location: The S3 location of the favicon. The favicon enables users to recognize their application streaming site in a browser full of tabs or bookmarks. It is displayed at the top of the browser tab for the application streaming site during users' streaming sessions.
        footer-links: The links that are displayed in the footer of the streaming application catalog page. These links are helpful resources for users, such as the organization's IT support and product marketing sites.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        organization-logo-s3-location: The organization logo that appears on the streaming application catalog page.
        stack-name: The name of the stack for the theme.
        theme-styling: The color theme that is applied to website links, text, and buttons. These colors are also applied as accents in the background for the streaming application catalog page.
        title-text: The title that is displayed at the top of the browser tab during users' application streaming sessions.
