name: delete-cluster
description: Deletes a cluster.
flags:
    --cluster-name=!: The name of the cluster to be deleted
    --final-snapshot-name=: The user-supplied name of a final cluster snapshot.
    --multi-region-cluster-name=: The name of the multi-Region cluster to be deleted.
documentation:
    command: |-
        Deletes a cluster. It also deletes all associated nodes and node endpoints.

        `CreateSnapshot` permission is required to create a final snapshot. Without this permission, the API call will fail with an `Access Denied` exception.
    flag:
        cluster-name: The name of the cluster to be deleted
        final-snapshot-name: The user-supplied name of a final cluster snapshot. This is the unique name that identifies the snapshot. MemoryDB creates the snapshot, and then deletes the cluster immediately afterward.
        multi-region-cluster-name: The name of the multi-Region cluster to be deleted.
