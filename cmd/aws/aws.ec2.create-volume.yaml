name: create-volume
description: Creates an EBS volume that can be attached to an instance in the same Availability Zone.
flags:
    --availability-zone-id=: The ID of the Availability Zone in which to create the volume.
    --availability-zone=: The ID of the Availability Zone in which to create the volume.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --encrypted: Indicates whether the volume should be encrypted.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --iops=: The number of I/O operations per second (IOPS).
    --kms-key-id=: The identifier of the KMS key to use for Amazon EBS encryption.
    --multi-attach-enabled: Indicates whether to enable Amazon EBS Multi-Attach.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-encrypted: Indicates whether the volume should be encrypted.
    --no-multi-attach-enabled: Indicates whether to enable Amazon EBS Multi-Attach.
    --operator=: Reserved for internal use.
    --outpost-arn=: The Amazon Resource Name (ARN) of the Outpost on which to create the volume.
    --size=: The size of the volume, in GiBs.
    --snapshot-id=: The snapshot from which to create the volume.
    --tag-specifications=: The tags to apply to the volume during creation.
    --throughput=: The throughput to provision for a volume, with a maximum of 2,000 MiB/s.
    --volume-initialization-rate=: Specifies the Amazon EBS Provisioned Rate for Volume Initialization (volume initialization rate), in MiB/s, at which to download the snapshot blocks from Amazon S3 to the volume.
    --volume-type=: The volume type.
completion:
    flag:
        volume-type:
            - standard
            - io1
            - io2
            - gp2
            - sc1
            - st1
            - gp3
documentation:
    command: |-
        Creates an EBS volume that can be attached to an instance in the same Availability Zone.

        You can create a new empty volume or restore a volume from an EBS snapshot. Any Amazon Web Services Marketplace product codes from the snapshot are propagated to the volume.

        You can create encrypted volumes. Encrypted volumes must be attached to instances that support Amazon EBS encryption. Volumes that are created from encrypted snapshots are also automatically encrypted. For more information, see [Amazon EBS encryption](https://docs.aws.amazon.com/ebs/latest/userguide/ebs-encryption.html) in the *Amazon EBS User Guide*.

        You can tag your volumes during creation. For more information, see [Tag your Amazon EC2 resources](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Using_Tags.html) in the *Amazon EC2 User Guide*.

        For more information, see [Create an Amazon EBS volume](https://docs.aws.amazon.com/ebs/latest/userguide/ebs-creating-volume.html) in the *Amazon EBS User Guide*.
    flag:
        availability-zone: |-
            The ID of the Availability Zone in which to create the volume. For example, `us-east-1a`.

            Either `AvailabilityZone` or `AvailabilityZoneId` must be specified, but not both.
        availability-zone-id: |-
            The ID of the Availability Zone in which to create the volume. For example, `use1-az1`.

            Either `AvailabilityZone` or `AvailabilityZoneId` must be specified, but not both.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request. For more information, see [Ensure Idempotency](https://docs.aws.amazon.com/ec2/latest/devguide/ec2-api-idempotency.html).
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        encrypted: |-
            Indicates whether the volume should be encrypted. The effect of setting the encryption state to `true` depends on the volume origin (new or from a snapshot), starting encryption state, ownership, and whether encryption by default is enabled. For more information, see [Encryption by default](https://docs.aws.amazon.com/ebs/latest/userguide/work-with-ebs-encr.html#encryption-by-default) in the *Amazon EBS User Guide*.

            Encrypted Amazon EBS volumes must be attached to instances that support Amazon EBS encryption. For more information, see [Supported instance types](https://docs.aws.amazon.com/ebs/latest/userguide/ebs-encryption-requirements.html#ebs-encryption_supported_instances).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        iops: |-
            The number of I/O operations per second (IOPS). For `gp3`, `io1`, and `io2` volumes, this represents the number of IOPS that are provisioned for the volume. For `gp2` volumes, this represents the baseline performance of the volume and the rate at which the volume accumulates I/O credits for bursting.

            The following are the supported values for each volume type:

            - `gp3`: 3,000 - 80,000 IOPS
            - `io1`: 100 - 64,000 IOPS
            - `io2`: 100 - 256,000 IOPS

            For `io2` volumes, you can achieve up to 256,000 IOPS on [instances built on the Nitro System](https://docs.aws.amazon.com/ec2/latest/instancetypes/ec2-nitro-instances.html). On other instances, you can achieve performance up to 32,000 IOPS.

            This parameter is required for `io1` and `io2` volumes. The default for `gp3` volumes is 3,000 IOPS. This parameter is not supported for `gp2`, `st1`, `sc1`, or `standard` volumes.
        kms-key-id: |-
            The identifier of the KMS key to use for Amazon EBS encryption. If this parameter is not specified, your KMS key for Amazon EBS is used. If `KmsKeyId` is specified, the encrypted state must be `true`.

            You can specify the KMS key using any of the following:

            - Key ID. For example, 1234abcd-12ab-34cd-56ef-1234567890ab.
            - Key alias. For example, alias/ExampleAlias.
            - Key ARN. For example, arn:aws:kms:us-east-1:012345678910:key/1234abcd-12ab-34cd-56ef-1234567890ab.
            - Alias ARN. For example, arn:aws:kms:us-east-1:012345678910:alias/ExampleAlias.

            Amazon Web Services authenticates the KMS key asynchronously. Therefore, if you specify an ID, alias, or ARN that is not valid, the action can appear to complete, but eventually fails.
        multi-attach-enabled: Indicates whether to enable Amazon EBS Multi-Attach. If you enable Multi-Attach, you can attach the volume to up to 16 [Instances built on the Nitro System](https://docs.aws.amazon.com/ec2/latest/instancetypes/ec2-nitro-instances.html) in the same Availability Zone. This parameter is supported with `io1` and `io2` volumes only. For more information, see [Amazon EBS Multi-Attach](https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volumes-multi.html) in the *Amazon EBS User Guide*.
        operator: Reserved for internal use.
        outpost-arn: |-
            The Amazon Resource Name (ARN) of the Outpost on which to create the volume.

            If you intend to use a volume with an instance running on an outpost, then you must create the volume on the same outpost as the instance. You can't use a volume created in an Amazon Web Services Region with an instance on an Amazon Web Services outpost, or the other way around.
        size: |-
            The size of the volume, in GiBs. You must specify either a snapshot ID or a volume size. If you specify a snapshot, the default is the snapshot size. You can specify a volume size that is equal to or larger than the snapshot size.

            The following are the supported volumes sizes for each volume type:

            - `gp2`: 1 - 16,384 GiB
            - `gp3`: 1 - 65,536 GiB
            - `io1`: 4 - 16,384 GiB
            - `io2`: 4 - 65,536 GiB
            - `st1` and `sc1`: 125 - 16,384 GiB
            - `standard`: 1 - 1024 GiB
        snapshot-id: The snapshot from which to create the volume. You must specify either a snapshot ID or a volume size.
        tag-specifications: The tags to apply to the volume during creation.
        throughput: |-
            The throughput to provision for a volume, with a maximum of 2,000 MiB/s.

            This parameter is valid only for `gp3` volumes.

            Valid Range: Minimum value of 125. Maximum value of 2,000.
        volume-initialization-rate: "Specifies the Amazon EBS Provisioned Rate for Volume Initialization (volume initialization rate), in MiB/s, at which to download the snapshot blocks from Amazon S3 to the volume. This is also known as *volume initialization*. Specifying a volume initialization rate ensures that the volume is initialized at a predictable and consistent rate after creation.\n\nThis parameter is supported only for volumes created from snapshots. Omit this parameter if:\n\n- You want to create the volume using fast snapshot restore. You must specify a snapshot that is enabled for fast snapshot restore. In this case, the volume is fully initialized at creation.\n  \n  If you specify a snapshot that is enabled for fast snapshot restore and a volume initialization rate, the volume will be initialized at the specified rate instead of fast snapshot restore.\n- You want to create a volume that is initialized at the default rate.\n\nFor more information, see [Initialize Amazon EBS volumes](https://docs.aws.amazon.com/ebs/latest/userguide/initalize-volume.html) in the *Amazon EC2 User Guide*.\n\nValid range: 100 - 300 MiB/s"
        volume-type: |-
            The volume type. This parameter can be one of the following values:

            - General Purpose SSD: `gp2` | `gp3`
            - Provisioned IOPS SSD: `io1` | `io2`
            - Throughput Optimized HDD: `st1`
            - Cold HDD: `sc1`
            - Magnetic: `standard`

            Throughput Optimized HDD (`st1`) and Cold HDD (`sc1`) volumes can't be used as boot volumes.

            For more information, see [Amazon EBS volume types](https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volume-types.html) in the *Amazon EBS User Guide*.

            Default: `gp2`
