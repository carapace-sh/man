name: create-classification-job
description: Creates and defines the settings for a classification job.
flags:
    --allow-list-ids=: An array of unique identifiers, one for each allow list for the job to use when it analyzes data.
    --client-token=!: A unique, case-sensitive token that you provide to ensure the idempotency of the request.
    --custom-data-identifier-ids=: An array of unique identifiers, one for each custom data identifier for the job to use when it analyzes data.
    --description=: A custom description of the job.
    --initial-run=: For a recurring job, specifies whether to analyze all existing, eligible objects immediately after the job is created (true).
    --job-type=!: The schedule for running the job.
    --managed-data-identifier-ids=: An array of unique identifiers, one for each managed data identifier for the job to include (use) or exclude (not use) when it analyzes data.
    --managed-data-identifier-selector=: The selection type to apply when determining which managed data identifiers the job uses to analyze data.
    --name=!: A custom name for the job.
    --s3-job-definition=!: The S3 buckets that contain the objects to analyze, and the scope of that analysis.
    --sampling-percentage=: The sampling depth, as a percentage, for the job to apply when processing objects.
    --schedule-frequency=: The recurrence pattern for running the job.
    --tags=: A map of key-value pairs that specifies the tags to associate with the job.
completion:
    flag:
        job-type:
            - ONE_TIME
            - SCHEDULED
        managed-data-identifier-selector:
            - ALL
            - EXCLUDE
            - INCLUDE
            - NONE
            - RECOMMENDED
documentation:
    command: Creates and defines the settings for a classification job.
    flag:
        allow-list-ids: An array of unique identifiers, one for each allow list for the job to use when it analyzes data.
        client-token: A unique, case-sensitive token that you provide to ensure the idempotency of the request.
        custom-data-identifier-ids: An array of unique identifiers, one for each custom data identifier for the job to use when it analyzes data. To use only managed data identifiers, don't specify a value for this property and specify a value other than NONE for the managedDataIdentifierSelector property.
        description: A custom description of the job. The description can contain as many as 200 characters.
        initial-run: |-
            For a recurring job, specifies whether to analyze all existing, eligible objects immediately after the job is created (true). To analyze only those objects that are created or changed after you create the job and before the job's first scheduled run, set this value to false.

            If you configure the job to run only once, don't specify a value for this property.
        job-type: |-
            The schedule for running the job. Valid values are:

            - ONE\_TIME - Run the job only once. If you specify this value, don't specify a value for the scheduleFrequency property.
            - SCHEDULED - Run the job on a daily, weekly, or monthly basis. If you specify this value, use the scheduleFrequency property to specify the recurrence pattern for the job.
        managed-data-identifier-ids: |-
            An array of unique identifiers, one for each managed data identifier for the job to include (use) or exclude (not use) when it analyzes data. Inclusion or exclusion depends on the managed data identifier selection type that you specify for the job (managedDataIdentifierSelector).

            To retrieve a list of valid values for this property, use the ListManagedDataIdentifiers operation.
        managed-data-identifier-selector: |-
            The selection type to apply when determining which managed data identifiers the job uses to analyze data. Valid values are:

            - ALL - Use all managed data identifiers. If you specify this value, don't specify any values for the managedDataIdentifierIds property.
            - EXCLUDE - Use all managed data identifiers except the ones specified by the managedDataIdentifierIds property.
            - INCLUDE - Use only the managed data identifiers specified by the managedDataIdentifierIds property.
            - NONE - Don't use any managed data identifiers. If you specify this value, specify at least one value for the customDataIdentifierIds property and don't specify any values for the managedDataIdentifierIds property.
            - RECOMMENDED (default) - Use the recommended set of managed data identifiers. If you specify this value, don't specify any values for the managedDataIdentifierIds property.

            If you don't specify a value for this property, the job uses the recommended set of managed data identifiers.

            If the job is a recurring job and you specify ALL or EXCLUDE, each job run automatically uses new managed data identifiers that are released. If you don't specify a value for this property or you specify RECOMMENDED for a recurring job, each job run automatically uses all the managed data identifiers that are in the recommended set when the run starts.

            To learn about individual managed data identifiers or determine which ones are in the recommended set, see [Using managed data identifiers](https://docs.aws.amazon.com/macie/latest/user/managed-data-identifiers.html) or [Recommended managed data identifiers](https://docs.aws.amazon.com/macie/latest/user/discovery-jobs-mdis-recommended.html) in the *Amazon Macie User Guide*.
        name: A custom name for the job. The name can contain as many as 500 characters.
        s3-job-definition: The S3 buckets that contain the objects to analyze, and the scope of that analysis.
        sampling-percentage: The sampling depth, as a percentage, for the job to apply when processing objects. This value determines the percentage of eligible objects that the job analyzes. If this value is less than 100, Amazon Macie selects the objects to analyze at random, up to the specified percentage, and analyzes all the data in those objects.
        schedule-frequency: The recurrence pattern for running the job. To run the job only once, don't specify a value for this property and set the value for the jobType property to ONE\_TIME.
        tags: |-
            A map of key-value pairs that specifies the tags to associate with the job.

            A job can have a maximum of 50 tags. Each tag consists of a tag key and an associated tag value. The maximum length of a tag key is 128 characters. The maximum length of a tag value is 256 characters.
