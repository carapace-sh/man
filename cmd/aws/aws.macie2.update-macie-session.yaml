name: update-macie-session
description: Suspends or re-enables Amazon Macie, or updates the configuration settings for a Macie account.
flags:
    --finding-publishing-frequency=: Specifies how often to publish updates to policy findings for the account.
    --status=: Specifies a new status for the account.
completion:
    flag:
        finding-publishing-frequency:
            - FIFTEEN_MINUTES
            - ONE_HOUR
            - SIX_HOURS
        status:
            - PAUSED
            - ENABLED
documentation:
    command: Suspends or re-enables Amazon Macie, or updates the configuration settings for a Macie account.
    flag:
        finding-publishing-frequency: Specifies how often to publish updates to policy findings for the account. This includes publishing updates to Security Hub and Amazon EventBridge (formerly Amazon CloudWatch Events).
        status: 'Specifies a new status for the account. Valid values are: ENABLED, resume all Amazon Macie activities for the account; and, PAUSED, suspend all Macie activities for the account.'
