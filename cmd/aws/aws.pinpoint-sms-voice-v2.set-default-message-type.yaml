name: set-default-message-type
description: Sets the default message type on a configuration set.
flags:
    --configuration-set-name=!: The configuration set to update with a new default message type.
    --message-type=!: The type of message.
completion:
    flag:
        message-type:
            - TRANSACTIONAL
            - PROMOTIONAL
documentation:
    command: |-
        Sets the default message type on a configuration set.

        Choose the category of SMS messages that you plan to send from this account. If you send account-related messages or time-sensitive messages such as one-time passcodes, choose **Transactional**. If you plan to send messages that contain marketing material or other promotional content, choose **Promotional**. This setting applies to your entire Amazon Web Services account.
    flag:
        configuration-set-name: The configuration set to update with a new default message type. This field can be the ConsigurationSetName or ConfigurationSetArn.
        message-type: The type of message. Valid values are TRANSACTIONAL for messages that are critical or time-sensitive and PROMOTIONAL for messages that aren't critical or time-sensitive.
