name: create
description: '*(ALPHA)*  Create a Cloud Spanner database.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --database-dialect=: The SQL dialect of the Cloud Spanner Database.
    --ddl-file=: Path of a file that contains semi-colon separated DDL (data definition language) statements to run inside the newly created database.
    --ddl=: Semi-colon separated DDL (data definition language) statements to run inside the newly created database.
    --instance=: The Cloud Spanner instance for the database.
    --kms-key=!: ID of the key or fully qualified identifier for the key.
    --kms-keyring=: KMS keyring id of the key.
    --kms-keys=!: IDs of the keys or fully qualified identifiers for the keys.
    --kms-location=: Cloud location for the key.
    --kms-project=: Cloud project id for the key.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --proto-descriptors-file=: Path of a file that contains a protobuf-serialized google.protobuf.FileDescriptorSet message.
completion:
    flag:
        database-dialect:
            - POSTGRESQL
            - GOOGLE_STANDARD_SQL
documentation:
    command: '*(ALPHA)*  Create a Cloud Spanner database.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        database-dialect: 'The SQL dialect of the Cloud Spanner Database. GOOGLE_STANDARD_SQL is the default. _DATABASE_DIALECT_ must be one of: *POSTGRESQL*, *GOOGLE_STANDARD_SQL*.'
        ddl: Semi-colon separated DDL (data definition language) statements to run inside the newly created database. If there is an error in any statement, the database is not created. This option is not supported for the PostgreSQL dialect. Full DDL specification is at https://cloud.google.com/spanner/docs/data-definition-language
        ddl-file: Path of a file that contains semi-colon separated DDL (data definition language) statements to run inside the newly created database. If there is an error in any statement, the database is not created. This option is not supported for the PostgreSQL dialect. Full DDL specification is at https://cloud.google.com/spanner/docs/data-definition-language. If --ddl_file is set, --ddl is ignored. One line comments starting with -- are ignored.
        instance: |-
            The Cloud Spanner instance for the database.
            +
            To set the `instance` attribute:
            * provide the argument `database` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line;
            * set the property `spanner/instance`.
        kms-key: |-
            ID of the key or fully qualified identifier for the key.
            +
            To set the `kms-key` attribute:
            * provide the argument `--kms-key` on the command line.
        kms-keyring: |-
            KMS keyring id of the key.
            +
            To set the `kms-keyring` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-keyring` on the command line.
        kms-keys: |-
            IDs of the keys or fully qualified identifiers for the keys.
            +
            To set the `kms-key` attribute:
            * provide the argument `--kms-keys` on the command line.
        kms-location: |-
            Cloud location for the key.
            +
            To set the `kms-location` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-location` on the command line.
        kms-project: |-
            Cloud project id for the key.
            +
            To set the `kms-project` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-project` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        proto-descriptors-file: Path of a file that contains a protobuf-serialized google.protobuf.FileDescriptorSet message. To generate it, install and run `protoc` with --include_imports and --descriptor_set_out.
