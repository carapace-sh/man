name: untag-resource
description: Removes tags for a resource in CodeCommit.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource to which you want to remove tags.
    --tag-keys=!: The tag key for each tag that you want to remove from the resource.
documentation:
    command: Removes tags for a resource in CodeCommit. For a list of valid resources in CodeCommit, see [CodeCommit Resources and Operations](https://docs.aws.amazon.com/codecommit/latest/userguide/auth-and-access-control-iam-access-control-identity-based.html#arn-formats) in the *CodeCommit User Guide*.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource to which you want to remove tags.
        tag-keys: The tag key for each tag that you want to remove from the resource.
