name: batch-revoke-permissions
description: Batch operation to revoke permissions from the principal.
flags:
    --catalog-id=: The identifier for the Data Catalog.
    --entries=!: A list of up to 20 entries for resource permissions to be revoked by batch operation to the principal.
documentation:
    command: Batch operation to revoke permissions from the principal.
    flag:
        catalog-id: The identifier for the Data Catalog. By default, the account ID. The Data Catalog is the persistent metadata store. It contains database definitions, table definitions, and other control information to manage your Lake Formation environment.
        entries: A list of up to 20 entries for resource permissions to be revoked by batch operation to the principal.
