name: create-id-namespace
description: Creates an ID namespace object which will help customers provide metadata explaining their dataset and how to use it.
flags:
    --description=: The description of the ID namespace.
    --id-mapping-workflow-properties=: Determines the properties of `IdMappingWorflow` where this `IdNamespace` can be used as a `Source` or a `Target`.
    --id-namespace-name=!: The name of the ID namespace.
    --input-source-config=: A list of `InputSource` objects, which have the fields `InputSourceARN` and `SchemaName`.
    --role-arn=: The Amazon Resource Name (ARN) of the IAM role.
    --tags=: The tags used to organize, track, or control access for this resource.
    --type=!: The type of ID namespace.
completion:
    flag:
        type:
            - SOURCE
            - TARGET
documentation:
    command: Creates an ID namespace object which will help customers provide metadata explaining their dataset and how to use it. Each ID namespace must have a unique name. To modify an existing ID namespace, use the UpdateIdNamespace API.
    flag:
        description: The description of the ID namespace.
        id-mapping-workflow-properties: Determines the properties of `IdMappingWorflow` where this `IdNamespace` can be used as a `Source` or a `Target`.
        id-namespace-name: The name of the ID namespace.
        input-source-config: A list of `InputSource` objects, which have the fields `InputSourceARN` and `SchemaName`.
        role-arn: The Amazon Resource Name (ARN) of the IAM role. Entity Resolution assumes this role to access the resources defined in this `IdNamespace` on your behalf as part of the workflow run.
        tags: The tags used to organize, track, or control access for this resource.
        type: |-
            The type of ID namespace. There are two types: `SOURCE` and `TARGET`.

            The `SOURCE` contains configurations for `sourceId` data that will be processed in an ID mapping workflow.

            The `TARGET` contains a configuration of `targetId` to which all `sourceIds` will resolve to.
