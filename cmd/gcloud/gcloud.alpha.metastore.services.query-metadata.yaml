name: query-metadata
description: '*(ALPHA)*  Execute a SQL query against a Dataproc Metastore Service''s metadata.'
flags:
    --location=: Location to which the service belongs.
    --query=!: Use Google Standard SQL query for Cloud Spanner and MySQL query
documentation:
    command: '*(ALPHA)*  Execute a SQL query against a Dataproc Metastore Service''s metadata.'
    flag:
        location: |-
            Location to which the service belongs.
            +
            To set the `location` attribute:
            * provide the argument `service` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `metastore/location`.
        query: |-
            Use Google Standard SQL query for Cloud Spanner and MySQL query
            syntax for Cloud SQL. Cloud Spanner SQL is described at
            https://cloud.google.com/spanner/docs/query-syntax)"
