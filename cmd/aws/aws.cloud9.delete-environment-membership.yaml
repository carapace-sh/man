name: delete-environment-membership
description: Deletes an environment member from a development environment.
flags:
    --environment-id=!: The ID of the environment to delete the environment member from.
    --user-arn=!: The Amazon Resource Name (ARN) of the environment member to delete from the environment.
documentation:
    command: |-
        Deletes an environment member from a development environment.

        Cloud9 is no longer available to new customers. Existing customers of Cloud9 can continue to use the service as normal. [Learn more"](http://aws.amazon.com/blogs/devops/how-to-migrate-from-aws-cloud9-to-aws-ide-toolkits-or-aws-cloudshell/)
    flag:
        environment-id: The ID of the environment to delete the environment member from.
        user-arn: The Amazon Resource Name (ARN) of the environment member to delete from the environment.
