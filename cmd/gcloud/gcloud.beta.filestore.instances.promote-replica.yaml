name: promote-replica
description: '*(BETA)*  Promote a Filestore standby replication instance.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Location of the Filestore instance to promote.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --peer-instance=: The name of the standby peer instance to promote.
    --zone=: The zone of the Filestore instance.
documentation:
    command: |
        *(BETA)*  Promote a Filestore standby replication instance to a regular instance. This command can be
        called directly on the standby instance or on the active instance with the standby peer
        instance parameter.
        When used on the standby instance promotes the standby instance to a regular instance even if
        the active instance is unavailable.
        When used on the active instance detaches the standby instance from the active instance even
        if the standby instance is unavailable.

        This command can fail for the following reasons:
          * The target instance does not exist.
          * The instance is not a standby replication member.
          * The instance is an active instance and the peer instance parameter is missing or invalid.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: Location of the Filestore instance to promote.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        peer-instance: The name of the standby peer instance to promote.
        zone: |-
            The zone of the Filestore instance.
            +

            To set the `zone` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line;
            * provide the argument `--location` on the command line;
            * set the property `filestore/zone`.
