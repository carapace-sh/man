name: create-filter
description: Creates a filter resource using specified filter criteria.
flags:
    --action=!: Defines the action that is to be applied to the findings that match the filter.
    --description=: A description of the filter.
    --filter-criteria=!: Defines the criteria to be used in the filter for querying findings.
    --name=!: The name of the filter.
    --reason=: The reason for creating the filter.
    --tags=: A list of tags for the filter.
completion:
    flag:
        action:
            - NONE
            - SUPPRESS
documentation:
    command: Creates a filter resource using specified filter criteria. When the filter action is set to `SUPPRESS` this action creates a suppression rule.
    flag:
        action: Defines the action that is to be applied to the findings that match the filter.
        description: A description of the filter.
        filter-criteria: Defines the criteria to be used in the filter for querying findings.
        name: The name of the filter. Minimum length of 3. Maximum length of 64. Valid characters include alphanumeric characters, dot (.), underscore (\_), and dash (-). Spaces are not allowed.
        reason: The reason for creating the filter.
        tags: A list of tags for the filter.
