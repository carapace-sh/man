name: update-license-configuration
description: Modifies the attributes of an existing license configuration.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: New description of the license configuration.
    --disassociate-when-not-found: When true, disassociates a resource when software is uninstalled.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --license-configuration-arn=!: Amazon Resource Name (ARN) of the license configuration.
    --license-configuration-status=: New status of the license configuration.
    --license-count-hard-limit: New hard limit of the number of available licenses.
    --license-count=: New number of licenses managed by the license configuration.
    --license-expiry=: License configuration expiry time.
    --license-rules=:
        description: New license rule.
        nargs: -1
    --name=: New name of the license configuration.
    --no-disassociate-when-not-found: When true, disassociates a resource when software is uninstalled.
    --no-license-count-hard-limit: New hard limit of the number of available licenses.
    --product-information-list=:
        description: New product information.
        nargs: -1
completion:
    flag:
        license-configuration-status:
            - AVAILABLE
            - DISABLED
documentation:
    command: Modifies the attributes of an existing license configuration.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: New description of the license configuration.
        disassociate-when-not-found: When true, disassociates a resource when software is uninstalled.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        license-configuration-arn: Amazon Resource Name (ARN) of the license configuration.
        license-configuration-status: New status of the license configuration.
        license-count: New number of licenses managed by the license configuration.
        license-count-hard-limit: New hard limit of the number of available licenses.
        license-expiry: License configuration expiry time.
        license-rules: New license rule. The only rule that you can add after you create a license configuration is licenseAffinityToHost.
        name: New name of the license configuration.
