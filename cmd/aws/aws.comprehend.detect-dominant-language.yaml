name: detect-dominant-language
description: Determines the dominant language of the input text.
flags:
    --text=!: A UTF-8 text string.
documentation:
    command: Determines the dominant language of the input text. For a list of languages that Amazon Comprehend can detect, see [Amazon Comprehend Supported Languages](https://docs.aws.amazon.com/comprehend/latest/dg/how-languages.html).
    flag:
        text: A UTF-8 text string. The string must contain at least 20 characters. The maximum string size is 100 KB.
