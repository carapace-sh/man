name: untag-resource
description: Removes tags from a behavior graph.
flags:
    --resource-arn=!: The ARN of the behavior graph to remove the tags from.
    --tag-keys=!: The tag keys of the tags to remove from the behavior graph.
documentation:
    command: Removes tags from a behavior graph.
    flag:
        resource-arn: The ARN of the behavior graph to remove the tags from.
        tag-keys: The tag keys of the tags to remove from the behavior graph. You can remove up to 50 tags at a time.
