name: list-connectors
description: Returns a list of all the connectors in this account and Region.
flags:
    --connector-name-prefix=: The name prefix that you want to use to search for and list connectors.
    --max-results=: The maximum number of connectors to list in one response.
    --next-token=: If the response of a ListConnectors operation is truncated, it will include a NextToken.
documentation:
    command: Returns a list of all the connectors in this account and Region. The list is limited to connectors whose name starts with the specified prefix. The response also includes a description of each of the listed connectors.
    flag:
        connector-name-prefix: The name prefix that you want to use to search for and list connectors.
        max-results: The maximum number of connectors to list in one response.
        next-token: If the response of a ListConnectors operation is truncated, it will include a NextToken. Send this NextToken in a subsequent request to continue listing from where the previous operation left off.
