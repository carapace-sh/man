name: update-routing-control
description: Updates a routing control.
flags:
    --routing-control-arn=!: The Amazon Resource Name (ARN) of the routing control.
    --routing-control-name=!: The name of the routing control.
documentation:
    command: Updates a routing control. You can only update the name of the routing control. To get or update the routing control state, see the Recovery Cluster (data plane) API actions for Amazon Route 53 Application Recovery Controller.
    flag:
        routing-control-arn: The Amazon Resource Name (ARN) of the routing control.
        routing-control-name: The name of the routing control.
