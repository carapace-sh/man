name: update-event-sources-config
description: Enables or disables integration with a service that can be integrated with DevOps Guru.
flags:
    --event-sources=: Configuration information about the integration of DevOps Guru as the Consumer via EventBridge with another AWS Service.
documentation:
    command: Enables or disables integration with a service that can be integrated with DevOps Guru. The one service that can be integrated with DevOps Guru is Amazon CodeGuru Profiler, which can produce proactive recommendations which can be stored and viewed in DevOps Guru.
    flag:
        event-sources: Configuration information about the integration of DevOps Guru as the Consumer via EventBridge with another AWS Service.
