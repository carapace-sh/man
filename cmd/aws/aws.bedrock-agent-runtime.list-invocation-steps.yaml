name: list-invocation-steps
description: Lists all invocation steps associated with a session and optionally, an invocation within the session.
flags:
    --invocation-identifier=: The unique identifier (in UUID format) for the invocation to list invocation steps for.
    --max-results=: The maximum number of results to return in the response.
    --next-token=: If the total number of results is greater than the `maxResults` value provided in the request, enter the token returned in the `nextToken` field in the response in this field to return the next batch of results.
    --session-identifier=!: The unique identifier for the session associated with the invocation steps.
documentation:
    command: Lists all invocation steps associated with a session and optionally, an invocation within the session. For more information about sessions, see [Store and retrieve conversation history and context with Amazon Bedrock sessions](https://docs.aws.amazon.com/bedrock/latest/userguide/sessions.html).
    flag:
        invocation-identifier: The unique identifier (in UUID format) for the invocation to list invocation steps for.
        max-results: The maximum number of results to return in the response. If the total number of results is greater than this value, use the token returned in the response in the `nextToken` field when making another request to return the next batch of results.
        next-token: If the total number of results is greater than the `maxResults` value provided in the request, enter the token returned in the `nextToken` field in the response in this field to return the next batch of results.
        session-identifier: The unique identifier for the session associated with the invocation steps. You can specify either the session's `sessionId` or its Amazon Resource Name (ARN).
