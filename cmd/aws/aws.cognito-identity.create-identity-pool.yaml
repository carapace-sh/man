name: create-identity-pool
description: Creates a new identity pool.
flags:
    --allow-classic-flow: Enables or disables the Basic (Classic) authentication flow.
    --allow-unauthenticated-identities!: TRUE if the identity pool supports unauthenticated logins.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cognito-identity-providers=: An array of Amazon Cognito user pools and their client IDs.
    --developer-provider-name=: The "domain" by which Cognito will refer to your users.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identity-pool-name=!: A string that you provide.
    --identity-pool-tags=: Tags to assign to the identity pool.
    --no-allow-classic-flow: Enables or disables the Basic (Classic) authentication flow.
    --no-allow-unauthenticated-identities!: TRUE if the identity pool supports unauthenticated logins.
    --open-id-connect-provider-arns=: The Amazon Resource Names (ARN) of the OpenID Connect providers.
    --saml-provider-arns=: An array of Amazon Resource Names (ARNs) of the SAML provider for your identity pool.
    --supported-login-providers=: Optional key:value pairs mapping provider names to provider app IDs.
documentation:
    command: |-
        Creates a new identity pool. The identity pool is a store of user identity information that is specific to your Amazon Web Services account. The keys for `SupportedLoginProviders` are as follows:

        - Facebook: `graph.facebook.com`
        - Google: `accounts.google.com`
        - Sign in With Apple: `appleid.apple.com`
        - Amazon: `www.amazon.com`
        - Twitter: `api.twitter.com`
        - Digits: `www.digits.com`

        If you don't provide a value for a parameter, Amazon Cognito sets it to its default value.

        You must use Amazon Web Services developer credentials to call this operation.
    flag:
        allow-classic-flow: Enables or disables the Basic (Classic) authentication flow. For more information, see [Identity Pools (Federated Identities) Authentication Flow](https://docs.aws.amazon.com/cognito/latest/developerguide/authentication-flow.html) in the *Amazon Cognito Developer Guide*.
        allow-unauthenticated-identities: TRUE if the identity pool supports unauthenticated logins.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cognito-identity-providers: An array of Amazon Cognito user pools and their client IDs.
        developer-provider-name: |-
            The "domain" by which Cognito will refer to your users. This name acts as a placeholder that allows your backend and the Cognito service to communicate about the developer provider. For the `DeveloperProviderName`, you can use letters as well as period (`.`), underscore (`_`), and dash (`-`).

            Once you have set a developer provider name, you cannot change it. Please take care in setting this parameter.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        identity-pool-name: A string that you provide.
        identity-pool-tags: Tags to assign to the identity pool. A tag is a label that you can apply to identity pools to categorize and manage them in different ways, such as by purpose, owner, environment, or other criteria.
        open-id-connect-provider-arns: The Amazon Resource Names (ARN) of the OpenID Connect providers.
        saml-provider-arns: An array of Amazon Resource Names (ARNs) of the SAML provider for your identity pool.
        supported-login-providers: Optional key:value pairs mapping provider names to provider app IDs.
