name: get
description: '*(ALPHA)*  Get MCP content security providers for a project.'
documentation:
    command: |-
        *(ALPHA)*  Get MCP content security providers for a project.

        ## EXAMPLES

        Get MCP content security providers for a project:

          $ gcloud alpha services mcp content-security get

        Get MCP content security providers for a project `my-project`:

          $ gcloud alpha services mcp content-security get --project=my-project
