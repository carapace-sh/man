name: get-access-point-scope
description: Returns the access point scope for a directory bucket.
flags:
    --account-id=!: The Amazon Web Services account ID that owns the access point with the scope that you want to retrieve.
    --name=!: The name of the access point with the scope you want to retrieve.
documentation:
    command: |-
        Returns the access point scope for a directory bucket.

        To use this operation, you must have the permission to perform the `s3express:GetAccessPointScope` action.

        For information about REST API errors, see [REST error responses](https://docs.aws.amazon.com/AmazonS3/latest/API/ErrorResponses.html#RESTErrorResponses).

        You must URL encode any signed header values that contain spaces. For example, if your header value is `my file.txt`, containing two spaces after `my`, you must URL encode this value to `my%20%20file.txt`.
    flag:
        account-id: The Amazon Web Services account ID that owns the access point with the scope that you want to retrieve.
        name: The name of the access point with the scope you want to retrieve.
