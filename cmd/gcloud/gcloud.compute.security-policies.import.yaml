name: import
description: Import security policy configs into your project.
flags:
    --file-format=: The format of the file to import the security policy config from.
    --file-name=!: The name of the JSON or YAML file to import the security policy config from.
    --global: If set, the security policy is global.
    --no-global&: If set, the security policy is global.
    --region=: Region of the security policy to import.
completion:
    flag:
        file-format:
            - json
            - yaml
documentation:
    command: |-
        *gcloud compute security-policies import* imports a security policy to update an existing policy. To create
        a new policy from a file please use the create command instead.

        ## EXAMPLES

        To import a security policy from a YAML file run this:

          $ gcloud compute security-policies import --file-name=myFile
    flag:
        file-format: 'The format of the file to import the security policy config from. Specify either yaml or json. Defaults to yaml if not specified. _FILE_FORMAT_ must be one of: *json*, *yaml*.'
        file-name: The name of the JSON or YAML file to import the security policy config from.
        global: If set, the security policy is global.
        no-global: If set, the security policy is global.
        region: Region of the security policy to import. Overrides the default *compute/region* property value for this command invocation.
