name: list-usage-totals
description: Lists the Amazon Inspector usage totals over the last 30 days.
flags:
    --account-ids=: The Amazon Web Services account IDs to retrieve usage totals for.
    --max-results=: The maximum number of results the response can return.
    --next-token=: A token to use for paginating results that are returned in the response.
documentation:
    command: Lists the Amazon Inspector usage totals over the last 30 days.
    flag:
        account-ids: The Amazon Web Services account IDs to retrieve usage totals for.
        max-results: The maximum number of results the response can return. If your request would return more than the maximum the response will return a `nextToken` value, use this value when you call the action again to get the remaining results.
        next-token: A token to use for paginating results that are returned in the response. Set the value of this parameter to null for the first request to a list action. If your response returns more than the `maxResults` maximum value it will also return a `nextToken` value. For subsequent calls, use the `nextToken` value returned from the previous request to continue listing results after the first page.
