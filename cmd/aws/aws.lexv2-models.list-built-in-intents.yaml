name: list-built-in-intents
description: Gets a list of built-in intents provided by Amazon Lex that you can use in your bot.
flags:
    --locale-id=!: The identifier of the language and locale of the intents to list.
    --max-results=: The maximum number of built-in intents to return in each page of results.
    --next-token=: If the response from the `ListBuiltInIntents` operation contains more results than specified in the `maxResults` parameter, a token is returned in the response.
    --sort-by=: Specifies sorting parameters for the list of built-in intents.
documentation:
    command: |-
        Gets a list of built-in intents provided by Amazon Lex that you can use in your bot.

        To use a built-in intent as a the base for your own intent, include the built-in intent signature in the `parentIntentSignature` parameter when you call the `CreateIntent` operation. For more information, see [CreateIntent](https://docs.aws.amazon.com/lexv2/latest/APIReference/API_CreateIntent.html).
    flag:
        locale-id: The identifier of the language and locale of the intents to list. The string must match one of the supported locales. For more information, see [Supported languages](https://docs.aws.amazon.com/lexv2/latest/dg/how-languages.html).
        max-results: The maximum number of built-in intents to return in each page of results. If there are fewer results than the max page size, only the actual number of results are returned.
        next-token: If the response from the `ListBuiltInIntents` operation contains more results than specified in the `maxResults` parameter, a token is returned in the response. Use that token in the `nextToken` parameter to return the next page of results.
        sort-by: Specifies sorting parameters for the list of built-in intents. You can specify that the list be sorted by the built-in intent signature in either ascending or descending order.
