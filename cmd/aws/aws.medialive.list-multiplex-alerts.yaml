name: list-multiplex-alerts
description: List the alerts for a multiplex with optional filtering based on alert state.
flags:
    --max-results=: The maximum number of items to return
    --multiplex-id=!: The unique ID of the multiplex
    --next-token=: The next pagination token
    --state-filter=: Specifies the set of alerts to return based on their state.
documentation:
    command: List the alerts for a multiplex with optional filtering based on alert state.
    flag:
        max-results: The maximum number of items to return
        multiplex-id: The unique ID of the multiplex
        next-token: The next pagination token
        state-filter: Specifies the set of alerts to return based on their state. SET - Return only alerts with SET state. CLEARED - Return only alerts with CLEARED state. ALL - Return all alerts.
