name: restore-dbinstance-from-dbsnapshot
description: Creates a new DB instance from a DB snapshot.
flags:
    --allocated-storage=: The amount of storage (in gibibytes) to allocate initially for the DB instance.
    --auto-minor-version-upgrade=: Specifies whether to automatically apply minor version upgrades to the DB instance during the maintenance window.
    --availability-zone=: The Availability Zone (AZ) where the DB instance will be created.
    --backup-target=: Specifies where automated backups and manual snapshots are stored for the restored DB instance.
    --cacertificate-identifier=: The CA certificate identifier to use for the DB instance's server certificate.
    --copy-tags-to-snapshot=: Specifies whether to copy all tags from the restored DB instance to snapshots of the DB instance.
    --custom-iam-instance-profile=: The instance profile associated with the underlying Amazon EC2 instance of an RDS Custom DB instance.
    --dbcluster-snapshot-identifier=: The identifier for the Multi-AZ DB cluster snapshot to restore from.
    --dbinstance-class=: The compute and memory capacity of the Amazon RDS DB instance, for example db.m4.large. Not all DB instance classes are available in all Amazon Web Services Regions, or for all database engines.
    --dbinstance-identifier=!: The name of the DB instance to create from the DB snapshot.
    --dbname=: The name of the database for the restored DB instance.
    --dbparameter-group-name=: The name of the DB parameter group to associate with this DB instance.
    --dbsnapshot-identifier=: The identifier for the DB snapshot to restore from.
    --dbsubnet-group-name=: The name of the DB subnet group to use for the new instance.
    --dedicated-log-volume=: Specifies whether to enable a dedicated log volume (DLV) for the DB instance.
    --deletion-protection=: Specifies whether to enable deletion protection for the DB instance.
    --domain-auth-secret-arn=: The ARN for the Secrets Manager secret with the credentials for the user joining the domain.
    --domain-dns-ips=: The IPv4 DNS IP addresses of your primary and secondary Active Directory domain controllers.
    --domain-fqdn=: The fully qualified domain name (FQDN) of an Active Directory domain.
    --domain-iamrole-name=: The name of the IAM role to use when making API calls to the Directory Service.
    --domain-ou=: The Active Directory organizational unit for your DB instance to join.
    --domain=: The Active Directory directory ID to restore the DB instance in.
    --enable-cloudwatch-logs-exports=: The list of logs for the restored DB instance to export to CloudWatch Logs.
    --enable-customer-owned-ip=: Specifies whether to enable a customer-owned IP address (CoIP) for an RDS on Outposts DB instance.
    --enable-iamdatabase-authentication=: Specifies whether to enable mapping of Amazon Web Services Identity and Access Management (IAM) accounts to database accounts.
    --engine-lifecycle-support=: The life cycle type for this DB instance.
    --engine=: The database engine to use for the new instance.
    --iops=: Specifies the amount of provisioned IOPS for the DB instance, expressed in I/O operations per second.
    --license-model=: License model information for the restored DB instance.
    --manage-master-user-password=: Specifies whether to manage the master user password with Amazon Web Services Secrets Manager in the restored DB instance.
    --master-user-secret-kms-key-id=: The Amazon Web Services KMS key identifier to encrypt a secret that is automatically generated and managed in Amazon Web Services Secrets Manager.
    --multi-az=: Specifies whether the DB instance is a Multi-AZ deployment.
    --network-type=: The network type of the DB instance.
    --option-group-name=: The name of the option group to be used for the restored DB instance.
    --port=: The port number on which the database accepts connections.
    --processor-features=: The number of CPU cores and the number of threads per core for the DB instance class of the DB instance.
    --publicly-accessible=: Specifies whether the DB instance is publicly accessible.
    --storage-throughput=: Specifies the storage throughput value for the DB instance.
    --storage-type=: Specifies the storage type to be associated with the DB instance.
    --tags=: ""
    --tde-credential-arn=: The ARN from the key store with which to associate the instance for TDE encryption.
    --tde-credential-password=: The password for the given ARN from the key store in order to access the device.
    --use-default-processor-features=: Specifies whether the DB instance class of the DB instance uses its default processor features.
    --vpc-security-group-ids=: A list of EC2 VPC security groups to associate with this DB instance.
documentation:
    command: |-
        Creates a new DB instance from a DB snapshot. The target database is created from the source database restore point with most of the source's original configuration, including the default security group and DB parameter group. By default, the new DB instance is created as a Single-AZ deployment, except when the instance is a SQL Server instance that has an option group associated with mirroring. In this case, the instance becomes a Multi-AZ deployment, not a Single-AZ deployment.

        If you want to replace your original DB instance with the new, restored DB instance, then rename your original DB instance before you call the `RestoreDBInstanceFromDBSnapshot` operation. RDS doesn't allow two DB instances with the same name. After you have renamed your original DB instance with a different identifier, then you can pass the original name of the DB instance as the `DBInstanceIdentifier` in the call to the `RestoreDBInstanceFromDBSnapshot` operation. The result is that you replace the original DB instance with the DB instance created from the snapshot.

        If you are restoring from a shared manual DB snapshot, the `DBSnapshotIdentifier` must be the ARN of the shared DB snapshot.

        To restore from a DB snapshot with an unsupported engine version, you must first upgrade the engine version of the snapshot. For more information about upgrading a RDS for MySQL DB snapshot engine version, see [Upgrading a MySQL DB snapshot engine version](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/mysql-upgrade-snapshot.html). For more information about upgrading a RDS for PostgreSQL DB snapshot engine version, [Upgrading a PostgreSQL DB snapshot engine version](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBSnapshot.PostgreSQL.html).

        This command doesn't apply to Aurora MySQL and Aurora PostgreSQL. For Aurora, use `RestoreDBClusterFromSnapshot`.
    flag:
        allocated-storage: |-
            The amount of storage (in gibibytes) to allocate initially for the DB instance. Follow the allocation rules specified in CreateDBInstance.

            This setting isn't valid for RDS for SQL Server.

            Be sure to allocate enough storage for your new DB instance so that the restore operation can succeed. You can also allocate additional storage for future growth.
        auto-minor-version-upgrade: |-
            Specifies whether to automatically apply minor version upgrades to the DB instance during the maintenance window.

            If you restore an RDS Custom DB instance, you must disable this parameter.

            For more information about automatic minor version upgrades, see [Automatically upgrading the minor engine version](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.Upgrading.html#USER_UpgradeDBInstance.Upgrading.AutoMinorVersionUpgrades).
        availability-zone: |-
            The Availability Zone (AZ) where the DB instance will be created.

            Default: A random, system-chosen Availability Zone.

            Constraint: You can't specify the `AvailabilityZone` parameter if the DB instance is a Multi-AZ deployment.

            Example: `us-east-1a`
        backup-target: |-
            Specifies where automated backups and manual snapshots are stored for the restored DB instance.

            Possible values are `local` (Dedicated Local Zone), `outposts` (Amazon Web Services Outposts), and `region` (Amazon Web Services Region). The default is `region`.

            For more information, see [Working with Amazon RDS on Amazon Web Services Outposts](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-on-outposts.html) in the *Amazon RDS User Guide*.
        cacertificate-identifier: |-
            The CA certificate identifier to use for the DB instance's server certificate.

            This setting doesn't apply to RDS Custom DB instances.

            For more information, see [Using SSL/TLS to encrypt a connection to a DB instance](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.SSL.html) in the *Amazon RDS User Guide* and [Using SSL/TLS to encrypt a connection to a DB cluster](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/UsingWithRDS.SSL.html) in the *Amazon Aurora User Guide*.
        copy-tags-to-snapshot: |-
            Specifies whether to copy all tags from the restored DB instance to snapshots of the DB instance.

            In most cases, tags aren't copied by default. However, when you restore a DB instance from a DB snapshot, RDS checks whether you specify new tags. If yes, the new tags are added to the restored DB instance. If there are no new tags, RDS looks for the tags from the source DB instance for the DB snapshot, and then adds those tags to the restored DB instance.

            For more information, see [Copying tags to DB instance snapshots](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_Tagging.html#USER_Tagging.CopyTags) in the *Amazon RDS User Guide*.
        custom-iam-instance-profile: |-
            The instance profile associated with the underlying Amazon EC2 instance of an RDS Custom DB instance. The instance profile must meet the following requirements:

            - The profile must exist in your account.
            - The profile must have an IAM role that Amazon EC2 has permissions to assume.
            - The instance profile name and the associated IAM role name must start with the prefix `AWSRDSCustom`.

            For the list of permissions required for the IAM role, see [Configure IAM and your VPC](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/custom-setup-orcl.html#custom-setup-orcl.iam-vpc) in the *Amazon RDS User Guide*.

            This setting is required for RDS Custom.
        dbcluster-snapshot-identifier: |-
            The identifier for the Multi-AZ DB cluster snapshot to restore from.

            For more information on Multi-AZ DB clusters, see [Multi-AZ DB cluster deployments](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/multi-az-db-clusters-concepts.html) in the *Amazon RDS User Guide*.

            Constraints:

            - Must match the identifier of an existing Multi-AZ DB cluster snapshot.
            - Can't be specified when `DBSnapshotIdentifier` is specified.
            - Must be specified when `DBSnapshotIdentifier` isn't specified.
            - If you are restoring from a shared manual Multi-AZ DB cluster snapshot, the `DBClusterSnapshotIdentifier` must be the ARN of the shared snapshot.
            - Can't be the identifier of an Aurora DB cluster snapshot.
        dbinstance-class: |-
            The compute and memory capacity of the Amazon RDS DB instance, for example db.m4.large. Not all DB instance classes are available in all Amazon Web Services Regions, or for all database engines. For the full list of DB instance classes, and availability for your engine, see [DB Instance Class](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.DBInstanceClass.html) in the *Amazon RDS User Guide.*

            Default: The same DBInstanceClass as the original DB instance.
        dbinstance-identifier: |-
            The name of the DB instance to create from the DB snapshot. This parameter isn't case-sensitive.

            Constraints:

            - Must contain from 1 to 63 numbers, letters, or hyphens.
            - First character must be a letter.
            - Can't end with a hyphen or contain two consecutive hyphens.

            Example: `my-snapshot-id`
        dbname: |-
            The name of the database for the restored DB instance.

            This parameter only applies to RDS for Oracle and RDS for SQL Server DB instances. It doesn't apply to the other engines or to RDS Custom DB instances.
        dbparameter-group-name: |-
            The name of the DB parameter group to associate with this DB instance.

            If you don't specify a value for `DBParameterGroupName`, then RDS uses the default `DBParameterGroup` for the specified DB engine.

            This setting doesn't apply to RDS Custom.

            Constraints:

            - If supplied, must match the name of an existing DB parameter group.
            - Must be 1 to 255 letters, numbers, or hyphens.
            - First character must be a letter.
            - Can't end with a hyphen or contain two consecutive hyphens.
        dbsnapshot-identifier: |-
            The identifier for the DB snapshot to restore from.

            Constraints:

            - Must match the identifier of an existing DB snapshot.
            - Can't be specified when `DBClusterSnapshotIdentifier` is specified.
            - Must be specified when `DBClusterSnapshotIdentifier` isn't specified.
            - If you are restoring from a shared manual DB snapshot, the `DBSnapshotIdentifier` must be the ARN of the shared DB snapshot.
        dbsubnet-group-name: |-
            The name of the DB subnet group to use for the new instance.

            Constraints:

            - If supplied, must match the name of an existing DB subnet group.

            Example: `mydbsubnetgroup`
        dedicated-log-volume: Specifies whether to enable a dedicated log volume (DLV) for the DB instance.
        deletion-protection: Specifies whether to enable deletion protection for the DB instance. The database can't be deleted when deletion protection is enabled. By default, deletion protection isn't enabled. For more information, see [Deleting a DB Instance](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_DeleteInstance.html).
        domain: |-
            The Active Directory directory ID to restore the DB instance in. The domain/ must be created prior to this operation. Currently, you can create only Db2, MySQL, Microsoft SQL Server, Oracle, and PostgreSQL DB instances in an Active Directory Domain.

            For more information, see [Kerberos Authentication](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/kerberos-authentication.html) in the *Amazon RDS User Guide*.

            This setting doesn't apply to RDS Custom.
        domain-auth-secret-arn: |-
            The ARN for the Secrets Manager secret with the credentials for the user joining the domain.

            Constraints:

            - Can't be longer than 64 characters.

            Example: `arn:aws:secretsmanager:region:account-number:secret:myselfmanagedADtestsecret-123456`
        domain-dns-ips: |-
            The IPv4 DNS IP addresses of your primary and secondary Active Directory domain controllers.

            Constraints:

            - Two IP addresses must be provided. If there isn't a secondary domain controller, use the IP address of the primary domain controller for both entries in the list.

            Example: `123.124.125.126,234.235.236.237`
        domain-fqdn: |-
            The fully qualified domain name (FQDN) of an Active Directory domain.

            Constraints:

            - Can't be longer than 64 characters.

            Example: `mymanagedADtest.mymanagedAD.mydomain`
        domain-iamrole-name: |-
            The name of the IAM role to use when making API calls to the Directory Service.

            This setting doesn't apply to RDS Custom DB instances.
        domain-ou: |-
            The Active Directory organizational unit for your DB instance to join.

            Constraints:

            - Must be in the distinguished name format.
            - Can't be longer than 64 characters.

            Example: `OU=mymanagedADtestOU,DC=mymanagedADtest,DC=mymanagedAD,DC=mydomain`
        enable-cloudwatch-logs-exports: |-
            The list of logs for the restored DB instance to export to CloudWatch Logs. The values in the list depend on the DB engine. For more information, see [Publishing Database Logs to Amazon CloudWatch Logs](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_LogAccess.html#USER_LogAccess.Procedural.UploadtoCloudWatch) in the *Amazon RDS User Guide*.

            This setting doesn't apply to RDS Custom.
        enable-customer-owned-ip: |-
            Specifies whether to enable a customer-owned IP address (CoIP) for an RDS on Outposts DB instance.

            A *CoIP* provides local or external connectivity to resources in your Outpost subnets through your on-premises network. For some use cases, a CoIP can provide lower latency for connections to the DB instance from outside of its virtual private cloud (VPC) on your local network.

            This setting doesn't apply to RDS Custom.

            For more information about RDS on Outposts, see [Working with Amazon RDS on Amazon Web Services Outposts](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-on-outposts.html) in the *Amazon RDS User Guide*.

            For more information about CoIPs, see [Customer-owned IP addresses](https://docs.aws.amazon.com/outposts/latest/userguide/routing.html#ip-addressing) in the *Amazon Web Services Outposts User Guide*.
        enable-iamdatabase-authentication: |-
            Specifies whether to enable mapping of Amazon Web Services Identity and Access Management (IAM) accounts to database accounts. By default, mapping is disabled.

            For more information about IAM database authentication, see [IAM Database Authentication for MySQL and PostgreSQL](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.IAMDBAuth.html) in the *Amazon RDS User Guide.*

            This setting doesn't apply to RDS Custom.
        engine: |-
            The database engine to use for the new instance.

            This setting doesn't apply to RDS Custom.

            Default: The same as source

            Constraint: Must be compatible with the engine of the source. For example, you can restore a MariaDB 10.1 DB instance from a MySQL 5.6 snapshot.

            Valid Values:

            - `db2-ae`
            - `db2-se`
            - `mariadb`
            - `mysql`
            - `oracle-ee`
            - `oracle-ee-cdb`
            - `oracle-se2`
            - `oracle-se2-cdb`
            - `postgres`
            - `sqlserver-ee`
            - `sqlserver-se`
            - `sqlserver-ex`
            - `sqlserver-web`
        engine-lifecycle-support: |-
            The life cycle type for this DB instance.

            By default, this value is set to `open-source-rds-extended-support`, which enrolls your DB instance into Amazon RDS Extended Support. At the end of standard support, you can avoid charges for Extended Support by setting the value to `open-source-rds-extended-support-disabled`. In this case, RDS automatically upgrades your restored DB instance to a higher engine version, if the major engine version is past its end of standard support date.

            You can use this setting to enroll your DB instance into Amazon RDS Extended Support. With RDS Extended Support, you can run the selected major engine version on your DB instance past the end of standard support for that engine version. For more information, see [Amazon RDS Extended Support with Amazon RDS](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/extended-support.html) in the *Amazon RDS User Guide*.

            This setting applies only to RDS for MySQL and RDS for PostgreSQL. For Amazon Aurora DB instances, the life cycle type is managed by the DB cluster.

            Valid Values: `open-source-rds-extended-support | open-source-rds-extended-support-disabled`

            Default: `open-source-rds-extended-support`
        iops: |-
            Specifies the amount of provisioned IOPS for the DB instance, expressed in I/O operations per second. If this parameter isn't specified, the IOPS value is taken from the backup. If this parameter is set to 0, the new instance is converted to a non-PIOPS instance. The conversion takes additional time, though your DB instance is available for connections before the conversion starts.

            The provisioned IOPS value must follow the requirements for your database engine. For more information, see [Amazon RDS Provisioned IOPS storage](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_Storage.html#USER_PIOPS) in the *Amazon RDS User Guide.*

            Constraints: Must be an integer greater than 1000.
        license-model: |-
            License model information for the restored DB instance.

            License models for RDS for Db2 require additional configuration. The bring your own license (BYOL) model requires a custom parameter group and an Amazon Web Services License Manager self-managed license. The Db2 license through Amazon Web Services Marketplace model requires an Amazon Web Services Marketplace subscription. For more information, see [Amazon RDS for Db2 licensing options](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/db2-licensing.html) in the *Amazon RDS User Guide*.

            This setting doesn't apply to Amazon Aurora or RDS Custom DB instances.

            Valid Values:

            - RDS for Db2 - `bring-your-own-license | marketplace-license`
            - RDS for MariaDB - `general-public-license`
            - RDS for Microsoft SQL Server - `license-included`
            - RDS for MySQL - `general-public-license`
            - RDS for Oracle - `bring-your-own-license | license-included`
            - RDS for PostgreSQL - `postgresql-license`

            Default: Same as the source.
        manage-master-user-password: |-
            Specifies whether to manage the master user password with Amazon Web Services Secrets Manager in the restored DB instance.

            For more information, see [Password management with Amazon Web Services Secrets Manager](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-secrets-manager.html) in the *Amazon RDS User Guide*.

            Constraints:

            - Applies to RDS for Oracle only.
        master-user-secret-kms-key-id: |-
            The Amazon Web Services KMS key identifier to encrypt a secret that is automatically generated and managed in Amazon Web Services Secrets Manager.

            This setting is valid only if the master user password is managed by RDS in Amazon Web Services Secrets Manager for the DB instance.

            The Amazon Web Services KMS key identifier is the key ARN, key ID, alias ARN, or alias name for the KMS key. To use a KMS key in a different Amazon Web Services account, specify the key ARN or alias ARN.

            If you don't specify `MasterUserSecretKmsKeyId`, then the `aws/secretsmanager` KMS key is used to encrypt the secret. If the secret is in a different Amazon Web Services account, then you can't use the `aws/secretsmanager` KMS key to encrypt the secret, and you must use a customer managed KMS key.

            There is a default KMS key for your Amazon Web Services account. Your Amazon Web Services account has a different default KMS key for each Amazon Web Services Region.
        multi-az: |-
            Specifies whether the DB instance is a Multi-AZ deployment.

            This setting doesn't apply to RDS Custom.

            Constraint: You can't specify the `AvailabilityZone` parameter if the DB instance is a Multi-AZ deployment.
        network-type: |-
            The network type of the DB instance.

            Valid Values:

            - `IPV4`
            - `DUAL`

            The network type is determined by the `DBSubnetGroup` specified for the DB instance. A `DBSubnetGroup` can support only the IPv4 protocol or the IPv4 and the IPv6 protocols (`DUAL`).

            For more information, see [Working with a DB instance in a VPC](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_VPC.WorkingWithRDSInstanceinaVPC.html) in the *Amazon RDS User Guide.*
        option-group-name: |-
            The name of the option group to be used for the restored DB instance.

            Permanent options, such as the TDE option for Oracle Advanced Security TDE, can't be removed from an option group, and that option group can't be removed from a DB instance after it is associated with a DB instance.

            This setting doesn't apply to RDS Custom.
        port: |-
            The port number on which the database accepts connections.

            Default: The same port as the original DB instance

            Constraints: Value must be `1150-65535`
        processor-features: |-
            The number of CPU cores and the number of threads per core for the DB instance class of the DB instance.

            This setting doesn't apply to RDS Custom.
        publicly-accessible: |-
            Specifies whether the DB instance is publicly accessible.

            When the DB instance is publicly accessible, its Domain Name System (DNS) endpoint resolves to the private IP address from within the DB instance's virtual private cloud (VPC). It resolves to the public IP address from outside of the DB instance's VPC. Access to the DB instance is ultimately controlled by the security group it uses. That public access is not permitted if the security group assigned to the DB instance doesn't permit it.

            When the DB instance isn't publicly accessible, it is an internal DB instance with a DNS name that resolves to a private IP address.

            For more information, see [CreateDBInstance]().
        storage-throughput: |-
            Specifies the storage throughput value for the DB instance.

            This setting doesn't apply to RDS Custom or Amazon Aurora.
        storage-type: |-
            Specifies the storage type to be associated with the DB instance.

            Valid Values: `gp2 | gp3 | io1 | io2 | standard`

            If you specify `io1`, `io2`, or `gp3`, you must also include a value for the `Iops` parameter.

            Default: `io1` if the `Iops` parameter is specified, otherwise `gp3`
        tags: ""
        tde-credential-arn: |-
            The ARN from the key store with which to associate the instance for TDE encryption.

            This setting doesn't apply to RDS Custom.
        tde-credential-password: |-
            The password for the given ARN from the key store in order to access the device.

            This setting doesn't apply to RDS Custom.
        use-default-processor-features: |-
            Specifies whether the DB instance class of the DB instance uses its default processor features.

            This setting doesn't apply to RDS Custom.
        vpc-security-group-ids: |-
            A list of EC2 VPC security groups to associate with this DB instance.

            Default: The default EC2 VPC security group for the DB subnet group's VPC.
