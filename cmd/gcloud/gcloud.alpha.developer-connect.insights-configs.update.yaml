name: update
description: '*(ALPHA)*  Update the configuration of an insight config.'
flags:
    --artifact-uri=!: Identifier for the specific artifact you want to update
    --build-project=!: The project ID of the project to where the artifact is built.
    --location=: The region of the insight config.
    --no-run-discovery&: Sets the state of the insight config to PENDING and kicks off the discovery flow.
    --run-discovery: Sets the state of the insight config to PENDING and kicks off the discovery flow.
documentation:
    command: |
        *(ALPHA)*  Update the configuration of an insights config.
    flag:
        artifact-uri: Identifier for the specific artifact you want to update
        build-project: The project ID of the project to where the artifact is built.
        location: |-
            The region of the insight config.
            +
            To set the `location` attribute:
            * provide the argument `insights_config` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-run-discovery: Sets the state of the insight config to PENDING and kicks off the discovery flow.
        run-discovery: Sets the state of the insight config to PENDING and kicks off the discovery flow.
