name: delete
description: delete an Image Import resource.
flags:
    --location=: Resource location.
documentation:
    command: |
        gcloud compute migration image-imports delete deletes an Image Import resource.
        To use this command, you must enable VM Migration API in your project.

        This command does not delete any images imported to Google Compute Engine.
    flag:
        location: |-
            Resource location.
            +
            To set the `location` attribute:
            * provide the argument `image_import_name` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/region`.
