name: search-available-phone-numbers
description: Searches for phone numbers that can be ordered.
flags:
    --area-code=: The area code used to filter results.
    --city=: The city used to filter results.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --country=: The country used to filter results.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of results to return in a single call.
    --next-token=: The token used to retrieve the next page of results.
    --phone-number-type=: The phone number type used to filter results.
    --state=: The state used to filter results.
    --toll-free-prefix=: The toll-free prefix that you use to filter results.
completion:
    flag:
        phone-number-type:
            - Local
            - TollFree
documentation:
    command: 'Searches for phone numbers that can be ordered. For US numbers, provide at least one of the following search filters: `AreaCode`, `City`, `State`, or `TollFreePrefix`. If you provide `City`, you must also provide `State`. Numbers outside the US only support the `PhoneNumberType` filter, which you must use.'
    flag:
        area-code: The area code used to filter results. Only applies to the US.
        city: The city used to filter results. Only applies to the US.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        country: 'The country used to filter results. Defaults to the US Format: ISO 3166-1 alpha-2.'
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The maximum number of results to return in a single call.
        next-token: The token used to retrieve the next page of results.
        phone-number-type: The phone number type used to filter results. Required for non-US numbers.
        state: The state used to filter results. Required only if you provide `City`. Only applies to the US.
        toll-free-prefix: The toll-free prefix that you use to filter results. Only applies to the US.
