name: list-pipeline-blueprints
description: Retrieves a list of all available blueprints for Data Prepper.
documentation:
    command: Retrieves a list of all available blueprints for Data Prepper. For more information, see [Using blueprints to create a pipeline](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/creating-pipeline.html#pipeline-blueprint).
