name: update-layout
description: Updates the attributes of an existing layout.
flags:
    --content=: Information about which fields will be present in the layout, the order of the fields.
    --domain-id=!: The unique identifier of the Cases domain.
    --layout-id=!: The unique identifier of the layout.
    --name=: The name of the layout.
documentation:
    command: |-
        Updates the attributes of an existing layout.

        If the action is successful, the service sends back an HTTP 200 response with an empty HTTP body.

        A `ValidationException` is returned when you add non-existent `fieldIds` to a layout.

        Title and Status fields cannot be part of layouts because they are not configurable.
    flag:
        content: Information about which fields will be present in the layout, the order of the fields.
        domain-id: The unique identifier of the Cases domain.
        layout-id: The unique identifier of the layout.
        name: The name of the layout. It must be unique per domain.
