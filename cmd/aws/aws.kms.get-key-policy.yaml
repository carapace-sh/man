name: get-key-policy
description: Gets a key policy attached to the specified KMS key.
flags:
    --key-id=!: Gets the key policy for the specified KMS key.
    --policy-name=: Specifies the name of the key policy.
documentation:
    command: |-
        Gets a key policy attached to the specified KMS key.

        **Cross-account use**: No. You cannot perform this operation on a KMS key in a different Amazon Web Services account.

        **Required permissions**: [kms:GetKeyPolicy](https://docs.aws.amazon.com/kms/latest/developerguide/kms-api-permissions-reference.html) (key policy)

        **Related operations**: [PutKeyPolicy](https://docs.aws.amazon.com/kms/latest/APIReference/API_PutKeyPolicy.html)

        **Eventual consistency**: The KMS API follows an eventual consistency model. For more information, see [KMS eventual consistency](https://docs.aws.amazon.com/kms/latest/developerguide/accessing-kms.html#programming-eventual-consistency).
    flag:
        key-id: |-
            Gets the key policy for the specified KMS key.

            Specify the key ID or key ARN of the KMS key.

            For example:

            - Key ID: `1234abcd-12ab-34cd-56ef-1234567890ab`
            - Key ARN: `arn:aws:kms:us-east-2:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab`

            To get the key ID and key ARN for a KMS key, use [ListKeys]() or [DescribeKey]().
        policy-name: Specifies the name of the key policy. If no policy name is specified, the default value is `default`. The only valid name is `default`. To get the names of key policies, use [ListKeyPolicies]().
