name: enable
description: '*(ALPHA)*  Enable a service for MCP on a project, folder or organization.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --folder=: The Google Cloud Platform folder ID to use for this invocation.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-skip-mcp-endpoint-check&: If true, the system will bypass the check for MCP endpoint while enabling a service.
    --organization=: The Google Cloud Platform organization ID to use for this invocation.
    --skip-mcp-endpoint-check: If true, the system will bypass the check for MCP endpoint while enabling a service.
documentation:
    command: |-
        *(ALPHA)*  Enable a service for MCP on a project, folder or organization

        ## EXAMPLES

        To enable a service for MCP called `my-service` on the current project, run:

          $ gcloud alpha services mcp enable my-service

        To enable a service for MCP called `my-service` on the project
        `my-project`, run:

          $ gcloud alpha services mcp enable my-service --project=my-project

        To enable a service for MCP called `my-service` on the folder
        `my-folder, run:

          $ gcloud alpha services mcp enable my-service --folder=my-folder

        To enable a service for MCP called `my-service` on the organization
        `my-organization`, run:

          $ gcloud alpha services mcp enable my-service --organization=my-organization

        To run the same command asynchronously (non-blocking), run:

          $ gcloud alpha services mcp enable my-service --async
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        folder: The Google Cloud Platform folder ID to use for this invocation.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-skip-mcp-endpoint-check: If true, the system will bypass the check for MCP endpoint while enabling a service.
        organization: The Google Cloud Platform organization ID to use for this invocation.
        skip-mcp-endpoint-check: If true, the system will bypass the check for MCP endpoint while enabling a service.
