name: send-media-message
description: Creates a new multimedia message (MMS) and sends it to a recipient's phone number.
flags:
    --configuration-set-name=: The name of the configuration set to use.
    --context=: You can specify custom data in this field.
    --destination-phone-number=!: The destination phone number in E.164 format.
    --dry-run=: When set to true, the message is checked and validated, but isn't sent to the end recipient.
    --max-price=: The maximum amount that you want to spend, in US dollars, per each MMS message.
    --media-urls=: An array of URLs to each media file to send.
    --message-body=: The text body of the message.
    --message-feedback-enabled: Set to true to enable message feedback for the message.
    --no-message-feedback-enabled&: Set to true to enable message feedback for the message.
    --origination-identity=!: The origination identity of the message.
    --protect-configuration-id=: The unique identifier of the protect configuration to use.
    --time-to-live=: How long the media message is valid for.
documentation:
    command: Creates a new multimedia message (MMS) and sends it to a recipient's phone number.
    flag:
        configuration-set-name: The name of the configuration set to use. This can be either the ConfigurationSetName or ConfigurationSetArn.
        context: You can specify custom data in this field. If you do, that data is logged to the event destination.
        destination-phone-number: The destination phone number in E.164 format.
        dry-run: When set to true, the message is checked and validated, but isn't sent to the end recipient.
        max-price: The maximum amount that you want to spend, in US dollars, per each MMS message.
        media-urls: |-
            An array of URLs to each media file to send.

            The media files have to be stored in an S3 bucket. Supported media file formats are listed in [MMS file types, size and character limits](https://docs.aws.amazon.com/sms-voice/latest/userguide/mms-limitations-character.html). For more information on creating an S3 bucket and managing objects, see [Creating a bucket](https://docs.aws.amazon.com/AmazonS3/latest/userguide/create-bucket-overview.html), [Uploading objects](https://docs.aws.amazon.com/AmazonS3/latest/userguide/upload-objects.html) in the *Amazon S3 User Guide*, and [Setting up an Amazon S3 bucket for MMS files](https://docs.aws.amazon.com/sms-voice/latest/userguide/send-mms-message.html#send-mms-message-bucket) in the *Amazon Web Services End User Messaging SMS User Guide*.
        message-body: The text body of the message.
        message-feedback-enabled: Set to true to enable message feedback for the message. When a user receives the message you need to update the message status using [PutMessageFeedback]().
        origination-identity: |-
            The origination identity of the message. This can be either the PhoneNumber, PhoneNumberId, PhoneNumberArn, SenderId, SenderIdArn, PoolId, or PoolArn.

            If you are using a shared End User MessagingSMS resource then you must use the full Amazon Resource Name(ARN).
        protect-configuration-id: The unique identifier of the protect configuration to use.
        time-to-live: How long the media message is valid for. By default this is 72 hours.
