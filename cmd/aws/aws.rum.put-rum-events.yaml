name: put-rum-events
description: Sends telemetry events about your application performance and user behavior to CloudWatch RUM.
flags:
    --alias=: If the app monitor uses a resource-based policy that requires `PutRumEvents` requests to specify a certain alias, specify that alias here.
    --app-monitor-details=!: A structure that contains information about the app monitor that collected this telemetry information.
    --batch-id=!: A unique identifier for this batch of RUM event data.
    --id=!: The ID of the app monitor that is sending this data.
    --rum-events=!: An array of structures that contain the telemetry event data.
    --user-details=!: A structure that contains information about the user session that this batch of events was collected from.
documentation:
    command: |-
        Sends telemetry events about your application performance and user behavior to CloudWatch RUM. The code snippet that RUM generates for you to add to your application includes `PutRumEvents` operations to send this data to RUM.

        Each `PutRumEvents` operation can send a batch of events from one user session.
    flag:
        alias: If the app monitor uses a resource-based policy that requires `PutRumEvents` requests to specify a certain alias, specify that alias here. This alias will be compared to the `rum:alias` context key in the resource-based policy. For more information, see [Using resource-based policies with CloudWatch RUM](https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-RUM-resource-policies.html).
        app-monitor-details: A structure that contains information about the app monitor that collected this telemetry information.
        batch-id: A unique identifier for this batch of RUM event data.
        id: The ID of the app monitor that is sending this data.
        rum-events: An array of structures that contain the telemetry event data.
        user-details: A structure that contains information about the user session that this batch of events was collected from.
