name: create-compute-quota
description: Create compute allocation definition.
flags:
    --activation-state=: The state of the compute allocation being described.
    --cluster-arn=!: ARN of the cluster.
    --compute-quota-config=!: Configuration of the compute allocation definition.
    --compute-quota-target=!: The target entity to allocate compute resources to.
    --description=: Description of the compute allocation definition.
    --name=!: Name to the compute allocation definition.
    --tags=: Tags of the compute allocation definition.
completion:
    flag:
        activation-state:
            - Enabled
            - Disabled
documentation:
    command: Create compute allocation definition. This defines how compute is allocated, shared, and borrowed for specified entities. Specifically, how to lend and borrow idle compute and assign a fair-share weight to the specified entities.
    flag:
        activation-state: |-
            The state of the compute allocation being described. Use to enable or disable compute allocation.

            Default is `Enabled`.
        cluster-arn: ARN of the cluster.
        compute-quota-config: Configuration of the compute allocation definition. This includes the resource sharing option, and the setting to preempt low priority tasks.
        compute-quota-target: The target entity to allocate compute resources to.
        description: Description of the compute allocation definition.
        name: Name to the compute allocation definition.
        tags: Tags of the compute allocation definition.
