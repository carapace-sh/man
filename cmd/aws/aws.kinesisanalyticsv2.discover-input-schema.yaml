name: discover-input-schema
description: Infers a schema for a SQL-based Kinesis Data Analytics application by evaluating sample records on the specified streaming source (Kinesis data stream or Kinesis Data Firehose delivery stream) or Amazon S3 object.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --input-processing-configuration=: The [InputProcessingConfiguration]() to use to preprocess the records before discovering the schema of the records.
    --input-starting-position-configuration=: The point at which you want Kinesis Data Analytics to start reading records from the specified streaming source for discovery purposes.
    --resource-arn=: The Amazon Resource Name (ARN) of the streaming source.
    --s3-configuration=: Specify this parameter to discover a schema from data in an Amazon S3 object.
    --service-execution-role=!: The ARN of the role that is used to access the streaming source.
documentation:
    command: |-
        Infers a schema for a SQL-based Kinesis Data Analytics application by evaluating sample records on the specified streaming source (Kinesis data stream or Kinesis Data Firehose delivery stream) or Amazon S3 object. In the response, the operation returns the inferred schema and also the sample records that the operation used to infer the schema.

        You can use the inferred schema when configuring a streaming source for your application. When you create an application using the Kinesis Data Analytics console, the console uses this operation to infer a schema and show it in the console user interface.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        input-processing-configuration: The [InputProcessingConfiguration]() to use to preprocess the records before discovering the schema of the records.
        input-starting-position-configuration: The point at which you want Kinesis Data Analytics to start reading records from the specified streaming source for discovery purposes.
        resource-arn: The Amazon Resource Name (ARN) of the streaming source.
        s3-configuration: Specify this parameter to discover a schema from data in an Amazon S3 object.
        service-execution-role: The ARN of the role that is used to access the streaming source.
