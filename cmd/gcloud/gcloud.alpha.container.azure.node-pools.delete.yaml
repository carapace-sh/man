name: delete
description: '*(ALPHA)*  *(DEPRECATED)*  Delete a node pool in an Anthos cluster on Azure.'
flags:
    --allow-missing: Allow idempotent deletion of node pool.
    --async: Return immediately, without waiting for the operation in progress to
    --cluster=: cluster of the nodepool.
    --ignore-errors: Force delete an Azure node pool.
    --location=: Google Cloud location for the nodepool.
    --no-allow-missing&: Allow idempotent deletion of node pool.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-ignore-errors&: Force delete an Azure node pool.
documentation:
    command: |+
        *(ALPHA)*  *(DEPRECATED)*  Delete a node pool in an Anthos cluster on Azure.

        This command is deprecated. See https://cloud.google.com/kubernetes-engine/multi-cloud/docs/azure/deprecations/deprecation-announcement for more details.

    flag:
        allow-missing: |-
            Allow idempotent deletion of node pool.
              The request will still succeed in case the node pool does not exist.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        cluster: |-
            cluster of the nodepool.
            +
            To set the `cluster` attribute:
            * provide the argument `node_pool` on the command line with a fully specified name;
            * provide the argument `--cluster` on the command line.
        ignore-errors: |-
            Force delete an Azure node pool.
              Deletion of the Azure node pool will succeed even if errors occur
              during deleting in-node pool resources. Using this parameter may
              result in orphaned resources in the node pool.
        location: |-
            Google Cloud location for the nodepool.
            +
            To set the `location` attribute:
            * provide the argument `node_pool` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_azure/location`.
        no-allow-missing: |
            Allow idempotent deletion of node pool.
              The request will still succeed in case the node pool does not exist.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-ignore-errors: |
            Force delete an Azure node pool.
              Deletion of the Azure node pool will succeed even if errors occur
              during deleting in-node pool resources. Using this parameter may
              result in orphaned resources in the node pool.
