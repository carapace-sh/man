name: create-notification
description: Creates a notification.
flags:
    --account-id=!: The `accountId` that is associated with the budget that you want to create a notification for.
    --budget-name=!: The name of the budget that you want Amazon Web Services to notify you about.
    --notification=!: The notification that you want to create.
    --subscribers=!: A list of subscribers that you want to associate with the notification.
documentation:
    command: Creates a notification. You must create the budget before you create the associated notification.
    flag:
        account-id: The `accountId` that is associated with the budget that you want to create a notification for.
        budget-name: The name of the budget that you want Amazon Web Services to notify you about. Budget names must be unique within an account.
        notification: The notification that you want to create.
        subscribers: A list of subscribers that you want to associate with the notification. Each notification can have one SNS subscriber and up to 10 email subscribers.
