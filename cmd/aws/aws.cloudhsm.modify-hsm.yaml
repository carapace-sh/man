name: modify-hsm
description: This is documentation for **AWS CloudHSM Classic**.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --eni-ip=: The new IP address for the elastic network interface (ENI) attached to the HSM.
    --external-id=: The new external ID.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --hsm-arn=!: The ARN of the HSM to modify.
    --iam-role-arn=: The new IAM role ARN.
    --subnet-id=: The new identifier of the subnet that the HSM is in.
    --syslog-ip=: The new IP address for the syslog monitoring server.
documentation:
    command: |-
        This is documentation for **AWS CloudHSM Classic**. For more information, see [AWS CloudHSM Classic FAQs](http://aws.amazon.com/cloudhsm/faqs-classic/), the [AWS CloudHSM Classic User Guide](https://docs.aws.amazon.com/cloudhsm/classic/userguide/), and the [AWS CloudHSM Classic API Reference](https://docs.aws.amazon.com/cloudhsm/classic/APIReference/).

        **For information about the current version of AWS CloudHSM**, see [AWS CloudHSM](http://aws.amazon.com/cloudhsm/), the [AWS CloudHSM User Guide](https://docs.aws.amazon.com/cloudhsm/latest/userguide/), and the [AWS CloudHSM API Reference](https://docs.aws.amazon.com/cloudhsm/latest/APIReference/).

        Modifies an HSM.

        This operation can result in the HSM being offline for up to 15 minutes while the AWS CloudHSM service is reconfigured. If you are modifying a production HSM, you should ensure that your AWS CloudHSM service is configured for high availability, and consider executing this operation during a maintenance window.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        eni-ip: |-
            The new IP address for the elastic network interface (ENI) attached to the HSM.

            If the HSM is moved to a different subnet, and an IP address is not specified, an IP address will be randomly chosen from the CIDR range of the new subnet.
        external-id: The new external ID.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        hsm-arn: The ARN of the HSM to modify.
        iam-role-arn: The new IAM role ARN.
        subnet-id: The new identifier of the subnet that the HSM is in. The new subnet must be in the same Availability Zone as the current subnet.
        syslog-ip: The new IP address for the syslog monitoring server. The AWS CloudHSM service only supports one syslog monitoring server.
