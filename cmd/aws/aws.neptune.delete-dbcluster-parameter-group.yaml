name: delete-dbcluster-parameter-group
description: Deletes a specified DB cluster parameter group.
flags:
    --dbcluster-parameter-group-name=!: The name of the DB cluster parameter group.
documentation:
    command: Deletes a specified DB cluster parameter group. The DB cluster parameter group to be deleted can't be associated with any DB clusters.
    flag:
        dbcluster-parameter-group-name: |-
            The name of the DB cluster parameter group.

            Constraints:

            - Must be the name of an existing DB cluster parameter group.
            - You can't delete a default DB cluster parameter group.
            - Cannot be associated with any DB clusters.
