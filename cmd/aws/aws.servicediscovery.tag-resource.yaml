name: tag-resource
description: Adds one or more tags to the specified resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource that you want to retrieve tags for.
    --tags=!: The tags to add to the specified resource.
documentation:
    command: Adds one or more tags to the specified resource.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource that you want to retrieve tags for.
        tags: The tags to add to the specified resource. Specifying the tag key is required. You can set the value of a tag to an empty string, but you can't set the value of a tag to null.
