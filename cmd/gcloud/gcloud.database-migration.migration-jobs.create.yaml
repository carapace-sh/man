name: create
description: Create a Database Migration Service migration job.
flags:
    --all-databases: Migrate all databases for the migration job.
    --cmek-key=!: ID of the cmek-key or fully qualified identifier for the cmek-key.
    --cmek-keyring=: The CMEK keyring id of the cmek-key.
    --cmek-project=: The Cloud project id for the cmek-key.
    --commit-id=: Commit id for the conversion workspace to use for creating the migration job.
    --conversion-workspace=!: ID of the conversion_workspace or fully qualified identifier for the conversion_workspace.
    --databases-filter=: A list of databases to be migrated to the destination instance.
    --destination=!: ID of the connection_profile or fully qualified identifier for the connection_profile.
    --display-name=: A user-friendly name for the migration job.
    --dump-flags=: A list of dump flags.
    --dump-parallel-level=: Parallelization level during initial dump of the migration job.
    --dump-path=: 'Path to the dump file in Google Cloud Storage, in the format:'
    --dump-type=: The type of the data dump.
    --filter=: Filter the entities based on [AIP-160](https://google.aip.dev/160) standard.
    --labels=: List of label KEY=VALUE pairs to add.
    --max-concurrent-cdc-connections=: Maximum number of connections Database Migration Service will open to
    --max-concurrent-destination-connections=: Maximum number of concurrent connections Database Migration Service will
    --max-concurrent-full-dump-connections=: Maximum number of connections Database Migration Service will open to
    --no-all-databases&: Migrate all databases for the migration job.
    --no-async: Waits for the operation in progress to complete before returning.
    --no-skip-full-dump&: Whether to skip full dump or not.
    --no-sqlserver-diff-backup&: Enable differential backups.
    --no-sqlserver-promote-when-ready&: Promote the database when it is ready.
    --no-static-ip&: Use the default IP allowlist method.
    --oracle-cdc-start-position=: Oracle schema change number (SCN) to start CDC data migration from.
    --original-migration-name=&: ID of the migration_job or fully qualified identifier for the migration_job.
    --peer-vpc=: Name of the VPC network to peer with the Cloud SQL private network.
    --region=: The Cloud region for the migration_job.
    --skip-full-dump: Whether to skip full dump or not.
    --source=!: ID of the connection_profile or fully qualified identifier for the connection_profile.
    --sqlserver-backup-file-pattern=&: Pattern that describes the default backup naming strategy.
    --sqlserver-cdc-start-position=: Sqlserver log squence number (LSN) to start CDC data migration from.
    --sqlserver-dag-linked-server=!&: The name of the linked server that points to the source SQL Server instance.
    --sqlserver-dag-source-ag=!&: The name of the source availability group.
    --sqlserver-databases=!: A list of databases to be migrated to the destination Cloud SQL instance.
    --sqlserver-diff-backup: Enable differential backups.
    --sqlserver-encrypted-databases=: A JSON/YAML file describing the encryption settings per database for all encrytped databases.
    --sqlserver-promote-when-ready: Promote the database when it is ready.
    --static-ip: Use the default IP allowlist method.
    --transaction-timeout=: Timeout for data migration transactions.
    --type=!: Type of the migration job.
    --vm-ip=!: Bastion Virtual Machine IP.
    --vm-port=!: Forwarding port for the SSH tunnel.
    --vm=: Name of VM that will host the SSH tunnel bastion.
    --vpc=!: Name of the VPC network where the VM is hosted.
completion:
    flag:
        dump-parallel-level:
            - MIN
            - OPTIMAL
            - MAX
        dump-type:
            - LOGICAL
            - PHYSICAL
        type:
            - ONE_TIME
            - CONTINUOUS
documentation:
    command: |
        Create a Database Migration Service migration job.
        Recommended steps before creating the migration job:
        - Create a source connection profile. See prerequisites [here](https://cloud.google.com/database-migration/docs/mysql/configure-source-database).
        - Create a destination connection profile. For migrating to Cloud SQL for MySQL or Cloud SQL for PostgreSQL, use the cloudsql connection profile for DMS to create the CloudSQL replica for you.
        - Configure the connectivity method. See prerequisites [here](https://cloud.google.com/database-migration/docs/mysql/configure-connectivity).
        - [Heterogeneous migrations only] Create a conversion workspace.
    flag:
        all-databases: |-
            Migrate all databases for the migration job. This flag is used only for
            Postgres to AlloyDB migrations and Postgres to Cloud SQL Postgres migrations.
        cmek-key: |-
            ID of the cmek-key or fully qualified identifier for the cmek-key.
            +
            To set the `cmek-key` attribute:
            * provide the argument `--cmek-key` on the command line.
        cmek-keyring: |-
            The CMEK keyring id of the cmek-key.
            +
            To set the `cmek-keyring` attribute:
            * provide the argument `--cmek-key` on the command line with a fully specified name;
            * provide the argument `--cmek-keyring` on the command line.
        cmek-project: |-
            The Cloud project id for the cmek-key.
            +
            To set the `cmek-project` attribute:
            * provide the argument `--cmek-key` on the command line with a fully specified name;
            * provide the argument `--cmek-project` on the command line.
        commit-id: Commit id for the conversion workspace to use for creating the migration job. If not specified, the latest commit id will be used by default.
        conversion-workspace: |-
            ID of the conversion_workspace or fully qualified identifier for the conversion_workspace.
            +
            To set the `conversion_workspace` attribute:
            * provide the argument `--conversion-workspace` on the command line.
        databases-filter: |-
            A list of databases to be migrated to the destination instance.
            Provide databases as a comma separated list. This flag is used only for
            Postgres to AlloyDB migrations and Postgres to Cloud SQL Postgres migrations.
        destination: |-
            ID of the connection_profile or fully qualified identifier for the connection_profile.
            +
            To set the `connection_profile` attribute:
            * provide the argument `--destination` on the command line.
        display-name: |-
            A user-friendly name for the migration job. The display name can include
            letters, numbers, spaces, and hyphens, and must start with a letter.
        dump-flags: 'A list of dump flags. An object containing a list of "key": "value" pairs.'
        dump-parallel-level: 'Parallelization level during initial dump of the migration job. If not specified, will be defaulted to OPTIMAL. _DUMP_PARALLEL_LEVEL_ must be one of: *MIN*, *OPTIMAL*, *MAX*.'
        dump-path: |-
            Path to the dump file in Google Cloud Storage, in the format:
            `gs://[BUCKET_NAME]/[OBJECT_NAME]`.
        dump-type: 'The type of the data dump. Currently applicable for MySQL to MySQL migrations only. _DUMP_TYPE_ must be one of: *LOGICAL*, *PHYSICAL*.'
        filter: 'Filter the entities based on [AIP-160](https://google.aip.dev/160) standard. Example: to filter all tables whose name start with "Employee" and are present under schema "Company", use filter as "Company.Employee```*``` AND type=TABLE"'
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        max-concurrent-cdc-connections: |-
            Maximum number of connections Database Migration Service will open to
            the source for CDC phase.
        max-concurrent-destination-connections: |-
            Maximum number of concurrent connections Database Migration Service will
            open to the destination for data migration.
        max-concurrent-full-dump-connections: |-
            Maximum number of connections Database Migration Service will open to
            the source for full dump phase.
        no-all-databases: |
            Migrate all databases for the migration job. This flag is used only for
            Postgres to AlloyDB migrations and Postgres to Cloud SQL Postgres migrations.
        no-async: Waits for the operation in progress to complete before returning.
        no-skip-full-dump: |
            Whether to skip full dump or not.
        no-sqlserver-diff-backup: |
            Enable differential backups. If not specified, differential backups
            are disabled by default. Use --sqlserver-diff-backup to enable and
            --no-sqlserver-diff-backup to disable. This flag is used only for
            homogeneous SQL Server to Cloud SQL for SQL Server migrations.
        no-sqlserver-promote-when-ready: |
            Promote the database when it is ready. Use --sqlserver-promote-when-ready
            to enable and --no-sqlserver-promote-when-ready to disable. This flag is
            used only for homogeneous SQL Server to Cloud SQL for SQL Server
            migrations.
        no-static-ip: Use the default IP allowlist method. This method creates a public IP that will be used with the destination Cloud SQL database. The method works by configuring the source database server to accept connections from the outgoing IP of the Cloud SQL instance.
        oracle-cdc-start-position: Oracle schema change number (SCN) to start CDC data migration from.
        original-migration-name: |-
            ID of the migration_job or fully qualified identifier for the migration_job.

            To set the `migration_job` attribute:
            * provide the argument `--original-migration-name` on the command line.
        peer-vpc: Name of the VPC network to peer with the Cloud SQL private network.
        region: |-
            The Cloud region for the migration_job.
            +
            To set the `region` attribute:
            * provide the argument `migration_job` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
        skip-full-dump: Whether to skip full dump or not.
        source: |-
            ID of the connection_profile or fully qualified identifier for the connection_profile.
            +
            To set the `connection_profile` attribute:
            * provide the argument `--source` on the command line.
        sqlserver-backup-file-pattern: |-
            Pattern that describes the default backup naming strategy. The specified pattern should ensure lexicographical order of backups. The pattern should define the following capture group set
            epoch - unix timestamp
            Example: For backup files TestDB.1691448240.bak, TestDB.1691448254.trn, TestDB.1691448284.trn.final use pattern: .*\.(<epoch>\d*)\.(trn|bak|trn\.final) or .*\.(<timestamp>\d*)\.(trn|bak|trn\.final)
            This flag is used only for SQL Server to Cloud SQL migrations.
        sqlserver-cdc-start-position: Sqlserver log squence number (LSN) to start CDC data migration from.
        sqlserver-dag-linked-server: The name of the linked server that points to the source SQL Server instance.
        sqlserver-dag-source-ag: The name of the source availability group.
        sqlserver-databases: |-
            A list of databases to be migrated to the destination Cloud SQL instance.
            Provide databases as a comma separated list. This list should contain all
            encrypted and non-encrypted database names. This flag is used only for
            SQL Server to Cloud SQL migrations.
        sqlserver-diff-backup: |-
            Enable differential backups. If not specified, differential backups
            are disabled by default. Use --sqlserver-diff-backup to enable and
            --no-sqlserver-diff-backup to disable. This flag is used only for
            homogeneous SQL Server to Cloud SQL for SQL Server migrations.
        sqlserver-encrypted-databases: |-
            A JSON/YAML file describing the encryption settings per database for all encrytped databases.
            Note:
            Path to the Certificate (.cer) and Private Key (.pvk) in Cloud Storage,
            should be in the form of `gs://bucketName/fileName`. The instance must
            have write permissions to the bucket and read access to the file.
            An example of a JSON request:
                [{
                    "database": "db1",
                    "encryptionOptions": {
                        "certPath": "Path to certificate 1",
                        "pvkPath": "Path to certificate private key 1",
                        "pvkPassword": "Private key password 1"
                    }
                },
                {
                    "database": "db2",
                    "encryptionOptions": {
                        "certPath": "Path to certificate 2",
                        "pvkPath": "Path to certificate private key 2",
                        "pvkPassword": "Private key password 2"
                    }
                }]
            +
              This flag accepts "-" for stdin. This flag is used only for SQL Server to Cloud SQL migrations.
        sqlserver-promote-when-ready: |-
            Promote the database when it is ready. Use --sqlserver-promote-when-ready
            to enable and --no-sqlserver-promote-when-ready to disable. This flag is
            used only for homogeneous SQL Server to Cloud SQL for SQL Server
            migrations.
        static-ip: Use the default IP allowlist method. This method creates a public IP that will be used with the destination Cloud SQL database. The method works by configuring the source database server to accept connections from the outgoing IP of the Cloud SQL instance.
        transaction-timeout: Timeout for data migration transactions.
        type: 'Type of the migration job. _TYPE_ must be one of: *ONE_TIME*, *CONTINUOUS*.'
        vm: Name of VM that will host the SSH tunnel bastion.
        vm-ip: Bastion Virtual Machine IP.
        vm-port: Forwarding port for the SSH tunnel.
        vpc: Name of the VPC network where the VM is hosted.
