name: copy-volumes
description: Creates a crash-consistent, point-in-time copy of an existing Amazon EBS volume within the same Availability Zone.
flags:
    --client-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --iops=: The number of I/O operations per second (IOPS) to provision for the volume copy.
    --multi-attach-enabled: Indicates whether to enable Amazon EBS Multi-Attach for the volume copy.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-multi-attach-enabled: Indicates whether to enable Amazon EBS Multi-Attach for the volume copy.
    --size=: The size of the volume copy, in GiBs.
    --source-volume-id=!: The ID of the source EBS volume to copy.
    --tag-specifications=: The tags to apply to the volume copy during creation.
    --throughput=: The throughput to provision for the volume copy, in MiB/s.
    --volume-type=: The volume type for the volume copy.
completion:
    flag:
        volume-type:
            - standard
            - io1
            - io2
            - gp2
            - sc1
            - st1
            - gp3
documentation:
    command: Creates a crash-consistent, point-in-time copy of an existing Amazon EBS volume within the same Availability Zone. The volume copy can be attached to an Amazon EC2 instance once it reaches the `available` state. For more information, see [Copy an Amazon EBS volume](https://docs.aws.amazon.com/ebs/latest/userguide/ebs-copying-volume.html).
    flag:
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request. For more information, see [Ensure Idempotency](https://docs.aws.amazon.com/ec2/latest/devguide/ec2-api-idempotency.html).
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        iops: |-
            The number of I/O operations per second (IOPS) to provision for the volume copy. Required for `io1` and `io2` volumes. Optional for `gp3` volumes. Omit for all other volume types. Full provisioned IOPS performance can be achieved only once the volume copy is fully initialized.

            Valid ranges:

            - gp3: `3,000`(*default*)`- 80,000` IOPS
            - io1: `100 - 64,000` IOPS
            - io2: `100 - 256,000` IOPS

            [Instances built on the Nitro System](https://docs.aws.amazon.com/ec2/latest/instancetypes/ec2-nitro-instances.html) can support up to 256,000 IOPS. Other instances can support up to 32,000 IOPS.
        multi-attach-enabled: Indicates whether to enable Amazon EBS Multi-Attach for the volume copy. If you enable Multi-Attach, you can attach the volume to up to 16 Nitro instances in the same Availability Zone simultaneously. Supported with `io1` and `io2` volumes only. For more information, see [Amazon EBS Multi-Attach](https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volumes-multi.html).
        size: |-
            The size of the volume copy, in GiBs. The size must be equal to or greater than the size of the source volume. If not specified, the size defaults to the size of the source volume.

            Maximum supported sizes:

            - gp2: `16,384` GiB
            - gp3: `65,536` GiB
            - io1: `16,384` GiB
            - io2: `65,536` GiB
            - st1 and sc1: `16,384` GiB
            - standard: `1024` GiB
        source-volume-id: The ID of the source EBS volume to copy.
        tag-specifications: The tags to apply to the volume copy during creation.
        throughput: |-
            The throughput to provision for the volume copy, in MiB/s. Supported for `gp3` volumes only. Omit for all other volume types. Full provisioned throughput performance can be achieved only once the volume copy is fully initialized.

            Valid Range: `125 - 2000` MiB/s
        volume-type: The volume type for the volume copy. If not specified, the volume type defaults to `gp2`.
