name: describe-service-link-virtual-interfaces
description: Describes the Outpost service link virtual interfaces.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: The filters to use for narrowing down the request.
    --max-results=: The maximum number of results to return with a single call.
    --next-token=: The token for the next page of results.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --service-link-virtual-interface-ids=: The IDs of the service link virtual interfaces.
documentation:
    command: Describes the Outpost service link virtual interfaces.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            The filters to use for narrowing down the request. The following filters are supported:

            - `outpost-lag-id` - The ID of the Outpost LAG.
            - `outpost-arn` - The Outpost ARN.
            - `owner-id` - The ID of the Amazon Web Services account that owns the service link virtual interface.
            - `state` - The state of the Outpost LAG.
            - `vlan` - The ID of the address pool.
            - `service-link-virtual-interface-id` - The ID of the service link virtual interface.
            - `local-gateway-virtual-interface-id` - The ID of the local gateway virtual interface.
        max-results: The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned `nextToken` value.
        next-token: The token for the next page of results.
        service-link-virtual-interface-ids: The IDs of the service link virtual interfaces.
