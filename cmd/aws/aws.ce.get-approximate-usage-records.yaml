name: get-approximate-usage-records
description: Retrieves estimated usage records for hourly granularity or resource-level data at daily granularity.
flags:
    --approximation-dimension=!: The service to evaluate for the usage records.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --granularity=!: How granular you want the data to be.
    --services=:
        description: The service metadata for the service or services you want to query.
        nargs: -1
completion:
    flag:
        approximation-dimension:
            - SERVICE
            - RESOURCE
        granularity:
            - DAILY
            - MONTHLY
            - HOURLY
documentation:
    command: Retrieves estimated usage records for hourly granularity or resource-level data at daily granularity.
    flag:
        approximation-dimension: The service to evaluate for the usage records. You can choose resource-level data at daily granularity, or hourly granularity with or without resource-level data.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        granularity: How granular you want the data to be. You can enable data at hourly or daily granularity.
        services: The service metadata for the service or services you want to query. If not specified, all elements are returned.
