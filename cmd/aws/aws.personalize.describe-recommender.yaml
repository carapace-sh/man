name: describe-recommender
description: Describes the given recommender, including its status.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --recommender-arn=!: The Amazon Resource Name (ARN) of the recommender to describe.
documentation:
    command: |-
        Describes the given recommender, including its status.

        A recommender can be in one of the following states:

        - CREATE PENDING &gt; CREATE IN\_PROGRESS &gt; ACTIVE -or- CREATE FAILED
        - STOP PENDING &gt; STOP IN\_PROGRESS &gt; INACTIVE &gt; START PENDING &gt; START IN\_PROGRESS &gt; ACTIVE
        - DELETE PENDING &gt; DELETE IN\_PROGRESS

        When the `status` is `CREATE FAILED`, the response includes the `failureReason` key, which describes why.

        The `modelMetrics` key is null when the recommender is being created or deleted.

        For more information on recommenders, see [CreateRecommender](https://docs.aws.amazon.com/personalize/latest/dg/API_CreateRecommender.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
