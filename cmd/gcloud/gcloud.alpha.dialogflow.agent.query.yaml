name: query
description: '*(ALPHA)*  Send a text or audio conversational query to the agent of the current project.'
flags:
    --audio-encoding=!: Encoding of the audio file.
    --language=: The language code of the query.
    --query-audio-file=!: Path to an audio file to use as a conversational query.
    --query-text=: Conversational query in the form of text.
    --sample-rate=!: Sample rate of the audio file in Hertz.
    --session=: ID of the session to send the query to.
completion:
    flag:
        audio-encoding:
            - audio-encoding-alaw
            - audio-encoding-amr
            - audio-encoding-amr-wb
            - audio-encoding-flac
            - audio-encoding-linear-16
            - audio-encoding-mulaw
            - audio-encoding-ogg-opus
            - audio-encoding-speex-with-header-byte
            - audio-encoding-unspecified
documentation:
    command: |
        *(ALPHA)*  Send a text or audio conversational query to the agent of the current project.
    flag:
        audio-encoding: |-
            Encoding of the audio file.
            +
            See here for more information:
            https://cloud.google.com/dialogflow-enterprise/docs/reference/rest/v2/projects.agent.sessions/detectIntent#AudioEncoding.
            +
            _AUDIO_ENCODING_ must be one of: *audio-encoding-alaw*, *audio-encoding-amr*, *audio-encoding-amr-wb*, *audio-encoding-flac*, *audio-encoding-linear-16*, *audio-encoding-mulaw*, *audio-encoding-ogg-opus*, *audio-encoding-speex-with-header-byte*, *audio-encoding-unspecified*.
        language: |-
            The language code of the query. For information on supported languages, see:
            https://dialogflow.com/docs/languages.
        query-audio-file: Path to an audio file to use as a conversational query.
        query-text: Conversational query in the form of text.
        sample-rate: Sample rate of the audio file in Hertz.
        session: |-
            ID of the session to send the query to. This can be any number or string up to 36 bytes. By
            default, a different random ID will be used for every request.
