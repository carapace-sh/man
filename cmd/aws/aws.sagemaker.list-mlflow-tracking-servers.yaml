name: list-mlflow-tracking-servers
description: Lists all MLflow Tracking Servers.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --created-after=: Use the `CreatedAfter` filter to only list tracking servers created after a specific date and time.
    --created-before=: Use the `CreatedBefore` filter to only list tracking servers created before a specific date and time.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of tracking servers to list.
    --mlflow-version=: Filter for tracking servers using the specified MLflow version.
    --next-token=: If the previous response was truncated, you will receive this token.
    --page-size=: The size of each page to get in the AWS service call.
    --sort-by=: Filter for trackings servers sorting by name, creation time, or creation status.
    --sort-order=: Change the order of the listed tracking servers.
    --starting-token=: A token to specify where to start paginating.
    --tracking-server-status=: Filter for tracking servers with a specified creation status.
completion:
    flag:
        sort-by:
            - Name
            - CreationTime
            - Status
        sort-order:
            - Ascending
            - Descending
        tracking-server-status:
            - Creating
            - Created
            - CreateFailed
            - Updating
            - Updated
            - UpdateFailed
            - Deleting
            - DeleteFailed
            - Stopping
            - Stopped
            - StopFailed
            - Starting
            - Started
            - StartFailed
            - MaintenanceInProgress
            - MaintenanceComplete
            - MaintenanceFailed
documentation:
    command: Lists all MLflow Tracking Servers.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        created-after: Use the `CreatedAfter` filter to only list tracking servers created after a specific date and time. Listed tracking servers are shown with a date and time such as `"2024-03-16T01:46:56+00:00"`. The `CreatedAfter` parameter takes in a Unix timestamp. To convert a date and time into a Unix timestamp, see [EpochConverter](https://www.epochconverter.com/).
        created-before: Use the `CreatedBefore` filter to only list tracking servers created before a specific date and time. Listed tracking servers are shown with a date and time such as `"2024-03-16T01:46:56+00:00"`. The `CreatedBefore` parameter takes in a Unix timestamp. To convert a date and time into a Unix timestamp, see [EpochConverter](https://www.epochconverter.com/).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of tracking servers to list.
        mlflow-version: Filter for tracking servers using the specified MLflow version.
        next-token: If the previous response was truncated, you will receive this token. Use it in your next request to receive the next set of results.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        sort-by: Filter for trackings servers sorting by name, creation time, or creation status.
        sort-order: Change the order of the listed tracking servers. By default, tracking servers are listed in `Descending` order by creation time. To change the list order, you can specify `SortOrder` to be `Ascending`.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        tracking-server-status: Filter for tracking servers with a specified creation status.
