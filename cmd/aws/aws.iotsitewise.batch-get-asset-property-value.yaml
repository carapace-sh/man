name: batch-get-asset-property-value
description: Gets the current value for one or more asset properties.
flags:
    --entries=!: The list of asset property value entries for the batch get request.
    --next-token=: The token to be used for the next set of paginated results.
documentation:
    command: Gets the current value for one or more asset properties. For more information, see [Querying current values](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/query-industrial-data.html#current-values) in the *IoT SiteWise User Guide*.
    flag:
        entries: The list of asset property value entries for the batch get request. You can specify up to 128 entries per request.
        next-token: The token to be used for the next set of paginated results.
