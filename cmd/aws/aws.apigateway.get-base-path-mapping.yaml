name: get-base-path-mapping
description: Describe a BasePathMapping resource.
flags:
    --base-path=!: The base path name that callers of the API must provide as part of the URL after the domain name.
    --domain-name-id=: The identifier for the domain name resource.
    --domain-name=!: The domain name of the BasePathMapping resource to be described.
documentation:
    command: Describe a BasePathMapping resource.
    flag:
        base-path: The base path name that callers of the API must provide as part of the URL after the domain name. This value must be unique for all of the mappings across a single API. Specify '(none)' if you do not want callers to specify any base path name after the domain name.
        domain-name: The domain name of the BasePathMapping resource to be described.
        domain-name-id: The identifier for the domain name resource. Supported only for private custom domain names.
