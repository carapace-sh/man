name: list-license-configurations
description: Lists the license configurations for your account.
flags:
    --filters=: Filters to scope the results.
    --license-configuration-arns=: Amazon Resource Names (ARN) of the license configurations.
    --max-results=: Maximum number of results to return in a single call.
    --next-token=: Token for the next set of results.
documentation:
    command: Lists the license configurations for your account.
    flag:
        filters: |-
            Filters to scope the results. The following filters and logical operators are supported:

            - `licenseCountingType` - The dimension for which licenses are counted. Possible values are `vCPU` | `Instance` | `Core` | `Socket`.
            - `enforceLicenseCount` - A Boolean value that indicates whether hard license enforcement is used.
            - `usagelimitExceeded` - A Boolean value that indicates whether the available licenses have been exceeded.
        license-configuration-arns: Amazon Resource Names (ARN) of the license configurations.
        max-results: Maximum number of results to return in a single call.
        next-token: Token for the next set of results.
