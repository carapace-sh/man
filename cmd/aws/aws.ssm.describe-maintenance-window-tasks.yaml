name: describe-maintenance-window-tasks
description: Lists the tasks in a maintenance window.
flags:
    --filters=: Optional filters used to narrow down the scope of the returned tasks.
    --max-results=: The maximum number of items to return for this call.
    --next-token=: The token for the next set of items to return.
    --window-id=!: The ID of the maintenance window whose tasks should be retrieved.
documentation:
    command: |-
        Lists the tasks in a maintenance window.

        For maintenance window tasks without a specified target, you can't supply values for `--max-errors` and `--max-concurrency`. Instead, the system inserts a placeholder value of `1`, which may be reported in the response to this command. These values don't affect the running of your task and can be ignored.
    flag:
        filters: Optional filters used to narrow down the scope of the returned tasks. The supported filter keys are `WindowTaskId`, `TaskArn`, `Priority`, and `TaskType`.
        max-results: The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
        window-id: The ID of the maintenance window whose tasks should be retrieved.
