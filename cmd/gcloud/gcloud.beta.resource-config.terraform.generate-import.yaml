name: generate-import
description: '*(BETA)*  Generate Terraform import script for exported resources.'
flags:
    --output-dir=: Specify the output directory only for the generated import script.
    --output-module-file=: Specify the full path path for generated terraform module file.
    --output-script-file=: Specify the full path path for generated import script.
documentation:
    command: '*(BETA)*  Generate Terraform import script for exported resources.'
    flag:
        output-dir: Specify the output directory only for the generated import script. If specified directory does not exists it will be created. Generated script will have a default name of the form `terraform_import_YYYYMMDD-HH-MM-SS.sh|cmd`
        output-module-file: Specify the full path path for generated terraform module file. If not set, a default filename of `gcloud-export-modules.tf` will be generated.
        output-script-file: Specify the full path path for generated import script. If not set, a default filename of the form `terraform_import_YYYYMMDD-HH-MM-SS.sh|cmd` will be generated.
