name: describe-engine-default-cluster-parameters
description: Returns the default engine and system parameter information for the cluster database engine.
flags:
    --dbparameter-group-family=!: The name of the DB cluster parameter group family to return engine parameter information for.
    --filters=: This parameter is not currently supported.
    --marker=: An optional pagination token provided by a previous `DescribeEngineDefaultClusterParameters` request.
    --max-records=: The maximum number of records to include in the response.
documentation:
    command: Returns the default engine and system parameter information for the cluster database engine.
    flag:
        dbparameter-group-family: The name of the DB cluster parameter group family to return engine parameter information for.
        filters: This parameter is not currently supported.
        marker: An optional pagination token provided by a previous `DescribeEngineDefaultClusterParameters` request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that the remaining results can be retrieved.

            Default: 100

            Constraints: Minimum 20, maximum 100.
