name: list-environments
description: Lists Amazon DataZone environments.
flags:
    --aws-account-id=: The identifier of the Amazon Web Services account where you want to list environments.
    --aws-account-region=: The Amazon Web Services region where you want to list environments.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-identifier=!: The identifier of the Amazon DataZone domain.
    --environment-blueprint-identifier=: The identifier of the Amazon DataZone blueprint.
    --environment-profile-identifier=: The identifier of the environment profile.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of environments to return in a single call to `ListEnvironments`.
    --name=: The name of the environment.
    --next-token=: When the number of environments is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of environments, the response includes a pagination token named `NextToken`.
    --page-size=: The size of each page to get in the AWS service call.
    --project-identifier=!: The identifier of the Amazon DataZone project.
    --provider=: The provider of the environment.
    --starting-token=: A token to specify where to start paginating.
    --status=: The status of the environments that you want to list.
completion:
    flag:
        status:
            - ACTIVE
            - CREATING
            - UPDATING
            - DELETING
            - CREATE_FAILED
            - UPDATE_FAILED
            - DELETE_FAILED
            - VALIDATION_FAILED
            - SUSPENDED
            - DISABLED
            - EXPIRED
            - DELETED
            - INACCESSIBLE
documentation:
    command: Lists Amazon DataZone environments.
    flag:
        aws-account-id: The identifier of the Amazon Web Services account where you want to list environments.
        aws-account-region: The Amazon Web Services region where you want to list environments.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain-identifier: The identifier of the Amazon DataZone domain.
        environment-blueprint-identifier: The identifier of the Amazon DataZone blueprint.
        environment-profile-identifier: The identifier of the environment profile.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of environments to return in a single call to `ListEnvironments`. When the number of environments to be listed is greater than the value of `MaxResults`, the response contains a `NextToken` value that you can use in a subsequent call to `ListEnvironments` to list the next set of environments.
        name: The name of the environment.
        next-token: When the number of environments is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of environments, the response includes a pagination token named `NextToken`. You can specify this `NextToken` value in a subsequent call to `ListEnvironments` to list the next set of environments.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        project-identifier: The identifier of the Amazon DataZone project.
        provider: The provider of the environment.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        status: The status of the environments that you want to list.
