name: create-event-subscription
description: Creates an RDS event notification subscription.
flags:
    --enabled=: Specifies whether to activate the subscription.
    --event-categories=: A list of event categories for a particular source type (`SourceType`) that you want to subscribe to.
    --sns-topic-arn=!: The Amazon Resource Name (ARN) of the SNS topic created for event notification.
    --source-ids=: The list of identifiers of the event sources for which events are returned.
    --source-type=: The type of source that is generating the events.
    --subscription-name=!: The name of the subscription.
    --tags=: ""
documentation:
    command: |-
        Creates an RDS event notification subscription. This operation requires a topic Amazon Resource Name (ARN) created by either the RDS console, the SNS console, or the SNS API. To obtain an ARN with SNS, you must create a topic in Amazon SNS and subscribe to the topic. The ARN is displayed in the SNS console.

        You can specify the type of source (`SourceType`) that you want to be notified of and provide a list of RDS sources (`SourceIds`) that triggers the events. You can also provide a list of event categories (`EventCategories`) for events that you want to be notified of. For example, you can specify `SourceType` = `db-instance`, `SourceIds` = `mydbinstance1`, `mydbinstance2` and `EventCategories` = `Availability`, `Backup`.

        If you specify both the `SourceType` and `SourceIds`, such as `SourceType` = `db-instance` and `SourceIds` = `myDBInstance1`, you are notified of all the `db-instance` events for the specified source. If you specify a `SourceType` but do not specify `SourceIds`, you receive notice of the events for that source type for all your RDS sources. If you don't specify either the SourceType or the `SourceIds`, you are notified of events generated from all RDS sources belonging to your customer account.

        For more information about subscribing to an event for RDS DB engines, see [Subscribing to Amazon RDS event notification](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_Events.Subscribing.html) in the *Amazon RDS User Guide*.

        For more information about subscribing to an event for Aurora DB engines, see [Subscribing to Amazon RDS event notification](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_Events.Subscribing.html) in the *Amazon Aurora User Guide*.
    flag:
        enabled: Specifies whether to activate the subscription. If the event notification subscription isn't activated, the subscription is created but not active.
        event-categories: A list of event categories for a particular source type (`SourceType`) that you want to subscribe to. You can see a list of the categories for a given source type in the "Amazon RDS event categories and event messages" section of the [*Amazon RDS User Guide*](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_Events.Messages.html) or the [*Amazon Aurora User Guide*](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_Events.Messages.html) . You can also see this list by using the `DescribeEventCategories` operation.
        sns-topic-arn: |-
            The Amazon Resource Name (ARN) of the SNS topic created for event notification. SNS automatically creates the ARN when you create a topic and subscribe to it.

            RDS doesn't support FIFO (first in, first out) topics. For more information, see [Message ordering and deduplication (FIFO topics)](https://docs.aws.amazon.com/sns/latest/dg/sns-fifo-topics.html) in the *Amazon Simple Notification Service Developer Guide*.
        source-ids: |-
            The list of identifiers of the event sources for which events are returned. If not specified, then all sources are included in the response. An identifier must begin with a letter and must contain only ASCII letters, digits, and hyphens. It can't end with a hyphen or contain two consecutive hyphens.

            Constraints:

            - If `SourceIds` are supplied, `SourceType` must also be provided.
            - If the source type is a DB instance, a `DBInstanceIdentifier` value must be supplied.
            - If the source type is a DB cluster, a `DBClusterIdentifier` value must be supplied.
            - If the source type is a DB parameter group, a `DBParameterGroupName` value must be supplied.
            - If the source type is a DB security group, a `DBSecurityGroupName` value must be supplied.
            - If the source type is a DB snapshot, a `DBSnapshotIdentifier` value must be supplied.
            - If the source type is a DB cluster snapshot, a `DBClusterSnapshotIdentifier` value must be supplied.
            - If the source type is an RDS Proxy, a `DBProxyName` value must be supplied.
        source-type: |-
            The type of source that is generating the events. For example, if you want to be notified of events generated by a DB instance, you set this parameter to `db-instance`. For RDS Proxy events, specify `db-proxy`. If this value isn't specified, all events are returned.

            Valid Values:`db-instance | db-cluster | db-parameter-group | db-security-group | db-snapshot | db-cluster-snapshot | db-proxy | zero-etl | custom-engine-version | blue-green-deployment`
        subscription-name: |-
            The name of the subscription.

            Constraints: The name must be less than 255 characters.
        tags: ""
