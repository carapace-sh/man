name: update-response-headers-policy
description: Updates a response headers policy.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --id=!: The identifier for the response headers policy that you are updating.
    --if-match=: The version of the response headers policy that you are updating.
    --response-headers-policy-config=!: A response headers policy configuration.
documentation:
    command: |-
        Updates a response headers policy.

        When you update a response headers policy, the entire policy is replaced. You cannot update some policy fields independent of others. To update a response headers policy configuration:

        1. Use `GetResponseHeadersPolicyConfig` to get the current policy's configuration.
        2. Modify the fields in the response headers policy configuration that you want to update.
        3. Call `UpdateResponseHeadersPolicy`, providing the entire response headers policy configuration, including the fields that you modified and those that you didn't.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        id: The identifier for the response headers policy that you are updating.
        if-match: |-
            The version of the response headers policy that you are updating.

            The version is returned in the cache policy's `ETag` field in the response to `GetResponseHeadersPolicyConfig`.
        response-headers-policy-config: A response headers policy configuration.
