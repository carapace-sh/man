name: describe
description: '*(ALPHA)*  Describe a Dataproc GDC spark application.'
hidden: true
flags:
    --location=: Location of the Dataproc GDC resource.
    --service-instance=: The id of the Dataproc GDC instance.
documentation:
    command: '*(ALPHA)*  Describe a Dataproc GDC spark application'
    flag:
        location: |-
            Location of the Dataproc GDC resource.
            +

            To set the `location` attribute:
            * provide the argument `spark_application` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        service-instance: |-
            The id of the Dataproc GDC instance.
            +
            To set the `service-instance` attribute:
            * provide the argument `spark_application` on the command line with a fully specified name;
            * provide the argument `--service-instance` on the command line.
