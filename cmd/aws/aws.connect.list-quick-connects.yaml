name: list-quick-connects
description: Provides information about the quick connects for the specified Amazon Connect instance.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
    --quick-connect-types=: The type of quick connect.
documentation:
    command: Provides information about the quick connects for the specified Amazon Connect instance.
    flag:
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance. Both Instance ID and Instance ARN are supported input formats.
        max-results: The maximum number of results to return per page. The default MaxResult size is 100.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        quick-connect-types: 'The type of quick connect. In the Amazon Connect admin website, when you create a quick connect, you are prompted to assign one of the following types: Agent (USER), External (PHONE\_NUMBER), or Queue (QUEUE).'
