name: update-guardrail
description: Updates a guardrail with the values you specify.
flags:
    --automated-reasoning-policy-config=: Updated configuration for Automated Reasoning policies associated with the guardrail.
    --blocked-input-messaging=!: The message to return when the guardrail blocks a prompt.
    --blocked-outputs-messaging=!: The message to return when the guardrail blocks a model response.
    --content-policy-config=: The content policy to configure for the guardrail.
    --contextual-grounding-policy-config=: The contextual grounding policy configuration used to update a guardrail.
    --cross-region-config=: The system-defined guardrail profile that you're using with your guardrail.
    --description=: A description of the guardrail.
    --guardrail-identifier=!: The unique identifier of the guardrail.
    --kms-key-id=: The ARN of the KMS key with which to encrypt the guardrail.
    --name=!: A name for the guardrail.
    --sensitive-information-policy-config=: The sensitive information policy to configure for the guardrail.
    --topic-policy-config=: The topic policy to configure for the guardrail.
    --word-policy-config=: The word policy to configure for the guardrail.
documentation:
    command: "Updates a guardrail with the values you specify.\n\n- Specify a `name` and optional `description`.\n- Specify messages for when the guardrail successfully blocks a prompt or a model response in the `blockedInputMessaging` and `blockedOutputsMessaging` fields.\n- Specify topics for the guardrail to deny in the `topicPolicyConfig` object. Each [GuardrailTopicConfig](https://docs.aws.amazon.com/bedrock/latest/APIReference/API_GuardrailTopicConfig.html) object in the `topicsConfig` list pertains to one topic.\n  \n  - Give a `name` and `description` so that the guardrail can properly identify the topic.\n  - Specify `DENY` in the `type` field.\n  - (Optional) Provide up to five prompts that you would categorize as belonging to the topic in the `examples` list.\n- Specify filter strengths for the harmful categories defined in Amazon Bedrock in the `contentPolicyConfig` object. Each [GuardrailContentFilterConfig](https://docs.aws.amazon.com/bedrock/latest/APIReference/API_GuardrailContentFilterConfig.html) object in the `filtersConfig` list pertains to a harmful category. For more information, see [Content filters](https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-content-filters). For more information about the fields in a content filter, see [GuardrailContentFilterConfig](https://docs.aws.amazon.com/bedrock/latest/APIReference/API_GuardrailContentFilterConfig.html).\n  \n  - Specify the category in the `type` field.\n  - Specify the strength of the filter for prompts in the `inputStrength` field and for model responses in the `strength` field of the [GuardrailContentFilterConfig](https://docs.aws.amazon.com/bedrock/latest/APIReference/API_GuardrailContentFilterConfig.html).\n- (Optional) For security, include the ARN of a KMS key in the `kmsKeyId` field."
    flag:
        automated-reasoning-policy-config: Updated configuration for Automated Reasoning policies associated with the guardrail.
        blocked-input-messaging: The message to return when the guardrail blocks a prompt.
        blocked-outputs-messaging: The message to return when the guardrail blocks a model response.
        content-policy-config: The content policy to configure for the guardrail.
        contextual-grounding-policy-config: The contextual grounding policy configuration used to update a guardrail.
        cross-region-config: |-
            The system-defined guardrail profile that you're using with your guardrail. Guardrail profiles define the destination Amazon Web Services Regions where guardrail inference requests can be automatically routed.

            For more information, see the [Amazon Bedrock User Guide](https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-cross-region.html).
        description: A description of the guardrail.
        guardrail-identifier: The unique identifier of the guardrail. This can be an ID or the ARN.
        kms-key-id: The ARN of the KMS key with which to encrypt the guardrail.
        name: A name for the guardrail.
        sensitive-information-policy-config: The sensitive information policy to configure for the guardrail.
        topic-policy-config: The topic policy to configure for the guardrail.
        word-policy-config: The word policy to configure for the guardrail.
