name: get-trace-summaries
description: Retrieves IDs and annotations for traces available for a specified time frame using an optional filter.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --end-time=!: The end of the time frame for which to retrieve traces.
    --filter-expression=: Specify a filter expression to retrieve trace summaries for services or requests that meet certain requirements.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-items=: The  total number of items to return in the command's output.
    --next-token=: Specify the pagination token returned by a previous request to retrieve the next page of results.
    --no-sampling: Set to `true` to get summaries for only a subset of available traces.
    --sampling: Set to `true` to get summaries for only a subset of available traces.
    --sampling-strategy=: A parameter to indicate whether to enable sampling on trace summaries.
    --start-time=!: The start of the time frame for which to retrieve traces.
    --starting-token=: A token to specify where to start paginating.
    --time-range-type=: Query trace summaries by TraceId (trace start time), Event (trace update time), or Service (trace segment end time).
completion:
    flag:
        time-range-type:
            - TraceId
            - Event
            - Service
documentation:
    command: |-
        Retrieves IDs and annotations for traces available for a specified time frame using an optional filter. To get the full traces, pass the trace IDs to `BatchGetTraces`.

        A filter expression can target traced requests that hit specific service nodes or edges, have errors, or come from a known user. For example, the following filter expression targets traces that pass through `api.example.com`:

        `service("api.example.com")`

        This filter expression finds traces that have an annotation named `account` with the value `12345`:

        `annotation.account = "12345"`

        For a full list of indexed fields and keywords that you can use in filter expressions, see [Use filter expressions](https://docs.aws.amazon.com/xray/latest/devguide/aws-xray-interface-console.html#xray-console-filters) in the *Amazon Web Services X-Ray Developer Guide*.
