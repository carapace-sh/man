name: list-thing-types
description: Lists the existing thing types.
flags:
    --max-results=: The maximum number of results to return in this operation.
    --next-token=: To retrieve the next set of results, the `nextToken` value from a previous response; otherwise **null** to receive the first set of results.
    --thing-type-name=: The name of the thing type.
documentation:
    command: |-
        Lists the existing thing types.

        Requires permission to access the [ListThingTypes](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        max-results: The maximum number of results to return in this operation.
        next-token: To retrieve the next set of results, the `nextToken` value from a previous response; otherwise **null** to receive the first set of results.
        thing-type-name: The name of the thing type.
