name: put-image-tag-mutability
description: Updates the image tag mutability settings for the specified repository.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --image-tag-mutability-exclusion-filters=:
        description: A list of filters that specify which image tags should be excluded from the image tag mutability setting being applied.
        nargs: -1
    --image-tag-mutability=!: The tag mutability setting for the repository.
    --registry-id=: The Amazon Web Services account ID associated with the registry that contains the repository in which to update the image tag mutability settings.
    --repository-name=!: The name of the repository in which to update the image tag mutability settings.
completion:
    flag:
        image-tag-mutability:
            - MUTABLE
            - IMMUTABLE
            - IMMUTABLE_WITH_EXCLUSION
            - MUTABLE_WITH_EXCLUSION
documentation:
    command: Updates the image tag mutability settings for the specified repository. For more information, see [Image tag mutability](https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-tag-mutability.html) in the *Amazon Elastic Container Registry User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        image-tag-mutability: The tag mutability setting for the repository. If `MUTABLE` is specified, image tags can be overwritten. If `IMMUTABLE` is specified, all image tags within the repository will be immutable which will prevent them from being overwritten.
        image-tag-mutability-exclusion-filters: A list of filters that specify which image tags should be excluded from the image tag mutability setting being applied.
        registry-id: The Amazon Web Services account ID associated with the registry that contains the repository in which to update the image tag mutability settings. If you do not specify a registry, the default registry is assumed.
        repository-name: The name of the repository in which to update the image tag mutability settings.
