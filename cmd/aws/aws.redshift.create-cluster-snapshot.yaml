name: create-cluster-snapshot
description: Creates a manual snapshot of the specified cluster.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cluster-identifier=!: The cluster identifier for which you want a snapshot.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --manual-snapshot-retention-period=: The number of days that a manual snapshot is retained.
    --snapshot-identifier=!: A unique identifier for the snapshot that you are requesting.
    --tags=:
        description: A list of tag instances.
        nargs: -1
documentation:
    command: |-
        Creates a manual snapshot of the specified cluster. The cluster must be in the `available` state.

        For more information about working with snapshots, go to [Amazon Redshift Snapshots](https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-snapshots.html) in the *Amazon Redshift Cluster Management Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cluster-identifier: The cluster identifier for which you want a snapshot.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        manual-snapshot-retention-period: |-
            The number of days that a manual snapshot is retained. If the value is -1, the manual snapshot is retained indefinitely.

            The value must be either -1 or an integer between 1 and 3,653.

            The default value is -1.
        snapshot-identifier: |-
            A unique identifier for the snapshot that you are requesting. This identifier must be unique for all snapshots within the Amazon Web Services account.

            Constraints:

            - Cannot be null, empty, or blank
            - Must contain from 1 to 255 alphanumeric characters or hyphens
            - First character must be a letter
            - Cannot end with a hyphen or contain two consecutive hyphens

            Example: `my-snapshot-id`
        tags: A list of tag instances.
