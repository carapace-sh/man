name: upload-route-policy
description: Upload a route policy into a Compute Engine router.
flags:
    --file-format=: Format of the file passed to --file-name.
    --file-name=!: Local path to the file defining the policy
    --policy-name=: Name of the route policy to add/replace.
    --region=: Region of the router to upload.
completion:
    flag:
        file-format:
            - json
            - yaml
documentation:
    command: |
        *gcloud compute routers upload-route-policy* uploads a route policy into a Compute Engine router.
    flag:
        file-format: 'Format of the file passed to --file-name. _FILE_FORMAT_ must be one of: *json*, *yaml*.'
        file-name: Local path to the file defining the policy
        policy-name: Name of the route policy to add/replace.
        region: |-
            Region of the router to upload. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
