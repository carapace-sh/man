    --location=: Google Cloud location for the admin_cluster.
documentation:
    command: '*(BETA)*  Describe an Anthos on VMware admin cluster.'
    flag:
        location: |-
            Google Cloud location for the admin_cluster.
            +
            To set the `location` attribute:
            * provide the argument `admin_cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_vmware/location`.
