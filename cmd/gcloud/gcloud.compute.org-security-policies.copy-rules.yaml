name: copy-rules
description: Replace the rules of a Compute Engine organization security policy with rules from another policy.
flags:
    --organization=: Organization in which the organization security policy to copy the rules to.
    --source-security-policy=!: The URL of the source security policy to copy the rules from.
documentation:
    command: |-
        *gcloud compute org-security-policies copy-rules* is used to replace the rules of organization security policies. An
         organization security policy is a set of rules that controls access to
         various resources.
    flag:
        organization: Organization in which the organization security policy to copy the rules to. Must be set if security-policy is the short name.
        source-security-policy: The URL of the source security policy to copy the rules from.
