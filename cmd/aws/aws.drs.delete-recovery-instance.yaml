name: delete-recovery-instance
description: Deletes a single Recovery Instance by ID.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --recovery-instance-id=!: The ID of the Recovery Instance to be deleted.
documentation:
    command: Deletes a single Recovery Instance by ID. This deletes the Recovery Instance resource from Elastic Disaster Recovery. The Recovery Instance must be disconnected first in order to delete it.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
