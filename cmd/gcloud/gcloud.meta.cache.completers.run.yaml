name: run
description: Cloud SDK completer module tester.
hidden: true
flags:
    --attribute=: The name of the resource attribute for a resource argument auto-generated completer.
    --cache=: The cache name to operate on.
    --kwargs=: Keyword arg dict passed to the completer constructor.
    --no-stack-trace&: Enable all exception stack traces, including Cloud SDK core exceptions.
    --qualify=: A list of resource parameter names that must always be qualified.
    --resource-presentation-kwargs=: Dict of kwargs to be passed to the presentation spec for the resource argument for which a completer is being tested, such as name, prefixes, plural, flag name overrides (format as a list of semicolon-separated key:value pairs).
    --resource-spec-path=: The resource spec path for a resource argument auto-generated completer.
    --stack-trace: Enable all exception stack traces, including Cloud SDK core exceptions.
documentation:
    command: |-
        *gcloud meta cache completers run* is an ideal way to debug completer modules without interference
        from the shell.  Shells typically ignore completer errors by disabling all
        standard output, standard error and exception messaging.  Specify
        `--verbosity=INFO` to enable completion and resource cache tracing.
    flag:
        attribute: The name of the resource attribute for a resource argument auto-generated completer.
        cache: The cache name to operate on. May be prefixed by "resource://" for resource cache names. If only the prefix is specified then the default cache name for that prefix is used.
        kwargs: |-
            Keyword arg dict passed to the completer constructor. For example, use this to set the resource collection and list command for `DeprecatedListCommandCompleter`:
            +
              --kwargs=collection=...,foo="..."
        no-stack-trace: Enable all exception stack traces, including Cloud SDK core exceptions.
        qualify: A list of resource parameter names that must always be qualified. This is a manual setting for testing. The CLI sets this automatically.
        resource-presentation-kwargs: Dict of kwargs to be passed to the presentation spec for the resource argument for which a completer is being tested, such as name, prefixes, plural, flag name overrides (format as a list of semicolon-separated key:value pairs). Prefixes is False by default. Name is the resource spec name by default.
        resource-spec-path: The resource spec path for a resource argument auto-generated completer.
        stack-trace: Enable all exception stack traces, including Cloud SDK core exceptions. Enabled by default, use *--no-stack-trace* to disable.
