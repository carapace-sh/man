name: get-detectors
description: Gets all detectors or a single detector if a `detectorId` is specified.
flags:
    --detector-id=: The detector ID.
    --max-results=: The maximum number of objects to return for the request.
    --next-token=: The next token for the subsequent request.
documentation:
    command: Gets all detectors or a single detector if a `detectorId` is specified. This is a paginated API. If you provide a null `maxResults`, this action retrieves a maximum of 10 records per page. If you provide a `maxResults`, the value must be between 5 and 10. To get the next page results, provide the pagination token from the `GetDetectorsResponse` as part of your request. A null pagination token fetches the records from the beginning.
    flag:
        detector-id: The detector ID.
        max-results: The maximum number of objects to return for the request.
        next-token: The next token for the subsequent request.
