name: get-ipam-resource-cidrs
description: Returns resource CIDRs managed by IPAM in a given scope.
flags:
    --dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --filters=: One or more filters for the request.
    --ipam-pool-id=: The ID of the IPAM pool that the resource is in.
    --ipam-scope-id=!: The ID of the scope that the resource is in.
    --max-results=: The maximum number of results to return in the request.
    --next-token=: The token for the next page of results.
    --no-dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --resource-id=: The ID of the resource.
    --resource-owner=: The ID of the Amazon Web Services account that owns the resource.
    --resource-tag=: The resource tag.
    --resource-type=: The resource type.
completion:
    flag:
        resource-type:
            - vpc
            - subnet
            - eip
            - public-ipv4-pool
            - ipv6-pool
            - eni
documentation:
    command: Returns resource CIDRs managed by IPAM in a given scope. If an IPAM is associated with more than one resource discovery, the resource CIDRs across all of the resource discoveries is returned. A resource discovery is an IPAM component that enables IPAM to manage and monitor resources that belong to the owning account.
    flag:
        dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: One or more filters for the request. For more information about filtering, see [Filtering CLI output](https://docs.aws.amazon.com/cli/latest/userguide/cli-usage-filter.html).
        ipam-pool-id: The ID of the IPAM pool that the resource is in.
        ipam-scope-id: The ID of the scope that the resource is in.
        max-results: The maximum number of results to return in the request.
        next-token: The token for the next page of results.
        resource-id: The ID of the resource.
        resource-owner: The ID of the Amazon Web Services account that owns the resource.
        resource-tag: The resource tag.
        resource-type: The resource type.
