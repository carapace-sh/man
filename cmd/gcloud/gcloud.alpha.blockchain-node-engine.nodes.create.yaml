name: create
description: '*(ALPHA)*  Create a Blockchain Node Engine node.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --blockchain-type=: Blockchain type the node will connect run on.
    --consensus-client=: Consensus client for Ethereum nodes.
    --execution-client=: Execution client for Ethereum nodes.
    --location=: Location of the blockchain node resource.
    --network=: Blockchain network the node will connect to.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --node-type=: Node type - defines whether the node retains only recent data or an archival history.
completion:
    flag:
        blockchain-type:
            - ethereum
        consensus-client:
            - lighthouse
        execution-client:
            - geth
        network:
            - goerli
            - holesky
            - mainnet
            - sepolia
        node-type:
            - full
documentation:
    command: |
        *(ALPHA)*  Create a new Blockchain Node Engine node with the given name and configurations.

        If run asynchronously with `--async`, exits after printing
        one operation name that can be used to poll the status of the
        creation via:

          {top_command} operations describe
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        blockchain-type: |-
            Blockchain type the node will connect run on. _BLOCKCHAIN_TYPE_ must be (only one value is supported):
            +
            *ethereum*::: Ethereum blockchain.
            +
            :::
            +
        consensus-client: |-
            Consensus client for Ethereum nodes. _CONSENSUS_CLIENT_ must be (only one value is supported):
            +
            *lighthouse*::: Lighthouse execution client.
            +
            :::
            +
        execution-client: |-
            Execution client for Ethereum nodes. _EXECUTION_CLIENT_ must be (only one value is supported):
            +
            *geth*::: Geth execution client.
            +
            :::
            +
        location: |-
            Location of the blockchain node resource.
            +

            To set the `location` attribute:
            * provide the argument `node_name` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `web3/location`.
        network: |-
            Blockchain network the node will connect to. _NETWORK_ must be one of:
            +
            *goerli*::: Goerli & Prater Ethereum test network.
            +
            *holesky*::: Holesky Ethereum test network.
            +
            *mainnet*::: Primary Ethereum network, often referred to as mainnet.
            +
            *sepolia*::: Sepolia Ethereum test network.
            +
            :::
            +
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        node-type: |-
            Node type - defines whether the node retains only recent data or an archival history. _NODE_TYPE_ must be (only one value is supported):
            +
            *full*::: Node retains full history required for consensus validation, however does not retain
            archival data beyond that.
            +
            :::
            +
