name: put-environment-blueprint-configuration
description: Writes the configuration for the specified environment blueprint in Amazon DataZone.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-identifier=!: The identifier of the Amazon DataZone domain.
    --enabled-regions=!: Specifies the enabled Amazon Web Services Regions.
    --environment-blueprint-identifier=!: The identifier of the environment blueprint.
    --environment-role-permission-boundary=: The environment role permissions boundary.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --global-parameters=: Region-agnostic environment blueprint parameters.
    --manage-access-role-arn=: The ARN of the manage access role.
    --provisioning-configurations=: The provisioning configuration of a blueprint.
    --provisioning-role-arn=: The ARN of the provisioning role.
    --regional-parameters=: The regional parameters in the environment blueprint.
documentation:
    command: Writes the configuration for the specified environment blueprint in Amazon DataZone.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain-identifier: The identifier of the Amazon DataZone domain.
        enabled-regions: Specifies the enabled Amazon Web Services Regions.
        environment-blueprint-identifier: The identifier of the environment blueprint.
        environment-role-permission-boundary: The environment role permissions boundary.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        global-parameters: Region-agnostic environment blueprint parameters.
        manage-access-role-arn: The ARN of the manage access role.
        provisioning-configurations: The provisioning configuration of a blueprint.
        provisioning-role-arn: The ARN of the provisioning role.
        regional-parameters: The regional parameters in the environment blueprint.
