name: create
description: Creates a new Cloud SQL instance.
flags:
    --activation-policy=: Activation policy for this instance.
    --active-directory-dns-servers=: A comma-separated list of the DNS servers to be used for Active Directory.
    --active-directory-domain=: Managed Service for Microsoft Active Directory domain this instance is joined to.
    --active-directory-mode=: Defines the Active Directory mode.
    --active-directory-organizational-unit=: Defines the organizational unit to be used for Active Directory.
    --active-directory-secret-manager-key=: The secret manager key storing administrator credentials.
    --allowed-psc-projects=: A comma-separated list of projects.
    --assign-ip: Assign a public IP address to the instance.
    --async: Return immediately, without waiting for the operation in progress to
    --audit-bucket-path=: The location, as a Cloud Storage bucket, to which audit files are uploaded.
    --audit-retention-interval=: The number of days for audit log retention on disk, for example, 3dfor 3 days.
    --audit-upload-interval=: How often to upload audit logs (audit files), for example, 30mfor 30 minutes.
    --authorized-networks=: The list of external networks that are allowed to connect to the instance.
    --auto-scale-disable-scale-in: Disables automatic read pool scale-in.
    --auto-scale-enabled: Enables read pool auto scaling.
    --auto-scale-in-cooldown-seconds=: The cooldown period for automatic read pool scale-in.
    --auto-scale-max-node-count=: Maximum number of read pool nodes to be maintained.
    --auto-scale-min-node-count=: Minimum number of read pool nodes to be maintained.
    --auto-scale-out-cooldown-seconds=: The cooldown period for automatic read pool scale-out.
    --auto-scale-target-metrics=: Target metrics for read pool auto scaling.
    --availability-type=: Specifies level of availability.
    --backup: Enables daily backup.
    --backup-location=: Choose where to store your backups.
    --backup-start-time=: Start time of daily backups, specified in the HH:MM format, in the UTC timezone.
    --cascadable-replica: Specifies whether a SQL Server replica is a cascadable replica.
    --clear-active-directory-dns-servers: Removes the list of DNS Servers from the Active Directory Config.
    --collation=: Cloud SQL server-level collation setting, which specifies the set of rules for comparing characters in a character set.
    --connection-pool-flags=: Comma-separated list of connection pool flags to set on the instance connection pool.
    --connector-enforcement=: Cloud SQL Connector enforcement mode.
    --cpu=: Whole number value indicating how many cores are desired in the machine.
    --custom-subject-alternative-names=: A comma-separated list of DNS names to add to the instance's SSL certificate.
    --database-flags=: Comma-separated list of database flags to set on the instance.
    --database-version=: The database engine type and versions.
    --deletion-protection: Enable deletion protection on a Cloud SQL instance.
    --deny-maintenance-period-end-date=: Date when the deny maintenance period ends, that is ``2021-01-10''.
    --deny-maintenance-period-start-date=: Date when the deny maintenance period begins, that is ``2020-11-01''.
    --deny-maintenance-period-time=: Time when the deny maintenance period starts or ends, that is ``05:00:00''.
    --disk-encryption-key-keyring=: The KMS keyring of the key.
    --disk-encryption-key-location=: The Google Cloud location for the key.
    --disk-encryption-key-project=: The Google Cloud project for the key.
    --disk-encryption-key=!: ID of the key or fully qualified identifier for the key.
    --edition=: Specifies the edition of Cloud SQL instance.
    --enable-auto-upgrade-minor-version: Enables auto-upgrade for MySQL 8.0 minor versions.
    --enable-bin-log: Allows for data recovery from a specific point in time, down to a fraction of a second.
    --enable-connection-pooling: Enable connection pooling for the instance.
    --enable-data-cache: Enable use of data cache for accelerated read performance.
    --enable-dataplex-integration: Enable Dataplex integration for Google Cloud SQL.
    --enable-google-ml-integration: Enable Vertex AI integration for Google Cloud SQL.
    --enable-google-private-path: Enable a private path for Google Cloud services.
    --enable-password-policy: Enable the password policy, which enforces user password management with
    --enable-point-in-time-recovery: Allows for data recovery from a specific point in time, down to a fraction of a second, via write-ahead logs.
    --enable-private-service-connect: Enable connecting to the Cloud SQL instance with Private Service Connect.
    --enforce-new-sql-network-architecture: Force the instance to use the new network architecture.
    --failover-replica-name=: Also create a failover replica with the specified name.
    --final-backup: Enables the final backup to be taken at the time of instance deletion.
    --final-backup-retention-days=: Specifies number of days to retain final backup.
    --gce-zone=: (DEPRECATED) Preferred Compute Engine zone (e.g. us-central1-a, us-central1-b, etc.).
    --insights-config-query-insights-enabled: Enable query insights feature to provide query and query plan
    --insights-config-query-plans-per-minute=: Number of query plans to sample every minute.
    --insights-config-query-string-length=: Sets the default query length limit.
    --insights-config-record-application-tags: Allow application tags to be recorded by the query insights
    --insights-config-record-client-address: Allow the client address to be recorded by the query insights
    --instance-type=: The type of the instance.
    --maintenance-release-channel=: Which channel's updates to apply during the maintenance window.
    --maintenance-window-day=: Day of week for maintenance window, in UTC time zone.
    --maintenance-window-hour=: Hour of day for maintenance window, in UTC time zone.
    --master-instance-name=: Name of the instance which will act as master in the replication setup.
    --memory=: Whole number value indicating how much memory is desired in the machine.
    --network=: Network in the current project that the instance will be part of.
    --no-assign-ip&: Assign a public IP address to the instance.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-auto-scale-disable-scale-in&: Disables automatic read pool scale-in.
    --no-auto-scale-enabled&: Enables read pool auto scaling.
    --no-backup&: Enables daily backup.
    --no-cascadable-replica&: Specifies whether a SQL Server replica is a cascadable replica.
    --no-clear-active-directory-dns-servers&: Removes the list of DNS Servers from the Active Directory Config.
    --no-deletion-protection&: Enable deletion protection on a Cloud SQL instance.
    --no-enable-auto-upgrade-minor-version&: Enables auto-upgrade for MySQL 8.0 minor versions.
    --no-enable-bin-log&: Allows for data recovery from a specific point in time, down to a fraction of a second.
    --no-enable-connection-pooling&: Enable connection pooling for the instance.
    --no-enable-data-cache&: Enable use of data cache for accelerated read performance.
    --no-enable-dataplex-integration&: Enable Dataplex integration for Google Cloud SQL.
    --no-enable-google-ml-integration&: Enable Vertex AI integration for Google Cloud SQL.
    --no-enable-google-private-path&: Enable a private path for Google Cloud services.
    --no-enable-password-policy&: Enable the password policy, which enforces user password management with
    --no-enable-point-in-time-recovery&: Allows for data recovery from a specific point in time, down to a fraction of a second, via write-ahead logs.
    --no-enable-private-service-connect&: Enable connecting to the Cloud SQL instance with Private Service Connect.
    --no-enforce-new-sql-network-architecture&: Force the instance to use the new network architecture.
    --no-final-backup&: Enables the final backup to be taken at the time of instance deletion.
    --no-insights-config-query-insights-enabled&: Enable query insights feature to provide query and query plan
    --no-insights-config-record-application-tags&: Allow application tags to be recorded by the query insights
    --no-insights-config-record-client-address&: Allow the client address to be recorded by the query insights
    --no-password-policy-disallow-username-substring&: Disallow username as a part of the password.
    --no-recreate-replicas-on-primary-crash&: Allow/Disallow replica recreation when a primary MySQL instance operating in reduced durability mode crashes.
    --no-require-ssl&: Specified if users connecting over IP must use SSL.
    --no-retain-backups-on-delete&: Retain automated/ondemand backups of the instance after the instance is deleted.
    --no-storage-auto-increase&: Storage size can be increased, but it cannot be decreased; storage increases are permanent for the life of the instance.
    --node-count=: The number of nodes in the pool.
    --password-policy-complexity=: The complexity of the password.
    --password-policy-disallow-username-substring: Disallow username as a part of the password.
    --password-policy-min-length=: Minimum number of characters allowed in the password.
    --password-policy-password-change-interval=: Minimum interval after which the password can be changed, for example,
    --password-policy-reuse-interval=: Number of previous passwords that cannot be reused.
    --psc-auto-connections=: A comma-separated list of networks or network-project pairs.
    --recreate-replicas-on-primary-crash: Allow/Disallow replica recreation when a primary MySQL instance operating in reduced durability mode crashes.
    --region=: Regional location (e.g. asia-east1, us-east1).
    --replica-type=: The type of replica to create.
    --replication=: Type of replication this instance uses.
    --require-ssl: Specified if users connecting over IP must use SSL.
    --retain-backups-on-delete: Retain automated/ondemand backups of the instance after the instance is deleted.
    --retained-backups-count=: How many backups to keep.
    --retained-transaction-log-days=: How many days of transaction logs to keep.
    --root-password=: Root Cloud SQL user's password.
    --secondary-zone=: Preferred secondary Compute Engine zone (e.g. us-central1-a, us-central1-b, etc.).
    --server-ca-mode=: Set the server CA mode of the instance.
    --server-ca-pool=: Set the server CA pool of the instance.
    --ssl-mode=: Set the SSL mode of the instance.
    --storage-auto-increase: Storage size can be increased, but it cannot be decreased; storage increases are permanent for the life of the instance.
    --storage-provisioned-iops=: Indicates how many IOPS to provision for the data disk.
    --storage-provisioned-throughput=: Indicates how much throughput to provision for the data disk.
    --storage-size=: Amount of storage allocated to the instance.
    --storage-type=: The storage type for the instance, determined by the selected machine type.
    --tags=: Comma-separated list of tags to set on the instance.
    --threads-per-core=: The number of threads per core.
    --tier=: Machine type for a shared-core instance e.g. ``db-g1-small''.
    --time-zone=: Set a non-default time zone.
    --timeout=: Time to synchronously wait for the operation to complete, after which the operation continues asynchronously.
    --zone=: Preferred Compute Engine zone (e.g. us-central1-a, us-central1-b, etc.).
