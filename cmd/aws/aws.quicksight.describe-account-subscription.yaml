documentation:
    command: Use the DescribeAccountSubscription operation to receive a description of an QuickSight account's subscription. A successful API call returns an `AccountInfo` object that includes an account's name, subscription status, authentication type, edition, and notification email address.
    flag:
        aws-account-id: The Amazon Web Services account ID associated with your QuickSight account.
