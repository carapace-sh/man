name: associate-file-system
description: Associate an Amazon FSx file system with the FSx File Gateway.
flags:
    --audit-destination-arn=: The Amazon Resource Name (ARN) of the storage used for the audit logs.
    --cache-attributes=: ""
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=!: A unique string value that you supply that is used by the FSx File Gateway to ensure idempotent file system association creation.
    --endpoint-network-configuration=: Specifies the network configuration information for the gateway associated with the Amazon FSx file system.
    --gateway-arn=!: ""
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --location-arn=!: The Amazon Resource Name (ARN) of the Amazon FSx file system to associate with the FSx File Gateway.
    --password=!: The password of the user credential.
    --tags=: A list of up to 50 tags that can be assigned to the file system association.
    --user-name=!: The user name of the user credential that has permission to access the root share D$ of the Amazon FSx file system.
documentation:
    command: Associate an Amazon FSx file system with the FSx File Gateway. After the association process is complete, the file shares on the Amazon FSx file system are available for access through the gateway. This operation only supports the FSx File Gateway type.
    flag:
        audit-destination-arn: The Amazon Resource Name (ARN) of the storage used for the audit logs.
        cache-attributes: ""
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique string value that you supply that is used by the FSx File Gateway to ensure idempotent file system association creation.
        endpoint-network-configuration: |-
            Specifies the network configuration information for the gateway associated with the Amazon FSx file system.

            If multiple file systems are associated with this gateway, this parameter's `IpAddresses` field is required.
        gateway-arn: ""
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        location-arn: The Amazon Resource Name (ARN) of the Amazon FSx file system to associate with the FSx File Gateway.
        password: The password of the user credential.
        tags: A list of up to 50 tags that can be assigned to the file system association. Each tag is a key-value pair.
        user-name: The user name of the user credential that has permission to access the root share D$ of the Amazon FSx file system. The user account must belong to the Amazon FSx delegated admin user group.
