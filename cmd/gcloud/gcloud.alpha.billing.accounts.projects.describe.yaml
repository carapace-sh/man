name: describe
description: '*(ALPHA)*  *(DEPRECATED)*  Show detailed billing information for a project.'
documentation:
    command: |4
        *(ALPHA)*  *(DEPRECATED)*  The `gcloud alpha billing accounts projects` group has been moved to `gcloud
        billing projects`. Please use the new, shorter commands instead.

        This command shows billing info for a project, given its ID.

        This call can fail for the following reasons:

        * The project specified does not exist.
        * The active user does not have permission to access the given
          project.
