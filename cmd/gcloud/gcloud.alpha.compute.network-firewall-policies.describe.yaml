name: describe
description: '*(ALPHA)*  Describe a Compute Engine network firewall policy.'
flags:
    --global: If set, the firewall policy is global.
    --no-global&: If set, the firewall policy is global.
    --region=: Region of the firewall policy to get.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute network-firewall-policies describe* is used to describe network firewall policies. A
        network firewall policy is a set of rules that controls access to various
        resources.
    flag:
        global: If set, the firewall policy is global.
        no-global: If set, the firewall policy is global.
        region: Region of the firewall policy to get. Overrides the default *compute/region* property value for this command invocation.
