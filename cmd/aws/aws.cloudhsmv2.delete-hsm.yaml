name: delete-hsm
description: Deletes the specified HSM.
flags:
    --cluster-id=!: The identifier (ID) of the cluster that contains the HSM that you are deleting.
    --eni-id=: The identifier (ID) of the elastic network interface (ENI) of the HSM that you are deleting.
    --eni-ip=: The IP address of the elastic network interface (ENI) of the HSM that you are deleting.
    --hsm-id=: The identifier (ID) of the HSM that you are deleting.
documentation:
    command: |-
        Deletes the specified HSM. To specify an HSM, you can use its identifier (ID), the IP address of the HSM's elastic network interface (ENI), or the ID of the HSM's ENI. You need to specify only one of these values. To find these values, use [DescribeClusters]().

        **Cross-account use:** No. You cannot perform this operation on an CloudHSM hsm in a different Amazon Web Services account.
    flag:
        cluster-id: The identifier (ID) of the cluster that contains the HSM that you are deleting.
        eni-id: The identifier (ID) of the elastic network interface (ENI) of the HSM that you are deleting.
        eni-ip: The IP address of the elastic network interface (ENI) of the HSM that you are deleting.
        hsm-id: The identifier (ID) of the HSM that you are deleting.
