name: list-backend-environments
description: Lists the backend environments for an Amplify app.
flags:
    --app-id=!: The unique ID for an Amplify app.
    --environment-name=: The name of the backend environment
    --max-results=: The maximum number of records to list in a single response.
    --next-token=: A pagination token.
documentation:
    command: |-
        Lists the backend environments for an Amplify app.

        This API is available only to Amplify Gen 1 applications where the backend is created using Amplify Studio or the Amplify command line interface (CLI). This API isn’t available to Amplify Gen 2 applications. When you deploy an application with Amplify Gen 2, you provision the app's backend infrastructure using Typescript code.
    flag:
        app-id: The unique ID for an Amplify app.
        environment-name: The name of the backend environment
        max-results: The maximum number of records to list in a single response.
        next-token: A pagination token. Set to null to start listing backend environments from the start. If a non-null pagination token is returned in a result, pass its value in here to list more backend environments.
