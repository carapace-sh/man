name: list-rescore-execution-plans
description: Lists your rescore execution plans.
flags:
    --max-results=: The maximum number of rescore execution plans to return.
    --next-token=: If the response is truncated, Amazon Kendra Intelligent Ranking returns a pagination token in the response.
documentation:
    command: Lists your rescore execution plans. A rescore execution plan is an Amazon Kendra Intelligent Ranking resource used for provisioning the `Rescore` API.
    flag:
        max-results: The maximum number of rescore execution plans to return.
        next-token: If the response is truncated, Amazon Kendra Intelligent Ranking returns a pagination token in the response. You can use this pagination token to retrieve the next set of rescore execution plans.
