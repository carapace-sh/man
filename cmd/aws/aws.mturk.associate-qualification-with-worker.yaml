name: associate-qualification-with-worker
description: The `AssociateQualificationWithWorker` operation gives a Worker a Qualification.
flags:
    --integer-value=: The value of the Qualification to assign.
    --no-send-notification&: Specifies whether to send a notification email message to the Worker saying that the qualification was assigned to the Worker.
    --qualification-type-id=!: The ID of the Qualification type to use for the assigned Qualification.
    --send-notification: Specifies whether to send a notification email message to the Worker saying that the qualification was assigned to the Worker.
    --worker-id=!: The ID of the Worker to whom the Qualification is being assigned.
documentation:
    command: |-
        The `AssociateQualificationWithWorker` operation gives a Worker a Qualification. `AssociateQualificationWithWorker` does not require that the Worker submit a Qualification request. It gives the Qualification directly to the Worker.

        You can only assign a Qualification of a Qualification type that you created (using the `CreateQualificationType` operation).

        Note: `AssociateQualificationWithWorker` does not affect any pending Qualification requests for the Qualification by the Worker. If you assign a Qualification to a Worker, then later grant a Qualification request made by the Worker, the granting of the request may modify the Qualification score. To resolve a pending Qualification request without affecting the Qualification the Worker already has, reject the request with the `RejectQualificationRequest` operation.
    flag:
        integer-value: The value of the Qualification to assign.
        qualification-type-id: The ID of the Qualification type to use for the assigned Qualification.
        send-notification: 'Specifies whether to send a notification email message to the Worker saying that the qualification was assigned to the Worker. Note: this is true by default.'
        worker-id: The ID of the Worker to whom the Qualification is being assigned. Worker IDs are included with submitted HIT assignments and Qualification requests.
