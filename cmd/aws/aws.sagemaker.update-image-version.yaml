name: update-image-version
description: Updates the properties of a SageMaker AI image version.
flags:
    --alias=: The alias of the image version.
    --aliases-to-add=: A list of aliases to add.
    --aliases-to-delete=: A list of aliases to delete.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --horovod: Indicates Horovod compatibility.
    --image-name=!: The name of the image.
    --job-type=: Indicates SageMaker AI job type compatibility.
    --ml-framework=: The machine learning framework vended in the image version.
    --no-horovod: Indicates Horovod compatibility.
    --processor=: Indicates CPU or GPU compatibility.
    --programming-lang=: The supported programming language and its version.
    --release-notes=: The maintainer description of the image version.
    --vendor-guidance=: The availability of the image version specified by the maintainer.
    --version-number=: The version of the image.
completion:
    flag:
        job-type:
            - TRAINING
            - INFERENCE
            - NOTEBOOK_KERNEL
        processor:
            - CPU
            - GPU
        vendor-guidance:
            - NOT_PROVIDED
            - STABLE
            - TO_BE_ARCHIVED
            - ARCHIVED
documentation:
    command: Updates the properties of a SageMaker AI image version.
    flag:
        alias: The alias of the image version.
        aliases-to-add: A list of aliases to add.
        aliases-to-delete: A list of aliases to delete.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        horovod: Indicates Horovod compatibility.
        image-name: The name of the image.
        job-type: |-
            Indicates SageMaker AI job type compatibility.

            - `TRAINING`: The image version is compatible with SageMaker AI training jobs.
            - `INFERENCE`: The image version is compatible with SageMaker AI inference jobs.
            - `NOTEBOOK_KERNEL`: The image version is compatible with SageMaker AI notebook kernels.
        ml-framework: The machine learning framework vended in the image version.
        processor: |-
            Indicates CPU or GPU compatibility.

            - `CPU`: The image version is compatible with CPU.
            - `GPU`: The image version is compatible with GPU.
        programming-lang: The supported programming language and its version.
        release-notes: The maintainer description of the image version.
        vendor-guidance: |-
            The availability of the image version specified by the maintainer.

            - `NOT_PROVIDED`: The maintainers did not provide a status for image version stability.
            - `STABLE`: The image version is stable.
            - `TO_BE_ARCHIVED`: The image version is set to be archived. Custom image versions that are set to be archived are automatically archived after three months.
            - `ARCHIVED`: The image version is archived. Archived image versions are not searchable and are no longer actively supported.
        version-number: The version of the image.
