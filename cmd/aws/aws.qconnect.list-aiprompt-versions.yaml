name: list-aiprompt-versions
description: Lists AI Prompt versions.
flags:
    --ai-prompt-id=!: The identifier of the Amazon Q in Connect AI prompt for which versions are to be listed.
    --assistant-id=!: The identifier of the Amazon Q in Connect assistant.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
    --origin=: The origin of the AI Prompt versions to be listed.
completion:
    flag:
        origin:
            - SYSTEM
            - CUSTOMER
documentation:
    command: Lists AI Prompt versions.
    flag:
        ai-prompt-id: The identifier of the Amazon Q in Connect AI prompt for which versions are to be listed.
        assistant-id: The identifier of the Amazon Q in Connect assistant. Can be either the ID or the ARN. URLs cannot contain the ARN.
        max-results: The maximum number of results to return per page.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        origin: The origin of the AI Prompt versions to be listed. `SYSTEM` for a default AI Agent created by Q in Connect or `CUSTOMER` for an AI Agent created by calling AI Agent creation APIs.
