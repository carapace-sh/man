name: import-resources-to-draft-app-version
description: Imports resources to Resilience Hub application draft version from different input sources.
flags:
    --app-arn=!: Amazon Resource Name (ARN) of the Resilience Hub application.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --eks-sources=: The input sources of the Amazon Elastic Kubernetes Service resources you need to import.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --import-strategy=: The import strategy you would like to set to import resources into Resilience Hub application.
    --source-arns=: The Amazon Resource Names (ARNs) for the resources.
    --terraform-sources=: A list of terraform file s3 URLs you need to import.
completion:
    flag:
        import-strategy:
            - AddOnly
            - ReplaceAll
documentation:
    command: Imports resources to Resilience Hub application draft version from different input sources. For more information about the input sources supported by Resilience Hub, see [Discover the structure and describe your Resilience Hub application](https://docs.aws.amazon.com/resilience-hub/latest/userguide/discover-structure.html).
    flag:
        app-arn: 'Amazon Resource Name (ARN) of the Resilience Hub application. The format for this ARN is: arn:`partition`:resiliencehub:`region`:`account`:app/`app-id`. For more information about ARNs, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference* guide.'
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        eks-sources: The input sources of the Amazon Elastic Kubernetes Service resources you need to import.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        import-strategy: The import strategy you would like to set to import resources into Resilience Hub application.
        source-arns: The Amazon Resource Names (ARNs) for the resources.
        terraform-sources: A list of terraform file s3 URLs you need to import.
