name: describe
description: '*(ALPHA)*  Describe a volume restore.'
flags:
    --location=: Google Cloud location.
    --restore-plan=: Restore Plan name.
    --restore=: Restore name.
documentation:
    command: |
        *(ALPHA)*  Describe a Backup for GKE volume restore.

        ## EXAMPLES

        To describe a volume restore ``my-volume-restore'' in project ``my-project'' in location ``us-central1'' under restore plan ``my-restore-plan'' under restore ``my-restore'', run:

          $ gcloud alpha container backup-restore volume-restores describe my-volume-restore --project=my-project --location=us-central1 --restore-plan=my-restore-plan --restore=my-restore
    flag:
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `volume_restore` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkebackup/location`.
        restore: |-
            Restore name.
            +
            To set the `restore` attribute:
            * provide the argument `volume_restore` on the command line with a fully specified name;
            * provide the argument `--restore` on the command line;
            * set the property `gkebackup/restore`.
        restore-plan: |-
            Restore Plan name.
            +
            To set the `restore-plan` attribute:
            * provide the argument `volume_restore` on the command line with a fully specified name;
            * provide the argument `--restore-plan` on the command line;
            * set the property `gkebackup/restore_plan`.
