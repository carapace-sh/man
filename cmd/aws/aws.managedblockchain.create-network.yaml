name: create-network
description: Creates a new blockchain network using Amazon Managed Blockchain.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=!: This is a unique, case-sensitive identifier that you provide to ensure the idempotency of the operation.
    --description=: An optional description for the network.
    --framework-configuration=: Configuration properties of the blockchain framework relevant to the network configuration.
    --framework-version=!: The version of the blockchain framework that the network uses.
    --framework=!: The blockchain framework that the network uses.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --member-configuration=!: Configuration properties for the first member within the network.
    --name=!: The name of the network.
    --tags=: Tags to assign to the network.
    --voting-policy=!: The voting rules used by the network to determine if a proposal is approved.
completion:
    flag:
        framework:
            - HYPERLEDGER_FABRIC
            - ETHEREUM
documentation:
    command: |-
        Creates a new blockchain network using Amazon Managed Blockchain.

        Applies only to Hyperledger Fabric.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: This is a unique, case-sensitive identifier that you provide to ensure the idempotency of the operation. An idempotent operation completes no more than once. This identifier is required only if you make a service request directly using an HTTP client. It is generated automatically if you use an Amazon Web Services SDK or the Amazon Web Services CLI.
        description: An optional description for the network.
        framework: The blockchain framework that the network uses.
        framework-configuration: Configuration properties of the blockchain framework relevant to the network configuration.
        framework-version: The version of the blockchain framework that the network uses.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        member-configuration: Configuration properties for the first member within the network.
        name: The name of the network.
        tags: |-
            Tags to assign to the network.

            Each tag consists of a key and an optional value. You can specify multiple key-value pairs in a single request with an overall maximum of 50 tags allowed per resource.

            For more information about tags, see [Tagging Resources](https://docs.aws.amazon.com/managed-blockchain/latest/ethereum-dev/tagging-resources.html) in the *Amazon Managed Blockchain Ethereum Developer Guide*, or [Tagging Resources](https://docs.aws.amazon.com/managed-blockchain/latest/hyperledger-fabric-dev/tagging-resources.html) in the *Amazon Managed Blockchain Hyperledger Fabric Developer Guide*.
        voting-policy: The voting rules used by the network to determine if a proposal is approved.
