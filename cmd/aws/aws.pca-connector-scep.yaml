name: pca-connector-scep
description: Connector for SCEP creates a connector between Amazon Web Services Private CA and your SCEP-enabled clients and devices.
documentation:
    command: Connector for SCEP creates a connector between Amazon Web Services Private CA and your SCEP-enabled clients and devices. For more information, see [Connector for SCEP](https://docs.aws.amazon.com/privateca/latest/userguide/scep-connector.htmlconnector-for-scep.html) in the *Amazon Web Services Private CA User Guide*.
