name: disassociate-sbom-from-package-version
description: Disassociates the selected software bill of materials (SBOM) from a specific software package version.
flags:
    --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
    --package-name=!: The name of the new software package.
    --version-name=!: The name of the new package version.
documentation:
    command: |-
        Disassociates the selected software bill of materials (SBOM) from a specific software package version.

        Requires permission to access the [DisassociateSbomWithPackageVersion](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        client-token: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request. Don't reuse this client token if a new idempotent request is required.
        package-name: The name of the new software package.
        version-name: The name of the new package version.
