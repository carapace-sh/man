name: create-variable
description: Creates a variable.
flags:
    --data-source=!: The source of the data.
    --data-type=!: The data type of the variable.
    --default-value=!: The default value for the variable when no value is received.
    --description=: The description.
    --name=!: The name of the variable.
    --tags=: A collection of key and value pairs.
    --variable-type=: The variable type.
completion:
    flag:
        data-source:
            - EVENT
            - MODEL_SCORE
            - EXTERNAL_MODEL_SCORE
        data-type:
            - STRING
            - INTEGER
            - FLOAT
            - BOOLEAN
            - DATETIME
documentation:
    command: Creates a variable.
    flag:
        data-source: The source of the data.
        data-type: The data type of the variable.
        default-value: The default value for the variable when no value is received.
        description: The description.
        name: The name of the variable.
        tags: A collection of key and value pairs.
        variable-type: |-
            The variable type. For more information see [Variable types](https://docs.aws.amazon.com/frauddetector/latest/ug/create-a-variable.html#variable-types).

            Valid Values: `AUTH_CODE | AVS | BILLING_ADDRESS_L1 | BILLING_ADDRESS_L2 | BILLING_CITY | BILLING_COUNTRY | BILLING_NAME | BILLING_PHONE | BILLING_STATE | BILLING_ZIP | CARD_BIN | CATEGORICAL | CURRENCY_CODE | EMAIL_ADDRESS | FINGERPRINT | FRAUD_LABEL | FREE_FORM_TEXT | IP_ADDRESS | NUMERIC | ORDER_ID | PAYMENT_TYPE | PHONE_NUMBER | PRICE | PRODUCT_CATEGORY | SHIPPING_ADDRESS_L1 | SHIPPING_ADDRESS_L2 | SHIPPING_CITY | SHIPPING_COUNTRY | SHIPPING_NAME | SHIPPING_PHONE | SHIPPING_STATE | SHIPPING_ZIP | USERAGENT`
