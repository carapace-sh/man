name: seek
description: '*(ALPHA)*  Resets a subscription''s backlog to a point in time or to a given snapshot.'
flags:
    --snapshot-project=: The name of the project the snapshot belongs to (if seeking to
    --snapshot=: The name of the snapshot.
    --time=: The time to seek to.
documentation:
    command: '*(ALPHA)*  Resets a subscription''s backlog to a point in time or to a given snapshot.'
    flag:
        snapshot: The name of the snapshot. The snapshot's topic must be the same as that of the subscription.
        snapshot-project: |-
            The name of the project the snapshot belongs to (if seeking to
            a snapshot). If not set, it defaults to the currently selected
            cloud project.
        time: |-
            The time to seek to. Messages in the subscription that
            were published before this time are marked as acknowledged, and
            messages retained in the subscription that were published after
            this time are marked as unacknowledged.
            See $ gcloud topic datetimes for information on time formats.
