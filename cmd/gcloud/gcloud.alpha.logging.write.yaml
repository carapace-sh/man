name: write
description: '*(ALPHA)*  Write a log entry.'
flags:
    --billing-account=: Billing account of the log entries to write.
    --folder=: Folder of the log entries to write.
    --monitored-resource-labels=: Monitored Resource labels to add to the payload
    --monitored-resource-type=: Monitored Resource type to add to the payload
    --organization=: Organization of the log entries to write.
    --payload-type=: Type of the log entry payload.
    --severity=: Severity level of the log entry.
completion:
    flag:
        payload-type:
            - text
            - json
        severity:
            - DEFAULT
            - DEBUG
            - INFO
            - NOTICE
            - WARNING
            - ERROR
            - CRITICAL
            - ALERT
            - EMERGENCY
documentation:
    command: |
        *(ALPHA)*  Write a log entry.
        If the destination log does not exist, it will be created.
        By default, all log entries written with this command are written with
        the "global" resource type.

        gcloud alpha logging write should be used for simple testing purposes.
        Check Cloud Logging agent for a proper way to send log entries:
        [](https://cloud.google.com/logging/docs/agent/)
    flag:
        billing-account: Billing account of the log entries to write.
        folder: Folder of the log entries to write.
        monitored-resource-labels: Monitored Resource labels to add to the payload
        monitored-resource-type: Monitored Resource type to add to the payload
        organization: Organization of the log entries to write.
        payload-type: 'Type of the log entry payload. _PAYLOAD_TYPE_ must be one of: *text*, *json*.'
        severity: 'Severity level of the log entry. _SEVERITY_ must be one of: *DEFAULT*, *DEBUG*, *INFO*, *NOTICE*, *WARNING*, *ERROR*, *CRITICAL*, *ALERT*, *EMERGENCY*.'
