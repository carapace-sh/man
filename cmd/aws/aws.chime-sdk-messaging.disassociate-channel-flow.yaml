name: disassociate-channel-flow
description: Disassociates a channel flow from all its channels.
flags:
    --channel-arn=!: The ARN of the channel.
    --channel-flow-arn=!: The ARN of the channel flow.
    --chime-bearer=!: The `AppInstanceUserArn` of the user making the API call.
documentation:
    command: |-
        Disassociates a channel flow from all its channels. Once disassociated, all messages to that channel stop going through the channel flow processor.

        Only administrators or channel moderators can disassociate a channel flow.

        The `x-amz-chime-bearer` request header is mandatory. Use the ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call as the value in the header.
    flag:
        channel-arn: The ARN of the channel.
        channel-flow-arn: The ARN of the channel flow.
        chime-bearer: The `AppInstanceUserArn` of the user making the API call.
