name: github
description: Create a Cloud Build Connection of type GitHub.
flags:
    --app-installation-id=: Installation ID of the Cloud Build GitHub App.
    --async: Return immediately, without waiting for the operation in progress to
    --authorizer-token-secret-version=!: Secret containing the authorizer user's token.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: The Google Cloud region.
documentation:
    command: |
        Create a Cloud Build Connection of type GitHub (for github.com).

        Connections for github.com can be created either by following an installation process (that
        requires manual steps in a web browser) or by providing the properties of an already-installed
        application (installation ID and a user token) as arguments to this command.
    flag:
        app-installation-id: Installation ID of the Cloud Build GitHub App.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        authorizer-token-secret-version: Secret containing the authorizer user's token.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            The Google Cloud region.
            +
            To set the `region` attribute:
            * provide the argument `connection` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `builds/region`.
