name: list-app-assessment-resource-drifts
description: List of resource drifts that were detected while running an assessment.
flags:
    --assessment-arn=!: Amazon Resource Name (ARN) of the assessment.
    --max-results=: Maximum number of drift results to include in the response.
    --next-token=: Null, or the token from a previous call to get the next set of results.
documentation:
    command: List of resource drifts that were detected while running an assessment.
    flag:
        assessment-arn: 'Amazon Resource Name (ARN) of the assessment. The format for this ARN is: arn:`partition`:resiliencehub:`region`:`account`:app-assessment/`app-id`. For more information about ARNs, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference* guide.'
        max-results: Maximum number of drift results to include in the response. If more results exist than the specified `MaxResults` value, a token is included in the response so that the remaining results can be retrieved.
        next-token: Null, or the token from a previous call to get the next set of results.
