name: test-connection
description: Tests a connection to a service to validate the service credentials that you provide.
flags:
    --catalog-id=: The catalog ID where the connection resides.
    --connection-name=: Optional.
    --test-connection-input=: A structure that is used to specify testing a connection to a service.
documentation:
    command: |-
        Tests a connection to a service to validate the service credentials that you provide.

        You can either provide an existing connection name or a `TestConnectionInput` for testing a non-existing connection input. Providing both at the same time will cause an error.

        If the action is successful, the service sends back an HTTP 200 response.
    flag:
        catalog-id: The catalog ID where the connection resides.
        connection-name: Optional. The name of the connection to test. If only name is provided, the operation will get the connection and use that for testing.
        test-connection-input: A structure that is used to specify testing a connection to a service.
