name: describe-moving-addresses
description: This action is deprecated.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: One or more filters.
    --max-results=: The maximum number of results to return for the request in a single page.
    --next-token=: The token for the next page of results.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --public-ips=: One or more Elastic IP addresses.
documentation:
    command: |-
        This action is deprecated.

        Describes your Elastic IP addresses that are being moved from or being restored to the EC2-Classic platform. This request does not return information about any other Elastic IP addresses in your account.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            One or more filters.

            - `moving-status` - The status of the Elastic IP address (`MovingToVpc` | `RestoringToClassic`).
        max-results: |-
            The maximum number of results to return for the request in a single page. The remaining results of the initial request can be seen by sending another request with the returned `NextToken` value. This value can be between 5 and 1000; if `MaxResults` is given a value outside of this range, an error is returned.

            Default: If no value is provided, the default is 1000.
        next-token: The token for the next page of results.
        public-ips: One or more Elastic IP addresses.
