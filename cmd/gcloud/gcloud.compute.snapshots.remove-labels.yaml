name: remove-labels
description: Remove labels from Google Compute Engine snapshots.
flags:
    --all: Remove all labels from the resource.
    --labels=: A comma-separated list of label keys to remove from the resource.
    --no-all&: Remove all labels from the resource.
documentation:
    command: |
        *gcloud compute snapshots remove-labels* removes labels from a Google Compute Engine snapshot.
    flag:
        all: Remove all labels from the resource.
        labels: A comma-separated list of label keys to remove from the resource.
        no-all: Remove all labels from the resource.
