name: list-job-templates
description: Retrieve a JSON array of up to twenty of your job templates.
flags:
    --category=: Optionally, specify a job template category to limit responses to only job templates from that category.
    --list-by=: Optional.
    --max-results=: Optional.
    --next-token=: Use this string, provided with the response to a previous request, to request the next batch of job templates.
    --order=: Optional.
completion:
    flag:
        list-by:
            - NAME
            - CREATION_DATE
            - SYSTEM
        order:
            - ASCENDING
            - DESCENDING
documentation:
    command: Retrieve a JSON array of up to twenty of your job templates. This will return the templates themselves, not just a list of them. To retrieve the next twenty templates, use the nextToken string returned with the array
    flag:
        category: Optionally, specify a job template category to limit responses to only job templates from that category.
        list-by: Optional. When you request a list of job templates, you can choose to list them alphabetically by NAME or chronologically by CREATION\_DATE. If you don't specify, the service will list them by name.
        max-results: Optional. Number of job templates, up to twenty, that will be returned at one time.
        next-token: Use this string, provided with the response to a previous request, to request the next batch of job templates.
        order: Optional. When you request lists of resources, you can specify whether they are sorted in ASCENDING or DESCENDING order. Default varies by resource.
