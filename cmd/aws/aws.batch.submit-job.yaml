name: submit-job
description: Submits an Batch job from a job definition.
flags:
    --array-properties=: The array properties for the submitted job, such as the size of the array.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --consumable-resource-properties-override=: An object that contains overrides for the consumable resources of a job.
    --container-overrides=: An object with properties that override the defaults for the job definition that specify the name of a container in the specified job definition and the overrides it should receive.
    --depends-on=:
        description: A list of dependencies for the job.
        nargs: -1
    --ecs-properties-override=: An object, with properties that override defaults for the job definition, can only be specified for jobs that are run on Amazon ECS resources.
    --eks-properties-override=: An object, with properties that override defaults for the job definition, can only be specified for jobs that are run on Amazon EKS resources.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --job-definition=!: The job definition used by this job.
    --job-name=!: The name of the job.
    --job-queue=!: The job queue where the job is submitted.
    --no-propagate-tags: Specifies whether to propagate the tags from the job or job definition to the corresponding Amazon ECS task.
    --node-overrides=: A list of node overrides in JSON format that specify the node range to target and the container overrides for that node range.
    --parameters=: Additional parameters passed to the job that replace parameter substitution placeholders that are set in the job definition.
    --propagate-tags: Specifies whether to propagate the tags from the job or job definition to the corresponding Amazon ECS task.
    --retry-strategy=: The retry strategy to use for failed jobs from this [SubmitJob]() operation.
    --scheduling-priority-override=: The scheduling priority for the job.
    --share-identifier=: The share identifier for the job.
    --tags=: The tags that you apply to the job request to help you categorize and organize your resources.
    --timeout=: The timeout configuration for this [SubmitJob]() operation.
documentation:
    command: |-
        Submits an Batch job from a job definition. Parameters that are specified during [SubmitJob]() override parameters defined in the job definition. vCPU and memory requirements that are specified in the `resourceRequirements` objects in the job definition are the exception. They can't be overridden this way using the `memory` and `vcpus` parameters. Rather, you must specify updates to job definition parameters in a `resourceRequirements` object that's included in the `containerOverrides` parameter.

        Job queues with a scheduling policy are limited to 500 active share identifiers at a time.

        Jobs that run on Fargate resources can't be guaranteed to run for more than 14 days. This is because, after 14 days, Fargate resources might become unavailable and job might be terminated.
    flag:
        array-properties: The array properties for the submitted job, such as the size of the array. The array size can be between 2 and 10,000. If you specify array properties for a job, it becomes an array job. For more information, see [Array Jobs](https://docs.aws.amazon.com/batch/latest/userguide/array_jobs.html) in the *Batch User Guide*.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        consumable-resource-properties-override: An object that contains overrides for the consumable resources of a job.
        container-overrides: An object with properties that override the defaults for the job definition that specify the name of a container in the specified job definition and the overrides it should receive. You can override the default command for a container, which is specified in the job definition or the Docker image, with a `command` override. You can also override existing environment variables on a container or add new environment variables to it with an `environment` override.
        depends-on: A list of dependencies for the job. A job can depend upon a maximum of 20 jobs. You can specify a `SEQUENTIAL` type dependency without specifying a job ID for array jobs so that each child array job completes sequentially, starting at index 0. You can also specify an `N_TO_N` type dependency with a job ID for array jobs. In that case, each index child of this job must wait for the corresponding index child of each dependency to complete before it can begin.
        ecs-properties-override: An object, with properties that override defaults for the job definition, can only be specified for jobs that are run on Amazon ECS resources.
        eks-properties-override: An object, with properties that override defaults for the job definition, can only be specified for jobs that are run on Amazon EKS resources.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        job-definition: |-
            The job definition used by this job. This value can be one of `definition-name`, `definition-name:revision`, or the Amazon Resource Name (ARN) for the job definition, with or without the revision (`arn:aws:batch:region:account:job-definition/definition-name:revision`, or `arn:aws:batch:region:account:job-definition/definition-name`).

            If the revision is not specified, then the latest active revision is used.
        job-name: The name of the job. It can be up to 128 letters long. The first character must be alphanumeric, can contain uppercase and lowercase letters, numbers, hyphens (-), and underscores (\_).
        job-queue: The job queue where the job is submitted. You can specify either the name or the Amazon Resource Name (ARN) of the queue.
        node-overrides: |-
            A list of node overrides in JSON format that specify the node range to target and the container overrides for that node range.

            This parameter isn't applicable to jobs that are running on Fargate resources; use `containerOverrides` instead.
        parameters: Additional parameters passed to the job that replace parameter substitution placeholders that are set in the job definition. Parameters are specified as a key and value pair mapping. Parameters in a `SubmitJob` request override any corresponding parameter defaults from the job definition.
        propagate-tags: Specifies whether to propagate the tags from the job or job definition to the corresponding Amazon ECS task. If no value is specified, the tags aren't propagated. Tags can only be propagated to the tasks during task creation. For tags with the same name, job tags are given priority over job definitions tags. If the total number of combined tags from the job and job definition is over 50, the job is moved to the `FAILED` state. When specified, this overrides the tag propagation setting in the job definition.
        retry-strategy: The retry strategy to use for failed jobs from this [SubmitJob]() operation. When a retry strategy is specified here, it overrides the retry strategy defined in the job definition.
        scheduling-priority-override: |-
            The scheduling priority for the job. This only affects jobs in job queues with a fair-share policy. Jobs with a higher scheduling priority are scheduled before jobs with a lower scheduling priority. This overrides any scheduling priority in the job definition and works only within a single share identifier.

            The minimum supported value is 0 and the maximum supported value is 9999.
        share-identifier: |-
            The share identifier for the job. Don't specify this parameter if the job queue doesn't have a fair-share scheduling policy. If the job queue has a fair-share scheduling policy, then this parameter must be specified.

            This string is limited to 255 alphanumeric characters, and can be followed by an asterisk (\*).
        tags: The tags that you apply to the job request to help you categorize and organize your resources. Each tag consists of a key and an optional value. For more information, see [Tagging Amazon Web Services Resources](https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html) in *Amazon Web Services General Reference*.
        timeout: The timeout configuration for this [SubmitJob]() operation. You can specify a timeout duration after which Batch terminates your jobs if they haven't finished. If a job is terminated due to a timeout, it isn't retried. The minimum value for the timeout is 60 seconds. This configuration overrides any timeout configuration specified in the job definition. For array jobs, child jobs have the same timeout configuration as the parent job. For more information, see [Job Timeouts](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/job_timeouts.html) in the *Amazon Elastic Container Service Developer Guide*.
