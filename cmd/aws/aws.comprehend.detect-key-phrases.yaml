name: detect-key-phrases
description: Detects the key noun phrases found in the text.
flags:
    --language-code=!: The language of the input documents.
    --text=!: A UTF-8 text string.
completion:
    flag:
        language-code:
            - en
            - es
            - fr
            - de
            - it
            - pt
            - ar
            - hi
            - ja
            - ko
            - zh
            - zh-TW
documentation:
    command: Detects the key noun phrases found in the text.
    flag:
        language-code: The language of the input documents. You can specify any of the primary languages supported by Amazon Comprehend. All documents must be in the same language.
        text: A UTF-8 text string. The string must contain less than 100 KB of UTF-8 encoded characters.
