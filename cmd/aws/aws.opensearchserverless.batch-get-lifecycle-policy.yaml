name: batch-get-lifecycle-policy
description: Returns one or more configured OpenSearch Serverless lifecycle policies.
flags:
    --identifiers=!: The unique identifiers of policy types and policy names.
documentation:
    command: Returns one or more configured OpenSearch Serverless lifecycle policies. For more information, see [Viewing data lifecycle policies](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-lifecycle.html#serverless-lifecycle-list).
    flag:
        identifiers: The unique identifiers of policy types and policy names.
