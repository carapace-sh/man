name: describe
description: Describe a Google Cloud VMware Engine private cloud.
flags:
    --location=: Location of the private cloud or cluster.
documentation:
    command: |
        Describe a VMware Engine private cloud.
    flag:
        location: |-
            Location of the private cloud or cluster.
            +
            To set the `location` attribute:
            * provide the argument `private_cloud` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/zone`.
