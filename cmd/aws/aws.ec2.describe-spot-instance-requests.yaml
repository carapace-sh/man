            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            The filters.

            - `availability-zone-group` - The Availability Zone group.
            - `create-time` - The time stamp when the Spot Instance request was created.
            - `fault-code` - The fault code related to the request.
            - `fault-message` - The fault message related to the request.
            - `instance-id` - The ID of the instance that fulfilled the request.
            - `launch-group` - The Spot Instance launch group.
            - `launch.block-device-mapping.delete-on-termination` - Indicates whether the EBS volume is deleted on instance termination.
            - `launch.block-device-mapping.device-name` - The device name for the volume in the block device mapping (for example, `/dev/sdh` or `xvdh`).
            - `launch.block-device-mapping.snapshot-id` - The ID of the snapshot for the EBS volume.
            - `launch.block-device-mapping.volume-size` - The size of the EBS volume, in GiB.
            - `launch.block-device-mapping.volume-type` - The type of EBS volume: `gp2` or `gp3` for General Purpose SSD, `io1` or `io2` for Provisioned IOPS SSD, `st1` for Throughput Optimized HDD, `sc1` for Cold HDD, or `standard` for Magnetic.
            - `launch.group-id` - The ID of the security group for the instance.
            - `launch.group-name` - The name of the security group for the instance.
            - `launch.image-id` - The ID of the AMI.
            - `launch.instance-type` - The type of instance (for example, `m3.medium`).
            - `launch.kernel-id` - The kernel ID.
            - `launch.key-name` - The name of the key pair the instance launched with.
            - `launch.monitoring-enabled` - Whether detailed monitoring is enabled for the Spot Instance.
            - `launch.ramdisk-id` - The RAM disk ID.
            - `launched-availability-zone` - The Availability Zone in which the request is launched.
            - `launched-availability-zone-id` - The ID of the Availability Zone in which the request is launched.
            - `network-interface.addresses.primary` - Indicates whether the IP address is the primary private IP address.
            - `network-interface.delete-on-termination` - Indicates whether the network interface is deleted when the instance is terminated.
            - `network-interface.description` - A description of the network interface.
            - `network-interface.device-index` - The index of the device for the network interface attachment on the instance.
            - `network-interface.group-id` - The ID of the security group associated with the network interface.
            - `network-interface.network-interface-id` - The ID of the network interface.
            - `network-interface.private-ip-address` - The primary private IP address of the network interface.
            - `network-interface.subnet-id` - The ID of the subnet for the instance.
            - `product-description` - The product description associated with the instance (`Linux/UNIX` | `Windows`).
            - `spot-instance-request-id` - The Spot Instance request ID.
            - `spot-price` - The maximum hourly price for any Spot Instance launched to fulfill the request.
            - `state` - The state of the Spot Instance request (`open` | `active` | `closed` | `cancelled` | `failed`). Spot request status information can help you track your Amazon EC2 Spot Instance requests. For more information, see [Spot request status](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/spot-request-status.html) in the *Amazon EC2 User Guide*.
            - `status-code` - The short code describing the most recent evaluation of your Spot Instance request.
            - `status-message` - The message explaining the status of the Spot Instance request.
            - `tag:<key>` - The key/value combination of a tag assigned to the resource. Use the tag key in the filter name and the tag value as the filter value. For example, to find all resources that have a tag with the key `Owner` and the value `TeamA`, specify `tag:Owner` for the filter name and `TeamA` for the filter value.
            - `tag-key` - The key of a tag assigned to the resource. Use this filter to find all resources assigned a tag with a specific key, regardless of the tag value.
            - `type` - The type of Spot Instance request (`one-time` | `persistent`).
            - `valid-from` - The start date of the request.
            - `valid-until` - The end date of the request.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of items to return for this request. To get the next page of items, make another request with the token returned in the output. For more information, see [Pagination](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Query-Requests.html#api-pagination).
        next-token: The token returned from a previous paginated request. Pagination continues from the end of the items returned by the previous request.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        spot-instance-request-ids: The IDs of the Spot Instance requests.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
