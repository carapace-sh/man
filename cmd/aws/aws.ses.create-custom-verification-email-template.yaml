name: create-custom-verification-email-template
description: Creates a new custom verification email template.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --failure-redirection-url=!: The URL that the recipient of the verification email is sent to if his or her address is not successfully verified.
    --from-email-address=!: The email address that the custom verification email is sent from.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --success-redirection-url=!: The URL that the recipient of the verification email is sent to if his or her address is successfully verified.
    --template-content=!: The content of the custom verification email.
    --template-name=!: The name of the custom verification email template.
    --template-subject=!: The subject line of the custom verification email.
documentation:
    command: |-
        Creates a new custom verification email template.

        For more information about custom verification email templates, see [Using Custom Verification Email Templates](https://docs.aws.amazon.com/ses/latest/dg/creating-identities.html#send-email-verify-address-custom) in the *Amazon SES Developer Guide*.

        You can execute this operation no more than once per second.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        failure-redirection-url: The URL that the recipient of the verification email is sent to if his or her address is not successfully verified.
        from-email-address: The email address that the custom verification email is sent from.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        success-redirection-url: The URL that the recipient of the verification email is sent to if his or her address is successfully verified.
        template-content: The content of the custom verification email. The total size of the email must be less than 10 MB. The message body may contain HTML, with some limitations. For more information, see [Custom Verification Email Frequently Asked Questions](https://docs.aws.amazon.com/ses/latest/dg/creating-identities.html#send-email-verify-address-custom) in the *Amazon SES Developer Guide*.
        template-name: The name of the custom verification email template.
        template-subject: The subject line of the custom verification email.
