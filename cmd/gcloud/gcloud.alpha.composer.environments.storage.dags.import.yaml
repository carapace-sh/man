    --environment=!: ID of the environment or fully qualified identifier for the environment.
    --location=: Region where Composer environment runs or in which to create the environment.
    --source=!: Path to a local directory/file or Cloud Storage bucket/object to be
documentation:
    command: |-
        *(ALPHA)*  If the SOURCE is a directory, it and its contents are imported recursively.
        Colliding files in the environment's Cloud Storage bucket will be
        overwritten. If a file exists in the bucket but is not present in the SOURCE,
        it is not removed.

        ## EXAMPLES
        Suppose the '/foo' directory in the local filesystem has the following
        structure:

          foo
          |
          +-- subdir1
          |   |
          |   +-- file1.txt
          |   +-- file2.txt
          |
          +-- subdir2
          |   |
          |   +-- file3.txt
          |   +-- file4.txt

        And the environment `myenv`'s Cloud Storage bucket has the following
        structure:

          gs://the-bucket
          |
          +-- dags
          |   |
          |   +-- foo
          |   |   |
          |   |   +-- subdir1
          |   |   |   |
          |   |   |   +-- bar.txt

        The following command:

          gcloud alpha composer environments storage dags import myenv --source=/foo

        would result in the following structure in `myenv`'s Cloud Storage bucket:

          gs://the-bucket
          |
          +-- dags
          |   |
          |   +-- foo
          |   |   |
          |   |   +-- subdir1
          |   |   |   |
          |   |   |   +-- bar.txt
          |   |   |   +-- file1.txt
          |   |   |   +-- file2.txt
          |   |   |
          |   |   +-- subdir2
          |   |   |   |
          |   |   |   +-- file3.txt
          |   |   |   +-- file4.txt

        If instead we had run

          gcloud alpha composer environments storage dags import myenv --source=/foo --destination=bar

        the resulting bucket structure would be the following:

          gs://the-bucket
          |
          +-- dags
          |   |
          |   +-- foo
          |   |   |
          |   |   +-- subdir1
          |   |   |   |
          |   |   |   +-- bar.txt
          |   |
          |   +-- bar
          |   |   |
          |   |   +-- foo
          |   |   |   |
          |   |   |   +-- subdir1
          |   |   |   |   |
          |   |   |   |   +-- file1.txt
          |   |   |   |   +-- file2.txt
          |   |   |   |
          |   |   |   +-- subdir2
          |   |   |   |   |
          |   |   |   |   +-- file3.txt
          |   |   |   |   +-- file4.txt
    flag:
        destination: |-
            An optional subdirectory under the dags/ directory in the environment's
            Cloud Storage bucket into which to import files. May contain forward
            slashes to delimit multiple levels of subdirectory nesting, but should not
            contain leading or trailing slashes. If the DESTINATION does not exist, it
            will be created.
        environment: |-
            ID of the environment or fully qualified identifier for the environment.
            +
            To set the `environment` attribute:
            * provide the argument `--environment` on the command line.
        location: |-
            Region where Composer environment runs or in which to create the environment.
            +
            To set the `location` attribute:
            * provide the argument `--environment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `composer/location`.
        source: |-
            Path to a local directory/file or Cloud Storage bucket/object to be
            imported into the dags/ subdirectory in the environment's Cloud Storage
            bucket. Cloud Storage paths must begin with 'gs://'.
