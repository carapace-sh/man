name: create
description: '*(BETA)*  Create a Managed Microsoft Active Directory domain peering.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --authorized-network=!: Name of the Network that is authorized to communicate with Managed Microsoft AD domain.
    --domain=!: Name of the managed Managed Microsoft AD domain you want to peer to.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(BETA)*  Create a new Managed Microsoft AD domain peering with the given name using Google Cloud's
        Managed Service for Microsoft Active Directory.

        This command can fail for the following reasons:
          * A domain peering with the same name already exists.
          * The active account does not have permission to create AD domains peerings.
          * There is an overlap between the provided CIDR range and authorized network's CIDR.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        authorized-network: Name of the Network that is authorized to communicate with Managed Microsoft AD domain. This is usually the full path name of the network in the peer project.
        domain: Name of the managed Managed Microsoft AD domain you want to peer to.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
