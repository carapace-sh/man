name: update
description: '*(BETA)*  Update a BeyondCorp client connector service (Deprecated).'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --config-from-file=: Path to json file containing client connector service configuration.
    --display-name=: An arbitrary user-provided name for the client connector service.
    --ingress-config=: Ingress config for client gateways.
    --location=: The location of the BeyondCorp Enterprise client connector.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: '*(BETA)*  Update a BeyondCorp client connector service. Note - Mutable fields include - \ display_name, ingress.config.destination_routes.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        config-from-file: |-
            Path to json file containing client connector service configuration.
            Example - "/file/path/config.json" where config.json contains -
            ```
            {
              "ingress":{
                "config":{
                  "transportProtocol":"TCP",
                  "destinationRoutes":[{
                    "address":"196.0.0.0",
                    "netmask":"255.255.255.0"
                  }]
                }
              },
              "displayName":"my-service-resource"
            }
            ```
        display-name: |-
            An arbitrary user-provided name for the client connector service. The display name should follow format -
                * Must be 6 to 30 characters in length.
                * Can only contain lowercase letters, numbers and hyphens.
                * Must start with a letter.
        ingress-config: |-
            Ingress config for client gateways.
            Example - {"destinationRoutes":[{"address":"196.0.0.0", "netmask":"255.255.255.0"},{"address":"197.0.0.0","netmask":"255.255.255.0"}]}.
        location: |-
            The location of the BeyondCorp Enterprise client connector.
            +

            To set the `location` attribute:
            * provide the argument `client_connector_service` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
