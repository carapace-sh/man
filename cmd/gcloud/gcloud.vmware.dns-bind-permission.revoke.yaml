name: revoke
description: Revokes a DNS Bind Permission.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --service-account=: The consumer provided service account whose permission needs to be revoked on the intranet VPC corresponding to the consumer project.
    --user=: The consumer provided user whose permission needs to be revoked on the intranet VPC corresponding to the consumer project.
documentation:
    command: |
        Revokes the bind permission from the customer provided user/service account on the intranet VPC associated with the consumer project.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        service-account: The consumer provided service account whose permission needs to be revoked on the intranet VPC corresponding to the consumer project. If this field is not provided then the user should be provided.
        user: The consumer provided user whose permission needs to be revoked on the intranet VPC corresponding to the consumer project. If this field is not provided then the service-account should be provided.
