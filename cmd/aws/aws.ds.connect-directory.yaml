name: connect-directory
description: Creates an AD Connector to connect to a self-managed directory.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --connect-settings=!: A [DirectoryConnectSettings]() object that contains additional information for the operation.
    --description=: A description for the directory.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The fully qualified name of your self-managed directory, such as `corp.example.com`.
    --network-type=: The network type for your directory.
    --password=!: The password for your self-managed user account.
    --short-name=: The NetBIOS name of your self-managed directory, such as `CORP`.
    --size=!: The size of the directory.
    --tags=: The tags to be assigned to AD Connector.
completion:
    flag:
        network-type:
            - Dual-stack
            - IPv4
            - IPv6
        size:
            - Small
            - Large
documentation:
    command: |-
        Creates an AD Connector to connect to a self-managed directory.

        Before you call `ConnectDirectory`, ensure that all of the required permissions have been explicitly granted through a policy. For details about what permissions are required to run the `ConnectDirectory` operation, see [Directory Service API Permissions: Actions, Resources, and Conditions Reference](http://docs.aws.amazon.com/directoryservice/latest/admin-guide/UsingWithDS_IAM_ResourcePermissions.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        connect-settings: A [DirectoryConnectSettings]() object that contains additional information for the operation.
        description: A description for the directory.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The fully qualified name of your self-managed directory, such as `corp.example.com`.
        network-type: The network type for your directory. The default value is `IPv4` or `IPv6` based on the provided subnet capabilities.
        password: The password for your self-managed user account.
        short-name: The NetBIOS name of your self-managed directory, such as `CORP`.
        size: The size of the directory.
        tags: The tags to be assigned to AD Connector.
