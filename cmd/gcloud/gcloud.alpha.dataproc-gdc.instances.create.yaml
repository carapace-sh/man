name: create
description: '*(ALPHA)*  Create a Dataproc GDC service instance.'
hidden: true
flags:
    --annotations=: List of annotation KEY=VALUE pairs to add to the service instance.
    --async: Return immediately, without waiting for the operation in progress to
    --display-name=: Human-readable name for this service instance to be used in user interfaces.
    --gdce-cluster=!: ID of the cluster or fully qualified identifier for the cluster.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: Location of the Dataproc GDC resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --request-id=: An optional request ID to identify requests.
    --service-account=: Requested google cloud service account to associate with the ServiceInstance.
documentation:
    command: |-
        *(ALPHA)*  A service instance is a deployment of the Dataproc operator running on a
        Kubernetes cluster. Each cluster may have at most one Dataproc service
        instance deployed. A service instance manages Application Environments
        and Spark Applications that run locally on the cluster.
    flag:
        annotations: List of annotation KEY=VALUE pairs to add to the service instance.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        display-name: Human-readable name for this service instance to be used in user interfaces.
        gdce-cluster: |-
            ID of the cluster or fully qualified identifier for the cluster.
            +
            To set the `cluster` attribute:
            * provide the argument `--gdce-cluster` on the command line.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            Location of the Dataproc GDC resource.
            +

            To set the `location` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        request-id: |-
            An optional request ID to identify requests. If the service receives two identical
                    instance create requests with the same request_id, the second request is
                    ignored and the operation that corresponds to the first request is returned for both.
            +
                    The request ID must be a valid UUID with the exception that zero UUID is
                    not supported (00000000-0000-0000-0000-000000000000).
        service-account: |-
            Requested google cloud service account to associate with the ServiceInstance.
            +
                   Service account must be of format my-iam-account@somedomain.com or
                   my-iam-account@my-project.iam.gserviceaccount.com
