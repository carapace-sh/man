name: update-image-generation-configuration
description: Updates the `StreamInfo` and `ImageProcessingConfiguration` fields.
flags:
    --image-generation-configuration=: The structure that contains the information required for the KVS images delivery.
    --stream-arn=: The Amazon Resource Name (ARN) of the Kinesis video stream from where you want to update the image generation configuration.
    --stream-name=: The name of the stream from which to update the image generation configuration.
documentation:
    command: Updates the `StreamInfo` and `ImageProcessingConfiguration` fields.
    flag:
        image-generation-configuration: The structure that contains the information required for the KVS images delivery. If the structure is null, the configuration will be deleted from the stream.
        stream-arn: The Amazon Resource Name (ARN) of the Kinesis video stream from where you want to update the image generation configuration. You must specify either the `StreamName` or the `StreamARN`.
        stream-name: The name of the stream from which to update the image generation configuration. You must specify either the `StreamName` or the `StreamARN`.
