name: get-topic-attributes
description: Returns all of the properties of a topic.
flags:
    --topic-arn=!: The ARN of the topic whose properties you want to get.
documentation:
    command: Returns all of the properties of a topic. Topic properties returned might differ based on the authorization of the user.
    flag:
        topic-arn: The ARN of the topic whose properties you want to get.
