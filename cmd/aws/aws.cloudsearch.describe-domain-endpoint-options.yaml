name: describe-domain-endpoint-options
description: Returns the domain's endpoint options, specifically whether all requests to the domain must arrive over HTTPS.
flags:
    --deployed: Whether to retrieve the latest configuration (which might be in a Processing state) or the current, active configuration.
    --domain-name=!: A string that represents the name of a domain.
    --no-deployed: Whether to retrieve the latest configuration (which might be in a Processing state) or the current, active configuration.
documentation:
    command: Returns the domain's endpoint options, specifically whether all requests to the domain must arrive over HTTPS. For more information, see [Configuring Domain Endpoint Options](http://docs.aws.amazon.com/cloudsearch/latest/developerguide/configuring-domain-endpoint-options.html) in the *Amazon CloudSearch Developer Guide*.
    flag:
        deployed: Whether to retrieve the latest configuration (which might be in a Processing state) or the current, active configuration. Defaults to `false`.
        domain-name: A string that represents the name of a domain.
