name: describe
description: '*(BETA)*  Show details about a task.'
flags:
    --location=: The location where we want to manage the queue or task.
    --queue=: The queue the task belongs to.
    --response-view=: Task response view.
completion:
    flag:
        response-view:
            - basic
            - full
            - view-unspecified
documentation:
    command: |
        *(BETA)*  Show details about a task.
    flag:
        location: The location where we want to manage the queue or task. If not specified, uses the location of the current project's App Engine app if there is an associated app.
        queue: The queue the task belongs to.
        response-view: 'Task response view. _RESPONSE_VIEW_ must be one of: *basic*, *full*, *view-unspecified*.'
