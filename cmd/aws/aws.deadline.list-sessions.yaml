name: list-sessions
description: Lists sessions.
flags:
    --farm-id=!: The farm ID for the list of sessions.
    --job-id=!: The job ID for the list of sessions.
    --max-results=: The maximum number of results to return.
    --next-token=: The token for the next set of results, or `null` to start from the beginning.
    --queue-id=!: The queue ID for the list of sessions
documentation:
    command: Lists sessions.
    flag:
        farm-id: The farm ID for the list of sessions.
        job-id: The job ID for the list of sessions.
        max-results: The maximum number of results to return. Use this parameter with `NextToken` to get results as a set of sequential pages.
        next-token: The token for the next set of results, or `null` to start from the beginning.
        queue-id: The queue ID for the list of sessions
