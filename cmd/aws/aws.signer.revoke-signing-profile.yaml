name: revoke-signing-profile
description: Changes the state of a signing profile to REVOKED.
flags:
    --effective-time=!: A timestamp for when revocation of a Signing Profile should become effective.
    --profile-name=!: The name of the signing profile to be revoked.
    --profile-version=!: The version of the signing profile to be revoked.
    --reason=!: The reason for revoking a signing profile.
documentation:
    command: Changes the state of a signing profile to REVOKED. This indicates that signatures generated using the signing profile after an effective start date are no longer valid.
    flag:
        effective-time: A timestamp for when revocation of a Signing Profile should become effective. Signatures generated using the signing profile after this timestamp are not trusted.
        profile-name: The name of the signing profile to be revoked.
        profile-version: The version of the signing profile to be revoked.
        reason: The reason for revoking a signing profile.
