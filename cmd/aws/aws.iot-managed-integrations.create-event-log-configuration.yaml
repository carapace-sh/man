name: create-event-log-configuration
description: Set the event log configuration for the account, resource type, or specific resource.
flags:
    --client-token=: An idempotency token.
    --event-log-level=!: The logging level for the event log configuration.
    --resource-id=: The identifier of the resource for the event log configuration.
    --resource-type=!: The type of resource for the event log configuration.
completion:
    flag:
        event-log-level:
            - DEBUG
            - ERROR
            - INFO
            - WARN
documentation:
    command: Set the event log configuration for the account, resource type, or specific resource.
    flag:
        client-token: An idempotency token. If you retry a request that completed successfully initially using the same client token and parameters, then the retry attempt will succeed without performing any further actions.
        event-log-level: The logging level for the event log configuration.
        resource-id: The identifier of the resource for the event log configuration.
        resource-type: The type of resource for the event log configuration.
