name: list-threat-intel-sets
description: Lists the ThreatIntelSets of the GuardDuty service specified by the detector ID.
flags:
    --detector-id=!: The unique ID of the detector that is associated with the threatIntelSet.
    --max-results=: You can use this parameter to indicate the maximum number of items that you want in the response.
    --next-token=: You can use this parameter to paginate results in the response.
documentation:
    command: Lists the ThreatIntelSets of the GuardDuty service specified by the detector ID. If you use this operation from a member account, the ThreatIntelSets associated with the administrator account are returned.
    flag:
        detector-id: |-
            The unique ID of the detector that is associated with the threatIntelSet.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
        max-results: You can use this parameter to indicate the maximum number of items that you want in the response. The default value is 50. The maximum value is 50.
        next-token: You can use this parameter to paginate results in the response. Set the value of this parameter to null on your first call to the list action. For subsequent calls to the action, fill nextToken in the request with the value of NextToken from the previous response to continue listing data.
