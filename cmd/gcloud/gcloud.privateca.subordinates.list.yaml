documentation:
    command: |-
        List the subordinate certificate authorities within a project.

        ## EXAMPLES

        To list all subordinate certificate authorities in a project:

        $ gcloud privateca subordinates list

        To list all subordinate certificate authorities within a project and location
        'us-central1':

        $ gcloud privateca subordinates list --location=us-central1

        To list all subordinate certificate authorities within a CA Pool in location
        'us-central1':

        $ gcloud privateca subordinates list --pool=my-pool --location=us-central1
    flag:
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        location: Location of the certificate authorities. If omitted, subordinate CAs across all regions will be listed. Note that, if it is populated, the privateca/location property will be used if this flag is not specified. To ignore this property, specify "-" as the location.
        no-uri: |
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is *100*.
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        pool: ID of the CA Pool where the certificate authorities reside. If omitted, subordinate CAs across all CA pools will be listed.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
        uri: |-
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
