name: get-certificate-authority-certificate
description: Retrieves the certificate and certificate chain for your private certificate authority (CA) or one that has been shared with you.
flags:
    --certificate-authority-arn=!: The Amazon Resource Name (ARN) of your private CA.
documentation:
    command: Retrieves the certificate and certificate chain for your private certificate authority (CA) or one that has been shared with you. Both the certificate and the chain are base64 PEM-encoded. The chain does not include the CA certificate. Each certificate in the chain signs the one before it.
    flag:
        certificate-authority-arn: |-
            The Amazon Resource Name (ARN) of your private CA. This is of the form:

            `arn:aws:acm-pca:region:account:certificate-authority/12345678-1234-1234-1234-123456789012`.
