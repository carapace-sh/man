name: verify-user-attribute
description: Submits a verification code for a signed-in user who has added or changed a value of an auto-verified attribute.
flags:
    --access-token=!: A valid access token that Amazon Cognito issued to the currently signed-in user.
    --attribute-name=!: The name of the attribute that you want to verify.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --code=!: The verification code that your user pool sent to the added or changed attribute, for example the user's email address.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
documentation:
    command: |-
        Submits a verification code for a signed-in user who has added or changed a value of an auto-verified attribute. When successful, the user's attribute becomes verified and the attribute `email_verified` or `phone_number_verified` becomes `true`.

        If your user pool requires verification before Amazon Cognito updates the attribute value, this operation updates the affected attribute to its pending value.

        Authorize this action with a signed-in user's access token. It must include the scope `aws.cognito.signin.user.admin`.

        Amazon Cognito doesn't evaluate Identity and Access Management (IAM) policies in requests for this API operation. For this operation, you can't use IAM credentials to authorize requests, and you can't grant IAM permissions in policies. For more information about authorization models in Amazon Cognito, see [Using the Amazon Cognito user pools API and user pool endpoints](https://docs.aws.amazon.com/cognito/latest/developerguide/user-pools-API-operations.html).
    flag:
