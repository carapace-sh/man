name: stop-replication
description: Stops replication for a Source Server.
flags:
    --source-server-id=!: The ID of the Source Server to stop replication for.
documentation:
    command: Stops replication for a Source Server. This action would make the Source Server unprotected, delete its existing snapshots and stop billing for it.
    flag:
        source-server-id: The ID of the Source Server to stop replication for.
