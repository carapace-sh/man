name: start
description: Start a local Firestore emulator.
flags:
    --database-mode=: The database mode to start the Firestore Emulator in.
    --export-on-exit=: Directory path in which emulator data will be saved upon shutdown.
    --host-port=: The host:port to which the emulator should be bound.
    --import-data=: File path to the data to be loaded into the emulator upon start up.
    --licenses: If set, the emulator will print open-source dependencies and licenses, then exit.
    --no-licenses&: If set, the emulator will print open-source dependencies and licenses, then exit.
    --no-use-firestore-in-datastore-mode&: Runs the emulator in Datastore Mode.
    --rules=: If set, all projects will use the security rules in this file.
    --use-firestore-in-datastore-mode&: Runs the emulator in Datastore Mode.
documentation:
    command: This command starts a local Firestore emulator.
    flag:
        database-mode: "The database mode to start the Firestore Emulator in. The valid options are: \n+\n  `firestore-native` (default): start the emulator in Firestore Native\n  `datastore-mode`: start the emulator in Datastore Mode"
        export-on-exit: Directory path in which emulator data will be saved upon shutdown. Example:`/home/user/myexports/2024-03-26/`
        host-port: |-
            The host:port to which the emulator should be bound. Can take the form of a single address (hostname, IPv4, or IPv6) and/or port:
            +
              [ADDRESS][:PORT]
            +
            In this format you must enclose IPv6 addresses in square brackets: e.g.
            +
              [2001:db8:0:0:0:ff00:42:8329]:8080
            +
            The default value is localhost:8080.
        import-data: File path to the data to be loaded into the emulator upon start up. Example:`/home/user/myexports/sampleExport/sampleExport.overall_export_metadata.`
        licenses: If set, the emulator will print open-source dependencies and licenses, then exit.
        no-licenses: If set, the emulator will print open-source dependencies and licenses, then exit.
        no-use-firestore-in-datastore-mode: Runs the emulator in Datastore Mode.
        rules: If set, all projects will use the security rules in this file. More information on Firebase Rules and the syntax for this file is available at https://firebase.google.com/docs/rules.
        use-firestore-in-datastore-mode: Runs the emulator in Datastore Mode.
