name: update
description: '*(BETA)*  Update a Cloud Spanner database.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --enable-drop-protection: Enable database deletion protection on this database.
    --instance=: The Cloud Spanner instance for the database.
    --kms-keys=: Update KMS key references for this database.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-enable-drop-protection&: Enable database deletion protection on this database.
documentation:
    command: '*(BETA)*  Update a Cloud Spanner database.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        enable-drop-protection: Enable database deletion protection on this database. Use *--enable-drop-protection* to enable and *--no-enable-drop-protection* to disable.
        instance: |-
            The Cloud Spanner instance for the database.
            +
            To set the `instance` attribute:
            * provide the argument `database` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line;
            * set the property `spanner/instance`.
        kms-keys: Update KMS key references for this database. Users should always provide the full set of required KMS key references.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-enable-drop-protection: Enable database deletion protection on this database.
