name: modify-instance-connect-endpoint
description: Modifies the specified EC2 Instance Connect Endpoint.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dry-run: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-connect-endpoint-id=!: The ID of the EC2 Instance Connect Endpoint to modify.
    --ip-address-type=: The new IP address type for the EC2 Instance Connect Endpoint.
    --no-dry-run: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response.
    --no-preserve-client-ip: Indicates whether the client IP address is preserved as the source.
    --preserve-client-ip: Indicates whether the client IP address is preserved as the source.
    --security-group-ids=: Changes the security groups for the EC2 Instance Connect Endpoint.
completion:
    flag:
        ip-address-type:
            - ipv4
            - dualstack
            - ipv6
documentation:
    command: |-
        Modifies the specified EC2 Instance Connect Endpoint.

        For more information, see [Modify an EC2 Instance Connect Endpoint](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/modify-ec2-instance-connect-endpoint.html) in the *Amazon EC2 User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dry-run: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-connect-endpoint-id: The ID of the EC2 Instance Connect Endpoint to modify.
        ip-address-type: |-
            The new IP address type for the EC2 Instance Connect Endpoint.

            `PreserveClientIp` is only supported on IPv4 EC2 Instance Connect Endpoints. To use `PreserveClientIp`, the value for `IpAddressType` must be `ipv4`.
        preserve-client-ip: |-
            Indicates whether the client IP address is preserved as the source. The following are the possible values.

            - `true` - Use the client IP address as the source.
            - `false` - Use the network interface IP address as the source.

            `PreserveClientIp=true` is only supported on IPv4 EC2 Instance Connect Endpoints. If modifying `PreserveClientIp` to `true`, either the endpoint's existing `IpAddressType` must be `ipv4`, or if modifying `IpAddressType` in the same request, the new value must be `ipv4`.

            Default: `false`
        security-group-ids: Changes the security groups for the EC2 Instance Connect Endpoint. The new set of groups you specify replaces the current set. You must specify at least one group, even if it's just the default security group in the VPC. You must specify the ID of the security group, not the name.
