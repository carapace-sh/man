name: untag-resource
description: Removes a tag or set of tags from an OpenSearch Serverless resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource to remove tags from.
    --tag-keys=!: The tag or set of tags to remove from the resource.
documentation:
    command: Removes a tag or set of tags from an OpenSearch Serverless resource. For more information, see [Tagging Amazon OpenSearch Serverless collections](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/tag-collection.html).
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource to remove tags from. The resource must be active (not in the `DELETING` state), and must be owned by the account ID included in the request.
        tag-keys: The tag or set of tags to remove from the resource. All tag keys in the request must be unique.
