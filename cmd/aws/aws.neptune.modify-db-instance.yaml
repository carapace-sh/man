name: modify-db-instance
description: Modifies settings for a DB instance.
flags:
    --allocated-storage=: Not supported by Neptune.
    --allow-major-version-upgrade: Indicates that major version upgrades are allowed.
    --apply-immediately: Specifies whether the modifications in this request and any pending modifications are asynchronously applied as soon as possible, regardless of the `PreferredMaintenanceWindow` setting for the DB instance.
    --auto-minor-version-upgrade: Indicates that minor version upgrades are applied automatically to the DB instance during the maintenance window.
    --backup-retention-period=: Not applicable.
    --ca-certificate-identifier=: Indicates the certificate that needs to be associated with the instance.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cloudwatch-logs-export-configuration=: The configuration setting for the log types to be enabled for export to CloudWatch Logs for a specific DB instance or DB cluster.
    --copy-tags-to-snapshot: True to copy all tags from the DB instance to snapshots of the DB instance, and otherwise false.
    --db-instance-class=: The new compute and memory capacity of the DB instance, for example, `db.m4.large`. Not all DB instance classes are available in all Amazon Regions.
    --db-instance-identifier=!: The DB instance identifier.
    --db-parameter-group-name=: The name of the DB parameter group to apply to the DB instance.
    --db-port-number=: The port number on which the database accepts connections.
    --db-security-groups=:
        description: A list of DB security groups to authorize on this DB instance.
        nargs: -1
    --db-subnet-group-name=: The new DB subnet group for the DB instance.
    --deletion-protection: A value that indicates whether the DB instance has deletion protection enabled.
    --domain-iam-role-name=: Not supported
    --domain=: Not supported.
    --enable-iam-database-authentication: True to enable mapping of Amazon Identity and Access Management (IAM) accounts to database accounts, and otherwise false.
    --enable-performance-insights: '*(Not supported by Neptune)*'
    --engine-version=: The version number of the database engine to upgrade to.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --iops=: The new Provisioned IOPS (I/O operations per second) value for the instance.
    --license-model=: Not supported by Neptune.
    --master-user-password=: Not supported by Neptune.
    --monitoring-interval=: The interval, in seconds, between points when Enhanced Monitoring metrics are collected for the DB instance.
    --monitoring-role-arn=: The ARN for the IAM role that permits Neptune to send enhanced monitoring metrics to Amazon CloudWatch Logs.
    --multi-az: Specifies if the DB instance is a Multi-AZ deployment.
    --new-db-instance-identifier=: The new DB instance identifier for the DB instance when renaming a DB instance.
    --no-allow-major-version-upgrade: Indicates that major version upgrades are allowed.
    --no-apply-immediately: Specifies whether the modifications in this request and any pending modifications are asynchronously applied as soon as possible, regardless of the `PreferredMaintenanceWindow` setting for the DB instance.
    --no-auto-minor-version-upgrade: Indicates that minor version upgrades are applied automatically to the DB instance during the maintenance window.
    --no-copy-tags-to-snapshot: True to copy all tags from the DB instance to snapshots of the DB instance, and otherwise false.
    --no-deletion-protection: A value that indicates whether the DB instance has deletion protection enabled.
    --no-enable-iam-database-authentication: True to enable mapping of Amazon Identity and Access Management (IAM) accounts to database accounts, and otherwise false.
    --no-enable-performance-insights: '*(Not supported by Neptune)*'
    --no-multi-az: Specifies if the DB instance is a Multi-AZ deployment.
    --no-publicly-accessible: Indicates whether the DB instance is publicly accessible.
    --option-group-name=: '*(Not supported by Neptune)*'
    --performance-insights-kms-key-id=: '*(Not supported by Neptune)*'
    --preferred-backup-window=: The daily time range during which automated backups are created if automated backups are enabled.
    --preferred-maintenance-window=: The weekly time range (in UTC) during which system maintenance can occur, which might result in an outage.
    --promotion-tier=: A value that specifies the order in which a Read Replica is promoted to the primary instance after a failure of the existing primary instance.
    --publicly-accessible: Indicates whether the DB instance is publicly accessible.
    --storage-type=: Not applicable.
    --tde-credential-arn=: The ARN from the key store with which to associate the instance for TDE encryption.
    --tde-credential-password=: The password for the given ARN from the key store in order to access the device.
    --vpc-security-group-ids=:
        description: A list of EC2 VPC security groups to authorize on this DB instance.
        nargs: -1
documentation:
    command: Modifies settings for a DB instance. You can change one or more database configuration parameters by specifying these parameters and the new values in the request. To learn what modifications you can make to your DB instance, call [DescribeValidDBInstanceModifications]() before you call [ModifyDBInstance]().
    flag:
        allocated-storage: Not supported by Neptune.
        allow-major-version-upgrade: Indicates that major version upgrades are allowed. Changing this parameter doesn't result in an outage and the change is asynchronously applied as soon as possible.
        apply-immediately: |-
            Specifies whether the modifications in this request and any pending modifications are asynchronously applied as soon as possible, regardless of the `PreferredMaintenanceWindow` setting for the DB instance.

            If this parameter is set to `false`, changes to the DB instance are applied during the next maintenance window. Some parameter changes can cause an outage and are applied on the next call to [RebootDBInstance](), or the next failure reboot.

            Default: `false`
        auto-minor-version-upgrade: Indicates that minor version upgrades are applied automatically to the DB instance during the maintenance window. Changing this parameter doesn't result in an outage except in the following case and the change is asynchronously applied as soon as possible. An outage will result if this parameter is set to `true` during the maintenance window, and a newer minor version is available, and Neptune has enabled auto patching for that engine version.
        backup-retention-period: |-
            Not applicable. The retention period for automated backups is managed by the DB cluster. For more information, see [ModifyDBCluster]().

            Default: Uses existing setting
        ca-certificate-identifier: Indicates the certificate that needs to be associated with the instance.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cloudwatch-logs-export-configuration: The configuration setting for the log types to be enabled for export to CloudWatch Logs for a specific DB instance or DB cluster.
        copy-tags-to-snapshot: True to copy all tags from the DB instance to snapshots of the DB instance, and otherwise false. The default is false.
        db-instance-class: |-
            The new compute and memory capacity of the DB instance, for example, `db.m4.large`. Not all DB instance classes are available in all Amazon Regions.

            If you modify the DB instance class, an outage occurs during the change. The change is applied during the next maintenance window, unless `ApplyImmediately` is specified as `true` for this request.

            Default: Uses existing setting
        db-instance-identifier: |-
            The DB instance identifier. This value is stored as a lowercase string.

            Constraints:

            - Must match the identifier of an existing DBInstance.
        db-parameter-group-name: |-
            The name of the DB parameter group to apply to the DB instance. Changing this setting doesn't result in an outage. The parameter group name itself is changed immediately, but the actual parameter changes are not applied until you reboot the instance without failover. The db instance will NOT be rebooted automatically and the parameter changes will NOT be applied during the next maintenance window.

            Default: Uses existing setting

            Constraints: The DB parameter group must be in the same DB parameter group family as this DB instance.
        db-port-number: |-
            The port number on which the database accepts connections.

            The value of the `DBPortNumber` parameter must not match any of the port values specified for options in the option group for the DB instance.

            Your database will restart when you change the `DBPortNumber` value regardless of the value of the `ApplyImmediately` parameter.

            Default: `8182`
        db-security-groups: |-
            A list of DB security groups to authorize on this DB instance. Changing this setting doesn't result in an outage and the change is asynchronously applied as soon as possible.

            Constraints:

            - If supplied, must match existing DBSecurityGroups.
        db-subnet-group-name: |-
            The new DB subnet group for the DB instance. You can use this parameter to move your DB instance to a different VPC.

            Changing the subnet group causes an outage during the change. The change is applied during the next maintenance window, unless you specify `true` for the `ApplyImmediately` parameter.

            Constraints: If supplied, must match the name of an existing DBSubnetGroup.

            Example: `mySubnetGroup`
        deletion-protection: A value that indicates whether the DB instance has deletion protection enabled. The database can't be deleted when deletion protection is enabled. By default, deletion protection is disabled. See [Deleting a DB Instance](https://docs.aws.amazon.com/neptune/latest/userguide/manage-console-instances-delete.html).
        domain: Not supported.
        domain-iam-role-name: Not supported
        enable-iam-database-authentication: |-
            True to enable mapping of Amazon Identity and Access Management (IAM) accounts to database accounts, and otherwise false.

            You can enable IAM database authentication for the following database engines

            Not applicable. Mapping Amazon IAM accounts to database accounts is managed by the DB cluster. For more information, see [ModifyDBCluster]().

            Default: `false`
        enable-performance-insights: '*(Not supported by Neptune)*'
        engine-version: The version number of the database engine to upgrade to. Currently, setting this parameter has no effect. To upgrade your database engine to the most recent release, use the [ApplyPendingMaintenanceAction]() API.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        iops: |-
            The new Provisioned IOPS (I/O operations per second) value for the instance.

            Changing this setting doesn't result in an outage and the change is applied during the next maintenance window unless the `ApplyImmediately` parameter is set to `true` for this request.

            Default: Uses existing setting
        license-model: Not supported by Neptune.
        master-user-password: Not supported by Neptune.
        monitoring-interval: |-
            The interval, in seconds, between points when Enhanced Monitoring metrics are collected for the DB instance. To disable collecting Enhanced Monitoring metrics, specify 0. The default is 0.

            If `MonitoringRoleArn` is specified, then you must also set `MonitoringInterval` to a value other than 0.

            Valid Values: `0, 1, 5, 10, 15, 30, 60`
        monitoring-role-arn: |-
            The ARN for the IAM role that permits Neptune to send enhanced monitoring metrics to Amazon CloudWatch Logs. For example, `arn:aws:iam:123456789012:role/emaccess`.

            If `MonitoringInterval` is set to a value other than 0, then you must supply a `MonitoringRoleArn` value.
        multi-az: Specifies if the DB instance is a Multi-AZ deployment. Changing this parameter doesn't result in an outage and the change is applied during the next maintenance window unless the `ApplyImmediately` parameter is set to `true` for this request.
        new-db-instance-identifier: |-
            The new DB instance identifier for the DB instance when renaming a DB instance. When you change the DB instance identifier, an instance reboot will occur immediately if you set `Apply Immediately` to true, or will occur during the next maintenance window if `Apply Immediately` to false. This value is stored as a lowercase string.

            Constraints:

            - Must contain from 1 to 63 letters, numbers, or hyphens.
            - The first character must be a letter.
            - Cannot end with a hyphen or contain two consecutive hyphens.

            Example: `mydbinstance`
        option-group-name: '*(Not supported by Neptune)*'
        performance-insights-kms-key-id: '*(Not supported by Neptune)*'
        preferred-backup-window: |-
            The daily time range during which automated backups are created if automated backups are enabled.

            Not applicable. The daily time range for creating automated backups is managed by the DB cluster. For more information, see [ModifyDBCluster]().

            Constraints:

            - Must be in the format hh24:mi-hh24:mi
            - Must be in Universal Time Coordinated (UTC)
            - Must not conflict with the preferred maintenance window
            - Must be at least 30 minutes
        preferred-maintenance-window: |-
            The weekly time range (in UTC) during which system maintenance can occur, which might result in an outage. Changing this parameter doesn't result in an outage, except in the following situation, and the change is asynchronously applied as soon as possible. If there are pending actions that cause a reboot, and the maintenance window is changed to include the current time, then changing this parameter will cause a reboot of the DB instance. If moving this window to the current time, there must be at least 30 minutes between the current time and end of the window to ensure pending changes are applied.

            Default: Uses existing setting

            Format: ddd:hh24:mi-ddd:hh24:mi

            Valid Days: Mon | Tue | Wed | Thu | Fri | Sat | Sun

            Constraints: Must be at least 30 minutes
        promotion-tier: |-
            A value that specifies the order in which a Read Replica is promoted to the primary instance after a failure of the existing primary instance.

            Default: 1

            Valid Values: 0 - 15
        publicly-accessible: |-
            Indicates whether the DB instance is publicly accessible.

            When the DB instance is publicly accessible and you connect from outside of the DB instance's virtual private cloud (VPC), its Domain Name System (DNS) endpoint resolves to the public IP address. When you connect from within the same VPC as the DB instance, the endpoint resolves to the private IP address. Access to the DB instance is ultimately controlled by the security group it uses. That public access isn't permitted if the security group assigned to the DB cluster doesn't permit it.

            When the DB instance isn't publicly accessible, it is an internal DB instance with a DNS name that resolves to a private IP address.
        storage-type: Not applicable. In Neptune the storage type is managed at the DB Cluster level.
        tde-credential-arn: The ARN from the key store with which to associate the instance for TDE encryption.
        tde-credential-password: The password for the given ARN from the key store in order to access the device.
        vpc-security-group-ids: |-
            A list of EC2 VPC security groups to authorize on this DB instance. This change is asynchronously applied as soon as possible.

            Not applicable. The associated list of EC2 VPC security groups is managed by the DB cluster. For more information, see [ModifyDBCluster]().

            Constraints:

            - If supplied, must match existing VpcSecurityGroupIds.
