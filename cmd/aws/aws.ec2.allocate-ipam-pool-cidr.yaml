name: allocate-ipam-pool-cidr
description: Allocate a CIDR from an IPAM pool.
flags:
    --allowed-cidrs=: Include a particular CIDR range that can be returned by the pool.
    --cidr=: The CIDR you would like to allocate from the IPAM pool.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --description=: A description for the allocation.
    --disallowed-cidrs=: Exclude a particular CIDR range from being returned by the pool.
    --dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --ipam-pool-id=!: The ID of the IPAM pool from which you would like to allocate a CIDR.
    --netmask-length=: The netmask length of the CIDR you would like to allocate from the IPAM pool.
    --no-dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --no-preview-next-cidr: A preview of the next available CIDR in a pool.
    --preview-next-cidr: A preview of the next available CIDR in a pool.
documentation:
    command: |-
        Allocate a CIDR from an IPAM pool. The Region you use should be the IPAM pool locale. The locale is the Amazon Web Services Region where this IPAM pool is available for allocations.

        In IPAM, an allocation is a CIDR assignment from an IPAM pool to another IPAM pool or to a resource. For more information, see [Allocate CIDRs](https://docs.aws.amazon.com/vpc/latest/ipam/allocate-cidrs-ipam.html) in the *Amazon VPC IPAM User Guide*.

        This action creates an allocation with strong consistency. The returned CIDR will not overlap with any other allocations from the same pool.
    flag:
        allowed-cidrs: Include a particular CIDR range that can be returned by the pool. Allowed CIDRs are only allowed if using netmask length for allocation.
        cidr: |-
            The CIDR you would like to allocate from the IPAM pool. Note the following:

            - If there is no DefaultNetmaskLength allocation rule set on the pool, you must specify either the NetmaskLength or the CIDR.
            - If the DefaultNetmaskLength allocation rule is set on the pool, you can specify either the NetmaskLength or the CIDR and the DefaultNetmaskLength allocation rule will be ignored.

            Possible values: Any available IPv4 or IPv6 CIDR.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/ec2/latest/devguide/ec2-api-idempotency.html).
        description: A description for the allocation.
        disallowed-cidrs: Exclude a particular CIDR range from being returned by the pool. Disallowed CIDRs are only allowed if using netmask length for allocation.
        dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        ipam-pool-id: The ID of the IPAM pool from which you would like to allocate a CIDR.
        netmask-length: |-
            The netmask length of the CIDR you would like to allocate from the IPAM pool. Note the following:

            - If there is no DefaultNetmaskLength allocation rule set on the pool, you must specify either the NetmaskLength or the CIDR.
            - If the DefaultNetmaskLength allocation rule is set on the pool, you can specify either the NetmaskLength or the CIDR and the DefaultNetmaskLength allocation rule will be ignored.

            Possible netmask lengths for IPv4 addresses are 0 - 32. Possible netmask lengths for IPv6 addresses are 0 - 128.
        preview-next-cidr: A preview of the next available CIDR in a pool.
