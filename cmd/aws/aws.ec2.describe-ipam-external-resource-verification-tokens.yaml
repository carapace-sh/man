name: describe-ipam-external-resource-verification-tokens
description: Describe verification tokens.
flags:
    --dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --filters=: One or more filters for the request.
    --ipam-external-resource-verification-token-ids=: Verification token IDs.
    --max-results=: The maximum number of tokens to return in one page of results.
    --next-token=: The token for the next page of results.
    --no-dry-run&: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
documentation:
    command: Describe verification tokens. A verification token is an Amazon Web Services-generated random value that you can use to prove ownership of an external resource. For example, you can use a verification token to validate that you control a public IP address range when you bring an IP address range to Amazon Web Services (BYOIP).
    flag:
        dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            One or more filters for the request. For more information about filtering, see [Filtering CLI output](https://docs.aws.amazon.com/cli/latest/userguide/cli-usage-filter.html).

            Available filters:

            - `ipam-arn`
            - `ipam-external-resource-verification-token-arn`
            - `ipam-external-resource-verification-token-id`
            - `ipam-id`
            - `ipam-region`
            - `state`
            - `status`
            - `token-name`
            - `token-value`
        ipam-external-resource-verification-token-ids: Verification token IDs.
        max-results: The maximum number of tokens to return in one page of results.
        next-token: The token for the next page of results.
