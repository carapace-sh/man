name: delete
description: '*(ALPHA)*  Delete a Memorystore for Redis Cluster instance.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: The name of the Redis region of the cluster.
documentation:
    command: |
        *(ALPHA)*  Delete a Memorystore for Redis Cluster instance.

        This command can fail for the following reasons:
          * The cluster specified does not exist.
          * The active account does not have permission to access the given
            cluster.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            The name of the Redis region of the cluster. Overrides the default
            redis/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `redis/region`.
