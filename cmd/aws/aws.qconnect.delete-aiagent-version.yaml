name: delete-aiagent-version
description: Deletes an Amazon Q in Connect AI Agent Version.
flags:
    --ai-agent-id=!: The identifier of the Amazon Q in Connect AI Agent.
    --assistant-id=!: The identifier of the Amazon Q in Connect assistant.
    --version-number=!: The version number of the AI Agent version.
documentation:
    command: Deletes an Amazon Q in Connect AI Agent Version.
    flag:
        ai-agent-id: The identifier of the Amazon Q in Connect AI Agent. Can be either the ID or the ARN. URLs cannot contain the ARN.
        assistant-id: The identifier of the Amazon Q in Connect assistant. Can be either the ID or the ARN. URLs cannot contain the ARN.
        version-number: The version number of the AI Agent version.
