name: delete-organization
description: Deletes an WorkMail organization and all underlying AWS resources managed by WorkMail as part of the organization.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: The idempotency token associated with the request.
    --delete-directory!: If true, deletes the AWS Directory Service directory associated with the organization.
    --delete-identity-center-application: Deletes IAM Identity Center application for WorkMail.
    --force-delete: Deletes a WorkMail organization even if the organization has enabled users.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-delete-directory!: If true, deletes the AWS Directory Service directory associated with the organization.
    --no-delete-identity-center-application: Deletes IAM Identity Center application for WorkMail.
    --no-force-delete: Deletes a WorkMail organization even if the organization has enabled users.
    --organization-id=!: The organization ID.
documentation:
    command: Deletes an WorkMail organization and all underlying AWS resources managed by WorkMail as part of the organization. You can choose whether to delete the associated directory. For more information, see [Removing an organization](https://docs.aws.amazon.com/workmail/latest/adminguide/remove_organization.html) in the *WorkMail Administrator Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: The idempotency token associated with the request.
        delete-directory: If true, deletes the AWS Directory Service directory associated with the organization.
        delete-identity-center-application: Deletes IAM Identity Center application for WorkMail. This action does not affect authentication settings for any organization.
        force-delete: Deletes a WorkMail organization even if the organization has enabled users.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
