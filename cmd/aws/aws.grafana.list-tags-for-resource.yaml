name: list-tags-for-resource
description: The `ListTagsForResource` operation returns the tags that are associated with the Amazon Managed Service for Grafana resource specified by the `resourceArn`.
flags:
    --resource-arn=!: The ARN of the resource the list of tags are associated with.
documentation:
    command: The `ListTagsForResource` operation returns the tags that are associated with the Amazon Managed Service for Grafana resource specified by the `resourceArn`. Currently, the only resource that can be tagged is a workspace.
    flag:
        resource-arn: The ARN of the resource the list of tags are associated with.
