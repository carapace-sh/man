name: delete-index
description: Deletes an Amazon Kendra index.
flags:
    --id=!: The identifier of the index you want to delete.
documentation:
    command: Deletes an Amazon Kendra index. An exception is not thrown if the index is already being deleted. While the index is being deleted, the `Status` field returned by a call to the `DescribeIndex` API is set to `DELETING`.
    flag:
        id: The identifier of the index you want to delete.
