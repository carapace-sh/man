name: operations
description: '*(BETA)*  Manage Artifact Registry long-running operations.'
documentation:
    command: |-
        ## EXAMPLES

        To describe a Artifact Registry operation given a valid operation id
        and `artifacts/location` property is set, run:

          $ gcloud beta artifacts operations describe 13166c87-a9c0-4b5f-8ccf-c5343a93eb2b
