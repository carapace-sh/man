name: list-agreements
description: Returns a list of the agreements for the server that's identified by the `ServerId` that you supply.
flags:
    --max-results=: The maximum number of items to return.
    --next-token=: When you can get additional results from the `ListAgreements` call, a `NextToken` parameter is returned in the output.
    --server-id=!: The identifier of the server for which you want a list of agreements.
documentation:
    command: Returns a list of the agreements for the server that's identified by the `ServerId` that you supply. If you want to limit the results to a certain number, supply a value for the `MaxResults` parameter. If you ran the command previously and received a value for `NextToken`, you can supply that value to continue listing agreements from where you left off.
    flag:
        max-results: The maximum number of items to return.
        next-token: When you can get additional results from the `ListAgreements` call, a `NextToken` parameter is returned in the output. You can then pass in a subsequent command to the `NextToken` parameter to continue listing additional agreements.
        server-id: The identifier of the server for which you want a list of agreements.
