name: list-observability-configurations
description: Returns a list of active App Runner observability configurations in your Amazon Web Services account.
flags:
    --latest-only: Set to `true` to list only the latest revision for each requested configuration name.
    --max-results=: The maximum number of results to include in each response (result page).
    --next-token=: A token from a previous result page.
    --no-latest-only: Set to `true` to list only the latest revision for each requested configuration name.
    --observability-configuration-name=: The name of the App Runner observability configuration that you want to list.
documentation:
    command: |-
        Returns a list of active App Runner observability configurations in your Amazon Web Services account. You can query the revisions for a specific configuration name or the revisions for all active configurations in your account. You can optionally query only the latest revision of each requested name.

        To retrieve a full description of a particular configuration revision, call and provide one of the ARNs returned by `ListObservabilityConfigurations`.
    flag:
        latest-only: |-
            Set to `true` to list only the latest revision for each requested configuration name.

            Set to `false` to list all revisions for each requested configuration name.

            Default: `true`
        max-results: |-
            The maximum number of results to include in each response (result page). It's used for a paginated request.

            If you don't specify `MaxResults`, the request retrieves all available results in a single response.
        next-token: |-
            A token from a previous result page. It's used for a paginated request. The request retrieves the next result page. All other parameter values must be identical to the ones that are specified in the initial request.

            If you don't specify `NextToken`, the request retrieves the first result page.
        observability-configuration-name: The name of the App Runner observability configuration that you want to list. If specified, App Runner lists revisions that share this name. If not specified, App Runner returns revisions of all active configurations.
