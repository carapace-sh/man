name: update
description: '*(ALPHA)*  Update a ManagedOrganization resource.'
hidden: true
flags:
    --add-admins=: Add new value to admins list.
    --admins=: Set admins to new value.
    --async: Return immediately, without waiting for the operation in progress to
    --clear-admins: Clear admins value and set to empty list.
    --location=: The location id of the managedOrganization resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-admins&: Clear admins value and set to empty list.
    --organization=: The organization id of the managedOrganization resource.
    --remove-admins=: Remove existing value from admins list.
documentation:
    command: '*(ALPHA)*  Update a ManagedOrganization resource and corresponding Cloud Resource Manager organization resource. Only updating admins are supported.'
    flag:
        add-admins: |-
            Add new value to admins list. List of organization admins.
            +
            *member*:::
            Valid IAM principles. See member field under
            https://cloud.google.com/iam/docs/reference/sts/rest/v1/Binding.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --add-admins=member=string --add-admins=member=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --add-admins='[{"member": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --add-admins=path_to_file.(yaml|json)
            +
            ```
        admins: |-
            Set admins to new value. List of organization admins.
            +
            *member*:::
            Valid IAM principles. See member field under
            https://cloud.google.com/iam/docs/reference/sts/rest/v1/Binding.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --admins=member=string --admins=member=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --admins='[{"member": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --admins=path_to_file.(yaml|json)
            +
            ```
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        clear-admins: Clear admins value and set to empty list.
        location: |-
            The location id of the managedOrganization resource.
            +
            To set the `location` attribute:
            * provide the argument `managed_organization` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-admins: Clear admins value and set to empty list.
        organization: |-
            The organization id of the managedOrganization resource.
            +
            To set the `organization` attribute:
            * provide the argument `managed_organization` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
        remove-admins: |-
            Remove existing value from admins list. List of organization admins.
            +
            *member*:::
            Valid IAM principles. See member field under
            https://cloud.google.com/iam/docs/reference/sts/rest/v1/Binding.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-admins=member=string --remove-admins=member=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-admins='[{"member": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-admins=path_to_file.(yaml|json)
            +
            ```
