name: restore-graph-from-snapshot
description: Restores a graph from a snapshot.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --deletion-protection: A value that indicates whether the graph has deletion protection enabled.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --graph-name=!: A name for the new Neptune Analytics graph to be created from the snapshot.
    --no-deletion-protection: A value that indicates whether the graph has deletion protection enabled.
    --no-public-connectivity: Specifies whether or not the graph can be reachable over the internet.
    --provisioned-memory=: The provisioned memory-optimized Neptune Capacity Units (m-NCUs) to use for the graph.
    --public-connectivity: Specifies whether or not the graph can be reachable over the internet.
    --replica-count=: The number of replicas in other AZs.
    --snapshot-identifier=!: The ID of the snapshot in question.
    --tags=: Adds metadata tags to the snapshot.
documentation:
    command: Restores a graph from a snapshot.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        deletion-protection: A value that indicates whether the graph has deletion protection enabled. The graph can't be deleted when deletion protection is enabled.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        graph-name: |-
            A name for the new Neptune Analytics graph to be created from the snapshot.

            The name must contain from 1 to 63 letters, numbers, or hyphens, and its first character must be a letter. It cannot end with a hyphen or contain two consecutive hyphens. Only lowercase letters are allowed.
        provisioned-memory: |-
            The provisioned memory-optimized Neptune Capacity Units (m-NCUs) to use for the graph.

            Min = 16
        public-connectivity: Specifies whether or not the graph can be reachable over the internet. All access to graphs is IAM authenticated. (`true` to enable, or `false` to disable).
        replica-count: |-
            The number of replicas in other AZs. Min =0, Max = 2, Default =1

            Additional charges equivalent to the m-NCUs selected for the graph apply for each replica.
        snapshot-identifier: The ID of the snapshot in question.
        tags: Adds metadata tags to the snapshot. These tags can also be used with cost allocation reporting, or used in a Condition statement in an IAM policy.
