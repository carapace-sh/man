name: create-billing-group
description: Creates a billing group that resembles a consolidated billing family that Amazon Web Services charges, based off of the predefined pricing plan computation.
flags:
    --account-grouping=!: The set of accounts that will be under the billing group.
    --client-token=: A unique, case-sensitive identifier that you specify to ensure idempotency of the request.
    --computation-preference=!: The preferences and settings that will be used to compute the Amazon Web Services charges for a billing group.
    --description=: The description of the billing group.
    --name=!: The billing group name.
    --primary-account-id=: The account ID that serves as the main account in a billing group.
    --tags=: A map that contains tag keys and tag values that are attached to a billing group.
documentation:
    command: Creates a billing group that resembles a consolidated billing family that Amazon Web Services charges, based off of the predefined pricing plan computation.
    flag:
        account-grouping: The set of accounts that will be under the billing group. The set of accounts resemble the linked accounts in a consolidated billing family.
        client-token: A unique, case-sensitive identifier that you specify to ensure idempotency of the request. Idempotency ensures that an API request completes no more than one time. With an idempotent request, if the original request completes successfully, any subsequent retries complete successfully without performing any further actions.
        computation-preference: The preferences and settings that will be used to compute the Amazon Web Services charges for a billing group.
        description: The description of the billing group.
        name: The billing group name. The names must be unique.
        primary-account-id: The account ID that serves as the main account in a billing group.
        tags: A map that contains tag keys and tag values that are attached to a billing group. This feature isn't available during the beta.
