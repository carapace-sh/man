name: batch-get-on-premises-instances
description: Gets information about one or more on-premises instances.
flags:
    --instance-names=!: The names of the on-premises instances about which to get information.
documentation:
    command: Gets information about one or more on-premises instances. The maximum number of on-premises instances that can be returned is 25.
    flag:
        instance-names: The names of the on-premises instances about which to get information. The maximum number of instance names you can specify is 25.
