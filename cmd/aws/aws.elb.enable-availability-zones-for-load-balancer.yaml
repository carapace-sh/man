name: enable-availability-zones-for-load-balancer
description: Adds the specified Availability Zones to the set of Availability Zones for the specified load balancer in EC2-Classic or a default VPC.
flags:
    --availability-zones=!: The Availability Zones.
    --load-balancer-name=!: The name of the load balancer.
documentation:
    command: |-
        Adds the specified Availability Zones to the set of Availability Zones for the specified load balancer in EC2-Classic or a default VPC.

        For load balancers in a non-default VPC, use [AttachLoadBalancerToSubnets]().

        The load balancer evenly distributes requests across all its registered Availability Zones that contain instances. For more information, see [Add or Remove Availability Zones](https://docs.aws.amazon.com/elasticloadbalancing/latest/classic/enable-disable-az.html) in the *Classic Load Balancers Guide*.
    flag:
        availability-zones: The Availability Zones. These must be in the same region as the load balancer.
        load-balancer-name: The name of the load balancer.
