name: update-configuration-set-event-destination
description: Update the configuration of an event destination for a configuration set.
flags:
    --configuration-set-name=!: The name of the configuration set that contains the event destination to modify.
    --event-destination-name=!: The name of the event destination.
    --event-destination=!: An object that defines the event destination.
documentation:
    command: |-
        Update the configuration of an event destination for a configuration set.

        *Events* include message sends, deliveries, opens, clicks, bounces, and complaints. *Event destinations* are places that you can send information about these events to. For example, you can send event data to Amazon EventBridge and associate a rule to send the event to the specified target.
    flag:
        configuration-set-name: The name of the configuration set that contains the event destination to modify.
        event-destination: An object that defines the event destination.
        event-destination-name: The name of the event destination.
