name: batch-get-asset-property-aggregates
description: Gets aggregated values (for example, average, minimum, and maximum) for one or more asset properties.
flags:
    --entries=!: The list of asset property aggregate entries for the batch get request.
    --max-results=: The maximum number of results to return for each paginated request.
    --next-token=: The token to be used for the next set of paginated results.
documentation:
    command: Gets aggregated values (for example, average, minimum, and maximum) for one or more asset properties. For more information, see [Querying aggregates](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/query-industrial-data.html#aggregates) in the *IoT SiteWise User Guide*.
    flag:
        entries: The list of asset property aggregate entries for the batch get request. You can specify up to 16 entries per request.
        max-results: |-
            The maximum number of results to return for each paginated request. A result set is returned in the two cases, whichever occurs first.

            - The size of the result set is equal to 1 MB.
            - The number of data points in the result set is equal to the value of `maxResults`. The maximum value of `maxResults` is 4000.
        next-token: The token to be used for the next set of paginated results.
