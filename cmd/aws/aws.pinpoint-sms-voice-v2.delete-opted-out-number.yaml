name: delete-opted-out-number
description: Deletes an existing opted out destination phone number from the specified opt-out list.
flags:
    --opt-out-list-name=!: The OptOutListName or OptOutListArn to remove the phone number from.
    --opted-out-number=!: The phone number, in E.164 format, to remove from the OptOutList.
documentation:
    command: |-
        Deletes an existing opted out destination phone number from the specified opt-out list.

        Each destination phone number can only be deleted once every 30 days.

        If the specified destination phone number doesn't exist or if the opt-out list doesn't exist, an error is returned.
    flag:
        opt-out-list-name: |-
            The OptOutListName or OptOutListArn to remove the phone number from.

            If you are using a shared End User MessagingSMS resource then you must use the full Amazon Resource Name(ARN).
        opted-out-number: The phone number, in E.164 format, to remove from the OptOutList.
