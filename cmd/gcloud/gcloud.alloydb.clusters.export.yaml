name: export
description: Export data from an AlloyDB cluster to Google Cloud Storage.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --clean-target-objects!: If true, output commands to DROP all the dumped database objects prior to outputting the commands for creating them.
    --csv!: Specifies destination file type.
    --database=!: Database name.
    --escape-character=: Escape character to be used for export.
    --field-delimiter=: Field delimiter to be used for export.
    --gcs-uri=: Path to the Google Cloud Storage file to which export has to be done.
    --if-exist-target-objects: If true, use DROP ...
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clean-target-objects!&: If true, output commands to DROP all the dumped database objects prior to outputting the commands for creating them.
    --no-csv!&: Specifies destination file type.
    --no-if-exist-target-objects&: If true, use DROP ...
    --no-schema-only&: Export only schema of the database.
    --no-sql!&: Specifies destination file type.
    --quote-character=: Quote character to be used for export.
    --region=!: Regional location (e.g. `asia-east1`, `us-east1`).
    --schema-only: Export only schema of the database.
    --select-query=!: Select query to be used for export.
    --sql!: Specifies destination file type.
    --tables=: Comma-separated list of table names which need to be exported.
documentation:
    command: Export data from an AlloyDB cluster to Google Cloud Storage.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        clean-target-objects: If true, output commands to DROP all the dumped database objects prior to outputting the commands for creating them.
        csv: Specifies destination file type.
        database: Database name.
        escape-character: Escape character to be used for export.
        field-delimiter: Field delimiter to be used for export.
        gcs-uri: Path to the Google Cloud Storage file to which export has to be done.
        if-exist-target-objects: If true, use DROP ... IF EXISTS commands to check for the object's existence before dropping it in clean_target_objects mode.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clean-target-objects: If true, output commands to DROP all the dumped database objects prior to outputting the commands for creating them.
        no-csv: Specifies destination file type.
        no-if-exist-target-objects: If true, use DROP ... IF EXISTS commands to check for the object's existence before dropping it in clean_target_objects mode.
        no-schema-only: Export only schema of the database.
        no-sql: Specifies destination file type.
        quote-character: Quote character to be used for export.
        region: Regional location (e.g. `asia-east1`, `us-east1`). See the full list of regions at https://cloud.google.com/sql/docs/instance-locations.
        schema-only: Export only schema of the database.
        select-query: Select query to be used for export.
        sql: Specifies destination file type.
        tables: Comma-separated list of table names which need to be exported.
