name: stop-backfill
description: Stop a backfill job for a Stream object.
flags:
    --location=: The location of the resources.
    --stream=: The stream name.
documentation:
    command: Stop a backfill job for a Stream object.
    flag:
        location: |-
            The location of the resources.
            +
            To set the `location` attribute:
            * provide the argument `object` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        stream: |-
            The stream name.
            +
            To set the `stream` attribute:
            * provide the argument `object` on the command line with a fully specified name;
            * provide the argument `--stream` on the command line.
