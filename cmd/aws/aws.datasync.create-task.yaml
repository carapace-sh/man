name: create-task
description: Configures a *task*, which defines where and how DataSync transfers your data.
flags:
    --cloud-watch-log-group-arn=: Specifies the Amazon Resource Name (ARN) of an Amazon CloudWatch log group for monitoring your task.
    --destination-location-arn=!: Specifies the ARN of your transfer's destination location.
    --excludes=: Specifies exclude filters that define the files, objects, and folders in your source location that you don't want DataSync to transfer.
    --includes=: Specifies include filters that define the files, objects, and folders in your source location that you want DataSync to transfer.
    --manifest-config=: Configures a manifest, which is a list of files or objects that you want DataSync to transfer.
    --name=: Specifies the name of your task.
    --options=: Specifies your task's settings, such as preserving file metadata, verifying data integrity, among other options.
    --schedule=: Specifies a schedule for when you want your task to run.
    --source-location-arn=!: Specifies the ARN of your transfer's source location.
    --tags=: Specifies the tags that you want to apply to your task.
    --task-mode=: 'Specifies one of the following task modes for your data transfer:'
    --task-report-config=: Specifies how you want to configure a task report, which provides detailed information about your DataSync transfer.
completion:
    flag:
        task-mode:
            - BASIC
            - ENHANCED
documentation:
    command: |-
        Configures a *task*, which defines where and how DataSync transfers your data.

        A task includes a source location, destination location, and transfer options (such as bandwidth limits, scheduling, and more).

        If you're planning to transfer data to or from an Amazon S3 location, review [how DataSync can affect your S3 request charges](https://docs.aws.amazon.com/datasync/latest/userguide/create-s3-location.html#create-s3-location-s3-requests) and the [DataSync pricing page](http://aws.amazon.com/datasync/pricing/) before you begin.
    flag:
        cloud-watch-log-group-arn: |-
            Specifies the Amazon Resource Name (ARN) of an Amazon CloudWatch log group for monitoring your task.

            For Enhanced mode tasks, you don't need to specify anything. DataSync automatically sends logs to a CloudWatch log group named `/aws/datasync`.
        destination-location-arn: Specifies the ARN of your transfer's destination location.
        excludes: Specifies exclude filters that define the files, objects, and folders in your source location that you don't want DataSync to transfer. For more information and examples, see [Specifying what DataSync transfers by using filters](https://docs.aws.amazon.com/datasync/latest/userguide/filtering.html).
        includes: Specifies include filters that define the files, objects, and folders in your source location that you want DataSync to transfer. For more information and examples, see [Specifying what DataSync transfers by using filters](https://docs.aws.amazon.com/datasync/latest/userguide/filtering.html).
        manifest-config: |-
            Configures a manifest, which is a list of files or objects that you want DataSync to transfer. For more information and configuration examples, see [Specifying what DataSync transfers by using a manifest](https://docs.aws.amazon.com/datasync/latest/userguide/transferring-with-manifest.html).

            When using this parameter, your caller identity (the role that you're using DataSync with) must have the `iam:PassRole` permission. The [AWSDataSyncFullAccess](https://docs.aws.amazon.com/datasync/latest/userguide/security-iam-awsmanpol.html#security-iam-awsmanpol-awsdatasyncfullaccess) policy includes this permission.
        name: Specifies the name of your task.
        options: Specifies your task's settings, such as preserving file metadata, verifying data integrity, among other options.
        schedule: Specifies a schedule for when you want your task to run. For more information, see [Scheduling your task](https://docs.aws.amazon.com/datasync/latest/userguide/task-scheduling.html).
        source-location-arn: Specifies the ARN of your transfer's source location.
        tags: |-
            Specifies the tags that you want to apply to your task.

            *Tags* are key-value pairs that help you manage, filter, and search for your DataSync resources.
        task-mode: "Specifies one of the following task modes for your data transfer:\n\n- `ENHANCED` - Transfer virtually unlimited numbers of objects with higher performance than Basic mode. Enhanced mode tasks optimize the data transfer process by listing, preparing, transferring, and verifying data in parallel. Enhanced mode is currently available for transfers between Amazon S3 locations, transfers between Azure Blob and Amazon S3 without an agent, and transfers between other clouds and Amazon S3 without an agent.\n  \n  To create an Enhanced mode task, the IAM role that you use to call the `CreateTask` operation must have the `iam:CreateServiceLinkedRole` permission.\n- `BASIC` (default) - Transfer files or objects between Amazon Web Services storage and all other supported DataSync locations. Basic mode tasks are subject to [quotas](https://docs.aws.amazon.com/datasync/latest/userguide/datasync-limits.html) on the number of files, objects, and directories in a dataset. Basic mode sequentially prepares, transfers, and verifies data, making it slower than Enhanced mode for most workloads.\n\nFor more information, see [Understanding task mode differences](https://docs.aws.amazon.com/datasync/latest/userguide/choosing-task-mode.html#task-mode-differences)."
        task-report-config: |-
            Specifies how you want to configure a task report, which provides detailed information about your DataSync transfer. For more information, see [Monitoring your DataSync transfers with task reports](https://docs.aws.amazon.com/datasync/latest/userguide/task-reports.html).

            When using this parameter, your caller identity (the role that you're using DataSync with) must have the `iam:PassRole` permission. The [AWSDataSyncFullAccess](https://docs.aws.amazon.com/datasync/latest/userguide/security-iam-awsmanpol.html#security-iam-awsmanpol-awsdatasyncfullaccess) policy includes this permission.
