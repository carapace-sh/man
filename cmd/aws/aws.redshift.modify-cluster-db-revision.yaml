name: modify-cluster-db-revision
description: Modifies the database revision of a cluster.
flags:
    --cluster-identifier=!: The unique identifier of a cluster whose database revision you want to modify.
    --revision-target=!: The identifier of the database revision.
documentation:
    command: Modifies the database revision of a cluster. The database revision is a unique revision of the database running in a cluster.
    flag:
        cluster-identifier: |-
            The unique identifier of a cluster whose database revision you want to modify.

            Example: `examplecluster`
        revision-target: The identifier of the database revision. You can retrieve this value from the response to the [DescribeClusterDbRevisions]() request.
