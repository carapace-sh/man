name: list-collaboration-analysis-templates
description: Lists analysis templates within a collaboration.
flags:
    --collaboration-identifier=!: A unique identifier for the collaboration that the analysis templates belong to.
    --max-results=: The maximum number of results that are returned for an API request call.
    --next-token=: The pagination token that's used to fetch the next set of results.
documentation:
    command: Lists analysis templates within a collaboration.
    flag:
        collaboration-identifier: A unique identifier for the collaboration that the analysis templates belong to. Currently accepts collaboration ID.
        max-results: The maximum number of results that are returned for an API request call. The service chooses a default number if you don't set one. The service might return a \`nextToken\` even if the \`maxResults\` value has not been met.
        next-token: The pagination token that's used to fetch the next set of results.
