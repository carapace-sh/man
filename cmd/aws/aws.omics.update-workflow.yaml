name: update-workflow
description: Updates information about a workflow.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description for the workflow.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --id=!: The workflow's ID.
    --name=: A name for the workflow.
    --readme-markdown=: The markdown content for the workflow's README file.
    --storage-capacity=: The default static storage capacity (in gibibytes) for runs that use this workflow or workflow version.
    --storage-type=: The default storage type for runs that use this workflow.
completion:
    flag:
        storage-type:
            - STATIC
            - DYNAMIC
documentation:
    command: |-
        Updates information about a workflow.

        You can update the following workflow information:

        - Name
        - Description
        - Default storage type
        - Default storage capacity (with workflow ID)

        This operation returns a response with no body if the operation is successful. You can check the workflow updates by calling the `GetWorkflow` API operation.

        For more information, see [Update a private workflow](https://docs.aws.amazon.com/omics/latest/dev/update-private-workflow.html) in the *Amazon Web Services HealthOmics User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description for the workflow.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        id: The workflow's ID.
        name: A name for the workflow.
        readme-markdown: The markdown content for the workflow's README file. This provides documentation and usage information for users of the workflow.
        storage-capacity: The default static storage capacity (in gibibytes) for runs that use this workflow or workflow version.
        storage-type: The default storage type for runs that use this workflow. STATIC storage allocates a fixed amount of storage. DYNAMIC storage dynamically scales the storage up or down, based on file system utilization. For more information about static and dynamic storage, see [Running workflows](https://docs.aws.amazon.com/omics/latest/dev/Using-workflows.html) in the *Amazon Web Services HealthOmics User Guide*.
