name: remove-tags-from-resource
description: Removes one or more tags from the specified resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource you want to remove the tags from.
    --tag-keys=!: The keys of the tags you want to remove from the specified resource.
documentation:
    command: Removes one or more tags from the specified resource. This operation is supported in storage gateways of all types.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource you want to remove the tags from.
        tag-keys: The keys of the tags you want to remove from the specified resource. A tag is composed of a key-value pair.
