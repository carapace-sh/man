name: list-document-metadata-history
description: Amazon Web Services Systems Manager Change Manager will no longer be open to new customers starting November 7, 2025. If you would like to use Change Manager, sign up prior to that date.
flags:
    --document-version=: The version of the change template.
    --max-results=: The maximum number of items to return for this call.
    --metadata=!: The type of data for which details are being requested.
    --name=!: The name of the change template.
    --next-token=: The token for the next set of items to return.
completion:
    flag:
        metadata:
            - DocumentReviews
documentation:
    command: |-
        Amazon Web Services Systems Manager Change Manager will no longer be open to new customers starting November 7, 2025. If you would like to use Change Manager, sign up prior to that date. Existing customers can continue to use the service as normal. For more information, see [Amazon Web Services Systems Manager Change Manager availability change](https://docs.aws.amazon.com/systems-manager/latest/userguide/change-manager-availability-change.html).

        Information about approval reviews for a version of a change template in Change Manager.
    flag:
        document-version: The version of the change template.
        max-results: The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        metadata: The type of data for which details are being requested. Currently, the only supported value is `DocumentReviews`.
        name: The name of the change template.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
