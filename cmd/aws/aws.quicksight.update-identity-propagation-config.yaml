name: update-identity-propagation-config
description: Adds or updates services and authorized targets to configure what the Quick Sight IAM Identity Center application can access.
flags:
    --authorized-targets=: Specifies a list of application ARNs that represent the authorized targets for a service.
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the identity propagation configuration that you want to update.
    --service=!: The name of the Amazon Web Services service that contains the authorized targets that you want to add or update.
completion:
    flag:
        service:
            - REDSHIFT
            - QBUSINESS
            - ATHENA
documentation:
    command: |-
        Adds or updates services and authorized targets to configure what the Quick Sight IAM Identity Center application can access.

        This operation is only supported for Quick Sight accounts using IAM Identity Center
    flag:
        authorized-targets: Specifies a list of application ARNs that represent the authorized targets for a service.
        aws-account-id: The ID of the Amazon Web Services account that contains the identity propagation configuration that you want to update.
        service: The name of the Amazon Web Services service that contains the authorized targets that you want to add or update.
