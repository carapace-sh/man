name: delete-ipam
description: Delete an IPAM.
flags:
    --cascade: Enables you to quickly delete an IPAM, private scopes, pools in private scopes, and any allocations in the pools in private scopes.
    --dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --ipam-id=!: The ID of the IPAM to delete.
    --no-cascade: Enables you to quickly delete an IPAM, private scopes, pools in private scopes, and any allocations in the pools in private scopes.
    --no-dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
documentation:
    command: |-
        Delete an IPAM. Deleting an IPAM removes all monitored data associated with the IPAM including the historical data for CIDRs.

        For more information, see [Delete an IPAM](https://docs.aws.amazon.com/vpc/latest/ipam/delete-ipam.html) in the *Amazon VPC IPAM User Guide*.
    flag:
        cascade: "Enables you to quickly delete an IPAM, private scopes, pools in private scopes, and any allocations in the pools in private scopes. You cannot delete the IPAM with this option if there is a pool in your public scope. If you use this option, IPAM does the following:\n\n- Deallocates any CIDRs allocated to VPC resources (such as VPCs) in pools in private scopes.\n  \n  No VPC resources are deleted as a result of enabling this option. The CIDR associated with the resource will no longer be allocated from an IPAM pool, but the CIDR itself will remain unchanged.\n- Deprovisions all IPv4 CIDRs provisioned to IPAM pools in private scopes.\n- Deletes all IPAM pools in private scopes.\n- Deletes all non-default private scopes in the IPAM.\n- Deletes the default public and private scopes and the IPAM."
        dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        ipam-id: The ID of the IPAM to delete.
