name: modify-dbproxy-endpoint
description: Changes the settings for an existing DB proxy endpoint.
flags:
    --dbproxy-endpoint-name=!: The name of the DB proxy sociated with the DB proxy endpoint that you want to modify.
    --new-dbproxy-endpoint-name=: The new identifier for the `DBProxyEndpoint`.
    --vpc-security-group-ids=: The VPC security group IDs for the DB proxy endpoint.
documentation:
    command: Changes the settings for an existing DB proxy endpoint.
    flag:
        dbproxy-endpoint-name: The name of the DB proxy sociated with the DB proxy endpoint that you want to modify.
        new-dbproxy-endpoint-name: The new identifier for the `DBProxyEndpoint`. An identifier must begin with a letter and must contain only ASCII letters, digits, and hyphens; it can't end with a hyphen or contain two consecutive hyphens.
        vpc-security-group-ids: The VPC security group IDs for the DB proxy endpoint. When the DB proxy endpoint uses a different VPC than the original proxy, you also specify a different set of security group IDs than for the original proxy.
