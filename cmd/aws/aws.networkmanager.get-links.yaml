name: get-links
description: Gets information about one or more links in a specified global network.
flags:
    --global-network-id=!: The ID of the global network.
    --link-ids=: One or more link IDs.
    --max-results=: The maximum number of results to return.
    --next-token=: The token for the next page of results.
    --provider=: The link provider.
    --site-id=: The ID of the site.
    --type=: The link type.
documentation:
    command: |-
        Gets information about one or more links in a specified global network.

        If you specify the site ID, you cannot specify the type or provider in the same request. You can specify the type and provider in the same request.
    flag:
        global-network-id: The ID of the global network.
        link-ids: One or more link IDs. The maximum is 10.
        max-results: The maximum number of results to return.
        next-token: The token for the next page of results.
        provider: The link provider.
        site-id: The ID of the site.
        type: The link type.
