name: update-user
description: Updates user information.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique and case-sensitive identifier that you provide to make sure the idempotency of the request, so multiple identical calls have the same effect as one single call.
    --directory-id=!: The identifier (ID) of the directory that's associated with the user.
    --email-address=: The email address of the user.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --given-name=: The first name of the user.
    --other-attributes=: An expression that defines one or more attribute names with the data type and value of each attribute.
    --sam-account-name=!: The name of the user.
    --surname=: The last name of the user.
    --update-type=: The type of update to be performed.
completion:
    flag:
        update-type:
            - ADD
            - REPLACE
            - REMOVE
documentation:
    command: Updates user information.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: |-
            A unique and case-sensitive identifier that you provide to make sure the idempotency of the request, so multiple identical calls have the same effect as one single call.

            A client token is valid for 8 hours after the first request that uses it completes. After 8 hours, any request with the same client token is treated as a new request. If the request succeeds, any future uses of that token will be idempotent for another 8 hours.

            If you submit a request with the same client token but change one of the other parameters within the 8-hour idempotency window, Directory Service Data returns an `ConflictException`.

            This parameter is optional when using the CLI or SDK.
        directory-id: The identifier (ID) of the directory that's associated with the user.
        email-address: The email address of the user.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        given-name: The first name of the user.
        other-attributes: |-
            An expression that defines one or more attribute names with the data type and value of each attribute. A key is an attribute name, and the value is a list of maps. For a list of supported attributes, see [Directory Service Data Attributes](https://docs.aws.amazon.com/directoryservice/latest/admin-guide/ad_data_attributes.html).

            Attribute names are case insensitive.
        sam-account-name: The name of the user.
        surname: The last name of the user.
        update-type: The type of update to be performed. If no value exists for the attribute, use `ADD`. Otherwise, use `REPLACE` to change an attribute value or `REMOVE` to clear the attribute value.
