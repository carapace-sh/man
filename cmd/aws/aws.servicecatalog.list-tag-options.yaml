name: list-tag-options
description: Lists the specified TagOptions or all TagOptions.
flags:
    --filters=: The search filters.
    --page-size=: The maximum number of items to return with this call.
    --page-token=: The page token for the next set of results.
documentation:
    command: Lists the specified TagOptions or all TagOptions.
    flag:
        filters: The search filters. If no search filters are specified, the output includes all TagOptions.
        page-size: The maximum number of items to return with this call.
        page-token: The page token for the next set of results. To retrieve the first set of results, use null.
