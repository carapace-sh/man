name: list-namespaces
description: Lists summary information about the namespaces that were created by the current Amazon Web Services account and shared with the current Amazon Web Services account.
flags:
    --filters=: A complex type that contains specifications for the namespaces that you want to list.
    --max-results=: The maximum number of namespaces that you want Cloud Map to return in the response to a `ListNamespaces` request.
    --next-token=: For the first `ListNamespaces` request, omit this value.
documentation:
    command: Lists summary information about the namespaces that were created by the current Amazon Web Services account and shared with the current Amazon Web Services account.
    flag:
        filters: |-
            A complex type that contains specifications for the namespaces that you want to list.

            If you specify more than one filter, a namespace must match all filters to be returned by `ListNamespaces`.
        max-results: The maximum number of namespaces that you want Cloud Map to return in the response to a `ListNamespaces` request. If you don't specify a value for `MaxResults`, Cloud Map returns up to 100 namespaces.
        next-token: |-
            For the first `ListNamespaces` request, omit this value.

            If the response contains `NextToken`, submit another `ListNamespaces` request to get the next group of results. Specify the value of `NextToken` from the previous response in the next request.

            Cloud Map gets `MaxResults` namespaces and then filters them based on the specified criteria. It's possible that no namespaces in the first `MaxResults` namespaces matched the specified criteria but that subsequent groups of `MaxResults` namespaces do contain namespaces that match the criteria.
