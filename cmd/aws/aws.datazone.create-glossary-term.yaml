name: create-glossary-term
description: Creates a business glossary term.
flags:
    --client-token=: A unique, case-sensitive identifier that is provided to ensure the idempotency of the request.
    --domain-identifier=!: The ID of the Amazon DataZone domain in which this business glossary term is created.
    --glossary-identifier=!: The ID of the business glossary in which this term is created.
    --long-description=: The long description of this business glossary term.
    --name=!: The name of this business glossary term.
    --short-description=: The short description of this business glossary term.
    --status=: The status of this business glossary term.
    --term-relations=: The term relations of this business glossary term.
completion:
    flag:
        status:
            - ENABLED
            - DISABLED
documentation:
    command: |-
        Creates a business glossary term.

        A glossary term represents an individual entry within the Amazon DataZone glossary, serving as a standardized definition for a specific business concept or data element. Each term can include rich metadata such as detailed definitions, synonyms, related terms, and usage examples. Glossary terms can be linked directly to data assets, providing business context to technical data elements. This linking capability helps users understand the business meaning of data fields and ensures consistent interpretation across different systems and teams. Terms can also have relationships with other terms, creating a semantic network that reflects the complexity of business concepts.

        Prerequisites:

        - Domain must exist.
        - Glossary must exist.
        - The term name must be unique within the glossary.
        - Ensure term does not conflict with existing terms in hierarchy.
    flag:
        client-token: A unique, case-sensitive identifier that is provided to ensure the idempotency of the request.
        domain-identifier: The ID of the Amazon DataZone domain in which this business glossary term is created.
        glossary-identifier: The ID of the business glossary in which this term is created.
        long-description: The long description of this business glossary term.
        name: The name of this business glossary term.
        short-description: The short description of this business glossary term.
        status: The status of this business glossary term.
        term-relations: The term relations of this business glossary term.
