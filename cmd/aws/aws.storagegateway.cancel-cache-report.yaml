name: cancel-cache-report
description: Cancels generation of a specified cache report.
flags:
    --cache-report-arn=!: The Amazon Resource Name (ARN) of the cache report you want to cancel.
documentation:
    command: Cancels generation of a specified cache report. You can use this operation to manually cancel an IN-PROGRESS report for any reason. This action changes the report status from IN-PROGRESS to CANCELLED. You can only cancel in-progress reports. If the the report you attempt to cancel is in FAILED, ERROR, or COMPLETED state, the cancel operation returns an error.
    flag:
        cache-report-arn: The Amazon Resource Name (ARN) of the cache report you want to cancel.
