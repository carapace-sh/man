name: export
description: Export a target HTTPS proxy.
flags:
    --destination=: Path to a YAML file where the configuration will be exported.
    --global: If set, the target HTTPS proxy is global.
    --no-global&: If set, the target HTTPS proxy is global.
    --region=: Region of the target HTTPS proxy to export.
documentation:
    command: |
        Exports a target HTTPS proxy's configuration to a file.
        This configuration can be imported at a later time.
    flag:
        destination: |-
            Path to a YAML file where the configuration will be exported.
                      Alternatively, you may omit this flag to write to standard output. For a schema describing the export/import format, see:
                      $CLOUDSDKROOT/lib/googlecloudsdk/schemas/compute/v1/TargetHttpsProxy.yaml.
        global: If set, the target HTTPS proxy is global.
        no-global: If set, the target HTTPS proxy is global.
        region: |-
            Region of the target HTTPS proxy to export. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
