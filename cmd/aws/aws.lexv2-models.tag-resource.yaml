name: tag-resource
description: Adds the specified tags to the specified resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the bot, bot alias, or bot channel to tag.
    --tags=!: A list of tag keys to add to the resource.
documentation:
    command: Adds the specified tags to the specified resource. If a tag key already exists, the existing value is replaced with the new value.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the bot, bot alias, or bot channel to tag.
        tags: A list of tag keys to add to the resource. If a tag key already exists, the existing value is replaced with the new value.
