name: capacity
description: '*(ALPHA)*  Get capacity advice for Compute Engine resources.'
hidden: true
flags:
    --instance-selection-machine-types=: Specifies a comma-separated list of preferred machine types for creating virtual machines.
    --instance-selection=: Named selection of machine types.
    --provisioning-model=!: Specifies the provisioning model.
    --region=: Region of the resources to get advice on.
    --size=!: The total number of VMs being requested in the capacity query.
    --target-distribution-shape=!: Defines the distribution requirement for the requested VMs.
    --zones=: A comma-separated list of zones to query within the specified region, for example, `us-central1-a,us-central1-b`.
completion:
    flag:
        provisioning-model:
            - SPOT
        target-distribution-shape:
            - ANY
            - ANY_SINGLE_ZONE
documentation:
    command: |
        *(ALPHA)*  Get capacity advice for Compute Engine resources.

        This command helps you view future resource availability for a specific
        number of VM instances, machine type, provisioning model, and zone. After
        you confirm resource availability, you can specify those configurations
        when you create VM instances. This action improves the success rate of
        your VM instance creation request.
    flag:
        instance-selection: Named selection of machine types. For example, --instance-selection="name=instance-selection-1,machine-type=e2-standard-8,machine-type=t2d-standard-8".
        instance-selection-machine-types: Specifies a comma-separated list of preferred machine types for creating virtual machines.
        provisioning-model: |-
            Specifies the provisioning model. _PROVISIONING_MODEL_ must be (only one value is supported):
            +
            *SPOT*::: Compute Engine may preempt a Spot VM whenever it needs capacity. Because Spot VMs don't have a guaranteed runtime, they come at a discounted price.
            :::
            +
        region: |-
            Region of the resources to get advice on. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        size: The total number of VMs being requested in the capacity query.
        target-distribution-shape: |-
            Defines the distribution requirement for the requested VMs. _TARGET_DISTRIBUTION_SHAPE_ must be one of:
            +
            *ANY*::: When you specify ANY for VM instance creation across multiple zones, you specify that you want to create your VM instances in one or more zones based on resource availability, and to use any unused, matching reservation in your project. Use ANY for batch workloads that don't require high availability.
            *ANY_SINGLE_ZONE*::: When you specify ANY_SINGLE_ZONE for VM instance creation, you specify that you want to create all VM instances in a single available zone. Compute Engine selects this zone based on resource availability and on any unused, matching reservation in your project. However, zonal resource availability constraints might prevent Compute Engine from creating all your requested VM instances. Use ANY_SINGLE_ZONE when the VM instances in your workloads need to frequently communicate among each other.
            :::
            +
        zones: A comma-separated list of zones to query within the specified region, for example, `us-central1-a,us-central1-b`. If you omit this flag, then you view availability for your requested capacity across all zones in the region.
