name: register-compute
description: Registers a compute resource in an Amazon GameLift Servers Anywhere fleet.
flags:
    --certificate-path=: The path to a TLS certificate on your compute resource.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --compute-name=!: A descriptive label for the compute resource.
    --dns-name=: The DNS name of the compute resource.
    --fleet-id=!: A unique identifier for the fleet to register the compute to.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ip-address=: The IP address of the compute resource.
    --location=: The name of a custom location to associate with the compute resource being registered.
documentation:
    command: |-
        Registers a compute resource in an Amazon GameLift Servers Anywhere fleet.

        For an Anywhere fleet that's running the Amazon GameLift Servers Agent, the Agent handles all compute registry tasks for you. For an Anywhere fleet that doesn't use the Agent, call this operation to register fleet computes.

        To register a compute, give the compute a name (must be unique within the fleet) and specify the compute resource's DNS name or IP address. Provide a fleet ID and a fleet location to associate with the compute being registered. You can optionally include the path to a TLS certificate on the compute resource.

        If successful, this operation returns compute details, including an Amazon GameLift Servers SDK endpoint or Agent endpoint. Game server processes running on the compute can use this endpoint to communicate with the Amazon GameLift Servers service. Each server process includes the SDK endpoint in its call to the Amazon GameLift Servers server SDK action `InitSDK()`.

        To view compute details, call [DescribeCompute](https://docs.aws.amazon.com/gamelift/latest/apireference/API_DescribeCompute.html) with the compute name.

        **Learn more**

        - [Create an Anywhere fleet](https://docs.aws.amazon.com/gamelift/latest/developerguide/fleets-creating-anywhere.html)
        - [Test your integration](https://docs.aws.amazon.com/gamelift/latest/developerguide/integration-testing.html)
        - [Server SDK reference guides](https://docs.aws.amazon.com/gamelift/latest/developerguide/reference-serversdk.html) (for version 5.x)
    flag:
        certificate-path: The path to a TLS certificate on your compute resource. Amazon GameLift Servers doesn't validate the path and certificate.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        compute-name: A descriptive label for the compute resource.
        dns-name: The DNS name of the compute resource. Amazon GameLift Servers requires either a DNS name or IP address.
        fleet-id: A unique identifier for the fleet to register the compute to. You can use either the fleet ID or ARN value.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ip-address: The IP address of the compute resource. Amazon GameLift Servers requires either a DNS name or IP address. When registering an Anywhere fleet, an IP address is required.
        location: The name of a custom location to associate with the compute resource being registered. This parameter is required when registering a compute for an Anywhere fleet.
