name: list-tags-for-resource
description: The `ListTagsForResource` operation returns the tags that are associated with an Amazon Managed Service for Prometheus resource.
flags:
    --resource-arn=!: The ARN of the resource to list tages for.
documentation:
    command: The `ListTagsForResource` operation returns the tags that are associated with an Amazon Managed Service for Prometheus resource. Currently, the only resources that can be tagged are scrapers, workspaces, and rule groups namespaces.
    flag:
        resource-arn: The ARN of the resource to list tages for. Must be a workspace, scraper, or rule groups namespace resource.
