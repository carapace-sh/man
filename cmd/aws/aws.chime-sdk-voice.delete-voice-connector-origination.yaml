name: delete-voice-connector-origination
description: Deletes the origination settings for the specified Amazon Chime SDK Voice Connector.
flags:
    --voice-connector-id=!: The Voice Connector ID.
documentation:
    command: |-
        Deletes the origination settings for the specified Amazon Chime SDK Voice Connector.

        If emergency calling is configured for the Voice Connector, it must be deleted prior to deleting the origination settings.
    flag:
        voice-connector-id: The Voice Connector ID.
