name: delete-recipe-version
description: Deletes a single version of a DataBrew recipe.
flags:
    --name=!: The name of the recipe.
    --recipe-version=!: The version of the recipe to be deleted.
documentation:
    command: Deletes a single version of a DataBrew recipe.
    flag:
        name: The name of the recipe.
        recipe-version: The version of the recipe to be deleted. You can specify a numeric versions (`X.Y`) or `LATEST_WORKING`. `LATEST_PUBLISHED` is not supported.
