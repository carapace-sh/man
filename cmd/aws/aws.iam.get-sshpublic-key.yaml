name: get-sshpublic-key
description: Retrieves the specified SSH public key, including metadata about the key.
flags:
    --encoding=!: Specifies the public key encoding format to use in the response.
    --sshpublic-key-id=!: The unique identifier for the SSH public key.
    --user-name=!: The name of the IAM user associated with the SSH public key.
completion:
    flag:
        encoding:
            - SSH
            - PEM
documentation:
    command: |-
        Retrieves the specified SSH public key, including metadata about the key.

        The SSH public key retrieved by this operation is used only for authenticating the associated IAM user to an CodeCommit repository. For more information about using SSH keys to authenticate to an CodeCommit repository, see [Set up CodeCommit for SSH connections](https://docs.aws.amazon.com/codecommit/latest/userguide/setting-up-credentials-ssh.html) in the *CodeCommit User Guide*.
    flag:
        encoding: Specifies the public key encoding format to use in the response. To retrieve the public key in ssh-rsa format, use `SSH`. To retrieve the public key in PEM format, use `PEM`.
        sshpublic-key-id: |-
            The unique identifier for the SSH public key.

            This parameter allows (through its [regex pattern](http://wikipedia.org/wiki/regex)) a string of characters that can consist of any upper or lowercased letter or digit.
        user-name: |-
            The name of the IAM user associated with the SSH public key.

            This parameter allows (through its [regex pattern](http://wikipedia.org/wiki/regex)) a string of characters consisting of upper and lowercase alphanumeric characters with no spaces. You can also include any of the following characters: \_+=,.@-
