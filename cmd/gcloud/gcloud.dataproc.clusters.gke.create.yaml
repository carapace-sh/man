name: create
description: Create a GKE-based virtual cluster.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --gke-cluster-location=: GKE region for the gke-cluster.
    --gke-cluster=!: ID of the gke-cluster or fully qualified identifier for the gke-cluster.
    --history-server-cluster-region=: Compute Engine region for the history-server-cluster.
    --history-server-cluster=!: ID of the history-server-cluster or fully qualified identifier for the history-server-cluster.
    --metastore-service-location=: Dataproc Metastore location for the metastore-service.
    --metastore-service=!: ID of the metastore-service or fully qualified identifier for the metastore-service.
    --namespace=: The name of the Kubernetes namespace to deploy Dataproc system
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-setup-workload-identity&: Sets up the GKE Workload Identity for your Dataproc on GKE cluster.
    --pools=: Each `--pools` flag represents a GKE node pool associated with
    --properties=: Specifies configuration properties for installed packages, such as
    --region=: Dataproc region for the cluster.
    --setup-workload-identity: Sets up the GKE Workload Identity for your Dataproc on GKE cluster.
    --spark-engine-version=!: The version of the Spark engine to run on this cluster.
    --staging-bucket=: The Cloud Storage bucket to use to stage job dependencies, miscellaneous
    --timeout=&: Client side timeout on how long to wait for Dataproc operations.
documentation:
    command: Create a GKE-based virtual cluster.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        gke-cluster: |-
            ID of the gke-cluster or fully qualified identifier for the gke-cluster.
            +
            To set the `gke-cluster` attribute:
            * provide the argument `--gke-cluster` on the command line.
        gke-cluster-location: |-
            GKE region for the gke-cluster.
            +
            To set the `gke-cluster-location` attribute:
            * provide the argument `--gke-cluster` on the command line with a fully specified name;
            * provide the argument `--gke-cluster-location` on the command line;
            * provide the argument `--region` on the command line;
            * set the property `dataproc/region`.
        history-server-cluster: |-
            ID of the history-server-cluster or fully qualified identifier for the history-server-cluster.
            +
            To set the `history-server-cluster` attribute:
            * provide the argument `--history-server-cluster` on the command line.
        history-server-cluster-region: |-
            Compute Engine region for the history-server-cluster. It must be the same region as the Dataproc cluster that is being created.
            +
            To set the `history-server-cluster-region` attribute:
            * provide the argument `--history-server-cluster` on the command line with a fully specified name;
            * provide the argument `--history-server-cluster-region` on the command line;
            * provide the argument `--region` on the command line;
            * set the property `dataproc/region`.
        metastore-service: |-
            ID of the metastore-service or fully qualified identifier for the metastore-service.
            +
            To set the `metastore-service` attribute:
            * provide the argument `--metastore-service` on the command line.
        metastore-service-location: |-
            Dataproc Metastore location for the metastore-service.
            +
            To set the `metastore-service-location` attribute:
            * provide the argument `--metastore-service` on the command line with a fully specified name;
            * provide the argument `--metastore-service-location` on the command line;
            * provide the argument `--region` on the command line;
            * set the property `dataproc/region`.
        namespace: |-
            The name of the Kubernetes namespace to deploy Dataproc system
            components in. This namespace does not need to exist.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-setup-workload-identity: |
            Sets up the GKE Workload Identity for your Dataproc on GKE cluster.
            Note that running this requires elevated permissions as it will
            manipulate IAM policies on the Google Service Accounts that will be
            used by your Dataproc on GKE cluster.
        pools: |-
            Each `--pools` flag represents a GKE node pool associated with
                    the virtual cluster. It is comprised of a CSV in the form
                    `KEY=VALUE[;VALUE]`, where certain keys may have multiple values.
            +
            The following KEYs must be specified:
            +
                    -----------------------------------------------------------------------------------------------------------
                    KEY    Type             Example                  Description
                    ------ ---------------- ------------------------ ----------------------------------------------------------
                    name   string           `my-node-pool`          Name of the node pool.
            +
                    roles  repeated string  `default;spark-driver`  Roles that this node pool should perform. Valid values are
                                                                     `default`, `controller`, `spark-driver`, `spark-executor`.
                    -----------------------------------------------------------------------------------------------------------
            +
            The following KEYs may be specified:
            +
                    ----------------------------------------------------------------------------------------------------------------------------------------------------------------
                    KEY                Type             Example                                       Description
                    --------------- ---------------- --------------------------------------------- ---------------------------------------------------------------------------------
                    machineType        string           `n1-standard-8`                               Compute Engine machine type to use.
            +
                    preemptible        boolean          `false`                                       If true, then this node pool uses preemptible VMs.
                                                                                                      This cannot be true on the node pool with the `controllers` role
                                                                                                      (or `default` role if `controllers` role is not specified).
            +
                    localSsdCount      int              `2`                                           The number of local SSDs to attach to each node.
            +
                    accelerator        repeated string  `nvidia-tesla-a100=1`                         Accelerators to attach to each node. In the format NAME=COUNT.
            +
                    minCpuPlatform     string           `Intel Skylake`                               Minimum CPU platform for each node.
            +
                    bootDiskKmsKey     string           `projects/project-id/locations/us-central1    The Customer Managed Encryption Key (CMEK) used to encrypt
                                                        /keyRings/keyRing-name/cryptoKeys/key-name`   the boot disk attached to each node in the node pool.
            +
                    locations          repeated string  `us-west1-a;us-west1-c`                       Zones within the location of the GKE cluster.
                                                                                                      All `--pools` flags for a Dataproc cluster must have identical locations.
            +
                    min                int              `0`                                           Minimum number of nodes per zone that this node pool can scale down to.
            +
                    max                int              `10`                                          Maximum number of nodes per zone that this node pool can scale up to.
                    ----------------------------------------------------------------------------------------------------------------------------------------------------------------
        properties: |-
            Specifies configuration properties for installed packages, such as
            Spark. Properties are mapped to configuration files by specifying a
            prefix, such as "core:io.serializations".
        region: |-
            Dataproc region for the cluster. Each Dataproc region constitutes an independent resource namespace constrained to deploying instances into Compute Engine zones inside the region. Overrides the default `dataproc/region` property value for this command invocation.
            +
            To set the `region` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `dataproc/region`.
        setup-workload-identity: |-
            Sets up the GKE Workload Identity for your Dataproc on GKE cluster.
            Note that running this requires elevated permissions as it will
            manipulate IAM policies on the Google Service Accounts that will be
            used by your Dataproc on GKE cluster.
        spark-engine-version: The version of the Spark engine to run on this cluster.
        staging-bucket: |-
            The Cloud Storage bucket to use to stage job dependencies, miscellaneous
            config files, and job driver console output when using this cluster.
        timeout: Client side timeout on how long to wait for Dataproc operations. See $ gcloud topic datetimes for information on duration formats.
