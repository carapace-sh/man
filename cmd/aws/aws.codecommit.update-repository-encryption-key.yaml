name: update-repository-encryption-key
description: Updates the Key Management Service encryption key used to encrypt and decrypt a CodeCommit repository.
flags:
    --kms-key-id=!: The ID of the encryption key.
    --repository-name=!: The name of the repository for which you want to update the KMS encryption key used to encrypt and decrypt the repository.
documentation:
    command: Updates the Key Management Service encryption key used to encrypt and decrypt a CodeCommit repository.
    flag:
        kms-key-id: The ID of the encryption key. You can view the ID of an encryption key in the KMS console, or use the KMS APIs to programmatically retrieve a key ID. For more information about acceptable values for keyID, see [KeyId](https://docs.aws.amazon.com/kms/latest/APIReference/API_Decrypt.html#KMS-Decrypt-request-KeyId) in the Decrypt API description in the *Key Management Service API Reference*.
        repository-name: The name of the repository for which you want to update the KMS encryption key used to encrypt and decrypt the repository.
