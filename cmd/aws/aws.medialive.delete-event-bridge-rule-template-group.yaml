name: delete-event-bridge-rule-template-group
description: Deletes an eventbridge rule template group.
flags:
    --identifier=!: An eventbridge rule template group's identifier.
documentation:
    command: Deletes an eventbridge rule template group. You must detach this group from all signal maps and ensure its existing templates are moved to another group or deleted.
    flag:
        identifier: An eventbridge rule template group's identifier. Can be either be its id or current name.
