name: disable
description: '*(ALPHA)*  Disable Config Delivery Argo CD Feature on a membership.'
hidden: true
flags:
    --config-membership=!: ID of the membership or fully qualified identifier for the membership.
    --location=: Location for the membership.
documentation:
    command: |-
        *(ALPHA)*  This command disables Config Delivery Argo CD Feature on a membership.

        ## EXAMPLES

        To disable the Config Delivery Argo CD Feature on a membership, run:

          $ gcloud alpha container fleet argocd disable --config-membership=CONFIG_MEMBERSHIP
    flag:
        config-membership: |-
            ID of the membership or fully qualified identifier for the membership.
            +
            To set the `membership` attribute:
            * provide the argument `--config-membership` on the command line.
        location: |-
            Location for the membership.
            +
            To set the `location` attribute:
            * provide the argument `--config-membership` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkehub/location`.
