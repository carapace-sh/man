name: detect-toxic-content
description: Performs toxicity analysis on the list of text strings that you provide as input.
flags:
    --language-code=!: The language of the input text.
    --text-segments=!: A list of up to 10 text strings.
completion:
    flag:
        language-code:
            - en
            - es
            - fr
            - de
            - it
            - pt
            - ar
            - hi
            - ja
            - ko
            - zh
            - zh-TW
documentation:
    command: Performs toxicity analysis on the list of text strings that you provide as input. The API response contains a results list that matches the size of the input list. For more information about toxicity detection, see [Toxicity detection](https://docs.aws.amazon.com/comprehend/latest/dg/toxicity-detection.html) in the *Amazon Comprehend Developer Guide*.
    flag:
        language-code: The language of the input text. Currently, English is the only supported language.
        text-segments: A list of up to 10 text strings. Each string has a maximum size of 1 KB, and the maximum size of the list is 10 KB.
