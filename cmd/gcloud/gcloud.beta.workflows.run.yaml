name: run
description: '*(BETA)*  Execute a workflow and wait for the execution to complete.'
flags:
    --call-log-level=: Level of call logging to apply during execution.
    --data=: JSON string with data that will be passed to the workflow as an argument.
    --location=: Cloud location for the workflow.
completion:
    flag:
        call-log-level:
            - log-all-calls
            - log-errors-only
            - none
documentation:
    command: '*(BETA)*  Execute a workflow and wait for the execution to complete.'
    flag:
        call-log-level: |-
            Level of call logging to apply during execution. _CALL_LOG_LEVEL_ must be one of:
            +
            *log-all-calls*::: Log all calls to subworkflows or library functions and their results.
            *log-errors-only*::: Log when a call is stopped due to an exception.
            *none*::: Perform no call logging.
            :::
            +
        data: JSON string with data that will be passed to the workflow as an argument.
        location: |-
            Cloud location for the workflow.  Alternatively, set the property [workflows/location].
            +
            To set the `location` attribute:
            * provide the argument `workflow` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `workflows/location`.
