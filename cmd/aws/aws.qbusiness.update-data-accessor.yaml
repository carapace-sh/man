name: update-data-accessor
description: Updates an existing data accessor.
flags:
    --action-configurations=!:
        description: The updated list of action configurations specifying the allowed actions and any associated filters.
        nargs: -1
    --application-id=!: The unique identifier of the Amazon Q Business application.
    --authentication-detail=: The updated authentication configuration details for the data accessor.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --data-accessor-id=!: The unique identifier of the data accessor to update.
    --display-name=: The updated friendly name for the data accessor.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
documentation:
    command: Updates an existing data accessor. This operation allows modifying the action configurations (the allowed actions and associated filters) and the display name of the data accessor. It does not allow changing the IAM role associated with the data accessor or other core properties of the data accessor.
    flag:
        action-configurations: The updated list of action configurations specifying the allowed actions and any associated filters.
        application-id: The unique identifier of the Amazon Q Business application.
        authentication-detail: The updated authentication configuration details for the data accessor. This specifies how the ISV will authenticate when accessing data through this data accessor.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        data-accessor-id: The unique identifier of the data accessor to update.
        display-name: The updated friendly name for the data accessor.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
