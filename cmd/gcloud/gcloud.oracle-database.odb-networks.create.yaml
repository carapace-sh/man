name: create
description: Create a new OdbNetwork.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --gcp-oracle-zone=: The GCP Oracle zone where OdbNetwork is hosted.
    --labels=: Labels or tags associated with the resource.
    --location=: The location id of the odbNetwork resource.
    --network=!: ID of the network or fully qualified identifier for the network.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --request-id=: An optional ID to identify the request.
documentation:
    command: Create a new OdbNetwork.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        gcp-oracle-zone: |-
            The GCP Oracle zone where OdbNetwork is hosted.
            Example: us-east4-b-r2.
            If not specified, the system will pick a zone based on availability.
        labels: |-
            Labels or tags associated with the resource.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: |-
            The location id of the odbNetwork resource.
            +
            To set the `location` attribute:
            * provide the argument `odb_network` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        network: |-
            ID of the network or fully qualified identifier for the network.
            +
            To set the `network` attribute:
            * provide the argument `--network` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        request-id: |-
            An optional ID to identify the request. This value is used to identify
            duplicate requests. If you make a request with the same request ID
            and the original request is still in progress or completed, the server
            ignores the second request. This prevents clients from
            accidentally creating duplicate commitments.
            +
            The request ID must be a valid UUID with the exception that zero UUID is
            not supported (00000000-0000-0000-0000-000000000000).
