name: describe
description: Get a framework deployment.
flags:
    --location=: The location id of the frameworkDeployment resource.
    --organization=: The organization id of the frameworkDeployment resource.
documentation:
    command: |
        Get the details for a specific framework deployment.
    flag:
        location: |-
            The location id of the frameworkDeployment resource.
            +
            To set the `location` attribute:
            * provide the argument `framework_deployment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        organization: |-
            The organization id of the frameworkDeployment resource.
            +
            To set the `organization` attribute:
            * provide the argument `framework_deployment` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
