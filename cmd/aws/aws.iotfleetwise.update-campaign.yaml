name: update-campaign
description: Updates a campaign.
flags:
    --action=!: Specifies how to update a campaign.
    --data-extra-dimensions=: A list of vehicle attributes to associate with a signal.
    --description=: The description of the campaign.
    --name=!: The name of the campaign to update.
completion:
    flag:
        action:
            - APPROVE
            - SUSPEND
            - RESUME
            - UPDATE
documentation:
    command: Updates a campaign.
    flag:
        action: |-
            Specifies how to update a campaign. The action can be one of the following:

            - `APPROVE` - To approve delivering a data collection scheme to vehicles.
            - `SUSPEND` - To suspend collecting signal data. The campaign is deleted from vehicles and all vehicles in the suspended campaign will stop sending data.
            - `RESUME` - To reactivate the `SUSPEND` campaign. The campaign is redeployed to all vehicles and the vehicles will resume sending data.
            - `UPDATE` - To update a campaign.
        data-extra-dimensions: |-
            A list of vehicle attributes to associate with a signal.

            Default: An empty array
        description: The description of the campaign.
        name: The name of the campaign to update.
