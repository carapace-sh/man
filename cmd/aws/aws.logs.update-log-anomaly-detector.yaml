name: update-log-anomaly-detector
description: Updates an existing log anomaly detector.
flags:
    --anomaly-detector-arn=!: The ARN of the anomaly detector that you want to update.
    --anomaly-visibility-time=: The number of days to use as the life cycle of anomalies.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --enabled!: Use this parameter to pause or restart the anomaly detector.
    --evaluation-frequency=: Specifies how often the anomaly detector runs and look for anomalies.
    --filter-pattern=: ""
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-enabled!: Use this parameter to pause or restart the anomaly detector.
completion:
    flag:
        evaluation-frequency:
            - ONE_MIN
            - FIVE_MIN
            - TEN_MIN
            - FIFTEEN_MIN
            - THIRTY_MIN
            - ONE_HOUR
documentation:
    command: Updates an existing log anomaly detector.
    flag:
        anomaly-detector-arn: The ARN of the anomaly detector that you want to update.
        anomaly-visibility-time: The number of days to use as the life cycle of anomalies. After this time, anomalies are automatically baselined and the anomaly detector model will treat new occurrences of similar event as normal. Therefore, if you do not correct the cause of an anomaly during this time, it will be considered normal going forward and will not be detected.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        enabled: Use this parameter to pause or restart the anomaly detector.
        evaluation-frequency: Specifies how often the anomaly detector runs and look for anomalies. Set this value according to the frequency that the log group receives new logs. For example, if the log group receives new log events every 10 minutes, then setting `evaluationFrequency` to `FIFTEEN_MIN` might be appropriate.
        filter-pattern: ""
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
