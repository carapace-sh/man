name: update-vpce-configuration
description: Updates information about an Amazon Virtual Private Cloud (VPC) endpoint configuration.
flags:
    --arn=!: The Amazon Resource Name (ARN) of the VPC endpoint configuration you want to update.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --service-dns-name=: The DNS (domain) name used to connect to your private service in your VPC.
    --vpce-configuration-description=: An optional description that provides details about your VPC endpoint configuration.
    --vpce-configuration-name=: The friendly name you give to your VPC endpoint configuration to manage your configurations more easily.
    --vpce-service-name=: The name of the VPC endpoint service running in your AWS account that you want Device Farm to test.
documentation:
    command: Updates information about an Amazon Virtual Private Cloud (VPC) endpoint configuration.
    flag:
        arn: The Amazon Resource Name (ARN) of the VPC endpoint configuration you want to update.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        service-dns-name: The DNS (domain) name used to connect to your private service in your VPC. The DNS name must not already be in use on the internet.
        vpce-configuration-description: An optional description that provides details about your VPC endpoint configuration.
        vpce-configuration-name: The friendly name you give to your VPC endpoint configuration to manage your configurations more easily.
        vpce-service-name: The name of the VPC endpoint service running in your AWS account that you want Device Farm to test.
