name: create-voice-profile-domain
description: Creates a voice profile domain, a collection of voice profiles, their voice prints, and encrypted enrollment audio.
flags:
    --client-request-token=: The unique identifier for the client request.
    --description=: A description of the voice profile domain.
    --name=!: The name of the voice profile domain.
    --server-side-encryption-configuration=!: The server-side encryption configuration for the request.
    --tags=: The tags assigned to the domain.
documentation:
    command: |-
        Creates a voice profile domain, a collection of voice profiles, their voice prints, and encrypted enrollment audio.

        Before creating any voice profiles, you must provide all notices and obtain all consents from the speaker as required under applicable privacy and biometrics laws, and as required under the [AWS service terms](https://aws.amazon.com/service-terms/) for the Amazon Chime SDK.

        For more information about voice profile domains, see [Using Amazon Chime SDK Voice Analytics](https://docs.aws.amazon.com/chime-sdk/latest/dg/pstn-voice-analytics.html) in the *Amazon Chime SDK Developer Guide*.
    flag:
        client-request-token: The unique identifier for the client request. Use a different token for different domain creation requests.
        description: A description of the voice profile domain.
        name: The name of the voice profile domain.
        server-side-encryption-configuration: The server-side encryption configuration for the request.
        tags: The tags assigned to the domain.
