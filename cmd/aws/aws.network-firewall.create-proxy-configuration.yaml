name: create-proxy-configuration
description: Creates an Network Firewall [ProxyConfiguration]()
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --default-rule-phase-actions=!: Evaluation points in the traffic flow where rules are applied.
    --description=: A description of the proxy configuration.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --proxy-configuration-name=!: The descriptive name of the proxy configuration.
    --rule-group-arns=: The proxy rule group arn(s) to attach to the proxy configuration.
    --rule-group-names=: The proxy rule group name(s) to attach to the proxy configuration.
    --tags=: The key:value pairs to associate with the resource.
documentation:
    command: |-
        Creates an Network Firewall [ProxyConfiguration]()

        A Proxy Configuration defines the monitoring and protection behavior for a Proxy. The details of the behavior are defined in the rule groups that you add to your configuration.

        To manage a proxy configuration's tags, use the standard Amazon Web Services resource tagging operations, [ListTagsForResource](), [TagResource](), and [UntagResource]().

        To retrieve information about proxies, use [ListProxyConfigurations]() and [DescribeProxyConfiguration]().
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        default-rule-phase-actions: Evaluation points in the traffic flow where rules are applied. There are three phases in a traffic where the rule match is applied.
        description: A description of the proxy configuration.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        proxy-configuration-name: The descriptive name of the proxy configuration. You can't change the name of a proxy configuration after you create it.
        rule-group-arns: |-
            The proxy rule group arn(s) to attach to the proxy configuration.

            You must specify the ARNs or the names, and you can specify both.
        rule-group-names: |-
            The proxy rule group name(s) to attach to the proxy configuration.

            You must specify the ARNs or the names, and you can specify both.
        tags: The key:value pairs to associate with the resource.
