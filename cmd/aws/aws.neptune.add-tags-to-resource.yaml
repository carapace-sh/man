name: add-tags-to-resource
description: Adds metadata tags to an Amazon Neptune resource.
flags:
    --resource-name=!: The Amazon Neptune resource that the tags are added to.
    --tags=!: The tags to be assigned to the Amazon Neptune resource.
documentation:
    command: Adds metadata tags to an Amazon Neptune resource. These tags can also be used with cost allocation reporting to track cost associated with Amazon Neptune resources, or used in a Condition statement in an IAM policy for Amazon Neptune.
    flag:
        resource-name: The Amazon Neptune resource that the tags are added to. This value is an Amazon Resource Name (ARN). For information about creating an ARN, see [Constructing an Amazon Resource Name (ARN)](https://docs.aws.amazon.com/neptune/latest/UserGuide/tagging.ARN.html#tagging.ARN.Constructing).
        tags: The tags to be assigned to the Amazon Neptune resource.
