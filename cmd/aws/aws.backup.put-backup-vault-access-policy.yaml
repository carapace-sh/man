name: put-backup-vault-access-policy
description: Sets a resource-based policy that is used to manage access permissions on the target backup vault.
flags:
    --backup-vault-name=!: The name of a logical container where backups are stored.
    --policy=: The backup vault access policy document in JSON format.
documentation:
    command: Sets a resource-based policy that is used to manage access permissions on the target backup vault. Requires a backup vault name and an access policy document in JSON format.
    flag:
        backup-vault-name: The name of a logical container where backups are stored. Backup vaults are identified by names that are unique to the account used to create them and the Amazon Web Services Region where they are created.
        policy: The backup vault access policy document in JSON format.
