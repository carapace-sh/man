name: node-pools
description: '*(ALPHA)*  Create and delete operations for Google Kubernetes Engine node pools.'
flags:
    --location=: Compute zone or region (e.g. us-central1-a or us-central1) for the cluster.
    --region=: Compute region (e.g. us-central1) for a regional cluster.
    --zone=: Compute zone (e.g. us-central1-a) for a zonal cluster.
documentation:
    command: '*(ALPHA)*  Create and delete operations for Google Kubernetes Engine node pools.'
    flag:
        location: Compute zone or region (e.g. us-central1-a or us-central1) for the cluster. Overrides the default compute/region or compute/zone value for this command invocation. Prefer using this flag over the --region or --zone flags.
        region: Compute region (e.g. us-central1) for a regional cluster. Overrides the default compute/region property value for this command invocation.
        zone: Compute zone (e.g. us-central1-a) for a zonal cluster. Overrides the default compute/zone property value for this command invocation.
