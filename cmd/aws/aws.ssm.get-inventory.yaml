name: get-inventory
description: Query inventory information.
flags:
    --aggregators=: Returns counts of inventory types based on one or more expressions.
    --filters=: One or more filters.
    --max-results=: The maximum number of items to return for this call.
    --next-token=: The token for the next set of items to return.
    --result-attributes=: The list of inventory item types to return.
documentation:
    command: Query inventory information. This includes managed node status, such as `Stopped` or `Terminated`.
    flag:
        aggregators: Returns counts of inventory types based on one or more expressions. For example, if you aggregate by using an expression that uses the `AWS:InstanceInformation.PlatformType` type, you can see a count of how many Windows and Linux managed nodes exist in your inventoried fleet.
        filters: One or more filters. Use a filter to return a more specific list of results.
        max-results: The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
        result-attributes: The list of inventory item types to return.
