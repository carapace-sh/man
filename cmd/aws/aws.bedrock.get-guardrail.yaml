name: get-guardrail
description: Gets details about a guardrail.
flags:
    --guardrail-identifier=!: The unique identifier of the guardrail for which to get details.
    --guardrail-version=: The version of the guardrail for which to get details.
documentation:
    command: Gets details about a guardrail. If you don't specify a version, the response returns details for the `DRAFT` version.
    flag:
        guardrail-identifier: The unique identifier of the guardrail for which to get details. This can be an ID or the ARN.
        guardrail-version: The version of the guardrail for which to get details. If you don't specify a version, the response returns details for the `DRAFT` version.
