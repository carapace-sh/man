name: describe
description: Describes a Cloud Firestore user creds.
flags:
    --database=!: The database to operate on.
documentation:
    command: |-
        ## EXAMPLES

        To describe user creds 'test-user-creds-id' under
        database testdb.

            $ gcloud firestore user-creds describe test-user-creds-id --database='testdb'
    flag:
        database: |-
            The database to operate on.
            +
            For example, to operate on database `foo`:
            +
              $ {command} --database='foo'
