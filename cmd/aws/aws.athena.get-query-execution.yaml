name: get-query-execution
description: Returns information about a single execution of a query if you have access to the workgroup in which the query ran.
flags:
    --query-execution-id=!: The unique ID of the query execution.
documentation:
    command: Returns information about a single execution of a query if you have access to the workgroup in which the query ran. Each time a query executes, information about the query execution is saved with a unique ID.
    flag:
        query-execution-id: The unique ID of the query execution.
