documentation:
    command: |
        *(ALPHA)*  List Apigee API proxy deployments.

        `gcloud alpha apigee deployments list` lists deployments of API proxies, optionally filtered by
        environment, proxy name, proxy revision, or a combination of these.
    flag:
        api: |-
            The API proxy whose deployments should be listed. If not provided, all proxies will be listed. To get a list of existing API proxies, run `{grandparent_command} apis list`.
            +
            To set the `api` attribute:
            * provide the argument `--revision` on the command line with a fully specified name;
            * leave the argument unspecified for it to be chosen automatically with a fully specified name;
            * provide the argument `--api` on the command line;
            * leave the argument unspecified for it to be chosen automatically.
        environment: |-
            The environment whose deployments should be listed. If not provided, all environments will be listed. To get a list of available environments, run `{grandparent_command} environments list`.
            +
            To set the `environment` attribute:
            * provide the argument `--revision` on the command line with a fully specified name;
            * leave the argument unspecified for it to be chosen automatically with a fully specified name;
            * provide the argument `--environment` on the command line;
            * leave the argument unspecified for it to be chosen automatically.
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        no-uri: |
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
        organization: |-
            The organization whose deployments should be listed.If unspecified, the Cloud Platform project's associated organization will be used.
            +
            To set the `organization` attribute:
            * provide the argument `--revision` on the command line with a fully specified name;
            * leave the argument unspecified for it to be chosen automatically with a fully specified name;
            * provide the argument `--organization` on the command line;
            * set the property [project] or provide the argument [--project] on the command line, using a Cloud Platform project with an associated Apigee organization.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is determined by the
            service if it supports paging, otherwise it is *unlimited* (no paging).
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        revision: |-
            ID of the revision or fully qualified identifier for the revision.
            +
            To set the `revision` attribute:
            * provide the argument `--revision` on the command line;
            * leave the argument unspecified for it to be chosen automatically.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
        uri: |-
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
