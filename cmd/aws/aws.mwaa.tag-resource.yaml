name: tag-resource
description: Associates key-value tag pairs to your Amazon Managed Workflows for Apache Airflow (MWAA) environment.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the Amazon MWAA environment.
    --tags=!: The key-value tag pairs you want to associate to your environment.
documentation:
    command: Associates key-value tag pairs to your Amazon Managed Workflows for Apache Airflow (MWAA) environment.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the Amazon MWAA environment. For example, `arn:aws:airflow:us-east-1:123456789012:environment/MyMWAAEnvironment`.
        tags: 'The key-value tag pairs you want to associate to your environment. For example, `"Environment": "Staging"`. For more information, see [Tagging Amazon Web Services resources](https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html).'
