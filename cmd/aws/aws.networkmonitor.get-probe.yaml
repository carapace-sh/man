name: get-probe
description: Returns the details about a probe.
flags:
    --monitor-name=!: The name of the monitor associated with the probe.
    --probe-id=!: The ID of the probe to get information about.
documentation:
    command: Returns the details about a probe. This action requires both the `monitorName` and `probeId` parameters. Run `ListMonitors` to get a list of monitor names. Run `GetMonitor` to get a list of probes and probe IDs.
    flag:
        monitor-name: The name of the monitor associated with the probe. Run `ListMonitors` to get a list of monitor names.
        probe-id: The ID of the probe to get information about. Run `GetMonitor` action to get a list of probes and probe IDs for the monitor.
