name: set-iam-policy
description: '*(ALPHA)*  Set the IAM policy for a Cloud Healthcare API dataset.'
flags:
    --location=: Google Cloud location.
documentation:
    command: '*(ALPHA)*  Set the IAM policy for a Cloud Healthcare API dataset.'
    flag:
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `dataset` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `healthcare/location`.
