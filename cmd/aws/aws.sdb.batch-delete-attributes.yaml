name: batch-delete-attributes
description: Performs multiple DeleteAttributes operations in a single call, which reduces round trips and latencies.
flags:
    --domain-name=!: The name of the domain in which the attributes are being deleted.
    --items=!: A list of items on which to perform the operation.
documentation:
    command: |-
        Performs multiple DeleteAttributes operations in a single call, which reduces round trips and latencies. This enables Amazon SimpleDB to optimize requests, which generally yields better throughput.

        The following limitations are enforced for this operation:

        - 1 MB request size
        - 25 item limit per BatchDeleteAttributes operation
    flag:
        domain-name: The name of the domain in which the attributes are being deleted.
        items: A list of items on which to perform the operation.
