name: describe-scheduled-audit
description: Gets information about a scheduled audit.
flags:
    --scheduled-audit-name=!: The name of the scheduled audit whose information you want to get.
documentation:
    command: |-
        Gets information about a scheduled audit.

        Requires permission to access the [DescribeScheduledAudit](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        scheduled-audit-name: The name of the scheduled audit whose information you want to get.
