name: get
description: Get log file paths
flags:
    --branch=: Target branch (defaults to current)
    --hook=: Get path for a specific log file
    -h, --help: Print help (see more with '--help')
completion:
    flag:
        C:
            - $files
        config:
            - $files
documentation:
    flag:
        help: Print help (see a summary with '-h')
        hook: |-
            Get path for a specific log file

            Format: source:hook-type:name (e.g., user:post-start:server) for hook commands, or internal:op (e.g., internal:remove) for internal operations.
