name: init-provider
description: '*(ALPHA)*  Generate main.tf file to configure Google Cloud Terraform Provider.'
flags:
    --no-tf-user-project-override!&: If specified, sets the `user_project_override` value in the Terraform provider config to `true`.
    --no-use-gcloud-billing-project&: If specified, will set `user_project_override` value in the Terrafom provider config to `true` and
    --region=: Default Google Cloud Region for Regional Resources.
    --tf-billing-project=: If specified, sets the `billing_project` value in the Terraform provider config.
    --tf-user-project-override!: If specified, sets the `user_project_override` value in the Terraform provider config to `true`.
    --use-gcloud-billing-project: If specified, will set `user_project_override` value in the Terrafom provider config to `true` and
    --zone=: Default Google Cloud Zone for Zonal Resources.
documentation:
    command: |-
        *(ALPHA)*  Generate main.tf file to configure Google Cloud Terraform Provider.

                This command supports Google Terraform Provider version v3.90.0+ and Terraform Provider Schema 0.2
    flag:
        no-tf-user-project-override: If specified, sets the `user_project_override` value in the Terraform provider config to `true`.
        no-use-gcloud-billing-project: |-
            If specified, will set `user_project_override` value in the Terrafom provider config to `true` and
                  set `billing_project` to the current gcloud `billing/quota_project` property.
        region: |-
            Default Google Cloud Region for Regional Resources.
                  If not specified the current `compute/region` property will be used.
        tf-billing-project: If specified, sets the `billing_project` value in the Terraform provider config.
        tf-user-project-override: If specified, sets the `user_project_override` value in the Terraform provider config to `true`.
        use-gcloud-billing-project: |-
            If specified, will set `user_project_override` value in the Terrafom provider config to `true` and
                  set `billing_project` to the current gcloud `billing/quota_project` property.
        zone: |-
            Default Google Cloud Zone for Zonal Resources.
                    If not specified the current `compute/zone` property will be used.
