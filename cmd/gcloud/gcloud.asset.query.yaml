name: query
description: Query the Cloud assets.
flags:
    --bigquery-dataset=: The id of the BigQuery dataset.
    --bigquery-table=!: ID of the table or fully qualified identifier for the table.
    --end-time=: End time of the time window (exclusive) for the asset history.
    --folder=: The ID of the folder which is the root asset.
    --job-reference=: Reference to the query job, which is from the previous call.
    --organization=: The ID of the organization which is the root asset.
    --page-size=: The maximum number of rows to return in the results.
    --page-token=: A page token received from previous call.
    --snapshot-time=: Timestamp to take a snapshot on assets.
    --start-time=!: Start time of the time window (inclusive) for the asset history.
    --statement=: A BigQuery Standard SQL compatible statement.
    --timeout=: Maximum amount of time that the client will wait for the query to complete.
    --write-disposition=: Specifies the action that occurs if the destination table or partition already exists.
completion:
    flag:
        write-disposition:
            - write-append
            - write-empty
            - write-truncate
documentation:
    command: |
        Issue an analytical query on Cloud assets using a BigQuery Standard SQL
        compatible statement.
    flag:
        bigquery-dataset: |-
            The id of the BigQuery dataset.
            +
            To set the `bigquery-dataset` attribute:
            * provide the argument `--bigquery-table` on the command line with a fully specified name;
            * provide the argument `--bigquery-dataset` on the command line.
        bigquery-table: |-
            ID of the table or fully qualified identifier for the table.
            +
            To set the `table` attribute:
            * provide the argument `--bigquery-table` on the command line.
        end-time: End time of the time window (exclusive) for the asset history. Defaults to current time if not specified. See $ gcloud topic datetimes for information on time formats.
        folder: The ID of the folder which is the root asset.
        job-reference: Reference to the query job, which is from the previous call.
        organization: The ID of the organization which is the root asset.
        page-size: The maximum number of rows to return in the results. One page is also limited to 10 MB.
        page-token: A page token received from previous call.
        snapshot-time: Timestamp to take a snapshot on assets. This can only be a current or past time. If not specified, the current time will be used. Due to delays in resource data collection and indexing, there is a volatile window during which running the same query at different times may return different results. See $ gcloud topic datetimes for information on time formats.
        start-time: Start time of the time window (inclusive) for the asset history. Must be after the current time minus 35 days. See $ gcloud topic datetimes for information on time formats.
        statement: A BigQuery Standard SQL compatible statement. If the query execution finishes within timeout and there is no pagination, the full query results will be returned. Otherwise, pass job_reference from previous call as `--job-reference` to obtain the full results.
        timeout: Maximum amount of time that the client will wait for the query to complete.
        write-disposition: |-
            Specifies the action that occurs if the destination table or partition already exists. _WRITE_DISPOSITION_ must be one of:
            +
            *write-append*::: If the table or partition already exists, BigQuery appends the
                          data to the table or the latest partition.
            *write-empty*::: If the table already exists and contains data, an error is
                          returned.
            *write-truncate*::: If the table or partition already exists, BigQuery overwrites
                          the entire table or all the partition's data.
            :::
            +
