name: describe-file-system-associations
description: Gets the file system association information.
flags:
    --file-system-association-arnlist=!: An array containing the Amazon Resource Name (ARN) of each file system association to be described.
documentation:
    command: Gets the file system association information. This operation is only supported for FSx File Gateways.
    flag:
        file-system-association-arnlist: An array containing the Amazon Resource Name (ARN) of each file system association to be described.
