name: delete-automatic-tape-creation-policy
description: Deletes the automatic tape creation policy of a gateway.
flags:
    --gateway-arn=!: ""
documentation:
    command: Deletes the automatic tape creation policy of a gateway. If you delete this policy, new virtual tapes must be created manually. Use the Amazon Resource Name (ARN) of the gateway in your request to remove the policy.
    flag:
        gateway-arn: ""
