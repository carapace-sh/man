name: update-branch
description: Updates a branch for an Amplify app.
flags:
    --app-id=!: The unique ID for an Amplify app.
    --backend-environment-arn=: The Amazon Resource Name (ARN) for a backend environment that is part of a Gen 1 Amplify app.
    --backend=: The backend for a `Branch` of an Amplify app.
    --basic-auth-credentials=: The basic authorization credentials for the branch.
    --branch-name=!: The name of the branch.
    --build-spec=: The build specification (build spec) for the branch.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --compute-role-arn=: The Amazon Resource Name (ARN) of the IAM role to assign to a branch of an SSR app.
    --description=: The description for the branch.
    --display-name=: The display name for a branch.
    --enable-auto-build: Enables auto building for the branch.
    --enable-basic-auth: Enables basic authorization for the branch.
    --enable-notification: Enables notifications for the branch.
    --enable-performance-mode: Enables performance mode for the branch.
    --enable-pull-request-preview: Enables pull request previews for this branch.
    --enable-skew-protection: Specifies whether the skew protection feature is enabled for the branch.
    --environment-variables=: The environment variables for the branch.
    --framework=: The framework for the branch.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-enable-auto-build: Enables auto building for the branch.
    --no-enable-basic-auth: Enables basic authorization for the branch.
    --no-enable-notification: Enables notifications for the branch.
    --no-enable-performance-mode: Enables performance mode for the branch.
    --no-enable-pull-request-preview: Enables pull request previews for this branch.
    --no-enable-skew-protection: Specifies whether the skew protection feature is enabled for the branch.
    --pull-request-environment-name=: The Amplify environment name for the pull request.
    --stage=: Describes the current stage for the branch.
    --ttl=: The content Time to Live (TTL) for the website in seconds.
completion:
    flag:
        stage:
            - PRODUCTION
            - BETA
            - DEVELOPMENT
            - EXPERIMENTAL
            - PULL_REQUEST
documentation:
    command: Updates a branch for an Amplify app.
    flag:
        app-id: The unique ID for an Amplify app.
        backend: |-
            The backend for a `Branch` of an Amplify app. Use for a backend created from an CloudFormation stack.

            This field is available to Amplify Gen 2 apps only. When you deploy an application with Amplify Gen 2, you provision the app's backend infrastructure using Typescript code.
        backend-environment-arn: |-
            The Amazon Resource Name (ARN) for a backend environment that is part of a Gen 1 Amplify app.

            This field is available to Amplify Gen 1 apps only where the backend is created using Amplify Studio or the Amplify command line interface (CLI).
        basic-auth-credentials: The basic authorization credentials for the branch. You must base64-encode the authorization credentials and provide them in the format `user:password`.
        branch-name: The name of the branch.
        build-spec: The build specification (build spec) for the branch.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        compute-role-arn: The Amazon Resource Name (ARN) of the IAM role to assign to a branch of an SSR app. The SSR Compute role allows the Amplify Hosting compute service to securely access specific Amazon Web Services resources based on the role's permissions. For more information about the SSR Compute role, see [Adding an SSR Compute role](https://docs.aws.amazon.com/amplify/latest/userguide/amplify-SSR-compute-role.html) in the *Amplify User Guide*.
        description: The description for the branch.
        display-name: The display name for a branch. This is used as the default domain prefix.
        enable-auto-build: Enables auto building for the branch.
        enable-basic-auth: Enables basic authorization for the branch.
        enable-notification: Enables notifications for the branch.
        enable-performance-mode: |-
            Enables performance mode for the branch.

            Performance mode optimizes for faster hosting performance by keeping content cached at the edge for a longer interval. When performance mode is enabled, hosting configuration or code changes can take up to 10 minutes to roll out.
        enable-pull-request-preview: Enables pull request previews for this branch.
        enable-skew-protection: |-
            Specifies whether the skew protection feature is enabled for the branch.

            Deployment skew protection is available to Amplify applications to eliminate version skew issues between client and servers in web applications. When you apply skew protection to a branch, you can ensure that your clients always interact with the correct version of server-side assets, regardless of when a deployment occurs. For more information about skew protection, see [Skew protection for Amplify deployments](https://docs.aws.amazon.com/amplify/latest/userguide/skew-protection.html) in the *Amplify User Guide*.
        environment-variables: The environment variables for the branch.
        framework: The framework for the branch.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        pull-request-environment-name: The Amplify environment name for the pull request.
        stage: Describes the current stage for the branch.
        ttl: The content Time to Live (TTL) for the website in seconds.
