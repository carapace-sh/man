name: create
description: Create a Google Cloud Observability agents policy for the Ops Agent.
flags:
    --debug-dry-run&: If provided, the resulting OSPolicyAssignment will be printed to standard output and no actual changes are made.
    --file=!: YAML file with agents policy to create.
    --no-debug-dry-run&: If provided, the resulting OSPolicyAssignment will be printed to standard output and no actual changes are made.
    --zone=!: Zone in which to create the agents policy.
documentation:
    command: |-
        *gcloud compute instances ops-agents policies create* creates a policy that facilitates agent management across
        Compute Engine instances based on user specified instance filters. This policy
        installs, specifies versioning, and removes Ops Agents.

        The command returns the content of the created policy or an error indicating
        why the creation fails. The created policy takes effect asynchronously. It
        can take 10-15 minutes for the VMs to enforce the newly created policy.
    flag:
        debug-dry-run: If provided, the resulting OSPolicyAssignment will be printed to standard output and no actual changes are made.
        file: |-
            YAML file with agents policy to create. For
            information about the agents policy format, see https://cloud.google.com/stackdriver/docs/solutions/agents/ops-agent/agent-policies#config-files.
        no-debug-dry-run: If provided, the resulting OSPolicyAssignment will be printed to standard output and no actual changes are made.
        zone: Zone in which to create the agents policy.
