name: delete-backup
description: Deletes an existing backup of a table.
flags:
    --backup-arn=!: The ARN associated with the backup.
documentation:
    command: |-
        Deletes an existing backup of a table.

        You can call `DeleteBackup` at a maximum rate of 10 times per second.
    flag:
        backup-arn: The ARN associated with the backup.
