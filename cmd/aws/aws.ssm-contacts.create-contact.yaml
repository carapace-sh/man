name: create-contact
description: Contacts are either the contacts that Incident Manager engages during an incident or the escalation plans that Incident Manager uses to engage contacts in phases during an incident.
flags:
    --alias=!: The short name to quickly identify a contact or escalation plan.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --display-name=: The full name of the contact or escalation plan.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --idempotency-token=: A token ensuring that the operation is called only once with the specified details.
    --plan=!: A list of stages.
    --tags=:
        description: Adds a tag to the target.
        nargs: -1
    --type=!: The type of contact to create.
completion:
    flag:
        type:
            - PERSONAL
            - ESCALATION
            - ONCALL_SCHEDULE
documentation:
    command: Contacts are either the contacts that Incident Manager engages during an incident or the escalation plans that Incident Manager uses to engage contacts in phases during an incident.
    flag:
        alias: The short name to quickly identify a contact or escalation plan. The contact alias must be unique and identifiable.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        display-name: The full name of the contact or escalation plan.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        idempotency-token: A token ensuring that the operation is called only once with the specified details.
        plan: A list of stages. A contact has an engagement plan with stages that contact specified contact channels. An escalation plan uses stages that contact specified contacts.
        tags: Adds a tag to the target. You can only tag resources created in the first Region of your replication set.
        type: |-
            The type of contact to create.

            - `PERSONAL`: A single, individual contact.
            - `ESCALATION`: An escalation plan.
            - `ONCALL_SCHEDULE`: An on-call schedule.
