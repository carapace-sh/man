name: delete-resource-policy-statement
description: Deletes a policy statement from a resource policy.
flags:
    --expected-revision-id=: The identifier of the revision of the policy to delete the statement from.
    --resource-arn=!: The Amazon Resource Name (ARN) of the bot or bot alias that the resource policy is attached to.
    --statement-id=!: The name of the statement (SID) to delete from the policy.
documentation:
    command: |-
        Deletes a policy statement from a resource policy. If you delete the last statement from a policy, the policy is deleted. If you specify a statement ID that doesn't exist in the policy, or if the bot or bot alias doesn't have a policy attached, Amazon Lex returns an exception.

        You need to add the `DeleteResourcePolicy` or `UpdateResourcePolicy` action to the bot role in order to call the API.
    flag:
        expected-revision-id: |-
            The identifier of the revision of the policy to delete the statement from. If this revision ID doesn't match the current revision ID, Amazon Lex throws an exception.

            If you don't specify a revision, Amazon Lex removes the current contents of the statement.
        resource-arn: The Amazon Resource Name (ARN) of the bot or bot alias that the resource policy is attached to.
        statement-id: The name of the statement (SID) to delete from the policy.
