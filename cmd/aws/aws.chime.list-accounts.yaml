name: list-accounts
description: Lists the Amazon Chime accounts under the administrator's AWS account.
flags:
    --max-results=: The maximum number of results to return in a single call.
    --name=: Amazon Chime account name prefix with which to filter results.
    --next-token=: The token to use to retrieve the next page of results.
    --user-email=: User email address with which to filter results.
documentation:
    command: Lists the Amazon Chime accounts under the administrator's AWS account. You can filter accounts by account name prefix. To find out which Amazon Chime account a user belongs to, you can filter by the user's email address, which returns one account result.
    flag:
        max-results: The maximum number of results to return in a single call. Defaults to 100.
        name: Amazon Chime account name prefix with which to filter results.
        next-token: The token to use to retrieve the next page of results.
        user-email: User email address with which to filter results.
