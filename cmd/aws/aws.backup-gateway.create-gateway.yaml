name: create-gateway
description: Creates a backup gateway.
flags:
    --activation-key=!: The activation key of the created gateway.
    --gateway-display-name=!: The display name of the created gateway.
    --gateway-type=!: The type of created gateway.
    --tags=: A list of up to 50 tags to assign to the gateway.
completion:
    flag:
        gateway-type:
            - BACKUP_VM
documentation:
    command: Creates a backup gateway. After you create a gateway, you can associate it with a server using the `AssociateGatewayToServer` operation.
    flag:
        activation-key: The activation key of the created gateway.
        gateway-display-name: The display name of the created gateway.
        gateway-type: The type of created gateway.
        tags: A list of up to 50 tags to assign to the gateway. Each tag is a key-value pair.
