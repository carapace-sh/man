name: list-queues
description: Provides information about the queues for the specified Amazon Connect instance.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
    --queue-types=: The type of queue.
documentation:
    command: |-
        Provides information about the queues for the specified Amazon Connect instance.

        If you do not specify a `QueueTypes` parameter, both standard and agent queues are returned. This might cause an unexpected truncation of results if you have more than 1000 agents and you limit the number of results of the API call in code.

        For more information about queues, see [Queues: Standard and Agent](https://docs.aws.amazon.com/connect/latest/adminguide/concepts-queues-standard-and-agent.html) in the *Amazon Connect Administrator Guide*.
    flag:
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        max-results: The maximum number of results to return per page. The default MaxResult size is 100.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        queue-types: The type of queue.
