name: put-access-control-rule
description: Adds a new access control rule for the specified organization.
flags:
    --actions=:
        description: Access protocol actions to include in the rule.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=!: The rule description.
    --effect=!: The rule effect.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --impersonation-role-ids=:
        description: Impersonation role IDs to include in the rule.
        nargs: -1
    --ip-ranges=:
        description: IPv4 CIDR ranges to include in the rule.
        nargs: -1
    --name=!: The rule name.
    --not-actions=:
        description: Access protocol actions to exclude from the rule.
        nargs: -1
    --not-impersonation-role-ids=:
        description: Impersonation role IDs to exclude from the rule.
        nargs: -1
    --not-ip-ranges=:
        description: IPv4 CIDR ranges to exclude from the rule.
        nargs: -1
    --not-user-ids=:
        description: User IDs to exclude from the rule.
        nargs: -1
    --organization-id=!: The identifier of the organization.
    --user-ids=:
        description: User IDs to include in the rule.
        nargs: -1
completion:
    flag:
        effect:
            - ALLOW
            - DENY
documentation:
    command: Adds a new access control rule for the specified organization. The rule allows or denies access to the organization for the specified IPv4 addresses, access protocol actions, user IDs and impersonation IDs. Adding a new rule with the same name as an existing rule replaces the older rule.
    flag:
        actions: Access protocol actions to include in the rule. Valid values include `ActiveSync`, `AutoDiscover`, `EWS`, `IMAP`, `SMTP`, `WindowsOutlook`, and `WebMail`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The rule description.
        effect: The rule effect.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        impersonation-role-ids: Impersonation role IDs to include in the rule.
        ip-ranges: IPv4 CIDR ranges to include in the rule.
        name: The rule name.
        not-actions: Access protocol actions to exclude from the rule. Valid values include `ActiveSync`, `AutoDiscover`, `EWS`, `IMAP`, `SMTP`, `WindowsOutlook`, and `WebMail`.
        not-impersonation-role-ids: Impersonation role IDs to exclude from the rule.
        not-ip-ranges: IPv4 CIDR ranges to exclude from the rule.
        not-user-ids: User IDs to exclude from the rule.
        organization-id: The identifier of the organization.
        user-ids: User IDs to include in the rule.
