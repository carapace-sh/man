name: create-index
description: Creates an Amazon Q Business index.
flags:
    --application-id=!: The identifier of the Amazon Q Business application using the index.
    --capacity-configuration=: The capacity units you want to provision for your index.
    --client-token=: A token that you provide to identify the request to create an index.
    --description=: A description for the Amazon Q Business index.
    --display-name=!: A name for the Amazon Q Business index.
    --tags=: A list of key-value pairs that identify or categorize the index.
    --type=: The index type that's suitable for your needs.
completion:
    flag:
        type:
            - ENTERPRISE
            - STARTER
documentation:
    command: |-
        Creates an Amazon Q Business index.

        To determine if index creation has completed, check the `Status` field returned from a call to `DescribeIndex`. The `Status` field is set to `ACTIVE` when the index is ready to use.

        Once the index is active, you can index your documents using the [`BatchPutDocument`](https://docs.aws.amazon.com/amazonq/latest/api-reference/API_BatchPutDocument.html) API or the [`CreateDataSource`](https://docs.aws.amazon.com/amazonq/latest/api-reference/API_CreateDataSource.html) API.
    flag:
        application-id: The identifier of the Amazon Q Business application using the index.
        capacity-configuration: The capacity units you want to provision for your index. You can add and remove capacity to fit your usage needs.
        client-token: A token that you provide to identify the request to create an index. Multiple calls to the `CreateIndex` API with the same client token will create only one index.
        description: A description for the Amazon Q Business index.
        display-name: A name for the Amazon Q Business index.
        tags: 'A list of key-value pairs that identify or categorize the index. You can also use tags to help control access to the index. Tag keys and values can consist of Unicode letters, digits, white space, and any of the following symbols: _ . : / = + - @.'
        type: The index type that's suitable for your needs. For more information on what's included in each type of index, see [Amazon Q Business tiers](https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/tiers.html#index-tiers).
