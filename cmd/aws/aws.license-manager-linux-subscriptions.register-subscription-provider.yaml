name: register-subscription-provider
description: Register the supported third-party subscription provider for your Bring Your Own License (BYOL) subscription.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --secret-arn=!: The Amazon Resource Name (ARN) of the secret where you've stored your subscription provider's access token.
    --subscription-provider-source=!: The supported Linux subscription provider to register.
    --tags=: The metadata tags to assign to your registered Linux subscription provider resource.
completion:
    flag:
        subscription-provider-source:
            - RedHat
documentation:
    command: Register the supported third-party subscription provider for your Bring Your Own License (BYOL) subscription.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        secret-arn: The Amazon Resource Name (ARN) of the secret where you've stored your subscription provider's access token. For RHEL subscriptions managed through the Red Hat Subscription Manager (RHSM), the secret contains your Red Hat Offline token.
        subscription-provider-source: The supported Linux subscription provider to register.
        tags: The metadata tags to assign to your registered Linux subscription provider resource.
