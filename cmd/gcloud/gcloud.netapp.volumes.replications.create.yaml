name: create
description: Create a Cloud NetApp Volume Replication.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --cluster-location=: Location of the user cluster.
    --description=: A description of the Cloud NetApp Replication
    --destination-volume-parameters=!: Required, sets `destination_volume_parameters` value.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location of the replication.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --replication-schedule=!: The schedule for the Replication.
    --volume=: ID of the volume or fully qualified identifier for the volume.
documentation:
    command: |
        Create a Cloud NetApp Volume Replication.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        cluster-location: Location of the user cluster.
        description: A description of the Cloud NetApp Replication
        destination-volume-parameters: |-
            Required, sets `destination_volume_parameters` value.
            +
            *description*:::
            Sets `description` value.
            +
            *share_name*:::
            Sets `share_name` value.
            +
            *storage_pool*:::
            Required, sets `storage_pool` value.
            +
            *tiering_policy*:::
            Sets `tiering_policy` value.
            +
            *cooling-threshold-days*::::
            Sets `cooling-threshold-days` value.
            +
            *tier-action*::::
            Sets `tier-action` value.
            +
            *volume_id*:::
            Sets `volume_id` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --destination-volume-parameters='description=string,share_name=string,storage_pool=string,tiering_policy={"cooling-threshold-days": int, "tier-action": "string"},volume_id=string'
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --destination-volume-parameters='{"description": "string", "share_name": "string", "storage_pool": "string", "tiering_policy": {"cooling-threshold-days": int, "tier-action": "string"}, "volume_id": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --destination-volume-parameters=path_to_file.(yaml|json)
            +
            ```
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location of the replication.
            +
            To set the `location` attribute:
            * provide the argument `replication` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        replication-schedule: The schedule for the Replication.
        volume: |-
            ID of the volume or fully qualified identifier for the volume.
            +
            To set the `volume` attribute:
            * provide the argument `--volume` on the command line.
