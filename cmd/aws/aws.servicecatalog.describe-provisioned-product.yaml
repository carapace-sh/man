name: describe-provisioned-product
description: Gets information about the specified provisioned product.
flags:
    --accept-language=: The language code.
    --id=: The provisioned product identifier.
    --name=: The name of the provisioned product.
documentation:
    command: Gets information about the specified provisioned product.
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        id: |-
            The provisioned product identifier. You must provide the name or ID, but not both.

            If you do not provide a name or ID, or you provide both name and ID, an `InvalidParametersException` will occur.
        name: |-
            The name of the provisioned product. You must provide the name or ID, but not both.

            If you do not provide a name or ID, or you provide both name and ID, an `InvalidParametersException` will occur.
