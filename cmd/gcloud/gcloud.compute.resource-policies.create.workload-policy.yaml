name: workload-policy
description: Create a Compute Engine workload resource policy.
flags:
    --accelerator-topology=: Specifies the topology of placement and interconnection performance required to create a slice of VMs with interconnected accelerators.
    --description=: An optional, textual description for the backend.
    --max-topology-distance=: Specifies the topology of placement and interconnection network performance of the group of VMs (MIG / Multi-MIGs).
    --region=: Region of the resource policy to operate on.
    --type=!: Type of the workload policy defining the high-level intent of the cluster.
completion:
    flag:
        max-topology-distance:
            - BLOCK
            - CLUSTER
            - SUBBLOCK
        type:
            - HIGH_AVAILABILITY
            - HIGH_THROUGHPUT
documentation:
    command: Create a Compute Engine workload resource policy.
    flag:
        accelerator-topology: Specifies the topology of placement and interconnection performance required to create a slice of VMs with interconnected accelerators.
        description: An optional, textual description for the backend.
        max-topology-distance: |-
            Specifies the topology of placement and interconnection network performance of the group of VMs (MIG / Multi-MIGs). _MAX_TOPOLOGY_DISTANCE_ must be one of:
            +
            *BLOCK*::: VMs are placed within the same block of capacity with improved latency compared to Cluster.
            *CLUSTER*::: VMs are placed within the same cluster of capacity with improved latency between them.
            *SUBBLOCK*::: Tightest collocation of VMs that provides minimized network latency. VMs are placed within the same rack of capacity with improved latency compared to Block.
            :::
            +
        region: |-
            Region of the resource policy to operate on. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        type: |-
            Type of the workload policy defining the high-level intent of the cluster. _TYPE_ must be one of:
            +
            *HIGH_AVAILABILITY*::: For workloads that aim to be highly available. Common examples are web / ML serving, or distributed database clusters. Compute Engine spreads VMs at best-effort to improve reliability of the distributed infrastructure.
            *HIGH_THROUGHPUT*::: For high throughput distributed workloads eg. HPC or ML training. Compute Engine collocates VMs at best-effort to reduce network latency between VMs.
            :::
            +
