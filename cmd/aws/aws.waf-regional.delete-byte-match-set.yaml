name: delete-byte-match-set
description: This is **AWS WAF Classic** documentation.
flags:
    --byte-match-set-id=!: The `ByteMatchSetId` of the [ByteMatchSet]() that you want to delete.
    --change-token=!: The value returned by the most recent call to [GetChangeToken]().
documentation:
    command: |-
        This is **AWS WAF Classic** documentation. For more information, see [AWS WAF Classic](https://docs.aws.amazon.com/waf/latest/developerguide/classic-waf-chapter.html) in the developer guide.

        **For the latest version of AWS WAF**, use the AWS WAFV2 API and see the [AWS WAF Developer Guide](https://docs.aws.amazon.com/waf/latest/developerguide/waf-chapter.html). With the latest version, AWS WAF has a single set of endpoints for regional and global use.

        Permanently deletes a [ByteMatchSet](). You can't delete a `ByteMatchSet` if it's still used in any `Rules` or if it still includes any [ByteMatchTuple]() objects (any filters).

        If you just want to remove a `ByteMatchSet` from a `Rule`, use [UpdateRule]().

        To permanently delete a `ByteMatchSet`, perform the following steps:

        1. Update the `ByteMatchSet` to remove filters, if any. For more information, see [UpdateByteMatchSet]().
        2. Use [GetChangeToken]() to get the change token that you provide in the `ChangeToken` parameter of a `DeleteByteMatchSet` request.
        3. Submit a `DeleteByteMatchSet` request.
    flag:
        byte-match-set-id: The `ByteMatchSetId` of the [ByteMatchSet]() that you want to delete. `ByteMatchSetId` is returned by [CreateByteMatchSet]() and by [ListByteMatchSets]().
        change-token: The value returned by the most recent call to [GetChangeToken]().
