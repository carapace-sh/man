name: create-contact-flow-module-version
description: Creates an immutable snapshot of a contact flow module, preserving its content and settings at a specific point in time for version control and rollback capabilities.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --contact-flow-module-id=!: The identifier of the flow module.
    --description=: The description of the flow module version.
    --flow-module-content-sha256=: Indicates the checksum value of the flow module content.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-id=!: The identifier of the Amazon Connect instance.
