name: copy-db-parameter-group
description: Copies the specified DB parameter group.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --source-db-parameter-group-identifier=!: The identifier or ARN for the source DB parameter group.
    --tags=: ""
    --target-db-parameter-group-description=!: A description for the copied DB parameter group.
    --target-db-parameter-group-identifier=!: The identifier for the copied DB parameter group.
documentation:
    command: |-
        Copies the specified DB parameter group.

        You can't copy a default DB parameter group. Instead, create a new custom DB parameter group, which copies the default parameters and values for the specified DB parameter group family.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        source-db-parameter-group-identifier: |-
            The identifier or ARN for the source DB parameter group. For information about creating an ARN, see [Constructing an ARN for Amazon RDS](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_Tagging.ARN.html#USER_Tagging.ARN.Constructing) in the *Amazon RDS User Guide*.

            Constraints:

            - Must specify a valid DB parameter group.
        tags: ""
        target-db-parameter-group-description: A description for the copied DB parameter group.
        target-db-parameter-group-identifier: |-
            The identifier for the copied DB parameter group.

            Constraints:

            - Can't be null, empty, or blank
            - Must contain from 1 to 255 letters, numbers, or hyphens
            - First character must be a letter
            - Can't end with a hyphen or contain two consecutive hyphens

            Example: `my-db-parameter-group`
