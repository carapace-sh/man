name: generate-pin-data
description: Generates pin-related data such as PIN, PIN Verification Value (PVV), PIN Block, and PIN Offset during new card issuance or reissuance.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --encryption-key-identifier=!: The `keyARN` of the PEK that Amazon Web Services Payment Cryptography uses to encrypt the PIN Block.
    --encryption-wrapped-key=: ""
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --generation-attributes=!: The attributes and values to use for PIN, PVV, or PIN Offset generation.
    --generation-key-identifier=!: The `keyARN` of the PEK that Amazon Web Services Payment Cryptography uses for pin data generation.
    --pin-block-format=!: The PIN encoding format for pin data generation as specified in ISO 9564. Amazon Web Services Payment Cryptography supports `ISO_Format_0`, `ISO_Format_3` and `ISO_Format_4`.
    --pin-data-length=: The length of PIN under generation.
    --primary-account-number=: The Primary Account Number (PAN), a unique identifier for a payment credit or debit card that associates the card with a specific account holder.
completion:
    flag:
        pin-block-format:
            - ISO_FORMAT_0
            - ISO_FORMAT_1
            - ISO_FORMAT_3
            - ISO_FORMAT_4
documentation:
    command: |-
        Generates pin-related data such as PIN, PIN Verification Value (PVV), PIN Block, and PIN Offset during new card issuance or reissuance. For more information, see [Generate PIN data](https://docs.aws.amazon.com/payment-cryptography/latest/userguide/generate-pin-data.html) in the *Amazon Web Services Payment Cryptography User Guide*.

        PIN data is never transmitted in clear to or from Amazon Web Services Payment Cryptography. This operation generates PIN, PVV, or PIN Offset and then encrypts it using Pin Encryption Key (PEK) to create an `EncryptedPinBlock` for transmission from Amazon Web Services Payment Cryptography. This operation uses a separate Pin Verification Key (PVK) for VISA PVV generation.

        Using ECDH key exchange, you can receive cardholder selectable PINs into Amazon Web Services Payment Cryptography. The ECDH derived key protects the incoming PIN block. You can also use it for reveal PIN, wherein the generated PIN block is protected by the ECDH derived key before transmission from Amazon Web Services Payment Cryptography. For more information on establishing ECDH derived keys, see the [Generating keys](https://docs.aws.amazon.com/payment-cryptography/latest/userguide/create-keys.html) in the *Amazon Web Services Payment Cryptography User Guide*.

        For information about valid keys for this operation, see [Understanding key attributes](https://docs.aws.amazon.com/payment-cryptography/latest/userguide/keys-validattributes.html) and [Key types for specific data operations](https://docs.aws.amazon.com/payment-cryptography/latest/userguide/crypto-ops-validkeys-ops.html) in the *Amazon Web Services Payment Cryptography User Guide*.

        **Cross-account use**: This operation can't be used across different Amazon Web Services accounts.

        **Related operations:**

        - [GenerateCardValidationData]()
        - [TranslatePinData]()
        - [VerifyPinData]()
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        encryption-key-identifier: The `keyARN` of the PEK that Amazon Web Services Payment Cryptography uses to encrypt the PIN Block. For ECDH, it is the `keyARN` of the asymmetric ECC key.
        encryption-wrapped-key: ""
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generation-attributes: The attributes and values to use for PIN, PVV, or PIN Offset generation.
        generation-key-identifier: The `keyARN` of the PEK that Amazon Web Services Payment Cryptography uses for pin data generation.
        pin-block-format: |-
            The PIN encoding format for pin data generation as specified in ISO 9564. Amazon Web Services Payment Cryptography supports `ISO_Format_0`, `ISO_Format_3` and `ISO_Format_4`.

            The `ISO_Format_0` PIN block format is equivalent to the ANSI X9.8, VISA-1, and ECI-1 PIN block formats. It is similar to a VISA-4 PIN block format. It supports a PIN from 4 to 12 digits in length.

            The `ISO_Format_3` PIN block format is the same as `ISO_Format_0` except that the fill digits are random values from 10 to 15.

            The `ISO_Format_4` PIN block format is the only one supporting AES encryption. It is similar to `ISO_Format_3` but doubles the pin block length by padding with fill digit A and random values from 10 to 15.
        pin-data-length: The length of PIN under generation.
        primary-account-number: The Primary Account Number (PAN), a unique identifier for a payment credit or debit card that associates the card with a specific account holder.
