name: describe-gateway
description: Displays the details of a gateway.
flags:
    --gateway-arn=!: The ARN of the gateway that you want to describe.
documentation:
    command: Displays the details of a gateway. The response includes the gateway Amazon Resource Name (ARN), name, and CIDR blocks, as well as details about the networks.
    flag:
        gateway-arn: The ARN of the gateway that you want to describe.
