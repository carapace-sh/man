name: describe
description: '*(BETA)*  Describe a runtime template.'
flags:
    --region=: Cloud region for the runtime template.
documentation:
    command: |
        *(BETA)*  Describe a Colab Enterprise notebook runtime template.
    flag:
        region: |-
            Cloud region for the runtime template.
            +
            To set the `region` attribute:
            * provide the argument `runtime_template` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `colab/region`.
