name: accept-certificate-transfer
description: Accepts a pending certificate transfer.
flags:
    --certificate-id=!: The ID of the certificate.
    --set-as-active=: Specifies whether the certificate is active.
documentation:
    command: |-
        Accepts a pending certificate transfer. The default state of the certificate is INACTIVE.

        To check for pending certificate transfers, call [ListCertificates]() to enumerate your certificates.

        Requires permission to access the [AcceptCertificateTransfer](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        certificate-id: The ID of the certificate. (The last part of the certificate ARN contains the certificate ID.)
        set-as-active: Specifies whether the certificate is active.
