name: tag-resource
description: You can create tags during or after creating a resource such as instance, data flow, or dataset in AWS Supply chain.
flags:
    --resource-arn=!: The Amazon Web Services Supply chain resource ARN that needs to be tagged.
    --tags=!: The tags of the Amazon Web Services Supply chain resource to be created.
documentation:
    command: You can create tags during or after creating a resource such as instance, data flow, or dataset in AWS Supply chain. During the data ingestion process, you can add tags such as dev, test, or prod to data flows created during the data ingestion process in the AWS Supply Chain datasets. You can use these tags to identify a group of resources or a single resource used by the developer.
    flag:
        resource-arn: The Amazon Web Services Supply chain resource ARN that needs to be tagged.
        tags: The tags of the Amazon Web Services Supply chain resource to be created.
