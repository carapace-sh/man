name: bq
description: Export a Cloud Healthcare API API DICOM store to BigQuery.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --bq-table=!: The BigQuery table where the DICOM store should
    --dataset=: Cloud Healthcare dataset.
    --location=: Google Cloud location.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-overwrite-table&: If the destination table already exists and this flag is
    --overwrite-table: If the destination table already exists and this flag is
    --write-disposition=: Determines whether the existing table in the destination is to be overwritten or appended to.
completion:
    flag:
        write-disposition:
            - write-append
            - write-empty
            - write-truncate
documentation:
    command: Export a Cloud Healthcare API API DICOM store to BigQuery.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        bq-table: |-
            The BigQuery table where the DICOM store should
            be written. If this table does not exist, a new table with the given
            name will be created.
        dataset: |-
            Cloud Healthcare dataset.
            +
            To set the `dataset` attribute:
            * provide the argument `dicom_store` on the command line with a fully specified name;
            * provide the argument `--dataset` on the command line.
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `dicom_store` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `healthcare/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-overwrite-table: |
            If the destination table already exists and this flag is
            `TRUE`, the table will be overwritten by the contents of the DICOM
            store. If the flag is not set and the destination table already exists,
            the export call returns an error.
        overwrite-table: |-
            If the destination table already exists and this flag is
            `TRUE`, the table will be overwritten by the contents of the DICOM
            store. If the flag is not set and the destination table already exists,
            the export call returns an error.
        write-disposition: |-
            Determines whether the existing table in the destination is to be overwritten or appended to. _WRITE_DISPOSITION_ must be one of:
            +
            *write-append*::: Append data to the existing table.
            +
            *write-empty*::: Only export data if the destination table is empty.
            +
            *write-truncate*::: Erase all existing data in a table before writing the instances.
            +
            :::
            +
