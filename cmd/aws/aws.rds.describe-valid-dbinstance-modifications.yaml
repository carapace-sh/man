name: describe-valid-dbinstance-modifications
description: You can call `DescribeValidDBInstanceModifications` to learn what modifications you can make to your DB instance.
flags:
    --dbinstance-identifier=!: The customer identifier or the ARN of your DB instance.
documentation:
    command: |-
        You can call `DescribeValidDBInstanceModifications` to learn what modifications you can make to your DB instance. You can use this information when you call `ModifyDBInstance`.

        This command doesn't apply to RDS Custom.
    flag:
        dbinstance-identifier: The customer identifier or the ARN of your DB instance.
