            - tensorflow
            - xgboost
        region:
            - global
            - asia-east1
            - asia-northeast1
            - asia-southeast1
            - australia-southeast1
            - europe-west1
            - europe-west2
            - europe-west3
            - europe-west4
            - northamerica-northeast1
            - us-central1
            - us-east1
            - us-east4
            - us-west1
documentation:
    command: |-
        *(BETA)*  Creates a new version of an AI Platform model.

        For more details on managing AI Platform models and versions see
        https://cloud.google.com/ai-platform/prediction/docs/managing-models-jobs
    flag:
        accelerator: |-
            Manage the accelerator config for GPU serving. When deploying a model with
            Compute Engine Machine Types, a GPU accelerator may also
            be selected.
            +
            *type*::: The type of the accelerator. Choices are 'nvidia-tesla-a100', 'nvidia-tesla-k80', 'nvidia-tesla-p100', 'nvidia-tesla-p4', 'nvidia-tesla-t4', 'nvidia-tesla-v100'.
            +
            *count*::: The number of accelerators to attach to each machine running the job.
             If not specified, the default value is 1. Your model must be specially designed
            to accommodate more than 1 accelerator per machine. To configure how many
            replicas your model has, set the `manualScaling` or `autoScaling`
            parameters.
        args: |-
            Comma-separated arguments passed to the command run by the container
            image. If not specified and no '--command' is provided, the container
            image's default Cmd is used.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        command: |-
            Entrypoint for the container image. If not specified, the container
            image's default Entrypoint is run.
        config: |-
            Path to a YAML configuration file containing configuration parameters
            for the
            [Version](https://cloud.google.com/ai-platform/prediction/docs/reference/rest/v1/projects.models.versions)
            to create.
            +
            The file is in YAML format. Note that not all attributes of a version
            are configurable; available attributes (with example values) are:
            +
                description: A free-form description of the version.
                deploymentUri: gs://path/to/source
                runtimeVersion: '2.1'
                #  Set only one of either manualScaling or autoScaling.
                manualScaling:
                  nodes: 10  # The number of nodes to allocate for this model.
                autoScaling:
                  minNodes: 0  # The minimum number of nodes to allocate for this model.
                labels:
                  user-defined-key: user-defined-value
            +
            The name of the version must always be specified via the required
            VERSION argument.
            +
            Only one of manualScaling or autoScaling can be specified. If both
            are specified in same yaml file an error will be returned.
            +
            If an option is specified both in the configuration file and via
            command-line arguments, the command-line arguments override the
            configuration file.
        description: Description of the version.
        env-vars: List of key-value pairs to set as environment variables.
        explanation-method: |-
            Enable explanations and select the explanation method to use.
            +
            The valid options are:
              integrated-gradients: Use Integrated Gradients.
              sampled-shapley: Use Sampled Shapley.
              xrai: Use XRAI.
            +
            _EXPLANATION_METHOD_ must be one of: *integrated-gradients*, *sampled-shapley*, *xrai*.
        framework: 'ML framework used to train this version of the model. If not specified, defaults to ''tensorflow''. _FRAMEWORK_ must be one of: *scikit-learn*, *tensorflow*, *xgboost*.'
        health-route: HTTP path to send health checks to inside the container.
        image: Name of the container image to deploy (e.g. gcr.io/myproject/server:latest).
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        machine-type: |-
            Type of machine on which to serve the model. Currently only applies to online prediction. For available machine types,
            see https://cloud.google.com/ai-platform/prediction/docs/machine-types-online-prediction#available_machine_types.
        max-nodes: The maximum number of nodes to scale this model under load.
        metric-targets: |-
            List of key-value pairs to set as metrics' target for autoscaling.
            Autoscaling could be based on CPU usage or GPU duty cycle, valid key could be
            cpu-usage or gpu-duty-cycle.
        min-nodes: The minimum number of nodes to scale this model under load.
        model: Name of the model.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        num-integral-steps: |-
            Number of integral steps for Integrated Gradients. Only valid when
            `--explanation-method=integrated-gradients` or
            `--explanation-method=xrai` is specified.
        num-paths: |-
            Number of paths for Sampled Shapley. Only valid when
            `--explanation-method=sampled-shapley` is specified.
        origin: |-
            Location of ```model/``` "directory" (see
            https://cloud.google.com/ai-platform/prediction/docs/deploying-models#upload-model).
            +
            This overrides `deploymentUri` in the `--config` file. If this flag is
            not passed, `deploymentUri` *must* be specified in the file from
            `--config`.
            +
            Can be a Cloud Storage (`gs://`) path or local file path (no
            prefix). In the latter case the files will be uploaded to Cloud
            Storage and a `--staging-bucket` argument is required.
        package-uris: |-
            Comma-separated list of Cloud Storage URIs ('gs://...') for
            user-supplied Python packages to use.
        ports: |-
            Container ports to receive requests at. Must be a number between 1 and 65535,
            inclusive.
        predict-route: HTTP path to send prediction requests to inside the container.
        prediction-class: |-
            Fully-qualified name of the custom prediction class in the package
            provided for custom prediction.
            +
            For example, `--prediction-class=my_package.SequenceModel`.
        python-version: |-
            Version of Python used when creating the version. Choices are 3.7, 3.5, and 2.7.
            However, this value must be compatible with the chosen runtime version
            for the job.
            +
            Must be used with a compatible runtime version:
            +
            * 3.7 is compatible with runtime versions 1.15 and later.
            * 3.5 is compatible with runtime versions 1.4 through 1.14.
            * 2.7 is compatible with runtime versions 1.15 and earlier.
        region: |-
            Google Cloud region of the regional endpoint to use for this command.
            For the global endpoint, the region needs to be specified as `global`.
            +
            Learn more about regional endpoints and see a list of available regions:
             https://cloud.google.com/ai-platform/prediction/docs/regional-endpoints
            +
            _REGION_ must be one of: *global*, *asia-east1*, *asia-northeast1*, *asia-southeast1*, *australia-southeast1*, *europe-west1*, *europe-west2*, *europe-west3*, *europe-west4*, *northamerica-northeast1*, *us-central1*, *us-east1*, *us-east4*, *us-west1*.
        runtime-version: 'AI Platform runtime version for this job. Must be specified unless --master-image-uri is specified instead. It is defined in documentation along with the list of supported versions: https://cloud.google.com/ai-platform/prediction/docs/runtime-version-list'
        service-account: Specifies the service account for resource access control.
        staging-bucket: |-
            Bucket in which to stage training archives.
            +
            Required only if a file upload is necessary (that is, other flags
            include local paths) and no other flags implicitly specify an upload
            path.
