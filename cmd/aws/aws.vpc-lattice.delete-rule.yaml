name: delete-rule
description: Deletes a listener rule.
flags:
    --listener-identifier=!: The ID or ARN of the listener.
    --rule-identifier=!: The ID or ARN of the rule.
    --service-identifier=!: The ID or ARN of the service.
documentation:
    command: |-
        Deletes a listener rule. Each listener has a default rule for checking connection requests, but you can define additional rules. Each rule consists of a priority, one or more actions, and one or more conditions. You can delete additional listener rules, but you cannot delete the default rule.

        For more information, see [Listener rules](https://docs.aws.amazon.com/vpc-lattice/latest/ug/listeners.html#listener-rules) in the *Amazon VPC Lattice User Guide*.
    flag:
        listener-identifier: The ID or ARN of the listener.
        rule-identifier: The ID or ARN of the rule.
        service-identifier: The ID or ARN of the service.
