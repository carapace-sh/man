name: describe
description: '*(ALPHA)*  Describes the configuration for a given version of a service.'
flags:
    --service=: The name of the service from which to retrieve the configuration..
documentation:
    command: |-
        *(ALPHA)*  This command prints out the configuration for the given version of a
        given service. You specify the name of the service and the ID of the
        configuration, and the command will print out the specified config.

        ## EXAMPLES

        To print the configuration with ID ``2017-01-01R0'' for the service
        called ``my-service'', run:

          $ gcloud alpha endpoints configs describe --service=my-service 2017-01-01R0
    flag:
        service: The name of the service from which to retrieve the configuration..
