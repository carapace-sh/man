name: delete-cluster-snapshot
description: Deletes the specified manual snapshot.
flags:
    --snapshot-cluster-identifier=: The unique identifier of the cluster the snapshot was created from.
    --snapshot-identifier=!: The unique identifier of the manual snapshot to be deleted.
documentation:
    command: |-
        Deletes the specified manual snapshot. The snapshot must be in the `available` state, with no other users authorized to access the snapshot.

        Unlike automated snapshots, manual snapshots are retained even after you delete your cluster. Amazon Redshift does not delete your manual snapshots. You must delete manual snapshot explicitly to avoid getting charged. If other accounts are authorized to access the snapshot, you must revoke all of the authorizations before you can delete the snapshot.
    flag:
        snapshot-cluster-identifier: |-
            The unique identifier of the cluster the snapshot was created from. This parameter is required if your IAM user has a policy containing a snapshot resource element that specifies anything other than * for the cluster name.

            Constraints: Must be the name of valid cluster.
        snapshot-identifier: |-
            The unique identifier of the manual snapshot to be deleted.

            Constraints: Must be the name of an existing snapshot that is in the `available`, `failed`, or `cancelled` state.
