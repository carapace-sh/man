name: update
description: '*(ALPHA)*  Update a Bitbucket Server config for use by Cloud Build.'
flags:
    --admin-access-token-secret-version=: Secret Manager resource containing the admin access token.
    --api-key=: The Cloud Build API key that should be associated with this config.
    --host-uri=: The host uri of the Bitbucket Server instance.
    --read-access-token-secret-version=: Secret Manager resource containing the read access token.
    --region=: The region of the Cloud Build Service to use.
    --ssl-ca-file=: Path to a local file that contains SSL certificate to use for requests to Bitbucket Server.
    --user-name=: The Bitbucket Server user name that should be associated with this config.
    --webhook-secret-secret-version=: Secret Manager resource containing the webhook secret.
documentation:
    command: '*(ALPHA)*  Update a Bitbucket Server config for use by Cloud Build.'
    flag:
        admin-access-token-secret-version: Secret Manager resource containing the admin access token. The secret is specified in resource URL format projects/{secret_project}/secrets/{secret_name}/versions/{secret_version}.
        api-key: The Cloud Build API key that should be associated with this config.
        host-uri: The host uri of the Bitbucket Server instance.
        read-access-token-secret-version: Secret Manager resource containing the read access token. The secret is specified in resource URL format projects/{secret_project}/secrets/{secret_name}/versions/{secret_version}.
        region: |-
            The region of the Cloud Build Service to use.
            Must be set to a supported region name (e.g. `us-central1`).
            If unset, `builds/region`, which is the default region to use when working with Cloud Build resources, is used. If builds/region is unset, region is set to `global`.
            Note: Region must be specified in 2nd gen repo; `global` is not supported.
        ssl-ca-file: Path to a local file that contains SSL certificate to use for requests to Bitbucket Server. The certificate should be in PEM format. Use a full or relative path to a local file containing the value of ssl_ca_file.
        user-name: The Bitbucket Server user name that should be associated with this config.
        webhook-secret-secret-version: Secret Manager resource containing the webhook secret. The secret is specified in resource URL format projects/{secret_project}/secrets/{secret_name}/versions/{secret_version}.
