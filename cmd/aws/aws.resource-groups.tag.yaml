name: tag
description: Adds tags to a resource group with the specified Amazon resource name (ARN).
flags:
    --arn=!: The Amazon resource name (ARN) of the resource group to which to add tags.
    --tags=!: The tags to add to the specified resource group.
documentation:
    command: |-
        Adds tags to a resource group with the specified Amazon resource name (ARN). Existing tags on a resource group are not changed if they are not specified in the request parameters.

        Do not store personally identifiable information (PII) or other confidential or sensitive information in tags. We use tags to provide you with billing and administration services. Tags are not intended to be used for private or sensitive data.

        **Minimum permissions**

        To run this command, you must have the following permissions:

        - `resource-groups:Tag`
    flag:
        arn: The Amazon resource name (ARN) of the resource group to which to add tags.
        tags: The tags to add to the specified resource group. A tag is a string-to-string map of key-value pairs.
