name: disassociate-client-vpn-target-network
description: Disassociates a target network from the specified Client VPN endpoint.
flags:
    --association-id=!: The ID of the target network association.
    --client-vpn-endpoint-id=!: The ID of the Client VPN endpoint from which to disassociate the target network.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: |-
        Disassociates a target network from the specified Client VPN endpoint. When you disassociate the last target network from a Client VPN, the following happens:

        - The route that was automatically added for the VPC is deleted
        - All active client connections are terminated
        - New client connections are disallowed
        - The Client VPN endpoint's status changes to `pending-associate`
    flag:
        association-id: The ID of the target network association.
        client-vpn-endpoint-id: The ID of the Client VPN endpoint from which to disassociate the target network.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
