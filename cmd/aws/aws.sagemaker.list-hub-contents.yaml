name: list-hub-contents
description: List the contents of a hub.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --creation-time-after=: Only list hub content that was created after the time specified.
    --creation-time-before=: Only list hub content that was created before the time specified.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --hub-content-type=!: The type of hub content to list.
    --hub-name=!: The name of the hub to list the contents of.
    --max-results=: The maximum amount of hub content to list.
    --max-schema-version=: The upper bound of the hub content schema verion.
    --name-contains=: Only list hub content if the name contains the specified string.
    --next-token=: If the response to a previous `ListHubContents` request was truncated, the response includes a `NextToken`.
    --sort-by=: Sort hub content versions by either name or creation time.
    --sort-order=: Sort hubs by ascending or descending order.
completion:
    flag:
        hub-content-type:
            - Model
            - Notebook
            - ModelReference
        sort-by:
            - HubContentName
            - CreationTime
            - HubContentStatus
        sort-order:
            - Ascending
            - Descending
documentation:
    command: List the contents of a hub.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        creation-time-after: Only list hub content that was created after the time specified.
        creation-time-before: Only list hub content that was created before the time specified.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        hub-content-type: The type of hub content to list.
        hub-name: The name of the hub to list the contents of.
        max-results: The maximum amount of hub content to list.
        max-schema-version: The upper bound of the hub content schema verion.
        name-contains: Only list hub content if the name contains the specified string.
        next-token: If the response to a previous `ListHubContents` request was truncated, the response includes a `NextToken`. To retrieve the next set of hub content, use the token in the next request.
        sort-by: Sort hub content versions by either name or creation time.
        sort-order: Sort hubs by ascending or descending order.
