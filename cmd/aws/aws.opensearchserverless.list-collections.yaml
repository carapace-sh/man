name: list-collections
description: Lists all OpenSearch Serverless collections.
flags:
    --collection-filters=: A list of filter names and values that you can use for requests.
    --max-results=: The maximum number of results to return.
    --next-token=: If your initial `ListCollections` operation returns a `nextToken`, you can include the returned `nextToken` in subsequent `ListCollections` operations, which returns results in the next page.
documentation:
    command: |-
        Lists all OpenSearch Serverless collections. For more information, see [Creating and managing Amazon OpenSearch Serverless collections](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-manage.html).

        Make sure to include an empty request body {} if you don't include any collection filters in the request.
    flag:
        collection-filters: A list of filter names and values that you can use for requests.
        max-results: The maximum number of results to return. Default is 20. You can use `nextToken` to get the next page of results.
        next-token: If your initial `ListCollections` operation returns a `nextToken`, you can include the returned `nextToken` in subsequent `ListCollections` operations, which returns results in the next page.
