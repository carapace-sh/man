name: update
description: '*(ALPHA)*  Update an existing investigation.'
hidden: true
flags:
    --clear-end-time: Clear the end time of the investigation.
    --clear-resources: Clear the resources of the investigation.
    --clear-start-time: Clear the start time of the investigation.
    --clear-title: Clear the title of the investigation.
    --end-time=: The estimated end time of the issue you are investigating.
    --issue=: A description of the issue you are investigating, or an error log.
    --no-clear-end-time&: Clear the end time of the investigation.
    --no-clear-resources&: Clear the resources of the investigation.
    --no-clear-start-time&: Clear the start time of the investigation.
    --no-clear-title&: Clear the title of the investigation.
    --resources=: A list of resources relevant to the investigation
    --start-time=: The estimated start time of the issue you are investigating.
    --title=: The desired title of the resulting investigation.
documentation:
    command: |-
        *(ALPHA)*  Shows metadata for the investigation after updating.

        This command can fail for the following reasons:
        * The investigation ID doesn't exist.
        * The active account does not have permission to update the investigation.
        * The investigation is currently running.

        ## EXAMPLES

        The following command updates title, text description, resources, and start
        time of the existing investigation with the name`example-foo-bar-1`:

          $ gcloud alpha gemini cloud-assist investigations update example-foo-bar-1 --title="Example Investigation" \
              --issue="I have a problem" --start-time=2025-07-10
    flag:
        clear-end-time: Clear the end time of the investigation.
        clear-resources: Clear the resources of the investigation.
        clear-start-time: Clear the start time of the investigation.
        clear-title: Clear the title of the investigation.
        end-time: The estimated end time of the issue you are investigating.
        issue: A description of the issue you are investigating, or an error log.
        no-clear-end-time: Clear the end time of the investigation.
        no-clear-resources: Clear the resources of the investigation.
        no-clear-start-time: Clear the start time of the investigation.
        no-clear-title: Clear the title of the investigation.
        resources: A list of resources relevant to the investigation
        start-time: The estimated start time of the issue you are investigating.
        title: The desired title of the resulting investigation.
