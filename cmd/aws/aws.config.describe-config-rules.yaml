name: describe-config-rules
description: Returns details about your Config rules.
flags:
    --config-rule-names=: The names of the Config rules for which you want details.
    --filters=: Returns a list of Detective or Proactive Config rules.
    --next-token=: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
documentation:
    command: Returns details about your Config rules.
    flag:
        config-rule-names: The names of the Config rules for which you want details. If you do not specify any names, Config returns details for all your rules.
        filters: Returns a list of Detective or Proactive Config rules. By default, this API returns an unfiltered list. For more information on Detective or Proactive Config rules, see [**Evaluation Mode**](https://docs.aws.amazon.com/config/latest/developerguide/evaluate-config-rules.html) in the *Config Developer Guide*.
        next-token: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
