name: associate-dhcp-options
description: Associates a set of DHCP options (that you've previously created) with the specified VPC, or associates no DHCP options with the VPC.
flags:
    --dhcp-options-id=!: The ID of the DHCP options set, or `default` to associate no DHCP options with the VPC.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --vpc-id=!: The ID of the VPC.
documentation:
    command: |-
        Associates a set of DHCP options (that you've previously created) with the specified VPC, or associates no DHCP options with the VPC.

        After you associate the options with the VPC, any existing instances and all new instances that you launch in that VPC use the options. You don't need to restart or relaunch the instances. They automatically pick up the changes within a few hours, depending on how frequently the instance renews its DHCP lease. You can explicitly renew the lease using the operating system on the instance.

        For more information, see [DHCP option sets](https://docs.aws.amazon.com/vpc/latest/userguide/VPC_DHCP_Options.html) in the *Amazon VPC User Guide*.
    flag:
        dhcp-options-id: The ID of the DHCP options set, or `default` to associate no DHCP options with the VPC.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        vpc-id: The ID of the VPC.
