name: create-data-migration
description: Creates a data migration using the provided settings.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --data-migration-name=: A user-friendly name for the data migration.
    --data-migration-type=!: Specifies if the data migration is full-load only, change data capture (CDC) only, or full-load and CDC.
    --enable-cloudwatch-logs: Specifies whether to enable CloudWatch logs for the data migration.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --migration-project-identifier=!: An identifier for the migration project.
    --no-enable-cloudwatch-logs: Specifies whether to enable CloudWatch logs for the data migration.
    --number-of-jobs=: The number of parallel jobs that trigger parallel threads to unload the tables from the source, and then load them to the target.
    --selection-rules=: An optional JSON string specifying what tables, views, and schemas to include or exclude from the migration.
    --service-access-role-arn=!: The Amazon Resource Name (ARN) for the service access role that you want to use to create the data migration.
    --source-data-settings=:
        description: Specifies information about the source data provider.
        nargs: -1
    --tags=:
        description: One or more tags to be assigned to the data migration.
        nargs: -1
    --target-data-settings=:
        description: Specifies information about the target data provider.
        nargs: -1
completion:
    flag:
        data-migration-type:
            - full-load
            - cdc
            - full-load-and-cdc
documentation:
    command: Creates a data migration using the provided settings.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        data-migration-name: |-
            A user-friendly name for the data migration. Data migration names have the following constraints:

            - Must begin with a letter, and can only contain ASCII letters, digits, and hyphens.
            - Can't end with a hyphen or contain two consecutive hyphens.
            - Length must be from 1 to 255 characters.
        data-migration-type: Specifies if the data migration is full-load only, change data capture (CDC) only, or full-load and CDC.
        enable-cloudwatch-logs: Specifies whether to enable CloudWatch logs for the data migration.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        migration-project-identifier: An identifier for the migration project.
        number-of-jobs: The number of parallel jobs that trigger parallel threads to unload the tables from the source, and then load them to the target.
        selection-rules: An optional JSON string specifying what tables, views, and schemas to include or exclude from the migration.
        service-access-role-arn: The Amazon Resource Name (ARN) for the service access role that you want to use to create the data migration.
        source-data-settings: Specifies information about the source data provider.
        tags: One or more tags to be assigned to the data migration.
        target-data-settings: Specifies information about the target data provider.
