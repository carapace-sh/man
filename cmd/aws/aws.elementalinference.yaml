        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --dry-run: Set to true if you want to do a dry run of the disassociate action.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --id=!: The ID of the feed where you want to release the resource.
        --no-dry-run: Set to true if you want to do a dry run of the disassociate action.
      documentation:
        command: Releases the resource (for example, an MediaLive channel) that is associated with this feed. The outputs in the feed become disabled.
        flag:
            associated-resource-name: The name of the resource currently associated with the feed'.
            cli-input-json: |-
                Reads arguments from the JSON string provided.
