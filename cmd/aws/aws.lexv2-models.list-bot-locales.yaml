name: list-bot-locales
description: Gets a list of locales for the specified bot.
flags:
    --bot-id=!: The identifier of the bot to list locales for.
    --bot-version=!: The version of the bot to list locales for.
    --filters=: Provides the specification for a filter used to limit the response to only those locales that match the filter specification.
    --max-results=: The maximum number of aliases to return in each page of results.
    --next-token=: If the response from the `ListBotLocales` operation contains more results than specified in the `maxResults` parameter, a token is returned in the response.
    --sort-by=: Specifies sorting parameters for the list of locales.
documentation:
    command: Gets a list of locales for the specified bot.
    flag:
        bot-id: The identifier of the bot to list locales for.
        bot-version: The version of the bot to list locales for.
        filters: Provides the specification for a filter used to limit the response to only those locales that match the filter specification. You can only specify one filter and one value to filter on.
        max-results: The maximum number of aliases to return in each page of results. If there are fewer results than the max page size, only the actual number of results are returned.
        next-token: If the response from the `ListBotLocales` operation contains more results than specified in the `maxResults` parameter, a token is returned in the response. Use that token as the `nextToken` parameter to return the next page of results.
        sort-by: Specifies sorting parameters for the list of locales. You can sort by locale name in ascending or descending order.
