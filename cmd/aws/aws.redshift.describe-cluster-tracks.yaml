name: describe-cluster-tracks
description: Returns a list of all the available maintenance tracks.
flags:
    --maintenance-track-name=: The name of the maintenance track.
    --marker=: An optional parameter that specifies the starting point to return a set of response records.
    --max-records=: An integer value for the maximum number of maintenance tracks to return.
documentation:
    command: Returns a list of all the available maintenance tracks.
    flag:
        maintenance-track-name: The name of the maintenance track.
        marker: An optional parameter that specifies the starting point to return a set of response records. When the results of a `DescribeClusterTracks` request exceed the value specified in `MaxRecords`, Amazon Redshift returns a value in the `Marker` field of the response. You can retrieve the next set of response records by providing the returned marker value in the `Marker` parameter and retrying the request.
        max-records: An integer value for the maximum number of maintenance tracks to return.
