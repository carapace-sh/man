name: create-alarm-model
description: Creates an alarm model to monitor an AWS IoT Events input attribute.
flags:
    --alarm-capabilities=: Contains the configuration information of alarm state changes.
    --alarm-event-actions=: Contains information about one or more alarm actions.
    --alarm-model-description=: A description that tells you what the alarm model detects.
    --alarm-model-name=!: A unique name that helps you identify the alarm model.
    --alarm-notification=: Contains information about one or more notification actions.
    --alarm-rule=!: Defines when your alarm is invoked.
    --key=: An input attribute used as a key to create an alarm.
    --role-arn=!: The ARN of the IAM role that allows the alarm to perform actions and access AWS resources.
    --severity=: A non-negative integer that reflects the severity level of the alarm.
    --tags=: A list of key-value pairs that contain metadata for the alarm model.
documentation:
    command: Creates an alarm model to monitor an AWS IoT Events input attribute. You can use the alarm to get notified when the value is outside a specified range. For more information, see [Create an alarm model](https://docs.aws.amazon.com/iotevents/latest/developerguide/create-alarms.html) in the *AWS IoT Events Developer Guide*.
    flag:
        alarm-capabilities: Contains the configuration information of alarm state changes.
        alarm-event-actions: Contains information about one or more alarm actions.
        alarm-model-description: A description that tells you what the alarm model detects.
        alarm-model-name: A unique name that helps you identify the alarm model. You can't change this name after you create the alarm model.
        alarm-notification: Contains information about one or more notification actions.
        alarm-rule: Defines when your alarm is invoked.
        key: An input attribute used as a key to create an alarm. AWS IoT Events routes [inputs](https://docs.aws.amazon.com/iotevents/latest/apireference/API_Input.html) associated with this key to the alarm.
        role-arn: The ARN of the IAM role that allows the alarm to perform actions and access AWS resources. For more information, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) in the *AWS General Reference*.
        severity: A non-negative integer that reflects the severity level of the alarm.
        tags: |-
            A list of key-value pairs that contain metadata for the alarm model. The tags help you manage the alarm model. For more information, see [Tagging your AWS IoT Events resources](https://docs.aws.amazon.com/iotevents/latest/developerguide/tagging-iotevents.html) in the *AWS IoT Events Developer Guide*.

            You can create up to 50 tags for one alarm model.
