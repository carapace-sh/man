name: list-schemas
description: Returns the list of schemas associated with the account.
flags:
    --max-results=: The maximum number of schemas to return.
    --next-token=: A token returned from the previous call to `ListSchemas` for getting the next set of schemas (if they exist).
documentation:
    command: Returns the list of schemas associated with the account. The response provides the properties for each schema, including the Amazon Resource Name (ARN). For more information on schemas, see [CreateSchema](https://docs.aws.amazon.com/personalize/latest/dg/API_CreateSchema.html).
    flag:
        max-results: The maximum number of schemas to return.
        next-token: A token returned from the previous call to `ListSchemas` for getting the next set of schemas (if they exist).
