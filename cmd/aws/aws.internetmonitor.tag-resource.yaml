name: tag-resource
description: Adds a tag to a resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) for a tag that you add to a resource.
    --tags=!: Tags that you add to a resource.
documentation:
    command: |-
        Adds a tag to a resource. Tags are supported only for monitors in Amazon CloudWatch Internet Monitor. You can add a maximum of 50 tags in Internet Monitor.

        A minimum of one tag is required for this call. It returns an error if you use the `TagResource` request with 0 tags.
    flag:
        resource-arn: The Amazon Resource Name (ARN) for a tag that you add to a resource. Tags are supported only for monitors in Amazon CloudWatch Internet Monitor.
        tags: Tags that you add to a resource. You can add a maximum of 50 tags in Internet Monitor.
