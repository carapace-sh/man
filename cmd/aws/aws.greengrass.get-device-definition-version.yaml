name: get-device-definition-version
description: Retrieves information about a device definition version.
flags:
    --device-definition-id=!: The ID of the device definition.
    --device-definition-version-id=!: The ID of the device definition version.
    --next-token=: The token for the next set of results, or ''null'' if there are no additional results.
documentation:
    command: Retrieves information about a device definition version.
    flag:
        device-definition-id: The ID of the device definition.
        device-definition-version-id: The ID of the device definition version. This value maps to the ''Version'' property of the corresponding ''VersionInformation'' object, which is returned by ''ListDeviceDefinitionVersions'' requests. If the version is the last one that was associated with a device definition, the value also maps to the ''LatestVersion'' property of the corresponding ''DefinitionInformation'' object.
        next-token: The token for the next set of results, or ''null'' if there are no additional results.
