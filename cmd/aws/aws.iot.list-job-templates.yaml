name: list-job-templates
description: Returns a list of job templates.
flags:
    --max-results=: The maximum number of results to return in the list.
    --next-token=: The token to use to return the next set of results in the list.
documentation:
    command: |-
        Returns a list of job templates.

        Requires permission to access the [ListJobTemplates](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        max-results: The maximum number of results to return in the list.
        next-token: The token to use to return the next set of results in the list.
