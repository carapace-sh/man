name: delete-tape
description: Deletes the specified virtual tape.
flags:
    --bypass-governance-retention=: Set to `TRUE` to delete an archived tape that belongs to a custom pool with tape retention lock.
    --gateway-arn=!: The unique Amazon Resource Name (ARN) of the gateway that the virtual tape to delete is associated with.
    --tape-arn=!: The Amazon Resource Name (ARN) of the virtual tape to delete.
documentation:
    command: Deletes the specified virtual tape. This operation is only supported in the tape gateway type.
    flag:
        bypass-governance-retention: Set to `TRUE` to delete an archived tape that belongs to a custom pool with tape retention lock. Only archived tapes with tape retention lock set to `governance` can be deleted. Archived tapes with tape retention lock set to `compliance` can't be deleted.
        gateway-arn: The unique Amazon Resource Name (ARN) of the gateway that the virtual tape to delete is associated with. Use the [ListGateways]() operation to return a list of gateways for your account and Amazon Web Services Region.
        tape-arn: The Amazon Resource Name (ARN) of the virtual tape to delete.
