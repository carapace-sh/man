name: update-base-path-mapping
description: Changes information about the BasePathMapping resource.
flags:
    --base-path=!: The base path of the BasePathMapping resource to change.
    --domain-name-id=: The identifier for the domain name resource.
    --domain-name=!: The domain name of the BasePathMapping resource to change.
    --patch-operations=: For more information about supported patch operations, see [Patch Operations](https://docs.aws.amazon.com/apigateway/latest/api/patch-operations.html).
documentation:
    command: Changes information about the BasePathMapping resource.
    flag:
        base-path: |-
            The base path of the BasePathMapping resource to change.

            To specify an empty base path, set this parameter to `'(none)'`.
        domain-name: The domain name of the BasePathMapping resource to change.
        domain-name-id: The identifier for the domain name resource. Supported only for private custom domain names.
        patch-operations: For more information about supported patch operations, see [Patch Operations](https://docs.aws.amazon.com/apigateway/latest/api/patch-operations.html).
