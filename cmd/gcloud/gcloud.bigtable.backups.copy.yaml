name: copy
description: Copy a Cloud Bigtable backup to a new backup.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --destination-backup=!: ID of the backup or fully qualified identifier for the backup.
    --destination-cluster=: Bigtable cluster for the backup.
    --destination-instance=: Bigtable instance for the backup.
    --destination-project=: Project ID of the Google Cloud project for the backup.
    --expiration-date=: Expiration time of the backup, must be at least 6 hours and at most 30 days from the time the source backup is created.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --retention-period=: Retention period of the backup relative from now, must be at least 6 hours and at most 30 days from the time the source backup is created.
    --source-backup=!: ID of the backup or fully qualified identifier for the backup.
    --source-cluster=: Bigtable cluster for the backup.
    --source-instance=: Bigtable instance for the backup.
    --source-project=: Project ID of the Google Cloud project for the backup.
documentation:
    command: |
        This command creates a copy of a Cloud Bigtable backup.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        destination-backup: |-
            ID of the backup or fully qualified identifier for the backup.
            +
            To set the `backup` attribute:
            * provide the argument `--destination-backup` on the command line.
        destination-cluster: |-
            Bigtable cluster for the backup.
            +
            To set the `cluster` attribute:
            * provide the argument `--destination-backup` on the command line with a fully specified name;
            * provide the argument `--destination-cluster` on the command line.
        destination-instance: |-
            Bigtable instance for the backup.
            +
            To set the `instance` attribute:
            * provide the argument `--destination-backup` on the command line with a fully specified name;
            * provide the argument `--destination-instance` on the command line;
            * provide the argument `--source-instance` on the command line.
        destination-project: |-
            Project ID of the Google Cloud project for the backup.
            +
            To set the `project` attribute:
            * provide the argument `--destination-backup` on the command line with a fully specified name;
            * provide the argument `--destination-project` on the command line;
            * provide the argument `--source-project` on the command line;
            * provide the argument `--project` on the command line;
            * set the property `core/project`.
        expiration-date: Expiration time of the backup, must be at least 6 hours and at most 30 days from the time the source backup is created. See `$ gcloud topic datetimes` for information on date/time formats.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        retention-period: Retention period of the backup relative from now, must be at least 6 hours and at most 30 days from the time the source backup is created. See `$ gcloud topic datetimes` for information on duration formats.
        source-backup: |-
            ID of the backup or fully qualified identifier for the backup.
            +
            To set the `backup` attribute:
            * provide the argument `--source-backup` on the command line.
        source-cluster: |-
            Bigtable cluster for the backup.
            +
            To set the `cluster` attribute:
            * provide the argument `--source-backup` on the command line with a fully specified name;
            * provide the argument `--source-cluster` on the command line.
        source-instance: |-
            Bigtable instance for the backup.
            +
            To set the `instance` attribute:
            * provide the argument `--source-backup` on the command line with a fully specified name;
            * provide the argument `--source-instance` on the command line;
            * provide the argument `--destination-instance` on the command line.
        source-project: |-
            Project ID of the Google Cloud project for the backup.
            +
            To set the `project` attribute:
            * provide the argument `--source-backup` on the command line with a fully specified name;
            * provide the argument `--source-project` on the command line;
            * provide the argument `--destination-project` on the command line;
            * provide the argument `--project` on the command line;
            * set the property `core/project`.
