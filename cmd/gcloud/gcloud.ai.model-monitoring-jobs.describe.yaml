name: describe
description: Get detailed model deployment monitoring job information about the given job id.
flags:
    --region=: Cloud region for the monitoring_job.
documentation:
    command: Get detailed model deployment monitoring job information about the given job id.
    flag:
        region: |-
            Cloud region for the monitoring_job.
            +
            To set the `region` attribute:
            * provide the argument `monitoring_job` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
