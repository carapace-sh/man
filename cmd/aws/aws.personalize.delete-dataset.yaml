name: delete-dataset
description: Deletes a dataset.
flags:
    --dataset-arn=!: The Amazon Resource Name (ARN) of the dataset to delete.
documentation:
    command: Deletes a dataset. You can't delete a dataset if an associated `DatasetImportJob` or `SolutionVersion` is in the CREATE PENDING or IN PROGRESS state. For more information about deleting datasets, see [Deleting a dataset](https://docs.aws.amazon.com/personalize/latest/dg/delete-dataset.html).
    flag:
        dataset-arn: The Amazon Resource Name (ARN) of the dataset to delete.
