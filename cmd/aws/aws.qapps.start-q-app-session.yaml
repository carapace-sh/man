name: start-q-app-session
description: Starts a new session for an Amazon Q App, allowing inputs to be provided and the app to be run.
flags:
    --app-id=!: The unique identifier of the Q App to start a session for.
    --app-version=!: The version of the Q App to use for the session.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --initial-values=:
        description: Optional initial input values to provide for the Q App session.
        nargs: -1
    --instance-id=!: The unique identifier of the Amazon Q Business application environment instance.
    --session-id=: The unique identifier of the a Q App session.
    --tags=: Optional tags to associate with the new Q App session.
documentation:
    command: |-
        Starts a new session for an Amazon Q App, allowing inputs to be provided and the app to be run.

        Each Q App session will be condensed into a single conversation in the web experience.
    flag:
        app-id: The unique identifier of the Q App to start a session for.
        app-version: The version of the Q App to use for the session.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        initial-values: Optional initial input values to provide for the Q App session.
        instance-id: The unique identifier of the Amazon Q Business application environment instance.
        session-id: The unique identifier of the a Q App session.
        tags: Optional tags to associate with the new Q App session.
