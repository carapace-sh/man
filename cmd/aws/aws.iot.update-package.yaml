name: update-package
description: Updates the supported fields for a specific software package.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
    --default-version-name=: The name of the default package version.
    --description=: The package description.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-unset-default-version: Indicates whether you want to remove the named default package version from the software package.
    --package-name=!: The name of the target software package.
    --unset-default-version: Indicates whether you want to remove the named default package version from the software package.
documentation:
    command: |-
        Updates the supported fields for a specific software package.

        Requires permission to access the [UpdatePackage](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) and [GetIndexingConfiguration](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) actions.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request. Don't reuse this client token if a new idempotent request is required.
        default-version-name: |-
            The name of the default package version.

            **Note:** You cannot name a `defaultVersion` and set `unsetDefaultVersion` equal to `true` at the same time.
        description: The package description.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        package-name: The name of the target software package.
        unset-default-version: |-
            Indicates whether you want to remove the named default package version from the software package. Set as `true` to remove the default package version.

            **Note:** You cannot name a `defaultVersion` and set `unsetDefaultVersion` equal to `true` at the same time.
