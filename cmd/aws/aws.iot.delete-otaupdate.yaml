name: delete-otaupdate
description: Delete an OTA update.
flags:
    --delete-stream=: When true, the stream created by the OTAUpdate process is deleted when the OTA update is deleted.
    --force-delete-awsjob=: When true, deletes the IoT job created by the OTAUpdate process even if it is "IN\_PROGRESS".
    --ota-update-id=!: The ID of the OTA update to delete.
documentation:
    command: |-
        Delete an OTA update.

        Requires permission to access the [DeleteOTAUpdate](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        delete-stream: When true, the stream created by the OTAUpdate process is deleted when the OTA update is deleted. Ignored if the stream specified in the OTAUpdate is supplied by the user.
        force-delete-awsjob: When true, deletes the IoT job created by the OTAUpdate process even if it is "IN\_PROGRESS". Otherwise, if the job is not in a terminal state ("COMPLETED" or "CANCELED") an exception will occur. The default is false.
        ota-update-id: The ID of the OTA update to delete.
