name: disable-fast-launch
description: Discontinue Windows fast launch for a Windows AMI, and clean up existing pre-provisioned snapshots.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --force: Forces the image settings to turn off Windows fast launch for your Windows AMI.
    --image-id=!: Specify the ID of the image for which to disable Windows fast launch.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-force&: Forces the image settings to turn off Windows fast launch for your Windows AMI.
documentation:
    command: |-
        Discontinue Windows fast launch for a Windows AMI, and clean up existing pre-provisioned snapshots. After you disable Windows fast launch, the AMI uses the standard launch process for each new instance. Amazon EC2 must remove all pre-provisioned snapshots before you can enable Windows fast launch again.

        You can only change these settings for Windows AMIs that you own or that have been shared with you.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        force: Forces the image settings to turn off Windows fast launch for your Windows AMI. This parameter overrides any errors that are encountered while cleaning up resources in your account.
        image-id: Specify the ID of the image for which to disable Windows fast launch.
