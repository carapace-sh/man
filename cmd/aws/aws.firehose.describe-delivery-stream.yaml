name: describe-delivery-stream
description: Describes the specified Firehose stream and its status.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --delivery-stream-name=!: The name of the Firehose stream.
    --exclusive-start-destination-id=: The ID of the destination to start returning the destination information.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --limit=: The limit on the number of destinations to return.
documentation:
    command: |-
        Describes the specified Firehose stream and its status. For example, after your Firehose stream is created, call `DescribeDeliveryStream` to see whether the Firehose stream is `ACTIVE` and therefore ready for data to be sent to it.

        If the status of a Firehose stream is `CREATING_FAILED`, this status doesn't change, and you can't invoke [CreateDeliveryStream]() again on it. However, you can invoke the [DeleteDeliveryStream]() operation to delete it. If the status is `DELETING_FAILED`, you can force deletion by invoking [DeleteDeliveryStream]() again but with [DeleteDeliveryStreamInput$AllowForceDelete]() set to true.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        delivery-stream-name: The name of the Firehose stream.
        exclusive-start-destination-id: The ID of the destination to start returning the destination information. Firehose supports one destination per Firehose stream.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        limit: The limit on the number of destinations to return. You can have one destination per Firehose stream.
