name: delete-edge-configuration
description: An asynchronous API that deletes a stream’s existing edge configuration, as well as the corresponding media from the Edge Agent.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --stream-arn=: The Amazon Resource Name (ARN) of the stream.
    --stream-name=: The name of the stream from which to delete the edge configuration.
documentation:
    command: |-
        An asynchronous API that deletes a stream’s existing edge configuration, as well as the corresponding media from the Edge Agent.

        When you invoke this API, the sync status is set to `DELETING`. A deletion process starts, in which active edge jobs are stopped and all media is deleted from the edge device. The time to delete varies, depending on the total amount of stored media. If the deletion process fails, the sync status changes to `DELETE_FAILED`. You will need to re-try the deletion.

        When the deletion process has completed successfully, the edge configuration is no longer accessible.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        stream-arn: The Amazon Resource Name (ARN) of the stream. Specify either the `StreamName` or the `StreamARN`.
        stream-name: The name of the stream from which to delete the edge configuration. Specify either the `StreamName` or the `StreamARN`.
