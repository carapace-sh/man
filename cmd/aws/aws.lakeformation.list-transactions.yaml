name: list-transactions
description: Returns metadata about transactions and their status.
flags:
    --catalog-id=: The catalog for which to list transactions.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of transactions to return in a single call.
    --next-token=: A continuation token if this is not the first call to retrieve transactions.
    --status-filter=: A filter indicating the status of transactions to return.
completion:
    flag:
        status-filter:
            - ALL
            - COMPLETED
            - ACTIVE
            - COMMITTED
            - ABORTED
documentation:
    command: |-
        Returns metadata about transactions and their status. To prevent the response from growing indefinitely, only uncommitted transactions and those available for time-travel queries are returned.

        This operation can help you identify uncommitted transactions or to get information about transactions.
    flag:
        catalog-id: The catalog for which to list transactions. Defaults to the account ID of the caller.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The maximum number of transactions to return in a single call.
        next-token: A continuation token if this is not the first call to retrieve transactions.
        status-filter: A filter indicating the status of transactions to return. Options are ALL | COMPLETED | COMMITTED | ABORTED | ACTIVE. The default is `ALL`.
