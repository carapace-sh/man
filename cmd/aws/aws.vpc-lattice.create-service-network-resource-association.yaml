name: create-service-network-resource-association
description: Associates the specified service network with the specified resource configuration.
flags:
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --no-private-dns-enabled&: Indicates if private DNS is enabled for the service network resource association.
    --private-dns-enabled: Indicates if private DNS is enabled for the service network resource association.
    --resource-configuration-identifier=!: The ID of the resource configuration to associate with the service network.
    --service-network-identifier=!: The ID of the service network to associate with the resource configuration.
    --tags=: A key-value pair to associate with a resource.
documentation:
    command: Associates the specified service network with the specified resource configuration. This allows the resource configuration to receive connections through the service network, including through a service network VPC endpoint.
    flag:
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If you retry a request that completed successfully using the same client token and parameters, the retry succeeds without performing any actions. If the parameters aren't identical, the retry fails.
        private-dns-enabled: Indicates if private DNS is enabled for the service network resource association.
        resource-configuration-identifier: The ID of the resource configuration to associate with the service network.
        service-network-identifier: The ID of the service network to associate with the resource configuration.
        tags: A key-value pair to associate with a resource.
