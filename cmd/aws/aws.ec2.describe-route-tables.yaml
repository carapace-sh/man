name: describe-route-tables
description: Describes your route tables.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: The filters.
    --max-results=: The maximum number of items to return for this request.
    --next-token=: The token returned from a previous paginated request.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --route-table-ids=: The IDs of the route tables.
documentation:
    command: |-
        Describes your route tables. The default is to describe all your route tables. Alternatively, you can specify specific route table IDs or filter the results to include only the route tables that match specific criteria.

        Each subnet in your VPC must be associated with a route table. If a subnet is not explicitly associated with any route table, it is implicitly associated with the main route table. This command does not return the subnet ID for implicit associations.

        For more information, see [Route tables](https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Route_Tables.html) in the *Amazon VPC User Guide*.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            The filters.

            - `association.gateway-id` - The ID of the gateway involved in the association.
            - `association.route-table-association-id` - The ID of an association ID for the route table.
            - `association.route-table-id` - The ID of the route table involved in the association.
            - `association.subnet-id` - The ID of the subnet involved in the association.
            - `association.main` - Indicates whether the route table is the main route table for the VPC (`true` | `false`). Route tables that do not have an association ID are not returned in the response.
            - `owner-id` - The ID of the Amazon Web Services account that owns the route table.
            - `route-table-id` - The ID of the route table.
            - `route.destination-cidr-block` - The IPv4 CIDR range specified in a route in the table.
            - `route.destination-ipv6-cidr-block` - The IPv6 CIDR range specified in a route in the route table.
            - `route.destination-prefix-list-id` - The ID (prefix) of the Amazon Web Services service specified in a route in the table.
            - `route.egress-only-internet-gateway-id` - The ID of an egress-only Internet gateway specified in a route in the route table.
            - `route.gateway-id` - The ID of a gateway specified in a route in the table.
            - `route.instance-id` - The ID of an instance specified in a route in the table.
            - `route.nat-gateway-id` - The ID of a NAT gateway.
            - `route.transit-gateway-id` - The ID of a transit gateway.
            - `route.origin` - Describes how the route was created. `CreateRouteTable` indicates that the route was automatically created when the route table was created; `CreateRoute` indicates that the route was manually added to the route table; `EnableVgwRoutePropagation` indicates that the route was propagated by route propagation.
            - `route.state` - The state of a route in the route table (`active` | `blackhole`). The blackhole state indicates that the route's target isn't available (for example, the specified gateway isn't attached to the VPC, the specified NAT instance has been terminated, and so on).
            - `route.vpc-peering-connection-id` - The ID of a VPC peering connection specified in a route in the table.
            - `tag` - The key/value combination of a tag assigned to the resource. Use the tag key in the filter name and the tag value as the filter value. For example, to find all resources that have a tag with the key `Owner` and the value `TeamA`, specify `tag:Owner` for the filter name and `TeamA` for the filter value.
            - `tag-key` - The key of a tag assigned to the resource. Use this filter to find all resources assigned a tag with a specific key, regardless of the tag value.
            - `vpc-id` - The ID of the VPC for the route table.
        max-results: The maximum number of items to return for this request. To get the next page of items, make another request with the token returned in the output. For more information, see [Pagination](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Query-Requests.html#api-pagination).
        next-token: The token returned from a previous paginated request. Pagination continues from the end of the items returned by the previous request.
        route-table-ids: The IDs of the route tables.
