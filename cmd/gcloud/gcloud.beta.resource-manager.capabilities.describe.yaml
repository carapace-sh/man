name: describe
description: '*(BETA)*  Show whether a Capability is enabled.'
hidden: true
documentation:
    command: |-
        *(BETA)*  Command to show whether a Capability is enabled.

        This command can fail for the following reasons:
            * The capability specified does not exist.
            * The active account does not have permission to access the given
              folder/capability.

        ## EXAMPLES

        The following command prints metadata for a capability with the ID
        `folders/123/capabilities/app-management`:

          $ gcloud beta resource-manager capabilities describe "folders/123/capabilities/app-management"
