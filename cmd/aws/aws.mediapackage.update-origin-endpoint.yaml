name: update-origin-endpoint
description: Updates an existing OriginEndpoint.
flags:
    --authorization=: ""
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cmaf-package=: ""
    --dash-package=: ""
    --description=: A short text description of the OriginEndpoint.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --hls-package=: ""
    --id=!: The ID of the OriginEndpoint to update.
    --manifest-name=: A short string that will be appended to the end of the Endpoint URL.
    --mss-package=: ""
    --origination=: Control whether origination of video is allowed for this OriginEndpoint.
    --startover-window-seconds=: Maximum duration (in seconds) of content to retain for startover playback.
    --time-delay-seconds=: Amount of delay (in seconds) to enforce on the playback of live content.
    --whitelist=: A list of source IP CIDR blocks that will be allowed to access the OriginEndpoint.
completion:
    flag:
        origination:
            - ALLOW
            - DENY
documentation:
    command: Updates an existing OriginEndpoint.
    flag:
        authorization: ""
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cmaf-package: ""
        dash-package: ""
        description: A short text description of the OriginEndpoint.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        hls-package: ""
        id: The ID of the OriginEndpoint to update.
        manifest-name: A short string that will be appended to the end of the Endpoint URL.
        mss-package: ""
        origination: Control whether origination of video is allowed for this OriginEndpoint. If set to ALLOW, the OriginEndpoint may by requested, pursuant to any other form of access control. If set to DENY, the OriginEndpoint may not be requested. This can be helpful for Live to VOD harvesting, or for temporarily disabling origination
        startover-window-seconds: Maximum duration (in seconds) of content to retain for startover playback. If not specified, startover playback will be disabled for the OriginEndpoint.
        time-delay-seconds: Amount of delay (in seconds) to enforce on the playback of live content. If not specified, there will be no time delay in effect for the OriginEndpoint.
        whitelist: A list of source IP CIDR blocks that will be allowed to access the OriginEndpoint.
