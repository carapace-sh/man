name: get-transaction
description: Gets the details of a transaction.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --network=!: The blockchain network where the transaction occurred.
    --transaction-hash=: The hash of a transaction.
    --transaction-id=: The identifier of a Bitcoin transaction.
completion:
    flag:
        network:
            - ETHEREUM_MAINNET
            - ETHEREUM_SEPOLIA_TESTNET
            - BITCOIN_MAINNET
            - BITCOIN_TESTNET
documentation:
    command: |-
        Gets the details of a transaction.

        This action will return transaction details for all transactions that are *confirmed* on the blockchain, even if they have not reached [finality](https://docs.aws.amazon.com/managed-blockchain/latest/ambq-dg/key-concepts.html#finality).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        network: The blockchain network where the transaction occurred.
        transaction-hash: The hash of a transaction. It is generated when a transaction is created.
        transaction-id: |-
            The identifier of a Bitcoin transaction. It is generated when a transaction is created.

            `transactionId` is only supported on the Bitcoin networks.
