name: update-consumable-resource
description: Updates a consumable resource.
flags:
    --client-token=: If this parameter is specified and two update requests with identical payloads and `clientToken`s are received, these requests are considered the same request.
    --consumable-resource=!: The name or ARN of the consumable resource to be updated.
    --operation=: Indicates how the quantity of the consumable resource will be updated.
    --quantity=: The change in the total quantity of the consumable resource.
documentation:
    command: Updates a consumable resource.
    flag:
        client-token: If this parameter is specified and two update requests with identical payloads and `clientToken`s are received, these requests are considered the same request. Both requests will succeed, but the update will only happen once. A `clientToken` is valid for 8 hours.
        consumable-resource: The name or ARN of the consumable resource to be updated.
        operation: "Indicates how the quantity of the consumable resource will be updated. Must be one of:\n\n- `SET`\n  \n  Sets the quantity of the resource to the value specified by the `quantity` parameter.\n- `ADD`\n  \n  Increases the quantity of the resource by the value specified by the `quantity` parameter.\n- `REMOVE`\n  \n  Reduces the quantity of the resource by the value specified by the `quantity` parameter."
        quantity: The change in the total quantity of the consumable resource. The `operation` parameter determines whether the value specified here will be the new total quantity, or the amount by which the total quantity will be increased or reduced. Must be a non-negative value.
