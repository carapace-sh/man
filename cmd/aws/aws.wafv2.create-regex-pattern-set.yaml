name: create-regex-pattern-set
description: Creates a [RegexPatternSet](), which you reference in a [RegexPatternSetReferenceStatement](), to have WAF inspect a web request component for the specified patterns.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description of the set that helps with identification.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the set.
    --regular-expression-list=!:
        description: Array of regular expression strings.
        nargs: -1
    --scope=!: Specifies whether this is for a global resource type, such as a Amazon CloudFront distribution.
    --tags=:
        description: An array of key:value pairs to associate with the resource.
        nargs: -1
completion:
    flag:
        scope:
            - CLOUDFRONT
            - REGIONAL
documentation:
    command: Creates a [RegexPatternSet](), which you reference in a [RegexPatternSetReferenceStatement](), to have WAF inspect a web request component for the specified patterns.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description of the set that helps with identification.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the set. You cannot change the name after you create the set.
        regular-expression-list: Array of regular expression strings.
        scope: |-
            Specifies whether this is for a global resource type, such as a Amazon CloudFront distribution. For an Amplify application, use `CLOUDFRONT`.

            To work with CloudFront, you must also specify the Region US East (N. Virginia) as follows:

            - CLI - Specify the Region when you use the CloudFront scope: `--scope=CLOUDFRONT --region=us-east-1`.
            - API and SDKs - For all calls, use the Region endpoint us-east-1.
        tags: An array of key:value pairs to associate with the resource.
