name: get-asset-property-aggregates
description: Gets aggregated values for an asset property.
flags:
    --aggregate-types=!: The data aggregating function.
    --asset-id=: The ID of the asset, in UUID format.
    --end-date=!: The inclusive end of the range from which to query historical data, expressed in seconds in Unix epoch time.
    --max-results=: The maximum number of results to return for each paginated request.
    --next-token=: The token to be used for the next set of paginated results.
    --property-alias=: The alias that identifies the property, such as an OPC-UA server data stream path (for example, `/company/windfarm/3/turbine/7/temperature`).
    --property-id=: The ID of the asset property, in UUID format.
    --qualities=: The quality by which to filter asset data.
    --resolution=!: The time interval over which to aggregate data.
    --start-date=!: The exclusive start of the range from which to query historical data, expressed in seconds in Unix epoch time.
    --time-ordering=: The chronological sorting order of the requested information.
completion:
    flag:
        time-ordering:
            - ASCENDING
            - DESCENDING
documentation:
    command: |-
        Gets aggregated values for an asset property. For more information, see [Querying aggregates](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/query-industrial-data.html#aggregates) in the *IoT SiteWise User Guide*.

        To identify an asset property, you must specify one of the following:

        - The `assetId` and `propertyId` of an asset property.
        - A `propertyAlias`, which is a data stream alias (for example, `/company/windfarm/3/turbine/7/temperature`). To define an asset property's alias, see [UpdateAssetProperty](https://docs.aws.amazon.com/iot-sitewise/latest/APIReference/API_UpdateAssetProperty.html).
    flag:
        aggregate-types: The data aggregating function.
        asset-id: The ID of the asset, in UUID format.
        end-date: The inclusive end of the range from which to query historical data, expressed in seconds in Unix epoch time.
        max-results: |-
            The maximum number of results to return for each paginated request. A result set is returned in the two cases, whichever occurs first.

            - The size of the result set is equal to 1 MB.
            - The number of data points in the result set is equal to the value of `maxResults`. The maximum value of `maxResults` is 2500.
        next-token: The token to be used for the next set of paginated results.
        property-alias: The alias that identifies the property, such as an OPC-UA server data stream path (for example, `/company/windfarm/3/turbine/7/temperature`). For more information, see [Mapping industrial data streams to asset properties](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/connect-data-streams.html) in the *IoT SiteWise User Guide*.
        property-id: The ID of the asset property, in UUID format.
        qualities: The quality by which to filter asset data.
        resolution: The time interval over which to aggregate data.
        start-date: The exclusive start of the range from which to query historical data, expressed in seconds in Unix epoch time.
        time-ordering: |-
            The chronological sorting order of the requested information.

            Default: `ASCENDING`
