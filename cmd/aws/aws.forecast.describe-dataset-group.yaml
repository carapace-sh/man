name: describe-dataset-group
description: Describes a dataset group created using the [CreateDatasetGroup](https://docs.aws.amazon.com/forecast/latest/dg/API_CreateDatasetGroup.html) operation.
flags:
    --dataset-group-arn=!: The Amazon Resource Name (ARN) of the dataset group.
documentation:
    command: |-
        Describes a dataset group created using the [CreateDatasetGroup](https://docs.aws.amazon.com/forecast/latest/dg/API_CreateDatasetGroup.html) operation.

        In addition to listing the parameters provided in the `CreateDatasetGroup` request, this operation includes the following properties:

        - `DatasetArns` - The datasets belonging to the group.
        - `CreationTime`
        - `LastModificationTime`
        - `Status`
    flag:
        dataset-group-arn: The Amazon Resource Name (ARN) of the dataset group.
