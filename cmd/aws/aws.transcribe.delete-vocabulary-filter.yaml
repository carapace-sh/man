name: delete-vocabulary-filter
description: Deletes a custom vocabulary filter.
flags:
    --vocabulary-filter-name=!: The name of the custom vocabulary filter you want to delete.
documentation:
    command: Deletes a custom vocabulary filter. To use this operation, specify the name of the custom vocabulary filter you want to delete using `VocabularyFilterName`. Custom vocabulary filter names are case sensitive.
    flag:
        vocabulary-filter-name: The name of the custom vocabulary filter you want to delete. Custom vocabulary filter names are case sensitive.
