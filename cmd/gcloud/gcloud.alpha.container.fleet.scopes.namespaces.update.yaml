name: update
description: '*(ALPHA)*  Update a fleet namespace.'
flags:
    --clear-labels: Remove all labels.
    --clear-namespace-labels: Remove all namespace-level labels from the cluster namespace.
    --no-clear-labels&: Remove all labels.
    --no-clear-namespace-labels&: Remove all namespace-level labels from the cluster namespace.
    --remove-labels=: List of label keys to remove.
    --remove-namespace-labels=: List of namespace-level label keys to remove in the cluster namespace.
    --scope=: the
    --update-labels=: List of label KEY=VALUE pairs to update.
    --update-namespace-labels=: List of namespace-level label KEY=VALUE pairs to update in the cluster namespace.
documentation:
    command: |-
        *(ALPHA)*  This command can fail for the following reasons:
        * The project specified does not exist.
        * The fleet namespace does not exist in the project.
        * The caller does not have permission to access the project or namespace.

        ## EXAMPLES

        To update the namespace `NAMESPACE` in the active project:

          $ gcloud alpha container fleet scopes namespaces update NAMESPACE

        To update the namespace `NAMESPACE` in project `PROJECT_ID`:

          $ gcloud alpha container fleet scopes namespaces update NAMESPACE --project=PROJECT_ID
    flag:
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        clear-namespace-labels: |-
            Remove all namespace-level labels from the cluster namespace. If `--update-namespace-labels` is also specified then
            `--clear-namespace-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} namespace_name --clear-namespace-labels
            +
            To remove all existing namespace-level labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} namespace_name --clear-namespace-labels --update-namespace-labels foo=bar,baz=qux
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        no-clear-namespace-labels: |
            Remove all namespace-level labels from the cluster namespace. If `--update-namespace-labels` is also specified then
            `--clear-namespace-labels` is applied first.

            For example, to remove all labels:

                $ {command} namespace_name --clear-namespace-labels

            To remove all existing namespace-level labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} namespace_name --clear-namespace-labels --update-namespace-labels foo=bar,baz=qux
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        remove-namespace-labels: |-
            List of namespace-level label keys to remove in the cluster namespace. If a label does not exist it is
            silently ignored. If `--update-namespace-labels` is also specified then
            `--update-namespace-labels` is applied first.
        scope: |-
            the
            +
            To set the `scope` attribute:
            * provide the argument `NAMESPACE` on the command line with a fully specified name;
            * provide the argument `--scope` on the command line.
        update-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        update-namespace-labels: |-
            List of namespace-level label KEY=VALUE pairs to update in the cluster namespace. If a
            label exists, its value is modified. Otherwise, a new label is'
            created.
