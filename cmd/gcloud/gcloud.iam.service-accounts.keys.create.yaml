name: create
description: Create a service account key.
flags:
    --iam-account=!: The service account for which to create a key.
    --key-file-type=: The type of key to create.
completion:
    flag:
        key-file-type:
            - json
            - p12
documentation:
    command: |-
        If the service account does not exist, this command returns a
        `PERMISSION_DENIED` error.
    flag:
        iam-account: |-
            The service account for which to create a key.
            +
            To list all service accounts in the project, run:
            +
              $ gcloud iam service-accounts list
        key-file-type: 'The type of key to create. _KEY_FILE_TYPE_ must be one of: *json*, *p12*.'
