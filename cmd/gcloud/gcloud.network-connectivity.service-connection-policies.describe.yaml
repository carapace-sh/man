name: describe
description: Describe a service connection policy.
flags:
    --region=: The location Id.
documentation:
    command: Retrieve and display details about a service connection policy.
    flag:
        region: |-
            The location Id.
            +

            To set the `region` attribute:
            * provide the argument `service_connection_policy` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
