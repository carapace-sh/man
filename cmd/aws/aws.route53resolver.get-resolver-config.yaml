    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --resource-id=!: Resource ID of the Amazon VPC that you want to get information about.
documentation:
    command: Retrieves the behavior configuration of Route 53 Resolver behavior for a single VPC from Amazon Virtual Private Cloud.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
