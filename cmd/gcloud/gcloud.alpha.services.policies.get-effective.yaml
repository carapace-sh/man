name: get-effective
description: '*(ALPHA)*  Get effective policy for a project, folder or organization.'
flags:
    --folder=: The Google Cloud Platform folder ID to use for this invocation.
    --organization=: The Google Cloud Platform organization ID to use for this invocation.
    --view=: The view of the effective policy.
completion:
    flag:
        view:
            - BASIC
            - FULL
documentation:
    command: |-
        *(ALPHA)*  Get effective policy for a project, folder or organization.

        ## EXAMPLES

         Get effective policy for the current project:

         $ gcloud alpha services policies get-effective

         Get effective policy for project `my-project`:

         $ gcloud alpha services policies get-effective --project=my-project
    flag:
        folder: The Google Cloud Platform folder ID to use for this invocation.
        organization: The Google Cloud Platform organization ID to use for this invocation.
        view: 'The view of the effective policy. BASIC includes basic metadata about the effective policy. FULL includes every information related to effective policy. _VIEW_ must be one of: *BASIC*, *FULL*.'
