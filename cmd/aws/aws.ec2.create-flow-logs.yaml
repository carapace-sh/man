name: create-flow-logs
description: Creates one or more flow logs to capture information about IP traffic for a specific network interface, subnet, or VPC.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --deliver-cross-account-role=: The ARN of the IAM role that allows Amazon EC2 to publish flow logs across accounts.
    --deliver-logs-permission-arn=: The ARN of the IAM role that allows Amazon EC2 to publish flow logs to the log destination.
    --destination-options=: The destination options.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --log-destination-type=: The type of destination for the flow log data.
    --log-destination=: The destination for the flow log data.
    --log-format=: The fields to include in the flow log record.
    --log-group-name=: The name of a new or existing CloudWatch Logs log group where Amazon EC2 publishes your flow logs.
    --max-aggregation-interval=: The maximum interval of time during which a flow of packets is captured and aggregated into a flow log record.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --resource-ids=!:
        description: The IDs of the resources to monitor.
        nargs: -1
    --resource-type=!: The type of resource to monitor.
    --tag-specifications=:
        description: The tags to apply to the flow logs.
        nargs: -1
    --traffic-type=: The type of traffic to monitor (accepted traffic, rejected traffic, or all traffic).
completion:
    flag:
        log-destination-type:
            - cloud-watch-logs
            - s3
            - kinesis-data-firehose
        resource-type:
            - VPC
            - Subnet
            - NetworkInterface
            - TransitGateway
            - TransitGatewayAttachment
            - RegionalNatGateway
        traffic-type:
            - ACCEPT
            - REJECT
            - ALL
documentation:
    command: |-
        Creates one or more flow logs to capture information about IP traffic for a specific network interface, subnet, or VPC.

        Flow log data for a monitored network interface is recorded as flow log records, which are log events consisting of fields that describe the traffic flow. For more information, see [Flow log records](https://docs.aws.amazon.com/vpc/latest/userguide/flow-log-records.html) in the *Amazon VPC User Guide*.

        When publishing to CloudWatch Logs, flow log records are published to a log group, and each network interface has a unique log stream in the log group. When publishing to Amazon S3, flow log records for all of the monitored network interfaces are published to a single log file object that is stored in the specified bucket.

        For more information, see [VPC Flow Logs](https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html) in the *Amazon VPC User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request. For more information, see [How to ensure idempotency](https://docs.aws.amazon.com/ec2/latest/devguide/ec2-api-idempotency.html).
        deliver-cross-account-role: The ARN of the IAM role that allows Amazon EC2 to publish flow logs across accounts.
        deliver-logs-permission-arn: |-
            The ARN of the IAM role that allows Amazon EC2 to publish flow logs to the log destination.

            This parameter is required if the destination type is `cloud-watch-logs`, or if the destination type is `kinesis-data-firehose` and the delivery stream and the resources to monitor are in different accounts.
        destination-options: The destination options.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        log-destination: "The destination for the flow log data. The meaning of this parameter depends on the destination type.\n\n- If the destination type is `cloud-watch-logs`, specify the ARN of a CloudWatch Logs log group. For example:\n  \n  arn:aws:logs:*region*:*account\\_id*:log-group:*my\\_group*\n  \n  Alternatively, use the `LogGroupName` parameter.\n- If the destination type is `s3`, specify the ARN of an S3 bucket. For example:\n  \n  arn:aws:s3:::*my\\_bucket*/*my\\_subfolder*/\n  \n  The subfolder is optional. Note that you can't use `AWSLogs` as a subfolder name.\n- If the destination type is `kinesis-data-firehose`, specify the ARN of a Kinesis Data Firehose delivery stream. For example:\n  \n  arn:aws:firehose:*region*:*account\\_id*:deliverystream:*my\\_stream*"
        log-destination-type: |-
            The type of destination for the flow log data.

            Default: `cloud-watch-logs`
        log-format: |-
            The fields to include in the flow log record. List the fields in the order in which they should appear. If you omit this parameter, the flow log is created using the default format. If you specify this parameter, you must include at least one field. For more information about the available fields, see [Flow log records](https://docs.aws.amazon.com/vpc/latest/userguide/flow-log-records.html) in the *Amazon VPC User Guide* or [Transit Gateway Flow Log records](https://docs.aws.amazon.com/vpc/latest/tgw/tgw-flow-logs.html#flow-log-records) in the *Amazon Web Services Transit Gateway Guide*.

            Specify the fields using the `${field-id}` format, separated by spaces.
        log-group-name: |-
            The name of a new or existing CloudWatch Logs log group where Amazon EC2 publishes your flow logs.

            This parameter is valid only if the destination type is `cloud-watch-logs`.
        max-aggregation-interval: |-
            The maximum interval of time during which a flow of packets is captured and aggregated into a flow log record. The possible values are 60 seconds (1 minute) or 600 seconds (10 minutes). This parameter must be 60 seconds for transit gateway resource types.

            When a network interface is attached to a [Nitro-based instance](https://docs.aws.amazon.com/ec2/latest/instancetypes/ec2-nitro-instances.html), the aggregation interval is always 60 seconds or less, regardless of the value that you specify.

            Default: 600
        resource-ids: |-
            The IDs of the resources to monitor. For example, if the resource type is `VPC`, specify the IDs of the VPCs.

            Constraints: Maximum of 25 for transit gateway resource types. Maximum of 1000 for the other resource types.
        resource-type: The type of resource to monitor.
        tag-specifications: The tags to apply to the flow logs.
        traffic-type: The type of traffic to monitor (accepted traffic, rejected traffic, or all traffic). This parameter is not supported for transit gateway resource types. It is required for the other resource types.
