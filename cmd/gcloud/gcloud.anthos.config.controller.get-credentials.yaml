name: get-credentials
description: Fetch credentials for a running Anthos Config Controller.
flags:
    --location=!: The location (region) of the Anthos Config Controller.
documentation:
    command: |-
        gcloud anthos config controller get-credentials updates a `kubeconfig` file with appropriate credentials and
        endpoint information to point `kubectl` at a specific
        Anthos Config Controller.
    flag:
        location: The location (region) of the Anthos Config Controller.
