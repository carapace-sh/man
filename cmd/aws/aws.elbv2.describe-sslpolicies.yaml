name: describe-sslpolicies
description: Describes the specified policies or all policies used for SSL negotiation.
flags:
    --load-balancer-type=: The type of load balancer.
    --marker=: The marker for the next set of results.
    --names=: The names of the policies.
    --page-size=: The maximum number of results to return with this call.
completion:
    flag:
        load-balancer-type:
            - application
            - network
            - gateway
documentation:
    command: |-
        Describes the specified policies or all policies used for SSL negotiation.

        For more information, see [Security policies](https://docs.aws.amazon.com/elasticloadbalancing/latest/application/describe-ssl-policies.html) in the *Application Load Balancers Guide* and [Security policies](https://docs.aws.amazon.com/elasticloadbalancing/latest/network/describe-ssl-policies.html) in the *Network Load Balancers Guide*.
    flag:
        load-balancer-type: The type of load balancer. The default lists the SSL policies for all load balancers.
        marker: The marker for the next set of results. (You received this marker from a previous call.)
        names: The names of the policies.
        page-size: The maximum number of results to return with this call.
