name: get-policy-store
description: Retrieves details about a policy store.
flags:
    --no-tags&: Specifies whether to return the tags that are attached to the policy store.
    --policy-store-id=!: Specifies the ID of the policy store that you want information about.
    --tags: Specifies whether to return the tags that are attached to the policy store.
documentation:
    command: Retrieves details about a policy store.
    flag:
        policy-store-id: Specifies the ID of the policy store that you want information about.
        tags: |-
            Specifies whether to return the tags that are attached to the policy store. If this parameter is included in the API call, the tags are returned, otherwise they are not returned.

            If this parameter is included in the API call but there are no tags attached to the policy store, the `tags` response parameter is omitted from the response.
