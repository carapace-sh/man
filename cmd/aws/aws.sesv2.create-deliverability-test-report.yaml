name: create-deliverability-test-report
description: Create a new predictive inbox placement test.
flags:
    --content=!: The HTML body of the message that you sent when you performed the predictive inbox placement test.
    --from-email-address=!: The email address that the predictive inbox placement test email was sent from.
    --report-name=: A unique name that helps you to identify the predictive inbox placement test when you retrieve the results.
    --tags=: An array of objects that define the tags (keys and values) that you want to associate with the predictive inbox placement test.
documentation:
    command: Create a new predictive inbox placement test. Predictive inbox placement tests can help you predict how your messages will be handled by various email providers around the world. When you perform a predictive inbox placement test, you provide a sample message that contains the content that you plan to send to your customers. Amazon SES then sends that message to special email addresses spread across several major email providers. After about 24 hours, the test is complete, and you can use the `GetDeliverabilityTestReport` operation to view the results of the test.
    flag:
        content: The HTML body of the message that you sent when you performed the predictive inbox placement test.
        from-email-address: The email address that the predictive inbox placement test email was sent from.
        report-name: A unique name that helps you to identify the predictive inbox placement test when you retrieve the results.
        tags: An array of objects that define the tags (keys and values) that you want to associate with the predictive inbox placement test.
