name: update-express-gateway-service
description: Updates an existing Express service configuration.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cpu=: The number of CPU units used by the task.
    --execution-role-arn=: The Amazon Resource Name (ARN) of the task execution role for the Express service.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --health-check-path=: The path on the container for Application Load Balancer health checks.
    --memory=: The amount of memory (in MiB) used by the task.
    --monitor-resources=: ' Enable live monitoring of service resource status'
    --network-configuration=: The network configuration for the Express service tasks.
    --primary-container=: The primary container configuration for the Express service.
    --scaling-target=: The auto-scaling configuration for the Express service.
    --service-arn=!: The Amazon Resource Name (ARN) of the Express service to update.
    --task-role-arn=: The Amazon Resource Name (ARN) of the IAM role for containers in this task.
documentation:
    command: |-
        Updates an existing Express service configuration. Modifies container settings, resource allocation, auto-scaling configuration, and other service parameters without recreating the service.

        Amazon ECS creates a new service revision with updated configuration and performs a rolling deployment to replace existing tasks. The service remains available during updates, ensuring zero-downtime deployments.

        Some parameters like the infrastructure role cannot be modified after service creation and require creating a new service.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cpu: The number of CPU units used by the task.
        execution-role-arn: The Amazon Resource Name (ARN) of the task execution role for the Express service.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        health-check-path: The path on the container for Application Load Balancer health checks.
        memory: The amount of memory (in MiB) used by the task.
        network-configuration: The network configuration for the Express service tasks. By default, the network configuration for an Express service uses the default VPC.
        primary-container: The primary container configuration for the Express service.
        scaling-target: The auto-scaling configuration for the Express service.
        service-arn: The Amazon Resource Name (ARN) of the Express service to update.
        task-role-arn: The Amazon Resource Name (ARN) of the IAM role for containers in this task.
