name: set-risk-configuration
description: Configures threat protection for a user pool or app client.
flags:
    --account-takeover-risk-configuration=: The settings for automated responses and notification templates for adaptive authentication with threat protection.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-id=: The ID of the app client where you want to set a risk configuration.
    --compromised-credentials-risk-configuration=: The configuration of automated reactions to detected compromised credentials.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --risk-exception-configuration=: A set of IP-address overrides to threat protection.
    --user-pool-id=!: The ID of the user pool where you want to set a risk configuration.
documentation:
    command: |-
        Configures threat protection for a user pool or app client. Sets configuration for the following.

        - Responses to risks with adaptive authentication
        - Responses to vulnerable passwords with compromised-credentials detection
        - Notifications to users who have had risky activity detected
        - IP-address denylist and allowlist

        To set the risk configuration for the user pool to defaults, send this request with only the `UserPoolId` parameter. To reset the threat protection settings of an app client to be inherited from the user pool, send `UserPoolId` and `ClientId` parameters only. To change threat protection to audit-only or off, update the value of `UserPoolAddOns` in an `UpdateUserPool` request. To activate this setting, your user pool must be on the [Plus tier](https://docs.aws.amazon.com/cognito/latest/developerguide/feature-plans-features-plus.html).
    flag:
        account-takeover-risk-configuration: The settings for automated responses and notification templates for adaptive authentication with threat protection.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-id: |-
            The ID of the app client where you want to set a risk configuration. If `ClientId` is null, then the risk configuration is mapped to `UserPoolId`. When the client ID is null, the same risk configuration is applied to all the clients in the userPool.

            When you include a `ClientId` parameter, Amazon Cognito maps the configuration to the app client. When you include both `ClientId` and `UserPoolId`, Amazon Cognito maps the configuration to the app client only.
        compromised-credentials-risk-configuration: The configuration of automated reactions to detected compromised credentials. Includes settings for blocking future sign-in requests and for the types of password-submission events you want to monitor.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        risk-exception-configuration: A set of IP-address overrides to threat protection. You can set up IP-address always-block and always-allow lists.
        user-pool-id: The ID of the user pool where you want to set a risk configuration. If you include `UserPoolId` in your request, don't include `ClientId`. When the client ID is null, the same risk configuration is applied to all the clients in the userPool. When you include both `ClientId` and `UserPoolId`, Amazon Cognito maps the configuration to the app client only.
