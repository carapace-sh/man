name: delete-activation
description: Deletes an activation.
flags:
    --activation-id=!: The ID of the activation that you want to delete.
documentation:
    command: Deletes an activation. You aren't required to delete an activation. If you delete an activation, you can no longer use it to register additional managed nodes. Deleting an activation doesn't de-register managed nodes. You must manually de-register managed nodes.
    flag:
        activation-id: The ID of the activation that you want to delete.
