name: update-application
description: Updates the specified application to have the specified properties.
flags:
    --application-name=!: The name of the application to update.
    --description=: A new description for the application.
documentation:
    command: |-
        Updates the specified application to have the specified properties.

        If a property (for example, `description`) is not provided, the value remains unchanged. To clear these properties, specify an empty string.
    flag:
        application-name: The name of the application to update. If no such application is found, `UpdateApplication` returns an `InvalidParameterValue` error.
        description: |-
            A new description for the application.

            Default: If not specified, AWS Elastic Beanstalk does not update the description.
