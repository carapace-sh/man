name: delete-trial-component
description: Deletes the specified trial component.
flags:
    --trial-component-name=!: The name of the component to delete.
documentation:
    command: Deletes the specified trial component. A trial component must be disassociated from all trials before the trial component can be deleted. To disassociate a trial component from a trial, call the [DisassociateTrialComponent](https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_DisassociateTrialComponent.html) API.
    flag:
        trial-component-name: The name of the component to delete.
