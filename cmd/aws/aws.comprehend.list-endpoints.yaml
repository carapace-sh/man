name: list-endpoints
description: Gets a list of all existing endpoints that you've created.
flags:
    --filter=: Filters the endpoints that are returned.
    --max-results=: The maximum number of results to return in each page.
    --next-token=: Identifies the next page of results to return.
documentation:
    command: Gets a list of all existing endpoints that you've created. For information about endpoints, see [Managing endpoints](https://docs.aws.amazon.com/comprehend/latest/dg/manage-endpoints.html).
    flag:
        filter: Filters the endpoints that are returned. You can filter endpoints on their name, model, status, or the date and time that they were created. You can only set one filter at a time.
        max-results: The maximum number of results to return in each page. The default is 100.
        next-token: Identifies the next page of results to return.
