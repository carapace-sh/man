name: untag-resource
description: Detaches a key-value pair from a resource, as identified by its Amazon Resource Name (ARN).
flags:
    --arn=!: The value of the resource that will have the tag removed.
    --tag-keys=!: Specifies a list of tag keys that you want to remove from the specified resources.
documentation:
    command: Detaches a key-value pair from a resource, as identified by its Amazon Resource Name (ARN). Taggable resources in AWS User Notifications Contacts include email contacts..
    flag:
        arn: The value of the resource that will have the tag removed. An Amazon Resource Name (ARN) is an identifier for a specific AWS resource, such as a server, user, or role.
        tag-keys: Specifies a list of tag keys that you want to remove from the specified resources.
