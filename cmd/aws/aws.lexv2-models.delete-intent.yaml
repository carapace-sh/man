name: delete-intent
description: Removes the specified intent.
flags:
    --bot-id=!: The identifier of the bot associated with the intent.
    --bot-version=!: The version of the bot associated with the intent.
    --intent-id=!: The unique identifier of the intent to delete.
    --locale-id=!: The identifier of the language and locale where the bot will be deleted.
documentation:
    command: |-
        Removes the specified intent.

        Deleting an intent also deletes the slots associated with the intent.
    flag:
        bot-id: The identifier of the bot associated with the intent.
        bot-version: The version of the bot associated with the intent.
        intent-id: The unique identifier of the intent to delete.
        locale-id: The identifier of the language and locale where the bot will be deleted. The string must match one of the supported locales. For more information, see [Supported languages](https://docs.aws.amazon.com/lexv2/latest/dg/how-languages.html).
