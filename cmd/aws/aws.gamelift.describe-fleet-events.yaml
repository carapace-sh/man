name: describe-fleet-events
description: |-
    **This API works with the following fleet types:** EC2, Anywhere, Container

    Retrieves entries from a fleet's event log.
flags:
    --end-time=: The most recent date to retrieve event logs for.
    --fleet-id=!: A unique identifier for the fleet to get event logs for.
    --limit=: The maximum number of results to return.
    --next-token=: A token that indicates the start of the next sequential page of results.
    --start-time=: The earliest date to retrieve event logs for.
documentation:
    command: |-
        **This API works with the following fleet types:** EC2, Anywhere, Container

        Retrieves entries from a fleet's event log. Fleet events are initiated by changes in status, such as during fleet creation and termination, changes in capacity, etc. If a fleet has multiple locations, events are also initiated by changes to status and capacity in remote locations.

        You can specify a time range to limit the result set. Use the pagination parameters to retrieve results as a set of sequential pages.

        If successful, a collection of event log entries matching the request are returned.

        **Learn more**

        [Setting up Amazon GameLift Servers fleets](https://docs.aws.amazon.com/gamelift/latest/developerguide/fleets-intro.html)
    flag:
        end-time: 'The most recent date to retrieve event logs for. If no end time is specified, this call returns entries from the specified start time up to the present. Format is a number expressed in Unix time as milliseconds (ex: "1469498468.057").'
        fleet-id: A unique identifier for the fleet to get event logs for. You can use either the fleet ID or ARN value.
        limit: The maximum number of results to return. Use this parameter with `NextToken` to get results as a set of sequential pages.
        next-token: A token that indicates the start of the next sequential page of results. Use the token that is returned with a previous call to this operation. To start at the beginning of the result set, do not specify a value.
        start-time: 'The earliest date to retrieve event logs for. If no start time is specified, this call returns entries starting from when the fleet was created to the specified end time. Format is a number expressed in Unix time as milliseconds (ex: "1469498468.057").'
