name: create-adapter-version
description: Creates a new version of an adapter.
flags:
    --adapter-id=!: A string containing a unique ID for the adapter that will receive a new version.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=: Idempotent token is used to recognize the request.
    --dataset-config=!: Specifies a dataset used to train a new adapter version.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --kms-key-id=: The identifier for your AWS Key Management Service key (AWS KMS key).
    --output-config=!: ""
    --tags=: A set of tags (key-value pairs) that you want to attach to the adapter version.
documentation:
    command: Creates a new version of an adapter. Operates on a provided AdapterId and a specified dataset provided via the DatasetConfig argument. Requires that you specify an Amazon S3 bucket with the OutputConfig argument. You can provide an optional KMSKeyId, an optional ClientRequestToken, and optional tags.
    flag:
        adapter-id: A string containing a unique ID for the adapter that will receive a new version.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: Idempotent token is used to recognize the request. If the same token is used with multiple CreateAdapterVersion requests, the same session is returned. This token is employed to avoid unintentionally creating the same session multiple times.
        dataset-config: Specifies a dataset used to train a new adapter version. Takes a ManifestS3Object as the value.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        kms-key-id: The identifier for your AWS Key Management Service key (AWS KMS key). Used to encrypt your documents.
        output-config: ""
        tags: A set of tags (key-value pairs) that you want to attach to the adapter version.
