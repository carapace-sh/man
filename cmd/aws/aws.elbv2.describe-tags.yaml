name: describe-tags
description: Describes the tags for the specified Elastic Load Balancing resources.
flags:
    --resource-arns=!: The Amazon Resource Names (ARN) of the resources.
documentation:
    command: Describes the tags for the specified Elastic Load Balancing resources. You can describe the tags for one or more Application Load Balancers, Network Load Balancers, Gateway Load Balancers, target groups, listeners, or rules.
    flag:
        resource-arns: The Amazon Resource Names (ARN) of the resources. You can specify up to 20 resources in a single call.
