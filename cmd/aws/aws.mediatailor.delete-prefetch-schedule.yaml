name: delete-prefetch-schedule
description: Deletes a prefetch schedule for a specific playback configuration.
flags:
    --name=!: The name of the prefetch schedule.
    --playback-configuration-name=!: The name of the playback configuration for this prefetch schedule.
documentation:
    command: Deletes a prefetch schedule for a specific playback configuration. If you call `DeletePrefetchSchedule` on an expired prefetch schedule, MediaTailor returns an HTTP 404 status code. For more information about ad prefetching, see [Using ad prefetching](https://docs.aws.amazon.com/mediatailor/latest/ug/prefetching-ads.html) in the *MediaTailor User Guide*.
    flag:
        name: The name of the prefetch schedule. If the action is successful, the service sends back an HTTP 204 response with an empty HTTP body.
        playback-configuration-name: The name of the playback configuration for this prefetch schedule.
