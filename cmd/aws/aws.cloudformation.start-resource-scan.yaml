name: start-resource-scan
description: Starts a scan of the resources in this account in this Region.
flags:
    --client-request-token=: A unique identifier for this `StartResourceScan` request.
    --scan-filters=: The scan filters to use.
documentation:
    command: Starts a scan of the resources in this account in this Region. You can the status of a scan using the `ListResourceScans` API action.
    flag:
        client-request-token: A unique identifier for this `StartResourceScan` request. Specify this token if you plan to retry requests so that CloudFormation knows that you're not attempting to start a new resource scan.
        scan-filters: The scan filters to use.
