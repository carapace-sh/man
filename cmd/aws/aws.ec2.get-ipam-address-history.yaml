name: get-ipam-address-history
description: Retrieve historical information about a CIDR within an IPAM scope.
flags:
    --cidr=!: The CIDR you want the history of.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --end-time=: The end of the time period for which you are looking for history.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ipam-scope-id=!: The ID of the IPAM scope that the CIDR is in.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of historical results you would like returned per page.
    --next-token=: The token for the next page of results.
    --no-dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --page-size=: The size of each page to get in the AWS service call.
    --start-time=: The start of the time period for which you are looking for history.
    --starting-token=: A token to specify where to start paginating.
    --vpc-id=: The ID of the VPC you want your history records filtered by.
documentation:
    command: Retrieve historical information about a CIDR within an IPAM scope. For more information, see [View the history of IP addresses](https://docs.aws.amazon.com/vpc/latest/ipam/view-history-cidr-ipam.html) in the *Amazon VPC IPAM User Guide*.
    flag:
        cidr: The CIDR you want the history of. The CIDR can be an IPv4 or IPv6 IP address range. If you enter a /16 IPv4 CIDR, you will get records that match it exactly. You will not get records for any subnets within the /16 CIDR.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        end-time: The end of the time period for which you are looking for history. If you omit this option, it will default to the current time.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ipam-scope-id: The ID of the IPAM scope that the CIDR is in.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of historical results you would like returned per page. Defaults to 100.
        next-token: The token for the next page of results.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        start-time: The start of the time period for which you are looking for history. If you omit this option, it will default to the value of EndTime.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        vpc-id: The ID of the VPC you want your history records filtered by.
