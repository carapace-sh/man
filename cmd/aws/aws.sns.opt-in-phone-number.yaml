name: opt-in-phone-number
description: Use this request to opt in a phone number that is opted out, which enables you to resume sending SMS messages to the number.
flags:
    --phone-number=!: The phone number to opt in.
documentation:
    command: |-
        Use this request to opt in a phone number that is opted out, which enables you to resume sending SMS messages to the number.

        You can opt in a phone number only once every 30 days.
    flag:
        phone-number: The phone number to opt in. Use E.164 format.
