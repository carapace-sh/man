name: create-stack
description: Creates a stack to start streaming applications to users.
flags:
    --access-endpoints=: The list of interface VPC endpoint (interface endpoint) objects.
    --application-settings=: The persistent application settings for users of a stack.
    --description=: The description to display.
    --display-name=: The stack name to display.
    --embed-host-domains=: The domains where AppStream 2.0 streaming sessions can be embedded in an iframe.
    --feedback-url=: The URL that users are redirected to after they click the Send Feedback link.
    --name=!: The name of the stack.
    --redirect-url=: The URL that users are redirected to after their streaming session ends.
    --storage-connectors=: The storage connectors to enable.
    --streaming-experience-settings=: The streaming protocol you want your stack to prefer.
    --tags=: The tags to associate with the stack.
    --user-settings=: The actions that are enabled or disabled for users during their streaming sessions.
documentation:
    command: Creates a stack to start streaming applications to users. A stack consists of an associated fleet, user access policies, and storage configurations.
    flag:
        access-endpoints: The list of interface VPC endpoint (interface endpoint) objects. Users of the stack can connect to AppStream 2.0 only through the specified endpoints.
        application-settings: The persistent application settings for users of a stack. When these settings are enabled, changes that users make to applications and Windows settings are automatically saved after each session and applied to the next session.
        description: The description to display.
        display-name: The stack name to display.
        embed-host-domains: The domains where AppStream 2.0 streaming sessions can be embedded in an iframe. You must approve the domains that you want to host embedded AppStream 2.0 streaming sessions.
        feedback-url: The URL that users are redirected to after they click the Send Feedback link. If no URL is specified, no Send Feedback link is displayed.
        name: The name of the stack.
        redirect-url: The URL that users are redirected to after their streaming session ends.
        storage-connectors: The storage connectors to enable.
        streaming-experience-settings: The streaming protocol you want your stack to prefer. This can be UDP or TCP. Currently, UDP is only supported in the Windows native client.
        tags: |-
            The tags to associate with the stack. A tag is a key-value pair, and the value is optional. For example, Environment=Test. If you do not specify a value, Environment=.

            If you do not specify a value, the value is set to an empty string.

            Generally allowed characters are: letters, numbers, and spaces representable in UTF-8, and the following special characters:

            _ . : / = + \\ - @

            For more information about tags, see [Tagging Your Resources](https://docs.aws.amazon.com/appstream2/latest/developerguide/tagging-basic.html) in the *Amazon AppStream 2.0 Administration Guide*.
        user-settings: The actions that are enabled or disabled for users during their streaming sessions. By default, these actions are enabled.
