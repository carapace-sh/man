name: create-cluster-subnet-group
description: Creates a new Amazon Redshift subnet group.
flags:
    --cluster-subnet-group-name=!: The name for the subnet group.
    --description=!: A description for the subnet group.
    --subnet-ids=!: An array of VPC subnet IDs.
    --tags=: A list of tag instances.
documentation:
    command: |-
        Creates a new Amazon Redshift subnet group. You must provide a list of one or more subnets in your existing Amazon Virtual Private Cloud (Amazon VPC) when creating Amazon Redshift subnet group.

        For information about subnet groups, go to [Amazon Redshift Cluster Subnet Groups](https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-cluster-subnet-groups.html) in the *Amazon Redshift Cluster Management Guide*.
    flag:
        cluster-subnet-group-name: |-
            The name for the subnet group. Amazon Redshift stores the value as a lowercase string.

            Constraints:

            - Must contain no more than 255 alphanumeric characters or hyphens.
            - Must not be "Default".
            - Must be unique for all subnet groups that are created by your Amazon Web Services account.

            Example: `examplesubnetgroup`
        description: A description for the subnet group.
        subnet-ids: An array of VPC subnet IDs. A maximum of 20 subnets can be modified in a single request.
        tags: A list of tag instances.
