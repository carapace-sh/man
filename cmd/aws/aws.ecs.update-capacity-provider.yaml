name: update-capacity-provider
description: Modifies the parameters for a capacity provider.
flags:
    --auto-scaling-group-provider=: An object that represent the parameters to update for the Auto Scaling group capacity provider.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cluster=: The name of the cluster that contains the capacity provider to update.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --managed-instances-provider=: The updated configuration for the Amazon ECS Managed Instances provider.
    --name=!: The name of the capacity provider to update.
documentation:
    command: |-
        Modifies the parameters for a capacity provider.

        These changes only apply to new Amazon ECS Managed Instances, or EC2 instances, not existing ones.
    flag:
        auto-scaling-group-provider: An object that represent the parameters to update for the Auto Scaling group capacity provider.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cluster: The name of the cluster that contains the capacity provider to update. Managed instances capacity providers are cluster-scoped and can only be updated within their associated cluster.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        managed-instances-provider: The updated configuration for the Amazon ECS Managed Instances provider. You can modify the infrastructure role, instance launch template, and tag propagation settings. Changes take effect for new instances launched after the update.
        name: The name of the capacity provider to update.
