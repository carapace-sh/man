name: compose-environments
description: Create or update a group of environments that each run a separate component of a single application.
flags:
    --application-name=: The name of the application to which the specified source bundles belong.
    --group-name=: The name of the group to which the target environments belong.
    --version-labels=: A list of version labels, specifying one or more application source bundles that belong to the target application.
documentation:
    command: Create or update a group of environments that each run a separate component of a single application. Takes a list of version labels that specify application source bundles for each of the environments to create or update. The name of each environment and other required information must be included in the source bundles in an environment manifest named `env.yaml`. See [Compose Environments](https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/environment-mgmt-compose.html) for details.
    flag:
        application-name: The name of the application to which the specified source bundles belong.
        group-name: The name of the group to which the target environments belong. Specify a group name only if the environment name defined in each target environment's manifest ends with a + (plus) character. See [Environment Manifest (env.yaml)](https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/environment-cfg-manifest.html) for details.
        version-labels: A list of version labels, specifying one or more application source bundles that belong to the target application. Each source bundle must include an environment manifest that specifies the name of the environment and the name of the solution stack to use, and optionally can specify environment links to create.
