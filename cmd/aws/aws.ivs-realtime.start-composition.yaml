name: start-composition
description: Starts a Composition from a stage based on the configuration provided in the request.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --destinations=!: Array of destination configuration.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --idempotency-token=: Idempotency token.
    --layout=: Layout object to configure composition parameters.
    --stage-arn=!: ARN of the stage to be used for compositing.
    --tags=: Tags attached to the resource.
documentation:
    command: |-
        Starts a Composition from a stage based on the configuration provided in the request.

        A Composition is an ephemeral resource that exists after this operation returns successfully. Composition stops and the resource is deleted:

        - When [StopComposition]() is called.
        - After a 1-minute timeout, when all participants are disconnected from the stage.
        - After a 1-minute timeout, if there are no participants in the stage when StartComposition is called.
        - When broadcasting to the IVS channel fails and all retries are exhausted.
        - When broadcasting is disconnected and all attempts to reconnect are exhausted.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        destinations: Array of destination configuration.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        idempotency-token: Idempotency token.
        layout: Layout object to configure composition parameters.
        stage-arn: ARN of the stage to be used for compositing.
        tags: Tags attached to the resource. Array of maps, each of the form `string:string (key:value)`. See [Best practices and strategies](https://docs.aws.amazon.com/tag-editor/latest/userguide/best-practices-and-strats.html) in *Tagging AWS Resources and Tag Editor* for details, including restrictions that apply to tags and "Tag naming limits and requirements"; Amazon IVS has no constraints on tags beyond what is documented there.
