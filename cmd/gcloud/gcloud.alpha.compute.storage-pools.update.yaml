name: update
description: '*(ALPHA)*  Update a storage pool.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: Description of the storage pool.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --provisioned-capacity=: Provisioned capacity of the storage pool.
    --provisioned-iops=: IOPS to provision the pool with.
    --provisioned-throughput=: Throughput in MB/s provision the pool with.
    --zone=: The name of the Google Compute Engine zone.
documentation:
    command: '*(ALPHA)*  Update a storage pool.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: Description of the storage pool.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        provisioned-capacity: Provisioned capacity of the storage pool.
        provisioned-iops: IOPS to provision the pool with.
        provisioned-throughput: Throughput in MB/s provision the pool with.
        zone: |-
            The name of the Google Compute Engine zone.
            +
            To set the `zone` attribute:
            * provide the argument `storage_pool` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line;
            * set the property `compute/zone`.
