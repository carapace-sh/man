name: untag-resource
description: Removes the specified tags from an Amazon Managed Service for Prometheus resource.
flags:
    --resource-arn=!: The ARN of the resource from which to remove a tag.
    --tag-keys=!: The keys of the tags to remove.
documentation:
    command: Removes the specified tags from an Amazon Managed Service for Prometheus resource. The only resources that can be tagged are rule groups namespaces, scrapers, and workspaces.
    flag:
        resource-arn: The ARN of the resource from which to remove a tag.
        tag-keys: The keys of the tags to remove.
