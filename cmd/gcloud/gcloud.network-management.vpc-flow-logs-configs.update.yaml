    --network=: Traffic will be logged from VMs, VPN tunnels and Interconnect Attachments
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-labels&: Clear labels value and set to empty map.
    --no-clear-metadata-fields&: Clear metadata_fields value and set to empty list.
    --organization=: The organization id of the vpcFlowLogsConfig resource.
    --remove-labels=: Remove existing value from map labels.
    --remove-metadata-fields=: Remove existing value from metadata_fields list.
