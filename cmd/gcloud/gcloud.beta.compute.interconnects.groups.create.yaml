name: create
description: '*(BETA)*  Create a Compute Engine interconnect group.'
flags:
    --description=: An optional, textual description for the interconnect group.
    --intended-topology-capability=!: The reliability the user intends this group to be capable of, in terms of
    --interconnects=: Member interconnects to add to the interconnect group initially.
documentation:
    command: |
        *(BETA)*  *gcloud beta compute interconnects groups create* is used to create interconnect groups. An interconnect group
        connects a set of redundant interconnects between Google and the
        customer.

        For an example, refer to the *EXAMPLES* section below.
    flag:
        description: An optional, textual description for the interconnect group.
        intended-topology-capability: |-
            The reliability the user intends this group to be capable of, in terms of
            the Interconnect product SLAs.
        interconnects: Member interconnects to add to the interconnect group initially.
