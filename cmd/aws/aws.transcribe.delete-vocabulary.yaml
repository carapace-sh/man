name: delete-vocabulary
description: Deletes a custom vocabulary.
flags:
    --vocabulary-name=!: The name of the custom vocabulary you want to delete.
documentation:
    command: Deletes a custom vocabulary. To use this operation, specify the name of the custom vocabulary you want to delete using `VocabularyName`. Custom vocabulary names are case sensitive.
    flag:
        vocabulary-name: The name of the custom vocabulary you want to delete. Custom vocabulary names are case sensitive.
