name: wait
description: '*(ALPHA)*  Poll long-running video analysis operation until it completes.'
flags:
    --location=: Location of the operation.
documentation:
    command: |
        *(ALPHA)*  Poll a long-running video analysis operation until it completes. When
        the operation is complete, this command will display the results of the
        analysis.
    flag:
        location: |-
            Location of the operation.
            +
            To set the `location` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
