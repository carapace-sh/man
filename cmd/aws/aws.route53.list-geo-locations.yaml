name: list-geo-locations
description: Retrieves a list of supported geographic locations.
flags:
    --max-items=: (Optional) The maximum number of geolocations to be included in the response body for this request.
    --start-continent-code=: The code for the continent with which you want to start listing locations that Amazon Route 53 supports for geolocation.
    --start-country-code=: The code for the country with which you want to start listing locations that Amazon Route 53 supports for geolocation.
    --start-subdivision-code=: The code for the state of the United States with which you want to start listing locations that Amazon Route 53 supports for geolocation.
documentation:
    command: |-
        Retrieves a list of supported geographic locations.

        Countries are listed first, and continents are listed last. If Amazon Route 53 supports subdivisions for a country (for example, states or provinces), the subdivisions for that country are listed in alphabetical order immediately after the corresponding country.

        Route 53 does not perform authorization for this API because it retrieves information that is already available to the public.

        For a list of supported geolocation codes, see the [GeoLocation](https://docs.aws.amazon.com/Route53/latest/APIReference/API_GeoLocation.html) data type.
    flag:
        max-items: (Optional) The maximum number of geolocations to be included in the response body for this request. If more than `maxitems` geolocations remain to be listed, then the value of the `IsTruncated` element in the response is `true`.
        start-continent-code: |-
            The code for the continent with which you want to start listing locations that Amazon Route 53 supports for geolocation. If Route 53 has already returned a page or more of results, if `IsTruncated` is true, and if `NextContinentCode` from the previous response has a value, enter that value in `startcontinentcode` to return the next page of results.

            Include `startcontinentcode` only if you want to list continents. Don't include `startcontinentcode` when you're listing countries or countries with their subdivisions.
        start-country-code: The code for the country with which you want to start listing locations that Amazon Route 53 supports for geolocation. If Route 53 has already returned a page or more of results, if `IsTruncated` is `true`, and if `NextCountryCode` from the previous response has a value, enter that value in `startcountrycode` to return the next page of results.
        start-subdivision-code: |-
            The code for the state of the United States with which you want to start listing locations that Amazon Route 53 supports for geolocation. If Route 53 has already returned a page or more of results, if `IsTruncated` is `true`, and if `NextSubdivisionCode` from the previous response has a value, enter that value in `startsubdivisioncode` to return the next page of results.

            To list subdivisions (U.S. states), you must include both `startcountrycode` and `startsubdivisioncode`.
