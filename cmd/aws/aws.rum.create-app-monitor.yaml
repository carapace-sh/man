name: create-app-monitor
description: Creates a Amazon CloudWatch RUM app monitor, which collects telemetry data from your application and sends that data to RUM.
flags:
    --app-monitor-configuration=: A structure that contains much of the configuration data for the app monitor.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --custom-events=: Specifies whether this app monitor allows the web client to define and send custom events.
    --cw-log-enabled: Data collected by RUM is kept by RUM for 30 days and then deleted.
    --deobfuscation-configuration=: A structure that contains the configuration for how an app monitor can deobfuscate stack traces.
    --domain-list=:
        description: List the domain names for which your application has administrative authority.
        nargs: -1
    --domain=: The top-level internet domain name for which your application has administrative authority.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: A name for the app monitor.
    --no-cw-log-enabled: Data collected by RUM is kept by RUM for 30 days and then deleted.
    --platform=: The platform type for the app monitor.
    --tags=: Assigns one or more tags (key-value pairs) to the app monitor.
completion:
    flag:
        platform:
            - Web
            - Android
            - iOS
documentation:
    command: |-
        Creates a Amazon CloudWatch RUM app monitor, which collects telemetry data from your application and sends that data to RUM. The data includes performance and reliability information such as page load time, client-side errors, and user behavior.

        You use this operation only to create a new app monitor. To update an existing app monitor, use [UpdateAppMonitor](https://docs.aws.amazon.com/cloudwatchrum/latest/APIReference/API_UpdateAppMonitor.html) instead.

        After you create an app monitor, sign in to the CloudWatch RUM console to get the JavaScript code snippet to add to your web application. For more information, see [How do I find a code snippet that I've already generated?](https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-RUM-find-code-snippet.html)
    flag:
        app-monitor-configuration: |-
            A structure that contains much of the configuration data for the app monitor. If you are using Amazon Cognito for authorization, you must include this structure in your request, and it must include the ID of the Amazon Cognito identity pool to use for authorization. If you don't include `AppMonitorConfiguration`, you must set up your own authorization method. For more information, see [Authorize your application to send data to Amazon Web Services](https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-RUM-get-started-authorization.html).

            If you omit this argument, the sample rate used for RUM is set to 10% of the user sessions.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        custom-events: |-
            Specifies whether this app monitor allows the web client to define and send custom events. If you omit this parameter, custom events are `DISABLED`.

            For more information about custom events, see [Send custom events](https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-RUM-custom-events.html).
        cw-log-enabled: |-
            Data collected by RUM is kept by RUM for 30 days and then deleted. This parameter specifies whether RUM sends a copy of this telemetry data to Amazon CloudWatch Logs in your account. This enables you to keep the telemetry data for more than 30 days, but it does incur Amazon CloudWatch Logs charges.

            If you omit this parameter, the default is `false`.
        deobfuscation-configuration: A structure that contains the configuration for how an app monitor can deobfuscate stack traces.
        domain: The top-level internet domain name for which your application has administrative authority.
        domain-list: List the domain names for which your application has administrative authority. The `CreateAppMonitor` requires either the domain or the domain list.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: A name for the app monitor.
        platform: The platform type for the app monitor. Valid values are `Web` for web applications, `Android` for Android applications, and `iOS` for IOS applications. If you omit this parameter, the default is `Web`.
        tags: |-
            Assigns one or more tags (key-value pairs) to the app monitor.

            Tags can help you organize and categorize your resources. You can also use them to scope user permissions by granting a user permission to access or change only resources with certain tag values.

            Tags don't have any semantic meaning to Amazon Web Services and are interpreted strictly as strings of characters.

            You can associate as many as 50 tags with an app monitor.

            For more information, see [Tagging Amazon Web Services resources](https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html).
