name: create-origin-endpoint
description: The endpoint is attached to a channel, and represents the output of the live content.
flags:
    --channel-group-name=!: The name that describes the channel group.
    --channel-name=!: The name that describes the channel.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive token that you provide to ensure the idempotency of the request.
    --container-type=!: The type of container to attach to this origin endpoint.
    --dash-manifests=: A DASH manifest configuration.
    --description=: Enter any descriptive text that helps you to identify the origin endpoint.
    --force-endpoint-error-configuration=: The failover settings for the endpoint.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --hls-manifests=: An HTTP live streaming (HLS) manifest configuration.
    --low-latency-hls-manifests=: A low-latency HLS manifest configuration.
    --mss-manifests=: A list of Microsoft Smooth Streaming (MSS) manifest configurations for the origin endpoint.
    --origin-endpoint-name=!: The name that describes the origin endpoint.
    --segment=: The segment configuration, including the segment name, duration, and other configuration values.
    --startover-window-seconds=: The size of the window (in seconds) to create a window of the live stream that's available for on-demand viewing.
    --tags=: A comma-separated list of tag key:value pairs that you define.
completion:
    flag:
        container-type:
            - TS
            - CMAF
            - ISM
documentation:
    command: The endpoint is attached to a channel, and represents the output of the live content. You can associate multiple endpoints to a single channel. Each endpoint gives players and downstream CDNs (such as Amazon CloudFront) access to the content for playback. Content can't be served from a channel until it has an endpoint. You can create only one endpoint with each request.
    flag:
        channel-group-name: The name that describes the channel group. The name is the primary identifier for the channel group, and must be unique for your account in the AWS Region.
        channel-name: The name that describes the channel. The name is the primary identifier for the channel, and must be unique for your account in the AWS Region and channel group.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive token that you provide to ensure the idempotency of the request.
        container-type: The type of container to attach to this origin endpoint. A container type is a file format that encapsulates one or more media streams, such as audio and video, into a single file. You can't change the container type after you create the endpoint.
        dash-manifests: A DASH manifest configuration.
        description: Enter any descriptive text that helps you to identify the origin endpoint.
        force-endpoint-error-configuration: The failover settings for the endpoint.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        hls-manifests: An HTTP live streaming (HLS) manifest configuration.
        low-latency-hls-manifests: A low-latency HLS manifest configuration.
        mss-manifests: A list of Microsoft Smooth Streaming (MSS) manifest configurations for the origin endpoint. You can configure multiple MSS manifests to provide different streaming experiences or to support different client requirements.
        origin-endpoint-name: The name that describes the origin endpoint. The name is the primary identifier for the origin endpoint, and must be unique for your account in the AWS Region and channel. You can't use spaces in the name. You can't change the name after you create the endpoint.
        segment: The segment configuration, including the segment name, duration, and other configuration values.
        startover-window-seconds: The size of the window (in seconds) to create a window of the live stream that's available for on-demand viewing. Viewers can start-over or catch-up on content that falls within the window. The maximum startover window is 1,209,600 seconds (14 days).
        tags: |-
            A comma-separated list of tag key:value pairs that you define. For example:

            `"Key1": "Value1",`

            `"Key2": "Value2"`
