name: delete
description: '*(BETA)*  Delete Gateway Security Policy Rule.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --gateway-security-policy=: Id of the gateway security policy.
    --location=: The location Id.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(BETA)*  Delete the specified Gateway Security Policy Rule.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        gateway-security-policy: |-
            Id of the gateway security policy.
            +
            To set the `gateway-security-policy` attribute:
            * provide the argument `gateway_security_policy_rule` on the command line with a fully specified name;
            * provide the argument `--gateway-security-policy` on the command line.
        location: |-
            The location Id.
            +

            To set the `location` attribute:
            * provide the argument `gateway_security_policy_rule` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
