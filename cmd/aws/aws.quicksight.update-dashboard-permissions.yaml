name: update-dashboard-permissions
description: Updates read and write permissions on a dashboard.
flags:
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the dashboard whose permissions you're updating.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dashboard-id=!: The ID for the dashboard.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --grant-link-permissions=:
        description: Grants link permissions to all users in a defined namespace.
        nargs: -1
    --grant-permissions=:
        description: The permissions that you want to grant on this resource.
        nargs: -1
    --revoke-link-permissions=:
        description: Revokes link permissions from all users in a defined namespace.
        nargs: -1
    --revoke-permissions=:
        description: The permissions that you want to revoke from this resource.
        nargs: -1
documentation:
    command: Updates read and write permissions on a dashboard.
    flag:
        aws-account-id: The ID of the Amazon Web Services account that contains the dashboard whose permissions you're updating.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dashboard-id: The ID for the dashboard.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        grant-link-permissions: Grants link permissions to all users in a defined namespace.
        grant-permissions: The permissions that you want to grant on this resource.
        revoke-link-permissions: Revokes link permissions from all users in a defined namespace.
        revoke-permissions: The permissions that you want to revoke from this resource.
