name: restore
description: '*(ALPHA)*  Restore a Bare Metal Solution boot volume from an existing snapshot.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: Region of the resource.
    --snapshot=!: Name of the snapshot to restore.
documentation:
    command: |
        *(ALPHA)*  Restore a Bare Metal Solution boot volume from an existing snapshot.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            Region of the resource.
            +
            To set the `region` attribute:
            * provide the argument `volume` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
        snapshot: Name of the snapshot to restore.
