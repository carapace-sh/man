name: update-function
description: Updates a CloudFront function.
flags:
    --function-code=!: The function code.
    --function-config=!: Configuration information about the function.
    --if-match=!: The current version (`ETag` value) of the function that you are updating, which you can get using `DescribeFunction`.
    --name=!: The name of the function that you are updating.
documentation:
    command: |-
        Updates a CloudFront function.

        You can update a function's code or the comment that describes the function. You cannot update a function's name.

        To update a function, you provide the function's name and version (`ETag` value) along with the updated function code. To get the name and version, you can use `ListFunctions` and `DescribeFunction`.
    flag:
        function-code: The function code. For more information about writing a CloudFront function, see [Writing function code for CloudFront Functions](https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/writing-function-code.html) in the *Amazon CloudFront Developer Guide*.
        function-config: Configuration information about the function.
        if-match: The current version (`ETag` value) of the function that you are updating, which you can get using `DescribeFunction`.
        name: The name of the function that you are updating.
