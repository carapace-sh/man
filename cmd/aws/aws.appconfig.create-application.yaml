name: create-application
description: Creates an application.
flags:
    --description=: A description of the application.
    --name=!: A name for the application.
    --tags=: Metadata to assign to the application.
documentation:
    command: Creates an application. In AppConfig, an application is simply an organizational construct like a folder. This organizational construct has a relationship with some unit of executable code. For example, you could create an application called MyMobileApp to organize and manage configuration data for a mobile application installed by your users.
    flag:
        description: A description of the application.
        name: A name for the application.
        tags: Metadata to assign to the application. Tags help organize and categorize your AppConfig resources. Each tag consists of a key and an optional value, both of which you define.
