name: list-instance-attributes
description: This API is in preview release for Amazon Connect and is subject to change.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
documentation:
    command: |-
        This API is in preview release for Amazon Connect and is subject to change.

        Returns a paginated list of all attribute types for the given instance.
    flag:
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        max-results: The maximum number of results to return per page.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
