name: describe-subnet-groups
description: Returns a list of subnet group descriptions.
flags:
    --max-results=: The maximum number of results to include in the response.
    --next-token=: An optional token returned from a prior request.
    --subnet-group-names=: The name of the subnet group.
documentation:
    command: Returns a list of subnet group descriptions. If a subnet group name is specified, the list will contain only the description of that group.
    flag:
        max-results: |-
            The maximum number of results to include in the response. If more results exist than the specified `MaxResults` value, a token is included in the response so that the remaining results can be retrieved.

            The value for `MaxResults` must be between 20 and 100.
        next-token: An optional token returned from a prior request. Use this token for pagination of results from this action. If this parameter is specified, the response includes only results beyond the token, up to the value specified by `MaxResults`.
        subnet-group-names: The name of the subnet group.
