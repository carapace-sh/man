name: create-trust-store
description: Creates a trust store.
flags:
    --ca-certificates-bundle-s3-bucket=!: The Amazon S3 bucket for the ca certificates bundle.
    --ca-certificates-bundle-s3-key=!: The Amazon S3 path for the ca certificates bundle.
    --ca-certificates-bundle-s3-object-version=: The Amazon S3 object version for the ca certificates bundle.
    --name=!: The name of the trust store.
    --tags=: The tags to assign to the trust store.
documentation:
    command: |-
        Creates a trust store.

        For more information, see [Mutual TLS for Application Load Balancers](https://docs.aws.amazon.com/elasticloadbalancing/latest/application/mutual-authentication.html).
    flag:
        ca-certificates-bundle-s3-bucket: The Amazon S3 bucket for the ca certificates bundle.
        ca-certificates-bundle-s3-key: The Amazon S3 path for the ca certificates bundle.
        ca-certificates-bundle-s3-object-version: The Amazon S3 object version for the ca certificates bundle. If undefined the current version is used.
        name: |-
            The name of the trust store.

            This name must be unique per region and can't be changed after creation.
        tags: The tags to assign to the trust store.
