name: create
description: '*(ALPHA)*  Link external ip address to VMware Engine private cloud.'
hidden: true
flags:
    --internal-ip=!: internal ip address to which will be linked external ip
    --labels=: List of label KEY=VALUE pairs to add.
    --privatecloud=: VMware Engine private cloud.
    --region=: Region of the private cloud or cluster.
documentation:
    command: |
        *(ALPHA)*  Linking external ip address to VMware Engine private cloud.
    flag:
        internal-ip: internal ip address to which will be linked external ip
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        privatecloud: |-
            VMware Engine private cloud.
            +
            To set the `privatecloud` attribute:
            * provide the argument `name` on the command line with a fully specified name;
            * provide the argument `--privatecloud` on the command line.
        region: |-
            Region of the private cloud or cluster.
            +
            To set the `region` attribute:
            * provide the argument `name` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `vmware/region`.
