name: delete
description: '*(ALPHA)*  Delete security policies.'
flags:
    --global: If set, the security policies are global.
    --no-global&: If set, the security policies are global.
    --region=: Region of the security policies to delete.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute security-policies delete* deletes Compute Engine security policies. Security
        policies can only be deleted when no other resources (e.g.,
        backend services) refer to them.

        ## EXAMPLES

        To delete a security policy, run:

          $ gcloud alpha compute security-policies delete my-policy
    flag:
        global: If set, the security policies are global.
        no-global: If set, the security policies are global.
        region: Region of the security policies to delete. Overrides the default *compute/region* property value for this command invocation.
