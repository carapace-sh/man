name: create-app
description: Creates a running app for the specified UserProfile.
flags:
    --app-name=!: The name of the app.
    --app-type=!: The type of app.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-id=!: The domain ID.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-recovery-mode: Indicates whether the application is launched in recovery mode.
    --recovery-mode: Indicates whether the application is launched in recovery mode.
    --resource-spec=: The instance type and the Amazon Resource Name (ARN) of the SageMaker AI image created on the instance.
    --space-name=: The name of the space.
    --tags=: Each tag consists of a key and an optional value.
    --user-profile-name=: The user profile name.
completion:
    flag:
        app-type:
            - JupyterServer
            - KernelGateway
            - DetailedProfiler
            - TensorBoard
            - CodeEditor
            - JupyterLab
            - RStudioServerPro
            - RSessionGateway
            - Canvas
documentation:
    command: Creates a running app for the specified UserProfile. This operation is automatically invoked by Amazon SageMaker AI upon access to the associated Domain, and when new kernel configurations are selected by the user. A user may have multiple Apps active simultaneously.
    flag:
        app-name: The name of the app.
        app-type: The type of app.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain-id: The domain ID.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        recovery-mode: Indicates whether the application is launched in recovery mode.
        resource-spec: |-
            The instance type and the Amazon Resource Name (ARN) of the SageMaker AI image created on the instance.

            The value of `InstanceType` passed as part of the `ResourceSpec` in the `CreateApp` call overrides the value passed as part of the `ResourceSpec` configured for the user profile or the domain. If `InstanceType` is not specified in any of those three `ResourceSpec` values for a `KernelGateway` app, the `CreateApp` call fails with a request validation error.
        space-name: The name of the space. If this value is not set, then `UserProfileName` must be set.
        tags: Each tag consists of a key and an optional value. Tag keys must be unique per resource.
        user-profile-name: The user profile name. If this value is not set, then `SpaceName` must be set.
