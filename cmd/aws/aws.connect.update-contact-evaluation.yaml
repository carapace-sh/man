name: update-contact-evaluation
description: Updates details about a contact evaluation in the specified Amazon Connect instance.
flags:
    --answers=: A map of question identifiers to answer value.
    --evaluation-id=!: A unique identifier for the contact evaluation.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --notes=: A map of question identifiers to note value.
    --updated-by=: The ID of the user who updated the contact evaluation.
documentation:
    command: Updates details about a contact evaluation in the specified Amazon Connect instance. A contact evaluation must be in draft state. Answers included in the request are merged with existing answers for the given evaluation. An answer or note can be deleted by passing an empty object (`{}`) to the question identifier.
    flag:
        answers: A map of question identifiers to answer value.
        evaluation-id: A unique identifier for the contact evaluation.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        notes: A map of question identifiers to note value.
        updated-by: The ID of the user who updated the contact evaluation.
