name: gcs
description: '*(ALPHA)*  Import FHIR resources from Google Cloud Storage into a Cloud Healthcare API FHIR store.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --content-structure=: Content structure in the source location.
    --dataset=: Cloud Healthcare dataset.
    --error-gcs-uri=: The Cloud Storage bucket/folder path to write files that contain
    --gcs-uri=!: Cloud Storage source data locations.
    --location=: Google Cloud location.
    --no-async&: Return immediately, without waiting for the operation in progress to
completion:
    flag:
        content-structure:
            - bundle
            - bundle-pretty
            - resource
            - resource-pretty
documentation:
    command: '*(ALPHA)*  Import FHIR resources from Google Cloud Storage into a Cloud Healthcare API FHIR store.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        content-structure: |-
            Content structure in the source location. The default is BUNDLE. _CONTENT_STRUCTURE_ must be one of:
            +
            *bundle*::: Each unit is a bundle, which contains one or more resources.
            +
            *bundle-pretty*::: The entire file is one JSON bundle. The JSON can span multiple lines.
            +
            *resource*::: Each unit is a single resource.
            +
            *resource-pretty*::: The entire file is one JSON resource. The JSON can span multiple lines.
            +
            :::
            +
        dataset: |-
            Cloud Healthcare dataset.
            +
            To set the `dataset` attribute:
            * provide the argument `fhir_store` on the command line with a fully specified name;
            * provide the argument `--dataset` on the command line.
        error-gcs-uri: |-
            The Cloud Storage bucket/folder path to write files that contain
            error details.
        gcs-uri: |-
            Cloud Storage source data locations. Each Cloud Storage object
            should be a text file that contains newline-delimited JSON structures conforming
            to the FHIR standard. You can use wildcards to import multiple files from one or more
            directories.
            - Use * to match 0 or more non-separator characters. For example,
            gs://BUCKET/DIRECTORY/Example```*```.ndjson matches Example.ndjson and Example22.ndjson in
            DIRECTORY.
            - Use ** to match 0 or more characters (including separators). Must be used at the
            end of a path and with no other wildcards in the path. Can also be used with a filename
            extension (such as .ndjson), which imports all files with the filename extension in the
            specified directory and its subdirectories. For example, gs://BUCKET/DIRECTORY/**.ndjson
            imports all files with the .ndjson filename extension in DIRECTORY and its subdirectories.
            - Use ? to match 1 character. For example, gs://BUCKET/DIRECTORY/Example?.ndjson matches
            Example1.ndjson but does not match Example.ndjson or Example01.ndjson.
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `fhir_store` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `healthcare/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
