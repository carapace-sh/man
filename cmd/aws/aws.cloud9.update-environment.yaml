name: update-environment
description: Changes the settings of an existing Cloud9 development environment.
flags:
    --description=: Any new or replacement description for the environment.
    --environment-id=!: The ID of the environment to change settings.
    --managed-credentials-action=: 'Allows the environment owner to turn on or turn off the Amazon Web Services managed temporary credentials for an Cloud9 environment by using one of the following values:'
    --name=: A replacement name for the environment.
completion:
    flag:
        managed-credentials-action:
            - ENABLE
            - DISABLE
documentation:
    command: |-
        Changes the settings of an existing Cloud9 development environment.

        Cloud9 is no longer available to new customers. Existing customers of Cloud9 can continue to use the service as normal. [Learn more"](http://aws.amazon.com/blogs/devops/how-to-migrate-from-aws-cloud9-to-aws-ide-toolkits-or-aws-cloudshell/)
    flag:
        description: Any new or replacement description for the environment.
        environment-id: The ID of the environment to change settings.
        managed-credentials-action: |-
            Allows the environment owner to turn on or turn off the Amazon Web Services managed temporary credentials for an Cloud9 environment by using one of the following values:

            - `ENABLE`
            - `DISABLE`

            Only the environment owner can change the status of managed temporary credentials. An `AccessDeniedException` is thrown if an attempt to turn on or turn off managed temporary credentials is made by an account that's not the environment owner.
        name: A replacement name for the environment.
