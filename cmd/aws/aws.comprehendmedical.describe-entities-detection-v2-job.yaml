name: describe-entities-detection-v2-job
description: Gets the properties associated with a medical entities detection job.
flags:
    --job-id=!: The identifier that Amazon Comprehend Medical generated for the job.
documentation:
    command: Gets the properties associated with a medical entities detection job. Use this operation to get the status of a detection job.
    flag:
        job-id: The identifier that Amazon Comprehend Medical generated for the job. The `StartEntitiesDetectionV2Job` operation returns this identifier in its response.
