name: update-public-sharing-settings
description: This API controls public sharing settings for your entire Quick Sight account, affecting data security and access.
flags:
    --aws-account-id=!: The Amazon Web Services account ID associated with your Amazon Quick Sight subscription.
    --no-public-sharing-enabled: A Boolean value that indicates whether public sharing is turned on for an Quick Suite account.
    --public-sharing-enabled: A Boolean value that indicates whether public sharing is turned on for an Quick Suite account.
documentation:
    command: |-
        This API controls public sharing settings for your entire Quick Sight account, affecting data security and access. When you enable public sharing:

        - Dashboards can be shared publicly
        - This setting affects your entire Amazon Web Services account and all Quick Sight users

        **Before proceeding:** Ensure you understand the security implications and have proper IAM permissions configured.

        Use the `UpdatePublicSharingSettings` operation to turn on or turn off the public sharing settings of an Amazon Quick Sight dashboard.

        To use this operation, turn on session capacity pricing for your Amazon Quick Sight account.

        Before you can turn on public sharing on your account, make sure to give public sharing permissions to an administrative user in the Identity and Access Management (IAM) console. For more information on using IAM with Amazon Quick Sight, see [Using Quick Suite with IAM](https://docs.aws.amazon.com/quicksight/latest/user/security_iam_service-with-iam.html) in the *Amazon Quick Sight User Guide*.
    flag:
        aws-account-id: The Amazon Web Services account ID associated with your Amazon Quick Sight subscription.
        public-sharing-enabled: A Boolean value that indicates whether public sharing is turned on for an Quick Suite account.
