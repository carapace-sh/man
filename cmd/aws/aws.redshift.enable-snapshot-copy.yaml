name: enable-snapshot-copy
description: Enables the automatic copy of snapshots from one region to another region for a specified cluster.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cluster-identifier=!: The unique identifier of the source cluster to copy snapshots from.
    --destination-region=!: The destination Amazon Web Services Region that you want to copy snapshots to.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --manual-snapshot-retention-period=: The number of days to retain newly copied snapshots in the destination Amazon Web Services Region after they are copied from the source Amazon Web Services Region.
    --retention-period=: The number of days to retain automated snapshots in the destination region after they are copied from the source region.
    --snapshot-copy-grant-name=: The name of the snapshot copy grant to use when snapshots of an Amazon Web Services KMS-encrypted cluster are copied to the destination region.
documentation:
    command: Enables the automatic copy of snapshots from one region to another region for a specified cluster.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cluster-identifier: |-
            The unique identifier of the source cluster to copy snapshots from.

            Constraints: Must be the valid name of an existing cluster that does not already have cross-region snapshot copy enabled.
        destination-region: |-
            The destination Amazon Web Services Region that you want to copy snapshots to.

            Constraints: Must be the name of a valid Amazon Web Services Region. For more information, see [Regions and Endpoints](https://docs.aws.amazon.com/general/latest/gr/rande.html#redshift_region) in the Amazon Web Services General Reference.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        manual-snapshot-retention-period: |-
            The number of days to retain newly copied snapshots in the destination Amazon Web Services Region after they are copied from the source Amazon Web Services Region. If the value is -1, the manual snapshot is retained indefinitely.

            The value must be either -1 or an integer between 1 and 3,653.
        retention-period: |-
            The number of days to retain automated snapshots in the destination region after they are copied from the source region.

            Default: 7.

            Constraints: Must be at least 1 and no more than 35.
        snapshot-copy-grant-name: The name of the snapshot copy grant to use when snapshots of an Amazon Web Services KMS-encrypted cluster are copied to the destination region.
