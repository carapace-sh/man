name: list-message-template-versions
description: Lists all the available versions for the specified Amazon Q in Connect message template.
flags:
    --knowledge-base-id=!: The identifier of the knowledge base.
    --max-results=: The maximum number of results to return per page.
    --message-template-id=!: The identifier of the message template.
    --next-token=: The token for the next set of results.
documentation:
    command: Lists all the available versions for the specified Amazon Q in Connect message template.
    flag:
        knowledge-base-id: The identifier of the knowledge base. Can be either the ID or the ARN. URLs cannot contain the ARN.
        max-results: The maximum number of results to return per page.
        message-template-id: The identifier of the message template. Can be either the ID or the ARN. It cannot contain any qualifier.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
