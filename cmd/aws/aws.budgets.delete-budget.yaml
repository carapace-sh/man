name: delete-budget
description: Deletes a budget.
flags:
    --account-id=!: The `accountId` that is associated with the budget that you want to delete.
    --budget-name=!: The name of the budget that you want to delete.
documentation:
    command: |-
        Deletes a budget. You can delete your budget at any time.

        Deleting a budget also deletes the notifications and subscribers that are associated with that budget.
    flag:
        account-id: The `accountId` that is associated with the budget that you want to delete.
        budget-name: The name of the budget that you want to delete.
