name: create
description: Create a new version.
flags:
    --ekm-connection-key-path=: The path to the external key material on the EKM for keys with protection level "external-vpc".
    --external-key-uri=: The URI of the external key for keys with protection level "external".
    --key=: The containing key.
    --keyring=: Key ring of the key.
    --location=: Location of the keyring.
    --no-primary&: If specified, immediately makes the new version primary.
    --primary: If specified, immediately makes the new version primary.
documentation:
    command: |-
        Creates a new version within the given key.

        ## EXAMPLES

        The following command creates a new version within the `frodo`
        key, `fellowship` keyring, and `global` location and sets it as
        the primary version:

          $ gcloud kms keys versions create --location=global \
              --keyring=fellowship \
              --key=frodo --primary

        The following command creates a new version within the `legolas`
        key, `fellowship` keyring, `us-central1` location,
        `https://example.kms/v0/some/key/path` as the address for its external key,
        and sets it as the key's primary version:

          $ gcloud kms keys versions create --location=us-central1 \
              --keyring=fellowship \
              --key=legolas \
              --external-key-uri=https://example.kms/v0/some/key/path \
              --primary

        The following command creates a new version within the `bilbo`
        key, `fellowship` keyring, `us-central1` location,
        `v0/some/key/path` as the ekm connection key path for its external key,
        and sets it as the key's primary version:

          $ gcloud kms keys versions create --location=us-central1 \
              --keyring=fellowship \
              --key=bilbo \
              --ekm-connection-key-path=v0/some/key/path \
              --primary
    flag:
        ekm-connection-key-path: The path to the external key material on the EKM for keys with protection level "external-vpc".
        external-key-uri: The URI of the external key for keys with protection level "external".
        key: The containing key.
        keyring: Key ring of the key.
        location: Location of the keyring.
        no-primary: If specified, immediately makes the new version primary. This should only be used with the `encryption` purpose.
        primary: If specified, immediately makes the new version primary. This should only be used with the `encryption` purpose.
