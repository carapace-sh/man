name: get-named-query
description: Returns information about a single query.
flags:
    --named-query-id=!: The unique ID of the query.
documentation:
    command: Returns information about a single query. Requires that you have access to the workgroup in which the query was saved.
    flag:
        named-query-id: The unique ID of the query. Use [ListNamedQueries]() to get query IDs.
