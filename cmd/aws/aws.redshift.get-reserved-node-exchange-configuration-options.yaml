name: get-reserved-node-exchange-configuration-options
description: Gets the configuration options for the reserved-node exchange.
flags:
    --action-type=!: The action type of the reserved-node configuration.
    --cluster-identifier=: The identifier for the cluster that is the source for a reserved-node exchange.
    --marker=: An optional pagination token provided by a previous `GetReservedNodeExchangeConfigurationOptions` request.
    --max-records=: The maximum number of response records to return in each call.
    --snapshot-identifier=: The identifier for the snapshot that is the source for the reserved-node exchange.
completion:
    flag:
        action-type:
            - restore-cluster
            - resize-cluster
documentation:
    command: Gets the configuration options for the reserved-node exchange. These options include information about the source reserved node and target reserved node offering. Details include the node type, the price, the node count, and the offering type.
    flag:
        action-type: The action type of the reserved-node configuration. The action type can be an exchange initiated from either a snapshot or a resize.
        cluster-identifier: The identifier for the cluster that is the source for a reserved-node exchange.
        marker: An optional pagination token provided by a previous `GetReservedNodeExchangeConfigurationOptions` request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by the `MaxRecords` parameter. You can retrieve the next set of response records by providing the returned marker value in the `Marker` parameter and retrying the request.
        max-records: The maximum number of response records to return in each call. If the number of remaining response records exceeds the specified `MaxRecords` value, a value is returned in a `Marker` field of the response. You can retrieve the next set of records by retrying the command with the returned marker value.
        snapshot-identifier: The identifier for the snapshot that is the source for the reserved-node exchange.
