name: describe-event-sources-config
description: Returns the integration status of services that are integrated with DevOps Guru as Consumer via EventBridge.
documentation:
    command: Returns the integration status of services that are integrated with DevOps Guru as Consumer via EventBridge. The one service that can be integrated with DevOps Guru is Amazon CodeGuru Profiler, which can produce proactive recommendations which can be stored and viewed in DevOps Guru.
