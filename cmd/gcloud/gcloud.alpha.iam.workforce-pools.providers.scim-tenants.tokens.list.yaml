name: list
description: '*(ALPHA)*  List IAM workforce identity pool provider SCIM tenant tokens.'
flags:
    --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
    --limit=: Maximum number of resources to list.
    --location=: The location for the workforce pool.
    --no-show-deleted&: Include soft-deleted tokens in the results.
    --page-size=: Some services group resource list output into pages.
    --provider=: The ID to use for the workforce pool provider, which becomes the final component of the
    --scim-tenant=!: ID of the workforce pool provider scim tenant or fully qualified identifier for the workforce pool provider scim tenant.
    --show-deleted: Include soft-deleted tokens in the results.
    --sort-by=: Comma-separated list of resource field key names to sort by.
    --workforce-pool=: The ID to use for the workforce pool, which becomes the final component of the resource name.
documentation:
    command: |
        *(ALPHA)*  List all SCIM tokens associated with a specific workforce identity pool provider SCIM tenant.
    flag:
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        location: |-
            The location for the workforce pool.
            +
            To set the `location` attribute:
            * provide the argument `--scim-tenant` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-show-deleted: Include soft-deleted tokens in the results.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is determined by the
            service if it supports paging, otherwise it is *unlimited* (no paging).
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        provider: |-
            The ID to use for the workforce pool provider, which becomes the final component of the
            resource name. This value must be unique within the workforce pool, 4-32 characters in length,
            and may contain the characters [a-z0-9-]. The prefix `gcp-` is reserved for use by Google,
            and may not be specified.
            +

            To set the `provider` attribute:
            * provide the argument `--scim-tenant` on the command line with a fully specified name;
            * provide the argument `--provider` on the command line.
        scim-tenant: |-
            ID of the workforce pool provider scim tenant or fully qualified identifier for the workforce pool provider scim tenant.
            +
            To set the `scim-tenant` attribute:
            * provide the argument `--scim-tenant` on the command line.
        show-deleted: Include soft-deleted tokens in the results.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
        workforce-pool: |-
            The ID to use for the workforce pool, which becomes the final component of the resource name.
            This value must be a globally unique string of 6 to 63 lowercase letters, digits, or hyphens.
            It must start with a letter, and cannot have a trailing hyphen. The prefix `gcp-` is reserved
            for use by Google, and may not be specified.
            +

            To set the `workforce-pool` attribute:
            * provide the argument `--scim-tenant` on the command line with a fully specified name;
            * provide the argument `--workforce-pool` on the command line.
