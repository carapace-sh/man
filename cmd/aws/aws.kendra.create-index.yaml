name: create-index
description: Creates an Amazon Kendra index.
flags:
    --client-token=: A token that you provide to identify the request to create an index.
    --description=: A description for the index.
    --edition=: The Amazon Kendra edition to use for the index.
    --name=!: A name for the index.
    --role-arn=!: The Amazon Resource Name (ARN) of an IAM role with permission to access your Amazon CloudWatch logs and metrics.
    --server-side-encryption-configuration=: The identifier of the KMS customer managed key (CMK) that's used to encrypt data indexed by Amazon Kendra.
    --tags=: A list of key-value pairs that identify or categorize the index.
    --user-context-policy=: The user context policy.
    --user-group-resolution-configuration=: Gets users and groups from IAM Identity Center identity source.
    --user-token-configurations=: The user token configuration.
completion:
    flag:
        edition:
            - DEVELOPER_EDITION
            - ENTERPRISE_EDITION
            - GEN_AI_ENTERPRISE_EDITION
        user-context-policy:
            - ATTRIBUTE_FILTER
            - USER_TOKEN
documentation:
    command: |-
        Creates an Amazon Kendra index. Index creation is an asynchronous API. To determine if index creation has completed, check the `Status` field returned from a call to `DescribeIndex`. The `Status` field is set to `ACTIVE` when the index is ready to use.

        Once the index is active, you can index your documents using the `BatchPutDocument` API or using one of the supported [data sources](https://docs.aws.amazon.com/kendra/latest/dg/data-sources.html).

        For an example of creating an index and data source using the Python SDK, see [Getting started with Python SDK](https://docs.aws.amazon.com/kendra/latest/dg/gs-python.html). For an example of creating an index and data source using the Java SDK, see [Getting started with Java SDK](https://docs.aws.amazon.com/kendra/latest/dg/gs-java.html).
    flag:
        client-token: A token that you provide to identify the request to create an index. Multiple calls to the `CreateIndex` API with the same client token will create only one index.
        description: A description for the index.
        edition: |-
            The Amazon Kendra edition to use for the index. Choose `DEVELOPER_EDITION` for indexes intended for development, testing, or proof of concept. Use `ENTERPRISE_EDITION` for production. Use `GEN_AI_ENTERPRISE_EDITION` for creating generative AI applications. Once you set the edition for an index, it can't be changed.

            The `Edition` parameter is optional. If you don't supply a value, the default is `ENTERPRISE_EDITION`.

            For more information on quota limits for Gen AI Enterprise Edition, Enterprise Edition, and Developer Edition indices, see [Quotas](https://docs.aws.amazon.com/kendra/latest/dg/quotas.html).
        name: A name for the index.
        role-arn: The Amazon Resource Name (ARN) of an IAM role with permission to access your Amazon CloudWatch logs and metrics. For more information, see [IAM access roles for Amazon Kendra](https://docs.aws.amazon.com/kendra/latest/dg/iam-roles.html).
        server-side-encryption-configuration: The identifier of the KMS customer managed key (CMK) that's used to encrypt data indexed by Amazon Kendra. Amazon Kendra doesn't support asymmetric CMKs.
        tags: 'A list of key-value pairs that identify or categorize the index. You can also use tags to help control access to the index. Tag keys and values can consist of Unicode letters, digits, white space, and any of the following symbols: _ . : / = + - @.'
        user-context-policy: |-
            The user context policy.

            If you're using an Amazon Kendra Gen AI Enterprise Edition index, you can only use `ATTRIBUTE_FILTER` to filter search results by user context. If you're using an Amazon Kendra Gen AI Enterprise Edition index and you try to use `USER_TOKEN` to configure user context policy, Amazon Kendra returns a `ValidationException` error.

            ATTRIBUTE\_FILTER

            All indexed content is searchable and displayable for all users. If you want to filter search results on user context, you can use the attribute filters of `_user_id` and `_group_ids` or you can provide user and group information in `UserContext`.

            USER\_TOKEN

            Enables token-based user access control to filter search results on user context. All documents with no access control and all documents accessible to the user will be searchable and displayable.
        user-group-resolution-configuration: |-
            Gets users and groups from IAM Identity Center identity source. To configure this, see [UserGroupResolutionConfiguration](https://docs.aws.amazon.com/kendra/latest/dg/API_UserGroupResolutionConfiguration.html). This is useful for user context filtering, where search results are filtered based on the user or their group access to documents.

            If you're using an Amazon Kendra Gen AI Enterprise Edition index, `UserGroupResolutionConfiguration` isn't supported.
        user-token-configurations: |-
            The user token configuration.

            If you're using an Amazon Kendra Gen AI Enterprise Edition index and you try to use `UserTokenConfigurations` to configure user context policy, Amazon Kendra returns a `ValidationException` error.
