name: get-provisioned-product-outputs
description: This API takes either a `ProvisonedProductId` or a `ProvisionedProductName`, along with a list of one or more output keys, and responds with the key/value pairs of those outputs.
flags:
    --accept-language=: The language code.
    --output-keys=: The list of keys that the API should return with their values.
    --page-size=: The maximum number of items to return with this call.
    --page-token=: The page token for the next set of results.
    --provisioned-product-id=: The identifier of the provisioned product that you want the outputs from.
    --provisioned-product-name=: The name of the provisioned product that you want the outputs from.
documentation:
    command: This API takes either a `ProvisonedProductId` or a `ProvisionedProductName`, along with a list of one or more output keys, and responds with the key/value pairs of those outputs.
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        output-keys: The list of keys that the API should return with their values. If none are provided, the API will return all outputs of the provisioned product.
        page-size: The maximum number of items to return with this call.
        page-token: The page token for the next set of results. To retrieve the first set of results, use null.
        provisioned-product-id: The identifier of the provisioned product that you want the outputs from.
        provisioned-product-name: The name of the provisioned product that you want the outputs from.
