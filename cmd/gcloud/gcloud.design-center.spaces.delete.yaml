name: delete
description: Delete a space.
flags:
    --force: If set to true, the space's children are also deleted.
    --location=: The location id of the space resource.
    --no-force&: If set to true, the space's children are also deleted.
documentation:
    command: Delete a space.
    flag:
        force: |-
            If set to true, the space's children are also deleted. If false, the
            space is only deleted if it has no children.
        location: |-
            The location id of the space resource.
            +
            To set the `location` attribute:
            * provide the argument `space` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-force: |-
            If set to true, the space's children are also deleted. If false, the
            space is only deleted if it has no children.
