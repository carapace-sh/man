name: describe-fleet-attributes
description: |-
    **This API works with the following fleet types:** EC2, Anywhere, Container

    Retrieves core fleet-wide properties for fleets in an Amazon Web Services Region.
flags:
    --fleet-ids=: A list of unique fleet identifiers to retrieve attributes for.
    --limit=: The maximum number of results to return.
    --next-token=: A token that indicates the start of the next sequential page of results.
documentation:
    command: |-
        **This API works with the following fleet types:** EC2, Anywhere, Container

        Retrieves core fleet-wide properties for fleets in an Amazon Web Services Region. Properties include the computing hardware and deployment configuration for instances in the fleet.

        You can use this operation in the following ways:

        - To get attributes for specific fleets, provide a list of fleet IDs or fleet ARNs.
        - To get attributes for all fleets, do not provide a fleet identifier.

        When requesting attributes for multiple fleets, use the pagination parameters to retrieve results as a set of sequential pages.

        If successful, a `FleetAttributes` object is returned for each fleet requested, unless the fleet identifier is not found.

        Some API operations limit the number of fleet IDs that allowed in one request. If a request exceeds this limit, the request fails and the error message contains the maximum allowed number.

        **Learn more**

        [Setting up Amazon GameLift Servers fleets](https://docs.aws.amazon.com/gamelift/latest/developerguide/fleets-intro.html)
    flag:
        fleet-ids: A list of unique fleet identifiers to retrieve attributes for. You can use either the fleet ID or ARN value. To retrieve attributes for all current fleets, do not include this parameter.
        limit: The maximum number of results to return. Use this parameter with `NextToken` to get results as a set of sequential pages. This parameter is ignored when the request specifies one or a list of fleet IDs.
        next-token: A token that indicates the start of the next sequential page of results. Use the token that is returned with a previous call to this operation. To start at the beginning of the result set, do not specify a value. This parameter is ignored when the request specifies one or a list of fleet IDs.
