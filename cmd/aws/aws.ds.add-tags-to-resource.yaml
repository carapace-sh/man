name: add-tags-to-resource
description: Adds or overwrites one or more tags for the specified directory.
flags:
    --resource-id=!: Identifier (ID) for the directory to which to add the tag.
    --tags=!: The tags to be assigned to the directory.
documentation:
    command: Adds or overwrites one or more tags for the specified directory. Each directory can have a maximum of 50 tags. Each tag consists of a key and optional value. Tag keys must be unique to each resource.
    flag:
        resource-id: Identifier (ID) for the directory to which to add the tag.
        tags: The tags to be assigned to the directory.
