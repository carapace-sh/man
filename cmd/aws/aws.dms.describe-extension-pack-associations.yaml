name: describe-extension-pack-associations
description: Returns a paginated list of extension pack associations for the specified migration project.
flags:
    --filters=: Filters applied to the extension pack associations described in the form of key-value pairs.
    --marker=: Specifies the unique pagination token that makes it possible to display the next page of results.
    --max-records=: The maximum number of records to include in the response.
    --migration-project-identifier=!: The name or Amazon Resource Name (ARN) for the migration project.
documentation:
    command: Returns a paginated list of extension pack associations for the specified migration project. An extension pack is an add-on module that emulates functions present in a source database that are required when converting objects to the target database.
    flag:
        filters: Filters applied to the extension pack associations described in the form of key-value pairs.
        marker: |-
            Specifies the unique pagination token that makes it possible to display the next page of results. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.

            If `Marker` is returned by a previous response, there are more results available. The value of `Marker` is a unique pagination token for each page. To retrieve the next page, make the call again using the returned token and keeping all other arguments unchanged.
        max-records: The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, DMS includes a pagination token in the response so that you can retrieve the remaining results.
        migration-project-identifier: The name or Amazon Resource Name (ARN) for the migration project.
