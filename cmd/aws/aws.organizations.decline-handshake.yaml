name: decline-handshake
description: Declines a handshake request.
flags:
    --handshake-id=!: The unique identifier (ID) of the handshake that you want to decline.
documentation:
    command: |-
        Declines a handshake request. This sets the handshake state to `DECLINED` and effectively deactivates the request.

        This operation can be called only from the account that received the handshake. The originator of the handshake can use [CancelHandshake]() instead. The originator can't reactivate a declined request, but can reinitiate the process with a new handshake request.

        After you decline a handshake, it continues to appear in the results of relevant APIs for only 30 days. After that, it's deleted.
    flag:
        handshake-id: |-
            The unique identifier (ID) of the handshake that you want to decline. You can get the ID from the [ListHandshakesForAccount]() operation.

            The [regex pattern](http://wikipedia.org/wiki/regex) for handshake ID string requires "h-" followed by from 8 to 32 lowercase letters or digits.
