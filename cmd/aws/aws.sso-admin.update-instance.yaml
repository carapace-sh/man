name: update-instance
description: Update the details for the instance of IAM Identity Center that is owned by the Amazon Web Services account.
flags:
    --encryption-configuration=: Specifies the encryption configuration for your IAM Identity Center instance.
    --instance-arn=!: The ARN of the instance of IAM Identity Center under which the operation will run.
    --name=: Updates the instance name.
documentation:
    command: Update the details for the instance of IAM Identity Center that is owned by the Amazon Web Services account.
    flag:
        encryption-configuration: Specifies the encryption configuration for your IAM Identity Center instance. You can use this to configure customer managed KMS keys (CMK) or Amazon Web Services owned KMS keys for encrypting your instance data.
        instance-arn: The ARN of the instance of IAM Identity Center under which the operation will run. For more information about ARNs, see [Amazon Resource Names (ARNs) and Amazon Web Services Service Namespaces](/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference*.
        name: Updates the instance name.
