name: update-infrastructure-configuration
description: Updates a new infrastructure configuration.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=!: Unique, case-sensitive identifier you provide to ensure idempotency of the request.
    --description=: The description of the infrastructure configuration.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --infrastructure-configuration-arn=!: The Amazon Resource Name (ARN) of the infrastructure configuration that you want to update.
    --instance-metadata-options=: The instance metadata options that you can set for the HTTP requests that pipeline builds use to launch EC2 build and test instances.
    --instance-profile-name=!: The instance profile to associate with the instance used to customize your Amazon EC2 AMI.
    --instance-types=:
        description: The instance types of the infrastructure configuration.
        nargs: -1
    --key-pair=: The key pair of the infrastructure configuration.
    --logging=: The logging configuration of the infrastructure configuration.
    --no-terminate-instance-on-failure: The terminate instance on failure setting of the infrastructure configuration.
    --placement=: The instance placement settings that define where the instances that are launched from your image will run.
    --resource-tags=: The tags attached to the resource created by Image Builder.
    --security-group-ids=:
        description: The security group IDs to associate with the instance used to customize your Amazon EC2 AMI.
        nargs: -1
    --sns-topic-arn=: The Amazon Resource Name (ARN) for the SNS topic to which we send image build event notifications.
    --subnet-id=: The subnet ID to place the instance used to customize your Amazon EC2 AMI in.
    --terminate-instance-on-failure: The terminate instance on failure setting of the infrastructure configuration.
documentation:
    command: Updates a new infrastructure configuration. An infrastructure configuration defines the environment in which your image will be built and tested.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Unique, case-sensitive identifier you provide to ensure idempotency of the request. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html) in the *Amazon EC2 API Reference*.
        description: The description of the infrastructure configuration.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        infrastructure-configuration-arn: The Amazon Resource Name (ARN) of the infrastructure configuration that you want to update.
        instance-metadata-options: |-
            The instance metadata options that you can set for the HTTP requests that pipeline builds use to launch EC2 build and test instances. For more information about instance metadata options, see one of the following links:

            - [Configure the instance metadata options](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-instance-metadata-options.html) in the *Amazon EC2 User Guide* for Linux instances.
            - [Configure the instance metadata options](https://docs.aws.amazon.com/AWSEC2/latest/WindowsGuide/configuring-instance-metadata-options.html) in the *Amazon EC2 Windows Guide* for Windows instances.
        instance-profile-name: The instance profile to associate with the instance used to customize your Amazon EC2 AMI.
        instance-types: The instance types of the infrastructure configuration. You can specify one or more instance types to use for this build. The service will pick one of these instance types based on availability.
        key-pair: The key pair of the infrastructure configuration. You can use this to log on to and debug the instance used to create your image.
        logging: The logging configuration of the infrastructure configuration.
        placement: The instance placement settings that define where the instances that are launched from your image will run.
        resource-tags: The tags attached to the resource created by Image Builder.
        security-group-ids: The security group IDs to associate with the instance used to customize your Amazon EC2 AMI.
        sns-topic-arn: |-
            The Amazon Resource Name (ARN) for the SNS topic to which we send image build event notifications.

            EC2 Image Builder is unable to send notifications to SNS topics that are encrypted using keys from other accounts. The key that is used to encrypt the SNS topic must reside in the account that the Image Builder service runs under.
        subnet-id: The subnet ID to place the instance used to customize your Amazon EC2 AMI in.
        terminate-instance-on-failure: The terminate instance on failure setting of the infrastructure configuration. Set to false if you want Image Builder to retain the instance used to configure your AMI if the build or test phase of your workflow fails.
