name: add-option-to-option-group
description: Modifies an existing option group
flags:
    --apply-immediately: Specifies whether to apply the change immediately or during the next maintenance window
    --cli-input-json=: Reads arguments from the YAML string provided
    --cli-input-yaml=: Reads arguments from the JSON string provided
    --generate-cli-skeleton=: Prints a JSON skeleton to standard output without sending an API request
    --no-apply-immediately: Specifies whether to apply the change immediately or during the next maintenance window
    --option-group-name=!: The name of the option group to be modified
    --options=:
        description: Options in this list are added to the option group
        nargs: -1
