name: download
description: Download an Artifact Registry attachment from a repository.
flags:
    --chunk-size=: If specified, the chunk size (bytes) to use for downloading the package.
    --destination=!: Path where you want to save the downloaded attachment files.
    --location=: Location of the attachment.
    --oci-version-name=: For Docker-format repositories only.
    --parallelism=: Specifies the number of threads to use for downloading the attachment files in parallel.
    --repository=: Repository of the attachment.
documentation:
    command: Download an Artifact Registry attachment from a repository.
    flag:
        chunk-size: If specified, the chunk size (bytes) to use for downloading the package.
        destination: Path where you want to save the downloaded attachment files.
        location: |-
            Location of the attachment.
            +
            To set the `location` attribute:
            * provide the argument `attachment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `artifacts/location`.
        oci-version-name: For Docker-format repositories only. The version name of the OCI artifact to download.
        parallelism: Specifies the number of threads to use for downloading the attachment files in parallel.
        repository: |-
            Repository of the attachment.
            +
            To set the `repository` attribute:
            * provide the argument `attachment` on the command line with a fully specified name;
            * provide the argument `--repository` on the command line;
            * set the property `artifacts/repository`.
