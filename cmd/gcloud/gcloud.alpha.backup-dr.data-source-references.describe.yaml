name: describe
description: '*(ALPHA)*  Show details of the data source reference.'
flags:
    --location=: Location ID of the resource.
documentation:
    command: '*(ALPHA)*  Show all configuration data source associated with the specified data source reference.'
    flag:
        location: |-
            Location ID of the resource.
            +

            To set the `location` attribute:
            * provide the argument `data_source_reference` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
