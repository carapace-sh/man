name: get-link-associations
description: Gets the link associations for a device or a link.
flags:
    --device-id=: The ID of the device.
    --global-network-id=!: The ID of the global network.
    --link-id=: The ID of the link.
    --max-results=: The maximum number of results to return.
    --next-token=: The token for the next page of results.
documentation:
    command: Gets the link associations for a device or a link. Either the device ID or the link ID must be specified.
    flag:
        device-id: The ID of the device.
        global-network-id: The ID of the global network.
        link-id: The ID of the link.
        max-results: The maximum number of results to return.
        next-token: The token for the next page of results.
