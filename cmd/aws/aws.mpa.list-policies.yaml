name: list-policies
description: Returns a list of policies.
flags:
    --max-results=: The maximum number of items to return in the response.
    --next-token=: If present, indicates that more output is available than is included in the current response.
documentation:
    command: |-
        Returns a list of policies. Policies define the permissions for team resources.

        The protected operation for a service integration might require specific permissions. For more information, see [How other services work with Multi-party approval](https://docs.aws.amazon.com/mpa/latest/userguide/mpa-integrations.html) in the *Multi-party approval User Guide*.
    flag:
        max-results: The maximum number of items to return in the response. If more results exist than the specified `MaxResults` value, a token is included in the response so that you can retrieve the remaining results.
        next-token: If present, indicates that more output is available than is included in the current response. Use this value in the `NextToken` request parameter in a next call to the operation to get more output. You can repeat this until the `NextToken` response element returns `null`.
