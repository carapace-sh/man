name: disable
description: '*(ALPHA)*  Disable a service for MCP on a project, folder or organization.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --folder=: The Google Cloud Platform folder ID to use for this invocation.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --organization=: The Google Cloud Platform organization ID to use for this invocation.
documentation:
    command: |-
        *(ALPHA)*  Disable a service for MCP on a project, folder or organization

        ## EXAMPLES

        To disable a service for MCP called `my-service` on the current project, run:

          $ gcloud alpha services mcp disable my-service

        To disable a service for MCP called `my-service` on the project
        `my-project`, run:

          $ gcloud alpha services mcp disable my-service --project=my-project

        To disable a service for MCP called `my-service` on the folder
        `my-folder, run:

          $ gcloud alpha services mcp disable my-service --folder=my-folder

        To disable a service for MCP called `my-service` on the organization
        `my-organization`, run:

          $ gcloud alpha services mcp disable my-service --organization=my-organization

        To run the same command asynchronously (non-blocking), run:

          $ gcloud alpha services mcp disable my-service --async
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        folder: The Google Cloud Platform folder ID to use for this invocation.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        organization: The Google Cloud Platform organization ID to use for this invocation.
