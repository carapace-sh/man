name: disable-organization-admin-account
description: Disables a Security Hub administrator account.
flags:
    --admin-account-id=!: The Amazon Web Services account identifier of the Security Hub administrator account.
    --feature=: The feature for which the delegated admin account is disabled.
completion:
    flag:
        feature:
            - SecurityHub
            - SecurityHubV2
documentation:
    command: Disables a Security Hub administrator account. Can only be called by the organization management account.
    flag:
        admin-account-id: The Amazon Web Services account identifier of the Security Hub administrator account.
        feature: The feature for which the delegated admin account is disabled. Defaults to Security Hub if not specified.
