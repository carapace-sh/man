name: describe-partners
description: Returns information about the partner integrations defined for a cluster.
flags:
    --account-id=!: The Amazon Web Services account ID that owns the cluster.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cluster-identifier=!: The cluster identifier of the cluster whose partner integration is being described.
    --database-name=: The name of the database whose partner integration is being described.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --partner-name=: The name of the partner that is being described.
documentation:
    command: Returns information about the partner integrations defined for a cluster.
    flag:
        account-id: The Amazon Web Services account ID that owns the cluster.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cluster-identifier: The cluster identifier of the cluster whose partner integration is being described.
        database-name: The name of the database whose partner integration is being described. If database name is not specified, then all databases in the cluster are described.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        partner-name: The name of the partner that is being described. If partner name is not specified, then all partner integrations are described.
