name: purge
description: '*(ALPHA)*  Purge a queue by deleting all of its tasks.'
flags:
    --location=: The location where we want to manage the queue or task.
documentation:
    command: |
        *(ALPHA)*  This command purges a queue by deleting all of its tasks. Purge operations can
        take up to one minute to take effect. Tasks might be dispatched before the
        purge takes effect. A purge is irreversible. All tasks created before this
        command is run are permanently deleted.
    flag:
        location: The location where we want to manage the queue or task. If not specified, uses the location of the current project's App Engine app if there is an associated app.
