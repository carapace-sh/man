name: validate-security-profile-behaviors
description: Validates a Device Defender security profile behaviors specification.
flags:
    --behaviors=!: Specifies the behaviors that, when violated by a device (thing), cause an alert.
documentation:
    command: |-
        Validates a Device Defender security profile behaviors specification.

        Requires permission to access the [ValidateSecurityProfileBehaviors](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        behaviors: Specifies the behaviors that, when violated by a device (thing), cause an alert.
