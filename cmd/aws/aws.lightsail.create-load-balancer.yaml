name: create-load-balancer
description: Creates a Lightsail load balancer.
flags:
    --certificate-alternative-names=:
        description: The optional alternative domains and subdomains to use with your SSL/TLS certificate (`www.example.com`, `example.com`, `m.example.com`, `blog.example.com`).
        nargs: -1
    --certificate-domain-name=: The domain name with which your certificate is associated (`example.com`).
    --certificate-name=: The name of the SSL/TLS certificate.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --health-check-path=: The path you provided to perform the load balancer health check.
    --instance-port=!: The instance port where you're creating your load balancer.
    --ip-address-type=: The IP address type for the load balancer.
    --load-balancer-name=!: The name of your load balancer.
    --tags=:
        description: The tag keys and optional values to add to the resource during create.
        nargs: -1
    --tls-policy-name=: The name of the TLS policy to apply to the load balancer.
completion:
    flag:
        ip-address-type:
            - dualstack
            - ipv4
            - ipv6
documentation:
    command: |-
        Creates a Lightsail load balancer. To learn more about deciding whether to load balance your application, see [Configure your Lightsail instances for load balancing](https://docs.aws.amazon.com/lightsail/latest/userguide/configure-lightsail-instances-for-load-balancing). You can create up to 10 load balancers per AWS Region in your account.

        When you create a load balancer, you can specify a unique name and port settings. To change additional load balancer settings, use the `UpdateLoadBalancerAttribute` operation.

        The `create load balancer` operation supports tag-based access control via request tags. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-controlling-access-using-tags).
    flag:
        certificate-alternative-names: The optional alternative domains and subdomains to use with your SSL/TLS certificate (`www.example.com`, `example.com`, `m.example.com`, `blog.example.com`).
        certificate-domain-name: |-
            The domain name with which your certificate is associated (`example.com`).

            If you specify `certificateDomainName`, then `certificateName` is required (and vice-versa).
        certificate-name: |-
            The name of the SSL/TLS certificate.

            If you specify `certificateName`, then `certificateDomainName` is required (and vice-versa).
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        health-check-path: |-
            The path you provided to perform the load balancer health check. If you didn't specify a health check path, Lightsail uses the root path of your website (`"/"`).

            You may want to specify a custom health check path other than the root of your application if your home page loads slowly or has a lot of media or scripting on it.
        instance-port: The instance port where you're creating your load balancer.
        ip-address-type: |-
            The IP address type for the load balancer.

            The possible values are `ipv4` for IPv4 only, `ipv6` for IPv6 only, and `dualstack` for IPv4 and IPv6.

            The default value is `dualstack`.
        load-balancer-name: The name of your load balancer.
        tags: |-
            The tag keys and optional values to add to the resource during create.

            Use the `TagResource` action to tag a resource after it's created.
        tls-policy-name: |-
            The name of the TLS policy to apply to the load balancer.

            Use the [GetLoadBalancerTlsPolicies](https://docs.aws.amazon.com/lightsail/2016-11-28/api-reference/API_GetLoadBalancerTlsPolicies.html) action to get a list of TLS policy names that you can specify.

            For more information about load balancer TLS policies, see [Configuring TLS security policies on your Amazon Lightsail load balancers](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-configure-load-balancer-tls-security-policy) in the *Amazon Lightsail Developer Guide*.
