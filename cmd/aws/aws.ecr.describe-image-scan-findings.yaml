name: describe-image-scan-findings
description: Returns the scan findings for the specified image.
flags:
    --image-id=!: ""
    --max-results=: The maximum number of image scan results returned by `DescribeImageScanFindings` in paginated output.
    --next-token=: The `nextToken` value returned from a previous paginated `DescribeImageScanFindings` request where `maxResults` was used and the results exceeded the value of that parameter.
    --registry-id=: The Amazon Web Services account ID associated with the registry that contains the repository in which to describe the image scan findings for.
    --repository-name=!: The repository for the image for which to describe the scan findings.
documentation:
    command: Returns the scan findings for the specified image.
    flag:
        image-id: ""
        max-results: The maximum number of image scan results returned by `DescribeImageScanFindings` in paginated output. When this parameter is used, `DescribeImageScanFindings` only returns `maxResults` results in a single page along with a `nextToken` response element. The remaining results of the initial request can be seen by sending another `DescribeImageScanFindings` request with the returned `nextToken` value. This value can be between 1 and 1000. If this parameter is not used, then `DescribeImageScanFindings` returns up to 100 results and a `nextToken` value, if applicable.
        next-token: The `nextToken` value returned from a previous paginated `DescribeImageScanFindings` request where `maxResults` was used and the results exceeded the value of that parameter. Pagination continues from the end of the previous results that returned the `nextToken` value. This value is null when there are no more results to return.
        registry-id: The Amazon Web Services account ID associated with the registry that contains the repository in which to describe the image scan findings for. If you do not specify a registry, the default registry is assumed.
        repository-name: The repository for the image for which to describe the scan findings.
