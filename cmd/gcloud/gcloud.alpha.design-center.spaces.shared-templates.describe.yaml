name: describe
description: '*(ALPHA)*  Describe a shared template.'
flags:
    --google-catalog: If provided, describes a shared template from the Google Catalog.
    --location=: The location id of the sharedTemplate resource.
    --no-google-catalog&: If provided, describes a shared template from the Google Catalog.
    --space=: The space id of the sharedTemplate resource.
documentation:
    command: '*(ALPHA)*  Describe a shared template.'
    flag:
        google-catalog: If provided, describes a shared template from the Google Catalog. This sets the project to "gcpdesigncenter" and space to "googlespace".
        location: |-
            The location id of the sharedTemplate resource.
            +
            To set the location attribute:
              * provide the argument `shared_template` on the command line with a fully specified name;
              * provide the argument `--location` on the command line.
        no-google-catalog: If provided, describes a shared template from the Google Catalog. This sets the project to "gcpdesigncenter" and space to "googlespace".
        space: |-
            The space id of the sharedTemplate resource.
            +
            To set the space attribute:
              * provide the argument `shared_template` on the command line with a fully specified name;
              * provide the argument `--space` on the command line.
