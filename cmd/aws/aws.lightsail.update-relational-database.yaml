name: update-relational-database
description: Allows the update of one or more attributes of a database in Amazon Lightsail.
flags:
    --apply-immediately: When `true`, applies changes immediately.
    --ca-certificate-identifier=: Indicates the certificate that needs to be associated with the database.
    --disable-backup-retention: When `true`, disables automated backup retention for your database.
    --enable-backup-retention: When `true`, enables automated backup retention for your database.
    --master-user-password=: The password for the master user.
    --no-apply-immediately: When `true`, applies changes immediately.
    --no-disable-backup-retention: When `true`, disables automated backup retention for your database.
    --no-enable-backup-retention: When `true`, enables automated backup retention for your database.
    --no-publicly-accessible: Specifies the accessibility options for your database.
    --no-rotate-master-user-password: When `true`, the master user password is changed to a new strong password generated by Lightsail.
    --preferred-backup-window=: The daily time range during which automated backups are created for your database if automated backups are enabled.
    --preferred-maintenance-window=: The weekly time range during which system maintenance can occur on your database.
    --publicly-accessible: Specifies the accessibility options for your database.
    --relational-database-blueprint-id=: This parameter is used to update the major version of the database.
    --relational-database-name=!: The name of your Lightsail database resource to update.
    --rotate-master-user-password: When `true`, the master user password is changed to a new strong password generated by Lightsail.
documentation:
    command: |-
        Allows the update of one or more attributes of a database in Amazon Lightsail.

        Updates are applied immediately, or in cases where the updates could result in an outage, are applied during the database's predefined maintenance window.

        The `update relational database` operation supports tag-based access control via resource tags applied to the resource identified by relationalDatabaseName. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-controlling-access-using-tags).
    flag:
        apply-immediately: |-
            When `true`, applies changes immediately. When `false`, applies changes during the preferred maintenance window. Some changes may cause an outage.

            Default: `false`
        ca-certificate-identifier: Indicates the certificate that needs to be associated with the database.
        disable-backup-retention: |-
            When `true`, disables automated backup retention for your database.

            Disabling backup retention deletes all automated database backups. Before disabling this, you may want to create a snapshot of your database using the `create relational database snapshot` operation.

            Updates are applied during the next maintenance window because this can result in an outage.
        enable-backup-retention: |-
            When `true`, enables automated backup retention for your database.

            Updates are applied during the next maintenance window because this can result in an outage.
        master-user-password: |-
            The password for the master user. The password can include any printable ASCII character except "/", """, or "@".

            My**SQL**

            Constraints: Must contain from 8 to 41 characters.

            **PostgreSQL**

            Constraints: Must contain from 8 to 128 characters.
        preferred-backup-window: "The daily time range during which automated backups are created for your database if automated backups are enabled.\n\nConstraints:\n\n- Must be in the `hh24:mi-hh24:mi` format.\n  \n  Example: `16:00-16:30`\n- Specified in Coordinated Universal Time (UTC).\n- Must not conflict with the preferred maintenance window.\n- Must be at least 30 minutes."
        preferred-maintenance-window: |-
            The weekly time range during which system maintenance can occur on your database.

            The default is a 30-minute window selected at random from an 8-hour block of time for each Amazon Web Services Region, occurring on a random day of the week.

            Constraints:

            - Must be in the `ddd:hh24:mi-ddd:hh24:mi` format.
            - Valid days: Mon, Tue, Wed, Thu, Fri, Sat, Sun.
            - Must be at least 30 minutes.
            - Specified in Coordinated Universal Time (UTC).
            - Example: `Tue:17:00-Tue:17:30`
        publicly-accessible: Specifies the accessibility options for your database. A value of `true` specifies a database that is available to resources outside of your Lightsail account. A value of `false` specifies a database that is available only to your Lightsail resources in the same region as your database.
        relational-database-blueprint-id: |-
            This parameter is used to update the major version of the database. Enter the `blueprintId` for the major version that you want to update to.

            Use the [GetRelationalDatabaseBlueprints](https://docs.aws.amazon.com/lightsail/2016-11-28/api-reference/API_GetRelationalDatabaseBlueprints.html) action to get a list of available blueprint IDs.
        relational-database-name: The name of your Lightsail database resource to update.
        rotate-master-user-password: |-
            When `true`, the master user password is changed to a new strong password generated by Lightsail.

            Use the `get relational database master user password` operation to get the new password.
