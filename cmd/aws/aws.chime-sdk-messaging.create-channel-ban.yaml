name: create-channel-ban
description: Permanently bans a member from a channel.
flags:
    --channel-arn=!: The ARN of the ban request.
    --chime-bearer=!: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
    --member-arn=!: The `AppInstanceUserArn` of the member being banned.
documentation:
    command: |-
        Permanently bans a member from a channel. Moderators can't add banned members to a channel. To undo a ban, you first have to `DeleteChannelBan`, and then `CreateChannelMembership`. Bans are cleaned up when you delete users or channels.

        If you ban a user who is already part of a channel, that user is automatically kicked from the channel.

        The `x-amz-chime-bearer` request header is mandatory. Use the ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call as the value in the header.
    flag:
        channel-arn: The ARN of the ban request.
        chime-bearer: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
        member-arn: The `AppInstanceUserArn` of the member being banned.
