name: dismiss-user-contact
description: Dismisses contacts from an agent’s CCP and returns the agent to an available state, which allows the agent to receive a new routed contact.
flags:
    --contact-id=!: The identifier of the contact.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --user-id=!: The identifier of the user account.
documentation:
    command: Dismisses contacts from an agent’s CCP and returns the agent to an available state, which allows the agent to receive a new routed contact. Contacts can only be dismissed if they are in a `MISSED`, `ERROR`, `ENDED`, or `REJECTED` state in the [Agent Event Stream](https://docs.aws.amazon.com/connect/latest/adminguide/about-contact-states.html).
    flag:
        contact-id: The identifier of the contact.
        instance-id: The identifier of the Amazon Connect instance. You can find the instanceId in the ARN of the instance.
        user-id: The identifier of the user account.
