name: create-service
description: Creates a service.
flags:
    --auth-type=: The type of IAM policy.
    --certificate-arn=: The Amazon Resource Name (ARN) of the certificate.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --custom-domain-name=: The custom domain name of the service.
    --name=!: The name of the service.
    --tags=: The tags for the service.
completion:
    flag:
        auth-type:
            - NONE
            - AWS_IAM
documentation:
    command: |-
        Creates a service. A service is any software application that can run on instances containers, or serverless functions within an account or virtual private cloud (VPC).

        For more information, see [Services](https://docs.aws.amazon.com/vpc-lattice/latest/ug/services.html) in the *Amazon VPC Lattice User Guide*.
    flag:
        auth-type: |-
            The type of IAM policy.

            - `NONE`: The resource does not use an IAM policy. This is the default.
            - `AWS_IAM`: The resource uses an IAM policy. When this type is used, auth is enabled and an auth policy is required.
        certificate-arn: The Amazon Resource Name (ARN) of the certificate.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If you retry a request that completed successfully using the same client token and parameters, the retry succeeds without performing any actions. If the parameters aren't identical, the retry fails.
        custom-domain-name: The custom domain name of the service.
        name: The name of the service. The name must be unique within the account. The valid characters are a-z, 0-9, and hyphens (-). You can't use a hyphen as the first or last character, or immediately after another hyphen.
        tags: The tags for the service.
