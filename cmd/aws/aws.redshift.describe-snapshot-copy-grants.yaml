name: describe-snapshot-copy-grants
description: Returns a list of snapshot copy grants owned by the Amazon Web Services account in the destination region.
flags:
    --marker=: An optional parameter that specifies the starting point to return a set of response records.
    --max-records=: The maximum number of response records to return in each call.
    --snapshot-copy-grant-name=: The name of the snapshot copy grant.
    --tag-keys=: A tag key or keys for which you want to return all matching resources that are associated with the specified key or keys.
    --tag-values=: A tag value or values for which you want to return all matching resources that are associated with the specified value or values.
documentation:
    command: |-
        Returns a list of snapshot copy grants owned by the Amazon Web Services account in the destination region.

        For more information about managing snapshot copy grants, go to [Amazon Redshift Database Encryption](https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-db-encryption.html) in the *Amazon Redshift Cluster Management Guide*.
    flag:
        marker: |-
            An optional parameter that specifies the starting point to return a set of response records. When the results of a `DescribeSnapshotCopyGrant` request exceed the value specified in `MaxRecords`, Amazon Web Services returns a value in the `Marker` field of the response. You can retrieve the next set of response records by providing the returned marker value in the `Marker` parameter and retrying the request.

            Constraints: You can specify either the **SnapshotCopyGrantName** parameter or the **Marker** parameter, but not both.
        max-records: |-
            The maximum number of response records to return in each call. If the number of remaining response records exceeds the specified `MaxRecords` value, a value is returned in a `marker` field of the response. You can retrieve the next set of records by retrying the command with the returned marker value.

            Default: `100`

            Constraints: minimum 20, maximum 100.
        snapshot-copy-grant-name: The name of the snapshot copy grant.
        tag-keys: A tag key or keys for which you want to return all matching resources that are associated with the specified key or keys. For example, suppose that you have resources tagged with keys called `owner` and `environment`. If you specify both of these tag keys in the request, Amazon Redshift returns a response with all resources that have either or both of these tag keys associated with them.
        tag-values: A tag value or values for which you want to return all matching resources that are associated with the specified value or values. For example, suppose that you have resources tagged with values called `admin` and `test`. If you specify both of these tag values in the request, Amazon Redshift returns a response with all resources that have either or both of these tag values associated with them.
