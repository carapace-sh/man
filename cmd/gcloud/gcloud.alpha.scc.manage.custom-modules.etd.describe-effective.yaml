name: describe-effective
description: '*(ALPHA)*  Get the effective details of a Event Threat Detection effective custom module.'
flags:
    --folder=: Folder associated with the custom module.
    --organization=: Organization associated with the custom module.
    --parent=: Parent associated with the custom module.
documentation:
    command: |-
        *(ALPHA)*  Get the effective details of a Event Threat Detection effective custom module.
        It retrieves a custom module with its effective enablement state.

        ## EXAMPLES

        To get the effective details of a Event Threat Detection custom module with ID
        `123456` for organization `123`, run:

          $ gcloud alpha scc manage custom-modules etd describe-effective 123456 --organization=123

        To get the effective details of a Event Threat Detection custom module with ID
        `123456` for folder `456`, run:

          $ gcloud alpha scc manage custom-modules etd describe-effective 123456 --folder=456

        To get the effective details of a Event Threat Detection custom module with ID
        `123456` for project `789`, run:

          $ gcloud alpha scc manage custom-modules etd describe-effective 123456 --project=789

        You can also specify the parent more generally:

          $ gcloud alpha scc manage custom-modules etd describe-effective 123456 --parent=organizations/123

        Or just specify the fully qualified module name:

          $ gcloud alpha scc manage custom-modules etd describe-effective
          organizations/123/locations/global/effectiveEventThreatDetectionCustomModules/123456
    flag:
        folder: Folder associated with the custom module.
        organization: Organization associated with the custom module.
        parent: |-
            Parent associated with the custom module. Can be one of
                          organizations/<id>, projects/<id or name>, folders/<id>
