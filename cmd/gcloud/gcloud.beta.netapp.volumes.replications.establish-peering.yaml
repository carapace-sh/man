name: establish-peering
description: '*(BETA)*  Establish peering for Hybrid replication.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location of the replication.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --peer-cluster-name=!: Name of the destination cluster to be peered
    --peer-ip-addresses=: List of ip addresses to be used for peering.
    --peer-svm-name=!: Name of the local source vserver svm to be peered
    --peer-volume-name=!: Name of the source volume to be peered
    --volume=: ID of the volume or fully qualified identifier for the volume.
documentation:
    command: |
        *(BETA)*  Establish peering for Hybrid replication.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location of the replication.
            +
            To set the `location` attribute:
            * provide the argument `replication` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        peer-cluster-name: |-
            Name of the destination cluster to be peered
                    with the source cluster.
        peer-ip-addresses: List of ip addresses to be used for peering. This is required for cluster peering, not required for svm peering.
        peer-svm-name: |-
            Name of the local source vserver svm to be peered
                    with the destination cluster.
        peer-volume-name: |-
            Name of the source volume to be peered
                   with the destination volume.
        volume: |-
            ID of the volume or fully qualified identifier for the volume.
            +
            To set the `volume` attribute:
            * provide the argument `--volume` on the command line.
