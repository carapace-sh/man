name: sign-blob
description: '*(ALPHA)*  Sign a blob with a managed service account key.'
flags:
    --iam-account=!: The service account to sign as.
documentation:
    command: |-
        *(ALPHA)*  This command signs a file containing arbitrary binary data (a blob) using a
        system-managed service account key.

        If the service account does not exist, this command returns a
        `PERMISSION_DENIED` error.
    flag:
        iam-account: The service account to sign as.
