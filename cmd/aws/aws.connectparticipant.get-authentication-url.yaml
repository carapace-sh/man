name: get-authentication-url
description: Retrieves the AuthenticationUrl for the current authentication session for the AuthenticateCustomer flow block.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --connection-token=!: The authentication token associated with the participant's connection.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --redirect-uri=!: The URL where the customer will be redirected after Amazon Cognito authorizes the user.
    --session-id=!: The sessionId provided in the authenticationInitiated event.
documentation:
    command: |-
        Retrieves the AuthenticationUrl for the current authentication session for the AuthenticateCustomer flow block.

        For security recommendations, see [Amazon Connect Chat security best practices](https://docs.aws.amazon.com/connect/latest/adminguide/security-best-practices.html#bp-security-chat).

        - This API can only be called within one minute of receiving the authenticationInitiated event.
        - The current supported channel is chat. This API is not supported for Apple Messages for Business, WhatsApp, or SMS chats.

        `ConnectionToken` is used for invoking this API instead of `ParticipantToken`.

        The Amazon Connect Participant Service APIs do not use [Signature Version 4 authentication](https://docs.aws.amazon.com/general/latest/gr/signature-version-4.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        connection-token: The authentication token associated with the participant's connection.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        redirect-uri: The URL where the customer will be redirected after Amazon Cognito authorizes the user.
        session-id: The sessionId provided in the authenticationInitiated event.
