documentation:
    command: '*(BETA)*  Creates a new Template in a given project and location.'
    flag:
        advanced-config-deidentify-template: |-
            Optional Sensitive Data Protection Deidentify template resource name.
            +
            If provided then DeidentifyContent action is performed during Sanitization
            using this template and inspect template. The De-identified data will
            be returned in SdpDeidentifyResult.
            Note that all info-types present in the deidentify template must be present
            in inspect template.
            +
            e.g.
            `projects/{project}/locations/{location}/deidentifyTemplates/{deidentify_template}`
        advanced-config-inspect-template: |-
            Sensitive Data Protection inspect template resource name
            +
            If only inspect template is provided (de-identify template not provided),
            then Sensitive Data Protection InspectContent action is performed during
            Sanitization. All Sensitive Data Protection findings identified during
            inspection will be returned as SdpFinding in SdpInsepctionResult.
            +
            e.g.
            `projects/{project}/locations/{location}/inspectTemplates/{inspect_template}`
        basic-config-filter-enforcement: |-
            Tells whether the Sensitive Data Protection basic config is enabled or
            disabled. _BASIC_CONFIG_FILTER_ENFORCEMENT_ must be one of:
            +
            *disabled*::: Disabled
            *enabled*::: Enabled
            :::
            +
        labels: |-
            Labels as key value pairs.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: |-
            The location id of the template resource.
            +
            To set the `location` attribute:
            * provide the argument `template` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        malicious-uri-filter-settings-enforcement: |-
            Tells whether the Malicious URI filter is enabled or disabled. _MALICIOUS_URI_FILTER_SETTINGS_ENFORCEMENT_ must be one of:
            +
            *disabled*::: Disabled
            *enabled*::: Enabled
            :::
            +
        multi-language-detection-enable: If true, multi language detection will be enabled. Use *--multi-language-detection-enable* to enable and *--no-multi-language-detection-enable* to disable.
        no-multi-language-detection-enable: If true, multi language detection will be enabled.
        no-template-metadata-ignore-partial-invocation-failures: If true, partial detector failures should be ignored.
        no-template-metadata-log-operations: If true, log template crud operations.
        no-template-metadata-log-sanitize-operations: If true, log sanitize operations.
        pi-and-jailbreak-filter-settings-confidence-level: |-
            Confidence level for this filter.
            Confidence level is used to determine the threshold for the filter. If
            detection confidence is equal to or greater than the specified level, a
            positive match is reported. Confidence level will only be used if the
            filter is enabled. _PI_AND_JAILBREAK_FILTER_SETTINGS_CONFIDENCE_LEVEL_ must be one of:
            +
            *high*::: Low chance of false positives.
            *low-and-above*::: Highest chance of a false positive.
            *medium-and-above*::: Some chance of false positives.
            :::
            +
        pi-and-jailbreak-filter-settings-enforcement: |-
            Tells whether Prompt injection and Jailbreak filter is enabled or
            disabled. _PI_AND_JAILBREAK_FILTER_SETTINGS_ENFORCEMENT_ must be one of:
            +
            *disabled*::: Enabled
            *enabled*::: Enabled
            :::
            +
        rai-settings-filters: |-
            Required, List of Responsible AI filters enabled for template.
            +
            *confidenceLevel*:::
            Confidence level for this RAI filter.
            During data sanitization, if data is classified under this filter with a
            confidence level equal to or greater than the specified level, a positive
            match is reported. If the confidence level is unspecified (i.e., 0), the
            system will use a reasonable default level based on the `filter_type`.
            +
            *filterType*:::
            Type of responsible AI filter.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --rai-settings-filters=confidenceLevel=string,filterType=string --rai-settings-filters=confidenceLevel=string,filterType=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --rai-settings-filters='[{"confidenceLevel": "string", "filterType": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --rai-settings-filters=path_to_file.(yaml|json)
            +
            ```
        request-id: |-
            An optional request ID to identify requests. Specify a unique request ID
            so that if you must retry your request, the server will know to ignore
            the request if it has already been completed. The server stores the request
            ID for 60 minutes after the first request.
            +
            For example, consider a situation where you make an initial request and the
            request times out. If you make the request again with the same request
            ID, the server can check if original operation with the same request ID
            was received, and if so, will ignore the second request. This prevents
            clients from accidentally creating duplicate commitments.
            +
            The request ID must be a valid UUID with the exception that zero UUID is
            not supported (00000000-0000-0000-0000-000000000000).
        template-metadata-custom-llm-response-safety-error-code: |-
            Indicates the custom error code set by the user to be returned to the end
            user if the LLM response trips Model Armor filters.
        template-metadata-custom-llm-response-safety-error-message: |-
            Indicates the custom error message set by the user to be returned to the
            end user if the LLM response trips Model Armor filters.
        template-metadata-custom-prompt-safety-error-code: |-
            Indicates the custom error code set by the user to be returned to the end
            user by the service extension if the prompt trips Model Armor filters.
        template-metadata-custom-prompt-safety-error-message: |-
            Indicates the custom error message set by the user to be returned to the
            end user if the prompt trips Model Armor filters.
        template-metadata-enforcement-type: |-
            Enforcement type for Model Armor filters. _TEMPLATE_METADATA_ENFORCEMENT_TYPE_ must be one of:
            +
            *inspect-and-block*::: Model Armor filters will run in inspect and block mode. Requests
            that trip Model Armor filters will be blocked.
            *inspect-only*::: Model Armor filters will run in inspect only mode. No action will be
            taken on the request.
            :::
            +
        template-metadata-ignore-partial-invocation-failures: If true, partial detector failures should be ignored.
        template-metadata-log-operations: If true, log template crud operations.
        template-metadata-log-sanitize-operations: If true, log sanitize operations.
