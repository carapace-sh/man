name: delete-kx-volume
description: Deletes a volume.
flags:
    --client-token=: A token that ensures idempotency.
    --environment-id=!: A unique identifier for the kdb environment, whose clusters can attach to the volume.
    --volume-name=!: The name of the volume that you want to delete.
documentation:
    command: Deletes a volume. You can only delete a volume if it's not attached to a cluster or a dataview. When a volume is deleted, any data on the volume is lost. This action is irreversible.
    flag:
        client-token: A token that ensures idempotency. This token expires in 10 minutes.
        environment-id: A unique identifier for the kdb environment, whose clusters can attach to the volume.
        volume-name: The name of the volume that you want to delete.
