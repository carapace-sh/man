name: get
description: '*(ALPHA)*  Print the value of a Google Cloud CLI property.'
documentation:
    command: |-
        *(ALPHA)*  gcloud alpha config get prints the property value from your active client side configuration
        only.

        ## AVAILABLE PROPERTIES

        {properties}

        ## EXAMPLES

        To print the project property in the core section, run:

          $ gcloud alpha config get project

        To print the zone property in the compute section, run:

          $ gcloud alpha config get compute/zone
