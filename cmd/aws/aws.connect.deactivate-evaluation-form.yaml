name: deactivate-evaluation-form
description: Deactivates an evaluation form in the specified Amazon Connect instance.
flags:
    --evaluation-form-id=!: The unique identifier for the evaluation form.
    --evaluation-form-version=!: A version of the evaluation form.
    --instance-id=!: The identifier of the Amazon Connect instance.
documentation:
    command: Deactivates an evaluation form in the specified Amazon Connect instance. After a form is deactivated, it is no longer available for users to start new evaluations based on the form.
    flag:
        evaluation-form-id: The unique identifier for the evaluation form.
        evaluation-form-version: A version of the evaluation form. If the version property is not provided, the latest version of the evaluation form is deactivated.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
