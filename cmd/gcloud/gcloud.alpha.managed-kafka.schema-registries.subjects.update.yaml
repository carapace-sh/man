name: update
description: '*(ALPHA)*  Update the mode and compatibility of a subject.'
flags:
    --compatibility=: The compatibility of the subject to update.
    --context=: The context of the subject.
    --delete-config: Delete the config of the subject.
    --delete-mode: Delete the mode of the subject.
    --location=: ID of the location of the Managed Service for Apache Kafka resource.
    --mode=: The mode of the subject to update.
    --no-delete-config&: Delete the config of the subject.
    --no-delete-mode&: Delete the mode of the subject.
    --registry=: The schema registry name.
documentation:
    command: |-
        ## EXAMPLES

        Modify the mode of the subject to READONLY:

          $ gcloud alpha managed-kafka schema-registries subjects update --registry=SCHEMA_REGISTRY --context=CONTEXT
          --project=PROJECT_ID --location=LOCATION_ID --mode=READONLY

        Modify the compatibility of the subject to BACKWARDS:

          $ gcloud alpha managed-kafka schema-registries subjects update --registry=SCHEMA_REGISTRY --context=CONTEXT
          --project=PROJECT_ID --location=LOCATION_ID --compatibility=BACKWARDS
    flag:
        compatibility: The compatibility of the subject to update.
        context: The context of the subject.
        delete-config: Delete the config of the subject.
        delete-mode: Delete the mode of the subject.
        location: |-
            ID of the location of the Managed Service for Apache Kafka resource. See
            https://cloud.google.com/managed-service-for-apache-kafka/docs/locations for a list of supported
            locations.
            +

            To set the `location` attribute:
            * provide the argument `subject` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        mode: The mode of the subject to update.
        no-delete-config: Delete the config of the subject.
        no-delete-mode: Delete the mode of the subject.
        registry: |-
            The schema registry name.
            +

            To set the `schema-registry` attribute:
            * provide the argument `subject` on the command line with a fully specified name;
            * provide the argument `--registry` on the command line.
