name: get-tables
description: Retrieves the definitions of some or all of the tables in a given `Database`.
flags:
    --attributes-to-get=: Specifies the table fields returned by the `GetTables` call.
    --catalog-id=: The ID of the Data Catalog where the tables reside.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --database-name=!: The database in the catalog whose tables to list.
    --expression=: A regular expression pattern.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --include-status-details: Specifies whether to include status details related to a request to create or update an Glue Data Catalog view.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of tables to return in a single response.
    --next-token=: A continuation token, included if this is a continuation call.
    --no-include-status-details: Specifies whether to include status details related to a request to create or update an Glue Data Catalog view.
    --page-size=: The size of each page to get in the AWS service call.
    --query-as-of-time=: The time as of when to read the table contents.
    --starting-token=: A token to specify where to start paginating.
    --transaction-id=: The transaction ID at which to read the table contents.
documentation:
    command: Retrieves the definitions of some or all of the tables in a given `Database`.
    flag:
        attributes-to-get: |-
            Specifies the table fields returned by the `GetTables` call. This parameter doesn’t accept an empty list. The request must include `NAME`.

            The following are the valid combinations of values:

            - `NAME` - Names of all tables in the database.
            - `NAME`, `TABLE_TYPE` - Names of all tables and the table types.
        catalog-id: The ID of the Data Catalog where the tables reside. If none is provided, the Amazon Web Services account ID is used by default.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        database-name: The database in the catalog whose tables to list. For Hive compatibility, this name is entirely lowercase.
        expression: A regular expression pattern. If present, only those tables whose names match the pattern are returned.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        include-status-details: Specifies whether to include status details related to a request to create or update an Glue Data Catalog view.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of tables to return in a single response.
        next-token: A continuation token, included if this is a continuation call.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        query-as-of-time: The time as of when to read the table contents. If not set, the most recent transaction commit time will be used. Cannot be specified along with `TransactionId`.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        transaction-id: The transaction ID at which to read the table contents.
