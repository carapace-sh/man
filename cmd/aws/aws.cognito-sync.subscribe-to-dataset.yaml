name: subscribe-to-dataset
description: Subscribes to receive notifications when a dataset is modified by another device.
flags:
    --dataset-name=!: The name of the dataset to subcribe to.
    --device-id=!: The unique ID generated for this device by Cognito.
    --identity-id=!: Unique ID for this identity.
    --identity-pool-id=!: A name-spaced GUID (for example, us-east-1:23EC4050-6AEA-7089-A2DD-08002EXAMPLE) created by Amazon Cognito.
documentation:
    command: |-
        Subscribes to receive notifications when a dataset is modified by another device.

        This API can only be called with temporary credentials provided by Cognito Identity. You cannot call this API with developer credentials.
    flag:
        dataset-name: The name of the dataset to subcribe to.
        device-id: The unique ID generated for this device by Cognito.
        identity-id: Unique ID for this identity.
        identity-pool-id: A name-spaced GUID (for example, us-east-1:23EC4050-6AEA-7089-A2DD-08002EXAMPLE) created by Amazon Cognito. The ID of the pool to which the identity belongs.
