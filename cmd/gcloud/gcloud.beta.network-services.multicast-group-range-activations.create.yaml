name: create
description: '*(BETA)*  Create a multicast group range activation.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: The description for the multicast group.
    --enable-logging: Whether to enable logging for this multicast group range activation.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location Id.
    --multicast-domain-activation=!: The multicast domain activation to be used.
    --multicast-group-range=!: The multicast group range to be used.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-enable-logging&: Whether to enable logging for this multicast group range activation.
documentation:
    command: |
        *(BETA)*  Create a multicast group range activation in the specified location of the current project.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: The description for the multicast group.
        enable-logging: Whether to enable logging for this multicast group range activation. Use *--enable-logging* to enable and *--no-enable-logging* to disable.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location Id.
            +
            To set the `location` attribute:
            * provide the argument `multicast_group_range_activation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        multicast-domain-activation: The multicast domain activation to be used.
        multicast-group-range: The multicast group range to be used.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-enable-logging: Whether to enable logging for this multicast group range activation.
