name: untag-resource
description: Deletes tags from an Application Auto Scaling scalable target.
flags:
    --resource-arn=!: Identifies the Application Auto Scaling scalable target from which to remove tags.
    --tag-keys=!: One or more tag keys.
documentation:
    command: Deletes tags from an Application Auto Scaling scalable target. To delete a tag, specify the tag key and the Application Auto Scaling scalable target.
    flag:
        resource-arn: |-
            Identifies the Application Auto Scaling scalable target from which to remove tags.

            For example: `arn:aws:application-autoscaling:us-east-1:123456789012:scalable-target/1234abcd56ab78cd901ef1234567890ab123`

            To get the ARN for a scalable target, use [DescribeScalableTargets]().
        tag-keys: One or more tag keys. Specify only the tag keys, not the tag values.
