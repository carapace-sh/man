name: preview
description: '*(ALPHA)*  Retrieve a list of users in a customer account using CEL query.'
flags:
    --custom-field-mask=: A comma-separated list of schema names.
    --customer=: The customer ID for the customer's G Suite account.
    --max-results=: Maximum number of results to return.
    --page-token=: Token to specify next page in the list.
    --projection=: Subsets of fields to fetch for this user.
    --query=: Query string using CEL and supported user attributes
    --view-type=: Whether to fetch the administrator-only or domain-wide public view of the user.
completion:
    flag:
        projection:
            - basic
            - full
            - custom
        view-type:
            - admin-view
            - domain-public
documentation:
    command: '*(ALPHA)*  Retrieve a list of users in a customer account using CEL query.'
    flag:
        custom-field-mask: A comma-separated list of schema names. All fields from these schemas are fetched. This should only be set when --projection=custom.
        customer: The customer ID for the customer's G Suite account.
        max-results: Maximum number of results to return. Acceptable values are 1 to 500, inclusive.
        page-token: Token to specify next page in the list.
        projection: 'Subsets of fields to fetch for this user. _PROJECTION_ must be one of: *basic*, *full*, *custom*.'
        query: Query string using CEL and supported user attributes
        view-type: 'Whether to fetch the administrator-only or domain-wide public view of the user. _VIEW_TYPE_ must be one of: *admin-view*, *domain-public*.'
