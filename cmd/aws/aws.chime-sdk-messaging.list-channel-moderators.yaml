name: list-channel-moderators
description: Lists all the moderators for a channel.
flags:
    --channel-arn=!: The ARN of the channel.
    --chime-bearer=!: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
    --max-results=: The maximum number of moderators that you want returned.
    --next-token=: The token passed by previous API calls until all requested moderators are returned.
documentation:
    command: |-
        Lists all the moderators for a channel.

        The `x-amz-chime-bearer` request header is mandatory. Use the ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call as the value in the header.
    flag:
        channel-arn: The ARN of the channel.
        chime-bearer: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
        max-results: The maximum number of moderators that you want returned.
        next-token: The token passed by previous API calls until all requested moderators are returned.
