name: update-environment
description: Update an environment.
flags:
    --codebuild-role-arn=: The Amazon Resource Name (ARN) of the IAM service role that allows Proton to provision infrastructure using CodeBuild-based provisioning on your behalf.
    --component-role-arn=: The Amazon Resource Name (ARN) of the IAM service role that Proton uses when provisioning directly defined components in this environment.
    --deployment-type=!: There are four modes for updating an environment.
    --description=: A description of the environment update.
    --environment-account-connection-id=: The ID of the environment account connection.
    --name=!: The name of the environment to update.
    --proton-service-role-arn=: The Amazon Resource Name (ARN) of the Proton service role that allows Proton to make API calls to other services your behalf.
    --provisioning-repository=: The linked repository that you use to host your rendered infrastructure templates for self-managed provisioning.
    --spec=: The formatted specification that defines the update.
    --template-major-version=: The major version of the environment to update.
    --template-minor-version=: The minor version of the environment to update.
completion:
    flag:
        deployment-type:
            - NONE
            - CURRENT_VERSION
            - MINOR_VERSION
            - MAJOR_VERSION
documentation:
    command: |-
        Update an environment.

        If the environment is associated with an environment account connection, *don't* update or include the `protonServiceRoleArn` and `provisioningRepository` parameter to update or connect to an environment account connection.

        You can only update to a new environment account connection if that connection was created in the same environment account that the current environment account connection was created in. The account connection must also be associated with the current environment.

        If the environment *isn't* associated with an environment account connection, *don't* update or include the `environmentAccountConnectionId` parameter. You *can't* update or connect the environment to an environment account connection if it *isn't* already associated with an environment connection.

        You can update either the `environmentAccountConnectionId` or `protonServiceRoleArn` parameter and value. You can’t update both.

        If the environment was configured for Amazon Web Services-managed provisioning, omit the `provisioningRepository` parameter.

        If the environment was configured for self-managed provisioning, specify the `provisioningRepository` parameter and omit the `protonServiceRoleArn` and `environmentAccountConnectionId` parameters.

        For more information, see [Environments](https://docs.aws.amazon.com/proton/latest/userguide/ag-environments.html) and [Provisioning methods](https://docs.aws.amazon.com/proton/latest/userguide/ag-works-prov-methods.html) in the *Proton User Guide*.

        There are four modes for updating an environment. The `deploymentType` field defines the mode.

        `NONE`

        In this mode, a deployment *doesn't* occur. Only the requested metadata parameters are updated.

        `CURRENT_VERSION`

        In this mode, the environment is deployed and updated with the new spec that you provide. Only requested parameters are updated. *Don’t* include minor or major version parameters when you use this `deployment-type`.

        `MINOR_VERSION`

        In this mode, the environment is deployed and updated with the published, recommended (latest) minor version of the current major version in use, by default. You can also specify a different minor version of the current major version in use.

        `MAJOR_VERSION`

        In this mode, the environment is deployed and updated with the published, recommended (latest) major and minor version of the current template, by default. You can also specify a different major version that's higher than the major version in use and a minor version.
    flag:
        codebuild-role-arn: The Amazon Resource Name (ARN) of the IAM service role that allows Proton to provision infrastructure using CodeBuild-based provisioning on your behalf.
        component-role-arn: |-
            The Amazon Resource Name (ARN) of the IAM service role that Proton uses when provisioning directly defined components in this environment. It determines the scope of infrastructure that a component can provision.

            The environment must have a `componentRoleArn` to allow directly defined components to be associated with the environment.

            For more information about components, see [Proton components](https://docs.aws.amazon.com/proton/latest/userguide/ag-components.html) in the *Proton User Guide*.
        deployment-type: |-
            There are four modes for updating an environment. The `deploymentType` field defines the mode.

            `NONE`

            In this mode, a deployment *doesn't* occur. Only the requested metadata parameters are updated.

            `CURRENT_VERSION`

            In this mode, the environment is deployed and updated with the new spec that you provide. Only requested parameters are updated. *Don’t* include major or minor version parameters when you use this `deployment-type`.

            `MINOR_VERSION`

            In this mode, the environment is deployed and updated with the published, recommended (latest) minor version of the current major version in use, by default. You can also specify a different minor version of the current major version in use.

            `MAJOR_VERSION`

            In this mode, the environment is deployed and updated with the published, recommended (latest) major and minor version of the current template, by default. You can also specify a different major version that is higher than the major version in use and a minor version (optional).
        description: A description of the environment update.
        environment-account-connection-id: |-
            The ID of the environment account connection.

            You can only update to a new environment account connection if it was created in the same environment account that the current environment account connection was created in and is associated with the current environment.
        name: The name of the environment to update.
        proton-service-role-arn: The Amazon Resource Name (ARN) of the Proton service role that allows Proton to make API calls to other services your behalf.
        provisioning-repository: The linked repository that you use to host your rendered infrastructure templates for self-managed provisioning. A linked repository is a repository that has been registered with Proton. For more information, see [CreateRepository]().
        spec: The formatted specification that defines the update.
        template-major-version: The major version of the environment to update.
        template-minor-version: The minor version of the environment to update.
