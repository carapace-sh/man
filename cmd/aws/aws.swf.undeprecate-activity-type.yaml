name: undeprecate-activity-type
description: Undeprecates a previously deprecated *activity type*.
flags:
    --activity-type=!: The activity type to undeprecate.
    --domain=!: The name of the domain of the deprecated activity type.
documentation:
    command: "Undeprecates a previously deprecated *activity type*. After an activity type has been undeprecated, you can create new tasks of that activity type.\n\nThis operation is eventually consistent. The results are best effort and may not exactly reflect recent updates and changes.\n\n**Access Control**\n\nYou can use IAM policies to control this action's access to Amazon SWF resources as follows:\n\n- Use a `Resource` element with the domain name to limit the action to only specified domains.\n- Use an `Action` element to allow or deny permission to call this action.\n- Constrain the following parameters by using a `Condition` element with the appropriate keys.\n  \n  - `activityType.name`: String constraint. The key is `swf:activityType.name`.\n  - `activityType.version`: String constraint. The key is `swf:activityType.version`.\n\nIf the caller doesn't have sufficient permissions to invoke the action, or the parameter values fall outside the specified constraints, the action fails. The associated event attribute's `cause` parameter is set to `OPERATION_NOT_PERMITTED`. For details and example IAM policies, see [Using IAM to Manage Access to Amazon SWF Workflows](https://docs.aws.amazon.com/amazonswf/latest/developerguide/swf-dev-iam.html) in the *Amazon SWF Developer Guide*."
    flag:
        activity-type: The activity type to undeprecate.
        domain: The name of the domain of the deprecated activity type.
