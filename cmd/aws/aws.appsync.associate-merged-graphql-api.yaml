name: associate-merged-graphql-api
description: Creates an association between a Merged API and source API using the source API's identifier.
flags:
    --description=: The description field.
    --merged-api-identifier=!: The identifier of the AppSync Merged API.
    --source-api-association-config=: The `SourceApiAssociationConfig` object data.
    --source-api-identifier=!: The identifier of the AppSync Source API.
documentation:
    command: Creates an association between a Merged API and source API using the source API's identifier.
    flag:
        description: The description field.
        merged-api-identifier: The identifier of the AppSync Merged API. This is generated by the AppSync service. In most cases, Merged APIs (especially in your account) only require the API ID value or ARN of the merged API. However, Merged APIs in other accounts (cross-account use cases) strictly require the full resource ARN of the merged API.
        source-api-association-config: The `SourceApiAssociationConfig` object data.
        source-api-identifier: The identifier of the AppSync Source API. This is generated by the AppSync service. In most cases, source APIs (especially in your account) only require the API ID value or ARN of the source API. However, source APIs from other accounts (cross-account use cases) strictly require the full resource ARN of the source API.
