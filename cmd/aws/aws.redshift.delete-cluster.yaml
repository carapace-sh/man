name: delete-cluster
description: Deletes a previously provisioned cluster without its final snapshot being created.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cluster-identifier=!: The identifier of the cluster to be deleted.
    --final-cluster-snapshot-identifier=: The identifier of the final snapshot that is to be created immediately before deleting the cluster.
    --final-cluster-snapshot-retention-period=: The number of days that a manual snapshot is retained.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-skip-final-cluster-snapshot: Determines whether a final snapshot of the cluster is created before Amazon Redshift deletes the cluster.
    --skip-final-cluster-snapshot: Determines whether a final snapshot of the cluster is created before Amazon Redshift deletes the cluster.
documentation:
    command: |-
        Deletes a previously provisioned cluster without its final snapshot being created. A successful response from the web service indicates that the request was received correctly. Use [DescribeClusters]() to monitor the status of the deletion. The delete operation cannot be canceled or reverted once submitted. For more information about managing clusters, go to [Amazon Redshift Clusters](https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-clusters.html) in the *Amazon Redshift Cluster Management Guide*.

        If you want to shut down the cluster and retain it for future use, set *SkipFinalClusterSnapshot* to `false` and specify a name for *FinalClusterSnapshotIdentifier*. You can later restore this snapshot to resume using the cluster. If a final cluster snapshot is requested, the status of the cluster will be "final-snapshot" while the snapshot is being taken, then it's "deleting" once Amazon Redshift begins deleting the cluster.

        For more information about managing clusters, go to [Amazon Redshift Clusters](https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-clusters.html) in the *Amazon Redshift Cluster Management Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cluster-identifier: |-
            The identifier of the cluster to be deleted.

            Constraints:

            - Must contain lowercase characters.
            - Must contain from 1 to 63 alphanumeric characters or hyphens.
            - First character must be a letter.
            - Cannot end with a hyphen or contain two consecutive hyphens.
        final-cluster-snapshot-identifier: |-
            The identifier of the final snapshot that is to be created immediately before deleting the cluster. If this parameter is provided, *SkipFinalClusterSnapshot* must be `false`.

            Constraints:

            - Must be 1 to 255 alphanumeric characters.
            - First character must be a letter.
            - Cannot end with a hyphen or contain two consecutive hyphens.
        final-cluster-snapshot-retention-period: |-
            The number of days that a manual snapshot is retained. If the value is -1, the manual snapshot is retained indefinitely.

            The value must be either -1 or an integer between 1 and 3,653.

            The default value is -1.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        skip-final-cluster-snapshot: |-
            Determines whether a final snapshot of the cluster is created before Amazon Redshift deletes the cluster. If `true`, a final cluster snapshot is not created. If `false`, a final cluster snapshot is created before the cluster is deleted.

            The *FinalClusterSnapshotIdentifier* parameter must be specified if *SkipFinalClusterSnapshot* is `false`.

            Default: `false`
