name: untag-resource
description: Removes a specific tag associated with an Amazon Translate resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the given Amazon Translate resource from which you want to remove the tags.
    --tag-keys=!: The initial part of a key-value pair that forms a tag being removed from a given resource.
documentation:
    command: Removes a specific tag associated with an Amazon Translate resource. For more information, see [Tagging your resources](https://docs.aws.amazon.com/translate/latest/dg/tagging.html).
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the given Amazon Translate resource from which you want to remove the tags.
        tag-keys: The initial part of a key-value pair that forms a tag being removed from a given resource. Keys must be unique and cannot be duplicated for a particular resource.
