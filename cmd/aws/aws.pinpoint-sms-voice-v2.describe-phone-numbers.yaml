name: describe-phone-numbers
description: Describes the specified origination phone number, or all the phone numbers in your account.
flags:
    --filters=: An array of PhoneNumberFilter objects to filter the results.
    --max-results=: The maximum number of results to return per each request.
    --next-token=: The token to be used for the next set of paginated results.
    --owner=: Use `SELF` to filter the list of phone numbers to ones your account owns or use `SHARED` to filter on phone numbers shared with your account.
    --phone-number-ids=: The unique identifier of phone numbers to find information about.
completion:
    flag:
        owner:
            - SELF
            - SHARED
documentation:
    command: |-
        Describes the specified origination phone number, or all the phone numbers in your account.

        If you specify phone number IDs, the output includes information for only the specified phone numbers. If you specify filters, the output includes information for only those phone numbers that meet the filter criteria. If you don't specify phone number IDs or filters, the output includes information for all phone numbers.

        If you specify a phone number ID that isn't valid, an error is returned.
    flag:
        filters: An array of PhoneNumberFilter objects to filter the results.
        max-results: The maximum number of results to return per each request.
        next-token: The token to be used for the next set of paginated results. You don't need to supply a value for this field in the initial request.
        owner: Use `SELF` to filter the list of phone numbers to ones your account owns or use `SHARED` to filter on phone numbers shared with your account. The `Owner` and `PhoneNumberIds` parameters can't be used at the same time.
        phone-number-ids: |-
            The unique identifier of phone numbers to find information about. This is an array of strings that can be either the PhoneNumberId or PhoneNumberArn.

            If you are using a shared End User MessagingSMS resource then you must use the full Amazon Resource Name(ARN).
