name: describe-dblog-files
description: Returns a list of DB log files for the DB instance.
flags:
    --dbinstance-identifier=!: The customer-assigned name of the DB instance that contains the log files you want to list.
    --file-last-written=: Filters the available log files for files written since the specified date, in POSIX timestamp format with milliseconds.
    --file-size=: Filters the available log files for files larger than the specified size.
    --filename-contains=: Filters the available log files for log file names that contain the specified string.
    --filters=: This parameter isn't currently supported.
    --marker=: The pagination token provided in the previous request.
    --max-records=: The maximum number of records to include in the response.
documentation:
    command: |-
        Returns a list of DB log files for the DB instance.

        This command doesn't apply to RDS Custom.
    flag:
        dbinstance-identifier: |-
            The customer-assigned name of the DB instance that contains the log files you want to list.

            Constraints:

            - Must match the identifier of an existing DBInstance.
        file-last-written: Filters the available log files for files written since the specified date, in POSIX timestamp format with milliseconds.
        file-size: Filters the available log files for files larger than the specified size.
        filename-contains: Filters the available log files for log file names that contain the specified string.
        filters: This parameter isn't currently supported.
        marker: The pagination token provided in the previous request. If this parameter is specified the response includes only records beyond the marker, up to MaxRecords.
        max-records: The maximum number of records to include in the response. If more records exist than the specified MaxRecords value, a pagination token called a marker is included in the response so you can retrieve the remaining results.
