name: node-templates
description: '*(BETA)*  Read and manage Compute Engine sole-tenancy node templates.'
documentation:
    command: |-
        *(BETA)*  Node templates are used to create the nodes in node groups. Nodes are
        Compute Engine servers that are dedicated to your workload. Node templates
        define either the node type or the requirements for a node in terms of
        vCPU, memory, and localSSD.
