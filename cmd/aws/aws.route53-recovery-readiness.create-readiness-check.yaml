name: create-readiness-check
description: Creates a readiness check in an account.
flags:
    --readiness-check-name=!: The name of the readiness check to create.
    --resource-set-name=!: The name of the resource set to check.
    --tags=: ""
documentation:
    command: Creates a readiness check in an account. A readiness check monitors a resource set in your application, such as a set of Amazon Aurora instances, that Application Recovery Controller is auditing recovery readiness for. The audits run once every minute on every resource that's associated with a readiness check.
    flag:
        readiness-check-name: The name of the readiness check to create.
        resource-set-name: The name of the resource set to check.
        tags: ""
