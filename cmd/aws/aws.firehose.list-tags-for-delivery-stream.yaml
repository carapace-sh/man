name: list-tags-for-delivery-stream
description: Lists the tags for the specified Firehose stream.
flags:
    --delivery-stream-name=!: The name of the Firehose stream whose tags you want to list.
    --exclusive-start-tag-key=: The key to use as the starting point for the list of tags.
    --limit=: The number of tags to return.
documentation:
    command: Lists the tags for the specified Firehose stream. This operation has a limit of five transactions per second per account.
    flag:
        delivery-stream-name: The name of the Firehose stream whose tags you want to list.
        exclusive-start-tag-key: The key to use as the starting point for the list of tags. If you set this parameter, `ListTagsForDeliveryStream` gets all tags that occur after `ExclusiveStartTagKey`.
        limit: The number of tags to return. If this number is less than the total number of tags associated with the Firehose stream, `HasMoreTags` is set to `true` in the response. To list additional tags, set `ExclusiveStartTagKey` to the last key in the response.
