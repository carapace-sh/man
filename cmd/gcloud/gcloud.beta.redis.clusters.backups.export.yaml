name: export
description: '*(BETA)*  Export a Redis cluster backup to a Google Cloud Storage bucket.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --backup-collection=: The name of the Redis cluster backup collection.
    --gcs-bucket=!: The name of the Google Cloud Storage bucket to export the backup to.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: The name of the Redis region of the backup.
documentation:
    command: |
        *(BETA)*  This command exports a Redis cluster backup to a Google Cloud Storage bucket.
        A new folder will be created in the bucket with the backup name. And the backup files will be
        stored in the folder.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        backup-collection: |-
            The name of the Redis cluster backup collection.
            +
            To set the `backup-collection` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--backup-collection` on the command line.
        gcs-bucket: The name of the Google Cloud Storage bucket to export the backup to.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            The name of the Redis region of the backup. Overrides the default
            redis/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `redis/region`.
