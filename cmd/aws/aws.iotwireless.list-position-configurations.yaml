name: list-position-configurations
description: List position configurations for a given resource, such as positioning solvers.
flags:
    --max-results=: ""
    --next-token=: To retrieve the next set of results, the `nextToken` value from a previous response; otherwise **null** to receive the first set of results.
    --resource-type=: Resource type for which position configurations are listed.
completion:
    flag:
        resource-type:
            - WirelessDevice
            - WirelessGateway
documentation:
    command: |-
        List position configurations for a given resource, such as positioning solvers.

        This action is no longer supported. Calls to retrieve position information should use the [GetResourcePosition](https://docs.aws.amazon.com/iot-wireless/latest/apireference/API_GetResourcePosition.html) API operation instead.
    flag:
        max-results: ""
        next-token: To retrieve the next set of results, the `nextToken` value from a previous response; otherwise **null** to receive the first set of results.
        resource-type: Resource type for which position configurations are listed.
