name: set-ip-address-type
description: Sets the IP address type for an Amazon Lightsail resource.
flags:
    --accept-bundle-update: Required parameter to accept the instance bundle update when changing to, and from, IPv6-only.
    --ip-address-type=!: The IP address type to set for the specified resource.
    --no-accept-bundle-update: Required parameter to accept the instance bundle update when changing to, and from, IPv6-only.
    --resource-name=!: The name of the resource for which to set the IP address type.
    --resource-type=!: The resource type.
completion:
    flag:
        ip-address-type:
            - dualstack
            - ipv4
            - ipv6
        resource-type:
            - ContainerService
            - Instance
            - StaticIp
            - KeyPair
            - InstanceSnapshot
            - Domain
            - PeeredVpc
            - LoadBalancer
            - LoadBalancerTlsCertificate
            - Disk
            - DiskSnapshot
            - RelationalDatabase
            - RelationalDatabaseSnapshot
            - ExportSnapshotRecord
            - CloudFormationStackRecord
            - Alarm
            - ContactMethod
            - Distribution
            - Certificate
            - Bucket
documentation:
    command: |-
        Sets the IP address type for an Amazon Lightsail resource.

        Use this action to enable dual-stack for a resource, which enables IPv4 and IPv6 for the specified resource. Alternately, you can use this action to disable dual-stack, and enable IPv4 only.
    flag:
        accept-bundle-update: |-
            Required parameter to accept the instance bundle update when changing to, and from, IPv6-only.

            An instance bundle will change when switching from `dual-stack` or `ipv4`, to `ipv6`. It also changes when switching from `ipv6`, to `dual-stack` or `ipv4`.

            You must include this parameter in the command to update the bundle. For example, if you switch from `dual-stack` to `ipv6`, the bundle will be updated, and billing for the IPv6-only instance bundle begins immediately.
        ip-address-type: |-
            The IP address type to set for the specified resource.

            The possible values are `ipv4` for IPv4 only, `ipv6` for IPv6 only, and `dualstack` for IPv4 and IPv6.
        resource-name: The name of the resource for which to set the IP address type.
        resource-type: |-
            The resource type.

            The resource values are `Distribution`, `Instance`, and `LoadBalancer`.

            Distribution-related APIs are available only in the N. Virginia (`us-east-1`) Amazon Web Services Region. Set your Amazon Web Services Region configuration to `us-east-1` to create, view, or edit distributions.
