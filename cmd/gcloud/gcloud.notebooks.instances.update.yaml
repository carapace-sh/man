name: update
description: Request for updating instances.
flags:
    --accelerator-core-count=: Count of cores of this accelerator.
    --accelerator-type=: Type of this accelerator.
    --async: Return immediately, without waiting for the operation in progress to
    --labels=: Labels to apply to this instance.
    --location=: Google Cloud location of this environment https://cloud.google.com/compute/docs/regions-zones/#locations.
    --machine-type=: The [Compute Engine machine type](/compute/docs/machine-types).
    --no-async&: Return immediately, without waiting for the operation in progress to
completion:
    flag:
        accelerator-type:
            - NVIDIA_TESLA_A100
            - NVIDIA_TESLA_K80
            - NVIDIA_TESLA_P100
            - NVIDIA_TESLA_V100
            - NVIDIA_TESLA_P4
            - NVIDIA_TESLA_T4
            - NVIDIA_TESLA_T4_VWS
            - NVIDIA_TESLA_P100_VWS
            - NVIDIA_TESLA_P4_VWS
            - TPU_V2
            - TPU_V3
            - NVIDIA_L4
            - NVIDIA_H100_80GB
            - NVIDIA_H100_MEGA_80GB
documentation:
    command: |
        Request for updating notebook instances.
    flag:
        accelerator-core-count: Count of cores of this accelerator.
        accelerator-type: 'Type of this accelerator. _ACCELERATOR_TYPE_ must be one of: *NVIDIA_TESLA_A100*, *NVIDIA_TESLA_K80*, *NVIDIA_TESLA_P100*, *NVIDIA_TESLA_V100*, *NVIDIA_TESLA_P4*, *NVIDIA_TESLA_T4*, *NVIDIA_TESLA_T4_VWS*, *NVIDIA_TESLA_P100_VWS*, *NVIDIA_TESLA_P4_VWS*, *TPU_V2*, *TPU_V3*, *NVIDIA_L4*, *NVIDIA_H100_80GB*, *NVIDIA_H100_MEGA_80GB*.'
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        labels: Labels to apply to this instance. These can be later modified by the setLabels method.
        location: |-
            Google Cloud location of this environment https://cloud.google.com/compute/docs/regions-zones/#locations.
            +
            To set the `location` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `notebooks/location`.
        machine-type: The [Compute Engine machine type](/compute/docs/machine-types).
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
