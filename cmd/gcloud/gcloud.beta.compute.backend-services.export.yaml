name: export
description: '*(BETA)*  Export a backend service.'
flags:
    --destination=: Path to a YAML file where the configuration will be exported.
    --global: If set, the backend service is global.
    --no-global&: If set, the backend service is global.
    --region=: Region of the backend service to export.
documentation:
    command: |
        *(BETA)*  Exports a backend service's configuration to a file.
        This configuration can be imported at a later time.
    flag:
        destination: |-
            Path to a YAML file where the configuration will be exported.
                      Alternatively, you may omit this flag to write to standard output. For a schema describing the export/import format, see:
                      $CLOUDSDKROOT/lib/googlecloudsdk/schemas/compute/beta/BackendService.yaml.
        global: If set, the backend service is global.
        no-global: If set, the backend service is global.
        region: Region of the backend service to export. Overrides the default *compute/region* property value for this command invocation.
