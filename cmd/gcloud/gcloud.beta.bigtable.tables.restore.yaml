name: restore
description: '*(BETA)*  Restore a Cloud Bigtable backup to a new table.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --destination-instance=: Name of the Bigtable instance.
    --destination=!: ID of the table or fully qualified identifier for the table.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --source-cluster=: Name of the Bigtable cluster.
    --source-instance=: Name of the Bigtable instance.
    --source=!: ID of the backup or fully qualified identifier for the backup.
documentation:
    command: |
        *(BETA)*  This command restores a Cloud Bigtable backup to a new table.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        destination: |-
            ID of the table or fully qualified identifier for the table.
            +
            To set the `destination` attribute:
            * provide the argument `--destination` on the command line.
        destination-instance: |-
            Name of the Bigtable instance.
            +
            To set the `instance` attribute:
            * provide the argument `--destination` on the command line with a fully specified name;
            * provide the argument `--destination-instance` on the command line;
            * provide the argument `--source-instance` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        source: |-
            ID of the backup or fully qualified identifier for the backup.
            +
            To set the `source` attribute:
            * provide the argument `--source` on the command line.
        source-cluster: |-
            Name of the Bigtable cluster.
            +
            To set the `cluster` attribute:
            * provide the argument `--source` on the command line with a fully specified name;
            * provide the argument `--source-cluster` on the command line.
        source-instance: |-
            Name of the Bigtable instance.
            +
            To set the `instance` attribute:
            * provide the argument `--source` on the command line with a fully specified name;
            * provide the argument `--source-instance` on the command line;
            * provide the argument `--destination-instance` on the command line.
