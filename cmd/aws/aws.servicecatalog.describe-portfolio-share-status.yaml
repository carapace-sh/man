name: describe-portfolio-share-status
description: Gets the status of the specified portfolio share operation.
flags:
    --portfolio-share-token=!: The token for the portfolio share operation.
documentation:
    command: Gets the status of the specified portfolio share operation. This API can only be called by the management account in the organization or by a delegated admin.
    flag:
        portfolio-share-token: The token for the portfolio share operation. This token is returned either by CreatePortfolioShare or by DeletePortfolioShare.
