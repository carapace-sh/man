name: create-partner-event-source
description: Called by an SaaS partner to create a partner event source.
flags:
    --account=!: The Amazon Web Services account ID that is permitted to create a matching partner event bus for this partner event source.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the partner event source.
documentation:
    command: "Called by an SaaS partner to create a partner event source. This operation is not used by Amazon Web Services customers.\n\nEach partner event source can be used by one Amazon Web Services account to create a matching partner event bus in that Amazon Web Services account. A SaaS partner must create one partner event source for each Amazon Web Services account that wants to receive those event types.\n\nA partner event source creates events based on resources within the SaaS partner's service or application.\n\nAn Amazon Web Services account that creates a partner event bus that matches the partner event source can use that event bus to receive events from the partner, and then process them using Amazon Web Services Events rules and targets.\n\nPartner event source names follow this format:\n\n`partner_name/event_namespace/event_name`\n\n- *partner\\_name* is determined during partner registration, and identifies the partner to Amazon Web Services customers.\n- *event\\_namespace* is determined by the partner, and is a way for the partner to categorize their events.\n- *event\\_name* is determined by the partner, and should uniquely identify an event-generating resource within the partner system.\n  \n  The *event\\_name* must be unique across all Amazon Web Services customers. This is because the event source is a shared resource between the partner and customer accounts, and each partner event source unique in the partner account.\n\nThe combination of *event\\_namespace* and *event\\_name* should help Amazon Web Services customers decide whether to create an event bus to receive these events."
    flag:
        account: The Amazon Web Services account ID that is permitted to create a matching partner event bus for this partner event source.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the partner event source. This name must be unique and must be in the format `partner_name/event_namespace/event_name`. The Amazon Web Services account that wants to use this partner event source must create a partner event bus with a name that matches the name of the partner event source.
