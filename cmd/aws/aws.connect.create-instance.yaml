name: create-instance
description: This API is in preview release for Amazon Connect and is subject to change.
flags:
    --client-token=: The idempotency token.
    --directory-id=: The identifier for the directory.
    --identity-management-type=!: The type of identity management for your Amazon Connect users.
    --inbound-calls-enabled=!: Your contact center handles incoming contacts.
    --instance-alias=: The name for your instance.
    --outbound-calls-enabled=!: Your contact center allows outbound calls.
    --tags=: The tags used to organize, track, or control access for this resource.
completion:
    flag:
        identity-management-type:
            - SAML
            - CONNECT_MANAGED
            - EXISTING_DIRECTORY
documentation:
    command: |-
        This API is in preview release for Amazon Connect and is subject to change.

        Initiates an Amazon Connect instance with all the supported channels enabled. It does not attach any storage, such as Amazon Simple Storage Service (Amazon S3) or Amazon Kinesis. It also does not allow for any configurations on features, such as Contact Lens for Amazon Connect.

        For more information, see [Create an Amazon Connect instance](https://docs.aws.amazon.com/connect/latest/adminguide/amazon-connect-instances.html) in the *Amazon Connect Administrator Guide*.

        Amazon Connect enforces a limit on the total number of instances that you can create or delete in 30 days. If you exceed this limit, you will get an error message indicating there has been an excessive number of attempts at creating or deleting instances. You must wait 30 days before you can restart creating and deleting instances in your account.
    flag:
        client-token: The idempotency token.
        directory-id: The identifier for the directory.
        identity-management-type: The type of identity management for your Amazon Connect users.
        inbound-calls-enabled: Your contact center handles incoming contacts.
        instance-alias: The name for your instance.
        outbound-calls-enabled: Your contact center allows outbound calls.
        tags: 'The tags used to organize, track, or control access for this resource. For example, `{ "tags": {"key1":"value1", "key2":"value2"} }`.'
