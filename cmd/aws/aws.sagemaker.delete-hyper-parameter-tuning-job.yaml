name: delete-hyper-parameter-tuning-job
description: Deletes a hyperparameter tuning job.
flags:
    --hyper-parameter-tuning-job-name=!: The name of the hyperparameter tuning job that you want to delete.
documentation:
    command: Deletes a hyperparameter tuning job. The `DeleteHyperParameterTuningJob` API deletes only the tuning job entry that was created in SageMaker when you called the `CreateHyperParameterTuningJob` API. It does not delete training jobs, artifacts, or the IAM role that you specified when creating the model.
    flag:
        hyper-parameter-tuning-job-name: The name of the hyperparameter tuning job that you want to delete.
