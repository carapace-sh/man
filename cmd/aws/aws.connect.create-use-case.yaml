name: create-use-case
description: Creates a use case for an integration association.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --integration-association-id=!: The identifier for the integration association.
    --tags=: The tags used to organize, track, or control access for this resource.
    --use-case-type=!: The type of use case to associate to the integration association.
completion:
    flag:
        use-case-type:
            - RULES_EVALUATION
            - CONNECT_CAMPAIGNS
documentation:
    command: Creates a use case for an integration association.
    flag:
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        integration-association-id: The identifier for the integration association.
        tags: 'The tags used to organize, track, or control access for this resource. For example, { "Tags": {"key1":"value1", "key2":"value2"} }.'
        use-case-type: The type of use case to associate to the integration association. Each integration association can have only one of each use case type.
