name: create-account-subscription
description: Creates an Amazon Quick Sight account, or subscribes to Amazon Quick Sight Q.
flags:
    --account-name=!: The name of your Amazon Quick Sight account.
    --active-directory-name=: The name of your Active Directory.
    --admin-group=:
        description: The admin group associated with your Active Directory or IAM Identity Center account.
        nargs: -1
    --admin-pro-group=:
        description: The admin pro group associated with your Active Directory or IAM Identity Center account.
        nargs: -1
    --authentication-method=!: The method that you want to use to authenticate your Quick Sight account.
    --author-group=:
        description: The author group associated with your Active Directory or IAM Identity Center account.
        nargs: -1
    --author-pro-group=:
        description: The author pro group associated with your Active Directory or IAM Identity Center account.
        nargs: -1
    --aws-account-id=!: The Amazon Web Services account ID of the account that you're using to create your Quick Sight account.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --contact-number=: A 10-digit phone number for the author of the Amazon Quick Sight account to use for future communications.
    --directory-id=: The ID of the Active Directory that is associated with your Quick Sight account.
    --edition=: The edition of Amazon Quick Sight that you want your account to have.
    --email-address=: The email address of the author of the Amazon Quick Sight account to use for future communications.
    --first-name=: The first name of the author of the Amazon Quick Sight account to use for future communications.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --iam-identity-center-instance-arn=: The Amazon Resource Name (ARN) for the IAM Identity Center instance.
    --last-name=: The last name of the author of the Amazon Quick Sight account to use for future communications.
    --notification-email=!: The email address that you want Quick Sight to send notifications to regarding your Quick Sight account or Quick Sight subscription.
    --reader-group=:
        description: The reader group associated with your Active Directory or IAM Identity Center account.
        nargs: -1
    --reader-pro-group=:
        description: The reader pro group associated with your Active Directory or IAM Identity Center account.
        nargs: -1
    --realm=: The realm of the Active Directory that is associated with your Quick Sight account.
completion:
    flag:
        authentication-method:
            - IAM_AND_QUICKSIGHT
            - IAM_ONLY
            - ACTIVE_DIRECTORY
            - IAM_IDENTITY_CENTER
        edition:
            - STANDARD
            - ENTERPRISE
            - ENTERPRISE_AND_Q
documentation:
    command: |-
        Creates an Amazon Quick Sight account, or subscribes to Amazon Quick Sight Q.

        The Amazon Web Services Region for the account is derived from what is configured in the CLI or SDK.

        Before you use this operation, make sure that you can connect to an existing Amazon Web Services account. If you don't have an Amazon Web Services account, see [Sign up for Amazon Web Services](https://docs.aws.amazon.com/quicksight/latest/user/setting-up-aws-sign-up.html) in the *Amazon Quick Sight User Guide*. The person who signs up for Amazon Quick Sight needs to have the correct Identity and Access Management (IAM) permissions. For more information, see [IAM Policy Examples for Amazon Quick Sight](https://docs.aws.amazon.com/quicksight/latest/user/iam-policy-examples.html) in the *Amazon Quick Sight User Guide*.

        If your IAM policy includes both the `Subscribe` and `CreateAccountSubscription` actions, make sure that both actions are set to `Allow`. If either action is set to `Deny`, the `Deny` action prevails and your API call fails.

        You can't pass an existing IAM role to access other Amazon Web Services services using this API operation. To pass your existing IAM role to Amazon Quick Sight, see [Passing IAM roles to Amazon Quick Sight](https://docs.aws.amazon.com/quicksight/latest/user/security_iam_service-with-iam.html#security-create-iam-role) in the *Amazon Quick Sight User Guide*.

        You can't set default resource access on the new account from the Amazon Quick Sight API. Instead, add default resource access from the Amazon Quick Sight console. For more information about setting default resource access to Amazon Web Services services, see [Setting default resource access to Amazon Web Services services](https://docs.aws.amazon.com/quicksight/latest/user/scoping-policies-defaults.html) in the *Amazon Quick Sight User Guide*.
    flag:
        account-name: The name of your Amazon Quick Sight account. This name is unique over all of Amazon Web Services, and it appears only when users sign in. You can't change `AccountName` value after the Amazon Quick Sight account is created.
        active-directory-name: The name of your Active Directory. This field is required if `ACTIVE_DIRECTORY` is the selected authentication method of the new Quick Sight account.
        admin-group: |-
            The admin group associated with your Active Directory or IAM Identity Center account. Either this field or the `AdminProGroup` field is required if `ACTIVE_DIRECTORY` or `IAM_IDENTITY_CENTER` is the selected authentication method of the new Quick Sight account.

            For more information about using IAM Identity Center in Amazon Quick Sight, see [Using IAM Identity Center with Amazon Quick Sight Enterprise Edition](https://docs.aws.amazon.com/quicksight/latest/user/sec-identity-management-identity-center.html) in the Amazon Quick Sight User Guide. For more information about using Active Directory in Amazon Quick Sight, see [Using Active Directory with Amazon Quick Sight Enterprise Edition](https://docs.aws.amazon.com/quicksight/latest/user/aws-directory-service.html) in the Amazon Quick Sight User Guide.
        admin-pro-group: |-
            The admin pro group associated with your Active Directory or IAM Identity Center account. Either this field or the `AdminGroup` field is required if `ACTIVE_DIRECTORY` or `IAM_IDENTITY_CENTER` is the selected authentication method of the new Quick Sight account.

            For more information about using IAM Identity Center in Amazon Quick Sight, see [Using IAM Identity Center with Amazon Quick Sight Enterprise Edition](https://docs.aws.amazon.com/quicksight/latest/user/sec-identity-management-identity-center.html) in the Amazon Quick Sight User Guide. For more information about using Active Directory in Amazon Quick Sight, see [Using Active Directory with Amazon Quick Sight Enterprise Edition](https://docs.aws.amazon.com/quicksight/latest/user/aws-directory-service.html) in the Amazon Quick Sight User Guide.
        authentication-method: |-
            The method that you want to use to authenticate your Quick Sight account.

            If you choose `ACTIVE_DIRECTORY`, provide an `ActiveDirectoryName` and an `AdminGroup` associated with your Active Directory.

            If you choose `IAM_IDENTITY_CENTER`, provide an `AdminGroup` associated with your IAM Identity Center account.
        author-group: |-
            The author group associated with your Active Directory or IAM Identity Center account.

            For more information about using IAM Identity Center in Amazon Quick Sight, see [Using IAM Identity Center with Amazon Quick Sight Enterprise Edition](https://docs.aws.amazon.com/quicksight/latest/user/sec-identity-management-identity-center.html) in the Amazon Quick Sight User Guide. For more information about using Active Directory in Amazon Quick Sight, see [Using Active Directory with Amazon Quick Sight Enterprise Edition](https://docs.aws.amazon.com/quicksight/latest/user/aws-directory-service.html) in the Amazon Quick Sight User Guide.
        author-pro-group: |-
            The author pro group associated with your Active Directory or IAM Identity Center account.

            For more information about using IAM Identity Center in Amazon Quick Sight, see [Using IAM Identity Center with Amazon Quick Sight Enterprise Edition](https://docs.aws.amazon.com/quicksight/latest/user/sec-identity-management-identity-center.html) in the Amazon Quick Sight User Guide. For more information about using Active Directory in Amazon Quick Sight, see [Using Active Directory with Amazon Quick Sight Enterprise Edition](https://docs.aws.amazon.com/quicksight/latest/user/aws-directory-service.html) in the Amazon Quick Sight User Guide.
        aws-account-id: The Amazon Web Services account ID of the account that you're using to create your Quick Sight account.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        contact-number: A 10-digit phone number for the author of the Amazon Quick Sight account to use for future communications. This field is required if `ENTERPPRISE_AND_Q` is the selected edition of the new Amazon Quick Sight account.
        directory-id: The ID of the Active Directory that is associated with your Quick Sight account.
        edition: |-
            The edition of Amazon Quick Sight that you want your account to have. Currently, you can choose from `ENTERPRISE` or `ENTERPRISE_AND_Q`.

            If you choose `ENTERPRISE_AND_Q`, the following parameters are required:

            - `FirstName`
            - `LastName`
            - `EmailAddress`
            - `ContactNumber`
        email-address: The email address of the author of the Amazon Quick Sight account to use for future communications. This field is required if `ENTERPPRISE_AND_Q` is the selected edition of the new Amazon Quick Sight account.
        first-name: The first name of the author of the Amazon Quick Sight account to use for future communications. This field is required if `ENTERPPRISE_AND_Q` is the selected edition of the new Amazon Quick Sight account.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        iam-identity-center-instance-arn: The Amazon Resource Name (ARN) for the IAM Identity Center instance.
        last-name: The last name of the author of the Amazon Quick Sight account to use for future communications. This field is required if `ENTERPPRISE_AND_Q` is the selected edition of the new Amazon Quick Sight account.
        notification-email: The email address that you want Quick Sight to send notifications to regarding your Quick Sight account or Quick Sight subscription.
        reader-group: |-
            The reader group associated with your Active Directory or IAM Identity Center account.

            For more information about using IAM Identity Center in Amazon Quick Sight, see [Using IAM Identity Center with Amazon Quick Sight Enterprise Edition](https://docs.aws.amazon.com/quicksight/latest/user/sec-identity-management-identity-center.html) in the Amazon Quick Sight User Guide. For more information about using Active Directory in Amazon Quick Sight, see [Using Active Directory with Amazon Quick Sight Enterprise Edition](https://docs.aws.amazon.com/quicksight/latest/user/aws-directory-service.html) in the Amazon Quick Sight User Guide.
        reader-pro-group: |-
            The reader pro group associated with your Active Directory or IAM Identity Center account.

            For more information about using IAM Identity Center in Amazon Quick Sight, see [Using IAM Identity Center with Amazon Quick Sight Enterprise Edition](https://docs.aws.amazon.com/quicksight/latest/user/sec-identity-management-identity-center.html) in the Amazon Quick Sight User Guide. For more information about using Active Directory in Amazon Quick Sight, see [Using Active Directory with Amazon Quick Sight Enterprise Edition](https://docs.aws.amazon.com/quicksight/latest/user/aws-directory-service.html) in the Amazon Quick Sight User Guide.
        realm: The realm of the Active Directory that is associated with your Quick Sight account. This field is required if `ACTIVE_DIRECTORY` is the selected authentication method of the new Quick Sight account.
