name: get-pipeline-blueprint
description: Retrieves information about a specific blueprint for OpenSearch Ingestion.
flags:
    --blueprint-name=!: The name of the blueprint to retrieve.
    --format=: The format format of the blueprint to retrieve.
documentation:
    command: Retrieves information about a specific blueprint for OpenSearch Ingestion. Blueprints are templates for the configuration needed for a `CreatePipeline` request. For more information, see [Using blueprints to create a pipeline](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/creating-pipeline.html#pipeline-blueprint).
    flag:
        blueprint-name: The name of the blueprint to retrieve.
        format: The format format of the blueprint to retrieve.
