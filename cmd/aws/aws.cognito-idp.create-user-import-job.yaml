name: create-user-import-job
description: Creates a user import job.
flags:
    --cloud-watch-logs-role-arn=!: You must specify an IAM role that has permission to log import-job results to Amazon CloudWatch Logs.
    --job-name=!: A friendly name for the user import job.
    --user-pool-id=!: The ID of the user pool that you want to import users into.
documentation:
    command: |-
        Creates a user import job. You can import users into user pools from a comma-separated values (CSV) file without adding Amazon Cognito MAU costs to your Amazon Web Services bill.

        Amazon Cognito evaluates Identity and Access Management (IAM) policies in requests for this API operation. For this operation, you must use IAM credentials to authorize requests, and you must grant yourself the corresponding IAM permission in a policy.

        **Learn more**

        - [Signing Amazon Web Services API Requests](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_aws-signing.html)
        - [Using the Amazon Cognito user pools API and user pool endpoints](https://docs.aws.amazon.com/cognito/latest/developerguide/user-pools-API-operations.html)
    flag:
        cloud-watch-logs-role-arn: You must specify an IAM role that has permission to log import-job results to Amazon CloudWatch Logs. This parameter is the ARN of that role.
        job-name: A friendly name for the user import job.
        user-pool-id: The ID of the user pool that you want to import users into.
