name: undelete
description: '*(BETA)*  Undeletes a service configuration that was previously deleted.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |-
        *(BETA)*  Services that are deleted will be retained in the system for 30 days.
        If a deleted service is still within this retention window, it can be
        undeleted with this command.

        Note that this means that this command will not be effective for
        service configurations marked for deletion more than 30 days ago.

        ## EXAMPLES
        To undelete a service named `my-service`, run:

          $ gcloud beta endpoints services undelete my-service

        To run the same command asynchronously (non-blocking), run:

          $ gcloud beta endpoints services undelete my-service --async
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
