name: delete
description: '*(BETA)*  *(REMOVED)*  Delete a fleet namespace.'
hidden: true
documentation:
    command: |-
        *(BETA)*  *(REMOVED)*  Delete a fleet namespace.

        This command has been removed as of version 447.0.0. Use `gcloud fleet scopes namespaces delete` instead.

        This command can fail for the following reasons:
        * The project specified does not exist.
        * The namespace specified does not exist.
        * The caller does not have permission to access the given project or
        namespace.

        ## EXAMPLES

        To delete fleet namespace `NAMESPACE` in the active project:

          $ gcloud beta container hub namespaces delete NAMESPACE

        To delete fleet namespace `NAMESPACE` in project `PROJECT_ID`:

          $ gcloud beta container hub namespaces delete NAMESPACE --project=PROJECT_ID
