name: delete-change-set
description: Deletes the specified change set.
flags:
    --change-set-name=!: The name or Amazon Resource Name (ARN) of the change set that you want to delete.
    --stack-name=: If you specified the name of a change set to delete, specify the stack name or Amazon Resource Name (ARN) that's associated with it.
documentation:
    command: |-
        Deletes the specified change set. Deleting change sets ensures that no one executes the wrong change set.

        If the call successfully completes, CloudFormation successfully deleted the change set.

        If `IncludeNestedStacks` specifies `True` during the creation of the nested change set, then `DeleteChangeSet` will delete all change sets that belong to the stacks hierarchy and will also delete all change sets for nested stacks with the status of `REVIEW_IN_PROGRESS`.
    flag:
        change-set-name: The name or Amazon Resource Name (ARN) of the change set that you want to delete.
        stack-name: If you specified the name of a change set to delete, specify the stack name or Amazon Resource Name (ARN) that's associated with it.
