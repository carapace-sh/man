name: create-feature
description: Creates an Evidently *feature* that you want to launch or test.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --default-variation=: The name of the variation to use as the default variation.
    --description=: An optional description of the feature.
    --entity-overrides=: Specify users that should always be served a specific variation of a feature.
    --evaluation-strategy=: Specify `ALL_RULES` to activate the traffic allocation specified by any ongoing launches or experiments.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name for the new feature.
    --project=!: The name or ARN of the project that is to contain the new feature.
    --tags=: Assigns one or more tags (key-value pairs) to the feature.
    --variations=!:
        description: An array of structures that contain the configuration of the feature's different variations.
        nargs: -1
completion:
    flag:
        evaluation-strategy:
            - ALL_RULES
            - DEFAULT_VARIATION
documentation:
    command: |-
        Creates an Evidently *feature* that you want to launch or test. You can define up to five variations of a feature, and use these variations in your launches and experiments. A feature must be created in a project. For information about creating a project, see [CreateProject](https://docs.aws.amazon.com/cloudwatchevidently/latest/APIReference/API_CreateProject.html).

        Don't use this operation to update an existing feature. Instead, use [UpdateFeature](https://docs.aws.amazon.com/cloudwatchevidently/latest/APIReference/API_UpdateFeature.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        default-variation: |-
            The name of the variation to use as the default variation. The default variation is served to users who are not allocated to any ongoing launches or experiments of this feature.

            This variation must also be listed in the `variations` structure.

            If you omit `defaultVariation`, the first variation listed in the `variations` structure is used as the default variation.
        description: An optional description of the feature.
        entity-overrides: |-
            Specify users that should always be served a specific variation of a feature. Each user is specified by a key-value pair . For each key, specify a user by entering their user ID, account ID, or some other identifier. For the value, specify the name of the variation that they are to be served.

            This parameter is limited to 2500 overrides or a total of 40KB. The 40KB limit includes an overhead of 6 bytes per override.
        evaluation-strategy: Specify `ALL_RULES` to activate the traffic allocation specified by any ongoing launches or experiments. Specify `DEFAULT_VARIATION` to serve the default variation to all users instead.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name for the new feature.
        project: The name or ARN of the project that is to contain the new feature.
        tags: |-
            Assigns one or more tags (key-value pairs) to the feature.

            Tags can help you organize and categorize your resources. You can also use them to scope user permissions by granting a user permission to access or change only resources with certain tag values.

            Tags don't have any semantic meaning to Amazon Web Services and are interpreted strictly as strings of characters.

            You can associate as many as 50 tags with a feature.

            For more information, see [Tagging Amazon Web Services resources](https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html).
        variations: An array of structures that contain the configuration of the feature's different variations.
