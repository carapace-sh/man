name: update-workspace-alias
description: Updates the alias of an existing workspace.
flags:
    --alias=: The new alias for the workspace.
    --client-token=: A unique identifier that you can provide to ensure the idempotency of the request.
    --workspace-id=!: The ID of the workspace to update.
documentation:
    command: Updates the alias of an existing workspace.
    flag:
        alias: |-
            The new alias for the workspace. It does not need to be unique.

            Amazon Managed Service for Prometheus will automatically strip any blank spaces from the beginning and end of the alias that you specify.
        client-token: A unique identifier that you can provide to ensure the idempotency of the request. Case-sensitive.
        workspace-id: The ID of the workspace to update.
