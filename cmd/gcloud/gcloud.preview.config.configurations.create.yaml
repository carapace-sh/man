name: create
description: '*(PREVIEW)*  Creates a new named configuration.'
flags:
    --activate: If true, activate this configuration upon create.
    --no-activate&: If true, activate this configuration upon create.
documentation:
    command: |
        *(PREVIEW)*  Creates a new named configuration.

        Except for special cases (NONE), configuration names start with a
        lower case letter and contain only lower case letters a-z, digits 0-9,
        and hyphens '-'.

        See `gcloud topic configurations` for an overview of named
        configurations.
    flag:
        activate: If true, activate this configuration upon create. Enabled by default, use *--no-activate* to disable.
        no-activate: If true, activate this configuration upon create.
