name: get-migration
description: Provides details about an ongoing or complete migration from an Amazon Lex V1 bot to an Amazon Lex V2 bot.
flags:
    --migration-id=!: The unique identifier of the migration to view.
documentation:
    command: Provides details about an ongoing or complete migration from an Amazon Lex V1 bot to an Amazon Lex V2 bot. Use this operation to view the migration alerts and warnings related to the migration.
    flag:
        migration-id: The unique identifier of the migration to view. The `migrationID` is returned by the operation.
