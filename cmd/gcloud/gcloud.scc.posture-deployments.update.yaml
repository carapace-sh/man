name: update
description: Update the given Cloud Security Command Center (SCC) posture deployment.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: Updated description of posture deployment.
    --etag=: Etag is an optional flag.
    --location=: ID of the location where the resource exists (for example, global).
    --no-async&: Return immediately, without waiting for the operation in progress to
    --organization=: ID of the organization which is the parent of the resource.
    --posture-id=!: Relative name of the posture to be updated, like `organizations/<organizationID>/locations/<location>/postures/<postureID>`.
    --posture-revision-id=!: Revision ID of the posture to be updated.
    --update-mask=: Comma-separated string containing list of fields to be updated.
documentation:
    command: |
        Update a Cloud Security Command Center (SCC) posture deployment.

        Fields specified in update-mask flag are updated. Updatable fields are description and posture_name with posture_revision-id.
        The target_resource for a posture deployment cannot be updated. The posture deployment to be updated should be in ACTIVE State.
        An empty or "*" update-mask implies that posture-id and posture-revision-id are to be updated.
        If posture details of posture deployment need to be updated, then the desired posture needs to be in ACTIVE state.
        LRO operation ID is returned as the response of the command.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: Updated description of posture deployment.
        etag: Etag is an optional flag. If the provided Etag doesn't match the server generated Etag, the update operation won't proceed.
        location: |-
            ID of the location where the resource exists (for example, global).
            +

            To set the `location` attribute:
            * provide the argument `posture_deployment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        organization: |-
            ID of the organization which is the parent of the resource.
            +

            To set the `organization` attribute:
            * provide the argument `posture_deployment` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
        posture-id: Relative name of the posture to be updated, like `organizations/<organizationID>/locations/<location>/postures/<postureID>`.
        posture-revision-id: Revision ID of the posture to be updated.
        update-mask: Comma-separated string containing list of fields to be updated.
