name: get-multi-region-access-point-routes
description: This operation is not supported by directory buckets.
flags:
    --account-id=!: The Amazon Web Services account ID for the owner of the Multi-Region Access Point.
    --mrap=!: The Multi-Region Access Point ARN.
documentation:
    command: |-
        This operation is not supported by directory buckets.

        Returns the routing configuration for a Multi-Region Access Point, indicating which Regions are active or passive.

        To obtain routing control changes and failover requests, use the Amazon S3 failover control infrastructure endpoints in these five Amazon Web Services Regions:

        - `us-east-1`
        - `us-west-2`
        - `ap-southeast-2`
        - `ap-northeast-1`
        - `eu-west-1`

        You must URL encode any signed header values that contain spaces. For example, if your header value is `my file.txt`, containing two spaces after `my`, you must URL encode this value to `my%20%20file.txt`.
    flag:
        account-id: The Amazon Web Services account ID for the owner of the Multi-Region Access Point.
        mrap: The Multi-Region Access Point ARN.
