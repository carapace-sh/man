documentation:
    command: Creates a database for a Cloud SQL instance.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        charset: Cloud SQL database charset setting, which specifies the set of symbols and encodings used to store the data in your database. Each database version may support a different set of charsets.
        collation: Cloud SQL database collation setting, which specifies the set of rules for comparing characters in a character set. Each database version may support a different set of collations. For PostgreSQL database versions, this may only be set to the collation of the template database.
        instance: Cloud SQL instance ID.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
