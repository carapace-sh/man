name: modify-dbsubnet-group
description: Modifies an existing subnet group.
flags:
    --dbsubnet-group-description=: The description for the subnet group.
    --dbsubnet-group-name=!: The name for the subnet group.
    --subnet-ids=!: The Amazon EC2 subnet IDs for the subnet group.
documentation:
    command: Modifies an existing subnet group. subnet groups must contain at least one subnet in at least two Availability Zones in the Amazon Web Services Region.
    flag:
        dbsubnet-group-description: The description for the subnet group.
        dbsubnet-group-name: |-
            The name for the subnet group. This value is stored as a lowercase string. You can't modify the default subnet group.

            Constraints: Must match the name of an existing `DBSubnetGroup`. Must not be default.

            Example: `mySubnetgroup`
        subnet-ids: The Amazon EC2 subnet IDs for the subnet group.
