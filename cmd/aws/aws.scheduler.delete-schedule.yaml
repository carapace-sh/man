name: delete-schedule
description: Deletes the specified schedule.
flags:
    --client-token=: Unique, case-sensitive identifier you provide to ensure the idempotency of the request.
    --group-name=: The name of the schedule group associated with this schedule.
    --name=!: The name of the schedule to delete.
documentation:
    command: Deletes the specified schedule.
    flag:
        client-token: Unique, case-sensitive identifier you provide to ensure the idempotency of the request. If you do not specify a client token, EventBridge Scheduler uses a randomly generated token for the request to ensure idempotency.
        group-name: The name of the schedule group associated with this schedule. If you omit this, the default schedule group is used.
        name: The name of the schedule to delete.
