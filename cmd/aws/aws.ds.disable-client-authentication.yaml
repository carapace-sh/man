name: disable-client-authentication
description: Disables alternative client authentication methods for the specified directory.
flags:
    --directory-id=!: The identifier of the directory
    --type=!: The type of client authentication to disable.
completion:
    flag:
        type:
            - SmartCard
            - SmartCardOrPassword
documentation:
    command: Disables alternative client authentication methods for the specified directory.
    flag:
        directory-id: The identifier of the directory
        type: The type of client authentication to disable. Currently the only parameter `"SmartCard"` is supported.
