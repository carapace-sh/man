name: disable
description: Disable a service for consumption for a project.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --force: If specified, the disable call will proceed even if there are enabled services which depend on the service to be disabled or disable the service used in last 30 days or was enabled in recent 3 days.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-force&: If specified, the disable call will proceed even if there are enabled services which depend on the service to be disabled or disable the service used in last 30 days or was enabled in recent 3 days.
documentation:
    command: |-
        This command disables one or more previously-enabled services for
        consumption.

        To see a list of the enabled services for a project, run:

          $ gcloud services list

        More information on listing services can be found at:
        https://cloud.google.com/service-usage/docs/list-services and on
        disabling a service at:
        https://cloud.google.com/service-usage/docs/enable-disable

        ## EXAMPLES
        To disable a service called `my-consumed-service` for the active
        project, run:

          $ gcloud services disable my-consumed-service

        To run the same command asynchronously (non-blocking), run:

          $ gcloud services disable my-consumed-service --async
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        force: If specified, the disable call will proceed even if there are enabled services which depend on the service to be disabled or disable the service used in last 30 days or was enabled in recent 3 days. Forcing the call means that the services which depend on the service to be disabled will also be disabled.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-force: If specified, the disable call will proceed even if there are enabled services which depend on the service to be disabled or disable the service used in last 30 days or was enabled in recent 3 days. Forcing the call means that the services which depend on the service to be disabled will also be disabled.
