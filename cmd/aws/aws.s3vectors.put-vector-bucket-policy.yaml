name: put-vector-bucket-policy
description: Amazon S3 Vectors is in preview release for Amazon S3 and is subject to change.
flags:
    --policy=!: The `JSON` that defines the policy.
    --vector-bucket-arn=: The Amazon Resource Name (ARN) of the vector bucket.
    --vector-bucket-name=: The name of the vector bucket.
documentation:
    command: |-
        Amazon S3 Vectors is in preview release for Amazon S3 and is subject to change.

        Creates a bucket policy for a vector bucket. To specify the bucket, you must use either the vector bucket name or the vector bucket Amazon Resource Name (ARN).

        Permissions

        You must have the `s3vectors:PutVectorBucketPolicy` permission to use this operation.
    flag:
        policy: The `JSON` that defines the policy. For more information about bucket policies for S3 Vectors, see [Managing vector bucket policies](https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-vectors-bucket-policy.html) in the *Amazon S3 User Guide*.
        vector-bucket-arn: The Amazon Resource Name (ARN) of the vector bucket.
        vector-bucket-name: The name of the vector bucket.
