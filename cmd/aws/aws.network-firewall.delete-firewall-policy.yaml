name: delete-firewall-policy
description: Deletes the specified [FirewallPolicy]().
flags:
    --firewall-policy-arn=: The Amazon Resource Name (ARN) of the firewall policy.
    --firewall-policy-name=: The descriptive name of the firewall policy.
documentation:
    command: Deletes the specified [FirewallPolicy]().
    flag:
        firewall-policy-arn: |-
            The Amazon Resource Name (ARN) of the firewall policy.

            You must specify the ARN or the name, and you can specify both.
        firewall-policy-name: |-
            The descriptive name of the firewall policy. You can't change the name of a firewall policy after you create it.

            You must specify the ARN or the name, and you can specify both.
