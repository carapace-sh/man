name: get-target-selection-rules
description: Converts source selection rules into their target counterparts for schema conversion operations.
flags:
    --migration-project-identifier=!: The migration project name or Amazon Resource Name (ARN).
    --selection-rules=!: The JSON string representing the source selection rules for conversion.
documentation:
    command: Converts source selection rules into their target counterparts for schema conversion operations.
    flag:
        migration-project-identifier: The migration project name or Amazon Resource Name (ARN).
        selection-rules: The JSON string representing the source selection rules for conversion. Selection rules must contain only supported metadata model types. For more information, see Selection Rules in the DMS User Guide.
