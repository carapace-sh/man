name: update-monitor
description: Update a monitor to add or remove local or remote resources.
flags:
    --client-token=: A unique, case-sensitive string of up to 64 ASCII characters that you specify to make an idempotent API request.
    --local-resources-to-add=: Additional local resources to specify network flows for a monitor, as an array of resources with identifiers and types.
    --local-resources-to-remove=: The local resources to remove, as an array of resources with identifiers and types.
    --monitor-name=!: The name of the monitor.
    --remote-resources-to-add=: The remote resources to add, as an array of resources with identifiers and types.
    --remote-resources-to-remove=: The remote resources to remove, as an array of resources with identifiers and types.
documentation:
    command: Update a monitor to add or remove local or remote resources.
    flag:
        client-token: A unique, case-sensitive string of up to 64 ASCII characters that you specify to make an idempotent API request. Don't reuse the same client token for other API requests.
        local-resources-to-add: Additional local resources to specify network flows for a monitor, as an array of resources with identifiers and types. A local resource in a workload is the location of hosts where the Network Flow Monitor agent is installed.
        local-resources-to-remove: The local resources to remove, as an array of resources with identifiers and types.
        monitor-name: The name of the monitor.
        remote-resources-to-add: |-
            The remote resources to add, as an array of resources with identifiers and types.

            A remote resource is the other endpoint in the flow of a workload, with a local resource. For example, Amazon Dynamo DB can be a remote resource.
        remote-resources-to-remove: |-
            The remote resources to remove, as an array of resources with identifiers and types.

            A remote resource is the other endpoint specified for the network flow of a workload, with a local resource. For example, Amazon Dynamo DB can be a remote resource.
