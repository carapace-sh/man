name: delete-attributes
description: Deletes one or more attributes associated with an item.
flags:
    --attributes=:
        description: A list of Attributes.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-name=!: The name of the domain in which to perform the operation.
    --expected=: The update condition which, if specified, determines whether the specified attributes will be deleted or not.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --item-name=!: The name of the item.
documentation:
    command: |-
        Deletes one or more attributes associated with an item. If all attributes of the item are deleted, the item is deleted.

        `DeleteAttributes` is an idempotent operation; running it multiple times on the same item or attribute does not result in an error response.

        Because Amazon SimpleDB makes multiple copies of item data and uses an eventual consistency update model, performing a [GetAttributes]() or [Select]() operation (read) immediately after a `DeleteAttributes` or [PutAttributes]() operation (write) might not return updated item data.
    flag:
        attributes: A list of Attributes. Similar to columns on a spreadsheet, attributes represent categories of data that can be assigned to items.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain-name: The name of the domain in which to perform the operation.
        expected: The update condition which, if specified, determines whether the specified attributes will be deleted or not. The update condition must be satisfied in order for this request to be processed and the attributes to be deleted.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        item-name: The name of the item. Similar to rows on a spreadsheet, items represent individual objects that contain one or more value-attribute pairs.
