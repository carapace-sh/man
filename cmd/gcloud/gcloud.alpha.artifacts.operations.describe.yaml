name: describe
description: '*(ALPHA)*  Describe an Artifact Registry operation.'
flags:
    --location=: Location of the operation.
documentation:
    command: |
        *(ALPHA)*  Describe an Artifact Registry operation given the operation id.

        This command can fail for the following reasons:
        * The operation specified does not exist.
        * The active account does not have permission to access the given
          operation.
    flag:
        location: |-
            Location of the operation. Overrides the default artifacts/location property value
            for this command invocation. To configure the default location, use the command:
            gcloud config set artifacts/location.
            +

            To set the `location` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `artifacts/location`.
