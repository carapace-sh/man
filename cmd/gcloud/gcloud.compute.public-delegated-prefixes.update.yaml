name: update
description: Updates a Compute Engine public delegated prefix.
flags:
    --announce-prefix: Specify if the prefix will be announced.
    --no-announce-prefix&: Specify if the prefix will be announced.
    --no-withdraw-prefix&: Specify if the prefix will be withdrawn.
    --region=: Region of the public delegated prefix to operate on.
    --withdraw-prefix: Specify if the prefix will be withdrawn.
documentation:
    command: |-
        ## EXAMPLES

        To announce a regional v2 public delegated prefix:

          $ gcloud compute public-delegated-prefixes update my-pdp --announce-prefix --region=us-central1

        To withdraw a regional v2 public delegated prefix:

          $ gcloud compute public-delegated-prefixes update my-pdp --withdraw-prefix --region=us-central1
    flag:
        announce-prefix: Specify if the prefix will be announced. Default is false.
        no-announce-prefix: Specify if the prefix will be announced. Default is false.
        no-withdraw-prefix: Specify if the prefix will be withdrawn. Default is false.
        region: Region of the public delegated prefix to operate on. Overrides the default *compute/region* property value for this command invocation.
        withdraw-prefix: Specify if the prefix will be withdrawn. Default is false.
