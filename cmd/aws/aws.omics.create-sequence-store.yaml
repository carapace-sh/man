name: create-sequence-store
description: Creates a sequence store and returns its metadata.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: An idempotency token used to dedupe retry requests so that duplicate runs are not created.
    --description=: A description for the store.
    --e-tag-algorithm-family=: The ETag algorithm family to use for ingested read sets.
    --fallback-location=: An S3 location that is used to store files that have failed a direct upload.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: A name for the store.
    --propagated-set-level-tags=: The tags keys to propagate to the S3 objects associated with read sets in the sequence store.
    --s3-access-config=: S3 access configuration parameters.
    --sse-config=: Server-side encryption (SSE) settings for the store.
    --tags=: Tags for the store.
completion:
    flag:
        e-tag-algorithm-family:
            - MD5up
            - SHA256up
            - SHA512up
documentation:
    command: |-
        Creates a sequence store and returns its metadata. Sequence stores are used to store sequence data files called read sets that are saved in FASTQ, BAM, uBAM, or CRAM formats. For aligned formats (BAM and CRAM), a sequence store can only use one reference genome. For unaligned formats (FASTQ and uBAM), a reference genome is not required. You can create multiple sequence stores per region per account.

        The following are optional parameters you can specify for your sequence store:

        - Use `s3AccessConfig` to configure your sequence store with S3 access logs (recommended).
        - Use `sseConfig` to define your own KMS key for encryption.
        - Use `eTagAlgorithmFamily` to define which algorithm to use for the HealthOmics eTag on objects.
        - Use `fallbackLocation` to define a backup location for storing files that have failed a direct upload.
        - Use `propagatedSetLevelTags` to configure tags that propagate to all objects in your store.

        For more information, see [Creating a HealthOmics sequence store](https://docs.aws.amazon.com/omics/latest/dev/create-sequence-store.html) in the *Amazon Web Services HealthOmics User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: An idempotency token used to dedupe retry requests so that duplicate runs are not created.
        description: A description for the store.
        e-tag-algorithm-family: The ETag algorithm family to use for ingested read sets. The default value is MD5up. For more information on ETags, see [ETags and data provenance](https://docs.aws.amazon.com/omics/latest/dev/etags-and-provenance.html) in the *Amazon Web Services HealthOmics User Guide*.
        fallback-location: An S3 location that is used to store files that have failed a direct upload. You can add or change the `fallbackLocation` after creating a sequence store. This is not required if you are uploading files from a different S3 bucket.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: A name for the store.
        propagated-set-level-tags: The tags keys to propagate to the S3 objects associated with read sets in the sequence store. These tags can be used as input to add metadata to your read sets.
        s3-access-config: S3 access configuration parameters. This specifies the parameters needed to access logs stored in S3 buckets. The S3 bucket must be in the same region and account as the sequence store.
        sse-config: Server-side encryption (SSE) settings for the store.
        tags: Tags for the store. You can configure up to 50 tags.
