name: delete-integration-association
description: Deletes an Amazon Web Services resource association from an Amazon Connect instance.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --integration-association-id=!: The identifier for the integration association.
documentation:
    command: Deletes an Amazon Web Services resource association from an Amazon Connect instance. The association must not have any use cases associated with it.
    flag:
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        integration-association-id: The identifier for the integration association.
