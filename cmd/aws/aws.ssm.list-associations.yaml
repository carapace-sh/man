name: list-associations
description: Returns all State Manager associations in the current Amazon Web Services account and Amazon Web Services Region.
flags:
    --association-filter-list=: One or more filters.
    --max-results=: The maximum number of items to return for this call.
    --next-token=: The token for the next set of items to return.
documentation:
    command: Returns all State Manager associations in the current Amazon Web Services account and Amazon Web Services Region. You can limit the results to a specific State Manager association document or managed node by specifying a filter. State Manager is a tool in Amazon Web Services Systems Manager.
    flag:
        association-filter-list: |-
            One or more filters. Use a filter to return a more specific list of results.

            Filtering associations using the `InstanceID` attribute only returns legacy associations created using the `InstanceID` attribute. Associations targeting the managed node that are part of the Target Attributes `ResourceGroup` or `Tags` aren't returned.
        max-results: The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
