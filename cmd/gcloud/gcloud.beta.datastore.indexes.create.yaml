name: create
description: '*(BETA)*  Create new datastore indexes based on your local index configuration.'
flags:
    --database=: The database to operate on.
documentation:
    command: |
        *(BETA)*  Create new datastore indexes based on your local index configuration.
        Any indexes in your index file that do not exist will be created.
    flag:
        database: |-
            The database to operate on. If not specified, the CLI refers the
            `(default)` database by default.
            +
            For example, to operate on database `testdb`:
            +
              $ {command} --database='testdb'
