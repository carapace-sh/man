name: list-restore-jobs
description: Returns a list of jobs that Backup initiated to restore a saved resource, including details about the recovery process.
flags:
    --by-account-id=: The account ID to list the jobs from.
    --by-complete-after=: Returns only copy jobs completed after a date expressed in Unix format and Coordinated Universal Time (UTC).
    --by-complete-before=: Returns only copy jobs completed before a date expressed in Unix format and Coordinated Universal Time (UTC).
    --by-created-after=: Returns only restore jobs that were created after the specified date.
    --by-created-before=: Returns only restore jobs that were created before the specified date.
    --by-parent-job-id=: This is a filter to list child (nested) restore jobs based on parent restore job ID.
    --by-resource-type=: 'Include this parameter to return only restore jobs for the specified resources:'
    --by-restore-testing-plan-arn=: This returns only restore testing jobs that match the specified resource Amazon Resource Name (ARN).
    --by-status=: Returns only restore jobs associated with the specified job status.
    --max-results=: The maximum number of items to be returned.
    --next-token=: The next item following a partial list of returned items.
completion:
    flag:
        by-status:
            - PENDING
            - RUNNING
            - COMPLETED
            - ABORTED
            - FAILED
documentation:
    command: Returns a list of jobs that Backup initiated to restore a saved resource, including details about the recovery process.
    flag:
        by-account-id: The account ID to list the jobs from. Returns only restore jobs associated with the specified account ID.
        by-complete-after: Returns only copy jobs completed after a date expressed in Unix format and Coordinated Universal Time (UTC).
        by-complete-before: Returns only copy jobs completed before a date expressed in Unix format and Coordinated Universal Time (UTC).
        by-created-after: Returns only restore jobs that were created after the specified date.
        by-created-before: Returns only restore jobs that were created before the specified date.
        by-parent-job-id: This is a filter to list child (nested) restore jobs based on parent restore job ID.
        by-resource-type: |-
            Include this parameter to return only restore jobs for the specified resources:

            - `Aurora` for Amazon Aurora
            - `CloudFormation` for CloudFormation
            - `DocumentDB` for Amazon DocumentDB (with MongoDB compatibility)
            - `DynamoDB` for Amazon DynamoDB
            - `EBS` for Amazon Elastic Block Store
            - `EC2` for Amazon Elastic Compute Cloud
            - `EFS` for Amazon Elastic File System
            - `FSx` for Amazon FSx
            - `Neptune` for Amazon Neptune
            - `RDS` for Amazon Relational Database Service
            - `Redshift` for Amazon Redshift
            - `S3` for Amazon Simple Storage Service (Amazon S3)
            - `SAP HANA on Amazon EC2` for SAP HANA databases on Amazon Elastic Compute Cloud instances
            - `Storage Gateway` for Storage Gateway
            - `Timestream` for Amazon Timestream
            - `VirtualMachine` for VMware virtual machines
        by-restore-testing-plan-arn: This returns only restore testing jobs that match the specified resource Amazon Resource Name (ARN).
        by-status: Returns only restore jobs associated with the specified job status.
        max-results: The maximum number of items to be returned.
        next-token: The next item following a partial list of returned items. For example, if a request is made to return `MaxResults` number of items, `NextToken` allows you to return more items in your list starting at the location pointed to by the next token.
