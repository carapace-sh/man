name: accept-environment-account-connection
description: In a management account, an environment account connection request is accepted.
flags:
    --id=!: The ID of the environment account connection.
documentation:
    command: |-
        In a management account, an environment account connection request is accepted. When the environment account connection request is accepted, Proton can use the associated IAM role to provision environment infrastructure resources in the associated environment account.

        For more information, see [Environment account connections](https://docs.aws.amazon.com/proton/latest/userguide/ag-env-account-connections.html) in the *Proton User guide*.
    flag:
        id: The ID of the environment account connection.
