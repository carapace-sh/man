name: create
description: '*(BETA)*  Create a Cloud VPN Classic Target VPN Gateway.'
flags:
    --description=: An optional, textual description for the target VPN Gateway.
    --network=!: A reference to a network in this project to
    --region=: Region of the Target VPN Gateway to create.
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute target-vpn-gateways create* is used to create a Cloud VPN Classic Target VPN Gateway. A
        Target VPN Gateway can reference one or more VPN tunnels that connect it to
        the remote tunnel endpoint. A Target VPN Gateway may also be referenced by
        one or more forwarding rules that define which packets the
        gateway is responsible for routing.
    flag:
        description: An optional, textual description for the target VPN Gateway.
        network: |-
            A reference to a network in this project to
            contain the VPN Gateway.
        region: |-
            Region of the Target VPN Gateway to create. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
