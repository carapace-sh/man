name: put-repository-permissions-policy
description: Sets the resource policy on a repository that specifies permissions to access it.
flags:
    --domain-owner=: The 12-digit account number of the Amazon Web Services account that owns the domain.
    --domain=!: The name of the domain containing the repository to set the resource policy on.
    --policy-document=!: A valid displayable JSON Aspen policy string to be set as the access control resource policy on the provided repository.
    --policy-revision=: Sets the revision of the resource policy that specifies permissions to access the repository.
    --repository=!: The name of the repository to set the resource policy on.
documentation:
    command: |-
        Sets the resource policy on a repository that specifies permissions to access it.

        When you call `PutRepositoryPermissionsPolicy`, the resource policy on the repository is ignored when evaluting permissions. This ensures that the owner of a repository cannot lock themselves out of the repository, which would prevent them from being able to update the resource policy.
    flag:
        domain: The name of the domain containing the repository to set the resource policy on.
        domain-owner: The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces.
        policy-document: A valid displayable JSON Aspen policy string to be set as the access control resource policy on the provided repository.
        policy-revision: Sets the revision of the resource policy that specifies permissions to access the repository. This revision is used for optimistic locking, which prevents others from overwriting your changes to the repository's resource policy.
        repository: The name of the repository to set the resource policy on.
