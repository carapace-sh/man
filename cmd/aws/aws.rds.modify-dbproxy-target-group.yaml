name: modify-dbproxy-target-group
description: Modifies the properties of a `DBProxyTargetGroup`.
flags:
    --connection-pool-config=: The settings that determine the size and behavior of the connection pool for the target group.
    --dbproxy-name=!: The name of the proxy.
    --new-name=: The new name for the modified `DBProxyTarget`.
    --target-group-name=!: The name of the target group to modify.
documentation:
    command: Modifies the properties of a `DBProxyTargetGroup`.
    flag:
        connection-pool-config: The settings that determine the size and behavior of the connection pool for the target group.
        dbproxy-name: The name of the proxy.
        new-name: |-
            The new name for the modified `DBProxyTarget`. An identifier must begin with a letter and must contain only ASCII letters, digits, and hyphens; it can't end with a hyphen or contain two consecutive hyphens.

            You can't rename the `default` target group.
        target-group-name: The name of the target group to modify.
