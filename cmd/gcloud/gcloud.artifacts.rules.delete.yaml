name: delete
description: Delete an Artifact Registry rule.
flags:
    --location=: Location of the rule.
    --repository=: The repository associated with the rule.
documentation:
    command: |
        Delete an Artifact Registry rule.

        This command can fail for the following reasons:
          * The specified rule does not exist.
          * The active account does not have permission to delete rules.
    flag:
        location: |-
            Location of the rule. Overrides the default artifacts/location property value
            for this command invocation. To configure the default location, use the command:
            gcloud config set artifacts/location.
            +

            To set the `location` attribute:
            * provide the argument `rule` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `artifacts/location`.
        repository: |-
            The repository associated with the rule. Overrides the default artifacts/repository property value
            for this command invocation. To configure the default repository, use the command:
            gcloud config set artifacts/repository.
            +

            To set the `repository` attribute:
            * provide the argument `rule` on the command line with a fully specified name;
            * provide the argument `--repository` on the command line;
            * set the property `artifacts/repository`.
