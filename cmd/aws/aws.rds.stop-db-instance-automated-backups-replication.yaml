            This may  not  be  specified  along with --cli-input-yaml.
        source-db-instance-arn: The Amazon Resource Name (ARN) of the source DB instance for which to stop replicating automate backups, for example, `arn:aws:rds:us-west-2:123456789012:db:mydatabase`.
