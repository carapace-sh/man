name: list-outposts
description: Lists the Outposts for your Amazon Web Services account.
flags:
    --availability-zone-filter=: Filters the results by Availability Zone (for example, `us-east-1a`).
    --availability-zone-id-filter=: Filters the results by AZ ID (for example, `use1-az1`).
    --life-cycle-status-filter=: Filters the results by the lifecycle status.
    --max-results=: ""
    --next-token=: ""
documentation:
    command: |-
        Lists the Outposts for your Amazon Web Services account.

        Use filters to return specific results. If you specify multiple filters, the results include only the resources that match all of the specified filters. For a filter where you can specify multiple values, the results include items that match any of the values that you specify for the filter.
    flag:
        availability-zone-filter: Filters the results by Availability Zone (for example, `us-east-1a`).
        availability-zone-id-filter: Filters the results by AZ ID (for example, `use1-az1`).
        life-cycle-status-filter: Filters the results by the lifecycle status.
        max-results: ""
        next-token: ""
