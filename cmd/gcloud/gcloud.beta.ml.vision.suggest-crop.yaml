name: suggest-crop
description: '*(BETA)*  Suggest a bounding box in an image.'
flags:
    --aspect-ratios=: A list of aspect ratio hints for the suggested bounding box.
    --model-version=: Model version to use for the feature.
completion:
    flag:
        model-version:
            - builtin/latest
            - builtin/stable
documentation:
    command: |
        *(BETA)*  Returns the coordinates of a bounding box that surrounds the dominant
        object or face in an image.
    flag:
        aspect-ratios: A list of aspect ratio hints for the suggested bounding box. Aspect ratios may be specified either as a decimal number (ex. 1.333) or as a ratio of width to height (ex 4:3).
        model-version: 'Model version to use for the feature. _MODEL_VERSION_ must be one of: *builtin/latest*, *builtin/stable*.'
