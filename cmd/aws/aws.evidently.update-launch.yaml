name: update-launch
description: Updates a launch of a given feature.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: An optional description for the launch.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --groups=:
        description: An array of structures that contains the feature and variations that are to be used for the launch.
        nargs: -1
    --launch=!: The name of the launch that is to be updated.
    --metric-monitors=:
        description: An array of structures that define the metrics that will be used to monitor the launch performance.
        nargs: -1
    --project=!: The name or ARN of the project that contains the launch that you want to update.
    --randomization-salt=: When Evidently assigns a particular user session to a launch, it must use a randomization ID to determine which variation the user session is served.
    --scheduled-splits-config=: An array of structures that define the traffic allocation percentages among the feature variations during each step of the launch.
documentation:
    command: |-
        Updates a launch of a given feature.

        Don't use this operation to update the tags of an existing launch. Instead, use [TagResource](https://docs.aws.amazon.com/cloudwatchevidently/latest/APIReference/API_TagResource.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: An optional description for the launch.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        groups: An array of structures that contains the feature and variations that are to be used for the launch.
        launch: The name of the launch that is to be updated.
        metric-monitors: An array of structures that define the metrics that will be used to monitor the launch performance.
        project: The name or ARN of the project that contains the launch that you want to update.
        randomization-salt: When Evidently assigns a particular user session to a launch, it must use a randomization ID to determine which variation the user session is served. This randomization ID is a combination of the entity ID and `randomizationSalt`. If you omit `randomizationSalt`, Evidently uses the launch name as the `randomizationSalt`.
        scheduled-splits-config: An array of structures that define the traffic allocation percentages among the feature variations during each step of the launch.
