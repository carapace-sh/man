name: create-firewall-policy
description: Creates the firewall policy for the firewall according to the specifications.
flags:
    --description=: A description of the firewall policy.
    --dry-run: Indicates whether you want Network Firewall to just check the validity of the request, rather than run the request.
    --encryption-configuration=: A complex type that contains settings for encryption of your firewall policy resources.
    --firewall-policy-name=!: The descriptive name of the firewall policy.
    --firewall-policy=!: The rule groups and policy actions to use in the firewall policy.
    --no-dry-run&: Indicates whether you want Network Firewall to just check the validity of the request, rather than run the request.
    --tags=: The key:value pairs to associate with the resource.
documentation:
    command: |-
        Creates the firewall policy for the firewall according to the specifications.

        An Network Firewall firewall policy defines the behavior of a firewall, in a collection of stateless and stateful rule groups and other settings. You can use one firewall policy for multiple firewalls.
    flag:
        description: A description of the firewall policy.
        dry-run: |-
            Indicates whether you want Network Firewall to just check the validity of the request, rather than run the request.

            If set to `TRUE`, Network Firewall checks whether the request can run successfully, but doesn't actually make the requested changes. The call returns the value that the request would return if you ran it with dry run set to `FALSE`, but doesn't make additions or changes to your resources. This option allows you to make sure that you have the required permissions to run the request and that your request parameters are valid.

            If set to `FALSE`, Network Firewall makes the requested changes to your resources.
        encryption-configuration: A complex type that contains settings for encryption of your firewall policy resources.
        firewall-policy: The rule groups and policy actions to use in the firewall policy.
        firewall-policy-name: The descriptive name of the firewall policy. You can't change the name of a firewall policy after you create it.
        tags: The key:value pairs to associate with the resource.
