name: delete
description: '*(BETA)*  Delete a row in a Cloud Spanner database.'
flags:
    --database=!: ID of the database or fully qualified identifier for the database.
    --instance=: The Cloud Spanner instance for the database.
    --keys=!: The primary key values of the row to delete.
    --table=!: The Cloud Spanner table name.
documentation:
    command: |-
        ## EXAMPLES

        To delete a row with primary keys of SingerId=1,SingName=abc in table Singers
        under my-database and my-instance, run:

            $ gcloud beta spanner rows delete --table=Singers --database=my-database --instance=my-instance --keys=1,abc
    flag:
        database: |-
            ID of the database or fully qualified identifier for the database.
            +
            To set the `database` attribute:
            * provide the argument `--database` on the command line.
        instance: |-
            The Cloud Spanner instance for the database.
            +
            To set the `instance` attribute:
            * provide the argument `--database` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line;
            * set the property `spanner/instance`.
        keys: The primary key values of the row to delete.
        table: The Cloud Spanner table name.
