name: list-api-keys
description: Lists the API keys for a given API.
flags:
    --api-id=!: The API ID.
    --max-results=: The maximum number of results that you want the request to return.
    --next-token=: An identifier that was returned from the previous call to this operation, which you can use to return the next set of items in the list.
documentation:
    command: |-
        Lists the API keys for a given API.

        API keys are deleted automatically 60 days after they expire. However, they may still be included in the response until they have actually been deleted. You can safely call `DeleteApiKey` to manually delete a key before it's automatically deleted.
    flag:
        api-id: The API ID.
        max-results: The maximum number of results that you want the request to return.
        next-token: An identifier that was returned from the previous call to this operation, which you can use to return the next set of items in the list.
