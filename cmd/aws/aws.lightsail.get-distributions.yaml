name: get-distributions
description: Returns information about one or more of your Amazon Lightsail content delivery network (CDN) distributions.
flags:
    --distribution-name=: The name of the distribution for which to return information.
    --page-token=: The token to advance to the next page of results from your request.
documentation:
    command: Returns information about one or more of your Amazon Lightsail content delivery network (CDN) distributions.
    flag:
        distribution-name: |-
            The name of the distribution for which to return information.

            When omitted, the response includes all of your distributions in the Amazon Web Services Region where the request is made.
        page-token: |-
            The token to advance to the next page of results from your request.

            To get a page token, perform an initial `GetDistributions` request. If your results are paginated, the response will return a next page token that you can specify as the page token in a subsequent request.
