name: delete-insight-rules
description: Permanently deletes the specified Contributor Insights rules.
flags:
    --rule-names=!: An array of the rule names to delete.
documentation:
    command: |-
        Permanently deletes the specified Contributor Insights rules.

        If you create a rule, delete it, and then re-create it with the same name, historical data from the first time the rule was created might not be available.
    flag:
        rule-names: An array of the rule names to delete. If you need to find out the names of your rules, use [DescribeInsightRules](https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/API_DescribeInsightRules.html).
