name: list-changed-blocks
description: Returns information about the blocks that are different between two Amazon Elastic Block Store snapshots of the same volume/snapshot lineage.
flags:
    --first-snapshot-id=: The ID of the first snapshot to use for the comparison.
    --max-results=: The maximum number of blocks to be returned by the request.
    --next-token=: The token to request the next page of results.
    --second-snapshot-id=!: The ID of the second snapshot to use for the comparison.
    --starting-block-index=: The block index from which the comparison should start.
documentation:
    command: |-
        Returns information about the blocks that are different between two Amazon Elastic Block Store snapshots of the same volume/snapshot lineage.

        You should always retry requests that receive server (`5xx`) error responses, and `ThrottlingException` and `RequestThrottledException` client error responses. For more information see [Error retries](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/error-retries.html) in the *Amazon Elastic Compute Cloud User Guide*.
    flag:
        first-snapshot-id: |-
            The ID of the first snapshot to use for the comparison.

            The `FirstSnapshotID` parameter must be specified with a `SecondSnapshotId` parameter; otherwise, an error occurs.
        max-results: |-
            The maximum number of blocks to be returned by the request.

            Even if additional blocks can be retrieved from the snapshot, the request can return less blocks than **MaxResults** or an empty array of blocks.

            To retrieve the next set of blocks from the snapshot, make another request with the returned **NextToken** value. The value of **NextToken** is `null` when there are no more blocks to return.
        next-token: |-
            The token to request the next page of results.

            If you specify **NextToken**, then **StartingBlockIndex** is ignored.
        second-snapshot-id: |-
            The ID of the second snapshot to use for the comparison.

            The `SecondSnapshotId` parameter must be specified with a `FirstSnapshotID` parameter; otherwise, an error occurs.
        starting-block-index: |-
            The block index from which the comparison should start.

            The list in the response will start from this block index or the next valid block index in the snapshots.

            If you specify **NextToken**, then **StartingBlockIndex** is ignored.
