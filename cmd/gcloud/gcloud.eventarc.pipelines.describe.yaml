name: describe
description: Describe an Eventarc pipeline.
flags:
    --location=: The location for the Eventarc pipeline, which should be one of the supported regions.
documentation:
    command: Describe an Eventarc pipeline.
    flag:
        location: |-
            The location for the Eventarc pipeline, which should be one of the supported regions. Alternatively, set the [eventarc/location] property.
            +
            To set the `location` attribute:
            * provide the argument `pipeline` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `eventarc/location`.
