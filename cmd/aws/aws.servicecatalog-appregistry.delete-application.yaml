name: delete-application
description: Deletes an application that is specified either by its application ID, name, or ARN.
flags:
    --application=!: The name, ID, or ARN of the application.
documentation:
    command: Deletes an application that is specified either by its application ID, name, or ARN. All associated attribute groups and resources must be disassociated from it before deleting an application.
    flag:
        application: The name, ID, or ARN of the application.
