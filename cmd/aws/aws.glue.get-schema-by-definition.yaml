name: get-schema-by-definition
description: Retrieves a schema by the `SchemaDefinition`.
flags:
    --schema-definition=!: The definition of the schema for which schema details are required.
    --schema-id=!: This is a wrapper structure to contain schema identity fields.
documentation:
    command: Retrieves a schema by the `SchemaDefinition`. The schema definition is sent to the Schema Registry, canonicalized, and hashed. If the hash is matched within the scope of the `SchemaName` or ARN (or the default registry, if none is supplied), that schema’s metadata is returned. Otherwise, a 404 or NotFound error is returned. Schema versions in `Deleted` statuses will not be included in the results.
    flag:
        schema-definition: The definition of the schema for which schema details are required.
        schema-id: |-
            This is a wrapper structure to contain schema identity fields. The structure contains:

            - SchemaId$SchemaArn: The Amazon Resource Name (ARN) of the schema. One of `SchemaArn` or `SchemaName` has to be provided.
            - SchemaId$SchemaName: The name of the schema. One of `SchemaArn` or `SchemaName` has to be provided.
