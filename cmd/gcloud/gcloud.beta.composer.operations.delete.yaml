name: delete
description: '*(BETA)*  Delete one or more completed Cloud Composer operations.'
flags:
    --location=: Compute Engine region in which to create the operations.
documentation:
    command: |-
        *(BETA)*  Delete operations that are done. If more than one operation is specified,
        all deletes will be attempted. If any of the deletes fail, those operations
        and their failure messages will be listed on the standard error, and the
        command will exit with a non-zero status.
    flag:
        location: |-
            Compute Engine region in which to create the operations.
            +
            To set the `location` attribute:
            * provide the argument `operations` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `composer/location`.
