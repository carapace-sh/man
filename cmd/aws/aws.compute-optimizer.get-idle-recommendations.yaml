name: get-idle-recommendations
description: Returns idle resource recommendations.
flags:
    --account-ids=:
        description: Return the idle resource recommendations to the specified Amazon Web Services account IDs.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --filters=:
        description: An array of objects to specify a filter that returns a more specific list of idle resource recommendations.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of idle resource recommendations to return with a single request.
    --next-token=: The token to advance to the next page of idle resource recommendations.
    --order-by=: The order to sort the idle resource recommendations.
    --resource-arns=:
        description: The ARN that identifies the idle resource.
        nargs: -1
documentation:
    command: Returns idle resource recommendations. Compute Optimizer generates recommendations for idle resources that meet a specific set of requirements. For more information, see [Resource requirements](https://docs.aws.amazon.com/compute-optimizer/latest/ug/requirements.html) in the *Compute Optimizer User Guide*
    flag:
        account-ids: |-
            Return the idle resource recommendations to the specified Amazon Web Services account IDs.

            If your account is the management account or the delegated administrator of an organization, use this parameter to return the idle resource recommendations to specific member accounts.

            You can only specify one account ID per request.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        filters: An array of objects to specify a filter that returns a more specific list of idle resource recommendations.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: |-
            The maximum number of idle resource recommendations to return with a single request.

            To retrieve the remaining results, make another request with the returned `nextToken` value.
        next-token: The token to advance to the next page of idle resource recommendations.
        order-by: The order to sort the idle resource recommendations.
        resource-arns: The ARN that identifies the idle resource.
