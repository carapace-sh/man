name: delete-rule-group
description: Deletes the specified [RuleGroup]().
flags:
    --rule-group-arn=: The Amazon Resource Name (ARN) of the rule group.
    --rule-group-name=: The descriptive name of the rule group.
    --type=: Indicates whether the rule group is stateless or stateful.
completion:
    flag:
        type:
            - STATELESS
            - STATEFUL
documentation:
    command: Deletes the specified [RuleGroup]().
    flag:
        rule-group-arn: |-
            The Amazon Resource Name (ARN) of the rule group.

            You must specify the ARN or the name, and you can specify both.
        rule-group-name: |-
            The descriptive name of the rule group. You can't change the name of a rule group after you create it.

            You must specify the ARN or the name, and you can specify both.
        type: |-
            Indicates whether the rule group is stateless or stateful. If the rule group is stateless, it contains stateless rules. If it is stateful, it contains stateful rules.

            This setting is required for requests that do not include the `RuleGroupARN`.
