name: list-incident-records
description: Lists all incident records in your account.
flags:
    --filters=: Filters the list of incident records you want to search through.
    --max-results=: The maximum number of results per page.
    --next-token=: The pagination token for the next set of items to return.
documentation:
    command: Lists all incident records in your account. Use this command to retrieve the Amazon Resource Name (ARN) of the incident record you want to update.
    flag:
        filters: |-
            Filters the list of incident records you want to search through. You can filter on the following keys:

            - `creationTime`
            - `impact`
            - `status`
            - `createdBy`

            Note the following when when you use Filters:

            - If you don't specify a Filter, the response includes all incident records.
            - If you specify more than one filter in a single request, the response returns incident records that match all filters.
            - If you specify a filter with more than one value, the response returns incident records that match any of the values provided.
        max-results: The maximum number of results per page.
        next-token: The pagination token for the next set of items to return. (You received this token from a previous call.)
