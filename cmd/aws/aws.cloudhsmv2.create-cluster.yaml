name: create-cluster
description: Creates a new CloudHSM cluster.
flags:
    --backup-retention-policy=: A policy that defines how the service retains backups.
    --hsm-type=!: The type of HSM to use in the cluster.
    --mode=: The mode to use in the cluster.
    --network-type=: The NetworkType to create a cluster with.
    --source-backup-id=: The identifier (ID) or the Amazon Resource Name (ARN) of the cluster backup to restore.
    --subnet-ids=!: The identifiers (IDs) of the subnets where you are creating the cluster.
    --tag-list=: Tags to apply to the CloudHSM cluster during creation.
completion:
    flag:
        mode:
            - FIPS
            - NON_FIPS
        network-type:
            - IPV4
            - DUALSTACK
documentation:
    command: |-
        Creates a new CloudHSM cluster.

        **Cross-account use:** Yes. To perform this operation with an CloudHSM backup in a different AWS account, specify the full backup ARN in the value of the SourceBackupId parameter.
    flag:
        backup-retention-policy: A policy that defines how the service retains backups.
        hsm-type: The type of HSM to use in the cluster. The allowed values are `hsm1.medium` and `hsm2m.medium`.
        mode: The mode to use in the cluster. The allowed values are `FIPS` and `NON_FIPS`.
        network-type: The NetworkType to create a cluster with. The allowed values are `IPV4` and `DUALSTACK`.
        source-backup-id: The identifier (ID) or the Amazon Resource Name (ARN) of the cluster backup to restore. Use this value to restore the cluster from a backup instead of creating a new cluster. To find the backup ID or ARN, use [DescribeBackups](). *If using a backup in another account, the full ARN must be supplied.*
        subnet-ids: |-
            The identifiers (IDs) of the subnets where you are creating the cluster. You must specify at least one subnet. If you specify multiple subnets, they must meet the following criteria:

            - All subnets must be in the same virtual private cloud (VPC).
            - You can specify only one subnet per Availability Zone.
        tag-list: Tags to apply to the CloudHSM cluster during creation.
