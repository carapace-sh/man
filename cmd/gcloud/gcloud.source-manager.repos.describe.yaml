name: describe
description: Describe a Secure Source Manager repository.
flags:
    --region=: Secure Source Manager location.
documentation:
    command: Get metadata of a Secure Source Manager repository.
    flag:
        region: |-
            Secure Source Manager location.
            +
            To set the `region` attribute:
            * provide the argument `repository` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
