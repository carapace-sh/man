name: create-channel-moderator
description: Creates a new `ChannelModerator`.
flags:
    --channel-arn=!: The ARN of the channel.
    --channel-moderator-arn=!: The `AppInstanceUserArn` of the moderator.
    --chime-bearer=!: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
documentation:
    command: |-
        Creates a new `ChannelModerator`. A channel moderator can:

        - Add and remove other members of the channel.
        - Add and remove other moderators of the channel.
        - Add and remove user bans for the channel.
        - Redact messages in the channel.
        - List messages in the channel.

        The `x-amz-chime-bearer` request header is mandatory. Use the ARN of the `AppInstanceUser` or `AppInstanceBot`of the user that makes the API call as the value in the header.
    flag:
        channel-arn: The ARN of the channel.
        channel-moderator-arn: The `AppInstanceUserArn` of the moderator.
        chime-bearer: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
