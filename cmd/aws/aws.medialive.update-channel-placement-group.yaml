name: update-channel-placement-group
description: Change the settings for a ChannelPlacementGroup.
flags:
    --channel-placement-group-id=!: The ID of the channel placement group.
    --cluster-id=!: The ID of the cluster.
    --name=: Include this parameter only if you want to change the current name of the ChannelPlacementGroup.
    --nodes=: Include this parameter only if you want to change the list of Nodes that are associated with the ChannelPlacementGroup.
documentation:
    command: Change the settings for a ChannelPlacementGroup.
    flag:
        channel-placement-group-id: The ID of the channel placement group.
        cluster-id: The ID of the cluster.
        name: Include this parameter only if you want to change the current name of the ChannelPlacementGroup. Specify a name that is unique in the Cluster. You can't change the name. Names are case-sensitive.
        nodes: Include this parameter only if you want to change the list of Nodes that are associated with the ChannelPlacementGroup.
