name: update-theme
description: Updates a theme.
flags:
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the theme that you're updating.
    --base-theme-id=!: The theme ID, defined by Amazon QuickSight, that a custom theme inherits from.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration=: The theme configuration, which contains the theme display properties.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=: The name for the theme.
    --theme-id=!: The ID for the theme.
    --version-description=: A description of the theme version that you're updating Every time that you call `UpdateTheme`, you create a new version of the theme.
documentation:
    command: Updates a theme.
    flag:
        aws-account-id: The ID of the Amazon Web Services account that contains the theme that you're updating.
        base-theme-id: The theme ID, defined by Amazon QuickSight, that a custom theme inherits from. All themes initially inherit from a default QuickSight theme.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration: The theme configuration, which contains the theme display properties.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name for the theme.
        theme-id: The ID for the theme.
        version-description: A description of the theme version that you're updating Every time that you call `UpdateTheme`, you create a new version of the theme. Each version of the theme maintains a description of the version in `VersionDescription`.
