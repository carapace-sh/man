name: delete
description: '*(BETA)*  Delete the given composite index.'
flags:
    --database=: Database of the composite index.
documentation:
    command: '*(BETA)*  Delete the given composite index.'
    flag:
        database: |-
            Database of the composite index.
            +

            To set the `database` attribute:
            * provide the argument `index` on the command line with a fully specified name;
            * provide the argument `--database` on the command line;
            * the default value of argument [--database] is `(default)`.
