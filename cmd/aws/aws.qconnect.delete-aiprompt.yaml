name: delete-aiprompt
description: Deletes an Amazon Q in Connect AI Prompt.
flags:
    --ai-prompt-id=!: The identifier of the Amazon Q in Connect AI prompt.
    --assistant-id=!: The identifier of the Amazon Q in Connect assistant.
documentation:
    command: Deletes an Amazon Q in Connect AI Prompt.
    flag:
        ai-prompt-id: The identifier of the Amazon Q in Connect AI prompt. Can be either the ID or the ARN. URLs cannot contain the ARN.
        assistant-id: The identifier of the Amazon Q in Connect assistant. Can be either the ID or the ARN. URLs cannot contain the ARN.
