name: get-id
description: Generates (or retrieves) IdentityID.
flags:
    --account-id=: A standard Amazon Web Services account ID (9+ digits).
    --identity-pool-id=!: An identity pool ID in the format REGION:GUID.
    --logins=: A set of optional name-value pairs that map provider names to provider tokens.
documentation:
    command: |-
        Generates (or retrieves) IdentityID. Supplying multiple logins will create an implicit linked account.

        This is a public API. You do not need any credentials to call this API.
    flag:
        account-id: A standard Amazon Web Services account ID (9+ digits).
        identity-pool-id: An identity pool ID in the format REGION:GUID.
        logins: |-
            A set of optional name-value pairs that map provider names to provider tokens. The available provider names for `Logins` are as follows:

            - Facebook: `graph.facebook.com`
            - Amazon Cognito user pool: `cognito-idp.<region>.amazonaws.com/<YOUR_USER_POOL_ID>`, for example, `cognito-idp.us-east-1.amazonaws.com/us-east-1_123456789`.
            - Google: `accounts.google.com`
            - Amazon: `www.amazon.com`
            - Twitter: `api.twitter.com`
            - Digits: `www.digits.com`
