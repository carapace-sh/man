name: request-delete
description: '*(BETA)*  Request deletion of a Compute Engine network peering.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --network=!: The name of the network in the current project containing the peering.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute networks peerings request-delete* is used to request deletion of a consensus peering between virtual
          networks. The peering can be deleted if both sides request deletion.

        ## EXAMPLES
          To request deletion of a consensus peering with the name 'peering-name'
          between the network 'local-network' and the network 'peer-network', run:

              $ gcloud beta compute networks peerings request-delete peering-name --network=local-network

              $ gcloud beta compute networks peerings request-delete peering-name --network=peer-network

          To complete the deletion, run gcloud compute networks peerings delete
          for each side of the peering.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        network: The name of the network in the current project containing the peering.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
