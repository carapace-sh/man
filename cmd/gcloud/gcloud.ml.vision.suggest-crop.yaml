name: suggest-crop
description: Suggest a bounding box in an image.
flags:
    --aspect-ratios=: A list of aspect ratio hints for the suggested bounding box.
documentation:
    command: |
        Returns the coordinates of a bounding box that surrounds the dominant
        object or face in an image.
    flag:
        aspect-ratios: A list of aspect ratio hints for the suggested bounding box. Aspect ratios may be specified either as a decimal number (ex. 1.333) or as a ratio of width to height (ex 4:3).
