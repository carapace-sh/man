name: describe
description: Describe a Dataplex task resource.
flags:
    --lake=: Identifier of the Dataplex lake resource.
    --location=: Location of the Dataplex resource.
documentation:
    command: |
        Describe a Dataplex task resource.

        Displays all details of a Dataplex task resource given a valid task ID.
    flag:
        lake: |-
            Identifier of the Dataplex lake resource.
            +

            To set the `lake` attribute:
            * provide the argument `task` on the command line with a fully specified name;
            * provide the argument `--lake` on the command line.
        location: |-
            Location of the Dataplex resource.
            +

            To set the `location` attribute:
            * provide the argument `task` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
