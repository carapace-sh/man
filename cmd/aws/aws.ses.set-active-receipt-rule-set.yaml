name: set-active-receipt-rule-set
description: Sets the specified receipt rule set as the active receipt rule set.
flags:
    --rule-set-name=: The name of the receipt rule set to make active.
documentation:
    command: |-
        Sets the specified receipt rule set as the active receipt rule set.

        To disable your email-receiving through Amazon SES completely, you can call this operation with `RuleSetName` set to null.

        For information about managing receipt rule sets, see the [Amazon SES Developer Guide](https://docs.aws.amazon.com/ses/latest/dg/receiving-email-receipt-rules-console-walkthrough.html).

        You can execute this operation no more than once per second.
    flag:
        rule-set-name: The name of the receipt rule set to make active. Setting this value to null disables all email receiving.
