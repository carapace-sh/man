        authorization-mode:
            - auth-disabled
            - iam-auth
        automated-backup-config-mode:
            - disabled
            - enabled
        cross-instance-replication-config-role:
            - none
            - primary
            - secondary
        mode:
            - cluster
            - cluster-disabled
            - standalone
        node-type:
            - highmem-medium
            - highmem-xlarge
            - shared-core-nano
            - standard-small
        persistence-config-mode:
            - aof
            - disabled
            - rdb
        rdb-config-snapshot-period:
            - one-hour
            - six-hours
            - twelve-hours
