name: delete-backup-vault-notifications
description: Deletes event notifications for the specified backup vault.
flags:
    --backup-vault-name=!: The name of a logical container where backups are stored.
documentation:
    command: Deletes event notifications for the specified backup vault.
    flag:
        backup-vault-name: The name of a logical container where backups are stored. Backup vaults are identified by names that are unique to the account used to create them and the Region where they are created.
