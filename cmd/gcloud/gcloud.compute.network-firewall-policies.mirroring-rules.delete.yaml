name: delete
description: Deletes a Compute Engine network firewall policy packet mirroirng rule.
flags:
    --firewall-policy=!: Firewall policy ID with which to delete rule.
    --global-firewall-policy!: Use this flag to indicate that firewall policy is global.
    --no-global-firewall-policy!&: Use this flag to indicate that firewall policy is global.
documentation:
    command: '*gcloud compute network-firewall-policies mirroring-rules delete* is used to delete network firewall policy packet mirroring rules.'
    flag:
        firewall-policy: Firewall policy ID with which to delete rule.
        global-firewall-policy: Use this flag to indicate that firewall policy is global.
        no-global-firewall-policy: Use this flag to indicate that firewall policy is global.
