name: apply-parameters
description: '*(BETA)*  Apply parameter update to nodes in a Memorystore Memcached instance.'
flags:
    --apply-all: Apply the parameter update onto all nodes.
    --async: Return immediately, without waiting for the operation in progress to
    --no-apply-all&: Apply the parameter update onto all nodes.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --node-ids=: Nodes on which to apply the parameter update.
    --region=: The name of the Memcached region of the instance.
documentation:
    command: |
        *(BETA)*  Apply a parameter update to nodes in a Memcached instance from the current configuration
        parameters staged in the instance metadata.

        Applying a parameter update to a node causes a full cache flush on that node.
    flag:
        apply-all: Apply the parameter update onto all nodes.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-apply-all: |
            Apply the parameter update onto all nodes.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        node-ids: Nodes on which to apply the parameter update.
        region: |-
            The name of the Memcached region of the instance. Overrides the default
            memcache/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `memcache/region`.
