name: update
description: Updates an endpoint.
flags:
    --address=: IPv4 or IPv6 address of the endpoint.
    --annotations=: Annotations for the endpoint.
    --location=: The name of the region for the endpoint.
    --namespace=: The name of the namespace for the endpoint.
    --port=: Port that the endpoint is running on, must be in the range of
    --service=: The name of the service for the endpoint.
documentation:
    command: Updates an endpoint.
    flag:
        address: |-
            IPv4 or IPv6 address of the endpoint. The default is
            empty string.
        annotations: |-
            Annotations for the endpoint.
            +
            Annotations take the form of key/value string pairs. Keys are
            composed of an optional prefix and a name segment, separated by a
            slash(/). Prefixes and names must be composed of alphanumeric
            characters, dashes, and dots. Names may also use underscores. There
            are no character restrictions on what may go into the value of an
            annotation. The entire dictionary is limited to 512 characters, spread
            across all key-value pairs.
        location: |-
            The name of the region for the endpoint.
            +
            To set the `location` attribute:
            * provide the argument `endpoint` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        namespace: |-
            The name of the namespace for the endpoint.
            +
            To set the `namespace` attribute:
            * provide the argument `endpoint` on the command line with a fully specified name;
            * provide the argument `--namespace` on the command line.
        port: |-
            Port that the endpoint is running on, must be in the range of
            [0, 65535]. The default is 0.
        service: |-
            The name of the service for the endpoint.
            +
            To set the `service` attribute:
            * provide the argument `endpoint` on the command line with a fully specified name;
            * provide the argument `--service` on the command line.
