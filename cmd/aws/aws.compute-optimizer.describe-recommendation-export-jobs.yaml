name: describe-recommendation-export-jobs
description: Describes recommendation export jobs created in the last seven days.
flags:
    --filters=: An array of objects to specify a filter that returns a more specific list of export jobs.
    --job-ids=: The identification numbers of the export jobs to return.
    --max-results=: The maximum number of export jobs to return with a single request.
    --next-token=: The token to advance to the next page of export jobs.
documentation:
    command: |-
        Describes recommendation export jobs created in the last seven days.

        Use the [ExportAutoScalingGroupRecommendations]() or [ExportEC2InstanceRecommendations]() actions to request an export of your recommendations. Then use the [DescribeRecommendationExportJobs]() action to view your export jobs.
    flag:
        filters: An array of objects to specify a filter that returns a more specific list of export jobs.
        job-ids: |-
            The identification numbers of the export jobs to return.

            An export job ID is returned when you create an export using the [ExportAutoScalingGroupRecommendations]() or [ExportEC2InstanceRecommendations]() actions.

            All export jobs created in the last seven days are returned if this parameter is omitted.
        max-results: |-
            The maximum number of export jobs to return with a single request.

            To retrieve the remaining results, make another request with the returned `nextToken` value.
        next-token: The token to advance to the next page of export jobs.
