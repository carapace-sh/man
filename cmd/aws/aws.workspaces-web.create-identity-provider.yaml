name: create-identity-provider
description: Creates an identity provider resource that is then associated with a web portal.
flags:
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --identity-provider-details=!: The identity provider details.
    --identity-provider-name=!: The identity provider name.
    --identity-provider-type=!: The identity provider type.
    --portal-arn=!: The ARN of the web portal.
    --tags=: The tags to add to the identity provider resource.
completion:
    flag:
        identity-provider-type:
            - SAML
            - Facebook
            - Google
            - LoginWithAmazon
            - SignInWithApple
            - OIDC
documentation:
    command: Creates an identity provider resource that is then associated with a web portal.
    flag:
        client-token: |-
            A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. Idempotency ensures that an API request completes only once. With an idempotent request, if the original request completes successfully, subsequent retries with the same client token returns the result from the original successful request.

            If you do not specify a client token, one is automatically generated by the Amazon Web Services SDK.
        identity-provider-details: "The identity provider details. The following list describes the provider detail keys for each identity provider type.\n\n- For Google and Login with Amazon:\n  \n  - `client_id`\n  - `client_secret`\n  - `authorize_scopes`\n- For Facebook:\n  \n  - `client_id`\n  - `client_secret`\n  - `authorize_scopes`\n  - `api_version`\n- For Sign in with Apple:\n  \n  - `client_id`\n  - `team_id`\n  - `key_id`\n  - `private_key`\n  - `authorize_scopes`\n- For OIDC providers:\n  \n  - `client_id`\n  - `client_secret`\n  - `attributes_request_method`\n  - `oidc_issuer`\n  - `authorize_scopes`\n  - `authorize_url` *if not available from discovery URL specified by `oidc_issuer` key*\n  - `token_url` *if not available from discovery URL specified by `oidc_issuer` key*\n  - `attributes_url` *if not available from discovery URL specified by `oidc_issuer` key*\n  - `jwks_uri` *if not available from discovery URL specified by `oidc_issuer` key*\n- For SAML providers:\n  \n  - `MetadataFile` OR `MetadataURL`\n  - `IDPSignout` (boolean) *optional*\n  - `IDPInit` (boolean) *optional*\n  - `RequestSigningAlgorithm` (string) *optional* - Only accepts `rsa-sha256`\n  - `EncryptedResponses` (boolean) *optional*"
        identity-provider-name: The identity provider name.
        identity-provider-type: The identity provider type.
        portal-arn: The ARN of the web portal.
        tags: The tags to add to the identity provider resource. A tag is a key-value pair.
