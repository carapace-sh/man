name: list-change-sets
description: Returns the list of change sets owned by the account being used to make the call.
flags:
    --catalog=!: The catalog related to the request.
    --filter-list=: An array of filter objects.
    --max-results=: The maximum number of results returned by a single call.
    --next-token=: The token value retrieved from a previous call to access the next page of results.
    --sort=: An object that contains two attributes, `SortBy` and `SortOrder`.
documentation:
    command: |-
        Returns the list of change sets owned by the account being used to make the call. You can filter this list by providing any combination of `entityId`, `ChangeSetName`, and status. If you provide more than one filter, the API operation applies a logical AND between the filters.

        You can describe a change during the 60-day request history retention period for API calls.
    flag:
        catalog: 'The catalog related to the request. Fixed value: `AWSMarketplace`'
        filter-list: An array of filter objects.
        max-results: The maximum number of results returned by a single call. This value must be provided in the next call to retrieve the next set of results. By default, this value is 20.
        next-token: The token value retrieved from a previous call to access the next page of results.
        sort: An object that contains two attributes, `SortBy` and `SortOrder`.
