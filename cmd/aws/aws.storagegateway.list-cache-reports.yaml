name: list-cache-reports
description: Returns a list of existing cache reports for all file shares associated with your Amazon Web Services account.
flags:
    --marker=: Opaque pagination token returned from a previous `ListCacheReports` operation.
documentation:
    command: Returns a list of existing cache reports for all file shares associated with your Amazon Web Services account. This list includes all information provided by the `DescribeCacheReport` action, such as report name, status, completion progress, start time, end time, filters, and tags.
    flag:
        marker: Opaque pagination token returned from a previous `ListCacheReports` operation. If present, `Marker` specifies where to continue the list from after a previous call to `ListCacheReports`. Optional.
