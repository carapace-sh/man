name: get-readiness-check-status
description: Gets the readiness status for an individual readiness check.
flags:
    --max-results=: The number of objects that you want to return with this call.
    --next-token=: The token that identifies which batch of results you want to see.
    --readiness-check-name=!: Name of a readiness check.
documentation:
    command: Gets the readiness status for an individual readiness check. To see the overall readiness status for a recovery group, that considers the readiness status for all the readiness checks in a recovery group, use GetRecoveryGroupReadinessSummary.
    flag:
        max-results: The number of objects that you want to return with this call.
        next-token: The token that identifies which batch of results you want to see.
        readiness-check-name: Name of a readiness check.
