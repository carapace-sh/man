name: get-builtin-intent
description: Returns information about a built-in intent.
flags:
    --signature=!: The unique identifier for a built-in intent.
documentation:
    command: |-
        Returns information about a built-in intent.

        This operation requires permission for the `lex:GetBuiltinIntent` action.
    flag:
        signature: The unique identifier for a built-in intent. To find the signature for an intent, see [Standard Built-in Intents](https://developer.amazon.com/public/solutions/alexa/alexa-skills-kit/docs/built-in-intent-ref/standard-intents) in the *Alexa Skills Kit*.
