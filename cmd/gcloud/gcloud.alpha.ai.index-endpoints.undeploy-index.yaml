name: undeploy-index
description: '*(ALPHA)*  Undeploy an index from a Vertex AI index endpoint.'
flags:
    --deployed-index-id=!: Id of the deployed index.
    --region=: Cloud region for the index_endpoint.
documentation:
    command: |-
        ## EXAMPLES

        To undeploy the deployed-index ``deployed-index-345'' from an index endpoint
        ``456'' under project ``example'' in region ``us-central1'', run:

          $ gcloud alpha ai index-endpoints undeploy-index 456 --project=example --region=us-central1
          --deployed-index-id=deployed-index-345
    flag:
        deployed-index-id: Id of the deployed index.
        region: |-
            Cloud region for the index_endpoint.
            +
            To set the `region` attribute:
            * provide the argument `index_endpoint` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
