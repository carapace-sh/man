name: start-metadata-model-assessment
description: Creates a database migration assessment report by assessing the migration complexity for your source database.
flags:
    --migration-project-identifier=!: The migration project name or Amazon Resource Name (ARN).
    --selection-rules=!: A value that specifies the database objects to assess.
documentation:
    command: Creates a database migration assessment report by assessing the migration complexity for your source database. A database migration assessment report summarizes all of the schema conversion tasks. It also details the action items for database objects that can't be converted to the database engine of your target database instance.
    flag:
        migration-project-identifier: The migration project name or Amazon Resource Name (ARN).
        selection-rules: A value that specifies the database objects to assess.
