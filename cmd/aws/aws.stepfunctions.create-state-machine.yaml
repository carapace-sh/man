name: create-state-machine
description: Creates a state machine.
flags:
    --definition=!: The Amazon States Language definition of the state machine.
    --encryption-configuration=: Settings to configure server-side encryption.
    --logging-configuration=: Defines what execution history events are logged and where they are logged.
    --name=!: The name of the state machine.
    --publish=: Set to `true` to publish the first version of the state machine during creation.
    --role-arn=!: The Amazon Resource Name (ARN) of the IAM role to use for this state machine.
    --tags=: Tags to be added when creating a state machine.
    --tracing-configuration=: Selects whether X-Ray tracing is enabled.
    --type=: Determines whether a Standard or Express state machine is created.
    --version-description=: Sets description about the state machine version.
completion:
    flag:
        type:
            - STANDARD
            - EXPRESS
documentation:
    command: |-
        Creates a state machine. A state machine consists of a collection of states that can do work (`Task` states), determine to which states to transition next (`Choice` states), stop an execution with an error (`Fail` states), and so on. State machines are specified using a JSON-based, structured language. For more information, see [Amazon States Language](https://docs.aws.amazon.com/step-functions/latest/dg/concepts-amazon-states-language.html) in the Step Functions User Guide.

        If you set the `publish` parameter of this API action to `true`, it publishes version `1` as the first revision of the state machine.

        For additional control over security, you can encrypt your data using a **customer-managed key** for Step Functions state machines. You can configure a symmetric KMS key and data key reuse period when creating or updating a **State Machine**. The execution history and state machine definition will be encrypted with the key applied to the State Machine.

        This operation is eventually consistent. The results are best effort and may not reflect very recent updates and changes.

        `CreateStateMachine` is an idempotent API. Subsequent requests won’t create a duplicate resource if it was already created. `CreateStateMachine`'s idempotency check is based on the state machine `name`, `definition`, `type`, `LoggingConfiguration`, `TracingConfiguration`, and `EncryptionConfiguration` The check is also based on the `publish` and `versionDescription` parameters. If a following request has a different `roleArn` or `tags`, Step Functions will ignore these differences and treat it as an idempotent request of the previous. In this case, `roleArn` and `tags` will not be updated, even if they are different.
    flag:
        definition: The Amazon States Language definition of the state machine. See [Amazon States Language](https://docs.aws.amazon.com/step-functions/latest/dg/concepts-amazon-states-language.html).
        encryption-configuration: Settings to configure server-side encryption.
        logging-configuration: |-
            Defines what execution history events are logged and where they are logged.

            By default, the `level` is set to `OFF`. For more information see [Log Levels](https://docs.aws.amazon.com/step-functions/latest/dg/cloudwatch-log-level.html) in the Step Functions User Guide.
        name: |-
            The name of the state machine.

            A name must *not* contain:

            - white space
            - brackets `< > { } [ ]`
            - wildcard characters `? *`
            - special characters ``" # % \ ^ | ~ ` $ & , ; : /``
            - control characters (`U+0000-001F`, `U+007F-009F`, `U+FFFE-FFFF`)
            - surrogates (`U+D800-DFFF`)
            - invalid characters (`U+10FFFF`)

            To enable logging with CloudWatch Logs, the name should only contain 0-9, A-Z, a-z, - and \_.
        publish: Set to `true` to publish the first version of the state machine during creation. The default is `false`.
        role-arn: The Amazon Resource Name (ARN) of the IAM role to use for this state machine.
        tags: |-
            Tags to be added when creating a state machine.

            An array of key-value pairs. For more information, see [Using Cost Allocation Tags](https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-alloc-tags.html) in the *Amazon Web Services Billing and Cost Management User Guide*, and [Controlling Access Using IAM Tags](https://docs.aws.amazon.com/IAM/latest/UserGuide/access_iam-tags.html).

            Tags may only contain Unicode letters, digits, white space, or these symbols: `_ . : / = + - @`.
        tracing-configuration: Selects whether X-Ray tracing is enabled.
        type: Determines whether a Standard or Express state machine is created. The default is `STANDARD`. You cannot update the `type` of a state machine once it has been created.
        version-description: Sets description about the state machine version. You can only set the description if the `publish` parameter is set to `true`. Otherwise, if you set `versionDescription`, but `publish` to `false`, this API action throws `ValidationException`.
