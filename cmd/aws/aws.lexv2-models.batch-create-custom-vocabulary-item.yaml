name: batch-create-custom-vocabulary-item
description: Create a batch of custom vocabulary items for a given bot locale's custom vocabulary.
flags:
    --bot-id=!: The identifier of the bot associated with this custom vocabulary.
    --bot-version=!: The identifier of the version of the bot associated with this custom vocabulary.
    --custom-vocabulary-item-list=!: A list of new custom vocabulary items.
    --locale-id=!: The identifier of the language and locale where this custom vocabulary is used.
documentation:
    command: Create a batch of custom vocabulary items for a given bot locale's custom vocabulary.
    flag:
        bot-id: The identifier of the bot associated with this custom vocabulary.
        bot-version: The identifier of the version of the bot associated with this custom vocabulary.
        custom-vocabulary-item-list: A list of new custom vocabulary items. Each entry must contain a phrase and can optionally contain a displayAs and/or a weight.
        locale-id: The identifier of the language and locale where this custom vocabulary is used. The string must match one of the supported locales. For more information, see [Supported Languages](https://docs.aws.amazon.com/lexv2/latest/dg/how-languages.html) .
