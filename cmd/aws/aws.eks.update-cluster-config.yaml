name: update-cluster-config
description: Updates an Amazon EKS cluster configuration.
flags:
    --access-config=: The access configuration for the cluster.
    --client-request-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --compute-config=: Update the configuration of the compute capability of your EKS Auto Mode cluster.
    --deletion-protection=: Specifies whether to enable or disable deletion protection for the cluster.
    --kubernetes-network-config=: ""
    --logging=: Enable or disable exporting the Kubernetes control plane logs for your cluster to CloudWatch Logs .
    --name=!: The name of the Amazon EKS cluster to update.
    --remote-network-config=: ""
    --resources-vpc-config=: ""
    --storage-config=: Update the configuration of the block storage capability of your EKS Auto Mode cluster.
    --upgrade-policy=: You can enable or disable extended support for clusters currently on standard support.
    --zonal-shift-config=: Enable or disable ARC zonal shift for the cluster.
documentation:
    command: "Updates an Amazon EKS cluster configuration. Your cluster continues to function during the update. The response output includes an update ID that you can use to track the status of your cluster update with `DescribeUpdate`.\n\nYou can use this operation to do the following actions:\n\n- You can use this API operation to enable or disable exporting the Kubernetes control plane logs for your cluster to CloudWatch Logs. By default, cluster control plane logs aren't exported to CloudWatch Logs. For more information, see [Amazon EKS Cluster control plane logs](https://docs.aws.amazon.com/eks/latest/userguide/control-plane-logs.html) in the *Amazon EKS User Guide* .\n  \n  CloudWatch Logs ingestion, archive storage, and data scanning rates apply to exported control plane logs. For more information, see [CloudWatch Pricing](http://aws.amazon.com/cloudwatch/pricing/).\n- You can also use this API operation to enable or disable public and private access to your cluster's Kubernetes API server endpoint. By default, public access is enabled, and private access is disabled. For more information, see [Cluster API server endpoint](https://docs.aws.amazon.com/eks/latest/userguide/cluster-endpoint.html) in the *Amazon EKS User Guide* .\n- You can also use this API operation to choose different subnets and security groups for the cluster. You must specify at least two subnets that are in different Availability Zones. You can't change which VPC the subnets are from, the subnets must be in the same VPC as the subnets that the cluster was created with. For more information about the VPC requirements, see [https://docs.aws.amazon.com/eks/latest/userguide/network\\_reqs.html](https://docs.aws.amazon.com/eks/latest/userguide/network_reqs.html) in the *Amazon EKS User Guide* .\n- You can also use this API operation to enable or disable ARC zonal shift. If zonal shift is enabled, Amazon Web Services configures zonal autoshift for the cluster.\n- You can also use this API operation to add, change, or remove the configuration in the cluster for EKS Hybrid Nodes. To remove the configuration, use the `remoteNetworkConfig` key with an object containing both subkeys with empty arrays for each. Here is an inline example: `\"remoteNetworkConfig\": { \"remoteNodeNetworks\": [], \"remotePodNetworks\": [] }`.\n\nCluster updates are asynchronous, and they should finish within a few minutes. During an update, the cluster status moves to `UPDATING` (this status transition is eventually consistent). When the update is complete (either `Failed` or `Successful`), the cluster status moves to `Active`."
    flag:
        access-config: The access configuration for the cluster.
        client-request-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        compute-config: Update the configuration of the compute capability of your EKS Auto Mode cluster. For example, enable the capability.
        deletion-protection: Specifies whether to enable or disable deletion protection for the cluster. When enabled (`true`), the cluster cannot be deleted until deletion protection is explicitly disabled. When disabled (`false`), the cluster can be deleted normally.
        kubernetes-network-config: ""
        logging: |-
            Enable or disable exporting the Kubernetes control plane logs for your cluster to CloudWatch Logs . By default, cluster control plane logs aren't exported to CloudWatch Logs . For more information, see [Amazon EKS cluster control plane logs](https://docs.aws.amazon.com/eks/latest/userguide/control-plane-logs.html) in the *Amazon EKS User Guide* .

            CloudWatch Logs ingestion, archive storage, and data scanning rates apply to exported control plane logs. For more information, see [CloudWatch Pricing](http://aws.amazon.com/cloudwatch/pricing/).
        name: The name of the Amazon EKS cluster to update.
        remote-network-config: ""
        resources-vpc-config: ""
        storage-config: Update the configuration of the block storage capability of your EKS Auto Mode cluster. For example, enable the capability.
        upgrade-policy: You can enable or disable extended support for clusters currently on standard support. You cannot disable extended support once it starts. You must enable extended support before your cluster exits standard support.
        zonal-shift-config: |-
            Enable or disable ARC zonal shift for the cluster. If zonal shift is enabled, Amazon Web Services configures zonal autoshift for the cluster.

            Zonal shift is a feature of Amazon Application Recovery Controller (ARC). ARC zonal shift is designed to be a temporary measure that allows you to move traffic for a resource away from an impaired AZ until the zonal shift expires or you cancel it. You can extend the zonal shift if necessary.

            You can start a zonal shift for an EKS cluster, or you can allow Amazon Web Services to do it for you by enabling *zonal autoshift*. This shift updates the flow of east-to-west network traffic in your cluster to only consider network endpoints for Pods running on worker nodes in healthy AZs. Additionally, any ALB or NLB handling ingress traffic for applications in your EKS cluster will automatically route traffic to targets in the healthy AZs. For more information about zonal shift in EKS, see [Learn about Amazon Application Recovery Controller (ARC) Zonal Shift in Amazon EKS](https://docs.aws.amazon.com/eks/latest/userguide/zone-shift.html) in the *Amazon EKS User Guide* .
