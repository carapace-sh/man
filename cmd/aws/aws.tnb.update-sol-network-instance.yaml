name: update-sol-network-instance
description: Update a network instance.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --modify-vnf-info-data=: Identifies the network function information parameters and/or the configurable properties of the network function to be modified.
    --ns-instance-id=!: ID of the network instance.
    --tags=: A tag is a label that you assign to an Amazon Web Services resource.
    --update-ns=: Identifies the network service descriptor and the configurable properties of the descriptor, to be used for the update.
    --update-type=!: The type of update.
completion:
    flag:
        update-type:
            - MODIFY_VNF_INFORMATION
            - UPDATE_NS
documentation:
    command: |-
        Update a network instance.

        A network instance is a single network created in Amazon Web Services TNB that can be deployed and on which life-cycle operations (like terminate, update, and delete) can be performed.

        Choose the *updateType* parameter to target the necessary update of the network instance.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        modify-vnf-info-data: |-
            Identifies the network function information parameters and/or the configurable properties of the network function to be modified.

            Include this property only if the update type is `MODIFY_VNF_INFORMATION`.
        ns-instance-id: ID of the network instance.
        tags: A tag is a label that you assign to an Amazon Web Services resource. Each tag consists of a key and an optional value. When you use this API, the tags are only applied to the network operation that is created. These tags are not applied to the network instance. Use tags to search and filter your resources or track your Amazon Web Services costs.
        update-ns: |-
            Identifies the network service descriptor and the configurable properties of the descriptor, to be used for the update.

            Include this property only if the update type is `UPDATE_NS`.
        update-type: |-
            The type of update.

            - Use the `MODIFY_VNF_INFORMATION` update type, to update a specific network function configuration, in the network instance.
            - Use the `UPDATE_NS` update type, to update the network instance to a new network service descriptor.
