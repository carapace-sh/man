name: list-attached-policies
description: Lists the policies attached to the specified thing group.
flags:
    --marker=: The token to retrieve the next set of results.
    --page-size=: The maximum number of results to be returned per request.
    --recursive=: When true, recursively list attached policies.
    --target=!: The group or principal for which the policies will be listed.
documentation:
    command: |-
        Lists the policies attached to the specified thing group.

        Requires permission to access the [ListAttachedPolicies](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        marker: The token to retrieve the next set of results.
        page-size: The maximum number of results to be returned per request.
        recursive: When true, recursively list attached policies.
        target: The group or principal for which the policies will be listed. Valid principals are CertificateArn (arn:aws:iot:*region*:*accountId*:cert/*certificateId*), thingGroupArn (arn:aws:iot:*region*:*accountId*:thinggroup/*groupName*) and CognitoId (*region*:*id*).
