name: set-log-delivery-configuration
description: Sets up or modifies the logging configuration of a user pool.
flags:
    --log-configurations=!: A collection of the logging configurations for a user pool.
    --user-pool-id=!: The ID of the user pool where you want to configure logging.
documentation:
    command: Sets up or modifies the logging configuration of a user pool. User pools can export user notification logs and, when threat protection is active, user-activity logs. For more information, see [Exporting user pool logs](https://docs.aws.amazon.com/cognito/latest/developerguide/exporting-quotas-and-usage.html).
    flag:
        log-configurations: A collection of the logging configurations for a user pool.
        user-pool-id: The ID of the user pool where you want to configure logging.
