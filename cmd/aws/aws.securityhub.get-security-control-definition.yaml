name: get-security-control-definition
description: Retrieves the definition of a security control.
flags:
    --security-control-id=!: The ID of the security control to retrieve the definition for.
documentation:
    command: Retrieves the definition of a security control. The definition includes the control title, description, Region availability, parameter definitions, and other details.
    flag:
        security-control-id: The ID of the security control to retrieve the definition for. This field doesn’t accept an Amazon Resource Name (ARN).
