name: update
description: Update a Google Cloud Private Connection.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: Updated description for this Private Connection.
    --location=: The resource name of the location.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --routing-mode=: Updated routing mode for this Private Connection.
completion:
    flag:
        routing-mode:
            - GLOBAL
            - REGIONAL
documentation:
    command: |
        Updates a VMware Engine private connection. Only description and routing-mode can be updated.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        description: Updated description for this Private Connection.
        location: |-
            The resource name of the location.
            +
            To set the `location` attribute:
            * provide the argument `private_connection` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/region`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        routing-mode: 'Updated routing mode for this Private Connection. _ROUTING_MODE_ must be one of: *GLOBAL*, *REGIONAL*.'
