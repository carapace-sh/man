name: list-distributions-by-anycast-ip-list-id
description: Lists the distributions in your account that are associated with the specified `AnycastIpListId`.
flags:
    --anycast-ip-list-id=!: The ID of the Anycast static IP list.
    --marker=: Use this field when paginating results to indicate where to begin in your list.
    --max-items=: The maximum number of distributions that you want returned in the response.
documentation:
    command: Lists the distributions in your account that are associated with the specified `AnycastIpListId`.
    flag:
        anycast-ip-list-id: The ID of the Anycast static IP list.
        marker: Use this field when paginating results to indicate where to begin in your list. The response includes items in the list that occur after the marker. To get the next page of the list, set this field's value to the value of `NextMarker` from the current page's response.
        max-items: The maximum number of distributions that you want returned in the response.
