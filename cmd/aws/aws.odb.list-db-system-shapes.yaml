name: list-db-system-shapes
description: Returns information about the shapes that are available for an Exadata infrastructure.
flags:
    --availability-zone-id=: The physical ID of the AZ, for example, use1-az4.
    --availability-zone=: The logical name of the AZ, for example, us-east-1a.
    --max-results=: The maximum number of items to return for this request.
    --next-token=: The token returned from a previous paginated request.
documentation:
    command: Returns information about the shapes that are available for an Exadata infrastructure.
    flag:
        availability-zone: The logical name of the AZ, for example, us-east-1a. This name varies depending on the account.
        availability-zone-id: The physical ID of the AZ, for example, use1-az4. This ID persists across accounts.
        max-results: |-
            The maximum number of items to return for this request. To get the next page of items, make another request with the token returned in the output.

            Default: `10`
        next-token: The token returned from a previous paginated request. Pagination continues from the end of the items returned by the previous request.
