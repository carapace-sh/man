name: create
description: '*(ALPHA)*  Create a quota override for a consumer.'
flags:
    --consumer=!: The consumer to create a quota override for.
    --dimensions=: The dimensions of the override, e.g. for specific locations.
    --force: Force override creation even if the change results in a substantial decrease in available quota.
    --metric=!: The metric to create a quota override for.
    --no-force&: Force override creation even if the change results in a substantial decrease in available quota.
    --service=!: The service to create a quota override for.
    --unit=!: The unit of a metric to create a quota override for.
    --value=!: The value of the override.
documentation:
    command: |-
        *(ALPHA)*  This command creates a quota override for a consumer. The supported
        consumers are projects, folders, and organizations.

        ## EXAMPLES

        To create a quota override for a project with project number, run:

          $ gcloud alpha services quota create --service=example.googleapis.com --consumer=projects/12321
              --metric=example.googleapis.com/default_requests
              --unit=1/min/{project} --value=360

        To create a quota override for a project with project ID, run:

          $ gcloud alpha services quota create --service=example.googleapis.com --consumer=projects/hello
              --metric=example.googleapis.com/default_requests
              --unit=1/min/{project} --value=360

        To create a quota override for an organization, run:

          $ gcloud alpha services quota create --service=example.googleapis.com --consumer=organizations/555
              --metric=example.googleapis.com/default_requests
              --unit=1/min/{project} --value=360

        To force the creation of a quota override with dimensions, run:

          $ gcloud alpha services quota create --service=example.googleapis.com --consumer=projects/12321
              --metric=example.googleapis.com/default_requests
              --unit=1/min/{project} --dimensions=regions=us-central1
              --dimensions=zones=us-central1-c --value=360 --force
    flag:
        consumer: The consumer to create a quota override for.
        dimensions: The dimensions of the override, e.g. for specific locations.
        force: Force override creation even if the change results in a substantial decrease in available quota.
        metric: The metric to create a quota override for.
        no-force: Force override creation even if the change results in a substantial decrease in available quota.
        service: The service to create a quota override for.
        unit: The unit of a metric to create a quota override for.
        value: The value of the override.
