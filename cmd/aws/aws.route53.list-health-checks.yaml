name: list-health-checks
description: Retrieve a list of the health checks that are associated with the current Amazon Web Services account.
flags:
    --marker=: If the value of `IsTruncated` in the previous response was `true`, you have more health checks.
    --max-items=: The maximum number of health checks that you want `ListHealthChecks` to return in response to the current request.
documentation:
    command: Retrieve a list of the health checks that are associated with the current Amazon Web Services account.
    flag:
        marker: |-
            If the value of `IsTruncated` in the previous response was `true`, you have more health checks. To get another group, submit another `ListHealthChecks` request.

            For the value of `marker`, specify the value of `NextMarker` from the previous response, which is the ID of the first health check that Amazon Route 53 will return if you submit another request.

            If the value of `IsTruncated` in the previous response was `false`, there are no more health checks to get.
        max-items: The maximum number of health checks that you want `ListHealthChecks` to return in response to the current request. Amazon Route 53 returns a maximum of 1000 items. If you set `MaxItems` to a value greater than 1000, Route 53 returns only the first 1000 health checks.
