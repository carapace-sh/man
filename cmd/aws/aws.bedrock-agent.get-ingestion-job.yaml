name: get-ingestion-job
description: Gets information about a data ingestion job.
flags:
    --data-source-id=!: The unique identifier of the data source for the data ingestion job you want to get information on.
    --ingestion-job-id=!: The unique identifier of the data ingestion job you want to get information on.
    --knowledge-base-id=!: The unique identifier of the knowledge base for the data ingestion job you want to get information on.
documentation:
    command: Gets information about a data ingestion job. Data sources are ingested into your knowledge base so that Large Language Models (LLMs) can use your data.
    flag:
        data-source-id: The unique identifier of the data source for the data ingestion job you want to get information on.
        ingestion-job-id: The unique identifier of the data ingestion job you want to get information on.
        knowledge-base-id: The unique identifier of the knowledge base for the data ingestion job you want to get information on.
