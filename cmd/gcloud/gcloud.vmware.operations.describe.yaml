name: describe
description: Describe a Google Cloud VMware Engine operation.
flags:
    --location=: Location of the private cloud or cluster.
documentation:
    command: |
        Describe a VMware Engine operation. An operation contains information about the status of a previous request.
    flag:
        location: |-
            Location of the private cloud or cluster.
            +
            To set the `location` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/zone`.
