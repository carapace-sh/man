name: get-savings-plans-utilization-details
description: Retrieves attribute data along with aggregate utilization and savings data for a given time period.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --data-type=: The data type.
    --filter=: Filters Savings Plans utilization coverage data for active Savings Plans dimensions.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The number of items to be returned in a response.
    --next-token=: The token to retrieve the next set of results.
    --sort-by=: The value that you want to sort the data by.
    --time-period=!: The time period that you want the usage and costs for.
documentation:
    command: |-
        Retrieves attribute data along with aggregate utilization and savings data for a given time period. This doesn't support granular or grouped data (daily/monthly) in response. You can't retrieve data by dates in a single response similar to `GetSavingsPlanUtilization`, but you have the option to make multiple calls to `GetSavingsPlanUtilizationDetails` by providing individual dates. You can use `GetDimensionValues` in `SAVINGS_PLANS` to determine the possible dimension values.

        `GetSavingsPlanUtilizationDetails` internally groups data by `SavingsPlansArn`.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        data-type: The data type.
        filter: |-
            Filters Savings Plans utilization coverage data for active Savings Plans dimensions. You can filter data with the following dimensions:

            - `LINKED_ACCOUNT`
            - `SAVINGS_PLAN_ARN`
            - `REGION`
            - `PAYMENT_OPTION`
            - `INSTANCE_TYPE_FAMILY`

            `GetSavingsPlansUtilizationDetails` uses the same [Expression](https://docs.aws.amazon.com/aws-cost-management/latest/APIReference/API_Expression.html) object as the other operations, but only `AND` is supported among each dimension.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The number of items to be returned in a response. The default is `20`, with a minimum value of `1`.
        next-token: The token to retrieve the next set of results. Amazon Web Services provides the token when the response from a previous call has more results than the maximum page size.
        sort-by: |-
            The value that you want to sort the data by.

            The following values are supported for `Key`:

            - `UtilizationPercentage`
            - `TotalCommitment`
            - `UsedCommitment`
            - `UnusedCommitment`
            - `NetSavings`
            - `AmortizedRecurringCommitment`
            - `AmortizedUpfrontCommitment`

            The supported values for `SortOrder` are `ASCENDING` and `DESCENDING`.
        time-period: The time period that you want the usage and costs for. The `Start` date must be within 13 months. The `End` date must be after the `Start` date, and before the current date. Future dates can't be used as an `End` date.
