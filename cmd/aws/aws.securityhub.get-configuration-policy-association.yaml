name: get-configuration-policy-association
description: Returns the association between a configuration and a target account, organizational unit, or the root.
flags:
    --target=!: The target account ID, organizational unit ID, or the root ID to retrieve the association for.
documentation:
    command: Returns the association between a configuration and a target account, organizational unit, or the root. The configuration can be a configuration policy or self-managed behavior. Only the Security Hub delegated administrator can invoke this operation from the home Region.
    flag:
        target: The target account ID, organizational unit ID, or the root ID to retrieve the association for.
