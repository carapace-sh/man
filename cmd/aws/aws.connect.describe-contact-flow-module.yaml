name: describe-contact-flow-module
description: Describes the specified flow module.
flags:
    --contact-flow-module-id=!: The identifier of the flow module.
    --instance-id=!: The identifier of the Amazon Connect instance.
documentation:
    command: |-
        Describes the specified flow module.

        Use the `$SAVED` alias in the request to describe the `SAVED` content of a Flow. For example, `arn:aws:.../contact-flow/{id}:$SAVED`. After a flow is published, `$SAVED` needs to be supplied to view saved content that has not been published.
    flag:
        contact-flow-module-id: The identifier of the flow module.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
