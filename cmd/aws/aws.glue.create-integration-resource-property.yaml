name: create-integration-resource-property
description: This API can be used for setting up the `ResourceProperty` of the Glue connection (for the source) or Glue database ARN (for the target).
flags:
    --resource-arn=!: The connection ARN of the source, or the database ARN of the target.
    --source-processing-properties=: The resource properties associated with the integration source.
    --target-processing-properties=: The resource properties associated with the integration target.
documentation:
    command: This API can be used for setting up the `ResourceProperty` of the Glue connection (for the source) or Glue database ARN (for the target). These properties can include the role to access the connection or database. To set both source and target properties the same API needs to be invoked with the Glue connection ARN as `ResourceArn` with `SourceProcessingProperties` and the Glue database ARN as `ResourceArn` with `TargetProcessingProperties` respectively.
    flag:
        resource-arn: The connection ARN of the source, or the database ARN of the target.
        source-processing-properties: The resource properties associated with the integration source.
        target-processing-properties: The resource properties associated with the integration target.
