name: update-namespace
description: Updates a namespace with the specified settings.
flags:
    --admin-password-secret-kms-key-id=: The ID of the Key Management Service (KMS) key used to encrypt and store the namespace's admin credentials secret.
    --admin-user-password=: The password of the administrator for the first database created in the namespace.
    --admin-username=: The username of the administrator for the first database created in the namespace.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --default-iam-role-arn=: The Amazon Resource Name (ARN) of the IAM role to set as a default in the namespace.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --iam-roles=:
        description: A list of IAM roles to associate with the namespace.
        nargs: -1
    --kms-key-id=: The ID of the Amazon Web Services Key Management Service key used to encrypt your data.
    --log-exports=:
        description: The types of logs the namespace can export.
        nargs: -1
    --manage-admin-password: If `true`, Amazon Redshift uses Secrets Manager to manage the namespace's admin credentials.
    --namespace-name=!: The name of the namespace to update.
    --no-manage-admin-password: If `true`, Amazon Redshift uses Secrets Manager to manage the namespace's admin credentials.
documentation:
    command: Updates a namespace with the specified settings. Unless required, you can't update multiple parameters in one request. For example, you must specify both `adminUsername` and `adminUserPassword` to update either field, but you can't update both `kmsKeyId` and `logExports` in a single request.
    flag:
        admin-password-secret-kms-key-id: The ID of the Key Management Service (KMS) key used to encrypt and store the namespace's admin credentials secret. You can only use this parameter if `manageAdminPassword` is true.
        admin-user-password: |-
            The password of the administrator for the first database created in the namespace. This parameter must be updated together with `adminUsername`.

            You can't use `adminUserPassword` if `manageAdminPassword` is true.
        admin-username: The username of the administrator for the first database created in the namespace. This parameter must be updated together with `adminUserPassword`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        default-iam-role-arn: The Amazon Resource Name (ARN) of the IAM role to set as a default in the namespace. This parameter must be updated together with `iamRoles`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        iam-roles: A list of IAM roles to associate with the namespace. This parameter must be updated together with `defaultIamRoleArn`.
        kms-key-id: The ID of the Amazon Web Services Key Management Service key used to encrypt your data.
        log-exports: The types of logs the namespace can export. The export types are `userlog`, `connectionlog`, and `useractivitylog`.
        manage-admin-password: If `true`, Amazon Redshift uses Secrets Manager to manage the namespace's admin credentials. You can't use `adminUserPassword` if `manageAdminPassword` is true. If `manageAdminPassword` is false or not set, Amazon Redshift uses `adminUserPassword` for the admin user account's password.
        namespace-name: The name of the namespace to update. You can't update the name of a namespace once it is created.
