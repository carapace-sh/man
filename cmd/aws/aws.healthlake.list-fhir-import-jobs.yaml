name: list-fhir-import-jobs
description: List all FHIR import jobs associated with an account and their statuses.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --datastore-id=!: Limits the response to the import job with the specified data store ID.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --job-name=: Limits the response to the import job with the specified job name.
    --job-status=: Limits the response to the import job with the specified job status.
    --max-results=: Limits the number of results returned for `ListFHIRImportJobs` to a maximum quantity specified by the user.
    --next-token=: The pagination token used to identify the next page of results to return.
    --submitted-after=: Limits the response to FHIR import jobs submitted after a user-specified date.
    --submitted-before=: Limits the response to FHIR import jobs submitted before a user- specified date.
completion:
    flag:
        job-status:
            - SUBMITTED
            - QUEUED
            - IN_PROGRESS
            - COMPLETED_WITH_ERRORS
            - COMPLETED
            - FAILED
            - CANCEL_SUBMITTED
            - CANCEL_IN_PROGRESS
            - CANCEL_COMPLETED
            - CANCEL_FAILED
documentation:
    command: List all FHIR import jobs associated with an account and their statuses.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        datastore-id: Limits the response to the import job with the specified data store ID.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        job-name: Limits the response to the import job with the specified job name.
        job-status: Limits the response to the import job with the specified job status.
        max-results: Limits the number of results returned for `ListFHIRImportJobs` to a maximum quantity specified by the user.
        next-token: The pagination token used to identify the next page of results to return.
        submitted-after: Limits the response to FHIR import jobs submitted after a user-specified date.
        submitted-before: Limits the response to FHIR import jobs submitted before a user- specified date.
