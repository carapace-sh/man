name: update
description: '*(ALPHA)*  Update a disk migration resource target details.'
flags:
    --disk-id=: The ID of the disk that will be migrated to Compute Engine.
    --disk-type=: The Compute Engine disk type to use for the migrated disk.
    --kms-key=: Fully qualified identifier for the Cloud KMS (Key Management Service) cryptokey that will be used to protect the disk.
    --labels=: A map of labels to associate with the disk.
    --location=: Resource location.
    --source=: The client source environment object.
    --target-project=: The target project resource path to which the disk will be migrated.
    --zone=: The zone in which to create the disk.
completion:
    flag:
        disk-type:
            - compute-engine-disk-type-balanced
            - compute-engine-disk-type-hyperdisk-balanced
            - compute-engine-disk-type-ssd
            - compute-engine-disk-type-standard
documentation:
    command: |
        *(ALPHA)*  gcloud alpha compute migration disk-migrations update updates a disk migration resource.
        To use this command, you must enable VM Migration API in your project.
    flag:
        disk-id: The ID of the disk that will be migrated to Compute Engine. The default value is the disk migration resource name.
        disk-type: |-
            The Compute Engine disk type to use for the migrated disk. The default value is COMPUTE_ENGINE_DISK_TYPE_STANDARD. _DISK_TYPE_ must be one of:
            +
            *compute-engine-disk-type-balanced*::: Compute Engine Disk Type Balanced.
            *compute-engine-disk-type-hyperdisk-balanced*::: Compute Engine Disk Type hyperdisk-balanced.
            *compute-engine-disk-type-ssd*::: Compute Engine Disk Type SSD.
            *compute-engine-disk-type-standard*::: Compute Engine Disk Type Standard.
            :::
            +
        kms-key: Fully qualified identifier for the Cloud KMS (Key Management Service) cryptokey that will be used to protect the disk.
        labels: A map of labels to associate with the disk.
        location: |-
            Resource location.
            +
            To set the `location` attribute:
            * provide the argument `disk_migration` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/region`.
        source: |-
            The client source environment object.
            +
            To set the `source` attribute:
            * provide the argument `disk_migration` on the command line with a fully specified name;
            * provide the argument `--source` on the command line.
        target-project: |-
            The target project resource path to which the disk will be migrated.
            Default is the host project.
            To get a list of the target projects run the gcloud alpha migration vms target-projects list command.
        zone: The zone in which to create the disk. The default value is the first zone of the Google Cloud location parameter given.
