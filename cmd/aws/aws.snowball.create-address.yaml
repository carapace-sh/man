name: create-address
description: Creates an address for a Snow device to be shipped to.
flags:
    --address=!: The address that you want the Snow device shipped to.
documentation:
    command: Creates an address for a Snow device to be shipped to. In most regions, addresses are validated at the time of creation. The address you provide must be located within the serviceable area of your region. If the address is invalid or unsupported, then an exception is thrown. If providing an address as a JSON file through the `cli-input-json` option, include the full file path. For example, `--cli-input-json file://create-address.json`.
    flag:
        address: The address that you want the Snow device shipped to.
