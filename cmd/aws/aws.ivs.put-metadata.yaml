name: put-metadata
description: Inserts metadata into the active stream of the specified channel.
flags:
    --channel-arn=!: ARN of the channel into which metadata is inserted.
    --metadata=!: Metadata to insert into the stream.
documentation:
    command: Inserts metadata into the active stream of the specified channel. At most 5 requests per second per channel are allowed, each with a maximum 1 KB payload. (If 5 TPS is not sufficient for your needs, we recommend batching your data into a single PutMetadata call.) At most 155 requests per second per account are allowed. Also see [Embedding Metadata within a Video Stream](https://docs.aws.amazon.com/ivs/latest/userguide/metadata.html) in the *Amazon IVS User Guide*.
    flag:
        channel-arn: ARN of the channel into which metadata is inserted. This channel must have an active stream.
        metadata: 'Metadata to insert into the stream. Maximum: 1 KB per request.'
