name: create-metric-attribution
description: Creates a metric attribution.
flags:
    --dataset-group-arn=!: The Amazon Resource Name (ARN) of the destination dataset group for the metric attribution.
    --metrics-output-config=!: The output configuration details for the metric attribution.
    --metrics=!: A list of metric attributes for the metric attribution.
    --name=!: A name for the metric attribution.
documentation:
    command: Creates a metric attribution. A metric attribution creates reports on the data that you import into Amazon Personalize. Depending on how you imported the data, you can view reports in Amazon CloudWatch or Amazon S3. For more information, see [Measuring impact of recommendations](https://docs.aws.amazon.com/personalize/latest/dg/measuring-recommendation-impact.html).
    flag:
        dataset-group-arn: The Amazon Resource Name (ARN) of the destination dataset group for the metric attribution.
        metrics: A list of metric attributes for the metric attribution. Each metric attribute specifies an event type to track and a function. Available functions are `SUM()` or `SAMPLECOUNT()`. For SUM() functions, provide the dataset type (either Interactions or Items) and column to sum as a parameter. For example SUM(Items.PRICE).
        metrics-output-config: The output configuration details for the metric attribution.
        name: A name for the metric attribution.
