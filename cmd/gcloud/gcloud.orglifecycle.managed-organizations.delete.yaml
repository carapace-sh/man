name: delete
description: Delete a ManagedOrganization resource.
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location id of the managedOrganization resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --organization=: The organization id of the managedOrganization resource.
documentation:
    command: Delete a ManagedOrganization resource and corresponding Cloud Resource Manager organization resource.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location id of the managedOrganization resource.
            +
            To set the `location` attribute:
            * provide the argument `managed_organization` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        organization: |-
            The organization id of the managedOrganization resource.
            +
            To set the `organization` attribute:
            * provide the argument `managed_organization` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
