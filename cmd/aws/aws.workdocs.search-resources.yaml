name: search-resources
description: Searches metadata and the content of folders, documents, document versions, and comments.
flags:
    --additional-response-fields=: A list of attributes to include in the response.
    --authentication-token=: Amazon WorkDocs authentication token.
    --filters=: Filters results based on entity metadata.
    --limit=: Max results count per page.
    --marker=: The marker for the next set of results.
    --order-by=: Order by results in one or more categories.
    --organization-id=: Filters based on the resource owner OrgId.
    --query-scopes=: Filter based on the text field type.
    --query-text=: The String to search for.
documentation:
    command: Searches metadata and the content of folders, documents, document versions, and comments.
    flag:
        additional-response-fields: A list of attributes to include in the response. Used to request fields that are not normally returned in a standard response.
        authentication-token: Amazon WorkDocs authentication token. Not required when using Amazon Web Services administrator credentials to access the API.
        filters: Filters results based on entity metadata.
        limit: Max results count per page.
        marker: The marker for the next set of results.
        order-by: Order by results in one or more categories.
        organization-id: Filters based on the resource owner OrgId. This is a mandatory parameter when using Admin SigV4 credentials.
        query-scopes: Filter based on the text field type. A Folder has only a name and no content. A Comment has only content and no name. A Document or Document Version has a name and content
        query-text: The String to search for. Searches across different text fields based on request parameters. Use double quotes around the query string for exact phrase matches.
