name: create-component
description: Creates a new component that can be used to build, validate, test, and assess your image.
flags:
    --change-description=: The change description of the component.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=!: Unique, case-sensitive identifier you provide to ensure idempotency of the request.
    --data=: Component `data` contains inline YAML document content for the component.
    --description=: Describes the contents of the component.
    --dry-run: Validates the required permissions for the operation and the request parameters, without actually making the request, and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --kms-key-id=: The Amazon Resource Name (ARN) that uniquely identifies the KMS key used to encrypt this component.
    --name=!: The name of the component.
    --no-dry-run: Validates the required permissions for the operation and the request parameters, without actually making the request, and provides an error response.
    --platform=!: The operating system platform of the component.
    --semantic-version=!: The semantic version of the component.
    --supported-os-versions=:
        description: The operating system (OS) version supported by the component.
        nargs: -1
    --tags=: The tags that apply to the component.
    --uri=: The `uri` of a YAML component document file.
completion:
    flag:
        platform:
            - Windows
            - Linux
            - macOS
documentation:
    command: |-
        Creates a new component that can be used to build, validate, test, and assess your image. The component is based on a YAML document that you specify using exactly one of the following methods:

        - Inline, using the `data` property in the request body.
        - A URL that points to a YAML document file stored in Amazon S3, using the `uri` property in the request body.
    flag:
        change-description: The change description of the component. Describes what change has been made in this version, or what makes this version different from other versions of the component.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Unique, case-sensitive identifier you provide to ensure idempotency of the request. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html) in the *Amazon EC2 API Reference*.
        data: Component `data` contains inline YAML document content for the component. Alternatively, you can specify the `uri` of a YAML document file stored in Amazon S3. However, you cannot specify both properties.
        description: Describes the contents of the component.
        dry-run: Validates the required permissions for the operation and the request parameters, without actually making the request, and provides an error response. Upon a successful request, the error response is `DryRunOperationException`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        kms-key-id: The Amazon Resource Name (ARN) that uniquely identifies the KMS key used to encrypt this component. This can be either the Key ARN or the Alias ARN. For more information, see [Key identifiers (KeyId)](https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html#key-id-key-ARN) in the *Key Management Service Developer Guide*.
        name: The name of the component.
        platform: The operating system platform of the component.
        semantic-version: |-
            The semantic version of the component. This version follows the semantic version syntax.

            The semantic version has four nodes: &lt;major&gt;.&lt;minor&gt;.&lt;patch&gt;/&lt;build&gt;. You can assign values for the first three, and can filter on all of them.

            **Assignment:** For the first three nodes you can assign any positive integer value, including zero, with an upper limit of 2^30-1, or 1073741823 for each node. Image Builder automatically assigns the build number to the fourth node.

            **Patterns:** You can use any numeric pattern that adheres to the assignment requirements for the nodes that you can assign. For example, you might choose a software version pattern, such as 1.0.0, or a date, such as 2021.01.01.
        supported-os-versions: The operating system (OS) version supported by the component. If the OS information is available, a prefix match is performed against the base image OS version during image recipe creation.
        tags: The tags that apply to the component.
        uri: |-
            The `uri` of a YAML component document file. This must be an S3 URL (`s3://bucket/key`), and the requester must have permission to access the S3 bucket it points to. If you use Amazon S3, you can specify component content up to your service quota.

            Alternatively, you can specify the YAML document inline, using the component `data` property. You cannot specify both properties.
