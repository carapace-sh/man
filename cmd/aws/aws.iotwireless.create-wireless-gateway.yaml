name: create-wireless-gateway
description: Provisions a wireless gateway.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=: Each resource must have a unique client request token.
    --description=: The description of the new resource.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --lorawan=!: The gateway configuration information to use to create the wireless gateway.
    --name=: The name of the new resource.
    --tags=:
        description: The tags to attach to the new wireless gateway.
        nargs: -1
documentation:
    command: |-
        Provisions a wireless gateway.

        When provisioning a wireless gateway, you might run into duplication errors for the following reasons.

        - If you specify a `GatewayEui` value that already exists.
        - If you used a `ClientRequestToken` with the same parameters within the last 10 minutes.

        To avoid this error, make sure that you use unique identifiers and parameters for each request within the specified time period.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: Each resource must have a unique client request token. The client token is used to implement idempotency. It ensures that the request completes no more than one time. If you retry a request with the same token and the same parameters, the request will complete successfully. However, if you try to create a new resource using the same token but different parameters, an HTTP 409 conflict occurs. If you omit this value, AWS SDKs will automatically generate a unique client request. For more information about idempotency, see [Ensuring idempotency in Amazon EC2 API requests](https://docs.aws.amazon.com/ec2/latest/devguide/ec2-api-idempotency.html).
        description: The description of the new resource.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        lorawan: The gateway configuration information to use to create the wireless gateway.
        name: |-
            The name of the new resource.

            The following special characters aren't accepted: `<>^#~$`
        tags: The tags to attach to the new wireless gateway. Tags are metadata that you can use to manage a resource.
