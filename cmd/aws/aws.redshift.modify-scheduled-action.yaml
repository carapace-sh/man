name: modify-scheduled-action
description: Modifies a scheduled action.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --enable: A modified enable flag of the scheduled action.
    --end-time=: A modified end time of the scheduled action.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --iam-role=: A different IAM role to assume to run the target action.
    --no-enable: A modified enable flag of the scheduled action.
    --schedule=: A modified schedule in either `at( )` or `cron( )` format.
    --scheduled-action-description=: A modified description of the scheduled action.
    --scheduled-action-name=!: The name of the scheduled action to modify.
    --start-time=: A modified start time of the scheduled action.
    --target-action=: A modified JSON format of the scheduled action.
documentation:
    command: Modifies a scheduled action.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        enable: A modified enable flag of the scheduled action. If true, the scheduled action is active. If false, the scheduled action is disabled.
        end-time: A modified end time of the scheduled action. For more information about this parameter, see [ScheduledAction]().
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        iam-role: A different IAM role to assume to run the target action. For more information about this parameter, see [ScheduledAction]().
        schedule: A modified schedule in either `at( )` or `cron( )` format. For more information about this parameter, see [ScheduledAction]().
        scheduled-action-description: A modified description of the scheduled action.
        scheduled-action-name: The name of the scheduled action to modify.
        start-time: A modified start time of the scheduled action. For more information about this parameter, see [ScheduledAction]().
        target-action: A modified JSON format of the scheduled action. For more information about this parameter, see [ScheduledAction]().
