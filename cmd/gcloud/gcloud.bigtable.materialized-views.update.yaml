name: update
description: Update a Bigtable materialized view.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --deletion-protection=!: Whether the view is protected from deletion.
    --instance=: Bigtable instance for the materialized view.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: Update a Bigtable materialized view.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        deletion-protection: Whether the view is protected from deletion.
        instance: |-
            Bigtable instance for the materialized view.
            +
            To set the `instance` attribute:
            * provide the argument `materialized_view` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
