name: start-mlmodel-transform-job
description: Creates a new model transform job.
flags:
    --base-processing-instance-type=: The type of ML instance used in preparing and managing training of ML models.
    --base-processing-instance-volume-size-in-gb=: The disk volume size of the training instance in gigabytes.
    --custom-model-transform-parameters=: Configuration information for a model transform using a custom model.
    --data-processing-job-id=: The job ID of a completed data-processing job.
    --id=: A unique identifier for the new job.
    --ml-model-training-job-id=: The job ID of a completed model-training job.
    --model-transform-output-s3-location=!: The location in Amazon S3 where the model artifacts are to be stored.
    --neptune-iam-role-arn=: The ARN of an IAM role that provides Neptune access to SageMaker and Amazon S3 resources.
    --s3-output-encryption-kmskey=: The Amazon Key Management Service (KMS) key that SageMaker uses to encrypt the output of the processing job.
    --sagemaker-iam-role-arn=: The ARN of an IAM role for SageMaker execution.
    --security-group-ids=: The VPC security group IDs.
    --subnets=: The IDs of the subnets in the Neptune VPC.
    --training-job-name=: The name of a completed SageMaker training job.
    --volume-encryption-kmskey=: The Amazon Key Management Service (KMS) key that SageMaker uses to encrypt data on the storage volume attached to the ML compute instances that run the training job.
documentation:
    command: |-
        Creates a new model transform job. See [Use a trained model to generate new model artifacts](https://docs.aws.amazon.com/neptune/latest/userguide/machine-learning-model-transform.html).

        When invoking this operation in a Neptune cluster that has IAM authentication enabled, the IAM user or role making the request must have a policy attached that allows the [neptune-db:StartMLModelTransformJob](https://docs.aws.amazon.com/neptune/latest/userguide/iam-dp-actions.html#startmlmodeltransformjob) IAM action in that cluster.
    flag:
        base-processing-instance-type: The type of ML instance used in preparing and managing training of ML models. This is an ML compute instance chosen based on memory requirements for processing the training data and model.
        base-processing-instance-volume-size-in-gb: The disk volume size of the training instance in gigabytes. The default is 0. Both input data and the output model are stored on disk, so the volume size must be large enough to hold both data sets. If not specified or 0, Neptune ML selects a disk volume size based on the recommendation generated in the data processing step.
        custom-model-transform-parameters: 'Configuration information for a model transform using a custom model. The `customModelTransformParameters` object contains the following fields, which must have values compatible with the saved model parameters from the training job:'
        data-processing-job-id: The job ID of a completed data-processing job. You must include either `dataProcessingJobId` and a `mlModelTrainingJobId`, or a `trainingJobName`.
        id: A unique identifier for the new job. The default is an autogenerated UUID.
        ml-model-training-job-id: The job ID of a completed model-training job. You must include either `dataProcessingJobId` and a `mlModelTrainingJobId`, or a `trainingJobName`.
        model-transform-output-s3-location: The location in Amazon S3 where the model artifacts are to be stored.
        neptune-iam-role-arn: The ARN of an IAM role that provides Neptune access to SageMaker and Amazon S3 resources. This must be listed in your DB cluster parameter group or an error will occur.
        s3-output-encryption-kmskey: The Amazon Key Management Service (KMS) key that SageMaker uses to encrypt the output of the processing job. The default is none.
        sagemaker-iam-role-arn: The ARN of an IAM role for SageMaker execution. This must be listed in your DB cluster parameter group or an error will occur.
        security-group-ids: The VPC security group IDs. The default is None.
        subnets: The IDs of the subnets in the Neptune VPC. The default is None.
        training-job-name: The name of a completed SageMaker training job. You must include either `dataProcessingJobId` and a `mlModelTrainingJobId`, or a `trainingJobName`.
        volume-encryption-kmskey: The Amazon Key Management Service (KMS) key that SageMaker uses to encrypt data on the storage volume attached to the ML compute instances that run the training job. The default is None.
