name: describe
description: Describe inventory reports detail.
flags:
    --location=: Google Cloud location for the report-detail.
    --report-config=: Report Config ID for the report-detail.
documentation:
    command: |
        Describe the inventory report detail.
    flag:
        location: |-
            Google Cloud location for the report-detail.
            +
            To set the `location` attribute:
            * provide the argument `report_detail` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        report-config: |-
            Report Config ID for the report-detail.
            +
            To set the `report-config` attribute:
            * provide the argument `report_detail` on the command line with a fully specified name;
            * provide the argument `--report-config` on the command line.
