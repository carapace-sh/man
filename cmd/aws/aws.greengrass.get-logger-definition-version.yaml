name: get-logger-definition-version
description: Retrieves information about a logger definition version.
flags:
    --logger-definition-id=!: The ID of the logger definition.
    --logger-definition-version-id=!: The ID of the logger definition version.
    --next-token=: The token for the next set of results, or ''null'' if there are no additional results.
documentation:
    command: Retrieves information about a logger definition version.
    flag:
        logger-definition-id: The ID of the logger definition.
        logger-definition-version-id: The ID of the logger definition version. This value maps to the ''Version'' property of the corresponding ''VersionInformation'' object, which is returned by ''ListLoggerDefinitionVersions'' requests. If the version is the last one that was associated with a logger definition, the value also maps to the ''LatestVersion'' property of the corresponding ''DefinitionInformation'' object.
        next-token: The token for the next set of results, or ''null'' if there are no additional results.
