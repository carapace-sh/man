    --folder=: The folder ID (e.g., 456) that contains the finding.
    --location=: When data residency controls are enabled, this attribute specifies the location in which
    --organization=: The organization ID (e.g., 123) that contains the finding.
    --source-properties=: Source specific properties.
    --source=: Source id.
    --state=: 'State is one of: [ACTIVE, INACTIVE].'
    --update-mask=: 'Optional: If left unspecified (default), an update-mask is automatically'
completion:
    flag:
        api-version:
