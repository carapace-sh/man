name: create
description: '*(BETA)*  Create a Tenant.'
flags:
    --consumer-resource=: A reference to the consumer resource this SaaS Tenant is representing.
    --labels=: The labels on the resource, which can be used for categorization.
    --location=: For resources [tenant, saas], provides fallback value for resource location attribute.
    --saas=!: ID of the saas or fully qualified identifier for the saas.
documentation:
    command: '*(BETA)*  Create a Tenant'
    flag:
        consumer-resource: A reference to the consumer resource this SaaS Tenant is representing.
        labels: |-
            The labels on the resource, which can be used for categorization.
            similar to Kubernetes resource labels.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: For resources [tenant, saas], provides fallback value for resource location attribute. When the resource's full URI path is not provided, location will fallback to this flag value.
        saas: |-
            ID of the saas or fully qualified identifier for the saas.
            +
            To set the `saas` attribute:
            * provide the argument `--saas` on the command line.
