name: detach-group-policy
description: Removes the specified managed policy from the specified IAM group.
flags:
    --group-name=!: The name (friendly name, not ARN) of the IAM group to detach the policy from.
    --policy-arn=!: The Amazon Resource Name (ARN) of the IAM policy you want to detach.
documentation:
    command: |-
        Removes the specified managed policy from the specified IAM group.

        A group can also have inline policies embedded with it. To delete an inline policy, use [DeleteGroupPolicy](https://docs.aws.amazon.com/IAM/latest/APIReference/API_DeleteGroupPolicy.html). For information about policies, see [Managed policies and inline policies](https://docs.aws.amazon.com/IAM/latest/UserGuide/policies-managed-vs-inline.html) in the *IAM User Guide*.
    flag:
        group-name: |-
            The name (friendly name, not ARN) of the IAM group to detach the policy from.

            This parameter allows (through its [regex pattern](http://wikipedia.org/wiki/regex)) a string of characters consisting of upper and lowercase alphanumeric characters with no spaces. You can also include any of the following characters: \_+=,.@-
        policy-arn: |-
            The Amazon Resource Name (ARN) of the IAM policy you want to detach.

            For more information about ARNs, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference*.
