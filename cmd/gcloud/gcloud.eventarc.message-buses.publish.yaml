name: publish
description: Publish to an Eventarc message bus.
flags:
    --avro-message=: An Avro message to publish to the message bus.
    --destination-enrollment-project=&: Project ID of the Google Cloud project for the enrollment.
    --destination-enrollment=&: ID of the enrollment or fully qualified identifier for the enrollment.
    --event-attributes=: Event attributes.
    --event-data=!: An event data.
    --event-id=!: An event id.
    --event-source=!: An event source.
    --event-type=!: An event type.
    --json-message=: A JSON message to publish to the message bus.
    --location=: The location for the Eventarc message bus, which should be one of the supported regions.
documentation:
    command: Publish to an Eventarc message bus.
    flag:
        avro-message: An Avro message to publish to the message bus.
        destination-enrollment: |-
            ID of the enrollment or fully qualified identifier for the enrollment.

            To set the `enrollment` attribute:
            * provide the argument `--destination-enrollment` on the command line.
        destination-enrollment-project: |-
            Project ID of the Google Cloud project for the enrollment.

            To set the `project` attribute:
            * provide the argument `--destination-enrollment` on the command line with a fully specified name;
            * provide the argument `--destination-enrollment-project` on the command line;
            * provide the argument `--project` on the command line;
            * set the property `core/project`.
        event-attributes: Event attributes. The event attributes of a published event.This flag can be repeated to add more attributes.
        event-data: An event data. The event data of a published event.
        event-id: An event id. The id of a published event.
        event-source: An event source. The event source of a published event.
        event-type: An event type. The event type of a published event.
        json-message: A JSON message to publish to the message bus.
        location: |-
            The location for the Eventarc message bus, which should be one of the supported regions. Alternatively, set the [eventarc/location] property.
            +
            To set the `location` attribute:
            * provide the argument `message_bus` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `eventarc/location`.
