name: create-route-server-peer
description: Creates a new BGP peer for a specified route server endpoint.
flags:
    --bgp-options=!: The BGP options for the peer, including ASN (Autonomous System Number) and BFD (Bidrectional Forwarding Detection) settings.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --peer-address=!: The IPv4 address of the peer device.
    --route-server-endpoint-id=!: The ID of the route server endpoint for which to create a peer.
    --tag-specifications=:
        description: The tags to apply to the route server peer during creation.
        nargs: -1
documentation:
    command: |-
        Creates a new BGP peer for a specified route server endpoint.

        A route server peer is a session between a route server endpoint and the device deployed in Amazon Web Services (such as a firewall appliance or other network security function running on an EC2 instance). The device must meet these requirements:

        - Have an elastic network interface in the VPC
        - Support BGP (Border Gateway Protocol)
        - Can initiate BGP sessions

        For more information see [Dynamic routing in your VPC with VPC Route Server](https://docs.aws.amazon.com/vpc/latest/userguide/dynamic-routing-route-server.html) in the *Amazon VPC User Guide*.
    flag:
        bgp-options: The BGP options for the peer, including ASN (Autonomous System Number) and BFD (Bidrectional Forwarding Detection) settings.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        peer-address: The IPv4 address of the peer device.
        route-server-endpoint-id: The ID of the route server endpoint for which to create a peer.
        tag-specifications: The tags to apply to the route server peer during creation.
