name: create-environment-host
description: Creates an ESXi host and adds it to an Amazon EVS environment.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: This parameter is not used in Amazon EVS currently.
    --environment-id=!: A unique ID for the environment that the host is added to.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --host=!: The host that is created and added to the environment.
documentation:
    command: |-
        Creates an ESXi host and adds it to an Amazon EVS environment. Amazon EVS supports 4-16 hosts per environment.

        This action can only be used after the Amazon EVS environment is deployed.

        You can use the `dedicatedHostId` parameter to specify an Amazon EC2 Dedicated Host for ESXi host creation.

        You can use the `placementGroupId` parameter to specify a cluster or partition placement group to launch EC2 instances into.

        You cannot use the `dedicatedHostId` and `placementGroupId` parameters together in the same `CreateEnvironmentHost` action. This results in a `ValidationException` response.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: |-
            This parameter is not used in Amazon EVS currently. If you supply input for this parameter, it will have no effect.

            A unique, case-sensitive identifier that you provide to ensure the idempotency of the host creation request. If you do not specify a client token, a randomly generated token is used for the request to ensure idempotency.
        environment-id: A unique ID for the environment that the host is added to.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        host: The host that is created and added to the environment.
