name: create-id-mapping-table
description: Creates an ID mapping table.
flags:
    --description=: A description of the ID mapping table.
    --input-reference-config=!: The input reference configuration needed to create the ID mapping table.
    --kms-key-arn=: The Amazon Resource Name (ARN) of the Amazon Web Services KMS key.
    --membership-identifier=!: The unique identifier of the membership that contains the ID mapping table.
    --name=!: A name for the ID mapping table.
    --tags=: An optional label that you can assign to a resource when you create it.
documentation:
    command: Creates an ID mapping table.
    flag:
        description: A description of the ID mapping table.
        input-reference-config: The input reference configuration needed to create the ID mapping table.
        kms-key-arn: The Amazon Resource Name (ARN) of the Amazon Web Services KMS key. This value is used to encrypt the mapping table data that is stored by Clean Rooms.
        membership-identifier: The unique identifier of the membership that contains the ID mapping table.
        name: A name for the ID mapping table.
        tags: An optional label that you can assign to a resource when you create it. Each tag consists of a key and an optional value, both of which you define. When you use tagging, you can also use tag-based access control in IAM policies to control access to this resource.
