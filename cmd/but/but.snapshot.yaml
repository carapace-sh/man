# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: snapshot
description: Create an on-demand snapshot with optional message
group: operation history
flags:
    -h, --help: Print help
    -m, --message=: Message to include with the snapshot
documentation:
    command: Creates a snapshot of the current workspace state in the operation log. This is useful for creating manual checkpoints before making significant changes.
