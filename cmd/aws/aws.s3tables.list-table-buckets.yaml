name: list-table-buckets
description: Lists table buckets for your account.
flags:
    --continuation-token=: '`ContinuationToken` indicates to Amazon S3 that the list is being continued on this bucket with a token.'
    --max-buckets=: The maximum number of table buckets to return in the list.
    --prefix=: The prefix of the table buckets.
    --type=: The type of table buckets to filter by in the list.
completion:
    flag:
        type:
            - customer
            - aws
documentation:
    command: |-
        Lists table buckets for your account. For more information, see [S3 Table buckets](https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-tables-buckets.html) in the *Amazon Simple Storage Service User Guide*.

        Permissions

        You must have the `s3tables:ListTableBuckets` permission to use this operation.
    flag:
        continuation-token: '`ContinuationToken` indicates to Amazon S3 that the list is being continued on this bucket with a token. `ContinuationToken` is obfuscated and is not a real key. You can use this `ContinuationToken` for pagination of the list results.'
        max-buckets: The maximum number of table buckets to return in the list.
        prefix: The prefix of the table buckets.
        type: The type of table buckets to filter by in the list.
