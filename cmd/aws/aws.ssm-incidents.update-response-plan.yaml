name: update-response-plan
description: Updates the specified response plan.
flags:
    --actions=: The actions that this response plan takes at the beginning of an incident.
    --arn=!: The Amazon Resource Name (ARN) of the response plan.
    --chat-channel=: The Chatbot chat channel used for collaboration during an incident.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A token ensuring that the operation is called only once with the specified details.
    --display-name=: The long format name of the response plan.
    --engagements=: The Amazon Resource Name (ARN) for the contacts and escalation plans that the response plan engages during an incident.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --incident-template-dedupe-string=: The string Incident Manager uses to prevent duplicate incidents from being created by the same incident in the same account.
    --incident-template-impact=: Defines the impact to the customers.
    --incident-template-notification-targets=: The Amazon SNS targets that are notified when updates are made to an incident.
    --incident-template-summary=: A brief summary of the incident.
    --incident-template-tags=: Tags to assign to the template.
    --incident-template-title=: The short format name of the incident.
    --integrations=: Information about third-party services integrated into the response plan.
documentation:
    command: Updates the specified response plan.
    flag:
        actions: The actions that this response plan takes at the beginning of an incident.
        arn: The Amazon Resource Name (ARN) of the response plan.
        chat-channel: |-
            The Chatbot chat channel used for collaboration during an incident.

            Use the empty structure to remove the chat channel from the response plan.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A token ensuring that the operation is called only once with the specified details.
        display-name: The long format name of the response plan. The display name can't contain spaces.
        engagements: The Amazon Resource Name (ARN) for the contacts and escalation plans that the response plan engages during an incident.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        incident-template-dedupe-string: The string Incident Manager uses to prevent duplicate incidents from being created by the same incident in the same account.
        incident-template-impact: |-
            Defines the impact to the customers. Providing an impact overwrites the impact provided by a response plan.

            **Supported impact codes**

            - `1` - Critical
            - `2` - High
            - `3` - Medium
            - `4` - Low
            - `5` - No Impact
        incident-template-notification-targets: The Amazon SNS targets that are notified when updates are made to an incident.
        incident-template-summary: A brief summary of the incident. This typically contains what has happened, what's currently happening, and next steps.
        incident-template-tags: Tags to assign to the template. When the `StartIncident` API action is called, Incident Manager assigns the tags specified in the template to the incident. To call this action, you must also have permission to call the `TagResource` API action for the incident record resource.
        incident-template-title: The short format name of the incident. The title can't contain spaces.
        integrations: Information about third-party services integrated into the response plan.
