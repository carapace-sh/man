name: list-microsoft-teams-channel-configurations
description: Lists all AWS Chatbot Microsoft Teams channel configurations in an AWS account.
flags:
    --max-results=: The maximum number of results to include in the response.
    --next-token=: An optional token returned from a prior request.
    --team-id=: The ID of the Microsoft Teams authorized with AWS Chatbot.
documentation:
    command: Lists all AWS Chatbot Microsoft Teams channel configurations in an AWS account.
    flag:
        max-results: The maximum number of results to include in the response. If more results exist than the specified MaxResults value, a token is included in the response so that the remaining results can be retrieved.
        next-token: An optional token returned from a prior request. Use this token for pagination of results from this action. If this parameter is specified, the response includes only results beyond the token, up to the value specified by MaxResults.
        team-id: |-
            The ID of the Microsoft Teams authorized with AWS Chatbot.

            To get the team ID, you must perform the initial authorization flow with Microsoft Teams in the AWS Chatbot console. Then you can copy and paste the team ID from the console. For more information, see [Step 1: Configure a Microsoft Teams client](https://docs.aws.amazon.com/chatbot/latest/adminguide/teams-setup.html#teams-client-setup) in the *AWS Chatbot Administrator Guide*.
