name: describe-endpoints
description: Send a request with an empty body to the regional API endpoint to get your account API endpoint.
flags:
    --max-results=: Optional.
    --mode=: Optional field, defaults to DEFAULT.
    --next-token=: Use this string, provided with the response to a previous request, to request the next batch of endpoints.
completion:
    flag:
        mode:
            - DEFAULT
            - GET_ONLY
documentation:
    command: Send a request with an empty body to the regional API endpoint to get your account API endpoint. Note that DescribeEndpoints is no longer required. We recommend that you send your requests directly to the regional endpoint instead.
    flag:
        max-results: Optional. Max number of endpoints, up to twenty, that will be returned at one time.
        mode: Optional field, defaults to DEFAULT. Specify DEFAULT for this operation to return your endpoints if any exist, or to create an endpoint for you and return it if one doesn't already exist. Specify GET\_ONLY to return your endpoints if any exist, or an empty list if none exist.
        next-token: Use this string, provided with the response to a previous request, to request the next batch of endpoints.
