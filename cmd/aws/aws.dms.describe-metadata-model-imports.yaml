name: describe-metadata-model-imports
description: Returns a paginated list of metadata model imports.
flags:
    --filters=: Filters applied to the metadata model imports described in the form of key-value pairs.
    --marker=: Specifies the unique pagination token that makes it possible to display the next page of results.
    --max-records=: A paginated list of metadata model imports.
    --migration-project-identifier=!: The migration project name or Amazon Resource Name (ARN).
documentation:
    command: Returns a paginated list of metadata model imports.
    flag:
        filters: Filters applied to the metadata model imports described in the form of key-value pairs.
        marker: |-
            Specifies the unique pagination token that makes it possible to display the next page of results. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.

            If `Marker` is returned by a previous response, there are more results available. The value of `Marker` is a unique pagination token for each page. To retrieve the next page, make the call again using the returned token and keeping all other arguments unchanged.
        max-records: A paginated list of metadata model imports.
        migration-project-identifier: The migration project name or Amazon Resource Name (ARN).
