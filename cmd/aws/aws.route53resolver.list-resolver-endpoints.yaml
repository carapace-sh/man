name: list-resolver-endpoints
description: Lists all the Resolver endpoints that were created using the current Amazon Web Services account.
flags:
    --filters=: An optional specification to return a subset of Resolver endpoints, such as all inbound Resolver endpoints.
    --max-results=: The maximum number of Resolver endpoints that you want to return in the response to a `ListResolverEndpoints` request.
    --next-token=: For the first `ListResolverEndpoints` request, omit this value.
documentation:
    command: Lists all the Resolver endpoints that were created using the current Amazon Web Services account.
    flag:
        filters: |-
            An optional specification to return a subset of Resolver endpoints, such as all inbound Resolver endpoints.

            If you submit a second or subsequent `ListResolverEndpoints` request and specify the `NextToken` parameter, you must use the same values for `Filters`, if any, as in the previous request.
        max-results: The maximum number of Resolver endpoints that you want to return in the response to a `ListResolverEndpoints` request. If you don't specify a value for `MaxResults`, Resolver returns up to 100 Resolver endpoints.
        next-token: |-
            For the first `ListResolverEndpoints` request, omit this value.

            If you have more than `MaxResults` Resolver endpoints, you can submit another `ListResolverEndpoints` request to get the next group of Resolver endpoints. In the next request, specify the value of `NextToken` from the previous response.
