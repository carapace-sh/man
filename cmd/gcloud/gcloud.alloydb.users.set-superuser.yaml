name: set-superuser
description: Update an AlloyDB user's superuser role within a given cluster and region.
flags:
    --cluster=!: AlloyDB cluster ID
    --region=!: Regional location (e.g. `asia-east1`, `us-east1`).
    --superuser=!: If true, user will have AlloyDB superuser privileges
documentation:
    command: Update an AlloyDB user's superuser role within a given cluster and region.
    flag:
        cluster: AlloyDB cluster ID
        region: Regional location (e.g. `asia-east1`, `us-east1`). See the full list of regions at https://cloud.google.com/sql/docs/instance-locations.
        superuser: If true, user will have AlloyDB superuser privileges
