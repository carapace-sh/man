name: search-user-profiles
description: Searches user profiles in Amazon DataZone.
flags:
    --domain-identifier=!: The identifier of the Amazon DataZone domain in which you want to search user profiles.
    --max-results=: The maximum number of results to return in a single call to `SearchUserProfiles`.
    --next-token=: When the number of results is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of results, the response includes a pagination token named `NextToken`.
    --search-text=: Specifies the text for which to search.
    --user-type=!: Specifies the user type for the `SearchUserProfiles` action.
completion:
    flag:
        user-type:
            - SSO_USER
            - DATAZONE_USER
            - DATAZONE_SSO_USER
            - DATAZONE_IAM_USER
documentation:
    command: Searches user profiles in Amazon DataZone.
    flag:
        domain-identifier: The identifier of the Amazon DataZone domain in which you want to search user profiles.
        max-results: The maximum number of results to return in a single call to `SearchUserProfiles`. When the number of results to be listed is greater than the value of `MaxResults`, the response contains a `NextToken` value that you can use in a subsequent call to `SearchUserProfiles` to list the next set of results.
        next-token: When the number of results is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of results, the response includes a pagination token named `NextToken`. You can specify this `NextToken` value in a subsequent call to `SearchUserProfiles` to list the next set of results.
        search-text: Specifies the text for which to search.
        user-type: Specifies the user type for the `SearchUserProfiles` action.
