name: delete-predictor
description: Deletes a predictor created using the [DescribePredictor]() or [CreatePredictor]() operations.
flags:
    --predictor-arn=!: The Amazon Resource Name (ARN) of the predictor to delete.
documentation:
    command: Deletes a predictor created using the [DescribePredictor]() or [CreatePredictor]() operations. You can delete only predictor that have a status of `ACTIVE` or `CREATE_FAILED`. To get the status, use the [DescribePredictor]() operation.
    flag:
        predictor-arn: The Amazon Resource Name (ARN) of the predictor to delete.
