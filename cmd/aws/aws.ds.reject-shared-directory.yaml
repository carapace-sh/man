name: reject-shared-directory
description: Rejects a directory sharing request that was sent from the directory owner account.
flags:
    --shared-directory-id=!: Identifier of the shared directory in the directory consumer account.
documentation:
    command: Rejects a directory sharing request that was sent from the directory owner account.
    flag:
        shared-directory-id: Identifier of the shared directory in the directory consumer account. This identifier is different for each directory owner account.
