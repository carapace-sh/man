name: delete-forecast-export-job
description: Deletes a forecast export job created using the [CreateForecastExportJob]() operation.
flags:
    --forecast-export-job-arn=!: The Amazon Resource Name (ARN) of the forecast export job to delete.
documentation:
    command: Deletes a forecast export job created using the [CreateForecastExportJob]() operation. You can delete only export jobs that have a status of `ACTIVE` or `CREATE_FAILED`. To get the status, use the [DescribeForecastExportJob]() operation.
    flag:
        forecast-export-job-arn: The Amazon Resource Name (ARN) of the forecast export job to delete.
