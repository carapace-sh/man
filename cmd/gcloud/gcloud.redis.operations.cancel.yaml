name: cancel
description: Cancel a Memorystore Redis import or export operation.
flags:
    --region=: The name of the Redis region of the operation.
documentation:
    command: |
        Cancel a Memorystore Redis import or export operation.

        An export operation can be canceled at any time. This does not impact the data or availability
        of an instance.

        An import operation can also be canceled. Note that the cancellation will result in the
        instance recovering with a fully flushed cache.
    flag:
        region: |-
            The name of the Redis region of the operation. Overrides the default
            redis/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `redis/region`.
