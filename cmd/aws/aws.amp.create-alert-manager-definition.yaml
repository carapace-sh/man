name: create-alert-manager-definition
description: The `CreateAlertManagerDefinition` operation creates the alert manager definition in a workspace.
flags:
    --client-token=: A unique identifier that you can provide to ensure the idempotency of the request.
    --data=!: The alert manager definition to add.
    --workspace-id=!: The ID of the workspace to add the alert manager definition to.
documentation:
    command: The `CreateAlertManagerDefinition` operation creates the alert manager definition in a workspace. If a workspace already has an alert manager definition, don't use this operation to update it. Instead, use `PutAlertManagerDefinition`.
    flag:
        client-token: A unique identifier that you can provide to ensure the idempotency of the request. Case-sensitive.
        data: |-
            The alert manager definition to add. A base64-encoded version of the YAML alert manager definition file.

            For details about the alert manager definition, see [AlertManagedDefinitionData](https://docs.aws.amazon.com/prometheus/latest/APIReference/yaml-AlertManagerDefinitionData.html).
        workspace-id: The ID of the workspace to add the alert manager definition to.
