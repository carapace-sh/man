name: associate-role-to-group
description: Associates a role with a group.
flags:
    --group-id=!: The ID of the Greengrass group.
    --role-arn=!: The ARN of the role you wish to associate with this group.
documentation:
    command: Associates a role with a group. Your Greengrass core will use the role to access AWS cloud services. The role's permissions should allow Greengrass core Lambda functions to perform actions against the cloud.
    flag:
        group-id: The ID of the Greengrass group.
        role-arn: The ARN of the role you wish to associate with this group. The existence of the role is not validated.
