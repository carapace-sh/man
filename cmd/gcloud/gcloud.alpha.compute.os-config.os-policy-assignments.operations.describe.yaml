name: describe
description: '*(ALPHA)*  Describe an OS policy assignment operation.'
flags:
    --location=: Location of the OS policy assignment operation.
    --os-policy-assignment=: OS policy assignment.
documentation:
    command: |
        *(ALPHA)*  Describe an OS policy assignment
        ## EXAMPLES

        To describe an operation with`operation-id` for an OS policy assignment `my-assignment` in
        location `us-central1-a`, run:

          $ gcloud alpha compute os-config os-policy-assignments operations describe operation-id --location=us-central1-a --os-policy-assignment=my-assignment

        You can also describe an operation by passing the full operation name:

          $ gcloud alpha compute os-config os-policy-assignments operations describe projects/my-project/locations/us-central1-a/osPolicyAssignments/my-assignment/operations/operation-id
    flag:
        location: |-
            Location of the OS policy assignment operation.
            +

            To set the `location` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/zone`.
        os-policy-assignment: |-
            OS policy assignment.
            +

            To set the `os-policy-assignment` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--os-policy-assignment` on the command line.
