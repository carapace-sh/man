name: query-version-config
description: Query versions for creating or upgrading an Anthos on VMware user cluster.
flags:
    --admin-cluster-membership-location=: Google Cloud location for the admin_cluster_membership.
    --admin-cluster-membership-project=: Project ID of the Google Cloud project for the admin_cluster_membership.
    --admin-cluster-membership=!: ID of the admin_cluster_membership or fully qualified identifier for the admin_cluster_membership.
    --cluster=!: ID of the cluster or fully qualified identifier for the cluster.
    --location=: ID of the location or fully qualified identifier for the location.
documentation:
    command: Query versions for creating or upgrading an Anthos on VMware user cluster.
    flag:
        admin-cluster-membership: |-
            ID of the admin_cluster_membership or fully qualified identifier for the admin_cluster_membership.
            +
            To set the `admin_cluster_membership` attribute:
            * provide the argument `--admin-cluster-membership` on the command line.
        admin-cluster-membership-location: |-
            Google Cloud location for the admin_cluster_membership.
            +
            To set the `location` attribute:
            * provide the argument `--admin-cluster-membership` on the command line with a fully specified name;
            * provide the argument `--admin-cluster-membership-location` on the command line.
        admin-cluster-membership-project: |-
            Project ID of the Google Cloud project for the admin_cluster_membership.
            +
            To set the `project` attribute:
            * provide the argument `--admin-cluster-membership` on the command line with a fully specified name;
            * provide the argument `--admin-cluster-membership-project` on the command line;
            * provide the argument `--project` on the command line;
            * set the property `core/project`.
        cluster: |-
            ID of the cluster or fully qualified identifier for the cluster.
            +
            To set the `cluster` attribute:
            * provide the argument `--cluster` on the command line.
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line;
            * set the property `container_vmware/location`.
