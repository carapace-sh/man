name: create
description: '*(ALPHA)*  Create an experiment template.'
hidden: true
flags:
    --cloud-sql-failover-instance=!: The identifying name of the Cloud SQL instance to fail over.
    --description=: Optional user-provided description or notes.
    --display-name=: Human-readable template name.
    --duration=!: How long the experiment is intended to run.
    --location=: The location id of the experimentTemplate resource.
    --tags=: Optional user-provided tags.
documentation:
    command: |
        *(ALPHA)*  Create an experiment template.
    flag:
        cloud-sql-failover-instance: |-
            The identifying name of the Cloud SQL instance to fail over.
            Formatted like projects/{project_id}/instances/{instance_id}
        description: Optional user-provided description or notes. Min length 0. Max length 2000.
        display-name: Human-readable template name. Min length 0, max 1000.
        duration: |-
            How long the experiment is intended to run. Min duration is 0, max is 10
            days.
        location: |-
            The location id of the experimentTemplate resource.
            +
            To set the `location` attribute:
            * provide the argument `experiment_template` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        tags: Optional user-provided tags. Min length 0, max combined length 1000.
