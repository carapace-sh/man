name: list-kafka-versions
description: Returns a list of Apache Kafka versions.
flags:
    --max-results=: The maximum number of results to return in the response.
    --next-token=: The paginated results marker.
documentation:
    command: Returns a list of Apache Kafka versions.
    flag:
        max-results: The maximum number of results to return in the response. If there are more results, the response includes a NextToken parameter.
        next-token: The paginated results marker. When the result of the operation is truncated, the call returns NextToken in the response. To get the next batch, provide this token in your next request.
