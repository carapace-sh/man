# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: interconnect
description: Interconnect
commands:
    - name: accept-connection-proposal
      description: Accepts a connection proposal which was generated at a supported partner's portal.
      flags:
        --activation-key=!: An Activation Key that was generated on a supported partner's portal.
        --attach-point=!: The Attach Point to which the connection should be associated.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: Idempotency token used for the request.
        --description=: A description to distinguish this [Connection]().
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --tags=: The tags to associate with the resulting [Connection]().
      documentation:
        command: |-
            Accepts a connection proposal which was generated at a supported partner's portal.

            The proposal contains the Environment and bandwidth that were chosen on the partner's portal and cannot be modified.

            Upon accepting the proposal a connection will be made between the AWS network as accessed via the selected Attach Point and the network previously selected network on the partner's portal.
        flag:
            activation-key: |-
                An Activation Key that was generated on a supported partner's portal. This key captures the desired parameters from the initial creation request.

                The details of this request can be described using with [DescribeConnectionProposal]().
            attach-point: The Attach Point to which the connection should be associated.
            cli-input-json: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            cli-input-yaml: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            client-token: Idempotency token used for the request.
            description: A description to distinguish this [Connection]().
            generate-cli-skeleton: |-
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            tags: The tags to associate with the resulting [Connection]().
    - name: create-connection
      description: Initiates the process to create a Connection across the specified Environment.
      flags:
        --attach-point=!: The Attach Point to which the connection should be associated."
        --bandwidth=!: The desired bandwidth of the requested [Connection]()
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: Idempotency token used for the request.
        --description=: A description to distinguish this [Connection]().
        --environment-id=!: The identifier of the [Environment]() across which this [Connection]() should be created.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --remote-account=: Account and/or principal identifying information that can be verified by the partner of this specific Environment.
        --tags=: The tag to associate with the resulting [Connection]().
      documentation:
        command: |-
            Initiates the process to create a Connection across the specified Environment.

            The Environment dictates the specified partner and location to which the other end of the connection should attach. You can see a list of the available Environments by calling [ListEnvironments]()

            The Attach Point specifies where within the AWS Network your connection will logically connect.

            After a successful call to this method, the resulting [Connection]() will return an Activation Key which will need to be brought to the specific partner's portal to confirm the [Connection]() on both sides. (See [Environment$activationPageUrl]() for a direct link to the partner portal).
        flag:
            attach-point: The Attach Point to which the connection should be associated."
            bandwidth: The desired bandwidth of the requested [Connection]()
            cli-input-json: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            cli-input-yaml: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            client-token: Idempotency token used for the request.
            description: A description to distinguish this [Connection]().
            environment-id: |-
                The identifier of the [Environment]() across which this [Connection]() should be created.

                The available [Environment]() objects can be determined using [ListEnvironments]().
            generate-cli-skeleton: |-
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            remote-account: Account and/or principal identifying information that can be verified by the partner of this specific Environment.
            tags: The tag to associate with the resulting [Connection]().
