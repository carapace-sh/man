name: get-vehicle-status
description: Retrieves information about the status of campaigns, decoder manifests, or state templates associated with a vehicle.
flags:
    --max-results=: The maximum number of items to return, between 1 and 100, inclusive.
    --next-token=: A pagination token for the next set of results.
    --vehicle-name=!: The ID of the vehicle to retrieve information about.
documentation:
    command: Retrieves information about the status of campaigns, decoder manifests, or state templates associated with a vehicle.
    flag:
        max-results: The maximum number of items to return, between 1 and 100, inclusive. This parameter is only supported for resources of type `CAMPAIGN`.
        next-token: |-
            A pagination token for the next set of results.

            If the results of a search are large, only a portion of the results are returned, and a `nextToken` pagination token is returned in the response. To retrieve the next set of results, reissue the search request and include the returned token. When all results have been returned, the response does not contain a pagination token value. This parameter is only supported for resources of type `CAMPAIGN`.
        vehicle-name: The ID of the vehicle to retrieve information about.
