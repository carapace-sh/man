name: delete-index
description: Deletes an index from an OpenSearch Serverless collection.
flags:
    --id=!: The unique identifier of the collection containing the index to delete.
    --index-name=!: The name of the index to delete.
documentation:
    command: Deletes an index from an OpenSearch Serverless collection. Be aware that the index might be configured to conduct automatic semantic enrichment ingestion and search. For more information, see [About automatic semantic enrichment](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-manage.html#serverless-semantic-enrichment).
    flag:
        id: The unique identifier of the collection containing the index to delete.
        index-name: The name of the index to delete.
