name: enable
description: '*(BETA)*  Enable Config Management feature.'
flags:
    --fleet-default-member-config=: Path to YAML file that contains the [fleet-default membership configuration](https://cloud.google.com/kubernetes-engine/fleet-management/docs/manage-features) to enable with a new feature.
documentation:
    command: |-
        *(BETA)*  Enables the Config Management feature in a fleet.
        Without any flags, this command no-ops if the feature is already enabled.
        This command can also enable the feature with a [fleet-default membership
        configuration](https://cloud.google.com/kubernetes-engine/fleet-management/docs/manage-features)
        for Config Sync.

        ## EXAMPLES

        To enable the Config Management feature, run:

          $ gcloud beta container hub config-management enable

        To enable the Config Management feature with a fleet-default membership
        configuration for Config Sync, run:

          $ gcloud beta container hub config-management enable --fleet-default-member-config=config.yaml
    flag:
        fleet-default-member-config: 'Path to YAML file that contains the [fleet-default membership configuration](https://cloud.google.com/kubernetes-engine/fleet-management/docs/manage-features) to enable with a new feature. This file shares the syntax of the `--config` flag on the `apply` command: see recognized fields [here](https://cloud.google.com/kubernetes-engine/enterprise/config-sync/docs/reference/gcloud-apply-fields). Errors if the Policy Controller or Hierarchy Controller field is set. This flag will also enable or update the fleet-default membership configuration on an existing feature. See the `apply` command for how to sync a membership to the fleet-default membership configuration.'
