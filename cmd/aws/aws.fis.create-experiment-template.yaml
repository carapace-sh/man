    --actions=!: The actions for the experiment.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=!: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --description=!: A description for the experiment template.
    --experiment-options=: The experiment options for the experiment template.
    --experiment-report-configuration=: The experiment report configuration for the experiment template.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --log-configuration=: The configuration for experiment logging.
    --role-arn=!: The Amazon Resource Name (ARN) of an IAM role that grants the FIS service permission to perform service actions on your behalf.
    --stop-conditions=!: The stop conditions.
    --tags=: The tags to apply to the experiment template.
    --targets=: The targets for the experiment.
documentation:
    command: |-
        Creates an experiment template.

        An experiment template includes the following components:

        - **Targets**: A target can be a specific resource in your Amazon Web Services environment, or one or more resources that match criteria that you specify, for example, resources that have specific tags.
        - **Actions**: The actions to carry out on the target. You can specify multiple actions, the duration of each action, and when to start each action during an experiment.
        - **Stop conditions**: If a stop condition is triggered while an experiment is running, the experiment is automatically stopped. You can define a stop condition as a CloudWatch alarm.

        For more information, see [experiment templates](https://docs.aws.amazon.com/fis/latest/userguide/experiment-templates.html) in the *Fault Injection Service User Guide*.
