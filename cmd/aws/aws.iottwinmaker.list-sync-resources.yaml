name: list-sync-resources
description: Lists the sync resources.
flags:
    --filters=: A list of objects that filter the request.
    --max-results=: The maximum number of results to return at one time.
    --next-token=: The string that specifies the next page of results.
    --sync-source=!: The sync source.
    --workspace-id=!: The ID of the workspace that contains the sync job.
documentation:
    command: Lists the sync resources.
    flag:
        filters: |-
            A list of objects that filter the request.

            The following filter combinations are supported:

            - Filter with state
            - Filter with ResourceType and ResourceId
            - Filter with ResourceType and ExternalId
        max-results: |-
            The maximum number of results to return at one time. The default is 50.

            Valid Range: Minimum value of 0. Maximum value of 200.
        next-token: The string that specifies the next page of results.
        sync-source: |-
            The sync source.

            Currently the only supported syncSource is `SITEWISE`.
        workspace-id: The ID of the workspace that contains the sync job.
