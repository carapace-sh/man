name: reset
description: Reset the policy to the default for the constraint.
flags:
    --folder=: Folder ID.
    --organization=: Organization ID.
    --update-mask=: Field mask used to specify the fields to be overwritten in the policy by the set.
documentation:
    command: |
        Resets the policy to the default for the constraint.
    flag:
        folder: Folder ID.
        organization: Organization ID.
        update-mask: Field mask used to specify the fields to be overwritten in the policy by the set. The fields specified in the update_mask are relative to the policy, not the full request. The update-mask flag can be empty, or have values `policy.spec`, `policy.dry_run_spec` or `*`. If the policy does not contain the dry_run_spec and update-mask flag is not provided, then it defaults to `policy.spec`.
