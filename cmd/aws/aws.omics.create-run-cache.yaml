name: create-run-cache
description: Creates a run cache to store and reference task outputs from completed private runs.
flags:
    --cache-behavior=: Default cache behavior for runs that use this cache.
    --cache-bucket-owner-id=: The Amazon Web Services account ID of the expected owner of the S3 bucket for the run cache.
    --cache-s3-location=!: Specify the S3 location for storing the cached task outputs.
    --description=: Enter a description of the run cache.
    --name=: Enter a user-friendly name for the run cache.
    --request-id=!: A unique request token, to ensure idempotency.
    --tags=: Specify one or more tags to associate with this run cache.
completion:
    flag:
        cache-behavior:
            - CACHE_ON_FAILURE
            - CACHE_ALWAYS
documentation:
    command: |-
        Creates a run cache to store and reference task outputs from completed private runs. Specify an Amazon S3 location where Amazon Web Services HealthOmics saves the cached data. This data must be immediately accessible and not in an archived state. You can save intermediate task files to a run cache if they are declared as task outputs in the workflow definition file.

        For more information, see [Call caching](https://docs.aws.amazon.com/omics/latest/dev/workflows-call-caching.html) and [Creating a run cache](https://docs.aws.amazon.com/omics/latest/dev/workflow-cache-create.html) in the *Amazon Web Services HealthOmics User Guide*.
    flag:
        cache-behavior: |-
            Default cache behavior for runs that use this cache. Supported values are:

            `CACHE_ON_FAILURE`: Caches task outputs from completed tasks for runs that fail. This setting is useful if you're debugging a workflow that fails after several tasks completed successfully. The subsequent run uses the cache outputs for previously-completed tasks if the task definition, inputs, and container in ECR are identical to the prior run.

            `CACHE_ALWAYS`: Caches task outputs from completed tasks for all runs. This setting is useful in development mode, but do not use it in a production setting.

            If you don't specify a value, the default behavior is CACHE\_ON\_FAILURE. When you start a run that uses this cache, you can override the default cache behavior.

            For more information, see [Run cache behavior](https://docs.aws.amazon.com/omics/latest/dev/how-run-cache.html#run-cache-behavior) in the *Amazon Web Services HealthOmics User Guide*.
        cache-bucket-owner-id: The Amazon Web Services account ID of the expected owner of the S3 bucket for the run cache. If not provided, your account ID is set as the owner of the bucket.
        cache-s3-location: Specify the S3 location for storing the cached task outputs. This data must be immediately accessible (not in an archived state).
        description: Enter a description of the run cache.
        name: Enter a user-friendly name for the run cache.
        request-id: A unique request token, to ensure idempotency. If you don't specify a token, Amazon Web Services HealthOmics automatically generates a universally unique identifier (UUID) for the request.
        tags: Specify one or more tags to associate with this run cache.
