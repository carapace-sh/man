name: create-response-plan
description: Creates a response plan that automates the initial response to incidents.
flags:
    --actions=: The actions that the response plan starts at the beginning of an incident.
    --chat-channel=: The Chatbot chat channel used for collaboration during an incident.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A token ensuring that the operation is called only once with the specified details.
    --display-name=: The long format of the response plan name.
    --engagements=: The Amazon Resource Name (ARN) for the contacts and escalation plans that the response plan engages during an incident.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --incident-template=!: Details used to create an incident when using this response plan.
    --integrations=: Information about third-party services integrated into the response plan.
    --name=!: The short format name of the response plan.
    --tags=: A list of tags that you are adding to the response plan.
documentation:
    command: Creates a response plan that automates the initial response to incidents. A response plan engages contacts, starts chat channel collaboration, and initiates runbooks at the beginning of an incident.
    flag:
        actions: The actions that the response plan starts at the beginning of an incident.
        chat-channel: The Chatbot chat channel used for collaboration during an incident.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A token ensuring that the operation is called only once with the specified details.
        display-name: The long format of the response plan name. This field can contain spaces.
        engagements: The Amazon Resource Name (ARN) for the contacts and escalation plans that the response plan engages during an incident.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        incident-template: Details used to create an incident when using this response plan.
        integrations: Information about third-party services integrated into the response plan.
        name: The short format name of the response plan. Can't include spaces.
        tags: A list of tags that you are adding to the response plan.
