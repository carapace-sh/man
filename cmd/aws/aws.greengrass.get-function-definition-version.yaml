name: get-function-definition-version
description: Retrieves information about a Lambda function definition version, including which Lambda functions are included in the version and their configurations.
flags:
    --function-definition-id=!: The ID of the Lambda function definition.
    --function-definition-version-id=!: The ID of the function definition version.
    --next-token=: The token for the next set of results, or ''null'' if there are no additional results.
documentation:
    command: Retrieves information about a Lambda function definition version, including which Lambda functions are included in the version and their configurations.
    flag:
        function-definition-id: The ID of the Lambda function definition.
        function-definition-version-id: The ID of the function definition version. This value maps to the ''Version'' property of the corresponding ''VersionInformation'' object, which is returned by ''ListFunctionDefinitionVersions'' requests. If the version is the last one that was associated with a function definition, the value also maps to the ''LatestVersion'' property of the corresponding ''DefinitionInformation'' object.
        next-token: The token for the next set of results, or ''null'' if there are no additional results.
