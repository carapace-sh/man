name: create
description: '*(ALPHA)*  Create a multicast group definition.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --consumer-accept-list=: An optional list of consumer projects that can use this multicast group definition.
    --description=: The description for the multicast group definition.
    --enable-logging: Whether to enable logging for this multicast group definition.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location Id.
    --multicast-domain=!: The multicast domain to be used.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-enable-logging&: Whether to enable logging for this multicast group definition.
    --no-require-explicit-accept&: Whether an empty consumer accept list will reject all consumer projects.
    --require-explicit-accept: Whether an empty consumer accept list will reject all consumer projects.
    --reserved-internal-range=!: The reserved internal range to be used.
documentation:
    command: |
        *(ALPHA)*  Create a multicast group definition in the specified location of the current project.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        consumer-accept-list: An optional list of consumer projects that can use this multicast group definition.
        description: The description for the multicast group definition.
        enable-logging: Whether to enable logging for this multicast group definition. Use *--enable-logging* to enable and *--no-enable-logging* to disable.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location Id.
            +
            To set the `location` attribute:
            * provide the argument `multicast_group_definition` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        multicast-domain: The multicast domain to be used.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-enable-logging: Whether to enable logging for this multicast group definition.
        no-require-explicit-accept: Whether an empty consumer accept list will reject all consumer projects.
        require-explicit-accept: Whether an empty consumer accept list will reject all consumer projects.
        reserved-internal-range: The reserved internal range to be used.
