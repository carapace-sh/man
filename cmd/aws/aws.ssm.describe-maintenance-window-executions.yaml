name: describe-maintenance-window-executions
description: Lists the executions of a maintenance window.
flags:
    --filters=: 'Each entry in the array is a structure containing:'
    --max-results=: The maximum number of items to return for this call.
    --next-token=: The token for the next set of items to return.
    --window-id=!: The ID of the maintenance window whose executions should be retrieved.
documentation:
    command: Lists the executions of a maintenance window. This includes information about when the maintenance window was scheduled to be active, and information about tasks registered and run with the maintenance window.
    flag:
        filters: |-
            Each entry in the array is a structure containing:

            - Key. A string between 1 and 128 characters. Supported keys include `ExecutedBefore` and `ExecutedAfter`.
            - Values. An array of strings, each between 1 and 256 characters. Supported values are date/time strings in a valid ISO 8601 date/time format, such as `2024-11-04T05:00:00Z`.
        max-results: The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
        window-id: The ID of the maintenance window whose executions should be retrieved.
