name: list-jobs
description: Lists current S3 Batch Operations jobs as well as the jobs that have ended within the last 90 days for the Amazon Web Services account making the request.
flags:
    --account-id=!: The Amazon Web Services account ID associated with the S3 Batch Operations job.
    --job-statuses=: The `List Jobs` request returns jobs that match the statuses listed in this element.
    --max-results=: The maximum number of jobs that Amazon S3 will include in the `List Jobs` response.
    --next-token=: A pagination token to request the next page of results.
documentation:
    command: |-
        Lists current S3 Batch Operations jobs as well as the jobs that have ended within the last 90 days for the Amazon Web Services account making the request. For more information, see [S3 Batch Operations](https://docs.aws.amazon.com/AmazonS3/latest/userguide/batch-ops.html) in the *Amazon S3 User Guide*.

        Permissions

        To use the `ListJobs` operation, you must have permission to perform the `s3:ListJobs` action.

        Related actions include:

        - [CreateJob](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_CreateJob.html)
        - [DescribeJob](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_DescribeJob.html)
        - [UpdateJobPriority](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_UpdateJobPriority.html)
        - [UpdateJobStatus](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_UpdateJobStatus.html)

        You must URL encode any signed header values that contain spaces. For example, if your header value is `my file.txt`, containing two spaces after `my`, you must URL encode this value to `my%20%20file.txt`.
    flag:
        account-id: The Amazon Web Services account ID associated with the S3 Batch Operations job.
        job-statuses: The `List Jobs` request returns jobs that match the statuses listed in this element.
        max-results: The maximum number of jobs that Amazon S3 will include in the `List Jobs` response. If there are more jobs than this number, the response will include a pagination token in the `NextToken` field to enable you to retrieve the next page of results.
        next-token: A pagination token to request the next page of results. Use the token that Amazon S3 returned in the `NextToken` element of the `ListJobsResult` from the previous `List Jobs` request.
