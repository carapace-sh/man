            ```
            +
            *File Example:*
            +
            ```
            +
            --spark-application-environment-config-default-properties=path_to_file.(yaml|json)
            +
            ```
        spark-application-environment-config-default-version: |-
            The default Dataproc version to use for applications submitted to this
            application environment
