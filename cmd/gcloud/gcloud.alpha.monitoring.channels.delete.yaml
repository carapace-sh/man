name: delete
description: '*(ALPHA)*  Delete a notification channel.'
flags:
    --force: If true, the notification channel will be deleted regardless of its use in alerting policies (the policies will be updated to remove the channel).
    --no-force&: If true, the notification channel will be deleted regardless of its use in alerting policies (the policies will be updated to remove the channel).
documentation:
    command: |
        *(ALPHA)*  Delete a notification channel.

        ## EXAMPLES
        The following command will delete channel `projects/12345/notificationChannels/67890`, but
        only if the channel is not actively referenced by existing alerting policies:

          $ gcloud alpha monitoring channels delete "projects/12345/notificationChannels/67890"

        The following command will delete channel `projects/12345/notificationChannels/67890`, even
        if the channel is still actively referenced by alerting policies; if an existing policy
        references the channel, it will be modified as a side-effect to remove the channel.

          $ gcloud alpha monitoring channels delete "projects/12345/notificationChannels/67890" --force
    flag:
        force: If true, the notification channel will be deleted regardless of its use in alerting policies (the policies will be updated to remove the channel).
        no-force: If true, the notification channel will be deleted regardless of its use in alerting policies (the policies will be updated to remove the channel).
