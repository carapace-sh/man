name: update-parameter-group
description: Updates the parameters of a parameter group.
flags:
    --parameter-group-name=!: The name of the parameter group to update.
    --parameter-name-values=!: An array of parameter names and values for the parameter update.
documentation:
    command: Updates the parameters of a parameter group. You can modify up to 20 parameters in a single request by submitting a list parameter name and value pairs.
    flag:
        parameter-group-name: The name of the parameter group to update.
        parameter-name-values: An array of parameter names and values for the parameter update. You must supply at least one parameter name and value; subsequent arguments are optional. A maximum of 20 parameters may be updated per request.
