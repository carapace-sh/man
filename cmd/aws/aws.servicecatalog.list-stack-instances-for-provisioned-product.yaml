name: list-stack-instances-for-provisioned-product
description: Returns summary information about stack instances that are associated with the specified `CFN_STACKSET` type provisioned product.
flags:
    --accept-language=: The language code.
    --page-size=: The maximum number of items to return with this call.
    --page-token=: The page token for the next set of results.
    --provisioned-product-id=!: The identifier of the provisioned product.
documentation:
    command: Returns summary information about stack instances that are associated with the specified `CFN_STACKSET` type provisioned product. You can filter for stack instances that are associated with a specific Amazon Web Services account name or Region.
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        page-size: The maximum number of items to return with this call.
        page-token: The page token for the next set of results. To retrieve the first set of results, use null.
        provisioned-product-id: The identifier of the provisioned product.
