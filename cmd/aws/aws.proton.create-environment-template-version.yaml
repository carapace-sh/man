name: create-environment-template-version
description: Create a new major or minor version of an environment template.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: When included, if two identical requests are made with the same client token, Proton returns the environment template version that the first request created.
    --description=: A description of the new version of an environment template.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --major-version=: To create a new minor version of the environment template, include `major Version`.
    --source=!: An object that includes the template bundle S3 bucket path and name for the new version of an template.
    --tags=: An optional list of metadata items that you can associate with the Proton environment template version.
    --template-name=!: The name of the environment template.
documentation:
    command: Create a new major or minor version of an environment template. A major version of an environment template is a version that *isn't* backwards compatible. A minor version of an environment template is a version that's backwards compatible within its major version.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: When included, if two identical requests are made with the same client token, Proton returns the environment template version that the first request created.
        description: A description of the new version of an environment template.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        major-version: |-
            To create a new minor version of the environment template, include `major Version`.

            To create a new major and minor version of the environment template, exclude `major Version`.
        source: An object that includes the template bundle S3 bucket path and name for the new version of an template.
        tags: |-
            An optional list of metadata items that you can associate with the Proton environment template version. A tag is a key-value pair.

            For more information, see [Proton resources and tagging](https://docs.aws.amazon.com/proton/latest/userguide/resources.html) in the *Proton User Guide*.
        template-name: The name of the environment template.
