name: start-device-authorization
description: Initiates device authorization by requesting a pair of verification codes from the authorization service.
flags:
    --client-id=!: The unique identifier string for the client that is registered with IAM Identity Center.
    --client-secret=!: A secret string that is generated for the client.
    --start-url=!: The URL for the Amazon Web Services access portal.
documentation:
    command: Initiates device authorization by requesting a pair of verification codes from the authorization service.
    flag:
        client-id: The unique identifier string for the client that is registered with IAM Identity Center. This value should come from the persisted result of the [RegisterClient]() API operation.
        client-secret: A secret string that is generated for the client. This value should come from the persisted result of the [RegisterClient]() API operation.
        start-url: The URL for the Amazon Web Services access portal. For more information, see [Using the Amazon Web Services access portal](https://docs.aws.amazon.com/singlesignon/latest/userguide/using-the-portal.html) in the *IAM Identity Center User Guide*.
