name: list-policies
description: Returns an array of `PolicySummary` objects.
flags:
    --max-results=: Specifies the number of `PolicySummary` objects that you want Firewall Manager to return for this request.
    --next-token=: If you specify a value for `MaxResults` and you have more `PolicySummary` objects than the number that you specify for `MaxResults`, Firewall Manager returns a `NextToken` value in the response that allows you to list another group of `PolicySummary` objects.
documentation:
    command: Returns an array of `PolicySummary` objects.
    flag:
        max-results: Specifies the number of `PolicySummary` objects that you want Firewall Manager to return for this request. If you have more `PolicySummary` objects than the number that you specify for `MaxResults`, the response includes a `NextToken` value that you can use to get another batch of `PolicySummary` objects.
        next-token: If you specify a value for `MaxResults` and you have more `PolicySummary` objects than the number that you specify for `MaxResults`, Firewall Manager returns a `NextToken` value in the response that allows you to list another group of `PolicySummary` objects. For the second and subsequent `ListPolicies` requests, specify the value of `NextToken` from the previous response to get information about another batch of `PolicySummary` objects.
