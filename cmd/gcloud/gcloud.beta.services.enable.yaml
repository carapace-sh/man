name: enable
description: '*(BETA)*  Enables a service for consumption for a project, folder or organization.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --folder=: The Google Cloud Platform folder ID to use for this invocation.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-skip-dependency&: If set, the dependencies of the service to be enabled will not be enabled.
    --no-validate-only&: Validate the enable action, but don't actually perform it
    --organization=: The Google Cloud Platform organization ID to use for this invocation.
    --skip-dependency: If set, the dependencies of the service to be enabled will not be enabled.
    --validate-only: Validate the enable action, but don't actually perform it
documentation:
    command: |4
           *(BETA)*  This command enables a service for consumption for a project, folder or organization.

           To see a list of available services for a project, run:

             $ gcloud beta services list --available

        More information on listing services can be found at:
        https://cloud.google.com/service-usage/docs/list-services and on
        disabling a service at:
        https://cloud.google.com/service-usage/docs/enable-disable
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        folder: The Google Cloud Platform folder ID to use for this invocation.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-skip-dependency: If set, the dependencies of the service to be enabled will not be enabled.
        no-validate-only: Validate the enable action, but don't actually perform it
        organization: The Google Cloud Platform organization ID to use for this invocation.
        skip-dependency: If set, the dependencies of the service to be enabled will not be enabled.
        validate-only: Validate the enable action, but don't actually perform it
