name: cancel-spot-fleet-requests
description: Cancels the specified Spot Fleet requests.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-terminate-instances!: Indicates whether to terminate the associated instances when the Spot Fleet request is canceled.
    --spot-fleet-request-ids=!: The IDs of the Spot Fleet requests.
    --terminate-instances!: Indicates whether to terminate the associated instances when the Spot Fleet request is canceled.
documentation:
    command: |-
        Cancels the specified Spot Fleet requests.

        After you cancel a Spot Fleet request, the Spot Fleet launches no new instances.

        You must also specify whether a canceled Spot Fleet request should terminate its instances. If you choose to terminate the instances, the Spot Fleet request enters the `cancelled_terminating` state. Otherwise, the Spot Fleet request enters the `cancelled_running` state and the instances continue to run until they are interrupted or you terminate them manually.

        **Restrictions**

        - You can delete up to 100 fleets in a single request. If you exceed the specified number, no fleets are deleted.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        spot-fleet-request-ids: |-
            The IDs of the Spot Fleet requests.

            Constraint: You can specify up to 100 IDs in a single request.
        terminate-instances: |-
            Indicates whether to terminate the associated instances when the Spot Fleet request is canceled. The default is to terminate the instances.

            To let the instances continue to run after the Spot Fleet request is canceled, specify `no-terminate-instances`.
