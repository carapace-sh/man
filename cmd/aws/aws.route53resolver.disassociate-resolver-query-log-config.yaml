name: disassociate-resolver-query-log-config
description: Disassociates a VPC from a query logging configuration.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --resolver-query-log-config-id=!: The ID of the query logging configuration that you want to disassociate a specified VPC from.
    --resource-id=!: The ID of the Amazon VPC that you want to disassociate from a specified query logging configuration.
documentation:
    command: |-
        Disassociates a VPC from a query logging configuration.

        Before you can delete a query logging configuration, you must first disassociate all VPCs from the configuration. If you used Resource Access Manager (RAM) to share a query logging configuration with other accounts, VPCs can be disassociated from the configuration in the following ways:

        - The accounts that you shared the configuration with can disassociate VPCs from the configuration.
        - You can stop sharing the configuration.
