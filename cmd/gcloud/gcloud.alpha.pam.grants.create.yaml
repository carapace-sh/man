name: create
description: '*(ALPHA)*  Create a new Privileged Access Manager (PAM) grant.'
flags:
    --additional-email-recipients=: Additional email addresses that are notified for all actions performed on the grant.
    --entitlement=!: ID of the entitlement or fully qualified identifier for the entitlement.
    --folder=: The name of the folder
    --justification=: Justification for the grant.
    --location=: The resource location
    --organization=: The name of the organization
    --requested-access-from-file=: Path to a YAML file defining the fine-grained scope for the grant.
    --requested-duration=!: Duration of the grant being created.
    --requested-resources=: The Google Cloud resources to be granted access to.
documentation:
    command: '*(ALPHA)*  Create a new Privileged Access Manager (PAM) grant under an entitlement.'
    flag:
        additional-email-recipients: Additional email addresses that are notified for all actions performed on the grant.
        entitlement: |-
            ID of the entitlement or fully qualified identifier for the entitlement.
            +
            To set the `entitlement` attribute:
            * provide the argument `--entitlement` on the command line.
        folder: |-
            The name of the folder
            +
            To set the `folder` attribute:
            * provide the argument `--entitlement` on the command line with a fully specified name;
            * provide the argument `--folder` on the command line. Must be specified for resource of type [privilegedaccessmanager.folders.locations.entitlements].
        justification: Justification for the grant.
        location: |-
            The resource location
            +
            To set the `location` attribute:
            * provide the argument `--entitlement` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        organization: |-
            The name of the organization
            +
            To set the `organization` attribute:
            * provide the argument `--entitlement` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line. Must be specified for resource of type [privilegedaccessmanager.organizations.locations.entitlements].
        requested-access-from-file: Path to a YAML file defining the fine-grained scope for the grant.
        requested-duration: Duration of the grant being created.
        requested-resources: |-
            The Google Cloud resources to be granted access to.
            Format: `{resource-type}/{resource_id}`.
            Example: `projects/{project_id}` or `folders/{folder_id}` or
            `organizations/{organization_id}`.
            This command currently accepts only one resource.
