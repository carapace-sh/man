name: describe-direct-connect-gateway-associations
description: Lists the associations between your Direct Connect gateways and virtual private gateways and transit gateways.
flags:
    --associated-gateway-id=: The ID of the associated gateway.
    --association-id=: The ID of the Direct Connect gateway association.
    --direct-connect-gateway-id=: The ID of the Direct Connect gateway.
    --max-results=: The maximum number of results to return with a single call.
    --next-token=: The token provided in the previous call to retrieve the next page.
    --virtual-gateway-id=: The ID of the virtual private gateway or transit gateway.
documentation:
    command: "Lists the associations between your Direct Connect gateways and virtual private gateways and transit gateways. You must specify one of the following:\n\n- A Direct Connect gateway\n  \n  The response contains all virtual private gateways and transit gateways associated with the Direct Connect gateway.\n- A virtual private gateway\n  \n  The response contains the Direct Connect gateway.\n- A transit gateway\n  \n  The response contains the Direct Connect gateway.\n- A Direct Connect gateway and a virtual private gateway\n  \n  The response contains the association between the Direct Connect gateway and virtual private gateway.\n- A Direct Connect gateway and a transit gateway\n  \n  The response contains the association between the Direct Connect gateway and transit gateway.\n- A Direct Connect gateway and a virtual private gateway\n  \n  The response contains the association between the Direct Connect gateway and virtual private gateway.\n- A Direct Connect gateway association to a Cloud WAN core network\n  \n  The response contains the Cloud WAN core network ID that the Direct Connect gateway is associated to."
    flag:
        associated-gateway-id: The ID of the associated gateway.
        association-id: The ID of the Direct Connect gateway association.
        direct-connect-gateway-id: The ID of the Direct Connect gateway.
        max-results: |-
            The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned `nextToken` value.

            If `MaxResults` is given a value larger than 100, only 100 results are returned.
        next-token: The token provided in the previous call to retrieve the next page.
        virtual-gateway-id: The ID of the virtual private gateway or transit gateway.
