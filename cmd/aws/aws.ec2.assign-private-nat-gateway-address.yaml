name: assign-private-nat-gateway-address
description: Assigns private IPv4 addresses to a private NAT gateway.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --nat-gateway-id=!: The ID of the NAT gateway.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --private-ip-address-count=: The number of private IP addresses to assign to the NAT gateway.
    --private-ip-addresses=: The private IPv4 addresses you want to assign to the private NAT gateway.
documentation:
    command: Assigns private IPv4 addresses to a private NAT gateway. For more information, see [Work with NAT gateways](https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-working-with.html) in the *Amazon VPC User Guide*.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        nat-gateway-id: The ID of the NAT gateway.
        private-ip-address-count: The number of private IP addresses to assign to the NAT gateway. You can't specify this parameter when also specifying private IP addresses.
        private-ip-addresses: The private IPv4 addresses you want to assign to the private NAT gateway.
