name: set-iam-policy
description: '*(ALPHA)*  Set the IAM policy for a Cloud Spanner backup.'
flags:
    --instance=: The name of the Cloud Spanner instance.
documentation:
    command: |
        *(ALPHA)*  Set the IAM policy for a Cloud Spanner backup given a backup ID and
        a file encoded in JSON or YAML that contains the IAM policy.
    flag:
        instance: |-
            The name of the Cloud Spanner instance.
            +

            To set the `instance` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line;
            * set the property `spanner/instance`.
