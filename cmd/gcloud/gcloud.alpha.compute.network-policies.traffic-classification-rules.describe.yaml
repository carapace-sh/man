name: describe
description: '*(ALPHA)*  Describes a Compute Engine network policy rule.'
flags:
    --network-policy-region=: Region of the network policy to describe.
    --network-policy=!: Network policy ID with which to describe rule.
    --priority=!: Priority of the rule to be described.
documentation:
    command: '*(ALPHA)*  *gcloud alpha compute network-policies traffic-classification-rules describe* is used to describe network policy rules.'
    flag:
        network-policy: Network policy ID with which to describe rule.
        network-policy-region: Region of the network policy to describe. Overrides the default *compute/region* property value for this command invocation.
        priority: Priority of the rule to be described. Valid in [1, 2147483647].
