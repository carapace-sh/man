name: list-custom-domain-associations
description: Lists custom domain associations for Amazon Redshift Serverless.
flags:
    --custom-domain-certificate-arn=: The custom domain name’s certificate Amazon resource name (ARN).
    --custom-domain-name=: The custom domain name associated with the workgroup.
    --max-results=: An optional parameter that specifies the maximum number of results to return.
    --next-token=: When `nextToken` is returned, there are more results available.
documentation:
    command: Lists custom domain associations for Amazon Redshift Serverless.
    flag:
        custom-domain-certificate-arn: The custom domain name’s certificate Amazon resource name (ARN).
        custom-domain-name: The custom domain name associated with the workgroup.
        max-results: An optional parameter that specifies the maximum number of results to return. You can use `nextToken` to display the next page of results.
        next-token: When `nextToken` is returned, there are more results available. The value of `nextToken` is a unique pagination token for each page. Make the call again using the returned token to retrieve the next page.
