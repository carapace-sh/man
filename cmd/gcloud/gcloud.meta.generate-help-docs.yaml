name: generate-help-docs
description: Generate and/or update help document directories.
hidden: true
flags:
    --devsite-dir=: The directory where the generated DevSite reference document subtree will be written.
    --help-text-dir=: The directory where the generated help text reference document subtree will be written.
    --hidden: Include documents for hidden commands and groups.
    --html-dir=: The directory where the standalone manpage HTML files will be generated.
    --linter-dir=: The directory where the generated documentation linter errors for the help text reference document subtree will be written.
    --manpage-dir=: The directory where the generated manpage document subtree will be written.
    --no-hidden&: Include documents for hidden commands and groups.
    --no-test&: Show but do not apply --update actions.
    --no-update&: Update destination directories to match the current CLI.
    --test: Show but do not apply --update actions.
    --update: Update destination directories to match the current CLI.
    --update-help-text-dir=&: Deprecated.
documentation:
    command: |-
        The DevSite docs are generated in the --devsite-dir directory with pathnames
        in the reference directory hierarchy. The manpage docs are generated in the
        --manpage-dir directory with pathnames in the manN/ directory hierarchy.
    flag:
        devsite-dir: The directory where the generated DevSite reference document subtree will be written. If not specified then DevSite documents will not be generated.
        help-text-dir: The directory where the generated help text reference document subtree will be written. If not specified then help text documents will not be generated. The --hidden flag is implied for --help-text-dir.
        hidden: Include documents for hidden commands and groups.
        html-dir: The directory where the standalone manpage HTML files will be generated. index.html contains manpage tree navigation in the left pane. The active command branch and its immediate children are visible and clickable. Hover to navigate the tree. Run `python -m http.server 8888 &` in DIRECTORY and point your browser at [](http://localhost:8888) to view the manpage tree. If not specified then the HTML manpage site will not be generated.
        linter-dir: The directory where the generated documentation linter errors for the help text reference document subtree will be written. If not specified then documentation linter documents will not be generated.
        manpage-dir: The directory where the generated manpage document subtree will be written. The manpage hierarchy is flat with all command documents in the manN/ subdirectory. If not specified then manpage documents will not be generated.
        no-hidden: Include documents for hidden commands and groups.
        no-test: Show but do not apply --update actions. Exit with non-zero exit status if any help document file must be updated.
        no-update: Update destination directories to match the current CLI. Documents for commands not present in the current CLI will be deleted. Use this flag to update the help text golden files after the help_text_test test fails.
        test: Show but do not apply --update actions. Exit with non-zero exit status if any help document file must be updated.
        update: Update destination directories to match the current CLI. Documents for commands not present in the current CLI will be deleted. Use this flag to update the help text golden files after the help_text_test test fails.
        update-help-text-dir: Deprecated. Use --update --help-text-dir=DIRECTORY instead.
