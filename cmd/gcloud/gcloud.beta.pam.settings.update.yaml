name: update
description: '*(BETA)*  Update Privileged Access Manager (PAM) settings configured on a project, folder, or organization.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --folder=: The name of the folder
    --location=!: ID of the location or fully qualified identifier for the location.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --organization=: The name of the organization
    --settings-file=!: YAML file containing the new configuration of the PAM settings.
documentation:
    command: |
        *(BETA)*  Update the Privileged Access Manager (PAM) settings configured for a specified project,
        folder, or organization. This command allows you to modify the settings using a YAML file.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        folder: |-
            The name of the folder
            +
            To set the `folder` attribute:
            * provide the argument `--location` on the command line with a fully specified name;
            * provide the argument `--folder` on the command line. Must be specified for resource of type [privilegedaccessmanager.folders.locations].
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        organization: |-
            The name of the organization
            +
            To set the `organization` attribute:
            * provide the argument `--location` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line. Must be specified for resource of type [privilegedaccessmanager.organizations.locations].
        settings-file: YAML file containing the new configuration of the PAM settings. Use a full or relative path to a local file containing the value of settings_file.
