name: create-anomaly-detector
description: Creates an anomaly detector within a workspace using the Random Cut Forest algorithm for time-series analysis.
flags:
    --alias=!: A user-friendly name for the anomaly detector.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --configuration=!: The algorithm configuration for the anomaly detector.
    --evaluation-interval-in-seconds=: The frequency, in seconds, at which the anomaly detector evaluates metrics.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --labels=: The Amazon Managed Service for Prometheus metric labels to associate with the anomaly detector.
    --missing-data-action=: Specifies the action to take when data is missing during evaluation.
    --tags=: The metadata to apply to the anomaly detector to assist with categorization and organization.
    --workspace-id=!: The identifier of the workspace where the anomaly detector will be created.
documentation:
    command: Creates an anomaly detector within a workspace using the Random Cut Forest algorithm for time-series analysis. The anomaly detector analyzes Amazon Managed Service for Prometheus metrics to identify unusual patterns and behaviors.
    flag:
        alias: A user-friendly name for the anomaly detector.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        configuration: The algorithm configuration for the anomaly detector.
        evaluation-interval-in-seconds: The frequency, in seconds, at which the anomaly detector evaluates metrics. The default value is 60 seconds.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        labels: The Amazon Managed Service for Prometheus metric labels to associate with the anomaly detector.
