name: create
description: '*(ALPHA)*  Create a multicast group producer activation.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: The description for the multicast group producer activation.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location Id.
    --multicast-group-range-activation=: The multicast group range activation to be used.
    --multicast-group=: The multicast group to be used.
    --multicast-producer-association=!: The multicast producer association to be used.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(ALPHA)*  Create a multicast group producer activation in the specified location of the current project.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: The description for the multicast group producer activation.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location Id.
            +
            To set the `location` attribute:
            * provide the argument `multicast_group_producer_activation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        multicast-group: The multicast group to be used.
        multicast-group-range-activation: The multicast group range activation to be used.
        multicast-producer-association: The multicast producer association to be used.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
