name: describe
description: '*(ALPHA)*  Display detailed information about a health check.'
flags:
    --global: If set, the  health check is global.
    --no-global&: If set, the  health check is global.
    --region=: Region of the  health check to describe.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute health-checks describe* displays all data associated with a Google Compute
        Engine health check in a project.
    flag:
        global: If set, the  health check is global.
        no-global: If set, the  health check is global.
        region: |-
            Region of the  health check to describe. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
