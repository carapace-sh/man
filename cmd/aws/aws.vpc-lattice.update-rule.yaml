name: update-rule
description: Updates a specified rule for the listener.
flags:
    --action=: Information about the action for the specified listener rule.
    --listener-identifier=!: The ID or ARN of the listener.
    --match=: The rule match.
    --priority=: The rule priority.
    --rule-identifier=!: The ID or ARN of the rule.
    --service-identifier=!: The ID or ARN of the service.
documentation:
    command: Updates a specified rule for the listener. You can't modify a default listener rule. To modify a default listener rule, use `UpdateListener`.
    flag:
        action: Information about the action for the specified listener rule.
        listener-identifier: The ID or ARN of the listener.
        match: The rule match.
        priority: The rule priority. A listener can't have multiple rules with the same priority.
        rule-identifier: The ID or ARN of the rule.
        service-identifier: The ID or ARN of the service.
