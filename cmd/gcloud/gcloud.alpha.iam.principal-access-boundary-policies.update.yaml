documentation:
    command: |
        *(ALPHA)*  Update PrincipalAccessBoundaryPolicy instance.
    flag:
        add-details-rules: |-
            Add new value to details_rules list. A list of principal access boundary policy rules. The number of rules in a
            policy is limited to 500.
            +
            *description*:::
            The description of the principal access boundary policy rule. Must be less
            than or equal to 256 characters.
            +
            *effect*:::
            The access relationship of principals to the resources in this rule.
            +
            *resources*:::
            A list of Resource Manager resources. If a resource is listed in the rule,
            then the rule applies for that resource and its descendants. The number of
            resources in a policy is limited to 500 across all rules in the policy.
            +
            The following resource types are supported:
            +
            * Organizations, such as
            `//cloudresourcemanager.googleapis.com/organizations/123`.
            * Folders, such as `//cloudresourcemanager.googleapis.com/folders/123`.
            * Projects, such as `//cloudresourcemanager.googleapis.com/projects/123`
              or `//cloudresourcemanager.googleapis.com/projects/my-project-id`.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --add-details-rules=description=string,effect=string,resources=[string] --add-details-rules=description=string,effect=string,resources=[string]
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --add-details-rules='[{"description": "string", "effect": "string", "resources": ["string"]}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --add-details-rules=path_to_file.(yaml|json)
            +
            ```
        annotations: |-
