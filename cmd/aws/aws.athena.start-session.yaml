name: start-session
description: Creates a session for running calculations within a workgroup.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=: A unique case-sensitive string used to ensure the request to create the session is idempotent (executes only once).
    --copy-work-group-tags: Copies the tags from the Workgroup to the Session when.
    --description=: The session description.
    --engine-configuration=!: Contains engine data processing unit (DPU) configuration settings and parameter mappings.
    --execution-role=: The ARN of the execution role used to access user resources for Spark sessions and Identity Center enabled workgroups.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --monitoring-configuration=: Contains the configuration settings for managed log persistence, delivering logs to Amazon S3 buckets, Amazon CloudWatch log groups etc.
    --no-copy-work-group-tags: Copies the tags from the Workgroup to the Session when.
    --notebook-version=: The notebook version.
    --session-idle-timeout-in-minutes=: The idle timeout in minutes for the session.
    --tags=: A list of comma separated tags to add to the session that is created.
    --work-group=!: The workgroup to which the session belongs.
documentation:
    command: Creates a session for running calculations within a workgroup. The session is ready when it reaches an `IDLE` state.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: |-
            A unique case-sensitive string used to ensure the request to create the session is idempotent (executes only once). If another `StartSessionRequest` is received, the same response is returned and another session is not created. If a parameter has changed, an error is returned.

            This token is listed as not required because Amazon Web Services SDKs (for example the Amazon Web Services SDK for Java) auto-generate the token for users. If you are not using the Amazon Web Services SDK or the Amazon Web Services CLI, you must provide this token or the action will fail.
        copy-work-group-tags: Copies the tags from the Workgroup to the Session when.
        description: The session description.
        engine-configuration: Contains engine data processing unit (DPU) configuration settings and parameter mappings.
        execution-role: The ARN of the execution role used to access user resources for Spark sessions and Identity Center enabled workgroups. This property applies only to Spark enabled workgroups and Identity Center enabled workgroups.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        monitoring-configuration: Contains the configuration settings for managed log persistence, delivering logs to Amazon S3 buckets, Amazon CloudWatch log groups etc.
        notebook-version: The notebook version. This value is supplied automatically for notebook sessions in the Athena console and is not required for programmatic session access. The only valid notebook version is `Athena notebook version 1`. If you specify a value for `NotebookVersion`, you must also specify a value for `NotebookId`. See [EngineConfiguration$AdditionalConfigs]().
        session-idle-timeout-in-minutes: The idle timeout in minutes for the session.
        tags: A list of comma separated tags to add to the session that is created.
        work-group: The workgroup to which the session belongs.
