name: create-device
description: Creates a new device in a global network.
flags:
    --aws-location=: The Amazon Web Services location of the device, if applicable.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description of the device.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --global-network-id=!: The ID of the global network.
    --location=: The location of the device.
    --model=: The model of the device.
    --serial-number=: The serial number of the device.
    --site-id=: The ID of the site.
    --tags=: The tags to apply to the resource during creation.
    --type=: The type of the device.
    --vendor=: The vendor of the device.
documentation:
    command: Creates a new device in a global network. If you specify both a site ID and a location, the location of the site is used for visualization in the Network Manager console.
    flag:
        aws-location: The Amazon Web Services location of the device, if applicable. For an on-premises device, you can omit this parameter.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: |-
            A description of the device.

            Constraints: Maximum length of 256 characters.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        global-network-id: The ID of the global network.
        location: The location of the device.
        model: |-
            The model of the device.

            Constraints: Maximum length of 128 characters.
        serial-number: |-
            The serial number of the device.

            Constraints: Maximum length of 128 characters.
        site-id: The ID of the site.
        tags: The tags to apply to the resource during creation.
        type: The type of the device.
        vendor: |-
            The vendor of the device.

            Constraints: Maximum length of 128 characters.
