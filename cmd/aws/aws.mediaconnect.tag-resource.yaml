name: tag-resource
description: Associates the specified tags to a resource with the specified `resourceArn`.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) that identifies the MediaConnect resource to which to add tags.
    --tags=!: A map from tag keys to values.
documentation:
    command: Associates the specified tags to a resource with the specified `resourceArn`. If existing tags on a resource are not specified in the request parameters, they are not changed. When a resource is deleted, the tags associated with that resource are deleted as well.
    flag:
        resource-arn: The Amazon Resource Name (ARN) that identifies the MediaConnect resource to which to add tags.
        tags: A map from tag keys to values. Tag keys can have a maximum character length of 128 characters, and tag values can have a maximum length of 256 characters.
