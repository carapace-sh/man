name: create-store-image-task
description: Stores an AMI as a single object in an Amazon S3 bucket.
flags:
    --bucket=!: The name of the Amazon S3 bucket in which the AMI object will be stored.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --image-id=!: The ID of the AMI.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --s3-object-tags=: The tags to apply to the AMI object that will be stored in the Amazon S3 bucket.
documentation:
    command: |-
        Stores an AMI as a single object in an Amazon S3 bucket.

        To use this API, you must have the required permissions. For more information, see [Permissions for storing and restoring AMIs using S3](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/work-with-ami-store-restore.html#ami-s3-permissions) in the *Amazon EC2 User Guide*.

        For more information, see [Store and restore an AMI using S3](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ami-store-restore.html) in the *Amazon EC2 User Guide*.
    flag:
        bucket: The name of the Amazon S3 bucket in which the AMI object will be stored. The bucket must be in the Region in which the request is being made. The AMI object appears in the bucket only after the upload task has completed.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        image-id: The ID of the AMI.
        s3-object-tags: The tags to apply to the AMI object that will be stored in the Amazon S3 bucket.
