name: modify-availability-zone-group
description: Changes the opt-in status of the specified zone group for your account.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --group-name=!: The name of the Availability Zone group, Local Zone group, or Wavelength Zone group.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --opt-in-status=!: Indicates whether to opt in to the zone group.
completion:
    flag:
        opt-in-status:
            - opted-in
            - not-opted-in
documentation:
    command: Changes the opt-in status of the specified zone group for your account.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        group-name: The name of the Availability Zone group, Local Zone group, or Wavelength Zone group.
        opt-in-status: Indicates whether to opt in to the zone group. The only valid value is `opted-in`. You must contact Amazon Web Services Support to opt out of a Local Zone or Wavelength Zone group.
