name: update-route
description: Updates an existing route for a specified service mesh and virtual router.
flags:
    --client-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --mesh-name=!: The name of the service mesh that the route resides in.
    --mesh-owner=: The Amazon Web Services IAM account ID of the service mesh owner.
    --route-name=!: The name of the route to update.
    --spec=!: The new route specification to apply.
    --virtual-router-name=!: The name of the virtual router that the route is associated with.
documentation:
    command: Updates an existing route for a specified service mesh and virtual router.
    flag:
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request. Up to 36 letters, numbers, hyphens, and underscores are allowed.
        mesh-name: The name of the service mesh that the route resides in.
        mesh-owner: The Amazon Web Services IAM account ID of the service mesh owner. If the account ID is not your own, then it's the ID of the account that shared the mesh with your account. For more information about mesh sharing, see [Working with shared meshes](https://docs.aws.amazon.com/app-mesh/latest/userguide/sharing.html).
        route-name: The name of the route to update.
        spec: The new route specification to apply. This overwrites the existing data.
        virtual-router-name: The name of the virtual router that the route is associated with.
