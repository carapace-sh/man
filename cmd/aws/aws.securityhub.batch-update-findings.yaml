name: batch-update-findings
description: Used by Security Hub customers to update information about their investigation into one or more findings.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --confidence=: The updated value for the finding confidence.
    --criticality=: The updated value for the level of importance assigned to the resources associated with the findings.
    --finding-identifiers=!: The list of findings to update.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --note=: ""
    --related-findings=: A list of findings that are related to the updated findings.
    --severity=: Used to update the finding severity.
    --types=: One or more finding types in the format of namespace/category/classifier that classify a finding.
    --user-defined-fields=: A list of name/value string pairs associated with the finding.
    --verification-state=: Indicates the veracity of a finding.
    --workflow=: Used to update the workflow status of a finding.
completion:
    flag:
        verification-state:
            - UNKNOWN
            - TRUE_POSITIVE
            - FALSE_POSITIVE
            - BENIGN_POSITIVE
documentation:
    command: |-
        Used by Security Hub customers to update information about their investigation into one or more findings. Requested by administrator accounts or member accounts. Administrator accounts can update findings for their account and their member accounts. A member account can update findings only for their own account. Administrator and member accounts can use this operation to update the following fields and objects for one or more findings:

        - `Confidence`
        - `Criticality`
        - `Note`
        - `RelatedFindings`
        - `Severity`
        - `Types`
        - `UserDefinedFields`
        - `VerificationState`
        - `Workflow`

        If you use this operation to update a finding, your updates don’t affect the value for the `UpdatedAt` field of the finding. Also note that it can take several minutes for Security Hub to process your request and update each finding specified in the request.

        You can configure IAM policies to restrict access to fields and field values. For example, you might not want member accounts to be able to suppress findings or change the finding severity. For more information see [Configuring access to BatchUpdateFindings](https://docs.aws.amazon.com/securityhub/latest/userguide/finding-update-batchupdatefindings.html#batchupdatefindings-configure-access) in the *Security Hub User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        confidence: |-
            The updated value for the finding confidence. Confidence is defined as the likelihood that a finding accurately identifies the behavior or issue that it was intended to identify.

            Confidence is scored on a 0-100 basis using a ratio scale, where 0 means zero percent confidence and 100 means 100 percent confidence.
        criticality: |-
            The updated value for the level of importance assigned to the resources associated with the findings.

            A score of 0 means that the underlying resources have no criticality, and a score of 100 is reserved for the most critical resources.
        finding-identifiers: |-
            The list of findings to update. `BatchUpdateFindings` can be used to update up to 100 findings at a time.

            For each finding, the list provides the finding identifier and the ARN of the finding provider.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        note: ""
        related-findings: A list of findings that are related to the updated findings.
        severity: Used to update the finding severity.
        types: |-
            One or more finding types in the format of namespace/category/classifier that classify a finding.

            Valid namespace values are as follows.

            - Software and Configuration Checks
            - TTPs
            - Effects
            - Unusual Behaviors
            - Sensitive Data Identifications
        user-defined-fields: A list of name/value string pairs associated with the finding. These are custom, user-defined fields added to a finding.
        verification-state: |-
            Indicates the veracity of a finding.

            The available values for `VerificationState` are as follows.

            - `UNKNOWN` – The default disposition of a security finding
            - `TRUE_POSITIVE` – The security finding is confirmed
            - `FALSE_POSITIVE` – The security finding was determined to be a false alarm
            - `BENIGN_POSITIVE` – A special case of `TRUE_POSITIVE` where the finding doesn't pose any threat, is expected, or both
        workflow: |-
            Used to update the workflow status of a finding.

            The workflow status indicates the progress of the investigation into the finding.
