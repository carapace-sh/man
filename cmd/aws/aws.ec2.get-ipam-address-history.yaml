name: get-ipam-address-history
description: Retrieve historical information about a CIDR within an IPAM scope.
flags:
    --cidr=!: The CIDR you want the history of.
    --dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --end-time=: The end of the time period for which you are looking for history.
    --ipam-scope-id=!: The ID of the IPAM scope that the CIDR is in.
    --max-results=: The maximum number of historical results you would like returned per page.
    --next-token=: The token for the next page of results.
    --no-dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --start-time=: The start of the time period for which you are looking for history.
    --vpc-id=: The ID of the VPC you want your history records filtered by.
documentation:
    command: Retrieve historical information about a CIDR within an IPAM scope. For more information, see [View the history of IP addresses](https://docs.aws.amazon.com/vpc/latest/ipam/view-history-cidr-ipam.html) in the *Amazon VPC IPAM User Guide*.
    flag:
        cidr: The CIDR you want the history of. The CIDR can be an IPv4 or IPv6 IP address range. If you enter a /16 IPv4 CIDR, you will get records that match it exactly. You will not get records for any subnets within the /16 CIDR.
        dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        end-time: The end of the time period for which you are looking for history. If you omit this option, it will default to the current time.
        ipam-scope-id: The ID of the IPAM scope that the CIDR is in.
        max-results: The maximum number of historical results you would like returned per page. Defaults to 100.
        next-token: The token for the next page of results.
        start-time: The start of the time period for which you are looking for history. If you omit this option, it will default to the value of EndTime.
        vpc-id: The ID of the VPC you want your history records filtered by.
