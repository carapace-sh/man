name: describe
description: '*(BETA)*  Describe a backup channel.'
flags:
    --location=: Google Cloud location.
documentation:
    command: |
        *(BETA)*  Describe a Backup for GKE backup channel.

        ## EXAMPLES

        To describe a backup channel ``my-backup-channel'' in project ``my-project'' in location ``us-central1'', run:

          $ gcloud beta container backup-restore backup-channels describe my-backup-channel --project=my-project --location=us-central1
    flag:
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `backup_channel` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkebackup/location`.
