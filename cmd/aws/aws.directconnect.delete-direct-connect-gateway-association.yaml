name: delete-direct-connect-gateway-association
description: Deletes the association between the specified Direct Connect gateway and virtual private gateway.
flags:
    --association-id=: The ID of the Direct Connect gateway association.
    --direct-connect-gateway-id=: The ID of the Direct Connect gateway.
    --virtual-gateway-id=: The ID of the virtual private gateway.
documentation:
    command: |-
        Deletes the association between the specified Direct Connect gateway and virtual private gateway.

        We recommend that you specify the `associationID` to delete the association. Alternatively, if you own virtual gateway and a Direct Connect gateway association, you can specify the `virtualGatewayId` and `directConnectGatewayId` to delete an association.
    flag:
        association-id: The ID of the Direct Connect gateway association.
        direct-connect-gateway-id: The ID of the Direct Connect gateway.
        virtual-gateway-id: The ID of the virtual private gateway.
