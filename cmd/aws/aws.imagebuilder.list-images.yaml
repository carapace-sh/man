name: list-images
description: Returns the list of images that you have access to.
flags:
    --by-name: Requests a list of images with a specific recipe name.
    --filters=: 'Use the following filters to streamline results:'
    --include-deprecated=: Includes deprecated images in the response list.
    --max-results=: Specify the maximum number of items to return in a request.
    --next-token=: A token to specify where to start paginating.
    --no-by-name&: Requests a list of images with a specific recipe name.
    --owner=: The owner defines which images you want to list.
completion:
    flag:
        owner:
            - Self
            - Shared
            - Amazon
            - ThirdParty
            - AWSMarketplace
documentation:
    command: Returns the list of images that you have access to. Newly created images can take up to two minutes to appear in the ListImages API Results.
    flag:
        by-name: Requests a list of images with a specific recipe name.
        filters: |-
            Use the following filters to streamline results:

            - `name`
            - `osVersion`
            - `platform`
            - `type`
            - `version`
        include-deprecated: Includes deprecated images in the response list.
        max-results: Specify the maximum number of items to return in a request.
        next-token: A token to specify where to start paginating. This is the nextToken from a previously truncated response.
        owner: The owner defines which images you want to list. By default, this request will only show images owned by your account. You can use this field to specify if you want to view images owned by yourself, by Amazon, or those images that have been shared with you by other customers.
