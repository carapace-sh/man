name: list-linux-subscription-instances
description: Lists the running Amazon EC2 instances that were discovered with commercial Linux subscriptions.
flags:
    --filters=: An array of structures that you can use to filter the results by your specified criteria.
    --max-results=: The maximum items to return in a request.
    --next-token=: A token to specify where to start paginating.
documentation:
    command: Lists the running Amazon EC2 instances that were discovered with commercial Linux subscriptions.
    flag:
        filters: |-
            An array of structures that you can use to filter the results by your specified criteria. For example, you can specify `Region` in the `Name`, with the `contains` operator to list all subscriptions that match a partial string in the `Value`, such as `us-west`.

            For each filter, you can specify one of the following values for the `Name` key to streamline results:

            - `AccountID`
            - `AmiID`
            - `DualSubscription`
            - `InstanceID`
            - `InstanceType`
            - `ProductCode`
            - `Region`
            - `Status`
            - `UsageOperation`

            For each filter, you can use one of the following `Operator` values to define the behavior of the filter:

            - `contains`
            - `equals`
            - `Notequal`
        max-results: The maximum items to return in a request.
        next-token: A token to specify where to start paginating. This is the nextToken from a previously truncated response.
