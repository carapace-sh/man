name: list-tags-for-resource
description: Lists all metadata tags attached to an DMS resource, including replication instance, endpoint, subnet group, and migration task.
flags:
    --resource-arn-list=: List of ARNs that identify multiple DMS resources that you want to list tags for.
    --resource-arn=: The Amazon Resource Name (ARN) string that uniquely identifies the DMS resource to list tags for.
documentation:
    command: Lists all metadata tags attached to an DMS resource, including replication instance, endpoint, subnet group, and migration task. For more information, see [`Tag`](https://docs.aws.amazon.com/dms/latest/APIReference/API_Tag.html) data type description.
    flag:
        resource-arn: The Amazon Resource Name (ARN) string that uniquely identifies the DMS resource to list tags for. This returns a list of keys (names of tags) created for the resource and their associated tag values.
        resource-arn-list: List of ARNs that identify multiple DMS resources that you want to list tags for. This returns a list of keys (tag names) and their associated tag values. It also returns each tag's associated `ResourceArn` value, which is the ARN of the resource for which each listed tag is created.
