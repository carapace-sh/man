name: get-system-template-revisions
description: Gets revisions made to the specified system template.
flags:
    --id=!: The ID of the system template.
    --max-results=: The maximum number of results to return in the response.
    --next-token=: The string that specifies the next page of results.
documentation:
    command: Gets revisions made to the specified system template. Only the previous 100 revisions are stored. If the system has been deprecated, this action will return the revisions that occurred before its deprecation. This action won't work with systems that have been deleted.
    flag:
        id: |-
            The ID of the system template.

            The ID should be in the following format.

            `urn:tdm:REGION/ACCOUNT ID/default:system:SYSTEMNAME`
        max-results: The maximum number of results to return in the response.
        next-token: The string that specifies the next page of results. Use this when you're paginating results.
