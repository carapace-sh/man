name: describe
description: '*(ALPHA)*  Describe a long-running operation.'
documentation:
    command: |
        *(ALPHA)*  Describe a long-running operation. You can use
        this to inspect whether a create or update operation was
        successful or the operation returned any errors.

        ## EXAMPLES

        To describe an operation with name simple-operation, run:

          $ gcloud alpha edge-cache operations describe simple-operation
