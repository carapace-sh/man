name: get-channel-schedule
description: Retrieves information about your channel's schedule.
flags:
    --audience=: The single audience for GetChannelScheduleRequest.
    --channel-name=!: The name of the channel associated with this Channel Schedule.
    --duration-minutes=: The duration in minutes of the channel schedule.
    --max-results=: The maximum number of channel schedules that you want MediaTailor to return in response to the current request.
    --next-token=: (Optional) If the playback configuration has more than `MaxResults` channel schedules, use `NextToken` to get the second and subsequent pages of results.
documentation:
    command: Retrieves information about your channel's schedule.
    flag:
        audience: The single audience for GetChannelScheduleRequest.
        channel-name: The name of the channel associated with this Channel Schedule.
        duration-minutes: The duration in minutes of the channel schedule.
        max-results: The maximum number of channel schedules that you want MediaTailor to return in response to the current request. If there are more than `MaxResults` channel schedules, use the value of `NextToken` in the response to get the next page of results.
        next-token: |-
            (Optional) If the playback configuration has more than `MaxResults` channel schedules, use `NextToken` to get the second and subsequent pages of results.

            For the first `GetChannelScheduleRequest` request, omit this value.

            For the second and subsequent requests, get the value of `NextToken` from the previous response and specify that value for `NextToken` in the request.

            If the previous response didn't include a `NextToken` element, there are no more channel schedules to get.
