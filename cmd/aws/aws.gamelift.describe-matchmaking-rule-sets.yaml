name: describe-matchmaking-rule-sets
description: |-
    **This API works with the following fleet types:** EC2, Anywhere, Container

    Retrieves the details for FlexMatch matchmaking rule sets.
flags:
    --limit=: The maximum number of results to return.
    --names=: A list of one or more matchmaking rule set names to retrieve details for.
    --next-token=: A token that indicates the start of the next sequential page of results.
documentation:
    command: |-
        **This API works with the following fleet types:** EC2, Anywhere, Container

        Retrieves the details for FlexMatch matchmaking rule sets. You can request all existing rule sets for the Region, or provide a list of one or more rule set names. When requesting multiple items, use the pagination parameters to retrieve results as a set of sequential pages. If successful, a rule set is returned for each requested name.

        **Learn more**

        - [Build a rule set](https://docs.aws.amazon.com/gamelift/latest/flexmatchguide/match-rulesets.html)
    flag:
        limit: The maximum number of results to return. Use this parameter with `NextToken` to get results as a set of sequential pages.
        names: 'A list of one or more matchmaking rule set names to retrieve details for. (Note: The rule set name is different from the optional "name" field in the rule set body.) You can use either the rule set name or ARN value.'
        next-token: A token that indicates the start of the next sequential page of results. Use the token that is returned with a previous call to this operation. To start at the beginning of the result set, do not specify a value.
