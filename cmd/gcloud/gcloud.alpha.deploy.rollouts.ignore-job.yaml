name: ignore-job
description: '*(ALPHA)*  Ignores a specified job and phase combination on a rollout.'
flags:
    --delivery-pipeline=: The delivery pipeline associated with the rollout.
    --job-id=!: Job ID on a rollout resource
    --override-deploy-policies=: Deploy policies to override
    --phase-id=!: Phase ID on a rollout resource
    --region=: The Cloud region for the rollout.
    --release=: The release associated with the rollout.
documentation:
    command: '*(ALPHA)*  Ignores a specified job and phase combination on a rollout.'
    flag:
        delivery-pipeline: |-
            The delivery pipeline associated with the rollout.  Alternatively, set the property [deploy/delivery-pipeline].
            +
            To set the `delivery-pipeline` attribute:
            * provide the argument `rollout` on the command line with a fully specified name;
            * provide the argument `--delivery-pipeline` on the command line;
            * set the property `deploy/delivery_pipeline`.
        job-id: Job ID on a rollout resource
        override-deploy-policies: Deploy policies to override
        phase-id: Phase ID on a rollout resource
        region: |-
            The Cloud region for the rollout.  Alternatively, set the property [deploy/region].
            +
            To set the `region` attribute:
            * provide the argument `rollout` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `deploy/region`.
        release: |-
            The release associated with the rollout.
            +
            To set the `release` attribute:
            * provide the argument `rollout` on the command line with a fully specified name;
            * provide the argument `--release` on the command line.
