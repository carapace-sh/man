name: modify-data-provider
description: Modifies the specified data provider using the provided settings.
flags:
    --data-provider-identifier=!: The identifier of the data provider.
    --data-provider-name=: The name of the data provider.
    --description=: A user-friendly description of the data provider.
    --engine=: The type of database engine for the data provider.
    --exact-settings=: If this attribute is Y, the current call to `ModifyDataProvider` replaces all existing data provider settings with the exact settings that you specify in this call.
    --settings=: The settings in JSON format for a data provider.
    --virtual=: Indicates whether the data provider is virtual.
documentation:
    command: |-
        Modifies the specified data provider using the provided settings.

        You must remove the data provider from all migration projects before you can modify it.
    flag:
        data-provider-identifier: The identifier of the data provider. Identifiers must begin with a letter and must contain only ASCII letters, digits, and hyphens. They can't end with a hyphen, or contain two consecutive hyphens.
        data-provider-name: The name of the data provider.
        description: A user-friendly description of the data provider.
        engine: The type of database engine for the data provider. Valid values include `"aurora"`, `"aurora-postgresql"`, `"mysql"`, `"oracle"`, `"postgres"`, `"sqlserver"`, `redshift`, `mariadb`, `mongodb`, `db2`, `db2-zos` and `docdb`. A value of `"aurora"` represents Amazon Aurora MySQL-Compatible Edition.
        exact-settings: |-
            If this attribute is Y, the current call to `ModifyDataProvider` replaces all existing data provider settings with the exact settings that you specify in this call. If this attribute is N, the current call to `ModifyDataProvider` does two things:

            - It replaces any data provider settings that already exist with new values, for settings with the same names.
            - It creates new data provider settings that you specify in the call, for settings with different names.
        settings: The settings in JSON format for a data provider.
        virtual: Indicates whether the data provider is virtual.
