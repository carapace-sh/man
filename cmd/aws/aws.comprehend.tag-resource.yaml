name: tag-resource
description: Associates a specific tag with an Amazon Comprehend resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the given Amazon Comprehend resource to which you want to associate the tags.
    --tags=!: Tags being associated with a specific Amazon Comprehend resource.
documentation:
    command: Associates a specific tag with an Amazon Comprehend resource. A tag is a key-value pair that adds as a metadata to a resource used by Amazon Comprehend. For example, a tag with "Sales" as the key might be added to a resource to indicate its use by the sales department.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the given Amazon Comprehend resource to which you want to associate the tags.
        tags: Tags being associated with a specific Amazon Comprehend resource. There can be a maximum of 50 tags (both existing and pending) associated with a specific resource.
