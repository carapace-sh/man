name: create-xss-match-set
description: This is **AWS WAF Classic** documentation.
flags:
    --change-token=!: The value returned by the most recent call to [GetChangeToken]().
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: A friendly name or description for the [XssMatchSet]() that you're creating.
documentation:
    command: |-
        This is **AWS WAF Classic** documentation. For more information, see [AWS WAF Classic](https://docs.aws.amazon.com/waf/latest/developerguide/classic-waf-chapter.html) in the developer guide.

        **For the latest version of AWS WAF**, use the AWS WAFV2 API and see the [AWS WAF Developer Guide](https://docs.aws.amazon.com/waf/latest/developerguide/waf-chapter.html). With the latest version, AWS WAF has a single set of endpoints for regional and global use.

        Creates an [XssMatchSet](), which you use to allow, block, or count requests that contain cross-site scripting attacks in the specified part of web requests. AWS WAF searches for character sequences that are likely to be malicious strings.

        To create and configure an `XssMatchSet`, perform the following steps:

        1. Use [GetChangeToken]() to get the change token that you provide in the `ChangeToken` parameter of a `CreateXssMatchSet` request.
        2. Submit a `CreateXssMatchSet` request.
        3. Use `GetChangeToken` to get the change token that you provide in the `ChangeToken` parameter of an [UpdateXssMatchSet]() request.
        4. Submit an [UpdateXssMatchSet]() request to specify the parts of web requests in which you want to allow, block, or count cross-site scripting attacks.

        For more information about how to use the AWS WAF API to allow or block HTTP requests, see the [AWS WAF Developer Guide](https://docs.aws.amazon.com/waf/latest/developerguide/).
    flag:
        change-token: The value returned by the most recent call to [GetChangeToken]().
        cli-input-json: |-
            Reads arguments from the JSON string provided.
