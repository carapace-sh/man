name: wait
description: Poll long-running Immersive Stream for XR operation until it completes.
flags:
    --location=: Global location name.
documentation:
    command: |
        Poll a long-running Immersive Stream for XR operation until it completes. When
        the operation is complete, this command will display the results of the
        analysis.
    flag:
        location: |-
            Global location name.
            +
            To set the `location` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * global is the only supported location.
