name: put-application-authentication-method
description: Adds or updates an authentication method for an application.
flags:
    --application-arn=!: Specifies the ARN of the application with the authentication method to add or update.
    --authentication-method-type=!: Specifies the type of the authentication method that you want to add or update.
    --authentication-method=!: Specifies a structure that describes the authentication method to add or update.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
completion:
    flag:
        authentication-method-type:
            - IAM
documentation:
    command: Adds or updates an authentication method for an application.
    flag:
        application-arn: Specifies the ARN of the application with the authentication method to add or update.
        authentication-method: Specifies a structure that describes the authentication method to add or update. The structure type you provide is determined by the `AuthenticationMethodType` parameter.
        authentication-method-type: Specifies the type of the authentication method that you want to add or update.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
