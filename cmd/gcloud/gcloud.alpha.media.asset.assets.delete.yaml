name: delete
description: '*(ALPHA)*  Delete a Cloud Media Asset asset.'
hidden: true
flags:
    --asset-type=: Google Cloud Media Asset asset type.
    --etag=: The current etag of the asset.
    --location=: Google Cloud location.
documentation:
    command: '*(ALPHA)*  Delete a new Media Asset asset.'
    flag:
        asset-type: |-
            Google Cloud Media Asset asset type.
            +
            To set the `asset_type` attribute:
            * provide the argument `asset` on the command line with a fully specified name;
            * provide the argument `--asset_type` on the command line.
        etag: The current etag of the asset. If an etag is provided and does not match the current etag of the asset, deletion will be blocked and a FAILED_PRECONDITION error will be returned.
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `asset` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `media_asset/location`.
