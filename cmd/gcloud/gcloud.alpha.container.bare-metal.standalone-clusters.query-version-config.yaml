name: query-version-config
description: '*(ALPHA)*  Query versions for upgrading an Anthos on bare metal standalone cluster.'
flags:
    --location=: ID of the location or fully qualified identifier for the location.
    --standalone-cluster=!: ID of the standalone_cluster or fully qualified identifier for the standalone_cluster.
documentation:
    command: '*(ALPHA)*  Query versions for upgrading an Anthos on bare metal standalone cluster.'
    flag:
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line;
            * set the property `container_bare_metal/location`.
        standalone-cluster: |-
            ID of the standalone_cluster or fully qualified identifier for the standalone_cluster.
            +
            To set the `standalone_cluster` attribute:
            * provide the argument `--standalone-cluster` on the command line.
