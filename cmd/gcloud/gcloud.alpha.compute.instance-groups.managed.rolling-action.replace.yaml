name: replace
description: '*(ALPHA)*  Replaces instances in a managed instance group.'
flags:
    --max-surge=: Maximum additional number of instances that can be created during the update process.
    --max-unavailable=: Maximum number of instances that can be unavailable during the update process.
    --min-ready=: Minimum time for which a newly created instance should be ready to be considered available.
    --region=: Region of the managed instance group to operate on.
    --replacement-method=: Type of replacement method.
    --zone=: Zone of the managed instance group to operate on.
completion:
    flag:
        replacement-method:
            - recreate
            - substitute
documentation:
    command: |-
        *(ALPHA)*  Deletes the existing instance and creates a new instance from the target
        template. The Updater creates a brand new instance with all new instance
        properties, such as new internal and external IP addresses.
    flag:
        max-surge: Maximum additional number of instances that can be created during the update process. This can be a fixed number (e.g. 5) or a percentage of size to the managed instance group (e.g. 10%). Defaults to 0 if the managed instance group has stateful configuration, or to the number of zones in which it operates otherwise.
        max-unavailable: Maximum number of instances that can be unavailable during the update process. This can be a fixed number (e.g. 5) or a percentage of size to the managed instance group (e.g. 10%). Defaults to the number of zones in which the managed instance group operates.
        min-ready: Minimum time for which a newly created instance should be ready to be considered available. For example `10s` for 10 seconds. See $ gcloud topic datetimes for information on duration formats.
        region: |-
            Region of the managed instance group to operate on. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            Overrides the default *compute/region* property value for this command invocation.
        replacement-method: |-
            Type of replacement method. Specifies what action will be taken to update instances. Defaults to ``recreate`` if the managed instance group has stateful configuration, or to ``substitute`` otherwise. _REPLACEMENT_METHOD_ must be one of:
            +
            *recreate*::: Recreate instances and preserve the instance names. The instance IDs and creation timestamps might change.
            *substitute*::: Delete old instances and create instances with new names.
            :::
            +
        zone: |-
            Zone of the managed instance group to operate on. If not specified, you might be prompted to select a zone (interactive mode
            only).
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            Overrides the default *compute/zone* property value for this command invocation.
