name: get-template
description: Returns the template body for a specified stack.
flags:
    --change-set-name=: The name or Amazon Resource Name (ARN) of a change set for which CloudFormation returns the associated template.
    --stack-name=: 'The name or the unique stack ID that''s associated with the stack, which aren''t always interchangeable:'
    --template-stage=: For templates that include transforms, the stage of the template that CloudFormation returns.
completion:
    flag:
        template-stage:
            - Original
            - Processed
documentation:
    command: |-
        Returns the template body for a specified stack. You can get the template for running or deleted stacks.

        For deleted stacks, `GetTemplate` returns the template for up to 90 days after the stack has been deleted.

        If the template doesn't exist, a `ValidationError` is returned.
    flag:
        change-set-name: The name or Amazon Resource Name (ARN) of a change set for which CloudFormation returns the associated template. If you specify a name, you must also specify the `StackName`.
        stack-name: |-
            The name or the unique stack ID that's associated with the stack, which aren't always interchangeable:

            - Running stacks: You can specify either the stack's name or its unique stack ID.
            - Deleted stacks: You must specify the unique stack ID.
        template-stage: |-
            For templates that include transforms, the stage of the template that CloudFormation returns. To get the user-submitted template, specify `Original`. To get the template after CloudFormation has processed all transforms, specify `Processed`.

            If the template doesn't include transforms, `Original` and `Processed` return the same template. By default, CloudFormation specifies `Processed`.
