name: untag-resource
description: Remove one or more tags from a resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource to untag.
    --tag-keys=!: Tag keys of the tags to remove from the resource.
documentation:
    command: Remove one or more tags from a resource. For more information, see [Tagging resources](https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-service.html) in the [Amazon Bedrock User Guide](https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-service.html).
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource to untag.
        tag-keys: Tag keys of the tags to remove from the resource.
