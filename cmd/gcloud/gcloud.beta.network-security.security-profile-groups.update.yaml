name: update
description: '*(BETA)*  Update a Security Profile Group.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --clear-labels: Remove all labels.
    --clear-threat-prevention-profile: Clear the threat-prevention-profile field.
    --clear-url-filtering-profile: Clear the url-filtering-profile field.
    --description=: Brief description of the security profile group
    --location=: location of the security_profile_group - Global.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-labels&: Remove all labels.
    --no-clear-threat-prevention-profile&: Clear the threat-prevention-profile field.
    --no-clear-url-filtering-profile&: Clear the url-filtering-profile field.
    --organization=: Organization ID of Security Profile Group
    --remove-labels=: List of label keys to remove.
    --security-profile-location=&: Flag to preserve backward compatibility.
    --security-profile-organization=&: Flag to preserve backward compatibility.
    --threat-prevention-profile-location=: Location of the Security Profile.
    --threat-prevention-profile-organization=: Organization ID of the Security Profile.
    --threat-prevention-profile=!: ID of the Security Profile or fully qualified identifier for the Security Profile.
    --update-labels=: List of label KEY=VALUE pairs to update.
    --url-filtering-profile-location=: Location of the Security Profile.
    --url-filtering-profile-organization=: Organization ID of the Security Profile.
    --url-filtering-profile=!: ID of the Security Profile or fully qualified identifier for the Security Profile.
documentation:
    command: |4+
        *(BETA)*  Update details of a Security Profile Group.

    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *False*.
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        clear-threat-prevention-profile: Clear the threat-prevention-profile field.
        clear-url-filtering-profile: Clear the url-filtering-profile field.
        description: Brief description of the security profile group
        location: |-
            location of the security_profile_group - Global.
            +
            To set the `location` attribute:
            * provide the argument `SECURITY_PROFILE_GROUP` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        no-clear-threat-prevention-profile: |
            Clear the threat-prevention-profile field.
        no-clear-url-filtering-profile: |
            Clear the url-filtering-profile field.
        organization: |-
            Organization ID of Security Profile Group
            +
            To set the `organization` attribute:
            * provide the argument `SECURITY_PROFILE_GROUP` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        security-profile-location: Flag to preserve backward compatibility.
        security-profile-organization: Flag to preserve backward compatibility.
        threat-prevention-profile: |-
            ID of the Security Profile or fully qualified identifier for the Security Profile.
            +
            To set the `name` attribute:
            * provide the argument `--threat-prevention-profile` on the command line.
        threat-prevention-profile-location: |-
            Location of the Security Profile.
                  NOTE: Only `global` security profiles are supported.
            +

            To set the `location` attribute:
            * provide the argument `--threat-prevention-profile` on the command line with a fully specified name;
            * provide the argument `--threat-prevention-profile-location` on the command line;
            * provide the argument `--security-profile-location` on the command line;
            * provide the argument `--location` on the command line;
            * provide the argument `networksecurity.organizations.locations.securityProfileGroups` on the command line with a fully specified name.
        threat-prevention-profile-organization: |-
            Organization ID of the Security Profile.
            +
            To set the `organization` attribute:
            * provide the argument `--threat-prevention-profile` on the command line with a fully specified name;
            * provide the argument `--threat-prevention-profile-organization` on the command line;
            * provide the argument `--security-profile-organization` on the command line;
            * provide the argument `--organization` on the command line;
            * provide the argument `networksecurity.organizations.locations.securityProfileGroups` on the command line with a fully specified name.
        update-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        url-filtering-profile: |-
            ID of the Security Profile or fully qualified identifier for the Security Profile.
            +
            To set the `name` attribute:
            * provide the argument `--url-filtering-profile` on the command line.
        url-filtering-profile-location: |-
            Location of the Security Profile.
                  NOTE: Only `global` security profiles are supported.
            +

            To set the `location` attribute:
            * provide the argument `--url-filtering-profile` on the command line with a fully specified name;
            * provide the argument `--url-filtering-profile-location` on the command line;
            * provide the argument `--location` on the command line;
            * provide the argument `networksecurity.organizations.locations.securityProfileGroups` on the command line with a fully specified name.
        url-filtering-profile-organization: |-
            Organization ID of the Security Profile.
            +
            To set the `organization` attribute:
            * provide the argument `--url-filtering-profile` on the command line with a fully specified name;
            * provide the argument `--url-filtering-profile-organization` on the command line;
            * provide the argument `--organization` on the command line;
            * provide the argument `networksecurity.organizations.locations.securityProfileGroups` on the command line with a fully specified name.
