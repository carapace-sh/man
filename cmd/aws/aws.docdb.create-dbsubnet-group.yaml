name: create-dbsubnet-group
description: Creates a new subnet group.
flags:
    --dbsubnet-group-description=!: The description for the subnet group.
    --dbsubnet-group-name=!: The name for the subnet group.
    --subnet-ids=!: The Amazon EC2 subnet IDs for the subnet group.
    --tags=: The tags to be assigned to the subnet group.
documentation:
    command: Creates a new subnet group. subnet groups must contain at least one subnet in at least two Availability Zones in the Amazon Web Services Region.
    flag:
        dbsubnet-group-description: The description for the subnet group.
        dbsubnet-group-name: |-
            The name for the subnet group. This value is stored as a lowercase string.

            Constraints: Must contain no more than 255 letters, numbers, periods, underscores, spaces, or hyphens. Must not be default.

            Example: `mySubnetgroup`
        subnet-ids: The Amazon EC2 subnet IDs for the subnet group.
        tags: The tags to be assigned to the subnet group.
