name: disassociate-mac-sec-key
description: Removes the association between a MAC Security (MACsec) security key and a Direct Connect connection.
flags:
    --connection-id=!: The ID of the dedicated connection (dxcon-xxxx), interconnect (dxcon-xxxx), or LAG (dxlag-xxxx).
    --secret-arn=!: The Amazon Resource Name (ARN) of the MAC Security (MACsec) secret key.
documentation:
    command: Removes the association between a MAC Security (MACsec) security key and a Direct Connect connection.
    flag:
        connection-id: |-
            The ID of the dedicated connection (dxcon-xxxx), interconnect (dxcon-xxxx), or LAG (dxlag-xxxx).

            You can use [DescribeConnections](), [DescribeInterconnects](), or [DescribeLags]() to retrieve connection ID.
        secret-arn: |-
            The Amazon Resource Name (ARN) of the MAC Security (MACsec) secret key.

            You can use [DescribeConnections]() to retrieve the ARN of the MAC Security (MACsec) secret key.
