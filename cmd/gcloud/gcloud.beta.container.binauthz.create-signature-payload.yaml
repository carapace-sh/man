name: create-signature-payload
description: '*(BETA)*  Create a JSON container image signature object.'
flags:
    --artifact-url=!: Container URL.
documentation:
    command: |-
        *(BETA)*  Given a container image URL specified by the manifest digest, this command
        will produce a JSON object whose signature is expected by Cloud Binary
        Authorization.

        ## EXAMPLES

        To output serialized JSON to sign, run:

            $ gcloud beta container binauthz create-signature-payload \
                --artifact-url="gcr.io/example-project/example-image@sha256:abcd"
    flag:
        artifact-url: Container URL. May be in the `gcr.io/repository/image` format, or may optionally contain the `http` or `https` scheme
