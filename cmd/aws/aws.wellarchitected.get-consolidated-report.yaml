name: get-consolidated-report
description: Get a consolidated report of your workloads.
flags:
    --format=!: The format of the consolidated report.
    --include-shared-resources=: Set to `true` to have shared resources included in the report.
    --max-results=: The maximum number of results to return for this request.
    --next-token=: ""
completion:
    flag:
        format:
            - PDF
            - JSON
documentation:
    command: |-
        Get a consolidated report of your workloads.

        You can optionally choose to include workloads that have been shared with you.
    flag:
        format: |-
            The format of the consolidated report.

            For `PDF`, `Base64String` is returned. For `JSON`, `Metrics` is returned.
        include-shared-resources: Set to `true` to have shared resources included in the report.
        max-results: The maximum number of results to return for this request.
        next-token: ""
