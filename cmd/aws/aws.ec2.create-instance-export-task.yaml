name: create-instance-export-task
description: Exports a running or stopped instance to an Amazon S3 bucket.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description for the conversion task or the resource being exported.
    --export-to-s3-task=!: The format and location for an export instance task.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-id=!: The ID of the instance.
    --tag-specifications=: The tags to apply to the export instance task during creation.
    --target-environment=!: The target virtualization environment.
completion:
    flag:
        target-environment:
            - citrix
            - vmware
            - microsoft
documentation:
    command: |-
        Exports a running or stopped instance to an Amazon S3 bucket.

        For information about the prerequisites for your Amazon S3 bucket, supported operating systems, image formats, and known limitations for the types of instances you can export, see [Exporting an instance as a VM Using VM Import/Export](https://docs.aws.amazon.com/vm-import/latest/userguide/vmexport.html) in the *VM Import/Export User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description for the conversion task or the resource being exported. The maximum length is 255 characters.
        export-to-s3-task: The format and location for an export instance task.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-id: The ID of the instance.
        tag-specifications: The tags to apply to the export instance task during creation.
        target-environment: The target virtualization environment.
