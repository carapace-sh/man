name: update
description: '*(ALPHA)*  Update a spoke by the label.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: New description of the spoke.
    --labels=: List of label KEY=VALUE pairs to add.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: The location Id.
    --router-appliance=: Replace the set of router appliance instances linked to this spoke.
documentation:
    command: '*(ALPHA)*  Update the detail of a spoke.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: New description of the spoke.
        labels: List of label KEY=VALUE pairs to add.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            The location Id.
            +

            To set the `region` attribute:
            * provide the argument `spoke` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
        router-appliance: |-
            Replace the set of router appliance instances linked to this spoke. Pass this flag multiple times to use multiple instances.
            For example, use `--router-appliance=instance=new_instance,ip=10.10.10.1` for a single router-appliance instance,
            or `--router-appliance=instance=new_instance_1,ip=10.10.10.11 --router-appliance=instance=new_instance_2,ip=10.10.10.12 ...`
            for multiple instances.
