name: put-capacity-assignment-configuration
description: Puts a new capacity assignment configuration for a specified capacity reservation.
flags:
    --capacity-assignments=!: The list of assignments for the capacity assignment configuration.
    --capacity-reservation-name=!: The name of the capacity reservation to put a capacity assignment configuration for.
documentation:
    command: Puts a new capacity assignment configuration for a specified capacity reservation. If a capacity assignment configuration already exists for the capacity reservation, replaces the existing capacity assignment configuration.
    flag:
        capacity-assignments: The list of assignments for the capacity assignment configuration.
        capacity-reservation-name: The name of the capacity reservation to put a capacity assignment configuration for.
