name: set-min-cpu-platform
description: '*(ALPHA)*  *(DEPRECATED)*  Set minimum CPU platform for Compute Engine virtual machines.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --min-cpu-platform=!: When specified, the VM will be scheduled on host with specified CPU
    --no-async&: Return immediately, without waiting for the operation in progress to
    --zone=: Zone of the instance to operate on.
documentation:
    command: |4
        *(ALPHA)*  *(DEPRECATED)*  This command is deprecated. Use $ gcloud alpha compute instances update --set-min-cpu-platform instead.

        `gcloud alpha compute instances set-min-cpu-platform` changes the minimum CPU platform of a virtual
        machine with the *TERMINATED* status (a virtual machine  instance that
        has been stopped).

        For example, running the command on example-instance virtual machine
        which has a status of TERMINATED

          $ gcloud alpha compute instances set-min-cpu-platform example-instance --zone us-central1-a        --min-cpu-platform "Intel Broadwell"

        will set the minimum CPU platform to `Intel Broadwell`. When
        you start `example-instance` later, it will be provisioned using at
        least `Intel Broadwell` CPU platform.

        To get a list of available CPU platforms in us-central1-a zone, run:

          $ gcloud alpha compute zones describe us-central1-a        --format="value(availableCpuPlatforms)"
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        min-cpu-platform: |-
            When specified, the VM will be scheduled on host with specified CPU
            architecture or a newer one. To list available CPU platforms in given
            zone, run:
            +
                $ gcloud alpha compute zones describe ZONE --format="value(availableCpuPlatforms)"
            +
            Default setting is "AUTOMATIC".
            +
            CPU platform selection is available only in selected zones.
            +
            You can find more information on-line:
            [](https://cloud.google.com/compute/docs/instances/specify-min-cpu-platform)
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        zone: |-
            Zone of the instance to operate on. If not specified, you might be prompted to select a zone (interactive mode
            only). `gcloud` attempts to identify the appropriate zone by searching for
            resources in your currently active project. If the zone cannot be determined,
            `gcloud` prompts you for a selection with all available Google Cloud Platform
            zones.
            +
            To avoid prompting when this flag is omitted, the user can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
