name: update-room
description: Updates a room’s configuration.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identifier=!: Identifier of the room to be updated.
    --logging-configuration-identifiers=: Array of logging-configuration identifiers attached to the room.
    --maximum-message-length=: The maximum number of characters in a single message.
    --maximum-message-rate-per-second=: Maximum number of messages per second that can be sent to the room (by all clients).
    --message-review-handler=: Configuration information for optional review of messages.
    --name=: Room name.
documentation:
    command: Updates a room’s configuration.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        identifier: Identifier of the room to be updated. Currently this must be an ARN.
        logging-configuration-identifiers: Array of logging-configuration identifiers attached to the room.
        maximum-message-length: 'The maximum number of characters in a single message. Messages are expected to be UTF-8 encoded and this limit applies specifically to rune/code-point count, not number of bytes. Default: 500.'
        maximum-message-rate-per-second: 'Maximum number of messages per second that can be sent to the room (by all clients). Default: 10.'
        message-review-handler: Configuration information for optional review of messages. Specify an empty `uri` string to disassociate a message review handler from the specified room.
        name: Room name. The value does not need to be unique.
