name: start-app
description: Starts a custom app with the configuration specified in the simulation schema.
flags:
    --client-token=: A value that you provide to ensure that repeated calls to this API operation using the same parameters complete only once.
    --description=: The description of the app.
    --domain=!: The name of the domain of the app.
    --launch-overrides=: ""
    --name=!: The name of the app.
    --simulation=!: The name of the simulation of the app.
documentation:
    command: Starts a custom app with the configuration specified in the simulation schema.
    flag:
        client-token: A value that you provide to ensure that repeated calls to this API operation using the same parameters complete only once. A `ClientToken` is also known as an *idempotency token*. A `ClientToken` expires after 24 hours.
        description: The description of the app.
        domain: The name of the domain of the app.
        launch-overrides: ""
        name: The name of the app.
        simulation: The name of the simulation of the app.
