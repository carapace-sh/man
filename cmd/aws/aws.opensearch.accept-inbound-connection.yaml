name: accept-inbound-connection
description: Allows the destination Amazon OpenSearch Service domain owner to accept an inbound cross-cluster search connection request.
flags:
    --connection-id=!: The ID of the inbound connection to accept.
documentation:
    command: Allows the destination Amazon OpenSearch Service domain owner to accept an inbound cross-cluster search connection request. For more information, see [Cross-cluster search for Amazon OpenSearch Service](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/cross-cluster-search.html).
    flag:
        connection-id: The ID of the inbound connection to accept.
