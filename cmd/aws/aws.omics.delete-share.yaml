name: delete-share
description: Deletes a resource share.
flags:
    --share-id=!: The ID for the resource share to be deleted.
documentation:
    command: Deletes a resource share. If you are the resource owner, the subscriber will no longer have access to the shared resource. If you are the subscriber, this operation deletes your access to the share.
    flag:
        share-id: The ID for the resource share to be deleted.
