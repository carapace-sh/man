name: delete-member
description: Removes the specified member from a collaboration.
flags:
    --account-id=!: The account ID of the member to remove.
    --collaboration-identifier=!: The unique identifier for the associated collaboration.
documentation:
    command: Removes the specified member from a collaboration. The removed member is placed in the Removed status and can't interact with the collaboration. The removed member's data is inaccessible to active members of the collaboration.
    flag:
        account-id: The account ID of the member to remove.
        collaboration-identifier: The unique identifier for the associated collaboration.
