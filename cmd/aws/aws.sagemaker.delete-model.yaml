name: delete-model
description: Deletes a model.
flags:
    --model-name=!: The name of the model to delete.
documentation:
    command: Deletes a model. The `DeleteModel` API deletes only the model entry that was created in SageMaker when you called the `CreateModel` API. It does not delete model artifacts, inference code, or the IAM role that you specified when creating the model.
    flag:
        model-name: The name of the model to delete.
