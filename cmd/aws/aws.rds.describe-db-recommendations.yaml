name: describe-db-recommendations
description: Describes the recommendations to resolve the issues for your DB instances, DB clusters, and DB parameter groups.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --filters=:
        description: A filter that specifies one or more recommendations to describe.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --last-updated-after=: A filter to include only the recommendations that were updated after this specified time.
    --last-updated-before=: A filter to include only the recommendations that were updated before this specified time.
    --locale=: The language that you choose to return the list of recommendations.
    --marker=: An optional pagination token provided by a previous `DescribeDBRecommendations` request.
    --max-items=: The  total number of items to return in the command's output.
    --max-records=: The maximum number of recommendations to include in the response.
    --page-size=: The size of each page to get in the AWS service call.
    --starting-token=: A token to specify where to start paginating.
documentation:
    command: Describes the recommendations to resolve the issues for your DB instances, DB clusters, and DB parameter groups.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        filters: "A filter that specifies one or more recommendations to describe.\n\nSupported Filters:\n\n- `recommendation-id` - Accepts a list of recommendation identifiers. The results list only includes the recommendations whose identifier is one of the specified filter values.\n- `status` - Accepts a list of recommendation statuses.\n  \n  Valid values:\n  \n  - `active` - The recommendations which are ready for you to apply.\n  - `pending` - The applied or scheduled recommendations which are in progress.\n  - `resolved` - The recommendations which are completed.\n  - `dismissed` - The recommendations that you dismissed.\n  \n  The results list only includes the recommendations whose status is one of the specified filter values.\n- `severity` - Accepts a list of recommendation severities. The results list only includes the recommendations whose severity is one of the specified filter values.\n  \n  Valid values:\n  \n  - `high`\n  - `medium`\n  - `low`\n  - `informational`\n- `type-id` - Accepts a list of recommendation type identifiers. The results list only includes the recommendations whose type is one of the specified filter values.\n- `dbi-resource-id` - Accepts a list of database resource identifiers. The results list only includes the recommendations that generated for the specified databases.\n- `cluster-resource-id` - Accepts a list of cluster resource identifiers. The results list only includes the recommendations that generated for the specified clusters.\n- `pg-arn` - Accepts a list of parameter group ARNs. The results list only includes the recommendations that generated for the specified parameter groups.\n- `cluster-pg-arn` - Accepts a list of cluster parameter group ARNs. The results list only includes the recommendations that generated for the specified cluster parameter groups."
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        last-updated-after: A filter to include only the recommendations that were updated after this specified time.
        last-updated-before: A filter to include only the recommendations that were updated before this specified time.
        locale: |-
            The language that you choose to return the list of recommendations.

            Valid values:

            - `en`
            - `en_UK`
            - `de`
            - `es`
            - `fr`
            - `id`
            - `it`
            - `ja`
            - `ko`
            - `pt_BR`
            - `zh_TW`
            - `zh_CN`
        marker: An optional pagination token provided by a previous `DescribeDBRecommendations` request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-records: The maximum number of recommendations to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that you can retrieve the remaining results.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
