name: export-image
description: Exports an Amazon Machine Image (AMI) to a VM file.
flags:
    --client-token=: Token to enable idempotency for export image requests.
    --description=: A description of the image being exported.
    --disk-image-format=!: The disk image format.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --image-id=!: The ID of the image.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --role-name=: The name of the role that grants VM Import/Export permission to export images to your Amazon S3 bucket.
    --s3-export-location=!: The Amazon S3 bucket for the destination image.
    --tag-specifications=: The tags to apply to the export image task during creation.
completion:
    flag:
        disk-image-format:
            - VMDK
            - RAW
            - VHD
documentation:
    command: Exports an Amazon Machine Image (AMI) to a VM file. For more information, see [Exporting a VM directly from an Amazon Machine Image (AMI)](https://docs.aws.amazon.com/vm-import/latest/userguide/vmexport_image.html) in the *VM Import/Export User Guide*.
    flag:
        client-token: Token to enable idempotency for export image requests.
        description: A description of the image being exported. The maximum length is 255 characters.
        disk-image-format: The disk image format.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        image-id: The ID of the image.
        role-name: The name of the role that grants VM Import/Export permission to export images to your Amazon S3 bucket. If this parameter is not specified, the default role is named 'vmimport'.
        s3-export-location: The Amazon S3 bucket for the destination image. The destination bucket must exist.
        tag-specifications: The tags to apply to the export image task during creation.
