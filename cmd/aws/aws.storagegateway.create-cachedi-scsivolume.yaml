name: create-cachedi-scsivolume
description: Creates a cached volume on a specified cached volume gateway.
flags:
    --client-token=!: A unique identifier that you use to retry a request.
    --gateway-arn=!: ""
    --kmsencrypted: Set to `true` to use Amazon S3 server-side encryption with your own KMS key, or `false` to use a key managed by Amazon S3.
    --kmskey=: The Amazon Resource Name (ARN) of a symmetric customer master key (CMK) used for Amazon S3 server-side encryption.
    --network-interface-id=!: The network interface of the gateway on which to expose the iSCSI target.
    --no-kmsencrypted&: Set to `true` to use Amazon S3 server-side encryption with your own KMS key, or `false` to use a key managed by Amazon S3.
    --snapshot-id=: The snapshot ID (e.g. "snap-1122aabb") of the snapshot to restore as the new cached volume.
    --source-volume-arn=: The ARN for an existing volume.
    --tags=: A list of up to 50 tags that you can assign to a cached volume.
    --target-name=!: The name of the iSCSI target used by an initiator to connect to a volume and used as a suffix for the target ARN.
    --volume-size-in-bytes=!: The size of the volume in bytes.
documentation:
    command: |-
        Creates a cached volume on a specified cached volume gateway. This operation is only supported in the cached volume gateway type.

        Cache storage must be allocated to the gateway before you can create a cached volume. Use the [AddCache]() operation to add cache storage to a gateway.

        In the request, you must specify the gateway, size of the volume in bytes, the iSCSI target name, an IP address on which to expose the target, and a unique client token. In response, the gateway creates the volume and returns information about it. This information includes the volume Amazon Resource Name (ARN), its size, and the iSCSI target ARN that initiators can use to connect to the volume target.

        Optionally, you can provide the ARN for an existing volume as the `SourceVolumeARN` for this cached volume, which creates an exact copy of the existing volume’s latest recovery point. The `VolumeSizeInBytes` value must be equal to or larger than the size of the copied volume, in bytes.
    flag:
        client-token: A unique identifier that you use to retry a request. If you retry a request, use the same `ClientToken` you specified in the initial request.
        gateway-arn: ""
        kmsencrypted: |-
            Set to `true` to use Amazon S3 server-side encryption with your own KMS key, or `false` to use a key managed by Amazon S3. Optional.

            Valid Values: `true` | `false`
        kmskey: The Amazon Resource Name (ARN) of a symmetric customer master key (CMK) used for Amazon S3 server-side encryption. Storage Gateway does not support asymmetric CMKs. This value can only be set when `KMSEncrypted` is `true`. Optional.
        network-interface-id: |-
            The network interface of the gateway on which to expose the iSCSI target. Accepts IPv4 and IPv6 addresses. Use [DescribeGatewayInformation]() to get a list of the network interfaces available on a gateway.

            Valid Values: A valid IP address.
        snapshot-id: The snapshot ID (e.g. "snap-1122aabb") of the snapshot to restore as the new cached volume. Specify this field if you want to create the iSCSI storage volume from a snapshot; otherwise, do not include this field. To list snapshots for your account use [DescribeSnapshots](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/ApiReference-query-DescribeSnapshots.html) in the *Amazon Elastic Compute Cloud API Reference*.
        source-volume-arn: The ARN for an existing volume. Specifying this ARN makes the new volume into an exact copy of the specified existing volume's latest recovery point. The `VolumeSizeInBytes` value for this new volume must be equal to or larger than the size of the existing volume, in bytes.
        tags: |-
            A list of up to 50 tags that you can assign to a cached volume. Each tag is a key-value pair.

            Valid characters for key and value are letters, spaces, and numbers that you can represent in UTF-8 format, and the following special characters: + - = . _ : / @. The maximum length of a tag's key is 128 characters, and the maximum length for a tag's value is 256 characters.
        target-name: |-
            The name of the iSCSI target used by an initiator to connect to a volume and used as a suffix for the target ARN. For example, specifying `TargetName` as *myvolume* results in the target ARN of `arn:aws:storagegateway:us-east-2:111122223333:gateway/sgw-12A3456B/target/iqn.1997-05.com.amazon:myvolume`. The target name must be unique across all volumes on a gateway.

            If you don't specify a value, Storage Gateway uses the value that was previously used for this volume as the new target name.
        volume-size-in-bytes: The size of the volume in bytes.
