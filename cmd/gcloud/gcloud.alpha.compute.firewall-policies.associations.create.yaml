name: create
description: '*(ALPHA)*  Create a new association between a firewall policy and an organization or folder resource.'
flags:
    --firewall-policy=!: Security policy ID of the association.
    --folder=: ID of the folder with which the association is created.
    --name=: Name to identify this association.
    --no-replace-association-on-target&: By default, if you attempt to insert an association to an organization or folder resource that is already associated with a firewall policy the method will fail.
    --organization=: ID of the organization in which the firewall policy is to be associated.
    --replace-association-on-target: By default, if you attempt to insert an association to an organization or folder resource that is already associated with a firewall policy the method will fail.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute firewall-policies associations create* is used to create organization firewall policy associations. An
        organization firewall policy is a set of rules that controls access to various
        resources.
    flag:
        firewall-policy: Security policy ID of the association.
        folder: ID of the folder with which the association is created.
        name: Name to identify this association. If unspecified, the name will be set to "organization-{ORGANIZATION_ID}" or "folder-{FOLDER_ID}".
        no-replace-association-on-target: By default, if you attempt to insert an association to an organization or folder resource that is already associated with a firewall policy the method will fail. If this is set, the existing  association will be deleted at the same time that the new association is created.
        organization: ID of the organization in which the firewall policy is to be associated. Must be set if FIREWALL_POLICY is short name.
        replace-association-on-target: By default, if you attempt to insert an association to an organization or folder resource that is already associated with a firewall policy the method will fail. If this is set, the existing  association will be deleted at the same time that the new association is created.
