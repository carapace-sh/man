name: describe
description: '*(ALPHA)*  Describes a location available to Google Cloud Firestore.'
flags:
    --location=!: The location to operate on.
documentation:
    command: |-
        ## EXAMPLES

        To describe a Firestore locations with us-east1.

            $ gcloud alpha firestore locations describe --location="us-east1"
    flag:
        location: |-
            The location to operate on. Available locations are listed at
            https://cloud.google.com/firestore/docs/locations.
            +
            For example, to operate on location `us-east1`:
            +
              $ {command} --location='us-east1'
