name: list-dedicated-ip-pools
description: List all of the dedicated IP pools that exist in your Amazon Pinpoint account in the current AWS Region.
flags:
    --next-token=: A token returned from a previous call to `ListDedicatedIpPools` to indicate the position in the list of dedicated IP pools.
    --page-size=: The number of results to show in a single call to `ListDedicatedIpPools`.
documentation:
    command: List all of the dedicated IP pools that exist in your Amazon Pinpoint account in the current AWS Region.
    flag:
        next-token: A token returned from a previous call to `ListDedicatedIpPools` to indicate the position in the list of dedicated IP pools.
        page-size: The number of results to show in a single call to `ListDedicatedIpPools`. If the number of results is larger than the number you specified in this parameter, then the response includes a `NextToken` element, which you can use to obtain additional results.
