documentation:
    command: '*(BETA)*  Update a Unit Operation'
    flag:
        add-provision-input-variables: |-
            Add new value to provision_input_variables list. Set of input variables. Maximum 100. (optional).
            +
            *type*:::
            Name of a supported variable type. Supported types are string, int, bool.
            +
            *value*:::
            String encoded value for the variable.
            +
            *variable*:::
            Name of the variable from actuation configs.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --add-provision-input-variables=type=string,value=string,variable=string --add-provision-input-variables=type=string,value=string,variable=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --add-provision-input-variables='[{"type": "string", "value": "string", "variable": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --add-provision-input-variables=path_to_file.(yaml|json)
            +
            ```
        add-upgrade-input-variables: |-
            Add new value to upgrade_input_variables list. Set of input variables. Maximum 100. (optional).
            +
            *type*:::
            Name of a supported variable type. Supported types are string, int, bool.
            +
            *value*:::
            String encoded value for the variable.
            +
            *variable*:::
            Name of the variable from actuation configs.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --add-upgrade-input-variables=type=string,value=string,variable=string --add-upgrade-input-variables=type=string,value=string,variable=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --add-upgrade-input-variables='[{"type": "string", "value": "string", "variable": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --add-upgrade-input-variables=path_to_file.(yaml|json)
            +
            ```
        cancel: |-
            When true, attempt to cancel the operation. Cancellation may fail if the
            operation is already executing. (Optional)
        clear-labels: Clear labels value and set to empty map.
        clear-parent-unit-operation: Clear parent_unit_operation value and set to null.
        clear-provision-input-variables: Clear provision_input_variables value and set to empty list.
        clear-provision-release: Clear provision_release value and set to null.
        clear-rollout: Clear rollout value and set to null.
        clear-upgrade-input-variables: Clear upgrade_input_variables value and set to empty list.
        clear-upgrade-release: Clear upgrade_release value and set to null.
        deprovision: This flag can be used to specify an empty deprovision operation.
        labels: |-
            Set labels to new value. The labels on the resource, which can be used for categorization.
            similar to Kubernetes resource labels.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: For resources [parent-unit-operation, provision-release, rollout, unit_operation, upgrade-release], provides fallback value for resource location attribute. When the resource's full URI path is not provided, location will fallback to this flag value.
        no-cancel: |-
            When true, attempt to cancel the operation. Cancellation may fail if the
            operation is already executing. (Optional)
        no-clear-labels: Clear labels value and set to empty map.
        no-clear-parent-unit-operation: Clear parent_unit_operation value and set to null.
        no-clear-provision-input-variables: Clear provision_input_variables value and set to empty list.
