name: send-project-session-action
description: Performs a recipe step within an interactive DataBrew session that's currently open.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-session-id=: A unique identifier for an interactive session that's currently open and ready for work.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the project to apply the action to.
    --no-preview: If true, the result of the recipe step will be returned, but not applied.
    --preview: If true, the result of the recipe step will be returned, but not applied.
    --recipe-step=: ""
    --step-index=: The index from which to preview a step.
    --view-frame=: ""
documentation:
    command: Performs a recipe step within an interactive DataBrew session that's currently open.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-session-id: A unique identifier for an interactive session that's currently open and ready for work. The action will be performed on this session.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the project to apply the action to.
        preview: If true, the result of the recipe step will be returned, but not applied.
        recipe-step: ""
        step-index: The index from which to preview a step. This index is used to preview the result of steps that have already been applied, so that the resulting view frame is from earlier in the view frame stack.
        view-frame: ""
