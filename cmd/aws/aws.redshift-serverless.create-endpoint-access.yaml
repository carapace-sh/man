name: create-endpoint-access
description: Creates an Amazon Redshift Serverless managed VPC endpoint.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --endpoint-name=!: The name of the VPC endpoint.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --owner-account=: The owner Amazon Web Services account for the Amazon Redshift Serverless workgroup.
    --subnet-ids=!: The unique identifers of subnets from which Amazon Redshift Serverless chooses one to deploy a VPC endpoint.
    --vpc-security-group-ids=: The unique identifiers of the security group that defines the ports, protocols, and sources for inbound traffic that you are authorizing into your endpoint.
    --workgroup-name=!: The name of the workgroup to associate with the VPC endpoint.
documentation:
    command: Creates an Amazon Redshift Serverless managed VPC endpoint.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        endpoint-name: The name of the VPC endpoint. An endpoint name must contain 1-30 characters. Valid characters are A-Z, a-z, 0-9, and hyphen(-). The first character must be a letter. The name can't contain two consecutive hyphens or end with a hyphen.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        owner-account: The owner Amazon Web Services account for the Amazon Redshift Serverless workgroup.
        subnet-ids: The unique identifers of subnets from which Amazon Redshift Serverless chooses one to deploy a VPC endpoint.
        vpc-security-group-ids: The unique identifiers of the security group that defines the ports, protocols, and sources for inbound traffic that you are authorizing into your endpoint.
        workgroup-name: The name of the workgroup to associate with the VPC endpoint.
