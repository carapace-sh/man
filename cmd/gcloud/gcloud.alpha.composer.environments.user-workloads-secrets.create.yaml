name: create
description: '*(ALPHA)*  Create a user workloads Secret.'
flags:
    --environment=!: ID of the environment or fully qualified identifier for the environment.
    --location=: Region where Composer environment runs or in which to create the environment.
    --secret-file-path=!: Path to a local file with a single Kubernetes Secret in YAML format.
documentation:
    command: '*(ALPHA)*  Create a user workloads Secret.'
    flag:
        environment: |-
            ID of the environment or fully qualified identifier for the environment.
            +
            To set the `environment` attribute:
            * provide the argument `--environment` on the command line.
        location: |-
            Region where Composer environment runs or in which to create the environment.
            +
            To set the `location` attribute:
            * provide the argument `--environment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `composer/location`.
        secret-file-path: Path to a local file with a single Kubernetes Secret in YAML format.
