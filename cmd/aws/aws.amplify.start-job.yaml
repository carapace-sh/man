name: start-job
description: Starts a new job for a branch of an Amplify app.
flags:
    --app-id=!: The unique ID for an Amplify app.
    --branch-name=!: The name of the branch to use for the job.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --commit-id=: The commit ID from a third-party repository provider for the job.
    --commit-message=: The commit message from a third-party repository provider for the job.
    --commit-time=: The commit date and time for the job.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --job-id=: The unique ID for an existing job.
    --job-reason=: A descriptive reason for starting the job.
    --job-type=!: Describes the type for the job.
completion:
    flag:
        job-type:
            - RELEASE
            - RETRY
            - MANUAL
            - WEB_HOOK
documentation:
    command: Starts a new job for a branch of an Amplify app.
    flag:
        app-id: The unique ID for an Amplify app.
        branch-name: The name of the branch to use for the job.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        commit-id: The commit ID from a third-party repository provider for the job.
        commit-message: The commit message from a third-party repository provider for the job.
        commit-time: The commit date and time for the job.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        job-id: The unique ID for an existing job. This is required if the value of `jobType` is `RETRY`.
        job-reason: A descriptive reason for starting the job.
        job-type: |-
            Describes the type for the job. The job type `RELEASE` starts a new job with the latest change from the specified branch. This value is available only for apps that are connected to a repository.

            The job type `RETRY` retries an existing job. If the job type value is `RETRY`, the `jobId` is also required.
