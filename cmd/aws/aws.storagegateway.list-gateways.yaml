name: list-gateways
description: Lists gateways owned by an Amazon Web Services account in an Amazon Web Services Region specified in the request.
flags:
    --limit=: Specifies that the list of gateways returned be limited to the specified number of items.
    --marker=: An opaque string that indicates the position at which to begin the returned list of gateways.
documentation:
    command: |-
        Lists gateways owned by an Amazon Web Services account in an Amazon Web Services Region specified in the request. The returned list is ordered by gateway Amazon Resource Name (ARN).

        By default, the operation returns a maximum of 100 gateways. This operation supports pagination that allows you to optionally reduce the number of gateways returned in a response.

        If you have more gateways than are returned in a response (that is, the response returns only a truncated list of your gateways), the response contains a marker that you can specify in your next request to fetch the next page of gateways.
    flag:
        limit: Specifies that the list of gateways returned be limited to the specified number of items.
        marker: An opaque string that indicates the position at which to begin the returned list of gateways.
