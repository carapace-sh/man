name: create-event-subscription
description: Creates an DMS event notification subscription.
flags:
    --enabled=: A Boolean value; set to `true` to activate the subscription, or set to `false` to create the subscription but not activate it.
    --event-categories=: A list of event categories for a source type that you want to subscribe to.
    --sns-topic-arn=!: The Amazon Resource Name (ARN) of the Amazon SNS topic created for event notification.
    --source-ids=: A list of identifiers for which DMS provides notification events.
    --source-type=: The type of DMS resource that generates the events.
    --subscription-name=!: The name of the DMS event notification subscription.
    --tags=: One or more tags to be assigned to the event subscription.
documentation:
    command: |-
        Creates an DMS event notification subscription.

        You can specify the type of source (`SourceType`) you want to be notified of, provide a list of DMS source IDs (`SourceIds`) that triggers the events, and provide a list of event categories (`EventCategories`) for events you want to be notified of. If you specify both the `SourceType` and `SourceIds`, such as `SourceType = replication-instance` and `SourceIdentifier = my-replinstance`, you will be notified of all the replication instance events for the specified source. If you specify a `SourceType` but don't specify a `SourceIdentifier`, you receive notice of the events for that source type for all your DMS sources. If you don't specify either `SourceType` nor `SourceIdentifier`, you will be notified of events generated from all DMS sources belonging to your customer account.

        For more information about DMS events, see [Working with Events and Notifications](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Events.html) in the *Database Migration Service User Guide.*
    flag:
        enabled: A Boolean value; set to `true` to activate the subscription, or set to `false` to create the subscription but not activate it.
        event-categories: A list of event categories for a source type that you want to subscribe to. For more information, see [Working with Events and Notifications](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Events.html) in the *Database Migration Service User Guide.*
        sns-topic-arn: The Amazon Resource Name (ARN) of the Amazon SNS topic created for event notification. The ARN is created by Amazon SNS when you create a topic and subscribe to it.
        source-ids: |-
            A list of identifiers for which DMS provides notification events.

            If you don't specify a value, notifications are provided for all sources.

            If you specify multiple values, they must be of the same type. For example, if you specify a database instance ID, then all of the other values must be database instance IDs.
        source-type: |-
            The type of DMS resource that generates the events. For example, if you want to be notified of events generated by a replication instance, you set this parameter to `replication-instance`. If this value isn't specified, all events are returned.

            Valid values: `replication-instance` | `replication-task`
        subscription-name: The name of the DMS event notification subscription. This name must be less than 255 characters.
        tags: One or more tags to be assigned to the event subscription.
