name: mark-claimed
description: Mark a recommendation's state as CLAIMED.
flags:
    --billing-account=: The Google Cloud Platform billing account ID to use for this invocation.
    --etag=!: Etag of a recommendation
    --folder=: The Google Cloud Platform folder ID to use for this invocation.
    --location=!: Location
    --organization=: The Google Cloud Platform organization ID to use for this invocation.
    --recommender=!: Recommender of recommendation
    --state-metadata=: State metadata for recommendation, in format of --state-metadata=key1=value1,key2=value2
documentation:
    command: |-
        Mark a recommendation's state as CLAIMED. Can be applied to
         recommendations in
         CLAIMED, SUCCEEDED, FAILED, or ACTIVE state. Users can use this method to
         indicate to the Recommender API that they are starting to apply the
         recommendation themselves. This stops the recommendation content from
         being updated.

        ## EXAMPLES
         To mark a recommendation as CLAIMED:

         $ gcloud recommender recommendations mark-claimed abcd-1234 --project=project-id --location=global
         --recommender=google.compute.instance.MachineTypeRecommender --etag=abc123
         --state-metadata=key1=value1,key2=value2
    flag:
        billing-account: The Google Cloud Platform billing account ID to use for this invocation.
        etag: Etag of a recommendation
        folder: The Google Cloud Platform folder ID to use for this invocation.
        location: Location
        organization: The Google Cloud Platform organization ID to use for this invocation.
        recommender: Recommender of recommendation
        state-metadata: State metadata for recommendation, in format of --state-metadata=key1=value1,key2=value2
