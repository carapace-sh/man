name: alloydb
description: Create a Database Migration Service connection profile for AlloyDB.
flags:
    --authorized-network-cidr-ranges=: Comma-separated list of CIDR ranges that can connect to the AlloyDB instance.
    --cluster-labels=: The resource labels for an AlloyDB cluster.
    --cpu-count=!: Whole number value indicating how many vCPUs the machine should
    --database-flags=: Comma-separated list of database flags to set on the AlloyDB primary
    --database-version=: Database engine major version.
    --display-name=: A user-friendly name for the connection profile.
    --enable-outbound-public-ip: If true, Enables an outbound public IP address to support a database
    --enable-public-ip: If true, the AlloyDB instance will be accessible via public IP.
    --kms-key=!: ID of the kms-key or fully qualified identifier for the kms-key.
    --kms-keyring=: The CMEK keyring id of the kms-key.
    --kms-project=: The Cloud project id for the kms-key.
    --labels=: List of label KEY=VALUE pairs to add.
    --network=: The VPC network from which the AlloyDB instance is accessible via private
    --no-async: Waits for the operation in progress to complete before returning.
    --no-enable-outbound-public-ip&: If true, Enables an outbound public IP address to support a database
    --no-enable-public-ip&: If true, the AlloyDB instance will be accessible via public IP.
    --password=!: Initial password for the 'postgres' user.
    --primary-id=!: The ID of the primary instance for this AlloyDB cluster.
    --primary-labels=: The resource labels for an AlloyDB primary instance.
    --region=: The Cloud region for the connection_profile.
    --role=: The role of the connection profile.
completion:
    flag:
        cpu-count:
            - "2"
            - "4"
            - "8"
            - "16"
            - "32"
            - "64"
        database-version:
            - POSTGRES_14
            - POSTGRES_15
            - POSTGRES_16
            - POSTGRES_17
        role:
            - SOURCE
            - DESTINATION
documentation:
    command: Create a Database Migration Service destination connection profile for AlloyDB. This will create an AlloyDB cluster and primary instance.
    flag:
        authorized-network-cidr-ranges: Comma-separated list of CIDR ranges that can connect to the AlloyDB instance.
        cluster-labels: |-
            The resource labels for an AlloyDB cluster. An object containing a list
            of "key": "value" pairs.
        cpu-count: |-
            Whole number value indicating how many vCPUs the machine should
            contain. Each vCPU count corresponds to a N2 high-mem machine:
            (https://cloud.google.com/compute/docs/general-purpose-machines#n2_machines). _CPU_COUNT_ must be one of: *2*, *4*, *8*, *16*, *32*, *64*.
        database-flags: |-
            Comma-separated list of database flags to set on the AlloyDB primary
            instance. Use an equals sign to separate the flag name and value. Flags
            without values, like skip_grant_tables, can be written out without a value,
            e.g., `skip_grant_tables=`. Use on/off values for booleans. View AlloyDB's
            documentation for allowed flags (e.g., `--database-flags
            max_allowed_packet=55555,skip_grant_tables=,log_output=1`).
        database-version: 'Database engine major version. _DATABASE_VERSION_ must be one of: *POSTGRES_14*, *POSTGRES_15*, *POSTGRES_16*, *POSTGRES_17*.'
        display-name: |-
            A user-friendly name for the connection profile. The display name can
            include letters, numbers, spaces, and hyphens, and must start with a letter.
        enable-outbound-public-ip: |-
            If true, Enables an outbound public IP address to support a database
            server sending requests out into the internet.
        enable-public-ip: If true, the AlloyDB instance will be accessible via public IP.
        kms-key: |-
            ID of the kms-key or fully qualified identifier for the kms-key.
            +
            To set the `kms-key` attribute:
            * provide the argument `--kms-key` on the command line.
        kms-keyring: |-
            The CMEK keyring id of the kms-key.
            +
            To set the `kms-keyring` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-keyring` on the command line.
        kms-project: |-
            The Cloud project id for the kms-key.
            +
            To set the `kms-project` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-project` on the command line.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        network: |-
            The VPC network from which the AlloyDB instance is accessible via private
            IP. For example, projects/myProject/global/networks/default. This setting
            cannot be updated after it is set.
        no-async: Waits for the operation in progress to complete before returning.
        no-enable-outbound-public-ip: |
            If true, Enables an outbound public IP address to support a database
            server sending requests out into the internet.
        no-enable-public-ip: |
            If true, the AlloyDB instance will be accessible via public IP.
        password: Initial password for the 'postgres' user.
        primary-id: The ID of the primary instance for this AlloyDB cluster.
        primary-labels: |-
            The resource labels for an AlloyDB primary instance. An object containing a
            list of "key": "value" pairs.
        region: |-
            The Cloud region for the connection_profile.
            +
            To set the `region` attribute:
            * provide the argument `connection_profile` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
        role: 'The role of the connection profile. _ROLE_ must be one of: *SOURCE*, *DESTINATION*.'
