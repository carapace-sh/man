name: list-locations
description: |-
    **This API works with the following fleet types:** Anywhere

    Lists all custom and Amazon Web Services locations where Amazon GameLift Servers can host game servers.
flags:
    --filters=: Filters the list for `AWS` or `CUSTOM` locations.
    --limit=: The maximum number of results to return.
    --next-token=: A token that indicates the start of the next sequential page of results.
documentation:
    command: |-
        **This API works with the following fleet types:** Anywhere

        Lists all custom and Amazon Web Services locations where Amazon GameLift Servers can host game servers.

        Note that if you call this API using a location that doesn't have a service endpoint, such as one that can only be a remote location in a multi-location fleet, the API returns an error.

        Consult the table of supported locations in [Amazon GameLift Servers service locations](https://docs.aws.amazon.com/gamelift/latest/developerguide/gamelift-regions.html) to identify home Regions that support single and multi-location fleets.

        **Learn more**

        [Service locations](https://docs.aws.amazon.com/gamelift/latest/developerguide/gamelift-regions.html)
    flag:
        filters: Filters the list for `AWS` or `CUSTOM` locations. Use this parameter to narrow down results to only Amazon Web Services-managed locations (Amazon EC2 or container) or only your custom locations (such as an Amazon GameLift Servers Anywhere fleet).
        limit: The maximum number of results to return. Use this parameter with `NextToken` to get results as a set of sequential pages.
        next-token: A token that indicates the start of the next sequential page of results. Use the token that is returned with a previous call to this operation. To start at the beginning of the result set, do not specify a value.
