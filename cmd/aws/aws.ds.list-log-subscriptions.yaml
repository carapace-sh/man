name: list-log-subscriptions
description: Lists the active log subscriptions for the Amazon Web Services account.
flags:
    --directory-id=: If a *DirectoryID* is provided, lists only the log subscription associated with that directory.
    --limit=: The maximum number of items returned.
    --next-token=: The token for the next set of items to return.
documentation:
    command: Lists the active log subscriptions for the Amazon Web Services account.
    flag:
        directory-id: If a *DirectoryID* is provided, lists only the log subscription associated with that directory. If no *DirectoryId* is provided, lists all log subscriptions associated with your Amazon Web Services account. If there are no log subscriptions for the Amazon Web Services account or the directory, an empty list will be returned.
        limit: The maximum number of items returned.
        next-token: The token for the next set of items to return.
