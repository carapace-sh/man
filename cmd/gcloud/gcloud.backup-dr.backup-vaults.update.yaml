name: update
description: Update a Backup and DR backup vault.
flags:
    --access-restriction=: Authorize certain sources and destinations for data being sent into, or restored from the current backup vault.
    --backup-min-enforced-retention=: Backups will be kept for this minimum period before they can be deleted.
    --description=: Optional description for the backup vault (2048 characters or less).
    --effective-time=: The time at which the enforced retention period becomes locked.
    --force-update: If set, allow update to extend the minimum enforced retention for backup vault.
    --force-update-access-restriction: If set, the access restriction can be updated even if there are non-compliant data sources.
    --location=: The location of the Backup Vault.
    --no-async: Wait for the operation in progress to complete.
    --no-force-update&: If set, allow update to extend the minimum enforced retention for backup vault.
    --no-force-update-access-restriction&: If set, the access restriction can be updated even if there are non-compliant data sources.
    --no-unlock-backup-min-enforced-retention&: Removes the lock on the backup minimum enforced retention period, and resets the effective time.
    --unlock-backup-min-enforced-retention: Removes the lock on the backup minimum enforced retention period, and resets the effective time.
completion:
    flag:
        access-restriction:
            - within-project
            - within-org
            - unrestricted
            - within-org-but-unrestricted-for-ba
documentation:
    command: Update a Backup and DR backup vault.
    flag:
        access-restriction: |-
            Authorize certain sources and destinations for data being sent into, or restored from the current backup vault.
            +
            Access restrictions can be modified to be more or less restrictive.
            +
                ::: More restrictive access restriction update will fail by default if there will be non compliant Data Sources.
                To allow such updates, use the --force-update-access-restriction flag.
                :::  For Google Cloud Console resources, the following changes are allowed to make access restrictions more restrictive:
                    *   `UNRESTRICTED` to `WITHIN_PROJECT` / `WITHIN_ORG_BUT_UNRESTRICTED_FOR_BA` / `WITHIN_ORGANIZATION`
                    *   `WITHIN_PROJECT` to `WITHIN_ORGANIZATION` / `WITHIN_ORG_BUT_UNRESTRICTED_FOR_BA`
            +
                ::: For Management Server resources, the following changes are allowed to make access restrictions more restrictive:
                    *   `UNRESTRICTED` to `WITHIN_PROJECT` / `WITHIN_ORG_BUT_UNRESTRICTED_FOR_BA` / `WITHIN_ORGANIZATION`
                    *   `WITHIN_PROJECT` to `WITHIN_ORGANIZATION` / `WITHIN_ORG_BUT_UNRESTRICTED_FOR_BA`
            +
                :::   For both Google Cloud Console and Management Server resources, the following changes are allowed to make access restrictions more restrictive:
                    *   `UNRESTRICTED` to `WITHIN_PROJECT` / `WITHIN_ORG_BUT_UNRESTRICTED_FOR_BA` / `WITHIN_ORGANIZATION`
                    *   `WITHIN_PROJECT` to `WITHIN_ORGANIZATION` / `WITHIN_ORG_BUT_UNRESTRICTED_FOR_BA`
            +
                ::: For Google Cloud Console resources,  the following changes are allowed to make access restrictions less restrictive:
                    *   `WITHIN_ORGANIZATION` to `UNRESTRICTED` / `WITHIN_ORG_BUT_UNRESTRICTED_FOR_BA`
                    *   `WITHIN_PROJECT` to `UNRESTRICTED`
                    *   `WITHIN_ORG_BUT_UNRESTRICTED_FOR_BA` to `UNRESTRICTED`
            +
                ::: For Management Server resources, the following changes are allowed to make access restrictions less restrictive:
                    *   `WITHIN_ORG_BUT_UNRESTRICTED_FOR_BA` to `UNRESTRICTED`
            +
            _ACCESS_RESTRICTION_ must be one of: *within-project*, *within-org*, *unrestricted*, *within-org-but-unrestricted-for-ba*.
        backup-min-enforced-retention: Backups will be kept for this minimum period before they can be deleted. Once the effective time is reached, the enforced retention period cannot be decreased or removed. The value must be specified in relative time format (e.g. p1d, p1m, p1m1d).
        description: Optional description for the backup vault (2048 characters or less).
        effective-time: The time at which the enforced retention period becomes locked. This flag is mutually exclusive with --unlock-backup-min-enforced-retention.
        force-update: If set, allow update to extend the minimum enforced retention for backup vault. This overrides the restriction against conflicting retention periods. This conflict may occur when the expiration schedule defined by the associated backup plan is shorter than the minimum retention set by the backup vault.
        force-update-access-restriction: If set, the access restriction can be updated even if there are non-compliant data sources. Backups for those data sources will fail afterward.
        location: |-
            The location of the Backup Vault.
            +
            To set the `location` attribute:
            * provide the argument `backup_vault` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: Wait for the operation in progress to complete.
        no-force-update: If set, allow update to extend the minimum enforced retention for backup vault. This overrides the restriction against conflicting retention periods. This conflict may occur when the expiration schedule defined by the associated backup plan is shorter than the minimum retention set by the backup vault.
        no-force-update-access-restriction: If set, the access restriction can be updated even if there are non-compliant data sources. Backups for those data sources will fail afterward.
        no-unlock-backup-min-enforced-retention: Removes the lock on the backup minimum enforced retention period, and resets the effective time. When unlocked, the enforced retention period can be changed at any time. This flag is mutually exclusive with --effective-time.
        unlock-backup-min-enforced-retention: Removes the lock on the backup minimum enforced retention period, and resets the effective time. When unlocked, the enforced retention period can be changed at any time. This flag is mutually exclusive with --effective-time.
