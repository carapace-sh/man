name: describe
description: '*(BETA)*  Describe the current Artifact Registry configuration for VPC Service Controls.'
flags:
    --location=: ID of the location or fully qualified identifier for the location.
documentation:
    command: |
        *(BETA)*  Describe the current Artifact Registry configuration for VPC Service Controls.

        This command can fail for the following reasons:
          * Lack of permission - "accesscontextmanager.policies.get".
          * The resource could be outside of the VPC SC perimeter.
          * Lack of permission - "artifactregistry.vpcscconfigs.get"
    flag:
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line;
            * set the property `artifacts/location`.
