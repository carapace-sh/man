name: delete-bandwidth-rate-limit
description: Deletes the bandwidth rate limits of a gateway.
flags:
    --bandwidth-type=!: One of the BandwidthType values that indicates the gateway bandwidth rate limit to delete.
    --gateway-arn=!: ""
documentation:
    command: Deletes the bandwidth rate limits of a gateway. You can delete either the upload and download bandwidth rate limit, or you can delete both. If you delete only one of the limits, the other limit remains unchanged. To specify which gateway to work with, use the Amazon Resource Name (ARN) of the gateway in your request. This operation is supported only for the stored volume, cached volume, and tape gateway types.
    flag:
        bandwidth-type: |-
            One of the BandwidthType values that indicates the gateway bandwidth rate limit to delete.

            Valid Values: `UPLOAD` | `DOWNLOAD` | `ALL`
        gateway-arn: ""
