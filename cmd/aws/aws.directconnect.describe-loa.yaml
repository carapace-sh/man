name: describe-loa
description: Gets the LOA-CFA for a connection, interconnect, or link aggregation group (LAG).
flags:
    --connection-id=!: The ID of a connection, LAG, or interconnect.
    --loa-content-type=: The standard media type for the LOA-CFA document.
    --provider-name=: The name of the service provider who establishes connectivity on your behalf.
completion:
    flag:
        loa-content-type:
            - application/pdf
documentation:
    command: |-
        Gets the LOA-CFA for a connection, interconnect, or link aggregation group (LAG).

        The Letter of Authorization - Connecting Facility Assignment (LOA-CFA) is a document that is used when establishing your cross connect to Amazon Web Services at the colocation facility. For more information, see [Requesting Cross Connects at Direct Connect Locations](https://docs.aws.amazon.com/directconnect/latest/UserGuide/Colocation.html) in the *Direct Connect User Guide*.
    flag:
        connection-id: The ID of a connection, LAG, or interconnect.
        loa-content-type: The standard media type for the LOA-CFA document. The only supported value is application/pdf.
        provider-name: The name of the service provider who establishes connectivity on your behalf. If you specify this parameter, the LOA-CFA lists the provider name alongside your company name as the requester of the cross connect.
