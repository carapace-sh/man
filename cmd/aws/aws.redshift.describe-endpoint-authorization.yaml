name: describe-endpoint-authorization
description: Describes an endpoint authorization.
flags:
    --account=: The Amazon Web Services account ID of either the cluster owner (grantor) or grantee.
    --cluster-identifier=: The cluster identifier of the cluster to access.
    --grantee=: Indicates whether to check authorization from a grantor or grantee point of view.
    --marker=: An optional pagination token provided by a previous `DescribeEndpointAuthorization` request.
    --max-records=: The maximum number of records to include in the response.
documentation:
    command: Describes an endpoint authorization.
    flag:
        account: The Amazon Web Services account ID of either the cluster owner (grantor) or grantee. If `Grantee` parameter is true, then the `Account` value is of the grantor.
        cluster-identifier: The cluster identifier of the cluster to access.
        grantee: Indicates whether to check authorization from a grantor or grantee point of view. If true, Amazon Redshift returns endpoint authorizations that you've been granted. If false (default), checks authorization from a grantor point of view.
        marker: An optional pagination token provided by a previous `DescribeEndpointAuthorization` request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by the `MaxRecords` parameter.
        max-records: The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a `Marker` is included in the response so that the remaining results can be retrieved.
