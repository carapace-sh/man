name: stop-event-data-store-ingestion
description: Stops the ingestion of live events on an event data store specified as either an ARN or the ID portion of the ARN.
flags:
    --event-data-store=!: The ARN (or ID suffix of the ARN) of the event data store for which you want to stop ingestion.
documentation:
    command: Stops the ingestion of live events on an event data store specified as either an ARN or the ID portion of the ARN. To stop ingestion, the event data store `Status` must be `ENABLED` and the `eventCategory` must be `Management`, `Data`, `NetworkActivity`, or `ConfigurationItem`.
    flag:
        event-data-store: The ARN (or ID suffix of the ARN) of the event data store for which you want to stop ingestion.
