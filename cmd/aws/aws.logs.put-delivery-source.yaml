name: put-delivery-source
description: Creates or updates a logical *delivery source*.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --log-type=!: Defines the type of log that the source is sending.
    --name=!: A name for this delivery source.
    --resource-arn=!: The ARN of the Amazon Web Services resource that is generating and sending logs.
    --tags=: An optional list of key-value pairs to associate with the resource.
documentation:
    command: |-
        Creates or updates a logical *delivery source*. A delivery source represents an Amazon Web Services resource that sends logs to an logs delivery destination. The destination can be CloudWatch Logs, Amazon S3, Firehose or X-Ray for sending traces.

        To configure logs delivery between a delivery destination and an Amazon Web Services service that is supported as a delivery source, you must do the following:

        - Use `PutDeliverySource` to create a delivery source, which is a logical object that represents the resource that is actually sending the logs.
        - Use `PutDeliveryDestination` to create a *delivery destination*, which is a logical object that represents the actual delivery destination. For more information, see [PutDeliveryDestination](https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_PutDeliveryDestination.html).
        - If you are delivering logs cross-account, you must use [PutDeliveryDestinationPolicy](https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_PutDeliveryDestinationPolicy.html) in the destination account to assign an IAM policy to the destination. This policy allows delivery to that destination.
        - Use `CreateDelivery` to create a *delivery* by pairing exactly one delivery source and one delivery destination. For more information, see [CreateDelivery](https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_CreateDelivery.html).

        You can configure a single delivery source to send logs to multiple destinations by creating multiple deliveries. You can also create multiple deliveries to configure multiple delivery sources to send logs to the same delivery destination.

        Only some Amazon Web Services services support being configured as a delivery source. These services are listed as **Supported \[V2 Permissions]** in the table at [Enabling logging from Amazon Web Services services.](https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/AWS-logs-and-resource-policy.html)

        If you use this operation to update an existing delivery source, all the current delivery source parameters are overwritten with the new parameter values that you specify.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        log-type: |-
            Defines the type of log that the source is sending.

            - For Amazon Bedrock, the valid value is `APPLICATION_LOGS` and `TRACES`.
            - For CloudFront, the valid value is `ACCESS_LOGS`.
            - For Amazon CodeWhisperer, the valid value is `EVENT_LOGS`.
            - For Elemental MediaPackage, the valid values are `EGRESS_ACCESS_LOGS` and `INGRESS_ACCESS_LOGS`.
            - For Elemental MediaTailor, the valid values are `AD_DECISION_SERVER_LOGS`, `MANIFEST_SERVICE_LOGS`, and `TRANSCODE_LOGS`.
            - For Entity Resolution, the valid value is `WORKFLOW_LOGS`.
            - For IAM Identity Center, the valid value is `ERROR_LOGS`.
            - For PCS, the valid values are `PCS_SCHEDULER_LOGS` and `PCS_JOBCOMP_LOGS`.
            - For Amazon Q, the valid value is `EVENT_LOGS`.
            - For Amazon SES mail manager, the valid values are `APPLICATION_LOG` and `TRAFFIC_POLICY_DEBUG_LOGS`.
            - For Amazon WorkMail, the valid values are `ACCESS_CONTROL_LOGS`, `AUTHENTICATION_LOGS`, `WORKMAIL_AVAILABILITY_PROVIDER_LOGS`, `WORKMAIL_MAILBOX_ACCESS_LOGS`, and `WORKMAIL_PERSONAL_ACCESS_TOKEN_LOGS`.
            - For Amazon VPC Route Server, the valid value is `EVENT_LOGS`.
        name: A name for this delivery source. This name must be unique for all delivery sources in your account.
        resource-arn: The ARN of the Amazon Web Services resource that is generating and sending logs. For example, `arn:aws:workmail:us-east-1:123456789012:organization/m-1234EXAMPLEabcd1234abcd1234abcd1234`
        tags: |-
            An optional list of key-value pairs to associate with the resource.

            For more information about tagging, see [Tagging Amazon Web Services resources](https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html)
