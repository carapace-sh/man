name: enable-route-server-propagation
description: Defines which route tables the route server can update with routes.
flags:
    --dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --no-dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --route-server-id=!: The ID of the route server for which to enable propagation.
    --route-table-id=!: The ID of the route table to which route server will propagate routes.
documentation:
    command: |-
        Defines which route tables the route server can update with routes.

        When enabled, route server propagation installs the routes in the FIB on the route table you've specified. Route server supports IPv4 and IPv6 route propagation.

        For more information see [Dynamic routing in your VPC with VPC Route Server](https://docs.aws.amazon.com/vpc/latest/userguide/dynamic-routing-route-server.html) in the *Amazon VPC User Guide*.
    flag:
        dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        route-server-id: The ID of the route server for which to enable propagation.
        route-table-id: The ID of the route table to which route server will propagate routes.
