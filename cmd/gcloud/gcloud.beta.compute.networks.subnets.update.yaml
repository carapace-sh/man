    --logging-metadata-fields=: Can only be specified if VPC Flow Logs for this subnetwork is enabled
    --logging-metadata=: Can only be specified if VPC Flow Logs for this subnetwork is
    --no-allow-cidr-routes-overlap&: Allow/disallow this subnetwork's IP address ranges to conflict with existing static routes.
