name: start-simulation
description: Starts a simulation with the given name.
flags:
    --client-token=: A value that you provide to ensure that repeated calls to this API operation using the same parameters complete only once.
    --description=: The description of the simulation.
    --maximum-duration=: The maximum running time of the simulation, specified as a number of minutes (m or M), hours (h or H), or days (d or D).
    --name=!: The name of the simulation.
    --role-arn=!: The Amazon Resource Name (ARN) of the Identity and Access Management (IAM) role that the simulation assumes to perform actions.
    --schema-s3-location=: The location of the simulation schema in Amazon Simple Storage Service (Amazon S3).
    --snapshot-s3-location=: The location of the snapshot .zip file in Amazon Simple Storage Service (Amazon S3).
    --tags=: A list of tags for the simulation.
documentation:
    command: Starts a simulation with the given name. You must choose to start your simulation from a schema or from a snapshot. For more information about the schema, see the [schema reference](https://docs.aws.amazon.com/simspaceweaver/latest/userguide/schema-reference.html) in the *SimSpace Weaver User Guide*. For more information about snapshots, see [Snapshots](https://docs.aws.amazon.com/simspaceweaver/latest/userguide/working-with_snapshots.html) in the *SimSpace Weaver User Guide*.
    flag:
        client-token: A value that you provide to ensure that repeated calls to this API operation using the same parameters complete only once. A `ClientToken` is also known as an *idempotency token*. A `ClientToken` expires after 24 hours.
        description: The description of the simulation.
        maximum-duration: The maximum running time of the simulation, specified as a number of minutes (m or M), hours (h or H), or days (d or D). The simulation stops when it reaches this limit. The maximum value is `14D`, or its equivalent in the other units. The default value is `14D`. A value equivalent to `0` makes the simulation immediately transition to `Stopping` as soon as it reaches `Started`.
        name: The name of the simulation.
        role-arn: The Amazon Resource Name (ARN) of the Identity and Access Management (IAM) role that the simulation assumes to perform actions. For more information about ARNs, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference*. For more information about IAM roles, see [IAM roles](https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles.html) in the *Identity and Access Management User Guide*.
        schema-s3-location: |-
            The location of the simulation schema in Amazon Simple Storage Service (Amazon S3). For more information about Amazon S3, see the [*Amazon Simple Storage Service User Guide*](https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html) .

            Provide a `SchemaS3Location` to start your simulation from a schema.

            If you provide a `SchemaS3Location` then you can't provide a `SnapshotS3Location`.
        snapshot-s3-location: |-
            The location of the snapshot .zip file in Amazon Simple Storage Service (Amazon S3). For more information about Amazon S3, see the [*Amazon Simple Storage Service User Guide*](https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html) .

            Provide a `SnapshotS3Location` to start your simulation from a snapshot.

            The Amazon S3 bucket must be in the same Amazon Web Services Region as the simulation.

            If you provide a `SnapshotS3Location` then you can't provide a `SchemaS3Location`.
        tags: A list of tags for the simulation. For more information about tags, see [Tagging Amazon Web Services resources](https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html) in the *Amazon Web Services General Reference*.
