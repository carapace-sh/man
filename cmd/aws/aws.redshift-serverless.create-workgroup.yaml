name: create-workgroup
description: Creates an workgroup in Amazon Redshift Serverless.
flags:
    --base-capacity=: The base data warehouse capacity of the workgroup in Redshift Processing Units (RPUs).
    --config-parameters=: An array of parameters to set for advanced control over a database.
    --enhanced-vpc-routing: The value that specifies whether to turn on enhanced virtual private cloud (VPC) routing, which forces Amazon Redshift Serverless to route traffic through your VPC instead of over the internet.
    --ip-address-type=: The IP address type that the workgroup supports.
    --max-capacity=: The maximum data-warehouse capacity Amazon Redshift Serverless uses to serve queries.
    --namespace-name=!: The name of the namespace to associate with the workgroup.
    --no-enhanced-vpc-routing&: The value that specifies whether to turn on enhanced virtual private cloud (VPC) routing, which forces Amazon Redshift Serverless to route traffic through your VPC instead of over the internet.
    --no-publicly-accessible&: A value that specifies whether the workgroup can be accessed from a public network.
    --port=: The custom port to use when connecting to a workgroup.
    --price-performance-target=: An object that represents the price performance target settings for the workgroup.
    --publicly-accessible: A value that specifies whether the workgroup can be accessed from a public network.
    --security-group-ids=: An array of security group IDs to associate with the workgroup.
    --subnet-ids=: An array of VPC subnet IDs to associate with the workgroup.
    --tags=: A array of tag instances.
    --track-name=: An optional parameter for the name of the track for the workgroup.
    --workgroup-name=!: The name of the created workgroup.
documentation:
    command: |-
        Creates an workgroup in Amazon Redshift Serverless.

        VPC Block Public Access (BPA) enables you to block resources in VPCs and subnets that you own in a Region from reaching or being reached from the internet through internet gateways and egress-only internet gateways. If a workgroup is in an account with VPC BPA turned on, the following capabilities are blocked:

        - Creating a public access workgroup
        - Modifying a private workgroup to public
        - Adding a subnet with VPC BPA turned on to the workgroup when the workgroup is public

        For more information about VPC BPA, see [Block public access to VPCs and subnets](https://docs.aws.amazon.com/vpc/latest/userguide/security-vpc-bpa.html) in the *Amazon VPC User Guide*.
    flag:
        base-capacity: The base data warehouse capacity of the workgroup in Redshift Processing Units (RPUs).
        config-parameters: An array of parameters to set for advanced control over a database. The options are `auto_mv`, `datestyle`, `enable_case_sensitive_identifier`, `enable_user_activity_logging`, `query_group`, `search_path`, `require_ssl`, `use_fips_ssl`, and query monitoring metrics that let you define performance boundaries. For more information about query monitoring rules and available metrics, see [Query monitoring metrics for Amazon Redshift Serverless](https://docs.aws.amazon.com/redshift/latest/dg/cm-c-wlm-query-monitoring-rules.html#cm-c-wlm-query-monitoring-metrics-serverless).
        enhanced-vpc-routing: The value that specifies whether to turn on enhanced virtual private cloud (VPC) routing, which forces Amazon Redshift Serverless to route traffic through your VPC instead of over the internet.
        ip-address-type: The IP address type that the workgroup supports. Possible values are `ipv4` and `dualstack`.
        max-capacity: The maximum data-warehouse capacity Amazon Redshift Serverless uses to serve queries. The max capacity is specified in RPUs.
        namespace-name: The name of the namespace to associate with the workgroup.
        port: The custom port to use when connecting to a workgroup. Valid port ranges are 5431-5455 and 8191-8215. The default is 5439.
        price-performance-target: An object that represents the price performance target settings for the workgroup.
        publicly-accessible: A value that specifies whether the workgroup can be accessed from a public network.
        security-group-ids: An array of security group IDs to associate with the workgroup.
        subnet-ids: An array of VPC subnet IDs to associate with the workgroup.
        tags: A array of tag instances.
        track-name: An optional parameter for the name of the track for the workgroup. If you don't provide a track name, the workgroup is assigned to the `current` track.
        workgroup-name: The name of the created workgroup.
