name: create
description: '*(ALPHA)*  Create a Compute Engine snapshot group.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --source-instant-snapshot-group-region=: Region of the source instant snapshot group to operate on.
    --source-instant-snapshot-group-zone=: Zone of the source instant snapshot group to operate on.
    --source-instant-snapshot-group=!: The name or URL of the source instant snapshot group.
documentation:
    command: '*(ALPHA)*  Create a Compute Engine snapshot group.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        source-instant-snapshot-group: |-
            The name or URL of the source instant snapshot group. If the name is provided, the instant snapshot group's zone
            or region must be specified with --source-instant-snapshot-group-zone or
            --source-instant-snapshot-group-region accordingly.
            To create a snapshot group from an instant snapshot group in a different project, specify the full path to the instant snapshot group.
            If the URL is provided, format should be:
            https://www.googleapis.com/compute/v1/projects/MY-PROJECT/zones/MY-ZONE/instantSnapshotGroups/MY-INSTANT-SNAPSHOT-GROUP
        source-instant-snapshot-group-region: Region of the source instant snapshot group to operate on. Overrides the default *compute/region* property value for this command invocation.
        source-instant-snapshot-group-zone: Zone of the source instant snapshot group to operate on. Overrides the default *compute/zone* property value for this command invocation.
