name: deprovision-ipam-pool-cidr
description: Deprovision a CIDR provisioned from an IPAM pool.
flags:
    --cidr=: The CIDR which you want to deprovision from the pool.
    --dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --ipam-pool-id=!: The ID of the pool that has the CIDR you want to deprovision.
    --no-dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
documentation:
    command: Deprovision a CIDR provisioned from an IPAM pool. If you deprovision a CIDR from a pool that has a source pool, the CIDR is recycled back into the source pool. For more information, see [Deprovision pool CIDRs](https://docs.aws.amazon.com/vpc/latest/ipam/depro-pool-cidr-ipam.html) in the *Amazon VPC IPAM User Guide*.
    flag:
        cidr: The CIDR which you want to deprovision from the pool.
        dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        ipam-pool-id: The ID of the pool that has the CIDR you want to deprovision.
