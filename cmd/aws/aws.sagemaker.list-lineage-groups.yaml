name: list-lineage-groups
description: A list of lineage groups shared with your Amazon Web Services account.
flags:
    --created-after=: A timestamp to filter against lineage groups created after a certain point in time.
    --created-before=: A timestamp to filter against lineage groups created before a certain point in time.
    --max-results=: The maximum number of endpoints to return in the response.
    --next-token=: If the response is truncated, SageMaker returns this token.
    --sort-by=: The parameter by which to sort the results.
    --sort-order=: The sort order for the results.
completion:
    flag:
        sort-by:
            - Name
            - CreationTime
        sort-order:
            - Ascending
            - Descending
documentation:
    command: A list of lineage groups shared with your Amazon Web Services account. For more information, see [Cross-Account Lineage Tracking](https://docs.aws.amazon.com/sagemaker/latest/dg/xaccount-lineage-tracking.html) in the *Amazon SageMaker Developer Guide*.
    flag:
        created-after: A timestamp to filter against lineage groups created after a certain point in time.
        created-before: A timestamp to filter against lineage groups created before a certain point in time.
        max-results: The maximum number of endpoints to return in the response. This value defaults to 10.
        next-token: If the response is truncated, SageMaker returns this token. To retrieve the next set of algorithms, use it in the subsequent request.
        sort-by: The parameter by which to sort the results. The default is `CreationTime`.
        sort-order: The sort order for the results. The default is `Ascending`.
