name: create-updated-image
description: Creates a new image with the latest Windows operating system updates, driver updates, and WorkSpaces Applications agent software.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dry-run: Indicates whether to display the status of image update availability before WorkSpaces Applications initiates the process of creating a new updated image.
    --existing-image-name=!: The name of the image to update.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --new-image-description=: The description to display for the new image.
    --new-image-display-name=: The name to display for the new image.
    --new-image-name=!: The name of the new image.
    --new-image-tags=: The tags to associate with the new image.
    --no-dry-run: Indicates whether to display the status of image update availability before WorkSpaces Applications initiates the process of creating a new updated image.
documentation:
    command: |-
        Creates a new image with the latest Windows operating system updates, driver updates, and WorkSpaces Applications agent software.

        For more information, see the "Update an Image by Using Managed WorkSpaces Applications Image Updates" section in [Administer Your WorkSpaces Applications Images](https://docs.aws.amazon.com/appstream2/latest/developerguide/administer-images.html), in the *Amazon WorkSpaces Applications Administration Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dry-run: Indicates whether to display the status of image update availability before WorkSpaces Applications initiates the process of creating a new updated image. If this value is set to `true`, WorkSpaces Applications displays whether image updates are available. If this value is set to `false`, WorkSpaces Applications initiates the process of creating a new updated image without displaying whether image updates are available.
        existing-image-name: The name of the image to update.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        new-image-description: The description to display for the new image.
        new-image-display-name: The name to display for the new image.
        new-image-name: The name of the new image. The name must be unique within the AWS account and Region.
        new-image-tags: |-
            The tags to associate with the new image. A tag is a key-value pair, and the value is optional. For example, Environment=Test. If you do not specify a value, Environment=.

            Generally allowed characters are: letters, numbers, and spaces representable in UTF-8, and the following special characters:

            _ . : / = + \\ - @

            If you do not specify a value, the value is set to an empty string.

            For more information about tags, see [Tagging Your Resources](https://docs.aws.amazon.com/appstream2/latest/developerguide/tagging-basic.html) in the *Amazon WorkSpaces Applications Administration Guide*.
