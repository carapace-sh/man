name: delete-predefined-attribute
description: Deletes a predefined attribute from the specified Amazon Connect instance.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --name=!: The name of the predefined attribute.
documentation:
    command: Deletes a predefined attribute from the specified Amazon Connect instance.
    flag:
