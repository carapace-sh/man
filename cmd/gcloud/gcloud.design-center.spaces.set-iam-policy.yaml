name: set-iam-policy
description: Set the IAM policy for a Design Center space as defined in a JSON/YAML file.
flags:
    --location=: The Cloud location for the space.
documentation:
    command: |4
         Set the IAM policy for a Design Center space as defined in a JSON/YAML file.

        See https://cloud.google.com/iam/docs/managing-policies for details of
          the policy file format and contents.
    flag:
        location: |-
            The Cloud location for the space.
            +
            To set the `location` attribute:
            * provide the argument `space` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
