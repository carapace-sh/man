name: describe-app-version-resource
description: Describes a resource of the Resilience Hub application.
flags:
    --app-arn=!: Amazon Resource Name (ARN) of the Resilience Hub application.
    --app-version=!: Resilience Hub application version.
    --aws-account-id=: Amazon Web Services account that owns the physical resource.
    --aws-region=: Amazon Web Services region that owns the physical resource.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --logical-resource-id=: Logical identifier of the resource.
    --physical-resource-id=: Physical identifier of the resource.
    --resource-name=: Name of the resource.
documentation:
    command: |-
        Describes a resource of the Resilience Hub application.

        This API accepts only one of the following parameters to describe the resource:

        - `resourceName`
        - `logicalResourceId`
        - `physicalResourceId` (Along with `physicalResourceId`, you can also provide `awsAccountId`, and `awsRegion`)
    flag:
        app-arn: 'Amazon Resource Name (ARN) of the Resilience Hub application. The format for this ARN is: arn:`partition`:resiliencehub:`region`:`account`:app/`app-id`. For more information about ARNs, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference* guide.'
        app-version: Resilience Hub application version.
        aws-account-id: Amazon Web Services account that owns the physical resource.
        aws-region: Amazon Web Services region that owns the physical resource.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        logical-resource-id: Logical identifier of the resource.
        physical-resource-id: Physical identifier of the resource.
        resource-name: Name of the resource.
