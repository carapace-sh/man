name: associate-vpc-cidr-block
description: Associates a CIDR block with your VPC.
flags:
    --amazon-provided-ipv6-cidr-block: Requests an Amazon-provided IPv6 CIDR block with a /56 prefix length for the VPC.
    --cidr-block=: An IPv4 CIDR block to associate with the VPC.
    --ipv4-ipam-pool-id=: Associate a CIDR allocated from an IPv4 IPAM pool to a VPC.
    --ipv4-netmask-length=: The netmask length of the IPv4 CIDR you would like to associate from an Amazon VPC IP Address Manager (IPAM) pool.
    --ipv6-cidr-block-network-border-group=: The name of the location from which we advertise the IPV6 CIDR block.
    --ipv6-cidr-block=: An IPv6 CIDR block from the IPv6 address pool.
    --ipv6-ipam-pool-id=: Associates a CIDR allocated from an IPv6 IPAM pool to a VPC.
    --ipv6-netmask-length=: The netmask length of the IPv6 CIDR you would like to associate from an Amazon VPC IP Address Manager (IPAM) pool.
    --ipv6-pool=: The ID of an IPv6 address pool from which to allocate the IPv6 CIDR block.
    --no-amazon-provided-ipv6-cidr-block&: Requests an Amazon-provided IPv6 CIDR block with a /56 prefix length for the VPC.
    --vpc-id=!: The ID of the VPC.
documentation:
    command: |-
        Associates a CIDR block with your VPC. You can associate a secondary IPv4 CIDR block, an Amazon-provided IPv6 CIDR block, or an IPv6 CIDR block from an IPv6 address pool that you provisioned through bring your own IP addresses ([BYOIP](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-byoip.html)).

        You must specify one of the following in the request: an IPv4 CIDR block, an IPv6 pool, or an Amazon-provided IPv6 CIDR block.

        For more information about associating CIDR blocks with your VPC and applicable restrictions, see [IP addressing for your VPCs and subnets](https://docs.aws.amazon.com/vpc/latest/userguide/vpc-ip-addressing.html) in the *Amazon VPC User Guide*.
    flag:
        amazon-provided-ipv6-cidr-block: Requests an Amazon-provided IPv6 CIDR block with a /56 prefix length for the VPC. You cannot specify the range of IPv6 addresses or the size of the CIDR block.
        cidr-block: An IPv4 CIDR block to associate with the VPC.
        ipv4-ipam-pool-id: Associate a CIDR allocated from an IPv4 IPAM pool to a VPC. For more information about Amazon VPC IP Address Manager (IPAM), see [What is IPAM?](https://docs.aws.amazon.com/vpc/latest/ipam/what-is-it-ipam.html) in the *Amazon VPC IPAM User Guide*.
        ipv4-netmask-length: The netmask length of the IPv4 CIDR you would like to associate from an Amazon VPC IP Address Manager (IPAM) pool. For more information about IPAM, see [What is IPAM?](https://docs.aws.amazon.com/vpc/latest/ipam/what-is-it-ipam.html) in the *Amazon VPC IPAM User Guide*.
        ipv6-cidr-block: |-
            An IPv6 CIDR block from the IPv6 address pool. You must also specify `Ipv6Pool` in the request.

            To let Amazon choose the IPv6 CIDR block for you, omit this parameter.
        ipv6-cidr-block-network-border-group: |-
            The name of the location from which we advertise the IPV6 CIDR block. Use this parameter to limit the CIDR block to this location.

            You must set `AmazonProvidedIpv6CidrBlock` to `true` to use this parameter.

            You can have one IPv6 CIDR block association per network border group.
        ipv6-ipam-pool-id: Associates a CIDR allocated from an IPv6 IPAM pool to a VPC. For more information about Amazon VPC IP Address Manager (IPAM), see [What is IPAM?](https://docs.aws.amazon.com/vpc/latest/ipam/what-is-it-ipam.html) in the *Amazon VPC IPAM User Guide*.
        ipv6-netmask-length: The netmask length of the IPv6 CIDR you would like to associate from an Amazon VPC IP Address Manager (IPAM) pool. For more information about IPAM, see [What is IPAM?](https://docs.aws.amazon.com/vpc/latest/ipam/what-is-it-ipam.html) in the *Amazon VPC IPAM User Guide*.
        ipv6-pool: The ID of an IPv6 address pool from which to allocate the IPv6 CIDR block.
        vpc-id: The ID of the VPC.
