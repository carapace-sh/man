name: upgrade-published-schema
description: Upgrades a published schema under a new minor version revision using the current contents of `DevelopmentSchemaArn`.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --development-schema-arn=!: The ARN of the development schema with the changes used for the upgrade.
    --dry-run: Used for testing whether the Development schema provided is backwards compatible, or not, with the publish schema provided by the user to be upgraded.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --minor-version=!: Identifies the minor version of the published schema that will be created.
    --no-dry-run: Used for testing whether the Development schema provided is backwards compatible, or not, with the publish schema provided by the user to be upgraded.
    --published-schema-arn=!: The ARN of the published schema to be upgraded.
documentation:
    command: Upgrades a published schema under a new minor version revision using the current contents of `DevelopmentSchemaArn`.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        development-schema-arn: The ARN of the development schema with the changes used for the upgrade.
        dry-run: Used for testing whether the Development schema provided is backwards compatible, or not, with the publish schema provided by the user to be upgraded. If schema compatibility fails, an exception would be thrown else the call would succeed. This parameter is optional and defaults to false.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        minor-version: Identifies the minor version of the published schema that will be created. This parameter is NOT optional.
        published-schema-arn: The ARN of the published schema to be upgraded.
