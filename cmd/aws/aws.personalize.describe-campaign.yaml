name: describe-campaign
description: Describes the given campaign, including its status.
flags:
    --campaign-arn=!: The Amazon Resource Name (ARN) of the campaign.
documentation:
    command: |-
        Describes the given campaign, including its status.

        A campaign can be in one of the following states:

        - CREATE PENDING &gt; CREATE IN\_PROGRESS &gt; ACTIVE -or- CREATE FAILED
        - DELETE PENDING &gt; DELETE IN\_PROGRESS

        When the `status` is `CREATE FAILED`, the response includes the `failureReason` key, which describes why.

        For more information on campaigns, see [CreateCampaign](https://docs.aws.amazon.com/personalize/latest/dg/API_CreateCampaign.html).
    flag:
        campaign-arn: The Amazon Resource Name (ARN) of the campaign.
