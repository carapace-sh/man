name: query
description: '`Query` is a synchronous operation that enables you to run a query against your Amazon Timestream data.'
flags:
    --client-token=: Unique, case-sensitive string of up to 64 ASCII characters specified when a `Query` request is made.
    --max-rows=: The total number of rows to be returned in the `Query` output.
    --next-token=: A pagination token used to return a set of results.
    --query-insights=: Encapsulates settings for enabling `QueryInsights`.
    --query-string=!: The query to be run by Timestream.
documentation:
    command: "`Query` is a synchronous operation that enables you to run a query against your Amazon Timestream data.\n\nIf you enabled `QueryInsights`, this API also returns insights and metrics related to the query that you executed. `QueryInsights` helps with performance tuning of your query. For more information about `QueryInsights`, see [Using query insights to optimize queries in Amazon Timestream](https://docs.aws.amazon.com/timestream/latest/developerguide/using-query-insights.html).\n\nThe maximum number of `Query` API requests you're allowed to make with `QueryInsights` enabled is 1 query per second (QPS). If you exceed this query rate, it might result in throttling.\n\n`Query` will time out after 60 seconds. You must update the default timeout in the SDK to support a timeout of 60 seconds. See the [code sample](https://docs.aws.amazon.com/timestream/latest/developerguide/code-samples.run-query.html) for details.\n\nYour query request will fail in the following cases:\n\n- If you submit a `Query` request with the same client token outside of the 5-minute idempotency window.\n- If you submit a `Query` request with the same client token, but change other parameters, within the 5-minute idempotency window.\n- If the size of the row (including the query metadata) exceeds 1 MB, then the query will fail with the following error message:\n  \n  `Query aborted as max page response size has been exceeded by the output result row`\n- If the IAM principal of the query initiator and the result reader are not the same and/or the query initiator and the result reader do not have the same query string in the query requests, the query will fail with an `Invalid pagination token` error."
    flag:
        client-token: |-
            Unique, case-sensitive string of up to 64 ASCII characters specified when a `Query` request is made. Providing a `ClientToken` makes the call to `Query` *idempotent*. This means that running the same query repeatedly will produce the same result. In other words, making multiple identical `Query` requests has the same effect as making a single request. When using `ClientToken` in a query, note the following:

            - If the Query API is instantiated without a `ClientToken`, the Query SDK generates a `ClientToken` on your behalf.
            - If the `Query` invocation only contains the `ClientToken` but does not include a `NextToken`, that invocation of `Query` is assumed to be a new query run.
            - If the invocation contains `NextToken`, that particular invocation is assumed to be a subsequent invocation of a prior call to the Query API, and a result set is returned.
            - After 4 hours, any request with the same `ClientToken` is treated as a new request.
        max-rows: |-
            The total number of rows to be returned in the `Query` output. The initial run of `Query` with a `MaxRows` value specified will return the result set of the query in two cases:

            - The size of the result is less than `1MB`.
            - The number of rows in the result set is less than the value of `maxRows`.

            Otherwise, the initial invocation of `Query` only returns a `NextToken`, which can then be used in subsequent calls to fetch the result set. To resume pagination, provide the `NextToken` value in the subsequent command.

            If the row size is large (e.g. a row has many columns), Timestream may return fewer rows to keep the response size from exceeding the 1 MB limit. If `MaxRows` is not provided, Timestream will send the necessary number of rows to meet the 1 MB limit.
        next-token: |-
            A pagination token used to return a set of results. When the `Query` API is invoked using `NextToken`, that particular invocation is assumed to be a subsequent invocation of a prior call to `Query`, and a result set is returned. However, if the `Query` invocation only contains the `ClientToken`, that invocation of `Query` is assumed to be a new query run.

            Note the following when using NextToken in a query:

            - A pagination token can be used for up to five `Query` invocations, OR for a duration of up to 1 hour – whichever comes first.
            - Using the same `NextToken` will return the same set of records. To keep paginating through the result set, you must to use the most recent `nextToken`.
            - Suppose a `Query` invocation returns two `NextToken` values, `TokenA` and `TokenB`. If `TokenB` is used in a subsequent `Query` invocation, then `TokenA` is invalidated and cannot be reused.
            - To request a previous result set from a query after pagination has begun, you must re-invoke the Query API.
            - The latest `NextToken` should be used to paginate until `null` is returned, at which point a new `NextToken` should be used.
            - If the IAM principal of the query initiator and the result reader are not the same and/or the query initiator and the result reader do not have the same query string in the query requests, the query will fail with an `Invalid pagination token` error.
        query-insights: |-
            Encapsulates settings for enabling `QueryInsights`.

            Enabling `QueryInsights` returns insights and metrics in addition to query results for the query that you executed. You can use `QueryInsights` to tune your query performance.
        query-string: The query to be run by Timestream.
