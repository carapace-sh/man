name: write-get-object-response
description: This operation is not supported for directory buckets.
flags:
    --accept-ranges=: Indicates that a range of bytes was specified.
    --body=: The object data.
    --bucket-key-enabled=: Indicates whether the object stored in Amazon S3 uses an S3 bucket key for server-side encryption with Amazon Web Services KMS (SSE-KMS).
    --cache-control=: Specifies caching behavior along the request/reply chain.
    --checksum-crc32-c=: This header can be used as a data integrity check to verify that the data received is the same data that was originally sent.
    --checksum-crc32=: This header can be used as a data integrity check to verify that the data received is the same data that was originally sent.
    --checksum-crc64-nvme=: This header can be used as a data integrity check to verify that the data received is the same data that was originally sent.
    --checksum-sha1=: This header can be used as a data integrity check to verify that the data received is the same data that was originally sent.
    --checksum-sha256=: This header can be used as a data integrity check to verify that the data received is the same data that was originally sent.
    --content-disposition=: Specifies presentational information for the object.
    --content-encoding=: Specifies what content encodings have been applied to the object and thus what decoding mechanisms must be applied to obtain the media-type referenced by the Content-Type header field.
    --content-language=: The language the content is in.
    --content-length=: The size of the content body in bytes.
    --content-range=: The portion of the object returned in the response.
    --content-type=: A standard MIME type describing the format of the object data.
    --delete-marker=: Specifies whether an object stored in Amazon S3 is (`true`) or is not (`false`) a delete marker.
    --error-code=: A string that uniquely identifies an error condition.
    --error-message=: Contains a generic description of the error condition.
    --etag=: An opaque identifier assigned by a web server to a specific version of a resource found at a URL.
    --expiration=: If the object expiration is configured (see PUT Bucket lifecycle), the response includes this header.
    --expires=: The date and time at which the object is no longer cacheable.
    --last-modified=: The date and time that the object was last modified.
    --metadata=: A map of metadata to store with the object in S3.
    --missing-meta=: Set to the number of metadata entries not returned in `x-amz-meta` headers.
    --object-lock-legal-hold-status=: Indicates whether an object stored in Amazon S3 has an active legal hold.
    --object-lock-mode=: Indicates whether an object stored in Amazon S3 has Object Lock enabled.
    --object-lock-retain-until-date=: The date and time when Object Lock is configured to expire.
    --parts-count=: The count of parts this object has.
    --replication-status=: Indicates if request involves bucket that is either a source or destination in a Replication rule.
    --request-charged=: ""
    --request-route=!: Route prefix to the HTTP URL generated.
    --request-token=!: A single use encrypted token that maps `WriteGetObjectResponse` to the end user `GetObject` request.
    --restore=: Provides information about object restoration operation and expiration time of the restored object copy.
    --server-side-encryption=: The server-side encryption algorithm used when storing requested object in Amazon S3 or Amazon FSx.
    --ssecustomer-algorithm=: Encryption algorithm used if server-side encryption with a customer-provided encryption key was specified for object stored in Amazon S3.
    --ssecustomer-key-md5=: 128-bit MD5 digest of customer-provided encryption key used in Amazon S3 to encrypt data stored in S3.
    --ssekmskey-id=: If present, specifies the ID (Key ID, Key ARN, or Key Alias) of the Amazon Web Services Key Management Service (Amazon Web Services KMS) symmetric encryption customer managed key that was used for stored in Amazon S3 object.
    --status-code=: The integer status code for an HTTP response of a corresponding `GetObject` request.
    --storage-class=: Provides storage class information of the object.
    --tag-count=: The number of tags, if any, on the object.
    --version-id=: An ID used to reference a specific version of the object.
