name: create
description: '*(ALPHA)*  Create a new association between a network policy and a network.'
flags:
    --name=: Name of the new association.
    --network-policy-region=: Region of the network policy to create.
    --network-policy=!: Network Policy ID with which to create association for association.
    --network=!: Name of the network with which the association is created.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute network-policies associations create* is used to create network policy associations. A network policy is
        a set of rules that controls access to various resources.
    flag:
        name: |-
            Name of the new association. If not specified, the name will be
            auto-generated.
        network: Name of the network with which the association is created.
        network-policy: Network Policy ID with which to create association for association.
        network-policy-region: Region of the network policy to create. Overrides the default *compute/region* property value for this command invocation.
