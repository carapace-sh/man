name: accept-spoke-update
description: '*(BETA)*  Accept a proposal to update a spoke in a hub.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --spoke-etag=!: Etag of the spoke to accept update
    --spoke=!: URI of the spoke to accept update
documentation:
    command: |-
        *(BETA)*  Accept a proposed or previously rejected VPC spoke update. By accepting a
        spoke update, you permit updating connectivity between the associated VPC
        network and other VPC networks that are attached to the same hub.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        spoke: URI of the spoke to accept update
        spoke-etag: Etag of the spoke to accept update
