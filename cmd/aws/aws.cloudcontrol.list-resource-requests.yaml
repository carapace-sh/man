name: list-resource-requests
description: Returns existing resource operation requests.
flags:
    --max-results=: The maximum number of results to be returned with a single call.
    --next-token=: If the previous paginated request didn't return all of the remaining results, the response object's `NextToken` parameter value is set to a token.
    --resource-request-status-filter=: The filter criteria to apply to the requests returned.
documentation:
    command: |-
        Returns existing resource operation requests. This includes requests of all status types. For more information, see [Listing active resource operation requests](https://docs.aws.amazon.com/cloudcontrolapi/latest/userguide/resource-operations-manage-requests.html#resource-operations-manage-requests-list) in the *Amazon Web Services Cloud Control API User Guide*.

        Resource operation requests expire after 7 days.
    flag:
        max-results: |-
            The maximum number of results to be returned with a single call. If the number of available results exceeds this maximum, the response includes a `NextToken` value that you can assign to the `NextToken` request parameter to get the next set of results.

            The default is `20`.
        next-token: If the previous paginated request didn't return all of the remaining results, the response object's `NextToken` parameter value is set to a token. To retrieve the next set of results, call this action again and assign that token to the request object's `NextToken` parameter. If there are no remaining results, the previous response object's `NextToken` parameter is set to `null`.
        resource-request-status-filter: The filter criteria to apply to the requests returned.
