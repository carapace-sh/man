name: report
description: '*(BETA)*  Report an error.'
flags:
    --message-file=: File containing details of the error
    --message=: Inline details of the error
    --service-version=: The release version of the service
    --service=!: The name of the service that generated the error
documentation:
    command: |-
        *(BETA)*  gcloud beta error-reporting events report is used to report errors using the error-reporting service.
        The required arguments are a service name and either an
        error-file containing details of an error or an inline error message.

        The error message must contain a header (typically consisting of the
        exception type name and an error message) and an exception stack trace in one
        of the supported programming languages and formats. Details about supported
        languages and formats can be found at
        https://cloud.google.com/error-reporting/docs/formatting-error-messages

        ## EXAMPLES

        To report an error, run:

          $ gcloud beta error-reporting events report --service=SERVICE_NAME --message="Error message"

        or:

          $ gcloud beta error-reporting events report --service=SERVICE_NAME --message-file=ERROR_MESSAGE.EXT
    flag:
        message: Inline details of the error
        message-file: File containing details of the error
        service: The name of the service that generated the error
        service-version: The release version of the service
