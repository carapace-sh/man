name: create-stage
description: Creates a Stage for an API.
flags:
    --access-log-settings=: Settings for logging access in this stage.
    --api-id=!: The API identifier.
    --auto-deploy: Specifies whether updates to an API automatically trigger a new deployment.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-certificate-id=: The identifier of a client certificate for a Stage.
    --default-route-settings=: The default route settings for the stage.
    --deployment-id=: The deployment identifier of the API stage.
    --description=: The description for the API stage.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-auto-deploy: Specifies whether updates to an API automatically trigger a new deployment.
    --route-settings=: Route settings for the stage, by routeKey.
    --stage-name=!: The name of the stage.
    --stage-variables=: A map that defines the stage variables for a Stage.
    --tags=: The collection of tags.
documentation:
    command: Creates a Stage for an API.
    flag:
        access-log-settings: Settings for logging access in this stage.
        api-id: The API identifier.
        auto-deploy: Specifies whether updates to an API automatically trigger a new deployment. The default value is false.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-certificate-id: The identifier of a client certificate for a Stage. Supported only for WebSocket APIs.
        default-route-settings: The default route settings for the stage.
        deployment-id: The deployment identifier of the API stage.
        description: The description for the API stage.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        route-settings: Route settings for the stage, by routeKey.
        stage-name: The name of the stage.
        stage-variables: A map that defines the stage variables for a Stage. Variable names can have alphanumeric and underscore characters, and the values must match \[A-Za-z0-9-.\_~:/?#&amp;=,]+.
        tags: The collection of tags. Each tag element is associated with a given resource.
