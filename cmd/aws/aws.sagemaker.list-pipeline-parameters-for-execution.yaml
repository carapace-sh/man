name: list-pipeline-parameters-for-execution
description: Gets a list of parameters for a pipeline execution.
flags:
    --max-results=: The maximum number of parameters to return in the response.
    --next-token=: If the result of the previous `ListPipelineParametersForExecution` request was truncated, the response includes a `NextToken`.
    --pipeline-execution-arn=!: The Amazon Resource Name (ARN) of the pipeline execution.
documentation:
    command: Gets a list of parameters for a pipeline execution.
    flag:
        max-results: The maximum number of parameters to return in the response.
        next-token: If the result of the previous `ListPipelineParametersForExecution` request was truncated, the response includes a `NextToken`. To retrieve the next set of parameters, use the token in the next request.
        pipeline-execution-arn: The Amazon Resource Name (ARN) of the pipeline execution.
