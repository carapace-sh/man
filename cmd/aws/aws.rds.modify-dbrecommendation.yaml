name: modify-dbrecommendation
description: Updates the recommendation status and recommended action status for the specified recommendation.
flags:
    --locale=: The language of the modified recommendation.
    --recommendation-id=!: The identifier of the recommendation to update.
    --recommended-action-updates=: The list of recommended action status to update.
    --status=: The recommendation status to update.
documentation:
    command: Updates the recommendation status and recommended action status for the specified recommendation.
    flag:
        locale: The language of the modified recommendation.
        recommendation-id: The identifier of the recommendation to update.
        recommended-action-updates: The list of recommended action status to update. You can update multiple recommended actions at one time.
        status: |-
            The recommendation status to update.

            Valid values:

            - active
            - dismissed
