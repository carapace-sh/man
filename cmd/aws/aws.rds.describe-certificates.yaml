name: describe-certificates
description: Lists the set of certificate authority (CA) certificates provided by Amazon RDS for this Amazon Web Services account.
flags:
    --certificate-identifier=: The user-supplied certificate identifier.
    --filters=: This parameter isn't currently supported.
    --marker=: An optional pagination token provided by a previous `DescribeCertificates` request.
    --max-records=: The maximum number of records to include in the response.
documentation:
    command: |-
        Lists the set of certificate authority (CA) certificates provided by Amazon RDS for this Amazon Web Services account.

        For more information, see [Using SSL/TLS to encrypt a connection to a DB instance](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.SSL.html) in the *Amazon RDS User Guide* and [Using SSL/TLS to encrypt a connection to a DB cluster](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/UsingWithRDS.SSL.html) in the *Amazon Aurora User Guide*.
    flag:
        certificate-identifier: |-
            The user-supplied certificate identifier. If this parameter is specified, information for only the identified certificate is returned. This parameter isn't case-sensitive.

            Constraints:

            - Must match an existing CertificateIdentifier.
        filters: This parameter isn't currently supported.
        marker: An optional pagination token provided by a previous `DescribeCertificates` request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so you can retrieve the remaining results.

            Default: 100

            Constraints: Minimum 20, maximum 100.
