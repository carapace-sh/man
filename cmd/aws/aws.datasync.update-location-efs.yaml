name: update-location-efs
description: Modifies the following configuration parameters of the Amazon EFS transfer location that you're using with DataSync.
flags:
    --access-point-arn=: Specifies the Amazon Resource Name (ARN) of the access point that DataSync uses to mount your Amazon EFS file system.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --file-system-access-role-arn=: Specifies an Identity and Access Management (IAM) role that allows DataSync to access your Amazon EFS file system.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --in-transit-encryption=: Specifies whether you want DataSync to use Transport Layer Security (TLS) 1.2 encryption when it transfers data to or from your Amazon EFS file system.
    --location-arn=!: Specifies the Amazon Resource Name (ARN) of the Amazon EFS transfer location that you're updating.
    --subdirectory=: Specifies a mount path for your Amazon EFS file system.
completion:
    flag:
        in-transit-encryption:
            - NONE
            - TLS1_2
documentation:
    command: |-
        Modifies the following configuration parameters of the Amazon EFS transfer location that you're using with DataSync.

        For more information, see [Configuring DataSync transfers with Amazon EFS](https://docs.aws.amazon.com/datasync/latest/userguide/create-efs-location.html).
    flag:
        access-point-arn: |-
            Specifies the Amazon Resource Name (ARN) of the access point that DataSync uses to mount your Amazon EFS file system.

            For more information, see [Accessing restricted Amazon EFS file systems](https://docs.aws.amazon.com/datasync/latest/userguide/create-efs-location.html#create-efs-location-iam).
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        file-system-access-role-arn: |-
            Specifies an Identity and Access Management (IAM) role that allows DataSync to access your Amazon EFS file system.

            For information on creating this role, see [Creating a DataSync IAM role for Amazon EFS file system access](https://docs.aws.amazon.com/datasync/latest/userguide/create-efs-location.html#create-efs-location-iam-role).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        in-transit-encryption: |-
            Specifies whether you want DataSync to use Transport Layer Security (TLS) 1.2 encryption when it transfers data to or from your Amazon EFS file system.

            If you specify an access point using `AccessPointArn` or an IAM role using `FileSystemAccessRoleArn`, you must set this parameter to `TLS1_2`.
        location-arn: Specifies the Amazon Resource Name (ARN) of the Amazon EFS transfer location that you're updating.
        subdirectory: |-
            Specifies a mount path for your Amazon EFS file system. This is where DataSync reads or writes data on your file system (depending on if this is a source or destination location).

            By default, DataSync uses the root directory (or [access point](https://docs.aws.amazon.com/efs/latest/ug/efs-access-points.html) if you provide one by using `AccessPointArn`). You can also include subdirectories using forward slashes (for example, `/path/to/folder`).
