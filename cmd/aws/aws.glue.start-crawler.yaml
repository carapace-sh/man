name: start-crawler
description: Starts a crawl using the specified crawler, regardless of what is scheduled.
flags:
    --name=!: Name of the crawler to start.
documentation:
    command: Starts a crawl using the specified crawler, regardless of what is scheduled. If the crawler is already running, returns a [CrawlerRunningException](https://docs.aws.amazon.com/glue/latest/dg/aws-glue-api-exceptions.html#aws-glue-api-exceptions-CrawlerRunningException).
    flag:
        name: Name of the crawler to start.
