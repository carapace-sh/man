name: delete-event-source-mapping
description: Deletes an [event source mapping](https://docs.aws.amazon.com/lambda/latest/dg/intro-invocation-modes.html). You can get the identifier of a mapping from the output of [ListEventSourceMappings]().
flags:
    --uuid=!: The identifier of the event source mapping.
documentation:
    command: |-
        Deletes an [event source mapping](https://docs.aws.amazon.com/lambda/latest/dg/intro-invocation-modes.html). You can get the identifier of a mapping from the output of [ListEventSourceMappings]().

        When you delete an event source mapping, it enters a `Deleting` state and might not be completely deleted for several seconds.
    flag:
        uuid: The identifier of the event source mapping.
