name: create-vpc-connector
description: Create an App Runner VPC connector resource.
flags:
    --security-groups=: A list of IDs of security groups that App Runner should use for access to Amazon Web Services resources under the specified subnets.
    --subnets=!: A list of IDs of subnets that App Runner should use when it associates your service with a custom Amazon VPC.
    --tags=: A list of metadata items that you can associate with your VPC connector resource.
    --vpc-connector-name=!: A name for the VPC connector.
documentation:
    command: Create an App Runner VPC connector resource. App Runner requires this resource when you want to associate your App Runner service to a custom Amazon Virtual Private Cloud (Amazon VPC).
    flag:
        security-groups: A list of IDs of security groups that App Runner should use for access to Amazon Web Services resources under the specified subnets. If not specified, App Runner uses the default security group of the Amazon VPC. The default security group allows all outbound traffic.
        subnets: |-
            A list of IDs of subnets that App Runner should use when it associates your service with a custom Amazon VPC. Specify IDs of subnets of a single Amazon VPC. App Runner determines the Amazon VPC from the subnets you specify.

            App Runner only supports subnets of IP address type *IPv4* and *dual stack* (IPv4 and IPv6).
        tags: A list of metadata items that you can associate with your VPC connector resource. A tag is a key-value pair.
        vpc-connector-name: A name for the VPC connector.
