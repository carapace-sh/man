name: create-rotation-override
description: Creates an override for a rotation in an on-call schedule.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --end-time=!: The date and time when the override ends.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --idempotency-token=: A token that ensures that the operation is called only once with the specified details.
    --new-contact-ids=!:
        description: The Amazon Resource Names (ARNs) of the contacts to replace those in the current on-call rotation with.
        nargs: -1
    --rotation-id=!: The Amazon Resource Name (ARN) of the rotation to create an override for.
    --start-time=!: The date and time when the override goes into effect.
documentation:
    command: Creates an override for a rotation in an on-call schedule.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        end-time: The date and time when the override ends.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        idempotency-token: A token that ensures that the operation is called only once with the specified details.
        new-contact-ids: |-
            The Amazon Resource Names (ARNs) of the contacts to replace those in the current on-call rotation with.

            If you want to include any current team members in the override shift, you must include their ARNs in the new contact ID list.
        rotation-id: The Amazon Resource Name (ARN) of the rotation to create an override for.
        start-time: The date and time when the override goes into effect.
