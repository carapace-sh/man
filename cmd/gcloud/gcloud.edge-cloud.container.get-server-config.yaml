name: get-server-config
description: Get server config.
flags:
    --location=: ID of the location or fully qualified identifier for the location.
documentation:
    command: |
        *gcloud edge-cloud container get-server-config* gets the server configuration for an Edge Container location. This configuration
        includes the default cluster version, the supported cluster versions and version configuration
        for each release channel.
    flag:
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line;
            * set the property `edge_container/location`.
