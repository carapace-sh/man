name: update-input
description: Updates an input.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --destinations=: Destination settings for PUSH type inputs.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --input-devices=: Settings for the devices.
    --input-id=!: Unique ID of the input.
    --input-security-groups=: A list of security groups referenced by IDs to attach to the input.
    --media-connect-flows=: A list of the MediaConnect Flow ARNs that you want to use as the source of the input.
    --multicast-settings=: Multicast Input settings.
    --name=: Name of the input.
    --role-arn=: The Amazon Resource Name (ARN) of the role this input assumes during and after creation.
    --sdi-sources=: ""
    --smpte2110-receiver-group-settings=: Include this parameter if the input is a SMPTE 2110 input, to identify the stream sources for this input.
    --sources=: The source URLs for a PULL-type input.
    --srt-settings=: The settings associated with an SRT input.
documentation:
    command: Updates an input.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        destinations: Destination settings for PUSH type inputs.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        input-devices: Settings for the devices.
        input-id: Unique ID of the input.
        input-security-groups: A list of security groups referenced by IDs to attach to the input.
        media-connect-flows: A list of the MediaConnect Flow ARNs that you want to use as the source of the input. You can specify as few as one Flow and presently, as many as two. The only requirement is when you have more than one is that each Flow is in a separate Availability Zone as this ensures your EML input is redundant to AZ issues.
        multicast-settings: Multicast Input settings.
        name: Name of the input.
        role-arn: The Amazon Resource Name (ARN) of the role this input assumes during and after creation.
        sdi-sources: ""
        smpte2110-receiver-group-settings: Include this parameter if the input is a SMPTE 2110 input, to identify the stream sources for this input.
        sources: The source URLs for a PULL-type input. Every PULL type input needs exactly two source URLs for redundancy. Only specify sources for PULL type Inputs. Leave Destinations empty.
        srt-settings: The settings associated with an SRT input.
