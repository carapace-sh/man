name: start-policy-generation
description: Starts the policy generation request.
flags:
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --cloud-trail-details=: A `CloudTrailDetails` object that contains details about a `Trail` that you want to analyze to generate policies.
    --policy-generation-details=!: Contains the ARN of the IAM entity (user or role) for which you are generating a policy.
documentation:
    command: Starts the policy generation request.
    flag:
        client-token: |-
            A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. Idempotency ensures that an API request completes only once. With an idempotent request, if the original request completes successfully, the subsequent retries with the same client token return the result from the original successful request and they have no additional effect.

            If you do not specify a client token, one is automatically generated by the Amazon Web Services SDK.
        cloud-trail-details: A `CloudTrailDetails` object that contains details about a `Trail` that you want to analyze to generate policies.
        policy-generation-details: Contains the ARN of the IAM entity (user or role) for which you are generating a policy.
