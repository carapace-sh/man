name: cancel-plan-execution
description: Cancels an in-progress plan execution.
flags:
    --comment=: A comment that you can enter about canceling a plan execution step.
    --execution-id=!: The execution identifier of a plan execution.
    --plan-arn=!: The Amazon Resource Name (ARN) of the plan.
documentation:
    command: |-
        Cancels an in-progress plan execution. This operation stops the execution of the plan and prevents any further steps from being processed.

        You must specify the plan ARN and execution ID. You can also provide an optional comment explaining why the execution was canceled.
    flag:
        comment: A comment that you can enter about canceling a plan execution step.
        execution-id: The execution identifier of a plan execution.
        plan-arn: The Amazon Resource Name (ARN) of the plan.
