name: create-query-suggestions-block-list
description: Creates a block list to exlcude certain queries from suggestions.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A token that you provide to identify the request to create a query suggestions block list.
    --description=: A description for the block list.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --index-id=!: The identifier of the index you want to create a query suggestions block list for.
    --name=!: A name for the block list.
    --role-arn=!: The Amazon Resource Name (ARN) of an IAM role with permission to access your S3 bucket that contains the block list text file.
    --source-s3-path=!: The S3 path to your block list text file in your S3 bucket.
    --tags=:
        description: A list of key-value pairs that identify or categorize the block list.
        nargs: -1
documentation:
    command: |-
        Creates a block list to exlcude certain queries from suggestions.

        Any query that contains words or phrases specified in the block list is blocked or filtered out from being shown as a suggestion.

        You need to provide the file location of your block list text file in your S3 bucket. In your text file, enter each block word or phrase on a separate line.

        For information on the current quota limits for block lists, see [Quotas for Amazon Kendra](https://docs.aws.amazon.com/kendra/latest/dg/quotas.html).

        `CreateQuerySuggestionsBlockList` is currently not supported in the Amazon Web Services GovCloud (US-West) region.

        For an example of creating a block list for query suggestions using the Python SDK, see [Query suggestions block list](https://docs.aws.amazon.com/kendra/latest/dg/query-suggestions.html#query-suggestions-blocklist).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A token that you provide to identify the request to create a query suggestions block list.
        description: |-
            A description for the block list.

            For example, the description "List of all offensive words that can appear in user queries and need to be blocked from suggestions."
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        index-id: The identifier of the index you want to create a query suggestions block list for.
        name: |-
            A name for the block list.

            For example, the name 'offensive-words', which includes all offensive words that could appear in user queries and need to be blocked from suggestions.
        role-arn: The Amazon Resource Name (ARN) of an IAM role with permission to access your S3 bucket that contains the block list text file. For more information, see [IAM access roles for Amazon Kendra](https://docs.aws.amazon.com/kendra/latest/dg/iam-roles.html).
        source-s3-path: |-
            The S3 path to your block list text file in your S3 bucket.

            Each block word or phrase should be on a separate line in a text file.

            For information on the current quota limits for block lists, see [Quotas for Amazon Kendra](https://docs.aws.amazon.com/kendra/latest/dg/quotas.html).
        tags: 'A list of key-value pairs that identify or categorize the block list. Tag keys and values can consist of Unicode letters, digits, white space, and any of the following symbols: _ . : / = + - @.'
