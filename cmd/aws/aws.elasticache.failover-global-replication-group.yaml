name: failover-global-replication-group
description: Used to failover the primary region to a secondary region.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --global-replication-group-id=!: The name of the Global datastore
    --primary-region=!: The Amazon region of the primary cluster of the Global datastore
    --primary-replication-group-id=!: The name of the primary replication group
documentation:
    command: Used to failover the primary region to a secondary region. The secondary region will become primary, and all other clusters will become secondary.
