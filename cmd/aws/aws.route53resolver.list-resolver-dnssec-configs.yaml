name: list-resolver-dnssec-configs
description: Lists the configurations for DNSSEC validation that are associated with the current Amazon Web Services account.
flags:
    --filters=: An optional specification to return a subset of objects.
    --max-results=: '*Optional*: An integer that specifies the maximum number of DNSSEC configuration results that you want Amazon Route 53 to return.'
    --next-token=: (Optional) If the current Amazon Web Services account has more than `MaxResults` DNSSEC configurations, use `NextToken` to get the second and subsequent pages of results.
documentation:
    command: Lists the configurations for DNSSEC validation that are associated with the current Amazon Web Services account.
    flag:
        filters: An optional specification to return a subset of objects.
        max-results: '*Optional*: An integer that specifies the maximum number of DNSSEC configuration results that you want Amazon Route 53 to return. If you don''t specify a value for `MaxResults`, Route 53 returns up to 100 configuration per page.'
        next-token: |-
            (Optional) If the current Amazon Web Services account has more than `MaxResults` DNSSEC configurations, use `NextToken` to get the second and subsequent pages of results.

            For the first `ListResolverDnssecConfigs` request, omit this value.

            For the second and subsequent requests, get the value of `NextToken` from the previous response and specify that value for `NextToken` in the request.
