name: create-cluster
description: Create a new Cluster.
flags:
    --cluster-type=: Specify a type.
    --instance-role-arn=: The ARN of the IAM role for the Node in this Cluster.
    --name=: Specify a name that is unique in the AWS account.
    --network-settings=: Network settings that connect the Nodes in the Cluster to one or more of the Networks that the Cluster is associated with.
    --request-id=: The unique ID of the request.
    --tags=: A collection of key-value pairs.
completion:
    flag:
        cluster-type:
            - ON_PREMISES
documentation:
    command: Create a new Cluster.
    flag:
        cluster-type: Specify a type. All the Nodes that you later add to this Cluster must be this type of hardware. One Cluster instance can't contain different hardware types. You won't be able to change this parameter after you create the Cluster.
        instance-role-arn: The ARN of the IAM role for the Node in this Cluster. The role must include all the operations that you expect these Node to perform. If necessary, create a role in IAM, then attach it here.
        name: Specify a name that is unique in the AWS account. We recommend that you assign a name that hints at the types of Nodes in the Cluster. Names are case-sensitive.
        network-settings: Network settings that connect the Nodes in the Cluster to one or more of the Networks that the Cluster is associated with.
        request-id: The unique ID of the request.
        tags: A collection of key-value pairs.
