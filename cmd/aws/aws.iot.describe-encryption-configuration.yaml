name: describe-encryption-configuration
description: Retrieves the encryption configuration for resources and data of your Amazon Web Services account in Amazon Web Services IoT Core.
documentation:
    command: Retrieves the encryption configuration for resources and data of your Amazon Web Services account in Amazon Web Services IoT Core. For more information, see [Key management in IoT](https://docs.aws.amazon.com/iot/latest/developerguide/key-management.html) from the *Amazon Web Services IoT Core Developer Guide*.
