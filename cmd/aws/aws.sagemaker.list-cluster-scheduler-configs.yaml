name: list-cluster-scheduler-configs
description: List the cluster policy configurations.
flags:
    --cluster-arn=: Filter for ARN of the cluster.
    --created-after=: Filter for after this creation time.
    --created-before=: Filter for before this creation time.
    --max-results=: The maximum number of cluster policies to list.
    --name-contains=: Filter for name containing this string.
    --next-token=: If the previous response was truncated, you will receive this token.
    --sort-by=: Filter for sorting the list by a given value.
    --sort-order=: The order of the list.
    --status=: Filter for status.
completion:
    flag:
        sort-by:
            - Name
            - CreationTime
            - Status
        sort-order:
            - Ascending
            - Descending
        status:
            - Creating
            - CreateFailed
            - CreateRollbackFailed
            - Created
            - Updating
            - UpdateFailed
            - UpdateRollbackFailed
            - Updated
            - Deleting
            - DeleteFailed
            - DeleteRollbackFailed
            - Deleted
documentation:
    command: List the cluster policy configurations.
    flag:
        cluster-arn: Filter for ARN of the cluster.
        created-after: Filter for after this creation time. The input for this parameter is a Unix timestamp. To convert a date and time into a Unix timestamp, see [EpochConverter](https://www.epochconverter.com/).
        created-before: Filter for before this creation time. The input for this parameter is a Unix timestamp. To convert a date and time into a Unix timestamp, see [EpochConverter](https://www.epochconverter.com/).
        max-results: The maximum number of cluster policies to list.
        name-contains: Filter for name containing this string.
        next-token: If the previous response was truncated, you will receive this token. Use it in your next request to receive the next set of results.
        sort-by: Filter for sorting the list by a given value. For example, sort by name, creation time, or status.
        sort-order: The order of the list. By default, listed in `Descending` order according to by `SortBy`. To change the list order, you can specify `SortOrder` to be `Ascending`.
        status: Filter for status.
