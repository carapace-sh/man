name: get-mltask-runs
description: Gets a list of runs for a machine learning transform.
flags:
    --filter=: The filter criteria, in the `TaskRunFilterCriteria` structure, for the task run.
    --max-results=: The maximum number of results to return.
    --next-token=: A token for pagination of the results.
    --sort=: The sorting criteria, in the `TaskRunSortCriteria` structure, for the task run.
    --transform-id=!: The unique identifier of the machine learning transform.
documentation:
    command: |-
        Gets a list of runs for a machine learning transform. Machine learning task runs are asynchronous tasks that Glue runs on your behalf as part of various machine learning workflows. You can get a sortable, filterable list of machine learning task runs by calling `GetMLTaskRuns` with their parent transform's `TransformID` and other optional parameters as documented in this section.

        This operation returns a list of historic runs and must be paginated.
    flag:
        filter: The filter criteria, in the `TaskRunFilterCriteria` structure, for the task run.
        max-results: The maximum number of results to return.
        next-token: A token for pagination of the results. The default is empty.
        sort: The sorting criteria, in the `TaskRunSortCriteria` structure, for the task run.
        transform-id: The unique identifier of the machine learning transform.
