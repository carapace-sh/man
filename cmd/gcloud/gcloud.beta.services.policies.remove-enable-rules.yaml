name: remove-enable-rules
description: '*(BETA)*  Remove service(s) from a consumer policy for a project, folder or organization.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --folder=: The Google Cloud Platform folder ID to use for this invocation.
    --force: If specified, the remove-enable-rules call will proceed even if there are enabled services which depend on the service to be removed from enable rule or the service to be removed was used in the last 30 days, or the service to be removed was enabled in the last 3 days.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-force&: If specified, the remove-enable-rules call will proceed even if there are enabled services which depend on the service to be removed from enable rule or the service to be removed was used in the last 30 days, or the service to be removed was enabled in the last 3 days.
    --no-validate-only&: Validate the remove enable rule action, but don't actually perform it
    --organization=: The Google Cloud Platform organization ID to use for this invocation.
    --policy-name=: Name of the consumer policy.
    --validate-only: Validate the remove enable rule action, but don't actually perform it
documentation:
    command: |-
        *(BETA)*  Remove service(s) from a consumer policy for a project, folder or
        organization.

        ## EXAMPLES
        To remove service called `my-consumed-service` from the default consumer
        policy on the current project, run:

          $ gcloud beta services policies remove-enable-rules my-consumed-service
              OR
          $ gcloud beta services policies remove-enable-rules my-consumed-service --policy-name=default

         To remove service called `my-consumed-service` from from the default consumer
         policy on project `my-project`, run:

          $ gcloud beta services policies remove-enable-rules my-consumed-service --project=my-project
              OR
          $ gcloud beta services policies remove-enable-rules my-consumed-service --policy-name=default

        To run the same command asynchronously (non-blocking), run:

          $ gcloud beta services policies remove-enable-rules my-consumed-service --async
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        folder: The Google Cloud Platform folder ID to use for this invocation.
        force: If specified, the remove-enable-rules call will proceed even if there are enabled services which depend on the service to be removed from enable rule or the service to be removed was used in the last 30 days, or the service to be removed was enabled in the last 3 days. Forcing the call means that the services which depend on the service to be removed from the enable rule will also be removed.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-force: If specified, the remove-enable-rules call will proceed even if there are enabled services which depend on the service to be removed from enable rule or the service to be removed was used in the last 30 days, or the service to be removed was enabled in the last 3 days. Forcing the call means that the services which depend on the service to be removed from the enable rule will also be removed.
        no-validate-only: Validate the remove enable rule action, but don't actually perform it
        organization: The Google Cloud Platform organization ID to use for this invocation.
        policy-name: Name of the consumer policy. Currently only "default" is supported.
        validate-only: Validate the remove enable rule action, but don't actually perform it
