name: disassociate-members
description: Disassociates the specified member accounts from the associated administrator account.
flags:
    --account-ids=!: The account IDs of the member accounts to disassociate from the administrator account.
documentation:
    command: |-
        Disassociates the specified member accounts from the associated administrator account.

        Can be used to disassociate both accounts that are managed using Organizations and accounts that were invited manually.
    flag:
        account-ids: The account IDs of the member accounts to disassociate from the administrator account.
