name: acknowledge-job
description: Returns information about a specified job and whether that job has been received by the job worker.
flags:
    --job-id=!: The unique system-generated ID of the job for which you want to confirm receipt.
    --nonce=!: A system-generated random number that CodePipeline uses to ensure that the job is being worked on by only one job worker.
documentation:
    command: Returns information about a specified job and whether that job has been received by the job worker. Used for custom actions only.
    flag:
        job-id: The unique system-generated ID of the job for which you want to confirm receipt.
        nonce: A system-generated random number that CodePipeline uses to ensure that the job is being worked on by only one job worker. Get this number from the response of the [PollForJobs]() request that returned this job.
