name: delete
description: '*(BETA)*  Delete an Artifact Registry package version.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --delete-tags: If specified, all tags associated with the version are deleted.
    --location=: Location of the version.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-delete-tags&: If specified, all tags associated with the version are deleted.
    --package=: The package associated with the version.
    --repository=: The repository associated with the version.
documentation:
    command: |
        *(BETA)*  Delete an Artifact Registry package version.

        This command can fail for the following reasons:
          * The specified package version does not exist.
          * The active account does not have permission to delete package versions.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        delete-tags: If specified, all tags associated with the version are deleted.
        location: |-
            Location of the version. Overrides the default artifacts/location property value
            for this command invocation. To configure the default location, use the command:
            gcloud config set artifacts/location.
            +

            To set the `location` attribute:
            * provide the argument `version` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `artifacts/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-delete-tags: |
            If specified, all tags associated with the version are deleted.
        package: |-
            The package associated with the version.
            +

            To set the `package` attribute:
            * provide the argument `version` on the command line with a fully specified name;
            * provide the argument `--package` on the command line.
        repository: |-
            The repository associated with the version. Overrides the default artifacts/repository property value
            for this command invocation. To configure the default repository, use the command:
            gcloud config set artifacts/repository.
            +

            To set the `repository` attribute:
            * provide the argument `version` on the command line with a fully specified name;
            * provide the argument `--repository` on the command line;
            * set the property `artifacts/repository`.
