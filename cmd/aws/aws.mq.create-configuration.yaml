name: create-configuration
description: Creates a new configuration for the specified configuration name.
flags:
    --authentication-strategy=: Optional.
    --engine-type=!: Required.
    --engine-version=: The broker engine version.
    --name=!: Required.
    --tags=: Create tags when creating the configuration.
completion:
    flag:
        authentication-strategy:
            - SIMPLE
            - LDAP
            - CONFIG_MANAGED
        engine-type:
            - ACTIVEMQ
            - RABBITMQ
documentation:
    command: Creates a new configuration for the specified configuration name. Amazon MQ uses the default configuration (the engine type and version).
    flag:
        authentication-strategy: Optional. The authentication strategy associated with the configuration. The default is SIMPLE.
        engine-type: Required. The type of broker engine. Currently, Amazon MQ supports ACTIVEMQ and RABBITMQ.
        engine-version: The broker engine version. Defaults to the latest available version for the specified broker engine type. For more information, see the [ActiveMQ version management](https://docs.aws.amazon.com//amazon-mq/latest/developer-guide/activemq-version-management.html) and the [RabbitMQ version management](https://docs.aws.amazon.com//amazon-mq/latest/developer-guide/rabbitmq-version-management.html) sections in the Amazon MQ Developer Guide.
        name: Required. The name of the configuration. This value can contain only alphanumeric characters, dashes, periods, underscores, and tildes (- . _ ~). This value must be 1-150 characters long.
        tags: Create tags when creating the configuration.
