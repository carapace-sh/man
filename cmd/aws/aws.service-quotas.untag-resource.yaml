name: untag-resource
description: Removes tags from the specified applied quota.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) for the applied quota that you want to untag.
    --tag-keys=!: The keys of the tags that you want to remove from the resource.
documentation:
    command: Removes tags from the specified applied quota. You can specify one or more tags to remove.
    flag:
        resource-arn: The Amazon Resource Name (ARN) for the applied quota that you want to untag. You can get this information by using the Service Quotas console, or by listing the quotas using the [list-service-quotas](https://docs.aws.amazon.com/cli/latest/reference/service-quotas/list-service-quotas.html) CLI command or the [ListServiceQuotas](https://docs.aws.amazon.com/servicequotas/2019-06-24/apireference/API_ListServiceQuotas.html) Amazon Web Services API operation.
        tag-keys: The keys of the tags that you want to remove from the resource.
