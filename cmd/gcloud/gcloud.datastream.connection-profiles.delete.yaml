name: delete
description: Delete a Datastream connection profile.
flags:
    --location=: The location of the resources.
documentation:
    command: |
        Deletes a connection profile.
    flag:
        location: |-
            The location of the resources.
            +
            To set the `location` attribute:
            * provide the argument `connection_profile` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
