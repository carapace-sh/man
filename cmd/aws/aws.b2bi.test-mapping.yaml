name: test-mapping
description: Maps the input file according to the provided template file.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --file-format=!: Specifies that the currently supported file formats for EDI transformations are `JSON` and `XML`.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --input-file-content=!: Specify the contents of the EDI (electronic data interchange) XML or JSON file that is used as input for the transform.
    --mapping-template=!: Specifies the mapping template for the transformer.
completion:
    flag:
        file-format:
            - XML
            - JSON
            - NOT_USED
documentation:
    command: Maps the input file according to the provided template file. The API call downloads the file contents from the Amazon S3 location, and passes the contents in as a string, to the `inputFileContent` parameter.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        file-format: Specifies that the currently supported file formats for EDI transformations are `JSON` and `XML`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        input-file-content: Specify the contents of the EDI (electronic data interchange) XML or JSON file that is used as input for the transform.
        mapping-template: |-
            Specifies the mapping template for the transformer. This template is used to map the parsed EDI file using JSONata or XSLT.

            This parameter is available for backwards compatibility. Use the [Mapping](https://docs.aws.amazon.com/b2bi/latest/APIReference/API_Mapping.html) data type instead.
