name: tag-resource
description: Adds or updates tags for a resource in CodeCommit.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource to which you want to add or update tags.
    --tags=!: The key-value pair to use when tagging this repository.
documentation:
    command: Adds or updates tags for a resource in CodeCommit. For a list of valid resources in CodeCommit, see [CodeCommit Resources and Operations](https://docs.aws.amazon.com/codecommit/latest/userguide/auth-and-access-control-iam-access-control-identity-based.html#arn-formats) in the *CodeCommit User Guide*.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource to which you want to add or update tags.
        tags: The key-value pair to use when tagging this repository.
