name: delete
description: '*(ALPHA)*  Delete Compute Engine SSL policies.'
flags:
    --global: If set, the SSL policies are global.
    --no-global&: If set, the SSL policies are global.
    --region=: Region of the SSL policies to delete.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute ssl-policies delete* is used to delete one or more Compute Engine SSL policies.
        SSL policies can only be deleted when no other resources (e.g.,
        Target HTTPS proxies, Target SSL proxies) refer to them.

        An SSL policy specifies the server-side support for SSL features. An SSL
        policy can be attached to a TargetHttpsProxy or a TargetSslProxy. This affects
        connections between clients and the load balancer. SSL
        policies do not affect the connection between the load balancers and the
        backends. SSL policies are used by Application Load Balancers and proxy
        Network Load Balancers.
    flag:
        global: If set, the SSL policies are global.
        no-global: If set, the SSL policies are global.
        region: Region of the SSL policies to delete. Overrides the default *compute/region* property value for this command invocation.
