name: list-resource-compliance-summaries
description: Returns a resource-level summary count.
flags:
    --filters=: One or more filters.
    --max-results=: The maximum number of items to return for this call.
    --next-token=: A token to start the list.
documentation:
    command: Returns a resource-level summary count. The summary includes information about compliant and non-compliant statuses and detailed compliance-item severity counts, according to the filter criteria you specify.
    flag:
        filters: One or more filters. Use a filter to return a more specific list of results.
        max-results: The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: A token to start the list. Use this token to get the next set of results.
