name: update-parameter-group
description: Modifies the parameters of a parameter group.
flags:
    --parameter-group-name=!: The name of the parameter group.
    --parameter-name-values=!: An array of name-value pairs for the parameters in the group.
documentation:
    command: Modifies the parameters of a parameter group. You can modify up to 20 parameters in a single request by submitting a list parameter name and value pairs.
    flag:
        parameter-group-name: The name of the parameter group.
        parameter-name-values: |-
            An array of name-value pairs for the parameters in the group. Each element in the array represents a single parameter.

            `record-ttl-millis` and `query-ttl-millis` are the only supported parameter names. For more details, see [Configuring TTL Settings](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.cluster-management.html#DAX.cluster-management.custom-settings.ttl).
