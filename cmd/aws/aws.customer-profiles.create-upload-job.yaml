name: create-upload-job
description: Creates an Upload job to ingest data for segment imports.
flags:
    --data-expiry=: The expiry duration for the profiles ingested with the job.
    --display-name=!: The unique name of the upload job.
    --domain-name=!: The unique name of the domain.
    --fields=!: The mapping between CSV Columns and Profile Object attributes.
    --unique-key=!: The unique key columns for de-duping the profiles used to map data to the profile.
documentation:
    command: Creates an Upload job to ingest data for segment imports. The metadata is created for the job with the provided field mapping and unique key.
    flag:
        data-expiry: The expiry duration for the profiles ingested with the job. If not provided, the system default of 2 weeks is used.
        display-name: The unique name of the upload job. Could be a file name to identify the upload job.
        domain-name: The unique name of the domain. Domain should be exists for the upload job to be created.
        fields: The mapping between CSV Columns and Profile Object attributes. A map of the name and ObjectType field.
        unique-key: The unique key columns for de-duping the profiles used to map data to the profile.
