name: get-dashboard
description: Retrieves the configuration and metadata of a specified dashboard, including its widgets and layout settings.
flags:
    --arn=!: The ARN of the dashboard to retrieve.
documentation:
    command: Retrieves the configuration and metadata of a specified dashboard, including its widgets and layout settings.
    flag:
        arn: The ARN of the dashboard to retrieve. This is required to uniquely identify the dashboard.
