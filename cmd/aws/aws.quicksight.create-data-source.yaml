documentation:
    command: Creates a data source.
    flag:
        aws-account-id: The Amazon Web Services account ID.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        credentials: The credentials Amazon Quick Sight that uses to connect to your underlying source. Currently, only credentials based on user name and password are supported.
        data-source-id: An ID for the data source. This ID is unique per Amazon Web Services Region for each Amazon Web Services account.
        data-source-parameters: The parameters that Amazon Quick Sight uses to connect to your underlying source.
        folder-arns: When you create the data source, Amazon Quick Sight adds the data source to these folders.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: A display name for the data source.
        permissions: A list of resource permissions on the data source.
        ssl-properties: Secure Socket Layer (SSL) properties that apply when Amazon Quick Sight connects to your underlying source.
        tags: Contains a map of the key-value pairs for the resource tag or tags assigned to the data source.
        type: |-
            The type of the data source. To return a list of all data sources, use `ListDataSources`.

            Use `AMAZON_ELASTICSEARCH` for Amazon OpenSearch Service.
        vpc-connection-properties: Use this parameter only when you want Amazon Quick Sight to use a VPC connection when connecting to your underlying source.
