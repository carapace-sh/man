name: dissociate-package
description: Removes a package from the specified Amazon OpenSearch Service domain.
flags:
    --domain-name=!: Name of the domain to dissociate the package from.
    --package-id=!: Internal ID of the package to dissociate from the domain.
documentation:
    command: Removes a package from the specified Amazon OpenSearch Service domain. The package can't be in use with any OpenSearch index for the dissociation to succeed. The package is still available in OpenSearch Service for association later. For more information, see [Custom packages for Amazon OpenSearch Service](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/custom-packages.html).
    flag:
        domain-name: Name of the domain to dissociate the package from.
        package-id: Internal ID of the package to dissociate from the domain. Use `ListPackagesForDomain` to find this value.
