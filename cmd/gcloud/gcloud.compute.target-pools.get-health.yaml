name: get-health
description: Get the health of instances in a target pool.
flags:
    --region=: Region of the target pool to get health information for.
documentation:
    command: '*gcloud compute target-pools get-health* displays the health of instances in a target pool.'
    flag:
        region: |-
            Region of the target pool to get health information for. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
