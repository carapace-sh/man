name: deidentify
description: De-identify data from the source store and write it to the destination store.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --dataset=: Cloud Healthcare dataset.
    --destination-store=!: The name of the DICOM store to which the redacted data should be written
    --dicom-filter-tags=: Tags to be filtered.
    --location=: Google Cloud location.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --text-redaction-mode=: Determines how to redact text from image.
completion:
    flag:
        text-redaction-mode:
            - all
documentation:
    command: |
        De-identify data from the source store and write it to the destination store.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        dataset: |-
            Cloud Healthcare dataset.
            +
            To set the `dataset` attribute:
            * provide the argument `dicom_store` on the command line with a fully specified name;
            * provide the argument `--dataset` on the command line.
        destination-store: |-
            The name of the DICOM store to which the redacted data should be written
            (e.g., projects/{projectId}/locations/{locationId}/datasets/{datasetId}/dicomStores/{dicomStoreId}).
            The destination DICOM store must already exist, or the request will fail.
        dicom-filter-tags: |-
            Tags to be filtered. Tags must be DICOM Data Elements, File Meta Elements, or
            Directory Structuring Elements, as defined at:
            http://dicom.nema.org/medical/dicom/current/output/html/part06.html#table_6-1,.
            They may be provided by "Keyword" or "Tag". For example "PatientID", "0010,0010".
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `dicom_store` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `healthcare/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        text-redaction-mode: |-
            Determines how to redact text from image. _TEXT_REDACTION_MODE_ must be (only one value is supported):
            +
            *all*::: Redact all text.
            +
            :::
            +
