name: batch-get-findings
description: Returns a list of requested findings from standard scans.
flags:
    --finding-identifiers=!: A list of finding identifiers.
documentation:
    command: Returns a list of requested findings from standard scans.
    flag:
        finding-identifiers: A list of finding identifiers. Each identifier consists of a `scanName` and a `findingId`. You retrieve the `findingId` when you call `GetFindings`.
