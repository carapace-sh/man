name: create-cluster-parameter-group
description: Creates an Amazon Redshift parameter group.
flags:
    --description=!: A description of the parameter group.
    --parameter-group-family=!: The Amazon Redshift engine version to which the cluster parameter group applies.
    --parameter-group-name=!: The name of the cluster parameter group.
    --tags=: A list of tag instances.
documentation:
    command: |-
        Creates an Amazon Redshift parameter group.

        Creating parameter groups is independent of creating clusters. You can associate a cluster with a parameter group when you create the cluster. You can also associate an existing cluster with a parameter group after the cluster is created by using [ModifyCluster]().

        Parameters in the parameter group define specific behavior that applies to the databases you create on the cluster. For more information about parameters and parameter groups, go to [Amazon Redshift Parameter Groups](https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-parameter-groups.html) in the *Amazon Redshift Cluster Management Guide*.
    flag:
        description: A description of the parameter group.
        parameter-group-family: |-
            The Amazon Redshift engine version to which the cluster parameter group applies. The cluster engine version determines the set of parameters.

            To get a list of valid parameter group family names, you can call [DescribeClusterParameterGroups](). By default, Amazon Redshift returns a list of all the parameter groups that are owned by your Amazon Web Services account, including the default parameter groups for each Amazon Redshift engine version. The parameter group family names associated with the default parameter groups provide you the valid values. For example, a valid family name is "redshift-1.0".
        parameter-group-name: |-
            The name of the cluster parameter group.

            Constraints:

            - Must be 1 to 255 alphanumeric characters or hyphens
            - First character must be a letter.
            - Cannot end with a hyphen or contain two consecutive hyphens.
            - Must be unique withing your Amazon Web Services account.

            This value is stored as a lower-case string.
        tags: A list of tag instances.
