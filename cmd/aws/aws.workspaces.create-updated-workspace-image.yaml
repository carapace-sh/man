name: create-updated-workspace-image
description: Creates a new updated WorkSpace image based on the specified source image.
flags:
    --description=!: A description of whether updates for the WorkSpace image are available.
    --name=!: The name of the new updated WorkSpace image.
    --source-image-id=!: The identifier of the source WorkSpace image.
    --tags=: The tags that you want to add to the new updated WorkSpace image.
documentation:
    command: |-
        Creates a new updated WorkSpace image based on the specified source image. The new updated WorkSpace image has the latest drivers and other updates required by the Amazon WorkSpaces components.

        To determine which WorkSpace images need to be updated with the latest Amazon WorkSpaces requirements, use [DescribeWorkspaceImages](https://docs.aws.amazon.com/workspaces/latest/api/API_DescribeWorkspaceImages.html).

        - Only Windows 10, Windows Server 2016, and Windows Server 2019 WorkSpace images can be programmatically updated at this time.
        - Microsoft Windows updates and other application updates are not included in the update process.
        - The source WorkSpace image is not deleted. You can delete the source image after you've verified your new updated image and created a new bundle.
    flag:
        description: A description of whether updates for the WorkSpace image are available.
        name: The name of the new updated WorkSpace image.
        source-image-id: The identifier of the source WorkSpace image.
        tags: |-
            The tags that you want to add to the new updated WorkSpace image.

            To add tags at the same time when you're creating the updated image, you must create an IAM policy that grants your IAM user permissions to use `workspaces:CreateTags`.
