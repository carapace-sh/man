name: cancel-schema-extension
description: Cancels an in-progress schema extension to a Microsoft AD directory.
flags:
    --directory-id=!: The identifier of the directory whose schema extension will be canceled.
    --schema-extension-id=!: The identifier of the schema extension that will be canceled.
documentation:
    command: Cancels an in-progress schema extension to a Microsoft AD directory. Once a schema extension has started replicating to all domain controllers, the task can no longer be canceled. A schema extension can be canceled during any of the following states; `Initializing`, `CreatingSnapshot`, and `UpdatingSchema`.
    flag:
        directory-id: The identifier of the directory whose schema extension will be canceled.
        schema-extension-id: The identifier of the schema extension that will be canceled.
