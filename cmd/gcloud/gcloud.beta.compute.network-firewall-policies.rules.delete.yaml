name: delete
description: '*(BETA)*  Deletes a Compute Engine network firewall policy rule.'
flags:
    --firewall-policy-region=: Region of the firewall policy to delete.
    --firewall-policy=!: Firewall policy ID with which to delete rule.
    --global-firewall-policy: If set, the firewall policy is global.
    --no-global-firewall-policy&: If set, the firewall policy is global.
documentation:
    command: '*(BETA)*  *gcloud beta compute network-firewall-policies rules delete* is used to delete network firewall policy rules.'
    flag:
        firewall-policy: Firewall policy ID with which to delete rule.
        firewall-policy-region: Region of the firewall policy to delete. Overrides the default *compute/region* property value for this command invocation.
        global-firewall-policy: If set, the firewall policy is global.
        no-global-firewall-policy: If set, the firewall policy is global.
