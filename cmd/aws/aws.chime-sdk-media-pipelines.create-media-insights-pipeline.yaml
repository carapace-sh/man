name: create-media-insights-pipeline
description: Creates a media insights pipeline.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=: The unique identifier for the media insights pipeline request.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --kinesis-video-stream-recording-source-runtime-configuration=: The runtime configuration for the Kinesis video recording stream source.
    --kinesis-video-stream-source-runtime-configuration=: The runtime configuration for the Kinesis video stream source of the media insights pipeline.
    --media-insights-pipeline-configuration-arn=!: The ARN of the pipeline's configuration.
    --media-insights-runtime-metadata=: The runtime metadata for the media insights pipeline.
    --s3-recording-sink-runtime-configuration=: The runtime configuration for the S3 recording sink.
    --tags=:
        description: The tags assigned to the media insights pipeline.
        nargs: -1
documentation:
    command: Creates a media insights pipeline.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: The unique identifier for the media insights pipeline request.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        kinesis-video-stream-recording-source-runtime-configuration: The runtime configuration for the Kinesis video recording stream source.
        kinesis-video-stream-source-runtime-configuration: The runtime configuration for the Kinesis video stream source of the media insights pipeline.
        media-insights-pipeline-configuration-arn: The ARN of the pipeline's configuration.
        media-insights-runtime-metadata: The runtime metadata for the media insights pipeline. Consists of a key-value map of strings.
        s3-recording-sink-runtime-configuration: The runtime configuration for the S3 recording sink. If specified, the settings in this structure override any settings in `S3RecordingSinkConfiguration`.
        tags: The tags assigned to the media insights pipeline.
