name: list-service-states
description: Retrieves the current state information for services monitored by Application Signals.
flags:
    --attribute-filters=: An array of attribute filters to narrow down the service states returned.
    --aws-account-id=: The AWS account ID to filter service states.
    --end-time=!: The end time for the service states query.
    --include-linked-accounts: Specifies whether to include service states from linked AWS accounts in the results.
    --max-results=: The maximum number of service states to return in a single request.
    --next-token=: The token for the next set of results.
    --no-include-linked-accounts&: Specifies whether to include service states from linked AWS accounts in the results.
    --start-time=!: The start time for the service states query.
documentation:
    command: |-
        Retrieves the current state information for services monitored by Application Signals. Service states include health status, recent change events, and other operational metadata.

        You can filter results by time range, AWS account, and service attributes to focus on specific services or time periods. This operation supports pagination and can include data from linked accounts.
    flag:
        attribute-filters: An array of attribute filters to narrow down the service states returned. Each filter specifies an attribute name and the values to match against.
        aws-account-id: The AWS account ID to filter service states. If specified, only service states from this account will be returned. If not specified, service states from the current account (and linked accounts if enabled) are returned.
        end-time: The end time for the service states query. Only service states before this time will be included. Specify the time as the number of milliseconds since January 1, 1970, 00:00:00 UTC.
        include-linked-accounts: Specifies whether to include service states from linked AWS accounts in the results. Set to `true` to include linked accounts, or `false` to only include the current account. Defaults to `false`.
        max-results: The maximum number of service states to return in a single request. Valid range is 1 to 100. If not specified, defaults to 50.
        next-token: The token for the next set of results. Use this token to retrieve additional pages of service states when the result set is large.
        start-time: The start time for the service states query. Only service states from this time onward will be included. Specify the time as the number of milliseconds since January 1, 1970, 00:00:00 UTC.
