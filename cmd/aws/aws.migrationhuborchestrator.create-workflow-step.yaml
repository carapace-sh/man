name: create-workflow-step
description: Create a step in the migration workflow.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The description of the step.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the step.
    --next=: The next step.
    --outputs=: The key value pairs added for the expected output.
    --previous=: The previous step.
    --step-action-type=!: The action type of the step.
    --step-group-id=!: The ID of the step group.
    --step-target=: The servers on which a step will be run.
    --workflow-id=!: The ID of the migration workflow.
    --workflow-step-automation-configuration=: The custom script to run tests on source or target environments.
completion:
    flag:
        step-action-type:
            - MANUAL
            - AUTOMATED
documentation:
    command: Create a step in the migration workflow.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The description of the step.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the step.
        next: The next step.
        outputs: The key value pairs added for the expected output.
        previous: The previous step.
        step-action-type: The action type of the step. You must run and update the status of a manual step for the workflow to continue after the completion of the step.
        step-group-id: The ID of the step group.
        step-target: The servers on which a step will be run.
        workflow-id: The ID of the migration workflow.
        workflow-step-automation-configuration: The custom script to run tests on source or target environments.
