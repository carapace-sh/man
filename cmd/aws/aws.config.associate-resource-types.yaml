name: associate-resource-types
description: Adds all resource types specified in the `ResourceTypes` list to the [RecordingGroup](https://docs.aws.amazon.com/config/latest/APIReference/API_RecordingGroup.html) of specified configuration recorder and includes those resource types when recording.
flags:
    --configuration-recorder-arn=!: The Amazon Resource Name (ARN) of the specified configuration recorder.
    --resource-types=!: The list of resource types you want to add to the recording group of the specified configuration recorder.
documentation:
    command: |-
        Adds all resource types specified in the `ResourceTypes` list to the [RecordingGroup](https://docs.aws.amazon.com/config/latest/APIReference/API_RecordingGroup.html) of specified configuration recorder and includes those resource types when recording.

        For this operation, the specified configuration recorder must use a [RecordingStrategy](https://docs.aws.amazon.com/config/latest/APIReference/API_RecordingStrategy.html) that is either `INCLUSION_BY_RESOURCE_TYPES` or `EXCLUSION_BY_RESOURCE_TYPES`.
    flag:
        configuration-recorder-arn: The Amazon Resource Name (ARN) of the specified configuration recorder.
        resource-types: The list of resource types you want to add to the recording group of the specified configuration recorder.
