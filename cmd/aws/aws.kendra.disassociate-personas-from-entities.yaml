name: disassociate-personas-from-entities
description: Removes the specific permissions of users or groups in your IAM Identity Center identity source with access to your Amazon Kendra experience.
flags:
    --entity-ids=!: The identifiers of users or groups in your IAM Identity Center identity source.
    --id=!: The identifier of your Amazon Kendra experience.
    --index-id=!: The identifier of the index for your Amazon Kendra experience.
documentation:
    command: Removes the specific permissions of users or groups in your IAM Identity Center identity source with access to your Amazon Kendra experience. You can create an Amazon Kendra experience such as a search application. For more information on creating a search application experience, see [Building a search experience with no code](https://docs.aws.amazon.com/kendra/latest/dg/deploying-search-experience-no-code.html).
    flag:
        entity-ids: The identifiers of users or groups in your IAM Identity Center identity source. For example, user IDs could be user emails.
        id: The identifier of your Amazon Kendra experience.
        index-id: The identifier of the index for your Amazon Kendra experience.
