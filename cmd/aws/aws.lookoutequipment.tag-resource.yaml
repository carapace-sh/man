name: tag-resource
description: Associates a given tag to a resource in your account.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the specific resource to which the tag should be associated.
    --tags=!: The tag or tags to be associated with a specific resource.
documentation:
    command: Associates a given tag to a resource in your account. A tag is a key-value pair which can be added to an Amazon Lookout for Equipment resource as metadata. Tags can be used for organizing your resources as well as helping you to search and filter by tag. Multiple tags can be added to a resource, either when you create it, or later. Up to 50 tags can be associated with each resource.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the specific resource to which the tag should be associated.
        tags: The tag or tags to be associated with a specific resource. Both the tag key and value are specified.
