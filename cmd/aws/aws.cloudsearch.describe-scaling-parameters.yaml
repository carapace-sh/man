name: describe-scaling-parameters
description: Gets the scaling parameters configured for a domain.
flags:
    --domain-name=!: ""
documentation:
    command: Gets the scaling parameters configured for a domain. A domain's scaling parameters specify the desired search instance type and replication count. For more information, see [Configuring Scaling Options](http://docs.aws.amazon.com/cloudsearch/latest/developerguide/configuring-scaling-options.html) in the *Amazon CloudSearch Developer Guide*.
    flag:
        domain-name: ""
