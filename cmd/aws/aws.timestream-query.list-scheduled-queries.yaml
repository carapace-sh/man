name: list-scheduled-queries
description: Gets a list of all scheduled queries in the caller's Amazon account and Region.
flags:
    --max-results=: The maximum number of items to return in the output.
    --next-token=: A pagination token to resume pagination.
documentation:
    command: Gets a list of all scheduled queries in the caller's Amazon account and Region. `ListScheduledQueries` is eventually consistent.
    flag:
        max-results: The maximum number of items to return in the output. If the total number of items available is more than the value specified, a `NextToken` is provided in the output. To resume pagination, provide the `NextToken` value as the argument to the subsequent call to `ListScheduledQueriesRequest`.
        next-token: A pagination token to resume pagination.
