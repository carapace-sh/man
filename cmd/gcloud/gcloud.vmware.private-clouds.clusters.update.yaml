name: update
description: Update a Google Cloud VMware Engine cluster.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --autoscaling-cool-down-period=: Cool down period (in minutes) between consecutive cluster expansions/contractions
    --autoscaling-max-cluster-node-count=: Maximum number of nodes in the cluster
    --autoscaling-min-cluster-node-count=: Minimum number of nodes in the cluster
    --autoscaling-settings-from-file=: A YAML file containing the autoscaling settings to be applied to the cluster
    --location=: Location of the private cloud or cluster.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --node-type-config=: '(DEPRECATED) '
    --private-cloud=: VMware Engine private cloud.
    --remove-autoscaling-policy=: Names of autoscaling policies that should be removed from the cluster
    --remove-nodes-config=: Type of node that should be removed from the cluster
    --update-autoscaling-policy=: Autoscaling policy to be applied to the cluster
    --update-nodes-config=: Information about the type and number of nodes associated with the cluster.
documentation:
    command: |
        Adjust the number of nodes in the VMware Engine cluster. Successful addition or removal of a node results in a cluster in READY state. Check the progress of a cluster using `gcloud vmware private-clouds clusters list`.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        autoscaling-cool-down-period: Cool down period (in minutes) between consecutive cluster expansions/contractions
        autoscaling-max-cluster-node-count: Maximum number of nodes in the cluster
        autoscaling-min-cluster-node-count: Minimum number of nodes in the cluster
        autoscaling-settings-from-file: A YAML file containing the autoscaling settings to be applied to the cluster
        location: |-
            Location of the private cloud or cluster.
            +
            To set the `location` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/zone`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        node-type-config: "(DEPRECATED) \n        Information about the type and number of nodes associated with the cluster.\n+\n        type (required): canonical identifier of the node type.\n+\n        count (required): number of nodes of this type in the cluster.\n+\n\n        custom_core_count: can be passed, but the value will be ignored. Updating custom core count is not supported.\n+\nThe --node-type-config option is deprecated; please use --update-nodes-config and --remove-nodes-config instead."
        private-cloud: |-
            VMware Engine private cloud.
            +
            To set the `private-cloud` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--private-cloud` on the command line.
        remove-autoscaling-policy: Names of autoscaling policies that should be removed from the cluster
        remove-nodes-config: Type of node that should be removed from the cluster
        update-autoscaling-policy: Autoscaling policy to be applied to the cluster
        update-nodes-config: |-
            Information about the type and number of nodes associated with the cluster.
            +
            type (required): canonical identifier of the node type.
            +
            count (required): number of nodes of this type in the cluster.
