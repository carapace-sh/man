name: update
description: Update the Cloud Source Repositories configuration of the current project.
flags:
    --add-topic=!: ID of the topic or fully qualified identifier for the topic.
    --disable-pushblock: Disable PushBlock for all repositories under current project.
    --enable-pushblock: Enable PushBlock for all repositories under current project.
    --message-format=: The format of the message to publish to the topic.
    --no-disable-pushblock&: Disable PushBlock for all repositories under current project.
    --no-enable-pushblock&: Enable PushBlock for all repositories under current project.
    --remove-topic=!: ID of the topic or fully qualified identifier for the topic.
    --service-account=: Email address of the service account used for publishing Cloud Pub/Sub messages.
    --topic-project=: Cloud project for the topic.
    --update-topic=!: ID of the topic or fully qualified identifier for the topic.
completion:
    flag:
        message-format:
            - json
            - protobuf
documentation:
    command: |-
        ## EXAMPLES

        To enable PushBlock for all repositories under current project, run:

          $ gcloud source project-configs update --enable-pushblock

        To associate a Cloud Pub/Sub topic to receive repository update notifications,
        run:

          $ gcloud source project-configs update --add-topic=TOPIC_NAME --service-account=SERVICE_ACCOUNT_EMAIL \
              --message-format=json
    flag:
        add-topic: |-
            ID of the topic or fully qualified identifier for the topic.
            +
            To set the `topic` attribute:
            * provide the argument `--add-topic` on the command line.
        disable-pushblock: |-
            Disable PushBlock for all repositories under current project.
            PushBlock allows repository owners to block git push transactions containing
            private key data.
        enable-pushblock: |-
            Enable PushBlock for all repositories under current project.
            PushBlock allows repository owners to block git push transactions containing
            private key data.
        message-format: 'The format of the message to publish to the topic. _MESSAGE_FORMAT_ must be one of: *json*, *protobuf*.'
        no-disable-pushblock: |-
            Disable PushBlock for all repositories under current project.
            PushBlock allows repository owners to block git push transactions containing
            private key data.
        no-enable-pushblock: |-
            Enable PushBlock for all repositories under current project.
            PushBlock allows repository owners to block git push transactions containing
            private key data.
        remove-topic: |-
            ID of the topic or fully qualified identifier for the topic.
            +
            To set the `topic` attribute:
            * provide the argument `--remove-topic` on the command line.
        service-account: |-
            Email address of the service account used for publishing Cloud Pub/Sub messages.
            This service account needs to be in the same project as the project. When added, the
            caller needs to have iam.serviceAccounts.actAs permission on this service
            account. If unspecified, it defaults to the Compute Engine default service
            account.
        topic-project: |-
            Cloud project for the topic. If not set, the currently set project will be
            used.
        update-topic: |-
            ID of the topic or fully qualified identifier for the topic.
            +
            To set the `topic` attribute:
            * provide the argument `--update-topic` on the command line.
