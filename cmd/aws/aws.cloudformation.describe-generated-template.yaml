name: describe-generated-template
description: Describes a generated template.
flags:
    --generated-template-name=!: The name or Amazon Resource Name (ARN) of a generated template.
documentation:
    command: Describes a generated template. The output includes details about the progress of the creation of a generated template started by a `CreateGeneratedTemplate` API action or the update of a generated template started with an `UpdateGeneratedTemplate` API action.
    flag:
        generated-template-name: The name or Amazon Resource Name (ARN) of a generated template.
