name: batch-delete-rum-metric-definitions
description: Removes the specified metrics from being sent to an extended metrics destination.
flags:
    --app-monitor-name=!: The name of the CloudWatch RUM app monitor that is sending these metrics.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --destination-arn=: This parameter is required if `Destination` is `Evidently`.
    --destination=!: Defines the destination where you want to stop sending the specified metrics.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --metric-definition-ids=!: An array of structures which define the metrics that you want to stop sending.
completion:
    flag:
        destination:
            - CloudWatch
            - Evidently
documentation:
    command: |-
        Removes the specified metrics from being sent to an extended metrics destination.

        If some metric definition IDs specified in a `BatchDeleteRumMetricDefinitions` operations are not valid, those metric definitions fail and return errors, but all valid metric definition IDs in the same operation are still deleted.

        The maximum number of metric definitions that you can specify in one `BatchDeleteRumMetricDefinitions` operation is 200.
    flag:
        app-monitor-name: The name of the CloudWatch RUM app monitor that is sending these metrics.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        destination: Defines the destination where you want to stop sending the specified metrics. Valid values are `CloudWatch` and `Evidently`. If you specify `Evidently`, you must also specify the ARN of the CloudWatchEvidently experiment that is to be the destination and an IAM role that has permission to write to the experiment.
        destination-arn: |-
            This parameter is required if `Destination` is `Evidently`. If `Destination` is `CloudWatch`, do not use this parameter.

            This parameter specifies the ARN of the Evidently experiment that was receiving the metrics that are being deleted.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        metric-definition-ids: An array of structures which define the metrics that you want to stop sending.
