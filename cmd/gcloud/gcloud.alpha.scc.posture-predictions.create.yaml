name: create
description: '*(ALPHA)*  Create a Cloud Security Command Center (SCC) posture prediction resource using AI.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --environment-options=: Path to the YAML file containing the environment options for the prediction.
    --intent=: Custom USER query string to create the prediction
    --no-async&: Return immediately, without waiting for the operation in progress to
    --parent=!: Name of the parent for which posture prediction is to be created.
    --prediction-type=!: The type of posture prediction to be created, one of [basic-posture].
completion:
    flag:
        prediction-type:
            - advanced-posture
            - basic-posture
            - natural-language-query
            - prediction-type-unspecified
documentation:
    command: |
        *(ALPHA)*  Create a Cloud Security Command Center (SCC) posture prediction using AI.

        Created posture prediction is returned as the response of the command.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        environment-options: Path to the YAML file containing the environment options for the prediction. Use a full or relative path to a local file containing the value of environment_options.
        intent: Custom USER query string to create the prediction
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        parent: |-
            Name of the parent for which posture prediction is to be created. Format:
            organizations/<organizationID>/locations/<location>
        prediction-type: 'The type of posture prediction to be created, one of [basic-posture]. _PREDICTION_TYPE_ must be one of: *advanced-posture*, *basic-posture*, *natural-language-query*, *prediction-type-unspecified*.'
