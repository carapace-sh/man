name: copy-snapshot-and-update-volume
description: Updates an existing volume by using a snapshot from another Amazon FSx for OpenZFS file system.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=: ""
    --copy-strategy=: Specifies the strategy to use when copying data from a snapshot to the volume.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --options=:
        description: Confirms that you want to delete data on the destination volume that wasn’t there during the previous snapshot replication.
        nargs: -1
    --source-snapshot-arn=!: ""
    --volume-id=!: Specifies the ID of the volume that you are copying the snapshot to.
completion:
    flag:
        copy-strategy:
            - CLONE
            - FULL_COPY
            - INCREMENTAL_COPY
documentation:
    command: Updates an existing volume by using a snapshot from another Amazon FSx for OpenZFS file system. For more information, see [on-demand data replication](https://docs.aws.amazon.com/fsx/latest/OpenZFSGuide/on-demand-replication.html) in the Amazon FSx for OpenZFS User Guide.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: ""
        copy-strategy: |-
            Specifies the strategy to use when copying data from a snapshot to the volume.

            - `FULL_COPY` - Copies all data from the snapshot to the volume.
            - `INCREMENTAL_COPY` - Copies only the snapshot data that's changed since the previous replication.

            `CLONE` isn't a valid copy strategy option for the `CopySnapshotAndUpdateVolume` operation.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        options: |-
            Confirms that you want to delete data on the destination volume that wasn’t there during the previous snapshot replication.

            Your replication will fail if you don’t include an option for a specific type of data and that data is on your destination. For example, if you don’t include `DELETE_INTERMEDIATE_SNAPSHOTS` and there are intermediate snapshots on the destination, you can’t copy the snapshot.

            - `DELETE_INTERMEDIATE_SNAPSHOTS` - Deletes snapshots on the destination volume that aren’t on the source volume.
            - `DELETE_CLONED_VOLUMES` - Deletes snapshot clones on the destination volume that aren't on the source volume.
            - `DELETE_INTERMEDIATE_DATA` - Overwrites snapshots on the destination volume that don’t match the source snapshot that you’re copying.
        source-snapshot-arn: ""
        volume-id: Specifies the ID of the volume that you are copying the snapshot to.
