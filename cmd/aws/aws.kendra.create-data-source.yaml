name: create-data-source
description: Creates a data source connector that you want to use with an Amazon Kendra index.
flags:
    --client-token=: A token that you provide to identify the request to create a data source connector.
    --configuration=: Configuration information to connect to your data source repository.
    --custom-document-enrichment-configuration=: Configuration information for altering document metadata and content during the document ingestion process.
    --description=: A description for the data source connector.
    --index-id=!: The identifier of the index you want to use with the data source connector.
    --language-code=: The code for a language.
    --name=!: A name for the data source connector.
    --role-arn=: The Amazon Resource Name (ARN) of an IAM role with permission to access the data source and required resources.
    --schedule=: Sets the frequency for Amazon Kendra to check the documents in your data source repository and update the index.
    --tags=: A list of key-value pairs that identify or categorize the data source connector.
    --type=!: The type of data source repository.
    --vpc-configuration=: Configuration information for an Amazon Virtual Private Cloud to connect to your data source.
completion:
    flag:
        type:
            - S3
            - SHAREPOINT
            - DATABASE
            - SALESFORCE
            - ONEDRIVE
            - SERVICENOW
            - CUSTOM
            - CONFLUENCE
            - GOOGLEDRIVE
            - WEBCRAWLER
            - WORKDOCS
            - FSX
            - SLACK
            - BOX
            - QUIP
            - JIRA
            - GITHUB
            - ALFRESCO
            - TEMPLATE
documentation:
    command: |-
        Creates a data source connector that you want to use with an Amazon Kendra index.

        You specify a name, data source connector type and description for your data source. You also specify configuration information for the data source connector.

        `CreateDataSource` is a synchronous operation. The operation returns 200 if the data source was successfully created. Otherwise, an exception is raised.

        For an example of creating an index and data source using the Python SDK, see [Getting started with Python SDK](https://docs.aws.amazon.com/kendra/latest/dg/gs-python.html). For an example of creating an index and data source using the Java SDK, see [Getting started with Java SDK](https://docs.aws.amazon.com/kendra/latest/dg/gs-java.html).
    flag:
        client-token: A token that you provide to identify the request to create a data source connector. Multiple calls to the `CreateDataSource` API with the same client token will create only one data source connector.
        configuration: |-
            Configuration information to connect to your data source repository.

            You can't specify the `Configuration` parameter when the `Type` parameter is set to `CUSTOM`. If you do, you receive a `ValidationException` exception.

            The `Configuration` parameter is required for all other data sources.
        custom-document-enrichment-configuration: |-
            Configuration information for altering document metadata and content during the document ingestion process.

            For more information on how to create, modify and delete document metadata, or make other content alterations when you ingest documents into Amazon Kendra, see [Customizing document metadata during the ingestion process](https://docs.aws.amazon.com/kendra/latest/dg/custom-document-enrichment.html).
        description: A description for the data source connector.
        index-id: The identifier of the index you want to use with the data source connector.
        language-code: The code for a language. This allows you to support a language for all documents when creating the data source connector. English is supported by default. For more information on supported languages, including their codes, see [Adding documents in languages other than English](https://docs.aws.amazon.com/kendra/latest/dg/in-adding-languages.html).
        name: A name for the data source connector.
        role-arn: |-
            The Amazon Resource Name (ARN) of an IAM role with permission to access the data source and required resources. For more information, see [IAM access roles for Amazon Kendra.](https://docs.aws.amazon.com/kendra/latest/dg/iam-roles.html).

            You can't specify the `RoleArn` parameter when the `Type` parameter is set to `CUSTOM`. If you do, you receive a `ValidationException` exception.

            The `RoleArn` parameter is required for all other data sources.
        schedule: |-
            Sets the frequency for Amazon Kendra to check the documents in your data source repository and update the index. If you don't set a schedule Amazon Kendra will not periodically update the index. You can call the `StartDataSourceSyncJob` API to update the index.

            Specify a `cron-` format schedule string or an empty string to indicate that the index is updated on demand.

            You can't specify the `Schedule` parameter when the `Type` parameter is set to `CUSTOM`. If you do, you receive a `ValidationException` exception.
        tags: 'A list of key-value pairs that identify or categorize the data source connector. You can also use tags to help control access to the data source connector. Tag keys and values can consist of Unicode letters, digits, white space, and any of the following symbols: _ . : / = + - @.'
        type: The type of data source repository. For example, `SHAREPOINT`.
        vpc-configuration: Configuration information for an Amazon Virtual Private Cloud to connect to your data source. For more information, see [Configuring a VPC](https://docs.aws.amazon.com/kendra/latest/dg/vpc-configuration.html).
