name: update
description: Updates an SSL certificate.
flags:
    --certificate=: The file path for the new certificate to upload.
    --display-name=: A display name for this certificate.
    --private-key=: The file path to a local RSA private key file.
documentation:
    command: Updates an SSL certificate.
    flag:
        certificate: |-
            The file path for the new certificate to upload. Must be in PEM
            x.509 format including the header and footer.
        display-name: A display name for this certificate.
        private-key: |-
            The file path to a local RSA private key file. The private key must be
            PEM encoded with header and footer and must be 2048 bits
            or fewer.
