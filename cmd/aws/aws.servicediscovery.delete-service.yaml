name: delete-service
description: Deletes a specified service and all associated service attributes.
flags:
    --id=!: The ID or Amazon Resource Name (ARN) of the service that you want to delete.
documentation:
    command: Deletes a specified service and all associated service attributes. If the service still contains one or more registered instances, the request fails.
    flag:
        id: The ID or Amazon Resource Name (ARN) of the service that you want to delete. If the namespace associated with the service is shared with your Amazon Web Services account, specify the service ARN. For more information about shared namespaces, see [Cross-account Cloud Map namespace sharing](https://docs.aws.amazon.com/cloud-map/latest/dg/sharing-namespaces.html).
