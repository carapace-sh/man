name: update
description: '*(BETA)*  Update a Compute Engine organization security policy.'
flags:
    --description=: An optional, textual description for the organization security policy.
    --json-custom-content-types=: A comma-separated list of custom Content-Type header values to apply JSON
    --json-parsing=: The JSON parsing behavior for this rule.
    --log-level=: The level of detail to display for WAF logging.
    --organization=: Organization in which the organization security policy is to be updated.
    --user-ip-request-headers=: A comma-separated list of request header names to use for resolving the
completion:
    flag:
        json-parsing:
            - DISABLED
            - STANDARD
            - STANDARD_WITH_GRAPHQL
        log-level:
            - NORMAL
            - VERBOSE
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute org-security-policies update* is used to update organization security policies. An organization
        security policy is a set of rules that controls access to various resources.
    flag:
        description: An optional, textual description for the organization security policy.
        json-custom-content-types: |-
            A comma-separated list of custom Content-Type header values to apply JSON
            parsing for preconfigured WAF rules. Only applicable when JSON parsing is
            enabled, like ``--json-parsing=STANDARD''. When configuring a Content-Type
            header value, only the type/subtype needs to be specified, and the
            parameters should be excluded.
        json-parsing: 'The JSON parsing behavior for this rule. Must be one of the following values: [DISABLED, STANDARD, STANDARD_WITH_GRAPHQL]. _JSON_PARSING_ must be one of: *DISABLED*, *STANDARD*, *STANDARD_WITH_GRAPHQL*.'
        log-level: 'The level of detail to display for WAF logging. _LOG_LEVEL_ must be one of: *NORMAL*, *VERBOSE*.'
        organization: Organization in which the organization security policy is to be updated. Must be set if SECURITY_POLICY is the short name.
        user-ip-request-headers: |-
            A comma-separated list of request header names to use for resolving the
            caller's user IP address.
