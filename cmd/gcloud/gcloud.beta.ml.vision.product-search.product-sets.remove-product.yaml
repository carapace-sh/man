name: remove-product
description: '*(BETA)*  Remove a product from a product set.'
flags:
    --location=: The location of product set.
    --product=!: The id of the product to remove from the product set.
documentation:
    command: '*(BETA)*  Remove a product from a product set.'
    flag:
        location: |-
            The location of product set.
            +
            To set the `location` attribute:
            * provide the argument `product_set` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        product: |-
            The id of the product to remove from the product set. The product must be in the same
            project and location as the specified product set.
