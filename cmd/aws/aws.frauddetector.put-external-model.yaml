name: put-external-model
description: Creates or updates an Amazon SageMaker model endpoint.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --input-configuration=!: The model endpoint input configuration.
    --invoke-model-endpoint-role-arn=!: The IAM role used to invoke the model endpoint.
    --model-endpoint-status=!: The model endpoint’s status in Amazon Fraud Detector.
    --model-endpoint=!: The model endpoints name.
    --model-source=!: The source of the model.
    --output-configuration=!: The model endpoint output configuration.
    --tags=:
        description: A collection of key and value pairs.
        nargs: -1
completion:
    flag:
        model-endpoint-status:
            - ASSOCIATED
            - DISSOCIATED
        model-source:
            - SAGEMAKER
documentation:
    command: Creates or updates an Amazon SageMaker model endpoint. You can also use this action to update the configuration of the model endpoint, including the IAM role and/or the mapped variables.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        input-configuration: The model endpoint input configuration.
        invoke-model-endpoint-role-arn: The IAM role used to invoke the model endpoint.
        model-endpoint: The model endpoints name.
        model-endpoint-status: The model endpoint’s status in Amazon Fraud Detector.
        model-source: The source of the model.
        output-configuration: The model endpoint output configuration.
        tags: A collection of key and value pairs.
