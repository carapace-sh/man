    --max-results=: The maximum number of domains to return in a single call to `ListDomains`.
    --next-token=: When the number of domains is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of domains, the response includes a pagination token named `NextToken`.
    --page-size=: The size of each page to get in the AWS service call.
