name: update-experiment
description: Adds, updates, or removes the description of an experiment.
flags:
    --description=: The description of the experiment.
    --display-name=: The name of the experiment as displayed.
    --experiment-name=!: The name of the experiment to update.
documentation:
    command: Adds, updates, or removes the description of an experiment. Updates the display name of an experiment.
    flag:
        description: The description of the experiment.
        display-name: The name of the experiment as displayed. The name doesn't need to be unique. If `DisplayName` isn't specified, `ExperimentName` is displayed.
        experiment-name: The name of the experiment to update.
