name: put-grouping-configuration
description: Creates or updates a grouping configuration that defines how services are organized and grouped in Application Signals dashboards and service maps.
flags:
    --grouping-attribute-definitions=!: An array of grouping attribute definitions that specify how services should be grouped.
documentation:
    command: |-
        Creates or updates a grouping configuration that defines how services are organized and grouped in Application Signals dashboards and service maps.

        Grouping configurations allow you to logically organize services based on attributes such as environment, team ownership, or business function, making it easier to monitor and manage related services together.
    flag:
        grouping-attribute-definitions: An array of grouping attribute definitions that specify how services should be grouped. Each definition includes the grouping name, source keys, and default values.
