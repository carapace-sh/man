name: list-nodes-summary
description: Generates a summary of managed instance/node metadata based on the filters and aggregators you specify.
flags:
    --aggregators=!: Specify one or more aggregators to return a count of managed nodes that match that expression.
    --filters=: One or more filters.
    --max-results=: The maximum number of items to return for this call.
    --next-token=: The token for the next set of items to return.
    --sync-name=: The name of the Amazon Web Services managed resource data sync to retrieve information about.
documentation:
    command: Generates a summary of managed instance/node metadata based on the filters and aggregators you specify. Results are grouped by the input aggregator you specify.
    flag:
        aggregators: Specify one or more aggregators to return a count of managed nodes that match that expression. For example, a count of managed nodes by operating system.
        filters: One or more filters. Use a filter to generate a summary that matches your specified filter criteria.
        max-results: The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: The token for the next set of items to return. (You received this token from a previous call.) The call also returns a token that you can specify in a subsequent call to get the next set of results.
        sync-name: |-
            The name of the Amazon Web Services managed resource data sync to retrieve information about.

            For cross-account/cross-Region configurations, this parameter is required, and the name of the supported resource data sync is `AWS-QuickSetup-ManagedNode`.

            For single account/single-Region configurations, the parameter is not required.
