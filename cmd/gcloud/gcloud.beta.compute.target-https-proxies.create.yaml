name: create
description: '*(BETA)*  Create a target HTTPS proxy.'
flags:
    --certificate-manager-certificates=!: IDs of the certificates or fully qualified identifiers for the certificates.
    --certificate-map=!: ID of the certificate map or fully qualified identifier for the certificate map.
    --description=: An optional, textual description for the target HTTPS proxy.
    --global: If set, the target HTTPS proxy is global.
    --global-ssl-certificates: If set, the ssl certificates are global.
    --global-ssl-policy: If set, the SSL policy is global.
    --global-url-map: If set, the URL map is global.
    --http-keep-alive-timeout-sec=: Represents the maximum amount of time that a TCP connection can be idle
    --no-global&: If set, the target HTTPS proxy is global.
    --no-global-ssl-certificates&: If set, the ssl certificates are global.
    --no-global-ssl-policy&: If set, the SSL policy is global.
    --no-global-url-map&: If set, the URL map is global.
    --quic-override=: Controls whether load balancer may negotiate QUIC with clients.
    --region=: Region of the target HTTPS proxy to create.
    --server-tls-policy=!: ID of the server_tls_policy or fully qualified identifier for the server_tls_policy.
    --ssl-certificates-region=: Region of the ssl certificates to operate on.
    --ssl-certificates=: References to at most 15 SSL certificate resources that are used for
    --ssl-policy-region=: Region of the SSL policy to operate on.
    --ssl-policy=: A reference to an SSL policy resource that defines the server-side
    --tls-early-data=: TLS 1.3 Early Data ("0-RTT" or "zero round trip") allows clients to include HTTP request data alongside a TLS handshake.
    --url-map-region=: Region of the URL map to operate on.
    --url-map=!: A reference to a URL map resource.
completion:
    flag:
        quic-override:
            - DISABLE
            - ENABLE
            - NONE
        tls-early-data:
            - DISABLED
            - PERMISSIVE
            - STRICT
documentation:
    command: |
        *(BETA)*  *gcloud beta compute target-https-proxies create* is used to create target HTTPS proxies. A target
        HTTPS proxy is referenced by one or more forwarding rules which
        specify the network traffic that the proxy is responsible for
        routing. The target HTTPS proxy points to a URL map that defines
        the rules for routing the requests. The URL map's job is to map
        URLs to backend services which handle the actual requests. The
        target HTTPS proxy also points to at most 15 SSL certificates
        used for server-side authentication. The target HTTPS proxy can
        be associated with at most one SSL policy.
    flag:
        certificate-manager-certificates: |-
            IDs of the certificates or fully qualified identifiers for the certificates.
            +
            To set the `certificate` attribute:
            * provide the argument `--certificate-manager-certificates` on the command line.
        certificate-map: |-
            ID of the certificate map or fully qualified identifier for the certificate map.
            +
            To set the `map` attribute:
            * provide the argument `--certificate-map` on the command line.
        description: An optional, textual description for the target HTTPS proxy.
        global: If set, the target HTTPS proxy is global.
        global-ssl-certificates: If set, the ssl certificates are global.
        global-ssl-policy: If set, the SSL policy is global.
        global-url-map: If set, the URL map is global.
        http-keep-alive-timeout-sec: |-
            Represents the maximum amount of time that a TCP connection can be idle
            between the (downstream) client and the target HTTP proxy. If an HTTP
            keepalive  timeout is not specified, the default value is 610 seconds.
            For global external Application Load Balancers, the minimum allowed
            value is 5 seconds and the maximum allowed value is 1200 seconds.
        no-global: If set, the target HTTPS proxy is global.
        no-global-ssl-certificates: If set, the ssl certificates are global.
        no-global-ssl-policy: If set, the SSL policy is global.
        no-global-url-map: If set, the URL map is global.
        quic-override: |-
            Controls whether load balancer may negotiate QUIC with clients. QUIC is a new transport which reduces latency compared to that of TCP. See https://www.chromium.org/quic for more details. _QUIC_OVERRIDE_ must be one of:
            +
            *DISABLE*::: Disallows load balancer to negotiate QUIC with clients.
            *ENABLE*::: Allows load balancer to negotiate QUIC with clients.
            *NONE*::: Allows Google to control when QUIC is rolled out.
            :::
            +
        region: |-
            Region of the target HTTPS proxy to create. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        server-tls-policy: |-
            ID of the server_tls_policy or fully qualified identifier for the server_tls_policy.
            +
            To set the `server_tls_policy` attribute:
            * provide the argument `--server-tls-policy` on the command line.
        ssl-certificates: |-
            References to at most 15 SSL certificate resources that are used for
            server-side authentication. The first SSL certificate in this list is
            considered the primary SSL certificate associated with the load
            balancer. The SSL certificates must exist and cannot be deleted while
            referenced by a target HTTPS proxy.
        ssl-certificates-region: |-
            Region of the ssl certificates to operate on. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        ssl-policy: |-
            A reference to an SSL policy resource that defines the server-side
            support for SSL features and affects the connections between clients
            and load balancers that are using the HTTPS proxy. The SSL
            policy must exist and cannot be
            deleted while referenced by a target HTTPS proxy.
        ssl-policy-region: Region of the SSL policy to operate on. Overrides the default *compute/region* property value for this command invocation.
        tls-early-data: |-
            TLS 1.3 Early Data ("0-RTT" or "zero round trip") allows clients to include HTTP request data alongside a TLS handshake. This can improve application performance, especially on networks where connection interruptions may be common, such as on mobile. This applies to both HTTP over TCP (ie: HTTP/1.1 and HTTP/2) and HTTP/3 over QUIC. _TLS_EARLY_DATA_ must be one of:
            +
            *DISABLED*::: TLS 1.3 Early Data is not advertised, and any (invalid) attempts to send Early Data will be rejected.
            *PERMISSIVE*::: Enables TLS 1.3 Early Data for requests with safe HTTP methods (GET, HEAD, OPTIONS, TRACE). This mode does not enforce any other limitations for requests with Early Data. The application owner should validate that Early Data is acceptable for a given request path.
            *STRICT*::: Enables TLS 1.3 Early Data for requests with safe HTTP methods, and HTTP requests that do not have query parameters. Requests that send Early Data containing non-idempotent HTTP methods or with query parameters will be rejected with a HTTP 425.
            :::
            +
        url-map: |-
            A reference to a URL map resource. A URL map defines the mapping of URLs
            to backend services. Before you can refer to a URL map, you must
            create the URL map. To delete a URL map that a target proxy is referring
            to, you must first delete the target HTTPS proxy.
        url-map-region: Region of the URL map to operate on. Overrides the default *compute/region* property value for this command invocation.
