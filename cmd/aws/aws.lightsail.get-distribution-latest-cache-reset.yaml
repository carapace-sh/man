name: get-distribution-latest-cache-reset
description: Returns the timestamp and status of the last cache reset of a specific Amazon Lightsail content delivery network (CDN) distribution.
flags:
    --distribution-name=: The name of the distribution for which to return the timestamp of the last cache reset.
documentation:
    command: Returns the timestamp and status of the last cache reset of a specific Amazon Lightsail content delivery network (CDN) distribution.
    flag:
        distribution-name: |-
            The name of the distribution for which to return the timestamp of the last cache reset.

            Use the `GetDistributions` action to get a list of distribution names that you can specify.

            When omitted, the response includes the latest cache reset timestamp of all your distributions.
