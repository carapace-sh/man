name: modify-vpc-tenancy
description: Modifies the instance tenancy attribute of the specified VPC.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-tenancy=!: The instance tenancy attribute for the VPC.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --vpc-id=!: The ID of the VPC.
completion:
    flag:
        instance-tenancy:
            - default
documentation:
    command: |-
        Modifies the instance tenancy attribute of the specified VPC. You can change the instance tenancy attribute of a VPC to `default` only. You cannot change the instance tenancy attribute to `dedicated`.

        After you modify the tenancy of the VPC, any new instances that you launch into the VPC have a tenancy of `default`, unless you specify otherwise during launch. The tenancy of any existing instances in the VPC is not affected.

        For more information, see [Dedicated Instances](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-instance.html) in the *Amazon EC2 User Guide*.
