name: list-dataset-export-jobs
description: Returns a list of dataset export jobs that use the given dataset.
flags:
    --dataset-arn=: The Amazon Resource Name (ARN) of the dataset to list the dataset export jobs for.
    --max-results=: The maximum number of dataset export jobs to return.
    --next-token=: A token returned from the previous call to `ListDatasetExportJobs` for getting the next set of dataset export jobs (if they exist).
documentation:
    command: Returns a list of dataset export jobs that use the given dataset. When a dataset is not specified, all the dataset export jobs associated with the account are listed. The response provides the properties for each dataset export job, including the Amazon Resource Name (ARN). For more information on dataset export jobs, see [CreateDatasetExportJob](https://docs.aws.amazon.com/personalize/latest/dg/API_CreateDatasetExportJob.html). For more information on datasets, see [CreateDataset](https://docs.aws.amazon.com/personalize/latest/dg/API_CreateDataset.html).
    flag:
        dataset-arn: The Amazon Resource Name (ARN) of the dataset to list the dataset export jobs for.
        max-results: The maximum number of dataset export jobs to return.
        next-token: A token returned from the previous call to `ListDatasetExportJobs` for getting the next set of dataset export jobs (if they exist).
