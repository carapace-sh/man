name: start-model
description: Starts the running of the version of an Amazon Lookout for Vision model.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: ClientToken is an idempotency token that ensures a call to `StartModel` completes only once.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-inference-units=: The maximum number of inference units to use for auto-scaling the model.
    --min-inference-units=!: The minimum number of inference units to use.
    --model-version=!: The version of the model that you want to start.
    --project-name=!: The name of the project that contains the model that you want to start.
documentation:
    command: |-
        Starts the running of the version of an Amazon Lookout for Vision model. Starting a model takes a while to complete. To check the current state of the model, use [DescribeModel]().

        A model is ready to use when its status is `HOSTED`.

        Once the model is running, you can detect custom labels in new images by calling [DetectAnomalies]().

        You are charged for the amount of time that the model is running. To stop a running model, call [StopModel]().

        This operation requires permissions to perform the `lookoutvision:StartModel` operation.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: |-
            ClientToken is an idempotency token that ensures a call to `StartModel` completes only once. You choose the value to pass. For example, An issue might prevent you from getting a response from `StartModel`. In this case, safely retry your call to `StartModel` by using the same `ClientToken` parameter value.

            If you don't supply a value for `ClientToken`, the AWS SDK you are using inserts a value for you. This prevents retries after a network error from making multiple start requests. You'll need to provide your own value for other use cases.

            An error occurs if the other input parameters are not the same as in the first request. Using a different value for `ClientToken` is considered a new call to `StartModel`. An idempotency token is active for 8 hours.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-inference-units: The maximum number of inference units to use for auto-scaling the model. If you don't specify a value, Amazon Lookout for Vision doesn't auto-scale the model.
        min-inference-units: The minimum number of inference units to use. A single inference unit represents 1 hour of processing. Use a higher number to increase the TPS throughput of your model. You are charged for the number of inference units that you use.
        model-version: The version of the model that you want to start.
        project-name: The name of the project that contains the model that you want to start.
