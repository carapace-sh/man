name: reset-enabled-baseline
description: Re-enables an `EnabledBaseline` resource.
flags:
    --enabled-baseline-identifier=!: Specifies the ID of the `EnabledBaseline` resource to be re-enabled, in ARN format.
documentation:
    command: Re-enables an `EnabledBaseline` resource. For example, this API can re-apply the existing `Baseline` after a new member account is moved to the target OU. For usage examples, see [*the Amazon Web Services Control Tower User Guide*](https://docs.aws.amazon.com/controltower/latest/userguide/baseline-api-examples.html) .
    flag:
        enabled-baseline-identifier: Specifies the ID of the `EnabledBaseline` resource to be re-enabled, in ARN format.
