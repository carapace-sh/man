name: create-app-engine-task
description: '*(ALPHA)*  Create and add a task that targets App Engine.'
flags:
    --header=: An HTTP request header.
    --location=: The location where we want to manage the queue or task.
    --method=: The HTTP method to use for the request.
    --payload-content=: Data payload used by the task worker to process the task.
    --payload-file=: File containing data payload used by the task worker to process the
    --queue=!: The queue the task belongs to.
    --routing=: The route to be used for this task.
    --schedule-time=: The time when the task is scheduled to be first attempted.
    --url=: The relative URL of the request.
documentation:
    command: |
        *(ALPHA)*  Create and add a task that targets App Engine.
    flag:
        header: |-
            An HTTP request header. Header values can contain commas. This flag
            can be repeated. Repeated header fields will have their values
            overridden.
        location: The location where we want to manage the queue or task. If not specified, uses the location of the current project's App Engine app if there is an associated app.
        method: |-
            The HTTP method to use for the request. If not specified, "POST" will
            be used.
        payload-content: Data payload used by the task worker to process the task.
        payload-file: |-
            File containing data payload used by the task worker to process the
            task.
        queue: The queue the task belongs to.
        routing: |-
            The route to be used for this task. KEY must be at least one of:
            [service, version, instance]. Any missing keys will use the default.
            +
            Routing can be overridden by the queue-level `--routing-override`
            flag.
        schedule-time: |-
            The time when the task is scheduled to be first attempted. Defaults to
            "now" if not specified.
        url: |-
            The relative URL of the request. Must begin with "/" and must be a
            valid HTTP relative URL. It can contain a path and query string
            arguments. If not specified, then the root path "/" will be used.
