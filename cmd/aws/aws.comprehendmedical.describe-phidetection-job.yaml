name: describe-phidetection-job
description: Gets the properties associated with a protected health information (PHI) detection job.
flags:
    --job-id=!: The identifier that Amazon Comprehend Medical generated for the job.
documentation:
    command: Gets the properties associated with a protected health information (PHI) detection job. Use this operation to get the status of a detection job.
    flag:
        job-id: The identifier that Amazon Comprehend Medical generated for the job. The `StartPHIDetectionJob` operation returns this identifier in its response.
