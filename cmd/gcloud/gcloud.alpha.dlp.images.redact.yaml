    --info-types=: Which infoTypes to scan input for.
    --min-likelihood=: Only return findings equal to or above this threshold.
    --no-include-quote&: If True, a contextual quote from the data that triggered a
    --no-redact-all-text&: If specified, all text info in the image will be removed,
