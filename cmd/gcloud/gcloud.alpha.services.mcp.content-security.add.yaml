name: add
description: '*(ALPHA)*  Add MCP content security provider of a project.'
documentation:
    command: |-
        *(ALPHA)*  Add MCP content security provider of a project.

        ## EXAMPLES

        Add MCP content security provider  of a project:

          $ gcloud alpha services mcp content-security add my-mcp-content-security-provider

        Add MCP content security provider of a project `my-project`:

          $ gcloud alpha services mcp content-security add my-mcp-content-security-provider --project=my-project
