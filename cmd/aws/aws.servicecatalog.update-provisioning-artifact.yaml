name: update-provisioning-artifact
description: Updates the specified provisioning artifact (also known as a version) for the specified product.
flags:
    --accept-language=: The language code.
    --active=: Indicates whether the product version is active.
    --description=: The updated description of the provisioning artifact.
    --guidance=: Information set by the administrator to provide guidance to end users about which provisioning artifacts to use.
    --name=: The updated name of the provisioning artifact.
    --product-id=!: The product identifier.
    --provisioning-artifact-id=!: The identifier of the provisioning artifact.
completion:
    flag:
        guidance:
            - DEFAULT
            - DEPRECATED
documentation:
    command: |-
        Updates the specified provisioning artifact (also known as a version) for the specified product.

        You cannot update a provisioning artifact for a product that was shared with you.
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        active: |-
            Indicates whether the product version is active.

            Inactive provisioning artifacts are invisible to end users. End users cannot launch or update a provisioned product from an inactive provisioning artifact.
        description: The updated description of the provisioning artifact.
        guidance: |-
            Information set by the administrator to provide guidance to end users about which provisioning artifacts to use.

            The `DEFAULT` value indicates that the product version is active.

            The administrator can set the guidance to `DEPRECATED` to inform users that the product version is deprecated. Users are able to make updates to a provisioned product of a deprecated version but cannot launch new provisioned products using a deprecated version.
        name: The updated name of the provisioning artifact.
        product-id: The product identifier.
        provisioning-artifact-id: The identifier of the provisioning artifact.
