name: get-insights
description: Lists and describes insights for the specified insight ARNs.
flags:
    --insight-arns=: The ARNs of the insights to describe.
    --max-results=: The maximum number of items to return in the response.
    --next-token=: The token that is required for pagination.
documentation:
    command: Lists and describes insights for the specified insight ARNs.
    flag:
        insight-arns: The ARNs of the insights to describe. If you don't provide any insight ARNs, then `GetInsights` returns all of your custom insights. It does not return any managed insights.
        max-results: The maximum number of items to return in the response.
        next-token: |-
            The token that is required for pagination. On your first call to the `GetInsights` operation, set the value of this parameter to `NULL`.

            For subsequent calls to the operation, to continue listing data, set the value of this parameter to the value returned from the previous response.
