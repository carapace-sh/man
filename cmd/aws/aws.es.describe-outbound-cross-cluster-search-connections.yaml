name: describe-outbound-cross-cluster-search-connections
description: Lists all the outbound cross-cluster search connections for a source domain.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --filters=: A list of filters used to match properties for outbound cross-cluster search connection.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: Set this value to limit the number of results returned.
    --next-token=: NextToken is sent in case the earlier API call results contain the NextToken.
documentation:
    command: Lists all the outbound cross-cluster search connections for a source domain.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        filters: |-
            A list of filters used to match properties for outbound cross-cluster search connection. Available `Filter` names for this operation are:

            - cross-cluster-search-connection-id
            - destination-domain-info.domain-name
            - destination-domain-info.owner-id
            - destination-domain-info.region
            - source-domain-info.domain-name
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: Set this value to limit the number of results returned. If not specified, defaults to 100.
        next-token: NextToken is sent in case the earlier API call results contain the NextToken. It is used for pagination.
