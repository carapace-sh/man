name: update-project
description: Updates a machine learning (ML) project that is created from a template that sets up an ML pipeline from training to deploying an approved model.
flags:
    --project-description=: The description for the project.
    --project-name=!: The name of the project.
    --service-catalog-provisioning-update-details=: The product ID and provisioning artifact ID to provision a service catalog.
    --tags=: An array of key-value pairs.
    --template-providers-to-update=: The template providers to update in the project.
documentation:
    command: |-
        Updates a machine learning (ML) project that is created from a template that sets up an ML pipeline from training to deploying an approved model.

        You must not update a project that is in use. If you update the `ServiceCatalogProvisioningUpdateDetails` of a project that is active or being created, or updated, you may lose resources already created by the project.
    flag:
        project-description: The description for the project.
        project-name: The name of the project.
        service-catalog-provisioning-update-details: The product ID and provisioning artifact ID to provision a service catalog. The provisioning artifact ID will default to the latest provisioning artifact ID of the product, if you don't provide the provisioning artifact ID. For more information, see [What is Amazon Web Services Service Catalog](https://docs.aws.amazon.com/servicecatalog/latest/adminguide/introduction.html).
        tags: An array of key-value pairs. You can use tags to categorize your Amazon Web Services resources in different ways, for example, by purpose, owner, or environment. For more information, see [Tagging Amazon Web Services Resources](https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html). In addition, the project must have tag update constraints set in order to include this parameter in the request. For more information, see [Amazon Web Services Service Catalog Tag Update Constraints](https://docs.aws.amazon.com/servicecatalog/latest/adminguide/constraints-resourceupdate.html).
        template-providers-to-update: The template providers to update in the project.
