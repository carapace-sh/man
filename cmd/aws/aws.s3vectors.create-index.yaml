name: create-index
description: Amazon S3 Vectors is in preview release for Amazon S3 and is subject to change.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --data-type=!: The data type of the vectors to be inserted into the vector index.
    --dimension=!: The dimensions of the vectors to be inserted into the vector index.
    --distance-metric=!: The distance metric to be used for similarity search.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --index-name=!: The name of the vector index to create.
    --metadata-configuration=: The metadata configuration for the vector index.
    --vector-bucket-arn=: The Amazon Resource Name (ARN) of the vector bucket to create the vector index in.
    --vector-bucket-name=: The name of the vector bucket to create the vector index in.
completion:
    flag:
        data-type:
            - float32
        distance-metric:
            - euclidean
            - cosine
documentation:
    command: |-
        Amazon S3 Vectors is in preview release for Amazon S3 and is subject to change.

        Creates a vector index within a vector bucket. To specify the vector bucket, you must use either the vector bucket name or the vector bucket Amazon Resource Name (ARN).

        Permissions

        You must have the `s3vectors:CreateIndex` permission to use this operation.
    flag:
