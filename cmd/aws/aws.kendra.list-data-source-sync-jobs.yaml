name: list-data-source-sync-jobs
description: Gets statistics about synchronizing a data source connector.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --id=!: The identifier of the data source connector.
    --index-id=!: The identifier of the index used with the data source connector.
    --max-results=: The maximum number of synchronization jobs to return in the response.
    --next-token=: If the previous response was incomplete (because there is more data to retrieve), Amazon Kendra returns a pagination token in the response.
    --start-time-filter=: When specified, the synchronization jobs returned in the list are limited to jobs between the specified dates.
    --status-filter=: Only returns synchronization jobs with the `Status` field equal to the specified status.
completion:
    flag:
        status-filter:
            - FAILED
            - SUCCEEDED
            - SYNCING
            - INCOMPLETE
            - STOPPING
            - ABORTED
            - SYNCING_INDEXING
documentation:
    command: Gets statistics about synchronizing a data source connector.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        id: The identifier of the data source connector.
        index-id: The identifier of the index used with the data source connector.
        max-results: The maximum number of synchronization jobs to return in the response. If there are fewer results in the list, this response contains only the actual results.
        next-token: If the previous response was incomplete (because there is more data to retrieve), Amazon Kendra returns a pagination token in the response. You can use this pagination token to retrieve the next set of jobs.
        start-time-filter: When specified, the synchronization jobs returned in the list are limited to jobs between the specified dates.
        status-filter: Only returns synchronization jobs with the `Status` field equal to the specified status.
