name: list-batch-load-tasks
description: Provides a list of batch load tasks, along with the name, status, when the task is resumable until, and other details.
flags:
    --max-results=: The total number of items to return in the output.
    --next-token=: A token to specify where to start paginating.
    --task-status=: Status of the batch load task.
completion:
    flag:
        task-status:
            - CREATED
            - IN_PROGRESS
            - FAILED
            - SUCCEEDED
            - PROGRESS_STOPPED
            - PENDING_RESUME
documentation:
    command: Provides a list of batch load tasks, along with the name, status, when the task is resumable until, and other details. See [code sample](https://docs.aws.amazon.com/timestream/latest/developerguide/code-samples.list-batch-load-tasks.html) for details.
    flag:
        max-results: The total number of items to return in the output. If the total number of items available is more than the value specified, a NextToken is provided in the output. To resume pagination, provide the NextToken value as argument of a subsequent API invocation.
        next-token: A token to specify where to start paginating. This is the NextToken from a previously truncated response.
        task-status: Status of the batch load task.
