name: modify-subnet-attribute
description: Modifies a subnet attribute.
flags:
    --assign-ipv6-address-on-creation: Specify `true` to indicate that network interfaces created in the specified subnet should be assigned an IPv6 address.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --customer-owned-ipv4-pool=: The customer-owned IPv4 address pool associated with the subnet.
    --disable-lni-at-device-index: Specify `true` to indicate that local network interfaces at the current position should be disabled.
    --enable-dns64: Indicates whether DNS queries made to the Amazon-provided DNS Resolver in this subnet should return synthetic IPv6 addresses for IPv4-only destinations.
    --enable-lni-at-device-index=: Indicates the device position for local network interfaces in this subnet.
    --enable-resource-name-dns-a-record-on-launch: Indicates whether to respond to DNS queries for instance hostnames with DNS A records.
    --enable-resource-name-dns-aaaa-record-on-launch: Indicates whether to respond to DNS queries for instance hostnames with DNS AAAA records.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --map-customer-owned-ip-on-launch: Specify `true` to indicate that network interfaces attached to instances created in the specified subnet should be assigned a customer-owned IPv4 address.
    --map-public-ip-on-launch: Specify `true` to indicate that network interfaces attached to instances created in the specified subnet should be assigned a public IPv4 address.
    --no-assign-ipv6-address-on-creation: Specify `true` to indicate that network interfaces created in the specified subnet should be assigned an IPv6 address.
    --no-disable-lni-at-device-index: Specify `true` to indicate that local network interfaces at the current position should be disabled.
    --no-enable-dns64: Indicates whether DNS queries made to the Amazon-provided DNS Resolver in this subnet should return synthetic IPv6 addresses for IPv4-only destinations.
    --no-enable-resource-name-dns-a-record-on-launch: Indicates whether to respond to DNS queries for instance hostnames with DNS A records.
    --no-enable-resource-name-dns-aaaa-record-on-launch: Indicates whether to respond to DNS queries for instance hostnames with DNS AAAA records.
    --no-map-customer-owned-ip-on-launch: Specify `true` to indicate that network interfaces attached to instances created in the specified subnet should be assigned a customer-owned IPv4 address.
    --no-map-public-ip-on-launch: Specify `true` to indicate that network interfaces attached to instances created in the specified subnet should be assigned a public IPv4 address.
    --private-dns-hostname-type-on-launch=: The type of hostname to assign to instances in the subnet at launch.
    --subnet-id=!: The ID of the subnet.
completion:
    flag:
        private-dns-hostname-type-on-launch:
            - ip-name
            - resource-name
documentation:
    command: |-
        Modifies a subnet attribute. You can only modify one attribute at a time.

        Use this action to modify subnets on Amazon Web Services Outposts.

        - To modify a subnet on an Outpost rack, set both `MapCustomerOwnedIpOnLaunch` and `CustomerOwnedIpv4Pool`. These two parameters act as a single attribute.
        - To modify a subnet on an Outpost server, set either `EnableLniAtDeviceIndex` or `DisableLniAtDeviceIndex`.

        For more information about Amazon Web Services Outposts, see the following:

        - [Outpost servers](https://docs.aws.amazon.com/outposts/latest/userguide/how-servers-work.html)
        - [Outpost racks](https://docs.aws.amazon.com/outposts/latest/userguide/how-racks-work.html)
    flag:
        assign-ipv6-address-on-creation: |-
            Specify `true` to indicate that network interfaces created in the specified subnet should be assigned an IPv6 address. This includes a network interface that's created when launching an instance into the subnet (the instance therefore receives an IPv6 address).

            If you enable the IPv6 addressing feature for your subnet, your network interface or instance only receives an IPv6 address if it's created using version `2016-11-15` or later of the Amazon EC2 API.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        customer-owned-ipv4-pool: |-
            The customer-owned IPv4 address pool associated with the subnet.

            You must set this value when you specify `true` for `MapCustomerOwnedIpOnLaunch`.
        disable-lni-at-device-index: Specify `true` to indicate that local network interfaces at the current position should be disabled.
        enable-dns64: |-
            Indicates whether DNS queries made to the Amazon-provided DNS Resolver in this subnet should return synthetic IPv6 addresses for IPv4-only destinations.

            You must first configure a NAT gateway in a public subnet (separate from the subnet containing the IPv6-only workloads). For example, the subnet containing the NAT gateway should have a `0.0.0.0/0` route pointing to the internet gateway. For more information, see [Configure DNS64 and NAT64](https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-nat64-dns64.html#nat-gateway-nat64-dns64-walkthrough) in the *Amazon VPC User Guide*.
        enable-lni-at-device-index: Indicates the device position for local network interfaces in this subnet. For example, `1` indicates local network interfaces in this subnet are the secondary network interface (eth1). A local network interface cannot be the primary network interface (eth0).
        enable-resource-name-dns-a-record-on-launch: Indicates whether to respond to DNS queries for instance hostnames with DNS A records.
        enable-resource-name-dns-aaaa-record-on-launch: Indicates whether to respond to DNS queries for instance hostnames with DNS AAAA records.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        map-customer-owned-ip-on-launch: |-
            Specify `true` to indicate that network interfaces attached to instances created in the specified subnet should be assigned a customer-owned IPv4 address.

            When this value is `true`, you must specify the customer-owned IP pool using `CustomerOwnedIpv4Pool`.
        map-public-ip-on-launch: |-
            Specify `true` to indicate that network interfaces attached to instances created in the specified subnet should be assigned a public IPv4 address.

            Amazon Web Services charges for all public IPv4 addresses, including public IPv4 addresses associated with running instances and Elastic IP addresses. For more information, see the *Public IPv4 Address* tab on the [Amazon VPC pricing page](http://aws.amazon.com/vpc/pricing/).
        private-dns-hostname-type-on-launch: The type of hostname to assign to instances in the subnet at launch. For IPv4-only and dual-stack (IPv4 and IPv6) subnets, an instance DNS name can be based on the instance IPv4 address (ip-name) or the instance ID (resource-name). For IPv6 only subnets, an instance DNS name must be based on the instance ID (resource-name).
        subnet-id: The ID of the subnet.
