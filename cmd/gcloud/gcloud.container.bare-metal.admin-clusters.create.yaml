name: create
description: Create an Anthos on bare metal admin cluster.
flags:
    --admin-users=!: Users that will be granted the view role on the admin cluster, providing view only access to the cluster.
    --annotations=: Annotations on the Anthos on bare metal resource.
    --api-server-args=: API Server argument configuration.
    --async: Return immediately, without waiting for the operation in progress to
    --binauthz-evaluation-mode=: Set Binary Authorization evaluation mode for this cluster.
    --control-plane-load-balancer-port=!: Control plane load balancer port configuration.
    --control-plane-node-configs-from-file=&: ""
    --control-plane-node-configs=: Control plane node configuration.
    --control-plane-node-labels=: Labels assigned to nodes of a node pool.
    --control-plane-node-taints=: Node taint applied to every Kubernetes node in a node pool.
    --control-plane-vip=!: VIP for the Kubernetes API of this cluster.
    --description=: Description for the resource.
    --enable-application-logs: Whether collection of application logs/metrics should be enabled (in addition to system logs/metrics).
    --enable-manual-lb!: ManualLB typed load balancers configuration.
    --island-mode-pod-address-cidr-blocks=!: IPv4 address range for all pods in the cluster.
    --island-mode-service-address-cidr-blocks=!: IPv4 address range for all services in the cluster.
    --location=: Google Cloud location for the admin_cluster.
    --login-user=: User name used to access node machines.
    --lvp-node-mounts-config-path=!: Path for the LVP node mounts class.
    --lvp-node-mounts-config-storage-class=!: Storage class for LVP node mounts.
    --lvp-share-path=!: Path for the LVP share class.
    --lvp-share-storage-class=!: Storage class for LVP share.
    --maintenance-address-cidr-blocks=!: IPv4 addresses to be placed into maintenance mode.
    --max-pods-per-node=: Maximum number of pods a node can run.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-enable-application-logs&: Whether collection of application logs/metrics should be enabled (in addition to system logs/metrics).
    --no-enable-manual-lb!&: ManualLB typed load balancers configuration.
    --no-proxy=: List of IPs, hostnames, and domains that should skip the proxy.
    --no-validate-only&: If set, only validate the request, but do not actually perform the operation.
    --shared-path-pv-count=: Number of subdirectories to create under path.
    --uri=!: Address of the proxy server.
    --validate-only: If set, only validate the request, but do not actually perform the operation.
completion:
    flag:
        binauthz-evaluation-mode:
            - DISABLED
            - PROJECT_SINGLETON_POLICY_ENFORCE
documentation:
    command: Create an Anthos on bare metal admin cluster.
    flag:
        admin-users: Users that will be granted the view role on the admin cluster, providing view only access to the cluster.
        annotations: Annotations on the Anthos on bare metal resource.
        api-server-args: API Server argument configuration.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        binauthz-evaluation-mode: 'Set Binary Authorization evaluation mode for this cluster. _BINAUTHZ_EVALUATION_MODE_ must be one of: *DISABLED*, *PROJECT_SINGLETON_POLICY_ENFORCE*.'
        control-plane-load-balancer-port: Control plane load balancer port configuration.
        control-plane-node-configs: Control plane node configuration.
        control-plane-node-configs-from-file: |+
            Path of the YAML/JSON file that contains the control plane node configs.

            Examples:

              nodeConfigs:
              - nodeIP: 10.200.0.10
                labels:
                  node1: label1
                  node2: label2
              - nodeIP: 10.200.0.11
                labels:
                  node3: label3
                  node4: label4

            List of supported fields in `nodeConfigs`

            KEY           | VALUE                     | NOTE
            --------------|---------------------------|---------------------------
            nodeIP        | string                    | required, mutable
            labels        | one or more key-val pairs | optional, mutable

        control-plane-node-labels: Labels assigned to nodes of a node pool.
        control-plane-node-taints: Node taint applied to every Kubernetes node in a node pool.
        control-plane-vip: VIP for the Kubernetes API of this cluster.
        description: Description for the resource.
        enable-application-logs: Whether collection of application logs/metrics should be enabled (in addition to system logs/metrics).
        enable-manual-lb: ManualLB typed load balancers configuration.
        island-mode-pod-address-cidr-blocks: IPv4 address range for all pods in the cluster.
        island-mode-service-address-cidr-blocks: IPv4 address range for all services in the cluster.
        location: |-
            Google Cloud location for the admin_cluster.
            +
            To set the `location` attribute:
            * provide the argument `admin_cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_bare_metal/location`.
        login-user: User name used to access node machines.
        lvp-node-mounts-config-path: Path for the LVP node mounts class.
        lvp-node-mounts-config-storage-class: Storage class for LVP node mounts.
        lvp-share-path: Path for the LVP share class.
        lvp-share-storage-class: Storage class for LVP share.
        maintenance-address-cidr-blocks: IPv4 addresses to be placed into maintenance mode.
        max-pods-per-node: Maximum number of pods a node can run.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-enable-application-logs: Whether collection of application logs/metrics should be enabled (in addition to system logs/metrics).
        no-enable-manual-lb: ManualLB typed load balancers configuration.
        no-proxy: List of IPs, hostnames, and domains that should skip the proxy.
        no-validate-only: If set, only validate the request, but do not actually perform the operation.
        shared-path-pv-count: Number of subdirectories to create under path.
        uri: Address of the proxy server.
        validate-only: If set, only validate the request, but do not actually perform the operation.
