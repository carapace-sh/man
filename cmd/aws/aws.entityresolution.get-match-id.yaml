name: get-match-id
description: Returns the corresponding Match ID of a customer record if the record has been processed in a rule-based matching workflow.
flags:
    --apply-normalization: Normalizes the attributes defined in the schema in the input data.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-apply-normalization: Normalizes the attributes defined in the schema in the input data.
    --record=!: The record to fetch the Match ID for.
    --workflow-name=!: The name of the workflow.
documentation:
    command: |-
        Returns the corresponding Match ID of a customer record if the record has been processed in a rule-based matching workflow.

        You can call this API as a dry run of an incremental load on the rule-based matching workflow.
    flag:
        apply-normalization: Normalizes the attributes defined in the schema in the input data. For example, if an attribute has an `AttributeType` of `PHONE_NUMBER`, and the data in the input table is in a format of 1234567890, Entity Resolution will normalize this field in the output to (123)-456-7890.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        record: The record to fetch the Match ID for.
        workflow-name: The name of the workflow.
