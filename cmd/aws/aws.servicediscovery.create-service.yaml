name: create-service
description: Creates a service.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --creator-request-id=: A unique string that identifies the request and that allows failed `CreateService` requests to be retried without the risk of running the operation twice.
    --description=: A description for the service.
    --dns-config=: A complex type that contains information about the Amazon Route 53 records that you want Cloud Map to create when you register an instance.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --health-check-config=: '*Public DNS and HTTP namespaces only.* A complex type that contains settings for an optional Route 53 health check.'
    --health-check-custom-config=: A complex type that contains information about an optional custom health check.
    --name=!: The name that you want to assign to the service.
    --namespace-id=: The ID or Amazon Resource Name (ARN) of the namespace that you want to use to create the service.
    --tags=:
        description: The tags to add to the service.
        nargs: -1
    --type=: If present, specifies that the service instances are only discoverable using the `DiscoverInstances` API operation.
completion:
    flag:
        type:
            - HTTP
documentation:
    command: "Creates a service. This action defines the configuration for the following entities:\n\n- For public and private DNS namespaces, one of the following combinations of DNS records in Amazon Route 53:\n  \n  - `A`\n  - `AAAA`\n  - `A` and `AAAA`\n  - `SRV`\n  - `CNAME`\n- Optionally, a health check\n\nAfter you create the service, you can submit a [RegisterInstance](https://docs.aws.amazon.com/cloud-map/latest/api/API_RegisterInstance.html) request, and Cloud Map uses the values in the configuration to create the specified entities.\n\nFor the current quota on the number of instances that you can register using the same namespace and using the same service, see [Cloud Map quotas](https://docs.aws.amazon.com/cloud-map/latest/dg/cloud-map-limits.html) in the *Cloud Map Developer Guide*."
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        creator-request-id: A unique string that identifies the request and that allows failed `CreateService` requests to be retried without the risk of running the operation twice. `CreatorRequestId` can be any unique string (for example, a date/timestamp).
        description: A description for the service.
        dns-config: A complex type that contains information about the Amazon Route 53 records that you want Cloud Map to create when you register an instance.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        health-check-config: |-
            *Public DNS and HTTP namespaces only.* A complex type that contains settings for an optional Route 53 health check. If you specify settings for a health check, Cloud Map associates the health check with all the Route 53 DNS records that you specify in `DnsConfig`.

            If you specify a health check configuration, you can specify either `HealthCheckCustomConfig` or `HealthCheckConfig` but not both.

            For information about the charges for health checks, see [Cloud Map Pricing](http://aws.amazon.com/cloud-map/pricing/).
        health-check-custom-config: |-
            A complex type that contains information about an optional custom health check.

            If you specify a health check configuration, you can specify either `HealthCheckCustomConfig` or `HealthCheckConfig` but not both.

            You can't add, update, or delete a `HealthCheckCustomConfig` configuration from an existing service.
        name: |-
            The name that you want to assign to the service.

            Do not include sensitive information in the name if the namespace is discoverable by public DNS queries.

            If you want Cloud Map to create an `SRV` record when you register an instance and you're using a system that requires a specific `SRV` format, such as [HAProxy](http://www.haproxy.org/), specify the following for `Name`:

            - Start the name with an underscore (\_), such as `_exampleservice`.
            - End the name with *.\_protocol*, such as `._tcp`.

            When you register an instance, Cloud Map creates an `SRV` record and assigns a name to the record by concatenating the service name and the namespace name (for example,

            `_exampleservice._tcp.example.com`).

            For services that are accessible by DNS queries, you can't create multiple services with names that differ only by case (such as EXAMPLE and example). Otherwise, these services have the same DNS name and can't be distinguished. However, if you use a namespace that's only accessible by API calls, then you can create services that with names that differ only by case.
        namespace-id: The ID or Amazon Resource Name (ARN) of the namespace that you want to use to create the service. For namespaces shared with your Amazon Web Services account, specify the namespace ARN. For more information about shared namespaces, see [Cross-account Cloud Map namespace sharing](https://docs.aws.amazon.com/cloud-map/latest/dg/sharing-namespaces.html) in the *Cloud Map Developer Guide*.
        tags: The tags to add to the service. Each tag consists of a key and an optional value that you define. Tags keys can be up to 128 characters in length, and tag values can be up to 256 characters in length.
        type: If present, specifies that the service instances are only discoverable using the `DiscoverInstances` API operation. No DNS records is registered for the service instances. The only valid value is `HTTP`.
