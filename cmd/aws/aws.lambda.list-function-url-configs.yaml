name: list-function-url-configs
description: Returns a list of Lambda function URLs for the specified function.
flags:
    --function-name=!: The name or ARN of the Lambda function.
    --marker=: Specify the pagination token that's returned by a previous request to retrieve the next page of results.
    --max-items=: The maximum number of function URLs to return in the response.
documentation:
    command: Returns a list of Lambda function URLs for the specified function.
    flag:
        function-name: |-
            The name or ARN of the Lambda function.

            **Name formats**

            - **Function name** – `my-function`.
            - **Function ARN** – `arn:aws:lambda:us-west-2:123456789012:function:my-function`.
            - **Partial ARN** – `123456789012:function:my-function`.

            The length constraint applies only to the full ARN. If you specify only the function name, it is limited to 64 characters in length.
        marker: Specify the pagination token that's returned by a previous request to retrieve the next page of results.
        max-items: The maximum number of function URLs to return in the response. Note that `ListFunctionUrlConfigs` returns a maximum of 50 items in each response, even if you set the number higher.
