name: set-instance-protection
description: Updates the instance protection settings of the specified instances.
flags:
    --auto-scaling-group-name=!: The name of the Auto Scaling group.
    --instance-ids=!: One or more instance IDs.
    --protected-from-scale-in=!: Indicates whether the instance is protected from termination by Amazon EC2 Auto Scaling when scaling in.
documentation:
    command: |-
        Updates the instance protection settings of the specified instances. This operation cannot be called on instances in a warm pool.

        For more information, see [Use instance scale-in protection](https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-instance-protection.html) in the *Amazon EC2 Auto Scaling User Guide*.

        If you exceed your maximum limit of instance IDs, which is 50 per Auto Scaling group, the call fails.
    flag:
        auto-scaling-group-name: The name of the Auto Scaling group.
        instance-ids: One or more instance IDs. You can specify up to 50 instances.
        protected-from-scale-in: Indicates whether the instance is protected from termination by Amazon EC2 Auto Scaling when scaling in.
