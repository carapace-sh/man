name: start-import-job
description: Start an asynchronous job to import Amazon Q in Connect resources from an uploaded source file.
flags:
    --client-token=: The tags used to organize, track, or control access for this resource.
    --external-source-configuration=: The configuration information of the external source that the resource data are imported from.
    --import-job-type=!: The type of the import job.
    --knowledge-base-id=!: The identifier of the knowledge base.
    --metadata=: The metadata fields of the imported Amazon Q in Connect resources.
    --upload-id=!: A pointer to the uploaded asset.
completion:
    flag:
        import-job-type:
            - QUICK_RESPONSES
documentation:
    command: |-
        Start an asynchronous job to import Amazon Q in Connect resources from an uploaded source file. Before calling this API, use [StartContentUpload](https://docs.aws.amazon.com/wisdom/latest/APIReference/API_StartContentUpload.html) to upload an asset that contains the resource data.

        - For importing Amazon Q in Connect quick responses, you need to upload a csv file including the quick responses. For information about how to format the csv file for importing quick responses, see [Import quick responses](https://docs.aws.amazon.com/console/connect/quick-responses/add-data).
    flag:
        client-token: The tags used to organize, track, or control access for this resource.
        external-source-configuration: The configuration information of the external source that the resource data are imported from.
        import-job-type: |-
            The type of the import job.

            - For importing quick response resource, set the value to `QUICK_RESPONSES`.
        knowledge-base-id: |-
            The identifier of the knowledge base. Can be either the ID or the ARN. URLs cannot contain the ARN.

            - For importing Amazon Q in Connect quick responses, this should be a `QUICK_RESPONSES` type knowledge base.
        metadata: The metadata fields of the imported Amazon Q in Connect resources.
        upload-id: A pointer to the uploaded asset. This value is returned by [StartContentUpload](https://docs.aws.amazon.com/wisdom/latest/APIReference/API_StartContentUpload.html).
