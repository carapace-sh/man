name: add-bgp-peer
description: Add a BGP peer to a Distributed Cloud Edge Network router.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --interface=!: The name of the interface for this BGP peer.
    --location=: The Cloud location for the router.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --peer-asn=!: The BGP autonomous system number (ASN) for this BGP peer.
    --peer-ipv4-range=: The IPv4 link-local address range of the peer router.
    --peer-name=!: The name of the new BGP peer being added.
    --zone=: The zone of the router.
documentation:
    command: Create a BGP peer to a Distributed Cloud Edge Network router
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        interface: The name of the interface for this BGP peer.
        location: |-
            The Cloud location for the router.
            +
            To set the `location` attribute:
            * provide the argument `router` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        peer-asn: The BGP autonomous system number (ASN) for this BGP peer. Must be a 16-bit or 32-bit private ASN as defined in https://tools.ietf.org/html/rfc6996, for example `--asn=64512`.
        peer-ipv4-range: The IPv4 link-local address range of the peer router.
        peer-name: The name of the new BGP peer being added.
        zone: |-
            The zone of the router.
            +
            To set the `zone` attribute:
            * provide the argument `router` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line.
