name: list-databases
description: Lists the SAP HANA databases of an application registered with AWS Systems Manager for SAP.
flags:
    --application-id=: The ID of the application.
    --component-id=: The ID of the component.
    --max-results=: The maximum number of results to return with a single call.
    --next-token=: The token for the next page of results.
documentation:
    command: Lists the SAP HANA databases of an application registered with AWS Systems Manager for SAP.
    flag:
        application-id: The ID of the application.
        component-id: The ID of the component.
        max-results: The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned nextToken value. If you do not specify a value for MaxResults, the request returns 50 items per page by default.
        next-token: The token for the next page of results.
