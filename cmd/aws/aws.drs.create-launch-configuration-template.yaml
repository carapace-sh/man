name: create-launch-configuration-template
description: Creates a new Launch Configuration Template.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --copy-private-ip: Copy private IP.
    --copy-tags: Copy tags.
    --export-bucket-arn=: S3 bucket ARN to export Source Network templates.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --launch-disposition=: Launch disposition.
    --launch-into-source-instance: DRS will set the 'launch into instance ID' of any source server when performing a drill, recovery or failback to the previous region or availability zone, using the instance ID of the source instance.
    --licensing=: Licensing.
    --no-copy-private-ip: Copy private IP.
    --no-copy-tags: Copy tags.
    --no-launch-into-source-instance: DRS will set the 'launch into instance ID' of any source server when performing a drill, recovery or failback to the previous region or availability zone, using the instance ID of the source instance.
    --no-post-launch-enabled: Whether we want to activate post-launch actions.
    --post-launch-enabled: Whether we want to activate post-launch actions.
    --tags=: Request to associate tags during creation of a Launch Configuration Template.
    --target-instance-type-right-sizing-method=: Target instance type right-sizing method.
completion:
    flag:
        launch-disposition:
            - STOPPED
            - STARTED
        target-instance-type-right-sizing-method:
            - NONE
            - BASIC
            - IN_AWS
documentation:
    command: Creates a new Launch Configuration Template.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        copy-private-ip: Copy private IP.
        copy-tags: Copy tags.
        export-bucket-arn: S3 bucket ARN to export Source Network templates.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        launch-disposition: Launch disposition.
        launch-into-source-instance: DRS will set the 'launch into instance ID' of any source server when performing a drill, recovery or failback to the previous region or availability zone, using the instance ID of the source instance.
        licensing: Licensing.
        post-launch-enabled: Whether we want to activate post-launch actions.
        tags: Request to associate tags during creation of a Launch Configuration Template.
        target-instance-type-right-sizing-method: Target instance type right-sizing method.
