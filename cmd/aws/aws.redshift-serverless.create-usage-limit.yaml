name: create-usage-limit
description: Creates a usage limit for a specified Amazon Redshift Serverless usage type.
flags:
    --amount=!: The limit amount.
    --breach-action=: The action that Amazon Redshift Serverless takes when the limit is reached.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --period=: The time period that the amount applies to.
    --resource-arn=!: The Amazon Resource Name (ARN) of the Amazon Redshift Serverless resource to create the usage limit for.
    --usage-type=!: The type of Amazon Redshift Serverless usage to create a usage limit for.
completion:
    flag:
        breach-action:
            - log
            - emit-metric
            - deactivate
        period:
            - daily
            - weekly
            - monthly
        usage-type:
            - serverless-compute
            - cross-region-datasharing
documentation:
    command: Creates a usage limit for a specified Amazon Redshift Serverless usage type. The usage limit is identified by the returned usage limit identifier.
    flag:
        amount: The limit amount. If time-based, this amount is in Redshift Processing Units (RPU) consumed per hour. If data-based, this amount is in terabytes (TB) of data transferred between Regions in cross-account sharing. The value must be a positive number.
        breach-action: The action that Amazon Redshift Serverless takes when the limit is reached. The default is log.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        period: The time period that the amount applies to. A weekly period begins on Sunday. The default is monthly.
        resource-arn: The Amazon Resource Name (ARN) of the Amazon Redshift Serverless resource to create the usage limit for.
        usage-type: The type of Amazon Redshift Serverless usage to create a usage limit for.
