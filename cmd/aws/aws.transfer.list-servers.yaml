name: list-servers
description: Lists the file transfer protocol-enabled servers that are associated with your Amazon Web Services account.
flags:
    --max-results=: Specifies the number of servers to return as a response to the `ListServers` query.
    --next-token=: When additional results are obtained from the `ListServers` command, a `NextToken` parameter is returned in the output.
documentation:
    command: Lists the file transfer protocol-enabled servers that are associated with your Amazon Web Services account.
    flag:
        max-results: Specifies the number of servers to return as a response to the `ListServers` query.
        next-token: When additional results are obtained from the `ListServers` command, a `NextToken` parameter is returned in the output. You can then pass the `NextToken` parameter in a subsequent command to continue listing additional servers.
