name: update-model-package
description: Updates a versioned model.
flags:
    --additional-inference-specifications-to-add=: An array of additional Inference Specification objects to be added to the existing array additional Inference Specification.
    --approval-description=: A description for the approval status of the model.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique token that guarantees that the call to this API is idempotent.
    --customer-metadata-properties-to-remove=: The metadata properties associated with the model package versions to remove.
    --customer-metadata-properties=: The metadata properties associated with the model package versions.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --inference-specification=: 'Specifies details about inference jobs that you can run with models based on this model package, including the following information:'
    --model-approval-status=: The approval status of the model.
    --model-card=: The model card associated with the model package.
    --model-life-cycle=: A structure describing the current state of the model in its life cycle.
    --model-package-arn=!: The Amazon Resource Name (ARN) of the model package.
    --source-uri=: The URI of the source for the model package.
completion:
    flag:
        model-approval-status:
            - Approved
            - Rejected
            - PendingManualApproval
documentation:
    command: Updates a versioned model.
    flag:
        additional-inference-specifications-to-add: An array of additional Inference Specification objects to be added to the existing array additional Inference Specification. Total number of additional Inference Specifications can not exceed 15. Each additional Inference Specification specifies artifacts based on this model package that can be used on inference endpoints. Generally used with SageMaker Neo to store the compiled artifacts.
        approval-description: A description for the approval status of the model.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique token that guarantees that the call to this API is idempotent.
        customer-metadata-properties: The metadata properties associated with the model package versions.
        customer-metadata-properties-to-remove: The metadata properties associated with the model package versions to remove.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        inference-specification: |-
            Specifies details about inference jobs that you can run with models based on this model package, including the following information:

            - The Amazon ECR paths of containers that contain the inference code and model artifacts.
            - The instance types that the model package supports for transform jobs and real-time endpoints used for inference.
            - The input and output content formats that the model package supports for inference.
        model-approval-status: The approval status of the model.
        model-card: The model card associated with the model package. Since `ModelPackageModelCard` is tied to a model package, it is a specific usage of a model card and its schema is simplified compared to the schema of `ModelCard`. The `ModelPackageModelCard` schema does not include `model_package_details`, and `model_overview` is composed of the `model_creator` and `model_artifact` properties. For more information about the model package model card schema, see [Model package model card schema](https://docs.aws.amazon.com/sagemaker/latest/dg/model-registry-details.html#model-card-schema). For more information about the model card associated with the model package, see [View the Details of a Model Version](https://docs.aws.amazon.com/sagemaker/latest/dg/model-registry-details.html).
        model-life-cycle: A structure describing the current state of the model in its life cycle.
        model-package-arn: The Amazon Resource Name (ARN) of the model package.
        source-uri: The URI of the source for the model package.
