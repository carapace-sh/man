name: get-tile
description: '`GetTile` returns a tile.'
flags:
    --additional-features=:
        description: A list of optional additional parameters such as map styles that can be requested for each result.
        nargs: -1
    --key=: 'Optional: The API key to be used for authorization.'
    --tileset=!: Specifies the desired tile set.
    --x=!: The X axis value for the map tile.
    --y=!: The Y axis value for the map tile.
    --z=!: The zoom value for the map tile.
completion:
    positional:
        - - $files
documentation:
    command: |-
        `GetTile` returns a tile. Map tiles are used by clients to render a map. they're addressed using a grid arrangement with an X coordinate, Y coordinate, and Z (zoom) level.

        For more information, see [Tiles](https://docs.aws.amazon.com/location/latest/developerguide/tiles.html) in the *Amazon Location Service Developer Guide*.
    flag:
        additional-features: A list of optional additional parameters such as map styles that can be requested for each result.
        key: 'Optional: The API key to be used for authorization. Either an API key or valid SigV4 signature must be provided when making a request.'
        tileset: |-
            Specifies the desired tile set.

            Valid Values: `raster.satellite | vector.basemap`
        x: The X axis value for the map tile. Must be between 0 and 19.
        "y": The Y axis value for the map tile.
        z: The zoom value for the map tile.
