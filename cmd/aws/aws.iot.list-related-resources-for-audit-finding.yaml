name: list-related-resources-for-audit-finding
description: The related resources of an Audit finding.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --finding-id=!: The finding Id.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of results to return at one time.
    --next-token=: A token that can be used to retrieve the next set of results, or `null` if there are no additional results.
    --page-size=: The size of each page to get in the AWS service call.
    --starting-token=: A token to specify where to start paginating.
documentation:
    command: |-
        The related resources of an Audit finding. The following resources can be returned from calling this API:

        - DEVICE\_CERTIFICATE
        - CA\_CERTIFICATE
        - IOT\_POLICY
        - COGNITO\_IDENTITY\_POOL
        - CLIENT\_ID
        - ACCOUNT\_SETTINGS
        - ROLE\_ALIAS
        - IAM\_ROLE
        - ISSUER\_CERTIFICATE

        This API is similar to DescribeAuditFinding's [RelatedResources](https://docs.aws.amazon.com/iot/latest/apireference/API_DescribeAuditFinding.html) but provides pagination and is not limited to 10 resources. When calling [DescribeAuditFinding](https://docs.aws.amazon.com/iot/latest/apireference/API_DescribeAuditFinding.html) for the intermediate CA revoked for active device certificates check, RelatedResources will not be populated. You must use this API, ListRelatedResourcesForAuditFinding, to list the certificates.
