name: get-administrator-account
description: Provides the details of the GuardDuty administrator account associated with the current GuardDuty member account.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --detector-id=!: The unique ID of the detector of the GuardDuty member account.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
documentation:
    command: |-
        Provides the details of the GuardDuty administrator account associated with the current GuardDuty member account.

        Based on the type of account that runs this API, the following list shows how the API behavior varies:

        - When the GuardDuty administrator account runs this API, it will return success (`HTTP 200`) but no content.
        - When a member account runs this API, it will return the details of the GuardDuty administrator account that is associated with this calling member account.
        - When an individual account (not associated with an organization) runs this API, it will return success (`HTTP 200`) but no content.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        detector-id: The unique ID of the detector of the GuardDuty member account.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
