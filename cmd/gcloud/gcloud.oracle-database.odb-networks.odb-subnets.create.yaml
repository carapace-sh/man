name: create
description: Create a new OdbSubnet.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --cidr-range=!: The CIDR range of the subnet.
    --labels=: Labels or tags associated with the resource.
    --location=: The location id of the odbSubnet resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --odb-network=: The odbNetwork id of the odbSubnet resource.
    --purpose=!: Purpose of the subnet.
    --request-id=: An optional ID to identify the request.
completion:
    flag:
        purpose:
            - backup-subnet
            - client-subnet
documentation:
    command: Create a new OdbSubnet.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        cidr-range: The CIDR range of the subnet.
        labels: |-
            Labels or tags associated with the resource.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: |-
            The location id of the odbSubnet resource.
            +
            To set the `location` attribute:
            * provide the argument `odb_subnet` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        odb-network: |-
            The odbNetwork id of the odbSubnet resource.
            +
            To set the `odb-network` attribute:
            * provide the argument `odb_subnet` on the command line with a fully specified name;
            * provide the argument `--odb-network` on the command line.
        purpose: |-
            Purpose of the subnet. _PURPOSE_ must be one of:
            +
            *backup-subnet*::: Subnet to be used for backup.
            *client-subnet*::: Subnet to be used for client connections.
            :::
            +
        request-id: |-
            An optional ID to identify the request. This value is used to identify
            duplicate requests. If you make a request with the same request ID
            and the original request is still in progress or completed, the server
            ignores the second request. This prevents clients from
            accidentally creating duplicate commitments.
            +
            The request ID must be a valid UUID with the exception that zero UUID is
            not supported (00000000-0000-0000-0000-000000000000).
