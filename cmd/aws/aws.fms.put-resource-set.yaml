name: put-resource-set
description: Creates the resource set.
flags:
    --resource-set=!: Details about the resource set to be created or updated.&gt;
    --tag-list=: Retrieves the tags associated with the specified resource set.
documentation:
    command: |-
        Creates the resource set.

        An Firewall Manager resource set defines the resources to import into an Firewall Manager policy from another Amazon Web Services service.
    flag:
        resource-set: Details about the resource set to be created or updated.&gt;
        tag-list: Retrieves the tags associated with the specified resource set. Tags are key:value pairs that you can use to categorize and manage your resources, for purposes like billing. For example, you might set the tag key to "customer" and the value to the customer name or ID. You can specify one or more tags to add to each Amazon Web Services resource, up to 50 tags for a resource.
