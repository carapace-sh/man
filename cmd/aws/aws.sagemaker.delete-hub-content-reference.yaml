name: delete-hub-content-reference
description: Delete a hub content reference in order to remove a model from a private hub.
flags:
    --hub-content-name=!: The name of the hub content to delete.
    --hub-content-type=!: The type of hub content reference to delete.
    --hub-name=!: The name of the hub to delete the hub content reference from.
completion:
    flag:
        hub-content-type:
            - Model
            - Notebook
            - ModelReference
documentation:
    command: Delete a hub content reference in order to remove a model from a private hub.
    flag:
        hub-content-name: The name of the hub content to delete.
        hub-content-type: The type of hub content reference to delete. The only supported type of hub content reference to delete is `ModelReference`.
        hub-name: The name of the hub to delete the hub content reference from.
