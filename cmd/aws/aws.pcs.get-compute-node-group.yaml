name: get-compute-node-group
description: Returns detailed information about a compute node group.
flags:
    --cluster-identifier=!: The name or ID of the cluster.
    --compute-node-group-identifier=!: The name or ID of the compute node group.
documentation:
    command: Returns detailed information about a compute node group. This API action provides networking information, EC2 instance type, compute node group status, and scheduler (such as Slurm) configuration.
    flag:
        cluster-identifier: The name or ID of the cluster.
        compute-node-group-identifier: The name or ID of the compute node group.
