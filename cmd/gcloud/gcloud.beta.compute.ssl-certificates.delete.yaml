name: delete
description: '*(BETA)*  Delete Compute Engine SSL certificates.'
flags:
    --global: If set, the SSL certificates are global.
    --no-global&: If set, the SSL certificates are global.
    --region=: Region of the SSL certificates to delete.
documentation:
    command: |
        *(BETA)*  *gcloud beta compute ssl-certificates delete* deletes one or more Compute Engine SSL certificate
        resources. SSL certificates can only be deleted when no other resources
        (for example, target HTTPS proxies) refer to them.
    flag:
        global: If set, the SSL certificates are global.
        no-global: If set, the SSL certificates are global.
        region: |-
            Region of the SSL certificates to delete. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
