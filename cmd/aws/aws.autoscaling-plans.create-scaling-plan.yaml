name: create-scaling-plan
description: Creates a scaling plan.
flags:
    --application-source=!: A CloudFormation stack or set of tags.
    --scaling-instructions=!: The scaling instructions.
    --scaling-plan-name=!: The name of the scaling plan.
documentation:
    command: Creates a scaling plan.
    flag:
        application-source: |-
            A CloudFormation stack or set of tags. You can create one scaling plan per application source.

            For more information, see [ApplicationSource](https://docs.aws.amazon.com/autoscaling/plans/APIReference/API_ApplicationSource.html) in the *AWS Auto Scaling API Reference*.
        scaling-instructions: |-
            The scaling instructions.

            For more information, see [ScalingInstruction](https://docs.aws.amazon.com/autoscaling/plans/APIReference/API_ScalingInstruction.html) in the *AWS Auto Scaling API Reference*.
        scaling-plan-name: The name of the scaling plan. Names cannot contain vertical bars, colons, or forward slashes.
