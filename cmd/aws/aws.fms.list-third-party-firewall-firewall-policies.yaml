name: list-third-party-firewall-firewall-policies
description: Retrieves a list of all of the third-party firewall policies that are associated with the third-party firewall administrator's account.
flags:
    --max-results=!: The maximum number of third-party firewall policies that you want Firewall Manager to return.
    --next-token=: If the previous response included a `NextToken` element, the specified third-party firewall vendor is associated with more third-party firewall policies.
    --third-party-firewall=!: The name of the third-party firewall vendor.
completion:
    flag:
        third-party-firewall:
            - PALO_ALTO_NETWORKS_CLOUD_NGFW
            - FORTIGATE_CLOUD_NATIVE_FIREWALL
documentation:
    command: Retrieves a list of all of the third-party firewall policies that are associated with the third-party firewall administrator's account.
    flag:
        max-results: The maximum number of third-party firewall policies that you want Firewall Manager to return. If the specified third-party firewall vendor is associated with more than `MaxResults` firewall policies, the response includes a `NextToken` element. `NextToken` contains an encrypted token that identifies the first third-party firewall policies that Firewall Manager will return if you submit another request.
        next-token: |-
            If the previous response included a `NextToken` element, the specified third-party firewall vendor is associated with more third-party firewall policies. To get more third-party firewall policies, submit another `ListThirdPartyFirewallFirewallPoliciesRequest` request.

            For the value of `NextToken`, specify the value of `NextToken` from the previous response. If the previous response didn't include a `NextToken` element, there are no more third-party firewall policies to get.
        third-party-firewall: The name of the third-party firewall vendor.
