name: create-certificate
description: Creates an SSL/TLS certificate for an Amazon Lightsail content delivery network (CDN) distribution and a container service.
flags:
    --certificate-name=!: The name for the certificate.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-name=!: The domain name (`example.com`) for the certificate.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --subject-alternative-names=: An array of strings that specify the alternate domains (`example2.com`) and subdomains (`blog.example.com`) for the certificate.
    --tags=: The tag keys and optional values to add to the certificate during create.
documentation:
    command: |-
        Creates an SSL/TLS certificate for an Amazon Lightsail content delivery network (CDN) distribution and a container service.

        After the certificate is valid, use the `AttachCertificateToDistribution` action to use the certificate and its domains with your distribution. Or use the `UpdateContainerService` action to use the certificate and its domains with your container service.

        Only certificates created in the `us-east-1` Amazon Web Services Region can be attached to Lightsail distributions. Lightsail distributions are global resources that can reference an origin in any Amazon Web Services Region, and distribute its content globally. However, all distributions are located in the `us-east-1` Region.
    flag:
        certificate-name: The name for the certificate.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain-name: The domain name (`example.com`) for the certificate.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        subject-alternative-names: |-
            An array of strings that specify the alternate domains (`example2.com`) and subdomains (`blog.example.com`) for the certificate.

            You can specify a maximum of nine alternate domains (in addition to the primary domain name).

            Wildcard domain entries (`*.example.com`) are not supported.
        tags: |-
            The tag keys and optional values to add to the certificate during create.

            Use the `TagResource` action to tag a resource after it's created.
