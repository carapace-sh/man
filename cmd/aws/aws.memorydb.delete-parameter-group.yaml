name: delete-parameter-group
description: Deletes the specified parameter group.
flags:
    --parameter-group-name=!: The name of the parameter group to delete.
documentation:
    command: Deletes the specified parameter group. You cannot delete a parameter group if it is associated with any clusters. You cannot delete the default parameter groups in your account.
    flag:
        parameter-group-name: The name of the parameter group to delete.
