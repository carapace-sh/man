name: list-recommendation-summaries
description: Returns a concise representation of savings estimates for resources.
flags:
    --filter=: ""
    --group-by=!: The grouping of recommendations by a dimension.
    --max-results=: The maximum number of recommendations to be returned for the request.
    --metrics=: Additional metrics to be returned for the request.
    --next-token=: The token to retrieve the next set of results.
documentation:
    command: |-
        Returns a concise representation of savings estimates for resources. Also returns de-duped savings across different types of recommendations.

        The following filters are not supported for this API: `recommendationIds`, `resourceArns`, and `resourceIds`.
    flag:
        filter: ""
        group-by: The grouping of recommendations by a dimension.
        max-results: The maximum number of recommendations to be returned for the request.
        metrics: Additional metrics to be returned for the request. The only valid value is `savingsPercentage`.
        next-token: The token to retrieve the next set of results.
