name: reload-tables
description: Reloads the target database table with the source data.
flags:
    --reload-option=: Options for reload.
    --replication-task-arn=!: The Amazon Resource Name (ARN) of the replication task.
    --tables-to-reload=!: The name and schema of the table to be reloaded.
completion:
    flag:
        reload-option:
            - data-reload
            - validate-only
documentation:
    command: |-
        Reloads the target database table with the source data.

        You can only use this operation with a task in the `RUNNING` state, otherwise the service will throw an `InvalidResourceStateFault` exception.
    flag:
        reload-option: |-
            Options for reload. Specify `data-reload` to reload the data and re-validate it if validation is enabled. Specify `validate-only` to re-validate the table. This option applies only when validation is enabled for the task.

            Valid values: data-reload, validate-only

            Default value is data-reload.
        replication-task-arn: The Amazon Resource Name (ARN) of the replication task.
        tables-to-reload: The name and schema of the table to be reloaded.
