name: list-task-templates
description: Lists task templates for the specified Amazon Connect instance.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --max-results=: The maximum number of results to return per page.
    --name=: The name of the task template.
    --next-token=: The token for the next set of results.
    --status=: Marks a template as `ACTIVE` or `INACTIVE` for a task to refer to it.
completion:
    flag:
        status:
            - ACTIVE
            - INACTIVE
documentation:
    command: Lists task templates for the specified Amazon Connect instance.
    flag:
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        max-results: |-
            The maximum number of results to return per page.

            It is not expected that you set this.
        name: The name of the task template.
        next-token: |-
            The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.

            It is not expected that you set this because the value returned in the previous response is always null.
        status: Marks a template as `ACTIVE` or `INACTIVE` for a task to refer to it. Tasks can only be created from `ACTIVE` templates. If a template is marked as `INACTIVE`, then a task that refers to this template cannot be created.
