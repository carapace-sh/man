name: upgrade
description: Commands to support Container Registry to Artifact Registry upgrade.
documentation:
    command: |-
        To print an equivalent Artifact Registry IAM policy for 'gcr.io/my-project':

            $ gcloud artifacts docker upgrade print-iam-policy gcr.io --project=my-project

        To migrate a project from Container Registry to Artifact Registry using gcr.io
        repos:

            $ gcloud artifacts docker upgrade migrate --projects=my-project

        To migrate a project from Container Registry to Artifact Registry using
        pkg.dev repos:

            $ gcloud artifacts docker upgrade migrate --from-gcr-io=gcr.io/from-project \
              --to-pkg-dev=to-project/to-repo
