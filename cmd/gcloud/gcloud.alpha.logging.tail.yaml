name: tail
description: '*(ALPHA)*  Tail log entries.'
flags:
    --billing-account=: Billing account of the log entries to tail.
    --bucket=!: Id of the bucket.
    --buffer-window=: The duration of time for which entries should be buffered for ordering before being returned.
    --folder=: Folder of the log entries to tail.
    --location=!: Location of the bucket.
    --organization=: Organization of the log entries to tail.
    --view=!: Id of the view.
documentation:
    command: |
        *(ALPHA)*  gcloud alpha logging tail streams newly received log entries. Log entries matching
        `log-filter` are returned in the order that Cloud Logging received
        them. If the log entries come from multiple logs, then entries from
        different logs might be mixed in the results. To help return log
        entries in order, use `--buffer-window`.

        Before you can use gcloud alpha logging tail, you must complete the installation
        instructions at
        [Live tailing log entries](https://cloud.google.com/logging/docs/reference/tools/gcloud-logging#live-tailing).

        For the quotas and limits associated with gcloud alpha logging tail,
        see [Logging API quotas and limits](https://cloud.google.com/logging/quotas#api-limits).
    flag:
        billing-account: Billing account of the log entries to tail.
        bucket: Id of the bucket. If this argument is provided, then `--location` and `--view` must also be specified.
        buffer-window: The duration of time for which entries should be buffered for ordering before being returned. A longer buffer window helps to return logs in chronological order, but it also increases the latency from when entries are received by Cloud Logging to when they are returned. If unset, Cloud Logging will use 2s by default.
        folder: Folder of the log entries to tail.
        location: Location of the bucket. If this argument is provided, then `--bucket` and `--view` must also be specified.
        organization: Organization of the log entries to tail.
        view: Id of the view. If this argument is provided, then `--location` and `--bucket` must also be specified.
