name: list-events
description: Lists events in an AgentCore Memory resource based on specified criteria.
flags:
    --actor-id=!: The identifier of the actor for which to list events.
    --filter=: Filter criteria to apply when listing events.
    --include-payloads: Specifies whether to include event payloads in the response.
    --max-results=: The maximum number of results to return in a single call.
    --memory-id=!: The identifier of the AgentCore Memory resource for which to list events.
    --next-token=: The token for the next set of results.
    --no-include-payloads&: Specifies whether to include event payloads in the response.
    --session-id=!: The identifier of the session for which to list events.
documentation:
    command: |-
        Lists events in an AgentCore Memory resource based on specified criteria. We recommend using pagination to ensure that the operation returns quickly and successfully.

        To use this operation, you must have the `bedrock-agentcore:ListEvents` permission.
    flag:
        actor-id: The identifier of the actor for which to list events. If specified, only events from this actor are returned.
        filter: Filter criteria to apply when listing events.
        include-payloads: Specifies whether to include event payloads in the response. Set to true to include payloads, or false to exclude them.
        max-results: The maximum number of results to return in a single call. Minimum value of 1, maximum value of 100. Default is 20.
        memory-id: The identifier of the AgentCore Memory resource for which to list events.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        session-id: The identifier of the session for which to list events. If specified, only events from this session are returned.
