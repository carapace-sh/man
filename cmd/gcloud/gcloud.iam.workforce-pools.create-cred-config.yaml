name: create-cred-config
description: Create a configuration file for generated credentials.
flags:
    --credential-source-field-name=: Subject token field name (key) in a JSON credential source.
    --credential-source-file=: The location of the file which stores the credential.
    --credential-source-headers=: Headers to use when querying the credential-source-url.
    --credential-source-type=: Format of the credential source (JSON or text).
    --credential-source-url=: The URL to obtain the credential from.
    --enable-mtls&: Use mTLS for STS endpoints.
    --executable-command=: The full command to run to retrieve the credential.
    --executable-interactive-timeout-millis=: Timeout duration, in milliseconds, to wait for the executable to finish when the command is running in interactive mode.
    --executable-output-file=: Absolute path to the file storing the executable response.
    --executable-timeout-millis=: Timeout duration, in milliseconds, to wait for the executable to finish.
    --no-enable-mtls&: Use mTLS for STS endpoints.
    --output-file=!: Location to store the generated credential configuration file.
    --service-account-token-lifetime-seconds=: Lifetime duration of the service account access token in seconds.
    --service-account=!: Email of the service account to impersonate.
    --subject-token-type=: The type of token being used for authorization.
    --workforce-pool-user-project=!: The client project number used to identify the application (client project) to the server when calling Google APIs.
documentation:
    command: |-
        This command creates a configuration file to allow access to authenticated
        Google Cloud actions from a variety of external user accounts.
    flag:
        credential-source-field-name: Subject token field name (key) in a JSON credential source.
        credential-source-file: The location of the file which stores the credential.
        credential-source-headers: Headers to use when querying the credential-source-url.
        credential-source-type: Format of the credential source (JSON or text).
        credential-source-url: The URL to obtain the credential from.
        enable-mtls: Use mTLS for STS endpoints.
        executable-command: The full command to run to retrieve the credential. Must be an absolute path for the program including arguments.
        executable-interactive-timeout-millis: Timeout duration, in milliseconds, to wait for the executable to finish when the command is running in interactive mode.
        executable-output-file: Absolute path to the file storing the executable response.
        executable-timeout-millis: Timeout duration, in milliseconds, to wait for the executable to finish.
        no-enable-mtls: Use mTLS for STS endpoints.
        output-file: Location to store the generated credential configuration file.
        service-account: Email of the service account to impersonate.
        service-account-token-lifetime-seconds: Lifetime duration of the service account access token in seconds. Defaults to one hour if not specified. If a lifetime greater than one hour is required, the service account must be added as an allowed value in an Organization Policy that enforces the `constraints/iam.allowServiceAccountCredentialLifetimeExtension` constraint.
        subject-token-type: The type of token being used for authorization. This defaults to urn:ietf:params:oauth:token-type:id_token.
        workforce-pool-user-project: The client project number used to identify the application (client project) to the server when calling Google APIs. The user principal must have serviceusage.services.use IAM permission to use the specified project.
