name: list-versions
description: Lists available versions of Grafana.
flags:
    --max-results=: The maximum number of results to include in the response.
    --next-token=: The token to use when requesting the next set of results.
    --workspace-id=: The ID of the workspace to list the available upgrade versions.
documentation:
    command: Lists available versions of Grafana. These are available when calling `CreateWorkspace`. Optionally, include a workspace to list the versions to which it can be upgraded.
    flag:
        max-results: The maximum number of results to include in the response.
        next-token: The token to use when requesting the next set of results. You receive this token from a previous `ListVersions` operation.
        workspace-id: The ID of the workspace to list the available upgrade versions. If not included, lists all versions of Grafana that are supported for `CreateWorkspace`.
