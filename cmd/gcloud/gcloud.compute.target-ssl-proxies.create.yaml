name: create
description: Create a target SSL proxy.
flags:
    --backend-service=!: A backend service that will be used for connections to the target SSL
    --certificate-map=!: ID of the certificate map or fully qualified identifier for the certificate map.
    --description=: An optional, textual description for the target SSL proxy.
    --global-ssl-policy: If set, the SSL policy is global.
    --no-global-ssl-policy&: If set, the SSL policy is global.
    --proxy-header=: The type of proxy protocol header to be sent to the backend.
    --ssl-certificates=: References to at most 15 SSL certificate resources that are used for
    --ssl-policy-region=: Region of the SSL policy to operate on.
    --ssl-policy=: A reference to an SSL policy resource that defines the server-side
completion:
    flag:
        proxy-header:
            - NONE
            - PROXY_V1
documentation:
    command: |-
        *gcloud compute target-ssl-proxies create* is used to create target SSL proxies. A target SSL proxy is
        referenced by one or more forwarding rules which define which packets the
        proxy is responsible for routing. The target SSL proxy points to a backend
        service which handle the actual requests. The target SSL proxy also points
        to at most 15 SSL certificates used for server-side authentication or one
        certificate map. The target SSL proxy can be associated with at most one SSL
        policy.
    flag:
        backend-service: |-
            A backend service that will be used for connections to the target SSL
            proxy.
        certificate-map: |-
            ID of the certificate map or fully qualified identifier for the certificate map.
            +
            To set the `map` attribute:
            * provide the argument `--certificate-map` on the command line.
        description: An optional, textual description for the target SSL proxy.
        global-ssl-policy: If set, the SSL policy is global.
        no-global-ssl-policy: If set, the SSL policy is global.
        proxy-header: |-
            The type of proxy protocol header to be sent to the backend. _PROXY_HEADER_ must be one of:
            +
            *NONE*::: No proxy header is added.
            *PROXY_V1*::: Enables PROXY protocol (version 1) for passing client connection information.
            :::
            +
        ssl-certificates: |-
            References to at most 15 SSL certificate resources that are used for
            server-side authentication. The first SSL certificate in this list is
            considered the primary SSL certificate associated with the load
            balancer. The SSL certificates must exist and cannot be deleted while
            referenced by a target SSL proxy.
        ssl-policy: |-
            A reference to an SSL policy resource that defines the server-side
            support for SSL features and affects the connections between clients
            and load balancers that are using the SSL proxy. The SSL
            policy must exist and cannot be
            deleted while referenced by a target SSL proxy.
        ssl-policy-region: Region of the SSL policy to operate on. Overrides the default *compute/region* property value for this command invocation.
