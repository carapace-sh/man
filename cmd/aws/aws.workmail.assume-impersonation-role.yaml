name: assume-impersonation-role
description: Assumes an impersonation role for the given WorkMail organization.
flags:
    --impersonation-role-id=!: The impersonation role ID to assume.
    --organization-id=!: The WorkMail organization under which the impersonation role will be assumed.
documentation:
    command: Assumes an impersonation role for the given WorkMail organization. This method returns an authentication token you can use to make impersonated calls.
    flag:
        impersonation-role-id: The impersonation role ID to assume.
        organization-id: The WorkMail organization under which the impersonation role will be assumed.
