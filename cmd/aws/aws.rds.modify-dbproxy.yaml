name: modify-dbproxy
description: Changes the settings for an existing DB proxy.
flags:
    --auth=: The new authentication settings for the `DBProxy`.
    --dbproxy-name=!: The identifier for the `DBProxy` to modify.
    --debug-logging=: Specifies whether the proxy logs detailed connection and query information.
    --default-auth-scheme=: The default authentication scheme that the proxy uses for client connections to the proxy and connections from the proxy to the underlying database.
    --idle-client-timeout=: The number of seconds that a connection to the proxy can be inactive before the proxy disconnects it.
    --new-dbproxy-name=: The new identifier for the `DBProxy`.
    --require-tls=: Whether Transport Layer Security (TLS) encryption is required for connections to the proxy.
    --role-arn=: The Amazon Resource Name (ARN) of the IAM role that the proxy uses to access secrets in Amazon Web Services Secrets Manager.
    --security-groups=: The new list of security groups for the `DBProxy`.
completion:
    flag:
        default-auth-scheme:
            - IAM_AUTH
            - NONE
documentation:
    command: Changes the settings for an existing DB proxy.
    flag:
        auth: The new authentication settings for the `DBProxy`.
        dbproxy-name: The identifier for the `DBProxy` to modify.
        debug-logging: Specifies whether the proxy logs detailed connection and query information. When you enable `DebugLogging`, the proxy captures connection details and connection pool behavior from your queries. Debug logging increases CloudWatch costs and can impact proxy performance. Enable this option only when you need to troubleshoot connection or performance issues.
        default-auth-scheme: The default authentication scheme that the proxy uses for client connections to the proxy and connections from the proxy to the underlying database. Valid values are `NONE` and `IAM_AUTH`. When set to `IAM_AUTH`, the proxy uses end-to-end IAM authentication to connect to the database.
        idle-client-timeout: The number of seconds that a connection to the proxy can be inactive before the proxy disconnects it. You can set this value higher or lower than the connection timeout limit for the associated database.
        new-dbproxy-name: The new identifier for the `DBProxy`. An identifier must begin with a letter and must contain only ASCII letters, digits, and hyphens; it can't end with a hyphen or contain two consecutive hyphens.
        require-tls: Whether Transport Layer Security (TLS) encryption is required for connections to the proxy. By enabling this setting, you can enforce encrypted TLS connections to the proxy, even if the associated database doesn't use TLS.
        role-arn: The Amazon Resource Name (ARN) of the IAM role that the proxy uses to access secrets in Amazon Web Services Secrets Manager.
        security-groups: The new list of security groups for the `DBProxy`.
