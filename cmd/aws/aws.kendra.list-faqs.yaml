name: list-faqs
description: Gets a list of FAQs associated with an index.
flags:
    --index-id=!: The index for the FAQs.
    --max-results=: The maximum number of FAQs to return in the response.
    --next-token=: If the previous response was incomplete (because there is more data to retrieve), Amazon Kendra returns a pagination token in the response.
documentation:
    command: Gets a list of FAQs associated with an index.
    flag:
        index-id: The index for the FAQs.
        max-results: The maximum number of FAQs to return in the response. If there are fewer results in the list, this response contains only the actual results.
        next-token: If the previous response was incomplete (because there is more data to retrieve), Amazon Kendra returns a pagination token in the response. You can use this pagination token to retrieve the next set of FAQs.
