name: describe-configuration-recorders
description: Returns details for the configuration recorder you specify.
flags:
    --arn=: The Amazon Resource Name (ARN) of the configuration recorder that you want to specify.
    --configuration-recorder-names=: A list of names of the configuration recorders that you want to specify.
    --service-principal=: For service-linked configuration recorders, you can use the service principal of the linked Amazon Web Services service to specify the configuration recorder.
documentation:
    command: |-
        Returns details for the configuration recorder you specify.

        If a configuration recorder is not specified, this operation returns details for the customer managed configuration recorder configured for the account, if applicable.

        When making a request to this operation, you can only specify one configuration recorder.
    flag:
        arn: The Amazon Resource Name (ARN) of the configuration recorder that you want to specify.
        configuration-recorder-names: |-
            A list of names of the configuration recorders that you want to specify.

            When making a request to this operation, you can only specify one configuration recorder.
        service-principal: For service-linked configuration recorders, you can use the service principal of the linked Amazon Web Services service to specify the configuration recorder.
