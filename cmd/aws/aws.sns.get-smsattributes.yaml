name: get-smsattributes
description: Returns the settings for sending SMS messages from your Amazon Web Services account.
flags:
    --attributes=: A list of the individual attribute names, such as `MonthlySpendLimit`, for which you want values.
documentation:
    command: |-
        Returns the settings for sending SMS messages from your Amazon Web Services account.

        These settings are set with the `SetSMSAttributes` action.
    flag:
        attributes: |-
            A list of the individual attribute names, such as `MonthlySpendLimit`, for which you want values.

            For all attribute names, see [SetSMSAttributes](https://docs.aws.amazon.com/sns/latest/api/API_SetSMSAttributes.html).

            If you don't use this parameter, Amazon SNS returns all SMS attributes.
