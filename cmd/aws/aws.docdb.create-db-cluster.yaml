name: create-db-cluster
description: Creates a new Amazon DocumentDB cluster.
flags:
    --availability-zones=: A list of Amazon EC2 Availability Zones that instances in the cluster can be created in.
    --backup-retention-period=: The number of days for which automated backups are retained.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --db-cluster-identifier=!: The cluster identifier.
    --db-cluster-parameter-group-name=: The name of the cluster parameter group to associate with this cluster.
    --db-subnet-group-name=: A subnet group to associate with this cluster.
    --deletion-protection: Specifies whether this cluster can be deleted.
    --enable-cloudwatch-logs-exports=: A list of log types that need to be enabled for exporting to Amazon CloudWatch Logs.
    --engine-version=: The version number of the database engine to use.
    --engine=!: The name of the database engine to be used for this cluster.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --global-cluster-identifier=: The cluster identifier of the new global cluster.
    --kms-key-id=: The KMS key identifier for an encrypted cluster.
    --manage-master-user-password: Specifies whether to manage the master user password with Amazon Web Services Secrets Manager.
    --master-user-password=: The password for the master database user.
    --master-user-secret-kms-key-id=: The Amazon Web Services KMS key identifier to encrypt a secret that is automatically generated and managed in Amazon Web Services Secrets Manager.
    --master-username=: The name of the master user for the cluster.
    --no-deletion-protection: Specifies whether this cluster can be deleted.
    --no-manage-master-user-password: Specifies whether to manage the master user password with Amazon Web Services Secrets Manager.
    --no-storage-encrypted: Specifies whether the cluster is encrypted.
    --port=: The port number on which the instances in the cluster accept connections.
    --pre-signed-url=: Not currently supported.
    --preferred-backup-window=: The daily time range during which automated backups are created if automated backups are enabled using the `BackupRetentionPeriod` parameter.
    --preferred-maintenance-window=: The weekly time range during which system maintenance can occur, in Universal Coordinated Time (UTC).
    --serverless-v2-scaling-configuration=: Contains the scaling configuration of an Amazon DocumentDB Serverless cluster.
    --storage-encrypted: Specifies whether the cluster is encrypted.
    --storage-type=: The storage type to associate with the DB cluster.
    --tags=: The tags to be assigned to the cluster.
    --vpc-security-group-ids=: A list of EC2 VPC security groups to associate with this cluster.
documentation:
    command: Creates a new Amazon DocumentDB cluster.
    flag:
        availability-zones: A list of Amazon EC2 Availability Zones that instances in the cluster can be created in.
        backup-retention-period: |-
            The number of days for which automated backups are retained. You must specify a minimum value of 1.

            Default: 1

            Constraints:

            - Must be a value from 1 to 35.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        db-cluster-identifier: |-
            The cluster identifier. This parameter is stored as a lowercase string.

            Constraints:

            - Must contain from 1 to 63 letters, numbers, or hyphens.
            - The first character must be a letter.
            - Cannot end with a hyphen or contain two consecutive hyphens.

            Example: `my-cluster`
        db-cluster-parameter-group-name: The name of the cluster parameter group to associate with this cluster.
        db-subnet-group-name: |-
            A subnet group to associate with this cluster.

            Constraints: Must match the name of an existing `DBSubnetGroup`. Must not be default.

            Example: `mySubnetgroup`
        deletion-protection: Specifies whether this cluster can be deleted. If `DeletionProtection` is enabled, the cluster cannot be deleted unless it is modified and `DeletionProtection` is disabled. `DeletionProtection` protects clusters from being accidentally deleted.
        enable-cloudwatch-logs-exports: A list of log types that need to be enabled for exporting to Amazon CloudWatch Logs. You can enable audit logs or profiler logs. For more information, see [Auditing Amazon DocumentDB Events](https://docs.aws.amazon.com/documentdb/latest/developerguide/event-auditing.html) and [Profiling Amazon DocumentDB Operations](https://docs.aws.amazon.com/documentdb/latest/developerguide/profiling.html).
        engine: |-
            The name of the database engine to be used for this cluster.

            Valid values: `docdb`
        engine-version: The version number of the database engine to use. The `--engine-version` will default to the latest major engine version. For production workloads, we recommend explicitly declaring this parameter with the intended major engine version.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        global-cluster-identifier: The cluster identifier of the new global cluster.
        kms-key-id: |-
            The KMS key identifier for an encrypted cluster.

            The KMS key identifier is the Amazon Resource Name (ARN) for the KMS encryption key. If you are creating a cluster using the same Amazon Web Services account that owns the KMS encryption key that is used to encrypt the new cluster, you can use the KMS key alias instead of the ARN for the KMS encryption key.

            If an encryption key is not specified in `KmsKeyId`:

            - If the `StorageEncrypted` parameter is `true`, Amazon DocumentDB uses your default encryption key.

            KMS creates the default encryption key for your Amazon Web Services account. Your Amazon Web Services account has a different default encryption key for each Amazon Web Services Regions.
        manage-master-user-password: |-
            Specifies whether to manage the master user password with Amazon Web Services Secrets Manager.

            Constraint: You can't manage the master user password with Amazon Web Services Secrets Manager if `MasterUserPassword` is specified.
        master-user-password: |-
            The password for the master database user. This password can contain any printable ASCII character except forward slash (/), double quote ("), or the "at" symbol (@).

            Constraints: Must contain from 8 to 100 characters.
        master-user-secret-kms-key-id: |-
            The Amazon Web Services KMS key identifier to encrypt a secret that is automatically generated and managed in Amazon Web Services Secrets Manager. This setting is valid only if the master user password is managed by Amazon DocumentDB in Amazon Web Services Secrets Manager for the DB cluster.

            The Amazon Web Services KMS key identifier is the key ARN, key ID, alias ARN, or alias name for the KMS key. To use a KMS key in a different Amazon Web Services account, specify the key ARN or alias ARN.

            If you don't specify `MasterUserSecretKmsKeyId`, then the `aws/secretsmanager` KMS key is used to encrypt the secret. If the secret is in a different Amazon Web Services account, then you can't use the `aws/secretsmanager` KMS key to encrypt the secret, and you must use a customer managed KMS key.

            There is a default KMS key for your Amazon Web Services account. Your Amazon Web Services account has a different default KMS key for each Amazon Web Services Region.
        master-username: |-
            The name of the master user for the cluster.

            Constraints:

            - Must be from 1 to 63 letters or numbers.
            - The first character must be a letter.
            - Cannot be a reserved word for the chosen database engine.
        port: The port number on which the instances in the cluster accept connections.
        pre-signed-url: Not currently supported.
        preferred-backup-window: |-
            The daily time range during which automated backups are created if automated backups are enabled using the `BackupRetentionPeriod` parameter.

            The default is a 30-minute window selected at random from an 8-hour block of time for each Amazon Web Services Region.

            Constraints:

            - Must be in the format `hh24:mi-hh24:mi`.
            - Must be in Universal Coordinated Time (UTC).
            - Must not conflict with the preferred maintenance window.
            - Must be at least 30 minutes.
        preferred-maintenance-window: |-
            The weekly time range during which system maintenance can occur, in Universal Coordinated Time (UTC).

            Format: `ddd:hh24:mi-ddd:hh24:mi`

            The default is a 30-minute window selected at random from an 8-hour block of time for each Amazon Web Services Region, occurring on a random day of the week.

            Valid days: Mon, Tue, Wed, Thu, Fri, Sat, Sun

            Constraints: Minimum 30-minute window.
        serverless-v2-scaling-configuration: Contains the scaling configuration of an Amazon DocumentDB Serverless cluster.
        storage-encrypted: Specifies whether the cluster is encrypted.
        storage-type: |-
            The storage type to associate with the DB cluster.

            For information on storage types for Amazon DocumentDB clusters, see Cluster storage configurations in the *Amazon DocumentDB Developer Guide*.

            Valid values for storage type - `standard | iopt1`

            Default value is `standard`

            When you create a DocumentDB DB cluster with the storage type set to `iopt1`, the storage type is returned in the response. The storage type isn't returned when you set it to `standard`.
        tags: The tags to be assigned to the cluster.
        vpc-security-group-ids: A list of EC2 VPC security groups to associate with this cluster.
