name: start-game-session-placement
description: |-
    **This API works with the following fleet types:** EC2, Anywhere, Container

    Makes a request to start a new game session using a game session queue.
flags:
    --desired-player-sessions=: Set of information on each player to create a player session for.
    --game-properties=: A set of key-value pairs that can store custom data in a game session.
    --game-session-data=: A set of custom game session properties, formatted as a single string value.
    --game-session-name=: A descriptive label that is associated with a game session.
    --game-session-queue-name=!: Name of the queue to use to place the new game session.
    --maximum-player-session-count=!: The maximum number of players that can be connected simultaneously to the game session.
    --placement-id=!: A unique identifier to assign to the new game session placement.
    --player-latencies=: A set of values, expressed in milliseconds, that indicates the amount of latency that a player experiences when connected to Amazon Web Services Regions.
    --priority-configuration-override=: A prioritized list of locations to use for the game session placement and instructions on how to use it.
documentation:
    command: "**This API works with the following fleet types:** EC2, Anywhere, Container\n\nMakes a request to start a new game session using a game session queue. When processing a placement request, Amazon GameLift Servers looks for the best possible available resource to host the game session, based on how the queue is configured to prioritize factors such as resource cost, latency, and location. After selecting an available resource, Amazon GameLift Servers prompts the resource to start a game session. A placement request can include a list of players to create a set of player sessions. The request can also include information to pass to the new game session, such as to specify a game map or other options.\n\n**Request options**\n\nUse this operation to make the following types of requests.\n\n- Request a placement using the queue's default prioritization process (see the default prioritization described in [PriorityConfiguration](https://docs.aws.amazon.com/gamelift/latest/apireference/API_PriorityConfiguration.html)). Include these required parameters:\n  \n  - `GameSessionQueueName`\n  - `MaximumPlayerSessionCount`\n  - `PlacementID`\n- Request a placement and prioritize based on latency. Include these parameters:\n  \n  - Required parameters `GameSessionQueueName`, `MaximumPlayerSessionCount`, `PlacementID`.\n  - `PlayerLatencies`. Include a set of latency values for destinations in the queue. When a request includes latency data, Amazon GameLift Servers automatically reorder the queue's locations priority list based on lowest available latency values. If a request includes latency data for multiple players, Amazon GameLift Servers calculates each location's average latency for all players and reorders to find the lowest latency across all players.\n  - Don't include `PriorityConfigurationOverride`.\n  \n  <!--THE END-->\n  \n  - Prioritize based on a custom list of locations. If you're using a queue that's configured to prioritize location first (see [PriorityConfiguration](https://docs.aws.amazon.com/gamelift/latest/apireference/API_PriorityConfiguration.html) for game session queues), you can optionally use the *PriorityConfigurationOverride* parameter to substitute a different location priority list for this placement request. Amazon GameLift Servers searches each location on the priority override list to find an available hosting resource for the new game session. Specify a fallback strategy to use in the event that Amazon GameLift Servers fails to place the game session in any of the locations on the override list.\n- Request a placement and prioritized based on a custom list of locations.\n- You can request new player sessions for a group of players. Include the *DesiredPlayerSessions* parameter and include at minimum a unique player ID for each. You can also include player-specific data to pass to the new game session.\n\n**Result**\n\nIf successful, this operation generates a new game session placement request and adds it to the game session queue for processing. You can track the status of individual placement requests by calling [DescribeGameSessionPlacement](https://docs.aws.amazon.com/gamelift/latest/apireference/API_DescribeGameSessionPlacement.html) or by monitoring queue notifications. When the request status is `FULFILLED`, a new game session has started and the placement request is updated with connection information for the game session (IP address and port). If the request included player session data, Amazon GameLift Servers creates a player session for each player ID in the request.\n\nThe request results in a `InvalidRequestException` in the following situations:\n\n- If the request includes both *PlayerLatencies* and *PriorityConfigurationOverride* parameters.\n- If the request includes the *PriorityConfigurationOverride* parameter and specifies a queue that doesn't prioritize locations.\n\nAmazon GameLift Servers continues to retry each placement request until it reaches the queue's timeout setting. If a request times out, you can resubmit the request to the same queue or try a different queue."
    flag:
        desired-player-sessions: Set of information on each player to create a player session for.
        game-properties: 'A set of key-value pairs that can store custom data in a game session. For example: `{"Key": "difficulty", "Value": "novice"}`.'
        game-session-data: A set of custom game session properties, formatted as a single string value. This data is passed to a game server process with a request to start a new game session. For more information, see [Start a game session](https://docs.aws.amazon.com/gamelift/latest/developerguide/gamelift-sdk-server-api.html#gamelift-sdk-server-startsession).
        game-session-name: A descriptive label that is associated with a game session. Session names do not need to be unique.
        game-session-queue-name: Name of the queue to use to place the new game session. You can use either the queue name or ARN value.
        maximum-player-session-count: The maximum number of players that can be connected simultaneously to the game session.
        placement-id: A unique identifier to assign to the new game session placement. This value is developer-defined. The value must be unique across all Regions and cannot be reused.
        player-latencies: A set of values, expressed in milliseconds, that indicates the amount of latency that a player experiences when connected to Amazon Web Services Regions. This information is used to try to place the new game session where it can offer the best possible gameplay experience for the players.
        priority-configuration-override: A prioritized list of locations to use for the game session placement and instructions on how to use it. This list overrides a queue's prioritized location list for this game session placement request only. You can include Amazon Web Services Regions, local zones, and custom locations (for Anywhere fleets). You can choose to limit placements to locations on the override list only, or you can prioritize locations on the override list first and then fall back to the queue's other locations if needed. Choose a fallback strategy to use in the event that Amazon GameLift Servers fails to place a game session in any of the locations on the priority override list.
