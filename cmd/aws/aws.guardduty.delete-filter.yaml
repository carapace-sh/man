name: delete-filter
description: Deletes the filter specified by the filter name.
flags:
    --detector-id=!: The unique ID of the detector that is associated with the filter.
    --filter-name=!: The name of the filter that you want to delete.
documentation:
    command: Deletes the filter specified by the filter name.
    flag:
        detector-id: |-
            The unique ID of the detector that is associated with the filter.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
        filter-name: The name of the filter that you want to delete.
