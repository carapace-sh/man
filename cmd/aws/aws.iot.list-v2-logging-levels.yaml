name: list-v2-logging-levels
description: Lists logging levels.
flags:
    --max-results=: The maximum number of results to return at one time.
    --next-token=: To retrieve the next set of results, the `nextToken` value from a previous response; otherwise **null** to receive the first set of results.
    --target-type=: The type of resource for which you are configuring logging.
completion:
    flag:
        target-type:
            - DEFAULT
            - THING_GROUP
            - CLIENT_ID
            - SOURCE_IP
            - PRINCIPAL_ID
documentation:
    command: |-
        Lists logging levels.

        Requires permission to access the [ListV2LoggingLevels](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        max-results: The maximum number of results to return at one time.
        next-token: To retrieve the next set of results, the `nextToken` value from a previous response; otherwise **null** to receive the first set of results.
        target-type: The type of resource for which you are configuring logging. Must be `THING_Group`.
