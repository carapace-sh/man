name: create-workspace-api-key
description: Creates a Grafana API key for the workspace.
flags:
    --key-name=!: Specifies the name of the key.
    --key-role=!: Specifies the permission level of the key.
    --seconds-to-live=!: Specifies the time in seconds until the key expires.
    --workspace-id=!: The ID of the workspace to create an API key.
documentation:
    command: |-
        Creates a Grafana API key for the workspace. This key can be used to authenticate requests sent to the workspace's HTTP API. See [https://docs.aws.amazon.com/grafana/latest/userguide/Using-Grafana-APIs.html](https://docs.aws.amazon.com/grafana/latest/userguide/Using-Grafana-APIs.html) for available APIs and example requests.

        In workspaces compatible with Grafana version 9 or above, use workspace service accounts instead of API keys. API keys will be removed in a future release.
    flag:
        key-name: Specifies the name of the key. Keynames must be unique to the workspace.
        key-role: |-
            Specifies the permission level of the key.

            Valid values: `ADMIN`|`EDITOR`|`VIEWER`
        seconds-to-live: Specifies the time in seconds until the key expires. Keys can be valid for up to 30 days.
        workspace-id: The ID of the workspace to create an API key.
