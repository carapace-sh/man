name: access
description: '*(BETA)*  Access a secret version''s data.'
flags:
    --location=!: ID of the location or fully qualified identifier for the location.
    --out-file=: File path to which secret data is written.
    --secret=: The secret of the version.
documentation:
    command: |-
        *(BETA)*  Access the data for the specified secret version.

        ## EXAMPLES

        Access the data for version 123 of the secret 'my-secret':

          $ gcloud beta secrets versions access 123 --secret=my-secret

        Note: The output will be formatted as UTF-8 which can corrupt binary secrets.

        To write raw bytes to a file use --out-file flag:

          $ gcloud beta secrets versions access 123 --secret=my-secret --out-file=/tmp/secret

        To get the raw bytes, have Google Cloud CLI print the response as
        base64-encoded and decode:

          $ gcloud beta secrets versions access 123 --secret=my-secret --format='get(payload.data)' | tr '_-' '/+' | base64 -d
    flag:
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line.
        out-file: File path to which secret data is written. If this flag is not provided secret data will be written to stdout in UTF-8 format.
        secret: |-
            The secret of the version.
            +
            To set the `secret` attribute:
            * provide the argument `VERSION` on the command line with a fully specified name;
            * provide the argument `--secret` on the command line.
