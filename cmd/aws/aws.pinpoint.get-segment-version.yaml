name: get-segment-version
description: Retrieves information about the configuration, dimension, and other settings for a specific version of a segment that's associated with an application.
flags:
    --application-id=!: The unique identifier for the application.
    --segment-id=!: The unique identifier for the segment.
    --version=!: The unique version number (Version property) for the campaign version.
documentation:
    command: Retrieves information about the configuration, dimension, and other settings for a specific version of a segment that's associated with an application.
    flag:
        application-id: The unique identifier for the application. This identifier is displayed as the **Project ID** on the Amazon Pinpoint console.
        segment-id: The unique identifier for the segment.
        version: The unique version number (Version property) for the campaign version.
