name: search
description: '*(ALPHA)*  Search cloudLocations.'
flags:
    --limit=: Maximum number of resources to return.
    --location=: ID of the location or fully qualified identifier for the location.
    --page-size=: Maximum number of resources per page.
    --query=: Query to use for searching Cloudlocations.
    --source-cloud-location=!: ID of the source_cloud_location or fully qualified identifier for the source_cloud_location.
documentation:
    command: |
        *(ALPHA)*  Search Cloudlocations.
    flag:
        limit: Maximum number of resources to return.
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line;
            * location is always global.
        page-size: Maximum number of resources per page.
        query: Query to use for searching Cloudlocations.
        source-cloud-location: |-
            ID of the source_cloud_location or fully qualified identifier for the source_cloud_location.
            +
            To set the `cloud_location` attribute:
            * provide the argument `--source-cloud-location` on the command line.
