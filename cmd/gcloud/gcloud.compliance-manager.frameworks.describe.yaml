name: describe
description: Get a framework.
flags:
    --location=: The location id of the framework resource.
    --major-revision-id=: The framework major version to retrieve.
    --organization=: The organization id of the framework resource.
documentation:
    command: |
        Get the details for a specific framework.
    flag:
        location: |-
            The location id of the framework resource.
            +
            To set the `location` attribute:
            * provide the argument `framework` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        major-revision-id: |-
            The framework major version to retrieve. If not specified, the most
            recently updated `revision_id` is retrieved.
        organization: |-
            The organization id of the framework resource.
            +
            To set the `organization` attribute:
            * provide the argument `framework` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
