name: ping
description: '*(ALPHA)*  Times the connection and ping time for a Firestore with MongoDB compatibility database.'
flags:
    --database=!: The database to operate on.
documentation:
    command: |-
        ## EXAMPLES

        To time the connection and ping times for a Firestore with MongoDB
        compatibility database `testdb`:

            $ gcloud alpha firestore databases ping --database=testdb
    flag:
        database: |-
            The database to operate on.
            +
            For example, to operate on database `foo`:
            +
              $ {command} --database='foo'
