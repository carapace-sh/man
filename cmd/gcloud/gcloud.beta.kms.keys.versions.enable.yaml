name: enable
description: '*(BETA)*  Enable a given version.'
flags:
    --key=: The containing key.
    --keyring=: Key ring of the key.
    --location=: Location of the keyring.
documentation:
    command: |-
        *(BETA)*  Enables the specified version within the given key.

        Only a version which is Disabled can be Enabled.

        ## EXAMPLES

        The following command enables version 3 of key `frodo` within
        keyring `fellowship` and location `us-east1`:

          $ gcloud beta kms keys versions enable 3 --location=us-east1 --keyring=fellowship --key=frodo
    flag:
        key: The containing key.
        keyring: Key ring of the key.
        location: Location of the keyring.
