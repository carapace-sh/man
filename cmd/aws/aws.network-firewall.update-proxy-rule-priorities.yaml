name: update-proxy-rule-priorities
description: Updates proxy rule priorities within a proxy rule group.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --proxy-rule-group-arn=: The Amazon Resource Name (ARN) of a proxy rule group.
    --proxy-rule-group-name=: The descriptive name of the proxy rule group.
    --rule-group-request-phase=!: Evaluation points in the traffic flow where rules are applied.
    --rules=!:
        description: proxy rule resources to update to new positions.
        nargs: -1
    --update-token=!: A token used for optimistic locking.
completion:
    flag:
        rule-group-request-phase:
            - PRE_DNS
            - PRE_REQ
            - POST_RES
documentation:
    command: Updates proxy rule priorities within a proxy rule group.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        proxy-rule-group-arn: |-
            The Amazon Resource Name (ARN) of a proxy rule group.

            You must specify the ARN or the name, and you can specify both.
        proxy-rule-group-name: |-
            The descriptive name of the proxy rule group. You can't change the name of a proxy rule group after you create it.

            You must specify the ARN or the name, and you can specify both.
        rule-group-request-phase: Evaluation points in the traffic flow where rules are applied. There are three phases in a traffic where the rule match is applied.
        rules: proxy rule resources to update to new positions.
        update-token: |-
            A token used for optimistic locking. Network Firewall returns a token to your requests that access the proxy rule group. The token marks the state of the proxy rule group resource at the time of the request.

            To make changes to the proxy rule group, you provide the token in your request. Network Firewall uses the token to ensure that the proxy rule group hasn't changed since you last retrieved it. If it has changed, the operation fails with an `InvalidTokenException`. If this happens, retrieve the proxy rule group again to get a current copy of it with a current token. Reapply your changes as needed, then try the operation again using the new token.
