name: search-users
description: Searches for UserIDs within a collection based on a `FaceId` or `UserId`.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --collection-id=!: The ID of an existing collection containing the UserID, used with a UserId or FaceId.
    --face-id=: ID for the existing face.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-users=: Maximum number of identities to return.
    --user-id=: ID for the existing User.
    --user-match-threshold=: Optional value that specifies the minimum confidence in the matched UserID to return.
documentation:
    command: Searches for UserIDs within a collection based on a `FaceId` or `UserId`. This API can be used to find the closest UserID (with a highest similarity) to associate a face. The request must be provided with either `FaceId` or `UserId`. The operation returns an array of UserID that match the `FaceId` or `UserId`, ordered by similarity score with the highest similarity first.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        collection-id: The ID of an existing collection containing the UserID, used with a UserId or FaceId. If a FaceId is provided, UserId isn’t required to be present in the Collection.
        face-id: ID for the existing face.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-users: Maximum number of identities to return.
        user-id: ID for the existing User.
        user-match-threshold: Optional value that specifies the minimum confidence in the matched UserID to return. Default value of 80.
