name: provision-byoip-cidr
description: Provisions an IPv4 or IPv6 address range for use with your Amazon Web Services resources through bring your own IP addresses (BYOIP) and creates a corresponding address pool.
flags:
    --cidr-authorization-context=: A signed document that proves that you are authorized to bring the specified IP address range to Amazon using BYOIP.
    --cidr=!: The public IPv4 or IPv6 address range, in CIDR notation.
    --description=: A description for the address range and the address pool.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --multi-region: Reserved.
    --network-border-group=: If you have [Local Zones](https://docs.aws.amazon.com/local-zones/latest/ug/how-local-zones-work.html) enabled, you can choose a network border group for Local Zones when you provision and advertise a BYOIPv4 CIDR.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-multi-region&: Reserved.
    --no-publicly-advertisable&: (IPv6 only) Indicate whether the address range will be publicly advertised to the internet.
    --pool-tag-specifications=: The tags to apply to the address pool.
    --publicly-advertisable: (IPv6 only) Indicate whether the address range will be publicly advertised to the internet.
documentation:
    command: |-
        Provisions an IPv4 or IPv6 address range for use with your Amazon Web Services resources through bring your own IP addresses (BYOIP) and creates a corresponding address pool. After the address range is provisioned, it is ready to be advertised.

        Amazon Web Services verifies that you own the address range and are authorized to advertise it. You must ensure that the address range is registered to you and that you created an RPKI ROA to authorize Amazon ASNs 16509 and 14618 to advertise the address range. For more information, see [Bring your own IP addresses (BYOIP)](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-byoip.html) in the *Amazon EC2 User Guide*.

        Provisioning an address range is an asynchronous operation, so the call returns immediately, but the address range is not ready to use until its status changes from `pending-provision` to `provisioned`. For more information, see [Onboard your address range](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/byoip-onboard.html).
    flag:
        cidr: The public IPv4 or IPv6 address range, in CIDR notation. The most specific IPv4 prefix that you can specify is /24. The most specific IPv6 address range that you can bring is /48 for CIDRs that are publicly advertisable and /56 for CIDRs that are not publicly advertisable. The address range cannot overlap with another address range that you've brought to this or another Region.
        cidr-authorization-context: A signed document that proves that you are authorized to bring the specified IP address range to Amazon using BYOIP.
        description: A description for the address range and the address pool.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        multi-region: Reserved.
        network-border-group: |-
            If you have [Local Zones](https://docs.aws.amazon.com/local-zones/latest/ug/how-local-zones-work.html) enabled, you can choose a network border group for Local Zones when you provision and advertise a BYOIPv4 CIDR. Choose the network border group carefully as the EIP and the Amazon Web Services resource it is associated with must reside in the same network border group.

            You can provision BYOIP address ranges to and advertise them in the following Local Zone network border groups:

            - us-east-1-dfw-2
            - us-west-2-lax-1
            - us-west-2-phx-2

            You cannot provision or advertise BYOIPv6 address ranges in Local Zones at this time.
        pool-tag-specifications: The tags to apply to the address pool.
        publicly-advertisable: |-
            (IPv6 only) Indicate whether the address range will be publicly advertised to the internet.

            Default: true
