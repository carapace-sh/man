name: put-public-access-block
description: This operation is not supported by directory buckets.
flags:
    --account-id=!: The account ID for the Amazon Web Services account whose `PublicAccessBlock` configuration you want to set.
    --public-access-block-configuration=!: The `PublicAccessBlock` configuration that you want to apply to the specified Amazon Web Services account.
documentation:
    command: |-
        This operation is not supported by directory buckets.

        Creates or modifies the `PublicAccessBlock` configuration for an Amazon Web Services account. For this operation, users must have the `s3:PutAccountPublicAccessBlock` permission. For more information, see [Using Amazon S3 block public access](https://docs.aws.amazon.com/AmazonS3/latest/dev/access-control-block-public-access.html).

        Related actions include:

        - [GetPublicAccessBlock](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_GetPublicAccessBlock.html)
        - [DeletePublicAccessBlock](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_DeletePublicAccessBlock.html)

        You must URL encode any signed header values that contain spaces. For example, if your header value is `my file.txt`, containing two spaces after `my`, you must URL encode this value to `my%20%20file.txt`.
    flag:
        account-id: The account ID for the Amazon Web Services account whose `PublicAccessBlock` configuration you want to set.
        public-access-block-configuration: The `PublicAccessBlock` configuration that you want to apply to the specified Amazon Web Services account.
