name: list-engagement-members
description: Retrieves the details of member partners in an Engagement.
flags:
    --catalog=!: The catalog related to the request.
    --identifier=!: Identifier of the Engagement record to retrieve members from.
    --max-results=: The maximum number of results to return in a single call.
    --next-token=: The token for the next set of results.
documentation:
    command: Retrieves the details of member partners in an Engagement. This operation can only be invoked by members of the Engagement. The `ListEngagementMembers` operation allows you to fetch information about the members of a specific Engagement. This action is restricted to members of the Engagement being queried.
    flag:
        catalog: The catalog related to the request.
        identifier: Identifier of the Engagement record to retrieve members from.
        max-results: The maximum number of results to return in a single call.
        next-token: The token for the next set of results.
