name: put-container-recipe-policy
description: Applies a policy to a container image.
flags:
    --container-recipe-arn=!: The Amazon Resource Name (ARN) of the container recipe that this policy should be applied to.
    --policy=!: The policy to apply to the container recipe.
documentation:
    command: Applies a policy to a container image. We recommend that you call the RAM API CreateResourceShare (https://docs.aws.amazon.com//ram/latest/APIReference/API\_CreateResourceShare.html) to share resources. If you call the Image Builder API `PutContainerImagePolicy`, you must also call the RAM API PromoteResourceShareCreatedFromPolicy (https://docs.aws.amazon.com//ram/latest/APIReference/API\_PromoteResourceShareCreatedFromPolicy.html) in order for the resource to be visible to all principals with whom the resource is shared.
    flag:
        container-recipe-arn: The Amazon Resource Name (ARN) of the container recipe that this policy should be applied to.
        policy: The policy to apply to the container recipe.
