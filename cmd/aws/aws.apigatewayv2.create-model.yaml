name: create-model
description: Creates a Model for an API.
flags:
    --api-id=!: The API identifier.
    --content-type=: The content-type for the model, for example, "application/json".
    --description=: The description of the model.
    --name=!: The name of the model.
    --schema=!: The schema for the model.
documentation:
    command: Creates a Model for an API.
    flag:
        api-id: The API identifier.
        content-type: The content-type for the model, for example, "application/json".
        description: The description of the model.
        name: The name of the model. Must be alphanumeric.
        schema: The schema for the model. For application/json models, this should be JSON schema draft 4 model.
