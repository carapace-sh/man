name: create-route
description: Creates a route that is associated with a virtual router.
flags:
    --client-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --mesh-name=!: The name of the service mesh to create the route in.
    --mesh-owner=: The Amazon Web Services IAM account ID of the service mesh owner.
    --route-name=!: The name to use for the route.
    --spec=!: The route specification to apply.
    --tags=: Optional metadata that you can apply to the route to assist with categorization and organization.
    --virtual-router-name=!: The name of the virtual router in which to create the route.
documentation:
    command: |-
        Creates a route that is associated with a virtual router.

        You can route several different protocols and define a retry policy for a route. Traffic can be routed to one or more virtual nodes.

        For more information about routes, see [Routes](https://docs.aws.amazon.com/app-mesh/latest/userguide/routes.html).
    flag:
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request. Up to 36 letters, numbers, hyphens, and underscores are allowed.
        mesh-name: The name of the service mesh to create the route in.
        mesh-owner: The Amazon Web Services IAM account ID of the service mesh owner. If the account ID is not your own, then the account that you specify must share the mesh with your account before you can create the resource in the service mesh. For more information about mesh sharing, see [Working with shared meshes](https://docs.aws.amazon.com/app-mesh/latest/userguide/sharing.html).
        route-name: The name to use for the route.
        spec: The route specification to apply.
        tags: Optional metadata that you can apply to the route to assist with categorization and organization. Each tag consists of a key and an optional value, both of which you define. Tag keys can have a maximum character length of 128 characters, and tag values can have a maximum length of 256 characters.
        virtual-router-name: The name of the virtual router in which to create the route. If the virtual router is in a shared mesh, then you must be the owner of the virtual router resource.
