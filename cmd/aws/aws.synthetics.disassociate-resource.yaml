name: disassociate-resource
description: Removes a canary from a group.
flags:
    --group-identifier=!: Specifies the group.
    --resource-arn=!: The ARN of the canary that you want to remove from the specified group.
documentation:
    command: Removes a canary from a group. You must run this operation in the Region where the canary exists.
    flag:
        group-identifier: Specifies the group. You can specify the group name, the ARN, or the group ID as the `GroupIdentifier`.
        resource-arn: The ARN of the canary that you want to remove from the specified group.
