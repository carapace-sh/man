name: migrate
description: Request for migrating instances.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Google Cloud location of this environment https://cloud.google.com/compute/docs/regions-zones/#locations.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --post-startup-script-option=: // Specifies the behavior of post startup script during migration.
completion:
    flag:
        post-startup-script-option:
            - POST_STARTUP_SCRIPT_OPTION_UNSPECIFIED
            - POST_STARTUP_SCRIPT_OPTION_SKIP
            - POST_STARTUP_SCRIPT_OPTION_RERUN
documentation:
    command: |
        Request for migrating notebook instances.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            Google Cloud location of this environment https://cloud.google.com/compute/docs/regions-zones/#locations.
            +
            To set the `location` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `notebooks/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        post-startup-script-option: '// Specifies the behavior of post startup script during migration. _POST_STARTUP_SCRIPT_OPTION_ must be one of: *POST_STARTUP_SCRIPT_OPTION_UNSPECIFIED*, *POST_STARTUP_SCRIPT_OPTION_SKIP*, *POST_STARTUP_SCRIPT_OPTION_RERUN*.'
