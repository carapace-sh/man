name: put-event-type
description: Creates or updates an event type.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The description of the event type.
    --entity-types=!:
        description: The entity type for the event type.
        nargs: -1
    --event-ingestion=: Specifies if ingestion is enabled or disabled.
    --event-orchestration=: Enables or disables event orchestration.
    --event-variables=!:
        description: The event type variables.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --labels=:
        description: The event type labels.
        nargs: -1
    --name=!: The name.
    --tags=:
        description: A collection of key and value pairs.
        nargs: -1
completion:
    flag:
        event-ingestion:
            - ENABLED
            - DISABLED
documentation:
    command: Creates or updates an event type. An event is a business activity that is evaluated for fraud risk. With Amazon Fraud Detector, you generate fraud predictions for events. An event type defines the structure for an event sent to Amazon Fraud Detector. This includes the variables sent as part of the event, the entity performing the event (such as a customer), and the labels that classify the event. Example event types include online payment transactions, account registrations, and authentications.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The description of the event type.
        entity-types: 'The entity type for the event type. Example entity types: customer, merchant, account.'
        event-ingestion: Specifies if ingestion is enabled or disabled.
        event-orchestration: Enables or disables event orchestration. If enabled, you can send event predictions to select AWS services for downstream processing of the events.
        event-variables: The event type variables.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        labels: The event type labels.
        name: The name.
        tags: A collection of key and value pairs.
