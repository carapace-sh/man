name: create
description: Create a virtualenv environment.
hidden: true
flags:
    --python-to-use=: Absolute path to python to use to create virtual env.
documentation:
    command: |-
        Create a virtual env context for gcloud to run in. Installs several
        python modules into the virtual environment. The virtual env environment
        can be inspected via the `gcloud config virtualenv describe` command. Note this
        command does not enable the virtualenv environment, you must run
        `gcloud config virtualenv enable` to do so.
    flag:
        python-to-use: Absolute path to python to use to create virtual env.
