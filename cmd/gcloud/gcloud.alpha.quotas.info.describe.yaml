name: describe
description: '*(ALPHA)*  Retrieve the QuotaInfo of a quota for a project, folder or organization.'
flags:
    --folder=: Folder of the quota info to describe.
    --organization=: Organization of the quota info to describe.
    --service=!: Name of the service in which the quota is defined.
documentation:
    command: |-
        ## EXAMPLES

        To get the details about quota `CpusPerProject` for service
        `example.$$UNIVERSE_DOMAIN$$` and `projects/my-project`, run:

          $ gcloud alpha quotas info describe CpusPerProject --service=example.$$UNIVERSE_DOMAIN$$
          --project=my-project


        To get the details about quota `CpusPerProject` for service
        `example.$$UNIVERSE_DOMAIN$$` and `folders/123`, run:

          $ gcloud alpha quotas info describe CpusPerProject --service=example.$$UNIVERSE_DOMAIN$$
          --folder=123
    flag:
        folder: Folder of the quota info to describe.
        organization: Organization of the quota info to describe.
        service: Name of the service in which the quota is defined.
