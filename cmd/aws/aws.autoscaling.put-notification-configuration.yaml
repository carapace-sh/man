name: put-notification-configuration
description: Configures an Auto Scaling group to send notifications when specified events take place.
flags:
    --auto-scaling-group-name=!: The name of the Auto Scaling group.
    --notification-types=!: The type of event that causes the notification to be sent.
    --topic-arn=!: The Amazon Resource Name (ARN) of the Amazon SNS topic.
documentation:
    command: |-
        Configures an Auto Scaling group to send notifications when specified events take place. Subscribers to the specified topic can have messages delivered to an endpoint such as a web server or an email address.

        This configuration overwrites any existing configuration.

        For more information, see [Amazon SNS notification options for Amazon EC2 Auto Scaling](https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-sns-notifications.html) in the *Amazon EC2 Auto Scaling User Guide*.

        If you exceed your maximum limit of SNS topics, which is 10 per Auto Scaling group, the call fails.
    flag:
        auto-scaling-group-name: The name of the Auto Scaling group.
        notification-types: The type of event that causes the notification to be sent. To query the notification types supported by Amazon EC2 Auto Scaling, call the [DescribeAutoScalingNotificationTypes](https://docs.aws.amazon.com/autoscaling/ec2/APIReference/API_DescribeAutoScalingNotificationTypes.html) API.
        topic-arn: The Amazon Resource Name (ARN) of the Amazon SNS topic.
