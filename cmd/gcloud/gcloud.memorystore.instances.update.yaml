        remove-maintenance-policy-weekly-window: |-
            Remove existing value from maintenance_policy_weekly_window list. Maintenance window that is applied to resources covered by this
            policy. Minimum 1. For the current version, the maximum number of
            weekly_window is expected to be one.
            +
            *day*:::
            Allows to define schedule that runs specified day of the week.
            +
            *startTime*:::
            Start time of the window in UTC.
            +
            *hours*::::
            Hours of a day in 24 hour format. Must be greater than or equal to 0 and
            typically must be less than or equal to 23. An API may choose to allow the
            value "24:00:00" for scenarios like business closing time.
            +
            *minutes*::::
            Minutes of an hour. Must be greater than or equal to 0 and less than or
            equal to 59.
            +
            *nanos*::::
            Fractions of seconds, in nanoseconds. Must be greater than or equal to 0
            and less than or equal to 999,999,999.
            +
            *seconds*::::
            Seconds of a minute. Must be greater than or equal to 0 and typically must
            be less than or equal to 59. An API may allow the value 60 if it allows
            leap-seconds.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-maintenance-policy-weekly-window=day=string,startTime={hours=int,minutes=int,nanos=int,seconds=int} --remove-maintenance-policy-weekly-window=day=string,startTime={hours=int,minutes=int,nanos=int,seconds=int}
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-maintenance-policy-weekly-window='[{"day": "string", "startTime": {"hours": int, "minutes": int, "nanos": int, "seconds": int}}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-maintenance-policy-weekly-window=path_to_file.(yaml|json)
            +
            ```
        replica-count: Number of replica nodes per shard. If omitted the default is 0 replicas.
        request-id: |-
            An optional request ID to identify requests. Specify a unique request ID
            so that if you must retry your request, the server will know to ignore
            the request if it has already been completed. The server will guarantee
            that for at least 60 minutes since the first request.
            +
            For example, consider a situation where you make an initial request and the
            request times out. If you make the request again with the same request
            ID, the server can check if original operation with the same request ID
            was received, and if so, will ignore the second request. This prevents
            clients from accidentally creating duplicate commitments.
            +
            The request ID must be a valid UUID with the exception that zero UUID is
            not supported (00000000-0000-0000-0000-000000000000).
        shard-count: Number of shards for the instance.
        simulate-maintenance-event: Simulate a maintenance event. Use *--simulate-maintenance-event* to enable and *--no-simulate-maintenance-event* to disable.
        update-engine-configs: |-
            Update engine_configs value or add key value pair. User-provided engine configurations for the instance.
            +
            *KEY*:::
            Sets `KEY` value.
            +
            *VALUE*:::
            Sets `VALUE` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --update-engine-configs=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --update-engine-configs='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --update-engine-configs=path_to_file.(yaml|json)
            +
            ```
        update-labels: |-
            Update labels value or add key value pair. Labels to represent user-provided metadata.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --update-labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --update-labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
