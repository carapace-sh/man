name: update
description: Update a Cloud NetApp Volumes KMS Config.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --clear-labels: Remove all labels.
    --description=: A description of the Cloud NetApp KMS Config
    --kms-key=!: ID of the kms_key or fully qualified identifier for the kms_key.
    --kms-keyring=: The KMS keyring of the kms_key
    --kms-location=: The Cloud location for the kms_key.
    --kms-project=: The Cloud project for the kms_key.
    --location=: The location of the kms_config.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-labels&: Remove all labels.
    --remove-labels=: List of label keys to remove.
    --update-labels=: List of label KEY=VALUE pairs to update.
documentation:
    command: |
        Updates a KMS (Key Management System) Config.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        description: A description of the Cloud NetApp KMS Config
        kms-key: |-
            ID of the kms_key or fully qualified identifier for the kms_key.
            +
            To set the `kms-key` attribute:
            * provide the argument `--kms-key` on the command line.
        kms-keyring: |-
            The KMS keyring of the kms_key
            +
            To set the `kms-keyring` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-keyring` on the command line.
        kms-location: |-
            The Cloud location for the kms_key.
            +
            To set the `kms-location` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-location` on the command line;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
        kms-project: |-
            The Cloud project for the kms_key.
            +
            To set the `kms-project` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-project` on the command line;
            * set the property `core/project`.
        location: |-
            The location of the kms_config.
            +
            To set the `location` attribute:
            * provide the argument `kms_config` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        update-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
