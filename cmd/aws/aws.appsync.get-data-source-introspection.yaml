name: get-data-source-introspection
description: Retrieves the record of an existing introspection.
flags:
    --include-models-sdl: A boolean flag that determines whether SDL should be generated for introspected types.
    --introspection-id=!: The introspection ID.
    --max-results=: The maximum number of introspected types that will be returned in a single response.
    --next-token=: Determines the number of types to be returned in a single response before paginating.
    --no-include-models-sdl&: A boolean flag that determines whether SDL should be generated for introspected types.
documentation:
    command: Retrieves the record of an existing introspection. If the retrieval is successful, the result of the instrospection will also be returned. If the retrieval fails the operation, an error message will be returned instead.
    flag:
        include-models-sdl: A boolean flag that determines whether SDL should be generated for introspected types. If set to `true`, each model will contain an `sdl` property that contains the SDL for that type. The SDL only contains the type data and no additional metadata or directives.
        introspection-id: The introspection ID. Each introspection contains a unique ID that can be used to reference the instrospection record.
        max-results: The maximum number of introspected types that will be returned in a single response.
        next-token: Determines the number of types to be returned in a single response before paginating. This value is typically taken from `nextToken` value from the previous response.
