name: list-trial-components
description: Lists the trial components in your account.
flags:
    --created-after=: A filter that returns only components created after the specified time.
    --created-before=: A filter that returns only components created before the specified time.
    --experiment-name=: A filter that returns only components that are part of the specified experiment.
    --max-results=: The maximum number of components to return in the response.
    --next-token=: If the previous call to `ListTrialComponents` didn't return the full set of components, the call returns a token for getting the next set of components.
    --sort-by=: The property used to sort results.
    --sort-order=: The sort order.
    --source-arn=: A filter that returns only components that have the specified source Amazon Resource Name (ARN).
    --trial-name=: A filter that returns only components that are part of the specified trial.
completion:
    flag:
        sort-by:
            - Name
            - CreationTime
        sort-order:
            - Ascending
            - Descending
documentation:
    command: |-
        Lists the trial components in your account. You can sort the list by trial component name or creation time. You can filter the list to show only components that were created in a specific time range. You can also filter on one of the following:

        - `ExperimentName`
        - `SourceArn`
        - `TrialName`
    flag:
        created-after: A filter that returns only components created after the specified time.
        created-before: A filter that returns only components created before the specified time.
        experiment-name: A filter that returns only components that are part of the specified experiment. If you specify `ExperimentName`, you can't filter by `SourceArn` or `TrialName`.
        max-results: The maximum number of components to return in the response. The default value is 10.
        next-token: If the previous call to `ListTrialComponents` didn't return the full set of components, the call returns a token for getting the next set of components.
        sort-by: The property used to sort results. The default value is `CreationTime`.
        sort-order: The sort order. The default value is `Descending`.
        source-arn: A filter that returns only components that have the specified source Amazon Resource Name (ARN). If you specify `SourceArn`, you can't filter by `ExperimentName` or `TrialName`.
        trial-name: A filter that returns only components that are part of the specified trial. If you specify `TrialName`, you can't filter by `ExperimentName` or `SourceArn`.
