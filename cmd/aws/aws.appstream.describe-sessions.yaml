name: describe-sessions
description: Retrieves a list that describes the streaming sessions for a specified stack and fleet.
flags:
    --authentication-type=: The authentication method.
    --fleet-name=!: The name of the fleet.
    --instance-id=: The identifier for the instance hosting the session.
    --limit=: The size of each page of results.
    --next-token=: The pagination token to use to retrieve the next page of results for this operation.
    --stack-name=!: The name of the stack.
    --user-id=: The user identifier (ID).
completion:
    flag:
        authentication-type:
            - API
            - SAML
            - USERPOOL
            - AWS_AD
documentation:
    command: Retrieves a list that describes the streaming sessions for a specified stack and fleet. If a UserId is provided for the stack and fleet, only streaming sessions for that user are described. If an authentication type is not provided, the default is to authenticate users using a streaming URL.
    flag:
        authentication-type: The authentication method. Specify `API` for a user authenticated using a streaming URL or `SAML` for a SAML federated user. The default is to authenticate users using a streaming URL.
        fleet-name: The name of the fleet. This value is case-sensitive.
        instance-id: The identifier for the instance hosting the session.
        limit: The size of each page of results. The default value is 20 and the maximum value is 50.
        next-token: The pagination token to use to retrieve the next page of results for this operation. If this value is null, it retrieves the first page.
        stack-name: The name of the stack. This value is case-sensitive.
        user-id: The user identifier (ID). If you specify a user ID, you must also specify the authentication type.
