name: update-load-balancer-attribute
description: Updates the specified attribute for a load balancer.
flags:
    --attribute-name=!: The name of the attribute you want to update.
    --attribute-value=!: The value that you want to specify for the attribute name.
    --load-balancer-name=!: The name of the load balancer that you want to modify (`my-load-balancer`.
completion:
    flag:
        attribute-name:
            - HealthCheckPath
            - SessionStickinessEnabled
            - SessionStickiness_LB_CookieDurationSeconds
            - HttpsRedirectionEnabled
            - TlsPolicyName
documentation:
    command: |-
        Updates the specified attribute for a load balancer. You can only update one attribute at a time.

        The `update load balancer attribute` operation supports tag-based access control via resource tags applied to the resource identified by `load balancer name`. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-controlling-access-using-tags).
    flag:
        attribute-name: The name of the attribute you want to update.
        attribute-value: "The value that you want to specify for the attribute name.\n\nThe following values are supported depending on what you specify for the `attributeName` request parameter:\n\n- If you specify `HealthCheckPath` for the `attributeName` request parameter, then the `attributeValue` request parameter must be the path to ping on the target (for example, `/weather/us/wa/seattle`).\n- If you specify `SessionStickinessEnabled` for the `attributeName` request parameter, then the `attributeValue` request parameter must be `true` to activate session stickiness or `false` to deactivate session stickiness.\n- If you specify `SessionStickiness_LB_CookieDurationSeconds` for the `attributeName` request parameter, then the `attributeValue` request parameter must be an interger that represents the cookie duration in seconds.\n- If you specify `HttpsRedirectionEnabled` for the `attributeName` request parameter, then the `attributeValue` request parameter must be `true` to activate HTTP to HTTPS redirection or `false` to deactivate HTTP to HTTPS redirection.\n- If you specify `TlsPolicyName` for the `attributeName` request parameter, then the `attributeValue` request parameter must be the name of the TLS policy.\n  \n  Use the [GetLoadBalancerTlsPolicies](https://docs.aws.amazon.com/lightsail/2016-11-28/api-reference/API_GetLoadBalancerTlsPolicies.html) action to get a list of TLS policy names that you can specify."
        load-balancer-name: The name of the load balancer that you want to modify (`my-load-balancer`.
