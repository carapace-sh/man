name: report-host-as-faulty
description: '*(ALPHA)*  Report a host as faulty to start the repair process.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --disruption-schedule=!: Specifies the timing for initiating the fault reporting process.
    --fault-reasons=!: 'Specified and can include one or more of the following types:'
    --no-async&: Return immediately, without waiting for the operation in progress to
    --zone=: Zone of the instance to operate on.
completion:
    flag:
        disruption-schedule:
            - IMMEDIATE
            - FUTURE
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute instances report-host-as-faulty* is used to report a host as faulty to start the repair
        process.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        disruption-schedule: |-
            Specifies the timing for initiating the fault reporting process.
            The default value is IMMEDIATE which initiates the process right away. _DISRUPTION_SCHEDULE_ must be one of: *IMMEDIATE*, *FUTURE*.
        fault-reasons: |-
            Specified and can include one or more of the following types:
            ['BEHAVIOR_UNSPECIFIED', 'PERFORMANCE', 'SILENT_DATA_CORRUPTION', 'UNRECOVERABLE_GPU_ERROR'].
            This helps categorize the nature of the fault being reported.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        zone: |-
            Zone of the instance to operate on. If not specified, you might be prompted to select a zone (interactive mode
            only). `gcloud` attempts to identify the appropriate zone by searching for
            resources in your currently active project. If the zone cannot be determined,
            `gcloud` prompts you for a selection with all available Google Cloud Platform
            zones.
            +
            To avoid prompting when this flag is omitted, the user can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
