name: cancel-mlmodel-training-job
description: Cancels a Neptune ML model training job.
flags:
    --clean: If set to `TRUE`, this flag specifies that all Amazon S3 artifacts should be deleted when the job is stopped.
    --id=!: The unique identifier of the model-training job to be canceled.
    --neptune-iam-role-arn=: The ARN of an IAM role that provides Neptune access to SageMaker and Amazon S3 resources.
    --no-clean&: If set to `TRUE`, this flag specifies that all Amazon S3 artifacts should be deleted when the job is stopped.
documentation:
    command: |-
        Cancels a Neptune ML model training job. See [Model training using the `modeltraining` command](https://docs.aws.amazon.com/neptune/latest/userguide/machine-learning-api-modeltraining.html).

        When invoking this operation in a Neptune cluster that has IAM authentication enabled, the IAM user or role making the request must have a policy attached that allows the [neptune-db:CancelMLModelTrainingJob](https://docs.aws.amazon.com/neptune/latest/userguide/iam-dp-actions.html#cancelmlmodeltrainingjob) IAM action in that cluster.
    flag:
        clean: If set to `TRUE`, this flag specifies that all Amazon S3 artifacts should be deleted when the job is stopped. The default is `FALSE`.
        id: The unique identifier of the model-training job to be canceled.
        neptune-iam-role-arn: The ARN of an IAM role that provides Neptune access to SageMaker and Amazon S3 resources. This must be listed in your DB cluster parameter group or an error will occur.
