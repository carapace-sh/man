name: delete-slack-workspace-authorization
description: Deletes the Slack workspace authorization that allows channels to be configured in that workspace.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --slack-team-id=!: The ID of the Slack workspace authorized with AWS Chatbot.
documentation:
    command: Deletes the Slack workspace authorization that allows channels to be configured in that workspace. This requires all configured channels in the workspace to be deleted.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
