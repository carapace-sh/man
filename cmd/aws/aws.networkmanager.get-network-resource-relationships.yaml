name: get-network-resource-relationships
description: Gets the network resource relationships for the specified global network.
flags:
    --account-id=: The Amazon Web Services account ID.
    --aws-region=: The Amazon Web Services Region.
    --core-network-id=: The ID of a core network.
    --global-network-id=!: The ID of the global network.
    --max-results=: The maximum number of results to return.
    --next-token=: The token for the next page of results.
    --registered-gateway-arn=: The ARN of the registered gateway.
    --resource-arn=: The ARN of the gateway.
    --resource-type=: The resource type.
documentation:
    command: Gets the network resource relationships for the specified global network.
    flag:
        account-id: The Amazon Web Services account ID.
        aws-region: The Amazon Web Services Region.
        core-network-id: The ID of a core network.
        global-network-id: The ID of the global network.
        max-results: The maximum number of results to return.
        next-token: The token for the next page of results.
        registered-gateway-arn: The ARN of the registered gateway.
        resource-arn: The ARN of the gateway.
        resource-type: |-
            The resource type.

            The following are the supported resource types for Direct Connect:

            - `dxcon`
            - `dx-gateway`
            - `dx-vif`

            The following are the supported resource types for Network Manager:

            - `attachment`
            - `connect-peer`
            - `connection`
            - `core-network`
            - `device`
            - `link`
            - `peering`
            - `site`

            The following are the supported resource types for Amazon VPC:

            - `customer-gateway`
            - `transit-gateway`
            - `transit-gateway-attachment`
            - `transit-gateway-connect-peer`
            - `transit-gateway-route-table`
            - `vpn-connection`
