name: stop-dev-environment-session
description: Stops a session for a specified Dev Environment.
flags:
    --id=!: The system-generated unique ID of the Dev Environment.
    --project-name=!: The name of the project in the space.
    --session-id=!: The system-generated unique ID of the Dev Environment session.
    --space-name=!: The name of the space.
documentation:
    command: Stops a session for a specified Dev Environment.
    flag:
        id: The system-generated unique ID of the Dev Environment. To obtain this ID, use [ListDevEnvironments]().
        project-name: The name of the project in the space.
        session-id: The system-generated unique ID of the Dev Environment session. This ID is returned by [StartDevEnvironmentSession]().
        space-name: The name of the space.
