name: import-api-keys
description: Import API keys from an external source, such as a CSV-formatted file.
flags:
    --body=!: The payload of the POST request to import API keys.
    --fail-on-warnings: A query parameter to indicate whether to rollback ApiKey importation (`true`) or not (`false`) when error is encountered.
    --format=!: A query parameter to specify the input format to imported API keys.
    --no-fail-on-warnings: A query parameter to indicate whether to rollback ApiKey importation (`true`) or not (`false`) when error is encountered.
completion:
    flag:
        format:
            - csv
documentation:
    command: Import API keys from an external source, such as a CSV-formatted file.
    flag:
        body: The payload of the POST request to import API keys. For the payload format, see API Key File Format.
        fail-on-warnings: A query parameter to indicate whether to rollback ApiKey importation (`true`) or not (`false`) when error is encountered.
        format: A query parameter to specify the input format to imported API keys. Currently, only the `csv` format is supported.
