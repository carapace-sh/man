name: list-coverage-statistics
description: Lists Amazon Inspector coverage statistics for your environment.
flags:
    --filter-criteria=: An object that contains details on the filters to apply to the coverage data for your environment.
    --group-by=: The value to group the results by.
    --next-token=: A token to use for paginating results that are returned in the response.
completion:
    flag:
        group-by:
            - SCAN_STATUS_CODE
            - SCAN_STATUS_REASON
            - ACCOUNT_ID
            - RESOURCE_TYPE
            - ECR_REPOSITORY_NAME
documentation:
    command: Lists Amazon Inspector coverage statistics for your environment.
    flag:
        filter-criteria: An object that contains details on the filters to apply to the coverage data for your environment.
        group-by: The value to group the results by.
        next-token: A token to use for paginating results that are returned in the response. Set the value of this parameter to null for the first request to a list action. For subsequent calls, use the `NextToken` value returned from the previous request to continue listing results after the first page.
