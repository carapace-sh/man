name: update-configuration-set-event-destination
description: Update an event destination in a configuration set.
flags:
    --configuration-set-name=!: ConfigurationSetName
    --event-destination-name=!: EventDestinationName
    --event-destination=: ""
documentation:
    command: Update an event destination in a configuration set. An event destination is a location that you publish information about your voice calls to. For example, you can log an event to an Amazon CloudWatch destination when a call fails.
    flag:
        configuration-set-name: ConfigurationSetName
        event-destination: ""
        event-destination-name: EventDestinationName
