name: update-report-group
description: Updates a report group.
flags:
    --arn=!: The ARN of the report group to update.
    --export-config=: Used to specify an updated export type.
    --tags=: An updated list of tag key and value pairs associated with this report group.
documentation:
    command: Updates a report group.
    flag:
        arn: The ARN of the report group to update.
        export-config: |-
            Used to specify an updated export type. Valid values are:

            - `S3`: The report results are exported to an S3 bucket.
            - `NO_EXPORT`: The report results are not exported.
        tags: |-
            An updated list of tag key and value pairs associated with this report group.

            These tags are available for use by Amazon Web Services services that support CodeBuild report group tags.
