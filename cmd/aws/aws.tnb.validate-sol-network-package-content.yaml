name: validate-sol-network-package-content
description: Validates network package content.
flags:
    --content-type=: Network package content type.
    --file=!: Network package file.
    --nsd-info-id=!: Network service descriptor file.
completion:
    flag:
        content-type:
            - application/zip
documentation:
    command: |-
        Validates network package content. This can be used as a dry run before uploading network package content with [PutSolNetworkPackageContent](https://docs.aws.amazon.com/tnb/latest/APIReference/API_PutSolNetworkPackageContent.html).

        A network package is a .zip file in CSAR (Cloud Service Archive) format defines the function packages you want to deploy and the Amazon Web Services infrastructure you want to deploy them on.
    flag:
        content-type: Network package content type.
        file: Network package file.
        nsd-info-id: Network service descriptor file.
