name: undeprecate-workflow-type
description: Undeprecates a previously deprecated *workflow type*.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain=!: The name of the domain of the deprecated workflow type.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --workflow-type=!: The name of the domain of the deprecated workflow type.
documentation:
    command: "Undeprecates a previously deprecated *workflow type*. After a workflow type has been undeprecated, you can create new executions of that type.\n\nThis operation is eventually consistent. The results are best effort and may not exactly reflect recent updates and changes.\n\n**Access Control**\n\nYou can use IAM policies to control this action's access to Amazon SWF resources as follows:\n\n- Use a `Resource` element with the domain name to limit the action to only specified domains.\n- Use an `Action` element to allow or deny permission to call this action.\n- Constrain the following parameters by using a `Condition` element with the appropriate keys.\n  \n  - `workflowType.name`: String constraint. The key is `swf:workflowType.name`.\n  - `workflowType.version`: String constraint. The key is `swf:workflowType.version`.\n\nIf the caller doesn't have sufficient permissions to invoke the action, or the parameter values fall outside the specified constraints, the action fails. The associated event attribute's `cause` parameter is set to `OPERATION_NOT_PERMITTED`. For details and example IAM policies, see [Using IAM to Manage Access to Amazon SWF Workflows](https://docs.aws.amazon.com/amazonswf/latest/developerguide/swf-dev-iam.html) in the *Amazon SWF Developer Guide*."
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain: The name of the domain of the deprecated workflow type.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        workflow-type: The name of the domain of the deprecated workflow type.
