name: list-recovery-points-by-resource
description: The information about the recovery points of the type specified by a resource Amazon Resource Name (ARN).
flags:
    --managed-by-awsbackup-only=: This attribute filters recovery points based on ownership.
    --max-results=: The maximum number of items to be returned.
    --next-token=: The next item following a partial list of returned items.
    --resource-arn=!: An ARN that uniquely identifies a resource.
documentation:
    command: |-
        The information about the recovery points of the type specified by a resource Amazon Resource Name (ARN).

        For Amazon EFS and Amazon EC2, this action only lists recovery points created by Backup.
    flag:
        managed-by-awsbackup-only: |-
            This attribute filters recovery points based on ownership.

            If this is set to `TRUE`, the response will contain recovery points associated with the selected resources that are managed by Backup.

            If this is set to `FALSE`, the response will contain all recovery points associated with the selected resource.

            Type: Boolean
        max-results: |-
            The maximum number of items to be returned.

            Amazon RDS requires a value of at least 20.
        next-token: The next item following a partial list of returned items. For example, if a request is made to return `MaxResults` number of items, `NextToken` allows you to return more items in your list starting at the location pointed to by the next token.
        resource-arn: An ARN that uniquely identifies a resource. The format of the ARN depends on the resource type.
