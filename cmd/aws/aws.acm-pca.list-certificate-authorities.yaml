name: list-certificate-authorities
description: Lists the private certificate authorities that you created by using the [CreateCertificateAuthority](https://docs.aws.amazon.com/privateca/latest/APIReference/API_CreateCertificateAuthority.html) action.
flags:
    --max-results=: Use this parameter when paginating results to specify the maximum number of items to return in the response on each page.
    --next-token=: Use this parameter when paginating results in a subsequent request after you receive a response with truncated results.
    --resource-owner=: Use this parameter to filter the returned set of certificate authorities based on their owner.
completion:
    flag:
        resource-owner:
            - SELF
            - OTHER_ACCOUNTS
documentation:
    command: Lists the private certificate authorities that you created by using the [CreateCertificateAuthority](https://docs.aws.amazon.com/privateca/latest/APIReference/API_CreateCertificateAuthority.html) action.
    flag:
        max-results: |-
            Use this parameter when paginating results to specify the maximum number of items to return in the response on each page. If additional items exist beyond the number you specify, the `NextToken` element is sent in the response. Use this `NextToken` value in a subsequent request to retrieve additional items.

            Although the maximum value is 1000, the action only returns a maximum of 100 items.
        next-token: Use this parameter when paginating results in a subsequent request after you receive a response with truncated results. Set it to the value of the `NextToken` parameter from the response you just received.
        resource-owner: Use this parameter to filter the returned set of certificate authorities based on their owner. The default is SELF.
