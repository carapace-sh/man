name: list-lftags
description: Lists LF-tags that the requester has permission to view.
flags:
    --catalog-id=: The identifier for the Data Catalog.
    --max-results=: The maximum number of results to return.
    --next-token=: A continuation token, if this is not the first call to retrieve this list.
    --resource-share-type=: If resource share type is `ALL`, returns both in-account LF-tags and shared LF-tags that the requester has permission to view.
completion:
    flag:
        resource-share-type:
            - FOREIGN
            - ALL
documentation:
    command: Lists LF-tags that the requester has permission to view.
    flag:
        catalog-id: The identifier for the Data Catalog. By default, the account ID. The Data Catalog is the persistent metadata store. It contains database definitions, table definitions, and other control information to manage your Lake Formation environment.
        max-results: The maximum number of results to return.
        next-token: A continuation token, if this is not the first call to retrieve this list.
        resource-share-type: If resource share type is `ALL`, returns both in-account LF-tags and shared LF-tags that the requester has permission to view. If resource share type is `FOREIGN`, returns all share LF-tags that the requester can view. If no resource share type is passed, lists LF-tags in the given catalog ID that the requester has permission to view.
