        cloud-watch-alarm-template-group-identifiers: ""
        description: A resource's optional description.
        discovery-entry-point-arn: A top-level supported AWS resource ARN to discovery a signal map from.
        event-bridge-rule-template-group-identifiers: ""
        force-rediscovery: If true, will force a rediscovery of a signal map if an unchanged discoveryEntryPointArn is provided.
        generate-cli-skeleton: |-
