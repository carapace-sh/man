name: list-imports
description: Lists the imports for a bot, bot locale, or custom vocabulary.
flags:
    --bot-id=: The unique identifier that Amazon Lex assigned to the bot.
    --bot-version=: The version of the bot to list imports for.
    --filters=: Provides the specification of a filter used to limit the bots in the response to only those that match the filter specification.
    --locale-id=: Specifies the locale that should be present in the list.
    --max-results=: The maximum number of imports to return in each page of results.
    --next-token=: If the response from the `ListImports` operation contains more results than specified in the `maxResults` parameter, a token is returned in the response.
    --sort-by=: Determines the field that the list of imports is sorted by.
documentation:
    command: Lists the imports for a bot, bot locale, or custom vocabulary. Imports are kept in the list for 7 days.
    flag:
        bot-id: The unique identifier that Amazon Lex assigned to the bot.
        bot-version: The version of the bot to list imports for.
        filters: Provides the specification of a filter used to limit the bots in the response to only those that match the filter specification. You can only specify one filter and one string to filter on.
        locale-id: Specifies the locale that should be present in the list. If you don't specify a resource type in the `filters` parameter, the list contains both bot locales and custom vocabularies.
        max-results: The maximum number of imports to return in each page of results. If there are fewer results than the max page size, only the actual number of results are returned.
        next-token: |-
            If the response from the `ListImports` operation contains more results than specified in the `maxResults` parameter, a token is returned in the response.

            Use the returned token in the `nextToken` parameter of a `ListImports` request to return the next page of results. For a complete set of results, call the `ListImports` operation until the `nextToken` returned in the response is null.
        sort-by: Determines the field that the list of imports is sorted by. You can sort by the `LastUpdatedDateTime` field in ascending or descending order.
