name: delete
description: '*(ALPHA)*  Delete an Organization Policy.'
flags:
    --folder=: Folder ID.
    --organization=: Organization ID.
documentation:
    command: |-
        *(ALPHA)*  Deletes an Organization Policy associated with the specified resource.

        ## EXAMPLES

        The following command clears an Organization Policy for constraint
        `serviceuser.services` on project `foo-project`:

          $ gcloud alpha resource-manager org-policies delete serviceuser.services --project=foo-project
    flag:
        folder: Folder ID.
        organization: Organization ID.
