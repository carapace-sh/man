name: get-package-version
description: Gets information about the specified package version.
flags:
    --package-name=!: The name of the associated package.
    --version-name=!: The name of the target package version.
documentation:
    command: |-
        Gets information about the specified package version.

        Requires permission to access the [GetPackageVersion](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        package-name: The name of the associated package.
        version-name: The name of the target package version.
