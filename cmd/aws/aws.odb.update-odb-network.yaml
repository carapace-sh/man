name: update-odb-network
description: Updates properties of a specified ODB network.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --display-name=: The new user-friendly name of the ODB network.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --odb-network-id=!: The unique identifier of the ODB network to update.
    --peered-cidrs-to-be-added=: The list of CIDR ranges from the peered VPC that allow access to the ODB network.
    --peered-cidrs-to-be-removed=: The list of CIDR ranges from the peered VPC to remove from the ODB network.
    --s3-access=: Specifies the updated configuration for Amazon S3 access from the ODB network.
    --s3-policy-document=: Specifies the updated endpoint policy for Amazon S3 access from the ODB network.
    --zero-etl-access=: Specifies the updated configuration for Zero-ETL access from the ODB network.
completion:
    flag:
        s3-access:
            - ENABLED
            - DISABLED
        zero-etl-access:
            - ENABLED
            - DISABLED
documentation:
    command: Updates properties of a specified ODB network.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        display-name: The new user-friendly name of the ODB network.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        odb-network-id: The unique identifier of the ODB network to update.
        peered-cidrs-to-be-added: The list of CIDR ranges from the peered VPC that allow access to the ODB network.
        peered-cidrs-to-be-removed: The list of CIDR ranges from the peered VPC to remove from the ODB network.
        s3-access: Specifies the updated configuration for Amazon S3 access from the ODB network.
        s3-policy-document: Specifies the updated endpoint policy for Amazon S3 access from the ODB network.
        zero-etl-access: Specifies the updated configuration for Zero-ETL access from the ODB network.
