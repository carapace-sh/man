name: disable-domain-transfer-lock
description: This operation removes the transfer lock on the domain (specifically the `clientTransferProhibited` status) to allow domain transfers.
flags:
    --domain-name=!: The name of the domain that you want to remove the transfer lock for.
documentation:
    command: This operation removes the transfer lock on the domain (specifically the `clientTransferProhibited` status) to allow domain transfers. We recommend you refrain from performing this action unless you intend to transfer the domain to a different registrar. Successful submission returns an operation ID that you can use to track the progress and completion of the action. If the request is not completed successfully, the domain registrant will be notified by email.
    flag:
        domain-name: The name of the domain that you want to remove the transfer lock for.
