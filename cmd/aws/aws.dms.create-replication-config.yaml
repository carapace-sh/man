name: create-replication-config
description: Creates a configuration that you can later provide to configure and start an DMS Serverless replication.
flags:
    --compute-config=!: Configuration parameters for provisioning an DMS Serverless replication.
    --replication-config-identifier=!: A unique identifier that you want to use to create a `ReplicationConfigArn` that is returned as part of the output from this action.
    --replication-settings=: Optional JSON settings for DMS Serverless replications that are provisioned using this replication configuration.
    --replication-type=!: The type of DMS Serverless replication to provision using this replication configuration.
    --resource-identifier=: Optional unique value or name that you set for a given resource that can be used to construct an Amazon Resource Name (ARN) for that resource.
    --source-endpoint-arn=!: The Amazon Resource Name (ARN) of the source endpoint for this DMS Serverless replication configuration.
    --supplemental-settings=: Optional JSON settings for specifying supplemental data.
    --table-mappings=!: JSON table mappings for DMS Serverless replications that are provisioned using this replication configuration.
    --tags=: One or more optional tags associated with resources used by the DMS Serverless replication.
    --target-endpoint-arn=!: The Amazon Resource Name (ARN) of the target endpoint for this DMS serverless replication configuration.
completion:
    flag:
        replication-type:
            - full-load
            - cdc
            - full-load-and-cdc
documentation:
    command: Creates a configuration that you can later provide to configure and start an DMS Serverless replication. You can also provide options to validate the configuration inputs before you start the replication.
    flag:
        compute-config: Configuration parameters for provisioning an DMS Serverless replication.
        replication-config-identifier: A unique identifier that you want to use to create a `ReplicationConfigArn` that is returned as part of the output from this action. You can then pass this output `ReplicationConfigArn` as the value of the `ReplicationConfigArn` option for other actions to identify both DMS Serverless replications and replication configurations that you want those actions to operate on. For some actions, you can also use either this unique identifier or a corresponding ARN in action filters to identify the specific replication and replication configuration to operate on.
        replication-settings: Optional JSON settings for DMS Serverless replications that are provisioned using this replication configuration. For example, see [Change processing tuning settings](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Tasks.CustomizingTasks.TaskSettings.ChangeProcessingTuning.html).
        replication-type: |-
            The type of DMS Serverless replication to provision using this replication configuration.

            Possible values:

            - `"full-load"`
            - `"cdc"`
            - `"full-load-and-cdc"`
        resource-identifier: Optional unique value or name that you set for a given resource that can be used to construct an Amazon Resource Name (ARN) for that resource. For more information, see [Fine-grained access control using resource names and tags](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Security.html#CHAP_Security.FineGrainedAccess).
        source-endpoint-arn: The Amazon Resource Name (ARN) of the source endpoint for this DMS Serverless replication configuration.
        supplemental-settings: Optional JSON settings for specifying supplemental data. For more information, see [Specifying supplemental data for task settings](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Tasks.TaskData.html).
        table-mappings: JSON table mappings for DMS Serverless replications that are provisioned using this replication configuration. For more information, see [Specifying table selection and transformations rules using JSON](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Tasks.CustomizingTasks.TableMapping.SelectionTransformation.html).
        tags: One or more optional tags associated with resources used by the DMS Serverless replication. For more information, see [Tagging resources in Database Migration Service](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Tagging.html).
        target-endpoint-arn: The Amazon Resource Name (ARN) of the target endpoint for this DMS serverless replication configuration.
