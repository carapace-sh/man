name: list-things-in-thing-group
description: Lists the things in the specified group.
flags:
    --max-results=: The maximum number of results to return at one time.
    --next-token=: To retrieve the next set of results, the `nextToken` value from a previous response; otherwise **null** to receive the first set of results.
    --recursive=: When true, list things in this thing group and in all child groups as well.
    --thing-group-name=!: The thing group name.
documentation:
    command: |-
        Lists the things in the specified group.

        Requires permission to access the [ListThingsInThingGroup](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        max-results: The maximum number of results to return at one time.
        next-token: To retrieve the next set of results, the `nextToken` value from a previous response; otherwise **null** to receive the first set of results.
        recursive: When true, list things in this thing group and in all child groups as well.
        thing-group-name: The thing group name.
