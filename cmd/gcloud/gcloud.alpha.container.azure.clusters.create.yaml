name: create
description: '*(ALPHA)*  *(DEPRECATED)*  Create an Anthos cluster on Azure.'
flags:
    --admin-groups=: Groups of users that can perform operations as a cluster administrator.
    --admin-users=: Users that can perform operations as a cluster administrator.
    --annotations=: Annotations for the cluster.
    --async: Return immediately, without waiting for the operation in progress to
    --azure-application-id=!: ID of the Azure Application to manage Azure resources.
    --azure-region=!: Azure location to deploy the cluster.
    --azure-tenant-id=!: ID of the Azure Tenant to manage Azure resources.
    --client=!: ID of the client or fully qualified identifier for the client.
    --cluster-version=!: Kubernetes version to use for the cluster.
    --config-encryption-key-id=: URL the of the Azure Key Vault key (with its version) to use to encrypt / decrypt config data.
    --config-encryption-public-key=: RSA key of the Azure Key Vault public key to use for encrypting config data.
    --database-encryption-key-id=: URL the of the Azure Key Vault key (with its version) to use to encrypt / decrypt cluster secrets.
    --description=: Description for the cluster.
    --enable-managed-prometheus: Enables managed collection for Managed Service for Prometheus in the cluster.
    --endpoint-subnet-id=: ARM ID of the subnet where the control plane load balancer is deployed.
    --fleet-project=!: ID or number of the Fleet host project where the cluster is registered.
    --location=: Google Cloud location for the cluster.
    --logging=: Set the components that have logging enabled.
    --main-volume-size=: Size of the main volume.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-enable-managed-prometheus&: ""
    --no-validate-only&: Validate the creation of the cluster, but don't actually perform it.
    --pod-address-cidr-blocks=!: IP address range for the pods in this cluster in CIDR notation (e.g. 10.0.0.0/8).
    --proxy-resource-group-id=!: The ARM ID the of the resource group containing proxy keyvault.
    --proxy-secret-id=!: The URL the of the proxy setting secret with its version.
    --replica-placements=: Placement info for the control plane replicas.
    --resource-group-id=!: ID of the Azure Resource Group to associate the cluster with.
    --root-volume-size=: Size of the root volume.
    --service-address-cidr-blocks=!: IP address range for the services IPs in CIDR notation (e.g. 10.0.0.0/8).
    --service-load-balancer-subnet-id=: ARM ID of the subnet where Kubernetes private service type load balancers are deployed, when the Service lacks a subnet annotation.
    --ssh-public-key=!: SSH public key to use for authentication.
    --subnet-id=: Subnet ID of an existing VNET to use for the cluster control plane.
    --tags=: Applies the given tags (comma separated) on the cluster.
    --validate-only: Validate the creation of the cluster, but don't actually perform it.
    --vm-size=: Azure Virtual Machine Size (e.g. Standard_DS1_v).
    --vnet-id=!: ID of the Azure Virtual Network to associate with the cluster.
documentation:
    command: |+
        *(ALPHA)*  *(DEPRECATED)*  Create an Anthos cluster on Azure.

        This command is deprecated. See https://cloud.google.com/kubernetes-engine/multi-cloud/docs/azure/deprecations/deprecation-announcement for more details.

    flag:
        admin-groups: Groups of users that can perform operations as a cluster administrator.
        admin-users: Users that can perform operations as a cluster administrator. If not specified, the value of property core/account is used.
        annotations: Annotations for the cluster.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        azure-application-id: ID of the Azure Application to manage Azure resources.
        azure-region: Azure location to deploy the cluster. Refer to your Azure subscription for available locations.
        azure-tenant-id: ID of the Azure Tenant to manage Azure resources.
        client: |-
            ID of the client or fully qualified identifier for the client.
            +
            To set the `client` attribute:
            * provide the argument `--client` on the command line.
        cluster-version: Kubernetes version to use for the cluster.
        config-encryption-key-id: URL the of the Azure Key Vault key (with its version) to use to encrypt / decrypt config data.
        config-encryption-public-key: RSA key of the Azure Key Vault public key to use for encrypting config data.
        database-encryption-key-id: URL the of the Azure Key Vault key (with its version) to use to encrypt / decrypt cluster secrets.
        description: Description for the cluster.
        enable-managed-prometheus: |-
            Enables managed collection for Managed Service for Prometheus in the cluster.
            +
            See https://cloud.google.com/stackdriver/docs/managed-prometheus/setup-managed#enable-mgdcoll-gke
            for more info.
            +
            Managed Prometheus is enabled by default for cluster versions 1.27 or greater,
            use --no-enable-managed-prometheus to disable.
        endpoint-subnet-id: ARM ID of the subnet where the control plane load balancer is deployed. When unspecified, it defaults to the control plane subnet ID.
        fleet-project: ID or number of the Fleet host project where the cluster is registered.
        location: |-
            Google Cloud location for the cluster.
            +
            To set the `location` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_azure/location`.
        logging: |-
            Set the components that have logging enabled.
            +
            Examples:
            +
              $ {command} --logging=SYSTEM
              $ {command} --logging=SYSTEM,WORKLOAD
            +
            _COMPONENT_ must be one of: *SYSTEM*, *WORKLOAD*.
        main-volume-size: Size of the main volume. The value must be a whole number followed by a size unit of `GB` for gigabyte, or `TB` for terabyte. If no size unit is specified, GB is assumed.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-enable-managed-prometheus: |
            Enables managed collection for Managed Service for Prometheus in the cluster.

            See https://cloud.google.com/stackdriver/docs/managed-prometheus/setup-managed#enable-mgdcoll-gke
            for more info.

            Managed Prometheus is enabled by default for cluster versions 1.27 or greater,
            use --no-enable-managed-prometheus to disable.
        no-validate-only: Validate the creation of the cluster, but don't actually perform it.
        pod-address-cidr-blocks: IP address range for the pods in this cluster in CIDR notation (e.g. 10.0.0.0/8).
        proxy-resource-group-id: The ARM ID the of the resource group containing proxy keyvault.
        proxy-secret-id: The URL the of the proxy setting secret with its version.
        replica-placements: Placement info for the control plane replicas. Replica placement is of format subnetid:zone, for example subnetid12345:1
        resource-group-id: ID of the Azure Resource Group to associate the cluster with.
        root-volume-size: Size of the root volume. The value must be a whole number followed by a size unit of `GB` for gigabyte, or `TB` for terabyte. If no size unit is specified, GB is assumed.
        service-address-cidr-blocks: IP address range for the services IPs in CIDR notation (e.g. 10.0.0.0/8).
        service-load-balancer-subnet-id: ARM ID of the subnet where Kubernetes private service type load balancers are deployed, when the Service lacks a subnet annotation.
        ssh-public-key: SSH public key to use for authentication.
        subnet-id: Subnet ID of an existing VNET to use for the cluster control plane.
        tags: |-
            Applies the given tags (comma separated) on the cluster. Example:
            +
              $ {command} EXAMPLE_CLUSTER --tags=tag1=one,tag2=two
        validate-only: Validate the creation of the cluster, but don't actually perform it.
        vm-size: Azure Virtual Machine Size (e.g. Standard_DS1_v).
        vnet-id: ID of the Azure Virtual Network to associate with the cluster.
