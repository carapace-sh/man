name: list-resolver-query-log-config-associations
description: Lists information about associations between Amazon VPCs and query logging configurations.
flags:
    --filters=: An optional specification to return a subset of query logging associations.
    --max-results=: The maximum number of query logging associations that you want to return in the response to a `ListResolverQueryLogConfigAssociations` request.
    --next-token=: For the first `ListResolverQueryLogConfigAssociations` request, omit this value.
    --sort-by=: The element that you want Resolver to sort query logging associations by.
    --sort-order=: If you specified a value for `SortBy`, the order that you want query logging associations to be listed in, `ASCENDING` or `DESCENDING`.
completion:
    flag:
        sort-order:
            - ASCENDING
            - DESCENDING
documentation:
    command: Lists information about associations between Amazon VPCs and query logging configurations.
    flag:
        filters: |-
            An optional specification to return a subset of query logging associations.

            If you submit a second or subsequent `ListResolverQueryLogConfigAssociations` request and specify the `NextToken` parameter, you must use the same values for `Filters`, if any, as in the previous request.
        max-results: The maximum number of query logging associations that you want to return in the response to a `ListResolverQueryLogConfigAssociations` request. If you don't specify a value for `MaxResults`, Resolver returns up to 100 query logging associations.
        next-token: |-
            For the first `ListResolverQueryLogConfigAssociations` request, omit this value.

            If there are more than `MaxResults` query logging associations that match the values that you specify for `Filters`, you can submit another `ListResolverQueryLogConfigAssociations` request to get the next group of associations. In the next request, specify the value of `NextToken` from the previous response.
        sort-by: "The element that you want Resolver to sort query logging associations by.\n\nIf you submit a second or subsequent `ListResolverQueryLogConfigAssociations` request and specify the `NextToken` parameter, you must use the same value for `SortBy`, if any, as in the previous request.\n\nValid values include the following elements:\n\n- `CreationTime`: The ID of the query logging association.\n- `Error`: If the value of `Status` is `FAILED`, the value of `Error` indicates the cause:\n  \n  - `DESTINATION_NOT_FOUND`: The specified destination (for example, an Amazon S3 bucket) was deleted.\n  - `ACCESS_DENIED`: Permissions don't allow sending logs to the destination.\n  \n  If `Status` is a value other than `FAILED`, `ERROR` is null.\n- `Id`: The ID of the query logging association\n- `ResolverQueryLogConfigId`: The ID of the query logging configuration\n- `ResourceId`: The ID of the VPC that is associated with the query logging configuration\n- `Status`: The current status of the configuration. Valid values include the following:\n  \n  - `CREATING`: Resolver is creating an association between an Amazon VPC and a query logging configuration.\n  - `CREATED`: The association between an Amazon VPC and a query logging configuration was successfully created. Resolver is logging queries that originate in the specified VPC.\n  - `DELETING`: Resolver is deleting this query logging association.\n  - `FAILED`: Resolver either couldn't create or couldn't delete the query logging association. Here are two common causes:\n    \n    - The specified destination (for example, an Amazon S3 bucket) was deleted.\n    - Permissions don't allow sending logs to the destination."
        sort-order: |-
            If you specified a value for `SortBy`, the order that you want query logging associations to be listed in, `ASCENDING` or `DESCENDING`.

            If you submit a second or subsequent `ListResolverQueryLogConfigAssociations` request and specify the `NextToken` parameter, you must use the same value for `SortOrder`, if any, as in the previous request.
