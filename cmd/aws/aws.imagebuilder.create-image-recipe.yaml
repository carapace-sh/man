name: create-image-recipe
description: Creates a new image recipe.
flags:
    --additional-instance-configuration=: Specify additional settings and launch scripts for your build instances.
    --ami-tags=: Tags that are applied to the AMI that Image Builder creates during the Build phase prior to image distribution.
    --block-device-mappings=: The block device mappings of the image recipe.
    --client-token=!: Unique, case-sensitive identifier you provide to ensure idempotency of the request.
    --components=: The components included in the image recipe.
    --description=: The description of the image recipe.
    --name=!: The name of the image recipe.
    --parent-image=!: The base image for customizations specified in the image recipe.
    --semantic-version=!: The semantic version of the image recipe.
    --tags=: The tags of the image recipe.
    --working-directory=: The working directory used during build and test workflows.
documentation:
    command: Creates a new image recipe. Image recipes define how images are configured, tested, and assessed.
    flag:
        additional-instance-configuration: Specify additional settings and launch scripts for your build instances.
        ami-tags: Tags that are applied to the AMI that Image Builder creates during the Build phase prior to image distribution.
        block-device-mappings: The block device mappings of the image recipe.
        client-token: Unique, case-sensitive identifier you provide to ensure idempotency of the request. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html) in the *Amazon EC2 API Reference*.
        components: The components included in the image recipe.
        description: The description of the image recipe.
        name: The name of the image recipe.
        parent-image: |-
            The base image for customizations specified in the image recipe. You can specify the parent image using one of the following options:

            - AMI ID
            - Image Builder image Amazon Resource Name (ARN)
            - Amazon Web Services Systems Manager (SSM) Parameter Store Parameter, prefixed by `ssm:`, followed by the parameter name or ARN.
            - Amazon Web Services Marketplace product ID

            If you enter an AMI ID or an SSM parameter that contains the AMI ID, you must have access to the AMI, and the AMI must be in the source Region.
        semantic-version: |-
            The semantic version of the image recipe. This version follows the semantic version syntax.

            The semantic version has four nodes: &lt;major&gt;.&lt;minor&gt;.&lt;patch&gt;/&lt;build&gt;. You can assign values for the first three, and can filter on all of them.

            **Assignment:** For the first three nodes you can assign any positive integer value, including zero, with an upper limit of 2^30-1, or 1073741823 for each node. Image Builder automatically assigns the build number to the fourth node.

            **Patterns:** You can use any numeric pattern that adheres to the assignment requirements for the nodes that you can assign. For example, you might choose a software version pattern, such as 1.0.0, or a date, such as 2021.01.01.
        tags: The tags of the image recipe.
        working-directory: The working directory used during build and test workflows.
