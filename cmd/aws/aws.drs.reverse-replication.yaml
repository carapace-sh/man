name: reverse-replication
description: Start replication to origin / target region - applies only to protected instances that originated in EC2.
flags:
    --recovery-instance-id=!: The ID of the Recovery Instance that we want to reverse the replication for.
documentation:
    command: Start replication to origin / target region - applies only to protected instances that originated in EC2. For recovery instances on target region - starts replication back to origin region. For failback instances on origin region - starts replication to target region to re-protect them.
    flag:
        recovery-instance-id: The ID of the Recovery Instance that we want to reverse the replication for.
