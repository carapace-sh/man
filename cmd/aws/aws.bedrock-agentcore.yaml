                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            client-token: A unique, case-sensitive identifier to ensure that the API request completes no more than one time. If this token matches a previous request, the service ignores the request, but does not return an error.
            description: The description of the A/B test.
            enable-on-create: Whether to enable the A/B test immediately upon creation. If true, traffic splitting begins automatically.
            evaluation-config: The evaluation configuration specifying which online evaluation configurations to use for measuring variant performance.
            gateway-arn: The Amazon Resource Name (ARN) of the gateway to use for traffic splitting.
            gateway-filter: Optional filter to restrict which gateway target paths are included in the A/B test.
            generate-cli-skeleton: |-
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            name: The name of the A/B test. Must be unique within your account.
            role-arn: The IAM role ARN that grants permissions for the A/B test to access gateway and evaluation resources.
            variants: 'The list of variants for the A/B test. Must contain exactly two variants: a control (C) and a treatment (T1), each with a configuration bundle or target reference and a traffic weight.'
