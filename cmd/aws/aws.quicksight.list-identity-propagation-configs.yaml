name: list-identity-propagation-configs
description: Lists all services and authorized targets that the QuickSight IAM Identity Center application can access.
flags:
    --aws-account-id=!: The ID of the Amazon Web Services account that contain the identity propagation configurations of.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
