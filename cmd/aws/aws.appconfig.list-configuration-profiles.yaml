name: list-configuration-profiles
description: Lists the configuration profiles for an application.
flags:
    --application-id=!: The application ID.
    --max-results=: The maximum number of items to return for this call.
    --next-token=: A token to start the list.
    --type=: A filter based on the type of configurations that the configuration profile contains.
documentation:
    command: Lists the configuration profiles for an application.
    flag:
        application-id: The application ID.
        max-results: The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: A token to start the list. Use this token to get the next set of results.
        type: A filter based on the type of configurations that the configuration profile contains. A configuration can be a feature flag or a freeform configuration.
