name: describe-storedi-scsivolumes
description: Returns the description of the gateway volumes specified in the request.
flags:
    --volume-arns=!: An array of strings where each string represents the Amazon Resource Name (ARN) of a stored volume.
documentation:
    command: Returns the description of the gateway volumes specified in the request. The list of gateway volumes in the request must be from one gateway. In the response, Storage Gateway returns volume information sorted by volume ARNs. This operation is only supported in stored volume gateway type.
    flag:
        volume-arns: An array of strings where each string represents the Amazon Resource Name (ARN) of a stored volume. All of the specified stored volumes must be from the same gateway. Use [ListVolumes]() to get volume ARNs for a gateway.
