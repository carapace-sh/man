name: update-certificate
description: Updates the status of the specified certificate.
flags:
    --certificate-id=!: The ID of the certificate.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --new-status=!: The new status.
completion:
    flag:
        new-status:
            - ACTIVE
            - INACTIVE
            - REVOKED
            - PENDING_TRANSFER
            - REGISTER_INACTIVE
            - PENDING_ACTIVATION
documentation:
    command: |-
        Updates the status of the specified certificate. This operation is idempotent.

        Requires permission to access the [UpdateCertificate](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.

        Certificates must be in the ACTIVE state to authenticate devices that use a certificate to connect to IoT.

        Within a few minutes of updating a certificate from the ACTIVE state to any other state, IoT disconnects all devices that used that certificate to connect. Devices cannot use a certificate that is not in the ACTIVE state to reconnect.
    flag:
        certificate-id: The ID of the certificate. (The last part of the certificate ARN contains the certificate ID.)
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        new-status: |-
            The new status.

            **Note:** Setting the status to PENDING\_TRANSFER or PENDING\_ACTIVATION will result in an exception being thrown. PENDING\_TRANSFER and PENDING\_ACTIVATION are statuses used internally by IoT. They are not intended for developer use.

            **Note:** The status value REGISTER\_INACTIVE is deprecated and should not be used.
