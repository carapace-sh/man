name: get-browser-session
description: Retrieves detailed information about a specific browser session in Amazon Bedrock.
flags:
    --browser-identifier=!: The unique identifier of the browser associated with the session.
    --session-id=!: The unique identifier of the browser session to retrieve.
documentation:
    command: |-
        Retrieves detailed information about a specific browser session in Amazon Bedrock. This operation returns the session's configuration, current status, associated streams, and metadata.

        To get a browser session, you must specify both the browser identifier and the session ID. The response includes information about the session's viewport configuration, timeout settings, and stream endpoints.

        The following operations are related to `GetBrowserSession`:

        - [StartBrowserSession](https://docs.aws.amazon.com/API_StartBrowserSession.html)
        - [ListBrowserSessions](https://docs.aws.amazon.com/API_ListBrowserSessions.html)
        - [StopBrowserSession](https://docs.aws.amazon.com/API_StopBrowserSession.html)
    flag:
        browser-identifier: The unique identifier of the browser associated with the session.
        session-id: The unique identifier of the browser session to retrieve.
