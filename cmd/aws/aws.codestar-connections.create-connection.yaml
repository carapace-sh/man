name: create-connection
description: Creates a connection that can then be given to other Amazon Web Services services like CodePipeline so that it can access third-party code repositories.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --connection-name=!: The name of the connection to be created.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --host-arn=: The Amazon Resource Name (ARN) of the host associated with the connection to be created.
    --provider-type=: The name of the external provider where your third-party code repository is configured.
    --tags=:
        description: The key-value pair to use when tagging the resource.
        nargs: -1
completion:
    flag:
        provider-type:
            - Bitbucket
            - GitHub
            - GitHubEnterpriseServer
            - GitLab
            - GitLabSelfManaged
documentation:
    command: Creates a connection that can then be given to other Amazon Web Services services like CodePipeline so that it can access third-party code repositories. The connection is in pending status until the third-party connection handshake is completed from the console.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        connection-name: The name of the connection to be created.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        host-arn: The Amazon Resource Name (ARN) of the host associated with the connection to be created.
        provider-type: The name of the external provider where your third-party code repository is configured.
        tags: The key-value pair to use when tagging the resource.
