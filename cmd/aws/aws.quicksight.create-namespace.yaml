name: create-namespace
description: (Enterprise edition only) Creates a new namespace for you to use with Amazon Quick Sight.
flags:
    --aws-account-id=!: The ID for the Amazon Web Services account that you want to create the Quick Sight namespace in.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identity-store=!: Specifies the type of your user identity directory.
    --namespace=!: The name that you want to use to describe the new namespace.
    --tags=: The tags that you want to associate with the namespace that you're creating.
completion:
    flag:
        identity-store:
            - QUICKSIGHT
documentation:
    command: |-
        (Enterprise edition only) Creates a new namespace for you to use with Amazon Quick Sight.

        A namespace allows you to isolate the Quick Sight users and groups that are registered for that namespace. Users that access the namespace can share assets only with other users or groups in the same namespace. They can't see users and groups in other namespaces. You can create a namespace after your Amazon Web Services account is subscribed to Quick Sight. The namespace must be unique within the Amazon Web Services account. By default, there is a limit of 100 namespaces per Amazon Web Services account. To increase your limit, create a ticket with Amazon Web Services Support.
    flag:
        aws-account-id: The ID for the Amazon Web Services account that you want to create the Quick Sight namespace in.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        identity-store: Specifies the type of your user identity directory. Currently, this supports users with an identity type of `QUICKSIGHT`.
        namespace: The name that you want to use to describe the new namespace.
        tags: The tags that you want to associate with the namespace that you're creating.
