name: describe-events
description: Returns events related to clusters, cache security groups, and cache parameter groups.
flags:
    --duration=: The number of minutes worth of events to retrieve.
    --end-time=: The end of the time interval for which to retrieve events, specified in ISO 8601 format.
    --marker=: An optional marker returned from a prior request.
    --max-records=: The maximum number of records to include in the response.
    --source-identifier=: The identifier of the event source for which events are returned.
    --source-type=: The event source to retrieve events for.
    --start-time=: The beginning of the time interval to retrieve events for, specified in ISO 8601 format.
completion:
    flag:
        source-type:
            - cache-cluster
            - cache-parameter-group
            - cache-security-group
            - cache-subnet-group
            - replication-group
            - serverless-cache
            - serverless-cache-snapshot
            - user
            - user-group
documentation:
    command: |-
        Returns events related to clusters, cache security groups, and cache parameter groups. You can obtain events specific to a particular cluster, cache security group, or cache parameter group by providing the name as a parameter.

        By default, only the events occurring within the last hour are returned; however, you can retrieve up to 14 days' worth of events if necessary.
    flag:
        duration: The number of minutes worth of events to retrieve.
        end-time: |-
            The end of the time interval for which to retrieve events, specified in ISO 8601 format.

            **Example:** 2017-03-30T07:03:49.555Z
        marker: An optional marker returned from a prior request. Use this marker for pagination of results from this operation. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a marker is included in the response so that the remaining results can be retrieved.

            Default: 100

            Constraints: minimum 20; maximum 100.
        source-identifier: The identifier of the event source for which events are returned. If not specified, all sources are included in the response.
        source-type: The event source to retrieve events for. If no value is specified, all events are returned.
        start-time: |-
            The beginning of the time interval to retrieve events for, specified in ISO 8601 format.

            **Example:** 2017-03-30T07:03:49.555Z
