            This may  not  be  specified  along with --cli-input-yaml.
        filter-option: Object that restricts how a claimed game server is chosen.
        game-server-data: A set of custom game server properties, formatted as a single string value. This data is passed to a game client or service when it requests information on game servers.
        game-server-group-name: A unique identifier for the game server group where the game server is running. If you are not specifying a game server to claim, this value identifies where you want Amazon GameLift Servers FleetIQ to look for an available game server to claim.
        game-server-id: A custom string that uniquely identifies the game server to claim. If this parameter is left empty, Amazon GameLift Servers FleetIQ searches for an available game server in the specified game server group.
