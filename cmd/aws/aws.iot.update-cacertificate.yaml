name: update-cacertificate
description: Updates a registered CA certificate.
flags:
    --certificate-id=!: The CA certificate identifier.
    --new-auto-registration-status=: The new value for the auto registration status.
    --new-status=: The updated status of the CA certificate.
    --registration-config=: Information about the registration configuration.
    --remove-auto-registration=: If true, removes auto registration.
completion:
    flag:
        new-auto-registration-status:
            - ENABLE
            - DISABLE
        new-status:
            - ACTIVE
            - INACTIVE
documentation:
    command: |-
        Updates a registered CA certificate.

        Requires permission to access the [UpdateCACertificate](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        certificate-id: The CA certificate identifier.
        new-auto-registration-status: 'The new value for the auto registration status. Valid values are: "ENABLE" or "DISABLE".'
        new-status: |-
            The updated status of the CA certificate.

            **Note:** The status value REGISTER\_INACTIVE is deprecated and should not be used.
        registration-config: Information about the registration configuration.
        remove-auto-registration: If true, removes auto registration.
