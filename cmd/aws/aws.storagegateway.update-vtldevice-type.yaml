name: update-vtldevice-type
description: Updates the type of medium changer in a tape gateway.
flags:
    --device-type=!: The type of medium changer you want to select.
    --vtldevice-arn=!: The Amazon Resource Name (ARN) of the medium changer you want to select.
documentation:
    command: Updates the type of medium changer in a tape gateway. When you activate a tape gateway, you select a medium changer type for the tape gateway. This operation enables you to select a different type of medium changer after a tape gateway is activated. This operation is only supported in the tape gateway type.
    flag:
        device-type: |-
            The type of medium changer you want to select.

            Valid Values: `STK-L700` | `AWS-Gateway-VTL` | `IBM-03584L32-0402`
        vtldevice-arn: The Amazon Resource Name (ARN) of the medium changer you want to select.
