name: set-iam-policy
description: Set the IAM policy for a Compute Engine node template.
flags:
    --region=: The name of the Google Compute Engine region.
documentation:
    command: |
        Sets the IAM policy for the given node template as defined in a JSON or YAML file.
    flag:
        region: |-
            The name of the Google Compute Engine region.
            +
            To set the `region` attribute:
            * provide the argument `node_template` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `compute/region`.
