name: create-dev-environment
description: Creates a Dev Environment in Amazon CodeCatalyst, a cloud-based development environment that you can use to quickly work on the code stored in the source repositories of your project.
flags:
    --alias=: The user-defined alias for a Dev Environment.
    --client-token=: A user-specified idempotency token.
    --ides=: Information about the integrated development environment (IDE) configured for a Dev Environment.
    --inactivity-timeout-minutes=: The amount of time the Dev Environment will run without any activity detected before stopping, in minutes.
    --instance-type=!: The Amazon EC2 instace type to use for the Dev Environment.
    --persistent-storage=!: Information about the amount of storage allocated to the Dev Environment.
    --project-name=!: The name of the project in the space.
    --repositories=: The source repository that contains the branch to clone into the Dev Environment.
    --space-name=!: The name of the space.
    --vpc-connection-name=: The name of the connection that will be used to connect to Amazon VPC, if any.
completion:
    flag:
        instance-type:
            - dev.standard1.small
            - dev.standard1.medium
            - dev.standard1.large
            - dev.standard1.xlarge
documentation:
    command: |-
        Creates a Dev Environment in Amazon CodeCatalyst, a cloud-based development environment that you can use to quickly work on the code stored in the source repositories of your project.

        When created in the Amazon CodeCatalyst console, by default a Dev Environment is configured to have a 2 core processor, 4GB of RAM, and 16GB of persistent storage. None of these defaults apply to a Dev Environment created programmatically.
    flag:
        alias: The user-defined alias for a Dev Environment.
        client-token: A user-specified idempotency token. Idempotency ensures that an API request completes only once. With an idempotent request, if the original request completes successfully, the subsequent retries return the result from the original successful request and have no additional effect.
        ides: |-
            Information about the integrated development environment (IDE) configured for a Dev Environment.

            An IDE is required to create a Dev Environment. For Dev Environment creation, this field contains configuration information and must be provided.
        inactivity-timeout-minutes: The amount of time the Dev Environment will run without any activity detected before stopping, in minutes. Only whole integers are allowed. Dev Environments consume compute minutes when running.
        instance-type: The Amazon EC2 instace type to use for the Dev Environment.
        persistent-storage: |-
            Information about the amount of storage allocated to the Dev Environment.

            By default, a Dev Environment is configured to have 16GB of persistent storage when created from the Amazon CodeCatalyst console, but there is no default when programmatically creating a Dev Environment. Valid values for persistent storage are based on memory sizes in 16GB increments. Valid values are 16, 32, and 64.
        project-name: The name of the project in the space.
        repositories: The source repository that contains the branch to clone into the Dev Environment.
        space-name: The name of the space.
        vpc-connection-name: The name of the connection that will be used to connect to Amazon VPC, if any.
