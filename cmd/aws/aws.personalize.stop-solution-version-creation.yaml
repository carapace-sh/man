name: stop-solution-version-creation
description: Stops creating a solution version that is in a state of CREATE\_PENDING or CREATE IN\_PROGRESS.
flags:
    --solution-version-arn=!: The Amazon Resource Name (ARN) of the solution version you want to stop creating.
documentation:
    command: "Stops creating a solution version that is in a state of CREATE\\_PENDING or CREATE IN\\_PROGRESS.\n\nDepending on the current state of the solution version, the solution version state changes as follows:\n\n- CREATE\\_PENDING &gt; CREATE\\_STOPPED\n  \n  or\n- CREATE\\_IN\\_PROGRESS &gt; CREATE\\_STOPPING &gt; CREATE\\_STOPPED\n\nYou are billed for all of the training completed up until you stop the solution version creation. You cannot resume creating a solution version once it has been stopped."
    flag:
        solution-version-arn: The Amazon Resource Name (ARN) of the solution version you want to stop creating.
