name: list-scan-job-summaries
description: This is a request for a summary of scan jobs created or running within the most recent 30 days.
flags:
    --account-id=: Returns the job count for the specified account.
    --aggregation-period=: The period for the returned results.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --malware-scanner=: Returns only the scan jobs for the specified malware scanner.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of items to be returned.
    --next-token=: The next item following a partial list of returned items.
    --page-size=: The size of each page to get in the AWS service call.
    --resource-type=: Returns the job count for the specified resource type.
    --scan-result-status=: Returns only the scan jobs for the specified scan results.
    --starting-token=: A token to specify where to start paginating.
    --state=: Returns only the scan jobs for the specified scanning job state.
completion:
    flag:
        aggregation-period:
            - ONE_DAY
            - SEVEN_DAYS
            - FOURTEEN_DAYS
        malware-scanner:
            - GUARDDUTY
        scan-result-status:
            - NO_THREATS_FOUND
            - THREATS_FOUND
        state:
            - CREATED
            - COMPLETED
            - COMPLETED_WITH_ISSUES
            - RUNNING
            - FAILED
            - CANCELED
            - AGGREGATE_ALL
            - ANY
documentation:
    command: This is a request for a summary of scan jobs created or running within the most recent 30 days.
    flag:
        account-id: |-
            Returns the job count for the specified account.

            If the request is sent from a member account or an account not part of Amazon Web Services Organizations, jobs within requestor's account will be returned.

            Root, admin, and delegated administrator accounts can use the value `ANY` to return job counts from every account in the organization.

            `AGGREGATE_ALL` aggregates job counts from all accounts within the authenticated organization, then returns the sum.
        aggregation-period: |-
            The period for the returned results.

            - `ONE_DAY`The daily job count for the prior 1 day.
            - `SEVEN_DAYS`The daily job count for the prior 7 days.
            - `FOURTEEN_DAYS`The daily job count for the prior 14 days.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        malware-scanner: Returns only the scan jobs for the specified malware scanner. Currently the only MalwareScanner is `GUARDDUTY`. But the field also supports `ANY`, and `AGGREGATE_ALL`.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: |-
            The maximum number of items to be returned.

            The value is an integer. Range of accepted values is from 1 to 500.
        next-token: The next item following a partial list of returned items. For example, if a request is made to return `MaxResults` number of items, `NextToken` allows you to return more items in your list starting at the location pointed to by the next token.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        resource-type: |-
            Returns the job count for the specified resource type. Use request `GetSupportedResourceTypes` to obtain strings for supported resource types.

            The the value `ANY` returns count of all resource types.

            `AGGREGATE_ALL` aggregates job counts for all resource types and returns the sum.
        scan-result-status: Returns only the scan jobs for the specified scan results.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        state: Returns only the scan jobs for the specified scanning job state.
