name: sync-resource
description: Syncs the resource with current AppRegistry records.
flags:
    --resource-type=!: The type of resource of which the application will be associated.
    --resource=!: An entity you can work with and specify with a name or ID.
completion:
    flag:
        resource-type:
            - CFN_STACK
            - RESOURCE_TAG_VALUE
documentation:
    command: |-
        Syncs the resource with current AppRegistry records.

        Specifically, the resource’s AppRegistry system tags sync with its associated application. We remove the resource's AppRegistry system tags if it does not associate with the application. The caller must have permissions to read and update the resource.
    flag:
        resource: An entity you can work with and specify with a name or ID. Examples include an Amazon EC2 instance, an Amazon Web Services CloudFormation stack, or an Amazon S3 bucket.
        resource-type: The type of resource of which the application will be associated.
