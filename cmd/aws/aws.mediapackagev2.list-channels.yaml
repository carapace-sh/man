name: list-channels
description: Retrieves all channels in a specific channel group that are configured in AWS Elemental MediaPackage.
flags:
    --channel-group-name=!: The name that describes the channel group.
    --max-results=: The maximum number of results to return in the response.
    --next-token=: The pagination token from the GET list request.
documentation:
    command: Retrieves all channels in a specific channel group that are configured in AWS Elemental MediaPackage.
    flag:
        channel-group-name: The name that describes the channel group. The name is the primary identifier for the channel group, and must be unique for your account in the AWS Region.
        max-results: The maximum number of results to return in the response.
        next-token: The pagination token from the GET list request. Use the token to fetch the next page of results.
