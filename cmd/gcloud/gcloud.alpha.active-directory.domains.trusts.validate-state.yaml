name: validate-state
description: '*(ALPHA)*  Validate the state of a Managed Microsoft AD trust.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --target-domain-name=!: Target domain name of the Managed Microsoft AD Active Directory trust you want to validate.
documentation:
    command: |
        *(ALPHA)*  Validate the state of a Managed Microsoft AD trust.

        Verify that the trust has been properly created and that the domains/forests can
        communicate with each other.

        This command can fail for the following reasons:
          * The AD domain specified does not exist.
          * The active account does not have permission to access the given
            AD domain.
          * The AD trust specified does not exist.
          * The active account does not have permission to access the given
            AD trust.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        target-domain-name: Target domain name of the Managed Microsoft AD Active Directory trust you want to validate.
