name: create-tags
description: Creates one or more tags for configuration items.
flags:
    --configuration-ids=!: A list of configuration items that you want to tag.
    --tags=!: Tags that you want to associate with one or more configuration items.
documentation:
    command: |-
        Creates one or more tags for configuration items. Tags are metadata that help you categorize IT assets. This API accepts a list of multiple configuration items.

        Do not store sensitive information (like personal data) in tags.
    flag:
        configuration-ids: A list of configuration items that you want to tag.
        tags: |-
            Tags that you want to associate with one or more configuration items. Specify the tags that you want to create in a *key*-*value* format. For example:

            `{"key": "serverType", "value": "webServer"}`
