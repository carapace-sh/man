name: update
description: '*(ALPHA)*  Update a Compute Engine organization firewall policy.'
flags:
    --description=: An optional, textual description for the organization security policy.
    --organization=: Organization in which the organization firewall policy is to be updated.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute firewall-policies update* is used to update organization firewall policies. An organization
        firewall policy is a set of rules that controls access to various resources.
    flag:
        description: An optional, textual description for the organization security policy.
        organization: Organization in which the organization firewall policy is to be updated. Must be set if FIREWALL_POLICY is short name.
