name: get-access-grant
description: Get the details of an access grant from your S3 Access Grants instance.
flags:
    --access-grant-id=!: The ID of the access grant.
    --account-id=!: The Amazon Web Services account ID of the S3 Access Grants instance.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
documentation:
    command: |-
        Get the details of an access grant from your S3 Access Grants instance.

        Permissions

        You must have the `s3:GetAccessGrant` permission to use this operation.

        You must URL encode any signed header values that contain spaces. For example, if your header value is `my file.txt`, containing two spaces after `my`, you must URL encode this value to `my%20%20file.txt`.
    flag:
        access-grant-id: The ID of the access grant. S3 Access Grants auto-generates this ID when you create the access grant.
        account-id: The Amazon Web Services account ID of the S3 Access Grants instance.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
