name: clone-rules
description: Replace the rules of a Compute Engine network firewall policy with rules from another policy.
flags:
    --global: If set, the firewall policy is global.
    --no-global&: If set, the firewall policy is global.
    --region=: Region of the firewall policy to clone-rules.
    --source-firewall-policy=!: Name of the source network firewall policy to copy the rules from.
documentation:
    command: |-
        *gcloud compute network-firewall-policies clone-rules* is used to replace the rules of network firewall policies. A
         network firewall policy is a set of rules that controls access to
         various resources.
    flag:
        global: If set, the firewall policy is global.
        no-global: If set, the firewall policy is global.
        region: Region of the firewall policy to clone-rules. Overrides the default *compute/region* property value for this command invocation.
        source-firewall-policy: Name of the source network firewall policy to copy the rules from.
