name: create-data-quality-job-definition
description: Creates a definition for a job that monitors data quality and drift.
flags:
    --data-quality-app-specification=!: Specifies the container that runs the monitoring job.
    --data-quality-baseline-config=: Configures the constraints and baselines for the monitoring job.
    --data-quality-job-input=!: A list of inputs for the monitoring job.
    --data-quality-job-output-config=!: ""
    --job-definition-name=!: The name for the monitoring job definition.
    --job-resources=!: ""
    --network-config=: Specifies networking configuration for the monitoring job.
    --role-arn=!: The Amazon Resource Name (ARN) of an IAM role that Amazon SageMaker AI can assume to perform tasks on your behalf.
    --stopping-condition=: ""
    --tags=: (Optional) An array of key-value pairs.
documentation:
    command: Creates a definition for a job that monitors data quality and drift. For information about model monitor, see [Amazon SageMaker AI Model Monitor](https://docs.aws.amazon.com/sagemaker/latest/dg/model-monitor.html).
    flag:
        data-quality-app-specification: Specifies the container that runs the monitoring job.
        data-quality-baseline-config: Configures the constraints and baselines for the monitoring job.
        data-quality-job-input: A list of inputs for the monitoring job. Currently endpoints are supported as monitoring inputs.
        data-quality-job-output-config: ""
        job-definition-name: The name for the monitoring job definition.
        job-resources: ""
        network-config: Specifies networking configuration for the monitoring job.
        role-arn: The Amazon Resource Name (ARN) of an IAM role that Amazon SageMaker AI can assume to perform tasks on your behalf.
        stopping-condition: ""
        tags: (Optional) An array of key-value pairs. For more information, see [Using Cost Allocation Tags](https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-alloc-tags.html#allocation-whatURL) in the *Amazon Web Services Billing and Cost Management User Guide*.
