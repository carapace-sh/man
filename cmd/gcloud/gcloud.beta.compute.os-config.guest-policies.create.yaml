name: create
description: '*(BETA)*  Create a guest policy for a project.'
flags:
    --file=!: The JSON or YAML file with the guest policy to create.
documentation:
    command: |-
        ## EXAMPLES

          To create a guest policy `policy1` in the current project, run:

                $ gcloud beta compute os-config guest-policies create policy1 --file=path_to_config_file
    flag:
        file: |-
            The JSON or YAML file with the guest policy to create. For information
            about the guest policy format, see https://cloud.google.com/compute/docs/osconfig/rest/v1beta/projects.guestPolicies.
