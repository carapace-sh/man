name: authorize-client-vpn-ingress
description: Adds an ingress authorization rule to a Client VPN endpoint.
flags:
    --access-group-id=: The ID of the group to grant access to, for example, the Active Directory group or identity provider (IdP) group.
    --authorize-all-groups: Indicates whether to grant access to all clients.
    --client-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --client-vpn-endpoint-id=!: The ID of the Client VPN endpoint.
    --description=: A brief description of the authorization rule.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-authorize-all-groups: Indicates whether to grant access to all clients.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --target-network-cidr=!: The IPv4 address range, in CIDR notation, of the network for which access is being authorized.
documentation:
    command: Adds an ingress authorization rule to a Client VPN endpoint. Ingress authorization rules act as firewall rules that grant access to networks. You must configure ingress authorization rules to enable clients to access resources in Amazon Web Services or on-premises networks.
    flag:
        access-group-id: The ID of the group to grant access to, for example, the Active Directory group or identity provider (IdP) group. Required if `AuthorizeAllGroups` is `false` or not specified.
        authorize-all-groups: Indicates whether to grant access to all clients. Specify `true` to grant all clients who successfully establish a VPN connection access to the network. Must be set to `true` if `AccessGroupId` is not specified.
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/ec2/latest/devguide/ec2-api-idempotency.html).
        client-vpn-endpoint-id: The ID of the Client VPN endpoint.
        description: A brief description of the authorization rule.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        target-network-cidr: The IPv4 address range, in CIDR notation, of the network for which access is being authorized.
