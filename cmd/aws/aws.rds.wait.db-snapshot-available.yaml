name: db-snapshot-available
description: Returns information about DB snapshots.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --db-instance-identifier=: The ID of the DB instance to retrieve the list of DB snapshots for.
    --db-snapshot-identifier=: A specific DB snapshot identifier to describe.
    --dbi-resource-id=: A specific DB resource ID to describe.
    --filters=:
        description: A filter that specifies one or more DB snapshots to describe.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --include-public: Specifies whether to include manual DB cluster snapshots that are public and can be copied or restored by any Amazon Web Services account.
    --include-shared: Specifies whether to include shared manual DB cluster snapshots from other Amazon Web Services accounts that this Amazon Web Services account has been given permission to copy or restore.
    --marker=: An optional pagination token provided by a previous `DescribeDBSnapshots` request.
    --max-items=: The  total number of items to return in the command's output.
    --max-records=: The maximum number of records to include in the response.
    --no-include-public: Specifies whether to include manual DB cluster snapshots that are public and can be copied or restored by any Amazon Web Services account.
    --no-include-shared: Specifies whether to include shared manual DB cluster snapshots from other Amazon Web Services accounts that this Amazon Web Services account has been given permission to copy or restore.
    --page-size=: The size of each page to get in the AWS service call.
    --snapshot-type=: The type of snapshots to be returned.
    --starting-token=: A token to specify where to start paginating.
documentation:
    command: Returns information about DB snapshots. This API action supports pagination.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        db-instance-identifier: |-
            The ID of the DB instance to retrieve the list of DB snapshots for. This parameter isn't case-sensitive.

            Constraints:

            - If supplied, must match the identifier of an existing DBInstance.
        db-snapshot-identifier: |-
            A specific DB snapshot identifier to describe. This value is stored as a lowercase string.

            Constraints:

            - If supplied, must match the identifier of an existing DBSnapshot.
            - If this identifier is for an automated snapshot, the `SnapshotType` parameter must also be specified.
        dbi-resource-id: A specific DB resource ID to describe.
        filters: |-
            A filter that specifies one or more DB snapshots to describe.

            Supported filters:

            - `db-instance-id` - Accepts DB instance identifiers and DB instance Amazon Resource Names (ARNs).
            - `db-snapshot-id` - Accepts DB snapshot identifiers.
            - `dbi-resource-id` - Accepts identifiers of source DB instances.
            - `snapshot-type` - Accepts types of DB snapshots.
            - `engine` - Accepts names of database engines.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        include-public: |-
            Specifies whether to include manual DB cluster snapshots that are public and can be copied or restored by any Amazon Web Services account. By default, the public snapshots are not included.

            You can share a manual DB snapshot as public by using the [ModifyDBSnapshotAttribute]() API.

            This setting doesn't apply to RDS Custom.
        include-shared: |-
            Specifies whether to include shared manual DB cluster snapshots from other Amazon Web Services accounts that this Amazon Web Services account has been given permission to copy or restore. By default, these snapshots are not included.

            You can give an Amazon Web Services account permission to restore a manual DB snapshot from another Amazon Web Services account by using the `ModifyDBSnapshotAttribute` API action.

            This setting doesn't apply to RDS Custom.
        marker: An optional pagination token provided by a previous `DescribeDBSnapshots` request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that you can retrieve the remaining results.

            Default: 100

            Constraints: Minimum 20, maximum 100.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        snapshot-type: "The type of snapshots to be returned. You can specify one of the following values:\n\n- `automated` - Return all DB snapshots that have been automatically taken by Amazon RDS for my Amazon Web Services account.\n- `manual` - Return all DB snapshots that have been taken by my Amazon Web Services account.\n- `shared` - Return all manual DB snapshots that have been shared to my Amazon Web Services account.\n- `public` - Return all DB snapshots that have been marked as public.\n- `awsbackup` - Return the DB snapshots managed by the Amazon Web Services Backup service.\n  \n  For information about Amazon Web Services Backup, see the [*Amazon Web Services Backup Developer Guide.*](https://docs.aws.amazon.com/aws-backup/latest/devguide/whatisbackup.html)\n  \n  The `awsbackup` type does not apply to Aurora.\n\nIf you don't specify a `SnapshotType` value, then both automated and manual snapshots are returned. Shared and public DB snapshots are not included in the returned results by default. You can include shared snapshots with these results by enabling the `IncludeShared` parameter. You can include public snapshots with these results by enabling the `IncludePublic` parameter.\n\nThe `IncludeShared` and `IncludePublic` parameters don't apply for `SnapshotType` values of `manual` or `automated`. The `IncludePublic` parameter doesn't apply when `SnapshotType` is set to `shared`. The `IncludeShared` parameter doesn't apply when `SnapshotType` is set to `public`."
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
