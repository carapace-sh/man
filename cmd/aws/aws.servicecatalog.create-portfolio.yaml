name: create-portfolio
description: Creates a portfolio.
flags:
    --accept-language=: The language code.
    --description=: The description of the portfolio.
    --display-name=!: The name to use for display purposes.
    --idempotency-token=!: A unique identifier that you provide to ensure idempotency.
    --provider-name=!: The name of the portfolio provider.
    --tags=: One or more tags.
documentation:
    command: |-
        Creates a portfolio.

        A delegated admin is authorized to invoke this command.
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        description: The description of the portfolio.
        display-name: The name to use for display purposes.
        idempotency-token: A unique identifier that you provide to ensure idempotency. If multiple requests differ only by the idempotency token, the same response is returned for each repeated request.
        provider-name: The name of the portfolio provider.
        tags: One or more tags.
