name: update-saml-provider
description: Updates the metadata document, SAML encryption settings, and private keys for an existing SAML provider.
flags:
    --add-private-key=: Specifies the new private key from your external identity provider.
    --assertion-encryption-mode=: Specifies the encryption setting for the SAML provider.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --remove-private-key=: The Key ID of the private key to remove.
    --saml-metadata-document=: An XML document generated by an identity provider (IdP) that supports SAML 2.0.
    --saml-provider-arn=!: The Amazon Resource Name (ARN) of the SAML provider to update.
completion:
    flag:
        assertion-encryption-mode:
            - Required
            - Allowed
documentation:
    command: Updates the metadata document, SAML encryption settings, and private keys for an existing SAML provider. To rotate private keys, add your new private key and then remove the old key in a separate request.
    flag:
        add-private-key: Specifies the new private key from your external identity provider. The private key must be a .pem file that uses AES-GCM or AES-CBC encryption algorithm to decrypt SAML assertions.
        assertion-encryption-mode: Specifies the encryption setting for the SAML provider.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        remove-private-key: The Key ID of the private key to remove.
        saml-metadata-document: An XML document generated by an identity provider (IdP) that supports SAML 2.0. The document includes the issuer's name, expiration information, and keys that can be used to validate the SAML authentication response (assertions) that are received from the IdP. You must generate the metadata document using the identity management software that is used as your IdP.
        saml-provider-arn: |-
            The Amazon Resource Name (ARN) of the SAML provider to update.

            For more information about ARNs, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference*.
