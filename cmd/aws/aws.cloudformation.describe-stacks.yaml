name: describe-stacks
description: Returns the description for the specified stack; if no stack name was specified, then it returns the description for all the stacks created.
flags:
    --next-token=: The token for the next set of items to return.
    --stack-name=: If you don't pass a parameter to `StackName`, the API returns a response that describes all resources in the account, which can impact performance.
documentation:
    command: |-
        Returns the description for the specified stack; if no stack name was specified, then it returns the description for all the stacks created. For more information about a stack's event history, see [Understand CloudFormation stack creation events](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stack-resource-configuration-complete.html) in the *CloudFormation User Guide*.

        If the stack doesn't exist, a `ValidationError` is returned.
    flag:
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
        stack-name: |-
            If you don't pass a parameter to `StackName`, the API returns a response that describes all resources in the account, which can impact performance. This requires `ListStacks` and `DescribeStacks` permissions.

            Consider using the [ListStacks]() API if you're not passing a parameter to `StackName`.

            The IAM policy below can be added to IAM policies when you want to limit resource-level permissions and avoid returning a response when no parameter is sent in the request:

            { "Version": "2012-10-17", "Statement": \[{ "Effect": "Deny", "Action": "cloudformation:DescribeStacks", "NotResource": "arn:aws:cloudformation:\*:\*:stack/\*/\*" }] }

            The name or the unique stack ID that's associated with the stack, which aren't always interchangeable:

            - Running stacks: You can specify either the stack's name or its unique stack ID.
            - Deleted stacks: You must specify the unique stack ID.
