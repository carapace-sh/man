name: read
description: Reads log entries for the current App Engine app.
flags:
    --level=: Filter entries with severity equal to or higher than a given level.
    --limit=: Number of log entries to show.
    --logs=: Filter entries from a particular set of logs.
    --service=: Limit to specific service.
completion:
    flag:
        level:
            - critical
            - error
            - warning
            - info
            - debug
            - any
documentation:
    command: |
        Display the latest log entries from stdout, stderr and crash log for the
        current Google App Engine app in a human readable format. This command
        requires that the caller have the logging.logEntries.list
        permission.
    flag:
        level: 'Filter entries with severity equal to or higher than a given level. _LEVEL_ must be one of: *critical*, *error*, *warning*, *info*, *debug*, *any*.'
        limit: Number of log entries to show.
        logs: Filter entries from a particular set of logs. Must be a comma-separated list of log names (request_log, stdout, stderr, etc).
        service: Limit to specific service.
