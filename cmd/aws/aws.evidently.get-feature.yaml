name: get-feature
description: Returns the details about one feature.
flags:
    --feature=!: The name of the feature that you want to retrieve information for.
    --project=!: The name or ARN of the project that contains the feature.
documentation:
    command: Returns the details about one feature. You must already know the feature name. To retrieve a list of features in your account, use [ListFeatures](https://docs.aws.amazon.com/cloudwatchevidently/latest/APIReference/API_ListFeatures.html).
    flag:
        feature: The name of the feature that you want to retrieve information for.
        project: The name or ARN of the project that contains the feature.
