name: list-schemas
description: Returns a list of schemas with minimal details.
flags:
    --max-results=: Maximum number of results required per page.
    --next-token=: A continuation token, if this is a continuation call.
    --registry-id=: A wrapper structure that may contain the registry name and Amazon Resource Name (ARN).
documentation:
    command: |-
        Returns a list of schemas with minimal details. Schemas in Deleting status will not be included in the results. Empty results will be returned if there are no schemas available.

        When the `RegistryId` is not provided, all the schemas across registries will be part of the API response.
    flag:
        max-results: Maximum number of results required per page. If the value is not supplied, this will be defaulted to 25 per page.
        next-token: A continuation token, if this is a continuation call.
        registry-id: A wrapper structure that may contain the registry name and Amazon Resource Name (ARN).
