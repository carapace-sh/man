name: gen-config
description: '*(BETA)*  *(DEPRECATED)*  Generate missing configuration files for a source directory.'
flags:
    --config=: The yaml file defining the service configuration.
    --custom: If true, generate config files for a custom runtime.
    --no-custom&: If true, generate config files for a custom runtime.
    --runtime=: Generate config files for a given runtime.
documentation:
    command: |4
        *(BETA)*  *(DEPRECATED)*  This command is deprecated and will soon be removed.

        As an alternative, create an app.yaml file yourself using the directions at https://cloud.google.com/appengine/docs/flexible/reference/app-yaml (App Engine flexible environment) or https://cloud.google.com/appengine/docs/standard/reference/app-yaml (App Engine standard environment) under the tab for your language.

        To create a custom runtime, please follow the instructions at
        https://cloud.google.com/appengine/docs/flexible/custom-runtimes/


        This command generates all relevant config files (app.yaml, Dockerfile and a
        build Dockerfile) for your application in the current directory or emits an
        error message if the source directory contents are not recognized.
    flag:
        config: The yaml file defining the service configuration.  This is normally one of the generated files, but when generating a custom runtime there can be an app.yaml containing parameters.
        custom: If true, generate config files for a custom runtime.  This will produce a Dockerfile, a .dockerignore file and an app.yaml (possibly other files as well, depending on the runtime).
        no-custom: If true, generate config files for a custom runtime.  This will produce a Dockerfile, a .dockerignore file and an app.yaml (possibly other files as well, depending on the runtime).
        runtime: 'Generate config files for a given runtime. Can be used in conjunction with --custom. Allowed runtimes are: contrib-dart, dart, go, php, php55, php72, python, python27, python-compat, java, java7, java8, nodejs, ruby, go111, go112.'
