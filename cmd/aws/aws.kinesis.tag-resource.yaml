name: tag-resource
description: Adds or updates tags for the specified Kinesis resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the Kinesis resource to which to add tags.
    --tags=!: An array of tags to be added to the Kinesis resource.
documentation:
    command: Adds or updates tags for the specified Kinesis resource. Each tag is a label consisting of a user-defined key and value. Tags can help you manage, identify, organize, search for, and filter resources. You can assign up to 50 tags to a Kinesis resource.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the Kinesis resource to which to add tags.
        tags: |-
            An array of tags to be added to the Kinesis resource. A tag consists of a required key and an optional value. You can add up to 50 tags per resource.

            Tags may only contain Unicode letters, digits, white space, or these symbols: _ . : / = + - @.
