name: create-tape-pool
description: Creates a new custom tape pool.
flags:
    --pool-name=!: The name of the new custom tape pool.
    --retention-lock-time-in-days=: Tape retention lock time is set in days.
    --retention-lock-type=: Tape retention lock can be configured in two modes.
    --storage-class=!: The storage class that is associated with the new custom pool.
    --tags=: A list of up to 50 tags that can be assigned to tape pool.
completion:
    flag:
        retention-lock-type:
            - COMPLIANCE
            - GOVERNANCE
            - NONE
        storage-class:
            - DEEP_ARCHIVE
            - GLACIER
documentation:
    command: Creates a new custom tape pool. You can use custom tape pool to enable tape retention lock on tapes that are archived in the custom pool.
    flag:
        pool-name: The name of the new custom tape pool.
        retention-lock-time-in-days: Tape retention lock time is set in days. Tape retention lock can be enabled for up to 100 years (36,500 days).
        retention-lock-type: Tape retention lock can be configured in two modes. When configured in governance mode, Amazon Web Services accounts with specific IAM permissions are authorized to remove the tape retention lock from archived virtual tapes. When configured in compliance mode, the tape retention lock cannot be removed by any user, including the root Amazon Web Services account.
        storage-class: The storage class that is associated with the new custom pool. When you use your backup application to eject the tape, the tape is archived directly into the storage class (S3 Glacier or S3 Glacier Deep Archive) that corresponds to the pool.
        tags: |-
            A list of up to 50 tags that can be assigned to tape pool. Each tag is a key-value pair.

            Valid characters for key and value are letters, spaces, and numbers representable in UTF-8 format, and the following special characters: + - = . _ : / @. The maximum length of a tag's key is 128 characters, and the maximum length for a tag's value is 256.
