name: abandon
description: Abandons a release.
flags:
    --delivery-pipeline=: The delivery pipeline associated with the release.
    --region=: The Cloud region for the release.
documentation:
    command: |-
        After a release is abandoned, no new rollouts can be created from it.

        Rollouts of abandoned releases can't be rolled back to.

        Existing rollouts of abandoned releases will be unaffected.
    flag:
        delivery-pipeline: |-
            The delivery pipeline associated with the release.  Alternatively, set the property [deploy/delivery-pipeline].
            +
            To set the `delivery-pipeline` attribute:
            * provide the argument `release` on the command line with a fully specified name;
            * provide the argument `--delivery-pipeline` on the command line;
            * set the property `deploy/delivery_pipeline`.
        region: |-
            The Cloud region for the release.  Alternatively, set the property [deploy/region].
            +
            To set the `region` attribute:
            * provide the argument `release` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `deploy/region`.
