name: update
description: '*(BETA)*  Update a product set.'
flags:
    --display-name=: The user provided name for this product set.
    --location=: The location of product set.
documentation:
    command: '*(BETA)*  Update a product set.'
    flag:
        display-name: |-
            The user provided name for this product set. It must not be empty and must be at most 4096
            characters long.
        location: |-
            The location of product set.
            +
            To set the `location` attribute:
            * provide the argument `product_set` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
