name: create
description: '*(DEPRECATED)*  Create an Azure client.'
flags:
    --application-id=!: Azure Active Directory (AAD) Application/Client ID (GUID).
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Google Cloud location for the client.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-validate-only&: Validate the creation of the client, but don't actually perform it.
    --tenant-id=!: Azure Active Directory (AAD) tenant ID (GUID) to associate with the client.
    --validate-only: Validate the creation of the client, but don't actually perform it.
documentation:
    command: |+
        *(DEPRECATED)*  Create an Azure client.

        This command is deprecated. See https://cloud.google.com/kubernetes-engine/multi-cloud/docs/azure/deprecations/deprecation-announcement for more details.

    flag:
        application-id: Azure Active Directory (AAD) Application/Client ID (GUID).
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            Google Cloud location for the client.
            +
            To set the `location` attribute:
            * provide the argument `client` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_azure/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-validate-only: Validate the creation of the client, but don't actually perform it.
        tenant-id: Azure Active Directory (AAD) tenant ID (GUID) to associate with the client.
        validate-only: Validate the creation of the client, but don't actually perform it.
