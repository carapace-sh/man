name: list-project-memberships
description: Lists all members of the specified project.
flags:
    --domain-identifier=!: The identifier of the Amazon DataZone domain in which you want to list project memberships.
    --max-results=: The maximum number of memberships to return in a single call to `ListProjectMemberships`.
    --next-token=: When the number of memberships is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of memberships, the response includes a pagination token named `NextToken`.
    --project-identifier=!: The identifier of the project whose memberships you want to list.
    --sort-by=: The method by which you want to sort the project memberships.
    --sort-order=: The sort order of the project memberships.
completion:
    flag:
        sort-by:
            - NAME
        sort-order:
            - ASCENDING
            - DESCENDING
documentation:
    command: Lists all members of the specified project.
    flag:
        domain-identifier: The identifier of the Amazon DataZone domain in which you want to list project memberships.
        max-results: The maximum number of memberships to return in a single call to `ListProjectMemberships`. When the number of memberships to be listed is greater than the value of `MaxResults`, the response contains a `NextToken` value that you can use in a subsequent call to `ListProjectMemberships` to list the next set of memberships.
        next-token: When the number of memberships is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of memberships, the response includes a pagination token named `NextToken`. You can specify this `NextToken` value in a subsequent call to `ListProjectMemberships` to list the next set of memberships.
        project-identifier: The identifier of the project whose memberships you want to list.
        sort-by: The method by which you want to sort the project memberships.
        sort-order: The sort order of the project memberships.
