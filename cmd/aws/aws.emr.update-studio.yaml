name: update-studio
description: Updates an Amazon EMR Studio configuration, including attributes such as name, description, and subnets.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --default-s3-location=: The Amazon S3 location to back up Workspaces and notebook files for the Amazon EMR Studio.
    --description=: A detailed description to assign to the Amazon EMR Studio.
    --encryption-key-arn=: The KMS key identifier (ARN) used to encrypt Amazon EMR Studio workspace and notebook files when backed up to Amazon S3.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=: A descriptive name for the Amazon EMR Studio.
    --studio-id=!: The ID of the Amazon EMR Studio to update.
    --subnet-ids=:
        description: A list of subnet IDs to associate with the Amazon EMR Studio.
        nargs: -1
documentation:
    command: Updates an Amazon EMR Studio configuration, including attributes such as name, description, and subnets.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        default-s3-location: The Amazon S3 location to back up Workspaces and notebook files for the Amazon EMR Studio.
        description: A detailed description to assign to the Amazon EMR Studio.
        encryption-key-arn: The KMS key identifier (ARN) used to encrypt Amazon EMR Studio workspace and notebook files when backed up to Amazon S3.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: A descriptive name for the Amazon EMR Studio.
        studio-id: The ID of the Amazon EMR Studio to update.
        subnet-ids: A list of subnet IDs to associate with the Amazon EMR Studio. The list can include new subnet IDs, but must also include all of the subnet IDs previously associated with the Studio. The list order does not matter. A Studio can have a maximum of 5 subnets. The subnets must belong to the same VPC as the Studio.
