name: batch-delete-evaluation-job
description: Deletes a batch of evaluation jobs.
flags:
    --job-identifiers=!: A list of one or more evaluation job Amazon Resource Names (ARNs) you want to delete.
documentation:
    command: Deletes a batch of evaluation jobs. An evaluation job can only be deleted if it has following status `FAILED`, `COMPLETED`, and `STOPPED`. You can request up to 25 model evaluation jobs be deleted in a single request.
    flag:
        job-identifiers: A list of one or more evaluation job Amazon Resource Names (ARNs) you want to delete.
