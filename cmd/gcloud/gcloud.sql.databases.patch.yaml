name: patch
description: Patches the settings of a Cloud SQL database.
flags:
    --charset=: Cloud SQL database charset setting, which specifies the set of symbols and encodings used to store the data in your database.
    --collation=: Cloud SQL database collation setting, which specifies the set of rules for comparing characters in a character set.
    --diff: Show what changed as a result of the patch.
    --instance=!: Cloud SQL instance ID.
    --no-diff&: Show what changed as a result of the patch.
documentation:
    command: Patches the settings of a Cloud SQL database.
    flag:
        charset: Cloud SQL database charset setting, which specifies the set of symbols and encodings used to store the data in your database. Each database version may support a different set of charsets.
        collation: Cloud SQL database collation setting, which specifies the set of rules for comparing characters in a character set. Each database version may support a different set of collations. This flag can't be used with PostgreSQL instances.
        diff: Show what changed as a result of the patch.
        instance: Cloud SQL instance ID.
        no-diff: Show what changed as a result of the patch.
