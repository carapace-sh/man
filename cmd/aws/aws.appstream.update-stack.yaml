name: update-stack
description: Updates the specified fields for the specified stack.
flags:
    --access-endpoints=:
        description: The list of interface VPC endpoint (interface endpoint) objects.
        nargs: -1
    --application-settings=: The persistent application settings for users of a stack.
    --attributes-to-delete=:
        description: The stack attributes to delete.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --delete-storage-connectors: Deletes the storage connectors currently enabled for the stack.
    --description=: The description to display.
    --display-name=: The stack name to display.
    --embed-host-domains=:
        description: The domains where WorkSpaces Applications streaming sessions can be embedded in an iframe.
        nargs: -1
    --feedback-url=: The URL that users are redirected to after they choose the Send Feedback link.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the stack.
    --no-delete-storage-connectors: Deletes the storage connectors currently enabled for the stack.
    --redirect-url=: The URL that users are redirected to after their streaming session ends.
    --storage-connectors=:
        description: The storage connectors to enable.
        nargs: -1
    --streaming-experience-settings=: The streaming protocol you want your stack to prefer.
    --user-settings=:
        description: The actions that are enabled or disabled for users during their streaming sessions.
        nargs: -1
documentation:
    command: Updates the specified fields for the specified stack.
    flag:
        access-endpoints: The list of interface VPC endpoint (interface endpoint) objects. Users of the stack can connect to WorkSpaces Applications only through the specified endpoints.
        application-settings: The persistent application settings for users of a stack. When these settings are enabled, changes that users make to applications and Windows settings are automatically saved after each session and applied to the next session.
        attributes-to-delete: The stack attributes to delete.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        delete-storage-connectors: Deletes the storage connectors currently enabled for the stack.
        description: The description to display.
        display-name: The stack name to display.
        embed-host-domains: The domains where WorkSpaces Applications streaming sessions can be embedded in an iframe. You must approve the domains that you want to host embedded WorkSpaces Applications streaming sessions.
        feedback-url: The URL that users are redirected to after they choose the Send Feedback link. If no URL is specified, no Send Feedback link is displayed.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the stack.
        redirect-url: The URL that users are redirected to after their streaming session ends.
        storage-connectors: The storage connectors to enable.
        streaming-experience-settings: The streaming protocol you want your stack to prefer. This can be UDP or TCP. Currently, UDP is only supported in the Windows native client.
        user-settings: The actions that are enabled or disabled for users during their streaming sessions. By default, these actions are enabled.
