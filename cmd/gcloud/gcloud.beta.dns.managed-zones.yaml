name: managed-zones
description: '*(BETA)*  Manage your Cloud DNS managed-zones.'
documentation:
    command: |-
        *(BETA)*  Manage your Cloud DNS managed-zones. See
        [Managing Zones](https://cloud.google.com/dns/zones/) for details.

        ## EXAMPLES

        To create a managed-zone, run:

          $ gcloud beta dns managed-zones create my-zone --description="My Zone" --dns-name="my.zone.com."

        To delete a managed-zone, run:

          $ gcloud beta dns managed-zones delete my-zone

        To view the details of a managed-zone, run:

          $ gcloud beta dns managed-zones describe my-zone

        To see the list of all managed-zones, run:

          $ gcloud beta dns managed-zones list
