name: list-imports
description: Lists all stacks that are importing an exported output value.
flags:
    --export-name=!: The name of the exported output value.
    --next-token=: The token for the next set of items to return.
documentation:
    command: |-
        Lists all stacks that are importing an exported output value. To modify or remove an exported output value, first use this action to see which stacks are using it. To see the exported output values in your account, see [ListExports]().

        For more information about importing an exported output value, see the [Fn::ImportValue](https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/intrinsic-function-reference-importvalue.html) function.
    flag:
        export-name: The name of the exported output value. CloudFormation returns the stack names that are importing this value.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
