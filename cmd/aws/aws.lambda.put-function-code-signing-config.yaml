name: put-function-code-signing-config
description: Update the code signing configuration for the function.
flags:
    --code-signing-config-arn=!: The The Amazon Resource Name (ARN) of the code signing configuration.
    --function-name=!: The name or ARN of the Lambda function.
documentation:
    command: Update the code signing configuration for the function. Changes to the code signing configuration take effect the next time a user tries to deploy a code package to the function.
    flag:
        code-signing-config-arn: The The Amazon Resource Name (ARN) of the code signing configuration.
        function-name: |-
            The name or ARN of the Lambda function.

            **Name formats**

            - **Function name** - `MyFunction`.
            - **Function ARN** - `arn:aws:lambda:us-west-2:123456789012:function:MyFunction`.
            - **Partial ARN** - `123456789012:function:MyFunction`.

            The length constraint applies only to the full ARN. If you specify only the function name, it is limited to 64 characters in length.
