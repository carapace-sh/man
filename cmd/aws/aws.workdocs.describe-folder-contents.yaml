name: describe-folder-contents
description: Describes the contents of the specified folder, including its documents and subfolders.
flags:
    --authentication-token=: Amazon WorkDocs authentication token.
    --folder-id=!: The ID of the folder.
    --include=: The contents to include.
    --limit=: The maximum number of items to return with this call.
    --marker=: The marker for the next set of results.
    --order=: The order for the contents of the folder.
    --sort=: The sorting criteria.
    --type=: The type of items.
completion:
    flag:
        order:
            - ASCENDING
            - DESCENDING
        sort:
            - DATE
            - NAME
        type:
            - ALL
            - DOCUMENT
            - FOLDER
documentation:
    command: |-
        Describes the contents of the specified folder, including its documents and subfolders.

        By default, Amazon WorkDocs returns the first 100 active document and folder metadata items. If there are more results, the response includes a marker that you can use to request the next set of results. You can also request initialized documents.
    flag:
        authentication-token: Amazon WorkDocs authentication token. Not required when using Amazon Web Services administrator credentials to access the API.
        folder-id: The ID of the folder.
        include: The contents to include. Specify "INITIALIZED" to include initialized documents.
        limit: The maximum number of items to return with this call.
        marker: The marker for the next set of results. This marker was received from a previous call.
        order: The order for the contents of the folder.
        sort: The sorting criteria.
        type: The type of items.
