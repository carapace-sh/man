name: update-job
description: Updates a job.
flags:
    --client-token=: The unique token which the server uses to recognize retries of the same request.
    --farm-id=!: The farm ID of the job to update.
    --job-id=!: The job ID to update.
    --lifecycle-status=: The status of a job in its lifecycle.
    --max-failed-tasks-count=: The number of task failures before the job stops running and is marked as `FAILED`.
    --max-retries-per-task=: The maximum number of retries for a job.
    --max-worker-count=: The maximum number of worker hosts that can concurrently process a job.
    --priority=: The job priority to update.
    --queue-id=!: The queue ID of the job to update.
    --target-task-run-status=: The task status to update the job's tasks to.
completion:
    flag:
        lifecycle-status:
            - ARCHIVED
        target-task-run-status:
            - READY
            - FAILED
            - SUCCEEDED
            - CANCELED
            - SUSPENDED
            - PENDING
documentation:
    command: |-
        Updates a job.

        When you change the status of the job to `ARCHIVED`, the job can't be scheduled or archived.

        An archived jobs and its steps and tasks are deleted after 120 days. The job can't be recovered.
    flag:
        client-token: The unique token which the server uses to recognize retries of the same request.
        farm-id: The farm ID of the job to update.
        job-id: The job ID to update.
        lifecycle-status: |-
            The status of a job in its lifecycle. When you change the status of the job to `ARCHIVED`, the job can't be scheduled or archived.

            An archived jobs and its steps and tasks are deleted after 120 days. The job can't be recovered.
        max-failed-tasks-count: The number of task failures before the job stops running and is marked as `FAILED`.
        max-retries-per-task: The maximum number of retries for a job.
        max-worker-count: |-
            The maximum number of worker hosts that can concurrently process a job. When the `maxWorkerCount` is reached, no more workers will be assigned to process the job, even if the fleets assigned to the job's queue has available workers.

            You can't set the `maxWorkerCount` to 0. If you set it to -1, there is no maximum number of workers.

            If you don't specify the `maxWorkerCount`, the default is -1.

            The maximum number of workers that can process tasks in the job.
        priority: The job priority to update.
        queue-id: The queue ID of the job to update.
        target-task-run-status: The task status to update the job's tasks to.
