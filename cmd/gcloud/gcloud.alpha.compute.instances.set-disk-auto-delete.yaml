name: set-disk-auto-delete
description: '*(ALPHA)*  Set auto-delete behavior for disks.'
flags:
    --auto-delete: Enables auto-delete for the given disk.
    --device-name=: Specifies a disk to set auto-delete for by its device name,
    --disk=: Specifies a disk to set auto-delete for by its resource name.
    --no-auto-delete&: Enables auto-delete for the given disk.
    --zone=: Zone of the instance to operate on.
documentation:
    command: |-
        *(ALPHA)*  *$gcloud alpha compute instances set-disk-auto-delete* is used to configure the auto-delete behavior for disks
        attached to Compute Engine virtual machines. When
        auto-delete is on, the persistent disk is deleted when the
        instance it is attached to is deleted.
    flag:
        auto-delete: Enables auto-delete for the given disk. Enabled by default, use *--no-auto-delete* to disable.
        device-name: |-
            Specifies a disk to set auto-delete for by its device name,
            which is the name that the guest operating system sees. The
            device name is set at the time that the disk is attached to the
            instance, and need not be the same as the persistent disk name.
            If the disk's device name is specified, then its persistent disk
            name must not be specified using the ``--disk'' flag.
        disk: |-
            Specifies a disk to set auto-delete for by its resource name. If
            you specify a disk to set auto-delete for by persistent disk name,
            then you must not specify its device name using the
            ``--device-name'' flag.
        no-auto-delete: Enables auto-delete for the given disk.
        zone: |-
            Zone of the instance to operate on. If not specified, you might be prompted to select a zone (interactive mode
            only). `gcloud` attempts to identify the appropriate zone by searching for
            resources in your currently active project. If the zone cannot be determined,
            `gcloud` prompts you for a selection with all available Google Cloud Platform
            zones.
            +
            To avoid prompting when this flag is omitted, the user can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
