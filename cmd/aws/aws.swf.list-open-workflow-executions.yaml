name: list-open-workflow-executions
description: Returns a list of open workflow executions in the specified domain that meet the filtering criteria.
flags:
    --domain=!: The name of the domain that contains the workflow executions to list.
    --execution-filter=: If specified, only workflow executions matching the workflow ID specified in the filter are returned.
    --maximum-page-size=: The maximum number of results that are returned per call.
    --next-page-token=: If `NextPageToken` is returned there are more results available.
    --reverse-order=: When set to `true`, returns the results in reverse order.
    --start-time-filter=!: Workflow executions are included in the returned results based on whether their start times are within the range specified by this filter.
    --tag-filter=: If specified, only executions that have the matching tag are listed.
    --type-filter=: If specified, only executions of the type specified in the filter are returned.
documentation:
    command: "Returns a list of open workflow executions in the specified domain that meet the filtering criteria. The results may be split into multiple pages. To retrieve subsequent pages, make the call again using the nextPageToken returned by the initial call.\n\nThis operation is eventually consistent. The results are best effort and may not exactly reflect recent updates and changes.\n\n**Access Control**\n\nYou can use IAM policies to control this action's access to Amazon SWF resources as follows:\n\n- Use a `Resource` element with the domain name to limit the action to only specified domains.\n- Use an `Action` element to allow or deny permission to call this action.\n- Constrain the following parameters by using a `Condition` element with the appropriate keys.\n  \n  - `tagFilter.tag`: String constraint. The key is `swf:tagFilter.tag`.\n  - `typeFilter.name`: String constraint. The key is `swf:typeFilter.name`.\n  - `typeFilter.version`: String constraint. The key is `swf:typeFilter.version`.\n\nIf the caller doesn't have sufficient permissions to invoke the action, or the parameter values fall outside the specified constraints, the action fails. The associated event attribute's `cause` parameter is set to `OPERATION_NOT_PERMITTED`. For details and example IAM policies, see [Using IAM to Manage Access to Amazon SWF Workflows](https://docs.aws.amazon.com/amazonswf/latest/developerguide/swf-dev-iam.html) in the *Amazon SWF Developer Guide*."
    flag:
        domain: The name of the domain that contains the workflow executions to list.
        execution-filter: |-
            If specified, only workflow executions matching the workflow ID specified in the filter are returned.

            `executionFilter`, `typeFilter` and `tagFilter` are mutually exclusive. You can specify at most one of these in a request.
        maximum-page-size: The maximum number of results that are returned per call. Use `nextPageToken` to obtain further pages of results.
        next-page-token: |-
            If `NextPageToken` is returned there are more results available. The value of `NextPageToken` is a unique pagination token for each page. Make the call again using the returned token to retrieve the next page. Keep all other arguments unchanged. Each pagination token expires after 24 hours. Using an expired pagination token will return a `400` error: "`Specified token has exceeded its maximum lifetime`".

            The configured `maximumPageSize` determines how many results can be returned in a single call.
        reverse-order: When set to `true`, returns the results in reverse order. By default the results are returned in descending order of the start time of the executions.
        start-time-filter: Workflow executions are included in the returned results based on whether their start times are within the range specified by this filter.
        tag-filter: |-
            If specified, only executions that have the matching tag are listed.

            `executionFilter`, `typeFilter` and `tagFilter` are mutually exclusive. You can specify at most one of these in a request.
        type-filter: |-
            If specified, only executions of the type specified in the filter are returned.

            `executionFilter`, `typeFilter` and `tagFilter` are mutually exclusive. You can specify at most one of these in a request.
