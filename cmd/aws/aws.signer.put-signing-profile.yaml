name: put-signing-profile
description: Creates a signing profile.
flags:
    --overrides=: A subfield of `platform`.
    --platform-id=!: The ID of the signing platform to be created.
    --profile-name=!: The name of the signing profile to be created.
    --signature-validity-period=: The default validity period override for any signature generated using this signing profile.
    --signing-material=: The AWS Certificate Manager certificate that will be used to sign code with the new signing profile.
    --signing-parameters=: Map of key-value pairs for signing.
    --tags=: Tags to be associated with the signing profile that is being created.
documentation:
    command: Creates a signing profile. A signing profile is a code-signing template that can be used to carry out a pre-defined signing job.
    flag:
        overrides: A subfield of `platform`. This specifies any different configuration options that you want to apply to the chosen platform (such as a different `hash-algorithm` or `signing-algorithm`).
        platform-id: The ID of the signing platform to be created.
        profile-name: The name of the signing profile to be created.
        signature-validity-period: The default validity period override for any signature generated using this signing profile. If unspecified, the default is 135 months.
        signing-material: The AWS Certificate Manager certificate that will be used to sign code with the new signing profile.
        signing-parameters: Map of key-value pairs for signing. These can include any information that you want to use during signing.
        tags: Tags to be associated with the signing profile that is being created.
