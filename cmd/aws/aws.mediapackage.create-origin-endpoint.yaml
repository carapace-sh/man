name: create-origin-endpoint
description: Creates a new OriginEndpoint record.
flags:
    --authorization=: ""
    --channel-id=!: The ID of the Channel that the OriginEndpoint will be associated with.
    --cmaf-package=: ""
    --dash-package=: ""
    --description=: A short text description of the OriginEndpoint.
    --hls-package=: ""
    --id=!: The ID of the OriginEndpoint.
    --manifest-name=: A short string that will be used as the filename of the OriginEndpoint URL (defaults to "index").
    --mss-package=: ""
    --origination=: Control whether origination of video is allowed for this OriginEndpoint.
    --startover-window-seconds=: Maximum duration (seconds) of content to retain for startover playback.
    --tags=: ""
    --time-delay-seconds=: Amount of delay (seconds) to enforce on the playback of live content.
    --whitelist=: A list of source IP CIDR blocks that will be allowed to access the OriginEndpoint.
completion:
    flag:
        origination:
            - ALLOW
            - DENY
documentation:
    command: Creates a new OriginEndpoint record.
    flag:
        authorization: ""
        channel-id: The ID of the Channel that the OriginEndpoint will be associated with. This cannot be changed after the OriginEndpoint is created.
        cmaf-package: ""
        dash-package: ""
        description: A short text description of the OriginEndpoint.
        hls-package: ""
        id: The ID of the OriginEndpoint. The ID must be unique within the region and it cannot be changed after the OriginEndpoint is created.
        manifest-name: A short string that will be used as the filename of the OriginEndpoint URL (defaults to "index").
        mss-package: ""
        origination: Control whether origination of video is allowed for this OriginEndpoint. If set to ALLOW, the OriginEndpoint may by requested, pursuant to any other form of access control. If set to DENY, the OriginEndpoint may not be requested. This can be helpful for Live to VOD harvesting, or for temporarily disabling origination
        startover-window-seconds: Maximum duration (seconds) of content to retain for startover playback. If not specified, startover playback will be disabled for the OriginEndpoint.
        tags: ""
        time-delay-seconds: Amount of delay (seconds) to enforce on the playback of live content. If not specified, there will be no time delay in effect for the OriginEndpoint.
        whitelist: A list of source IP CIDR blocks that will be allowed to access the OriginEndpoint.
