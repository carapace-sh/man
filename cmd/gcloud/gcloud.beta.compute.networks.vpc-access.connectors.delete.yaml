name: delete
description: '*(BETA)*  Delete a VPC Access connector.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: Compute region (e.g. us-central1) for the connector.
documentation:
    command: |
        *(BETA)*  Delete a new VPC Access connector with the given name.

        This command can fail for the following reasons:
          * An instance with the same name already exists.
          * The active account does not have permission to delete instances.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            Compute region (e.g. us-central1) for the connector.
            +

            To set the `region` attribute:
            * provide the argument `connector` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
