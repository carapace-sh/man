name: search-available-phone-numbers
description: Searches the provisioned phone numbers in an organization.
flags:
    --area-code=: Confines a search to just the phone numbers associated with the specified area code.
    --city=: Confines a search to just the phone numbers associated with the specified city.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --country=: Confines a search to just the phone numbers associated with the specified country.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of results to return.
    --next-token=: The token used to return the next page of results.
    --phone-number-type=: Confines a search to just the phone numbers associated with the specified phone number type, either **local** or **toll-free**.
    --state=: Confines a search to just the phone numbers associated with the specified state.
    --toll-free-prefix=: Confines a search to just the phone numbers associated with the specified toll-free prefix.
completion:
    flag:
        phone-number-type:
            - Local
            - TollFree
documentation:
    command: Searches the provisioned phone numbers in an organization.
    flag:
        area-code: Confines a search to just the phone numbers associated with the specified area code.
        city: Confines a search to just the phone numbers associated with the specified city.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        country: Confines a search to just the phone numbers associated with the specified country.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The maximum number of results to return.
        next-token: The token used to return the next page of results.
        phone-number-type: Confines a search to just the phone numbers associated with the specified phone number type, either **local** or **toll-free**.
        state: Confines a search to just the phone numbers associated with the specified state.
        toll-free-prefix: Confines a search to just the phone numbers associated with the specified toll-free prefix.
