name: delete-template-alias
description: Deletes the item that the specified template alias points to.
flags:
    --alias-name=!: The name for the template alias.
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the item to delete.
    --template-id=!: The ID for the template that the specified alias is for.
documentation:
    command: Deletes the item that the specified template alias points to. If you provide a specific alias, you delete the version of the template that the alias points to.
    flag:
        alias-name: The name for the template alias. To delete a specific alias, you delete the version that the alias points to. You can specify the alias name, or specify the latest version of the template by providing the keyword `$LATEST` in the `AliasName` parameter.
        aws-account-id: The ID of the Amazon Web Services account that contains the item to delete.
        template-id: The ID for the template that the specified alias is for.
