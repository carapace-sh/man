name: create
description: '*(ALPHA)*  Creates service account key.'
flags:
    --ca-cert-path=: Path to the CA certificate file.
    --location=: The location name.
    --service-account=!: ID of the Service Account or fully qualified identifier for the Service Account.
documentation:
    command: '*(ALPHA)*  Creates service account key.'
    flag:
        ca-cert-path: Path to the CA certificate file.
        location: |-
            The location name.
            +
            To set the `location` attribute:
            * provide the argument `--service-account` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        service-account: |-
            ID of the Service Account or fully qualified identifier for the Service Account.
            +
            To set the `service-account` attribute:
            * provide the argument `--service-account` on the command line.
