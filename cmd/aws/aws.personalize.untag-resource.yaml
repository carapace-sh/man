name: untag-resource
description: Removes the specified tags that are attached to a resource.
flags:
    --resource-arn=!: The resource's Amazon Resource Name (ARN).
    --tag-keys=!: The keys of the tags to be removed.
documentation:
    command: Removes the specified tags that are attached to a resource. For more information, see [Removing tags from Amazon Personalize resources](https://docs.aws.amazon.com/personalize/latest/dg/tags-remove.html).
    flag:
        resource-arn: The resource's Amazon Resource Name (ARN).
        tag-keys: The keys of the tags to be removed.
