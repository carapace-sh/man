name: get-public-key
description: '*(BETA)*  Get the public key for a service account key pair.'
flags:
    --iam-account=!: A textual name to display for the account.
    --output-file=!: The output file to write the public key.
    --type=: The type of the public key to get.
completion:
    flag:
        type:
            - pem
            - raw
documentation:
    command: '*(BETA)*  Get the public key for a service account key pair in pem or raw format.'
    flag:
        iam-account: A textual name to display for the account.
        output-file: The output file to write the public key.
        type: 'The type of the public key to get. _TYPE_ must be one of: *pem*, *raw*.'
