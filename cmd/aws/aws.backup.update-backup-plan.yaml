name: update-backup-plan
description: Updates the specified backup plan.
flags:
    --backup-plan-id=!: The ID of the backup plan.
    --backup-plan=!: The body of a backup plan.
documentation:
    command: Updates the specified backup plan. The new version is uniquely identified by its ID.
    flag:
        backup-plan: The body of a backup plan. Includes a `BackupPlanName` and one or more sets of `Rules`.
        backup-plan-id: The ID of the backup plan.
