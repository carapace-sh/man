name: get-threat-entity-set
description: Retrieves the threat entity set associated with the specified `threatEntitySetId`.
flags:
    --detector-id=!: The unique ID of the detector associated with the threat entity set resource.
    --threat-entity-set-id=!: The unique ID that helps GuardDuty identify the threat entity set.
documentation:
    command: Retrieves the threat entity set associated with the specified `threatEntitySetId`.
    flag:
        detector-id: |-
            The unique ID of the detector associated with the threat entity set resource.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
        threat-entity-set-id: The unique ID that helps GuardDuty identify the threat entity set.
