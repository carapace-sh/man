name: start-data-source-sync-job
description: Starts a data source connector synchronization job.
flags:
    --application-id=!: The identifier of Amazon Q Business application the data source is connected to.
    --data-source-id=!: The identifier of the data source connector.
    --index-id=!: The identifier of the index used with the data source connector.
documentation:
    command: Starts a data source connector synchronization job. If a synchronization job is already in progress, Amazon Q Business returns a `ConflictException`.
    flag:
        application-id: The identifier of Amazon Q Business application the data source is connected to.
        data-source-id: The identifier of the data source connector.
        index-id: The identifier of the index used with the data source connector.
