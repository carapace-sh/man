name: delete
description: '*(BETA)*  Delete a certificate.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The Cloud location for the certificate.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |-
        *(BETA)*  Delete a certificate resource.

        ## EXAMPLES

        To delete the certificate with name simple-cert, run:

          $ gcloud beta certificate-manager certificates delete simple-cert
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The Cloud location for the certificate.
            +
            To set the `location` attribute:
            * provide the argument `certificate` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * default value of location is [global].
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
