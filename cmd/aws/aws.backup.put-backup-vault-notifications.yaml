name: put-backup-vault-notifications
description: Turns on notifications on a backup vault for the specified topic and events.
flags:
    --backup-vault-events=!: An array of events that indicate the status of jobs to back up resources to the backup vault.
    --backup-vault-name=!: The name of a logical container where backups are stored.
    --snstopic-arn=!: The Amazon Resource Name (ARN) that specifies the topic for a backup vault’s events; for example, `arn:aws:sns:us-west-2:111122223333:MyVaultTopic`.
documentation:
    command: Turns on notifications on a backup vault for the specified topic and events.
    flag:
        backup-vault-events: An array of events that indicate the status of jobs to back up resources to the backup vault. For the list of supported events, common use cases, and code samples, see [Notification options with Backup](https://docs.aws.amazon.com/aws-backup/latest/devguide/backup-notifications.html).
        backup-vault-name: The name of a logical container where backups are stored. Backup vaults are identified by names that are unique to the account used to create them and the Amazon Web Services Region where they are created.
        snstopic-arn: The Amazon Resource Name (ARN) that specifies the topic for a backup vault’s events; for example, `arn:aws:sns:us-west-2:111122223333:MyVaultTopic`.
