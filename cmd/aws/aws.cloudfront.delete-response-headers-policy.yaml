name: delete-response-headers-policy
description: Deletes a response headers policy.
flags:
    --id=!: The identifier for the response headers policy that you are deleting.
    --if-match=: The version of the response headers policy that you are deleting.
documentation:
    command: |-
        Deletes a response headers policy.

        You cannot delete a response headers policy if it's attached to a cache behavior. First update your distributions to remove the response headers policy from all cache behaviors, then delete the response headers policy.

        To delete a response headers policy, you must provide the policy's identifier and version. To get these values, you can use `ListResponseHeadersPolicies` or `GetResponseHeadersPolicy`.
    flag:
        id: |-
            The identifier for the response headers policy that you are deleting.

            To get the identifier, you can use `ListResponseHeadersPolicies`.
        if-match: |-
            The version of the response headers policy that you are deleting.

            The version is the response headers policy's `ETag` value, which you can get using `ListResponseHeadersPolicies`, `GetResponseHeadersPolicy`, or `GetResponseHeadersPolicyConfig`.
