name: list-experiences
description: Lists one or more Amazon Kendra experiences.
flags:
    --index-id=!: The identifier of the index for your Amazon Kendra experience.
    --max-results=: The maximum number of returned Amazon Kendra experiences.
    --next-token=: If the previous response was incomplete (because there is more data to retrieve), Amazon Kendra returns a pagination token in the response.
documentation:
    command: Lists one or more Amazon Kendra experiences. You can create an Amazon Kendra experience such as a search application. For more information on creating a search application experience, see [Building a search experience with no code](https://docs.aws.amazon.com/kendra/latest/dg/deploying-search-experience-no-code.html).
    flag:
        index-id: The identifier of the index for your Amazon Kendra experience.
        max-results: The maximum number of returned Amazon Kendra experiences.
        next-token: If the previous response was incomplete (because there is more data to retrieve), Amazon Kendra returns a pagination token in the response. You can use this pagination token to retrieve the next set of Amazon Kendra experiences.
