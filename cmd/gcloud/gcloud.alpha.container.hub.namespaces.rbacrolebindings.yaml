name: rbacrolebindings
description: '*(ALPHA)*  *(REMOVED)*  Fleet namespace RBAC RoleBindings for permissions.'
hidden: true
documentation:
    command: |-
        *(ALPHA)*  *(REMOVED)*  Fleet namespace RBAC RoleBindings for permissions.

        This command has been removed as of version 447.0.0. Use `gcloud fleet scopes rbacrolebindings` instead.

        This command group allows for manipulation of fleet namespace RBAC
        RoleBindings.

        ## EXAMPLES

        Manage RBAC RoleBindings:

          $ gcloud alpha container hub namespaces rbacrolebindings --help
