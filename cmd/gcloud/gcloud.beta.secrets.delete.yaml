name: delete
description: '*(BETA)*  Delete a secret.'
flags:
    --etag=: Current entity tag (ETag) of the secret.
    --location=!: ID of the location or fully qualified identifier for the location.
documentation:
    command: |-
        *(BETA)*  Delete a secret and destroy all secret versions. This action is irreversible.
        If the given secret does not exist, this command will succeed, but the
        operation will be a no-op.

        ## EXAMPLES

        Delete a secret `my-secret`:

          $ gcloud beta secrets delete my-secret

        Delete a secret `my-secret` using etag:

          $ gcloud beta secrets delete my-secret --etag=123
    flag:
        etag: Current entity tag (ETag) of the secret. If specified, the secret is deleted only if the ETag provided matches the current secret's ETag.
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line.
