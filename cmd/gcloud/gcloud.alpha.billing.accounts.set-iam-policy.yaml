name: set-iam-policy
description: '*(ALPHA)*  Set the IAM policy for a Cloud Billing account.'
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha billing accounts set-iam-policy* sets the IAM policy for a Cloud Billing account given an
        account ID and a JSON or YAML file that describes the IAM policy.

        Note: Setting the IAM policy for a Cloud Billing account replaces existing IAM bindings for
        that account.
