name: create-cache-subnet-group
description: Creates a new cache subnet group.
flags:
    --cache-subnet-group-description=!: A description for the cache subnet group.
    --cache-subnet-group-name=!: A name for the cache subnet group.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --subnet-ids=!:
        description: A list of VPC subnet IDs for the cache subnet group.
        nargs: -1
    --tags=:
        description: A list of tags to be added to this resource.
        nargs: -1
documentation:
    command: |-
        Creates a new cache subnet group.

        Use this parameter only when you are creating a cluster in an Amazon Virtual Private Cloud (Amazon VPC).
    flag:
        cache-subnet-group-description: A description for the cache subnet group.
        cache-subnet-group-name: |-
            A name for the cache subnet group. This value is stored as a lowercase string.

            Constraints: Must contain no more than 255 alphanumeric characters or hyphens.

            Example: `mysubnetgroup`
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        subnet-ids: A list of VPC subnet IDs for the cache subnet group.
        tags: A list of tags to be added to this resource. A tag is a key-value pair. A tag key must be accompanied by a tag value, although null is accepted.
