name: create
description: Create a service account for a project.
flags:
    --description=: A textual description for the account.
    --display-name=: A textual name to display for the account.
documentation:
    command: |-
        This command creates a service account with the provided name. For
        subsequent commands regarding service accounts, this service account should
        be referred to by the email account in the response.
    flag:
        description: A textual description for the account.
        display-name: A textual name to display for the account.
