name: update-product
description: Updates the specified product.
flags:
    --accept-language=: The language code.
    --add-tags=: The tags to add to the product.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The updated description of the product.
    --distributor=: The updated distributor of the product.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --id=!: The product identifier.
    --name=: The updated product name.
    --owner=: The updated owner of the product.
    --remove-tags=: The tags to remove from the product.
    --source-connection=: Specifies connection details for the updated product and syncs the product to the connection source artifact.
    --support-description=: The updated support description for the product.
    --support-email=: The updated support email for the product.
    --support-url=: The updated support URL for the product.
documentation:
    command: Updates the specified product.
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        add-tags: The tags to add to the product.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The updated description of the product.
        distributor: The updated distributor of the product.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        id: The product identifier.
        name: The updated product name.
        owner: The updated owner of the product.
        remove-tags: The tags to remove from the product.
        source-connection: |-
            Specifies connection details for the updated product and syncs the product to the connection source artifact. This automatically manages the product's artifacts based on changes to the source. The `SourceConnection` parameter consists of the following sub-fields.

            - `Type`
            - `ConnectionParamters`
        support-description: The updated support description for the product.
        support-email: The updated support email for the product.
        support-url: The updated support URL for the product.
