name: init
description: Initialize a specified Distributed Cloud Edge Network zone.
flags:
    --location=: The Cloud location for the zone.
documentation:
    command: Initialize a specified Distributed Cloud Edge Network zone.
    flag:
        location: |-
            The Cloud location for the zone.
            +
            To set the `location` attribute:
            * provide the argument `zone` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
