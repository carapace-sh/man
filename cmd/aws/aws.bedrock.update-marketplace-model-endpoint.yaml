name: update-marketplace-model-endpoint
description: Updates the configuration of an existing endpoint for a model from Amazon Bedrock Marketplace.
flags:
    --client-request-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --endpoint-arn=!: The Amazon Resource Name (ARN) of the endpoint you want to update.
    --endpoint-config=!: The new configuration for the endpoint, including the number and type of instances to use.
documentation:
    command: Updates the configuration of an existing endpoint for a model from Amazon Bedrock Marketplace.
    flag:
        client-request-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. This token is listed as not required because Amazon Web Services SDKs automatically generate it for you and set this parameter. If you're not using the Amazon Web Services SDK or the CLI, you must provide this token or the action will fail.
        endpoint-arn: The Amazon Resource Name (ARN) of the endpoint you want to update.
        endpoint-config: The new configuration for the endpoint, including the number and type of instances to use.
