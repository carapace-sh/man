name: create
description: '*(ALPHA)*  *(DEPRECATED)*  Create a Data Catalog entry tag.'
flags:
    --entry-group=: Entry group of the entry.
    --entry=!: ID of the entry or fully qualified identifier for the entry.
    --location=: Location of the entry.
    --scope=: Scope within the parent resource that the tag is attached to.
    --tag-file=!: Path to a JSON or YAML file containing the tag.
    --tag-template-location=: Location of the tag template.
    --tag-template-project=: Project of the tag template.
    --tag-template=!: ID of the tag template or fully qualified identifier for the tag template.
documentation:
    command: |4-
        *(ALPHA)*  *(DEPRECATED)*  This command is deprecated. Please use `gcloud dataplex entries` instead. Note that aspects - successors of tags - are part of the entry resource and are managed by `gcloud dataplex entries` command.

        Create a Data Catalog entry tag.
    flag:
        entry: |-
            ID of the entry or fully qualified identifier for the entry.
            +
            To set the `entry` attribute:
            * provide the argument `--entry` on the command line.
        entry-group: |-
            Entry group of the entry.
            +

            To set the `entry-group` attribute:
            * provide the argument `--entry` on the command line with a fully specified name;
            * provide the argument `--entry-group` on the command line.
        location: |-
            Location of the entry.
            +

            To set the `location` attribute:
            * provide the argument `--entry` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        scope: |-
            Scope within the parent resource that the tag is attached to. Scopes
            allow users to attach tags to individual columns based on the parent
            resource's schema. To attach a tag to a nested column, use '.' to
            separate the column names: 'outer_column.inner_column'.
        tag-file: |-
            Path to a JSON or YAML file containing the tag.
            +
            The file should contain a JSON/YAML object with a key and value
            for each field that should be set. See $ gcloud topic datetimes
            for information on how to specify timestamp fields.
            +
            For example:
            +
                {
                  "dbl_field": 123,
                  "str_field": "String",
                  "bool_field": true,
                  "ts_field": "1970-01-01T00:00:00.000Z",
                  "enum_field": "ENUM_A",
                }
        tag-template: |-
            ID of the tag template or fully qualified identifier for the tag template.
            +
            To set the `tag_template` attribute:
            * provide the argument `--tag-template` on the command line.
        tag-template-location: |-
            Location of the tag template.
            +

            To set the `location` attribute:
            * provide the argument `--tag-template` on the command line with a fully specified name;
            * provide the argument `--tag-template-location` on the command line;
            * provide the argument `--location` on the command line.
        tag-template-project: |-
            Project of the tag template.
            +

            To set the `project` attribute:
            * provide the argument `--tag-template` on the command line with a fully specified name;
            * provide the argument `--tag-template-project` on the command line;
            * provide the argument `--project` on the command line;
            * set the property `core/project`.
