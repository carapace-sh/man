name: remove
description: '*(ALPHA)*  Append a record-set deletion to the transaction.'
flags:
    --name=!: DNS name of the record-set to be removed.
    --transaction-file=: Path of the file which contains the transaction.
    --ttl=!: TTL for the record-set to be removed.
    --type=!: Type of the record-set to be removed.
    --zone=!: Name of the managed zone whose record sets you want to manage.
documentation:
    command: |-
        *(ALPHA)*  This command appends a record-set deletion to the transaction.

        ## EXAMPLES

        To remove an A record, run:

          $ gcloud alpha dns record-sets transaction remove --zone=MANAGED_ZONE --name=my.domain. --ttl=1234 \
              --type=A "1.2.3.4"

        To remove a TXT record with multiple data values, run:

          $ gcloud alpha dns record-sets transaction remove --zone=MANAGED_ZONE --name=my.domain. --ttl=2345 \
              --type=TXT "Hello world" "Bye world"
    flag:
        name: DNS name of the record-set to be removed.
        transaction-file: Path of the file which contains the transaction.
        ttl: TTL for the record-set to be removed.
        type: Type of the record-set to be removed.
        zone: Name of the managed zone whose record sets you want to manage.
