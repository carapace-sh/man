name: create
description: '*(ALPHA)*  Create a Dataproc instance on GDCE cluster.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --gdce-cluster-location=: GDCE region for the gdce-cluster.
    --gdce-cluster=!: ID of the gdce-cluster or fully qualified identifier for the gdce-cluster.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: Dataproc region for the instance.
    --timeout=&: Client side timeout on how long to wait for Dataproc operations.
documentation:
    command: '*(ALPHA)*  Create a Dataproc instance on GDCE cluster.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        gdce-cluster: |-
            ID of the gdce-cluster or fully qualified identifier for the gdce-cluster.
            +
            To set the `gdce-cluster` attribute:
            * provide the argument `--gdce-cluster` on the command line.
        gdce-cluster-location: |-
            GDCE region for the gdce-cluster.
            +
            To set the `gdce-cluster-location` attribute:
            * provide the argument `--gdce-cluster` on the command line with a fully specified name;
            * provide the argument `--gdce-cluster-location` on the command line;
            * provide the argument `--region` on the command line;
            * set the property `dataproc/region`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            Dataproc region for the instance. Each Dataproc region constitutes an independent resource namespace constrained to deploying instances into Compute Engine zones inside the region. Overrides the default `dataproc/region` property value for this command invocation.
            +
            To set the `region` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `dataproc/region`.
        timeout: Client side timeout on how long to wait for Dataproc operations. See $ gcloud topic datetimes for information on duration formats.
