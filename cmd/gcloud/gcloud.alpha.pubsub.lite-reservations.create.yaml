name: create
description: '*(ALPHA)*  Create a Pub/Sub Lite reservation.'
flags:
    --location=!: ID of the location or fully qualified identifier for the location.
    --throughput-capacity=!: Reservation throughput capacity.
documentation:
    command: '*(ALPHA)*  Create a Pub/Sub Lite reservation.'
    flag:
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line.
        throughput-capacity: |-
            Reservation throughput capacity. Every unit of throughput capacity is equivalent to 1 MiB/s of
            published messages or 2 MiB/s of subscribed messages.
