name: list-services
description: Lists summary information for all the services that are associated with one or more namespaces.
flags:
    --filters=: A complex type that contains specifications for the namespaces that you want to list services for.
    --max-results=: The maximum number of services that you want Cloud Map to return in the response to a `ListServices` request.
    --next-token=: For the first `ListServices` request, omit this value.
documentation:
    command: Lists summary information for all the services that are associated with one or more namespaces.
    flag:
        filters: |-
            A complex type that contains specifications for the namespaces that you want to list services for.

            If you specify more than one filter, an operation must match all filters to be returned by `ListServices`.
        max-results: The maximum number of services that you want Cloud Map to return in the response to a `ListServices` request. If you don't specify a value for `MaxResults`, Cloud Map returns up to 100 services.
        next-token: |-
            For the first `ListServices` request, omit this value.

            If the response contains `NextToken`, submit another `ListServices` request to get the next group of results. Specify the value of `NextToken` from the previous response in the next request.

            Cloud Map gets `MaxResults` services and then filters them based on the specified criteria. It's possible that no services in the first `MaxResults` services matched the specified criteria but that subsequent groups of `MaxResults` services do contain services that match the criteria.
