name: create-db-cluster
description: Creates a new Amazon Neptune DB cluster.
flags:
    --availability-zones=:
        description: A list of EC2 Availability Zones that instances in the DB cluster can be created in.
        nargs: -1
    --backup-retention-period=: The number of days for which automated backups are retained.
    --character-set-name=: '*(Not supported by Neptune)*'
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --copy-tags-to-snapshot: '*If set to `true`, tags are copied to any snapshot of the DB cluster that is created.*'
    --database-name=: The name for your database of up to 64 alpha-numeric characters.
    --db-cluster-identifier=!: The DB cluster identifier.
    --db-cluster-parameter-group-name=: The name of the DB cluster parameter group to associate with this DB cluster.
    --db-subnet-group-name=: A DB subnet group to associate with this DB cluster.
    --deletion-protection: A value that indicates whether the DB cluster has deletion protection enabled.
    --enable-cloudwatch-logs-exports=:
        description: A list of the log types that this DB cluster should export to CloudWatch Logs.
        nargs: -1
    --enable-iam-database-authentication: If set to `true`, enables Amazon Identity and Access Management (IAM) authentication for the entire DB cluster (this cannot be set at an instance level).
    --engine-version=: The version number of the database engine to use for the new DB cluster.
    --engine=!: The name of the database engine to be used for this DB cluster.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --global-cluster-identifier=: The ID of the Neptune global database to which this new DB cluster should be added.
    --kms-key-id=: The Amazon KMS key identifier for an encrypted DB cluster.
    --master-user-password=: Not supported by Neptune.
    --master-username=: Not supported by Neptune.
    --no-copy-tags-to-snapshot: '*If set to `true`, tags are copied to any snapshot of the DB cluster that is created.*'
    --no-deletion-protection: A value that indicates whether the DB cluster has deletion protection enabled.
    --no-enable-iam-database-authentication: If set to `true`, enables Amazon Identity and Access Management (IAM) authentication for the entire DB cluster (this cannot be set at an instance level).
    --no-storage-encrypted: Specifies whether the DB cluster is encrypted.
    --option-group-name=: '*(Not supported by Neptune)*'
    --port=: The port number on which the instances in the DB cluster accept connections.
    --pre-signed-url=: This parameter is not currently supported.
    --preferred-backup-window=: The daily time range during which automated backups are created if automated backups are enabled using the `BackupRetentionPeriod` parameter.
    --preferred-maintenance-window=: The weekly time range during which system maintenance can occur, in Universal Coordinated Time (UTC).
    --replication-source-identifier=: The Amazon Resource Name (ARN) of the source DB instance or DB cluster if this DB cluster is created as a Read Replica.
    --serverless-v2-scaling-configuration=: Contains the scaling configuration of a Neptune Serverless DB cluster.
    --source-region=: The ID of the region that contains the source for the db cluster
    --storage-encrypted: Specifies whether the DB cluster is encrypted.
    --storage-type=: The storage type for the new DB cluster.
    --tags=:
        description: The tags to assign to the new DB cluster.
        nargs: -1
    --vpc-security-group-ids=:
        description: A list of EC2 VPC security groups to associate with this DB cluster.
        nargs: -1
documentation:
    command: |-
        Creates a new Amazon Neptune DB cluster.

        You can use the `ReplicationSourceIdentifier` parameter to create the DB cluster as a Read Replica of another DB cluster or Amazon Neptune DB instance.

        Note that when you create a new cluster using `CreateDBCluster` directly, deletion protection is disabled by default (when you create a new production cluster in the console, deletion protection is enabled by default). You can only delete a DB cluster if its `DeletionProtection` field is set to `false`.
    flag:
        availability-zones: A list of EC2 Availability Zones that instances in the DB cluster can be created in.
        backup-retention-period: |-
            The number of days for which automated backups are retained. You must specify a minimum value of 1.

            Default: 1

            Constraints:

            - Must be a value from 1 to 35
        character-set-name: '*(Not supported by Neptune)*'
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        copy-tags-to-snapshot: '*If set to `true`, tags are copied to any snapshot of the DB cluster that is created.*'
        database-name: The name for your database of up to 64 alpha-numeric characters. If you do not provide a name, Amazon Neptune will not create a database in the DB cluster you are creating.
        db-cluster-identifier: |-
            The DB cluster identifier. This parameter is stored as a lowercase string.

            Constraints:

            - Must contain from 1 to 63 letters, numbers, or hyphens.
            - First character must be a letter.
            - Cannot end with a hyphen or contain two consecutive hyphens.

            Example: `my-cluster1`
        db-cluster-parameter-group-name: |-
            The name of the DB cluster parameter group to associate with this DB cluster. If this argument is omitted, the default is used.

            Constraints:

            - If supplied, must match the name of an existing DBClusterParameterGroup.
        db-subnet-group-name: |-
            A DB subnet group to associate with this DB cluster.

            Constraints: Must match the name of an existing DBSubnetGroup. Must not be default.

            Example: `mySubnetgroup`
        deletion-protection: A value that indicates whether the DB cluster has deletion protection enabled. The database can't be deleted when deletion protection is enabled. By default, deletion protection is enabled.
        enable-cloudwatch-logs-exports: 'A list of the log types that this DB cluster should export to CloudWatch Logs. Valid log types are: `audit` (to publish audit logs) and `slowquery` (to publish slow-query logs). See [Publishing Neptune logs to Amazon CloudWatch logs](https://docs.aws.amazon.com/neptune/latest/userguide/cloudwatch-logs.html).'
        enable-iam-database-authentication: |-
            If set to `true`, enables Amazon Identity and Access Management (IAM) authentication for the entire DB cluster (this cannot be set at an instance level).

            Default: `false`.
        engine: |-
            The name of the database engine to be used for this DB cluster.

            Valid Values: `neptune`
        engine-version: |-
            The version number of the database engine to use for the new DB cluster.

            Example: `1.2.1.0`
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        global-cluster-identifier: The ID of the Neptune global database to which this new DB cluster should be added.
        kms-key-id: |-
            The Amazon KMS key identifier for an encrypted DB cluster.

            The KMS key identifier is the Amazon Resource Name (ARN) for the KMS encryption key. If you are creating a DB cluster with the same Amazon account that owns the KMS encryption key used to encrypt the new DB cluster, then you can use the KMS key alias instead of the ARN for the KMS encryption key.

            If an encryption key is not specified in `KmsKeyId`:

            - If `ReplicationSourceIdentifier` identifies an encrypted source, then Amazon Neptune will use the encryption key used to encrypt the source. Otherwise, Amazon Neptune will use your default encryption key.
            - If the `StorageEncrypted` parameter is true and `ReplicationSourceIdentifier` is not specified, then Amazon Neptune will use your default encryption key.

            Amazon KMS creates the default encryption key for your Amazon account. Your Amazon account has a different default encryption key for each Amazon Region.

            If you create a Read Replica of an encrypted DB cluster in another Amazon Region, you must set `KmsKeyId` to a KMS key ID that is valid in the destination Amazon Region. This key is used to encrypt the Read Replica in that Amazon Region.
        master-user-password: Not supported by Neptune.
        master-username: Not supported by Neptune.
        option-group-name: '*(Not supported by Neptune)*'
        port: |-
            The port number on which the instances in the DB cluster accept connections.

            Default: `8182`
        pre-signed-url: This parameter is not currently supported.
        preferred-backup-window: |-
            The daily time range during which automated backups are created if automated backups are enabled using the `BackupRetentionPeriod` parameter.

            The default is a 30-minute window selected at random from an 8-hour block of time for each Amazon Region. To see the time blocks available, see [Neptune Maintenance Window](https://docs.aws.amazon.com/neptune/latest/userguide/manage-console-maintaining.html#manage-console-maintaining-window) in the *Amazon Neptune User Guide.*

            Constraints:

            - Must be in the format `hh24:mi-hh24:mi`.
            - Must be in Universal Coordinated Time (UTC).
            - Must not conflict with the preferred maintenance window.
            - Must be at least 30 minutes.
        preferred-maintenance-window: |-
            The weekly time range during which system maintenance can occur, in Universal Coordinated Time (UTC).

            Format: `ddd:hh24:mi-ddd:hh24:mi`

            The default is a 30-minute window selected at random from an 8-hour block of time for each Amazon Region, occurring on a random day of the week. To see the time blocks available, see [Neptune Maintenance Window](https://docs.aws.amazon.com/neptune/latest/userguide/manage-console-maintaining.html#manage-console-maintaining-window) in the *Amazon Neptune User Guide.*

            Valid Days: Mon, Tue, Wed, Thu, Fri, Sat, Sun.

            Constraints: Minimum 30-minute window.
        replication-source-identifier: The Amazon Resource Name (ARN) of the source DB instance or DB cluster if this DB cluster is created as a Read Replica.
        serverless-v2-scaling-configuration: |-
            Contains the scaling configuration of a Neptune Serverless DB cluster.

            For more information, see [Using Amazon Neptune Serverless](https://docs.aws.amazon.com/neptune/latest/userguide/neptune-serverless-using.html) in the *Amazon Neptune User Guide*.
        storage-encrypted: Specifies whether the DB cluster is encrypted.
        storage-type: "The storage type for the new DB cluster.\n\nValid Values:\n\n- **`standard`**   –   ( *the default* ) Configures cost-effective database storage for applications with moderate to small I/O usage. When set to `standard`, the storage type is not returned in the response.\n- **`iopt1`**   –   Enables [I/O-Optimized storage](https://docs.aws.amazon.com/neptune/latest/userguide/storage-types.html#provisioned-iops-storage) that's designed to meet the needs of I/O-intensive graph workloads that require predictable pricing with low I/O latency and consistent I/O throughput.\n  \n  Neptune I/O-Optimized storage is only available starting with engine release 1.3.0.0."
        tags: The tags to assign to the new DB cluster.
        vpc-security-group-ids: A list of EC2 VPC security groups to associate with this DB cluster.
