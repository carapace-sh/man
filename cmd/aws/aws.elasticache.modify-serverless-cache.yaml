name: modify-serverless-cache
description: This API modifies the attributes of a serverless cache.
flags:
    --cache-usage-limits=: Modify the cache usage limit for the serverless cache.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --daily-snapshot-time=: The daily time during which Elasticache begins taking a daily snapshot of the serverless cache.
    --description=: User provided description for the serverless cache.
    --engine=: Modifies the engine listed in a serverless cache request.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --major-engine-version=: Modifies the engine vesion listed in a serverless cache request.
    --no-remove-user-group: The identifier of the UserGroup to be removed from association with the Valkey and Redis OSS serverless cache.
    --remove-user-group: The identifier of the UserGroup to be removed from association with the Valkey and Redis OSS serverless cache.
    --security-group-ids=: The new list of VPC security groups to be associated with the serverless cache.
    --serverless-cache-name=!: User-provided identifier for the serverless cache to be modified.
    --snapshot-retention-limit=: The number of days for which Elasticache retains automatic snapshots before deleting them.
    --user-group-id=: The identifier of the UserGroup to be associated with the serverless cache.
documentation:
    command: This API modifies the attributes of a serverless cache.
    flag:
        cache-usage-limits: Modify the cache usage limit for the serverless cache.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        daily-snapshot-time: The daily time during which Elasticache begins taking a daily snapshot of the serverless cache. Available for Valkey, Redis OSS and Serverless Memcached only. The default is NULL, i.e. the existing snapshot time configured for the cluster is not removed.
        description: User provided description for the serverless cache. Default = NULL, i.e. the existing description is not removed/modified. The description has a maximum length of 255 characters.
        engine: Modifies the engine listed in a serverless cache request. The options are redis, memcached or valkey.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        major-engine-version: Modifies the engine vesion listed in a serverless cache request.
        remove-user-group: The identifier of the UserGroup to be removed from association with the Valkey and Redis OSS serverless cache. Available for Valkey and Redis OSS only. Default is NULL.
        security-group-ids: The new list of VPC security groups to be associated with the serverless cache. Populating this list means the current VPC security groups will be removed. This security group is used to authorize traffic access for the VPC end-point (private-link). Default = NULL - the existing list of VPC security groups is not removed.
        serverless-cache-name: User-provided identifier for the serverless cache to be modified.
        snapshot-retention-limit: The number of days for which Elasticache retains automatic snapshots before deleting them. Available for Valkey, Redis OSS and Serverless Memcached only. Default = NULL, i.e. the existing snapshot-retention-limit will not be removed or modified. The maximum value allowed is 35 days.
        user-group-id: The identifier of the UserGroup to be associated with the serverless cache. Available for Valkey and Redis OSS only. Default is NULL - the existing UserGroup is not removed.
