name: list-tables
description: Provides a list of tables, along with the name, status, and retention properties of each table.
flags:
    --database-name=: The name of the Timestream database.
    --max-results=: The total number of items to return in the output.
    --next-token=: The pagination token.
documentation:
    command: Provides a list of tables, along with the name, status, and retention properties of each table. See [code sample](https://docs.aws.amazon.com/timestream/latest/developerguide/code-samples.list-table.html) for details.
    flag:
        database-name: The name of the Timestream database.
        max-results: The total number of items to return in the output. If the total number of items available is more than the value specified, a NextToken is provided in the output. To resume pagination, provide the NextToken value as argument of a subsequent API invocation.
        next-token: The pagination token. To resume pagination, provide the NextToken value as argument of a subsequent API invocation.
