name: get-read-set-metadata
description: Retrieves the metadata for a read set from a sequence store in JSON format.
flags:
    --id=!: The read set's ID.
    --sequence-store-id=!: The read set's sequence store ID.
documentation:
    command: Retrieves the metadata for a read set from a sequence store in JSON format. This operation does not return tags. To retrieve the list of tags for a read set, use the `ListTagsForResource` API operation.
    flag:
        id: The read set's ID.
        sequence-store-id: The read set's sequence store ID.
