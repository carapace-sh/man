name: update-web-app
description: Assigns new properties to a web app.
flags:
    --access-endpoint=: The `AccessEndpoint` is the URL that you provide to your users for them to interact with the Transfer Family web app.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identity-provider-details=: Provide updated identity provider values in a `WebAppIdentityProviderDetails` object.
    --web-app-id=!: Provide the identifier of the web app that you are updating.
    --web-app-units=: A union that contains the value for number of concurrent connections or the user sessions on your web app.
documentation:
    command: Assigns new properties to a web app. You can modify the access point, identity provider details, and the web app units.
    flag:
        access-endpoint: The `AccessEndpoint` is the URL that you provide to your users for them to interact with the Transfer Family web app. You can specify a custom URL or use the default value.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        identity-provider-details: Provide updated identity provider values in a `WebAppIdentityProviderDetails` object.
        web-app-id: Provide the identifier of the web app that you are updating.
        web-app-units: A union that contains the value for number of concurrent connections or the user sessions on your web app.
