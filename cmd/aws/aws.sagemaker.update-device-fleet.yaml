name: update-device-fleet
description: Updates a fleet of devices.
flags:
    --description=: Description of the fleet.
    --device-fleet-name=!: The name of the fleet.
    --enable-iot-role-alias=: Whether to create an Amazon Web Services IoT Role Alias during device fleet creation.
    --output-config=!: Output configuration for storing sample data collected by the fleet.
    --role-arn=: The Amazon Resource Name (ARN) of the device.
documentation:
    command: Updates a fleet of devices.
    flag:
        description: Description of the fleet.
        device-fleet-name: The name of the fleet.
        enable-iot-role-alias: |-
            Whether to create an Amazon Web Services IoT Role Alias during device fleet creation. The name of the role alias generated will match this pattern: "SageMakerEdge-{DeviceFleetName}".

            For example, if your device fleet is called "demo-fleet", the name of the role alias will be "SageMakerEdge-demo-fleet".
        output-config: Output configuration for storing sample data collected by the fleet.
        role-arn: The Amazon Resource Name (ARN) of the device.
