name: switchover
description: '*(BETA)*  Switches over a Cloud SQL instance to one of its replicas.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --db-timeout=: (MySQL and PostgreSQL only) Cloud SQL instance operations timeout, which is the sum of all database operations.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: '*(BETA)*  Switches over a Cloud SQL instance to one of its replicas.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        db-timeout: (MySQL and PostgreSQL only) Cloud SQL instance operations timeout, which is the sum of all database operations. Default value is 10 minutes and can be modified to a maximum value of 24h.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
