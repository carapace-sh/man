name: create
description: '*(BETA)*  Creates a Compute Engine delegated sub prefix.'
flags:
    --allocatable-prefix-length=: Specify allocatable prefix length supported by this sub prefix.
    --create-addresses: Specify if the sub prefix is delegated to create address resources in the delegatee project.
    --delegatee-project=: Project to delegate the IPv4 range specified in `--range` to.
    --description=: Description of the delegated sub prefix to create.
    --global-public-delegated-prefix: If set, the public delegated prefix is global.
    --mode=: Specifies the mode of this IPv6 PDP.
    --no-create-addresses&: Specify if the sub prefix is delegated to create address resources in the delegatee project.
    --no-global-public-delegated-prefix&: If set, the public delegated prefix is global.
    --public-delegated-prefix-region=: Region of the public delegated prefix to create the delegate sub prefix for.
    --public-delegated-prefix=!: Name of the public delegated prefix to create the delegate sub prefix for.
    --range=: IPv4 range from this public delegated prefix that should be delegated, in CIDR format.
completion:
    flag:
        mode:
            - delegation
            - external-ipv6-forwarding-rule-creation
            - external-ipv6-subnetwork-creation
            - internal-ipv6-subnetwork-creation
documentation:
    command: '*(BETA)*  Creates a Compute Engine delegated sub prefix.'
    flag:
        allocatable-prefix-length: Specify allocatable prefix length supported by this sub prefix.
        create-addresses: Specify if the sub prefix is delegated to create address resources in the delegatee project. Default is false.
        delegatee-project: Project to delegate the IPv4 range specified in `--range` to. If empty, the sub-range is delegated to the same/existing project.
        description: Description of the delegated sub prefix to create.
        global-public-delegated-prefix: If set, the public delegated prefix is global.
        mode: 'Specifies the mode of this IPv6 PDP. _MODE_ must be one of: *delegation*, *external-ipv6-forwarding-rule-creation*, *external-ipv6-subnetwork-creation*, *internal-ipv6-subnetwork-creation*.'
        no-create-addresses: Specify if the sub prefix is delegated to create address resources in the delegatee project. Default is false.
        no-global-public-delegated-prefix: If set, the public delegated prefix is global.
        public-delegated-prefix: Name of the public delegated prefix to create the delegate sub prefix for.
        public-delegated-prefix-region: |-
            Region of the public delegated prefix to create the delegate sub prefix for. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        range: IPv4 range from this public delegated prefix that should be delegated, in CIDR format. If not specified, the entire range ofthe public advertised prefix is delegated.
