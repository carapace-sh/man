name: get-bucket-tagging
description: This operation is not supported for directory buckets.
flags:
    --bucket=!: The name of the bucket for which to get the tagging information.
    --expected-bucket-owner=: The account ID of the expected bucket owner.
documentation:
    command: "This operation is not supported for directory buckets.\n\nReturns the tag set associated with the bucket.\n\nTo use this operation, you must have permission to perform the `s3:GetBucketTagging` action. By default, the bucket owner has this permission and can grant this permission to others.\n\n`GetBucketTagging` has the following special error:\n\n- Error code: `NoSuchTagSet`\n  \n  - Description: There is no tag set associated with the bucket.\n\nThe following operations are related to `GetBucketTagging`:\n\n- [PutBucketTagging](https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketTagging.html)\n- [DeleteBucketTagging](https://docs.aws.amazon.com/AmazonS3/latest/API/API_DeleteBucketTagging.html)\n\nYou must URL encode any signed header values that contain spaces. For example, if your header value is `my file.txt`, containing two spaces after `my`, you must URL encode this value to `my%20%20file.txt`."
    flag:
        bucket: The name of the bucket for which to get the tagging information.
        expected-bucket-owner: The account ID of the expected bucket owner. If the account ID that you provide does not match the actual owner of the bucket, the request fails with the HTTP status code `403 Forbidden` (access denied).
