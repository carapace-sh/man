name: describe-account
description: Retrieves Organizations-related information about the specified account.
flags:
    --account-id=!: The unique identifier (ID) of the Amazon Web Services account that you want information about.
documentation:
    command: |-
        Retrieves Organizations-related information about the specified account.

        This operation can be called only from the organization's management account or by a member account that is a delegated administrator.
    flag:
        account-id: |-
            The unique identifier (ID) of the Amazon Web Services account that you want information about. You can get the ID from the [ListAccounts]() or [ListAccountsForParent]() operations.

            The [regex pattern](http://wikipedia.org/wiki/regex) for an account ID string requires exactly 12 digits.
