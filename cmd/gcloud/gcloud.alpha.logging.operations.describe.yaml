name: describe
description: '*(ALPHA)*  Display the information about a long running operation.'
flags:
    --billing-account=: Billing account of the operation to describe.
    --folder=: Folder of the operation to describe.
    --location=!: Location of the operation.
    --organization=: Organization of the operation to describe.
documentation:
    command: |-
        *(ALPHA)*  Display the information about a long running operation which was scheduled
        before. For example, a copy_log_entries operation scheduled by command:
        "gcloud alpha logging copy BUCKET_ID DESTINATION --location=LOCATION"
        OPERATION_ID and LOCATION are required to locate such operation.

        ## EXAMPLES

        To describe an operation, run:

          $ gcloud alpha logging operations describe OPERATION_ID --location=LOCATION
    flag:
        billing-account: Billing account of the operation to describe.
        folder: Folder of the operation to describe.
        location: Location of the operation.
        organization: Organization of the operation to describe.
