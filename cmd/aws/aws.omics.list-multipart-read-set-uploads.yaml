name: list-multipart-read-set-uploads
description: Lists in-progress multipart read set uploads for a sequence store and returns it in a JSON formatted output.
flags:
    --max-results=: The maximum number of multipart uploads returned in a page.
    --next-token=: Next token returned in the response of a previous ListMultipartReadSetUploads call.
    --sequence-store-id=!: The Sequence Store ID used for the multipart uploads.
documentation:
    command: Lists in-progress multipart read set uploads for a sequence store and returns it in a JSON formatted output. Multipart read set uploads are initiated by the `CreateMultipartReadSetUploads` API operation. This operation returns a response with no body when the upload is complete.
    flag:
        max-results: The maximum number of multipart uploads returned in a page.
        next-token: Next token returned in the response of a previous ListMultipartReadSetUploads call. Used to get the next page of results.
        sequence-store-id: The Sequence Store ID used for the multipart uploads.
