name: update
description: '*(ALPHA)*  Update Assured Workloads environments.'
flags:
    --display-name=: The new display name of the Assured Workloads environment.
    --etag=: The etag acquired by reading the Assured Workloads environment before updating.
    --labels=: The new labels of the Assured Workloads environment, for example, LabelKey1=LabelValue1,LabelKey2=LabelValue2
    --location=: The location for the workload.
    --organization=: The parent organization for the workload.
    --violation-notifications-enabled=: The notification setting of the Assured Workloads environment.
documentation:
    command: '*(ALPHA)*  Update a given Assured Workloads environment.'
    flag:
        display-name: The new display name of the Assured Workloads environment.
        etag: The etag acquired by reading the Assured Workloads environment before updating.
        labels: The new labels of the Assured Workloads environment, for example, LabelKey1=LabelValue1,LabelKey2=LabelValue2
        location: |-
            The location for the workload.
            +
            To set the `location` attribute:
            * provide the argument `workload` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        organization: |-
            The parent organization for the workload.
            +
            To set the `organization` attribute:
            * provide the argument `workload` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
        violation-notifications-enabled: The notification setting of the Assured Workloads environment.
