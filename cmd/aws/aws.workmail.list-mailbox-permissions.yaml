name: list-mailbox-permissions
description: Lists the mailbox permissions associated with a user, group, or resource mailbox.
flags:
    --entity-id=!: The identifier of the user, or resource for which to list mailbox permissions.
    --max-results=: The maximum number of results to return in a single call.
    --next-token=: The token to use to retrieve the next page of results.
    --organization-id=!: The identifier of the organization under which the user, group, or resource exists.
documentation:
    command: Lists the mailbox permissions associated with a user, group, or resource mailbox.
    flag:
        entity-id: |-
            The identifier of the user, or resource for which to list mailbox permissions.

            The entity ID can accept *UserId or ResourceId*, *Username or Resourcename*, or *email*.

            - Entity ID: 12345678-1234-1234-1234-123456789012, or r-0123456789a0123456789b0123456789
            - Email address: entity@domain.tld
            - Entity name: entity
        max-results: The maximum number of results to return in a single call.
        next-token: The token to use to retrieve the next page of results. The first call does not contain any tokens.
        organization-id: The identifier of the organization under which the user, group, or resource exists.
