name: get-event-prediction-metadata
description: Gets details of the past fraud predictions for the specified event ID, event type, detector ID, and detector version ID that was generated in the specified time period.
flags:
    --detector-id=!: The detector ID.
    --detector-version-id=!: The detector version ID.
    --event-id=!: The event ID.
    --event-type-name=!: The event type associated with the detector specified for the prediction.
    --prediction-timestamp=!: The timestamp that defines when the prediction was generated.
documentation:
    command: Gets details of the past fraud predictions for the specified event ID, event type, detector ID, and detector version ID that was generated in the specified time period.
    flag:
        detector-id: The detector ID.
        detector-version-id: The detector version ID.
        event-id: The event ID.
        event-type-name: The event type associated with the detector specified for the prediction.
        prediction-timestamp: |-
            The timestamp that defines when the prediction was generated. The timestamp must be specified using ISO 8601 standard in UTC.

            We recommend calling [ListEventPredictions](https://docs.aws.amazon.com/frauddetector/latest/api/API_ListEventPredictions.html) first, and using the `predictionTimestamp` value in the response to provide an accurate prediction timestamp value.
