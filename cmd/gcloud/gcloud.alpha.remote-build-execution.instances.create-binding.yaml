name: create-binding
description: '*(ALPHA)*  Create a backend IAM binding for an instance.'
hidden: true
flags:
    --principal=!: The IAM binding principal formatted as <PRINCIPAL_TYPE_IDENTIFIER>:<PRINCIPAL>.
    --role=!: The IAM binding role formatted as roles/<ROLE>.
documentation:
    command: |
        *(ALPHA)*  Creates a backend IAM binding on the backend project of a Remote Build Execution instance,
        which will add the specified IAM role for the specified principal on the IAM policy of the
        backend project in question.
    flag:
        principal: |-
            The IAM binding principal formatted as <PRINCIPAL_TYPE_IDENTIFIER>:<PRINCIPAL>. For example,
            `user:foo@google.com`.
        role: The IAM binding role formatted as roles/<ROLE>. For example, `roles/editor`.
