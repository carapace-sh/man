name: resize
description: '*(ALPHA)*  Set managed instance group size.'
flags:
    --creation-retries: When instance creation fails retry it.
    --no-creation-retries&: When instance creation fails retry it.
    --region=: Region of the managed instance group to operate on.
    --size=: Target number of running instances in managed instance group.
    --stopped-size=: Target number of stopped instances in managed instance group.
    --suspended-size=: Target number of suspended instances in managed instance group.
    --zone=: Zone of the managed instance group to operate on.
documentation:
    command: |4
                *(ALPHA)*  *gcloud alpha compute instance-groups managed resize* resize a managed instance group to a provided size.

        If you resize down, the Instance Group Manager service deletes instances from
        the group until the group reaches the desired size. Instances are deleted
        in arbitrary order but the Instance Group Manager takes into account some
        considerations before it chooses which instance to delete. For more information,
        see https://cloud.google.com/compute/docs/reference/rest/v1/instanceGroupManagers/resize.

        If you resize up, the service adds instances to the group using the current
        instance template until the group reaches the desired size.
    flag:
        creation-retries: When instance creation fails retry it. Enabled by default, use *--no-creation-retries* to disable.
        no-creation-retries: When instance creation fails retry it.
        region: |-
            Region of the managed instance group to operate on. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            Overrides the default *compute/region* property value for this command invocation.
        size: Target number of running instances in managed instance group.
        stopped-size: Target number of stopped instances in managed instance group.
        suspended-size: Target number of suspended instances in managed instance group.
        zone: |-
            Zone of the managed instance group to operate on. If not specified, you might be prompted to select a zone (interactive mode
            only).
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            Overrides the default *compute/zone* property value for this command invocation.
