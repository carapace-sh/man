name: disable-vpc-service-controls
description: '*(BETA)*  Disable VPC Service Controls for the peering connection.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --network=!: The network in the current project that is peered with the service.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --service=: The service to enable VPC service controls for.
documentation:
    command: |
        *(BETA)*  This command disables VPC Service Controls for the peering connection.

        The local default route (destination 0.0.0.0/0, next hop default
        internet gateway) is recreated in the service producer VPC network.
        After the route is recreated, the service producer VPC network cannot
        import a custom default route from the peering connection to the
        customer VPC network.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        network: The network in the current project that is peered with the service.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        service: The service to enable VPC service controls for.
