name: list-image-scan-findings
description: Returns a list of image scan findings for your account.
flags:
    --filters=: An array of name value pairs that you can use to filter your results.
    --max-results=: Specify the maximum number of items to return in a request.
    --next-token=: A token to specify where to start paginating.
documentation:
    command: Returns a list of image scan findings for your account.
    flag:
        filters: |-
            An array of name value pairs that you can use to filter your results. You can use the following filters to streamline results:

            - `imageBuildVersionArn`
            - `imagePipelineArn`
            - `vulnerabilityId`
            - `severity`

            If you don't request a filter, then all findings in your account are listed.
        max-results: Specify the maximum number of items to return in a request.
        next-token: A token to specify where to start paginating. This is the nextToken from a previously truncated response.
