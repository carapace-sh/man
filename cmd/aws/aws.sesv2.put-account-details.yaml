name: put-account-details
description: Update your Amazon SES account details.
flags:
    --additional-contact-email-addresses=:
        description: Additional email addresses that you would like to be notified regarding Amazon SES matters.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --contact-language=: The language you would prefer to be contacted with.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --mail-type=!: The type of email your account will send.
    --no-production-access-enabled: Indicates whether or not your account should have production access in the current Amazon Web Services Region.
    --production-access-enabled: Indicates whether or not your account should have production access in the current Amazon Web Services Region.
    --use-case-description=: A description of the types of email that you plan to send.
    --website-url=!: The URL of your website.
completion:
    flag:
        contact-language:
            - EN
            - JA
        mail-type:
            - MARKETING
            - TRANSACTIONAL
documentation:
    command: Update your Amazon SES account details.
    flag:
        additional-contact-email-addresses: Additional email addresses that you would like to be notified regarding Amazon SES matters.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        contact-language: The language you would prefer to be contacted with.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        mail-type: The type of email your account will send.
        production-access-enabled: |-
            Indicates whether or not your account should have production access in the current Amazon Web Services Region.

            If the value is `false`, then your account is in the *sandbox*. When your account is in the sandbox, you can only send email to verified identities.

            If the value is `true`, then your account has production access. When your account has production access, you can send email to any address. The sending quota and maximum sending rate for your account vary based on your specific use case.
        use-case-description: A description of the types of email that you plan to send.
        website-url: The URL of your website. This information helps us better understand the type of content that you plan to send.
