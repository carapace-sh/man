name: delete
description: '*(ALPHA)*  Delete a Database Migration Service connection profile.'
flags:
    --force: Cloud SQL replica database is also deleted (only for Cloud SQL connection profiles).
    --no-force&: Cloud SQL replica database is also deleted (only for Cloud SQL connection profiles).
    --region=: The name of the region.
documentation:
    command: |
        *(ALPHA)*  Deletes a connection profile. A connection profile can only be deleted if it is not in use by
        any active migration jobs.
    flag:
        force: Cloud SQL replica database is also deleted (only for Cloud SQL connection profiles).
        no-force: |
            Cloud SQL replica database is also deleted (only for Cloud SQL connection profiles).
        region: |-
            The name of the region.
            +
            To set the `region` attribute:
            * provide the argument `connection_profile` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
