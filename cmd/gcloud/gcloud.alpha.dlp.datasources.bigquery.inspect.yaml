    --info-types=: Which infoTypes to scan input for.
    --job-id=: Optional job ID to use for the created job.
    --max-findings-per-item=: Maximum number of findings that will be returned for each item scanned.
    --max-findings=: Maximum number of findings that will be returned per execution.
    --max-time=: Scan will include items in repository whose age is >= min-time
    --min-likelihood=: Only return findings equal to or above this threshold.
