name: create-channel
description: Creates a channel.
flags:
    --audiences=: The list of audiences defined in channel.
    --channel-name=!: The name of the channel.
    --filler-slate=: The slate used to fill gaps between programs in the schedule.
    --outputs=!: The channel's output properties.
    --playback-mode=!: The type of playback mode to use for this channel.
    --tags=: The tags to assign to the channel.
    --tier=: The tier of the channel.
    --time-shift-configuration=: The time-shifted viewing configuration you want to associate to the channel.
completion:
    flag:
        playback-mode:
            - LOOP
            - LINEAR
        tier:
            - BASIC
            - STANDARD
documentation:
    command: Creates a channel. For information about MediaTailor channels, see [Working with channels](https://docs.aws.amazon.com/mediatailor/latest/ug/channel-assembly-channels.html) in the *MediaTailor User Guide*.
    flag:
        audiences: The list of audiences defined in channel.
        channel-name: The name of the channel.
        filler-slate: The slate used to fill gaps between programs in the schedule. You must configure filler slate if your channel uses the `LINEAR` `PlaybackMode`. MediaTailor doesn't support filler slate for channels using the `LOOP` `PlaybackMode`.
        outputs: The channel's output properties.
        playback-mode: |-
            The type of playback mode to use for this channel.

            `LINEAR` - The programs in the schedule play once back-to-back in the schedule.

            `LOOP` - The programs in the schedule play back-to-back in an endless loop. When the last program in the schedule stops playing, playback loops back to the first program in the schedule.
        tags: The tags to assign to the channel. Tags are key-value pairs that you can associate with Amazon resources to help with organization, access control, and cost tracking. For more information, see [Tagging AWS Elemental MediaTailor Resources](https://docs.aws.amazon.com/mediatailor/latest/ug/tagging.html).
        tier: The tier of the channel.
        time-shift-configuration: The time-shifted viewing configuration you want to associate to the channel.
