        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filter-in-arns: The Amazon Resource Names (ARN) of the resources that the path must traverse.
        filter-out-arns: The Amazon Resource Names (ARN) of the resources that the path will ignore.
        network-insights-path-id: The ID of the path.
        tag-specifications: The tags to apply.
