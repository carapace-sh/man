name: update-template
description: Updates the attributes of an existing template.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A brief description of the template.
    --domain-id=!: The unique identifier of the Cases domain.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --layout-configuration=: Configuration of layouts associated to the template.
    --name=: The name of the template.
    --required-fields=:
        description: A list of fields that must contain a value for a case to be successfully created with this template.
        nargs: -1
    --rules=:
        description: A list of case rules (also known as [case field conditions](https://docs.aws.amazon.com/connect/latest/adminguide/case-field-conditions.html)) on a template.
        nargs: -1
    --status=: The status of the template.
    --template-id=!: A unique identifier for the template.
completion:
    flag:
        status:
            - Active
            - Inactive
documentation:
    command: |-
        Updates the attributes of an existing template. The template attributes that can be modified include `name`, `description`, `layoutConfiguration`, `requiredFields`, and `status`. At least one of these attributes must not be null. If a null value is provided for a given attribute, that attribute is ignored and its current value is preserved.

        Other template APIs are:

        - [CreateTemplate](https://docs.aws.amazon.com/connect/latest/APIReference/API_connect-cases_CreateTemplate.html)
        - [DeleteTemplate](https://docs.aws.amazon.com/connect/latest/APIReference/API_connect-cases_DeleteTemplate.html)
        - [GetTemplate](https://docs.aws.amazon.com/connect/latest/APIReference/API_connect-cases_GetTemplate.html)
        - [ListTemplates](https://docs.aws.amazon.com/connect/latest/APIReference/API_connect-cases_ListTemplates.html)
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A brief description of the template.
        domain-id: The unique identifier of the Cases domain.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        layout-configuration: Configuration of layouts associated to the template.
        name: The name of the template. It must be unique per domain.
        required-fields: A list of fields that must contain a value for a case to be successfully created with this template.
        rules: A list of case rules (also known as [case field conditions](https://docs.aws.amazon.com/connect/latest/adminguide/case-field-conditions.html)) on a template.
        status: The status of the template.
        template-id: A unique identifier for the template.
