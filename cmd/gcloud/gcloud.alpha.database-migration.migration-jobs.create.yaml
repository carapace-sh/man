name: create
description: '*(ALPHA)*  Create a Database Migration Service migration job.'
flags:
    --destination=!: ID of the connection_profile or fully qualified identifier for the connection_profile.
    --display-name=: A user-friendly name for the migration job.
    --dump-flags=: A list of dump flags.
    --dump-path=: 'Path to the dump file in Google Cloud Storage, in the format:'
    --labels=: List of label KEY=VALUE pairs to add.
    --no-async: Waits for the operation in progress to complete before returning.
    --no-static-ip&: Use the default IP allowlist method.
    --peer-vpc=: Name of the VPC network to peer with the Cloud SQL private network.
    --region=: The Cloud region for the migration_job.
    --source=!: ID of the connection_profile or fully qualified identifier for the connection_profile.
    --static-ip: Use the default IP allowlist method.
    --type=!: Type of the migration job.
    --vm-ip=!: Bastion Virtual Machine IP.
    --vm-port=!: Forwarding port for the SSH tunnel.
    --vm=: Name of VM that will host the SSH tunnel bastion.
    --vpc=!: Name of the VPC network where the VM is hosted.
completion:
    flag:
        type:
            - ONE_TIME
            - CONTINUOUS
documentation:
    command: |
        *(ALPHA)*  Create a Database Migration Service migration job.
        Recommended steps before creating the migration job:
        - Create a source connection profile. See prerequisites [here](https://cloud.google.com/database-migration/docs/mysql/configure-source-database).
        - Create a destination connection profile. For migrating to Cloud SQL for MySQL or Cloud SQL for PostgreSQL, use the cloudsql connection profile for DMS to create the CloudSQL replica for you.
        - Configure the connectivity method. See prerequisites [here](https://cloud.google.com/database-migration/docs/mysql/configure-connectivity).
    flag:
        destination: |-
            ID of the connection_profile or fully qualified identifier for the connection_profile.
            +
            To set the `connection_profile` attribute:
            * provide the argument `--destination` on the command line.
        display-name: |-
            A user-friendly name for the migration job. The display name can include
            letters, numbers, spaces, and hyphens, and must start with a letter.
        dump-flags: 'A list of dump flags. An object containing a list of "key": "value" pairs.'
        dump-path: |-
            Path to the dump file in Google Cloud Storage, in the format:
            `gs://[BUCKET_NAME]/[OBJECT_NAME]`.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        no-async: Waits for the operation in progress to complete before returning.
        no-static-ip: Use the default IP allowlist method. This method creates a public IP that will be used with the destination Cloud SQL database. The method works by configuring the source database server to accept connections from the outgoing IP of the Cloud SQL instance.
        peer-vpc: Name of the VPC network to peer with the Cloud SQL private network.
        region: |-
            The Cloud region for the migration_job.
            +
            To set the `region` attribute:
            * provide the argument `migration_job` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
        source: |-
            ID of the connection_profile or fully qualified identifier for the connection_profile.
            +
            To set the `connection_profile` attribute:
            * provide the argument `--source` on the command line.
        static-ip: Use the default IP allowlist method. This method creates a public IP that will be used with the destination Cloud SQL database. The method works by configuring the source database server to accept connections from the outgoing IP of the Cloud SQL instance.
        type: 'Type of the migration job. _TYPE_ must be one of: *ONE_TIME*, *CONTINUOUS*.'
        vm: Name of VM that will host the SSH tunnel bastion.
        vm-ip: Bastion Virtual Machine IP.
        vm-port: Forwarding port for the SSH tunnel.
        vpc: Name of the VPC network where the VM is hosted.
