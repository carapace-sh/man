name: list-logging-configurations
description: Gets summary information about all your logging configurations in the AWS region where the API request is processed.
flags:
    --max-results=: Maximum number of logging configurations to return.
    --next-token=: The first logging configurations to retrieve.
documentation:
    command: Gets summary information about all your logging configurations in the AWS region where the API request is processed.
    flag:
        max-results: 'Maximum number of logging configurations to return. Default: 50.'
        next-token: The first logging configurations to retrieve. This is used for pagination; see the `nextToken` response field.
