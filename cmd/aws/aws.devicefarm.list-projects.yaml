name: list-projects
description: Gets information about projects.
flags:
    --arn=: Optional.
    --next-token=: An identifier that was returned from the previous call to this operation, which can be used to return the next set of items in the list.
documentation:
    command: Gets information about projects.
    flag:
        arn: Optional. If no Amazon Resource Name (ARN) is specified, then AWS Device Farm returns a list of all projects for the AWS account. You can also specify a project ARN.
        next-token: An identifier that was returned from the previous call to this operation, which can be used to return the next set of items in the list.
