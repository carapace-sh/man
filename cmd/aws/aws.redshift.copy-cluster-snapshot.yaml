name: copy-cluster-snapshot
description: Copies the specified automated cluster snapshot to a new manual cluster snapshot.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --manual-snapshot-retention-period=: The number of days that a manual snapshot is retained.
    --source-snapshot-cluster-identifier=: The identifier of the cluster the source snapshot was created from.
    --source-snapshot-identifier=!: The identifier for the source snapshot.
    --target-snapshot-identifier=!: The identifier given to the new manual snapshot.
documentation:
    command: |-
        Copies the specified automated cluster snapshot to a new manual cluster snapshot. The source must be an automated snapshot and it must be in the available state.

        When you delete a cluster, Amazon Redshift deletes any automated snapshots of the cluster. Also, when the retention period of the snapshot expires, Amazon Redshift automatically deletes it. If you want to keep an automated snapshot for a longer period, you can make a manual copy of the snapshot. Manual snapshots are retained until you delete them.

        For more information about working with snapshots, go to [Amazon Redshift Snapshots](https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-snapshots.html) in the *Amazon Redshift Cluster Management Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        manual-snapshot-retention-period: |-
            The number of days that a manual snapshot is retained. If the value is -1, the manual snapshot is retained indefinitely.

            The value must be either -1 or an integer between 1 and 3,653.

            The default value is -1.
        source-snapshot-cluster-identifier: |-
            The identifier of the cluster the source snapshot was created from. This parameter is required if your IAM user has a policy containing a snapshot resource element that specifies anything other than * for the cluster name.

            Constraints:

            - Must be the identifier for a valid cluster.
        source-snapshot-identifier: |-
            The identifier for the source snapshot.

            Constraints:

            - Must be the identifier for a valid automated snapshot whose state is `available`.
        target-snapshot-identifier: |-
            The identifier given to the new manual snapshot.

            Constraints:

            - Cannot be null, empty, or blank.
            - Must contain from 1 to 255 alphanumeric characters or hyphens.
            - First character must be a letter.
            - Cannot end with a hyphen or contain two consecutive hyphens.
            - Must be unique for the Amazon Web Services account that is making the request.
