name: describe-domain-change-progress
description: Returns information about the current blue/green deployment happening on a domain, including a change ID, status, and progress stages.
flags:
    --change-id=: The specific change ID for which you want to get progress information.
    --domain-name=!: The domain you want to get the progress information about.
documentation:
    command: Returns information about the current blue/green deployment happening on a domain, including a change ID, status, and progress stages.
    flag:
        change-id: The specific change ID for which you want to get progress information. This is an optional parameter. If omitted, the service returns information about the most recent configuration change.
        domain-name: The domain you want to get the progress information about.
