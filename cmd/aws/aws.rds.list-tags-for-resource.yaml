name: list-tags-for-resource
description: Lists all tags on an Amazon RDS resource.
flags:
    --filters=: This parameter isn't currently supported.
    --resource-name=!: The Amazon RDS resource with tags to be listed.
documentation:
    command: |-
        Lists all tags on an Amazon RDS resource.

        For an overview on tagging an Amazon RDS resource, see [Tagging Amazon RDS Resources](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_Tagging.html) in the *Amazon RDS User Guide* or [Tagging Amazon Aurora and Amazon RDS Resources](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_Tagging.html) in the *Amazon Aurora User Guide*.
    flag:
        filters: This parameter isn't currently supported.
        resource-name: The Amazon RDS resource with tags to be listed. This value is an Amazon Resource Name (ARN). For information about creating an ARN, see [Constructing an ARN for Amazon RDS](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_Tagging.ARN.html#USER_Tagging.ARN.Constructing) in the *Amazon RDS User Guide*.
