name: create-directory
description: Creates a Simple AD directory.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description for the directory.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The fully qualified name for the directory, such as `corp.example.com`.
    --network-type=: The network type for your directory.
    --password=!: The password for the directory administrator.
    --short-name=: The NetBIOS name of the directory, such as `CORP`.
    --size=!: The size of the directory.
    --tags=:
        description: The tags to be assigned to the Simple AD directory.
        nargs: -1
    --vpc-settings=: A [DirectoryVpcSettings]() object that contains additional information for the operation.
completion:
    flag:
        network-type:
            - Dual-stack
            - IPv4
            - IPv6
        size:
            - Small
            - Large
documentation:
    command: |-
        Creates a Simple AD directory. For more information, see [Simple Active Directory](https://docs.aws.amazon.com/directoryservice/latest/admin-guide/directory_simple_ad.html) in the *Directory Service Admin Guide*.

        Before you call `CreateDirectory`, ensure that all of the required permissions have been explicitly granted through a policy. For details about what permissions are required to run the `CreateDirectory` operation, see [Directory Service API Permissions: Actions, Resources, and Conditions Reference](http://docs.aws.amazon.com/directoryservice/latest/admin-guide/UsingWithDS_IAM_ResourcePermissions.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description for the directory.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The fully qualified name for the directory, such as `corp.example.com`.
        network-type: The network type for your directory. Simple AD supports IPv4 and Dual-stack only.
        password: |-
            The password for the directory administrator. The directory creation process creates a directory administrator account with the user name `Administrator` and this password.

            If you need to change the password for the administrator account, you can use the [ResetUserPassword]() API call.

            The regex pattern for this string is made up of the following conditions:

            - Length (?=^.{8,64}$) – Must be between 8 and 64 characters

            AND any 3 of the following password complexity rules required by Active Directory:

            - Numbers and upper case and lowercase (?=.\*\\d)(?=.\*\[A-Z])(?=.\*\[a-z])
            - Numbers and special characters and lower case (?=.\*\\d)(?=.\*\[^A-Za-z0-9\\s])(?=.\*\[a-z])
            - Special characters and upper case and lower case (?=.\*\[^A-Za-z0-9\\s])(?=.\*\[A-Z])(?=.\*\[a-z])
            - Numbers and upper case and special characters (?=.\*\\d)(?=.\*\[A-Z])(?=.\*\[^A-Za-z0-9\\s])

            For additional information about how Active Directory passwords are enforced, see [Password must meet complexity requirements](https://docs.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/password-must-meet-complexity-requirements) on the Microsoft website.
        short-name: The NetBIOS name of the directory, such as `CORP`.
        size: The size of the directory.
        tags: The tags to be assigned to the Simple AD directory.
        vpc-settings: A [DirectoryVpcSettings]() object that contains additional information for the operation.
