name: list-exclusions
description: List exclusions that are generated by the assessment run.
flags:
    --assessment-run-arn=!: The ARN of the assessment run that generated the exclusions that you want to list.
    --max-results=: You can use this parameter to indicate the maximum number of items you want in the response.
    --next-token=: You can use this parameter when paginating results.
documentation:
    command: List exclusions that are generated by the assessment run.
    flag:
        assessment-run-arn: The ARN of the assessment run that generated the exclusions that you want to list.
        max-results: You can use this parameter to indicate the maximum number of items you want in the response. The default value is 100. The maximum value is 500.
        next-token: You can use this parameter when paginating results. Set the value of this parameter to null on your first call to the ListExclusionsRequest action. Subsequent calls to the action fill nextToken in the request with the value of nextToken from the previous response to continue listing data.
