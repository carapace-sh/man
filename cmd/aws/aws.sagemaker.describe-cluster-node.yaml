name: describe-cluster-node
description: Retrieves information of a node (also called a *instance* interchangeably) of a SageMaker HyperPod cluster.
flags:
    --cluster-name=!: The string name or the Amazon Resource Name (ARN) of the SageMaker HyperPod cluster in which the node is.
    --node-id=: The ID of the SageMaker HyperPod cluster node.
    --node-logical-id=: The logical identifier of the node to describe.
documentation:
    command: Retrieves information of a node (also called a *instance* interchangeably) of a SageMaker HyperPod cluster.
    flag:
        cluster-name: The string name or the Amazon Resource Name (ARN) of the SageMaker HyperPod cluster in which the node is.
        node-id: The ID of the SageMaker HyperPod cluster node.
        node-logical-id: The logical identifier of the node to describe. You can specify either `NodeLogicalId` or `InstanceId`, but not both. `NodeLogicalId` can be used to describe nodes that are still being provisioned and don't yet have an `InstanceId` assigned.
