name: list
description: '*(ALPHA)*  Returns the List of Account objects resulting from the List API.'
hidden: true
flags:
    --billing-account=!: ID of the billing-account or fully qualified identifier for the billing-account.
    --page-size=: Some services group resource list output into pages.
    --page-token=: Token that specifies the next page in the list.
documentation:
    command: '*(ALPHA)*  Returns the List of Account objects resulting from the List API.'
    flag:
        billing-account: |-
            ID of the billing-account or fully qualified identifier for the billing-account.
            +
            To set the `billing-account` attribute:
            * provide the argument `--billing-account` on the command line.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is determined by the
            service if it supports paging, otherwise it is *unlimited* (no paging).
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        page-token: Token that specifies the next page in the list.
