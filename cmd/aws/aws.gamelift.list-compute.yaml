name: list-compute
description: |-
    **This API works with the following fleet types:** EC2, Anywhere, Container

    Retrieves information on the compute resources in an Amazon GameLift Servers fleet.
flags:
    --compute-status=: The status of computes in a managed container fleet, based on the success of the latest update deployment.
    --container-group-definition-name=: For computes in a managed container fleet, the name of the deployed container group definition.
    --fleet-id=!: A unique identifier for the fleet to retrieve compute resources for.
    --limit=: The maximum number of results to return.
    --location=: The name of a location to retrieve compute resources for.
    --next-token=: A token that indicates the start of the next sequential page of results.
completion:
    flag:
        compute-status:
            - ACTIVE
            - IMPAIRED
documentation:
    command: |-
        **This API works with the following fleet types:** EC2, Anywhere, Container

        Retrieves information on the compute resources in an Amazon GameLift Servers fleet. Use the pagination parameters to retrieve results in a set of sequential pages.

        **Request options**

        - Retrieve a list of all computes in a fleet. Specify a fleet ID.
        - Retrieve a list of all computes in a specific fleet location. Specify a fleet ID and location.

        **Results**

        If successful, this operation returns information on a set of computes. Depending on the type of fleet, the result includes the following information:

        - For a managed EC2 fleet (compute type `EC2`), this operation returns information about the EC2 instance. Compute names are EC2 instance IDs.
        - For an Anywhere fleet (compute type `ANYWHERE`), this operation returns compute names and details from when the compute was registered with `RegisterCompute`. This includes `GameLiftServiceSdkEndpoint` or `GameLiftAgentEndpoint`.
    flag:
        compute-status: |-
            The status of computes in a managed container fleet, based on the success of the latest update deployment.

            - `ACTIVE` -- The compute is deployed with the correct container definitions. It is ready to process game servers and host game sessions.
            - `IMPAIRED` -- An update deployment to the compute failed, and the compute is deployed with incorrect container definitions.
        container-group-definition-name: For computes in a managed container fleet, the name of the deployed container group definition.
        fleet-id: A unique identifier for the fleet to retrieve compute resources for.
        limit: The maximum number of results to return. Use this parameter with `NextToken` to get results as a set of sequential pages.
        location: 'The name of a location to retrieve compute resources for. For an Amazon GameLift Servers Anywhere fleet, use a custom location. For a managed fleet, provide a Amazon Web Services Region or Local Zone code (for example: `us-west-2` or `us-west-2-lax-1`).'
        next-token: A token that indicates the start of the next sequential page of results. Use the token that is returned with a previous call to this operation. To start at the beginning of the result set, do not specify a value.
