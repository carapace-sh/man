name: describe-metadata-model-children
description: Gets a list of child metadata models for the specified metadata model in the database hierarchy.
flags:
    --marker=: Specifies the unique pagination token that indicates where the next page should start.
    --max-records=: The maximum number of metadata model children to include in the response.
    --migration-project-identifier=!: The migration project name or Amazon Resource Name (ARN).
    --origin=!: Specifies whether to retrieve metadata from the source or target tree.
    --selection-rules=!: The JSON string that specifies which metadata model's children to retrieve.
completion:
    flag:
        origin:
            - SOURCE
            - TARGET
documentation:
    command: Gets a list of child metadata models for the specified metadata model in the database hierarchy.
    flag:
        marker: Specifies the unique pagination token that indicates where the next page should start. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by MaxRecords.
        max-records: The maximum number of metadata model children to include in the response. If more items exist than the specified MaxRecords value, a marker is included in the response so that the remaining results can be retrieved.
        migration-project-identifier: The migration project name or Amazon Resource Name (ARN).
        origin: 'Specifies whether to retrieve metadata from the source or target tree. Valid values: SOURCE | TARGET'
        selection-rules: 'The JSON string that specifies which metadata model''s children to retrieve. Only one selection rule with "rule-action": "explicit" can be provided. For more information, see [Selection Rules](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Tasks.CustomizingTasks.TableMapping.SelectionTransformation.Selections.html) in the DMS User Guide.'
