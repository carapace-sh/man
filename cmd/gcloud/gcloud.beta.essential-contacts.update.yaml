name: update
description: '*(BETA)*  Update an essential contact.'
flags:
    --folder=: folder number where contacts are set.
    --language=: preferred language of contact.
    --notification-categories=: list of notification categories contact is subscribed to.
    --organization=: organization number where contacts are set.
documentation:
    command: |-
        ## EXAMPLES

        To update the notification category subscriptions for the contact with id
        ``123'' in the current project, run:

              $ gcloud beta essential-contacts update 123 --notification-categories=legal,suspension

        To update the language preference for the contact with id ``123'' in the
        folder with id ``456'', run:

              $ gcloud beta essential-contacts update 123 --language=es --folder=456

        To update the notification category subscriptions and language preference for
        the contact with id ``123'' in the organization with id ``456'', run:

              $ gcloud beta essential-contacts update 123 --notification-categories=legal --language=en-US
              --organization=456
    flag:
        folder: folder number where contacts are set. If neither --project, --folder, nor --organization are provided then the config property [core/project] will be used as the resource.
        language: preferred language of contact. Must be a valid ISO 639-1 language code.
        notification-categories: 'list of notification categories contact is subscribed to. _NOTIFICATION_CATEGORIES_ must be one of: *all*, *billing*, *legal*, *notification-category-unspecified*, *product-updates*, *security*, *suspension*, *technical*, *technical-incidents*.'
        organization: organization number where contacts are set. If neither --project, --folder, nor --organization are provided then the config property [core/project] will be used as the resource.
