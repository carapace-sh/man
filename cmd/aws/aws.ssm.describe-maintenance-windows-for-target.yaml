name: describe-maintenance-windows-for-target
description: Retrieves information about the maintenance window targets or tasks that a managed node is associated with.
flags:
    --max-results=: The maximum number of items to return for this call.
    --next-token=: The token for the next set of items to return.
    --resource-type=!: The type of resource you want to retrieve information about.
    --targets=!: The managed node ID or key-value pair to retrieve information about.
completion:
    flag:
        resource-type:
            - INSTANCE
            - RESOURCE_GROUP
documentation:
    command: Retrieves information about the maintenance window targets or tasks that a managed node is associated with.
    flag:
        max-results: The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
        resource-type: The type of resource you want to retrieve information about. For example, `INSTANCE`.
        targets: The managed node ID or key-value pair to retrieve information about.
