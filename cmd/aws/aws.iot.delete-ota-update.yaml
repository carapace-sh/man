name: delete-ota-update
description: Delete an OTA update.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --delete-stream: When true, the stream created by the OTAUpdate process is deleted when the OTA update is deleted.
    --force-delete-aws-job: When true, deletes the IoT job created by the OTAUpdate process even if it is "IN\_PROGRESS".
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-delete-stream: When true, the stream created by the OTAUpdate process is deleted when the OTA update is deleted.
    --no-force-delete-aws-job: When true, deletes the IoT job created by the OTAUpdate process even if it is "IN\_PROGRESS".
    --ota-update-id=!: The ID of the OTA update to delete.
documentation:
    command: |-
        Delete an OTA update.

        Requires permission to access the [DeleteOTAUpdate](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        delete-stream: When true, the stream created by the OTAUpdate process is deleted when the OTA update is deleted. Ignored if the stream specified in the OTAUpdate is supplied by the user.
        force-delete-aws-job: When true, deletes the IoT job created by the OTAUpdate process even if it is "IN\_PROGRESS". Otherwise, if the job is not in a terminal state ("COMPLETED" or "CANCELED") an exception will occur. The default is false.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ota-update-id: The ID of the OTA update to delete.
