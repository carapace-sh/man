name: update-subscriber
description: Updates an existing subscription for the given Amazon Security Lake account ID.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --sources=:
        description: The supported Amazon Web Services services from which logs and events are collected.
        nargs: -1
    --subscriber-description=: The description of the Security Lake account subscriber.
    --subscriber-id=!: A value created by Security Lake that uniquely identifies your subscription.
    --subscriber-identity=: The Amazon Web Services identity used to access your data.
    --subscriber-name=: The name of the Security Lake account subscriber.
documentation:
    command: Updates an existing subscription for the given Amazon Security Lake account ID. You can update a subscriber by changing the sources that the subscriber consumes data from.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        sources: The supported Amazon Web Services services from which logs and events are collected. For the list of supported Amazon Web Services services, see the [Amazon Security Lake User Guide](https://docs.aws.amazon.com/security-lake/latest/userguide/internal-sources.html).
        subscriber-description: The description of the Security Lake account subscriber.
        subscriber-id: A value created by Security Lake that uniquely identifies your subscription.
        subscriber-identity: The Amazon Web Services identity used to access your data.
        subscriber-name: The name of the Security Lake account subscriber.
