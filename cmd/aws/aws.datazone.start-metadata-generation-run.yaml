name: start-metadata-generation-run
description: Starts the metadata generation run.
flags:
    --client-token=: A unique, case-sensitive identifier to ensure idempotency of the request.
    --domain-identifier=!: The ID of the Amazon DataZone domain where you want to start a metadata generation run.
    --owning-project-identifier=!: The ID of the project that owns the asset for which you want to start a metadata generation run.
    --target=!: The asset for which you want to start a metadata generation run.
    --type=!: The type of the metadata generation run.
completion:
    flag:
        type:
            - BUSINESS_DESCRIPTIONS
documentation:
    command: |-
        Starts the metadata generation run.

        Prerequisites:

        - Asset must be created and belong to the specified domain and project.
        - Asset type must be supported for metadata generation (e.g., Amazon Web Services Glue table).
        - Asset must have a structured schema with valid rows and columns.
        - Valid values for --type: BUSINESS\_DESCRIPTIONS, BUSINESS\_NAMES.
        - The user must have permission to run metadata generation in the domain/project.
    flag:
        client-token: A unique, case-sensitive identifier to ensure idempotency of the request. This field is automatically populated if not provided.
        domain-identifier: The ID of the Amazon DataZone domain where you want to start a metadata generation run.
        owning-project-identifier: The ID of the project that owns the asset for which you want to start a metadata generation run.
        target: The asset for which you want to start a metadata generation run.
        type: The type of the metadata generation run.
