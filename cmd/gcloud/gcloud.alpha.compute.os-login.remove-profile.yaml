name: remove-profile
description: '*(ALPHA)*  Remove the posix account information for the current user.'
flags:
    --operating-system=: Specifies the profile type to remove.
completion:
    flag:
        operating-system:
            - linux
            - windows
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute os-login remove-profile* removes the posix account information for the current
        user where the account ID field is set to the current project ID.
        Posix account entries for G Suite users do not set the account ID
        field and can only be modified by a domain administrator.
    flag:
        operating-system: 'Specifies the profile type to remove. _OPERATING_SYSTEM_ must be one of: *linux*, *windows*.'
