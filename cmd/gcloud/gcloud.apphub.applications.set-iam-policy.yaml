name: set-iam-policy
description: Set the IAM policy for an Apphub application as defined in a JSON/YAML file.
flags:
    --location=: The Cloud location for the application.
documentation:
    command: |-
        See https://cloud.google.com/iam/docs/managing-policies for details of
           the policy file format and contents.
    flag:
        location: |-
            The Cloud location for the application.
            +
            To set the `location` attribute:
            * provide the argument `application` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
