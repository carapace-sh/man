name: export
description: '*(BETA)*  Export a cluster.'
flags:
    --destination=: Path to a YAML file where the configuration will be exported.
    --region=: Dataproc region for the cluster.
documentation:
    command: |-
        *(BETA)*  Exports an existing cluster's configuration to a file.
        This configuration can then be used to create new clusters using the import
        command.
    flag:
        destination: |-
            Path to a YAML file where the configuration will be exported.
                      Alternatively, you may omit this flag to write to standard output.
        region: |-
            Dataproc region for the cluster. Each Dataproc region constitutes an independent resource namespace constrained to deploying instances into Compute Engine zones inside the region. Overrides the default `dataproc/region` property value for this command invocation.
            +
            To set the `region` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `dataproc/region`.
