name: list-monitoring-alerts
description: Gets the alerts for a single monitoring schedule.
flags:
    --max-results=: The maximum number of results to display.
    --monitoring-schedule-name=!: The name of a monitoring schedule.
    --next-token=: If the result of the previous `ListMonitoringAlerts` request was truncated, the response includes a `NextToken`.
documentation:
    command: Gets the alerts for a single monitoring schedule.
    flag:
        max-results: The maximum number of results to display. The default is 100.
        monitoring-schedule-name: The name of a monitoring schedule.
        next-token: If the result of the previous `ListMonitoringAlerts` request was truncated, the response includes a `NextToken`. To retrieve the next set of alerts in the history, use the token in the next request.
