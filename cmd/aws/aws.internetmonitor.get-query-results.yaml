name: get-query-results
description: Return the data for a query with the Amazon CloudWatch Internet Monitor query interface.
flags:
    --max-results=: The number of query results that you want to return with this call.
    --monitor-name=!: The name of the monitor to return data for.
    --next-token=: The token for the next set of results.
    --query-id=!: The ID of the query that you want to return data results for.
documentation:
    command: |-
        Return the data for a query with the Amazon CloudWatch Internet Monitor query interface. Specify the query that you want to return results for by providing a `QueryId` and a monitor name.

        For more information about using the query interface, including examples, see [Using the Amazon CloudWatch Internet Monitor query interface](https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-IM-view-cw-tools-cwim-query.html) in the Amazon CloudWatch Internet Monitor User Guide.
    flag:
        max-results: The number of query results that you want to return with this call.
        monitor-name: The name of the monitor to return data for.
        next-token: The token for the next set of results. You receive this token from a previous call.
        query-id: The ID of the query that you want to return data results for. A `QueryId` is an internally-generated identifier for a specific query.
