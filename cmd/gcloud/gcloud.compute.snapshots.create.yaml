name: create
description: Create Compute Engine snapshots.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --chain-name=: Create the new snapshot in the snapshot chain labeled with the specified name.
    --csek-key-file=: Path to a Customer-Supplied Encryption Key (CSEK) key file that maps
    --description=: Text to describe the new snapshot.
    --guest-flush: Create an application-consistent snapshot by informing the OS
    --labels=: List of label KEY=VALUE pairs to add.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-guest-flush&: ""
    --snapshot-type=: Type of snapshot.
    --source-disk-for-recovery-checkpoint-region=: Region of the source disk for recovery checkpoint to operate on.
    --source-disk-for-recovery-checkpoint=: Source disk whose recovery checkpoint used to create the snapshot.
    --source-disk-key-file=: Path to the customer-supplied encryption key of the source disk.
    --source-disk-region=: Region of the source disk to operate on.
    --source-disk-zone=: Zone of the source disk to operate on.
    --source-disk=: Source disk used to create the snapshot.
    --source-instant-snapshot-key-file=: Path to the customer-supplied encryption key of the source instant snapshot.
    --source-instant-snapshot-region=: Region of the source instant snapshot to operate on.
    --source-instant-snapshot-zone=: Zone of the source instant snapshot to operate on.
    --source-instant-snapshot=: The name or URL of the source instant snapshot.
    --storage-location=: Google Cloud Storage location, either regional or multi-regional, where
completion:
    flag:
        snapshot-type:
            - ARCHIVE
            - STANDARD
documentation:
    command: |
        *gcloud compute snapshots create* creates snapshot of persistent disk. Snapshots are useful for
        backing up persistent disk data and for creating custom images.
        For more information, see https://cloud.google.com/compute/docs/disks/create-snapshots.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        chain-name: |-
            Create the new snapshot in the snapshot chain labeled with the specified name.
                      The chain name must be 1-63 characters long and comply with RFC1035.
                      Use this flag only if you are an advanced service owner who needs
                      to create separate snapshot chains, for example, for chargeback tracking.
                      When you describe your snapshot resource, this field is visible only
                      if it has a non-empty value.
        csek-key-file: |-
            Path to a Customer-Supplied Encryption Key (CSEK) key file that maps
            Compute Engine resources to user managed keys to be used when
            creating, mounting, or taking snapshots of disks.
            +
            If you pass `-` as value of the flag, the CSEK is read from stdin.
            See https://cloud.google.com/compute/docs/disks/customer-supplied-encryption for more details.
        description: Text to describe the new snapshot.
        guest-flush: |-
            Create an application-consistent snapshot by informing the OS
            to prepare for the snapshot process. Currently only supported
            for creating snapshots of disks attached to Windows instances.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-guest-flush: |
            Create an application-consistent snapshot by informing the OS
            to prepare for the snapshot process. Currently only supported
            for creating snapshots of disks attached to Windows instances.
        snapshot-type: 'Type of snapshot. If a snapshot type is not specified, a STANDARD snapshot will be created. _SNAPSHOT_TYPE_ must be one of: *ARCHIVE*, *STANDARD*.'
        source-disk: |-
            Source disk used to create the snapshot. To create a snapshot from a source
            disk in a different project, specify the full path to the source disk.
            For example:
            https://www.googleapis.com/compute/v1/projects/MY-PROJECT/zones/MY-ZONE/disks/MY-DISK
        source-disk-for-recovery-checkpoint: |-
            Source disk whose recovery checkpoint used to create the snapshot. To create a snapshot from the recovery
            checkpoint of a source disk in a different project, specify the full path to the source disk.
            For example:
            projects/MY-PROJECT/regions/MY-REGION/disks/MY-DISK
        source-disk-for-recovery-checkpoint-region: Region of the source disk for recovery checkpoint to operate on. Overrides the default *compute/region* property value for this command invocation.
        source-disk-key-file: |-
            Path to the customer-supplied encryption key of the source disk.
            Required if the source disk is protected by a customer-supplied
            encryption key.
        source-disk-region: Region of the source disk to operate on. Overrides the default *compute/region* property value for this command invocation.
        source-disk-zone: Zone of the source disk to operate on. Overrides the default *compute/zone* property value for this command invocation.
        source-instant-snapshot: |-
            The name or URL of the source instant snapshot. If the name is provided, the instant snapshot's zone
            or region must be specified with --source-instant-snapshot-zone or --source-instant-snapshot-region accordingly.
                To create a snapshot from an instant snapshot in a different project, specify the full path to the instant snapshot.
                If the URL is provided, format should be:
                https://www.googleapis.com/compute/v1/projects/MY-PROJECT/zones/MY-ZONE/instantSnapshots/MY-INSTANT-SNAPSHOT
        source-instant-snapshot-key-file: |-
            Path to the customer-supplied encryption key of the source instant snapshot.
            Required if the source instant snapshot is protected by a customer-supplied
            encryption key.
        source-instant-snapshot-region: Region of the source instant snapshot to operate on. Overrides the default *compute/region* property value for this command invocation.
        source-instant-snapshot-zone: Zone of the source instant snapshot to operate on. Overrides the default *compute/zone* property value for this command invocation.
        storage-location: |-
            Google Cloud Storage location, either regional or multi-regional, where
            snapshot content is to be stored. If absent, a nearby regional or
            multi-regional location is chosen automatically.
