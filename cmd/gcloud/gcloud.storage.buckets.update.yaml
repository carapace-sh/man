    --update-labels=: Add or update labels.
    --versioning: Allows you to configure a Cloud Storage bucket to keep old versions of objects.
    --web-error-page=: Cloud Storage allows you to configure a bucket to behave like a static website.
    --web-main-page-suffix=: Cloud Storage allows you to configure a bucket to behave like a static website.
completion:
    flag:
        recovery-point-objective:
            - ASYNC_TURBO
            - DEFAULT
        rpo:
            - ASYNC_TURBO
            - DEFAULT
documentation:
    command: |
        Update the settings for a bucket.
    flag:
        acl-file: Path to a local JSON or YAML formatted file containing a valid policy. See the [ObjectAccessControls resource](https://cloud.google.com/storage/docs/json_api/v1/objectAccessControls) for a representation of JSON formatted files. The output of `gcloud storage [buckets|objects] describe` `--format="multi(acl:format=json)"` is a valid file and can be edited for more fine-grained control.
        add-acl-grant: Key-value pairs mirroring the JSON accepted by your cloud provider. For example, for Cloud Storage,`--add-acl-grant=entity=user-tim@gmail.com,role=OWNER`
        add-default-object-acl-grant: Adds default object ACL grant. See --add-acl-grant help text for more details.
        additional-headers: Includes arbitrary headers in storage API calls. Accepts a comma separated list of key=value pairs, e.g. `header1=value1,header2=value2`. Overrides the default *storage/additional_headers* property value for this command invocation.
        autoclass-terminal-storage-class: The storage class that objects in the bucket eventually transition to if they are not read for a certain length of time. Only valid if Autoclass is enabled.
        canned-acl: 'Applies predefined, or "canned," ACLs to a resource. See docs for a list of predefined ACL constants: https://cloud.google.com/storage/docs/access-control/lists#predefined-acl'
        clear-cors: Clears the bucket's CORS settings.
        clear-default-encryption-key: Clears the bucket's default encryption key.
        clear-ip-filter: Disables and clears IP filter configuration of the bucket.
        clear-labels: Clear all labels associated with a bucket.
        clear-lifecycle: Removes all lifecycle configuration for the bucket.
        clear-log-bucket: Disables usage and storage logging for the bucket specified in the overall update command.
        clear-log-object-prefix: Clears the prefix used to determine the naming of log objects in the logging bucket.
        clear-pap: Unsets the public access prevention setting on a bucket.
        clear-public-access-prevention: Unsets the public access prevention setting on a bucket.
        clear-retention-period: Clears the object retention period for a bucket.
        clear-soft-delete: Clears bucket soft delete settings. Does not affect objects already in soft-deleted state.
        clear-web-error-page: Clear website error page if bucket is hosting website.
        clear-web-main-page-suffix: Clear website main page suffix if bucket is hosting website.
        continue-on-error: If any operations are unsuccessful, the command will exit with a non-zero exit status after completing the remaining operations. This flag takes effect only in sequential execution mode (i.e. processor and thread count are set to 1). Parallelism is default.
        cors-file: |-
            Sets the Cross-Origin Resource Sharing (CORS) configuration on a bucket.
            An example CORS JSON document looks like the following:
            +
              [
                {
                  "origin": ["http://origin1.example.com"],
                  "responseHeader": ["Content-Type"],
                  "method": ["GET"],
                  "maxAgeSeconds": 3600
                }
              ]
            +
            For more information about supported endpoints for CORS, see
            [Cloud Storage CORS support](https://cloud.google.com/storage/docs/cross-origin#server-side-support).
        default-encryption-key: Set the default KMS key for the bucket.
        default-event-based-hold: Sets the default value for an event-based hold on the bucket. By setting the default event-based hold on a bucket, newly-created objects inherit that value as their event-based hold (it is not applied retroactively). Use *--default-event-based-hold* to enable and *--no-default-event-based-hold* to disable.
        default-object-acl-file: Sets the default object ACL from file for the bucket.
        default-storage-class: Sets the default storage class for the bucket.
        enable-autoclass: The Autoclass feature automatically selects the best storage class for objects based on access patterns. Use *--enable-autoclass* to enable and *--no-enable-autoclass* to disable.
        ip-filter-file: |-
            Sets the IP filter for the bucket. The IP filter is a list of ip
            ranges that are allowed to access the bucket. For example,
            The following JSON document shows the IP filter configuration with mode
            enabled and list of public network sources and vpc network sources:
            +
              {
                "mode": "Enabled",
                "publicNetworkSource": { "allowedIpCidrRanges": ["0.0.0.0/0"] },
                "vpcNetworkSources": [
                    {
                        "network": "projects/PROJECT_NAME/global/networks/NETWORK_NAME",
                        "allowedIpCidrRanges": ["0.0.0.0/0"]
                    },
                ]
              }
            +
            For more information about supported configurations, see
            [Cloud Storage bucket IP filtering configurations](https://cloud.google.com/storage/docs/create-ip-filter#ip-filtering-configurations)
        labels-file: |-
            Sets the label configuration for the bucket. An example label JSON document
            looks like the following:
            +
              {
                "your_label_key": "your_label_value",
                "your_other_label_key": "your_other_label_value"
              }
        lifecycle-file: |-
            Sets the lifecycle management configuration on a bucket. For example,
            The following lifecycle management configuration JSON document
            specifies that all objects in this bucket that are more than 365 days
            old are deleted automatically:
            +
              {
                "rule":
                [
                  {
                    "action": {"type": "Delete"},
                    "condition": {"age": 365}
                  }
                ]
              }
        lock-retention-period: 'Locks an unlocked retention policy on the buckets. Caution: A locked retention policy cannot be removed from a bucket or reduced in duration. Once locked, deleting the bucket is the only way to "remove" a retention policy.'
        log-bucket: Enables usage and storage logging for the bucket specified in the overall update command, outputting log files to the bucket specified in this flag. Cloud Storage does not validate the existence of the bucket receiving logs. In addition to enabling logging on your bucket, you also need to grant cloud-storage-analytics@google.com write access to the log bucket.
        log-object-prefix: Specifies a prefix for the names of logs generated in the log bucket. The default prefix is the bucket name. If logging is not enabled, this flag has no effect.
        no-clear-cors: Clears the bucket's CORS settings.
        no-clear-default-encryption-key: Clears the bucket's default encryption key.
        no-clear-ip-filter: Disables and clears IP filter configuration of the bucket.
        no-clear-labels: Clear all labels associated with a bucket.
        no-clear-lifecycle: Removes all lifecycle configuration for the bucket.
        no-clear-log-bucket: Disables usage and storage logging for the bucket specified in the overall update command.
        no-clear-log-object-prefix: Clears the prefix used to determine the naming of log objects in the logging bucket.
        no-clear-public-access-prevention: Unsets the public access prevention setting on a bucket.
        no-clear-retention-period: Clears the object retention period for a bucket.
        no-clear-soft-delete: Clears bucket soft delete settings. Does not affect objects already in soft-deleted state.
        no-clear-web-error-page: Clear website error page if bucket is hosting website.
        no-clear-web-main-page-suffix: Clear website main page suffix if bucket is hosting website.
        no-default-event-based-hold: Sets the default value for an event-based hold on the bucket. By setting the default event-based hold on a bucket, newly-created objects inherit that value as their event-based hold (it is not applied retroactively).
        no-enable-autoclass: The Autoclass feature automatically selects the best storage class for objects based on access patterns.
        no-lock-retention-period: 'Locks an unlocked retention policy on the buckets. Caution: A locked retention policy cannot be removed from a bucket or reduced in duration. Once locked, deleting the bucket is the only way to "remove" a retention policy.'
        no-public-access-prevention: If True, sets [public access prevention](https://cloud.google.com/storage/docs/public-access-prevention) to "enforced". If False, sets public access prevention to "inherited".
        no-read-paths-from-stdin: Read the list of URLs from stdin.
        no-requester-pays: Allows you to configure a Cloud Storage bucket so that the requester pays all costs related to accessing the bucket and its objects.
        no-uniform-bucket-level-access: Enables or disables [uniform bucket-level access](https://cloud.google.com/storage/docs/bucket-policy-only) for the buckets.
        no-versioning: Allows you to configure a Cloud Storage bucket to keep old versions of objects.
        pap: If True, sets [public access prevention](https://cloud.google.com/storage/docs/public-access-prevention) to "enforced". If False, sets public access prevention to "inherited". Use *--public-access-prevention* to enable and *--no-public-access-prevention* to disable.
        predefined-acl: 'Applies predefined, or "canned," ACLs to a resource. See docs for a list of predefined ACL constants: https://cloud.google.com/storage/docs/access-control/lists#predefined-acl'
        predefined-default-object-acl: Apply a predefined set of default object access controls tobuckets
        public-access-prevention: If True, sets [public access prevention](https://cloud.google.com/storage/docs/public-access-prevention) to "enforced". If False, sets public access prevention to "inherited". Use *--public-access-prevention* to enable and *--no-public-access-prevention* to disable.
        read-paths-from-stdin: Read the list of URLs from stdin.
        recovery-point-objective: 'Sets the [recovery point objective](https://cloud.google.com/architecture/dr-scenarios-planning-guide#basics_of_dr_planning) of a bucket. This flag can only be used with multi-region and dual-region buckets. `DEFAULT` option is valid for multi-region and dual-regions buckets. `ASYNC_TURBO` option is only valid for dual-region buckets. If unspecified when the bucket is created, it defaults to `DEFAULT` for dual-region and multi-region buckets. For more information, see [replication in Cloud Storage](https://cloud.google.com/storage/docs/availability-durability#cross-region-redundancy). _SETTING_ must be one of: *ASYNC_TURBO*, *DEFAULT*.'
        remove-acl-grant: Key-value pairs mirroring the JSON accepted by your cloud provider. For example, for Cloud Storage, `--remove-acl-grant=ENTITY`, where `ENTITY` has a valid ACL entity format, such as `user-tim@gmail.com`, `group-admins`, `allUsers`, etc.
        remove-default-object-acl-grant: Removes default object ACL grant. See --remove-acl-grant help text for more details.
        remove-labels: Remove labels by their key names.
        requester-pays: Allows you to configure a Cloud Storage bucket so that the requester pays all costs related to accessing the bucket and its objects. Use *--requester-pays* to enable and *--no-requester-pays* to disable.
        retention-period: Minimum [retention period](https://cloud.google.com/storage/docs/bucket-lock#retention-periods) for objects stored in the bucket, for example ``--retention-period=P1Y1M1DT5S''. Objects added to the bucket cannot be deleted until they've been stored for the specified length of time. Default is no retention period. Only available for Cloud Storage using the JSON API.
        rpo: 'Sets the [recovery point objective](https://cloud.google.com/architecture/dr-scenarios-planning-guide#basics_of_dr_planning) of a bucket. This flag can only be used with multi-region and dual-region buckets. `DEFAULT` option is valid for multi-region and dual-regions buckets. `ASYNC_TURBO` option is only valid for dual-region buckets. If unspecified when the bucket is created, it defaults to `DEFAULT` for dual-region and multi-region buckets. For more information, see [replication in Cloud Storage](https://cloud.google.com/storage/docs/availability-durability#cross-region-redundancy). _SETTING_ must be one of: *ASYNC_TURBO*, *DEFAULT*.'
        soft-delete-duration: Duration to retain soft-deleted objects. For example, "2w1d" is two weeks and one day.
        uniform-bucket-level-access: Enables or disables [uniform bucket-level access](https://cloud.google.com/storage/docs/bucket-policy-only) for the buckets. Use *--uniform-bucket-level-access* to enable and *--no-uniform-bucket-level-access* to disable.
        update-labels: 'Add or update labels. Example: --update-labels=key1=value1,key2=value2'
        versioning: Allows you to configure a Cloud Storage bucket to keep old versions of objects. Use *--versioning* to enable and *--no-versioning* to disable.
        web-error-page: Cloud Storage allows you to configure a bucket to behave like a static website. A subsequent GET bucket request through a custom domain for a non-existent object serves the specified error page instead of the standard Cloud Storage error.
        web-main-page-suffix: Cloud Storage allows you to configure a bucket to behave like a static website. A subsequent GET bucket request through a custom domain serves the specified "main" page instead of performing the usual bucket listing.
