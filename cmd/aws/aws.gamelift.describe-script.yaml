name: describe-script
description: |-
    **This API works with the following fleet types:** EC2

    Retrieves properties for a Realtime script.
flags:
    --script-id=!: A unique identifier for the Realtime script to retrieve properties for.
documentation:
    command: |-
        **This API works with the following fleet types:** EC2

        Retrieves properties for a Realtime script.

        To request a script record, specify the script ID. If successful, an object containing the script properties is returned.

        **Learn more**

        [Amazon GameLift Servers Amazon GameLift Servers Realtime](https://docs.aws.amazon.com/gamelift/latest/developerguide/realtime-intro.html)

        **Related actions**

        [All APIs by task](https://docs.aws.amazon.com/gamelift/latest/developerguide/reference-awssdk.html#reference-awssdk-resources-fleets)
    flag:
        script-id: A unique identifier for the Realtime script to retrieve properties for. You can use either the script ID or ARN value.
