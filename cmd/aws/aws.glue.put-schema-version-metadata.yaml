name: put-schema-version-metadata
description: Puts the metadata key value pair for a specified schema version ID.
flags:
    --metadata-key-value=!: The metadata key's corresponding value.
    --schema-id=: The unique ID for the schema.
    --schema-version-id=: The unique version ID of the schema version.
    --schema-version-number=: The version number of the schema.
documentation:
    command: Puts the metadata key value pair for a specified schema version ID. A maximum of 10 key value pairs will be allowed per schema version. They can be added over one or more calls.
    flag:
        metadata-key-value: The metadata key's corresponding value.
        schema-id: The unique ID for the schema.
        schema-version-id: The unique version ID of the schema version.
        schema-version-number: The version number of the schema.
