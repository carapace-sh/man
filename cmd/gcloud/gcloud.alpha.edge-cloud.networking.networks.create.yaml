    --no-async&: Return immediately, without waiting for the operation in progress to
    --zone=: The name of the Google Distributed Cloud Edge zone.
documentation:
    command: |
        *(ALPHA)*  Create a new Distributed Cloud Edge Network network resource.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: An optional, textual description for the network.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The global location name.
            +
            To set the `location` attribute:
            * provide the argument `network` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        mtu: |-
            Maximum transmission unit (MTU) is the size of the largest
            IP packet that can be transmitted on this network. Default value
            is 1500 bytes, and the valid values are 1500 and 9000.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        zone: |-
            The name of the Google Distributed Cloud Edge zone.
            +
            To set the `zone` attribute:
            * provide the argument `network` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line.
