name: test
description: '*(BETA)*  Tests message transforms against a given message.'
flags:
    --attribute=: Comma-separated list of attributes to attach to the message.
    --message-transforms-file=: Path to YAML or JSON file containing message transforms.
    --message=: Message body to test the message transforms against.
    --subscription=!: ID of the subscription or fully qualified identifier for the subscription.
    --topic-project=: Project ID of the Google Cloud project for the topic.
    --topic=!: ID of the topic or fully qualified identifier for the topic.
documentation:
    command: '*(BETA)*  Tests message transforms against a given message.'
    flag:
        attribute: Comma-separated list of attributes to attach to the message. Each ATTRIBUTE has the form name="value". You can specify up to 100 attributes.
        message: Message body to test the message transforms against.
        message-transforms-file: Path to YAML or JSON file containing message transforms.
        subscription: |-
            ID of the subscription or fully qualified identifier for the subscription.
            +
            To set the `subscription` attribute:
            * provide the argument `--subscription` on the command line.
        topic: |-
            ID of the topic or fully qualified identifier for the topic.
            +
            To set the `topic` attribute:
            * provide the argument `--topic` on the command line.
        topic-project: |-
            Project ID of the Google Cloud project for the topic.
            +
            To set the `project` attribute:
            * provide the argument `--topic` on the command line with a fully specified name;
            * provide the argument `--topic-project` on the command line;
            * provide the argument `--project` on the command line;
            * set the property `core/project`.
