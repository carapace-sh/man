name: list-branches
description: Lists the branches of an Amplify app.
flags:
    --app-id=!: The unique ID for an Amplify app.
    --max-results=: The maximum number of records to list in a single response.
    --next-token=: A pagination token.
documentation:
    command: Lists the branches of an Amplify app.
    flag:
        app-id: The unique ID for an Amplify app.
        max-results: The maximum number of records to list in a single response.
        next-token: A pagination token. Set to null to start listing branches from the start. If a non-null pagination token is returned in a result, pass its value in here to list more branches.
