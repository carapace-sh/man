name: describe-domain-change-progress
description: Returns information about the current blue/green deployment happening on an Amazon OpenSearch Service domain.
flags:
    --change-id=: The specific change ID for which you want to get progress information.
    --domain-name=!: The name of the domain to get progress information for.
documentation:
    command: Returns information about the current blue/green deployment happening on an Amazon OpenSearch Service domain. For more information, see [Making configuration changes in Amazon OpenSearch Service](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/managedomains-configuration-changes.html).
    flag:
        change-id: The specific change ID for which you want to get progress information. If omitted, the request returns information about the most recent configuration change.
        domain-name: The name of the domain to get progress information for.
