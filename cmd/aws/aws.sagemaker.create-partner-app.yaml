name: create-partner-app
description: Creates an Amazon SageMaker Partner AI App.
flags:
    --application-config=: Configuration settings for the SageMaker Partner AI App.
    --auth-type=!: The authorization type that users use to access the SageMaker Partner AI App.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique token that guarantees that the call to this API is idempotent.
    --enable-auto-minor-version-upgrade: When set to `TRUE`, the SageMaker Partner AI App is automatically upgraded to the latest minor version during the next scheduled maintenance window, if one is available.
    --enable-iam-session-based-identity: When set to `TRUE`, the SageMaker Partner AI App sets the Amazon Web Services IAM session name or the authenticated IAM user as the identity of the SageMaker Partner AI App user.
    --execution-role-arn=!: The ARN of the IAM role that the partner application uses.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --kms-key-id=: SageMaker Partner AI Apps uses Amazon Web Services KMS to encrypt data at rest using an Amazon Web Services managed key by default.
    --maintenance-config=: Maintenance configuration settings for the SageMaker Partner AI App.
    --name=!: The name to give the SageMaker Partner AI App.
    --no-enable-auto-minor-version-upgrade: When set to `TRUE`, the SageMaker Partner AI App is automatically upgraded to the latest minor version during the next scheduled maintenance window, if one is available.
    --no-enable-iam-session-based-identity: When set to `TRUE`, the SageMaker Partner AI App sets the Amazon Web Services IAM session name or the authenticated IAM user as the identity of the SageMaker Partner AI App user.
    --tags=: Each tag consists of a key and an optional value.
    --tier=!: Indicates the instance type and size of the cluster attached to the SageMaker Partner AI App.
    --type=!: The type of SageMaker Partner AI App to create.
completion:
    flag:
        auth-type:
            - IAM
        type:
            - lakera-guard
            - comet
            - deepchecks-llm-evaluation
            - fiddler
documentation:
    command: Creates an Amazon SageMaker Partner AI App.
    flag:
        application-config: Configuration settings for the SageMaker Partner AI App.
        auth-type: The authorization type that users use to access the SageMaker Partner AI App.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique token that guarantees that the call to this API is idempotent.
        enable-auto-minor-version-upgrade: When set to `TRUE`, the SageMaker Partner AI App is automatically upgraded to the latest minor version during the next scheduled maintenance window, if one is available. Default is `FALSE`.
        enable-iam-session-based-identity: When set to `TRUE`, the SageMaker Partner AI App sets the Amazon Web Services IAM session name or the authenticated IAM user as the identity of the SageMaker Partner AI App user.
        execution-role-arn: The ARN of the IAM role that the partner application uses.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        kms-key-id: SageMaker Partner AI Apps uses Amazon Web Services KMS to encrypt data at rest using an Amazon Web Services managed key by default. For more control, specify a customer managed key.
        maintenance-config: Maintenance configuration settings for the SageMaker Partner AI App.
        name: The name to give the SageMaker Partner AI App.
        tags: Each tag consists of a key and an optional value. Tag keys must be unique per resource.
        tier: Indicates the instance type and size of the cluster attached to the SageMaker Partner AI App.
        type: 'The type of SageMaker Partner AI App to create. Must be one of the following: `lakera-guard`, `comet`, `deepchecks-llm-evaluation`, or `fiddler`.'
