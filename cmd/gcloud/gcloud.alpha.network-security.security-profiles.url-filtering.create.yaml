name: create
description: '*(ALPHA)*  Create a new URL Filtering Profile.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: Brief description of the security profile
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: location of the security_profile - Global.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --organization=: Organization ID to which the changes should apply.
documentation:
    command: |4+
        *(ALPHA)*  Create a new URL Filtering Security Profile.

    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *False*.
        description: Brief description of the security profile
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            location of the security_profile - Global.
            +
            To set the `location` attribute:
            * provide the argument `security_profile` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        organization: |-
            Organization ID to which the changes should apply.
            +
            To set the `organization` attribute:
            * provide the argument `security_profile` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
