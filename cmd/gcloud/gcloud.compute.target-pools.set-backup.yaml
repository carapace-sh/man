name: set-backup
description: Set a backup pool for a target pool.
flags:
    --backup-pool=: Name of the target pool that will serve as backup.
    --failover-ratio=: The new failover ratio value for the target pool.
    --no-backup-pool: Unsets the backup pool.
    --region=: Region of the target pool to set a backup pool for.
documentation:
    command: |-
        *gcloud compute target-pools set-backup* is used to set a backup target pool for a primary
        target pool, which defines the fallback behavior of the primary
        pool. If the ratio of the healthy instances in the primary pool
        is at or below the specified ``--failover-ratio value'', then traffic
        arriving at the load-balanced IP address will be directed to the
        backup pool.

        ## EXAMPLES
        To cause `TARGET-POOL` (in region `us-central1`) to fail over
        to `BACKUP-POOL` when more than half of the `TARGET-POOL`
        instances are unhealthy, run:

          $ gcloud compute target-pools set-backup TARGET-POOL --backup-pool=BACKUP-POOL --failover-ratio=0.5 --region=us-central1

        To remove `BACKUP-POOL` as a backup to `TARGET-POOL`, run:

          $ gcloud compute target-pools set-backup TARGET-POOL --backup-pool='' --region=us-central1
    flag:
        backup-pool: Name of the target pool that will serve as backup.
        failover-ratio: The new failover ratio value for the target pool. This must be a float in the range of [0, 1].
        no-backup-pool: Unsets the backup pool. This disables failover.
        region: |-
            Region of the target pool to set a backup pool for. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
