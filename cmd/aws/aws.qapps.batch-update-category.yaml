name: batch-update-category
description: Updates Categories for the Amazon Q Business application environment instance.
flags:
    --categories=!: The list of categories to be updated with their new values.
    --instance-id=!: The unique identifier of the Amazon Q Business application environment instance.
documentation:
    command: Updates Categories for the Amazon Q Business application environment instance. Web experience users use Categories to tag and filter library items. For more information, see [Custom labels for Amazon Q Apps](https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/qapps-custom-labels.html).
    flag:
        categories: The list of categories to be updated with their new values.
        instance-id: The unique identifier of the Amazon Q Business application environment instance.
