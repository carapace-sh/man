name: update
description: Update an IAM custom role.
flags:
    --add-permissions=: The permissions you want to add to the role.
    --description=: The description of the role you want to update.
    --file=: The YAML file you want to use to update a role.
    --organization=: Organization of the role you want to update.
    --permissions=: The permissions of the role you want to set.
    --remove-permissions=: The permissions you want to remove from the role.
    --stage=: The state of the role you want to update.
    --title=: The title of the role you want to update.
documentation:
    command: This command updates an IAM custom role.
    flag:
        add-permissions: The permissions you want to add to the role. Use commas to separate them.
        description: The description of the role you want to update.
        file: The YAML file you want to use to update a role. Can not be specified with other flags except role-id.
        organization: Organization of the role you want to update.
        permissions: The permissions of the role you want to set. Use commas to separate them.
        remove-permissions: The permissions you want to remove from the role. Use commas to separate them.
        stage: The state of the role you want to update.
        title: The title of the role you want to update.
