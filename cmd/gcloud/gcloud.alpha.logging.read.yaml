name: read
description: '*(ALPHA)*  Read log entries.'
flags:
    --billing-account=: Billing account of the log entries to read.
    --bucket=!: Id of the log bucket.
    --folder=: Folder of the log entries to read.
    --freshness=: Return entries that are not older than this value.
    --limit=: Maximum number of resources to list.
    --location=!: Location of the log bucket.
    --order=: Ordering of returned log entries based on timestamp field.
    --organization=: Organization of the log entries to read.
    --resource-names=: Resource name(s) to read logs from.
    --view=!: Id of the view.
completion:
    flag:
        order:
            - desc
            - asc
documentation:
    command: |
        *(ALPHA)*  gcloud alpha logging read reads log entries.  Log entries matching *log-filter* are
        returned in order of decreasing timestamps, most-recent entries first.
        If the log entries come from multiple logs, then entries from different
        logs might be intermingled in the results.
    flag:
        billing-account: Billing account of the log entries to read.
        bucket: Id of the log bucket. If this argument is provided then `--location` and `--view` must also be specified.
        folder: Folder of the log entries to read.
        freshness: Return entries that are not older than this value. Works only with DESC ordering and filters without a timestamp. See $ gcloud topic datetimes for information on duration formats.
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        location: Location of the log bucket. If this argument is provided then `--bucket` and `--view` must also be specified.
        order: 'Ordering of returned log entries based on timestamp field. _ORDER_ must be one of: *desc*, *asc*.'
        organization: Organization of the log entries to read.
        resource-names: Resource name(s) to read logs from. A resource can either be an top-level resource (e.g., "projects/my-project") or a full log view resource path (e.g., "projects/my-project/locations/my-location/buckets/my-bucket/views/my-view"). Multiple resources can be specified, separated by a comma.
        view: Id of the view. If this argument is provided then `--location` and `--bucket` must also be specified.
