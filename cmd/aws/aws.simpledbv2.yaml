# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: simpledbv2
description: Amazon SimpleDB v2
commands:
    - name: get-export
      description: Returns information for an existing domain export.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --export-arn=!: Unique ARN identifier of the export.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
      documentation:
        command: Returns information for an existing domain export.
        flag:
            cli-input-json: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            cli-input-yaml: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            export-arn: Unique ARN identifier of the export.
            generate-cli-skeleton: |-
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
    - name: list-exports
      description: Lists all exports that were created.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --domain-name=: The name of the domain to filter exports.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --max-items=: The  total number of items to return in the command's output.
        --max-results=: The maximum number of exports to return in a single response.
        --next-token=: A pagination token used to retrieve the next page of results.
        --page-size=: The size of each page to get in the AWS service call.
        --starting-token=: A token to specify where to start paginating.
      documentation:
        command: Lists all exports that were created. The results are paginated and can be filtered by domain name.
        flag:
            cli-input-json: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            cli-input-yaml: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            domain-name: The name of the domain to filter exports. If not provided, exports for all the domains will be listed.
            generate-cli-skeleton: |-
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            max-items: |-
                The total number of items to return in the command's output.
                If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
                To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
                Do not use the NextToken response element directly outside of the AWS CLI.

                For usage examples, see Pagination in the AWS Command Line Interface User Guide.
            max-results: The maximum number of exports to return in a single response.
            next-token: A pagination token used to retrieve the next page of results. This token is obtained from the nextToken field in the previous ListExportsResponse. Leave empty for the first request.
            page-size: |-
                The size of each page to get in the AWS service call.
                This does not affect the number of items returned in the command's output.
                Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
                This can help prevent the AWS service calls from timing out.

                For usage examples, see Pagination in the AWS Command Line Interface User Guide.
            starting-token: |-
                A token to specify where to start paginating.
                This is the NextToken from a previously truncated response.

                For usage examples, see Pagination in the AWS Command Line Interface User Guide.
    - name: start-domain-export
      description: Initiates the export of a SimpleDB domain to an S3 bucket.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: Providing a ClientToken makes the call to StartDomainExport API idempotent, meaning that multiple identical calls have the same effect as one single call.
        --domain-name=!: The name of the domain to export.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --s3-bucket-owner=: The ID of the AWS account that owns the bucket the export will be stored in.
        --s3-bucket=!: The name of the S3 bucket where the domain data will be exported.
        --s3-key-prefix=: The prefix string to be used to generate the S3 object keys for export artifacts.
        --s3-sse-algorithm=: The server-side encryption algorithm to use for the exported data in S3.
        --s3-sse-kms-key-id=: The KMS key ID to use for server-side encryption with AWS KMS-managed keys (SSE-KMS).
      completion:
        flag:
            s3-sse-algorithm:
                - AES256
                - KMS
      documentation:
        command: Initiates the export of a SimpleDB domain to an S3 bucket.
        flag:
            cli-input-json: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            cli-input-yaml: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            client-token: Providing a ClientToken makes the call to StartDomainExport API idempotent, meaning that multiple identical calls have the same effect as one single call. A client token is valid for 8 hours after the first request that uses it is completed. After 8 hours, any request with the same client token is treated as a new request. Do not resubmit the same request with the same client token for more than 8 hours, or the result might not be idempotent. If you submit a request with the same client token but a change in other parameters within the 8-hour idempotency window, a ConflictException will be returned.
            domain-name: The name of the domain to export.
            generate-cli-skeleton: |-
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            s3-bucket: The name of the S3 bucket where the domain data will be exported.
            s3-bucket-owner: The ID of the AWS account that owns the bucket the export will be stored in.
            s3-key-prefix: The prefix string to be used to generate the S3 object keys for export artifacts.
            s3-sse-algorithm: 'The server-side encryption algorithm to use for the exported data in S3. Valid values are: AES256 (SSE-S3) and KMS (SSE-KMS). If not specified, bucket''s default encryption will apply.'
            s3-sse-kms-key-id: The KMS key ID to use for server-side encryption with AWS KMS-managed keys (SSE-KMS). This parameter is only expected with KMS as the S3 SSE algorithm.
    - name: wait
      description: Wait  until  a particular condition is satisfied.
      commands:
        - name: export-succeeded
          description: Returns information for an existing domain export.
          flags:
            --cli-input-json=: Read arguments from the JSON string provided.
            --cli-input-yaml=: Read arguments from the YAML string provided.
            --export-arn=!: Unique ARN identifier of the export.
            --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
          documentation:
            command: Returns information for an existing domain export.
            flag:
                cli-input-json: |-
                    Reads arguments from the JSON string provided.
                    The JSON string follows the  format  provided  by --generate-cli-skeleton.
                    If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                    It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                    This may  not  be  specified  along with --cli-input-yaml.
                cli-input-yaml: |-
                    Reads arguments from the JSON string provided.
                    The JSON string follows the  format  provided  by --generate-cli-skeleton.
                    If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                    It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                    This may  not  be  specified  along with --cli-input-yaml.
                export-arn: Unique ARN identifier of the export.
                generate-cli-skeleton: |-
                    If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                    This may  not  be  specified  along with --cli-input-yaml.
documentation:
    command: "Amazon SimpleDB is a web service providing the core database functions of data indexing and querying in the cloud. By offloading the time and effort associated with building and operating a web-scale database, SimpleDB provides developers the freedom to focus on application development.\n\n```\n A traditional, clustered relational database requires a sizable upfront capital outlay, is complex to design, and often requires extensive and repetitive database administration. Amazon SimpleDB is dramatically simpler, requiring no schema, automatically indexing your data and providing a simple API for storage and access. This approach eliminates the administrative burden of data modeling, index maintenance, and performance tuning. Developers gain access to this functionality within Amazon's proven computing environment, are able to scale instantly, and pay only for what they use. \n```"
