name: describe-scaling-plans
description: Describes one or more of your scaling plans.
flags:
    --application-sources=: The sources for the applications (up to 10).
    --max-results=: The maximum number of scalable resources to return.
    --next-token=: The token for the next set of results.
    --scaling-plan-names=: The names of the scaling plans (up to 10).
    --scaling-plan-version=: The version number of the scaling plan.
documentation:
    command: Describes one or more of your scaling plans.
    flag:
        application-sources: The sources for the applications (up to 10). If you specify scaling plan names, you cannot specify application sources.
        max-results: The maximum number of scalable resources to return. This value can be between 1 and 50. The default value is 50.
        next-token: The token for the next set of results.
        scaling-plan-names: The names of the scaling plans (up to 10). If you specify application sources, you cannot specify scaling plan names.
        scaling-plan-version: |-
            The version number of the scaling plan. Currently, the only valid value is `1`.

            If you specify a scaling plan version, you must also specify a scaling plan name.
