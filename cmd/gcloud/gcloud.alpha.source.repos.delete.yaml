name: delete
description: '*(ALPHA)*  Delete a cloud source repository.'
flags:
    --force: (REMOVED) If provided, skip the delete confirmation prompt.
    --no-force&: (REMOVED) If provided, skip the delete confirmation prompt.
documentation:
    command: |-
        *(ALPHA)*  This command deletes a named git repository from the currently
        active Google Cloud Platform project.

        ## EXAMPLES

        To delete a named repository in the current project issue the
        following commands:

          $ gcloud init

          $ gcloud alpha source repos delete REPOSITORY_NAME
    flag:
        force: |-
            (REMOVED) If provided, skip the delete confirmation prompt.
            +
            The --force option has been removed; use --quiet to suppress prompting.
        no-force: |-
            (REMOVED) If provided, skip the delete confirmation prompt.
            +
            The --force option has been removed; use --quiet to suppress prompting.
