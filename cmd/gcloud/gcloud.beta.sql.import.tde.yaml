name: tde
description: '*(BETA)*  Import TDE certificate into a Cloud SQL for SQL Server instance.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --cert-path=!: Path to the encryption certificate file in Google Cloud Storage.
    --certificate=!: Name of the encryption certificate.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-prompt-for-pvk-password&: Prompt for the private key password associated with the certificate file with character echo disabled.
    --prompt-for-pvk-password: Prompt for the private key password associated with the certificate file with character echo disabled.
    --pvk-password=: The private key password associated with the certificate file.
    --pvk-path=!: Path to the encryption private key file in Google Cloud Storage.
documentation:
    command: |
        *(BETA)*  gcloud beta sql import tde imports a TDE certificate into a Cloud SQL instance from a certificate file
        in Google Cloud Storage.

        For detailed help on importing data into Cloud SQL, refer to this
        guide: https://cloud.google.com/sql/docs/sqlserver/import-export/importing
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        cert-path: Path to the encryption certificate file in Google Cloud Storage. The URI is in the form `gs://bucketName/fileName`.
        certificate: Name of the encryption certificate.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-prompt-for-pvk-password: Prompt for the private key password associated with the certificate file with character echo disabled. The password is all typed characters up to but not including the RETURN or ENTER key.
        prompt-for-pvk-password: Prompt for the private key password associated with the certificate file with character echo disabled. The password is all typed characters up to but not including the RETURN or ENTER key.
        pvk-password: The private key password associated with the certificate file.
        pvk-path: Path to the encryption private key file in Google Cloud Storage. The URI is in the form `gs://bucketName/fileName`.
