name: get-device-position
description: Retrieves a device's most recent position according to its sample time.
flags:
    --device-id=!: The device whose position you want to retrieve.
    --tracker-name=!: The tracker resource receiving the position update.
documentation:
    command: |-
        Retrieves a device's most recent position according to its sample time.

        Device positions are deleted after 30 days.
    flag:
        device-id: The device whose position you want to retrieve.
        tracker-name: The tracker resource receiving the position update.
