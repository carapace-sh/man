name: delete-related-item
description: Deletes the related item resource under a case.
flags:
    --case-id=!: A unique identifier of the case.
    --domain-id=!: A unique identifier of the Cases domain.
    --related-item-id=!: A unique identifier of a related item.
documentation:
    command: |-
        Deletes the related item resource under a case.

        This API cannot be used on a FILE type related attachment. To delete this type of file, use the [DeleteAttachedFile](https://docs.aws.amazon.com/connect/latest/APIReference/API_DeleteAttachedFile.html) API
    flag:
        case-id: A unique identifier of the case.
        domain-id: A unique identifier of the Cases domain.
        related-item-id: A unique identifier of a related item.
