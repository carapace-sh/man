name: list-channel-messages
description: List all the messages in a channel.
flags:
    --channel-arn=!: The ARN of the channel.
    --chime-bearer=!: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
    --max-results=: The maximum number of messages that you want returned.
    --next-token=: The token passed by previous API calls until all requested messages are returned.
    --not-after=: The final or ending time stamp for your requested messages.
    --not-before=: The initial or starting time stamp for your requested messages.
    --sort-order=: The order in which you want messages sorted.
    --sub-channel-id=: The ID of the SubChannel in the request.
completion:
    flag:
        sort-order:
            - ASCENDING
            - DESCENDING
documentation:
    command: |-
        List all the messages in a channel. Returns a paginated list of `ChannelMessages`. By default, sorted by creation timestamp in descending order.

        Redacted messages appear in the results as empty, since they are only redacted, not deleted. Deleted messages do not appear in the results. This action always returns the latest version of an edited message.

        Also, the `x-amz-chime-bearer` request header is mandatory. Use the ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call as the value in the header.
    flag:
        channel-arn: The ARN of the channel.
        chime-bearer: The ARN of the `AppInstanceUser` or `AppInstanceBot` that makes the API call.
        max-results: The maximum number of messages that you want returned.
        next-token: The token passed by previous API calls until all requested messages are returned.
        not-after: The final or ending time stamp for your requested messages.
        not-before: The initial or starting time stamp for your requested messages.
        sort-order: The order in which you want messages sorted. Default is Descending, based on time created.
        sub-channel-id: |-
            The ID of the SubChannel in the request.

            Only required when listing the messages in a SubChannel that the user belongs to.
