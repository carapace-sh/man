name: put-anomaly-detector
description: Creates an anomaly detection model for a CloudWatch metric.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration=: The configuration specifies details about how the anomaly detection model is to be trained, including time ranges to exclude when training and updating the model.
    --dimensions=:
        description: The metric dimensions to create the anomaly detection model for.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --metric-characteristics=: Use this object to include parameters to provide information about your metric to CloudWatch to help it build more accurate anomaly detection models.
    --metric-math-anomaly-detector=: The metric math anomaly detector to be created.
    --metric-name=: The name of the metric to create the anomaly detection model for.
    --namespace=: The namespace of the metric to create the anomaly detection model for.
    --single-metric-anomaly-detector=: A single metric anomaly detector to be created.
    --stat=: The statistic to use for the metric and the anomaly detection model.
documentation:
    command: |-
        Creates an anomaly detection model for a CloudWatch metric. You can use the model to display a band of expected normal values when the metric is graphed.

        If you have enabled unified cross-account observability, and this account is a monitoring account, the metric can be in the same account or a source account. You can specify the account ID in the object you specify in the `SingleMetricAnomalyDetector` parameter.

        For more information, see [CloudWatch Anomaly Detection](https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Anomaly_Detection.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration: |-
            The configuration specifies details about how the anomaly detection model is to be trained, including time ranges to exclude when training and updating the model. You can specify as many as 10 time ranges.

            The configuration can also include the time zone to use for the metric.
        dimensions: The metric dimensions to create the anomaly detection model for.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        metric-characteristics: Use this object to include parameters to provide information about your metric to CloudWatch to help it build more accurate anomaly detection models. Currently, it includes the `PeriodicSpikes` parameter.
        metric-math-anomaly-detector: |-
            The metric math anomaly detector to be created.

            When using `MetricMathAnomalyDetector`, you cannot include the following parameters in the same operation:

            - `Dimensions`
            - `MetricName`
            - `Namespace`
            - `Stat`
            - the `SingleMetricAnomalyDetector` parameters of `PutAnomalyDetectorInput`

            Instead, specify the metric math anomaly detector attributes as part of the property `MetricMathAnomalyDetector`.
        metric-name: The name of the metric to create the anomaly detection model for.
        namespace: The namespace of the metric to create the anomaly detection model for.
        single-metric-anomaly-detector: |-
            A single metric anomaly detector to be created.

            When using `SingleMetricAnomalyDetector`, you cannot include the following parameters in the same operation:

            - `Dimensions`
            - `MetricName`
            - `Namespace`
            - `Stat`
            - the `MetricMathAnomalyDetector` parameters of `PutAnomalyDetectorInput`

            Instead, specify the single metric anomaly detector attributes as part of the property `SingleMetricAnomalyDetector`.
        stat: The statistic to use for the metric and the anomaly detection model.
