name: update-application-version
description: Updates the specified application version to have the specified properties.
flags:
    --application-name=!: The name of the application associated with this version.
    --description=: A new description for this version.
    --version-label=!: The name of the version to update.
documentation:
    command: |-
        Updates the specified application version to have the specified properties.

        If a property (for example, `description`) is not provided, the value remains unchanged. To clear properties, specify an empty string.
    flag:
        application-name: |-
            The name of the application associated with this version.

            If no application is found with this name, `UpdateApplication` returns an `InvalidParameterValue` error.
        description: A new description for this version.
        version-label: |-
            The name of the version to update.

            If no application version is found with this label, `UpdateApplication` returns an `InvalidParameterValue` error.
