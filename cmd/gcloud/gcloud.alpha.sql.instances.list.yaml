name: list
description: '*(ALPHA)*  Lists Cloud SQL instances in a given project.'
flags:
    --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
    --limit=: Maximum number of resources to list.
    --no-show-edition&: Show the edition field.
    --no-show-sql-network-architecture&: Show the instance's current SqlNetworkArchitecture backend in addition
    --no-show-transactional-log-storage-state&: Show the storage location of the transactional logs used for point-in-time recovery (PITR) by the instance.
    --no-uri&: Print a list of resource URIs instead of the default output, and change the
    --page-size=: Some services group resource list output into pages.
    --show-edition: Show the edition field.
    --show-sql-network-architecture: Show the instance's current SqlNetworkArchitecture backend in addition
    --show-transactional-log-storage-state: Show the storage location of the transactional logs used for point-in-time recovery (PITR) by the instance.
