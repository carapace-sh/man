name: enable
description: '*(BETA)*  Enable domain migration permissions on a Managed Microsoft AD domain.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --disable-sid-filtering-domains=: List of migrating domains on which SID Filtering must be disabled.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --onprem-domains=!: List of trusted domains that are being migrated.
documentation:
    command: |
        *(BETA)*  Enable domain migration permissions on a Managed Microsoft AD domain.

        This command can fail for the following reasons:
          * The specified domain doesn't exist.
          * The specified domain is either being created or updated.
          * The active account doesn't have permission to enable migration permissions on the specified domain.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        disable-sid-filtering-domains: List of migrating domains on which SID Filtering must be disabled. The list is empty by default.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        onprem-domains: List of trusted domains that are being migrated.
