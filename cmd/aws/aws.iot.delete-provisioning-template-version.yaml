name: delete-provisioning-template-version
description: Deletes a provisioning template version.
flags:
    --template-name=!: The name of the provisioning template version to delete.
    --version-id=!: The provisioning template version ID to delete.
documentation:
    command: |-
        Deletes a provisioning template version.

        Requires permission to access the [DeleteProvisioningTemplateVersion](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        template-name: The name of the provisioning template version to delete.
        version-id: The provisioning template version ID to delete.
