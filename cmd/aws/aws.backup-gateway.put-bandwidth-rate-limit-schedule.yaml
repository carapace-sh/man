name: put-bandwidth-rate-limit-schedule
description: This action sets the bandwidth rate limit schedule for a specified gateway.
flags:
    --bandwidth-rate-limit-intervals=!: An array containing bandwidth rate limit schedule intervals for a gateway.
    --gateway-arn=!: The Amazon Resource Name (ARN) of the gateway.
documentation:
    command: This action sets the bandwidth rate limit schedule for a specified gateway. By default, gateways do not have a bandwidth rate limit schedule, which means no bandwidth rate limiting is in effect. Use this to initiate a gateway's bandwidth rate limit schedule.
    flag:
        bandwidth-rate-limit-intervals: An array containing bandwidth rate limit schedule intervals for a gateway. When no bandwidth rate limit intervals have been scheduled, the array is empty.
        gateway-arn: The Amazon Resource Name (ARN) of the gateway. Use the [`ListGateways`](https://docs.aws.amazon.com/aws-backup/latest/devguide/API_BGW_ListGateways.html) operation to return a list of gateways for your account and Amazon Web Services Region.
