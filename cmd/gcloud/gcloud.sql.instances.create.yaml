documentation:
    command: Creates a new Cloud SQL instance.
    flag:
        activation-policy: 'Activation policy for this instance. This specifies when the instance should be activated and is applicable only when the instance state is `RUNNABLE`. The default is `always`. More information on activation policies can be found here: https://cloud.google.com/sql/docs/mysql/start-stop-restart-instance#activation_policy. _ACTIVATION_POLICY_ must be one of: *always*, *never*.'
        active-directory-dns-servers: 'A comma-separated list of the DNS servers to be used for Active Directory. Only available for SQL Server instances. E.g: 10.0.0.1,10.0.0.2'
        active-directory-domain: Managed Service for Microsoft Active Directory domain this instance is joined to. Only available for SQL Server instances.
        active-directory-mode: 'Defines the Active Directory mode. Only available for SQL Server instances. _ACTIVE_DIRECTORY_MODE_ must be one of: *MANAGED_ACTIVE_DIRECTORY*, *CUSTOMER_MANAGED_ACTIVE_DIRECTORY*.'
        active-directory-organizational-unit: 'Defines the organizational unit to be used for Active Directory. Only available for SQL Server instances. E.g: OU=Cloud,DC=ad,DC=example,DC=com'
        active-directory-secret-manager-key: The secret manager key storing administrator credentials. Only available for SQL Server instances.
        allowed-psc-projects: A comma-separated list of projects. Each project in this list might be represented by a project number (numeric) or by a project ID (alphanumeric). This allows Private Service Connect connections to be established from specified consumer projects.
        assign-ip: Assign a public IP address to the instance. This is a public, externally available IPv4 address that you can use to connect to your instance when properly authorized. Use *--assign-ip* to enable and *--no-assign-ip* to disable.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        audit-bucket-path: The location, as a Cloud Storage bucket, to which audit files are uploaded. The URI is in the form gs://bucketName/folderName. Only available for SQL Server instances.
        audit-retention-interval: The number of days for audit log retention on disk, for example, 3dfor 3 days. Only available for SQL Server instances.
        audit-upload-interval: How often to upload audit logs (audit files), for example, 30mfor 30 minutes. Only available for SQL Server instances.
        authorized-networks: The list of external networks that are allowed to connect to the instance. Specified in CIDR notation, also known as 'slash' notation (e.g. 192.168.100.0/24).
        auto-scale-disable-scale-in: Disables automatic read pool scale-in. When disabled, read pool auto scaling only supports increasing the read pool node count. By default, both automatic read pool scale-in and scale-out are enabled. Use *--auto-scale-disable-scale-in* to enable and *--no-auto-scale-disable-scale-in* to disable.
        auto-scale-enabled: Enables read pool auto scaling. Supports automatically increasing and decreasing the read pool's node count based on need. Use *--auto-scale-enabled* to enable and *--no-auto-scale-enabled* to disable.
        auto-scale-in-cooldown-seconds: The cooldown period for automatic read pool scale-in. Minimum time between scale-in events. Must be an integer value. For example, if the value is 60, then a scale-in event will not be triggered within 60 seconds of the last scale-in event.
        auto-scale-max-node-count: Maximum number of read pool nodes to be maintained.
        auto-scale-min-node-count: Minimum number of read pool nodes to be maintained.
        auto-scale-out-cooldown-seconds: The cooldown period for automatic read pool scale-out. Minimum time between scale-out events. Must be an integer value. For example, if the value is 60, then a scale-out event will not be triggered within 60 seconds of the last scale-out event.
        auto-scale-target-metrics: 'Target metrics for read pool auto scaling. Options are: AVERAGE_CPU_UTILIZATION and AVERAGE_DB_CONNECTIONS. Example: --auto-scale-target-metrics=AVERAGE_CPU_UTILIZATION=0.8'
        availability-type: |-
            Specifies level of availability. _AVAILABILITY_TYPE_ must be one of:
            +
            *regional*::: Provides high availability and is recommended for production instances; instance automatically fails over to another zone within your selected region.
            *zonal*::: Provides no failover capability. This is the default.
            :::
            +
        backup: Enables daily backup. Enabled by default, use *--no-backup* to disable.
        backup-location: Choose where to store your backups. Backups are stored in the closest multi-region location to you by default. Only customize if needed.
        backup-start-time: Start time of daily backups, specified in the HH:MM format, in the UTC timezone.
        cascadable-replica: Specifies whether a SQL Server replica is a cascadable replica. A cascadable replica is a SQL Server cross-region replica that supports replica(s) under it. This flag only takes effect when the `--master-instance-name` flag is set, and the replica under creation is in a different region than the primary instance.
        clear-active-directory-dns-servers: Removes the list of DNS Servers from the Active Directory Config.
        collation: Cloud SQL server-level collation setting, which specifies the set of rules for comparing characters in a character set.
        connection-pool-flags: 'Comma-separated list of connection pool flags to set on the instance connection pool. Use an equals sign to separate flag name and value. More information on available flags can be found here: https://cloud.google.com/sql/docs/mysql/managed-connection-pooling#configuration-options for MySQL and https://cloud.google.com/sql/docs/postgres/managed-connection-pooling#configuration-options for PostgreSQL. (e.g., `--connection-pool-flags max_pool_size=1000,max_client_connections=20`)'
        connector-enforcement: |-
            Cloud SQL Connector enforcement mode. It determines how Cloud SQL Connectors are used in the connection. See the list of modes [here](https://cloud.google.com/sql/docs/mysql/admin-api/rest/v1beta4/instances#connectorenforcement). _CONNECTOR_ENFORCEMENT_ must be one of:
            +
            *CONNECTOR_ENFORCEMENT_UNSPECIFIED*::: The requirement for Cloud SQL connectors is unknown.
            *NOT_REQUIRED*::: Does not require Cloud SQL connectors.
            *REQUIRED*::: Requires all connections to use Cloud SQL connectors, including the Cloud SQL Auth Proxy and Cloud SQL Java, Python, and Go connectors. Note: This disables all existing authorized networks.
            :::
            +
        cpu: Whole number value indicating how many cores are desired in the machine. Both --cpu and --memory must be specified if a custom machine type is desired, and the --tier flag must be omitted.--cpu and --memory flags are not compatible with the Enterprise Plus edition. These flags should not be used when creating an Enterprise Plus edition, as the machine configuration is determined by the --tier flag instead.
        custom-subject-alternative-names: A comma-separated list of DNS names to add to the instance's SSL certificate. A custom SAN is a structured way to add additional DNS names (host names) that are not managed by Cloud SQL to an instance. It allows for hostname verification during establishment of a database connection using the DNS name over SSL/TLS. When you create and/or update an instance, you can add a comma-separated list of up to three DNS names to the server certificate of your instance.
        database-flags: Comma-separated list of database flags to set on the instance. Use an equals sign to separate flag name and value. Flags without values, like skip_grant_tables, can be written out without a value after, e.g., `skip_grant_tables=`. Use on/off for booleans. View the Instance Resource API for allowed flags. (e.g., `--database-flags max_allowed_packet=55555,skip_grant_tables=,log_output=1`)
        database-version: 'The database engine type and versions. If left unspecified, MYSQL_8_0 is used. See the list of database versions at https://cloud.google.com/sql/docs/mysql/admin-api/rest/v1beta4/SqlDatabaseVersion. Apart from listed major versions, DATABASE_VERSION also accepts supported minor versions. _DATABASE_VERSION_ must be one of: *MYSQL_5_6*, *MYSQL_5_7*, *MYSQL_8_0*, *MYSQL_8_4*, *POSTGRES_9_6*, *POSTGRES_10*, *POSTGRES_11*, *POSTGRES_12*, *POSTGRES_13*, *POSTGRES_14*, *POSTGRES_15*, *POSTGRES_16*, *POSTGRES_17*, *POSTGRES_18*, *SQLSERVER_2017_EXPRESS*, *SQLSERVER_2017_WEB*, *SQLSERVER_2017_STANDARD*, *SQLSERVER_2017_ENTERPRISE*, *SQLSERVER_2019_EXPRESS*, *SQLSERVER_2019_WEB*, *SQLSERVER_2019_STANDARD*, *SQLSERVER_2019_ENTERPRISE*, *SQLSERVER_2022_EXPRESS*, *SQLSERVER_2022_WEB*, *SQLSERVER_2022_STANDARD*, *SQLSERVER_2022_ENTERPRISE*.'
        deletion-protection: Enable deletion protection on a Cloud SQL instance. Use *--deletion-protection* to enable and *--no-deletion-protection* to disable.
        deny-maintenance-period-end-date: Date when the deny maintenance period ends, that is ``2021-01-10''.
        deny-maintenance-period-start-date: Date when the deny maintenance period begins, that is ``2020-11-01''.
        deny-maintenance-period-time: Time when the deny maintenance period starts or ends, that is ``05:00:00''.
        disk-encryption-key: |-
            ID of the key or fully qualified identifier for the key.
            +
            To set the `kms-key` attribute:
            * provide the argument `--disk-encryption-key` on the command line.
        disk-encryption-key-keyring: |-
            The KMS keyring of the key.
            +
            To set the `kms-keyring` attribute:
            * provide the argument `--disk-encryption-key` on the command line with a fully specified name;
            * provide the argument `--disk-encryption-key-keyring` on the command line.
        disk-encryption-key-location: |-
            The Google Cloud location for the key.
            +
            To set the `kms-location` attribute:
            * provide the argument `--disk-encryption-key` on the command line with a fully specified name;
            * provide the argument `--disk-encryption-key-location` on the command line.
        disk-encryption-key-project: |-
            The Google Cloud project for the key.
            +
            To set the `kms-project` attribute:
            * provide the argument `--disk-encryption-key` on the command line with a fully specified name;
            * provide the argument `--disk-encryption-key-project` on the command line;
            * set the property `core/project`.
        edition: 'Specifies the edition of Cloud SQL instance. _EDITION_ must be one of: *enterprise*, *enterprise-plus*.'
        enable-auto-upgrade-minor-version: Enables auto-upgrade for MySQL 8.0 minor versions. The MySQL version must be 8.0.35 or higher.
        enable-bin-log: Allows for data recovery from a specific point in time, down to a fraction of a second. Must have automatic backups enabled to use. Make sure storage can support at least 7 days of logs.
        enable-connection-pooling: Enable connection pooling for the instance. Use *--enable-connection-pooling* to enable and *--no-enable-connection-pooling* to disable.
        enable-data-cache: Enable use of data cache for accelerated read performance. This flag is only available for Enterprise_Plus edition instances. Use *--enable-data-cache* to enable and *--no-enable-data-cache* to disable.
        enable-dataplex-integration: Enable Dataplex integration for Google Cloud SQL. Use *--enable-dataplex-integration* to enable and *--no-enable-dataplex-integration* to disable.
        enable-google-ml-integration: Enable Vertex AI integration for Google Cloud SQL. You can integrate Vertex AI with Cloud SQL for MySQL and Cloud SQL for PostgreSQL instances only. Use *--enable-google-ml-integration* to enable and *--no-enable-google-ml-integration* to disable.
        enable-google-private-path: Enable a private path for Google Cloud services. This flag specifies whether the instance is accessible to internal Google Cloud services such as BigQuery. This is only applicable to MySQL and PostgreSQL instances that don't use public IP. Currently, SQL Server isn't supported.
        enable-password-policy: |-
            Enable the password policy, which enforces user password management with
            the policies configured for the instance. This flag is only available for Postgres.
        enable-point-in-time-recovery: Allows for data recovery from a specific point in time, down to a fraction of a second, via write-ahead logs. Must have automatic backups enabled to use. Make sure storage can support at least 7 days of logs.
        enable-private-service-connect: Enable connecting to the Cloud SQL instance with Private Service Connect.
        enforce-new-sql-network-architecture: Force the instance to use the new network architecture.
        failover-replica-name: Also create a failover replica with the specified name.
        final-backup: Enables the final backup to be taken at the time of instance deletion. Use *--final-backup* to enable and *--no-final-backup* to disable.
        final-backup-retention-days: Specifies number of days to retain final backup. The valid range is between 1 and 365. For instances managed by BackupDR, the valid range is between 1 day and 99 years. Default value is 30 days.
        gce-zone: |-
            (DEPRECATED) Preferred Compute Engine zone (e.g. us-central1-a, us-central1-b, etc.).
            +
            Flag `--gce-zone` is deprecated and will be removed by release 255.0.0. Use `--zone` instead.
        insights-config-query-insights-enabled: |-
            Enable query insights feature to provide query and query plan
                    analytics.
            +
            Use *--insights-config-query-insights-enabled* to enable and *--no-insights-config-query-insights-enabled* to disable.
        insights-config-query-plans-per-minute: |-
            Number of query plans to sample every minute.
                    Default value is 5. Allowed range: 0 to 20.
        insights-config-query-string-length: |-
            Sets the default query length limit. For Cloud SQL Enterprise edition,
                  the range is from 256 to 4500 (in bytes) and the default query length is 1024
                  bytes. For Cloud SQL Enterprise Plus edition, the range is from 1024 to 100,000
                  (in bytes) and the default query length is 10,000 bytes.
        insights-config-record-application-tags: |-
            Allow application tags to be recorded by the query insights
                    feature.
            +
            Use *--insights-config-record-application-tags* to enable and *--no-insights-config-record-application-tags* to disable.
        insights-config-record-client-address: |-
            Allow the client address to be recorded by the query insights
                    feature.
            +
            Use *--insights-config-record-client-address* to enable and *--no-insights-config-record-client-address* to disable.
        instance-type: |-
            The type of the instance. _INSTANCE_TYPE_ must be one of:
            +
            *CLOUD_SQL_INSTANCE*::: A primary instance.
            *READ_POOL_INSTANCE*::: A read pool instance.
            *READ_REPLICA_INSTANCE*::: A read replica instance.
            :::
            +
        maintenance-release-channel: |-
            Which channel's updates to apply during the maintenance window. If not specified, Cloud SQL chooses the timing of updates to your instance. _MAINTENANCE_RELEASE_CHANNEL_ must be one of:
            +
            *preview*::: Preview updates release prior to production updates. You may wish to use the preview channel for dev/test applications so that you can preview their compatibility with your application prior to the production release.
            *production*::: Production updates are stable and recommended for applications in production.
            *week5*::: week5 updates release after the production updates. Use the week5 channel to receive a 5 week advance notification about the upcoming maintenance, so you can prepare your application for the release.
            :::
            +
        maintenance-window-day: 'Day of week for maintenance window, in UTC time zone. _MAINTENANCE_WINDOW_DAY_ must be one of: *SUN*, *MON*, *TUE*, *WED*, *THU*, *FRI*, *SAT*.'
        maintenance-window-hour: Hour of day for maintenance window, in UTC time zone.
        master-instance-name: Name of the instance which will act as master in the replication setup. The newly created instance will be a read replica of the specified master instance.
        memory: Whole number value indicating how much memory is desired in the machine. A size unit should be provided (eg. 3072MiB or 9GiB) - if no units are specified, GiB is assumed. Both --cpu and --memory must be specified if a custom machine type is desired, and the --tier flag must be omitted. --cpu and --memory flags are not compatible with the Enterprise Plus edition. These flags should not be used when creating an Enterprise Plus edition, as the machine configuration is determined by the --tier flag instead.
        network: 'Network in the current project that the instance will be part of. To specify using a network with a shared VPC, use the full URL of the network. For an example host project, ''testproject'', and shared network, ''testsharednetwork'', this would use the form: `--network`=`projects/testproject/global/networks/testsharednetwork`'
        no-assign-ip: Assign a public IP address to the instance. This is a public, externally available IPv4 address that you can use to connect to your instance when properly authorized.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-auto-scale-disable-scale-in: Disables automatic read pool scale-in. When disabled, read pool auto scaling only supports increasing the read pool node count. By default, both automatic read pool scale-in and scale-out are enabled.
        no-auto-scale-enabled: Enables read pool auto scaling. Supports automatically increasing and decreasing the read pool's node count based on need.
        no-backup: Enables daily backup.
        no-cascadable-replica: Specifies whether a SQL Server replica is a cascadable replica. A cascadable replica is a SQL Server cross-region replica that supports replica(s) under it. This flag only takes effect when the `--master-instance-name` flag is set, and the replica under creation is in a different region than the primary instance.
        no-clear-active-directory-dns-servers: Removes the list of DNS Servers from the Active Directory Config.
        no-deletion-protection: Enable deletion protection on a Cloud SQL instance.
        no-enable-auto-upgrade-minor-version: Enables auto-upgrade for MySQL 8.0 minor versions. The MySQL version must be 8.0.35 or higher.
        no-enable-bin-log: Allows for data recovery from a specific point in time, down to a fraction of a second. Must have automatic backups enabled to use. Make sure storage can support at least 7 days of logs.
        no-enable-connection-pooling: Enable connection pooling for the instance.
        no-enable-data-cache: Enable use of data cache for accelerated read performance. This flag is only available for Enterprise_Plus edition instances.
        no-enable-dataplex-integration: Enable Dataplex integration for Google Cloud SQL.
        no-enable-google-ml-integration: Enable Vertex AI integration for Google Cloud SQL. You can integrate Vertex AI with Cloud SQL for MySQL and Cloud SQL for PostgreSQL instances only.
        no-enable-google-private-path: Enable a private path for Google Cloud services. This flag specifies whether the instance is accessible to internal Google Cloud services such as BigQuery. This is only applicable to MySQL and PostgreSQL instances that don't use public IP. Currently, SQL Server isn't supported.
        no-enable-password-policy: |
            Enable the password policy, which enforces user password management with
            the policies configured for the instance. This flag is only available for Postgres.
        no-enable-point-in-time-recovery: Allows for data recovery from a specific point in time, down to a fraction of a second, via write-ahead logs. Must have automatic backups enabled to use. Make sure storage can support at least 7 days of logs.
        no-enable-private-service-connect: Enable connecting to the Cloud SQL instance with Private Service Connect.
        no-enforce-new-sql-network-architecture: Force the instance to use the new network architecture.
        no-final-backup: Enables the final backup to be taken at the time of instance deletion.
        no-insights-config-query-insights-enabled: |-
            Enable query insights feature to provide query and query plan
                    analytics.
        no-insights-config-record-application-tags: |-
            Allow application tags to be recorded by the query insights
                    feature.
        no-insights-config-record-client-address: |-
            Allow the client address to be recorded by the query insights
                    feature.
        no-password-policy-disallow-username-substring: Disallow username as a part of the password.
        no-recreate-replicas-on-primary-crash: Allow/Disallow replica recreation when a primary MySQL instance operating in reduced durability mode crashes. Not recreating the replicas might lead to data inconsistencies between the primary and its replicas. This setting is only applicable for MySQL instances and is enabled by default.
        no-require-ssl: Specified if users connecting over IP must use SSL.
        no-retain-backups-on-delete: Retain automated/ondemand backups of the instance after the instance is deleted.
        no-storage-auto-increase: Storage size can be increased, but it cannot be decreased; storage increases are permanent for the life of the instance. With this setting enabled, a spike in storage requirements can result in permanently increased storage costs for your instance. However, if an instance runs out of available space, it can result in the instance going offline, dropping existing connections. This setting is enabled by default.
        node-count: The number of nodes in the pool. This option is only available for read pools.
        password-policy-complexity: |-
            The complexity of the password. This flag is available only for PostgreSQL. _PASSWORD_POLICY_COMPLEXITY_ must be one of:
            +
            *COMPLEXITY_DEFAULT*::: A combination of lowercase, uppercase, numeric, and non-alphanumeric characters.
            *COMPLEXITY_UNSPECIFIED*::: The default value if COMPLEXITY_DEFAULT is not specified. It implies that complexity check is not enabled.
            :::
            +
        password-policy-disallow-username-substring: Disallow username as a part of the password. Use *--password-policy-disallow-username-substring* to enable and *--no-password-policy-disallow-username-substring* to disable.
        password-policy-min-length: Minimum number of characters allowed in the password.
        password-policy-password-change-interval: |-
            Minimum interval after which the password can be changed, for example,
            2m for 2 minutes. See <a href="/sdk/gcloud/reference/topic/datetimes">
            $ gcloud topic datetimes</a> for information on duration formats.
            This flag is available only for PostgreSQL.
        password-policy-reuse-interval: Number of previous passwords that cannot be reused. The valid range is 0 to 100.
        psc-auto-connections: |-
            A comma-separated list of networks or network-project pairs. Each project is represented by a project number (numeric) or by a project ID (alphanumeric). This allows Private Service Connect connections to be created automatically for the specified networks. For example, this connection uses "the form `psc-auto-connections`=`network=projects/testproject1/global/networks/testnetwork1`" or "the form `psc-auto-connections`=`project=testproject1,network=projects/testproject1/global/networks/testnetwork1`". Sets `psc_auto_connections` value.
            +
            *network*:::
            Required, sets `network` value.
            +
            *project*:::
            Sets `project` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --psc-auto-connections=network=string,project=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --psc-auto-connections='{"network": "string", "project": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --psc-auto-connections=path_to_file.(yaml|json)
            +
            ```
        recreate-replicas-on-primary-crash: Allow/Disallow replica recreation when a primary MySQL instance operating in reduced durability mode crashes. Not recreating the replicas might lead to data inconsistencies between the primary and its replicas. This setting is only applicable for MySQL instances and is enabled by default. Use *--recreate-replicas-on-primary-crash* to enable and *--no-recreate-replicas-on-primary-crash* to disable.
        region: Regional location (e.g. asia-east1, us-east1). See the full list of regions at https://cloud.google.com/sql/docs/instance-locations.
        replica-type: 'The type of replica to create. _REPLICA_TYPE_ must be one of: *READ*, *FAILOVER*.'
        replication: 'Type of replication this instance uses. The default is synchronous. _REPLICATION_ must be one of: *synchronous*, *asynchronous*.'
        require-ssl: Specified if users connecting over IP must use SSL.
        retain-backups-on-delete: Retain automated/ondemand backups of the instance after the instance is deleted. Use *--retain-backups-on-delete* to enable and *--no-retain-backups-on-delete* to disable.
        retained-backups-count: How many backups to keep. The valid range is between 1 and 365. Default value is 7 for Enterprise edition instances. For Enterprise_Plus, default value is 15. Applicable only if --no-backups is not specified.
        retained-transaction-log-days: How many days of transaction logs to keep. The valid range is between 1 and 35. Only use this option when point-in-time recovery is enabled. If logs are stored on disk, storage size for transaction logs could increase when the number of days for log retention increases. For Enterprise, default and max retention values are 7 and 7 respectively. For Enterprise_Plus, default and max retention values are 14 and 35.
        root-password: Root Cloud SQL user's password.
        secondary-zone: Preferred secondary Compute Engine zone (e.g. us-central1-a, us-central1-b, etc.).
        server-ca-mode: |-
            Set the server CA mode of the instance. _SERVER_CA_MODE_ must be one of:
            +
            *CUSTOMER_MANAGED_CAS_CA*::: Customer-managed CA hosted on Google Cloud's Certificate Authority Service (CAS).
            *GOOGLE_MANAGED_CAS_CA*::: Google-managed regional CA part of root CA hierarchy hosted on Google Cloud's Certificate Authority Service (CAS).
            *GOOGLE_MANAGED_INTERNAL_CA*::: Google-managed self-signed internal CA.
            :::
            +
        server-ca-pool: Set the server CA pool of the instance.
        ssl-mode: |-
            Set the SSL mode of the instance. _SSL_MODE_ must be one of:
            +
            *ALLOW_UNENCRYPTED_AND_ENCRYPTED*::: Allow non-SSL and SSL connections. For SSL connections, client certificate will not be verified.
            *ENCRYPTED_ONLY*::: Only allow connections encrypted with SSL/TLS.
            *TRUSTED_CLIENT_CERTIFICATE_REQUIRED*::: Only allow connections encrypted with SSL/TLS and with valid client certificates.
            :::
            +
        storage-auto-increase: Storage size can be increased, but it cannot be decreased; storage increases are permanent for the life of the instance. With this setting enabled, a spike in storage requirements can result in permanently increased storage costs for your instance. However, if an instance runs out of available space, it can result in the instance going offline, dropping existing connections. This setting is enabled by default. Use *--storage-auto-increase* to enable and *--no-storage-auto-increase* to disable.
        storage-provisioned-iops: Indicates how many IOPS to provision for the data disk. This sets the number of I/O operations per second that the disk can handle.
        storage-provisioned-throughput: Indicates how much throughput to provision for the data disk. This sets the throughput in MB per second that the disk can handle.
        storage-size: 'Amount of storage allocated to the instance. Must be an integer number of GB. The default is 10GB. Information on storage limits can be found here: https://cloud.google.com/sql/docs/quotas#storage_limits'
        storage-type: 'The storage type for the instance, determined by the selected machine type. _STORAGE_TYPE_ must be one of: *SSD*, *HDD*, *HYPERDISK_BALANCED*.'
        tags: Comma-separated list of tags to set on the instance. Use an equals signto separate tag name and value.(e.g., `--tags tag1:value1,tag2=value2`)
        threads-per-core: |-
            The number of threads per core. The value of this flag can be 1 or 2.
            To disable SMT, set this flag to 1. Only available in Cloud SQL for SQL Server instances.
        tier: 'Machine type for a shared-core instance e.g. ``db-g1-small''''. For all other instances, instead of using tiers, customize your instance by specifying its CPU and memory. You can do so with the `--cpu` and `--memory` flags. Learn more about how CPU and memory affects pricing: https://cloud.google.com/sql/pricing.'
        time-zone: Set a non-default time zone. Only available for SQL Server instances.
        timeout: Time to synchronously wait for the operation to complete, after which the operation continues asynchronously. Ignored if --async flag is specified. By default, set to 3600s. To wait indefinitely, set to *unlimited*.
        zone: Preferred Compute Engine zone (e.g. us-central1-a, us-central1-b, etc.).
