name: cancel-component-deployment
description: Attempts to cancel a component deployment (for a component that is in the `IN_PROGRESS` deployment status).
flags:
    --component-name=!: The name of the component with the deployment to cancel.
documentation:
    command: |-
        Attempts to cancel a component deployment (for a component that is in the `IN_PROGRESS` deployment status).

        For more information about components, see [Proton components](https://docs.aws.amazon.com/proton/latest/userguide/ag-components.html) in the *Proton User Guide*.
    flag:
        component-name: The name of the component with the deployment to cancel.
