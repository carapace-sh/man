name: describe-group
description: Returns an Amazon Quick Sight group's description and Amazon Resource Name (ARN).
flags:
    --aws-account-id=!: The ID for the Amazon Web Services account that the group is in.
    --group-name=!: The name of the group that you want to describe.
    --namespace=!: The namespace of the group that you want described.
documentation:
    command: Returns an Amazon Quick Sight group's description and Amazon Resource Name (ARN).
    flag:
        aws-account-id: The ID for the Amazon Web Services account that the group is in. Currently, you use the ID for the Amazon Web Services account that contains your Amazon Quick Sight account.
        group-name: The name of the group that you want to describe.
        namespace: The namespace of the group that you want described.
