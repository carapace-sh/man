name: create-vpn-gateway
description: Creates a virtual private gateway.
flags:
    --amazon-side-asn=: A private Autonomous System Number (ASN) for the Amazon side of a BGP session.
    --availability-zone=: The Availability Zone for the virtual private gateway.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --tag-specifications=: The tags to apply to the virtual private gateway.
    --type=!: The type of VPN connection this virtual private gateway supports.
completion:
    flag:
        type:
            - ipsec.1
documentation:
    command: |-
        Creates a virtual private gateway. A virtual private gateway is the endpoint on the VPC side of your VPN connection. You can create a virtual private gateway before creating the VPC itself.

        For more information, see [Amazon Web Services Site-to-Site VPN](https://docs.aws.amazon.com/vpn/latest/s2svpn/VPC_VPN.html) in the *Amazon Web Services Site-to-Site VPN User Guide*.
    flag:
        amazon-side-asn: |-
            A private Autonomous System Number (ASN) for the Amazon side of a BGP session. If you're using a 16-bit ASN, it must be in the 64512 to 65534 range. If you're using a 32-bit ASN, it must be in the 4200000000 to 4294967294 range.

            Default: 64512
        availability-zone: The Availability Zone for the virtual private gateway.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        tag-specifications: The tags to apply to the virtual private gateway.
        type: The type of VPN connection this virtual private gateway supports.
