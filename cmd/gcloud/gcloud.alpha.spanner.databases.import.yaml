name: import
description: '*(ALPHA)*  Import data from various source files to Cloud Spanner.'
flags:
    --csv-field-delimiter=: Field delimiter for CSV files.
    --csv-line-delimiter=: Line delimiter for CSV files.
    --database-dialect=: Dialect for the spanner database.
    --database=!: Cloud Spanner database ID.
    --instance=!: Cloud Spanner instance ID.
    --no-show-exec-error&: If true and command fails, print the underlying command that was executed and its exit status.
    --schema-uri=: URI of the file with schema of the data to import
    --show-exec-error&: If true and command fails, print the underlying command that was executed and its exit status.
    --source-format=!: 'Format of the file with data to import.Supported formats: csv or mysqldump or pgdump'
    --source-uri=!: URI of the file with data to import
    --table-name=: Cloud Spanner table name
completion:
    flag:
        database-dialect:
            - POSTGRESQL
            - GOOGLE_STANDARD_SQL
documentation:
    command: '*(ALPHA)*  Import data from various source files to Cloud Spanner.'
    flag:
        csv-field-delimiter: Field delimiter for CSV files.
        csv-line-delimiter: Line delimiter for CSV files.
        database: Cloud Spanner database ID.
        database-dialect: 'Dialect for the spanner database. _DATABASE_DIALECT_ must be one of: *POSTGRESQL*, *GOOGLE_STANDARD_SQL*.'
        instance: Cloud Spanner instance ID.
        no-show-exec-error: If true and command fails, print the underlying command that was executed and its exit status.
        schema-uri: URI of the file with schema of the data to import
        show-exec-error: If true and command fails, print the underlying command that was executed and its exit status.
        source-format: 'Format of the file with data to import.Supported formats: csv or mysqldump or pgdump'
        source-uri: URI of the file with data to import
        table-name: Cloud Spanner table name
