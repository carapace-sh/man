name: list-users
description: Lists all users in the identity store.
flags:
    --filters=: A list of `Filter` objects, which is used in the `ListUsers` and `ListGroups` requests.
    --identity-store-id=!: The globally unique identifier for the identity store, such as `d-1234567890`.
    --max-results=: The maximum number of results to be returned per request.
    --next-token=: The pagination token used for the `ListUsers` and `ListGroups` API operations.
documentation:
    command: |-
        Lists all users in the identity store. Returns a paginated list of complete `User` objects. Filtering for a `User` by the `UserName` attribute is deprecated. Instead, use the `GetUserId` API action.

        If you have access to a member account, you can use this API operation from the member account. For more information, see [Limiting access to the identity store from member accounts](https://docs.aws.amazon.com/singlesignon/latest/userguide/manage-your-accounts.html#limiting-access-from-member-accounts) in the *IAM Identity Center User Guide*.
    flag:
        filters: A list of `Filter` objects, which is used in the `ListUsers` and `ListGroups` requests.
        identity-store-id: The globally unique identifier for the identity store, such as `d-1234567890`. In this example, `d-` is a fixed prefix, and `1234567890` is a randomly generated string that contains numbers and lower case letters. This value is generated at the time that a new identity store is created.
        max-results: The maximum number of results to be returned per request. This parameter is used in the `ListUsers` and `ListGroups` requests to specify how many results to return in one page. The length limit is 50 characters.
        next-token: The pagination token used for the `ListUsers` and `ListGroups` API operations. This value is generated by the identity store service. It is returned in the API response if the total results are more than the size of one page. This token is also returned when it is used in the API request to search for the next page.
