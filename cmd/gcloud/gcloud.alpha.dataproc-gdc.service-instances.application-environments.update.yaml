        service-instance: |-
            serviceInstances TBD
            +
            To set the `service-instance` attribute:
            * provide the argument `application_environment` on the command line with a fully specified name;
            * provide the argument `--service-instance` on the command line.
        spark-application-environment-config-default-properties: |-
            Set spark_application_environment_config_default_properties to new value. A map of default Spark properties to apply to workloads in this application
            environment. These defaults may be overridden by per-application
            properties.
            +
            *KEY*:::
            Sets `KEY` value.
            +
            *VALUE*:::
            Sets `VALUE` value.
