name: put-function-event-invoke-config
description: Configures options for [asynchronous invocation](https://docs.aws.amazon.com/lambda/latest/dg/invocation-async.html) on a function, version, or alias.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --destination-config=: A destination for events after they have been sent to a function for processing.
    --function-name=!: The name or ARN of the Lambda function, version, or alias.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --maximum-event-age-in-seconds=: The maximum age of a request that Lambda sends to a function for processing.
    --maximum-retry-attempts=: The maximum number of times to retry when the function returns an error.
    --qualifier=: A version number or alias name.
documentation:
    command: |-
        Configures options for [asynchronous invocation](https://docs.aws.amazon.com/lambda/latest/dg/invocation-async.html) on a function, version, or alias. If a configuration already exists for a function, version, or alias, this operation overwrites it. If you exclude any settings, they are removed. To set one option without affecting existing settings for other options, use [UpdateFunctionEventInvokeConfig]().

        By default, Lambda retries an asynchronous invocation twice if the function returns an error. It retains events in a queue for up to six hours. When an event fails all processing attempts or stays in the asynchronous invocation queue for too long, Lambda discards it. To retain discarded events, configure a dead-letter queue with [UpdateFunctionConfiguration]().

        To send an invocation record to a queue, topic, S3 bucket, function, or event bus, specify a [destination](https://docs.aws.amazon.com/lambda/latest/dg/invocation-async.html#invocation-async-destinations). You can configure separate destinations for successful invocations (on-success) and events that fail all processing attempts (on-failure). You can configure destinations in addition to or instead of a dead-letter queue.

        S3 buckets are supported only for on-failure destinations. To retain records of successful invocations, use another destination type.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        destination-config: |-
            A destination for events after they have been sent to a function for processing.

            **Destinations**

            - **Function** - The Amazon Resource Name (ARN) of a Lambda function.
            - **Queue** - The ARN of a standard SQS queue.
            - **Bucket** - The ARN of an Amazon S3 bucket.
            - **Topic** - The ARN of a standard SNS topic.
            - **Event Bus** - The ARN of an Amazon EventBridge event bus.

            S3 buckets are supported only for on-failure destinations. To retain records of successful invocations, use another destination type.
        function-name: |-
            The name or ARN of the Lambda function, version, or alias.

            **Name formats**

            - **Function name** - `my-function` (name-only), `my-function:v1` (with alias).
            - **Function ARN** - `arn:aws:lambda:us-west-2:123456789012:function:my-function`.
            - **Partial ARN** - `123456789012:function:my-function`.

            You can append a version number or alias to any of the formats. The length constraint applies only to the full ARN. If you specify only the function name, it is limited to 64 characters in length.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        maximum-event-age-in-seconds: The maximum age of a request that Lambda sends to a function for processing.
        maximum-retry-attempts: The maximum number of times to retry when the function returns an error.
        qualifier: A version number or alias name.
