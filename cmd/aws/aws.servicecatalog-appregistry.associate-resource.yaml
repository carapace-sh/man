name: associate-resource
description: Associates a resource with an application.
flags:
    --application=!: The name, ID, or ARN of the application.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --options=: Determines whether an application tag is applied or skipped.
    --resource-type=!: The type of resource of which the application will be associated.
    --resource=!: The name or ID of the resource of which the application will be associated.
completion:
    flag:
        resource-type:
            - CFN_STACK
            - RESOURCE_TAG_VALUE
documentation:
    command: |-
        Associates a resource with an application. The resource can be specified by its ARN or name. The application can be specified by ARN, ID, or name.

        **Minimum permissions**

        You must have the following permissions to associate a resource using the `OPTIONS` parameter set to `APPLY_APPLICATION_TAG`.

        - `tag:GetResources`
        - `tag:TagResources`

        You must also have these additional permissions if you don't use the `AWSServiceCatalogAppRegistryFullAccess` policy. For more information, see [AWSServiceCatalogAppRegistryFullAccess](https://docs.aws.amazon.com/servicecatalog/latest/arguide/full.html) in the AppRegistry Administrator Guide.

        - `resource-groups:AssociateResource`
        - `cloudformation:UpdateStack`
        - `cloudformation:DescribeStacks`

        In addition, you must have the tagging permission defined by the Amazon Web Services service that creates the resource. For more information, see [TagResources](https://docs.aws.amazon.com/resourcegroupstagging/latest/APIReference/API_TagResources.html) in the *Resource Groups Tagging API Reference*.
    flag:
        application: The name, ID, or ARN of the application.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        options: Determines whether an application tag is applied or skipped.
        resource: The name or ID of the resource of which the application will be associated.
        resource-type: The type of resource of which the application will be associated.
