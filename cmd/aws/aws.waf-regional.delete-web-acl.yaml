name: delete-web-acl
description: This is **AWS WAF Classic** documentation.
flags:
    --change-token=!: The value returned by the most recent call to [GetChangeToken]().
    --web-aclid=!: The `WebACLId` of the [WebACL]() that you want to delete.
documentation:
    command: |-
        This is **AWS WAF Classic** documentation. For more information, see [AWS WAF Classic](https://docs.aws.amazon.com/waf/latest/developerguide/classic-waf-chapter.html) in the developer guide.

        **For the latest version of AWS WAF**, use the AWS WAFV2 API and see the [AWS WAF Developer Guide](https://docs.aws.amazon.com/waf/latest/developerguide/waf-chapter.html). With the latest version, AWS WAF has a single set of endpoints for regional and global use.

        Permanently deletes a [WebACL](). You can't delete a `WebACL` if it still contains any `Rules`.

        To delete a `WebACL`, perform the following steps:

        1. Update the `WebACL` to remove `Rules`, if any. For more information, see [UpdateWebACL]().
        2. Use [GetChangeToken]() to get the change token that you provide in the `ChangeToken` parameter of a `DeleteWebACL` request.
        3. Submit a `DeleteWebACL` request.
    flag:
        change-token: The value returned by the most recent call to [GetChangeToken]().
        web-aclid: The `WebACLId` of the [WebACL]() that you want to delete. `WebACLId` is returned by [CreateWebACL]() and by [ListWebACLs]().
