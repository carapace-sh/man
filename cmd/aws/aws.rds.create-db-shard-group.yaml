name: create-db-shard-group
description: Creates a new DB shard group for Aurora Limitless Database.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --compute-redundancy=: Specifies whether to create standby standby DB data access shard for the DB shard group.
    --db-cluster-identifier=!: The name of the primary DB cluster for the DB shard group.
    --db-shard-group-identifier=!: The name of the DB shard group.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-acu=!: The maximum capacity of the DB shard group in Aurora capacity units (ACUs).
    --min-acu=: The minimum capacity of the DB shard group in Aurora capacity units (ACUs).
    --no-publicly-accessible: Specifies whether the DB shard group is publicly accessible.
    --publicly-accessible: Specifies whether the DB shard group is publicly accessible.
    --tags=:
        nargs: -1
documentation:
    command: |-
        Creates a new DB shard group for Aurora Limitless Database. You must enable Aurora Limitless Database to create a DB shard group.

        Valid for: Aurora DB clusters only
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        compute-redundancy: |-
            Specifies whether to create standby standby DB data access shard for the DB shard group. Valid values are the following:

            - 0 - Creates a DB shard group without a standby DB data access shard. This is the default value.
            - 1 - Creates a DB shard group with a standby DB data access shard in a different Availability Zone (AZ).
            - 2 - Creates a DB shard group with two standby DB data access shard in two different AZs.
        db-cluster-identifier: The name of the primary DB cluster for the DB shard group.
        db-shard-group-identifier: The name of the DB shard group.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-acu: The maximum capacity of the DB shard group in Aurora capacity units (ACUs).
        min-acu: The minimum capacity of the DB shard group in Aurora capacity units (ACUs).
        publicly-accessible: |-
            Specifies whether the DB shard group is publicly accessible.

            When the DB shard group is publicly accessible, its Domain Name System (DNS) endpoint resolves to the private IP address from within the DB shard group's virtual private cloud (VPC). It resolves to the public IP address from outside of the DB shard group's VPC. Access to the DB shard group is ultimately controlled by the security group it uses. That public access is not permitted if the security group assigned to the DB shard group doesn't permit it.

            When the DB shard group isn't publicly accessible, it is an internal DB shard group with a DNS name that resolves to a private IP address.

            Default: The default behavior varies depending on whether `DBSubnetGroupName` is specified.

            If `DBSubnetGroupName` isn't specified, and `PubliclyAccessible` isn't specified, the following applies:

            - If the default VPC in the target Region doesn’t have an internet gateway attached to it, the DB shard group is private.
            - If the default VPC in the target Region has an internet gateway attached to it, the DB shard group is public.

            If `DBSubnetGroupName` is specified, and `PubliclyAccessible` isn't specified, the following applies:

            - If the subnets are part of a VPC that doesn’t have an internet gateway attached to it, the DB shard group is private.
            - If the subnets are part of a VPC that has an internet gateway attached to it, the DB shard group is public.
        tags: ""
