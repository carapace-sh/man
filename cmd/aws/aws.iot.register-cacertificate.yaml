name: register-cacertificate
description: Registers a CA certificate with Amazon Web Services IoT Core.
flags:
    --allow-auto-registration=: Allows this CA certificate to be used for auto registration of device certificates.
    --ca-certificate=!: The CA certificate.
    --certificate-mode=: Describes the certificate mode in which the Certificate Authority (CA) will be registered.
    --registration-config=: Information about the registration configuration.
    --set-as-active=: A boolean value that specifies if the CA certificate is set to active.
    --tags=: Metadata which can be used to manage the CA certificate.
    --verification-certificate=: The private key verification certificate.
completion:
    flag:
        certificate-mode:
            - DEFAULT
            - SNI_ONLY
documentation:
    command: |-
        Registers a CA certificate with Amazon Web Services IoT Core. There is no limit to the number of CA certificates you can register in your Amazon Web Services account. You can register up to 10 CA certificates with the same `CA subject field` per Amazon Web Services account.

        Requires permission to access the [RegisterCACertificate](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        allow-auto-registration: Allows this CA certificate to be used for auto registration of device certificates.
        ca-certificate: The CA certificate.
        certificate-mode: Describes the certificate mode in which the Certificate Authority (CA) will be registered. If the `verificationCertificate` field is not provided, set `certificateMode` to be `SNI_ONLY`. If the `verificationCertificate` field is provided, set `certificateMode` to be `DEFAULT`. When `certificateMode` is not provided, it defaults to `DEFAULT`. All the device certificates that are registered using this CA will be registered in the same certificate mode as the CA. For more information about certificate mode for device certificates, see [certificate mode](https://docs.aws.amazon.com/iot/latest/apireference/API_CertificateDescription.html#iot-Type-CertificateDescription-certificateMode).
        registration-config: Information about the registration configuration.
        set-as-active: |-
            A boolean value that specifies if the CA certificate is set to active.

            Valid values: `ACTIVE | INACTIVE`
        tags: |-
            Metadata which can be used to manage the CA certificate.

            For URI Request parameters use format: ...key1=value1&amp;key2=value2...

            For the CLI command-line parameter use format: &amp;&amp;tags "key1=value1&amp;key2=value2..."

            For the cli-input-json file use format: "tags": "key1=value1&amp;key2=value2..."
        verification-certificate: The private key verification certificate. If `certificateMode` is `SNI_ONLY`, the `verificationCertificate` field must be empty. If `certificateMode` is `DEFAULT` or not provided, the `verificationCertificate` field must not be empty.
