name: create-impersonation-role
description: Creates an impersonation role for the given WorkMail organization.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: The idempotency token for the client request.
    --description=: The description of the new impersonation role.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the new impersonation role.
    --organization-id=!: The WorkMail organization to create the new impersonation role within.
    --rules=!:
        description: The list of rules for the impersonation role.
        nargs: -1
    --type=!: The impersonation role's type.
completion:
    flag:
        type:
            - FULL_ACCESS
            - READ_ONLY
documentation:
    command: |-
        Creates an impersonation role for the given WorkMail organization.

        *Idempotency* ensures that an API request completes no more than one time. With an idempotent request, if the original request completes successfully, any subsequent retries also complete successfully without performing any further actions.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: The idempotency token for the client request.
        description: The description of the new impersonation role.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the new impersonation role.
        organization-id: The WorkMail organization to create the new impersonation role within.
        rules: The list of rules for the impersonation role.
        type: The impersonation role's type. The available impersonation role types are `READ_ONLY` or `FULL_ACCESS`.
