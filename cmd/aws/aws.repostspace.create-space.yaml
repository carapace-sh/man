name: create-space
description: Creates an AWS re:Post Private private re:Post.
flags:
    --description=: A description for the private re:Post.
    --name=!: The name for the private re:Post.
    --role-arn=: The IAM role that grants permissions to the private re:Post to convert unanswered questions into AWS support tickets.
    --subdomain=!: The subdomain that you use to access your AWS re:Post Private private re:Post.
    --supported-email-domains=: ""
    --tags=: The list of tags associated with the private re:Post.
    --tier=!: The pricing tier for the private re:Post.
    --user-kmskey=: The AWS KMS key ARN that’s used for the AWS KMS encryption.
completion:
    flag:
        tier:
            - BASIC
            - STANDARD
documentation:
    command: Creates an AWS re:Post Private private re:Post.
    flag:
        description: A description for the private re:Post. This is used only to help you identify this private re:Post.
        name: The name for the private re:Post. This must be unique in your account.
        role-arn: The IAM role that grants permissions to the private re:Post to convert unanswered questions into AWS support tickets.
        subdomain: The subdomain that you use to access your AWS re:Post Private private re:Post. All custom subdomains must be approved by AWS before use. In addition to your custom subdomain, all private re:Posts are issued an AWS generated subdomain for immediate use.
        supported-email-domains: ""
        tags: The list of tags associated with the private re:Post.
        tier: The pricing tier for the private re:Post.
        user-kmskey: The AWS KMS key ARN that’s used for the AWS KMS encryption. If you don't provide a key, your data is encrypted by default with a key that AWS owns and manages for you.
