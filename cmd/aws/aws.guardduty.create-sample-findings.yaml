name: create-sample-findings
description: Generates sample findings of types specified by the list of finding types.
flags:
    --detector-id=!: The ID of the detector for which you need to create sample findings.
    --finding-types=: The types of sample findings to generate.
documentation:
    command: Generates sample findings of types specified by the list of finding types. If 'NULL' is specified for `findingTypes`, the API generates sample findings of all supported finding types.
    flag:
        detector-id: |-
            The ID of the detector for which you need to create sample findings.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
        finding-types: The types of sample findings to generate.
