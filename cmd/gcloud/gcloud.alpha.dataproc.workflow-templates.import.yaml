name: import
description: '*(ALPHA)*  Import a workflow template.'
flags:
    --region=: Dataproc region for the template.
    --source=: Path to a YAML file containing configuration export data.
documentation:
    command: |-
        *(ALPHA)*  If the specified template resource already exists, it will be overwritten.
        Otherwise, a new template will be created.
        To edit an existing template, you can export the template to a file, edit its
        configuration, and then import the new configuration.
    flag:
        region: |-
            Dataproc region for the template. Each Dataproc region constitutes an independent resource namespace constrained to deploying instances into Compute Engine zones inside the region. Overrides the default `dataproc/region` property value for this command invocation.
            +
            To set the `region` attribute:
            * provide the argument `template` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `dataproc/region`.
        source: |-
            Path to a YAML file containing configuration export data.
                      Alternatively, you may omit this flag to read from standard input.
