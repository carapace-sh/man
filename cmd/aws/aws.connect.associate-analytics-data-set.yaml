name: associate-analytics-data-set
description: Associates the specified dataset for a Amazon Connect instance with the target account.
flags:
    --data-set-id=!: The identifier of the dataset to associate with the target account.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --target-account-id=: The identifier of the target account.
documentation:
    command: Associates the specified dataset for a Amazon Connect instance with the target account. You can associate only one dataset in a single call.
    flag:
        data-set-id: The identifier of the dataset to associate with the target account.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        target-account-id: The identifier of the target account. Use to associate a dataset to a different account than the one containing the Amazon Connect instance. If not specified, by default this value is the Amazon Web Services account that has the Amazon Connect instance.
