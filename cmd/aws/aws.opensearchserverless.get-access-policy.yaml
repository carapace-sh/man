name: get-access-policy
description: Returns an OpenSearch Serverless access policy.
flags:
    --name=!: The name of the access policy.
    --type=!: Tye type of policy.
completion:
    flag:
        type:
            - data
documentation:
    command: Returns an OpenSearch Serverless access policy. For more information, see [Data access control for Amazon OpenSearch Serverless](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-data-access.html).
    flag:
        name: The name of the access policy.
        type: Tye type of policy. Currently, the only supported value is `data`.
