name: describe-runtime-versions
description: Returns a list of Synthetics canary runtime versions.
flags:
    --max-results=: Specify this parameter to limit how many runs are returned each time you use the `DescribeRuntimeVersions` operation.
    --next-token=: A token that indicates that there is more data available.
documentation:
    command: Returns a list of Synthetics canary runtime versions. For more information, see [Canary Runtime Versions](https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Synthetics_Canaries_Library.html).
    flag:
        max-results: Specify this parameter to limit how many runs are returned each time you use the `DescribeRuntimeVersions` operation. If you omit this parameter, the default of 100 is used.
        next-token: A token that indicates that there is more data available. You can use this token in a subsequent `DescribeRuntimeVersions` operation to retrieve the next set of results.
