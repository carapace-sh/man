name: modify-instance-attribute
description: Modifies the specified attribute of the specified instance.
flags:
    --attribute=: The name of the attribute to modify.
    --block-device-mappings=: Modifies the `DeleteOnTermination` attribute for volumes that are currently attached.
    --disable-api-stop=: Indicates whether an instance is enabled for stop protection.
    --disable-api-termination=: Enable or disable termination protection for the instance.
    --dry-run: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response.
    --ebs-optimized=: Specifies whether the instance is optimized for Amazon EBS I/O.
    --ena-support=: Set to `true` to enable enhanced networking with ENA for the instance.
    --groups=: Replaces the security groups of the instance with the specified security groups.
    --instance-id=!: The ID of the instance.
    --instance-initiated-shutdown-behavior=: Specifies whether an instance stops or terminates when you initiate shutdown from the instance (using the operating system command for system shutdown).
    --instance-type=: Changes the instance type to the specified value.
    --kernel=: Changes the instance's kernel to the specified value.
    --no-dry-run&: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response.
    --ramdisk=: Changes the instance's RAM disk to the specified value.
    --source-dest-check=: Enable or disable source/destination checks, which ensure that the instance is either the source or the destination of any traffic that it receives.
    --sriov-net-support=: Set to `simple` to enable enhanced networking with the Intel 82599 Virtual Function interface for the instance.
    --user-data=: Changes the instance's user data to the specified value.
    --value=: A new value for the attribute.
completion:
    flag:
        attribute:
            - instanceType
            - kernel
            - ramdisk
            - userData
            - disableApiTermination
            - instanceInitiatedShutdownBehavior
            - rootDeviceName
            - blockDeviceMapping
            - productCodes
            - sourceDestCheck
            - groupSet
            - ebsOptimized
            - sriovNetSupport
            - enaSupport
            - enclaveOptions
            - disableApiStop
documentation:
    command: |-
        Modifies the specified attribute of the specified instance. You can specify only one attribute at a time.

        **Note:** Using this action to change the security groups associated with an elastic network interface (ENI) attached to an instance can result in an error if the instance has more than one ENI. To change the security groups associated with an ENI attached to an instance that has multiple ENIs, we recommend that you use the [ModifyNetworkInterfaceAttribute]() action.

        To modify some attributes, the instance must be stopped. For more information, see [Modify a stopped instance](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Using_ChangingAttributesWhileInstanceStopped.html) in the *Amazon EC2 User Guide*.
    flag:
        attribute: |-
            The name of the attribute to modify.

            When changing the instance type: If the original instance type is configured for configurable bandwidth, and the desired instance type doesn't support configurable bandwidth, first set the existing bandwidth configuration to `default` using the [ModifyInstanceNetworkPerformanceOptions]() operation.

            You can modify the following attributes only: `disableApiTermination` | `instanceType` | `kernel` | `ramdisk` | `instanceInitiatedShutdownBehavior` | `blockDeviceMapping` | `userData` | `sourceDestCheck` | `groupSet` | `ebsOptimized` | `sriovNetSupport` | `enaSupport` | `nvmeSupport` | `disableApiStop` | `enclaveOptions`
        block-device-mappings: |-
            Modifies the `DeleteOnTermination` attribute for volumes that are currently attached. The volume must be owned by the caller. If no value is specified for `DeleteOnTermination`, the default is `true` and the volume is deleted when the instance is terminated. You can't modify the `DeleteOnTermination` attribute for volumes that are attached to Amazon Web Services-managed resources.

            To add instance store volumes to an Amazon EBS-backed instance, you must add them when you launch the instance. For more information, see [Update the block device mapping when launching an instance](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/block-device-mapping-concepts.html#Using_OverridingAMIBDM) in the *Amazon EC2 User Guide*.
        disable-api-stop: Indicates whether an instance is enabled for stop protection. For more information, see [Enable stop protection for your instance](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-stop-protection.html).
        disable-api-termination: Enable or disable termination protection for the instance. If the value is `true`, you can't terminate the instance using the Amazon EC2 console, command line interface, or API. You can't enable termination protection for Spot Instances.
        dry-run: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        ebs-optimized: Specifies whether the instance is optimized for Amazon EBS I/O. This optimization provides dedicated throughput to Amazon EBS and an optimized configuration stack to provide optimal EBS I/O performance. This optimization isn't available with all instance types. Additional usage charges apply when using an EBS Optimized instance.
        ena-support: |-
            Set to `true` to enable enhanced networking with ENA for the instance.

            This option is supported only for HVM instances. Specifying this option with a PV instance can make it unreachable.
        groups: Replaces the security groups of the instance with the specified security groups. You must specify the ID of at least one security group, even if it's just the default security group for the VPC.
        instance-id: The ID of the instance.
        instance-initiated-shutdown-behavior: Specifies whether an instance stops or terminates when you initiate shutdown from the instance (using the operating system command for system shutdown).
        instance-type: Changes the instance type to the specified value. For more information, see [Instance types](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html) in the *Amazon EC2 User Guide*. If the instance type is not valid, the error returned is `InvalidInstanceAttributeValue`.
        kernel: Changes the instance's kernel to the specified value. We recommend that you use PV-GRUB instead of kernels and RAM disks. For more information, see [PV-GRUB](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/UserProvidedKernels.html).
        ramdisk: Changes the instance's RAM disk to the specified value. We recommend that you use PV-GRUB instead of kernels and RAM disks. For more information, see [PV-GRUB](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/UserProvidedKernels.html).
        source-dest-check: Enable or disable source/destination checks, which ensure that the instance is either the source or the destination of any traffic that it receives. If the value is `true`, source/destination checks are enabled; otherwise, they are disabled. The default value is `true`. You must disable source/destination checks if the instance runs services such as network address translation, routing, or firewalls.
        sriov-net-support: |-
            Set to `simple` to enable enhanced networking with the Intel 82599 Virtual Function interface for the instance.

            There is no way to disable enhanced networking with the Intel 82599 Virtual Function interface at this time.

            This option is supported only for HVM instances. Specifying this option with a PV instance can make it unreachable.
        user-data: Changes the instance's user data to the specified value. User data must be base64-encoded. Depending on the tool or SDK that you're using, the base64-encoding might be performed for you. For more information, see [Work with instance user data](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instancedata-add-user-data.html).
        value: A new value for the attribute. Use only with the `kernel`, `ramdisk`, `userData`, `disableApiTermination`, or `instanceInitiatedShutdownBehavior` attribute.
