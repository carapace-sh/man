name: list-coverage
description: Lists coverage details for your GuardDuty account.
flags:
    --detector-id=!: The unique ID of the detector whose coverage details you want to retrieve.
    --filter-criteria=: Represents the criteria used to filter the coverage details.
    --max-results=: The maximum number of results to return in the response.
    --next-token=: A token to use for paginating results that are returned in the response.
    --sort-criteria=: Represents the criteria used to sort the coverage details.
documentation:
    command: |-
        Lists coverage details for your GuardDuty account. If you're a GuardDuty administrator, you can retrieve all resources associated with the active member accounts in your organization.

        Make sure the accounts have Runtime Monitoring enabled and GuardDuty agent running on their resources.
    flag:
        detector-id: |-
            The unique ID of the detector whose coverage details you want to retrieve.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
        filter-criteria: Represents the criteria used to filter the coverage details.
        max-results: The maximum number of results to return in the response.
        next-token: A token to use for paginating results that are returned in the response. Set the value of this parameter to null for the first request to a list action. For subsequent calls, use the NextToken value returned from the previous request to continue listing results after the first page.
        sort-criteria: Represents the criteria used to sort the coverage details.
