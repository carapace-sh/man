name: describe-notification-configurations
description: Gets information about the Amazon SNS notifications that are configured for one or more Auto Scaling groups.
flags:
    --auto-scaling-group-names=: The name of the Auto Scaling group.
    --max-records=: The maximum number of items to return with this call.
    --next-token=: The token for the next set of items to return.
documentation:
    command: Gets information about the Amazon SNS notifications that are configured for one or more Auto Scaling groups.
    flag:
        auto-scaling-group-names: The name of the Auto Scaling group.
        max-records: The maximum number of items to return with this call. The default value is `50` and the maximum value is `100`.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
