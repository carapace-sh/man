name: update-policy
description: Modifies a Cedar static policy in the specified policy store.
flags:
    --definition=!: Specifies the updated policy content that you want to replace on the specified policy.
    --policy-id=!: Specifies the ID of the policy that you want to update.
    --policy-store-id=!: Specifies the ID of the policy store that contains the policy that you want to update.
documentation:
    command: "Modifies a Cedar static policy in the specified policy store. You can change only certain elements of the [UpdatePolicyDefinition](https://docs.aws.amazon.com/verifiedpermissions/latest/apireference/API_UpdatePolicyInput.html#amazonverifiedpermissions-UpdatePolicy-request-UpdatePolicyDefinition) parameter. You can directly update only static policies. To change a template-linked policy, you must update the template instead, using [UpdatePolicyTemplate](https://docs.aws.amazon.com/verifiedpermissions/latest/apireference/API_UpdatePolicyTemplate.html).\n\n- If policy validation is enabled in the policy store, then updating a static policy causes Verified Permissions to validate the policy against the schema in the policy store. If the updated static policy doesn't pass validation, the operation fails and the update isn't stored.\n- When you edit a static policy, you can change only certain elements of a static policy:\n  \n  - The action referenced by the policy.\n  - A condition clause, such as when and unless.\n  \n  You can't change these elements of a static policy:\n  \n  - Changing a policy from a static policy to a template-linked policy.\n  - Changing the effect of a static policy from permit or forbid.\n  - The principal referenced by a static policy.\n  - The resource referenced by a static policy.\n- To update a template-linked policy, you must update the template instead.\n\nVerified Permissions is [*eventually consistent*](https://wikipedia.org/wiki/Eventual_consistency) . It can take a few seconds for a new or changed element to propagate through the service and be visible in the results of other Verified Permissions operations."
    flag:
        definition: |-
            Specifies the updated policy content that you want to replace on the specified policy. The content must be valid Cedar policy language text.

            You can change only the following elements from the policy definition:

            - The `action` referenced by the policy.
            - Any conditional clauses, such as `when` or `unless` clauses.

            You **can't** change the following elements:

            - Changing from `static` to `templateLinked`.
            - Changing the effect of the policy from `permit` or `forbid`.
            - The `principal` referenced by the policy.
            - The `resource` referenced by the policy.
        policy-id: Specifies the ID of the policy that you want to update. To find this value, you can use [ListPolicies](https://docs.aws.amazon.com/verifiedpermissions/latest/apireference/API_ListPolicies.html).
        policy-store-id: Specifies the ID of the policy store that contains the policy that you want to update.
