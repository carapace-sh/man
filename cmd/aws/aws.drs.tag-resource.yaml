name: tag-resource
description: Adds or overwrites only the specified tags for the specified Elastic Disaster Recovery resource or resources.
flags:
    --resource-arn=!: ARN of the resource for which tags are to be added or updated.
    --tags=!: Array of tags to be added or updated.
documentation:
    command: Adds or overwrites only the specified tags for the specified Elastic Disaster Recovery resource or resources. When you specify an existing tag key, the value is overwritten with the new value. Each resource can have a maximum of 50 tags. Each tag consists of a key and optional value.
    flag:
        resource-arn: ARN of the resource for which tags are to be added or updated.
        tags: Array of tags to be added or updated.
