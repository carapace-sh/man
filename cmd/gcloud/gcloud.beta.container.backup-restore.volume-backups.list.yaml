documentation:
    command: |
        *(BETA)*  List Backup for GKE volume backups.

        ## EXAMPLES

        To list all volume backups in project ``my-project'' in location ``us-central1'' under backup plan ``my-backup-plan'' under backup ``my-backup'', run:

          $ gcloud beta container backup-restore volume-backups list --backup-plan=my-backup-plan --backup=my-backup --project=my-project --location=us-central1

        To list all volume backups in project 'my-project' in location 'us-central1' under all backup plans under all backups, run:

          $ gcloud beta container backup-restore volume-backups list --project=my-project --location=us-central1

        To list all volume backups in project 'my-project' across all locations under all backup plans under all backups, run:

          $ gcloud beta container backup-restore volume-backups list --project=my-project
    flag:
        backup: |-
            ID of the backup or fully qualified identifier for the backup.
            +
            To set the `backup` attribute:
            * provide the argument `--backup` on the command line;
            * set the property `gkebackup/backup`.
        backup-plan: |-
            Backup Plan name.
            +
            To set the `backup-plan` attribute:
            * provide the argument `--backup` on the command line with a fully specified name;
            * set the property `gkebackup/backup` with a fully specified name;
            * provide the argument `--backup-plan` on the command line;
            * set the property `gkebackup/backup_plan`.
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `--backup` on the command line with a fully specified name;
            * set the property `gkebackup/backup` with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkebackup/location`.
        no-uri: |
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is determined by the
            service if it supports paging, otherwise it is *unlimited* (no paging).
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
        uri: |-
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
