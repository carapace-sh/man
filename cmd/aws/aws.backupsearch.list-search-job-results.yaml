name: list-search-job-results
description: This operation returns a list of a specified search job.
flags:
    --max-results=: The maximum number of resource list items to be returned.
    --next-token=: The next item following a partial list of returned search job results.
    --search-job-identifier=!: The unique string that specifies the search job.
documentation:
    command: This operation returns a list of a specified search job.
    flag:
        max-results: The maximum number of resource list items to be returned.
        next-token: |-
            The next item following a partial list of returned search job results.

            For example, if a request is made to return `MaxResults` number of search job results, `NextToken` allows you to return more items in your list starting at the location pointed to by the next token.
        search-job-identifier: The unique string that specifies the search job.
