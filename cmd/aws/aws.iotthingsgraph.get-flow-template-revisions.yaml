name: get-flow-template-revisions
description: Gets revisions of the specified workflow.
flags:
    --id=!: The ID of the workflow.
    --max-results=: The maximum number of results to return in the response.
    --next-token=: The string that specifies the next page of results.
documentation:
    command: Gets revisions of the specified workflow. Only the last 100 revisions are stored. If the workflow has been deprecated, this action will return revisions that occurred before the deprecation. This action won't work for workflows that have been deleted.
    flag:
        id: |-
            The ID of the workflow.

            The ID should be in the following format.

            `urn:tdm:REGION/ACCOUNT ID/default:workflow:WORKFLOWNAME`
        max-results: The maximum number of results to return in the response.
        next-token: The string that specifies the next page of results. Use this when you're paginating results.
