name: describe-hybrid-adupdate
description: Retrieves information about update activities for a hybrid directory.
flags:
    --directory-id=!: The identifier of the hybrid directory for which to retrieve update information.
    --next-token=: The pagination token from a previous request to [DescribeHybridADUpdate]().
    --update-type=: The type of update activities to retrieve.
completion:
    flag:
        update-type:
            - SelfManagedInstances
            - HybridAdministratorAccount
documentation:
    command: Retrieves information about update activities for a hybrid directory. This operation provides details about configuration changes, administrator account updates, and self-managed instance settings (IDs and DNS IPs).
    flag:
        directory-id: The identifier of the hybrid directory for which to retrieve update information.
        next-token: The pagination token from a previous request to [DescribeHybridADUpdate](). Pass null if this is the first request.
        update-type: The type of update activities to retrieve. Valid values include `SelfManagedInstances` and `HybridAdministratorAccount`.
