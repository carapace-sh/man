name: get-schema-analysis-rule
description: Retrieves a schema analysis rule.
flags:
    --collaboration-identifier=!: A unique identifier for the collaboration that the schema belongs to.
    --name=!: The name of the schema to retrieve the analysis rule for.
    --type=!: The type of the schema analysis rule to retrieve.
completion:
    flag:
        type:
            - AGGREGATION
            - LIST
            - CUSTOM
            - ID_MAPPING_TABLE
documentation:
    command: Retrieves a schema analysis rule.
    flag:
        collaboration-identifier: A unique identifier for the collaboration that the schema belongs to. Currently accepts a collaboration ID.
        name: The name of the schema to retrieve the analysis rule for.
        type: The type of the schema analysis rule to retrieve. Schema analysis rules are uniquely identified by a combination of the collaboration, the schema name, and their type.
