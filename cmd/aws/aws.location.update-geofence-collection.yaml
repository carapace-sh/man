name: update-geofence-collection
description: Updates the specified properties of a given geofence collection.
flags:
    --collection-name=!: The name of the geofence collection to update.
    --description=: Updates the description for the geofence collection.
    --pricing-plan-data-source=: This parameter is no longer used.
    --pricing-plan=: No longer used.
completion:
    flag:
        pricing-plan:
            - RequestBasedUsage
            - MobileAssetTracking
            - MobileAssetManagement
documentation:
    command: Updates the specified properties of a given geofence collection.
    flag:
        collection-name: The name of the geofence collection to update.
        description: Updates the description for the geofence collection.
        pricing-plan: No longer used. If included, the only allowed value is `RequestBasedUsage`.
        pricing-plan-data-source: This parameter is no longer used.
