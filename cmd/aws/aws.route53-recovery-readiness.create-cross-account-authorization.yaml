name: create-cross-account-authorization
description: Creates a cross-account readiness authorization.
flags:
    --cross-account-authorization=!: The cross-account authorization.
documentation:
    command: Creates a cross-account readiness authorization. This lets you authorize another account to work with Route 53 Application Recovery Controller, for example, to check the readiness status of resources in a separate account.
    flag:
        cross-account-authorization: The cross-account authorization.
