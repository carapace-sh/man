name: create-plan
description: Creates a new Region switch plan.
flags:
    --associated-alarms=: The alarms associated with a Region switch plan.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The description of a Region switch plan.
    --execution-role=!: An execution role is a way to categorize a Region switch plan.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of a Region switch plan.
    --primary-region=: The primary Amazon Web Services Region for the application.
    --recovery-approach=!: The recovery approach for a Region switch plan, which can be active/active (activeActive) or active/passive (activePassive).
    --recovery-time-objective-minutes=: Optionally, you can specify an recovery time objective for a Region switch plan, in minutes.
    --regions=!:
        description: An array that specifies the Amazon Web Services Regions for a Region switch plan.
        nargs: -1
    --tags=: The tags to apply to the Region switch plan.
    --triggers=:
        description: The triggers associated with a Region switch plan.
        nargs: -1
    --workflows=!:
        description: An array of workflows included in a Region switch plan.
        nargs: -1
completion:
    flag:
        recovery-approach:
            - activeActive
            - activePassive
documentation:
    command: |-
        Creates a new Region switch plan. A plan defines the steps required to shift traffic from one Amazon Web Services Region to another.

        You must specify a name for the plan, the primary Region, and at least one additional Region. You can also provide a description, execution role, recovery time objective, associated alarms, triggers, and workflows that define the steps to execute during a Region switch.
    flag:
        associated-alarms: The alarms associated with a Region switch plan.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The description of a Region switch plan.
        execution-role: An execution role is a way to categorize a Region switch plan.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of a Region switch plan.
        primary-region: The primary Amazon Web Services Region for the application. This is the Region where the application normally runs before any Region switch occurs.
        recovery-approach: The recovery approach for a Region switch plan, which can be active/active (activeActive) or active/passive (activePassive).
        recovery-time-objective-minutes: Optionally, you can specify an recovery time objective for a Region switch plan, in minutes.
        regions: An array that specifies the Amazon Web Services Regions for a Region switch plan. Specify two Regions.
        tags: The tags to apply to the Region switch plan.
        triggers: The triggers associated with a Region switch plan.
        workflows: An array of workflows included in a Region switch plan.
