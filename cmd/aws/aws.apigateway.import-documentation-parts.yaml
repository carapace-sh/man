name: import-documentation-parts
description: Imports documentation parts
flags:
    --body=!: Raw byte array representing the to-be-imported documentation parts.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --fail-on-warnings: A query parameter to specify whether to rollback the documentation importation (`true`) or not (`false`) when a warning is encountered.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --mode=: A query parameter to indicate whether to overwrite (`overwrite`) any existing DocumentationParts definition or to merge (`merge`) the new definition into the existing one.
    --no-fail-on-warnings: A query parameter to specify whether to rollback the documentation importation (`true`) or not (`false`) when a warning is encountered.
    --rest-api-id=!: The string identifier of the associated RestApi.
completion:
    flag:
        mode:
            - merge
            - overwrite
documentation:
    command: Imports documentation parts
    flag:
        body: Raw byte array representing the to-be-imported documentation parts. To import from an OpenAPI file, this is a JSON object.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        fail-on-warnings: A query parameter to specify whether to rollback the documentation importation (`true`) or not (`false`) when a warning is encountered. The default value is `false`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        mode: A query parameter to indicate whether to overwrite (`overwrite`) any existing DocumentationParts definition or to merge (`merge`) the new definition into the existing one. The default value is `merge`.
        rest-api-id: The string identifier of the associated RestApi.
