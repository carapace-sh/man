name: mark-as-archived
description: Archives specific Source Servers by setting the SourceServer.isArchived property to true for specified SourceServers by ID.
flags:
    --account-id=: Mark as archived by Account ID.
    --source-server-id=!: Mark as archived by Source Server ID.
documentation:
    command: Archives specific Source Servers by setting the SourceServer.isArchived property to true for specified SourceServers by ID. This command only works for SourceServers with a lifecycle. state which equals DISCONNECTED or CUTOVER.
    flag:
        account-id: Mark as archived by Account ID.
        source-server-id: Mark as archived by Source Server ID.
