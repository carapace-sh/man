name: get-event-configuration
description: Retrieves the current event configuration settings for the specified event data store, including details about maximum event size and context key selectors configured for the event data store.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --event-data-store=: The Amazon Resource Name (ARN) or ID suffix of the ARN of the event data store for which you want to retrieve event configuration settings.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
documentation:
    command: Retrieves the current event configuration settings for the specified event data store, including details about maximum event size and context key selectors configured for the event data store.
    flag:
