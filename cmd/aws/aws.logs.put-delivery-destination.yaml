name: put-delivery-destination
description: Creates or updates a logical *delivery destination*.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --delivery-destination-configuration=: A structure that contains the ARN of the Amazon Web Services resource that will receive the logs.
    --delivery-destination-type=: The type of delivery destination.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: A name for this delivery destination.
    --output-format=: The format for the logs that this delivery destination will receive.
    --tags=: An optional list of key-value pairs to associate with the resource.
completion:
    flag:
        delivery-destination-type:
            - S3
            - CWL
            - FH
            - XRAY
        output-format:
            - json
            - plain
            - w3c
            - raw
            - parquet
documentation:
    command: |-
        Creates or updates a logical *delivery destination*. A delivery destination is an Amazon Web Services resource that represents an Amazon Web Services service that logs can be sent to. CloudWatch Logs, Amazon S3, and Firehose are supported as logs delivery destinations and X-Ray as the trace delivery destination.

        To configure logs delivery between a supported Amazon Web Services service and a destination, you must do the following:

        - Create a delivery source, which is a logical object that represents the resource that is actually sending the logs. For more information, see [PutDeliverySource](https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_PutDeliverySource.html).
        - Use `PutDeliveryDestination` to create a *delivery destination* in the same account of the actual delivery destination. The delivery destination that you create is a logical object that represents the actual delivery destination.
        - If you are delivering logs cross-account, you must use [PutDeliveryDestinationPolicy](https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_PutDeliveryDestinationPolicy.html) in the destination account to assign an IAM policy to the destination. This policy allows delivery to that destination.
        - Use `CreateDelivery` to create a *delivery* by pairing exactly one delivery source and one delivery destination. For more information, see [CreateDelivery](https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_CreateDelivery.html).

        You can configure a single delivery source to send logs to multiple destinations by creating multiple deliveries. You can also create multiple deliveries to configure multiple delivery sources to send logs to the same delivery destination.

        Only some Amazon Web Services services support being configured as a delivery source. These services are listed as **Supported \[V2 Permissions]** in the table at [Enabling logging from Amazon Web Services services.](https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/AWS-logs-and-resource-policy.html)

        If you use this operation to update an existing delivery destination, all the current delivery destination parameters are overwritten with the new parameter values that you specify.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        delivery-destination-configuration: |-
            A structure that contains the ARN of the Amazon Web Services resource that will receive the logs.

            `deliveryDestinationConfiguration` is required for CloudWatch Logs, Amazon S3, Firehose log delivery destinations and not required for X-Ray trace delivery destinations. `deliveryDestinationType` is needed for X-Ray trace delivery destinations but not required for other logs delivery destinations.
        delivery-destination-type: |-
            The type of delivery destination. This parameter specifies the target service where log data will be delivered. Valid values include:

            - `S3` - Amazon S3 for long-term storage and analytics
            - `CWL` - CloudWatch Logs for centralized log management
            - `FH` - Amazon Kinesis Data Firehose for real-time data streaming
            - `XRAY` - Amazon Web Services X-Ray for distributed tracing and application monitoring

            The delivery destination type determines the format and configuration options available for log delivery.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: A name for this delivery destination. This name must be unique for all delivery destinations in your account.
        output-format: The format for the logs that this delivery destination will receive.
        tags: |-
            An optional list of key-value pairs to associate with the resource.

            For more information about tagging, see [Tagging Amazon Web Services resources](https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html)
