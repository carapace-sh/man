name: get-link-attributes
description: Retrieves attributes that are associated with a typed link.
flags:
    --attribute-names=!: A list of attribute names whose values will be retrieved.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --consistency-level=: The consistency level at which to retrieve the attributes on a typed link.
    --directory-arn=!: The Amazon Resource Name (ARN) that is associated with the Directory where the typed link resides.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --typed-link-specifier=!: Allows a typed link specifier to be accepted as input.
completion:
    flag:
        consistency-level:
            - SERIALIZABLE
            - EVENTUAL
documentation:
    command: Retrieves attributes that are associated with a typed link.
    flag:
        attribute-names: A list of attribute names whose values will be retrieved.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        consistency-level: The consistency level at which to retrieve the attributes on a typed link.
        directory-arn: The Amazon Resource Name (ARN) that is associated with the Directory where the typed link resides. For more information, see [arns]() or [Typed Links](https://docs.aws.amazon.com/clouddirectory/latest/developerguide/directory_objects_links.html#directory_objects_links_typedlink).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        typed-link-specifier: Allows a typed link specifier to be accepted as input.
