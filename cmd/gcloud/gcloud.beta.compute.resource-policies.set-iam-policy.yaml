name: set-iam-policy
description: '*(BETA)*  Set the IAM policy for a Compute Engine resource policy.'
flags:
    --region=: The name of the Google Compute Engine region.
documentation:
    command: |
        *(BETA)*  Set the IAM policy for the given resource policy as defined in a JSON or YAML file.
    flag:
        region: |-
            The name of the Google Compute Engine region.
            +
            To set the `region` attribute:
            * provide the argument `resource_policy` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `compute/region`.
