name: update
description: Change the status of a service account HMAC.
flags:
    --activate: Sets the state of the specified key to ``ACTIVE''.
    --deactivate: Sets the state of the specified key to ``INACTIVE''.
    --etag=: If provided, the update will only be performed if the specified etag
    --no-activate&: Sets the state of the specified key to ``ACTIVE''.
    --no-deactivate&: Sets the state of the specified key to ``INACTIVE''.
documentation:
    command: |
        *gcloud storage hmac update* sets the state of the specified key. Valid state arguments
        are ``ACTIVE'' and ``INACTIVE''. To set a key to state ``DELETED'', use
        *gcloud storage hmac delete* on an ``INACTIVE'' key. If an etag is set in
        the command, it will only succeed if the provided etag matches the etag
        of the stored key.
    flag:
        activate: Sets the state of the specified key to ``ACTIVE''.
        deactivate: Sets the state of the specified key to ``INACTIVE''.
        etag: |-
            If provided, the update will only be performed if the specified etag
            matches the etag of the stored key.
        no-activate: Sets the state of the specified key to ``ACTIVE''.
        no-deactivate: Sets the state of the specified key to ``INACTIVE''.
