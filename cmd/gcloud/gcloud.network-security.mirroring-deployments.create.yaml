name: create
description: Create a Mirroring Deployment.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: Description of the mirroring deployment
    --forwarding-rule-location=: The Cloud region for the forwardingRule.
    --forwarding-rule=!: ID of the forwardingRule or fully qualified identifier for the forwardingRule.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: Location of the mirroring deployment.
    --max-wait=: Time to synchronously wait for the operation to complete, after which the operation continues asynchronously.
    --mirroring-deployment-group-location=: Location of the mirroring deployment group.
    --mirroring-deployment-group=!: ID of the mirroring deployment group or fully qualified identifier for the mirroring deployment group.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |+
        Create a mirroring deployment. Successful creation of a deployment results
        in a deployment in ACTIVE state. Check the progress of deployment creation
        by using `gcloud network-security mirroring-deployments list`.

        For more examples, refer to the EXAMPLES section below.

    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        description: Description of the mirroring deployment
        forwarding-rule: |-
            ID of the forwardingRule or fully qualified identifier for the forwardingRule.
            +
            To set the `forwarding-rule-id` attribute:
            * provide the argument `--forwarding-rule` on the command line.
        forwarding-rule-location: |-
            The Cloud region for the forwardingRule.
            +
            To set the `forwarding-rule-location` attribute:
            * provide the argument `--forwarding-rule` on the command line with a fully specified name;
            * provide the argument `--forwarding-rule-location` on the command line.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            Location of the mirroring deployment.
            +
            To set the `location` attribute:
            * provide the argument `MIRRORING_DEPLOYMENT` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        max-wait: Time to synchronously wait for the operation to complete, after which the operation continues asynchronously. Ignored if --no-async isn't specified. See $ gcloud topic datetimes for information on time formats.
        mirroring-deployment-group: |-
            ID of the mirroring deployment group or fully qualified identifier for the mirroring deployment group.
            +
            To set the `id` attribute:
            * provide the argument `--mirroring-deployment-group` on the command line.
        mirroring-deployment-group-location: |-
            Location of the mirroring deployment group.
            +
            To set the `location` attribute:
            * provide the argument `--mirroring-deployment-group` on the command line with a fully specified name;
            * provide the argument `--mirroring-deployment-group-location` on the command line;
            * provide the argument `networksecurity.projects.locations.mirroringDeployments` on the command line with a fully specified name.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
