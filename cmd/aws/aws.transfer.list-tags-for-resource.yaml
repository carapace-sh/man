name: list-tags-for-resource
description: Lists all of the tags associated with the Amazon Resource Name (ARN) that you specify.
flags:
    --arn=!: Requests the tags associated with a particular Amazon Resource Name (ARN).
    --max-results=: Specifies the number of tags to return as a response to the `ListTagsForResource` request.
    --next-token=: When you request additional results from the `ListTagsForResource` operation, a `NextToken` parameter is returned in the input.
documentation:
    command: Lists all of the tags associated with the Amazon Resource Name (ARN) that you specify. The resource can be a user, server, or role.
    flag:
        arn: Requests the tags associated with a particular Amazon Resource Name (ARN). An ARN is an identifier for a specific Amazon Web Services resource, such as a server, user, or role.
        max-results: Specifies the number of tags to return as a response to the `ListTagsForResource` request.
        next-token: When you request additional results from the `ListTagsForResource` operation, a `NextToken` parameter is returned in the input. You can then pass in a subsequent command to the `NextToken` parameter to continue listing additional tags.
