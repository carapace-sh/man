name: describe-security-policy
description: Describes the security policy that is attached to your server or SFTP connector.
flags:
    --security-policy-name=!: Specify the text name of the security policy for which you want the details.
documentation:
    command: Describes the security policy that is attached to your server or SFTP connector. The response contains a description of the security policy's properties. For more information about security policies, see [Working with security policies for servers](https://docs.aws.amazon.com/transfer/latest/userguide/security-policies.html) or [Working with security policies for SFTP connectors](https://docs.aws.amazon.com/transfer/latest/userguide/security-policies-connectors.html).
    flag:
        security-policy-name: Specify the text name of the security policy for which you want the details.
