name: delete-db-cluster
description: Deletes a previously provisioned cluster.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --db-cluster-identifier=!: The cluster identifier for the cluster to be deleted.
    --final-db-snapshot-identifier=: The cluster snapshot identifier of the new cluster snapshot created when `SkipFinalSnapshot` is set to `false`.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-skip-final-snapshot: Determines whether a final cluster snapshot is created before the cluster is deleted.
    --skip-final-snapshot: Determines whether a final cluster snapshot is created before the cluster is deleted.
documentation:
    command: Deletes a previously provisioned cluster. When you delete a cluster, all automated backups for that cluster are deleted and can't be recovered. Manual DB cluster snapshots of the specified cluster are not deleted.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        db-cluster-identifier: |-
            The cluster identifier for the cluster to be deleted. This parameter isn't case sensitive.

            Constraints:

            - Must match an existing `DBClusterIdentifier`.
        final-db-snapshot-identifier: |-
            The cluster snapshot identifier of the new cluster snapshot created when `SkipFinalSnapshot` is set to `false`.

            Specifying this parameter and also setting the `SkipFinalShapshot` parameter to `true` results in an error.

            Constraints:

            - Must be from 1 to 255 letters, numbers, or hyphens.
            - The first character must be a letter.
            - Cannot end with a hyphen or contain two consecutive hyphens.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        skip-final-snapshot: |-
            Determines whether a final cluster snapshot is created before the cluster is deleted. If `true` is specified, no cluster snapshot is created. If `false` is specified, a cluster snapshot is created before the DB cluster is deleted.

            If `SkipFinalSnapshot` is `false`, you must specify a `FinalDBSnapshotIdentifier` parameter.

            Default: `false`
