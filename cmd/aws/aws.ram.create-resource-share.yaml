name: create-resource-share
description: Creates a resource share.
flags:
    --allow-external-principals: Specifies whether principals outside your organization in Organizations can be associated with a resource share.
    --client-token=: Specifies a unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --name=!: Specifies the name of the resource share.
    --no-allow-external-principals: Specifies whether principals outside your organization in Organizations can be associated with a resource share.
    --permission-arns=: Specifies the [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) of the RAM permission to associate with the resource share.
    --principals=: Specifies a list of one or more principals to associate with the resource share.
    --resource-arns=: Specifies a list of one or more ARNs of the resources to associate with the resource share.
    --sources=: Specifies from which source accounts the service principal has access to the resources in this resource share.
    --tags=: Specifies one or more tags to attach to the resource share itself.
documentation:
    command: |-
        Creates a resource share. You can provide a list of the [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) for the resources that you want to share, a list of principals you want to share the resources with, and the permissions to grant those principals.

        Sharing a resource makes it available for use by principals outside of the Amazon Web Services account that created the resource. Sharing doesn't change any permissions or quotas that apply to the resource in the account that created it.
    flag:
        allow-external-principals: Specifies whether principals outside your organization in Organizations can be associated with a resource share. A value of `true` lets you share with individual Amazon Web Services accounts that are *not* in your organization. A value of `false` only has meaning if your account is a member of an Amazon Web Services Organization. The default value is `true`.
        client-token: |-
            Specifies a unique, case-sensitive identifier that you provide to ensure the idempotency of the request. This lets you safely retry the request without accidentally performing the same operation a second time. Passing the same value to a later call to an operation requires that you also pass the same value for all other parameters. We recommend that you use a [UUID type of value.](https://wikipedia.org/wiki/Universally_unique_identifier).

            If you don't provide this value, then Amazon Web Services generates a random one for you.

            If you retry the operation with the same `ClientToken`, but with different parameters, the retry fails with an `IdempotentParameterMismatch` error.
        name: Specifies the name of the resource share.
        permission-arns: Specifies the [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) of the RAM permission to associate with the resource share. If you do not specify an ARN for the permission, RAM automatically attaches the default version of the permission for each resource type. You can associate only one permission with each resource type included in the resource share.
        principals: |-
            Specifies a list of one or more principals to associate with the resource share.

            You can include the following values:

            - An Amazon Web Services account ID, for example: `123456789012`
            - An [Amazon Resource Name (ARN)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) of an organization in Organizations, for example: `organizations::123456789012:organization/o-exampleorgid`
            - An ARN of an organizational unit (OU) in Organizations, for example: `organizations::123456789012:ou/o-exampleorgid/ou-examplerootid-exampleouid123`
            - An ARN of an IAM role, for example: `iam::123456789012:role/rolename`
            - An ARN of an IAM user, for example: `iam::123456789012user/username`

            Not all resource types can be shared with IAM roles and users. For more information, see [Sharing with IAM roles and users](https://docs.aws.amazon.com/ram/latest/userguide/permissions.html#permissions-rbp-supported-resource-types) in the *Resource Access Manager User Guide*.
        resource-arns: Specifies a list of one or more ARNs of the resources to associate with the resource share.
        sources: Specifies from which source accounts the service principal has access to the resources in this resource share.
        tags: Specifies one or more tags to attach to the resource share itself. It doesn't attach the tags to the resources associated with the resource share.
