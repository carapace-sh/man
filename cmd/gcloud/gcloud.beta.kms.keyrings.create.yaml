name: create
description: '*(BETA)*  Create a new keyring.'
flags:
    --location=: The Google Cloud location for the keyring.
documentation:
    command: |-
        *(BETA)*  Creates a new keyring within the given location.

        ## Examples

        The following command creates a keyring named `fellowship` within the
        location `global`:

          $ gcloud beta kms keyrings create fellowship --location=global
    flag:
        location: |-
            The Google Cloud location for the keyring.
            +
            To set the `location` attribute:
            * provide the argument `keyring` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
