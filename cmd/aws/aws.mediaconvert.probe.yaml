name: probe
description: Use Probe to obtain detailed information about your input media files.
flags:
    --input-files=: Specify a media file to probe.
documentation:
    command: Use Probe to obtain detailed information about your input media files. Probe returns a JSON that includes container, codec, frame rate, resolution, track count, audio layout, captions, and more. You can use this information to learn more about your media files, or to help make decisions while automating your transcoding workflow.
    flag:
        input-files: Specify a media file to probe.
