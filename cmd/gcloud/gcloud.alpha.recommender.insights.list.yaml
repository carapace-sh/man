name: list
description: '*(ALPHA)*  List insights for Google Cloud resources.'
flags:
    --billing-account=: The Google Cloud Platform billing account ID to use for this invocation.
    --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
    --folder=: The Google Cloud Platform folder ID to use for this invocation.
    --insight-type=: Insight type to list insights for.
    --limit=: Maximum number of resources to list.
    --location=: Location to list insights for.
    --no-recursive&: ""
    --no-uri&: Print a list of resource URIs instead of the default output, and change the
    --organization=: The Google Cloud Platform organization ID to use for this invocation.
    --page-size=: Some services group resource list output into pages.
    --recursive: In addition to listing the insights for the specified organization
    --sort-by=: Comma-separated list of resource field key names to sort by.
    --uri: Print a list of resource URIs instead of the default output, and change the
documentation:
    command: |-
        *(ALPHA)*  This command lists all insights for the specified Google Cloud resource,
        location, and insight type. If an insight type or location is not specified,
        insights for all supported insight types or locations, respectively, are
        listed. If the `--recursive` flag is set, insights for child resources and
        projects are also listed. Supported insight types can be found here:
        https://cloud.google.com/recommender/docs/insights/insight-types.
    flag:
        billing-account: The Google Cloud Platform billing account ID to use for this invocation.
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        folder: The Google Cloud Platform folder ID to use for this invocation.
        insight-type: 'Insight type to list insights for. If no insight type is specified, insights for all supported insight types are listed. Supported insight types can be found here: https://cloud.google.com/recommender/docs/insights/insight-types Not specifying an insight-type can add a minute to the runtime.'
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        location: Location to list insights for. If no location is specified, insights for all supported locations are listed. Not specifying a location can add 15-20 seconds to the runtime.
        no-recursive: |
            In addition to listing the insights for the specified organization
            or folder, recursively list all of
            the insights for the resource's child resources, including
            their descendants (for example, a folder's sub-folders), and for
            the resource's child projects. For example, when using the
            `--recursive` flag and specifying an organization, the response
            lists all of the insights associated with that
            organization, all of the insights associated with that
            organization's folders and sub-folders, and all of the
            insights associated with that organization's child
            projects. The maximum number of resources (organization,
            folders, projects, and descendant resources) that can be accessed at
            once with the `--recursive` flag is 100. For a larger
            number of nested resources, use
            [BigQuery export](https://cloud.google.com/recommender/docs/bq-export/export-recommendations-to-bq).
            Using `--recursive` can add 15-20 seconds per resource to the
            runtime.
        no-uri: |
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
        organization: The Google Cloud Platform organization ID to use for this invocation.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is determined by the
            service if it supports paging, otherwise it is *unlimited* (no paging).
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        recursive: |-
            In addition to listing the insights for the specified organization
            or folder, recursively list all of
            the insights for the resource's child resources, including
            their descendants (for example, a folder's sub-folders), and for
            the resource's child projects. For example, when using the
            `--recursive` flag and specifying an organization, the response
            lists all of the insights associated with that
            organization, all of the insights associated with that
            organization's folders and sub-folders, and all of the
            insights associated with that organization's child
            projects. The maximum number of resources (organization,
            folders, projects, and descendant resources) that can be accessed at
            once with the `--recursive` flag is 100. For a larger
            number of nested resources, use
            [BigQuery export](https://cloud.google.com/recommender/docs/bq-export/export-recommendations-to-bq).
            Using `--recursive` can add 15-20 seconds per resource to the
            runtime. Use *--recursive* to enable and *--no-recursive* to disable.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
        uri: |-
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
