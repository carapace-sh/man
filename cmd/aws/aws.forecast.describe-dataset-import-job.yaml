name: describe-dataset-import-job
description: Describes a dataset import job created using the [CreateDatasetImportJob](https://docs.aws.amazon.com/forecast/latest/dg/API_CreateDatasetImportJob.html) operation.
flags:
    --dataset-import-job-arn=!: The Amazon Resource Name (ARN) of the dataset import job.
documentation:
    command: |-
        Describes a dataset import job created using the [CreateDatasetImportJob](https://docs.aws.amazon.com/forecast/latest/dg/API_CreateDatasetImportJob.html) operation.

        In addition to listing the parameters provided in the `CreateDatasetImportJob` request, this operation includes the following properties:

        - `CreationTime`
        - `LastModificationTime`
        - `DataSize`
        - `FieldStatistics`
        - `Status`
        - `Message` - If an error occurred, information about the error.
    flag:
        dataset-import-job-arn: The Amazon Resource Name (ARN) of the dataset import job.
