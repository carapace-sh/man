name: list-reviewable-hits
description: The `ListReviewableHITs` operation retrieves the HITs with Status equal to Reviewable or Status equal to Reviewing that belong to the Requester calling the operation.
flags:
    --hittype-id=: The ID of the HIT type of the HITs to consider for the query.
    --max-results=: Limit the number of results returned.
    --next-token=: Pagination Token
    --status=: Can be either `Reviewable` or `Reviewing`.
completion:
    flag:
        status:
            - Reviewable
            - Reviewing
documentation:
    command: The `ListReviewableHITs` operation retrieves the HITs with Status equal to Reviewable or Status equal to Reviewing that belong to the Requester calling the operation.
    flag:
        hittype-id: The ID of the HIT type of the HITs to consider for the query. If not specified, all HITs for the Reviewer are considered
        max-results: Limit the number of results returned.
        next-token: Pagination Token
        status: Can be either `Reviewable` or `Reviewing`. Reviewable is the default value.
