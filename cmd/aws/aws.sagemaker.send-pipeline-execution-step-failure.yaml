name: send-pipeline-execution-step-failure
description: Notifies the pipeline that the execution of a callback step failed, along with a message describing why.
flags:
    --callback-token=!: The pipeline generated token from the Amazon SQS queue.
    --client-request-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the operation.
    --failure-reason=: A message describing why the step failed.
documentation:
    command: Notifies the pipeline that the execution of a callback step failed, along with a message describing why. When a callback step is run, the pipeline generates a callback token and includes the token in a message sent to Amazon Simple Queue Service (Amazon SQS).
    flag:
        callback-token: The pipeline generated token from the Amazon SQS queue.
        client-request-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the operation. An idempotent operation completes no more than one time.
        failure-reason: A message describing why the step failed.
