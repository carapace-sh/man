name: detect-pii-entities
description: Inspects the input text for entities that contain personally identifiable information (PII) and returns information about them.
flags:
    --language-code=!: The language of the input text.
    --text=!: A UTF-8 text string.
completion:
    flag:
        language-code:
            - en
            - es
            - fr
            - de
            - it
            - pt
            - ar
            - hi
            - ja
            - ko
            - zh
            - zh-TW
documentation:
    command: Inspects the input text for entities that contain personally identifiable information (PII) and returns information about them.
    flag:
        language-code: The language of the input text. Enter the language code for English (en) or Spanish (es).
        text: A UTF-8 text string. The maximum string size is 100 KB.
