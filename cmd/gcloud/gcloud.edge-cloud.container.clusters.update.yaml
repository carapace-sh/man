name: update
description: Update an Edge Container cluster.
flags:
    --add-maintenance-exclusion-end=: End time of the maintenance exclusion window in the RFC 3339
    --add-maintenance-exclusion-name=: Unique name (per cluster) of the maintenance exclusion window that can be used to remove it.
    --add-maintenance-exclusion-start=: Start time of the maintenance exclusion window (can occur in the past) in the RFC 3339
    --async: Return immediately, without waiting for the operation in progress to
    --clear-maintenance-window: If set, removes the maintenance window setting from the cluster.
    --container-default-runtime-class=: If set, use the specified default container runtime class for the cluster.
    --control-plane-kms-key=: If set, use the specified KMS key for the cluster control plane nodes encryption.
    --location=: The global location name.
    --maintenance-window-end=: End time of the recurring cluster maintenance window in the [RFC 3339](https://www.rfc-editor.org/rfc/rfc3339.txt)
    --maintenance-window-recurrence=: An [RFC 5545](https://tools.ietf.org/html/rfc5545#section-3.8.5.3)
    --maintenance-window-start=: Start time of the recurring cluster maintenance window in the [RFC 3339](https://www.rfc-editor.org/rfc/rfc3339.txt)
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-maintenance-window&: If set, removes the maintenance window setting from the cluster.
    --no-use-google-managed-key&: If set, use Google managed key for the cluster control plane nodes encryption.
    --no-use-google-managed-zone-key&: If set, use Google managed key for zone storage encryption.
    --offline-reboot-ttl=: Specifies the maximum duration a node can reboot offline (without connection to Google) and
    --release-channel=: Release channel a cluster is subscribed to.
    --remove-maintenance-exclusion-window=: Name of the maintenance exclusion to remove.
    --use-google-managed-key: If set, use Google managed key for the cluster control plane nodes encryption.
    --use-google-managed-zone-key: If set, use Google managed key for zone storage encryption.
    --zone-storage-kms-key=: If set, use the specified KMS key for zone storage encryption.
completion:
    flag:
        release-channel:
            - none
            - regular
            - release-channel-unspecified
documentation:
    command: |
        Update an Edge Container cluster.
    flag:
        add-maintenance-exclusion-end: |-
            End time of the maintenance exclusion window in the RFC 3339
            (https://www.rfc-editor.org/rfc/rfc3339.txt) format. E.g.
            "2021-01-01T00:00:00Z" or "2021-01-01T00:00:00-05:00".
        add-maintenance-exclusion-name: Unique name (per cluster) of the maintenance exclusion window that can be used to remove it.
        add-maintenance-exclusion-start: |-
            Start time of the maintenance exclusion window (can occur in the past) in the RFC 3339
            (https://www.rfc-editor.org/rfc/rfc3339.txt) format. E.g.
            "2021-01-01T00:00:00Z" or "2021-01-01T00:00:00-05:00".
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        clear-maintenance-window: If set, removes the maintenance window setting from the cluster. If any exclusion windows exist, they must be removed beforehand as a maintenance policy cannot exist without a maintenance window.
        container-default-runtime-class: If set, use the specified default container runtime class for the cluster.
        control-plane-kms-key: If set, use the specified KMS key for the cluster control plane nodes encryption.
        location: |-
            The global location name.
            +
            To set the `location` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `edge_container/location`.
        maintenance-window-end: |-
            End time of the recurring cluster maintenance window in the [RFC 3339](https://www.rfc-editor.org/rfc/rfc3339.txt)
            format. E.g. "2021-01-01T00:00:00Z" or "2021-01-01T00:00:00-05:00"
        maintenance-window-recurrence: |-
            An [RFC 5545](https://tools.ietf.org/html/rfc5545#section-3.8.5.3)
            recurrence rule for how the cluster maintenance window recurs. They go
            on for the span of time between the start and the end time. E.g. FREQ=WEEKLY;BYDAY=SU.
        maintenance-window-start: |-
            Start time of the recurring cluster maintenance window in the [RFC 3339](https://www.rfc-editor.org/rfc/rfc3339.txt)
            format. E.g. "2021-01-01T00:00:00Z" or "2021-01-01T00:00:00-05:00"
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-maintenance-window: |
            If set, removes the maintenance window setting from the cluster. If any exclusion windows exist, they must be removed beforehand as a maintenance policy cannot exist without a maintenance window.
        no-use-google-managed-key: |
            If set, use Google managed key for the cluster control plane nodes encryption.
        no-use-google-managed-zone-key: |
            If set, use Google managed key for zone storage encryption.
        offline-reboot-ttl: |-
            Specifies the maximum duration a node can reboot offline (without connection to Google) and
            then rejoin its cluster to resume its designated workloads. This duration is relative to the
            machine's most recent connection to Google. The maximum allowed duration is 7 days. If left
            unspecified, the default 0 means not allowed. The parameter should be an ISO 8601 duration
            string, for example, "P1DT1H2M3S".
        release-channel: |-
            Release channel a cluster is subscribed to. It supports two values, NONE and REGULAR. NONE
            is used to opt out of any release channel. Clusters subscribed to the REGULAR channel will
            be automatically upgraded to versions that are considered GA quality, and cannot be manually
            upgraded. _RELEASE_CHANNEL_ must be one of: *none*, *regular*, *release-channel-unspecified*.
        remove-maintenance-exclusion-window: Name of the maintenance exclusion to remove.
        use-google-managed-key: If set, use Google managed key for the cluster control plane nodes encryption.
        use-google-managed-zone-key: If set, use Google managed key for zone storage encryption.
        zone-storage-kms-key: If set, use the specified KMS key for zone storage encryption.
