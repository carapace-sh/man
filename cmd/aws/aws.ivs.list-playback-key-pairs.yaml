name: list-playback-key-pairs
description: Gets summary information about playback key pairs.
flags:
    --max-results=: Maximum number of key pairs to return.
    --next-token=: The first key pair to retrieve.
documentation:
    command: Gets summary information about playback key pairs. For more information, see [Setting Up Private Channels](https://docs.aws.amazon.com/ivs/latest/userguide/private-channels.html) in the *Amazon IVS User Guide*.
    flag:
        max-results: 'Maximum number of key pairs to return. Default: your service quota or 100, whichever is smaller.'
        next-token: The first key pair to retrieve. This is used for pagination; see the `nextToken` response field.
