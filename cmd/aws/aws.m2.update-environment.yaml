name: update-environment
description: Updates the configuration details for a specific runtime environment.
flags:
    --apply-during-maintenance-window: Indicates whether to update the runtime environment during the maintenance window.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --desired-capacity=: The desired capacity for the runtime environment to update.
    --engine-version=: The version of the runtime engine for the runtime environment.
    --environment-id=!: The unique identifier of the runtime environment that you want to update.
    --force-update: Forces the updates on the environment.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-type=: The instance type for the runtime environment to update.
    --no-apply-during-maintenance-window: Indicates whether to update the runtime environment during the maintenance window.
    --no-force-update: Forces the updates on the environment.
    --preferred-maintenance-window=: Configures the maintenance window that you want for the runtime environment.
documentation:
    command: Updates the configuration details for a specific runtime environment.
    flag:
        apply-during-maintenance-window: Indicates whether to update the runtime environment during the maintenance window. The default is false. Currently, Amazon Web Services Mainframe Modernization accepts the `engineVersion` parameter only if `applyDuringMaintenanceWindow` is true. If any parameter other than `engineVersion` is provided in `UpdateEnvironmentRequest`, it will fail if `applyDuringMaintenanceWindow` is set to true.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        desired-capacity: The desired capacity for the runtime environment to update. The minimum possible value is 0 and the maximum is 100.
        engine-version: The version of the runtime engine for the runtime environment.
        environment-id: The unique identifier of the runtime environment that you want to update.
        force-update: |-
            Forces the updates on the environment. This option is needed if the applications in the environment are not stopped or if there are ongoing application-related activities in the environment.

            If you use this option, be aware that it could lead to data corruption in the applications, and that you might need to perform repair and recovery procedures for the applications.

            This option is not needed if the attribute being updated is `preferredMaintenanceWindow`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-type: The instance type for the runtime environment to update.
        preferred-maintenance-window: |-
            Configures the maintenance window that you want for the runtime environment. The maintenance window must have the format `ddd:hh24:mi-ddd:hh24:mi` and must be less than 24 hours. The following two examples are valid maintenance windows: `sun:23:45-mon:00:15` or `sat:01:00-sat:03:00`.

            If you do not provide a value, a random system-generated value will be assigned.
