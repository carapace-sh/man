name: stop-group-async-replication
description: '*(ALPHA)*  Consistently stops a group of asynchronously replicating disks.'
flags:
    --region=: Region of the consistency group's primary or secondary disks.
    --zone=: Zone of the consistency group's primary or secondary disks.
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute disks stop-group-async-replication* consistently stops a group of asynchronously replicating
        disks. This command can be invoked in either in the primary or secondary
        scope of the replicating disks.
    flag:
        region: |-
            Region of the consistency group's primary or secondary disks. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        zone: |-
            Zone of the consistency group's primary or secondary disks. If not specified and the ``compute/zone'' property isn't set, you
            might be prompted to select a zone (interactive mode only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
