name: search
description: '*(ALPHA)*  Searches for Dataplex entries.'
flags:
    --limit=: Maximum number of resources.
    --order-by=: Specifies the ordering of results, currently supported case-sensitive
    --page-size=: Maximum number of resources per page.
    --scope=: The scope under which the search should be operating.
documentation:
    command: '*(ALPHA)*  Searches for entries matching given query and scope.'
    flag:
        limit: Maximum number of resources.
        order-by: |-
            Specifies the ordering of results, currently supported case-sensitive
            choices are:
            +
            * `title [asc|desc]`, defaults to ascending if not specified.
        page-size: Maximum number of resources per page. No more than 500.
        scope: The scope under which the search should be operating. Should either be organizations/<org_id> or projects/<project_ref>. If left unspecified, it will default to the organization where the project is located.
