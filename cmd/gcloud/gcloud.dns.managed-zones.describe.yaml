name: describe
description: View the details of a Cloud DNS managed-zone.
flags:
    --location=: Specifies the desired service location the request is sent to.
documentation:
    command: |-
        This command displays the details of the specified managed-zone.

        ## EXAMPLES

        To display the details of your managed-zone, run:

          $ gcloud dns managed-zones describe my-zone

        To display the details of a zonal managed-zone in Zonal Cloud DNS service in
        us-east1-c, run:

          $ gcloud dns managed-zones describe my-zone --location=us-east1-c
    flag:
        location: Specifies the desired service location the request is sent to. Defaults to Cloud DNS global service. Use --location=global if you want to target the global service.
