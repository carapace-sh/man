name: update-settings
description: Updates Audit Manager settings for the current account.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --default-assessment-reports-destination=: The default S3 destination bucket for storing assessment reports.
    --default-export-destination=: The default S3 destination bucket for storing evidence finder exports.
    --default-process-owners=:
        description: A list of the default audit owners.
        nargs: -1
    --deregistration-policy=: The deregistration policy for your Audit Manager data.
    --evidence-finder-enabled: Specifies whether the evidence finder feature is enabled.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --kms-key=: The KMS key details.
    --no-evidence-finder-enabled: Specifies whether the evidence finder feature is enabled.
    --sns-topic=: The Amazon Simple Notification Service (Amazon SNS) topic that Audit Manager sends notifications to.
documentation:
    command: Updates Audit Manager settings for the current account.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        default-assessment-reports-destination: The default S3 destination bucket for storing assessment reports.
        default-export-destination: The default S3 destination bucket for storing evidence finder exports.
        default-process-owners: A list of the default audit owners.
        deregistration-policy: The deregistration policy for your Audit Manager data. You can use this attribute to determine how your data is handled when you deregister Audit Manager.
        evidence-finder-enabled: |-
            Specifies whether the evidence finder feature is enabled. Change this attribute to enable or disable evidence finder.

            When you use this attribute to disable evidence finder, Audit Manager deletes the event data store that’s used to query your evidence data. As a result, you can’t re-enable evidence finder and use the feature again. Your only alternative is to [deregister](https://docs.aws.amazon.com/audit-manager/latest/APIReference/API_DeregisterAccount.html) and then [re-register](https://docs.aws.amazon.com/audit-manager/latest/APIReference/API_RegisterAccount.html) Audit Manager.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        kms-key: The KMS key details.
        sns-topic: The Amazon Simple Notification Service (Amazon SNS) topic that Audit Manager sends notifications to.
