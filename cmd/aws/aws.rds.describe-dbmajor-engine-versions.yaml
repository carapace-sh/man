name: describe-dbmajor-engine-versions
description: Describes the properties of specific major versions of DB engines.
flags:
    --engine=: The database engine to return major version details for.
    --major-engine-version=: A specific database major engine version to return details for.
    --marker=: An optional pagination token provided by a previous request.
    --max-records=: The maximum number of records to include in the response.
documentation:
    command: Describes the properties of specific major versions of DB engines.
    flag:
        engine: |-
            The database engine to return major version details for.

            Valid Values:

            - `aurora-mysql`
            - `aurora-postgresql`
            - `custom-sqlserver-ee`
            - `custom-sqlserver-se`
            - `custom-sqlserver-web`
            - `db2-ae`
            - `db2-se`
            - `mariadb`
            - `mysql`
            - `oracle-ee`
            - `oracle-ee-cdb`
            - `oracle-se2`
            - `oracle-se2-cdb`
            - `postgres`
            - `sqlserver-ee`
            - `sqlserver-se`
            - `sqlserver-ex`
            - `sqlserver-web`
        major-engine-version: |-
            A specific database major engine version to return details for.

            Example: `8.4`
        marker: An optional pagination token provided by a previous request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more than the `MaxRecords` value is available, a pagination token called a marker is included in the response so you can retrieve the remaining results.

            Default: 100
