name: delete-event
description: Deletes the specified event.
flags:
    --delete-audit-history=: Specifies whether or not to delete any predictions associated with the event.
    --event-id=!: The ID of the event to delete.
    --event-type-name=!: The name of the event type.
documentation:
    command: |-
        Deletes the specified event.

        When you delete an event, Amazon Fraud Detector permanently deletes that event and the event data is no longer stored in Amazon Fraud Detector. If `deleteAuditHistory` is `True`, event data is available through search for up to 30 seconds after the delete operation is completed.
    flag:
        delete-audit-history: Specifies whether or not to delete any predictions associated with the event. If set to `True`,
        event-id: The ID of the event to delete.
        event-type-name: The name of the event type.
