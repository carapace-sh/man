name: delete-instance
description: Deletes an Amazon Lightsail instance.
flags:
    --force-delete-add-ons: A Boolean value to indicate whether to delete all add-ons for the instance.
    --instance-name=!: The name of the instance to delete.
    --no-force-delete-add-ons: A Boolean value to indicate whether to delete all add-ons for the instance.
documentation:
    command: |-
        Deletes an Amazon Lightsail instance.

        The `delete instance` operation supports tag-based access control via resource tags applied to the resource identified by `instance name`. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-controlling-access-using-tags).
    flag:
        force-delete-add-ons: A Boolean value to indicate whether to delete all add-ons for the instance.
        instance-name: The name of the instance to delete.
