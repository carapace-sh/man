name: update-data-lake-namespace
description: Enables you to programmatically update an Amazon Web Services Supply Chain data lake namespace.
flags:
    --description=: The updated description of the data lake namespace.
    --instance-id=!: The Amazon Web Services Chain instance identifier.
    --name=!: The name of the namespace.
documentation:
    command: Enables you to programmatically update an Amazon Web Services Supply Chain data lake namespace. Developers can update the description of a data lake namespace for a given instance ID and namespace name.
    flag:
        description: The updated description of the data lake namespace.
        instance-id: The Amazon Web Services Chain instance identifier.
        name: The name of the namespace. Noted you cannot update namespace with name starting with **asc**, **default**, **scn**, **aws**, **amazon**, **amzn**
