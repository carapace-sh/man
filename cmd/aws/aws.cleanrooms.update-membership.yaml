name: update-membership
description: Updates a membership.
flags:
    --default-job-result-configuration=: The default job result configuration.
    --default-result-configuration=: The default protected query result configuration as specified by the member who can receive results.
    --job-log-status=: An indicator as to whether job logging has been enabled or disabled for the collaboration.
    --membership-identifier=!: The unique identifier of the membership.
    --query-log-status=: An indicator as to whether query logging has been enabled or disabled for the membership.
completion:
    flag:
        job-log-status:
            - ENABLED
            - DISABLED
        query-log-status:
            - ENABLED
            - DISABLED
documentation:
    command: Updates a membership.
    flag:
        default-job-result-configuration: The default job result configuration.
        default-result-configuration: The default protected query result configuration as specified by the member who can receive results.
        job-log-status: |-
            An indicator as to whether job logging has been enabled or disabled for the collaboration.

            When `ENABLED`, Clean Rooms logs details about jobs run within this collaboration and those logs can be viewed in Amazon CloudWatch Logs. The default value is `DISABLED`.
        membership-identifier: The unique identifier of the membership.
        query-log-status: |-
            An indicator as to whether query logging has been enabled or disabled for the membership.

            When `ENABLED`, Clean Rooms logs details about queries run within this collaboration and those logs can be viewed in Amazon CloudWatch Logs. The default value is `DISABLED`.
