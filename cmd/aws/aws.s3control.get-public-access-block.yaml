name: get-public-access-block
description: This operation is not supported by directory buckets.
flags:
    --account-id=!: The account ID for the Amazon Web Services account whose `PublicAccessBlock` configuration you want to retrieve.
documentation:
    command: |-
        This operation is not supported by directory buckets.

        Retrieves the `PublicAccessBlock` configuration for an Amazon Web Services account. For more information, see [Using Amazon S3 block public access](https://docs.aws.amazon.com/AmazonS3/latest/dev/access-control-block-public-access.html).

        Related actions include:

        - [DeletePublicAccessBlock](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_DeletePublicAccessBlock.html)
        - [PutPublicAccessBlock](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_PutPublicAccessBlock.html)

        You must URL encode any signed header values that contain spaces. For example, if your header value is `my file.txt`, containing two spaces after `my`, you must URL encode this value to `my%20%20file.txt`.
    flag:
        account-id: The account ID for the Amazon Web Services account whose `PublicAccessBlock` configuration you want to retrieve.
