name: delete-user
description: Deletes the specified UserID within the collection.
flags:
    --client-request-token=: Idempotent token used to identify the request to `DeleteUser`.
    --collection-id=!: The ID of an existing collection from which the UserID needs to be deleted.
    --user-id=!: ID for the UserID to be deleted.
documentation:
    command: Deletes the specified UserID within the collection. Faces that are associated with the UserID are disassociated from the UserID before deleting the specified UserID. If the specified `Collection` or `UserID` is already deleted or not found, a `ResourceNotFoundException` will be thrown. If the action is successful with a 200 response, an empty HTTP body is returned.
    flag:
        client-request-token: Idempotent token used to identify the request to `DeleteUser`. If you use the same token with multiple `DeleteUser`requests, the same response is returned. Use ClientRequestToken to prevent the same request from being processed more than once.
        collection-id: The ID of an existing collection from which the UserID needs to be deleted.
        user-id: ID for the UserID to be deleted.
