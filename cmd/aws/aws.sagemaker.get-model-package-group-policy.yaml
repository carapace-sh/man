name: get-model-package-group-policy
description: Gets a resource policy that manages access for a model group.
flags:
    --model-package-group-name=!: The name of the model group for which to get the resource policy.
documentation:
    command: Gets a resource policy that manages access for a model group. For information about resource policies, see [Identity-based policies and resource-based policies](https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_identity-vs-resource.html) in the *Amazon Web Services Identity and Access Management User Guide.*.
    flag:
        model-package-group-name: The name of the model group for which to get the resource policy.
