name: get-data-lake-sources
description: Retrieves a snapshot of the current Region, including whether Amazon Security Lake is enabled for those accounts and which sources Security Lake is collecting data from.
flags:
    --accounts=: The Amazon Web Services account ID for which a static snapshot of the current Amazon Web Services Region, including enabled accounts and log sources, is retrieved.
    --max-results=: The maximum limit of accounts for which the static snapshot of the current Region, including enabled accounts and log sources, is retrieved.
    --next-token=: Lists if there are more results available.
documentation:
    command: Retrieves a snapshot of the current Region, including whether Amazon Security Lake is enabled for those accounts and which sources Security Lake is collecting data from.
    flag:
        accounts: The Amazon Web Services account ID for which a static snapshot of the current Amazon Web Services Region, including enabled accounts and log sources, is retrieved.
        max-results: The maximum limit of accounts for which the static snapshot of the current Region, including enabled accounts and log sources, is retrieved.
        next-token: |-
            Lists if there are more results available. The value of nextToken is a unique pagination token for each page. Repeat the call using the returned token to retrieve the next page. Keep all other arguments unchanged.

            Each pagination token expires after 24 hours. Using an expired pagination token will return an HTTP 400 InvalidToken error.
