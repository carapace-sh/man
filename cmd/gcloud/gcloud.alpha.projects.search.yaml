name: search
description: '*(ALPHA)*  Search for projects matching the given query.'
flags:
    --limit=: Maximum number of resources to list.
    --page-size=: This flag specifies the maximum number of projects per page.
    --query=: A boolean expression for the search criteria used to select the projects to return.
    --sort-by=: Comma-separated list of resource field key names to sort by.
documentation:
    command: |-
        *(ALPHA)*  You can specify the maximum number of projects to list using the `--limit`
        flag.

        ## EXAMPLES

        The following command lists the last five created projects with
        names starting with z, sorted by the project number (now called name)
        with 2 projects listed on each page

          $ gcloud alpha projects search --query="name:z*" --sort-by=name --limit=5 --page-size=2

        To list projects that have been marked for deletion:

          $ gcloud alpha projects search --query='state:DELETE_REQUESTED'
    flag:
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        page-size: This flag specifies the maximum number of projects per page.
        query: |-
            A boolean expression for the search criteria used to select the projects to return.
            If no search criteria is specified then all accessible projects will be returned.
            Query expressions can be used to restrict results based upon displayName, state
            and parent, where the operators `=` (`:`) `NOT`, `AND` and `OR` can be used along
            with the suffix wildcard symbol `*`. The `displayName` field in a query expression should
            use escaped quotes for values that include whitespace to prevent unexpected behavior.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
