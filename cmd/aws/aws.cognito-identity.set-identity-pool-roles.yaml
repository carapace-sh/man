name: set-identity-pool-roles
description: Sets the roles for an identity pool.
flags:
    --identity-pool-id=!: An identity pool ID in the format REGION:GUID.
    --role-mappings=: How users for a specific identity provider are to mapped to roles.
    --roles=!: The map of roles associated with this pool.
documentation:
    command: |-
        Sets the roles for an identity pool. These roles are used when making calls to [GetCredentialsForIdentity]() action.

        You must use Amazon Web Services developer credentials to call this operation.
    flag:
        identity-pool-id: An identity pool ID in the format REGION:GUID.
        role-mappings: |-
            How users for a specific identity provider are to mapped to roles. This is a string to [RoleMapping]() object map. The string identifies the identity provider, for example, `graph.facebook.com` or `cognito-idp.us-east-1.amazonaws.com/us-east-1_abcdefghi:app_client_id`.

            Up to 25 rules can be specified per identity provider.
        roles: The map of roles associated with this pool. For a given role, the key will be either "authenticated" or "unauthenticated" and the value will be the Role ARN.
