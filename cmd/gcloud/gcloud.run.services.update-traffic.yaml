name: update-traffic
description: Adjust the traffic assignments for a Cloud Run service.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --clear-tags: Remove all tags.
    --cluster-location=&: Zone in which the cluster is located.
    --cluster=&: ID of the cluster or fully qualified identifier for the cluster.
    --context=&: The name of the context in your kubectl config file to use for connecting.
    --kubeconfig=&: The absolute path to your kubectl config file.
    --namespace=: 'Specific to Cloud Run for Anthos: Kubernetes namespace for the service.'
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-tags&: Remove all tags.
    --no-to-latest&: True to assign 100 percent of traffic to the 'latest' revision of this service.
    --platform=&: Target platform for running commands.
    --region=: Region in which the resource can be found.
    --remove-tags=: List of tags to be removed.
    --set-tags=: List of key-value pairs to set as tags.
    --to-latest: True to assign 100 percent of traffic to the 'latest' revision of this service.
    --to-revisions=: Comma separated list of traffic assignments in the form REVISION-NAME=PERCENTAGE.
    --to-tags=: Comma separated list of traffic assignments in the form TAG=PERCENTAGE.
    --update-tags=: List of key-value pairs to set as tags.
completion:
    flag:
        platform:
            - gke
            - kubernetes
            - managed
documentation:
    command: |
        Adjust the traffic assignments for a Cloud Run service.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        clear-tags: Remove all tags.
        cluster: |-
            ID of the cluster or fully qualified identifier for the cluster.

            To set the `cluster` attribute:
            * provide the argument `--cluster` on the command line;
            * set the property `run/cluster`;
            * specify the cluster from a list of available clusters.
        cluster-location: |-
            Zone in which the cluster is located. Alternatively, set the property [run/cluster_location].

            To set the `location` attribute:
            * provide the argument `--cluster` on the command line with a fully specified name;
            * set the property `run/cluster` with a fully specified name;
            * specify the cluster from a list of available clusters with a fully specified name;
            * provide the argument `--cluster-location` on the command line;
            * set the property `run/cluster_location`;
            * specify the cluster location from a list of available zones.
        context: The name of the context in your kubectl config file to use for connecting.
        kubeconfig: The absolute path to your kubectl config file. If not specified, the colon- or semicolon-delimited list of paths specified by $KUBECONFIG will be used. If $KUBECONFIG is unset, this defaults to `~/.kube/config`.
        namespace: |-
            Specific to Cloud Run for Anthos: Kubernetes namespace for the service.
            +
            To set the `namespace` attribute:
            * provide the argument `SERVICE` on the command line with a fully specified name;
            * specify the service name from an interactive prompt with a fully specified name;
            * provide the argument `--namespace` on the command line;
            * set the property `run/namespace`;
            * For Cloud Run on Kubernetes Engine, defaults to "default". Otherwise, defaults to project ID.;
            * provide the argument `project` on the command line;
            * set the property `core/project`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-tags: Remove all tags.
        no-to-latest: True to assign 100 percent of traffic to the 'latest' revision of this service. Note that when a new revision is created, it will become the 'latest' and traffic will be directed to it. Defaults to False. Synonymous with '--to-revisions=LATEST=100'.
        platform: 'Target platform for running commands. Alternatively, set the property [run/platform]. '
        region: Region in which the resource can be found. Alternatively, set the property [run/region].
        remove-tags: List of tags to be removed.
        set-tags: List of key-value pairs to set as tags. All existing tags will be removed first.
        to-latest: True to assign 100 percent of traffic to the 'latest' revision of this service. Note that when a new revision is created, it will become the 'latest' and traffic will be directed to it. Defaults to False. Synonymous with '--to-revisions=LATEST=100'.
        to-revisions: Comma separated list of traffic assignments in the form REVISION-NAME=PERCENTAGE. REVISION-NAME must be the name for a revision for the service as returned by 'gcloud beta run list revisions'. PERCENTAGE must be an integer percentage between 0 and 100 inclusive.  Ex service-nw9hs=10,service-nw9hs=20 Up to 100 percent of traffic may be assigned. If 100 percent of traffic is assigned,  the Service traffic is updated as specified. If under 100 percent of traffic is assigned, the Service traffic is updated as specified for revisions with assignments and traffic is scaled up or down down proportionally as needed for revision that are currently serving traffic but that do not have new assignments. For example assume revision-1 is serving 40 percent of traffic and revision-2 is serving 60 percent. If revision-1 is assigned 45 percent of traffic and no assignment is made for revision-2, the service is updated with revsion-1 assigned 45 percent of traffic and revision-2 scaled down to 55 percent. You can use "LATEST" as a special revision name to always put the given percentage of traffic on the latest ready revision.
        to-tags: Comma separated list of traffic assignments in the form TAG=PERCENTAGE. TAG must match a traffic tag on a revision of the service. It may match a previously-set tag, or one assigned using the `--set-tags` or `--update-tags` flags on this command. PERCENTAGE must be an integer percentage between 0 and 100 inclusive. Up to 100 percent of traffic may be assigned. If 100 percent of traffic is assigned, the service traffic is updated as specified. If under 100 percent of traffic is assigned, the service traffic is updated as specified to the given tags, and other traffic is scaled up or down proportionally. For example, assume the revision tagged `next` is serving 40 percent of traffic and the revision tagged `current` is serving 60 percent. If `next` is assigned 45 percent of traffic and no assignment is made for `current`, the service is updated with `next` assigned 45 percent of traffic and `current` scaled down to 55 percent.
        update-tags: List of key-value pairs to set as tags.
