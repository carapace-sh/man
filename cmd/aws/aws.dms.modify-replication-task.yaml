name: modify-replication-task
description: Modifies the specified replication task.
flags:
    --cdc-start-position=: Indicates when you want a change data capture (CDC) operation to start.
    --cdc-start-time=: Indicates the start time for a change data capture (CDC) operation.
    --cdc-stop-position=: Indicates when you want a change data capture (CDC) operation to stop.
    --migration-type=: The migration type.
    --replication-task-arn=!: The Amazon Resource Name (ARN) of the replication task.
    --replication-task-identifier=: The replication task identifier.
    --replication-task-settings=: JSON file that contains settings for the task, such as task metadata settings.
    --table-mappings=: When using the CLI or boto3, provide the path of the JSON file that contains the table mappings.
    --task-data=: Supplemental information that the task requires to migrate the data for certain source and target endpoints.
completion:
    flag:
        migration-type:
            - full-load
            - cdc
            - full-load-and-cdc
documentation:
    command: |-
        Modifies the specified replication task.

        You can't modify the task endpoints. The task must be stopped before you can modify it.

        For more information about DMS tasks, see [Working with Migration Tasks](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Tasks.html) in the *Database Migration Service User Guide*.
    flag:
        cdc-start-position: |-
            Indicates when you want a change data capture (CDC) operation to start. Use either CdcStartPosition or CdcStartTime to specify when you want a CDC operation to start. Specifying both values results in an error.

            The value can be in date, checkpoint, or LSN/SCN format.

            Date Example: --cdc-start-position “2018-03-08T12:12:12”

            Checkpoint Example: --cdc-start-position "checkpoint:V1#27#mysql-bin-changelog.157832:1975:-1:2002:677883278264080:mysql-bin-changelog.157832:1876#0#0#\*#0#93"

            LSN Example: --cdc-start-position “mysql-bin-changelog.000024:373”

            When you use this task setting with a source PostgreSQL database, a logical replication slot should already be created and associated with the source endpoint. You can verify this by setting the `slotName` extra connection attribute to the name of this logical replication slot. For more information, see [Extra Connection Attributes When Using PostgreSQL as a Source for DMS](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Source.PostgreSQL.html#CHAP_Source.PostgreSQL.ConnectionAttrib).
        cdc-start-time: |-
            Indicates the start time for a change data capture (CDC) operation. Use either CdcStartTime or CdcStartPosition to specify when you want a CDC operation to start. Specifying both values results in an error.

            Timestamp Example: --cdc-start-time “2018-03-08T12:12:12”
        cdc-stop-position: |-
            Indicates when you want a change data capture (CDC) operation to stop. The value can be either server time or commit time.

            Server time example: --cdc-stop-position “server\_time:2018-02-09T12:12:12”

            Commit time example: --cdc-stop-position “commit\_time:2018-02-09T12:12:12“
        migration-type: 'The migration type. Valid values: `full-load` | `cdc` | `full-load-and-cdc`'
        replication-task-arn: The Amazon Resource Name (ARN) of the replication task.
        replication-task-identifier: |-
            The replication task identifier.

            Constraints:

            - Must contain 1-255 alphanumeric characters or hyphens.
            - First character must be a letter.
            - Cannot end with a hyphen or contain two consecutive hyphens.
        replication-task-settings: JSON file that contains settings for the task, such as task metadata settings.
        table-mappings: When using the CLI or boto3, provide the path of the JSON file that contains the table mappings. Precede the path with `file://`. For example, `--table-mappings file://mappingfile.json`. When working with the DMS API, provide the JSON as the parameter value.
        task-data: Supplemental information that the task requires to migrate the data for certain source and target endpoints. For more information, see [Specifying Supplemental Data for Task Settings](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Tasks.TaskData.html) in the *Database Migration Service User Guide.*
