name: get-sessions-statistics-aggregation
description: Gets a set of statistics for queues or farms.
flags:
    --aggregation-id=!: The identifier returned by the `StartSessionsStatisticsAggregation` operation that identifies the aggregated statistics.
    --farm-id=!: The identifier of the farm to include in the statistics.
    --max-results=: The maximum number of results to return.
    --next-token=: The token for the next set of results, or `null` to start from the beginning.
documentation:
    command: Gets a set of statistics for queues or farms. Before you can call the `GetSessionStatisticsAggregation` operation, you must first call the `StartSessionsStatisticsAggregation` operation. Statistics are available for 1 hour after you call the `StartSessionsStatisticsAggregation` operation.
    flag:
        aggregation-id: The identifier returned by the `StartSessionsStatisticsAggregation` operation that identifies the aggregated statistics.
        farm-id: The identifier of the farm to include in the statistics. This should be the same as the farm ID used in the call to the `StartSessionsStatisticsAggregation` operation.
        max-results: The maximum number of results to return. Use this parameter with `NextToken` to get results as a set of sequential pages.
        next-token: The token for the next set of results, or `null` to start from the beginning.
