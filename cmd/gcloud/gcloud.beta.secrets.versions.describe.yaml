name: describe
description: '*(BETA)*  Describe metadata about the secret version.'
flags:
    --location=!: ID of the location or fully qualified identifier for the location.
    --secret=: The secret of the version.
documentation:
    command: |-
        *(BETA)*  Describe a secret version's metadata. This command does not include the
        secret version's secret data.

        ## EXAMPLES

        Describe version '123' of the secret named 'my-secret':

          $ gcloud beta secrets versions describe 123 --secret=my-secret
    flag:
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line.
        secret: |-
            The secret of the version.
            +
            To set the `secret` attribute:
            * provide the argument `VERSION` on the command line with a fully specified name;
            * provide the argument `--secret` on the command line.
