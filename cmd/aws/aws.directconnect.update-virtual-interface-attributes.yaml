name: update-virtual-interface-attributes
description: Updates the specified attributes of the specified virtual private interface.
flags:
    --enable-site-link=: Indicates whether to enable or disable SiteLink.
    --mtu=: The maximum transmission unit (MTU), in bytes.
    --virtual-interface-id=!: The ID of the virtual private interface.
    --virtual-interface-name=: The name of the virtual private interface.
documentation:
    command: |-
        Updates the specified attributes of the specified virtual private interface.

        Setting the MTU of a virtual interface to 8500 (jumbo frames) can cause an update to the underlying physical connection if it wasn't updated to support jumbo frames. Updating the connection disrupts network connectivity for all virtual interfaces associated with the connection for up to 30 seconds. To check whether your connection supports jumbo frames, call [DescribeConnections](). To check whether your virtual interface supports jumbo frames, call [DescribeVirtualInterfaces]().
    flag:
        enable-site-link: Indicates whether to enable or disable SiteLink.
        mtu: The maximum transmission unit (MTU), in bytes. The supported values are 1500 and 8500. The default value is 1500.
        virtual-interface-id: The ID of the virtual private interface.
        virtual-interface-name: The name of the virtual private interface.
