name: search-resource-tags
description: Searches tags used in an Amazon Connect instance using optional search criteria.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
    --resource-types=: The list of resource types to be used to search tags from.
    --search-criteria=: The search criteria to be used to return tags.
documentation:
    command: Searches tags used in an Amazon Connect instance using optional search criteria.
    flag:
        instance-id: The identifier of the Amazon Connect instance. You can find the instanceId in the Amazon Resource Name (ARN) of the instance.
        max-results: The maximum number of results to return per page.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        resource-types: |-
            The list of resource types to be used to search tags from. If not provided or if any empty list is provided, this API will search from all supported resource types. Note that lowercase and - are required.

            **Supported resource types**

            - agent
            - agent-state
            - routing-profile
            - standard-queue
            - security-profile
            - operating-hours
            - prompt
            - contact-flow
            - flow- module
            - transfer-destination (also known as quick connect)
        search-criteria: The search criteria to be used to return tags.
