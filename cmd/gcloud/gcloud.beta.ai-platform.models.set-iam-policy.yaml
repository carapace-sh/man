name: set-iam-policy
description: '*(BETA)*  Set the IAM policy for a model.'
flags:
    --region=: Google Cloud region of the regional endpoint to use for this command.
completion:
    flag:
        region:
            - global
            - asia-east1
            - asia-northeast1
            - asia-southeast1
            - australia-southeast1
            - europe-west1
            - europe-west2
            - europe-west3
            - europe-west4
            - northamerica-northeast1
            - us-central1
            - us-east1
            - us-east4
            - us-west1
documentation:
    command: |-
        *(BETA)*  Sets the IAM policy for the given model as defined in a JSON or YAML file.

        See https://cloud.google.com/iam/docs/managing-policies for details of
        the policy file format and contents.

        ## EXAMPLES
        The following command will read am IAM policy defined in a JSON file
        'policy.json' and set it for the model `my_model`:

          $ gcloud beta ai-platform models set-iam-policy my_model policy.json
    flag:
        region: |-
            Google Cloud region of the regional endpoint to use for this command.
            For the global endpoint, the region needs to be specified as `global`.
            +
            Learn more about regional endpoints and see a list of available regions:
             https://cloud.google.com/ai-platform/prediction/docs/regional-endpoints
            +
            _REGION_ must be one of: *global*, *asia-east1*, *asia-northeast1*, *asia-southeast1*, *australia-southeast1*, *europe-west1*, *europe-west2*, *europe-west3*, *europe-west4*, *northamerica-northeast1*, *us-central1*, *us-east1*, *us-east4*, *us-west1*.
