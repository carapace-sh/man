name: update-api-key
description: Updates an API key.
flags:
    --api-id=!: The ID for the GraphQL API.
    --description=: A description of the purpose of the API key.
    --expires=: From the update time, the time after which the API key expires.
    --id=!: The API key ID.
documentation:
    command: Updates an API key. You can update the key as long as it's not deleted.
    flag:
        api-id: The ID for the GraphQL API.
        description: A description of the purpose of the API key.
        expires: From the update time, the time after which the API key expires. The date is represented as seconds since the epoch. For more information, see .
        id: The API key ID.
