name: describe
description: Describe an `AuthzExtension` resource.
flags:
    --location=: Cloud region in which the resource is located.
documentation:
    command: |
        Show details about an `AuthzExtension` resource.
    flag:
        location: |-
            Cloud region in which the resource is located.
            +

            To set the `location` attribute:
            * provide the argument `authz_extension` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
