name: delete-vpc-connector
description: Delete an App Runner VPC connector resource.
flags:
    --vpc-connector-arn=!: The Amazon Resource Name (ARN) of the App Runner VPC connector that you want to delete.
documentation:
    command: Delete an App Runner VPC connector resource. You can't delete a connector that's used by one or more App Runner services.
    flag:
        vpc-connector-arn: |-
            The Amazon Resource Name (ARN) of the App Runner VPC connector that you want to delete.

            The ARN must be a full VPC connector ARN.
