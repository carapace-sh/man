name: get-medical-scribe-job
description: Provides information about the specified Medical Scribe job.
flags:
    --medical-scribe-job-name=!: The name of the Medical Scribe job you want information about.
documentation:
    command: |-
        Provides information about the specified Medical Scribe job.

        To view the status of the specified medical transcription job, check the `MedicalScribeJobStatus` field. If the status is `COMPLETED`, the job is finished. You can find the results at the location specified in `MedicalScribeOutput`. If the status is `FAILED`, `FailureReason` provides details on why your Medical Scribe job failed.

        To get a list of your Medical Scribe jobs, use the operation.
    flag:
        medical-scribe-job-name: The name of the Medical Scribe job you want information about. Job names are case sensitive.
