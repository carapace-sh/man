name: batch-create-vehicle
description: Creates a group, or batch, of vehicles.
flags:
    --vehicles=!: A list of information about each vehicle to create.
documentation:
    command: |-
        Creates a group, or batch, of vehicles.

        You must specify a decoder manifest and a vehicle model (model manifest) for each vehicle.

        For more information, see [Create multiple vehicles (AWS CLI)](https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/create-vehicles-cli.html) in the *Amazon Web Services IoT FleetWise Developer Guide*.
    flag:
        vehicles: A list of information about each vehicle to create. For more information, see the API data type.
