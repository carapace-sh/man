name: create
description: '*(ALPHA)*  Create a new catalog template revision.'
flags:
    --application-template-revision-source=: Application template revision to use as source.
    --async: Return immediately, without waiting for the operation in progress to
    --catalog=: The ID of the catalog.
    --description=: A description for the revision.
    --developer-connect-repo-dir=!: The directory within the repository to use.
    --developer-connect-repo-ref=!: The Git ref (branch or tag) within the repository to use.
    --developer-connect-repo=!: The Developer Connect repository to use as a source.
    --gcs-source-uri=: Google Cloud Storage URI for source.
    --git-source-dir=: Git directory for Git source.
    --git-source-ref-tag=!: Git reference tag for Git source.
    --git-source-repo=!: Git repository for Git source.
    --location=: The Cloud location for the revision.
    --metadata=: Path to a local YAML file containing the template metadata.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --oci-repo-uri=!: OCI Repo URI for OCI Repo source.
    --oci-repo-version=: OCI Repo version for OCI Repo source.
    --space=: The ID of the space.
    --template=: The ID of the template.
documentation:
    command: '*(ALPHA)*  Create a new catalog template revision.'
    flag:
        application-template-revision-source: 'Application template revision to use as source. Example: `projects/my-project/locations/us-central1/spaces/my-space/catalogs/my-catalog/templates/my-template/revisions/r1`'
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        catalog: |-
            The ID of the catalog.
            +
            To set the `catalog` attribute:
            * provide the argument `revision` on the command line with a fully specified name;
            * provide the argument `--catalog` on the command line.
        description: A description for the revision.
        developer-connect-repo: 'The Developer Connect repository to use as a source. Example: `projects/my-project/locations/us-central1/connections/my-connection/gitRepositoryLinks/my-repo`'
        developer-connect-repo-dir: 'The directory within the repository to use. Example: `"modules/my-product"`'
        developer-connect-repo-ref: 'The Git ref (branch or tag) within the repository to use. Example: `"refs/tags/v1.0.0"` or `"refs/heads/main"` or `"refs/commits/269b518b99d06b31ff938a2d182e75f5e41941c7"`.'
        gcs-source-uri: 'Google Cloud Storage URI for source. Example: `gs://my-bucket/my-template`.'
        git-source-dir: 'Git directory for Git source. Example: `"modules/my-product"`. This field is optional.'
        git-source-ref-tag: 'Git reference tag for Git source. Example: `"v1.0.0"`'
        git-source-repo: 'Git repository for Git source. Example: `GoogleCloudPlatform/terraform-google-cloud-run`'
        location: |-
            The Cloud location for the revision.
            +
            To set the `location` attribute:
            * provide the argument `revision` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        metadata: 'Path to a local YAML file containing the template metadata. Example: `"path/to/metadata.yaml"`.'
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        oci-repo-uri: 'OCI Repo URI for OCI Repo source. Example: `oci://us-west1-docker.pkg.dev/my-project/my-repo/my-chart`'
        oci-repo-version: 'OCI Repo version for OCI Repo source. Example: `"1.0.0"`. This field is optional.'
        space: |-
            The ID of the space.
            +
            To set the `space` attribute:
            * provide the argument `revision` on the command line with a fully specified name;
            * provide the argument `--space` on the command line.
        template: |-
            The ID of the template.
            +
            To set the `template` attribute:
            * provide the argument `revision` on the command line with a fully specified name;
            * provide the argument `--template` on the command line.
