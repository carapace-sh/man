name: request-sender-id
description: Request a new sender ID that doesn't require registration.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --deletion-protection-enabled: By default this is set to false.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --iso-country-code=!: The two-character code, in ISO 3166-1 alpha-2 format, for the country or region.
    --message-types=: The type of message.
    --no-deletion-protection-enabled: By default this is set to false.
    --sender-id=!: The sender ID string to request.
    --tags=: An array of tags (key and value pairs) to associate with the sender ID.
documentation:
    command: Request a new sender ID that doesn't require registration.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If you don't specify a client token, a randomly generated token is used for the request to ensure idempotency.
        deletion-protection-enabled: By default this is set to false. When set to true the sender ID can't be deleted.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        iso-country-code: The two-character code, in ISO 3166-1 alpha-2 format, for the country or region.
        message-types: The type of message. Valid values are TRANSACTIONAL for messages that are critical or time-sensitive and PROMOTIONAL for messages that aren't critical or time-sensitive.
        sender-id: The sender ID string to request.
        tags: An array of tags (key and value pairs) to associate with the sender ID.
