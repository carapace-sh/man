name: update
description: '*(ALPHA)*  Update a Managed Microsoft AD domain.'
flags:
    --add-authorized-networks=: A list of URLs of additional networks to peer this domain to in the form
    --add-region=: An additional region to provision this domain in.
    --async: Return immediately, without waiting for the operation in progress to
    --clear-labels: Remove all labels.
    --enable-audit-logs: If specified, Active Directory data audit logs are enabled for the domain.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-labels&: Remove all labels.
    --no-enable-audit-logs&: If specified, Active Directory data audit logs are enabled for the domain.
    --remove-authorized-networks=: A list of URLs of additional networks to unpeer this domain from in the
    --remove-labels=: List of label keys to remove.
    --remove-region=: A region to de-provision this domain from.
    --update-labels=: List of label KEY=VALUE pairs to update.
documentation:
    command: |
        *(ALPHA)*  Update the metadata and/or configuration parameters of a managed
        Microsoft AD domain.

        This command can fail for the following reasons:
          * The AD domain specified does not exist.
          * The active account does not have permission to update the given
            AD domain.
    flag:
        add-authorized-networks: |-
            A list of URLs of additional networks to peer this domain to in the form
            projects/{project}/global/networks/{network}.
            Networks must belong to the project.
        add-region: |-
            An additional region to provision this domain in.
            If domain is already provisioned in region, nothing will be done in that
            region. Supported regions are: asia-east1, asia-northeast1, asia-south1, asia-southeast1, australia-southeast1, europe-north1, europe-west1, europe-west2, europe-west3, europe-west4, northamerica-northeast1, southamerica-east1, us-central1, us-east1, us-east4, us-west1, us-west2.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        enable-audit-logs: If specified, Active Directory data audit logs are enabled for the domain.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        no-enable-audit-logs: |
            If specified, Active Directory data audit logs are enabled for the domain.
        remove-authorized-networks: |-
            A list of URLs of additional networks to unpeer this domain from in the
            form projects/{project}/global/networks/{network}.
            Networks must belong to the project.
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        remove-region: |-
            A region to de-provision this domain from.
            If domain is already not provisioned in a region, nothing will be done in
            that region. Domains must be left provisioned in at least one region.
            Supported regions are: asia-east1, asia-northeast1, asia-south1, asia-southeast1, australia-southeast1, europe-north1, europe-west1, europe-west2, europe-west3, europe-west4, northamerica-northeast1, southamerica-east1, us-central1, us-east1, us-east4, us-west1, us-west2.
        update-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
