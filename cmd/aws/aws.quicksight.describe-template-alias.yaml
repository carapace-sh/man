name: describe-template-alias
description: Describes the template alias for a template.
flags:
    --alias-name=!: The name of the template alias that you want to describe.
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the template alias that you're describing.
    --template-id=!: The ID for the template.
documentation:
    command: Describes the template alias for a template.
    flag:
        alias-name: The name of the template alias that you want to describe. If you name a specific alias, you describe the version that the alias points to. You can specify the latest version of the template by providing the keyword `$LATEST` in the `AliasName` parameter. The keyword `$PUBLISHED` doesn't apply to templates.
        aws-account-id: The ID of the Amazon Web Services account that contains the template alias that you're describing.
        template-id: The ID for the template.
