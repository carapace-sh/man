name: list-billing-views
description: Lists the billing views available for a given time period.
flags:
    --active-time-range=: The time range for the billing views listed.
    --arns=: The Amazon Resource Name (ARN) that can be used to uniquely identify the billing view.
    --billing-view-types=: The type of billing view.
    --max-results=: The maximum number of billing views to retrieve.
    --next-token=: The pagination token that is used on subsequent calls to list billing views.
    --owner-account-id=: The list of owners of the billing view.
    --source-account-id=: Filters the results to include only billing views that use the specified account as a source.
documentation:
    command: |-
        Lists the billing views available for a given time period.

        Every Amazon Web Services account has a unique `PRIMARY` billing view that represents the billing data available by default. Accounts that use Billing Conductor also have `BILLING_GROUP` billing views representing pro forma costs associated with each created billing group.
    flag:
        active-time-range: The time range for the billing views listed. `PRIMARY` billing view is always listed. `BILLING_GROUP` billing views are listed for time ranges when the associated billing group resource in Billing Conductor is active. The time range must be within one calendar month.
        arns: The Amazon Resource Name (ARN) that can be used to uniquely identify the billing view.
        billing-view-types: The type of billing view.
        max-results: The maximum number of billing views to retrieve. Default is 100.
        next-token: The pagination token that is used on subsequent calls to list billing views.
        owner-account-id: The list of owners of the billing view.
        source-account-id: Filters the results to include only billing views that use the specified account as a source.
