name: describe-fleets
description: Retrieves a list that describes one or more specified fleets, if the fleet names are provided.
flags:
    --names=: The names of the fleets to describe.
    --next-token=: The pagination token to use to retrieve the next page of results for this operation.
documentation:
    command: Retrieves a list that describes one or more specified fleets, if the fleet names are provided. Otherwise, all fleets in the account are described.
    flag:
        names: The names of the fleets to describe.
        next-token: The pagination token to use to retrieve the next page of results for this operation. If this value is null, it retrieves the first page.
