name: get-compliance-summary-by-resource-type
description: Returns the number of resources that are compliant and the number that are noncompliant.
flags:
    --resource-types=: Specify one or more resource types to get the number of resources that are compliant and the number that are noncompliant for each resource type.
documentation:
    command: Returns the number of resources that are compliant and the number that are noncompliant. You can specify one or more resource types to get these numbers for each resource type. The maximum number returned is 100.
    flag:
        resource-types: |-
            Specify one or more resource types to get the number of resources that are compliant and the number that are noncompliant for each resource type.

            For this request, you can specify an Amazon Web Services resource type such as `AWS::EC2::Instance`. You can specify that the resource type is an Amazon Web Services account by specifying `AWS::::Account`.
