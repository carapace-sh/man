name: update-constraint
description: Updates the specified constraint.
flags:
    --accept-language=: The language code.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The updated description of the constraint.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --id=!: The identifier of the constraint.
    --parameters=: The constraint parameters, in JSON format.
documentation:
    command: Updates the specified constraint.
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The updated description of the constraint.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        id: The identifier of the constraint.
        parameters: |-
            The constraint parameters, in JSON format. The syntax depends on the constraint type as follows:

            LAUNCH

            You are required to specify either the `RoleArn` or the `LocalRoleName` but can't use both.

            Specify the `RoleArn` property as follows:

            `{"RoleArn" : "arn:aws:iam::123456789012:role/LaunchRole"}`

            Specify the `LocalRoleName` property as follows:

            `{"LocalRoleName": "SCBasicLaunchRole"}`

            If you specify the `LocalRoleName` property, when an account uses the launch constraint, the IAM role with that name in the account will be used. This allows launch-role constraints to be account-agnostic so the administrator can create fewer resources per shared account.

            The given role name must exist in the account used to create the launch constraint and the account of the user who launches a product with this launch constraint.

            You cannot have both a `LAUNCH` and a `STACKSET` constraint.

            You also cannot have more than one `LAUNCH` constraint on a product and portfolio.

            NOTIFICATION

            Specify the `NotificationArns` property as follows:

            `{"NotificationArns" : ["arn:aws:sns:us-east-1:123456789012:Topic"]}`

            RESOURCE\_UPDATE

            Specify the `TagUpdatesOnProvisionedProduct` property as follows:

            `{"Version":"2.0","Properties":{"TagUpdateOnProvisionedProduct":"String"}}`

            The `TagUpdatesOnProvisionedProduct` property accepts a string value of `ALLOWED` or `NOT_ALLOWED`.

            STACKSET

            Specify the `Parameters` property as follows:

            `{"Version": "String", "Properties": {"AccountList": [ "String" ], "RegionList": [ "String" ], "AdminRole": "String", "ExecutionRole": "String"}}`

            You cannot have both a `LAUNCH` and a `STACKSET` constraint.

            You also cannot have more than one `STACKSET` constraint on a product and portfolio.

            Products with a `STACKSET` constraint will launch an CloudFormation stack set.

            TEMPLATE

            Specify the `Rules` property. For more information, see [Template Constraint Rules](http://docs.aws.amazon.com/servicecatalog/latest/adminguide/reference-template_constraint_rules.html).
