name: delete-lftag-expression
description: Deletes the LF-Tag expression.
flags:
    --catalog-id=: The identifier for the Data Catalog.
    --name=!: The name for the LF-Tag expression.
documentation:
    command: Deletes the LF-Tag expression. The caller must be a data lake admin or have `DROP` permissions on the LF-Tag expression. Deleting a LF-Tag expression will also delete all `LFTagPolicy` permissions referencing the LF-Tag expression.
    flag:
        catalog-id: The identifier for the Data Catalog. By default, the account ID in which the LF-Tag expression is saved.
        name: The name for the LF-Tag expression.
