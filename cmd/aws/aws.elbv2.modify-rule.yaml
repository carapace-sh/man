name: modify-rule
description: Replaces the specified properties of the specified rule.
flags:
    --actions=: The actions.
    --conditions=: The conditions.
    --reset-transforms=: Indicates whether to remove all transforms from the rule.
    --rule-arn=!: The Amazon Resource Name (ARN) of the rule.
    --transforms=: The transforms to apply to requests that match this rule.
documentation:
    command: |-
        Replaces the specified properties of the specified rule. Any properties that you do not specify are unchanged.

        To add an item to a list, remove an item from a list, or update an item in a list, you must provide the entire list. For example, to add an action, specify a list with the current actions plus the new action.
    flag:
        actions: The actions.
        conditions: The conditions.
        reset-transforms: Indicates whether to remove all transforms from the rule. If you specify `ResetTransforms`, you can't specify `Transforms`.
        rule-arn: The Amazon Resource Name (ARN) of the rule.
        transforms: The transforms to apply to requests that match this rule. You can add one host header rewrite transform and one URL rewrite transform. If you specify `Transforms`, you can't specify `ResetTransforms`.
