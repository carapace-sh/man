name: create-place-index
description: This operation is no longer current and may be deprecated in the future.
flags:
    --data-source-configuration=: Specifies the data storage option requesting Places.
    --data-source=!: Specifies the geospatial data provider for the new place index.
    --description=: The optional description for the place index resource.
    --index-name=!: The name of the place index resource.
    --pricing-plan=: No longer used.
    --tags=: Applies one or more tags to the place index resource.
completion:
    flag:
        pricing-plan:
            - RequestBasedUsage
            - MobileAssetTracking
            - MobileAssetManagement
documentation:
    command: |-
        This operation is no longer current and may be deprecated in the future. We recommend you upgrade to the Places API V2 unless you require Grab data.

        - `CreatePlaceIndex` is part of a previous Amazon Location Service Places API (version 1) which has been superseded by a more intuitive, powerful, and complete API (version 2).
        - The Places API version 2 has a simplified interface that can be used without creating or managing place index resources.
        - If you are using an Amazon Web Services SDK or the Amazon Web Services CLI, note that the Places API version 2 is found under `geo-places` or `geo_places`, not under `location`.
        - Since Grab is not yet fully supported in Places API version 2, we recommend you continue using API version 1 when using Grab.
        - Start your version 2 API journey with the Places V2 [API Reference](/location/latest/APIReference/API_Operations_Amazon_Location_Service_Places_V2.html) or the [Developer Guide](/location/latest/developerguide/places.html).

        Creates a place index resource in your Amazon Web Services account. Use a place index resource to geocode addresses and other text queries by using the `SearchPlaceIndexForText` operation, and reverse geocode coordinates by using the `SearchPlaceIndexForPosition` operation, and enable autosuggestions by using the `SearchPlaceIndexForSuggestions` operation.

        If your application is tracking or routing assets you use in your business, such as delivery vehicles or employees, you must not use Esri as your geolocation provider. See section 82 of the [Amazon Web Services service terms](http://aws.amazon.com/service-terms) for more details.
    flag:
        data-source: "Specifies the geospatial data provider for the new place index.\n\nThis field is case-sensitive. Enter the valid values as shown. For example, entering `HERE` returns an error.\n\nValid values include:\n\n- `Esri` – For additional information about [Esri](https://docs.aws.amazon.com/location/previous/developerguide/esri.html)'s coverage in your region of interest, see [Esri details on geocoding coverage](https://developers.arcgis.com/rest/geocode/api-reference/geocode-coverage.htm).\n- `Grab` – Grab provides place index functionality for Southeast Asia. For additional information about [GrabMaps](https://docs.aws.amazon.com/location/previous/developerguide/grab.html)' coverage, see [GrabMaps countries and areas covered](https://docs.aws.amazon.com/location/previous/developerguide/grab.html#grab-coverage-area).\n- `Here` – For additional information about [HERE Technologies](https://docs.aws.amazon.com/location/previous/developerguide/HERE.html)' coverage in your region of interest, see [HERE details on goecoding coverage](https://developer.here.com/documentation/geocoder/dev_guide/topics/coverage-geocoder.html).\n  \n  If you specify HERE Technologies (`Here`) as the data provider, you may not [store results](https://docs.aws.amazon.com/location-places/latest/APIReference/API_DataSourceConfiguration.html) for locations in Japan. For more information, see the [Amazon Web Services service terms](http://aws.amazon.com/service-terms/) for Amazon Location Service.\n\nFor additional information , see [Data providers](https://docs.aws.amazon.com/location/previous/developerguide/what-is-data-provider.html) on the *Amazon Location Service developer guide*."
        data-source-configuration: Specifies the data storage option requesting Places.
        description: The optional description for the place index resource.
        index-name: |-
            The name of the place index resource.

            Requirements:

            - Contain only alphanumeric characters (A–Z, a–z, 0–9), hyphens (-), periods (.), and underscores (\_).
            - Must be a unique place index resource name.
            - No spaces allowed. For example, `ExamplePlaceIndex`.
        pricing-plan: No longer used. If included, the only allowed value is `RequestBasedUsage`.
        tags: |-
            Applies one or more tags to the place index resource. A tag is a key-value pair that helps you manage, identify, search, and filter your resources.

            Format: `"key" : "value"`

            Restrictions:

            - Maximum 50 tags per resource.
            - Each tag key must be unique and must have exactly one associated value.
            - Maximum key length: 128 Unicode characters in UTF-8.
            - Maximum value length: 256 Unicode characters in UTF-8.
            - Can use alphanumeric characters (A–Z, a–z, 0–9), and the following characters: + - = . _ : / @
            - Cannot use "aws:" as a prefix for a key.
