name: untag-resource
description: Removes tags from a SimSpace Weaver resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource that you want to remove tags from.
    --tag-keys=!: A list of tag keys to remove from the resource.
documentation:
    command: Removes tags from a SimSpace Weaver resource. For more information about tags, see [Tagging Amazon Web Services resources](https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html) in the *Amazon Web Services General Reference*.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource that you want to remove tags from. For more information about ARNs, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference*.
        tag-keys: A list of tag keys to remove from the resource.
