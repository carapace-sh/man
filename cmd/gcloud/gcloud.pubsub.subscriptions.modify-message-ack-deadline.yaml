name: modify-message-ack-deadline
description: Modifies the ACK deadline for a specific Cloud Pub/Sub message.
flags:
    --ack-deadline=!: The number of seconds the system will wait for a subscriber to acknowledge receiving a message before re-attempting delivery.
    --ack-ids=!: One or more ACK_IDs to modify the deadline for.
documentation:
    command: |-
        This method is useful to indicate that more time is needed to process
        a message by the subscriber, or to make the message available for
        redelivery if the processing was interrupted.
    flag:
        ack-deadline: The number of seconds the system will wait for a subscriber to acknowledge receiving a message before re-attempting delivery.
        ack-ids: One or more ACK_IDs to modify the deadline for. An ACK_ID is a [string that is returned to subscribers](https://cloud.google.com/pubsub/docs/reference/rpc/google.pubsub.v1#google.pubsub.v1.ReceivedMessage). along with the message. The ACK_ID is different from the [message ID](https://cloud.google.com/pubsub/docs/reference/rpc/google.pubsub.v1#google.pubsub.v1.PubsubMessage).
