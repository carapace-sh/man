name: update
description: Updates a domain mapping.
flags:
    --certificate-id=: A certificate id to use for this domain.
    --certificate-management=: Type of certificate management.
    --no-certificate-id: Do not associate any certificate with this domain.
completion:
    flag:
        certificate-management:
            - automatic
            - manual
documentation:
    command: Updates a domain mapping.
    flag:
        certificate-id: A certificate id to use for this domain. May not be used on a domain mapping with automatically managed certificates. Use the `gcloud app ssl-certificates list` to see available certificates for this app.
        certificate-management: 'Type of certificate management. ''automatic'' will provision an SSL certificate automatically while ''manual'' requires the user to provide a certificate id to provision. _CERTIFICATE_MANAGEMENT_ must be one of: *automatic*, *manual*.'
        no-certificate-id: Do not associate any certificate with this domain.
