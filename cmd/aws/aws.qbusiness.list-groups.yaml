name: list-groups
description: Provides a list of groups that are mapped to users.
flags:
    --application-id=!: The identifier of the application for getting a list of groups mapped to users.
    --data-source-id=: The identifier of the data source for getting a list of groups mapped to users.
    --index-id=!: The identifier of the index for getting a list of groups mapped to users.
    --max-results=: The maximum number of returned groups that are mapped to users.
    --next-token=: If the previous response was incomplete (because there is more data to retrieve), Amazon Q Business returns a pagination token in the response.
    --updated-earlier-than=!: The timestamp identifier used for the latest `PUT` or `DELETE` action for mapping users to their groups.
documentation:
    command: Provides a list of groups that are mapped to users.
    flag:
        application-id: The identifier of the application for getting a list of groups mapped to users.
        data-source-id: The identifier of the data source for getting a list of groups mapped to users.
        index-id: The identifier of the index for getting a list of groups mapped to users.
