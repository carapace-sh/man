name: delete-access-grants-location
description: Deregisters a location from your S3 Access Grants instance.
flags:
    --access-grants-location-id=!: The ID of the registered location that you are deregistering from your S3 Access Grants instance.
    --account-id=!: The Amazon Web Services account ID of the S3 Access Grants instance.
documentation:
    command: |-
        Deregisters a location from your S3 Access Grants instance. You can only delete a location registration from an S3 Access Grants instance if there are no grants associated with this location. See [Delete a grant](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_DeleteAccessGrant.html) for information on how to delete grants. You need to have at least one registered location in your S3 Access Grants instance in order to create access grants.

        Permissions

        You must have the `s3:DeleteAccessGrantsLocation` permission to use this operation.

        You must URL encode any signed header values that contain spaces. For example, if your header value is `my file.txt`, containing two spaces after `my`, you must URL encode this value to `my%20%20file.txt`.
    flag:
        access-grants-location-id: The ID of the registered location that you are deregistering from your S3 Access Grants instance. S3 Access Grants assigned this ID when you registered the location. S3 Access Grants assigns the ID `default` to the default location `s3://` and assigns an auto-generated ID to other locations that you register.
        account-id: The Amazon Web Services account ID of the S3 Access Grants instance.
