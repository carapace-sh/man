name: get-migrations
description: Gets a list of migrations between Amazon Lex V1 and Amazon Lex V2.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of migrations to return in the response.
    --migration-status-equals=: Filters the list to contain only migrations in the specified state.
    --next-token=: A pagination token that fetches the next page of migrations.
    --sort-by-attribute=: The field to sort the list of migrations by.
    --sort-by-order=: The order so sort the list.
    --v1-bot-name-contains=: Filters the list to contain only bots whose name contains the specified string.
completion:
    flag:
        migration-status-equals:
            - IN_PROGRESS
            - COMPLETED
            - FAILED
        sort-by-attribute:
            - V1_BOT_NAME
            - MIGRATION_DATE_TIME
        sort-by-order:
            - ASCENDING
            - DESCENDING
documentation:
    command: Gets a list of migrations between Amazon Lex V1 and Amazon Lex V2.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The maximum number of migrations to return in the response. The default is 10.
        migration-status-equals: Filters the list to contain only migrations in the specified state.
        next-token: A pagination token that fetches the next page of migrations. If the response to this operation is truncated, Amazon Lex returns a pagination token in the response. To fetch the next page of migrations, specify the pagination token in the request.
        sort-by-attribute: The field to sort the list of migrations by. You can sort by the Amazon Lex V1 bot name or the date and time that the migration was started.
        sort-by-order: The order so sort the list.
        v1-bot-name-contains: Filters the list to contain only bots whose name contains the specified string. The string is matched anywhere in bot name.
