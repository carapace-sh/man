name: create-portal
description: Creates a web portal.
flags:
    --additional-encryption-context=: The additional encryption context of the portal.
    --authentication-type=: The type of authentication integration points used when signing into the web portal.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --customer-managed-key=: The customer managed key of the web portal.
    --display-name=: The name of the web portal.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-type=: The type and resources of the underlying instance.
    --max-concurrent-sessions=: The maximum number of concurrent sessions for the portal.
    --tags=:
        description: The tags to add to the web portal.
        nargs: -1
completion:
    flag:
        authentication-type:
            - Standard
            - IAM_Identity_Center
        instance-type:
            - standard.regular
            - standard.large
            - standard.xlarge
documentation:
    command: Creates a web portal.
    flag:
        additional-encryption-context: The additional encryption context of the portal.
        authentication-type: |-
            The type of authentication integration points used when signing into the web portal. Defaults to `Standard`.

            `Standard` web portals are authenticated directly through your identity provider. You need to call `CreateIdentityProvider` to integrate your identity provider with your web portal. User and group access to your web portal is controlled through your identity provider.

            `IAM Identity Center` web portals are authenticated through IAM Identity Center. Identity sources (including external identity provider integration), plus user and group access to your web portal, can be configured in the IAM Identity Center.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: |-
            A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. Idempotency ensures that an API request completes only once. With an idempotent request, if the original request completes successfully, subsequent retries with the same client token returns the result from the original successful request.

            If you do not specify a client token, one is automatically generated by the Amazon Web Services SDK.
        customer-managed-key: The customer managed key of the web portal.
        display-name: The name of the web portal. This is not visible to users who log into the web portal.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-type: The type and resources of the underlying instance.
        max-concurrent-sessions: The maximum number of concurrent sessions for the portal.
        tags: The tags to add to the web portal. A tag is a key-value pair.
