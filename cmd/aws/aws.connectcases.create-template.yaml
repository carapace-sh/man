name: create-template
description: Creates a template in the Cases domain.
flags:
    --description=: A brief description of the template.
    --domain-id=!: The unique identifier of the Cases domain.
    --layout-configuration=: Configuration of layouts associated to the template.
    --name=!: A name for the template.
    --required-fields=: A list of fields that must contain a value for a case to be successfully created with this template.
    --rules=: A list of case rules (also known as [case field conditions](https://docs.aws.amazon.com/connect/latest/adminguide/case-field-conditions.html)) on a template.
    --status=: The status of the template.
completion:
    flag:
        status:
            - Active
            - Inactive
documentation:
    command: |-
        Creates a template in the Cases domain. This template is used to define the case object model (that is, to define what data can be captured on cases) in a Cases domain. A template must have a unique name within a domain, and it must reference existing field IDs and layout IDs. Additionally, multiple fields with same IDs are not allowed within the same Template. A template can be either Active or Inactive, as indicated by its status. Inactive templates cannot be used to create cases.

        Other template APIs are:

        - [DeleteTemplate](https://docs.aws.amazon.com/connect/latest/APIReference/API_connect-cases_DeleteTemplate.html)
        - [GetTemplate](https://docs.aws.amazon.com/connect/latest/APIReference/API_connect-cases_GetTemplate.html)
        - [ListTemplates](https://docs.aws.amazon.com/connect/latest/APIReference/API_connect-cases_ListTemplates.html)
        - [UpdateTemplate](https://docs.aws.amazon.com/connect/latest/APIReference/API_connect-cases_UpdateTemplate.html)
    flag:
        description: A brief description of the template.
        domain-id: The unique identifier of the Cases domain.
        layout-configuration: Configuration of layouts associated to the template.
        name: A name for the template. It must be unique per domain.
        required-fields: A list of fields that must contain a value for a case to be successfully created with this template.
        rules: A list of case rules (also known as [case field conditions](https://docs.aws.amazon.com/connect/latest/adminguide/case-field-conditions.html)) on a template.
        status: The status of the template.
