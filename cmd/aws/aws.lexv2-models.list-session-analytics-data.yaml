name: list-session-analytics-data
description: Retrieves a list of metadata for individual user sessions with your bot.
flags:
    --bot-id=!: The identifier for the bot for which you want to retrieve session analytics.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --end-date-time=!: The date and time that marks the end of the range of time for which you want to see session analytics.
    --filters=: A list of objects, each of which describes a condition by which you want to filter the results.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of results to return in each page of results.
    --next-token=: If the response from the ListSessionAnalyticsData operation contains more results than specified in the maxResults parameter, a token is returned in the response.
    --sort-by=: An object specifying the measure and method by which to sort the session analytics data.
    --start-date-time=!: The date and time that marks the beginning of the range of time for which you want to see session analytics.
documentation:
    command: |-
        Retrieves a list of metadata for individual user sessions with your bot. The `startDateTime` and `endDateTime` fields are required. These fields define a time range for which you want to retrieve results. Of the optional fields, you can organize the results in the following ways:

        - Use the `filters` field to filter the results and the `sortBy` field to specify the values by which to sort the results.
        - Use the `maxResults` field to limit the number of results to return in a single response and the `nextToken` field to return the next batch of results if the response does not return the full set of results.
    flag:
        bot-id: The identifier for the bot for which you want to retrieve session analytics.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        end-date-time: The date and time that marks the end of the range of time for which you want to see session analytics.
        filters: A list of objects, each of which describes a condition by which you want to filter the results.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The maximum number of results to return in each page of results. If there are fewer results than the maximum page size, only the actual number of results are returned.
        next-token: |-
            If the response from the ListSessionAnalyticsData operation contains more results than specified in the maxResults parameter, a token is returned in the response.

            Use the returned token in the nextToken parameter of a ListSessionAnalyticsData request to return the next page of results. For a complete set of results, call the ListSessionAnalyticsData operation until the nextToken returned in the response is null.
        sort-by: An object specifying the measure and method by which to sort the session analytics data.
        start-date-time: The date and time that marks the beginning of the range of time for which you want to see session analytics.
