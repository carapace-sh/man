name: remove
description: Remove an Apphub service project.
flags:
    --async: Return immediately, without waiting for the operation in progress to complete.
    --location=: Location of the ServiceProjectAttachment.
    --no-async&: Return immediately, without waiting for the operation in progress to complete.
documentation:
    command: Remove an Apphub service project.
    flag:
        async: Return immediately, without waiting for the operation in progress to complete.
        location: |-
            Location of the ServiceProjectAttachment.
            +
            To set the `location` attribute:
            * provide the argument `service_project` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * Service project attachments only support global location.
        no-async: Return immediately, without waiting for the operation in progress to complete.
