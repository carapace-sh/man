name: list-interface-relationships
description: Retrieves a paginated list of asset models that have a specific interface asset model applied to them.
flags:
    --interface-asset-model-id=!: The ID of the interface asset model.
    --max-results=: The maximum number of results to return for each paginated request.
    --next-token=: The token to be used for the next set of paginated results.
documentation:
    command: Retrieves a paginated list of asset models that have a specific interface asset model applied to them.
    flag:
        interface-asset-model-id: 'The ID of the interface asset model. This can be either the actual ID in UUID format, or else externalId: followed by the external ID.'
        max-results: 'The maximum number of results to return for each paginated request. Default: 50'
        next-token: The token to be used for the next set of paginated results.
