name: ssh
description: Allows you to establish an interactive SSH session with Cloud Shell.
flags:
    --authorize-session: If provided, sends OAuth credentials to the current Cloud Shell session
    --command=: A command to run in Cloud Shell.
    --dry-run: If provided, prints the command that would be run to standard out
    --force-key-file-overwrite: If enabled gcloud will regenerate and overwrite the files associated
    --no-authorize-session&: If provided, sends OAuth credentials to the current Cloud Shell session
    --no-dry-run&: If provided, prints the command that would be run to standard out
    --no-force-key-file-overwrite&: If enabled gcloud will regenerate and overwrite the files associated
    --no-ssh-key-file&: The path to the SSH key file.
    --ssh-flag=: Additional flags to be passed to *ssh(1)*.
    --ssh-key-file: The path to the SSH key file.
documentation:
    command: |
        *gcloud cloud-shell ssh* lets you remotely log in to Cloud Shell. If your Cloud Shell
        is not currently running, this will cause it to be started before
        establishing the SSH session.
    flag:
        authorize-session: |-
            If provided, sends OAuth credentials to the current Cloud Shell session
            on behalf of the user. When this completes, the session will be
            authorized to run various Google Cloud command-line tools without
            requiring the user to manually authenticate.
        command: |-
            A command to run in Cloud Shell.
            +
            Runs the command in Cloud Shell and then exits.
        dry-run: |-
            If provided, prints the command that would be run to standard out
            instead of executing it.
        force-key-file-overwrite: |-
            If enabled gcloud will regenerate and overwrite the files associated
            with a broken SSH key without asking for confirmation in both
            interactive and non-interactive environment.
            +
            If disabled gcloud will not attempt to regenerate the files associated
            with a broken SSH key and fail in both interactive and non-interactive
            environment.
        no-authorize-session: |
            If provided, sends OAuth credentials to the current Cloud Shell session
            on behalf of the user. When this completes, the session will be
            authorized to run various Google Cloud command-line tools without
            requiring the user to manually authenticate.
        no-dry-run: |
            If provided, prints the command that would be run to standard out
            instead of executing it.
        no-force-key-file-overwrite: |
            If enabled gcloud will regenerate and overwrite the files associated
            with a broken SSH key without asking for confirmation in both
            interactive and non-interactive environment.

            If disabled gcloud will not attempt to regenerate the files associated
            with a broken SSH key and fail in both interactive and non-interactive
            environment.
        no-ssh-key-file: |
            The path to the SSH key file. By default, this is
              *~/.ssh/google_compute_engine*.
        ssh-flag: Additional flags to be passed to *ssh(1)*.
        ssh-key-file: |-
            The path to the SSH key file. By default, this is
              *~/.ssh/google_compute_engine*.
