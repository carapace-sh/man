name: remove-labels
description: '*(ALPHA)*  Remove labels from Google Compute Engine snapshots.'
flags:
    --all: Remove all labels from the resource.
    --global: If set, the snapshot is global.
    --labels=: A comma-separated list of label keys to remove from the resource.
    --no-all&: Remove all labels from the resource.
    --no-global&: If set, the snapshot is global.
    --region=: Region of the snapshot to operate on.
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute snapshots remove-labels* removes labels from a Google Compute Engine snapshot.
    flag:
        all: Remove all labels from the resource.
        global: If set, the snapshot is global.
        labels: A comma-separated list of label keys to remove from the resource.
        no-all: Remove all labels from the resource.
        no-global: If set, the snapshot is global.
        region: Region of the snapshot to operate on. Overrides the default *compute/region* property value for this command invocation.
