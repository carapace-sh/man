name: list-recommendations
description: Lists the recommendations present in your Amazon SES account in the current Amazon Web Services Region.
flags:
    --filter=: Filters applied when retrieving recommendations.
    --next-token=: A token returned from a previous call to `ListRecommendations` to indicate the position in the list of recommendations.
    --page-size=: The number of results to show in a single call to `ListRecommendations`.
documentation:
    command: |-
        Lists the recommendations present in your Amazon SES account in the current Amazon Web Services Region.

        You can execute this operation no more than once per second.
    flag:
        filter: Filters applied when retrieving recommendations. Can eiter be an individual filter, or combinations of `STATUS` and `IMPACT` or `STATUS` and `TYPE`
        next-token: A token returned from a previous call to `ListRecommendations` to indicate the position in the list of recommendations.
        page-size: |-
            The number of results to show in a single call to `ListRecommendations`. If the number of results is larger than the number you specified in this parameter, then the response includes a `NextToken` element, which you can use to obtain additional results.

            The value you specify has to be at least 1, and can be no more than 100.
