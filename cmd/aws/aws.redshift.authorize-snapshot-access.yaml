name: authorize-snapshot-access
description: Authorizes the specified Amazon Web Services account to restore the specified snapshot.
flags:
    --account-with-restore-access=!: The identifier of the Amazon Web Services account authorized to restore the specified snapshot.
    --snapshot-arn=: The Amazon Resource Name (ARN) of the snapshot to authorize access to.
    --snapshot-cluster-identifier=: The identifier of the cluster the snapshot was created from.
    --snapshot-identifier=: The identifier of the snapshot the account is authorized to restore.
documentation:
    command: |-
        Authorizes the specified Amazon Web Services account to restore the specified snapshot.

        For more information about working with snapshots, go to [Amazon Redshift Snapshots](https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-snapshots.html) in the *Amazon Redshift Cluster Management Guide*.
    flag:
        account-with-restore-access: |-
            The identifier of the Amazon Web Services account authorized to restore the specified snapshot.

            To share a snapshot with Amazon Web Services Support, specify amazon-redshift-support.
        snapshot-arn: The Amazon Resource Name (ARN) of the snapshot to authorize access to.
        snapshot-cluster-identifier: |-
            The identifier of the cluster the snapshot was created from.

            - *If the snapshot to access doesn't exist and the associated IAM policy doesn't allow access to all (\*) snapshots* - This parameter is required. Otherwise, permissions aren't available to check if the snapshot exists.
            - *If the snapshot to access exists* - This parameter isn't required. Redshift can retrieve the cluster identifier and use it to validate snapshot authorization.
        snapshot-identifier: The identifier of the snapshot the account is authorized to restore.
