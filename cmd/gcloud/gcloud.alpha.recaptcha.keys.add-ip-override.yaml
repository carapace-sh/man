name: add-ip-override
description: '*(ALPHA)*  Add an IP override to a key.'
flags:
    --ip=!: IP address to override for the key.
    --override=!: If set to allow, the IP address/CIDR range will be allowlisted for the key.
completion:
    flag:
        override:
            - allow
            - override-type-unspecified
documentation:
    command: '*(ALPHA)*  Add an IP override to a key.'
    flag:
        ip: IP address to override for the key.
        override: 'If set to allow, the IP address/CIDR range will be allowlisted for the key. _OVERRIDE_ must be one of: *allow*, *override-type-unspecified*.'
