name: delete-access-token
description: Deletes a specified personal access token (PAT).
flags:
    --id=!: The ID of the personal access token to delete.
documentation:
    command: Deletes a specified personal access token (PAT). A personal access token can only be deleted by the user who created it.
    flag:
        id: The ID of the personal access token to delete. You can find the IDs of all PATs associated with your Amazon Web Services Builder ID in a space by calling [ListAccessTokens]().
