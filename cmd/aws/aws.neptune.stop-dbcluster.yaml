name: stop-dbcluster
description: Stops an Amazon Neptune DB cluster.
flags:
    --dbcluster-identifier=!: The DB cluster identifier of the Neptune DB cluster to be stopped.
documentation:
    command: |-
        Stops an Amazon Neptune DB cluster. When you stop a DB cluster, Neptune retains the DB cluster's metadata, including its endpoints and DB parameter groups.

        Neptune also retains the transaction logs so you can do a point-in-time restore if necessary.
    flag:
        dbcluster-identifier: The DB cluster identifier of the Neptune DB cluster to be stopped. This parameter is stored as a lowercase string.
