name: create-job-template
description: Creates a job template.
flags:
    --abort-config=: ""
    --description=!: A description of the job document.
    --destination-package-versions=: The package version Amazon Resource Names (ARNs) that are installed on the device when the job successfully completes.
    --document-source=: An S3 link, or S3 object URL, to the job document.
    --document=: The job document.
    --job-arn=: The ARN of the job to use as the basis for the job template.
    --job-executions-retry-config=: Allows you to create the criteria to retry a job.
    --job-executions-rollout-config=: ""
    --job-template-id=!: A unique identifier for the job template.
    --maintenance-windows=: Allows you to configure an optional maintenance window for the rollout of a job document to all devices in the target group for a job.
    --presigned-url-config=: ""
    --tags=: Metadata that can be used to manage the job template.
    --timeout-config=: ""
documentation:
    command: |-
        Creates a job template.

        Requires permission to access the [CreateJobTemplate](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        abort-config: ""
        description: A description of the job document.
        destination-package-versions: |-
            The package version Amazon Resource Names (ARNs) that are installed on the device when the job successfully completes. The package version must be in either the Published or Deprecated state when the job deploys. For more information, see [Package version lifecycle](https://docs.aws.amazon.com/iot/latest/developerguide/preparing-to-use-software-package-catalog.html#package-version-lifecycle).

            **Note:**The following Length Constraints relates to a single ARN. Up to 25 package version ARNs are allowed.
        document: The job document. Required if you don't specify a value for `documentSource`.
        document-source: |-
            An S3 link, or S3 object URL, to the job document. The link is an Amazon S3 object URL and is required if you don't specify a value for `document`.

            For example, `--document-source https://s3.region-code.amazonaws.com/example-firmware/device-firmware.1.0`

            For more information, see [Methods for accessing a bucket](https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-bucket-intro.html).
        job-arn: The ARN of the job to use as the basis for the job template.
        job-executions-retry-config: Allows you to create the criteria to retry a job.
        job-executions-rollout-config: ""
        job-template-id: A unique identifier for the job template. We recommend using a UUID. Alpha-numeric characters, "-", and "\_" are valid for use here.
        maintenance-windows: Allows you to configure an optional maintenance window for the rollout of a job document to all devices in the target group for a job.
        presigned-url-config: ""
        tags: Metadata that can be used to manage the job template.
        timeout-config: ""
