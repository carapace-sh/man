name: delete-flow-template
description: Deletes a workflow.
flags:
    --id=!: The ID of the workflow to be deleted.
documentation:
    command: Deletes a workflow. Any new system or deployment that contains this workflow will fail to update or deploy. Existing deployments that contain the workflow will continue to run (since they use a snapshot of the workflow taken at the time of deployment).
    flag:
        id: |-
            The ID of the workflow to be deleted.

            The ID should be in the following format.

            `urn:tdm:REGION/ACCOUNT ID/default:workflow:WORKFLOWNAME`
