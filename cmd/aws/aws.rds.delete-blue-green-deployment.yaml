name: delete-blue-green-deployment
description: Deletes a blue/green deployment.
flags:
    --blue-green-deployment-identifier=!: The unique identifier of the blue/green deployment to delete.
    --delete-target=: Specifies whether to delete the resources in the green environment.
documentation:
    command: |-
        Deletes a blue/green deployment.

        For more information, see [Using Amazon RDS Blue/Green Deployments for database updates](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/blue-green-deployments.html) in the *Amazon RDS User Guide* and [Using Amazon RDS Blue/Green Deployments for database updates](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/blue-green-deployments.html) in the *Amazon Aurora User Guide*.
    flag:
        blue-green-deployment-identifier: |-
            The unique identifier of the blue/green deployment to delete. This parameter isn't case-sensitive.

            Constraints:

            - Must match an existing blue/green deployment identifier.
        delete-target: Specifies whether to delete the resources in the green environment. You can't specify this option if the blue/green deployment [status](https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_BlueGreenDeployment.html) is `SWITCHOVER_COMPLETED`.
