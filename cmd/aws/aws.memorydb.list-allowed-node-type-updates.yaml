name: list-allowed-node-type-updates
description: Lists all available node types that you can scale to from your cluster's current node type.
flags:
    --cluster-name=!: The name of the cluster you want to scale.
documentation:
    command: Lists all available node types that you can scale to from your cluster's current node type. When you use the UpdateCluster operation to scale your cluster, the value of the NodeType parameter must be one of the node types returned by this operation.
    flag:
        cluster-name: The name of the cluster you want to scale. MemoryDB uses the cluster name to identify the current node type being used by this cluster, and from that to create a list of node types you can scale up to.
