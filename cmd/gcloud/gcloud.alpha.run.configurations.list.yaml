name: list
description: '*(ALPHA)*  List available Configurations.'
hidden: true
flags:
    --cluster-location=&: Zone in which the cluster is located.
    --cluster=&: ID of the cluster or fully qualified identifier for the cluster.
    --context=&: The name of the context in your kubectl config file to use for connecting.
    --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
    --kubeconfig=&: The absolute path to your kubectl config file.
    --limit=: Maximum number of resources to list.
    --namespace=&: ID of the namespace or fully qualified identifier for the namespace.
    --no-uri&: Print a list of resource URIs instead of the default output, and change the
    --page-size=: Some services group resource list output into pages.
    --platform=&: Target platform for running commands.
    --region=: Region in which the resource can be found.
    --sort-by=: Comma-separated list of resource field key names to sort by.
    --uri: Print a list of resource URIs instead of the default output, and change the
completion:
    flag:
        platform:
            - gke
            - kubernetes
            - managed
documentation:
    command: |
        *(ALPHA)*  Every Configuration is paired with a Service of the same name.
    flag:
        cluster: |-
            ID of the cluster or fully qualified identifier for the cluster.

            To set the `cluster` attribute:
            * provide the argument `--cluster` on the command line;
            * set the property `run/cluster`;
            * specify the cluster from a list of available clusters.
        cluster-location: |-
            Zone in which the cluster is located. Alternatively, set the property [run/cluster_location].

            To set the `location` attribute:
            * provide the argument `--cluster` on the command line with a fully specified name;
            * set the property `run/cluster` with a fully specified name;
            * specify the cluster from a list of available clusters with a fully specified name;
            * provide the argument `--cluster-location` on the command line;
            * set the property `run/cluster_location`;
            * specify the cluster location from a list of available zones.
        context: The name of the context in your kubectl config file to use for connecting.
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        kubeconfig: The absolute path to your kubectl config file. If not specified, the colon- or semicolon-delimited list of paths specified by $KUBECONFIG will be used. If $KUBECONFIG is unset, this defaults to `~/.kube/config`.
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        namespace: |-
            ID of the namespace or fully qualified identifier for the namespace.

            To set the `namespace` attribute:
            * provide the argument `--namespace` on the command line;
            * set the property `run/namespace`;
            * For Cloud Run on Kubernetes Engine, defaults to "default". Otherwise, defaults to project ID.;
            * provide the argument `project` on the command line;
            * set the property `core/project`.
        no-uri: |
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is determined by the
            service if it supports paging, otherwise it is *unlimited* (no paging).
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        platform: 'Target platform for running commands. Alternatively, set the property [run/platform]. '
        region: Region in which the resource can be found. Alternatively, set the property [run/region].
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
        uri: |-
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
