name: start-mldata-processing-job
description: Creates a new Neptune ML data processing job for processing the graph data exported from Neptune for training.
flags:
    --config-file-name=: A data specification file that describes how to load the exported graph data for training.
    --id=: A unique identifier for the new job.
    --input-data-s3-location=!: The URI of the Amazon S3 location where you want SageMaker to download the data needed to run the data processing job.
    --model-type=: 'One of the two model types that Neptune ML currently supports: heterogeneous graph models (`heterogeneous`), and knowledge graph (`kge`).'
    --neptune-iam-role-arn=: The Amazon Resource Name (ARN) of an IAM role that SageMaker can assume to perform tasks on your behalf.
    --previous-data-processing-job-id=: The job ID of a completed data processing job run on an earlier version of the data.
    --processed-data-s3-location=!: The URI of the Amazon S3 location where you want SageMaker to save the results of a data processing job.
    --processing-instance-type=: The type of ML instance used during data processing.
    --processing-instance-volume-size-in-gb=: The disk volume size of the processing instance.
    --processing-time-out-in-seconds=: Timeout in seconds for the data processing job.
    --s3-output-encryption-kmskey=: The Amazon Key Management Service (Amazon KMS) key that SageMaker uses to encrypt the output of the processing job.
    --sagemaker-iam-role-arn=: The ARN of an IAM role for SageMaker execution.
    --security-group-ids=: The VPC security group IDs.
    --subnets=: The IDs of the subnets in the Neptune VPC.
    --volume-encryption-kmskey=: The Amazon Key Management Service (Amazon KMS) key that SageMaker uses to encrypt data on the storage volume attached to the ML compute instances that run the training job.
documentation:
    command: |-
        Creates a new Neptune ML data processing job for processing the graph data exported from Neptune for training. See [The `dataprocessing` command](https://docs.aws.amazon.com/neptune/latest/userguide/machine-learning-api-dataprocessing.html).

        When invoking this operation in a Neptune cluster that has IAM authentication enabled, the IAM user or role making the request must have a policy attached that allows the [neptune-db:StartMLModelDataProcessingJob](https://docs.aws.amazon.com/neptune/latest/userguide/iam-dp-actions.html#startmlmodeldataprocessingjob) IAM action in that cluster.
    flag:
        config-file-name: A data specification file that describes how to load the exported graph data for training. The file is automatically generated by the Neptune export toolkit. The default is `training-data-configuration.json`.
        id: A unique identifier for the new job. The default is an autogenerated UUID.
        input-data-s3-location: The URI of the Amazon S3 location where you want SageMaker to download the data needed to run the data processing job.
        model-type: 'One of the two model types that Neptune ML currently supports: heterogeneous graph models (`heterogeneous`), and knowledge graph (`kge`). The default is none. If not specified, Neptune ML chooses the model type automatically based on the data.'
        neptune-iam-role-arn: The Amazon Resource Name (ARN) of an IAM role that SageMaker can assume to perform tasks on your behalf. This must be listed in your DB cluster parameter group or an error will occur.
        previous-data-processing-job-id: The job ID of a completed data processing job run on an earlier version of the data.
        processed-data-s3-location: The URI of the Amazon S3 location where you want SageMaker to save the results of a data processing job.
        processing-instance-type: The type of ML instance used during data processing. Its memory should be large enough to hold the processed dataset. The default is the smallest ml.r5 type whose memory is ten times larger than the size of the exported graph data on disk.
        processing-instance-volume-size-in-gb: The disk volume size of the processing instance. Both input data and processed data are stored on disk, so the volume size must be large enough to hold both data sets. The default is 0. If not specified or 0, Neptune ML chooses the volume size automatically based on the data size.
        processing-time-out-in-seconds: Timeout in seconds for the data processing job. The default is 86,400 (1 day).
        s3-output-encryption-kmskey: The Amazon Key Management Service (Amazon KMS) key that SageMaker uses to encrypt the output of the processing job. The default is none.
        sagemaker-iam-role-arn: The ARN of an IAM role for SageMaker execution. This must be listed in your DB cluster parameter group or an error will occur.
        security-group-ids: The VPC security group IDs. The default is None.
        subnets: The IDs of the subnets in the Neptune VPC. The default is None.
        volume-encryption-kmskey: The Amazon Key Management Service (Amazon KMS) key that SageMaker uses to encrypt data on the storage volume attached to the ML compute instances that run the training job. The default is None.
