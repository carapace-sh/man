name: delete-matchmaking-configuration
description: |-
    **This API works with the following fleet types:** EC2, Anywhere, Container

    Permanently removes a FlexMatch matchmaking configuration.
flags:
    --name=!: A unique identifier for the matchmaking configuration.
documentation:
    command: |-
        **This API works with the following fleet types:** EC2, Anywhere, Container

        Permanently removes a FlexMatch matchmaking configuration. To delete, specify the configuration name. A matchmaking configuration cannot be deleted if it is being used in any active matchmaking tickets.
    flag:
        name: A unique identifier for the matchmaking configuration. You can use either the configuration name or ARN value.
