name: update-patch-baseline
description: Modifies an existing patch baseline.
flags:
    --approval-rules=: A set of rules used to include patches in the baseline.
    --approved-patches-compliance-level=: Assigns a new compliance severity level to an existing patch baseline.
    --approved-patches-enable-non-security: Indicates whether the list of approved patches includes non-security updates that should be applied to the managed nodes.
    --approved-patches=: A list of explicitly approved patches for the baseline.
    --available-security-updates-compliance-status=: Indicates the status to be assigned to security patches that are available but not approved because they don't meet the installation criteria specified in the patch baseline.
    --baseline-id=!: The ID of the patch baseline to update.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description of the patch baseline.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --global-filters=: A set of global filters used to include patches in the baseline.
    --name=: The name of the patch baseline.
    --no-approved-patches-enable-non-security: Indicates whether the list of approved patches includes non-security updates that should be applied to the managed nodes.
    --no-replace: If True, then all fields that are required by the [CreatePatchBaseline]() operation are also required for this API request.
    --rejected-patches-action=: The action for Patch Manager to take on patches included in the `RejectedPackages` list.
    --rejected-patches=: A list of explicitly rejected patches for the baseline.
    --replace: If True, then all fields that are required by the [CreatePatchBaseline]() operation are also required for this API request.
    --sources=: Information about the patches to use to update the managed nodes, including target operating systems and source repositories.
completion:
    flag:
        approved-patches-compliance-level:
            - CRITICAL
            - HIGH
            - MEDIUM
            - LOW
            - INFORMATIONAL
            - UNSPECIFIED
        available-security-updates-compliance-status:
            - COMPLIANT
            - NON_COMPLIANT
        rejected-patches-action:
            - ALLOW_AS_DEPENDENCY
            - BLOCK
documentation:
    command: |-
        Modifies an existing patch baseline. Fields not specified in the request are left unchanged.

        For information about valid key-value pairs in `PatchFilters` for each supported operating system type, see [PatchFilter]().
    flag:
        approval-rules: A set of rules used to include patches in the baseline.
        approved-patches: |-
            A list of explicitly approved patches for the baseline.

            For information about accepted formats for lists of approved patches and rejected patches, see [Package name formats for approved and rejected patch lists](https://docs.aws.amazon.com/systems-manager/latest/userguide/patch-manager-approved-rejected-package-name-formats.html) in the *Amazon Web Services Systems Manager User Guide*.
        approved-patches-compliance-level: Assigns a new compliance severity level to an existing patch baseline.
        approved-patches-enable-non-security: Indicates whether the list of approved patches includes non-security updates that should be applied to the managed nodes. The default value is `false`. Applies to Linux managed nodes only.
        available-security-updates-compliance-status: |-
            Indicates the status to be assigned to security patches that are available but not approved because they don't meet the installation criteria specified in the patch baseline.

            Example scenario: Security patches that you might want installed can be skipped if you have specified a long period to wait after a patch is released before installation. If an update to the patch is released during your specified waiting period, the waiting period for installing the patch starts over. If the waiting period is too long, multiple versions of the patch could be released but never installed.

            Supported for Windows Server managed nodes only.
        baseline-id: The ID of the patch baseline to update.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description of the patch baseline.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        global-filters: |-
            A set of global filters used to include patches in the baseline.

            The `GlobalFilters` parameter can be configured only by using the CLI or an Amazon Web Services SDK. It can't be configured from the Patch Manager console, and its value isn't displayed in the console.
        name: The name of the patch baseline.
        rejected-patches: |-
            A list of explicitly rejected patches for the baseline.

            For information about accepted formats for lists of approved patches and rejected patches, see [Package name formats for approved and rejected patch lists](https://docs.aws.amazon.com/systems-manager/latest/userguide/patch-manager-approved-rejected-package-name-formats.html) in the *Amazon Web Services Systems Manager User Guide*.
        rejected-patches-action: |-
            The action for Patch Manager to take on patches included in the `RejectedPackages` list.

            ALLOW\_AS\_DEPENDENCY

            **Linux and macOS**: A package in the rejected patches list is installed only if it is a dependency of another package. It is considered compliant with the patch baseline, and its status is reported as `INSTALLED_OTHER`. This is the default action if no option is specified.

            **Windows Server**: Windows Server doesn't support the concept of package dependencies. If a package in the rejected patches list and already installed on the node, its status is reported as `INSTALLED_OTHER`. Any package not already installed on the node is skipped. This is the default action if no option is specified.

            BLOCK

            **All OSs**: Packages in the rejected patches list, and packages that include them as dependencies, aren't installed by Patch Manager under any circumstances.

            State value assignment for patch compliance:

            - If a package was installed before it was added to the rejected patches list, or is installed outside of Patch Manager afterward, it's considered noncompliant with the patch baseline and its status is reported as `INSTALLED_REJECTED`.
            - If an update attempts to install a dependency package that is now rejected by the baseline, when previous versions of the package were not rejected, the package being updated is reported as `MISSING` for `SCAN` operations and as `FAILED` for `INSTALL` operations.
        replace: If True, then all fields that are required by the [CreatePatchBaseline]() operation are also required for this API request. Optional fields that aren't specified are set to null.
        sources: Information about the patches to use to update the managed nodes, including target operating systems and source repositories. Applies to Linux managed nodes only.
