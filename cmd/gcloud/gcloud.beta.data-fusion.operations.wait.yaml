name: wait
description: '*(BETA)*  Wait for asynchronous operation to complete.'
flags:
    --location=: Compute Engine region in which to create the operation.
documentation:
    command: |-
        ## EXAMPLES

        To wait for operation `my-operation` in project `my-project` and location
        `my-location`, run:

          $ gcloud beta data-fusion operations wait my-operation --project=my-project --location=my-location
    flag:
        location: |-
            Compute Engine region in which to create the operation.
            +
            To set the `location` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `datafusion/location`.
