name: untag-resource
description: Removes the association of tags from a DAX resource.
flags:
    --resource-name=!: The name of the DAX resource from which the tags should be removed.
    --tag-keys=!: A list of tag keys.
documentation:
    command: Removes the association of tags from a DAX resource. You can call `UntagResource` up to 5 times per second, per account.
    flag:
        resource-name: The name of the DAX resource from which the tags should be removed.
        tag-keys: A list of tag keys. If the DAX cluster has any tags with these keys, then the tags are removed from the cluster.
