name: delete
description: '*(BETA)*  Delete a policy on the given attachment point with the given name.'
flags:
    --attachment-point=!: Resource to which the policy is attached.
    --etag=: Etag that identifies the version of the existing policy.
    --kind=!: Policy type.
documentation:
    command: '*(BETA)*  Delete a policy on the given attachment point with the given name.'
    flag:
        attachment-point: Resource to which the policy is attached. For valid formats, see https://cloud.google.com/iam/help/deny/attachment-point.
        etag: Etag that identifies the version of the existing policy. It can be obtained by running `gcloud iam policies get`. When deleting a policy, if the etag is omitted, the policy is deleted regardless of its current etag. When updating a policy, if the etag is omitted, the update uses the etag provided in the policy file.
        kind: Policy type. Use `denypolicies` for deny policies.
