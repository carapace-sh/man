name: put-playback-configuration
description: Creates a playback configuration.
flags:
    --ad-conditioning-configuration=: The setting that indicates what conditioning MediaTailor will perform on ads that the ad decision server (ADS) returns, and what priority MediaTailor uses when inserting ads.
    --ad-decision-server-url=: The URL for the ad decision server (ADS).
    --avail-suppression=: The configuration for avail suppression, also known as ad suppression.
    --bumper=: The configuration for bumpers.
    --cdn-configuration=: The configuration for using a content delivery network (CDN), like Amazon CloudFront, for content and ad segment management.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration-aliases=: The player parameters and aliases used as dynamic variables during session initialization.
    --dash-configuration=: The configuration for DASH content.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --insertion-mode=: The setting that controls whether players can use stitched or guided ad insertion.
    --live-pre-roll-configuration=: The configuration for pre-roll ad insertion.
    --manifest-processing-rules=: The configuration for manifest processing rules.
    --name=!: The identifier for the playback configuration.
    --personalization-threshold-seconds=: Defines the maximum duration of underfilled ad time (in seconds) allowed in an ad break.
    --slate-ad-url=: The URL for a high-quality video asset to transcode and use to fill in time that's not used by ads.
    --tags=: The tags to assign to the playback configuration.
    --transcode-profile-name=: The name that is used to associate this playback configuration with a custom transcode profile.
    --video-content-source-url=: The URL prefix for the parent manifest for the stream, minus the asset ID.
completion:
    flag:
        insertion-mode:
            - STITCHED_ONLY
            - PLAYER_SELECT
documentation:
    command: Creates a playback configuration. For information about MediaTailor configurations, see [Working with configurations in AWS Elemental MediaTailor](https://docs.aws.amazon.com/mediatailor/latest/ug/configurations.html).
    flag:
        ad-conditioning-configuration: The setting that indicates what conditioning MediaTailor will perform on ads that the ad decision server (ADS) returns, and what priority MediaTailor uses when inserting ads.
        ad-decision-server-url: The URL for the ad decision server (ADS). This includes the specification of static parameters and placeholders for dynamic parameters. AWS Elemental MediaTailor substitutes player-specific and session-specific parameters as needed when calling the ADS. Alternately, for testing you can provide a static VAST URL. The maximum length is 25,000 characters.
        avail-suppression: The configuration for avail suppression, also known as ad suppression. For more information about ad suppression, see [Ad Suppression](https://docs.aws.amazon.com/mediatailor/latest/ug/ad-behavior.html).
        bumper: The configuration for bumpers. Bumpers are short audio or video clips that play at the start or before the end of an ad break. To learn more about bumpers, see [Bumpers](https://docs.aws.amazon.com/mediatailor/latest/ug/bumpers.html).
        cdn-configuration: The configuration for using a content delivery network (CDN), like Amazon CloudFront, for content and ad segment management.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration-aliases: The player parameters and aliases used as dynamic variables during session initialization. For more information, see [Domain Variables](https://docs.aws.amazon.com/mediatailor/latest/ug/variables-domains.html).
        dash-configuration: The configuration for DASH content.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        insertion-mode: The setting that controls whether players can use stitched or guided ad insertion. The default, `STITCHED_ONLY`, forces all player sessions to use stitched (server-side) ad insertion. Choosing `PLAYER_SELECT` allows players to select either stitched or guided ad insertion at session-initialization time. The default for players that do not specify an insertion mode is stitched.
        live-pre-roll-configuration: The configuration for pre-roll ad insertion.
        manifest-processing-rules: The configuration for manifest processing rules. Manifest processing rules enable customization of the personalized manifests created by MediaTailor.
        name: The identifier for the playback configuration.
        personalization-threshold-seconds: Defines the maximum duration of underfilled ad time (in seconds) allowed in an ad break. If the duration of underfilled ad time exceeds the personalization threshold, then the personalization of the ad break is abandoned and the underlying content is shown. This feature applies to *ad replacement* in live and VOD streams, rather than ad insertion, because it relies on an underlying content stream. For more information about ad break behavior, including ad replacement and insertion, see [Ad Behavior in AWS Elemental MediaTailor](https://docs.aws.amazon.com/mediatailor/latest/ug/ad-behavior.html).
        slate-ad-url: The URL for a high-quality video asset to transcode and use to fill in time that's not used by ads. AWS Elemental MediaTailor shows the slate to fill in gaps in media content. Configuring the slate is optional for non-VPAID configurations. For VPAID, the slate is required because MediaTailor provides it in the slots that are designated for dynamic ad content. The slate must be a high-quality asset that contains both audio and video.
        tags: The tags to assign to the playback configuration. Tags are key-value pairs that you can associate with Amazon resources to help with organization, access control, and cost tracking. For more information, see [Tagging AWS Elemental MediaTailor Resources](https://docs.aws.amazon.com/mediatailor/latest/ug/tagging.html).
        transcode-profile-name: The name that is used to associate this playback configuration with a custom transcode profile. This overrides the dynamic transcoding defaults of MediaTailor. Use this only if you have already set up custom profiles with the help of AWS Support.
        video-content-source-url: The URL prefix for the parent manifest for the stream, minus the asset ID. The maximum length is 512 characters.
