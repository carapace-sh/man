name: update
description: '*(ALPHA)*  Update a Distributed Cloud Edge Network router.'
flags:
    --add-advertisement-ranges=: add the comma-separated list of CIDRs to the set of range advertisements.
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The Cloud location for the router.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --remove-advertisement-ranges=: remove the comma-separated list of CIDRs from the set of range advertisements.
    --set-advertisement-ranges=: replace the comma-separated list of CIDRs with the set of range advertisements.
    --zone=: The zone of the router.
documentation:
    command: |
        *(ALPHA)*  Update a Distributed Cloud Edge Network router.

        Note that `update` operations are not thread-safe, meaning that if more than one
        user is updating a router at a time, there can be race conditions. Please ensure
        that at most one `update` operation is being applied to a given router at a
        time.
    flag:
        add-advertisement-ranges: add the comma-separated list of CIDRs to the set of range advertisements.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The Cloud location for the router.
            +
            To set the `location` attribute:
            * provide the argument `router` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        remove-advertisement-ranges: remove the comma-separated list of CIDRs from the set of range advertisements.
        set-advertisement-ranges: replace the comma-separated list of CIDRs with the set of range advertisements.
        zone: |-
            The zone of the router.
            +
            To set the `zone` attribute:
            * provide the argument `router` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line.
