name: build
description: '*(ALPHA)*  Build an Immersive Stream for XR content resource.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Global location name.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: '*(ALPHA)*  Build an Immersive Stream for XR content resource and tag it with a user specified version tag.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            Global location name.
            +
            To set the `location` attribute:
            * provide the argument `content` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * global is the only supported location.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
