name: create
description: '*(BETA)*  Create a custom role for a project or an organization.'
flags:
    --description=: The description of the role you want to create.
    --file=: The JSON or YAML file with the IAM Role to create.
    --organization=: Organization of the role you want to create.
    --permissions=: The permissions of the role you want to create.
    --stage=: The state of the role you want to create.
    --title=: The title of the role you want to create.
documentation:
    command: '*(BETA)*  This command creates a custom role with the provided information.'
    flag:
        description: The description of the role you want to create.
        file: The JSON or YAML file with the IAM Role to create. See https://cloud.google.com/iam/reference/rest/v1/projects.roles.
        organization: Organization of the role you want to create.
        permissions: The permissions of the role you want to create. Use commas to separate them.
        stage: 'The state of the role you want to create. This represents a role''s lifecycle phase: `ALPHA`, `BETA`, `GA`, `DEPRECATED`, `DISABLED`, `EAP`.'
        title: The title of the role you want to create.
