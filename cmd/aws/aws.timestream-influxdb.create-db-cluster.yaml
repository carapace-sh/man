name: create-db-cluster
description: Creates a new Timestream for InfluxDB cluster.
flags:
    --allocated-storage=!: The amount of storage to allocate for your DB storage type in GiB (gibibytes).
    --bucket=: The name of the initial InfluxDB bucket.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --db-instance-type=!: The Timestream for InfluxDB DB instance type to run InfluxDB on.
    --db-parameter-group-identifier=: The ID of the DB parameter group to assign to your DB cluster.
    --db-storage-type=: The Timestream for InfluxDB DB storage type to read and write InfluxDB data.
    --deployment-type=!: Specifies the type of cluster to create.
    --failover-mode=: Specifies the behavior of failure recovery when the primary node of the cluster fails.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --log-delivery-configuration=: Configuration for sending InfluxDB engine logs to a specified S3 bucket.
    --name=!: The name that uniquely identifies the DB cluster when interacting with the Amazon Timestream for InfluxDB API and CLI commands.
    --network-type=: Specifies whether the network type of the Timestream for InfluxDB cluster is IPv4, which can communicate over IPv4 protocol only, or DUAL, which can communicate over both IPv4 and IPv6 protocols.
    --no-publicly-accessible: Configures the Timestream for InfluxDB cluster with a public IP to facilitate access from outside the VPC.
    --organization=: The name of the initial organization for the initial admin user in InfluxDB.
    --password=!: The password of the initial admin user created in InfluxDB.
    --port=: The port number on which InfluxDB accepts connections.
    --publicly-accessible: Configures the Timestream for InfluxDB cluster with a public IP to facilitate access from outside the VPC.
    --tags=: A list of key-value pairs to associate with the DB instance.
    --username=: The username of the initial admin user created in InfluxDB.
    --vpc-security-group-ids=!: A list of VPC security group IDs to associate with the Timestream for InfluxDB cluster.
    --vpc-subnet-ids=!: A list of VPC subnet IDs to associate with the DB cluster.
completion:
    flag:
        db-instance-type:
            - db.influx.medium
            - db.influx.large
            - db.influx.xlarge
            - db.influx.2xlarge
            - db.influx.4xlarge
            - db.influx.8xlarge
            - db.influx.12xlarge
            - db.influx.16xlarge
            - db.influx.24xlarge
        db-storage-type:
            - InfluxIOIncludedT1
            - InfluxIOIncludedT2
            - InfluxIOIncludedT3
        deployment-type:
            - MULTI_NODE_READ_REPLICAS
        failover-mode:
            - AUTOMATIC
            - NO_FAILOVER
        network-type:
            - IPV4
            - DUAL
documentation:
    command: Creates a new Timestream for InfluxDB cluster.
    flag:
        allocated-storage: The amount of storage to allocate for your DB storage type in GiB (gibibytes).
        bucket: The name of the initial InfluxDB bucket. All InfluxDB data is stored in a bucket. A bucket combines the concept of a database and a retention period (the duration of time that each data point persists). A bucket belongs to an organization.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        db-instance-type: The Timestream for InfluxDB DB instance type to run InfluxDB on.
        db-parameter-group-identifier: The ID of the DB parameter group to assign to your DB cluster. DB parameter groups specify how the database is configured. For example, DB parameter groups can specify the limit for query concurrency.
        db-storage-type: |-
            The Timestream for InfluxDB DB storage type to read and write InfluxDB data.

            You can choose between three different types of provisioned Influx IOPS Included storage according to your workload requirements:

            - Influx I/O Included 3000 IOPS
            - Influx I/O Included 12000 IOPS
            - Influx I/O Included 16000 IOPS
        deployment-type: Specifies the type of cluster to create.
        failover-mode: Specifies the behavior of failure recovery when the primary node of the cluster fails.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        log-delivery-configuration: Configuration for sending InfluxDB engine logs to a specified S3 bucket.
        name: The name that uniquely identifies the DB cluster when interacting with the Amazon Timestream for InfluxDB API and CLI commands. This name will also be a prefix included in the endpoint. DB cluster names must be unique per customer and per region.
        network-type: Specifies whether the network type of the Timestream for InfluxDB cluster is IPv4, which can communicate over IPv4 protocol only, or DUAL, which can communicate over both IPv4 and IPv6 protocols.
        organization: The name of the initial organization for the initial admin user in InfluxDB. An InfluxDB organization is a workspace for a group of users.
        password: The password of the initial admin user created in InfluxDB. This password will allow you to access the InfluxDB UI to perform various administrative tasks and also use the InfluxDB CLI to create an operator token. These attributes will be stored in a secret created in Secrets Manager in your account.
        port: |-
            The port number on which InfluxDB accepts connections.

            Valid Values: 1024-65535

            Default: 8086

            Constraints: The value can't be 2375-2376, 7788-7799, 8090, or 51678-51680
        publicly-accessible: Configures the Timestream for InfluxDB cluster with a public IP to facilitate access from outside the VPC.
        tags: A list of key-value pairs to associate with the DB instance.
        username: The username of the initial admin user created in InfluxDB. Must start with a letter and can't end with a hyphen or contain two consecutive hyphens. For example, my-user1. This username will allow you to access the InfluxDB UI to perform various administrative tasks and also use the InfluxDB CLI to create an operator token. These attributes will be stored in a secret created in Secrets Manager in your account.
        vpc-security-group-ids: A list of VPC security group IDs to associate with the Timestream for InfluxDB cluster.
        vpc-subnet-ids: A list of VPC subnet IDs to associate with the DB cluster. Provide at least two VPC subnet IDs in different Availability Zones when deploying with a Multi-AZ standby.
