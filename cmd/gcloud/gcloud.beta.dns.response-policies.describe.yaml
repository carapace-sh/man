name: describe
description: '*(BETA)*  Describes a Cloud DNS response policy.'
flags:
    --location=: Specifies the desired service location the request is sent to.
documentation:
    command: |-
        *(BETA)*  This command describes details of a Cloud DNS response policy.

        ## EXAMPLES

        To describe a global response policy (default), run:

          $ gcloud beta dns response-policies describe myresponsepolicy
    flag:
        location: Specifies the desired service location the request is sent to. Defaults to Cloud DNS global service. Use --location=global if you want to target the global service.
