name: delete
description: '*(BETA)*  Delete Compute Engine routers.'
flags:
    --region=: Region of the routers to delete.
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute routers delete* deletes one or more Compute Engine
        routers. Routers can only be deleted when no other resources
        (e.g., virtual machine instances) refer to them.
    flag:
        region: |-
            Region of the routers to delete. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
