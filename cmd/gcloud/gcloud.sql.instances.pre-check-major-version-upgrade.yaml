name: pre-check-major-version-upgrade
description: Performs pre-checks for a major version upgrade of a Cloud SQL instance.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --target-database-version=!: Target database version for the upgrade.
documentation:
    command: |
        *gcloud sql instances pre-check-major-version-upgrade* performs pre-checks for a major version upgrade of a Cloud SQL instance.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        target-database-version: Target database version for the upgrade.
