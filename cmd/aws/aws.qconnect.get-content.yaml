name: get-content
description: Retrieves content, including a pre-signed URL to download the content.
flags:
    --content-id=!: The identifier of the content.
    --knowledge-base-id=!: The identifier of the knowledge base.
documentation:
    command: Retrieves content, including a pre-signed URL to download the content.
    flag:
        content-id: The identifier of the content. Can be either the ID or the ARN. URLs cannot contain the ARN.
        knowledge-base-id: The identifier of the knowledge base. This should not be a QUICK\_RESPONSES type knowledge base. Can be either the ID or the ARN. URLs cannot contain the ARN.
