name: list-storage-configurations
description: Gets summary information about all storage configurations in your account, in the AWS region where the API request is processed.
flags:
    --max-results=: Maximum number of storage configurations to return.
    --next-token=: The first storage configuration to retrieve.
documentation:
    command: Gets summary information about all storage configurations in your account, in the AWS region where the API request is processed.
    flag:
        max-results: 'Maximum number of storage configurations to return. Default: your service quota or 100, whichever is smaller.'
        next-token: The first storage configuration to retrieve. This is used for pagination; see the `nextToken` response field.
