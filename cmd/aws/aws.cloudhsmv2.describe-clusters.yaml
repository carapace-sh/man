name: describe-clusters
description: Gets information about CloudHSM clusters.
flags:
    --filters=: One or more filters to limit the items returned in the response.
    --max-results=: The maximum number of clusters to return in the response.
    --next-token=: The `NextToken` value that you received in the previous response.
documentation:
    command: |-
        Gets information about CloudHSM clusters.

        This is a paginated operation, which means that each response might contain only a subset of all the clusters. When the response contains only a subset of clusters, it includes a `NextToken` value. Use this value in a subsequent `DescribeClusters` request to get more clusters. When you receive a response with no `NextToken` (or an empty or null value), that means there are no more clusters to get.

        **Cross-account use:** No. You cannot perform this operation on CloudHSM clusters in a different Amazon Web Services account.
    flag:
        filters: |-
            One or more filters to limit the items returned in the response.

            Use the `clusterIds` filter to return only the specified clusters. Specify clusters by their cluster identifier (ID).

            Use the `vpcIds` filter to return only the clusters in the specified virtual private clouds (VPCs). Specify VPCs by their VPC identifier (ID).

            Use the `states` filter to return only clusters that match the specified state.
        max-results: The maximum number of clusters to return in the response. When there are more clusters than the number you specify, the response contains a `NextToken` value.
        next-token: The `NextToken` value that you received in the previous response. Use this value to get more clusters.
