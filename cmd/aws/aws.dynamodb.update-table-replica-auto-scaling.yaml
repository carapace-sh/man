name: update-table-replica-auto-scaling
description: Updates auto scaling settings on your global tables at once.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --global-secondary-index-updates=:
        description: Represents the auto scaling settings of the global secondary indexes of the replica to be updated.
        nargs: -1
    --provisioned-write-capacity-auto-scaling-update=: ""
    --replica-updates=:
        description: Represents the auto scaling settings of replicas of the table that will be modified.
        nargs: -1
    --table-name=!: The name of the global table to be updated.
documentation:
    command: Updates auto scaling settings on your global tables at once.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        global-secondary-index-updates: Represents the auto scaling settings of the global secondary indexes of the replica to be updated.
        provisioned-write-capacity-auto-scaling-update: ""
        replica-updates: Represents the auto scaling settings of replicas of the table that will be modified.
        table-name: The name of the global table to be updated. You can also provide the Amazon Resource Name (ARN) of the table in this parameter.
