name: update
description: '*(BETA)*  Update a Compute Engine project resource.'
flags:
    --cloud-armor-tier=: Cloud armor tier to assign to the project.
    --default-network-tier=: The default network tier to assign to the project.
    --managed-protection-tier=: Managed protection tier to assign to the project.
completion:
    flag:
        cloud-armor-tier:
            - CA_STANDARD
            - CA_ENTERPRISE_PAYGO
            - CA_ENTERPRISE_ANNUAL
        default-network-tier:
            - PREMIUM
            - STANDARD
        managed-protection-tier:
            - CA_STANDARD
            - CAMP_PLUS_PAYGO
            - CAMP_PLUS_ANNUAL
documentation:
    command: '*(BETA)*  *gcloud beta compute project-info update* is used to update a Compute Engine project resource.'
    flag:
        cloud-armor-tier: 'Cloud armor tier to assign to the project. _CLOUD_ARMOR_TIER_ must be one of: *CA_STANDARD*, *CA_ENTERPRISE_PAYGO*, *CA_ENTERPRISE_ANNUAL*.'
        default-network-tier: 'The default network tier to assign to the project. _DEFAULT_NETWORK_TIER_ must be one of: *PREMIUM*, *STANDARD*.'
        managed-protection-tier: 'Managed protection tier to assign to the project. _MANAGED_PROTECTION_TIER_ must be one of: *CA_STANDARD*, *CAMP_PLUS_PAYGO*, *CAMP_PLUS_ANNUAL*.'
