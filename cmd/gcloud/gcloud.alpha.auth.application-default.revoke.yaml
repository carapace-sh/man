name: revoke
description: '*(ALPHA)*  Revoke previously generated Application Default Credentials.'
documentation:
    command: |-
        *(ALPHA)*  Revokes Application Default Credentials that have been previously generated by
        `gcloud alpha auth application-default login` and deletes the local credential file.

        This does not affect any credentials set up through other means,
        such as credentials referenced by the Application Default Credentials
        environment variable or service account credentials that are active on
        a Google Compute Engine virtual machine.
