name: get-log-anomaly-detector
description: Retrieves information about the log anomaly detector that you specify.
flags:
    --anomaly-detector-arn=!: The ARN of the anomaly detector to retrieve information about.
documentation:
    command: Retrieves information about the log anomaly detector that you specify. The KMS key ARN detected is valid.
    flag:
        anomaly-detector-arn: The ARN of the anomaly detector to retrieve information about. You can find the ARNs of log anomaly detectors in your account by using the [ListLogAnomalyDetectors](https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_ListLogAnomalyDetectors.html) operation.
