name: list-session-actions
description: Lists session actions.
flags:
    --farm-id=!: The farm ID for the session actions list.
    --job-id=!: The job ID for the session actions list.
    --max-results=: The maximum number of results to return.
    --next-token=: The token for the next set of results, or `null` to start from the beginning.
    --queue-id=!: The queue ID for the session actions list.
    --session-id=: The session ID to include on the sessions action list.
    --task-id=: The task ID for the session actions list.
documentation:
    command: Lists session actions.
    flag:
        farm-id: The farm ID for the session actions list.
        job-id: The job ID for the session actions list.
        max-results: The maximum number of results to return. Use this parameter with `NextToken` to get results as a set of sequential pages.
        next-token: The token for the next set of results, or `null` to start from the beginning.
        queue-id: The queue ID for the session actions list.
        session-id: The session ID to include on the sessions action list.
        task-id: The task ID for the session actions list.
