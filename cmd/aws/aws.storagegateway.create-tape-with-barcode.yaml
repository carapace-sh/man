name: create-tape-with-barcode
description: Creates a virtual tape by using your own barcode.
flags:
    --gateway-arn=!: The unique Amazon Resource Name (ARN) that represents the gateway to associate the virtual tape with.
    --kmsencrypted: Set to `true` to use Amazon S3 server-side encryption with your own KMS key, or `false` to use a key managed by Amazon S3.
    --kmskey=: The Amazon Resource Name (ARN) of a symmetric customer master key (CMK) used for Amazon S3 server-side encryption.
    --no-kmsencrypted&: Set to `true` to use Amazon S3 server-side encryption with your own KMS key, or `false` to use a key managed by Amazon S3.
    --pool-id=: The ID of the pool that you want to add your tape to for archiving.
    --tags=: A list of up to 50 tags that can be assigned to a virtual tape that has a barcode.
    --tape-barcode=!: The barcode that you want to assign to the tape.
    --tape-size-in-bytes=!: The size, in bytes, of the virtual tape that you want to create.
    --worm=: Set to `TRUE` if the tape you are creating is to be configured as a write-once-read-many (WORM) tape.
documentation:
    command: |-
        Creates a virtual tape by using your own barcode. You write data to the virtual tape and then archive the tape. A barcode is unique and cannot be reused if it has already been used on a tape. This applies to barcodes used on deleted tapes. This operation is only supported in the tape gateway type.

        Cache storage must be allocated to the gateway before you can create a virtual tape. Use the [AddCache]() operation to add cache storage to a gateway.
    flag:
        gateway-arn: The unique Amazon Resource Name (ARN) that represents the gateway to associate the virtual tape with. Use the [ListGateways]() operation to return a list of gateways for your account and Amazon Web Services Region.
        kmsencrypted: |-
            Set to `true` to use Amazon S3 server-side encryption with your own KMS key, or `false` to use a key managed by Amazon S3. Optional.

            Valid Values: `true` | `false`
        kmskey: The Amazon Resource Name (ARN) of a symmetric customer master key (CMK) used for Amazon S3 server-side encryption. Storage Gateway does not support asymmetric CMKs. This value can only be set when `KMSEncrypted` is `true`. Optional.
        pool-id: The ID of the pool that you want to add your tape to for archiving. The tape in this pool is archived in the S3 storage class that is associated with the pool. When you use your backup application to eject the tape, the tape is archived directly into the storage class (S3 Glacier or S3 Deep Archive) that corresponds to the pool.
        tags: |-
            A list of up to 50 tags that can be assigned to a virtual tape that has a barcode. Each tag is a key-value pair.

            Valid characters for key and value are letters, spaces, and numbers representable in UTF-8 format, and the following special characters: + - = . _ : / @. The maximum length of a tag's key is 128 characters, and the maximum length for a tag's value is 256.
        tape-barcode: |-
            The barcode that you want to assign to the tape.

            Barcodes cannot be reused. This includes barcodes used for tapes that have been deleted.
        tape-size-in-bytes: |-
            The size, in bytes, of the virtual tape that you want to create.

            The size must be aligned by gigabyte (1024\*1024\*1024 bytes).
        worm: Set to `TRUE` if the tape you are creating is to be configured as a write-once-read-many (WORM) tape.
