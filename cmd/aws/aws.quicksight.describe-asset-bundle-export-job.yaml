name: describe-asset-bundle-export-job
description: Describes an existing export job.
flags:
    --asset-bundle-export-job-id=!: The ID of the job that you want described.
    --aws-account-id=!: The ID of the Amazon Web Services account the export job is executed in.
documentation:
    command: |-
        Describes an existing export job.

        Poll job descriptions after a job starts to know the status of the job. When a job succeeds, a URL is provided to download the exported assets' data from. Download URLs are valid for five minutes after they are generated. You can call the `DescribeAssetBundleExportJob` API for a new download URL as needed.

        Job descriptions are available for 14 days after the job starts.
    flag:
        asset-bundle-export-job-id: The ID of the job that you want described. The job ID is set when you start a new job with a `StartAssetBundleExportJob` API call.
        aws-account-id: The ID of the Amazon Web Services account the export job is executed in.
