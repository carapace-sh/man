name: update-queue
description: Updates a queue.
flags:
    --allowed-storage-profile-ids-to-add=: The storage profile IDs to add.
    --allowed-storage-profile-ids-to-remove=: The storage profile ID to remove.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: The idempotency token to update in the queue.
    --default-budget-action=: The default action to take for a queue update if a budget isn't configured.
    --description=: The description of the queue to update.
    --display-name=: The display name of the queue to update.
    --farm-id=!: The farm ID to update in the queue.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --job-attachment-settings=: The job attachment settings to update for the queue.
    --job-run-as-user=: Update the jobs in the queue to run as a specified POSIX user.
    --queue-id=!: The queue ID to update.
    --required-file-system-location-names-to-add=: The required file system location names to add to the queue.
    --required-file-system-location-names-to-remove=: The required file system location names to remove from the queue.
    --role-arn=: The IAM role ARN that's used to run jobs from this queue.
completion:
    flag:
        default-budget-action:
            - NONE
            - STOP_SCHEDULING_AND_COMPLETE_TASKS
            - STOP_SCHEDULING_AND_CANCEL_TASKS
documentation:
    command: Updates a queue.
    flag:
        allowed-storage-profile-ids-to-add: The storage profile IDs to add.
        allowed-storage-profile-ids-to-remove: The storage profile ID to remove.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: The idempotency token to update in the queue.
        default-budget-action: The default action to take for a queue update if a budget isn't configured.
        description: |-
            The description of the queue to update.

            This field can store any content. Escape or encode this content before displaying it on a webpage or any other system that might interpret the content of this field.
        display-name: |-
            The display name of the queue to update.

            This field can store any content. Escape or encode this content before displaying it on a webpage or any other system that might interpret the content of this field.
        farm-id: The farm ID to update in the queue.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        job-attachment-settings: The job attachment settings to update for the queue.
        job-run-as-user: Update the jobs in the queue to run as a specified POSIX user.
        queue-id: The queue ID to update.
        required-file-system-location-names-to-add: The required file system location names to add to the queue.
        required-file-system-location-names-to-remove: The required file system location names to remove from the queue.
        role-arn: The IAM role ARN that's used to run jobs from this queue.
