name: apply
description: '*(ALPHA)*  Apply a KRM configuration to a Google Cloud Platform resource filename or stdin.'
flags:
    --no-resolve-references&: If True, any resource references in the target file PATH will be resolved, and those external resources will be applied as well.
    --resolve-references&: If True, any resource references in the target file PATH will be resolved, and those external resources will be applied as well.
documentation:
    command: '*(ALPHA)*  Apply a KRM configuration to a Google Cloud Platform resource filename or stdin.'
