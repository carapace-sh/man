name: delete-stream
description: Deletes a Kinesis data stream and all its shards and data.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --enforce-consumer-deletion: If this parameter is unset (`null`) or if you set it to `false`, and the stream has registered consumers, the call to `DeleteStream` fails with a `ResourceInUseException`.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-enforce-consumer-deletion: If this parameter is unset (`null`) or if you set it to `false`, and the stream has registered consumers, the call to `DeleteStream` fails with a `ResourceInUseException`.
    --stream-arn=: The ARN of the stream.
    --stream-name=: The name of the stream to delete.
documentation:
    command: |-
        Deletes a Kinesis data stream and all its shards and data. You must shut down any applications that are operating on the stream before you delete the stream. If an application attempts to operate on a deleted stream, it receives the exception `ResourceNotFoundException`.

        When invoking this API, you must use either the `StreamARN` or the `StreamName` parameter, or both. It is recommended that you use the `StreamARN` input parameter when you invoke this API.

        If the stream is in the `ACTIVE` state, you can delete it. After a `DeleteStream` request, the specified stream is in the `DELETING` state until Kinesis Data Streams completes the deletion.

        **Note:** Kinesis Data Streams might continue to accept data read and write operations, such as [PutRecord](), [PutRecords](), and [GetRecords](), on a stream in the `DELETING` state until the stream deletion is complete.

        When you delete a stream, any shards in that stream are also deleted, and any tags are dissociated from the stream.

        You can use the [DescribeStreamSummary]() operation to check the state of the stream, which is returned in `StreamStatus`.

        [DeleteStream]() has a limit of five transactions per second per account.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        enforce-consumer-deletion: If this parameter is unset (`null`) or if you set it to `false`, and the stream has registered consumers, the call to `DeleteStream` fails with a `ResourceInUseException`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        stream-arn: The ARN of the stream.
        stream-name: The name of the stream to delete.
