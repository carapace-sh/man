name: update-identity-provider-settings
description: Updates additional product configuration settings for the registered identity provider.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identity-provider-arn=: The Amazon Resource Name (ARN) of the identity provider to update.
    --identity-provider=: ""
    --product=: The name of the user-based subscription product.
    --update-settings=!: Updates the registered identity provider’s product related configuration settings.
documentation:
    command: Updates additional product configuration settings for the registered identity provider.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        identity-provider: ""
        identity-provider-arn: The Amazon Resource Name (ARN) of the identity provider to update.
        product: |-
            The name of the user-based subscription product.

            Valid values: `VISUAL_STUDIO_ENTERPRISE` | `VISUAL_STUDIO_PROFESSIONAL` | `OFFICE_PROFESSIONAL_PLUS` | `REMOTE_DESKTOP_SERVICES`
        update-settings: |-
            Updates the registered identity provider’s product related configuration settings. You can update any combination of settings in a single operation such as the:

            - Subnets which you want to add to provision VPC endpoints.
            - Subnets which you want to remove the VPC endpoints from.
            - Security group ID which permits traffic to the VPC endpoints.
