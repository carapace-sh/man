name: put-table-bucket-maintenance-configuration
description: Creates a new maintenance configuration or replaces an existing maintenance configuration for a table bucket.
flags:
    --table-bucket-arn=!: The Amazon Resource Name (ARN) of the table bucket associated with the maintenance configuration.
    --type=!: The type of the maintenance configuration.
    --value=!: Defines the values of the maintenance configuration for the table bucket.
completion:
    flag:
        type:
            - icebergUnreferencedFileRemoval
documentation:
    command: |-
        Creates a new maintenance configuration or replaces an existing maintenance configuration for a table bucket. For more information, see [Amazon S3 table bucket maintenance](https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-table-buckets-maintenance.html) in the *Amazon Simple Storage Service User Guide*.

        Permissions

        You must have the `s3tables:PutTableBucketMaintenanceConfiguration` permission to use this operation.
    flag:
        table-bucket-arn: The Amazon Resource Name (ARN) of the table bucket associated with the maintenance configuration.
        type: The type of the maintenance configuration.
        value: Defines the values of the maintenance configuration for the table bucket.
