name: put-recommendation-preferences
description: Creates a new recommendation preference or updates an existing recommendation preference, such as enhanced infrastructure metrics.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --enhanced-infrastructure-metrics=: The status of the enhanced infrastructure metrics recommendation preference to create or update.
    --external-metrics-preference=: The provider of the external metrics recommendation preference to create or update.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --inferred-workload-types=: The status of the inferred workload types recommendation preference to create or update.
    --look-back-period=: The preference to control the number of days the utilization metrics of the Amazon Web Services resource are analyzed.
    --preferred-resources=: The preference to control which resource type values are considered when generating rightsizing recommendations.
    --resource-type=!: The target resource type of the recommendation preference to create.
    --savings-estimation-mode=: The status of the savings estimation mode preference to create or update.
    --scope=: An object that describes the scope of the recommendation preference to create.
    --utilization-preferences=: The preference to control the resource’s CPU utilization threshold, CPU utilization headroom, and memory utilization headroom.
completion:
    flag:
        enhanced-infrastructure-metrics:
            - Active
            - Inactive
        inferred-workload-types:
            - Active
            - Inactive
        look-back-period:
            - DAYS_14
            - DAYS_32
            - DAYS_93
        resource-type:
            - Ec2Instance
            - AutoScalingGroup
            - EbsVolume
            - LambdaFunction
            - NotApplicable
            - EcsService
            - License
            - RdsDBInstance
            - AuroraDBClusterStorage
            - Idle
        savings-estimation-mode:
            - AfterDiscounts
            - BeforeDiscounts
documentation:
    command: |-
        Creates a new recommendation preference or updates an existing recommendation preference, such as enhanced infrastructure metrics.

        For more information, see [Activating enhanced infrastructure metrics](https://docs.aws.amazon.com/compute-optimizer/latest/ug/enhanced-infrastructure-metrics.html) in the *Compute Optimizer User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        enhanced-infrastructure-metrics: |-
            The status of the enhanced infrastructure metrics recommendation preference to create or update.

            Specify the `Active` status to activate the preference, or specify `Inactive` to deactivate the preference.

            For more information, see [Enhanced infrastructure metrics](https://docs.aws.amazon.com/compute-optimizer/latest/ug/enhanced-infrastructure-metrics.html) in the *Compute Optimizer User Guide*.
        external-metrics-preference: |-
            The provider of the external metrics recommendation preference to create or update.

            Specify a valid provider in the `source` field to activate the preference. To delete this preference, see the [DeleteRecommendationPreferences]() action.

            This preference can only be set for the `Ec2Instance` resource type.

            For more information, see [External metrics ingestion](https://docs.aws.amazon.com/compute-optimizer/latest/ug/external-metrics-ingestion.html) in the *Compute Optimizer User Guide*.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        inferred-workload-types: |-
            The status of the inferred workload types recommendation preference to create or update.

            The inferred workload type feature is active by default. To deactivate it, create a recommendation preference.

            Specify the `Inactive` status to deactivate the feature, or specify `Active` to activate it.

            For more information, see [Inferred workload types](https://docs.aws.amazon.com/compute-optimizer/latest/ug/inferred-workload-types.html) in the *Compute Optimizer User Guide*.
        look-back-period: |-
            The preference to control the number of days the utilization metrics of the Amazon Web Services resource are analyzed. When this preference isn't specified, we use the default value `DAYS_14`.

            You can only set this preference for the Amazon EC2 instance and Amazon EC2 Auto Scaling group resource types.

            - Amazon EC2 instance lookback preferences can be set at the organization, account, and resource levels.
            - Amazon EC2 Auto Scaling group lookback preferences can only be set at the resource level.
        preferred-resources: |-
            The preference to control which resource type values are considered when generating rightsizing recommendations. You can specify this preference as a combination of include and exclude lists. You must specify either an `includeList` or `excludeList`. If the preference is an empty set of resource type values, an error occurs.

            You can only set this preference for the Amazon EC2 instance and Amazon EC2 Auto Scaling group resource types.
        resource-type: |-
            The target resource type of the recommendation preference to create.

            The `Ec2Instance` option encompasses standalone instances and instances that are part of Amazon EC2 Auto Scaling groups. The `AutoScalingGroup` option encompasses only instances that are part of an Amazon EC2 Auto Scaling group.
        savings-estimation-mode: |-
            The status of the savings estimation mode preference to create or update.

            Specify the `AfterDiscounts` status to activate the preference, or specify `BeforeDiscounts` to deactivate the preference.

            Only the account manager or delegated administrator of your organization can activate this preference.

            For more information, see [Savings estimation mode](https://docs.aws.amazon.com/compute-optimizer/latest/ug/savings-estimation-mode.html) in the *Compute Optimizer User Guide*.
        scope: |-
            An object that describes the scope of the recommendation preference to create.

            You can create recommendation preferences at the organization level (for management accounts of an organization only), account level, and resource level. For more information, see [Activating enhanced infrastructure metrics](https://docs.aws.amazon.com/compute-optimizer/latest/ug/enhanced-infrastructure-metrics.html) in the *Compute Optimizer User Guide*.

            You cannot create recommendation preferences for Amazon EC2 Auto Scaling groups at the organization and account levels. You can create recommendation preferences for Amazon EC2 Auto Scaling groups only at the resource level by specifying a scope name of `ResourceArn` and a scope value of the Amazon EC2 Auto Scaling group Amazon Resource Name (ARN). This will configure the preference for all instances that are part of the specified Amazon EC2 Auto Scaling group. You also cannot create recommendation preferences at the resource level for instances that are part of an Amazon EC2 Auto Scaling group. You can create recommendation preferences at the resource level only for standalone instances.
        utilization-preferences: |-
            The preference to control the resource’s CPU utilization threshold, CPU utilization headroom, and memory utilization headroom. When this preference isn't specified, we use the following default values.

            CPU utilization:

            - `P99_5` for threshold
            - `PERCENT_20` for headroom

            Memory utilization:

            - `PERCENT_20` for headroom

            <!--THE END-->

            - You can only set CPU and memory utilization preferences for the Amazon EC2 instance resource type.
            - The threshold setting isn’t available for memory utilization.
