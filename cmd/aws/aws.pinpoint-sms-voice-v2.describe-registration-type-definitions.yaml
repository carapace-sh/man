name: describe-registration-type-definitions
description: Retrieves the specified registration type definitions.
flags:
    --filters=: An array of RegistrationFilter objects to filter the results.
    --max-results=: The maximum number of results to return per each request.
    --next-token=: The token to be used for the next set of paginated results.
    --registration-types=: The type of registration form.
documentation:
    command: Retrieves the specified registration type definitions. You can use DescribeRegistrationTypeDefinitions to view the requirements for creating, filling out, and submitting each registration type.
    flag:
        filters: An array of RegistrationFilter objects to filter the results.
        max-results: The maximum number of results to return per each request.
        next-token: The token to be used for the next set of paginated results. You don't need to supply a value for this field in the initial request.
        registration-types: The type of registration form. The list of **RegistrationTypes** can be found using the [DescribeRegistrationTypeDefinitions]() action.
