name: create-contact-method
description: Creates an email or SMS text message contact method.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --contact-endpoint=!: The destination of the contact method, such as an email address or a mobile phone number.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --protocol=!: The protocol of the contact method, such as `Email` or `SMS` (text messaging).
completion:
    flag:
        protocol:
            - Email
            - SMS
documentation:
    command: |-
        Creates an email or SMS text message contact method.

        A contact method is used to send you notifications about your Amazon Lightsail resources. You can add one email address and one mobile phone number contact method in each Amazon Web Services Region. However, SMS text messaging is not supported in some Amazon Web Services Regions, and SMS text messages cannot be sent to some countries/regions. For more information, see [Notifications in Amazon Lightsail](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-notifications).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        contact-endpoint: |-
            The destination of the contact method, such as an email address or a mobile phone number.

            Use the E.164 format when specifying a mobile phone number. E.164 is a standard for the phone number structure used for international telecommunication. Phone numbers that follow this format can have a maximum of 15 digits, and they are prefixed with the plus character (+) and the country code. For example, a U.S. phone number in E.164 format would be specified as +1XXX5550100. For more information, see [E.164](https://en.wikipedia.org/wiki/E.164) on *Wikipedia*.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        protocol: |-
            The protocol of the contact method, such as `Email` or `SMS` (text messaging).

            The `SMS` protocol is supported only in the following Amazon Web Services Regions.

            - US East (N. Virginia) (`us-east-1`)
            - US West (Oregon) (`us-west-2`)
            - Europe (Ireland) (`eu-west-1`)
            - Asia Pacific (Tokyo) (`ap-northeast-1`)
            - Asia Pacific (Singapore) (`ap-southeast-1`)
            - Asia Pacific (Sydney) (`ap-southeast-2`)

            For a list of countries/regions where SMS text messages can be sent, and the latest Amazon Web Services Regions where SMS text messaging is supported, see [Supported Regions and Countries](https://docs.aws.amazon.com/sns/latest/dg/sns-supported-regions-countries.html) in the *Amazon SNS Developer Guide*.

            For more information about notifications in Amazon Lightsail, see [Notifications in Amazon Lightsail](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-notifications).
