name: start-import-file-task
description: Starts a file import.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --data-source-type=: Specifies the source that the servers are coming from.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --group-id=: Groups the resources in the import file together with a unique name.
    --name=!: A descriptive name for the request.
    --s3bucket-for-report-data=: The S3 bucket where Strategy Recommendations uploads import results.
    --s3key=!: The Amazon S3 key name of the import file.
    --s3-bucket=!: The S3 bucket where the import file is located.
completion:
    flag:
        data-source-type:
            - ApplicationDiscoveryService
            - MPA
            - Import
            - StrategyRecommendationsApplicationDataCollector
documentation:
    command: Starts a file import.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        data-source-type: Specifies the source that the servers are coming from. By default, Strategy Recommendations assumes that the servers specified in the import file are available in AWS Application Discovery Service.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        group-id: Groups the resources in the import file together with a unique name. This ID can be as filter in `ListApplicationComponents` and `ListServers`.
        name: A descriptive name for the request.
        s3bucket-for-report-data: The S3 bucket where Strategy Recommendations uploads import results. The bucket name is required to begin with migrationhub-strategy-.
        s3key: The Amazon S3 key name of the import file.
        s3-bucket: The S3 bucket where the import file is located. The bucket name is required to begin with `migrationhub-strategy-`.
