name: describe-fleet-deployment
description: |-
    **This API works with the following fleet types:** Container

    Retrieves information about a managed container fleet deployment.
flags:
    --deployment-id=: A unique identifier for the deployment to return information for.
    --fleet-id=!: A unique identifier for the container fleet.
documentation:
    command: |-
        **This API works with the following fleet types:** Container

        Retrieves information about a managed container fleet deployment.

        **Request options**

        - Get information about the latest deployment for a specific fleet. Provide the fleet ID or ARN.
        - Get information about a specific deployment. Provide the fleet ID or ARN and the deployment ID.

        **Results**

        If successful, a `FleetDeployment` object is returned.
    flag:
        deployment-id: A unique identifier for the deployment to return information for.
        fleet-id: A unique identifier for the container fleet. You can use either the fleet ID or ARN value.
