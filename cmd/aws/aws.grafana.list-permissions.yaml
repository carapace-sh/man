name: list-permissions
description: Lists the users and groups who have the Grafana `Admin` and `Editor` roles in this workspace.
flags:
    --group-id=: (Optional) Limits the results to only the group that matches this ID.
    --max-results=: The maximum number of results to include in the response.
    --next-token=: The token to use when requesting the next set of results.
    --user-id=: (Optional) Limits the results to only the user that matches this ID.
    --user-type=: (Optional) If you specify `SSO_USER`, then only the permissions of IAM Identity Center users are returned.
    --workspace-id=!: The ID of the workspace to list permissions for.
completion:
    flag:
        user-type:
            - SSO_USER
            - SSO_GROUP
documentation:
    command: Lists the users and groups who have the Grafana `Admin` and `Editor` roles in this workspace. If you use this operation without specifying `userId` or `groupId`, the operation returns the roles of all users and groups. If you specify a `userId` or a `groupId`, only the roles for that user or group are returned. If you do this, you can specify only one `userId` or one `groupId`.
    flag:
        group-id: (Optional) Limits the results to only the group that matches this ID.
        max-results: The maximum number of results to include in the response.
        next-token: The token to use when requesting the next set of results. You received this token from a previous `ListPermissions` operation.
        user-id: (Optional) Limits the results to only the user that matches this ID.
        user-type: (Optional) If you specify `SSO_USER`, then only the permissions of IAM Identity Center users are returned. If you specify `SSO_GROUP`, only the permissions of IAM Identity Center groups are returned.
        workspace-id: The ID of the workspace to list permissions for. This parameter is required.
