name: list-streams
description: Lists all of the streams in your Amazon Web Services account.
flags:
    --ascending-order=: Set to true to return the list of streams in ascending order.
    --max-results=: The maximum number of results to return at a time.
    --next-token=: A token used to get the next set of results.
documentation:
    command: |-
        Lists all of the streams in your Amazon Web Services account.

        Requires permission to access the [ListStreams](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        ascending-order: Set to true to return the list of streams in ascending order.
        max-results: The maximum number of results to return at a time.
        next-token: A token used to get the next set of results.
