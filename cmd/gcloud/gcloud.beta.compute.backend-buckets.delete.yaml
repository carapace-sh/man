name: delete
description: '*(BETA)*  Delete backend buckets.'
flags:
    --global: If set, the backend buckets are global.
    --no-global&: If set, the backend buckets are global.
    --region=: Region of the backend buckets to delete.
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute backend-buckets delete* deletes one or more backend buckets.

        To delete a global backend bucket, run either of the following:

            $ gcloud beta compute backend-buckets delete my-backend-bucket
              --gcs-bucket-name gcs-bucket-1
              --global

            $ gcloud beta compute backend-buckets delete my-backend-bucket
              --gcs-bucket-name gcs-bucket-1

        To delete a regional backend bucket, run the following:

            $ gcloud beta compute backend-buckets delete my-backend-bucket
              --gcs-bucket-name gcs-bucket-1
              --region=us-central1
    flag:
        global: If set, the backend buckets are global.
        no-global: If set, the backend buckets are global.
        region: Region of the backend buckets to delete. Overrides the default *compute/region* property value for this command invocation.
