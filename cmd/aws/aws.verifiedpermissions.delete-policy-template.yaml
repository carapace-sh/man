name: delete-policy-template
description: Deletes the specified policy template from the policy store.
flags:
    --policy-store-id=!: Specifies the ID of the policy store that contains the policy template that you want to delete.
    --policy-template-id=!: Specifies the ID of the policy template that you want to delete.
documentation:
    command: |-
        Deletes the specified policy template from the policy store.

        This operation also deletes any policies that were created from the specified policy template. Those policies are immediately removed from all future API responses, and are asynchronously deleted from the policy store.
    flag:
        policy-store-id: Specifies the ID of the policy store that contains the policy template that you want to delete.
        policy-template-id: Specifies the ID of the policy template that you want to delete.
