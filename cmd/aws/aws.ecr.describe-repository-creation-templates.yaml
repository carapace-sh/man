name: describe-repository-creation-templates
description: Returns details about the repository creation templates in a registry.
flags:
    --max-results=: The maximum number of repository results returned by `DescribeRepositoryCreationTemplatesRequest` in paginated output.
    --next-token=: The `nextToken` value returned from a previous paginated `DescribeRepositoryCreationTemplates` request where `maxResults` was used and the results exceeded the value of that parameter.
    --prefixes=: The repository namespace prefixes associated with the repository creation templates to describe.
documentation:
    command: Returns details about the repository creation templates in a registry. The `prefixes` request parameter can be used to return the details for a specific repository creation template.
    flag:
        max-results: The maximum number of repository results returned by `DescribeRepositoryCreationTemplatesRequest` in paginated output. When this parameter is used, `DescribeRepositoryCreationTemplatesRequest` only returns `maxResults` results in a single page along with a `nextToken` response element. The remaining results of the initial request can be seen by sending another `DescribeRepositoryCreationTemplatesRequest` request with the returned `nextToken` value. This value can be between 1 and 1000. If this parameter is not used, then `DescribeRepositoryCreationTemplatesRequest` returns up to 100 results and a `nextToken` value, if applicable.
        next-token: |-
            The `nextToken` value returned from a previous paginated `DescribeRepositoryCreationTemplates` request where `maxResults` was used and the results exceeded the value of that parameter. Pagination continues from the end of the previous results that returned the `nextToken` value. This value is `null` when there are no more results to return.

            This token should be treated as an opaque identifier that is only used to retrieve the next items in a list and not for other programmatic purposes.
        prefixes: The repository namespace prefixes associated with the repository creation templates to describe. If this value is not specified, all repository creation templates are returned.
