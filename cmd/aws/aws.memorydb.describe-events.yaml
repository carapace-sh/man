name: describe-events
description: Returns events related to clusters, security groups, and parameter groups.
flags:
    --duration=: The number of minutes worth of events to retrieve.
    --end-time=: The end of the time interval for which to retrieve events, specified in ISO 8601 format.
    --max-results=: The maximum number of records to include in the response.
    --next-token=: An optional argument to pass in case the total number of records exceeds the value of MaxResults.
    --source-name=: The identifier of the event source for which events are returned.
    --source-type=: The event source to retrieve events for.
    --start-time=: The beginning of the time interval to retrieve events for, specified in ISO 8601 format.
completion:
    flag:
        source-type:
            - node
            - parameter-group
            - subnet-group
            - cluster
            - user
            - acl
documentation:
    command: Returns events related to clusters, security groups, and parameter groups. You can obtain events specific to a particular cluster, security group, or parameter group by providing the name as a parameter. By default, only the events occurring within the last hour are returned; however, you can retrieve up to 14 days' worth of events if necessary.
    flag:
        duration: The number of minutes worth of events to retrieve.
        end-time: 'The end of the time interval for which to retrieve events, specified in ISO 8601 format. Example: 2017-03-30T07:03:49.555Z'
        max-results: The maximum number of records to include in the response. If more records exist than the specified MaxResults value, a token is included in the response so that the remaining results can be retrieved.
        next-token: An optional argument to pass in case the total number of records exceeds the value of MaxResults. If nextToken is returned, there are more results available. The value of nextToken is a unique pagination token for each page. Make the call again using the returned token to retrieve the next page. Keep all other arguments unchanged.
        source-name: The identifier of the event source for which events are returned. If not specified, all sources are included in the response.
        source-type: The event source to retrieve events for. If no value is specified, all events are returned.
        start-time: 'The beginning of the time interval to retrieve events for, specified in ISO 8601 format. Example: 2017-03-30T07:03:49.555Z'
