name: create
description: '*(BETA)*  Create a deployment.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --automatic-rollback-on-error: If the create request results in a deployment with resource errors, delete that deployment immediately after creation.
    --composite-type=: Name of a composite type to deploy.
    --config=: Filename of a top-level yaml config that specifies resources to deploy.
    --create-policy=: Create policy for resources that have changed in the update.
    --description=: Optional description of the deployment to insert.
    --labels=: List of label KEY=VALUE pairs to add.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-automatic-rollback-on-error&: If the create request results in a deployment with resource errors, delete that deployment immediately after creation.
    --no-preview&: Preview the requested create without actually instantiating the underlying resources.
    --preview: Preview the requested create without actually instantiating the underlying resources.
    --properties=: A comma separated, key:value, map to be used when deploying a template file or composite type directly.
    --template=: Filename of a top-level jinja or python config template.
completion:
    flag:
        create-policy:
            - acquire
            - create
            - create-or-acquire
documentation:
    command: |-
        *(BETA)*  This command inserts (creates) a new deployment based on a provided config
        file.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        automatic-rollback-on-error: If the create request results in a deployment with resource errors, delete that deployment immediately after creation. (default=False)
        composite-type: 'Name of a composite type to deploy. For an example of creating and deploying a composite type, see: https://cloud.google.com/deployment-manager/docs/configuration/templates/create-composite-types#examplecompositetype'
        config: Filename of a top-level yaml config that specifies resources to deploy. For a guide to creating a configuration, refer to https://cloud.google.com/deployment-manager/docs/configuration/create-basic-configuration
        create-policy: 'Create policy for resources that have changed in the update. _CREATE_POLICY_ must be one of: *acquire*, *create*, *create-or-acquire*.'
        description: Optional description of the deployment to insert.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-automatic-rollback-on-error: If the create request results in a deployment with resource errors, delete that deployment immediately after creation. (default=False)
        no-preview: Preview the requested create without actually instantiating the underlying resources. (default=False)
        preview: Preview the requested create without actually instantiating the underlying resources. (default=False)
        properties: A comma separated, key:value, map to be used when deploying a template file or composite type directly.
        template: Filename of a top-level jinja or python config template.
