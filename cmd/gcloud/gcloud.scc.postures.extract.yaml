name: extract
description: Extract a Cloud Security Command Center (SCC) posture from a workload.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: ID of the location where the resource exists (for example, global).
    --no-async&: Return immediately, without waiting for the operation in progress to
    --organization=: ID of the organization which is the parent of the resource.
    --workload=!: Workload from where policies has to be extracted into a posture.
documentation:
    command: |
        Extract a Cloud Security Command Center (SCC) posture from a workload. First argument is the
        parent and name of the posture to be created. The workload from where the organization
        policies need to be extracted is provided via '--workload' flag.

        Extracted posture is returned as the response of the command. LRO operation ID is printed as the
        standard output.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            ID of the location where the resource exists (for example, global).
            +

            To set the `location` attribute:
            * provide the argument `posture` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        organization: |-
            ID of the organization which is the parent of the resource.
            +

            To set the `organization` attribute:
            * provide the argument `posture` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
        workload: |-
            Workload from where policies has to be extracted into a posture. It can be in one
            of the following formats: `projects/projectNumber`, `folders/folderNumber`, `organizations/organizationNumber`.
