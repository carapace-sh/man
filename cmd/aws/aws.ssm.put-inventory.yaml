name: put-inventory
description: Bulk update custom inventory items on one or more managed nodes.
flags:
    --instance-id=!: An managed node ID where you want to add or update inventory items.
    --items=!: The inventory items that you want to add or update on managed nodes.
documentation:
    command: Bulk update custom inventory items on one or more managed nodes. The request adds an inventory item, if it doesn't already exist, or updates an inventory item, if it does exist.
    flag:
        instance-id: An managed node ID where you want to add or update inventory items.
        items: The inventory items that you want to add or update on managed nodes.
