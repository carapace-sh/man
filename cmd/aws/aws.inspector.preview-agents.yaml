name: preview-agents
description: Previews the agents installed on the EC2 instances that are part of the specified assessment target.
flags:
    --max-results=: You can use this parameter to indicate the maximum number of items you want in the response.
    --next-token=: You can use this parameter when paginating results.
    --preview-agents-arn=!: The ARN of the assessment target whose agents you want to preview.
documentation:
    command: Previews the agents installed on the EC2 instances that are part of the specified assessment target.
    flag:
        max-results: You can use this parameter to indicate the maximum number of items you want in the response. The default value is 10. The maximum value is 500.
        next-token: You can use this parameter when paginating results. Set the value of this parameter to null on your first call to the **PreviewAgents** action. Subsequent calls to the action fill **nextToken** in the request with the value of **NextToken** from the previous response to continue listing data.
        preview-agents-arn: The ARN of the assessment target whose agents you want to preview.
