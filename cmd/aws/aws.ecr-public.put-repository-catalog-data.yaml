name: put-repository-catalog-data
description: Creates or updates the catalog data for a repository in a public registry.
flags:
    --catalog-data=!: An object containing the catalog data for a repository.
    --registry-id=: The Amazon Web Services account ID that's associated with the public registry the repository is in.
    --repository-name=!: The name of the repository to create or update the catalog data for.
documentation:
    command: Creates or updates the catalog data for a repository in a public registry.
    flag:
        catalog-data: An object containing the catalog data for a repository. This data is publicly visible in the Amazon ECR Public Gallery.
        registry-id: The Amazon Web Services account ID that's associated with the public registry the repository is in. If you do not specify a registry, the default public registry is assumed.
        repository-name: The name of the repository to create or update the catalog data for.
