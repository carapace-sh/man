name: detach-traffic-sources
description: Detaches one or more traffic sources from the specified Auto Scaling group.
flags:
    --auto-scaling-group-name=!: The name of the Auto Scaling group.
    --traffic-sources=!: The unique identifiers of one or more traffic sources.
documentation:
    command: |-
        Detaches one or more traffic sources from the specified Auto Scaling group.

        When you detach a traffic source, it enters the `Removing` state while deregistering the instances in the group. When all instances are deregistered, then you can no longer describe the traffic source using the [DescribeTrafficSources](https://docs.aws.amazon.com/autoscaling/ec2/APIReference/API_DescribeTrafficSources.html) API call. The instances continue to run.
    flag:
        auto-scaling-group-name: The name of the Auto Scaling group.
        traffic-sources: The unique identifiers of one or more traffic sources. You can specify up to 10 traffic sources.
