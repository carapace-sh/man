name: set-type-configuration
description: Specifies the configuration data for a CloudFormation extension, such as a resource or Hook, in the given account and Region.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration-alias=: An alias by which to refer to this extension configuration data.
    --configuration=!: The configuration data for the extension in this account and Region.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --type-arn=: The Amazon Resource Name (ARN) for the extension in this account and Region.
    --type-name=: The name of the extension.
    --type=: The type of extension.
completion:
    flag:
        type:
            - RESOURCE
            - MODULE
            - HOOK
documentation:
    command: |-
        Specifies the configuration data for a CloudFormation extension, such as a resource or Hook, in the given account and Region.

        For more information, see [Edit configuration data for extensions in your account](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/registry-set-configuration.html) in the *CloudFormation User Guide*.

        To view the current configuration data for an extension, refer to the `ConfigurationSchema` element of [DescribeType](https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_DescribeType.html).

        It's strongly recommended that you use dynamic references to restrict sensitive configuration definitions, such as third-party credentials. For more information, see [Specify values stored in other services using dynamic references](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/dynamic-references.html) in the *CloudFormation User Guide*.

        For more information about setting the configuration data for resource types, see [Defining the account-level configuration of an extension](https://docs.aws.amazon.com/cloudformation-cli/latest/userguide/resource-type-model.html#resource-type-howto-configuration) in the *CloudFormation Command Line Interface (CLI) User Guide*. For more information about setting the configuration data for Hooks, see the [CloudFormation Hooks User Guide](https://docs.aws.amazon.com/cloudformation-cli/latest/hooks-userguide/what-is-cloudformation-hooks.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration: |-
            The configuration data for the extension in this account and Region.

            The configuration data must be formatted as JSON and validate against the extension's schema returned in the `Schema` response element of [DescribeType](https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_DescribeType.html).
        configuration-alias: |-
            An alias by which to refer to this extension configuration data.

            Conditional: Specifying a configuration alias is required when setting a configuration for a resource type extension.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        type: |-
            The type of extension.

            Conditional: You must specify `ConfigurationArn`, or `Type` and `TypeName`.
        type-arn: |-
            The Amazon Resource Name (ARN) for the extension in this account and Region.

            For public extensions, this will be the ARN assigned when you call the [ActivateType](https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_ActivateType.html) API operation in this account and Region. For private extensions, this will be the ARN assigned when you call the [RegisterType](https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_RegisterType.html) API operation in this account and Region.

            Do not include the extension versions suffix at the end of the ARN. You can set the configuration for an extension, but not for a specific extension version.
        type-name: |-
            The name of the extension.

            Conditional: You must specify `ConfigurationArn`, or `Type` and `TypeName`.
