name: data-documentation
description: '*(ALPHA)*  Update a Dataplex data documentation scan job.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: Description of the data documentation scan.
    --display-name=: Display name of the data documentation scan.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location of the Dataplex resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-validate-only&: Validate the update action, but don't actually perform it.
    --on-demand=: If set, the scan runs one-time shortly after data documentation scan creation.
    --schedule=: Cron schedule (https://en.wikipedia.org/wiki/Cron) for running scans periodically.
    --validate-only: Validate the update action, but don't actually perform it.
documentation:
    command: '*(ALPHA)*  Update a Dataplex data documentation scan job.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: Description of the data documentation scan.
        display-name: Display name of the data documentation scan.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location of the Dataplex resource.
            +
            To set the `location` attribute:
            * provide the argument `datascan` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-validate-only: Validate the update action, but don't actually perform it.
        on-demand: If set, the scan runs one-time shortly after data documentation scan creation.
        schedule: 'Cron schedule (https://en.wikipedia.org/wiki/Cron) for running scans periodically. To explicitly set a timezone to the cron tab, apply a prefix in the cron tab: "CRON_TZ=${IANA_TIME_ZONE}" or "TZ=${IANA_TIME_ZONE}". The ${IANA_TIME_ZONE} may only be a valid string from IANA time zone database. For example, `CRON_TZ=America/New_York 1 * * * *` or `TZ=America/New_York 1 * * * *`. This field is required for RECURRING scans.'
        validate-only: Validate the update action, but don't actually perform it.
