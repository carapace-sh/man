name: list-dominant-language-detection-jobs
description: Gets a list of the dominant language detection jobs that you have submitted.
flags:
    --filter=: Filters that jobs that are returned.
    --max-results=: The maximum number of results to return in each page.
    --next-token=: Identifies the next page of results to return.
documentation:
    command: Gets a list of the dominant language detection jobs that you have submitted.
    flag:
        filter: Filters that jobs that are returned. You can filter jobs on their name, status, or the date and time that they were submitted. You can only set one filter at a time.
        max-results: The maximum number of results to return in each page. The default is 100.
        next-token: Identifies the next page of results to return.
