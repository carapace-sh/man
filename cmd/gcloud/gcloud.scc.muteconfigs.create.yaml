name: create
description: Create a Security Command Center mute config.
flags:
    --api-version=&: ""
    --description=: The text that will be used to describe a mute configuration.
    --expiry-time=: The expiry of the mute config.
    --filter=: The filter string which will applied to findings muted by a mute configuration.
    --folder=: Folder where the mute config resides.
    --location=: When data residency controls are enabled, this attribute specifies the location in which
    --organization=: Organization where the mute config resides.
    --type=: The mute configuration type.
completion:
    flag:
        api-version:
            - v1
            - v2enabled
        type:
            - static
            - dynamic
documentation:
    command: Create a Security Command Center mute config.
    flag:
        api-version: |-
            This is a temporary flag to be used for testing the Security Command
            Center v2 api before its launch.
        description: The text that will be used to describe a mute configuration.
        expiry-time: |-
            The expiry of the mute config. Only applicable for dynamic
                  configs. If the expiry is set, when the config expires, it is removed from
                  all findings. See `$ gcloud topic datetimes` for information on
                  supported time formats.
        filter: The filter string which will applied to findings muted by a mute configuration.
        folder: Folder where the mute config resides. Formatted as ``folders/456'' or just ``456''.
        location: |-
            When data residency controls are enabled, this attribute specifies the location in which
            the resource is located and applicable. The `location` attribute can be
            provided as part of the fully specified resource name or with the `--location`
            argument on the command line. The default location is `global`.
            +
            NOTE: If you override the endpoint to a [regional endpoint](https://cloud.google.com/security-command-center/docs/reference/rest/index.html?rep_location=global#regional-service-endpoint)
            you must specify the correct [data location](https://cloud.google.com/security-command-center/docs/data-residency-support#locations) using this flag.
            The default location on this command is unrelated to the default location
            that is specified when data residency controls are enabled
            for Security Command Center.
            +
            NOTE: If no location is specified, the default location is `global` AND
            the request will be routed to the SCC V1 API. To use the SCC V2 API - please explicitly specify the flag.
        organization: Organization where the mute config resides. Formatted as ``organizations/123'' or just ``123''.
        type: 'The mute configuration type. Immutable after creation. _TYPE_ must be one of: *static*, *dynamic*.'
