name: update-container-group-definition
description: |-
    **This API works with the following fleet types:** Container

    Updates properties in an existing container group definition.
flags:
    --game-server-container-definition=: An updated definition for the game server container in this group.
    --name=!: A descriptive identifier for the container group definition.
    --operating-system=: The platform that all containers in the group use.
    --source-version-number=: The container group definition version to update.
    --support-container-definitions=: One or more definitions for support containers in this group.
    --total-memory-limit-mebibytes=: The maximum amount of memory (in MiB) to allocate to the container group.
    --total-vcpu-limit=: The maximum amount of vCPU units to allocate to the container group (1 vCPU is equal to 1024 CPU units).
    --version-description=: A description for this update to the container group definition.
completion:
    flag:
        operating-system:
            - AMAZON_LINUX_2023
documentation:
    command: |-
        **This API works with the following fleet types:** Container

        Updates properties in an existing container group definition. This operation doesn't replace the definition. Instead, it creates a new version of the definition and saves it separately. You can access all versions that you choose to retain.

        The only property you can't update is the container group type.

        **Request options:**

        - Update based on the latest version of the container group definition. Specify the container group definition name only, or use an ARN value without a version number. Provide updated values for the properties that you want to change only. All other values remain the same as the latest version.
        - Update based on a specific version of the container group definition. Specify the container group definition name and a source version number, or use an ARN value with a version number. Provide updated values for the properties that you want to change only. All other values remain the same as the source version.
        - Change a game server container definition. Provide the updated container definition.
        - Add or change a support container definition. Provide a complete set of container definitions, including the updated definition.
        - Remove a support container definition. Provide a complete set of container definitions, excluding the definition to remove. If the container group has only one support container definition, provide an empty set.

        **Results:**

        If successful, this operation returns the complete properties of the new container group definition version.

        If the container group definition version is used in an active fleets, the update automatically initiates a new fleet deployment of the new version. You can track a fleet's deployments using [ListFleetDeployments](https://docs.aws.amazon.com/gamelift/latest/apireference/API_ListFleetDeployments.html).
    flag:
        game-server-container-definition: An updated definition for the game server container in this group. Define a game server container only when the container group type is `GAME_SERVER`. You can pass in your container definitions as a JSON file.
        name: A descriptive identifier for the container group definition. The name value must be unique in an Amazon Web Services Region.
        operating-system: |-
            The platform that all containers in the group use. Containers in a group must run on the same operating system.

            Amazon Linux 2 (AL2) will reach end of support on 6/30/2025. See more details in the [Amazon Linux 2 FAQs](http://aws.amazon.com/amazon-linux-2/faqs/). For game servers that are hosted on AL2 and use server SDK version 4.x for Amazon GameLift Servers, first update the game server build to server SDK 5.x, and then deploy to AL2023 instances. See [Migrate to server SDK version 5.](https://docs.aws.amazon.com/gamelift/latest/developerguide/reference-serversdk5-migration.html)
        source-version-number: The container group definition version to update. The new version starts with values from the source version, and then updates values included in this request.
        support-container-definitions: One or more definitions for support containers in this group. You can define a support container in any type of container group. You can pass in your container definitions as a JSON file.
        total-memory-limit-mebibytes: The maximum amount of memory (in MiB) to allocate to the container group. All containers in the group share this memory. If you specify memory limits for an individual container, the total value must be greater than any individual container's memory limit.
        total-vcpu-limit: The maximum amount of vCPU units to allocate to the container group (1 vCPU is equal to 1024 CPU units). All containers in the group share this memory. If you specify vCPU limits for individual containers, the total value must be equal to or greater than the sum of the CPU limits for all containers in the group.
        version-description: A description for this update to the container group definition.
