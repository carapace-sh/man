name: describe
description: '*(ALPHA)*  Describe a notification channel.'
documentation:
    command: |
        *(ALPHA)*  Describe a notification channel.

        This retrieves the details about a channel by its programmatic name.

        ## EXAMPLES
        The following command prints out the JSON format of the configuration for the
        `NotificationChannel` with the name `projects/12345/notificationChannels/67890`:

          $ gcloud alpha monitoring channels describe "projects/12345/notificationChannels/67890" --format=json
