name: get-position
description: Get the position information for a given resource.
flags:
    --resource-identifier=!: Resource identifier used to retrieve the position information.
    --resource-type=!: Resource type of the resource for which position information is retrieved.
completion:
    flag:
        resource-type:
            - WirelessDevice
            - WirelessGateway
documentation:
    command: |-
        Get the position information for a given resource.

        This action is no longer supported. Calls to retrieve the position information should use the [GetResourcePosition](https://docs.aws.amazon.com/iot-wireless/latest/apireference/API_GetResourcePosition.html) API operation instead.
    flag:
        resource-identifier: Resource identifier used to retrieve the position information.
        resource-type: Resource type of the resource for which position information is retrieved.
