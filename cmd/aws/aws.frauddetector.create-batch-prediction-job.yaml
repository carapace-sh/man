name: create-batch-prediction-job
description: Creates a batch prediction job.
flags:
    --detector-name=!: The name of the detector.
    --detector-version=: The detector version.
    --event-type-name=!: The name of the event type.
    --iam-role-arn=!: The ARN of the IAM role to use for this job request.
    --input-path=!: The Amazon S3 location of your training file.
    --job-id=!: The ID of the batch prediction job.
    --output-path=!: The Amazon S3 location of your output file.
    --tags=: A collection of key and value pairs.
documentation:
    command: Creates a batch prediction job.
    flag:
        detector-name: The name of the detector.
        detector-version: The detector version.
        event-type-name: The name of the event type.
        iam-role-arn: |-
            The ARN of the IAM role to use for this job request.

            The IAM Role must have read permissions to your input S3 bucket and write permissions to your output S3 bucket. For more information about bucket permissions, see [User policy examples](https://docs.aws.amazon.com/AmazonS3/latest/userguide/example-policies-s3.html) in the *Amazon S3 User Guide*.
        input-path: The Amazon S3 location of your training file.
        job-id: The ID of the batch prediction job.
        output-path: The Amazon S3 location of your output file.
        tags: A collection of key and value pairs.
