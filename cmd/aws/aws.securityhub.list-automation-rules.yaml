name: list-automation-rules
description: A list of automation rules and their metadata for the calling account.
flags:
    --max-results=: The maximum number of rules to return in the response.
    --next-token=: A token to specify where to start paginating the response.
documentation:
    command: A list of automation rules and their metadata for the calling account.
    flag:
        max-results: The maximum number of rules to return in the response. This currently ranges from 1 to 100.
        next-token: A token to specify where to start paginating the response. This is the `NextToken` from a previously truncated response. On your first call to the `ListAutomationRules` API, set the value of this parameter to `NULL`.
