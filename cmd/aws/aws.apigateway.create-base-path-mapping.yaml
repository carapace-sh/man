name: create-base-path-mapping
description: Creates a new BasePathMapping resource.
flags:
    --base-path=: The base path name that callers of the API must provide as part of the URL after the domain name.
    --domain-name-id=: The identifier for the domain name resource.
    --domain-name=!: The domain name of the BasePathMapping resource to create.
    --rest-api-id=!: The string identifier of the associated RestApi.
    --stage=: The name of the API's stage that you want to use for this mapping.
documentation:
    command: Creates a new BasePathMapping resource.
    flag:
        base-path: The base path name that callers of the API must provide as part of the URL after the domain name. This value must be unique for all of the mappings across a single API. Specify '(none)' if you do not want callers to specify a base path name after the domain name.
        domain-name: The domain name of the BasePathMapping resource to create.
        domain-name-id: The identifier for the domain name resource. Required for private custom domain names.
        rest-api-id: The string identifier of the associated RestApi.
        stage: The name of the API's stage that you want to use for this mapping. Specify '(none)' if you want callers to explicitly specify the stage name after any base path name.
