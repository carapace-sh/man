name: create-analysis
description: Creates an analysis in Amazon Quick Sight.
flags:
    --analysis-id=!: The ID for the analysis that you're creating.
    --aws-account-id=!: The ID of the Amazon Web Services account where you are creating an analysis.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --definition=: The definition of an analysis.
    --folder-arns=: When you create the analysis, Amazon Quick Sight adds the analysis to these folders.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: A descriptive name for the analysis that you're creating.
    --parameters=: The parameter names and override values that you want to use.
    --permissions=: A structure that describes the principals and the resource-level permissions on an analysis.
    --source-entity=: A source entity to use for the analysis that you're creating.
    --tags=: Contains a map of the key-value pairs for the resource tag or tags assigned to the analysis.
    --theme-arn=: The ARN for the theme to apply to the analysis that you're creating.
    --validation-strategy=: The option to relax the validation needed to create an analysis with definition objects.
documentation:
    command: Creates an analysis in Amazon Quick Sight. Analyses can be created either from a template or from an `AnalysisDefinition`.
    flag:
        analysis-id: The ID for the analysis that you're creating. This ID displays in the URL of the analysis.
        aws-account-id: The ID of the Amazon Web Services account where you are creating an analysis.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        definition: |-
            The definition of an analysis.

            A definition is the data model of all features in a Dashboard, Template, or Analysis.

            Either a `SourceEntity` or a `Definition` must be provided in order for the request to be valid.
        folder-arns: When you create the analysis, Amazon Quick Sight adds the analysis to these folders.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: A descriptive name for the analysis that you're creating. This name displays for the analysis in the Amazon Quick Sight console.
        parameters: The parameter names and override values that you want to use. An analysis can have any parameter type, and some parameters might accept multiple values.
        permissions: |-
            A structure that describes the principals and the resource-level permissions on an analysis. You can use the `Permissions` structure to grant permissions by providing a list of Identity and Access Management (IAM) action information for each principal listed by Amazon Resource Name (ARN).

            To specify no permissions, omit `Permissions`.
        source-entity: |-
            A source entity to use for the analysis that you're creating. This metadata structure contains details that describe a source template and one or more datasets.

            Either a `SourceEntity` or a `Definition` must be provided in order for the request to be valid.
        tags: Contains a map of the key-value pairs for the resource tag or tags assigned to the analysis.
        theme-arn: The ARN for the theme to apply to the analysis that you're creating. To see the theme in the Amazon Quick Sight console, make sure that you have access to it.
        validation-strategy: The option to relax the validation needed to create an analysis with definition objects. This skips the validation step for specific errors.
