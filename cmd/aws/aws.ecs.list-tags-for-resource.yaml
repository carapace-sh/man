name: list-tags-for-resource
description: List the tags for an Amazon ECS resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) that identifies the resource to list the tags for.
documentation:
    command: List the tags for an Amazon ECS resource.
    flag:
        resource-arn: The Amazon Resource Name (ARN) that identifies the resource to list the tags for. Currently, the supported resources are Amazon ECS tasks, services, task definitions, clusters, and container instances.
