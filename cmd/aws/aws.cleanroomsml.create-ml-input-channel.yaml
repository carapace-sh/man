name: create-ml-input-channel
description: Provides the information to create an ML input channel.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configured-model-algorithm-associations=!:
        description: The associated configured model algorithms that are necessary to create this ML input channel.
        nargs: -1
    --description=: The description of the ML input channel.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --input-channel=!: The input data that is used to create this ML input channel.
    --kms-key-arn=: The Amazon Resource Name (ARN) of the KMS key that is used to access the input channel.
    --membership-identifier=!: The membership ID of the member that is creating the ML input channel.
    --name=!: The name of the ML input channel.
    --retention-in-days=!: The number of days that the data in the ML input channel is retained.
    --tags=: The optional metadata that you apply to the resource to help you categorize and organize them.
documentation:
    command: Provides the information to create an ML input channel. An ML input channel is the result of a query that can be used for ML modeling.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configured-model-algorithm-associations: The associated configured model algorithms that are necessary to create this ML input channel.
        description: The description of the ML input channel.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        input-channel: The input data that is used to create this ML input channel.
        kms-key-arn: The Amazon Resource Name (ARN) of the KMS key that is used to access the input channel.
        membership-identifier: The membership ID of the member that is creating the ML input channel.
        name: The name of the ML input channel.
        retention-in-days: The number of days that the data in the ML input channel is retained.
        tags: |-
            The optional metadata that you apply to the resource to help you categorize and organize them. Each tag consists of a key and an optional value, both of which you define.

            The following basic restrictions apply to tags:

            - Maximum number of tags per resource - 50.
            - For each resource, each tag key must be unique, and each tag key can have only one value.
            - Maximum key length - 128 Unicode characters in UTF-8.
            - Maximum value length - 256 Unicode characters in UTF-8.
            - If your tagging schema is used across multiple services and resources, remember that other services may have restrictions on allowed characters. Generally allowed characters are: letters, numbers, and spaces representable in UTF-8, and the following characters: + - = . _ : / @.
            - Tag keys and values are case sensitive.
            - Do not use aws:, AWS:, or any upper or lowercase combination of such as a prefix for keys as it is reserved for AWS use. You cannot edit or delete tag keys with this prefix. Values can have this prefix. If a tag value has aws as its prefix but the key does not, then Clean Rooms ML considers it to be a user tag and will count against the limit of 50 tags. Tags with only the key prefix of aws do not count against your tags per resource limit.
