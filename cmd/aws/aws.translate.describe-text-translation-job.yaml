name: describe-text-translation-job
description: Gets the properties associated with an asynchronous batch translation job including name, ID, status, source and target languages, input/output S3 buckets, and so on.
flags:
    --job-id=!: The identifier that Amazon Translate generated for the job.
documentation:
    command: Gets the properties associated with an asynchronous batch translation job including name, ID, status, source and target languages, input/output S3 buckets, and so on.
    flag:
        job-id: The identifier that Amazon Translate generated for the job. The [StartTextTranslationJob]() operation returns this identifier in its response.
