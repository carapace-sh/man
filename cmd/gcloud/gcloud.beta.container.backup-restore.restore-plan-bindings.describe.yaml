name: describe
description: '*(BETA)*  Describe a restore plan binding.'
flags:
    --location=: Google Cloud location.
    --restore-channel=: Restore Channel name.
documentation:
    command: |
        *(BETA)*  Describe a Backup for GKE restore plan binding.

        ## EXAMPLES

        To describe a restore plan binding ``my-restore-plan-binding'' in project ``my-project'' in location ``us-central1'' under restore channel ``my-restore-channel'', run:

          $ gcloud beta container backup-restore restore-plan-bindings describe my-restore-plan-binding --restore-channel=my-restore-channel --project=my-project --location=us-central1
    flag:
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `restore_plan_binding` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkebackup/location`.
        restore-channel: |-
            Restore Channel name.
            +
            To set the `restore-channel` attribute:
            * provide the argument `restore_plan_binding` on the command line with a fully specified name;
            * provide the argument `--restore-channel` on the command line.
