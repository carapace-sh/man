name: describe
description: '*(BETA)*  Show metadata for a project.'
documentation:
    command: |-
        *(BETA)*  Shows metadata for a project given a valid project ID.

        This command can fail for the following reasons:
        * The project specified does not exist.
        * The active account does not have permission to access the given project.

        ## EXAMPLES

        The following command prints metadata for a project with the ID
        `example-foo-bar-1`:

          $ gcloud beta projects describe example-foo-bar-1
