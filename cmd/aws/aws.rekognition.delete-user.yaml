name: delete-user
description: Deletes the specified UserID within the collection.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=: Idempotent token used to identify the request to `DeleteUser`.
    --collection-id=!: The ID of an existing collection from which the UserID needs to be deleted.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --user-id=!: ID for the UserID to be deleted.
documentation:
    command: Deletes the specified UserID within the collection. Faces that are associated with the UserID are disassociated from the UserID before deleting the specified UserID. If the specified `Collection` or `UserID` is already deleted or not found, a `ResourceNotFoundException` will be thrown. If the action is successful with a 200 response, an empty HTTP body is returned.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: Idempotent token used to identify the request to `DeleteUser`. If you use the same token with multiple `DeleteUser`requests, the same response is returned. Use ClientRequestToken to prevent the same request from being processed more than once.
        collection-id: The ID of an existing collection from which the UserID needs to be deleted.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        user-id: ID for the UserID to be deleted.
