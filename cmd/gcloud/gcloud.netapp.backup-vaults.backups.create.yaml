name: create
description: Create a Cloud NetApp Backup.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --backup-vault=: ID of the backup_vault or fully qualified identifier for the backup_vault.
    --description=: A description of the Cloud NetApp Backup Vault
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location of the backup.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --source-snapshot=!: ID of the snapshot or fully qualified identifier for the snapshot.
    --source-volume=: ID of the volume or fully qualified identifier for the volume.
documentation:
    command: |
        Create a Cloud NetApp Backup.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        backup-vault: |-
            ID of the backup_vault or fully qualified identifier for the backup_vault.
            +
            To set the `backup_vault` attribute:
            * provide the argument `--backup-vault` on the command line.
        description: A description of the Cloud NetApp Backup Vault
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location of the backup.
            +
            To set the `location` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        source-snapshot: |-
            ID of the snapshot or fully qualified identifier for the snapshot.
            +
            To set the `snapshot` attribute:
            * provide the argument `--source-snapshot` on the command line.
        source-volume: |-
            ID of the volume or fully qualified identifier for the volume.
            +
            To set the `volume` attribute:
            * provide the argument `--source-volume` on the command line;
            * provide the argument `--volume` on the command line.
