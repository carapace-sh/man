name: get-experiment
description: Returns the details about one experiment.
flags:
    --experiment=!: The name of the experiment that you want to see the details of.
    --project=!: The name or ARN of the project that contains the experiment.
documentation:
    command: Returns the details about one experiment. You must already know the experiment name. To retrieve a list of experiments in your account, use [ListExperiments](https://docs.aws.amazon.com/cloudwatchevidently/latest/APIReference/API_ListExperiments.html).
    flag:
        experiment: The name of the experiment that you want to see the details of.
        project: The name or ARN of the project that contains the experiment.
