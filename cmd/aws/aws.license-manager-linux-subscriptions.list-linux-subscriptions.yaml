name: list-linux-subscriptions
description: Lists the Linux subscriptions that have been discovered.
flags:
    --filters=: An array of structures that you can use to filter the results to those that match one or more sets of key-value pairs that you specify.
    --max-results=: The maximum items to return in a request.
    --next-token=: A token to specify where to start paginating.
documentation:
    command: Lists the Linux subscriptions that have been discovered. If you have linked your organization, the returned results will include data aggregated across your accounts in Organizations.
    flag:
        filters: |-
            An array of structures that you can use to filter the results to those that match one or more sets of key-value pairs that you specify. For example, you can filter by the name of `Subscription` with an optional operator to see subscriptions that match, partially match, or don't match a certain subscription's name.

            The valid names for this filter are:

            - `Subscription`

            The valid Operators for this filter are:

            - `contains`
            - `equals`
            - `Notequal`
        max-results: The maximum items to return in a request.
        next-token: A token to specify where to start paginating. This is the nextToken from a previously truncated response.
