name: get-csr
description: Get the CSR for a subordinate certificate authority that has not yet been activated.
flags:
    --location=: The location of the CERTIFICATE_AUTHORITY.
    --pool=: The parent CA Pool of the CERTIFICATE_AUTHORITY.
documentation:
    command: |-
        Gets the PEM-encoded CSR for a subordinate certificate authority that is
        awaiting user activation. The CSR should be signed by the issuing Certificate
        Authority and uploaded back using the `subordinates activate` command.

        ## EXAMPLES

          To download the CSR for the 'server-tls-1' CA into a file called
          'server-tls-1.csr':

            $ gcloud privateca subordinates get-csr server-tls-1 --location=us-west1 --pool=my-pool > server-tls-1.csr
    flag:
        location: |-
            The location of the CERTIFICATE_AUTHORITY.
            +
            To set the `location` attribute:
            * provide the argument `CERTIFICATE_AUTHORITY` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `privateca/location`.
        pool: |-
            The parent CA Pool of the CERTIFICATE_AUTHORITY.
            +
            To set the `pool` attribute:
            * provide the argument `CERTIFICATE_AUTHORITY` on the command line with a fully specified name;
            * provide the argument `--pool` on the command line.
