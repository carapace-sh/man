name: delete
description: '*(ALPHA)*  Delete one or more Cloud Composer environments.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Region where Composer environment runs or in which to create the environment.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |-
        *(ALPHA)*  Environments cannot be deleted unless they are in one of the RUNNING or
        ERROR states. If run asynchronously with `--async`, exits after printing
        one or more operation names that can be used to poll the status of the
        deletion(s) via:

          {top_command} composer operations describe

        If any of the environments are already in the process of being deleted,
        the original deletion operations are waited on (default) or printed
        (`--async`).
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            Region where Composer environment runs or in which to create the environment.
            +
            To set the `location` attribute:
            * provide the argument `environments` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `composer/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
