name: update-default-mail-domain
description: Updates the default mail domain for an organization.
flags:
    --domain-name=!: The domain name that will become the default domain.
    --organization-id=!: The WorkMail organization for which to list domains.
documentation:
    command: Updates the default mail domain for an organization. The default mail domain is used by the WorkMail AWS Console to suggest an email address when enabling a mail user. You can only have one default domain.
    flag:
        domain-name: The domain name that will become the default domain.
        organization-id: The WorkMail organization for which to list domains.
