name: add-members
description: '*(ALPHA)*  Add member interconnect attachments to a Compute Engine interconnect attachment group.'
flags:
    --attachments=!: Member interconnect attachments to add to or remove from the interconnect
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute interconnects attachments groups add-members* is used to add member interconnect attachments to an
        interconnect attachment group.

        For an example, refer to the *EXAMPLES* section below.
    flag:
        attachments: |-
            Member interconnect attachments to add to or remove from the interconnect
            attachment group.
