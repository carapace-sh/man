name: uninstall
description: Remove shell integration from config files
flags:
    --dry-run: Show what would be changed
    -h, --help: Print help (see more with '--help')
    -y, --yes: Skip confirmation prompt
completion:
    flag:
        C:
            - $files
        config:
            - $files
    positional:
        - - bash
          - fish
          - nu
          - zsh
          - powershell
documentation:
    flag:
        help: Print help (see a summary with '-h')
