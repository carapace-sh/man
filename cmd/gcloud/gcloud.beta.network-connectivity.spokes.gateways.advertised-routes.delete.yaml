name: delete
description: '*(BETA)*  Delete a gateway advertised route.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: The location Id.
    --spoke=: Id of the spoke.
documentation:
    command: '*(BETA)*  Delete the specified advertised route for a gateway spoke.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            The location Id.
            +

            To set the `region` attribute:
            * provide the argument `gateway_advertised_route` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
        spoke: |-
            Id of the spoke.
            +
            To set the `spoke` attribute:
            * provide the argument `gateway_advertised_route` on the command line with a fully specified name;
            * provide the argument `--spoke` on the command line.
