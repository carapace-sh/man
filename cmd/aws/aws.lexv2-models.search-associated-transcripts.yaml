name: search-associated-transcripts
description: Search for associated transcripts that meet the specified criteria.
flags:
    --bot-id=!: The unique identifier of the bot associated with the transcripts that you are searching.
    --bot-recommendation-id=!: The unique identifier of the bot recommendation associated with the transcripts to search.
    --bot-version=!: The version of the bot containing the transcripts that you are searching.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --filters=!: A list of filter objects.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --locale-id=!: The identifier of the language and locale of the transcripts to search.
    --max-results=: The maximum number of bot recommendations to return in each page of results.
    --next-index=: If the response from the SearchAssociatedTranscriptsRequest operation contains more results than specified in the maxResults parameter, an index is returned in the response.
    --search-order=: How SearchResults are ordered.
completion:
    flag:
        search-order:
            - Ascending
            - Descending
documentation:
    command: Search for associated transcripts that meet the specified criteria.
    flag:
        bot-id: The unique identifier of the bot associated with the transcripts that you are searching.
        bot-recommendation-id: The unique identifier of the bot recommendation associated with the transcripts to search.
        bot-version: The version of the bot containing the transcripts that you are searching.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        filters: A list of filter objects.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        locale-id: The identifier of the language and locale of the transcripts to search. The string must match one of the supported locales. For more information, see [Supported languages](https://docs.aws.amazon.com/lexv2/latest/dg/how-languages.html)
        max-results: The maximum number of bot recommendations to return in each page of results. If there are fewer results than the max page size, only the actual number of results are returned.
        next-index: If the response from the SearchAssociatedTranscriptsRequest operation contains more results than specified in the maxResults parameter, an index is returned in the response. Use that index in the nextIndex parameter to return the next page of results.
        search-order: How SearchResults are ordered. Valid values are Ascending or Descending. The default is Descending.
