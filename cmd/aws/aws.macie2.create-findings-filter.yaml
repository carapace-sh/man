name: create-findings-filter
description: Creates and defines the criteria and other settings for a findings filter.
flags:
    --action=!: The action to perform on findings that match the filter criteria (findingCriteria).
    --client-token=: A unique, case-sensitive token that you provide to ensure the idempotency of the request.
    --description=: A custom description of the filter.
    --finding-criteria=!: The criteria to use to filter findings.
    --name=!: A custom name for the filter.
    --position=: The position of the filter in the list of saved filters on the Amazon Macie console.
    --tags=: A map of key-value pairs that specifies the tags to associate with the filter.
completion:
    flag:
        action:
            - ARCHIVE
            - NOOP
documentation:
    command: Creates and defines the criteria and other settings for a findings filter.
    flag:
        action: 'The action to perform on findings that match the filter criteria (findingCriteria). Valid values are: ARCHIVE, suppress (automatically archive) the findings; and, NOOP, don''t perform any action on the findings.'
        client-token: A unique, case-sensitive token that you provide to ensure the idempotency of the request.
        description: |-
            A custom description of the filter. The description can contain as many as 512 characters.

            We strongly recommend that you avoid including any sensitive data in the description of a filter. Other users of your account might be able to see this description, depending on the actions that they're allowed to perform in Amazon Macie.
        finding-criteria: The criteria to use to filter findings.
        name: |-
            A custom name for the filter. The name must contain at least 3 characters and can contain as many as 64 characters.

            We strongly recommend that you avoid including any sensitive data in the name of a filter. Other users of your account might be able to see this name, depending on the actions that they're allowed to perform in Amazon Macie.
        position: The position of the filter in the list of saved filters on the Amazon Macie console. This value also determines the order in which the filter is applied to findings, relative to other filters that are also applied to the findings.
        tags: |-
            A map of key-value pairs that specifies the tags to associate with the filter.

            A findings filter can have a maximum of 50 tags. Each tag consists of a tag key and an associated tag value. The maximum length of a tag key is 128 characters. The maximum length of a tag value is 256 characters.
