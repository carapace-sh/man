name: untag-resource
description: Removes tags from a bot, bot alias or bot channel.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource to remove the tags from.
    --tag-keys=!: A list of tag keys to remove from the resource.
documentation:
    command: Removes tags from a bot, bot alias or bot channel.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource to remove the tags from.
        tag-keys: A list of tag keys to remove from the resource. If a tag key does not exist on the resource, it is ignored.
