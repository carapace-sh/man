    --source-app-engine-version=: App Engine version URI as the source endpoint.
    --source-cloud-function=: A Cloud function URI as the source endpoint.
    --source-cloud-run-revision=: Cloud Run revision URI as the source endpoint.
    --source-cloud-sql-instance=: A Cloud SQL instance URI as the source endpoint.
    --source-gke-master-cluster=: A cluster URI for Google Kubernetes Engine master as the source endpoint.
    --source-instance=: A Compute Engine instance URI as the source endpoint.
