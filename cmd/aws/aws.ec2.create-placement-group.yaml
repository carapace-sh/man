name: create-placement-group
description: Creates a placement group in which to launch instances.
flags:
    --dry-run: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response.
    --group-name=: A name for the placement group.
    --no-dry-run: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response.
    --partition-count=: The number of partitions.
    --spread-level=: Determines how placement groups spread instances.
    --strategy=: The placement strategy.
    --tag-specifications=: The tags to apply to the new placement group.
completion:
    flag:
        spread-level:
            - host
            - rack
        strategy:
            - cluster
            - spread
            - partition
documentation:
    command: |-
        Creates a placement group in which to launch instances. The strategy of the placement group determines how the instances are organized within the group.

        A `cluster` placement group is a logical grouping of instances within a single Availability Zone that benefit from low network latency, high network throughput. A `spread` placement group places instances on distinct hardware. A `partition` placement group places groups of instances in different partitions, where instances in one partition do not share the same hardware with instances in another partition.

        For more information, see [Placement groups](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/placement-groups.html) in the *Amazon EC2 User Guide*.
    flag:
        dry-run: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        group-name: |-
            A name for the placement group. Must be unique within the scope of your account for the Region.

            Constraints: Up to 255 ASCII characters
        partition-count: The number of partitions. Valid only when **Strategy** is set to `partition`.
        spread-level: |-
            Determines how placement groups spread instances.

            - Host – You can use `host` only with Outpost placement groups.
            - Rack – No usage restrictions.
        strategy: The placement strategy.
        tag-specifications: The tags to apply to the new placement group.
