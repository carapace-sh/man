name: spark-sql
description: Create a Dataproc GDC Spark SQL application.
hidden: true
flags:
    --annotations=: List of annotation KEY=VALUE pairs to add to the service instance.
    --application-environment=!: ID of the application_environment or fully qualified identifier for the application_environment.
    --application=!: ID of the spark_application or fully qualified identifier for the spark_application.
    --async: Return immediately, without waiting for the operation in progress to
    --dependency-images=: Comma separated list of images containing dependencies for the Spark Application.
    --display-name=: Human-readable name for this service instance to be used in user interfaces.
    --file=: The HCFS URI of the script that contains SQL queries
    --jars=: Comma separated list of jar files to be provided to the executor and driver classpaths.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: Location of the Dataproc GDC resource.
    --namespace=: namespace to run the application in
    --no-async&: Return immediately, without waiting for the operation in progress to
    --params=: 'Mapping of query variable names to values (equivalent to the Spark SQL command: SET `name="value";`)'
    --properties=: List of key value pairs to configure Spark.
    --query-file=: The HCFS URI of the script that contains SQL queries.
    --request-id=: An optional request ID to identify requests.
    --service-instance=!: ID of the service_instance or fully qualified identifier for the service_instance.
documentation:
    command: |-
        A Spark SQL application that run locally on the Dataproc
        GDC cluster.
    flag:
        annotations: List of annotation KEY=VALUE pairs to add to the service instance.
        application: |-
            ID of the spark_application or fully qualified identifier for the spark_application.
            +
            To set the `spark_application` attribute:
            * provide the argument `--application` on the command line.
        application-environment: |-
            ID of the application_environment or fully qualified identifier for the application_environment.
            +
            To set the `application_environment` attribute:
            * provide the argument `--application-environment` on the command line.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        dependency-images: Comma separated list of images containing dependencies for the Spark Application.
        display-name: Human-readable name for this service instance to be used in user interfaces.
        file: The HCFS URI of the script that contains SQL queries
        jars: Comma separated list of jar files to be provided to the executor and driver classpaths.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            Location of the Dataproc GDC resource.
            +

            To set the `location` attribute:
            * provide the argument `--service-instance` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        namespace: namespace to run the application in
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        params: 'Mapping of query variable names to values (equivalent to the Spark SQL command: SET `name="value";`)'
        properties: 'List of key value pairs to configure Spark. For a list of available properties, see: https://spark.apache.org/docs/latest/configuration.html#available-properties.'
        query-file: The HCFS URI of the script that contains SQL queries.
        request-id: |-
            An optional request ID to identify requests. If the service receives two identical
                    instance create requests with the same request_id, the second request is
                    ignored and the operation that corresponds to the first request is returned for both.
            +
                    The request ID must be a valid UUID with the exception that zero UUID is
                    not supported (00000000-0000-0000-0000-000000000000).
        service-instance: |-
            ID of the service_instance or fully qualified identifier for the service_instance.
            +
            To set the `service-instance` attribute:
            * provide the argument `--service-instance` on the command line.
