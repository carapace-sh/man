name: create-connection
description: Creates a connection definition in the Data Catalog.
flags:
    --catalog-id=: The ID of the Data Catalog in which to create the connection.
    --connection-input=!: A `ConnectionInput` object defining the connection to create.
    --tags=: The tags you assign to the connection.
documentation:
    command: |-
        Creates a connection definition in the Data Catalog.

        Connections used for creating federated resources require the IAM `glue:PassConnection` permission.
    flag:
        catalog-id: The ID of the Data Catalog in which to create the connection. If none is provided, the Amazon Web Services account ID is used by default.
        connection-input: A `ConnectionInput` object defining the connection to create.
        tags: The tags you assign to the connection.
