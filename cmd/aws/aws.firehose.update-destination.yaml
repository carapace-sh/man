name: update-destination
description: Updates the specified destination of the specified Firehose stream.
flags:
    --amazon-open-search-serverless-destination-update=: Describes an update for a destination in the Serverless offering for Amazon OpenSearch Service.
    --amazonopensearchservice-destination-update=: Describes an update for a destination in Amazon OpenSearch Service.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --current-delivery-stream-version-id=!: Obtain this value from the `VersionId` result of [DeliveryStreamDescription]().
    --delivery-stream-name=!: The name of the Firehose stream.
    --destination-id=!: The ID of the destination.
    --elasticsearch-destination-update=: Describes an update for a destination in Amazon OpenSearch Service.
    --extended-s3-destination-update=: Describes an update for a destination in Amazon S3.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --http-endpoint-destination-update=: Describes an update to the specified HTTP endpoint destination.
    --iceberg-destination-update=: Describes an update for a destination in Apache Iceberg Tables.
    --redshift-destination-update=: Describes an update for a destination in Amazon Redshift.
    --s3-destination-update=: \[Deprecated] Describes an update for a destination in Amazon S3.
    --snowflake-destination-update=: Update to the Snowflake destination configuration settings.
    --splunk-destination-update=: Describes an update for a destination in Splunk.
documentation:
    command: |-
        Updates the specified destination of the specified Firehose stream.

        Use this operation to change the destination type (for example, to replace the Amazon S3 destination with Amazon Redshift) or change the parameters associated with a destination (for example, to change the bucket name of the Amazon S3 destination). The update might not occur immediately. The target Firehose stream remains active while the configurations are updated, so data writes to the Firehose stream can continue during this process. The updated configurations are usually effective within a few minutes.

        Switching between Amazon OpenSearch Service and other services is not supported. For an Amazon OpenSearch Service destination, you can only update to another Amazon OpenSearch Service destination.

        If the destination type is the same, Firehose merges the configuration parameters specified with the destination configuration that already exists on the delivery stream. If any of the parameters are not specified in the call, the existing values are retained. For example, in the Amazon S3 destination, if [EncryptionConfiguration]() is not specified, then the existing `EncryptionConfiguration` is maintained on the destination.

        If the destination type is not the same, for example, changing the destination from Amazon S3 to Amazon Redshift, Firehose does not merge any parameters. In this case, all parameters must be specified.

        Firehose uses `CurrentDeliveryStreamVersionId` to avoid race conditions and conflicting merges. This is a required field, and the service updates the configuration only if the existing configuration has a version ID that matches. After the update is applied successfully, the version ID is updated, and can be retrieved using [DescribeDeliveryStream](). Use the new version ID to set `CurrentDeliveryStreamVersionId` in the next call.
    flag:
        amazon-open-search-serverless-destination-update: Describes an update for a destination in the Serverless offering for Amazon OpenSearch Service.
        amazonopensearchservice-destination-update: Describes an update for a destination in Amazon OpenSearch Service.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        current-delivery-stream-version-id: Obtain this value from the `VersionId` result of [DeliveryStreamDescription](). This value is required, and helps the service perform conditional operations. For example, if there is an interleaving update and this value is null, then the update destination fails. After the update is successful, the `VersionId` value is updated. The service then performs a merge of the old configuration with the new configuration.
        delivery-stream-name: The name of the Firehose stream.
        destination-id: The ID of the destination.
        elasticsearch-destination-update: Describes an update for a destination in Amazon OpenSearch Service.
        extended-s3-destination-update: Describes an update for a destination in Amazon S3.
