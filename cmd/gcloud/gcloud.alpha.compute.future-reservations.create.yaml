documentation:
    command: '*(ALPHA)*  Create a Compute Engine future reservation.'
    flag:
        accelerator: |-
            Manage the configuration of the type and number of accelerator cards attached.
            *count*::: The number of accelerators to attach to each instance in the reservation.
            *type*::: The specific type (e.g. `nvidia-tesla-k80` for nVidia Tesla K80) of
            accelerator to attach to instances in the reservation. Use `gcloud compute accelerator-types list`
            to learn about all available accelerator types.
        auto-created-reservations-delete-time: |-
            Automatically deletes an auto-created reservations at a specific time.
            The specified time must be an RFC3339 timestamp, which must be
            formatted as "YYYY-MM-DDTHH:MM:SSZ" where YYYY = year, MM = month, DD = day,
            HH = hours, MM = minutes, SS = seconds, and Z = time zone in
            Coordinated Universal Time (UTC). For example, specify 2021-11-20T07:00:00Z.
        auto-created-reservations-duration: |-
            Automatically deletes an auto-created reservations after a specified
            number of days, hours, minutes, or seconds. For example, specify 30m
            for 30 minutes, or 1d2h3m4s for 1 day, 2 hours, 3 minutes, and 4
            seconds. For more information, see $ gcloud topic datetimes.
        auto-delete-auto-created-reservations: |-
            If specified, the auto-created reservations for a future reservation
            are deleted at the end time (default) or at a specified delete time. Use *--auto-delete-auto-created-reservations* to enable and *--no-auto-delete-auto-created-reservations* to disable.
        chip-count: The number of chips to reserve.
        commitment-name: |-
            Name of commitment covering the delivered reservation at the time of delivery
            of future reservations. If not specified, it takes the name of the future
            reservation.
        commitment-plan: |-
            The plan for this commitment to be created, which determines duration and
            discount rate. The currently supported plans are TWELVE_MONTH (1 year), and
            THIRTY_SIX_MONTH (3 years). _COMMITMENT_PLAN_ must be one of: *TWELVE_MONTH*, *THIRTY_SIX_MONTH*.
        deployment-type: |-
            The deployment type for the reserved capacity. _DEPLOYMENT_TYPE_ must be one of:
            +
            *DENSE*::: DENSE mode is for densely deployed reservation blocks.
            *FLEXIBLE*::: FLEXIBLE mode is for highly flexible, logical reservation blocks.
            :::
            +
        description: An optional description of the future reservation to create.
        duration: |-
            Alternate way of specifying time in the number of seconds to terminate
            capacity request relative to the start time of a request.
        end-time: |-
            End time of the Future Reservation. The end time must be an RFC3339 valid
            string formatted by date, time, and timezone or "YYYY-MM-DDTHH:MM:SSZ"; where
            YYYY = year, MM = month, DD = day, HH = hours, MM = minutes, SS = seconds, and
            Z = timezone (i.e. 2021-11-20T07:00:00Z).
        local-ssd: |-
            Manage the size and the interface of local SSD to use. See
            https://cloud.google.com/compute/docs/disks/local-ssd for more information.
            *interface*::: The kind of disk interface exposed to the VM for this SSD. Valid
            values are `scsi` and `nvme`. SCSI is the default and is supported by more
            guest operating systems. NVME may provide higher performance.
            *size*::: The size of the local SSD in base-2 GB.
            *count*::: The number of local SSD to use per VM. If you don't specify this
            argument, then the default value is 1.
        location-hint: |
            Used by internal tools to control sub-zone location of the instance.
        machine-type: |-
            The type of machine (name only) that has a fixed number of vCPUs and a fixed
            amount of memory. You can also specify a custom machine type by using the
            pattern `custom-number_of_CPUs-amount_of_memory`-for example,
            `custom-32-29440`.
        maintenance-freeze-duration: |-
            Specifies the amount of hours after instance creation where the instance
            won't be scheduled for maintenance, e.g. `4h`, `2d6h`.
            See $ gcloud topic datetimes for information on duration formats.
        maintenance-interval: |-
            Specifies how infrastructure upgrades should be applied to the VM. _MAINTENANCE_INTERVAL_ must be one of:
            +
            *PERIODIC*::: VMs receive infrastructure and hypervisor updates on a periodic basis, minimizing the number of maintenance operations (live migrations or terminations) on an individual VM. Security updates will still be applied as soon as they are available.
            *RECURRENT*::: VMs receive infrastructure and hypervisor updates on a periodic basis, minimizing the number of maintenance operations (live migrations or terminations) on an individual VM.  This may mean a VM will take longer to receive an update than if it was configured for AS_NEEDED.  Security updates will still be applied as soonas they are available. RECURRENT is used for GEN3 and Sliceof Hardware VMs.
            :::
            +
        min-cpu-platform: Optional minimum CPU platform of the reservation to create.
        name-prefix: |-
            A name prefix for the auto-created reservations when capacity is
            delivered at the start time. Each auto-created reservation name
            starts with the name prefix.
        no-auto-delete-auto-created-reservations: |
            If specified, the auto-created reservations for a future reservation
            are deleted at the end time (default) or at a specified delete time.
        no-require-specific-reservation: |
            Indicate whether the auto-created reservations can be consumed by VMs with
            "any reservation" defined. If enabled, then only VMs that target the
            auto-created reservation by name using `--reservation-affinity=specific` can
            consume from this reservation. Auto-created reservations delivered with this
            flag enabled will inherit the name of the future reservation.
        planning-status: |-
            The planning status of the future reservation. The default value is DRAFT.
            While in DRAFT, any changes to the future reservation's properties will be
            allowed. If set to SUBMITTED, the future reservation will submit and its
            procurementStatus will change to PENDING_APPROVAL. Once the future reservation
            is pending approval, changes to the future reservation's properties will not
            be allowed. _PLANNING_STATUS_ must be one of:
            +
            *DRAFT*::: Default planning status value.
            *SUBMITTED*::: Planning status value to immediately submit the future reservation.
            :::
            +
        previous-commitment-terms: |-
            Applicable only if future reservation will deliver to an existing reservation
            with a ramp plan. When set to EXTEND, all associated parent Committed Used
            Discount's end-date/term will be extended to the end-time of this future
            reservation. Default is to extend previous commitment's time to the end_time
            of the reservation. _PREVIOUS_COMMITMENT_TERMS_ must be (only one value is supported): *EXTEND*.
        require-specific-reservation: |-
            Indicate whether the auto-created reservations can be consumed by VMs with
            "any reservation" defined. If enabled, then only VMs that target the
            auto-created reservation by name using `--reservation-affinity=specific` can
            consume from this reservation. Auto-created reservations delivered with this
            flag enabled will inherit the name of the future reservation. Use *--require-specific-reservation* to enable and *--no-require-specific-reservation* to disable.
        reservation-mode: |-
            The mode of the reservation. _RESERVATION_MODE_ must be one of:
            +
            *CALENDAR*::: This indicates to create a future reservation in calendar mode, which is ideal for reserving GPU VMs. The auto-created reservations for the future reservation are automatically deleted at the end of the reservation period.
            *DEFAULT*::: This indicates to create a standard future reservation. If you want to automatically delete the auto-created reservations, then you must use the --auto-delete-auto-created-reservations flag.
            :::
            +
        reservation-name: |-
            Name of reservations where the capacity is provisioned at the time of
            delivery of  future reservations. If the reservation with the given name
            does not exist already, it is created automatically at the time of Approval
            with INACTIVE state till specified start-time. Either provide the
            reservation_name or a name_prefix.
        scheduling-type: |-
            Maintenance for the reserved capacity. _SCHEDULING_TYPE_ must be one of:
            +
            *GROUPED*::: In GROUPED mode, maintenance on all reserved instances is synchronized.
            *INDEPENDENT*::: In INDEPENDENT mode, maintenance is not synchronized for this reservation, and each instance has its own maintenance window.
            :::
            +
        share-setting: |-
            Specify if this future reservation is shared, and if so, the type of sharing.
            If you omit this flag, this value is local by default. _SHARE_SETTING_ must be one of: *local*, *projects*.
        share-with: |-
            If this future reservation is shared, provide a comma-separated list
            of projects that this future reservation is shared with.
            The list must contain project IDs or project numbers.
        source-instance-template: |-
            The url of the instance template that will be used to populate the fields of
            the reservation. Instance properties can not be defined in addition to source
            instance template.
        start-time: |-
            Start time of the Future Reservation. The start time must be an RFC3339 valid
            string formatted by date, time, and timezone or "YYYY-MM-DDTHH:MM:SSZ"; where
            YYYY = year, MM = month, DD = day, HH = hours, MM = minutes, SS = seconds, and
            Z = timezone (i.e. 2021-11-20T07:00:00Z).
        total-count: |-
            The total number of instances for which capacity assurance is requested at a
            future time period.
        tpu-version: |-
            The version of Cloud TPU to reserve. _TPU_VERSION_ must be one of:
            +
            *TPU7X*::: Cloud TPU v7x
            *V5E*::: Cloud TPU v5e Lite
            *V5P*::: Cloud TPU v5p
            *V6E*::: Cloud TPU v6e
            :::
            +
        workload-type: |-
            The workload type of the TPU reservation. _WORKLOAD_TYPE_ must be one of:
            +
            *BATCH*::: Reserved resources will be optimized for BATCH workloads, such as ML training.
            *SERVING*::: Reserved resources will be optimized for SERVING workloads, such as ML inference
            :::
            +
        zone: |-
            Zone of the future reservation to create. If not specified and the ``compute/zone'' property isn't set, you
            might be prompted to select a zone (interactive mode only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
