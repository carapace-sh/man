name: create
description: '*(ALPHA)*  Creates a backup of a Cloud Bigtable table.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --backup-type=: Type of the backup; whether the backup is a standard backup or a hot backup.
    --cluster=: Name of the Bigtable cluster.
    --expiration-date=: Absolute expiration time of the backup.
    --hot-to-standard-time=: Time at which a hot backup will be converted to a standard backup relative from now; must
    --instance=: Name of the Bigtable instance.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --retention-period=: 'Retention period of the backup relative from now; must be:'
    --table=!: ID of the table from which the backup will be created.
completion:
    flag:
        backup-type:
            - backup-type-unspecified
            - hot
            - standard
documentation:
    command: '*(ALPHA)*  Creates a backup of a Cloud Bigtable table.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        backup-type: 'Type of the backup; whether the backup is a standard backup or a hot backup. _BACKUP_TYPE_ must be one of: *backup-type-unspecified*, *hot*, *standard*.'
        cluster: |-
            Name of the Bigtable cluster.
            +
            To set the `cluster` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--cluster` on the command line.
        expiration-date: |-
            Absolute expiration time of the backup. From the time the request is received, must be:
            - At least 6 hours in the future
            - At most 90 days in the future
            +
            See `$ gcloud topic datetimes` for information on date/time formats.
        hot-to-standard-time: |-
            Time at which a hot backup will be converted to a standard backup relative from now; must
            be:
            - At least 24 hours
            +
            Only applies for hot backups. See `$ gcloud topic datetimes` for information on date/time
            formats.
        instance: |-
            Name of the Bigtable instance.
            +
            To set the `instance` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        retention-period: |-
            Retention period of the backup relative from now; must be:
            - At least 6 hours
            - At most 90 days
            +
            See `$ gcloud topic datetimes` for information on duration formats.
        table: ID of the table from which the backup will be created.
