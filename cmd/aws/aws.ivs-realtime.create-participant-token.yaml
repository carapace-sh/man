name: create-participant-token
description: Creates an additional token for a specified stage.
flags:
    --attributes=: Application-provided attributes to encode into the token and attach to a stage.
    --capabilities=: Set of capabilities that the user is allowed to perform in the stage.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --duration=: Duration (in minutes), after which the token expires.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --stage-arn=!: ARN of the stage to which this token is scoped.
    --user-id=: Name that can be specified to help identify the token.
documentation:
    command: |-
        Creates an additional token for a specified stage. This can be done after stage creation or when tokens expire. Tokens always are scoped to the stage for which they are created.

        Encryption keys are owned by Amazon IVS and never used directly by your application.
    flag:
        attributes: Application-provided attributes to encode into the token and attach to a stage. Map keys and values can contain UTF-8 encoded text. The maximum length of this field is 1 KB total. *This field is exposed to all stage participants and should not be used for personally identifying, confidential, or sensitive information.*
        capabilities: 'Set of capabilities that the user is allowed to perform in the stage. Default: `PUBLISH, SUBSCRIBE`.'
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        duration: 'Duration (in minutes), after which the token expires. Default: 720 (12 hours).'
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        stage-arn: ARN of the stage to which this token is scoped.
        user-id: Name that can be specified to help identify the token. This can be any UTF-8 encoded text. *This field is exposed to all stage participants and should not be used for personally identifying, confidential, or sensitive information.*
