name: create-component
description: Create an Proton component.
flags:
    --client-token=: The client token for the created component.
    --description=: An optional customer-provided description of the component.
    --environment-name=: The name of the Proton environment that you want to associate this component with.
    --manifest=!: A path to a manifest file that lists the Infrastructure as Code (IaC) file, template language, and rendering engine for infrastructure that a custom component provisions.
    --name=!: The customer-provided name of the component.
    --service-instance-name=: The name of the service instance that you want to attach this component to.
    --service-name=: The name of the service that `serviceInstanceName` is associated with.
    --service-spec=: The service spec that you want the component to use to access service inputs.
    --tags=: An optional list of metadata items that you can associate with the Proton component.
    --template-file=!: A path to the Infrastructure as Code (IaC) file describing infrastructure that a custom component provisions.
documentation:
    command: |-
        Create an Proton component. A component is an infrastructure extension for a service instance.

        For more information about components, see [Proton components](https://docs.aws.amazon.com/proton/latest/userguide/ag-components.html) in the *Proton User Guide*.
    flag:
        client-token: The client token for the created component.
        description: An optional customer-provided description of the component.
        environment-name: The name of the Proton environment that you want to associate this component with. You must specify this when you don't specify `serviceInstanceName` and `serviceName`.
        manifest: A path to a manifest file that lists the Infrastructure as Code (IaC) file, template language, and rendering engine for infrastructure that a custom component provisions.
        name: The customer-provided name of the component.
        service-instance-name: The name of the service instance that you want to attach this component to. If you don't specify this, the component isn't attached to any service instance. Specify both `serviceInstanceName` and `serviceName` or neither of them.
        service-name: The name of the service that `serviceInstanceName` is associated with. If you don't specify this, the component isn't attached to any service instance. Specify both `serviceInstanceName` and `serviceName` or neither of them.
        service-spec: The service spec that you want the component to use to access service inputs. Set this only when you attach the component to a service instance.
        tags: |-
            An optional list of metadata items that you can associate with the Proton component. A tag is a key-value pair.

            For more information, see [Proton resources and tagging](https://docs.aws.amazon.com/proton/latest/userguide/resources.html) in the *Proton User Guide*.
        template-file: |-
            A path to the Infrastructure as Code (IaC) file describing infrastructure that a custom component provisions.

            Components support a single IaC file, even if you use Terraform as your template language.
