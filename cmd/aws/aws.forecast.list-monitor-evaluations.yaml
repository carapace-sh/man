name: list-monitor-evaluations
description: Returns a list of the monitoring evaluation results and predictor events collected by the monitor resource during different windows of time.
flags:
    --filters=: An array of filters.
    --max-results=: The maximum number of monitoring results to return.
    --monitor-arn=!: The Amazon Resource Name (ARN) of the monitor resource to get results from.
    --next-token=: If the result of the previous request was truncated, the response includes a `NextToken`.
documentation:
    command: |-
        Returns a list of the monitoring evaluation results and predictor events collected by the monitor resource during different windows of time.

        For information about monitoring see [predictor-monitoring](). For more information about retrieving monitoring results see [Viewing Monitoring Results](https://docs.aws.amazon.com/forecast/latest/dg/predictor-monitoring-results.html).
    flag:
        filters: |-
            An array of filters. For each filter, provide a condition and a match statement. The condition is either `IS` or `IS_NOT`, which specifies whether to include or exclude the resources that match the statement from the list. The match statement consists of a key and a value.

            **Filter properties**

            - `Condition` - The condition to apply. Valid values are `IS` and `IS_NOT`.
            - `Key` - The name of the parameter to filter on. The only valid value is `EvaluationState`.
            - `Value` - The value to match. Valid values are only `SUCCESS` or `FAILURE`.

            For example, to list only successful monitor evaluations, you would specify:

            `"Filters": [ { "Condition": "IS", "Key": "EvaluationState", "Value": "SUCCESS" } ]`
        max-results: The maximum number of monitoring results to return.
        monitor-arn: The Amazon Resource Name (ARN) of the monitor resource to get results from.
        next-token: If the result of the previous request was truncated, the response includes a `NextToken`. To retrieve the next set of results, use the token in the next request. Tokens expire after 24 hours.
