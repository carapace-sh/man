name: update-graphql-api
description: Updates a `GraphqlApi` object.
flags:
    --additional-authentication-providers=: A list of additional authentication providers for the `GraphqlApi` API.
    --api-id=!: The API ID.
    --authentication-type=!: The new authentication type for the `GraphqlApi` object.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --enhanced-metrics-config=: The `enhancedMetricsConfig` object.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --introspection-config=: Sets the value of the GraphQL API to enable (`ENABLED`) or disable (`DISABLED`) introspection.
    --lambda-authorizer-config=: Configuration for Lambda function authorization.
    --log-config=: The Amazon CloudWatch Logs configuration for the `GraphqlApi` object.
    --merged-api-execution-role-arn=: The Identity and Access Management service role ARN for a merged API.
    --name=!: The new name for the `GraphqlApi` object.
    --no-xray-enabled: A flag indicating whether to use X-Ray tracing for the `GraphqlApi`.
    --open-id-connect-config=: The OpenID Connect configuration for the `GraphqlApi` object.
    --owner-contact=: The owner contact information for an API resource.
    --query-depth-limit=: The maximum depth a query can have in a single request.
    --resolver-count-limit=: The maximum number of resolvers that can be invoked in a single request.
    --user-pool-config=: The new Amazon Cognito user pool configuration for the `~GraphqlApi` object.
    --xray-enabled: A flag indicating whether to use X-Ray tracing for the `GraphqlApi`.
completion:
    flag:
        authentication-type:
            - API_KEY
            - AWS_IAM
            - AMAZON_COGNITO_USER_POOLS
            - OPENID_CONNECT
            - AWS_LAMBDA
        introspection-config:
            - ENABLED
            - DISABLED
documentation:
    command: Updates a `GraphqlApi` object.
    flag:
        additional-authentication-providers: A list of additional authentication providers for the `GraphqlApi` API.
        api-id: The API ID.
        authentication-type: The new authentication type for the `GraphqlApi` object.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        enhanced-metrics-config: The `enhancedMetricsConfig` object.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        introspection-config: |-
            Sets the value of the GraphQL API to enable (`ENABLED`) or disable (`DISABLED`) introspection. If no value is provided, the introspection configuration will be set to `ENABLED` by default. This field will produce an error if the operation attempts to use the introspection feature while this field is disabled.

            For more information about introspection, see [GraphQL introspection](https://graphql.org/learn/introspection/).
        lambda-authorizer-config: Configuration for Lambda function authorization.
        log-config: The Amazon CloudWatch Logs configuration for the `GraphqlApi` object.
        merged-api-execution-role-arn: The Identity and Access Management service role ARN for a merged API. The AppSync service assumes this role on behalf of the Merged API to validate access to source APIs at runtime and to prompt the `AUTO_MERGE` to update the merged API endpoint with the source API changes automatically.
        name: The new name for the `GraphqlApi` object.
        open-id-connect-config: The OpenID Connect configuration for the `GraphqlApi` object.
        owner-contact: |-
            The owner contact information for an API resource.

            This field accepts any string input with a length of 0 - 256 characters.
        query-depth-limit: |-
            The maximum depth a query can have in a single request. Depth refers to the amount of nested levels allowed in the body of query. The default value is `0` (or unspecified), which indicates there's no depth limit. If you set a limit, it can be between `1` and `75` nested levels. This field will produce a limit error if the operation falls out of bounds.

            Note that fields can still be set to nullable or non-nullable. If a non-nullable field produces an error, the error will be thrown upwards to the first nullable field available.
        resolver-count-limit: The maximum number of resolvers that can be invoked in a single request. The default value is `0` (or unspecified), which will set the limit to `10000`. When specified, the limit value can be between `1` and `10000`. This field will produce a limit error if the operation falls out of bounds.
        user-pool-config: The new Amazon Cognito user pool configuration for the `~GraphqlApi` object.
        xray-enabled: A flag indicating whether to use X-Ray tracing for the `GraphqlApi`.
