name: describe
description: '*(ALPHA)*  Describe Audit operation.'
flags:
    --folder=: The folder for the operation.
    --location=: The location for the operation.
documentation:
    command: '*(ALPHA)*  Obtain details about an audit operation.'
    flag:
        folder: |-
            The folder for the operation.
            +
            To set the `folder` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--folder` on the command line. Must be specified for resource of type [auditmanager.folders.locations.operationDetails].
        location: |-
            The location for the operation.
            +
            To set the `location` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
