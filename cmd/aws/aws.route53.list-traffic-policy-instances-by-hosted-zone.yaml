name: list-traffic-policy-instances-by-hosted-zone
description: Gets information about the traffic policy instances that you created in a specified hosted zone.
flags:
    --hosted-zone-id=!: The ID of the hosted zone that you want to list traffic policy instances for.
    --max-items=: The maximum number of traffic policy instances to be included in the response body for this request.
    --traffic-policy-instance-name-marker=: If the value of `IsTruncated` in the previous response is true, you have more traffic policy instances.
    --traffic-policy-instance-type-marker=: If the value of `IsTruncated` in the previous response is true, you have more traffic policy instances.
completion:
    flag:
        traffic-policy-instance-type-marker:
            - SOA
            - A
            - TXT
            - NS
            - CNAME
            - MX
            - NAPTR
            - PTR
            - SRV
            - SPF
            - AAAA
            - CAA
            - DS
            - TLSA
            - SSHFP
            - SVCB
            - HTTPS
documentation:
    command: |-
        Gets information about the traffic policy instances that you created in a specified hosted zone.

        After you submit a `CreateTrafficPolicyInstance` or an `UpdateTrafficPolicyInstance` request, there's a brief delay while Amazon Route 53 creates the resource record sets that are specified in the traffic policy definition. For more information, see the `State` response element.

        Route 53 returns a maximum of 100 items in each response. If you have a lot of traffic policy instances, you can use the `MaxItems` parameter to list them in groups of up to 100.
    flag:
        hosted-zone-id: The ID of the hosted zone that you want to list traffic policy instances for.
        max-items: The maximum number of traffic policy instances to be included in the response body for this request. If you have more than `MaxItems` traffic policy instances, the value of the `IsTruncated` element in the response is `true`, and the values of `HostedZoneIdMarker`, `TrafficPolicyInstanceNameMarker`, and `TrafficPolicyInstanceTypeMarker` represent the first traffic policy instance that Amazon Route 53 will return if you submit another request.
        traffic-policy-instance-name-marker: |-
            If the value of `IsTruncated` in the previous response is true, you have more traffic policy instances. To get more traffic policy instances, submit another `ListTrafficPolicyInstances` request. For the value of `trafficpolicyinstancename`, specify the value of `TrafficPolicyInstanceNameMarker` from the previous response, which is the name of the first traffic policy instance in the next group of traffic policy instances.

            If the value of `IsTruncated` in the previous response was `false`, there are no more traffic policy instances to get.
        traffic-policy-instance-type-marker: |-
            If the value of `IsTruncated` in the previous response is true, you have more traffic policy instances. To get more traffic policy instances, submit another `ListTrafficPolicyInstances` request. For the value of `trafficpolicyinstancetype`, specify the value of `TrafficPolicyInstanceTypeMarker` from the previous response, which is the type of the first traffic policy instance in the next group of traffic policy instances.

            If the value of `IsTruncated` in the previous response was `false`, there are no more traffic policy instances to get.
