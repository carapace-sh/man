name: retrieve-and-generate-stream
description: Queries a knowledge base and generates responses based on the retrieved results, with output in streaming format.
flags:
    --input=!: Contains the query to be made to the knowledge base.
    --retrieve-and-generate-configuration=: Contains configurations for the knowledge base query and retrieval process.
    --session-configuration=: Contains details about the session with the knowledge base.
    --session-id=: The unique identifier of the session.
documentation:
    command: |-
        Queries a knowledge base and generates responses based on the retrieved results, with output in streaming format.

        The CLI doesn't support streaming operations in Amazon Bedrock, including `InvokeModelWithResponseStream`.

        This operation requires permission for the `bedrock:RetrieveAndGenerate` action.
    flag:
        input: Contains the query to be made to the knowledge base.
        retrieve-and-generate-configuration: Contains configurations for the knowledge base query and retrieval process. For more information, see [Query configurations](https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html).
        session-configuration: Contains details about the session with the knowledge base.
        session-id: The unique identifier of the session. When you first make a `RetrieveAndGenerate` request, Amazon Bedrock automatically generates this value. You must reuse this value for all subsequent requests in the same conversational session. This value allows Amazon Bedrock to maintain context and knowledge from previous interactions. You can't explicitly set the `sessionId` yourself.
