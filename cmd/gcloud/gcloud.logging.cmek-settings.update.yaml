name: update
description: Update the CMEK settings for the Cloud Logging Logs Router.
hidden: true
flags:
    --clear-kms-key: Disable CMEK for the Logs Router by clearing out Cloud KMS cryptokey in the organization's CMEK settings.
    --kms-key-name=!: ID of the key or fully qualified identifier for the key.
    --kms-keyring=: The KMS keyring of the key.
    --kms-location=: The Google Cloud location for the key.
    --kms-project=: The Google Cloud project for the key.
    --no-clear-kms-key&: Disable CMEK for the Logs Router by clearing out Cloud KMS cryptokey in the organization's CMEK settings.
    --organization=!: Organization to update Logs Router CMEK settings for.
documentation:
    command: |-
        Use this command to update the *--kms-key-name* associated with the
        Cloud Logging Logs Router.

        The Cloud KMS key must already exist and Cloud Logging must have
        permission to access it.

        Customer-managed encryption keys (CMEK) for the Logs Router can currently
        only be configured at the organization-level and will apply to all projects
        in the organization.

        ## EXAMPLES

        To enable CMEK for the Logs Router for an organization, run:

          $ gcloud logging cmek-settings update --organization=[ORGANIZATION_ID]
          --kms-key-name='projects/my-project/locations/my-location/keyRings/my-keyring/cryptoKeys/key'

        To disable CMEK for the Logs Router for an organization, run:

          $ gcloud logging cmek-settings update --organization=[ORGANIZATION_ID] --clear-kms-key
    flag:
        clear-kms-key: Disable CMEK for the Logs Router by clearing out Cloud KMS cryptokey in the organization's CMEK settings.
        kms-key-name: |-
            ID of the key or fully qualified identifier for the key.
            +
            To set the `kms-key` attribute:
            * provide the argument `--kms-key-name` on the command line.
        kms-keyring: |-
            The KMS keyring of the key.
            +
            To set the `kms-keyring` attribute:
            * provide the argument `--kms-key-name` on the command line with a fully specified name;
            * provide the argument `--kms-keyring` on the command line.
        kms-location: |-
            The Google Cloud location for the key.
            +
            To set the `kms-location` attribute:
            * provide the argument `--kms-key-name` on the command line with a fully specified name;
            * provide the argument `--kms-location` on the command line.
        kms-project: |-
            The Google Cloud project for the key.
            +
            To set the `kms-project` attribute:
            * provide the argument `--kms-key-name` on the command line with a fully specified name;
            * provide the argument `--kms-project` on the command line;
            * set the property `core/project`.
        no-clear-kms-key: Disable CMEK for the Logs Router by clearing out Cloud KMS cryptokey in the organization's CMEK settings.
        organization: Organization to update Logs Router CMEK settings for.
