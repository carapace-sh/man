name: rename
description: '*(DEPRECATED)*  Rename a Data Catalog tag template field.'
flags:
    --location=: Location of the tag template field.
    --new-id=!: New ID of the tag template field.
    --tag-template=: Tag template of the tag template field.
documentation:
    command: |4-
        *(DEPRECATED)*  This command is deprecated. Please use `gcloud dataplex aspect-types` instead.

        Rename a Data Catalog tag template field.
    flag:
        location: |-
            Location of the tag template field.
            +

            To set the `location` attribute:
            * provide the argument `field` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        new-id: New ID of the tag template field.
        tag-template: |-
            Tag template of the tag template field.
            +

            To set the `tag-template` attribute:
            * provide the argument `field` on the command line with a fully specified name;
            * provide the argument `--tag-template` on the command line.
