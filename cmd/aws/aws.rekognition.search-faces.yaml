name: search-faces
description: For a given input face ID, searches for matching faces in the collection the face belongs to.
flags:
    --collection-id=!: ID of the collection the face belongs to.
    --face-id=!: ID of a face to find matches for in the collection.
    --face-match-threshold=: Optional value specifying the minimum confidence in the face match to return.
    --max-faces=: Maximum number of faces to return.
documentation:
    command: |-
        For a given input face ID, searches for matching faces in the collection the face belongs to. You get a face ID when you add a face to the collection using the [IndexFaces]() operation. The operation compares the features of the input face with faces in the specified collection.

        You can also search faces without indexing faces by using the `SearchFacesByImage` operation.

        The operation response returns an array of faces that match, ordered by similarity score with the highest similarity first. More specifically, it is an array of metadata for each face match that is found. Along with the metadata, the response also includes a `confidence` value for each face match, indicating the confidence that the specific face matches the input face.

        For an example, see Searching for a face using its face ID in the Amazon Rekognition Developer Guide.

        This operation requires permissions to perform the `rekognition:SearchFaces` action.
    flag:
        collection-id: ID of the collection the face belongs to.
        face-id: ID of a face to find matches for in the collection.
        face-match-threshold: Optional value specifying the minimum confidence in the face match to return. For example, don't return any matches where confidence in matches is less than 70%. The default value is 80%.
        max-faces: Maximum number of faces to return. The operation returns the maximum number of faces with the highest confidence in the match.
