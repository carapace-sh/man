name: update-domain-layout
description: Updates the layout used to view data for a specific domain.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The description of the layout
    --display-name=: The display name of the layout
    --domain-name=!: The unique name of the domain.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --is-default: If set to true for a layout, this layout will be used by default to view data.
    --layout-definition-name=!: The unique name of the layout.
    --layout-type=: The type of layout that can be used to view data under a Customer Profiles domain.
    --layout=: A customizable layout that can be used to view data under a Customer Profiles domain.
    --no-is-default: If set to true for a layout, this layout will be used by default to view data.
completion:
    flag:
        layout-type:
            - PROFILE_EXPLORER
documentation:
    command: Updates the layout used to view data for a specific domain. This API can only be invoked from the Amazon Connect admin website.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The description of the layout
        display-name: The display name of the layout
        domain-name: The unique name of the domain.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        is-default: If set to true for a layout, this layout will be used by default to view data. If set to false, then the layout will not be used by default, but it can be used to view data by explicitly selecting it in the console.
        layout: A customizable layout that can be used to view data under a Customer Profiles domain.
        layout-definition-name: The unique name of the layout.
        layout-type: The type of layout that can be used to view data under a Customer Profiles domain.
