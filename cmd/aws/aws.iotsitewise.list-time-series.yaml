name: list-time-series
description: Retrieves a paginated list of time series (data streams).
flags:
    --alias-prefix=: The alias prefix of the time series.
    --asset-id=: The ID of the asset in which the asset property was created.
    --max-results=: The maximum number of results to return for each paginated request.
    --next-token=: The token to be used for the next set of paginated results.
    --time-series-type=: The type of the time series.
completion:
    flag:
        time-series-type:
            - ASSOCIATED
            - DISASSOCIATED
documentation:
    command: Retrieves a paginated list of time series (data streams).
    flag:
        alias-prefix: The alias prefix of the time series.
        asset-id: The ID of the asset in which the asset property was created. This can be either the actual ID in UUID format, or else `externalId:` followed by the external ID, if it has one. For more information, see [Referencing objects with external IDs](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/object-ids.html#external-id-references) in the *IoT SiteWise User Guide*.
        max-results: The maximum number of results to return for each paginated request.
        next-token: The token to be used for the next set of paginated results.
        time-series-type: |-
            The type of the time series. The time series type can be one of the following values:

            - `ASSOCIATED` – The time series is associated with an asset property.
            - `DISASSOCIATED` – The time series isn't associated with any asset property.
