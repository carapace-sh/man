        display-name: Mutable human-readable name. 63 character limit.
        labels: |-
            Set labels to new value. Labels as key value pairs.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: |-
            The location id of the schema resource.
            +
            To set the `location` attribute:
            * provide the argument `schema` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-allow-missing: |-
            If true and the Schema is not found, a new Schema will be created.
            In this case, `update_mask` is ignored.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-annotations: Clear annotations value and set to empty map.
        no-clear-datasources: Clear datasources value and set to empty list.
        no-clear-labels: Clear labels value and set to empty map.
        no-clear-primary-datasource: Set schema.primaryDatasource back to default value.
        no-clear-source: Set schema.source back to default value.
        no-clear-source-files: Clear source_files value and set to empty list.
        no-postgresql-unlinked: |-
            No Postgres data source is linked.
            If set, don't allow `database` and `schema_validation` to be configured.
        no-validate-only: |-
            If set, validate the request and preview the Schema, but do not actually
            update it.
        postgresql-cloud-sql-instance: 'Name of the CloudSQL instance, in the format: `projects/{project}/locations/{location}/instances/{instance}`.'
        postgresql-database: Name of the PostgreSQL database.
        postgresql-schema-migration: |-
            Configure how to perform Postgresql schema migration. _POSTGRESQL_SCHEMA_MIGRATION_ must be (only one value is supported):
            +
            *migrate-compatible*::: Connect to the SQL database and identify any missing SQL resources used
            in the given Firebase Data Connect Schema.
            Automatically create necessary SQL resources (SQL table, column, etc)
            before deploying the schema.
            During migration steps, the SQL Schema must comply with the previous
            before_deploy setting in case the migration is interrupted.
            Therefore, the previous before_deploy setting must not be
            `schema_validation=STRICT`.
            :::
            +
        postgresql-schema-validation: |-
            Configure how much Postgresql schema validation to perform. _POSTGRESQL_SCHEMA_VALIDATION_ must be one of:
            +
            *compatible*::: Connect to the SQL database and validate that the SQL DDL has all the SQL
            resources used in the given Firebase Data Connect Schema. Surface any
            missing resources as `FAILED_PRECONDITION` with an
            `IncompatibleSqlSchemaError` error detail. Succeed even if there are
            unknown tables and columns.
            *none*::: Skip no SQL schema validation. Use it with extreme caution.
            CreateSchema or UpdateSchema will succeed even if SQL database is
            unavailable or SQL schema is incompatible.
            Generated SQL may fail at execution time.
            *strict*::: Connect to the SQL database and validate that the SQL DDL matches the
            schema exactly. Surface any discrepancies as `FAILED_PRECONDITION` with an
            `IncompatibleSqlSchemaError` error detail.
            :::
            +
        postgresql-unlinked: |-
            No Postgres data source is linked.
            If set, don't allow `database` and `schema_validation` to be configured. Use *--postgresql-unlinked* to enable and *--no-postgresql-unlinked* to disable.
