name: get-ipset
description: Retrieves the IPSet specified by the `ipSetId`.
flags:
    --detector-id=!: The unique ID of the detector that is associated with the IPSet.
    --ip-set-id=!: The unique ID of the IPSet to retrieve.
documentation:
    command: Retrieves the IPSet specified by the `ipSetId`.
    flag:
        detector-id: |-
            The unique ID of the detector that is associated with the IPSet.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
        ip-set-id: The unique ID of the IPSet to retrieve.
