name: create
description: Create an Eventarc enrollment.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --cel-match=!: The cel match expression for the enrollment.
    --destination-pipeline=!: ID of the destination pipeline or fully qualified identifier for the destination pipeline.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location for the Eventarc enrollment, which should be one of the supported regions.
    --message-bus-project=: Project ID of the Google Cloud project for the message bus.
    --message-bus=!: ID of the message bus or fully qualified identifier for the message bus.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: Create an Eventarc enrollment.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        cel-match: The cel match expression for the enrollment.
        destination-pipeline: |-
            ID of the destination pipeline or fully qualified identifier for the destination pipeline.
            +
            To set the `pipeline` attribute:
            * provide the argument `--destination-pipeline` on the command line.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location for the Eventarc enrollment, which should be one of the supported regions. Alternatively, set the [eventarc/location] property.
            +
            To set the `location` attribute:
            * provide the argument `enrollment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `eventarc/location`.
        message-bus: |-
            ID of the message bus or fully qualified identifier for the message bus.
            +
            To set the `message-bus` attribute:
            * provide the argument `--message-bus` on the command line.
        message-bus-project: |-
            Project ID of the Google Cloud project for the message bus.
            +
            To set the `project` attribute:
            * provide the argument `--message-bus` on the command line with a fully specified name;
            * provide the argument `--message-bus-project` on the command line;
            * provide the argument `--project` on the command line;
            * set the property `core/project`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
