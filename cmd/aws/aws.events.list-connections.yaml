name: list-connections
description: Retrieves a list of connections from the account.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --connection-state=: The state of the connection.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --limit=: The maximum number of connections to return.
    --name-prefix=: A name prefix to filter results returned.
    --next-token=: The token returned by a previous call, which you can use to retrieve the next set of results.
completion:
    flag:
        connection-state:
            - CREATING
            - UPDATING
            - DELETING
            - AUTHORIZED
            - DEAUTHORIZED
            - AUTHORIZING
            - DEAUTHORIZING
            - ACTIVE
            - FAILED_CONNECTIVITY
documentation:
    command: Retrieves a list of connections from the account.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        connection-state: The state of the connection.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        limit: The maximum number of connections to return.
        name-prefix: A name prefix to filter results returned. Only connections with a name that starts with the prefix are returned.
        next-token: |-
            The token returned by a previous call, which you can use to retrieve the next set of results.

            The value of `nextToken` is a unique pagination token for each page. To retrieve the next page of results, make the call again using the returned token. Keep all other arguments unchanged.

            Using an expired pagination token results in an `HTTP 400 InvalidToken` error.
