name: list-engagements
description: This action allows users to retrieve a list of Engagement records from Partner Central.
flags:
    --catalog=!: Specifies the catalog related to the request.
    --created-by=: A list of AWS account IDs.
    --engagement-identifier=: An array of strings representing engagement identifiers to retrieve.
    --exclude-created-by=: An array of strings representing AWS Account IDs.
    --max-results=: The maximum number of results to return in a single call.
    --next-token=: The token for the next set of results.
    --sort=: ""
documentation:
    command: This action allows users to retrieve a list of Engagement records from Partner Central. This action can be used to manage and track various engagements across different stages of the partner selling process.
    flag:
        catalog: Specifies the catalog related to the request.
        created-by: A list of AWS account IDs. When specified, the response includes engagements created by these accounts. This filter is useful for finding engagements created by specific team members.
        engagement-identifier: An array of strings representing engagement identifiers to retrieve.
        exclude-created-by: An array of strings representing AWS Account IDs. Use this to exclude engagements created by specific users.
        max-results: The maximum number of results to return in a single call.
        next-token: The token for the next set of results. This value is returned from a previous call.
        sort: ""
