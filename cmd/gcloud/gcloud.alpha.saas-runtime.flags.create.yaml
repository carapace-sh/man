documentation:
    command: '*(ALPHA)*  Create a Flag'
    flag:
        annotations: |-
            Unstructured key-value map stored with a resource that may be set by
            external tools to store and retrieve arbitrary metadata. Annotations
            are not queryable and should be preserved when modifying objects.
            +
            *KEY*:::
            Sets `KEY` value.
            +
            *VALUE*:::
            Sets `VALUE` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --annotations=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --annotations='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --annotations=path_to_file.(yaml|json)
            +
            ```
        description: |-
            A description of the flag.
            Max length: 500 bytes.
        evaluation-spec: |-
            Specification of how the Flag value should be evaluated.
            +
            *defaultTarget*:::
            Default variant for the flag.
            +
            *variants*:::
            A list of variants.
            Variant is an identifier for a value (name assigned to a value).
            +
            *boolValue*::::
            Value is a single boolean flag value for the variant.
            +
            *doubleValue*::::
            Value is a single double flag value for the variant.
            +
            *intValue*::::
            Value is a single integer flag value for the variant.
            +
            *name*::::
            Name of the variant.
            Max length: 128 bytes.
            +
            *stringValue*::::
            Value is a single string flag value for the variant.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --evaluation-spec=defaultTarget=string,variants=[{boolValue=boolean,doubleValue=float,intValue=int,name=string,stringValue=string}]
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --evaluation-spec='{"defaultTarget": "string", "variants": [{"boolValue": boolean, "doubleValue": float, "intValue": int, "name": "string", "stringValue": "string"}]}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --evaluation-spec=path_to_file.(yaml|json)
            +
            ```
        key: |-
            Flag key used in client runtime evaluation (required).
            Max length: 256 bytes.
        labels: |-
            The labels on the resource, which can be used for categorization.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: For resources [flag, unit-kind], provides fallback value for resource location attribute. When the resource's full URI path is not provided, location will fallback to this flag value.
        unit-kind: |-
            ID of the unitKind or fully qualified identifier for the unitKind.
            +
            To set the `unit-kind` attribute:
            * provide the argument `--unit-kind` on the command line.
        value-type: |-
            The type of the flag's value, e.g. BOOL (required). _VALUE_TYPE_ must be one of:
            +
            *bool*::: The flag's value type is a boolean.
            *double*::: The flag's value type is a double.
            *int*::: The flag's value type is an integer.
            *string*::: The flag's value type is a string.
            :::
            +
