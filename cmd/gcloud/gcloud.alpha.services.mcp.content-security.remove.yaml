name: remove
description: '*(ALPHA)*  Remove MCP content security provider of a project.'
documentation:
    command: |-
        *(ALPHA)*  Remove MCP content security provider of a project.

        ## EXAMPLES

        Remove MCP content security provider of a project:

          $ gcloud alpha services mcp content-security remove my-mcp-content-security-provider

        Remove MCP content security provider of a project `my-project`:

          $ gcloud alpha services mcp content-security remove my-mcp-content-security-provider --project=my-project
