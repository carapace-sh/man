name: import
description: Import a backend service.
flags:
    --global: If set, the backend service is global.
    --no-global&: If set, the backend service is global.
    --region=: Region of the backend service to import.
    --source=: Path to a YAML file containing configuration export data.
documentation:
    command: |
        Imports a backend service's configuration from a file.
    flag:
        global: If set, the backend service is global.
        no-global: If set, the backend service is global.
        region: Region of the backend service to import. Overrides the default *compute/region* property value for this command invocation.
        source: |-
            Path to a YAML file containing configuration export data.
                      Alternatively, you may omit this flag to read from standard input.For a schema describing the export/import format, see:
                      $CLOUDSDKROOT/lib/googlecloudsdk/schemas/compute/v1/BackendService.yaml.
            +

                  Note: $CLOUDSDKROOT represents the Google Cloud CLI's installation directory.
