name: list-lineage-node-history
description: Lists the history of the specified data lineage node.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --direction=: The direction of the data lineage node refers to the lineage node having neighbors in that direction.
    --domain-identifier=!: The ID of the domain where you want to list the history of the specified data lineage node.
    --event-timestamp-gte=: Specifies whether the action is to return data lineage node history from the time after the event timestamp.
    --event-timestamp-lte=: Specifies whether the action is to return data lineage node history from the time prior of the event timestamp.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identifier=!: The ID of the data lineage node whose history you want to list.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of history items to return in a single call to ListLineageNodeHistory.
    --next-token=: When the number of history items is greater than the default value for the MaxResults parameter, or if you explicitly specify a value for MaxResults that is less than the number of items, the response includes a pagination token named NextToken.
    --page-size=: The size of each page to get in the AWS service call.
    --sort-order=: The order by which you want data lineage node history to be sorted.
    --starting-token=: A token to specify where to start paginating.
completion:
    flag:
        direction:
            - UPSTREAM
            - DOWNSTREAM
        sort-order:
            - ASCENDING
            - DESCENDING
documentation:
    command: Lists the history of the specified data lineage node.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        direction: The direction of the data lineage node refers to the lineage node having neighbors in that direction. For example, if direction is `UPSTREAM`, the `ListLineageNodeHistory` API responds with historical versions with upstream neighbors only.
        domain-identifier: The ID of the domain where you want to list the history of the specified data lineage node.
        event-timestamp-gte: Specifies whether the action is to return data lineage node history from the time after the event timestamp.
        event-timestamp-lte: Specifies whether the action is to return data lineage node history from the time prior of the event timestamp.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        identifier: The ID of the data lineage node whose history you want to list.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of history items to return in a single call to ListLineageNodeHistory. When the number of memberships to be listed is greater than the value of MaxResults, the response contains a NextToken value that you can use in a subsequent call to ListLineageNodeHistory to list the next set of items.
        next-token: When the number of history items is greater than the default value for the MaxResults parameter, or if you explicitly specify a value for MaxResults that is less than the number of items, the response includes a pagination token named NextToken. You can specify this NextToken value in a subsequent call to ListLineageNodeHistory to list the next set of items.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        sort-order: The order by which you want data lineage node history to be sorted.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
