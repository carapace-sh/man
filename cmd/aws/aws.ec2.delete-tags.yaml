name: delete-tags
description: Deletes the specified set of tags from the specified set of resources.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --resources=!: The IDs of the resources, separated by spaces.
    --tags=: The tags to delete.
documentation:
    command: |-
        Deletes the specified set of tags from the specified set of resources.

        To list the current tags, use [DescribeTags](). For more information about tags, see [Tag your Amazon EC2 resources](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Using_Tags.html) in the *Amazon Elastic Compute Cloud User Guide*.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        resources: |-
            The IDs of the resources, separated by spaces.

            Constraints: Up to 1000 resource IDs. We recommend breaking up this request into smaller batches.
        tags: |-
            The tags to delete. Specify a tag key and an optional tag value to delete specific tags. If you specify a tag key without a tag value, we delete any tag with this key regardless of its value. If you specify a tag key with an empty string as the tag value, we delete the tag only if its value is an empty string.

            If you omit this parameter, we delete all user-defined tags for the specified resources. We do not delete Amazon Web Services-generated tags (tags that have the `aws:` prefix).

            Constraints: Up to 1000 tags.
