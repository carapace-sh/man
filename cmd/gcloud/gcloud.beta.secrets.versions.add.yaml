name: add
description: '*(BETA)*  Create a new version of an existing secret.'
flags:
    --data-file=!: File path from which to read secret data.
    --location=!: ID of the location or fully qualified identifier for the location.
documentation:
    command: |-
        *(BETA)*  Create a new version of an existing secret with the provided data. The
        command will return an error if no such secret exists.

        ## EXAMPLES

        Create a new version of an existing secret named 'my-secret' with secret data
        "s3cr3t":

          $ printf "s3cr3t" | gcloud beta secrets versions add my-secret --data-file=-

        Create a new version of an existing secret named 'my-secret' with secret data
        "s3cr3t" using PowerShell (Note: PowerShell will add a newline to the
        resulting secret):

          $ Write-Output "s3cr3t" | gcloud beta secrets versions add my-secret --data-file=-

        Create a new version of an existing secret named 'my-secret' with secret data
        from a file:

          $ gcloud beta secrets versions add my-secret --data-file=/tmp/secret
    flag:
        data-file: File path from which to read secret data. Set this to "-" to read the secret data from stdin.
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line.
