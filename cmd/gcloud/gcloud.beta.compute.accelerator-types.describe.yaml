name: describe
description: '*(BETA)*  Describe Compute Engine accelerator types.'
flags:
    --zone=: Zone of the accelerator type to describe.
documentation:
    command: |
        *(BETA)*  *gcloud beta compute accelerator-types describe* displays all data associated with a Compute Engine
        accelerator type.
    flag:
        zone: Zone of the accelerator type to describe. Overrides the default *compute/zone* property value for this command invocation.
