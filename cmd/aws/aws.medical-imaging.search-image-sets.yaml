name: search-image-sets
description: Search image sets based on defined input attributes.
flags:
    --datastore-id=!: The identifier of the data store where the image sets reside.
    --max-results=: The maximum number of results that can be returned in a search.
    --next-token=: The token used for pagination of results returned in the response.
    --search-criteria=: The search criteria that filters by applying a maximum of 1 item to `SearchByAttribute`.
documentation:
    command: |-
        Search image sets based on defined input attributes.

        `SearchImageSets` accepts a single search query parameter and returns a paginated response of all image sets that have the matching criteria. All date range queries must be input as `(lowerBound, upperBound)`.

        By default, `SearchImageSets` uses the `updatedAt` field for sorting in descending order from newest to oldest.
    flag:
        datastore-id: The identifier of the data store where the image sets reside.
        max-results: The maximum number of results that can be returned in a search.
        next-token: The token used for pagination of results returned in the response. Use the token returned from the previous request to continue results where the previous request ended.
        search-criteria: The search criteria that filters by applying a maximum of 1 item to `SearchByAttribute`.
