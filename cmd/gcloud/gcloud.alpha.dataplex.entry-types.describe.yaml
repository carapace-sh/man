name: describe
description: '*(ALPHA)*  Describe a Dataplex Entry Type.'
flags:
    --location=: Location of the Dataplex resource.
documentation:
    command: |
        *(ALPHA)*  Displays all details of an Entry Type given a valid Entry Type ID.
    flag:
        location: |-
            Location of the Dataplex resource.
            +

            To set the `location` attribute:
            * provide the argument `entry_type` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
