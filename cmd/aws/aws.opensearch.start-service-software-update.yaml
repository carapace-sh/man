name: start-service-software-update
description: Schedules a service software update for an Amazon OpenSearch Service domain.
flags:
    --desired-start-time=: The Epoch timestamp when you want the service software update to start.
    --domain-name=!: The name of the domain that you want to update to the latest service software.
    --schedule-at=: When to start the service software update.
completion:
    flag:
        schedule-at:
            - NOW
            - TIMESTAMP
            - OFF_PEAK_WINDOW
documentation:
    command: Schedules a service software update for an Amazon OpenSearch Service domain. For more information, see [Service software updates in Amazon OpenSearch Service](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/service-software.html).
    flag:
        desired-start-time: The Epoch timestamp when you want the service software update to start. You only need to specify this parameter if you set `ScheduleAt` to `TIMESTAMP`.
        domain-name: The name of the domain that you want to update to the latest service software.
        schedule-at: |-
            When to start the service software update.

            - `NOW` - Immediately schedules the update to happen in the current hour if there's capacity available.
            - `TIMESTAMP` - Lets you specify a custom date and time to apply the update. If you specify this value, you must also provide a value for `DesiredStartTime`.
            - `OFF_PEAK_WINDOW` - Marks the update to be picked up during an upcoming off-peak window. There's no guarantee that the update will happen during the next immediate window. Depending on capacity, it might happen in subsequent days.

            Default: `NOW` if you don't specify a value for `DesiredStartTime`, and `TIMESTAMP` if you do.
