name: create-container-group-definition
description: '**This API works with the following fleet types:** Container'
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --container-group-type=: The type of container group being defined.
    --game-server-container-definition=: The definition for the game server container in this group.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: A descriptive identifier for the container group definition.
    --operating-system=!: The platform that all containers in the group use.
    --support-container-definitions=:
        description: One or more definition for support containers in this group.
        nargs: -1
    --tags=:
        description: A list of labels to assign to the container group definition resource.
        nargs: -1
    --total-memory-limit-mebibytes=!: The maximum amount of memory (in MiB) to allocate to the container group.
    --total-vcpu-limit=!: The maximum amount of vCPU units to allocate to the container group (1 vCPU is equal to 1024 CPU units).
    --version-description=: A description for the initial version of this container group definition.
completion:
    flag:
        container-group-type:
            - GAME_SERVER
            - PER_INSTANCE
        operating-system:
            - AMAZON_LINUX_2023
documentation:
    command: "**This API works with the following fleet types:** Container\n\nCreates a `ContainerGroupDefinition` that describes a set of containers for hosting your game server with Amazon GameLift Servers managed containers hosting. An Amazon GameLift Servers container group is similar to a container task or pod. Use container group definitions when you create a container fleet with [CreateContainerFleet](https://docs.aws.amazon.com/gamelift/latest/apireference/API_CreateContainerFleet.html).\n\nA container group definition determines how Amazon GameLift Servers deploys your containers to each instance in a container fleet. You can maintain multiple versions of a container group definition.\n\nThere are two types of container groups:\n\n- A **game server container group** has the containers that run your game server application and supporting software. A game server container group can have these container types:\n  \n  - Game server container. This container runs your game server. You can define one game server container in a game server container group.\n  - Support container. This container runs software in parallel with your game server. You can define up to 8 support containers in a game server group.\n  \n  When building a game server container group definition, you can choose to bundle your game server executable and all dependent software into a single game server container. Alternatively, you can separate the software into one game server container and one or more support containers.\n  \n  On a container fleet instance, a game server container group can be deployed multiple times (depending on the compute resources of the instance). This means that all containers in the container group are replicated together.\n- A **per-instance container group** has containers for processes that aren't replicated on a container fleet instance. This might include background services, logging, test processes, or processes that need to persist independently of the game server container group. When building a per-instance container group, you can define up to 10 support containers.\n\nThis operation requires Identity and Access Management (IAM) permissions to access container images in Amazon ECR repositories. See [IAM permissions for Amazon GameLift Servers](https://docs.aws.amazon.com/gamelift/latest/developerguide/gamelift-iam-policy-examples.html) for help setting the appropriate permissions.\n\n**Request options**\n\nUse this operation to make the following types of requests. You can specify values for the minimum required parameters and customize optional values later.\n\n- Create a game server container group definition. Provide the following required parameter values:\n  \n  - `Name`\n  - `ContainerGroupType` (`GAME_SERVER`)\n  - `OperatingSystem` (omit to use default value)\n  - `TotalMemoryLimitMebibytes` (omit to use default value)\n  - `TotalVcpuLimit`(omit to use default value)\n  - At least one `GameServerContainerDefinition`\n    \n    - `ContainerName`\n    - `ImageUrl`\n    - `PortConfiguration`\n    - `ServerSdkVersion` (omit to use default value)\n- Create a per-instance container group definition. Provide the following required parameter values:\n  \n  - `Name`\n  - `ContainerGroupType` (`PER_INSTANCE`)\n  - `OperatingSystem` (omit to use default value)\n  - `TotalMemoryLimitMebibytes` (omit to use default value)\n  - `TotalVcpuLimit`(omit to use default value)\n  - At least one `SupportContainerDefinition`\n    \n    - `ContainerName`\n    - `ImageUrl`\n\n**Results**\n\nIf successful, this request creates a `ContainerGroupDefinition` resource and assigns a unique ARN value. You can update most properties of a container group definition by calling [UpdateContainerGroupDefinition](https://docs.aws.amazon.com/gamelift/latest/apireference/API_UpdateContainerGroupDefinition.html), and optionally save the update as a new version."
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        container-group-type: |-
            The type of container group being defined. Container group type determines how Amazon GameLift Servers deploys the container group on each fleet instance.

            Default value: `GAME_SERVER`
        game-server-container-definition: The definition for the game server container in this group. Define a game server container only when the container group type is `GAME_SERVER`. Game server containers specify a container image with your game server build. You can pass in your container definitions as a JSON file.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: A descriptive identifier for the container group definition. The name value must be unique in an Amazon Web Services Region.
        operating-system: |-
            The platform that all containers in the group use. Containers in a group must run on the same operating system.

            Default value: `AMAZON_LINUX_2023`

            Amazon Linux 2 (AL2) will reach end of support on 6/30/2025. See more details in the [Amazon Linux 2 FAQs](http://aws.amazon.com/amazon-linux-2/faqs/). For game servers that are hosted on AL2 and use server SDK version 4.x for Amazon GameLift Servers, first update the game server build to server SDK 5.x, and then deploy to AL2023 instances. See [Migrate to server SDK version 5.](https://docs.aws.amazon.com/gamelift/latest/developerguide/reference-serversdk5-migration.html)
        support-container-definitions: One or more definition for support containers in this group. You can define a support container in any type of container group. You can pass in your container definitions as a JSON file.
        tags: A list of labels to assign to the container group definition resource. Tags are developer-defined key-value pairs. Tagging Amazon Web Services resources are useful for resource management, access management and cost allocation. For more information, see [Tagging Amazon Web Services Resources](https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html) in the *Amazon Web Services General Reference*.
        total-memory-limit-mebibytes: |-
            The maximum amount of memory (in MiB) to allocate to the container group. All containers in the group share this memory. If you specify memory limits for an individual container, the total value must be greater than any individual container's memory limit.

            Default value: 1024
        total-vcpu-limit: |-
            The maximum amount of vCPU units to allocate to the container group (1 vCPU is equal to 1024 CPU units). All containers in the group share this memory. If you specify vCPU limits for individual containers, the total value must be equal to or greater than the sum of the CPU limits for all containers in the group.

            Default value: 1
        version-description: A description for the initial version of this container group definition.
