name: get-service-endpoint
description: Gets the account-specific endpoint for Configuration and Update Server (CUPS) protocol or LoRaWAN Network Server (LNS) connections.
flags:
    --service-type=: The service type for which to get endpoint information about.
completion:
    flag:
        service-type:
            - CUPS
            - LNS
documentation:
    command: Gets the account-specific endpoint for Configuration and Update Server (CUPS) protocol or LoRaWAN Network Server (LNS) connections.
    flag:
        service-type: The service type for which to get endpoint information about. Can be `CUPS` for the Configuration and Update Server endpoint, or `LNS` for the LoRaWAN Network Server endpoint.
