# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: geo-routes
description: Amazon Location Service Routes V2
commands:
    - name: calculate-isolines
      description: Calculates areas that can be reached within specified time or distance thresholds from a given point.
      flags:
        --allow=: Enables special road types or features that should be considered for routing even if they might be restricted by default for the selected travel mode.
        --arrival-time=: Determine areas from which `Destination` can be reached by this time, taking into account predicted traffic conditions and working backward to account for congestion patterns.
        --avoid=: Specifies road types, features, or areas to avoid (if possible) when calculating reachable areas.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --depart-now: When true, uses the current time as the departure time and takes current traffic conditions into account.
        --departure-time=: Determine areas that can be reached when departing at this time, taking into account predicted traffic conditions.
        --destination-options=: Options that control how the destination point is matched to the road network and how routes can approach it.
        --destination=:
            description: An optional destination point, specified as `[longitude, latitude]` coordinates.
            nargs: -1
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --isoline-geometry-format=: The format of the returned IsolineGeometry.
        --isoline-granularity=: Controls the detail level of the generated isolines.
        --key=: An Amazon Location Service API Key with access to this action.
        --no-depart-now: When true, uses the current time as the departure time and takes current traffic conditions into account.
        --optimize-isoline-for=: Controls the trade-off between calculation speed and isoline precision.
        --optimize-routing-for=: Determines whether routes prioritize shortest travel time (`FastestRoute`) or shortest physical distance (`ShortestRoute`) when calculating reachable areas.
        --origin-options=: Options that control how the origin point is matched to the road network and how routes can depart from it.
        --origin=:
            description: The starting point for isoline calculations, specified as `[longitude, latitude]` coordinates.
            nargs: -1
        --thresholds=!: The distance or time thresholds used to determine reachable areas.
        --traffic=: Configures how real-time and historical traffic data affects isoline calculations.
        --travel-mode-options=: Additional attributes that refine how reachable areas are calculated based on specific vehicle characteristics.
        --travel-mode=: The mode of transportation to use for calculations.
      completion:
        flag:
            isoline-geometry-format:
                - FlexiblePolyline
                - Simple
            optimize-isoline-for:
                - AccurateCalculation
                - BalancedCalculation
                - FastCalculation
            optimize-routing-for:
                - FastestRoute
                - ShortestRoute
            travel-mode:
                - Car
                - Pedestrian
                - Scooter
                - Truck
      documentation:
        command: |-
            Calculates areas that can be reached within specified time or distance thresholds from a given point. For example, you can use this operation to determine the area within a 30-minute drive of a store location, find neighborhoods within walking distance of a school, or identify delivery zones based on drive time.

            Isolines (also known as isochrones for time-based calculations) are useful for various applications including:

            - Service area visualization - Show customers the area you can serve within promised delivery times
            - Site selection - Analyze potential business locations based on population within travel distance
            - Site selection - Determine areas that can be reached within specified response times

            Route preferences such as avoiding toll roads or ferries are treated as preferences rather than absolute restrictions. If a viable route cannot be calculated while honoring all preferences, some may be ignored.

            For more information, see [Calculate isolines](https://docs.aws.amazon.com/location/latest/developerguide/calculate-isolines.html) in the *Amazon Location Service Developer Guide*.
        flag:
            allow: Enables special road types or features that should be considered for routing even if they might be restricted by default for the selected travel mode. These include high-occupancy vehicle and toll lanes.
            arrival-time: |-
                Determine areas from which `Destination` can be reached by this time, taking into account predicted traffic conditions and working backward to account for congestion patterns. This attribute cannot be used together with `DepartureTime` or `DepartNow`. Specified as an ISO-8601 timestamp with timezone offset.

                Time format: `YYYY-MM-DDThh:mm:ss.sssZ | YYYY-MM-DDThh:mm:ss.sss+hh:mm`

                Examples:

                `2020-04-22T17:57:24Z`

                `2020-04-22T17:57:24+02:00`
            avoid: Specifies road types, features, or areas to avoid (if possible) when calculating reachable areas. These are treated as preferences rather than strict constraints—if a route cannot be calculated without using an avoided feature, that avoidance preference may be ignored.
            cli-input-json: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            cli-input-yaml: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            depart-now: When true, uses the current time as the departure time and takes current traffic conditions into account. This attribute cannot be used together with `DepartureTime` or `ArrivalTime`.
            departure-time: |-
                Determine areas that can be reached when departing at this time, taking into account predicted traffic conditions. This attribute cannot be used together with `ArrivalTime` or `DepartNow`. Specified as an ISO-8601 timestamp with timezone offset.

                Time format:`YYYY-MM-DDThh:mm:ss.sssZ | YYYY-MM-DDThh:mm:ss.sss+hh:mm`

                Examples:

                `2020-04-22T17:57:24Z`

                `2020-04-22T17:57:24+02:00`
            destination: An optional destination point, specified as `[longitude, latitude]` coordinates. When provided, the service calculates areas from which this destination can be reached within the specified thresholds. This reverses the usual isoline calculation to show areas that could reach your location, rather than areas you could reach from your location. Either `Origin` or `Destination` must be provided.
            destination-options: Options that control how the destination point is matched to the road network and how routes can approach it. These options help improve travel time accuracy by accounting for real-world access to the destination.
            generate-cli-skeleton: |-
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            isoline-geometry-format: |-
                The format of the returned IsolineGeometry.

                Default value:`FlexiblePolyline`
            isoline-granularity: Controls the detail level of the generated isolines. Higher granularity produces smoother shapes but requires more processing time and results in larger responses.
            key: An Amazon Location Service API Key with access to this action. If omitted, the request must be signed using Signature Version 4.
            optimize-isoline-for: |-
                Controls the trade-off between calculation speed and isoline precision. Choose `FastCalculation` for quicker results with less detail, `AccurateCalculation` for more precise results, or `BalancedCalculation` for a middle ground.

                Default value: `BalancedCalculation`
            optimize-routing-for: |-
                Determines whether routes prioritize shortest travel time (`FastestRoute`) or shortest physical distance (`ShortestRoute`) when calculating reachable areas.

                Default value: `FastestRoute`
            origin: The starting point for isoline calculations, specified as `[longitude, latitude]` coordinates. For example, this could be a store location, service center, or any point from which you want to calculate reachable areas. Either `Origin` or `Destination` must be provided.
            origin-options: Options that control how the origin point is matched to the road network and how routes can depart from it. These options help improve travel time accuracy by accounting for real-world access from the origin.
            thresholds: |-
                The distance or time thresholds used to determine reachable areas. You can specify up to five thresholds (which all must be the same type) to calculate multiple isolines in a single request. For example, to determine the areas that are reachable within 10 and 20 minutes of the origin, specify time thresholds of 600 and 1200 seconds.

                You incur a calculation charge for each threshold. Using a large number of thresholds in a request can lead to unexpected charges. For more information, see [Routes pricing](https://docs.aws.amazon.com/location/latest/developerguide/routes-pricing.html) in the *Amazon Location Service Developer Guide*.
            traffic: Configures how real-time and historical traffic data affects isoline calculations. Traffic patterns can significantly impact reachable areas, especially during peak hours.
            travel-mode: |-
                The mode of transportation to use for calculations. This affects which road types or features can be used, estimated speed, and the traffic levels that are applied.

                - `Car`—Standard passenger vehicle routing using roads accessible to cars
                - `Pedestrian`—Walking routes using pedestrian paths, sidewalks, and crossings
                - `Scooter`—Light two-wheeled vehicle routing using roads and paths accessible to scooters
                - `Truck`—Commercial truck routing considering vehicle dimensions, weight restrictions, and hazardous material regulations

                The mode `Scooter` also applies to motorcycles; set this to `Scooter` when calculating isolines for motorcycles.

                Default value: `Car`
            travel-mode-options: |-
                Additional attributes that refine how reachable areas are calculated based on specific vehicle characteristics. These options help produce more accurate results by accounting for real-world constraints and capabilities.

                For example:

                - For trucks (`Truck`), specify dimensions, weight limits, and hazardous cargo restrictions to ensure isolines only include roads that can physically and legally accommodate the vehicle
                - For cars (`Car`), set maximum speed capabilities or indicate high-occupancy vehicle eligibility to better estimate reachable areas
                - For scooters (`Scooter`), specify engine type and speed limitations to more accurately model their travel capabilities

                Without these options, calculations use default assumptions that may not match your specific use case.
    - name: calculate-route-matrix
      description: Use `CalculateRouteMatrix` to compute results for all pairs of Origins to Destinations.
      flags:
        --allow=: Features that are allowed while calculating a route.
        --avoid=: Features that are avoided while calculating a route.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --depart-now: Uses the current time as the time of departure.
        --departure-time=: Time of departure from the origin.
        --destinations=!:
            description: List of destinations for the route.
            nargs: -1
        --exclude=: Features to be strictly excluded while calculating the route.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --key=: 'Optional: The API key to be used for authorization.'
        --no-depart-now: Uses the current time as the time of departure.
        --optimize-routing-for=: Controls the trade-off between finding the shortest travel time (`FastestRoute`) and the shortest distance (`ShortestRoute`) when calculating reachable areas.
        --origins=!:
            description: 'The position for the origin in World Geodetic System (WGS 84) format: \[longitude, latitude].'
            nargs: -1
        --routing-boundary=: Boundary within which the matrix is to be calculated.
        --traffic=: Traffic related options.
        --travel-mode-options=: Travel mode related options for the provided travel mode.
        --travel-mode=: Specifies the mode of transport when calculating a route.
      completion:
        flag:
            optimize-routing-for:
                - FastestRoute
                - ShortestRoute
            travel-mode:
                - Car
                - Pedestrian
                - Scooter
                - Truck
      documentation:
        command: |-
            Use `CalculateRouteMatrix` to compute results for all pairs of Origins to Destinations. Each row corresponds to one entry in Origins. Each entry in the row corresponds to the route from that entry in Origins to an entry in Destinations positions.

            For more information, see [Calculate route matrix](https://docs.aws.amazon.com/location/latest/developerguide/calculate-route-matrix.html) in the *Amazon Location Service Developer Guide*.
        flag:
            allow: Features that are allowed while calculating a route.
            avoid: Features that are avoided while calculating a route. Avoidance is on a best-case basis. If an avoidance can't be satisfied for a particular case, it violates the avoidance and the returned response produces a notice for the violation. For [GrabMaps](https://docs.aws.amazon.com/location/latest/developerguide/GrabMaps.html) customers, `ap-southeast-1` and `ap-southeast-5` regions support only `TollRoads`, `Ferries`, and `ControlledAccessHighways`.
            cli-input-json: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            cli-input-yaml: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            depart-now: Uses the current time as the time of departure.
            departure-time: |-
                Time of departure from the origin.

                Time format:`YYYY-MM-DDThh:mm:ss.sssZ | YYYY-MM-DDThh:mm:ss.sss+hh:mm`

                Examples:

                `2020-04-22T17:57:24Z`

                `2020-04-22T17:57:24+02:00`
            destinations: |-
                List of destinations for the route.

                Route calculations are billed for each origin and destination pair. If you use a large matrix of origins and destinations, your costs will increase accordingly. For more information, see [Routes pricing](https://docs.aws.amazon.com/location/latest/developerguide/routes-pricing.html) in the *Amazon Location Service Developer Guide*.
            exclude: Features to be strictly excluded while calculating the route. Not supported in `ap-southeast-1` and `ap-southeast-5` regions for [GrabMaps](https://docs.aws.amazon.com/location/latest/developerguide/GrabMaps.html) customers.
            generate-cli-skeleton: |-
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            key: 'Optional: The API key to be used for authorization. Either an API key or valid SigV4 signature must be provided when making a request.'
            optimize-routing-for: |-
                Controls the trade-off between finding the shortest travel time (`FastestRoute`) and the shortest distance (`ShortestRoute`) when calculating reachable areas.

                Default value: `FastestRoute`
            origins: |-
                The position for the origin in World Geodetic System (WGS 84) format: \[longitude, latitude].

                Route calculations are billed for each origin and destination pair. Using a large amount of Origins in a request can lead you to incur unexpected charges. For more information, see [Routes pricing](https://docs.aws.amazon.com/location/latest/developerguide/routes-pricing.html) in the *Amazon Location Service Developer Guide*.
            routing-boundary: |-
                Boundary within which the matrix is to be calculated. All data, origins and destinations outside the boundary are considered invalid. For [GrabMaps](https://docs.aws.amazon.com/location/latest/developerguide/GrabMaps.html) customers, `ap-southeast-1` and `ap-southeast-5` regions support only `Unbounded` set to `true`.

                Default value: `Unbounded set to true`

                When request routing boundary was set as AutoCircle, the response routing boundary will return Circle derived from the AutoCircle settings.
            traffic: Traffic related options. Not supported in `ap-southeast-1` and `ap-southeast-5` regions for [GrabMaps](https://docs.aws.amazon.com/location/latest/developerguide/GrabMaps.html) customers.
            travel-mode: |-
                Specifies the mode of transport when calculating a route. Used in estimating the speed of travel and road compatibility. For [GrabMaps](https://docs.aws.amazon.com/location/latest/developerguide/GrabMaps.html) customers, `ap-southeast-1` and `ap-southeast-5` regions support only `Car`, `Pedestrian`, and `Scooter`.

                Default value: `Car`
            travel-mode-options: Travel mode related options for the provided travel mode. Not supported in `ap-southeast-1` and `ap-southeast-5` regions for [GrabMaps](https://docs.aws.amazon.com/location/latest/developerguide/GrabMaps.html) customers.
    - name: calculate-routes
      description: '`CalculateRoutes` computes routes given the following required parameters: `Origin` and `Destination`.'
      flags:
        --allow=: Features that are allowed while calculating a route.
        --arrival-time=: Time of arrival at the destination.
        --avoid=: Features that are avoided while calculating a route.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --depart-now: Uses the current time as the time of departure.
        --departure-time=: Time of departure from the origin.
        --destination-options=: Destination related options.
        --destination=!:
            description: The final position for the route.
            nargs: -1
        --driver=: Driver related options.
        --exclude=: Features to be strictly excluded while calculating the route.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --instructions-measurement-system=: Measurement system to be used for instructions within steps in the response.
        --key=: 'Optional: The API key to be used for authorization.'
        --languages=:
            description: List of languages for instructions within steps in the response.
            nargs: -1
        --leg-additional-features=:
            description: A list of optional additional parameters such as timezone that can be requested for each result.
            nargs: -1
        --leg-geometry-format=: Specifies the format of the geometry returned for each leg of the route.
        --max-alternatives=: Maximum number of alternative routes to be provided in the response, if available.
        --no-depart-now: Uses the current time as the time of departure.
        --optimize-routing-for=: Controls the trade-off between achieving the shortest travel time (`FastestRoute`) and achieving the shortest physical distance ((`ShortestRoute`) when calculating each route in the matrix.
        --origin-options=: Specifies how the origin point should be matched to the road network and any routing constraints that apply when the traveler is departing the origin.
        --origin=!:
            description: 'The start position for the route in World Geodetic System (WGS 84) format: \[longitude, latitude].'
            nargs: -1
        --span-additional-features=:
            description: A list of optional features such as `SpeedLimit` that can be requested for a Span.
            nargs: -1
        --tolls=: Toll related options.
        --traffic=: Traffic related options.
        --travel-mode-options=: Travel mode related options for the provided travel mode.
        --travel-mode=: Specifies the mode of transport when calculating a route.
        --travel-step-type=: Type of step returned by the response.
        --waypoints=:
            description: List of waypoints between the Origin and Destination.
            nargs: -1
      completion:
        flag:
            instructions-measurement-system:
                - Metric
                - Imperial
            leg-geometry-format:
                - FlexiblePolyline
                - Simple
            optimize-routing-for:
                - FastestRoute
                - ShortestRoute
            travel-mode:
                - Car
                - Pedestrian
                - Scooter
                - Truck
            travel-step-type:
                - Default
                - TurnByTurn
      documentation:
        command: |-
            `CalculateRoutes` computes routes given the following required parameters: `Origin` and `Destination`.

            For more information, see [Calculate routes](https://docs.aws.amazon.com/location/latest/developerguide/calculate-routes.html) in the *Amazon Location Service Developer Guide*.
        flag:
            allow: Features that are allowed while calculating a route. Not supported in `ap-southeast-1` and `ap-southeast-5` regions for [GrabMaps](https://docs.aws.amazon.com/location/latest/developerguide/GrabMaps.html) customers.
            arrival-time: |-
                Time of arrival at the destination. Not supported in `ap-southeast-1` and `ap-southeast-5` regions for [GrabMaps](https://docs.aws.amazon.com/location/latest/developerguide/GrabMaps.html) customers.

                Time format:`YYYY-MM-DDThh:mm:ss.sssZ | YYYY-MM-DDThh:mm:ss.sss+hh:mm`

                Examples:

                `2020-04-22T17:57:24Z`

                `2020-04-22T17:57:24+02:00`
            avoid: Features that are avoided while calculating a route. Avoidance is on a best-case basis. If an avoidance can't be satisfied for a particular case, it violates the avoidance and the returned response produces a notice for the violation. For [GrabMaps](https://docs.aws.amazon.com/location/latest/developerguide/GrabMaps.html) customers, `ap-southeast-1` and `ap-southeast-5` regions support only `ControlledAccessHighways`, `Ferries`, and `TollRoads`
            cli-input-json: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            cli-input-yaml: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            depart-now: Uses the current time as the time of departure.
            departure-time: |-
                Time of departure from the origin.

                Time format:`YYYY-MM-DDThh:mm:ss.sssZ | YYYY-MM-DDThh:mm:ss.sss+hh:mm`

                Examples:

                `2020-04-22T17:57:24Z`

                `2020-04-22T17:57:24+02:00`
            destination: 'The final position for the route. In the World Geodetic System (WGS 84) format: `[longitude, latitude]`.'
            destination-options: Destination related options. Not supported in `ap-southeast-1` and `ap-southeast-5` regions for [GrabMaps](https://docs.aws.amazon.com/location/latest/developerguide/GrabMaps.html) customers.
            driver: Driver related options. Not supported in `ap-southeast-1` and `ap-southeast-5` regions for [GrabMaps](https://docs.aws.amazon.com/location/latest/developerguide/GrabMaps.html) customers.
            exclude: Features to be strictly excluded while calculating the route. Not supported in `ap-southeast-1` and `ap-southeast-5` regions for [GrabMaps](https://docs.aws.amazon.com/location/latest/developerguide/GrabMaps.html) customers.
            generate-cli-skeleton: |-
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            instructions-measurement-system: Measurement system to be used for instructions within steps in the response.
            key: 'Optional: The API key to be used for authorization. Either an API key or valid SigV4 signature must be provided when making a request.'
            languages: |-
                List of languages for instructions within steps in the response. Not supported in `ap-southeast-1` and `ap-southeast-5` regions for [GrabMaps](https://docs.aws.amazon.com/location/latest/developerguide/GrabMaps.html) customers.

                Instructions in the requested language are returned only if they are available.
            leg-additional-features: |-
                A list of optional additional parameters such as timezone that can be requested for each result. For [GrabMaps](https://docs.aws.amazon.com/location/latest/developerguide/GrabMaps.html) customers, `ap-southeast-1` and `ap-southeast-5` regions support only `PassThroughWaypoints`, `Summary`, and `TravelStepInstructions`

                - `Elevation`: Retrieves the elevation information for each location.
                - `Incidents`: Provides information on traffic incidents along the route.
                - `PassThroughWaypoints`: Indicates waypoints that are passed through without stopping.
                - `Summary`: Returns a summary of the route, including distance and duration.
                - `Tolls`: Supplies toll cost information along the route.
                - `TravelStepInstructions`: Provides step-by-step instructions for travel along the route.
                - `TruckRoadTypes`: Returns information about road types suitable for trucks.
                - `TypicalDuration`: Gives typical travel duration based on historical data.
                - `Zones`: Specifies the time zone information for each waypoint.
            leg-geometry-format: |-
                Specifies the format of the geometry returned for each leg of the route. You can choose between two different geometry encoding formats.

                `FlexiblePolyline`: A compact and precise encoding format for the leg geometry. For more information on the format, see the GitHub repository for [https://github.com/aws-geospatial/polyline](https://github.com/aws-geospatial/polyline).

                `Simple`: A less compact encoding, which is easier to decode but may be less precise and result in larger payloads.
            max-alternatives: Maximum number of alternative routes to be provided in the response, if available. For [GrabMaps](https://docs.aws.amazon.com/location/latest/developerguide/GrabMaps.html) customers, `ap-southeast-1` and `ap-southeast-5` regions support only up to 3 alternative routes.
            optimize-routing-for: |-
                Controls the trade-off between achieving the shortest travel time (`FastestRoute`) and achieving the shortest physical distance ((`ShortestRoute`) when calculating each route in the matrix.

                Default value: `FastestRoute`
            origin: 'The start position for the route in World Geodetic System (WGS 84) format: \[longitude, latitude].'
            origin-options: Specifies how the origin point should be matched to the road network and any routing constraints that apply when the traveler is departing the origin. Not supported in `ap-southeast-1` and `ap-southeast-5` regions for [GrabMaps](https://docs.aws.amazon.com/location/latest/developerguide/GrabMaps.html) customers.
            span-additional-features: A list of optional features such as `SpeedLimit` that can be requested for a Span. A span is a section of a Leg for which the requested features have the same values. Not supported in `ap-southeast-1` and `ap-southeast-5` regions for [GrabMaps](https://docs.aws.amazon.com/location/latest/developerguide/GrabMaps.html) customers.
            tolls: Toll related options. Not supported in `ap-southeast-1` and `ap-southeast-5` regions for [GrabMaps](https://docs.aws.amazon.com/location/latest/developerguide/GrabMaps.html) customers.
            traffic: Traffic related options. Not supported in `ap-southeast-1` and `ap-southeast-5` regions for [GrabMaps](https://docs.aws.amazon.com/location/latest/developerguide/GrabMaps.html) customers.
            travel-mode: |-
                Specifies the mode of transport when calculating a route. Used in estimating the speed of travel and road compatibility. For [GrabMaps](https://docs.aws.amazon.com/location/latest/developerguide/GrabMaps.html) customers, `ap-southeast-1` and `ap-southeast-5` regions support only `Car`, `Pedestrian`, and `Scooter` values.

                Default value: `Car`
            travel-mode-options: Travel mode related options for the provided travel mode. For [GrabMaps](https://docs.aws.amazon.com/location/latest/developerguide/GrabMaps.html) customers, `ap-southeast-1` and `ap-southeast-5` regions support only `Car` and `Pedestrian` travel mode options.
            travel-step-type: Type of step returned by the response. `Default` provides basic steps intended for web based applications. `TurnByTurn` provides detailed instructions with more granularity intended for a turn based navigation system. For [GrabMaps](https://docs.aws.amazon.com/location/latest/developerguide/GrabMaps.html) customers, `ap-southeast-1` and `ap-southeast-5` regions `Default` does not return any steps.
