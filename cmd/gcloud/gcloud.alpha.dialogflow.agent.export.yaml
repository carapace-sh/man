name: export
description: '*(ALPHA)*  Export the Dialogflow agent to a zip file.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --destination=!: Path to a file or the URI to a Google Cloud Storage to save the agent to.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(ALPHA)*  Export the Dialogflow agent of the current project to a zip file. The zip file will contain
        data on all intents and entity types of the agent.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        destination: |-
            Path to a file or the URI to a Google Cloud Storage to save the agent to. Note: A URI must
            start with "gs://".
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
