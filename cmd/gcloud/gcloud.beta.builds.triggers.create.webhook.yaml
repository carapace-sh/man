name: webhook
description: '*(BETA)*  Create a build trigger with a Webhook trigger event.'
flags:
    --bitbucket-server-config=&: The resource name of the Bitbucket Server config that should be applied to this source (1st gen).
    --branch=: Branch to build.
    --build-config=: Path to a YAML or JSON file containing the build configuration in the repository.
    --description=: Build trigger description.
    --dockerfile-dir=: Location of the directory containing the Dockerfile in the repository.
    --dockerfile-image=: Docker image name to build.
    --dockerfile=!: Path of Dockerfile to use for builds in the repository.
    --github-enterprise-config=: The resource name of the GitHub Enterprise config that should be applied to this source (1st gen).
    --inline-config=: Local path to a YAML or JSON file containing a build configuration.
    --name=: Build trigger name.
    --no-require-approval&: Require manual approval for triggered builds.
    --region=: The region of the Cloud Build Service to use.
    --repo-type=!: Type of the repository (1st gen).
    --repo=!: URI of the repository (1st gen).
    --repository=: Repository resource (2nd gen) to use, in the format "projects/*/locations/*/connections/*/repositories/*".
    --require-approval: Require manual approval for triggered builds.
    --secret=!: The full path of the secret version required to validate webhook requests
    --service-account=: The service account used for all user-controlled operations including UpdateBuildTrigger, RunBuildTrigger, CreateBuild, and CancelBuild.
    --subscription-filter=: CEL filter expression for the trigger.
    --substitutions=: Parameters to be substituted in the build specification.
    --tag=: Tag to build.
    --trigger-config=: Path to Build Trigger config file (JSON or YAML format).
documentation:
    command: '*(BETA)*  Create a build trigger with a Webhook trigger event.'
    flag:
        bitbucket-server-config: |
            The resource name of the Bitbucket Server config that should be applied to this source (1st gen).
            Format: projects/{project}/locations/{location}/bitbucketServerConfigs/{id}
        branch: Branch to build.
        build-config: |-
            Path to a YAML or JSON file containing the build configuration in the repository.
            +
            For more details, see: https://cloud.google.com/cloud-build/docs/build-config
        description: Build trigger description.
        dockerfile: |-
            Path of Dockerfile to use for builds in the repository.
            +
            If specified, a build config will be generated to run docker
            build using the specified file.
            +
            The filename is relative to the Dockerfile directory.
        dockerfile-dir: |-
            Location of the directory containing the Dockerfile in the repository.
            +
            The directory will also be used as the Docker build context.
        dockerfile-image: |-
            Docker image name to build.
            +
            If not specified, gcr.io/PROJECT/github.com/REPO_OWNER/REPO_NAME:$COMMIT_SHA will be used.
            +
            Use a build configuration (cloudbuild.yaml) file for building multiple images in a single trigger.
        github-enterprise-config: |-
            The resource name of the GitHub Enterprise config that should be applied to this source (1st gen).
            Format: projects/{project}/locations/{location}/githubEnterpriseConfigs/{id} or projects/{project}/githubEnterpriseConfigs/{id}
        inline-config: Local path to a YAML or JSON file containing a build configuration.
        name: Build trigger name.
        no-require-approval: Require manual approval for triggered builds.
        region: |-
            The region of the Cloud Build Service to use.
            Must be set to a supported region name (e.g. `us-central1`).
            If unset, `builds/region`, which is the default region to use when working with Cloud Build resources, is used. If builds/region is unset, region is set to `global`.
            Note: Region must be specified in 2nd gen repo; `global` is not supported.
        repo: |-
            URI of the repository (1st gen). Currently only HTTP URIs for GitHub and Cloud
            Source Repositories are supported.
        repo-type: |-
            Type of the repository (1st gen). Currently only GitHub and Cloud Source Repository types
            are supported.
        repository: Repository resource (2nd gen) to use, in the format "projects/*/locations/*/connections/*/repositories/*".
        require-approval: Require manual approval for triggered builds. Use *--require-approval* to enable and *--no-require-approval* to disable.
        secret: |-
            The full path of the secret version required to validate webhook requests
            against this trigger.
            For example, projects/my-project/secrets/my-secret/versions/1.
        service-account: 'The service account used for all user-controlled operations including UpdateBuildTrigger, RunBuildTrigger, CreateBuild, and CancelBuild. If no service account is set, then the standard Cloud Build service account ([PROJECT_NUM]@system.gserviceaccount.com) is used instead. Format: `projects/{PROJECT_ID}/serviceAccounts/{ACCOUNT_ID_OR_EMAIL}`.'
        subscription-filter: CEL filter expression for the trigger. See https://cloud.google.com/build/docs/filter-build-events-using-cel for more details.
        substitutions: |-
            Parameters to be substituted in the build specification. For example:
            +
              $ {command} ... --substitutions _FAVORITE_COLOR=blue,_NUM_CANDIES=10
            +
            This will result in a build where every occurrence of ```${_FAVORITE_COLOR}```
            in certain fields is replaced by "blue", and similarly for ```${_NUM_CANDIES}```
            and "10".
            +
            Substitutions can be applied to user-defined variables (starting with an
            underscore) and to the following built-in variables: REPO_NAME, BRANCH_NAME,
            TAG_NAME, REVISION_ID, COMMIT_SHA, SHORT_SHA.
            +
            For more details, see:
            https://cloud.google.com/build/docs/configuring-builds/substitute-variable-values
        tag: Tag to build.
        trigger-config: |-
            Path to Build Trigger config file (JSON or YAML format). For more details, see
            https://cloud.google.com/cloud-build/docs/api/reference/rest/v1/projects.triggers#BuildTrigger
