name: create-thing-type
description: Creates a new thing type.
flags:
    --tags=: Metadata which can be used to manage the thing type.
    --thing-type-name=!: The name of the thing type.
    --thing-type-properties=: The ThingTypeProperties for the thing type to create.
documentation:
    command: |-
        Creates a new thing type. If this call is made multiple times using the same thing type name and configuration, the call will succeed. If this call is made with the same thing type name but different configuration a `ResourceAlreadyExistsException` is thrown.

        Requires permission to access the [CreateThingType](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        tags: Metadata which can be used to manage the thing type.
        thing-type-name: The name of the thing type.
        thing-type-properties: The ThingTypeProperties for the thing type to create. It contains information about the new thing type including a description, and a list of searchable thing attribute names.
