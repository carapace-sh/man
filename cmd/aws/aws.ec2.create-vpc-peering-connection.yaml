name: create-vpc-peering-connection
description: 'Requests a VPC peering connection between two VPCs: a requester VPC that you own and an accepter VPC with which to create the connection.'
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --peer-owner-id=: The Amazon Web Services account ID of the owner of the accepter VPC.
    --peer-region=: The Region code for the accepter VPC, if the accepter VPC is located in a Region other than the Region in which you make the request.
    --peer-vpc-id=: The ID of the VPC with which you are creating the VPC peering connection.
    --tag-specifications=: The tags to assign to the peering connection.
    --vpc-id=!: The ID of the requester VPC.
documentation:
    command: |-
        Requests a VPC peering connection between two VPCs: a requester VPC that you own and an accepter VPC with which to create the connection. The accepter VPC can belong to another Amazon Web Services account and can be in a different Region to the requester VPC. The requester VPC and accepter VPC cannot have overlapping CIDR blocks.

        Limitations and rules apply to a VPC peering connection. For more information, see the [VPC peering limitations](https://docs.aws.amazon.com/vpc/latest/peering/vpc-peering-basics.html#vpc-peering-limitations) in the *VPC Peering Guide*.

        The owner of the accepter VPC must accept the peering request to activate the peering connection. The VPC peering connection request expires after 7 days, after which it cannot be accepted or rejected.

        If you create a VPC peering connection request between VPCs with overlapping CIDR blocks, the VPC peering connection has a status of `failed`.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        peer-owner-id: |-
            The Amazon Web Services account ID of the owner of the accepter VPC.

            Default: Your Amazon Web Services account ID
        peer-region: |-
            The Region code for the accepter VPC, if the accepter VPC is located in a Region other than the Region in which you make the request.

            Default: The Region in which you make the request.
        peer-vpc-id: The ID of the VPC with which you are creating the VPC peering connection. You must specify this parameter in the request.
        tag-specifications: The tags to assign to the peering connection.
        vpc-id: The ID of the requester VPC. You must specify this parameter in the request.
