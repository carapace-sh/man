name: batch-delete-image
description: Deletes a list of specified images within a repository.
flags:
    --image-ids=!: A list of image ID references that correspond to images to delete.
    --registry-id=: The Amazon Web Services account ID associated with the registry that contains the image to delete.
    --repository-name=!: The repository that contains the image to delete.
documentation:
    command: |-
        Deletes a list of specified images within a repository. Images are specified with either an `imageTag` or `imageDigest`.

        You can remove a tag from an image by specifying the image's tag in your request. When you remove the last tag from an image, the image is deleted from your repository.

        You can completely delete an image (and all of its tags) by specifying the image's digest in your request.
    flag:
        image-ids: A list of image ID references that correspond to images to delete. The format of the `imageIds` reference is `imageTag=tag` or `imageDigest=digest`.
        registry-id: The Amazon Web Services account ID associated with the registry that contains the image to delete. If you do not specify a registry, the default registry is assumed.
        repository-name: The repository that contains the image to delete.
