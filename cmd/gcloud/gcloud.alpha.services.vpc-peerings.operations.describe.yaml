name: describe
description: '*(ALPHA)*  Describes an operation resource for a given operation name.'
flags:
    --name=!: The name of operation to describe
documentation:
    command: |-
        *(ALPHA)*  This command will return information about an operation given the name
        of that operation.

        ## EXAMPLES
        To describe an operation resource named
        `operations/abc`, run:

          $ gcloud alpha services vpc-peerings operations describe --name=operations/abc
    flag:
        name: The name of operation to describe
