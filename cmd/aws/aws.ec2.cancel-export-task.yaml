name: cancel-export-task
description: Cancels an active export task.
flags:
    --export-task-id=!: The ID of the export task.
documentation:
    command: Cancels an active export task. The request removes all artifacts of the export, including any partially-created Amazon S3 objects. If the export task is complete or is in the process of transferring the final disk image, the command fails and returns an error.
    flag:
        export-task-id: The ID of the export task. This is the ID returned by the `CreateInstanceExportTask` and `ExportImage` operations.
