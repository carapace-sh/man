name: update-hitreview-status
description: The `UpdateHITReviewStatus` operation updates the status of a HIT.
flags:
    --hitid=!: The ID of the HIT to update.
    --no-revert&: Specifies how to update the HIT status.
    --revert: Specifies how to update the HIT status.
documentation:
    command: The `UpdateHITReviewStatus` operation updates the status of a HIT. If the status is Reviewable, this operation can update the status to Reviewing, or it can revert a Reviewing HIT back to the Reviewable status.
    flag:
        hitid: The ID of the HIT to update.
        revert: |-
            Specifies how to update the HIT status. Default is `False`.

            - Setting this to false will only transition a HIT from `Reviewable` to `Reviewing`
            - Setting this to true will only transition a HIT from `Reviewing` to `Reviewable`
