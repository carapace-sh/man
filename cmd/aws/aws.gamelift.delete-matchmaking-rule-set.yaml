name: delete-matchmaking-rule-set
description: |-
    **This API works with the following fleet types:** EC2, Anywhere, Container

    Deletes an existing matchmaking rule set.
flags:
    --name=!: A unique identifier for the matchmaking rule set to be deleted.
documentation:
    command: |-
        **This API works with the following fleet types:** EC2, Anywhere, Container

        Deletes an existing matchmaking rule set. To delete the rule set, provide the rule set name. Rule sets cannot be deleted if they are currently being used by a matchmaking configuration.

        **Learn more**

        - [Build a rule set](https://docs.aws.amazon.com/gamelift/latest/flexmatchguide/match-rulesets.html)
    flag:
        name: 'A unique identifier for the matchmaking rule set to be deleted. (Note: The rule set name is different from the optional "name" field in the rule set body.) You can use either the rule set name or ARN value.'
