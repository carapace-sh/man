name: create
description: Create an API key.
flags:
    --allowed-application=: Repeatable.
    --allowed-bundle-ids=: iOS app's bundle ids that are allowed to use the key.
    --allowed-ips=: A list of the caller IP addresses that are allowed to make API calls with this key.
    --allowed-referrers=: A list of regular expressions for the referrer URLs that are allowed to make API calls with this key.
    --annotations=: Annotations are key resource.
    --api-target=: Repeatable.
    --async: Return immediately, without waiting for the operation in progress to
    --display-name=: Display name of the key to create.
    --key-id=: User-specified ID of the key to create.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --service-account=: The email of the service account the key is bound to.
documentation:
    command: Create an API key.
    flag:
        allowed-application: Repeatable. Specify multiple allowed applications. The accepted keys are `sha1_fingerprint` and `package_name`.
        allowed-bundle-ids: iOS app's bundle ids that are allowed to use the key.
        allowed-ips: A list of the caller IP addresses that are allowed to make API calls with this key.
        allowed-referrers: A list of regular expressions for the referrer URLs that are allowed to make API calls with this key.
        annotations: |-
            Annotations are key resource. Specify annotations as
                        a key-value dictionary for small amounts of arbitrary client data.
        api-target: |-
            Repeatable. Specify service and optionally one or multiple specific
            methods. Both fields are case insensitive.
            If you need to specify methods, it should be specified
            with the `--flags-file`. See $ gcloud topic flags-file for details.
            See the examples section for how to use `--api-target` in
            `--flags-file`.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        display-name: Display name of the key to create.
        key-id: User-specified ID of the key to create.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        service-account: The email of the service account the key is bound to. If this field is specified, the key is a service account bound key and auth enabled.
