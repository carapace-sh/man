name: list-resources
description: Lists the resources that you added to a resource share or the resources that are shared with you.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: Specifies the total number of results that you want included on each page of the response.
    --next-token=: Specifies that you want to receive the next page of results.
    --page-size=: The size of each page to get in the AWS service call.
    --principal=: Specifies that you want to list only the resource shares that are associated with the specified principal.
    --resource-arns=:
        description: Specifies that you want to list only the resource shares that include resources with the specified [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html).
        nargs: -1
    --resource-owner=!: 'Specifies that you want to list only the resource shares that match the following:'
    --resource-region-scope=: Specifies that you want the results to include only resources that have the specified scope.
    --resource-share-arns=:
        description: Specifies that you want to list only resources in the resource shares identified by the specified [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html).
        nargs: -1
    --resource-type=: Specifies that you want to list only the resource shares that include resources of the specified resource type.
    --starting-token=: A token to specify where to start paginating.
completion:
    flag:
        resource-owner:
            - SELF
            - OTHER-ACCOUNTS
        resource-region-scope:
            - ALL
            - REGIONAL
            - GLOBAL
documentation:
    command: Lists the resources that you added to a resource share or the resources that are shared with you.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: Specifies the total number of results that you want included on each page of the response. If you do not include this parameter, it defaults to a value that is specific to the operation. If additional items exist beyond the number you specify, the `NextToken` response element is returned with a value (not null). Include the specified value as the `NextToken` request parameter in the next call to the operation to get the next part of the results. Note that the service might return fewer results than the maximum even when there are more results available. You should check `NextToken` after every operation to ensure that you receive all of the results.
        next-token: Specifies that you want to receive the next page of results. Valid only if you received a `NextToken` response in the previous request. If you did, it indicates that more output is available. Set this parameter to the value provided by the previous call's `NextToken` response to request the next page of results.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        principal: Specifies that you want to list only the resource shares that are associated with the specified principal.
        resource-arns: Specifies that you want to list only the resource shares that include resources with the specified [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html).
        resource-owner: |-
            Specifies that you want to list only the resource shares that match the following:

            - **`SELF`** – resources that your account shares with other accounts
            - **`OTHER-ACCOUNTS`** – resources that other accounts share with your account
        resource-region-scope: |-
            Specifies that you want the results to include only resources that have the specified scope.

            - `ALL` – the results include both global and regional resources or resource types.
            - `GLOBAL` – the results include only global resources or resource types.
            - `REGIONAL` – the results include only regional resources or resource types.

            The default value is `ALL`.
        resource-share-arns: Specifies that you want to list only resources in the resource shares identified by the specified [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html).
        resource-type: |-
            Specifies that you want to list only the resource shares that include resources of the specified resource type.

            For valid values, query the [ListResourceTypes]() operation.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
