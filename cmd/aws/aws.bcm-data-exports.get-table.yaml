name: get-table
description: Returns the metadata for the specified table and table properties.
flags:
    --table-name=!: The name of the table.
    --table-properties=: TableProperties are additional configurations you can provide to change the data and schema of a table.
documentation:
    command: Returns the metadata for the specified table and table properties. This includes the list of columns in the table schema, their data types, and column descriptions.
    flag:
        table-name: The name of the table.
        table-properties: TableProperties are additional configurations you can provide to change the data and schema of a table. Each table can have different TableProperties. Tables are not required to have any TableProperties. Each table property has a default value that it assumes if not specified.
