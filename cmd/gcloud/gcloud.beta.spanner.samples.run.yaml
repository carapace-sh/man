name: run
description: '*(BETA)*  Run the given Cloud Spanner sample app.'
flags:
    --cleanup: Delete the instance after running the sample app.
    --database-id=: ID of the new Cloud Spanner database to create for the sample app.
    --duration=: Duration of time allowed to run the sample app before stopping the service.
    --instance-id=!: The Cloud Spanner instance ID for the sample app.
    --no-cleanup&: Delete the instance after running the sample app.
    --no-skip-init&: Use an existing database instead of creating a new one.
    --skip-init: Use an existing database instead of creating a new one.
documentation:
    command: |-
        *(BETA)*  Each Cloud Spanner sample application includes a backend gRPC service
        backed by a Cloud Spanner database and a workload script that generates
        service traffic. This command creates and initializes the Cloud Spanner
        database and runs both the backend service and workload script.

        These sample apps are open source and available at
        https://github.com/GoogleCloudPlatform/cloud-spanner-samples.

        To see a list of available sample apps, run:

            $ gcloud beta spanner samples list
    flag:
        cleanup: Delete the instance after running the sample app. Enabled by default, use *--no-cleanup* to disable.
        database-id: ID of the new Cloud Spanner database to create for the sample app.
        duration: Duration of time allowed to run the sample app before stopping the service.
        instance-id: The Cloud Spanner instance ID for the sample app.
        no-cleanup: Delete the instance after running the sample app.
        no-skip-init: Use an existing database instead of creating a new one.
        skip-init: Use an existing database instead of creating a new one.
