name: create
description: '*(ALPHA)*  Create a Firewall Plus endpoint association.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --endpoint-zone=: Zone of the firewall endpoint.
    --endpoint=!: ID of the firewall endpoint or fully qualified identifier for the firewall endpoint.
    --labels=: List of label KEY=VALUE pairs to add.
    --max-wait=: Time to synchronously wait for the operation to complete, after which the operation continues asynchronously.
    --network=!: ID of the network or fully qualified identifier for the network.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --organization=: Organization ID to which the changes should apply.
    --tls-inspection-policy-project=: Project of the TLS Inspection Policy.
    --tls-inspection-policy-region=: Region of the TLS Inspection Policy.
    --tls-inspection-policy=!: ID of the TLS Inspection Policy or fully qualified identifier for the TLS Inspection Policy.
    --zone=!: Zone of a firewall endpoint association
documentation:
    command: |+
        *(ALPHA)*  Associate the specified network with the firewall endpoint. Successful
        creation of a firewall endpoint association results in an association
        in READY state. Check the progress of association creation by using
        `gcloud network-security firewall-endpoint-associations list`.

        For more examples, refer to the EXAMPLES section below.

    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        endpoint: |-
            ID of the firewall endpoint or fully qualified identifier for the firewall endpoint.
            +
            To set the `endpoint-name` attribute:
            * provide the argument `--endpoint` on the command line.
        endpoint-zone: |-
            Zone of the firewall endpoint.
            +
            To set the `endpoint-zone` attribute:
            * provide the argument `--endpoint` on the command line with a fully specified name;
            * provide the argument `--endpoint-zone` on the command line;
            * provide the argument `--zone` on the command line;
            * provide the argument `FIREWALL_ENDPOINT_ASSOCIATION` on the command line with a fully specified name.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        max-wait: Time to synchronously wait for the operation to complete, after which the operation continues asynchronously. Ignored if --no-async isn't specified. See $ gcloud topic datetimes for information on time formats.
        network: |-
            ID of the network or fully qualified identifier for the network.
            +
            To set the `network-name` attribute:
            * provide the argument `--network` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        organization: |-
            Organization ID to which the changes should apply.
            +
            To set the `organization` attribute:
            * provide the argument `--endpoint` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
        tls-inspection-policy: |-
            ID of the TLS Inspection Policy or fully qualified identifier for the TLS Inspection Policy.
            +
            To set the `tls_inspection_policy` attribute:
            * provide the argument `--tls-inspection-policy` on the command line.
        tls-inspection-policy-project: |-
            Project of the TLS Inspection Policy.
            +
            To set the `tls-inspection-policy-project` attribute:
            * provide the argument `--tls-inspection-policy` on the command line with a fully specified name;
            * provide the argument `--tls-inspection-policy-project` on the command line;
            * provide the argument `--project` on the command line;
            * provide the argument `FIREWALL_ENDPOINT_ASSOCIATION` on the command line with a fully specified name.
        tls-inspection-policy-region: |-
            Region of the TLS Inspection Policy.
                      NOTE: TLS Inspection Policy needs to be
                      in the same region as Firewall Plus endpoint resource.
            +

            To set the `tls-inspection-policy-region` attribute:
            * provide the argument `--tls-inspection-policy` on the command line with a fully specified name;
            * provide the argument `--tls-inspection-policy-region` on the command line.
        zone: Zone of a firewall endpoint association
