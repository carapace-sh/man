name: describe-vpc-endpoints
description: Describes your VPC endpoints.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: The filters.
    --max-results=: The maximum number of items to return for this request.
    --next-token=: The token for the next set of items to return.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --vpc-endpoint-ids=: The IDs of the VPC endpoints.
documentation:
    command: Describes your VPC endpoints. The default is to describe all your VPC endpoints. Alternatively, you can specify specific VPC endpoint IDs or filter the results to include only the VPC endpoints that match specific criteria.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            The filters.

            - `ip-address-type` - The IP address type (`ipv4` | `ipv6`).
            - `service-name` - The name of the service.
            - `service-region` - The Region of the service.
            - `tag`:&lt;key&gt; - The key/value combination of a tag assigned to the resource. Use the tag key in the filter name and the tag value as the filter value. For example, to find all resources that have a tag with the key `Owner` and the value `TeamA`, specify `tag:Owner` for the filter name and `TeamA` for the filter value.
            - `tag-key` - The key of a tag assigned to the resource. Use this filter to find all resources assigned a tag with a specific key, regardless of the tag value.
            - `vpc-id` - The ID of the VPC in which the endpoint resides.
            - `vpc-endpoint-id` - The ID of the endpoint.
            - `vpc-endpoint-state` - The state of the endpoint (`pendingAcceptance` | `pending` | `available` | `deleting` | `deleted` | `rejected` | `failed`).
            - `vpc-endpoint-type` - The type of VPC endpoint (`Interface` | `Gateway` | `GatewayLoadBalancer` | `Resource` | `ServiceNetwork`).
        max-results: |-
            The maximum number of items to return for this request. The request returns a token that you can specify in a subsequent call to get the next set of results.

            Constraint: If the value is greater than 1,000, we return only 1,000 items.
        next-token: The token for the next set of items to return. (You received this token from a prior call.)
        vpc-endpoint-ids: The IDs of the VPC endpoints.
