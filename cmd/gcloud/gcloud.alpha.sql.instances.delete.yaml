name: delete
description: '*(ALPHA)*  Deletes a Cloud SQL instance.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --enable-final-backup: Enables the final backup to be taken at the time of instance deletion.
    --final-backup-description=: Provides description for the final backup going to be taken.
    --final-backup-expiry-time=: Specifies the time at which the final backup will expire.
    --final-backup-retention-days=: Specifies number of days to retain final backup.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-enable-final-backup&: Enables the final backup to be taken at the time of instance deletion.
documentation:
    command: '*(ALPHA)*  Deletes a Cloud SQL instance.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        enable-final-backup: Enables the final backup to be taken at the time of instance deletion.
        final-backup-description: Provides description for the final backup going to be taken.
        final-backup-expiry-time: 'Specifies the time at which the final backup will expire. Maximum time allowed is 365 days. For instances managed by BackupDR, the maximum time allowed is 99 years. Format: YYYY-MM-DDTHH:MM:SS.'
        final-backup-retention-days: Specifies number of days to retain final backup. The valid range is between 1 and 365. For instances managed by BackupDR, the valid range is between 1 day and 99 years. Default value is 30 days.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-enable-final-backup: Enables the final backup to be taken at the time of instance deletion.
