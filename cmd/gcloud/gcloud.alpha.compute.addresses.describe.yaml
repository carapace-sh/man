name: describe
description: '*(ALPHA)*  Display detailed information about a reserved static address.'
flags:
    --global: If set, the address is global.
    --no-global&: If set, the address is global.
    --region=: Region of the address to describe.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute addresses describe* displays all data associated with a reserved static address in a
        project.

        ## EXAMPLES
        To get details about a global address, run:

          $ gcloud alpha compute addresses describe my-address-name --global

        To get details about a regional address, run:

          $ gcloud alpha compute addresses describe my-address-name --region=us-central1
    flag:
        global: If set, the address is global.
        no-global: If set, the address is global.
        region: Region of the address to describe. Overrides the default *compute/region* property value for this command invocation.
