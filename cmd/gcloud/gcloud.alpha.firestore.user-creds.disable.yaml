name: disable
description: '*(ALPHA)*  Disables a Cloud Firestore user creds.'
flags:
    --database=!: The database to operate on.
documentation:
    command: |-
        ## EXAMPLES

        To disable user creds 'test-user-creds-id' under database testdb.

            $ gcloud alpha firestore user-creds disable test-user-creds-id --database='testdb'
    flag:
        database: |-
            The database to operate on.
            +
            For example, to operate on database `foo`:
            +
              $ {command} --database='foo'
