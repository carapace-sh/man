name: untag-resource
description: Removes tags from the specified Kinesis resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the Kinesis resource from which to remove tags.
    --tag-keys=!: A list of tag key-value pairs.
documentation:
    command: Removes tags from the specified Kinesis resource. Removed tags are deleted and can't be recovered after this operation completes successfully.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the Kinesis resource from which to remove tags.
        tag-keys: A list of tag key-value pairs. Existing tags of the resource whose keys are members of this list will be removed from the Kinesis resource.
