name: set-iam-policy
description: Set the IAM policy for a workstation.
flags:
    --cluster=: The name of the cluster containing the workstation.
    --config=: The name of the config containing the workstation.
    --region=: The name of the region of the workstation.
documentation:
    command: |
        Sets the IAM policy for the given workstation as defined in a JSON or YAML file.
    flag:
        cluster: |-
            The name of the cluster containing the workstation.
            +

            To set the `cluster` attribute:
            * provide the argument `workstation` on the command line with a fully specified name;
            * provide the argument `--cluster` on the command line;
            * set the property `workstations/cluster`.
        config: |-
            The name of the config containing the workstation.
            +

            To set the `config` attribute:
            * provide the argument `workstation` on the command line with a fully specified name;
            * provide the argument `--config` on the command line;
            * set the property `workstations/config`.
        region: |-
            The name of the region of the workstation.
            +

            To set the `region` attribute:
            * provide the argument `workstation` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `workstations/region`.
