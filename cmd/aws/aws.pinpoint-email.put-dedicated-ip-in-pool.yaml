name: put-dedicated-ip-in-pool
description: Move a dedicated IP address to an existing dedicated IP pool.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --destination-pool-name=!: The name of the IP pool that you want to add the dedicated IP address to.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ip=!: The IP address that you want to move to the dedicated IP pool.
documentation:
    command: |-
        Move a dedicated IP address to an existing dedicated IP pool.

        The dedicated IP address that you specify must already exist, and must be associated with your Amazon Pinpoint account.

        The dedicated IP pool you specify must already exist. You can create a new pool by using the `CreateDedicatedIpPool` operation.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        destination-pool-name: The name of the IP pool that you want to add the dedicated IP address to. You have to specify an IP pool that already exists.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ip: The IP address that you want to move to the dedicated IP pool. The value you specify has to be a dedicated IP address that's associated with your Amazon Pinpoint account.
