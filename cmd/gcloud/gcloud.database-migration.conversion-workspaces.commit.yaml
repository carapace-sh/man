name: commit
description: Commit a Database Migration Service conversion workspace.
flags:
    --commit-name=: A user-friendly name for the conversion workspace commit.
    --no-async: Waits for the operation in progress to complete before returning.
    --region=: The Cloud region for the conversion_workspace.
documentation:
    command: |
        Commit a Database Migration Service conversion workspace.
    flag:
        commit-name: |-
            A user-friendly name for the conversion workspace commit. The commit name
            can include letters, numbers, spaces, and hyphens, and must start with a
            letter.
        no-async: Waits for the operation in progress to complete before returning.
        region: |-
            The Cloud region for the conversion_workspace.
            +
            To set the `region` attribute:
            * provide the argument `conversion_workspace` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
