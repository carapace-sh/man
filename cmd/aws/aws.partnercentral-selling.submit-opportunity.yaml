name: submit-opportunity
description: Use this action to submit an Opportunity that was previously created by partner for AWS review.
flags:
    --catalog=!: Specifies the catalog related to the request.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identifier=!: The identifier of the Opportunity previously created by partner and needs to be submitted.
    --involvement-type=!: Specifies the level of AWS sellers' involvement on the opportunity.
    --visibility=: Determines whether to restrict visibility of the opportunity from AWS sales.
completion:
    flag:
        involvement-type:
            - For Visibility Only
            - Co-Sell
        visibility:
            - Full
            - Limited
documentation:
    command: Use this action to submit an Opportunity that was previously created by partner for AWS review. After you perform this action, the Opportunity becomes non-editable until it is reviewed by AWS and has `LifeCycle.ReviewStatus` as either `Approved` or `Action Required`.
    flag:
        catalog: |-
            Specifies the catalog related to the request. Valid values are:

            - AWS: Submits the opportunity request from the production AWS environment.
            - Sandbox: Submits the opportunity request from a sandbox environment used for testing or development purposes.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        identifier: The identifier of the Opportunity previously created by partner and needs to be submitted.
        involvement-type: |-
            Specifies the level of AWS sellers' involvement on the opportunity. Valid values:

            - `Co-sell`: Indicates the user wants to co-sell with AWS. Share the opportunity with AWS to receive deal assistance and support.
            - `For Visibility Only`: Indicates that the user does not need support from AWS Sales Rep. Share this opportunity with AWS for visibility only, you will not receive deal assistance and support.
        visibility: |-
            Determines whether to restrict visibility of the opportunity from AWS sales. Default value is Full. Valid values:

            - `Full`: The opportunity is fully visible to AWS sales.
            - `Limited`: The opportunity has restricted visibility to AWS sales.
