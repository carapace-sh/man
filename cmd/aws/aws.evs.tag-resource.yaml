name: tag-resource
description: Associates the specified tags to an Amazon EVS resource with the specified `resourceArn`.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource to add tags to.
    --tags=!: Metadata that assists with categorization and organization.
documentation:
    command: Associates the specified tags to an Amazon EVS resource with the specified `resourceArn`. If existing tags on a resource are not specified in the request parameters, they aren't changed. When a resource is deleted, the tags associated with that resource are also deleted. Tags that you create for Amazon EVS resources don't propagate to any other resources associated with the environment. For example, if you tag an environment with this operation, that tag doesn't automatically propagate to the VLAN subnets and hosts associated with the environment.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource to add tags to.
        tags: Metadata that assists with categorization and organization. Each tag consists of a key and an optional value. You define both. Tags don't propagate to any other environment or Amazon Web Services resources.
