name: get-temporary-glue-partition-credentials
description: This API is identical to `GetTemporaryTableCredentials` except that this is used when the target Data Catalog resource is of type Partition.
flags:
    --audit-context=: A structure representing context to access a resource (column names, query ID, etc).
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --duration-seconds=: The time period, between 900 and 21,600 seconds, for the timeout of the temporary credentials.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --partition=!: A list of partition values identifying a single partition.
    --permissions=:
        description: Filters the request based on the user having been granted a list of specified permissions on the requested resource(s).
        nargs: -1
    --supported-permission-types=:
        description: A list of supported permission types for the partition.
        nargs: -1
    --table-arn=!: The ARN of the partitions' table.
documentation:
    command: This API is identical to `GetTemporaryTableCredentials` except that this is used when the target Data Catalog resource is of type Partition. Lake Formation restricts the permission of the vended credentials with the same scope down policy which restricts access to a single Amazon S3 prefix.
    flag:
        audit-context: A structure representing context to access a resource (column names, query ID, etc).
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        duration-seconds: The time period, between 900 and 21,600 seconds, for the timeout of the temporary credentials.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        partition: A list of partition values identifying a single partition.
        permissions: Filters the request based on the user having been granted a list of specified permissions on the requested resource(s).
        supported-permission-types: A list of supported permission types for the partition. Valid values are `COLUMN_PERMISSION` and `CELL_FILTER_PERMISSION`.
        table-arn: The ARN of the partitions' table.
