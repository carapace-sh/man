name: update-distribution-tenant
description: Updates a distribution tenant.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --connection-group-id=: The ID of the target connection group.
    --customizations=: Customizations for the distribution tenant.
    --distribution-id=: The ID for the multi-tenant distribution.
    --domains=:
        description: The domains to update for the distribution tenant.
        nargs: -1
    --enabled: Indicates whether the distribution tenant should be updated to an enabled state.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --id=!: The ID of the distribution tenant.
    --if-match=!: The value of the `ETag` header that you received when retrieving the distribution tenant to update.
    --managed-certificate-request=: An object that contains the CloudFront managed ACM certificate request.
    --no-enabled: Indicates whether the distribution tenant should be updated to an enabled state.
    --parameters=:
        description: A list of parameter values to add to the resource.
        nargs: -1
documentation:
    command: Updates a distribution tenant.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        connection-group-id: The ID of the target connection group.
        customizations: Customizations for the distribution tenant. For each distribution tenant, you can specify the geographic restrictions, and the Amazon Resource Names (ARNs) for the ACM certificate and WAF web ACL. These are specific values that you can override or disable from the multi-tenant distribution that was used to create the distribution tenant.
        distribution-id: The ID for the multi-tenant distribution.
        domains: The domains to update for the distribution tenant. A domain object can contain only a domain property. You must specify at least one domain. Each distribution tenant can have up to 5 domains.
        enabled: Indicates whether the distribution tenant should be updated to an enabled state. If you update the distribution tenant and it's not enabled, the distribution tenant won't serve traffic.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        id: The ID of the distribution tenant.
        if-match: The value of the `ETag` header that you received when retrieving the distribution tenant to update. This value is returned in the response of the `GetDistributionTenant` API operation.
        managed-certificate-request: An object that contains the CloudFront managed ACM certificate request.
        parameters: A list of parameter values to add to the resource. A parameter is specified as a key-value pair. A valid parameter value must exist for any parameter that is marked as required in the multi-tenant distribution.
