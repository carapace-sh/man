name: describe
description: '*(ALPHA)*  Describe an OS policy assignment.'
flags:
    --location=: Location of the OS policy assignment.
documentation:
    command: |
        *(ALPHA)*  Describe an OS policy assignment
        ## EXAMPLES

        To describe an OS policy `my-assignment` in location `us-central1-a`:

          $ gcloud alpha compute os-config os-policy-assignments describe my-assignment --location=us-central1-a
    flag:
        location: |-
            Location of the OS policy assignment.
            +

            To set the `location` attribute:
            * provide the argument `os_policy_assignment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/zone`.
