name: create-approval-rule-template
description: Creates a template for approval rules that can then be associated with one or more repositories in your Amazon Web Services account.
flags:
    --approval-rule-template-content=!: The content of the approval rule that is created on pull requests in associated repositories.
    --approval-rule-template-description=: The description of the approval rule template.
    --approval-rule-template-name=!: The name of the approval rule template.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
documentation:
    command: Creates a template for approval rules that can then be associated with one or more repositories in your Amazon Web Services account. When you associate a template with a repository, CodeCommit creates an approval rule that matches the conditions of the template for all pull requests that meet the conditions of the template. For more information, see [AssociateApprovalRuleTemplateWithRepository]().
    flag:
        approval-rule-template-content: "The content of the approval rule that is created on pull requests in associated repositories. If you specify one or more destination references (branches), approval rules are created in an associated repository only if their destination references (branches) match those specified in the template.\n\nWhen you create the content of the approval rule template, you can specify approvers in an approval pool in one of two ways:\n\n- **CodeCommitApprovers**: This option only requires an Amazon Web Services account and a resource. It can be used for both IAM users and federated access users whose name matches the provided resource name. This is a very powerful option that offers a great deal of flexibility. For example, if you specify the Amazon Web Services account *123456789012* and *Mary\\_Major*, all of the following are counted as approvals coming from that user:\n  \n  - An IAM user in the account (arn:aws:iam::*123456789012*:user/*Mary\\_Major*)\n  - A federated user identified in IAM as Mary\\_Major (arn:aws:sts::*123456789012*:federated-user/*Mary\\_Major*)\n  \n  This option does not recognize an active session of someone assuming the role of CodeCommitReview with a role session name of *Mary\\_Major* (arn:aws:sts::*123456789012*:assumed-role/CodeCommitReview/*Mary\\_Major*) unless you include a wildcard (\\*Mary\\_Major).\n- **Fully qualified ARN**: This option allows you to specify the fully qualified Amazon Resource Name (ARN) of the IAM user or role.\n\nFor more information about IAM ARNs, wildcards, and formats, see [IAM Identifiers](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html) in the *IAM User Guide*."
        approval-rule-template-description: The description of the approval rule template. Consider providing a description that explains what this template does and when it might be appropriate to associate it with repositories.
        approval-rule-template-name: The name of the approval rule template. Provide descriptive names, because this name is applied to the approval rules created automatically in associated repositories.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
