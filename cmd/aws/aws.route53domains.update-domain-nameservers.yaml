name: update-domain-nameservers
description: This operation replaces the current set of name servers for the domain with the specified set of name servers.
flags:
    --domain-name=!: The name of the domain that you want to change name servers for.
    --fiauth-key=: The authorization key for .fi domains
    --nameservers=!: A list of new name servers for the domain.
documentation:
    command: |-
        This operation replaces the current set of name servers for the domain with the specified set of name servers. If you use Amazon Route 53 as your DNS service, specify the four name servers in the delegation set for the hosted zone for the domain.

        If successful, this operation returns an operation ID that you can use to track the progress and completion of the action. If the request is not completed successfully, the domain registrant will be notified by email.
    flag:
        domain-name: The name of the domain that you want to change name servers for.
        fiauth-key: The authorization key for .fi domains
        nameservers: A list of new name servers for the domain.
