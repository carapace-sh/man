name: create-user
description: Creates a user within the specified identity store.
flags:
    --addresses=: A list of `Address` objects containing addresses associated with the user.
    --birthdate=: The user's birthdate in YYYY-MM-DD format.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --display-name=: A string containing the name of the user.
    --emails=: A list of `Email` objects containing email addresses associated with the user.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identity-store-id=!: The globally unique identifier for the identity store.
    --locale=: A string containing the geographical region or location of the user.
    --name=: An object containing the name of the user.
    --nick-name=: A string containing an alternate name for the user.
    --phone-numbers=: A list of `PhoneNumber` objects containing phone numbers associated with the user.
    --photos=: A list of photos associated with the user.
    --preferred-language=: A string containing the preferred language of the user.
    --profile-url=: A string containing a URL that might be associated with the user.
    --timezone=: A string containing the time zone of the user.
    --title=: A string containing the title of the user.
    --user-name=: A unique string used to identify the user.
    --user-type=: A string indicating the type of user.
    --website=: The user's personal website or blog URL.
documentation:
    command: Creates a user within the specified identity store.
    flag:
        addresses: A list of `Address` objects containing addresses associated with the user.
        birthdate: The user's birthdate in YYYY-MM-DD format. This field supports standard date format for storing personal information.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        display-name: A string containing the name of the user. This value is typically formatted for display when the user is referenced. For example, "John Doe." When used in IAM Identity Center, this parameter is required.
        emails: A list of `Email` objects containing email addresses associated with the user.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        identity-store-id: The globally unique identifier for the identity store.
        locale: A string containing the geographical region or location of the user.
        name: An object containing the name of the user. When used in IAM Identity Center, this parameter is required.
        nick-name: A string containing an alternate name for the user.
        phone-numbers: A list of `PhoneNumber` objects containing phone numbers associated with the user.
        photos: A list of photos associated with the user. You can add up to 3 photos per user. Each photo can include a value, type, display name, and primary designation.
        preferred-language: A string containing the preferred language of the user. For example, "American English" or "en-us."
        profile-url: A string containing a URL that might be associated with the user.
        timezone: A string containing the time zone of the user.
        title: A string containing the title of the user. Possible values are left unspecified. The value can vary based on your specific use case.
        user-name: A unique string used to identify the user. The length limit is 128 characters. This value can consist of letters, accented characters, symbols, numbers, and punctuation. This value is specified at the time the user is created and stored as an attribute of the user object in the identity store. `Administrator` and `AWSAdministrators` are reserved names and can't be used for users or groups.
        user-type: A string indicating the type of user. Possible values are left unspecified. The value can vary based on your specific use case.
        website: The user's personal website or blog URL. This field allows users to provide a link to their personal or professional website.
