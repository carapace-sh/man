name: delete-investigation-group
description: Deletes the specified investigation group from your account.
flags:
    --identifier=!: Specify either the name or the ARN of the investigation group that you want to delete.
documentation:
    command: Deletes the specified investigation group from your account. You can currently have one investigation group per Region in your account. After you delete an investigation group, you can later create a new investigation group in the same Region.
    flag:
        identifier: Specify either the name or the ARN of the investigation group that you want to delete.
