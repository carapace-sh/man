name: list-distributions-by-owned-resource
description: Lists the CloudFront distributions that are associated with the specified resource that you own.
flags:
    --marker=: Use this field when paginating results to indicate where to begin in your list of distributions.
    --max-items=: The maximum number of distributions to return.
    --resource-arn=!: The ARN of the CloudFront resource that you've shared with other Amazon Web Services accounts.
documentation:
    command: Lists the CloudFront distributions that are associated with the specified resource that you own.
    flag:
        marker: Use this field when paginating results to indicate where to begin in your list of distributions. The response includes distributions in the list that occur after the marker. To get the next page of the list, set this field's value to the value of `NextMarker` from the current page's response.
        max-items: The maximum number of distributions to return.
        resource-arn: The ARN of the CloudFront resource that you've shared with other Amazon Web Services accounts.
