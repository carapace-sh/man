name: create-key
description: Creates an Amazon Web Services Payment Cryptography key, a logical representation of a cryptographic key, that is unique in your account and Amazon Web Services Region.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --derive-key-usage=: The intended cryptographic usage of keys derived from the ECC key pair to be created.
    --enabled: Specifies whether to enable the key.
    --exportable!: Specifies whether the key is exportable from the service.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --key-attributes=!: The role of the key, the algorithm it supports, and the cryptographic operations allowed with the key.
    --key-check-value-algorithm=: The algorithm that Amazon Web Services Payment Cryptography uses to calculate the key check value (KCV).
    --no-enabled: Specifies whether to enable the key.
    --no-exportable!: Specifies whether the key is exportable from the service.
    --replication-regions=:
        nargs: -1
    --tags=:
        description: Assigns one or more tags to the Amazon Web Services Payment Cryptography key.
        nargs: -1
completion:
    flag:
        derive-key-usage:
            - TR31_B0_BASE_DERIVATION_KEY
            - TR31_C0_CARD_VERIFICATION_KEY
            - TR31_D0_SYMMETRIC_DATA_ENCRYPTION_KEY
            - TR31_E0_EMV_MKEY_APP_CRYPTOGRAMS
            - TR31_E1_EMV_MKEY_CONFIDENTIALITY
            - TR31_E2_EMV_MKEY_INTEGRITY
            - TR31_E4_EMV_MKEY_DYNAMIC_NUMBERS
            - TR31_E5_EMV_MKEY_CARD_PERSONALIZATION
            - TR31_E6_EMV_MKEY_OTHER
            - TR31_K0_KEY_ENCRYPTION_KEY
            - TR31_K1_KEY_BLOCK_PROTECTION_KEY
            - TR31_M3_ISO_9797_3_MAC_KEY
            - TR31_M1_ISO_9797_1_MAC_KEY
            - TR31_M6_ISO_9797_5_CMAC_KEY
            - TR31_M7_HMAC_KEY
            - TR31_P0_PIN_ENCRYPTION_KEY
            - TR31_P1_PIN_GENERATION_KEY
            - TR31_V1_IBM3624_PIN_VERIFICATION_KEY
            - TR31_V2_VISA_PIN_VERIFICATION_KEY
        key-check-value-algorithm:
            - CMAC
            - ANSI_X9_24
            - HMAC
            - SHA_1
documentation:
    command: |-
        Creates an Amazon Web Services Payment Cryptography key, a logical representation of a cryptographic key, that is unique in your account and Amazon Web Services Region. You use keys for cryptographic functions such as encryption and decryption.

        In addition to the key material used in cryptographic operations, an Amazon Web Services Payment Cryptography key includes metadata such as the key ARN, key usage, key origin, creation date, description, and key state.

        When you create a key, you specify both immutable and mutable data about the key. The immutable data contains key attributes that define the scope and cryptographic operations that you can perform using the key, for example key class (example: `SYMMETRIC_KEY`), key algorithm (example: `TDES_2KEY`), key usage (example: `TR31_P0_PIN_ENCRYPTION_KEY`) and key modes of use (example: `Encrypt`). Amazon Web Services Payment Cryptography binds key attributes to keys using key blocks when you store or export them. Amazon Web Services Payment Cryptography stores the key contents wrapped and never stores or transmits them in the clear.

        For information about valid combinations of key attributes, see [Understanding key attributes](https://docs.aws.amazon.com/payment-cryptography/latest/userguide/keys-validattributes.html) in the *Amazon Web Services Payment Cryptography User Guide*. The mutable data contained within a key includes usage timestamp and key deletion timestamp and can be modified after creation.

        You can use the `CreateKey` operation to generate an ECC (Elliptic Curve Cryptography) key pair used for establishing an ECDH (Elliptic Curve Diffie-Hellman) key agreement between two parties. In the ECDH key agreement process, both parties generate their own ECC key pair with key usage K3 and exchange the public keys. Each party then use their private key, the received public key from the other party, and the key derivation parameters including key derivation function, hash algorithm, derivation data, and key algorithm to derive a shared key.

        To maintain the single-use principle of cryptographic keys in payments, ECDH derived keys should not be used for multiple purposes, such as a `TR31_P0_PIN_ENCRYPTION_KEY` and `TR31_K1_KEY_BLOCK_PROTECTION_KEY`. When creating ECC key pairs in Amazon Web Services Payment Cryptography you can optionally set the `DeriveKeyUsage` parameter, which defines the key usage bound to the symmetric key that will be derived using the ECC key pair.

        **Cross-account use**: This operation can't be used across different Amazon Web Services accounts.

        **Related operations:**

        - [DeleteKey](https://docs.aws.amazon.com/payment-cryptography/latest/APIReference/API_DeleteKey.html)
        - [GetKey](https://docs.aws.amazon.com/payment-cryptography/latest/APIReference/API_GetKey.html)
        - [ListKeys](https://docs.aws.amazon.com/payment-cryptography/latest/APIReference/API_ListKeys.html)
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        derive-key-usage: |-
            The intended cryptographic usage of keys derived from the ECC key pair to be created.

            After creating an ECC key pair, you cannot change the intended cryptographic usage of keys derived from it using ECDH.
        enabled: Specifies whether to enable the key. If the key is enabled, it is activated for use within the service. If the key is not enabled, then it is created but not activated. The default value is enabled.
        exportable: Specifies whether the key is exportable from the service.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        key-attributes: The role of the key, the algorithm it supports, and the cryptographic operations allowed with the key. This data is immutable after the key is created.
        key-check-value-algorithm: |-
            The algorithm that Amazon Web Services Payment Cryptography uses to calculate the key check value (KCV). It is used to validate the key integrity.

            For TDES keys, the KCV is computed by encrypting 8 bytes, each with value of zero, with the key to be checked and retaining the 3 highest order bytes of the encrypted result. For AES keys, the KCV is computed using a CMAC algorithm where the input data is 16 bytes of zero and retaining the 3 highest order bytes of the encrypted result.
        replication-regions: ""
        tags: |-
            Assigns one or more tags to the Amazon Web Services Payment Cryptography key. Use this parameter to tag a key when it is created. To tag an existing Amazon Web Services Payment Cryptography key, use the [TagResource](https://docs.aws.amazon.com/payment-cryptography/latest/APIReference/API_TagResource.html) operation.

            Each tag consists of a tag key and a tag value. Both the tag key and the tag value are required, but the tag value can be an empty (null) string. You can't have more than one tag on an Amazon Web Services Payment Cryptography key with the same tag key.

            Don't include personal, confidential or sensitive information in this field. This field may be displayed in plaintext in CloudTrail logs and other output.

            Tagging or untagging an Amazon Web Services Payment Cryptography key can allow or deny permission to the key.
