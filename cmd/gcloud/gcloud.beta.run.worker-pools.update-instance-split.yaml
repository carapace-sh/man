name: update-instance-split
description: '*(BETA)*  Adjust the instance assignments for a Cloud Run worker-pool.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --breakglass=: Justification to bypass Binary Authorization policy constraints and allow the operation.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-to-latest&: True to assign 100 percent of instances to the 'latest' revision of this service.
    --region=: The Cloud region for the WorkerPool.
    --to-latest: True to assign 100 percent of instances to the 'latest' revision of this service.
    --to-revisions=: Comma separated list of instance assignments in the form REVISION-NAME=PERCENTAGE.
documentation:
    command: |
        *(BETA)*  Adjust the instance assignments for a Cloud Run worker-pool.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        breakglass: Justification to bypass Binary Authorization policy constraints and allow the operation. See https://cloud.google.com/binary-authorization/docs/using-breakglass for more information. Next update or deploy command will automatically clear existing breakglass justification.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-to-latest: True to assign 100 percent of instances to the 'latest' revision of this service. Note that when a new revision is created, it will become the 'latest' and instances will be fully assigned to it unless configured otherwise using `--[no-]promote` flag. Defaults to False. Synonymous with '--to-revisions=LATEST=100'.
        region: |-
            The Cloud region for the WorkerPool. Overrides the default `run/region` property value for this command invocation.
            +
            To set the `region` attribute:
            * provide the argument `WORKER_POOL` on the command line with a fully specified name;
            * specify the workerpool name from an interactive prompt with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `run/region`;
            * specify the region from an interactive prompt.
        to-latest: True to assign 100 percent of instances to the 'latest' revision of this service. Note that when a new revision is created, it will become the 'latest' and instances will be fully assigned to it unless configured otherwise using `--[no-]promote` flag. Defaults to False. Synonymous with '--to-revisions=LATEST=100'.
        to-revisions: Comma separated list of instance assignments in the form REVISION-NAME=PERCENTAGE. REVISION-NAME must be the name for a revision for the worker as returned by 'gcloud run workers revisions list --worker=WORKER' . PERCENTAGE must be an integer percentage between 0 and 100 inclusive.  Ex worker-nw9hs=10,worker-nw9hs=20 Up to 100 percent of instances may be assigned. If the total of 100 percent of instances is assigned, the Worker instance split is updated as specified. If under 100 percent of instance split is assigned, the Worker instance split is updated as specified for revisions with assignments and instance split is scaled up or down proportionally as needed for revision that are currently serving workload but that do not have new assignments. For example assume revision-1 is serving 40 percent of workload and revision-2 is serving 60 percent. If revision-1 is assigned 45 percent of instances and no assignment is made for revision-2, the worker is updated with revsion-1 assigned 45 percent of instances and revision-2 scaled down to 55 percent. You can use "LATEST" as a special revision name to always put the given percentage of instance split on the latest ready revision.
