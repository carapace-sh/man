name: list-apps
description: Lists your Resilience Hub applications.
flags:
    --app-arn=: Amazon Resource Name (ARN) of the Resilience Hub application.
    --aws-application-arn=: Amazon Resource Name (ARN) of Resource Groups group that is integrated with an AppRegistry application.
    --from-last-assessment-time=: Lower limit of the range that is used to filter applications based on their last assessment times.
    --max-results=: Maximum number of results to include in the response.
    --name=: The name for the one of the listed applications.
    --next-token=: Null, or the token from a previous call to get the next set of results.
    --reverse-order=: The application list is sorted based on the values of `lastAppComplianceEvaluationTime` field.
    --to-last-assessment-time=: Upper limit of the range that is used to filter the applications based on their last assessment times.
documentation:
    command: |-
        Lists your Resilience Hub applications.

        You can filter applications using only one filter at a time or without using any filter. If you try to filter applications using multiple filters, you will get the following error:

        `An error occurred (ValidationException) when calling the ListApps operation: Only one filter is supported for this operation.`
    flag:
        app-arn: 'Amazon Resource Name (ARN) of the Resilience Hub application. The format for this ARN is: arn:`partition`:resiliencehub:`region`:`account`:app/`app-id`. For more information about ARNs, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference* guide.'
        aws-application-arn: Amazon Resource Name (ARN) of Resource Groups group that is integrated with an AppRegistry application. For more information about ARNs, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference* guide.
        from-last-assessment-time: Lower limit of the range that is used to filter applications based on their last assessment times.
        max-results: Maximum number of results to include in the response. If more results exist than the specified `MaxResults` value, a token is included in the response so that the remaining results can be retrieved.
        name: The name for the one of the listed applications.
        next-token: Null, or the token from a previous call to get the next set of results.
        reverse-order: The application list is sorted based on the values of `lastAppComplianceEvaluationTime` field. By default, application list is sorted in ascending order. To sort the application list in descending order, set this field to `True`.
        to-last-assessment-time: Upper limit of the range that is used to filter the applications based on their last assessment times.
