name: create
description: Create an Immersive Stream for XR service instance.
flags:
    --add-region=!: Flag used to specify region and capacity required for the service instance's availability.
    --async: Return immediately, without waiting for the operation in progress to
    --content=!: ID of the content or fully qualified identifier for the content.
    --fallback-url=: Fallback url to redirect users to when this service instance is unable to provide the streaming experience
    --gpu-class=: The class of GPU that is used by this service instance
    --location=: Google Cloud location for the content.
    --mode=: The rendering mode that is supported by this service instance
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: Create an Immersive Stream for XR service instance.
    flag:
        add-region: |-
            Flag used to specify region and capacity required for the service instance's availability.
            +
              'region' is the region in which the instance is deployed.
            +
              'capacity' is the maxium number of concurrent streaming sessions that the instance can support in the given region.
            +
            This is a repeatable flag.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        content: |-
            ID of the content or fully qualified identifier for the content.
            +
            To set the `name` attribute:
            * provide the argument `--content` on the command line.
        fallback-url: Fallback url to redirect users to when this service instance is unable to provide the streaming experience
        gpu-class: The class of GPU that is used by this service instance
        location: |-
            Google Cloud location for the content.
            +
            To set the `location` attribute:
            * provide the argument `--content` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * location is always global.
        mode: The rendering mode that is supported by this service instance
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
