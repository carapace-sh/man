name: update-mlflow-tracking-server
description: Updates properties of an existing MLflow Tracking Server.
flags:
    --artifact-store-uri=: The new S3 URI for the general purpose bucket to use as the artifact store for the MLflow Tracking Server.
    --automatic-model-registration: Whether to enable or disable automatic registration of new MLflow models to the SageMaker Model Registry.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-automatic-model-registration: Whether to enable or disable automatic registration of new MLflow models to the SageMaker Model Registry.
    --tracking-server-name=!: The name of the MLflow Tracking Server to update.
    --tracking-server-size=: The new size for the MLflow Tracking Server.
    --weekly-maintenance-window-start=: The new weekly maintenance window start day and time to update.
completion:
    flag:
        tracking-server-size:
            - Small
            - Medium
            - Large
documentation:
    command: Updates properties of an existing MLflow Tracking Server.
    flag:
        artifact-store-uri: The new S3 URI for the general purpose bucket to use as the artifact store for the MLflow Tracking Server.
        automatic-model-registration: Whether to enable or disable automatic registration of new MLflow models to the SageMaker Model Registry. To enable automatic model registration, set this value to `True`. To disable automatic model registration, set this value to `False`. If not specified, `AutomaticModelRegistration` defaults to `False`
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        tracking-server-name: The name of the MLflow Tracking Server to update.
        tracking-server-size: The new size for the MLflow Tracking Server.
        weekly-maintenance-window-start: 'The new weekly maintenance window start day and time to update. The maintenance window day and time should be in Coordinated Universal Time (UTC) 24-hour standard time. For example: TUE:03:30.'
