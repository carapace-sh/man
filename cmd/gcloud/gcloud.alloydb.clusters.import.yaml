name: import
description: Import data into an AlloyDB cluster from Google Cloud Storage.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --columns=: Comma-separated list of column names to be used for import.
    --csv!: Specify source file type.
    --database=: Database name.
    --escape-character=: Escape character in the source file.
    --field-delimiter=: Field delimiter in the source file.
    --gcs-uri=: Path to the Google Cloud Storage file from which import has to be done.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-csv!&: Specify source file type.
    --no-sql!&: Specify source file type.
    --quote-character=: Quote character in the source file.
    --region=!: Regional location (e.g. `asia-east1`, `us-east1`).
    --sql!: Specify source file type.
    --table=!: Table name to which the data has to be imported.
    --user=: Database user for the import.
documentation:
    command: Import data into an AlloyDB cluster from Google Cloud Storage.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        columns: Comma-separated list of column names to be used for import.
        csv: Specify source file type.
        database: Database name.
        escape-character: Escape character in the source file.
        field-delimiter: Field delimiter in the source file.
        gcs-uri: Path to the Google Cloud Storage file from which import has to be done.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-csv: Specify source file type.
        no-sql: Specify source file type.
        quote-character: Quote character in the source file.
        region: Regional location (e.g. `asia-east1`, `us-east1`). See the full list of regions at https://cloud.google.com/sql/docs/instance-locations.
        sql: Specify source file type.
        table: Table name to which the data has to be imported.
        user: Database user for the import.
