name: get-invoice-unit
description: This retrieves the invoice unit definition.
flags:
    --as-of=: The state of an invoice unit at a specified time.
    --invoice-unit-arn=!: The ARN to identify an invoice unit.
documentation:
    command: This retrieves the invoice unit definition.
    flag:
        as-of: The state of an invoice unit at a specified time. You can see legacy invoice units that are currently deleted if the `AsOf` time is set to before it was deleted. If an `AsOf` is not provided, the default value is the current time.
        invoice-unit-arn: The ARN to identify an invoice unit. This information can't be modified or deleted.
