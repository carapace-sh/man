name: describe
description: Show the metadata for a Backup and DR backup vault.
flags:
    --location=: The location of the Backup Vault.
documentation:
    command: Show the metadata for a Backup and DR backup vault.
    flag:
        location: |-
            The location of the Backup Vault.
            +
            To set the `location` attribute:
            * provide the argument `backup_vault` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
