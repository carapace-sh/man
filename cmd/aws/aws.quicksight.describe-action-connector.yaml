name: describe-action-connector
description: Retrieves detailed information about an action connector, including its configuration, authentication settings, enabled actions, and current status.
flags:
    --action-connector-id=!: The unique identifier of the action connector to describe.
    --aws-account-id=!: The Amazon Web Services account ID that contains the action connector.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
