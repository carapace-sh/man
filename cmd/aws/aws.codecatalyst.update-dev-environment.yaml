name: update-dev-environment
description: Changes one or more values for a Dev Environment.
flags:
    --alias=: The user-specified alias for the Dev Environment.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A user-specified idempotency token.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --id=!: The system-generated unique ID of the Dev Environment.
    --ides=:
        description: Information about the integrated development environment (IDE) configured for a Dev Environment.
        nargs: -1
    --inactivity-timeout-minutes=: The amount of time the Dev Environment will run without any activity detected before stopping, in minutes.
    --instance-type=: The Amazon EC2 instace type to use for the Dev Environment.
    --project-name=!: The name of the project in the space.
    --space-name=!: The name of the space.
completion:
    flag:
        instance-type:
            - dev.standard1.small
            - dev.standard1.medium
            - dev.standard1.large
            - dev.standard1.xlarge
documentation:
    command: Changes one or more values for a Dev Environment. Updating certain values of the Dev Environment will cause a restart.
    flag:
        alias: The user-specified alias for the Dev Environment. Changing this value will not cause a restart.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A user-specified idempotency token. Idempotency ensures that an API request completes only once. With an idempotent request, if the original request completes successfully, the subsequent retries return the result from the original successful request and have no additional effect.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        id: The system-generated unique ID of the Dev Environment.
        ides: Information about the integrated development environment (IDE) configured for a Dev Environment.
        inactivity-timeout-minutes: |-
            The amount of time the Dev Environment will run without any activity detected before stopping, in minutes. Only whole integers are allowed. Dev Environments consume compute minutes when running.

            Changing this value will cause a restart of the Dev Environment if it is running.
        instance-type: |-
            The Amazon EC2 instace type to use for the Dev Environment.

            Changing this value will cause a restart of the Dev Environment if it is running.
        project-name: The name of the project in the space.
        space-name: The name of the space.
