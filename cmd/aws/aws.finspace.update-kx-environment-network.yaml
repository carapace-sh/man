name: update-kx-environment-network
description: Updates environment network to connect to your internal network by using a transit gateway.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A token that ensures idempotency.
    --custom-dns-configuration=: A list of DNS server name and server IP.
    --environment-id=!: A unique identifier for the kdb environment.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --transit-gateway-configuration=: Specifies the transit gateway and network configuration to connect the kdb environment to an internal network.
documentation:
    command: |-
        Updates environment network to connect to your internal network by using a transit gateway. This API supports request to create a transit gateway attachment from FinSpace VPC to your transit gateway ID and create a custom Route-53 outbound resolvers.

        Once you send a request to update a network, you cannot change it again. Network update might require termination of any clusters that are running in the existing network.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A token that ensures idempotency. This token expires in 10 minutes.
        custom-dns-configuration: A list of DNS server name and server IP. This is used to set up Route-53 outbound resolvers.
        environment-id: A unique identifier for the kdb environment.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        transit-gateway-configuration: Specifies the transit gateway and network configuration to connect the kdb environment to an internal network.
