name: list-tags
description: Lists the tags, if any, that are associated with your private CA or one that has been shared with you.
flags:
    --certificate-authority-arn=!: The Amazon Resource Name (ARN) that was returned when you called the [CreateCertificateAuthority](https://docs.aws.amazon.com/privateca/latest/APIReference/API_CreateCertificateAuthority.html) action.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: Use this parameter when paginating results to specify the maximum number of items to return in the response.
    --next-token=: Use this parameter when paginating results in a subsequent request after you receive a response with truncated results.
    --page-size=: The size of each page to get in the AWS service call.
    --starting-token=: A token to specify where to start paginating.
documentation:
    command: Lists the tags, if any, that are associated with your private CA or one that has been shared with you. Tags are labels that you can use to identify and organize your CAs. Each tag consists of a key and an optional value. Call the [TagCertificateAuthority](https://docs.aws.amazon.com/privateca/latest/APIReference/API_TagCertificateAuthority.html) action to add one or more tags to your CA. Call the [UntagCertificateAuthority](https://docs.aws.amazon.com/privateca/latest/APIReference/API_UntagCertificateAuthority.html) action to remove tags.
    flag:
        certificate-authority-arn: |-
            The Amazon Resource Name (ARN) that was returned when you called the [CreateCertificateAuthority](https://docs.aws.amazon.com/privateca/latest/APIReference/API_CreateCertificateAuthority.html) action. This must be of the form:

            `arn:aws:acm-pca:region:account:certificate-authority/12345678-1234-1234-1234-123456789012`
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: Use this parameter when paginating results to specify the maximum number of items to return in the response. If additional items exist beyond the number you specify, the **NextToken** element is sent in the response. Use this **NextToken** value in a subsequent request to retrieve additional items.
        next-token: Use this parameter when paginating results in a subsequent request after you receive a response with truncated results. Set it to the value of **NextToken** from the response you just received.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
