    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --id=!: The ID of the step you want to delete.
    --step-group-id=!: The ID of the step group that contains the step you want to delete.
    --workflow-id=!: The ID of the migration workflow.
documentation:
    command: Delete a step in a migration workflow. Pause the workflow to delete a running step.
