name: update
description: '*(BETA)*  Update a Binary Authorization platform policy.'
flags:
    --platform=: The platform that the policy belongs to.
    --policy-file=!: The JSON or YAML file containing the new policy.
documentation:
    command: |-
        ## EXAMPLES

        To update an existing policy using its resource name:

          $ gcloud beta container binauthz policy update projects/my_proj/platforms/gke/policies/policy1 --policy-file=policy1.json

        To update the same policy using flags:

          $ gcloud beta container binauthz policy update policy1 --platform=gke --project=my_proj --policy-file=policy1.json
    flag:
        platform: |-
            The platform that the policy belongs to. PLATFORM must be one of the following: cloudRun, gke.
            +
            To set the `platform` attribute:
            * provide the argument `policy_resource_name` on the command line with a fully specified name;
            * provide the argument `--platform` on the command line.
        policy-file: The JSON or YAML file containing the new policy.
