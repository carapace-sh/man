name: create-data-set
description: Creates a dataset.
flags:
    --aws-account-id=!: The Amazon Web Services account ID.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --column-groups=: Groupings of columns that work together in certain QuickSight features.
    --column-level-permission-rules=: A set of one or more definitions of a `ColumnLevelPermissionRule`.
    --data-set-id=!: An ID for the dataset that you want to create.
    --data-set-usage-configuration=: ""
    --dataset-parameters=: The parameter declarations of the dataset.
    --field-folders=: The folder that contains fields and nested subfolders for your dataset.
    --folder-arns=: When you create the dataset, QuickSight adds the dataset to these folders.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --import-mode=!: Indicates whether you want to import the data into SPICE.
    --logical-table-map=: Configures the combination and transformation of the data from the physical tables.
    --name=!: The display name for the dataset.
    --performance-configuration=: The configuration for the performance optimization of the dataset that contains a `UniqueKey` configuration.
    --permissions=: A list of resource permissions on the dataset.
    --physical-table-map=!: Declares the physical tables that are available in the underlying data sources.
    --row-level-permission-data-set=: The row-level security configuration for the data that you want to create.
    --row-level-permission-tag-configuration=: The configuration of tags on a dataset to set row-level security.
    --tags=: Contains a map of the key-value pairs for the resource tag or tags assigned to the dataset.
    --use-as=: The usage of the dataset.
completion:
    flag:
        import-mode:
            - SPICE
            - DIRECT_QUERY
        use-as:
            - RLS_RULES
documentation:
    command: Creates a dataset. This operation doesn't support datasets that include uploaded files as a source.
    flag:
        aws-account-id: The Amazon Web Services account ID.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        column-groups: Groupings of columns that work together in certain QuickSight features. Currently, only geospatial hierarchy is supported.
        column-level-permission-rules: A set of one or more definitions of a `ColumnLevelPermissionRule`.
        data-set-id: An ID for the dataset that you want to create. This ID is unique per Amazon Web Services Region for each Amazon Web Services account.
        data-set-usage-configuration: ""
        dataset-parameters: The parameter declarations of the dataset.
        field-folders: The folder that contains fields and nested subfolders for your dataset.
        folder-arns: When you create the dataset, QuickSight adds the dataset to these folders.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        import-mode: Indicates whether you want to import the data into SPICE.
        logical-table-map: Configures the combination and transformation of the data from the physical tables.
        name: The display name for the dataset.
        performance-configuration: The configuration for the performance optimization of the dataset that contains a `UniqueKey` configuration.
        permissions: A list of resource permissions on the dataset.
        physical-table-map: Declares the physical tables that are available in the underlying data sources.
        row-level-permission-data-set: The row-level security configuration for the data that you want to create.
        row-level-permission-tag-configuration: The configuration of tags on a dataset to set row-level security. Row-level security tags are currently supported for anonymous embedding only.
        tags: Contains a map of the key-value pairs for the resource tag or tags assigned to the dataset.
        use-as: The usage of the dataset. `RLS_RULES` must be specified for RLS permission datasets.
