name: update-billing-group
description: Updates information about the billing group.
flags:
    --billing-group-name=!: The name of the billing group.
    --billing-group-properties=!: The properties of the billing group.
    --expected-version=: The expected version of the billing group.
documentation:
    command: |-
        Updates information about the billing group.

        Requires permission to access the [UpdateBillingGroup](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        billing-group-name: The name of the billing group.
        billing-group-properties: The properties of the billing group.
        expected-version: The expected version of the billing group. If the version of the billing group does not match the expected version specified in the request, the `UpdateBillingGroup` request is rejected with a `VersionConflictException`.
