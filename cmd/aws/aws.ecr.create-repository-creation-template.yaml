name: create-repository-creation-template
description: Creates a repository creation template.
flags:
    --applied-for=!: A list of enumerable strings representing the Amazon ECR repository creation scenarios that this template will apply towards.
    --custom-role-arn=: The ARN of the role to be assumed by Amazon ECR.
    --description=: A description for the repository creation template.
    --encryption-configuration=: The encryption configuration to use for repositories created using the template.
    --image-tag-mutability-exclusion-filters=: Creates a repository creation template with a list of filters that define which image tags can override the default image tag mutability setting.
    --image-tag-mutability=: The tag mutability setting for the repository.
    --lifecycle-policy=: The lifecycle policy to use for repositories created using the template.
    --prefix=!: The repository namespace prefix to associate with the template.
    --repository-policy=: The repository policy to apply to repositories created using the template.
    --resource-tags=: The metadata to apply to the repository to help you categorize and organize.
completion:
    flag:
        image-tag-mutability:
            - MUTABLE
            - IMMUTABLE
            - IMMUTABLE_WITH_EXCLUSION
            - MUTABLE_WITH_EXCLUSION
documentation:
    command: Creates a repository creation template. This template is used to define the settings for repositories created by Amazon ECR on your behalf. For example, repositories created through pull through cache actions. For more information, see [Private repository creation templates](https://docs.aws.amazon.com/AmazonECR/latest/userguide/repository-creation-templates.html) in the *Amazon Elastic Container Registry User Guide*.
    flag:
        applied-for: A list of enumerable strings representing the Amazon ECR repository creation scenarios that this template will apply towards. The two supported scenarios are `PULL_THROUGH_CACHE` and `REPLICATION`
        custom-role-arn: The ARN of the role to be assumed by Amazon ECR. This role must be in the same account as the registry that you are configuring. Amazon ECR will assume your supplied role when the customRoleArn is specified. When this field isn't specified, Amazon ECR will use the service-linked role for the repository creation template.
        description: A description for the repository creation template.
        encryption-configuration: The encryption configuration to use for repositories created using the template.
        image-tag-mutability: The tag mutability setting for the repository. If this parameter is omitted, the default setting of `MUTABLE` will be used which will allow image tags to be overwritten. If `IMMUTABLE` is specified, all image tags within the repository will be immutable which will prevent them from being overwritten.
        image-tag-mutability-exclusion-filters: Creates a repository creation template with a list of filters that define which image tags can override the default image tag mutability setting.
        lifecycle-policy: The lifecycle policy to use for repositories created using the template.
        prefix: |-
            The repository namespace prefix to associate with the template. All repositories created using this namespace prefix will have the settings defined in this template applied. For example, a prefix of `prod` would apply to all repositories beginning with `prod/`. Similarly, a prefix of `prod/team` would apply to all repositories beginning with `prod/team/`.

            To apply a template to all repositories in your registry that don't have an associated creation template, you can use `ROOT` as the prefix.

            There is always an assumed `/` applied to the end of the prefix. If you specify `ecr-public` as the prefix, Amazon ECR treats that as `ecr-public/`. When using a pull through cache rule, the repository prefix you specify during rule creation is what you should specify as your repository creation template prefix as well.
        repository-policy: The repository policy to apply to repositories created using the template. A repository policy is a permissions policy associated with a repository to control access permissions.
        resource-tags: The metadata to apply to the repository to help you categorize and organize. Each tag consists of a key and an optional value, both of which you define. Tag keys can have a maximum character length of 128 characters, and tag values can have a maximum length of 256 characters.
