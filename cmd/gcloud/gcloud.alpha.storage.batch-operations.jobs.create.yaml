name: create
description: '*(ALPHA)*  Create a new batch operation job.'
flags:
    --bucket=!: Bucket containing the objects that the batch job will operate on.
    --delete-object!: If this flag is set, objects specified in source will be deleted.
    --description=: Description for the batch job.
    --dry-run&: If true, the job will run in dry run mode, returning the total object count and, if the object configuration is a prefix list, the bytes found from source.
    --enable-permanent-object-deletion: If this flag is set and versioning is enabled on the buckets, both live and noncurrent objects will be permanently deleted.
    --included-object-prefixes=: A comma-separated list of object prefixes to describe the objects being transformed.
    --log-action-states=: The states in which the actions specified in --log-actions are logged.
    --log-actions=: Define the batch job actions to report in logs.
    --manifest-location=: An absolute path to the manifest source file in a Google Cloud Storage bucket.
    --no-delete-object!&: If this flag is set, objects specified in source will be deleted.
    --no-dry-run&: If true, the job will run in dry run mode, returning the total object count and, if the object configuration is a prefix list, the bytes found from source.
    --no-enable-permanent-object-deletion&: If this flag is set and versioning is enabled on the buckets, both live and noncurrent objects will be permanently deleted.
    --no-put-object-event-based-hold&: Sets or unsets object event based holds state.
    --no-put-object-temporary-hold&: Sets or unsets object temporary holds state.
    --put-metadata=: Sets object metadata.
    --put-object-event-based-hold: Sets or unsets object event based holds state.
    --put-object-temporary-hold: Sets or unsets object temporary holds state.
    --rewrite-object=: Rewrites object and the specified metadata.
documentation:
    command: |
        *(ALPHA)*  Create a batch operation job, allowing you to perform operations
        such as deletion, updating metadata, and more on objects in a
        serverless manner.
    flag:
        bucket: Bucket containing the objects that the batch job will operate on.
        delete-object: If this flag is set, objects specified in source will be deleted. When versioning is enabled on the buckets, live objects in versioned buckets will become noncurrent and objects that were already noncurrent will be skipped.
        description: Description for the batch job.
        dry-run: If true, the job will run in dry run mode, returning the total object count and, if the object configuration is a prefix list, the bytes found from source. No transformations will be performed.
        enable-permanent-object-deletion: If this flag is set and versioning is enabled on the buckets, both live and noncurrent objects will be permanently deleted.
        included-object-prefixes: A comma-separated list of object prefixes to describe the objects being transformed. An empty string means all objects in the bucket.
        log-action-states: 'The states in which the actions specified in --log-actions are logged. Separate multiple states with a comma, omitting the space after the comma (e.g., --log-action-states=succeeded,failed). _LOG_ACTION_STATES_ must be one of: *failed*, *succeeded*.'
        log-actions: 'Define the batch job actions to report in logs. (e.g., --log-actions=transform). _LOG_ACTIONS_ must be (only one value is supported): *transform*.'
        manifest-location: 'An absolute path to the manifest source file in a Google Cloud Storage bucket. The file must be a CSV file where each row specifies the object details i.e. ProjectId, BucketId, and Name. Generation may optionally be specified. When generation is not specified, the live object is acted upon. Format: `--manifest-location=gs://bucket_name/path/manifest_name.csv`'
        no-delete-object: If this flag is set, objects specified in source will be deleted. When versioning is enabled on the buckets, live objects in versioned buckets will become noncurrent and objects that were already noncurrent will be skipped.
        no-dry-run: If true, the job will run in dry run mode, returning the total object count and, if the object configuration is a prefix list, the bytes found from source. No transformations will be performed.
        no-enable-permanent-object-deletion: If this flag is set and versioning is enabled on the buckets, both live and noncurrent objects will be permanently deleted.
        no-put-object-event-based-hold: Sets or unsets object event based holds state. When object event based hold is set, object cannot be deleted or replaced
        no-put-object-temporary-hold: Sets or unsets object temporary holds state. When object temporary hold is set, object cannot be deleted or replaced.
        put-metadata: Sets object metadata. To set how content should be displayed, specify the the key-value pair `Content-Disposition={VALUE}.` To set how content is encoded (e.g. "gzip"), specify the key-value pair `Content-Encoding={VALUE}`. To set content's language (e.g. "en" signifies "English"), specify the key-value pair `Content-Language={VALUE}`. To set the type of data contained in the object (e.g. "text/html"), specify the key-value pair `Content-Type={VALUE}`. To set how caches should handle requests and responses, specify the key-value pair `Cache-Control={VALUE}`. To set custom time for Cloud Storage objects in RFC 3339 format, specify the key-value pair `Custom-Time={VALUE}`. To set object retention, specify `Retain-Until={TIMESTAMP}` in RFC 3339 format and `Retention-Mode={MODE}` where mode can be `Locked` or `Unlocked`. To set custom metadata on objects, specify key-value pairs `{CUSTOM-KEY}:{VALUE}`. Note that all predefined keys (e.g. Content-Disposition) are case-insensitive. Any other key that is not specified above will be treated as a custom key. To clear a field, provide the key with an empty value (e.g. `Content-Disposition=`). Multiple key-value pairs can be specified by separating them with commas. For example, `--put-metadata=Content-Disposition=inline,Content-Encoding=gzip`
        put-object-event-based-hold: Sets or unsets object event based holds state. When object event based hold is set, object cannot be deleted or replaced. Use *--put-object-event-based-hold* to enable and *--no-put-object-event-based-hold* to disable.
        put-object-temporary-hold: Sets or unsets object temporary holds state. When object temporary hold is set, object cannot be deleted or replaced. Use *--put-object-temporary-hold* to enable and *--no-put-object-temporary-hold* to disable.
        rewrite-object: Rewrites object and the specified metadata. Currently only supports rewriting kms-key. A metadata field MUST be specified. For example, `--rewrite-object=kms-key=projects/PROJECT_ID/locations/LOCATION/keyRings/KEY_RING/cryptoKeys/CRYPTO_KEY` will rewrite the Cloud KMS key that will be used to encrypt the object.
