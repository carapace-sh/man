name: update-resource-policy
description: Replaces the existing resource policy for a bot or bot alias with a new one.
flags:
    --expected-revision-id=: The identifier of the revision of the policy to update.
    --policy=!: A resource policy to add to the resource.
    --resource-arn=!: The Amazon Resource Name (ARN) of the bot or bot alias that the resource policy is attached to.
documentation:
    command: Replaces the existing resource policy for a bot or bot alias with a new one. If the policy doesn't exist, Amazon Lex returns an exception.
    flag:
        expected-revision-id: |-
            The identifier of the revision of the policy to update. If this revision ID doesn't match the current revision ID, Amazon Lex throws an exception.

            If you don't specify a revision, Amazon Lex overwrites the contents of the policy with the new values.
        policy: |-
            A resource policy to add to the resource. The policy is a JSON structure that contains one or more statements that define the policy. The policy must follow the IAM syntax. For more information about the contents of a JSON policy document, see [IAM JSON policy reference](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies.html) .

            If the policy isn't valid, Amazon Lex returns a validation exception.
        resource-arn: The Amazon Resource Name (ARN) of the bot or bot alias that the resource policy is attached to.
