name: create
description: '*(ALPHA)*  Create a Cloud DNS managed-zone.'
flags:
    --denial-of-existence=: Requires DNSSEC enabled.
    --description=: Short description for the managed zone.
    --dns-name=!: The DNS name suffix that will be managed with the created zone.
    --dnssec-state=: The DNSSEC state for this managed zone.
    --forwarding-targets=: List of IPv4/IPv6 addresses or one domain name of the target name server that the zone will forward queries to.
    --gkeclusters=: List of GKE clusters that the zone should be visible in if the zone visibility is [private].
    --ksk-algorithm=: String mnemonic specifying the DNSSEC algorithm of the key-signing key.
    --ksk-key-length=: Length of the key-signing key in bits.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: Specifies the desired service location the request is sent to.
    --log-dns-queries: Specifies whether to enable query logging.
    --managed-reverse-lookup: Specifies whether this zone is a managed reverse lookup zone, required for Cloud DNS to correctly resolve Non-RFC1918 PTR records.
    --networks=: List of networks that the zone should be visible in if the zone visibility is [private].
    --no-log-dns-queries&: Specifies whether to enable query logging.
    --no-managed-reverse-lookup&: Specifies whether this zone is a managed reverse lookup zone, required for Cloud DNS to correctly resolve Non-RFC1918 PTR records.
    --private-forwarding-targets=: List of IPv4/IPv6 addresses or one domain name of the target name server that the zone will forward queries to.
    --service-directory-namespace=: The fully qualified URL of the service directory namespace that should be associated with the zone.
    --target-network=!: Network ID of the Google Compute Engine private network to forward queries to.
    --target-project=!: Project ID of the Google Compute Engine private network to forward queries to.
    --visibility=: Visibility of the zone.
    --zsk-algorithm=: String mnemonic specifying the DNSSEC algorithm of the key-signing key.
    --zsk-key-length=: Length of the zone-signing key in bits.
completion:
    flag:
        denial-of-existence:
            - nsec
            - nsec3
        dnssec-state:
            - "off"
            - "on"
            - transfer
        ksk-algorithm:
            - ecdsap256sha256
            - ecdsap384sha384
            - rsasha1
            - rsasha256
            - rsasha512
        visibility:
            - public
            - private
        zsk-algorithm:
            - ecdsap256sha256
            - ecdsap384sha384
            - rsasha1
            - rsasha256
            - rsasha512
documentation:
    command: |-
        *(ALPHA)*  This command creates a Cloud DNS managed-zone.

        ## EXAMPLES

        To create a managed-zone, run:

          $ gcloud alpha dns managed-zones create my-zone --dns-name=my.zone.com. --description="My zone!"

        To create a managed-zone with DNSSEC, run:

          $ gcloud alpha dns managed-zones create my-zone-2 --description="Signed Zone"
              --dns-name=myzone.example
              --dnssec-state=on

          To create a zonal managed-zone scoped to a GKE Cluster in us-east1-a, run:

          $ gcloud alpha dns managed-zones create my-zonal-zone --description="Signed Zone"
              --dns-name=cluster.local
              --visibility=private
              --gkeclusters=cluster1
              --location=us-east1-a
    flag:
        denial-of-existence: 'Requires DNSSEC enabled. _DENIAL_OF_EXISTENCE_ must be one of: *nsec*, *nsec3*.'
        description: Short description for the managed zone.
        dns-name: The DNS name suffix that will be managed with the created zone.
        dnssec-state: |-
            The DNSSEC state for this managed zone. _DNSSEC_STATE_ must be one of:
            +
            *off*::: Disable DNSSEC for the managed zone.
            *on*::: Enable DNSSEC for the managed zone.
            *transfer*::: Enable DNSSEC and allow transferring a signed zone in or out.
            :::
            +
        forwarding-targets: List of IPv4/IPv6 addresses or one domain name of the target name server that the zone will forward queries to. Ignored for `public` visibility. Non-RFC1918 addresses will forward to the target through the Internet. RFC1918 addresses will forward through the VPC.
        gkeclusters: List of GKE clusters that the zone should be visible in if the zone visibility is [private].
        ksk-algorithm: 'String mnemonic specifying the DNSSEC algorithm of the key-signing key. Requires DNSSEC enabled. _KSK_ALGORITHM_ must be one of: *ecdsap256sha256*, *ecdsap384sha384*, *rsasha1*, *rsasha256*, *rsasha512*.'
        ksk-key-length: Length of the key-signing key in bits. Requires DNSSEC enabled.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: Specifies the desired service location the request is sent to. Defaults to Cloud DNS global service. Use --location=global if you want to target the global service.
        log-dns-queries: Specifies whether to enable query logging. Defaults to False. Use *--log-dns-queries* to enable and *--no-log-dns-queries* to disable.
        managed-reverse-lookup: Specifies whether this zone is a managed reverse lookup zone, required for Cloud DNS to correctly resolve Non-RFC1918 PTR records.
        networks: List of networks that the zone should be visible in if the zone visibility is [private].
        no-log-dns-queries: Specifies whether to enable query logging. Defaults to False.
        no-managed-reverse-lookup: Specifies whether this zone is a managed reverse lookup zone, required for Cloud DNS to correctly resolve Non-RFC1918 PTR records.
        private-forwarding-targets: List of IPv4/IPv6 addresses or one domain name of the target name server that the zone will forward queries to. Ignored for `public` visibility. All addresses specified for this parameter will be reached through the VPC.
        service-directory-namespace: The fully qualified URL of the service directory namespace that should be associated with the zone. Ignored for `public` visibility zones.
        target-network: Network ID of the Google Compute Engine private network to forward queries to.
        target-project: Project ID of the Google Compute Engine private network to forward queries to.
        visibility: 'Visibility of the zone. Public zones are visible to the public internet. Private zones are only visible in your internal networks denoted by the `--networks` flag. _VISIBILITY_ must be one of: *public*, *private*.'
        zsk-algorithm: 'String mnemonic specifying the DNSSEC algorithm of the key-signing key. Requires DNSSEC enabled. _ZSK_ALGORITHM_ must be one of: *ecdsap256sha256*, *ecdsap384sha384*, *rsasha1*, *rsasha256*, *rsasha512*.'
        zsk-key-length: Length of the zone-signing key in bits. Requires DNSSEC enabled.
