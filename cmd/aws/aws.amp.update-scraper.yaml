name: update-scraper
description: Updates an existing scraper.
flags:
    --alias=: The new alias of the scraper.
    --client-token=: A unique identifier that you can provide to ensure the idempotency of the request.
    --destination=: The new Amazon Managed Service for Prometheus workspace to send metrics to.
    --role-configuration=: Use this structure to enable cross-account access, so that you can use a target account to access Prometheus metrics from source accounts.
    --scrape-configuration=: Contains the base-64 encoded YAML configuration for the scraper.
    --scraper-id=!: The ID of the scraper to update.
documentation:
    command: |-
        Updates an existing scraper.

        You can't use this function to update the source from which the scraper is collecting metrics. To change the source, delete the scraper and create a new one.
    flag:
        alias: The new alias of the scraper.
        client-token: A unique identifier that you can provide to ensure the idempotency of the request. Case-sensitive.
        destination: The new Amazon Managed Service for Prometheus workspace to send metrics to.
        role-configuration: Use this structure to enable cross-account access, so that you can use a target account to access Prometheus metrics from source accounts.
        scrape-configuration: |-
            Contains the base-64 encoded YAML configuration for the scraper.

            For more information about configuring a scraper, see [Using an Amazon Web Services managed collector](https://docs.aws.amazon.com/prometheus/latest/userguide/AMP-collector-how-to.html) in the *Amazon Managed Service for Prometheus User Guide*.
        scraper-id: The ID of the scraper to update.
