name: modify-listener
description: Replaces the specified properties of the specified listener.
flags:
    --alpn-policy=: \[TLS listeners] The name of the Application-Layer Protocol Negotiation (ALPN) policy.
    --certificates=: \[HTTPS and TLS listeners] The default certificate for the listener.
    --default-actions=: The actions for the default rule.
    --listener-arn=!: The Amazon Resource Name (ARN) of the listener.
    --mutual-authentication=: \[HTTPS listeners] The mutual authentication configuration information.
    --port=: The port for connections from clients to the load balancer.
    --protocol=: The protocol for connections from clients to the load balancer.
    --ssl-policy=: \[HTTPS and TLS listeners] The security policy that defines which protocols and ciphers are supported.
completion:
    flag:
        protocol:
            - HTTP
            - HTTPS
            - TCP
            - TLS
            - UDP
            - TCP_UDP
            - GENEVE
            - QUIC
            - TCP_QUIC
documentation:
    command: |-
        Replaces the specified properties of the specified listener. Any properties that you do not specify remain unchanged.

        Changing the protocol from HTTPS to HTTP, or from TLS to TCP, removes the security policy and default certificate properties. If you change the protocol from HTTP to HTTPS, or from TCP to TLS, you must add the security policy and default certificate properties.

        To add an item to a list, remove an item from a list, or update an item in a list, you must provide the entire list. For example, to add an action, specify a list with the current actions plus the new action.
    flag:
        alpn-policy: |-
            \[TLS listeners] The name of the Application-Layer Protocol Negotiation (ALPN) policy. You can specify one policy name. The following are the possible values:

            - `HTTP1Only`
            - `HTTP2Only`
            - `HTTP2Optional`
            - `HTTP2Preferred`
            - `None`

            For more information, see [ALPN policies](https://docs.aws.amazon.com/elasticloadbalancing/latest/network/load-balancer-listeners.html#alpn-policies) in the *Network Load Balancers Guide*.
        certificates: \[HTTPS and TLS listeners] The default certificate for the listener. You must provide exactly one certificate. Set `CertificateArn` to the certificate ARN but do not set `IsDefault`.
        default-actions: The actions for the default rule.
        listener-arn: The Amazon Resource Name (ARN) of the listener.
        mutual-authentication: \[HTTPS listeners] The mutual authentication configuration information.
        port: The port for connections from clients to the load balancer. You can't specify a port for a Gateway Load Balancer.
        protocol: The protocol for connections from clients to the load balancer. Application Load Balancers support the HTTP and HTTPS protocols. Network Load Balancers support the TCP, TLS, UDP, and TCP\_UDP protocols. You can’t change the protocol to UDP or TCP\_UDP if dual-stack mode is enabled. You can't specify a protocol for a Gateway Load Balancer.
        ssl-policy: |-
            \[HTTPS and TLS listeners] The security policy that defines which protocols and ciphers are supported.

            For more information, see [Security policies](https://docs.aws.amazon.com/elasticloadbalancing/latest/application/describe-ssl-policies.html) in the *Application Load Balancers Guide* or [Security policies](https://docs.aws.amazon.com/elasticloadbalancing/latest/network/describe-ssl-policies.html) in the *Network Load Balancers Guide*.
