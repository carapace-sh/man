name: get-unfiltered-partition-metadata
description: Retrieves partition metadata from the Data Catalog that contains unfiltered metadata.
flags:
    --audit-context=: A structure containing Lake Formation audit context information.
    --catalog-id=!: The catalog ID where the partition resides.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --database-name=!: (Required) Specifies the name of a database that contains the partition.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --partition-values=!: (Required) A list of partition key values.
    --query-session-context=: A structure used as a protocol between query engines and Lake Formation or Glue.
    --resource-region=: Specified only if the base tables belong to a different Amazon Web Services Region.
    --supported-permission-types=!: (Required) A list of supported permission types.
    --table-name=!: (Required) Specifies the name of a table that contains the partition.
documentation:
    command: |-
        Retrieves partition metadata from the Data Catalog that contains unfiltered metadata.

        For IAM authorization, the public IAM action associated with this API is `glue:GetPartition`.
    flag:
        audit-context: A structure containing Lake Formation audit context information.
        catalog-id: The catalog ID where the partition resides.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        database-name: (Required) Specifies the name of a database that contains the partition.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        partition-values: (Required) A list of partition key values.
        query-session-context: A structure used as a protocol between query engines and Lake Formation or Glue. Contains both a Lake Formation generated authorization identifier and information from the request's authorization context.
        resource-region: Specified only if the base tables belong to a different Amazon Web Services Region.
        supported-permission-types: (Required) A list of supported permission types.
        table-name: (Required) Specifies the name of a table that contains the partition.
