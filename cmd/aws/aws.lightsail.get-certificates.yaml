name: get-certificates
description: Returns information about one or more Amazon Lightsail SSL/TLS certificates.
flags:
    --certificate-name=: The name for the certificate for which to return information.
    --certificate-statuses=: The status of the certificates for which to return information.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --include-certificate-details: Indicates whether to include detailed information about the certificates in the response.
    --no-include-certificate-details: Indicates whether to include detailed information about the certificates in the response.
    --page-token=: The token to advance to the next page of results from your request.
documentation:
    command: |-
        Returns information about one or more Amazon Lightsail SSL/TLS certificates.

        To get a summary of a certificate, omit `includeCertificateDetails` from your request. The response will include only the certificate Amazon Resource Name (ARN), certificate name, domain name, and tags.
    flag:
        certificate-name: |-
            The name for the certificate for which to return information.

            When omitted, the response includes all of your certificates in the Amazon Web Services Region where the request is made.
        certificate-statuses: |-
            The status of the certificates for which to return information.

            For example, specify `ISSUED` to return only certificates with an `ISSUED` status.

            When omitted, the response includes all of your certificates in the Amazon Web Services Region where the request is made, regardless of their current status.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        include-certificate-details: |-
            Indicates whether to include detailed information about the certificates in the response.

            When omitted, the response includes only the certificate names, Amazon Resource Names (ARNs), domain names, and tags.
        page-token: |-
            The token to advance to the next page of results from your request.

            To get a page token, perform an initial `GetCertificates` request. If your results are paginated, the response will return a next page token that you can specify as the page token in a subsequent request.
