name: delete
description: '*(ALPHA)*  Delete Compute Engine networks.'
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute networks delete* deletes one or more Compute Engine
        networks. Networks can only be deleted when no other resources
        (e.g., virtual machine instances) refer to them.

        ## EXAMPLES

        To delete a network with the name 'network-name', run:

          $ gcloud alpha compute networks delete network-name

        To delete two networks with the names 'network-name1' and 'network-name2',
        run:

          $ gcloud alpha compute networks delete network-name1 network-name2
