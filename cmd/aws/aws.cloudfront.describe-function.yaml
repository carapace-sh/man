name: describe-function
description: Gets configuration information and metadata about a CloudFront function, but not the function's code.
flags:
    --name=!: The name of the function that you are getting information about.
    --stage=: The function's stage, either `DEVELOPMENT` or `LIVE`.
completion:
    flag:
        stage:
            - DEVELOPMENT
            - LIVE
documentation:
    command: |-
        Gets configuration information and metadata about a CloudFront function, but not the function's code. To get a function's code, use `GetFunction`.

        To get configuration information and metadata about a function, you must provide the function's name and stage. To get these values, you can use `ListFunctions`.
    flag:
        name: The name of the function that you are getting information about.
        stage: The function's stage, either `DEVELOPMENT` or `LIVE`.
