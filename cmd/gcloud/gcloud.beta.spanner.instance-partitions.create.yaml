name: create
description: '*(BETA)*  Create a Spanner instance partition.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --autoscaling-high-priority-cpu-target=&: Specifies the target percentage of high-priority CPU the autoscaled instance can utilize.
    --autoscaling-max-nodes=!&: Maximum number of nodes for the autoscaled instance.
    --autoscaling-max-processing-units=!&: Maximum number of processing units for the autoscaled instance.
    --autoscaling-min-nodes=!&: Minimum number of nodes for the autoscaled instance.
    --autoscaling-min-processing-units=!&: Minimum number of processing units for the autoscaled instance.
    --autoscaling-storage-target=!&: Specifies the target percentage of storage the autoscaled instance can utilize.
    --autoscaling-total-cpu-target=&: Specifies the target percentage of total CPU the autoscaled instance can utilize.
    --config=!: Instance configuration defines the geographic placement and replication used by the instance partition.
    --description=!: Description of the instance partition.
    --instance=: The Cloud Spanner instance for the instance partition.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --nodes=: Number of nodes for the instance partition.
    --processing-units=: Number of processing units for the instance partition.
documentation:
    command: '*(BETA)*  Create a Spanner instance partition.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        autoscaling-high-priority-cpu-target: Specifies the target percentage of high-priority CPU the autoscaled instance can utilize.
        autoscaling-max-nodes: Maximum number of nodes for the autoscaled instance.
        autoscaling-max-processing-units: Maximum number of processing units for the autoscaled instance.
        autoscaling-min-nodes: Minimum number of nodes for the autoscaled instance.
        autoscaling-min-processing-units: Minimum number of processing units for the autoscaled instance.
        autoscaling-storage-target: Specifies the target percentage of storage the autoscaled instance can utilize.
        autoscaling-total-cpu-target: Specifies the target percentage of total CPU the autoscaled instance can utilize.
        config: Instance configuration defines the geographic placement and replication used by the instance partition. Available configurations can be found by running "gcloud spanner instance-configs list"
        description: Description of the instance partition.
        instance: |-
            The Cloud Spanner instance for the instance partition.
            +
            To set the `instance` attribute:
            * provide the argument `instance_partition` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line;
            * set the property `spanner/instance`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        nodes: Number of nodes for the instance partition.
        processing-units: Number of processing units for the instance partition.
