name: delete-query-suggestions-block-list
description: Deletes a block list used for query suggestions for an index.
flags:
    --id=!: The identifier of the block list you want to delete.
    --index-id=!: The identifier of the index for the block list.
documentation:
    command: |-
        Deletes a block list used for query suggestions for an index.

        A deleted block list might not take effect right away. Amazon Kendra needs to refresh the entire suggestions list to add back the queries that were previously blocked.

        `DeleteQuerySuggestionsBlockList` is currently not supported in the Amazon Web Services GovCloud (US-West) region.
    flag:
        id: The identifier of the block list you want to delete.
        index-id: The identifier of the index for the block list.
