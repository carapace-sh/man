name: list-type-registrations
description: Returns a list of registration tokens for the specified extension(s).
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of results to be returned with a single call.
    --next-token=: If the previous paginated request didn't return all the remaining results, the response object's `NextToken` parameter value is set to a token.
    --registration-status-filter=: The current status of the extension registration request.
    --type-arn=: The Amazon Resource Name (ARN) of the extension.
    --type-name=: The name of the extension.
    --type=: The kind of extension.
completion:
    flag:
        registration-status-filter:
            - COMPLETE
            - IN_PROGRESS
            - FAILED
        type:
            - RESOURCE
            - MODULE
            - HOOK
documentation:
    command: Returns a list of registration tokens for the specified extension(s).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The maximum number of results to be returned with a single call. If the number of available results exceeds this maximum, the response includes a `NextToken` value that you can assign to the `NextToken` request parameter to get the next set of results.
        next-token: If the previous paginated request didn't return all the remaining results, the response object's `NextToken` parameter value is set to a token. To retrieve the next set of results, call this action again and assign that token to the request object's `NextToken` parameter. If there are no remaining results, the previous response object's `NextToken` parameter is set to `null`.
        registration-status-filter: |-
            The current status of the extension registration request.

            The default is `IN_PROGRESS`.
        type: |-
            The kind of extension.

            Conditional: You must specify either `TypeName` and `Type`, or `Arn`.
        type-arn: |-
            The Amazon Resource Name (ARN) of the extension.

            Conditional: You must specify either `TypeName` and `Type`, or `Arn`.
        type-name: |-
            The name of the extension.

            Conditional: You must specify either `TypeName` and `Type`, or `Arn`.
