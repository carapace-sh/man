name: update
description: '*(ALPHA)*  Updates a PolicyPorter resource.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --aws-mappings-principal-mapping=: Set aws_mappings_principal_mapping to new value.
    --aws-mappings-resource-mapping=: Set aws_mappings_resource_mapping to new value.
    --clear-aws-mappings-principal-mapping: Clear aws_mappings_principal_mapping value and set to empty map.
    --clear-aws-mappings-resource-mapping: Clear aws_mappings_resource_mapping value and set to empty map.
    --clear-labels: Clear labels value and set to empty map.
    --clear-policy-config: Set googleIamV3alphaPolicyPorter.policyConfig back to default value.
    --description=: Description about translation.
    --display-name=: An arbitrary user-provided name for policy porter.
    --inline-policy-json-content-from-file=: Content of the file containing policies in json format.
    --inline-policy-json-content=: Content of the file containing policies in json format.
    --inline-policy-json-file-name=: Name of file from which policy json got imported.
    --labels=: Set labels to new value.
    --location=: The location id of the policyPorter resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-aws-mappings-principal-mapping&: Clear aws_mappings_principal_mapping value and set to empty map.
    --no-clear-aws-mappings-resource-mapping&: Clear aws_mappings_resource_mapping value and set to empty map.
    --no-clear-labels&: Clear labels value and set to empty map.
    --no-clear-policy-config&: Set googleIamV3alphaPolicyPorter.policyConfig back to default value.
    --policy-config-source-cloud=: Type of source cloud from which policies are being translated.
    --remove-aws-mappings-principal-mapping=: Remove existing value from map aws_mappings_principal_mapping.
    --remove-aws-mappings-resource-mapping=: Remove existing value from map aws_mappings_resource_mapping.
    --remove-labels=: Remove existing value from map labels.
    --request-id=: An optional request ID to identify requests.
    --update-aws-mappings-principal-mapping=: Update aws_mappings_principal_mapping value or add key value pair.
    --update-aws-mappings-resource-mapping=: Update aws_mappings_resource_mapping value or add key value pair.
    --update-labels=: Update labels value or add key value pair.
completion:
    flag:
        policy-config-source-cloud:
            - aws
documentation:
    command: |
        *(ALPHA)*  Updates a PolicyPorter resource. It can be helpful to first Create a PolicyPorter resource
        to see the parsed Principal/Resource keys, and use them to update the mappings in this
        command.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        aws-mappings-principal-mapping: |-
            Set aws_mappings_principal_mapping to new value. User provided principal mapping for keys in `principal_keys` field.
            Keys format: [AWS JSON policy elements:
            Principal](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_principal.html).
            Values format: See [Members field in
            bindings](https://cloud.google.com/iam/docs/reference/rest/v1/Policy#binding).
            +
            *KEY*:::
            Sets `KEY` value.
            +
            *VALUE*:::
            Sets `VALUE` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --aws-mappings-principal-mapping=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --aws-mappings-principal-mapping='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --aws-mappings-principal-mapping=path_to_file.(yaml|json)
            +
            ```
        aws-mappings-resource-mapping: |-
            Set aws_mappings_resource_mapping to new value. User provided resource mapping for keys in `resource_keys` field.
            Keys format: [IAM JSON policy elements:
            Resource](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_resource.html).
            Values format: See [Resource
            names](https://cloud.google.com/apis/design/resource_names).
            +
            *KEY*:::
            Sets `KEY` value.
            +
            *VALUE*:::
            Sets `VALUE` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --aws-mappings-resource-mapping=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --aws-mappings-resource-mapping='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --aws-mappings-resource-mapping=path_to_file.(yaml|json)
            +
            ```
        clear-aws-mappings-principal-mapping: Clear aws_mappings_principal_mapping value and set to empty map.
        clear-aws-mappings-resource-mapping: Clear aws_mappings_resource_mapping value and set to empty map.
        clear-labels: Clear labels value and set to empty map.
        clear-policy-config: Set googleIamV3alphaPolicyPorter.policyConfig back to default value.
        description: Description about translation.
        display-name: |-
            An arbitrary user-provided name for policy porter.
            The display name should adhere to the following format:
            * Must be 6 to 63 characters in length.
            * Can only contain lowercase letters, numbers, and hyphens.
            * Must start with a letter.
        inline-policy-json-content: Content of the file containing policies in json format.
        inline-policy-json-content-from-file: Content of the file containing policies in json format. Use a full or relative path to a local file containing the value of inline_policy_json_content.
        inline-policy-json-file-name: |-
            Name of file from which policy json got imported. This helps user to
            recognize the source of policies.
        labels: |-
            Set labels to new value. Resource labels as key value pairs, used for List API filtering.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: |-
            The location id of the policyPorter resource.
            +
            To set the `location` attribute:
            * provide the argument `policy_porter` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-aws-mappings-principal-mapping: Clear aws_mappings_principal_mapping value and set to empty map.
        no-clear-aws-mappings-resource-mapping: Clear aws_mappings_resource_mapping value and set to empty map.
        no-clear-labels: Clear labels value and set to empty map.
        no-clear-policy-config: Set googleIamV3alphaPolicyPorter.policyConfig back to default value.
        policy-config-source-cloud: |-
            Type of source cloud from which policies are being translated. _POLICY_CONFIG_SOURCE_CLOUD_ must be (only one value is supported):
            +
            *aws*::: Represents AWS cloud.
            :::
            +
        remove-aws-mappings-principal-mapping: |-
            Remove existing value from map aws_mappings_principal_mapping. Sets `remove_aws_mappings_principal_mapping` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-aws-mappings-principal-mapping=string,string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-aws-mappings-principal-mapping=["string"]
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-aws-mappings-principal-mapping=path_to_file.(yaml|json)
            +
            ```
        remove-aws-mappings-resource-mapping: |-
            Remove existing value from map aws_mappings_resource_mapping. Sets `remove_aws_mappings_resource_mapping` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-aws-mappings-resource-mapping=string,string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-aws-mappings-resource-mapping=["string"]
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-aws-mappings-resource-mapping=path_to_file.(yaml|json)
            +
            ```
        remove-labels: |-
            Remove existing value from map labels. Sets `remove_labels` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-labels=string,string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-labels=["string"]
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-labels=path_to_file.(yaml|json)
            +
            ```
        request-id: |-
            An optional request ID to identify requests. Specify a unique request ID
            so that if you must retry your request, the server will know to ignore
            the request if it has already been completed. The server will guarantee
            that for at least 60 minutes since the first request.
            +
            For example, consider a situation where you make an initial request and the
            request times out. If you make the request again with the same request
            ID, the server can check if original operation with the same request ID
            was received, and if so, will ignore the second request. This prevents
            clients from accidentally creating duplicate commitments.
            +
            The request ID must be a valid UUID with the exception that zero UUID is
            not supported (00000000-0000-0000-0000-000000000000).
        update-aws-mappings-principal-mapping: |-
            Update aws_mappings_principal_mapping value or add key value pair. User provided principal mapping for keys in `principal_keys` field.
            Keys format: [AWS JSON policy elements:
            Principal](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_principal.html).
            Values format: See [Members field in
            bindings](https://cloud.google.com/iam/docs/reference/rest/v1/Policy#binding).
            +
            *KEY*:::
            Sets `KEY` value.
            +
            *VALUE*:::
            Sets `VALUE` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --update-aws-mappings-principal-mapping=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --update-aws-mappings-principal-mapping='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --update-aws-mappings-principal-mapping=path_to_file.(yaml|json)
            +
            ```
        update-aws-mappings-resource-mapping: |-
            Update aws_mappings_resource_mapping value or add key value pair. User provided resource mapping for keys in `resource_keys` field.
            Keys format: [IAM JSON policy elements:
            Resource](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_resource.html).
            Values format: See [Resource
            names](https://cloud.google.com/apis/design/resource_names).
            +
            *KEY*:::
            Sets `KEY` value.
            +
            *VALUE*:::
            Sets `VALUE` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --update-aws-mappings-resource-mapping=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --update-aws-mappings-resource-mapping='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --update-aws-mappings-resource-mapping=path_to_file.(yaml|json)
            +
            ```
        update-labels: |-
            Update labels value or add key value pair. Resource labels as key value pairs, used for List API filtering.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --update-labels=string=string
