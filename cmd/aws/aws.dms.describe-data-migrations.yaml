name: describe-data-migrations
description: Returns information about data migrations.
flags:
    --filters=: Filters applied to the data migrations.
    --marker=: An optional pagination token provided by a previous request.
    --max-records=: The maximum number of records to include in the response.
    --without-settings=: An option to set to avoid returning information about settings.
    --without-statistics=: An option to set to avoid returning information about statistics.
documentation:
    command: Returns information about data migrations.
    flag:
        filters: Filters applied to the data migrations.
        marker: An optional pagination token provided by a previous request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that the remaining results can be retrieved.
        without-settings: An option to set to avoid returning information about settings. Use this to reduce overhead when setting information is too large. To use this option, choose `true`; otherwise, choose `false` (the default).
        without-statistics: An option to set to avoid returning information about statistics. Use this to reduce overhead when statistics information is too large. To use this option, choose `true`; otherwise, choose `false` (the default).
