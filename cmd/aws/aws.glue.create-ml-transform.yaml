name: create-ml-transform
description: Creates an Glue machine learning transform.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description of the machine learning transform that is being defined.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --glue-version=: This value determines which version of Glue this machine learning transform is compatible with.
    --input-record-tables=!:
        description: A list of Glue table definitions used by the transform.
        nargs: -1
    --max-capacity=: The number of Glue data processing units (DPUs) that are allocated to task runs for this transform.
    --max-retries=: The maximum number of times to retry a task for this transform after a task run fails.
    --name=!: The unique name that you give the transform when you create it.
    --number-of-workers=: The number of workers of a defined `workerType` that are allocated when this task runs.
    --parameters=!: The algorithmic parameters that are specific to the transform type used.
    --role=!: The name or Amazon Resource Name (ARN) of the IAM role with the required permissions.
    --tags=: The tags to use with this machine learning transform.
    --timeout=: The timeout of the task run for this transform in minutes.
    --transform-encryption=: The encryption-at-rest settings of the transform that apply to accessing user data.
    --worker-type=: The type of predefined worker that is allocated when this task runs.
completion:
    flag:
        worker-type:
            - Standard
            - G.1X
            - G.2X
            - G.025X
            - G.4X
            - G.8X
            - Z.2X
documentation:
    command: |-
        Creates an Glue machine learning transform. This operation creates the transform and all the necessary parameters to train it.

        Call this operation as the first step in the process of using a machine learning transform (such as the `FindMatches` transform) for deduplicating data. You can provide an optional `Description`, in addition to the parameters that you want to use for your algorithm.

        You must also specify certain parameters for the tasks that Glue runs on your behalf as part of learning from your data and creating a high-quality machine learning transform. These parameters include `Role`, and optionally, `AllocatedCapacity`, `Timeout`, and `MaxRetries`. For more information, see [Jobs](https://docs.aws.amazon.com/glue/latest/dg/aws-glue-api-jobs-job.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description of the machine learning transform that is being defined. The default is an empty string.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        glue-version: This value determines which version of Glue this machine learning transform is compatible with. Glue 1.0 is recommended for most customers. If the value is not set, the Glue compatibility defaults to Glue 0.9. For more information, see [Glue Versions](https://docs.aws.amazon.com/glue/latest/dg/release-notes.html#release-notes-versions) in the developer guide.
        input-record-tables: A list of Glue table definitions used by the transform.
        max-capacity: |-
            The number of Glue data processing units (DPUs) that are allocated to task runs for this transform. You can allocate from 2 to 100 DPUs; the default is 10. A DPU is a relative measure of processing power that consists of 4 vCPUs of compute capacity and 16 GB of memory. For more information, see the [Glue pricing page](https://aws.amazon.com/glue/pricing/).

            `MaxCapacity` is a mutually exclusive option with `NumberOfWorkers` and `WorkerType`.

            - If either `NumberOfWorkers` or `WorkerType` is set, then `MaxCapacity` cannot be set.
            - If `MaxCapacity` is set then neither `NumberOfWorkers` or `WorkerType` can be set.
            - If `WorkerType` is set, then `NumberOfWorkers` is required (and vice versa).
            - `MaxCapacity` and `NumberOfWorkers` must both be at least 1.

            When the `WorkerType` field is set to a value other than `Standard`, the `MaxCapacity` field is set automatically and becomes read-only.

            When the `WorkerType` field is set to a value other than `Standard`, the `MaxCapacity` field is set automatically and becomes read-only.
        max-retries: The maximum number of times to retry a task for this transform after a task run fails.
        name: The unique name that you give the transform when you create it.
        number-of-workers: |-
            The number of workers of a defined `workerType` that are allocated when this task runs.

            If `WorkerType` is set, then `NumberOfWorkers` is required (and vice versa).
        parameters: The algorithmic parameters that are specific to the transform type used. Conditionally dependent on the transform type.
        role: |-
            The name or Amazon Resource Name (ARN) of the IAM role with the required permissions. The required permissions include both Glue service role permissions to Glue resources, and Amazon S3 permissions required by the transform.

            - This role needs Glue service role permissions to allow access to resources in Glue. See [Attach a Policy to IAM Users That Access Glue](https://docs.aws.amazon.com/glue/latest/dg/attach-policy-iam-user.html).
            - This role needs permission to your Amazon Simple Storage Service (Amazon S3) sources, targets, temporary directory, scripts, and any libraries used by the task run for this transform.
        tags: The tags to use with this machine learning transform. You may use tags to limit access to the machine learning transform. For more information about tags in Glue, see [Amazon Web Services Tags in Glue](https://docs.aws.amazon.com/glue/latest/dg/monitor-tags.html) in the developer guide.
        timeout: The timeout of the task run for this transform in minutes. This is the maximum time that a task run for this transform can consume resources before it is terminated and enters `TIMEOUT` status. The default is 2,880 minutes (48 hours).
        transform-encryption: The encryption-at-rest settings of the transform that apply to accessing user data. Machine learning transforms can access user data encrypted in Amazon S3 using KMS.
        worker-type: |-
            The type of predefined worker that is allocated when this task runs. Accepts a value of Standard, G.1X, or G.2X.

            - For the `Standard` worker type, each worker provides 4 vCPU, 16 GB of memory and a 50GB disk, and 2 executors per worker.
            - For the `G.1X` worker type, each worker provides 4 vCPU, 16 GB of memory and a 64GB disk, and 1 executor per worker.
            - For the `G.2X` worker type, each worker provides 8 vCPU, 32 GB of memory and a 128GB disk, and 1 executor per worker.

            `MaxCapacity` is a mutually exclusive option with `NumberOfWorkers` and `WorkerType`.

            - If either `NumberOfWorkers` or `WorkerType` is set, then `MaxCapacity` cannot be set.
            - If `MaxCapacity` is set then neither `NumberOfWorkers` or `WorkerType` can be set.
            - If `WorkerType` is set, then `NumberOfWorkers` is required (and vice versa).
            - `MaxCapacity` and `NumberOfWorkers` must both be at least 1.
