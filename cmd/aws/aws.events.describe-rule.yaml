name: describe-rule
description: Describes the specified rule.
flags:
    --event-bus-name=: The name or ARN of the event bus associated with the rule.
    --name=!: The name of the rule.
documentation:
    command: |-
        Describes the specified rule.

        DescribeRule does not list the targets of a rule. To see the targets associated with a rule, use [ListTargetsByRule](https://docs.aws.amazon.com/eventbridge/latest/APIReference/API_ListTargetsByRule.html).
    flag:
        event-bus-name: The name or ARN of the event bus associated with the rule. If you omit this, the default event bus is used.
        name: The name of the rule.
