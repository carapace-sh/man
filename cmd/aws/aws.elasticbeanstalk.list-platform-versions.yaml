name: list-platform-versions
description: Lists the platform versions available for your account in an AWS Region.
flags:
    --filters=: Criteria for restricting the resulting list of platform versions.
    --max-records=: The maximum number of platform version values returned in one call.
    --next-token=: For a paginated request.
documentation:
    command: |-
        Lists the platform versions available for your account in an AWS Region. Provides summary information about each platform version. Compare to [DescribePlatformVersion](), which provides full details about a single platform version.

        For definitions of platform version and other platform-related terms, see [AWS Elastic Beanstalk Platforms Glossary](https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/platforms-glossary.html).
    flag:
        filters: Criteria for restricting the resulting list of platform versions. The filter is interpreted as a logical conjunction (AND) of the separate `PlatformFilter` terms.
        max-records: The maximum number of platform version values returned in one call.
        next-token: |-
            For a paginated request. Specify a token from a previous response page to retrieve the next response page. All other parameter values must be identical to the ones specified in the initial request.

            If no `NextToken` is specified, the first page is retrieved.
