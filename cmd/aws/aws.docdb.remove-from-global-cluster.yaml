name: remove-from-global-cluster
description: Detaches an Amazon DocumentDB secondary cluster from a global cluster.
flags:
    --db-cluster-identifier=!: The Amazon Resource Name (ARN) identifying the cluster that was detached from the Amazon DocumentDB global cluster.
    --global-cluster-identifier=!: The cluster identifier to detach from the Amazon DocumentDB global cluster.
documentation:
    command: |-
        Detaches an Amazon DocumentDB secondary cluster from a global cluster. The cluster becomes a standalone cluster with read-write capability instead of being read-only and receiving data from a primary in a different region.

        This action only applies to Amazon DocumentDB clusters.
    flag:
        db-cluster-identifier: The Amazon Resource Name (ARN) identifying the cluster that was detached from the Amazon DocumentDB global cluster.
        global-cluster-identifier: The cluster identifier to detach from the Amazon DocumentDB global cluster.
