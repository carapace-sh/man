name: describe-launch-template-versions
description: Describes one or more versions of a specified launch template.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: One or more filters.
    --launch-template-id=: The ID of the launch template.
    --launch-template-name=: The name of the launch template.
    --max-results=: The maximum number of results to return in a single call.
    --max-version=: The version number up to which to describe launch template versions.
    --min-version=: The version number after which to describe launch template versions.
    --next-token=: The token to request the next page of results.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-resolve-alias&: If `true`, and if a Systems Manager parameter is specified for `ImageId`, the AMI ID is displayed in the response for `imageId`.
    --resolve-alias: If `true`, and if a Systems Manager parameter is specified for `ImageId`, the AMI ID is displayed in the response for `imageId`.
    --versions=: One or more versions of the launch template.
documentation:
    command: Describes one or more versions of a specified launch template. You can describe all versions, individual versions, or a range of versions. You can also describe all the latest versions or all the default versions of all the launch templates in your account.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            One or more filters.

            - `create-time` - The time the launch template version was created.
            - `ebs-optimized` - A boolean that indicates whether the instance is optimized for Amazon EBS I/O.
            - `http-endpoint` - Indicates whether the HTTP metadata endpoint on your instances is enabled (`enabled` | `disabled`).
            - `http-protocol-ipv4` - Indicates whether the IPv4 endpoint for the instance metadata service is enabled (`enabled` | `disabled`).
            - `host-resource-group-arn` - The ARN of the host resource group in which to launch the instances.
            - `http-tokens` - The state of token usage for your instance metadata requests (`optional` | `required`).
            - `iam-instance-profile` - The ARN of the IAM instance profile.
            - `image-id` - The ID of the AMI.
            - `instance-type` - The instance type.
            - `is-default-version` - A boolean that indicates whether the launch template version is the default version.
            - `kernel-id` - The kernel ID.
            - `license-configuration-arn` - The ARN of the license configuration.
            - `network-card-index` - The index of the network card.
            - `ram-disk-id` - The RAM disk ID.
        launch-template-id: |-
            The ID of the launch template.

            To describe one or more versions of a specified launch template, you must specify either the launch template ID or the launch template name, but not both.

            To describe all the latest or default launch template versions in your account, you must omit this parameter.
        launch-template-name: |-
            The name of the launch template.

            To describe one or more versions of a specified launch template, you must specify either the launch template name or the launch template ID, but not both.

            To describe all the latest or default launch template versions in your account, you must omit this parameter.
        max-results: The maximum number of results to return in a single call. To retrieve the remaining results, make another call with the returned `NextToken` value. This value can be between 1 and 200.
        max-version: The version number up to which to describe launch template versions.
        min-version: The version number after which to describe launch template versions.
        next-token: The token to request the next page of results.
        resolve-alias: |-
            If `true`, and if a Systems Manager parameter is specified for `ImageId`, the AMI ID is displayed in the response for `imageId`.

            If `false`, and if a Systems Manager parameter is specified for `ImageId`, the parameter is displayed in the response for `imageId`.

            For more information, see [Use a Systems Manager parameter instead of an AMI ID](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/create-launch-template.html#use-an-ssm-parameter-instead-of-an-ami-id) in the *Amazon EC2 User Guide*.

            Default: `false`
        versions: |-
            One or more versions of the launch template. Valid values depend on whether you are describing a specified launch template (by ID or name) or all launch templates in your account.

            To describe one or more versions of a specified launch template, valid values are `$Latest`, `$Default`, and numbers.

            To describe all launch templates in your account that are defined as the latest version, the valid value is `$Latest`. To describe all launch templates in your account that are defined as the default version, the valid value is `$Default`. You can specify `$Latest` and `$Default` in the same request. You cannot specify numbers.
