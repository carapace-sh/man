name: create-service-level-objective
description: Creates a service level objective (SLO), which can help you ensure that your critical business operations are meeting customer expectations.
flags:
    --burn-rate-configurations=: Use this array to create *burn rates* for this SLO.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: An optional description for this SLO.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --goal=: This structure contains the attributes that determine the goal of the SLO.
    --name=!: A name for this SLO.
    --request-based-sli-config=: If this SLO is a request-based SLO, this structure defines the information about what performance metric this SLO will monitor.
    --sli-config=: If this SLO is a period-based SLO, this structure defines the information about what performance metric this SLO will monitor.
    --tags=: A list of key-value pairs to associate with the SLO.
documentation:
    command: "Creates a service level objective (SLO), which can help you ensure that your critical business operations are meeting customer expectations. Use SLOs to set and track specific target levels for the reliability and availability of your applications and services. SLOs use service level indicators (SLIs) to calculate whether the application is performing at the level that you want.\n\nCreate an SLO to set a target for a service or operation’s availability or latency. CloudWatch measures this target frequently you can find whether it has been breached.\n\nThe target performance quality that is defined for an SLO is the *attainment goal*.\n\nYou can set SLO targets for your applications that are discovered by Application Signals, using critical metrics such as latency and availability. You can also set SLOs against any CloudWatch metric or math expression that produces a time series.\n\nYou can't create an SLO for a service operation that was discovered by Application Signals until after that operation has reported standard metrics to Application Signals.\n\nWhen you create an SLO, you specify whether it is a *period-based SLO* or a *request-based SLO*. Each type of SLO has a different way of evaluating your application's performance against its attainment goal.\n\n- A *period-based SLO* uses defined *periods* of time within a specified total time interval. For each period of time, Application Signals determines whether the application met its goal. The attainment rate is calculated as the `number of good periods/number of total periods`.\n  \n  For example, for a period-based SLO, meeting an attainment goal of 99.9% means that within your interval, your application must meet its performance goal during at least 99.9% of the time periods.\n- A *request-based SLO* doesn't use pre-defined periods of time. Instead, the SLO measures `number of good requests/number of total requests` during the interval. At any time, you can find the ratio of good requests to total requests for the interval up to the time stamp that you specify, and measure that ratio against the goal set in your SLO.\n\nAfter you have created an SLO, you can retrieve error budget reports for it. An *error budget* is the amount of time or amount of requests that your application can be non-compliant with the SLO's goal, and still have your application meet the goal.\n\n- For a period-based SLO, the error budget starts at a number defined by the highest number of periods that can fail to meet the threshold, while still meeting the overall goal. The *remaining error budget* decreases with every failed period that is recorded. The error budget within one interval can never increase.\n  \n  For example, an SLO with a threshold that 99.95% of requests must be completed under 2000ms every month translates to an error budget of 21.9 minutes of downtime per month.\n- For a request-based SLO, the remaining error budget is dynamic and can increase or decrease, depending on the ratio of good requests to total requests.\n\nFor more information about SLOs, see [Service level objectives (SLOs)](https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-ServiceLevelObjectives.html).\n\nWhen you perform a `CreateServiceLevelObjective` operation, Application Signals creates the *AWSServiceRoleForCloudWatchApplicationSignals* service-linked role, if it doesn't already exist in your account. This service- linked role has the following permissions:\n\n- `xray:GetServiceGraph`\n- `logs:StartQuery`\n- `logs:GetQueryResults`\n- `cloudwatch:GetMetricData`\n- `cloudwatch:ListMetrics`\n- `tag:GetResources`\n- `autoscaling:DescribeAutoScalingGroups`"
    flag:
        burn-rate-configurations: Use this array to create *burn rates* for this SLO. Each burn rate is a metric that indicates how fast the service is consuming the error budget, relative to the attainment goal of the SLO.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: An optional description for this SLO.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        goal: This structure contains the attributes that determine the goal of the SLO.
        name: A name for this SLO.
        request-based-sli-config: |-
            If this SLO is a request-based SLO, this structure defines the information about what performance metric this SLO will monitor.

            You can't specify both `RequestBasedSliConfig` and `SliConfig` in the same operation.
        sli-config: |-
            If this SLO is a period-based SLO, this structure defines the information about what performance metric this SLO will monitor.

            You can't specify both `RequestBasedSliConfig` and `SliConfig` in the same operation.
        tags: |-
            A list of key-value pairs to associate with the SLO. You can associate as many as 50 tags with an SLO. To be able to associate tags with the SLO when you create the SLO, you must have the `cloudwatch:TagResource` permission.

            Tags can help you organize and categorize your resources. You can also use them to scope user permissions by granting a user permission to access or change only resources with certain tag values.
