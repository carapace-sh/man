name: update-iam-policy-assignment
description: Updates an existing IAM policy assignment.
flags:
    --assignment-name=!: The name of the assignment, also called a rule.
    --assignment-status=: The status of the assignment.
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the IAM policy assignment.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identities=: The QuickSight users, groups, or both that you want to assign the policy to.
    --namespace=!: The namespace of the assignment.
    --policy-arn=: The ARN for the IAM policy to apply to the QuickSight users and groups specified in this assignment.
completion:
    flag:
        assignment-status:
            - ENABLED
            - DRAFT
            - DISABLED
documentation:
    command: Updates an existing IAM policy assignment. This operation updates only the optional parameter or parameters that are specified in the request. This overwrites all of the users included in `Identities`.
    flag:
        assignment-name: The name of the assignment, also called a rule. The name must be unique within the Amazon Web Services account.
        assignment-status: |-
            The status of the assignment. Possible values are as follows:

            - `ENABLED` - Anything specified in this assignment is used when creating the data source.
            - `DISABLED` - This assignment isn't used when creating the data source.
            - `DRAFT` - This assignment is an unfinished draft and isn't used when creating the data source.
        aws-account-id: The ID of the Amazon Web Services account that contains the IAM policy assignment.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        identities: The QuickSight users, groups, or both that you want to assign the policy to.
        namespace: The namespace of the assignment.
        policy-arn: The ARN for the IAM policy to apply to the QuickSight users and groups specified in this assignment.
