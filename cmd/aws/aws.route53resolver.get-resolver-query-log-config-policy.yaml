name: get-resolver-query-log-config-policy
description: Gets information about a query logging policy.
flags:
    --arn=!: The ARN of the query logging configuration that you want to get the query logging policy for.
documentation:
    command: Gets information about a query logging policy. A query logging policy specifies the Resolver query logging operations and resources that you want to allow another Amazon Web Services account to be able to use.
    flag:
        arn: The ARN of the query logging configuration that you want to get the query logging policy for.
