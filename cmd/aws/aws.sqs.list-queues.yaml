name: list-queues
description: Returns a list of your queues in the current region.
flags:
    --max-results=: Maximum number of results to include in the response.
    --next-token=: Pagination token to request the next set of results.
    --queue-name-prefix=: A string to use for filtering the list results.
documentation:
    command: |-
        Returns a list of your queues in the current region. The response includes a maximum of 1,000 results. If you specify a value for the optional `QueueNamePrefix` parameter, only queues with a name that begins with the specified value are returned.

        The `listQueues` methods supports pagination. Set parameter `MaxResults` in the request to specify the maximum number of results to be returned in the response. If you do not set `MaxResults`, the response includes a maximum of 1,000 results. If you set `MaxResults` and there are additional results to display, the response includes a value for `NextToken`. Use `NextToken` as a parameter in your next request to `listQueues` to receive the next page of results.

        Cross-account permissions don't apply to this action. For more information, see [Grant cross-account permissions to a role and a username](https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-customer-managed-policy-examples.html#grant-cross-account-permissions-to-role-and-user-name) in the *Amazon SQS Developer Guide*.
    flag:
        max-results: Maximum number of results to include in the response. Value range is 1 to 1000. You must set `MaxResults` to receive a value for `NextToken` in the response.
        next-token: Pagination token to request the next set of results.
        queue-name-prefix: |-
            A string to use for filtering the list results. Only those queues whose name begins with the specified string are returned.

            Queue URLs and names are case-sensitive.
