name: decrease-node-groups-in-global-replication-group
description: Decreases the number of node groups in a Global datastore
flags:
    --apply-immediately!: Indicates that the shard reconfiguration process begins immediately.
    --global-node-groups-to-remove=: If the value of NodeGroupCount is less than the current number of node groups (shards), then either NodeGroupsToRemove or NodeGroupsToRetain is required.
    --global-node-groups-to-retain=: If the value of NodeGroupCount is less than the current number of node groups (shards), then either NodeGroupsToRemove or NodeGroupsToRetain is required.
    --global-replication-group-id=!: The name of the Global datastore
    --no-apply-immediately!: Indicates that the shard reconfiguration process begins immediately.
    --node-group-count=!: The number of node groups (shards) that results from the modification of the shard configuration
documentation:
    command: Decreases the number of node groups in a Global datastore
    flag:
        apply-immediately: Indicates that the shard reconfiguration process begins immediately. At present, the only permitted value for this parameter is true.
        global-node-groups-to-remove: If the value of NodeGroupCount is less than the current number of node groups (shards), then either NodeGroupsToRemove or NodeGroupsToRetain is required. GlobalNodeGroupsToRemove is a list of NodeGroupIds to remove from the cluster. ElastiCache will attempt to remove all node groups listed by GlobalNodeGroupsToRemove from the cluster.
        global-node-groups-to-retain: If the value of NodeGroupCount is less than the current number of node groups (shards), then either NodeGroupsToRemove or NodeGroupsToRetain is required. GlobalNodeGroupsToRetain is a list of NodeGroupIds to retain from the cluster. ElastiCache will attempt to retain all node groups listed by GlobalNodeGroupsToRetain from the cluster.
        global-replication-group-id: The name of the Global datastore
        node-group-count: The number of node groups (shards) that results from the modification of the shard configuration
