name: describe
description: '*(ALPHA)*  Describe a Dataplex entry link.'
flags:
    --entry-group=: Entry group containing Dataplex Entries.
    --location=: Location of the Dataplex resource.
documentation:
    command: |
        *(ALPHA)*  Describe a Dataplex entry link.

        Displays the details of a Dataplex entry link resource given a valid entry link ID.
    flag:
        entry-group: |-
            Entry group containing Dataplex Entries.
            +

            To set the `entry_group` attribute:
            * provide the argument `entry_link` on the command line with a fully specified name;
            * provide the argument `--entry_group` on the command line.
        location: |-
            Location of the Dataplex resource.
            +

            To set the `location` attribute:
            * provide the argument `entry_link` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
