name: list-export-image-tasks
description: Lists export image tasks, with optional filtering and pagination.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --filters=: Optional filters to apply when listing export image tasks.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of export image tasks to return in a single request.
    --next-token=: The pagination token from a previous request.
documentation:
    command: Lists export image tasks, with optional filtering and pagination. Use this operation to monitor the status of multiple export operations.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        filters: Optional filters to apply when listing export image tasks. Filters help you narrow down the results based on specific criteria.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The maximum number of export image tasks to return in a single request. The valid range is 1-500, with a default of 50.
        next-token: The pagination token from a previous request. Use this to retrieve the next page of results when there are more tasks than the MaxResults limit.
