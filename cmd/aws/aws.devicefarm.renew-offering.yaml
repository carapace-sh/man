name: renew-offering
description: Explicitly sets the quantity of devices to renew for an offering, starting from the `effectiveDate` of the next period.
flags:
    --offering-id=!: The ID of a request to renew an offering.
    --quantity=!: The quantity requested in an offering renewal.
documentation:
    command: Explicitly sets the quantity of devices to renew for an offering, starting from the `effectiveDate` of the next period. The API returns a `NotEligible` error if the user is not permitted to invoke the operation. If you must be able to invoke this operation, contact [aws-devicefarm-support@amazon.com](mailto:aws-devicefarm-support@amazon.com).
    flag:
        offering-id: The ID of a request to renew an offering.
        quantity: The quantity requested in an offering renewal.
