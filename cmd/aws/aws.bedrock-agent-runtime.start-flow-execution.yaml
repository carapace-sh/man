name: start-flow-execution
description: Starts an execution of an Amazon Bedrock flow.
flags:
    --flow-alias-identifier=!: The unique identifier of the flow alias to use for the flow execution.
    --flow-execution-name=: The unique name for the flow execution.
    --flow-identifier=!: The unique identifier of the flow to execute.
    --inputs=!: The input data required for the flow execution.
    --model-performance-configuration=: The performance settings for the foundation model used in the flow execution.
documentation:
    command: |-
        Starts an execution of an Amazon Bedrock flow. Unlike flows that run until completion or time out after five minutes, flow executions let you run flows asynchronously for longer durations. Flow executions also yield control so that your application can perform other tasks.

        This operation returns an Amazon Resource Name (ARN) that you can use to track and manage your flow execution.

        Flow executions is in preview release for Amazon Bedrock and is subject to change.
    flag:
        flow-alias-identifier: The unique identifier of the flow alias to use for the flow execution.
        flow-execution-name: The unique name for the flow execution. If you don't provide one, a system-generated name is used.
        flow-identifier: The unique identifier of the flow to execute.
        inputs: The input data required for the flow execution. This must match the input schema defined in the flow.
        model-performance-configuration: The performance settings for the foundation model used in the flow execution.
