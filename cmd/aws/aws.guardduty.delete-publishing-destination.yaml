name: delete-publishing-destination
description: Deletes the publishing definition with the specified `destinationId`.
flags:
    --destination-id=!: The ID of the publishing destination to delete.
    --detector-id=!: The unique ID of the detector associated with the publishing destination to delete.
documentation:
    command: Deletes the publishing definition with the specified `destinationId`.
    flag:
        destination-id: The ID of the publishing destination to delete.
        detector-id: |-
            The unique ID of the detector associated with the publishing destination to delete.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
