name: describe-routing-profile
description: Describes the specified routing profile.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --routing-profile-id=!: The identifier of the routing profile.
documentation:
    command: |-
        Describes the specified routing profile.

        `DescribeRoutingProfile` does not populate AssociatedQueueIds in its response. The example Response Syntax shown on this page is incorrect; we are working to update it. [SearchRoutingProfiles](https://docs.aws.amazon.com/connect/latest/APIReference/API_SearchRoutingProfiles.html) does include AssociatedQueueIds.
    flag:
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        routing-profile-id: The identifier of the routing profile.
