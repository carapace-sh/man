name: import-api-keys
description: Import API keys from an external source, such as a CSV-formatted file.
flags:
    --body=!: The payload of the POST request to import API keys.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --fail-on-warnings: A query parameter to indicate whether to rollback ApiKey importation (`true`) or not (`false`) when error is encountered.
    --format=!: A query parameter to specify the input format to imported API keys.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-fail-on-warnings: A query parameter to indicate whether to rollback ApiKey importation (`true`) or not (`false`) when error is encountered.
completion:
    flag:
        format:
            - csv
documentation:
    command: Import API keys from an external source, such as a CSV-formatted file.
    flag:
        body: The payload of the POST request to import API keys. For the payload format, see API Key File Format.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        fail-on-warnings: A query parameter to indicate whether to rollback ApiKey importation (`true`) or not (`false`) when error is encountered.
        format: A query parameter to specify the input format to imported API keys. Currently, only the `csv` format is supported.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
