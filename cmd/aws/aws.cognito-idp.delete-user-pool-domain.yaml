name: delete-user-pool-domain
description: Given a user pool ID and domain identifier, deletes a user pool domain.
flags:
    --domain=!: The domain that you want to delete.
    --user-pool-id=!: The ID of the user pool where you want to delete the domain.
documentation:
    command: Given a user pool ID and domain identifier, deletes a user pool domain. After you delete a user pool domain, your managed login pages and authorization server are no longer available.
    flag:
        domain: The domain that you want to delete. For custom domains, this is the fully-qualified domain name like `auth.example.com`. For Amazon Cognito prefix domains, this is the prefix alone, like `myprefix`.
        user-pool-id: The ID of the user pool where you want to delete the domain.
