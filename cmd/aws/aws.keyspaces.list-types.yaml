name: list-types
description: The `ListTypes` operation returns a list of types for a specified keyspace.
flags:
    --keyspace-name=!: The name of the keyspace that contains the listed types.
    --max-results=: The total number of types to return in the output.
    --next-token=: The pagination token.
documentation:
    command: |-
        The `ListTypes` operation returns a list of types for a specified keyspace.

        To read keyspace metadata using `ListTypes`, the IAM principal needs `Select` action permissions for the system keyspace. To configure the required permissions, see [Permissions to view a UDT](https://docs.aws.amazon.com/keyspaces/latest/devguide/configure-udt-permissions.html#udt-permissions-view) in the *Amazon Keyspaces Developer Guide*.
    flag:
        keyspace-name: The name of the keyspace that contains the listed types.
        max-results: The total number of types to return in the output. If the total number of types available is more than the value specified, a `NextToken` is provided in the output. To resume pagination, provide the `NextToken` value as an argument of a subsequent API invocation.
        next-token: The pagination token. To resume pagination, provide the `NextToken` value as an argument of a subsequent API invocation.
