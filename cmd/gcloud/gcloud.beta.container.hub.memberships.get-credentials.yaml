name: get-credentials
description: '*(BETA)*  Fetch credentials for a fleet-registered cluster to be used in Connect Gateway.'
flags:
    --force-use-agent&: Force the use of Connect Agent-based transport.
    --location=: The location of the membership resource, e.g. `us-central1`.
    --no-force-use-agent&: Force the use of Connect Agent-based transport.
    --no-use-client-side-generation&: Generate the kubeconfig locally rather than generating
    --use-client-side-generation&: Generate the kubeconfig locally rather than generating
documentation:
    command: |-
        *(BETA)*  gcloud beta container hub memberships get-credentials updates the `kubeconfig` file with the appropriate credentials and
        endpoint information to send `kubectl` commands to a fleet-registered and
        -connected cluster through the Connect Gateway service.

        It takes a project, passed through by set defaults or flags. By default,
        credentials are written to `$HOME/.kube/config`. You can provide an alternate
        path by setting the `KUBECONFIG` environment variable. If `KUBECONFIG`
        contains multiple paths, the first one is used.

        Upon success, this command will switch the current context to the target
        cluster if other contexts are already present in the `kubeconfig` file.

        ## EXAMPLES

          Get the Gateway kubeconfig for a globally registered cluster:

            $ gcloud beta container hub memberships get-credentials my-cluster
            $ gcloud beta container hub memberships get-credentials my-cluster --location=global

          Get the Gateway kubeconfig for a cluster registered in us-central1:

            $ gcloud beta container hub memberships get-credentials my-cluster --location=us-central1
    flag:
        force-use-agent: |
            Force the use of Connect Agent-based transport.
        location: |-
            The location of the membership resource, e.g. `us-central1`.
            If not specified, attempts to automatically choose the correct region.
            +

            To set the `location` attribute:
            * provide the argument `MEMBERSHIP_NAME` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkehub/location`.
        no-force-use-agent: |
            Force the use of Connect Agent-based transport.
        no-use-client-side-generation: |
            Generate the kubeconfig locally rather than generating
            it using an API call.
        use-client-side-generation: |
            Generate the kubeconfig locally rather than generating
            it using an API call.
