name: create-feature-group
description: Create a new `FeatureGroup`.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A free-form description of a `FeatureGroup`.
    --event-time-feature-name=!: The name of the feature that stores the `EventTime` of a `Record` in a `FeatureGroup`.
    --feature-definitions=!:
        description: A list of `Feature` names and types.
        nargs: -1
    --feature-group-name=!: The name of the `FeatureGroup`.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --offline-store-config=: Use this to configure an `OfflineFeatureStore`.
    --online-store-config=: You can turn the `OnlineStore` on or off by specifying `True` for the `EnableOnlineStore` flag in `OnlineStoreConfig`.
    --record-identifier-feature-name=!: The name of the `Feature` whose value uniquely identifies a `Record` defined in the `FeatureStore`.
    --role-arn=: The Amazon Resource Name (ARN) of the IAM execution role used to persist data into the `OfflineStore` if an `OfflineStoreConfig` is provided.
    --tags=:
        description: Tags used to identify `Features` in each `FeatureGroup`.
        nargs: -1
    --throughput-config=: ""
documentation:
    command: |-
        Create a new `FeatureGroup`. A `FeatureGroup` is a group of `Features` defined in the `FeatureStore` to describe a `Record`.

        The `FeatureGroup` defines the schema and features contained in the `FeatureGroup`. A `FeatureGroup` definition is composed of a list of `Features`, a `RecordIdentifierFeatureName`, an `EventTimeFeatureName` and configurations for its `OnlineStore` and `OfflineStore`. Check [Amazon Web Services service quotas](https://docs.aws.amazon.com/general/latest/gr/aws_service_limits.html) to see the `FeatureGroup`s quota for your Amazon Web Services account.

        Note that it can take approximately 10-15 minutes to provision an `OnlineStore` `FeatureGroup` with the `InMemory` `StorageType`.

        You must include at least one of `OnlineStoreConfig` and `OfflineStoreConfig` to create a `FeatureGroup`.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A free-form description of a `FeatureGroup`.
        event-time-feature-name: |-
            The name of the feature that stores the `EventTime` of a `Record` in a `FeatureGroup`.

            An `EventTime` is a point in time when a new event occurs that corresponds to the creation or update of a `Record` in a `FeatureGroup`. All `Records` in the `FeatureGroup` must have a corresponding `EventTime`.

            An `EventTime` can be a `String` or `Fractional`.

            - `Fractional`: `EventTime` feature values must be a Unix timestamp in seconds.
            - `String`: `EventTime` feature values must be an ISO-8601 string in the format. The following formats are supported `yyyy-MM-dd'T'HH:mm:ssZ` and `yyyy-MM-dd'T'HH:mm:ss.SSSZ` where `yyyy`, `MM`, and `dd` represent the year, month, and day respectively and `HH`, `mm`, `ss`, and if applicable, `SSS` represent the hour, month, second and milliseconds respsectively. `'T'` and `Z` are constants.
        feature-definitions: |-
            A list of `Feature` names and types. `Name` and `Type` is compulsory per `Feature`.

            Valid feature `FeatureType`s are `Integral`, `Fractional` and `String`.

            `FeatureName`s cannot be any of the following: `is_deleted`, `write_time`, `api_invocation_time`

            You can create up to 2,500 `FeatureDefinition`s per `FeatureGroup`.
        feature-group-name: |-
            The name of the `FeatureGroup`. The name must be unique within an Amazon Web Services Region in an Amazon Web Services account.

            The name:

            - Must start with an alphanumeric character.
            - Can only include alphanumeric characters, underscores, and hyphens. Spaces are not allowed.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        offline-store-config: |-
            Use this to configure an `OfflineFeatureStore`. This parameter allows you to specify:

            - The Amazon Simple Storage Service (Amazon S3) location of an `OfflineStore`.
            - A configuration for an Amazon Web Services Glue or Amazon Web Services Hive data catalog.
            - An KMS encryption key to encrypt the Amazon S3 location used for `OfflineStore`. If KMS encryption key is not specified, by default we encrypt all data at rest using Amazon Web Services KMS key. By defining your [bucket-level key](https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucket-key.html) for SSE, you can reduce Amazon Web Services KMS requests costs by up to 99 percent.
            - Format for the offline store table. Supported formats are Glue (Default) and [Apache Iceberg](https://iceberg.apache.org/).

            To learn more about this parameter, see [OfflineStoreConfig](https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_OfflineStoreConfig.html).
        online-store-config: |-
            You can turn the `OnlineStore` on or off by specifying `True` for the `EnableOnlineStore` flag in `OnlineStoreConfig`.

            You can also include an Amazon Web Services KMS key ID (`KMSKeyId`) for at-rest encryption of the `OnlineStore`.

            The default value is `False`.
        record-identifier-feature-name: |-
            The name of the `Feature` whose value uniquely identifies a `Record` defined in the `FeatureStore`. Only the latest record per identifier value will be stored in the `OnlineStore`. `RecordIdentifierFeatureName` must be one of feature definitions' names.

            You use the `RecordIdentifierFeatureName` to access data in a `FeatureStore`.

            This name:

            - Must start with an alphanumeric character.
            - Can only contains alphanumeric characters, hyphens, underscores. Spaces are not allowed.
        role-arn: The Amazon Resource Name (ARN) of the IAM execution role used to persist data into the `OfflineStore` if an `OfflineStoreConfig` is provided.
        tags: Tags used to identify `Features` in each `FeatureGroup`.
        throughput-config: ""
