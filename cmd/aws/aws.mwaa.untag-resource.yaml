name: untag-resource
description: Removes key-value tag pairs associated to your Amazon Managed Workflows for Apache Airflow (MWAA) environment.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the Amazon MWAA environment.
    --tag-keys=!: The key-value tag pair you want to remove.
documentation:
    command: 'Removes key-value tag pairs associated to your Amazon Managed Workflows for Apache Airflow (MWAA) environment. For example, `"Environment": "Staging"`.'
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the Amazon MWAA environment. For example, `arn:aws:airflow:us-east-1:123456789012:environment/MyMWAAEnvironment`.
        tag-keys: 'The key-value tag pair you want to remove. For example, `"Environment": "Staging"`.'
