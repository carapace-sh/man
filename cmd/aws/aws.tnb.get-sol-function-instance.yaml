name: get-sol-function-instance
description: Gets the details of a network function instance, including the instantiation state and metadata from the function package descriptor in the network function package.
flags:
    --vnf-instance-id=!: ID of the network function.
documentation:
    command: |-
        Gets the details of a network function instance, including the instantiation state and metadata from the function package descriptor in the network function package.

        A network function instance is a function in a function package .
    flag:
        vnf-instance-id: ID of the network function.
