name: create-source-location
description: Creates a source location.
flags:
    --access-configuration=: Access configuration parameters.
    --default-segment-delivery-configuration=: The optional configuration for the server that serves segments.
    --http-configuration=!: The source's HTTP package configurations.
    --segment-delivery-configurations=: A list of the segment delivery configurations associated with this resource.
    --source-location-name=!: The name associated with the source location.
    --tags=: The tags to assign to the source location.
documentation:
    command: Creates a source location. A source location is a container for sources. For more information about source locations, see [Working with source locations](https://docs.aws.amazon.com/mediatailor/latest/ug/channel-assembly-source-locations.html) in the *MediaTailor User Guide*.
    flag:
        access-configuration: Access configuration parameters. Configures the type of authentication used to access content from your source location.
        default-segment-delivery-configuration: The optional configuration for the server that serves segments.
        http-configuration: The source's HTTP package configurations.
        segment-delivery-configurations: A list of the segment delivery configurations associated with this resource.
        source-location-name: The name associated with the source location.
        tags: The tags to assign to the source location. Tags are key-value pairs that you can associate with Amazon resources to help with organization, access control, and cost tracking. For more information, see [Tagging AWS Elemental MediaTailor Resources](https://docs.aws.amazon.com/mediatailor/latest/ug/tagging.html).
