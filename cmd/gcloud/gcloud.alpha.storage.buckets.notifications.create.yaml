name: create
description: '*(ALPHA)*  Create a notification configuration on a bucket.'
flags:
    --custom-attributes=: Specifies key:value attributes that are appended to the set of attributes sent to Cloud Pub/Sub for all events associated with this notification configuration.
    --event-types=: Specify event type filters for this notification configuration.
    --object-prefix=: Specifies a prefix path for this notification configuration.
    --payload-format=: Specifies the payload format of notification messages.
    --skip-topic-setup: Skips creation and permission assignment of the Cloud Pub/Sub topic.
    --topic=: Specifies the Cloud Pub/Sub topic to send notifications to.
completion:
    flag:
        payload-format:
            - json
            - none
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha storage buckets notifications create* creates a notification configuration on a bucket,
        establishing a flow of event notifications from Cloud Storage to a
        Cloud Pub/Sub topic. As part of creating this flow, it also verifies
        that the destination Cloud Pub/Sub topic exists, creating it if necessary,
        and verifies that the Cloud Storage bucket has permission to publish
        events to that topic, granting the permission if necessary.

        If a destination Cloud Pub/Sub topic is not specified with the `-t` flag,
        Cloud Storage chooses a topic name in the default project whose ID is
        the same as the bucket name. For example, if the default project ID
        specified is `default-project` and the bucket being configured is
        `gs://example-bucket`, the create command uses the Cloud Pub/Sub topic
        `projects/default-project/topics/example-bucket`.

        In order to enable notifications, your project's
        [Cloud Storage service agent](https://cloud.google.com/storage/docs/projects#service-accounts)
        must have the IAM permission "pubsub.topics.publish".
        This command checks to see if the destination Cloud Pub/Sub topic grants
        the service agent this permission. If not, the create command attempts to
        grant it.

        A bucket can have up to 100 total notification configurations and up to
        10 notification configurations set to trigger for a specific event.
    flag:
        custom-attributes: Specifies key:value attributes that are appended to the set of attributes sent to Cloud Pub/Sub for all events associated with this notification configuration.
        event-types: 'Specify event type filters for this notification configuration. Cloud Storage will send notifications of only these types. By default, Cloud Storage sends notifications for all event types. * OBJECT_FINALIZE: An object has been created. * OBJECT_METADATA_UPDATE: The metadata of an object has changed. * OBJECT_DELETE: An object has been permanently deleted. * OBJECT_ARCHIVE: A live version of an object has become a noncurrent version. _NOTIFICATION_EVENT_TYPE_ must be one of: *OBJECT_ARCHIVE*, *OBJECT_DELETE*, *OBJECT_FINALIZE*, *OBJECT_METADATA_UPDATE*.'
        object-prefix: Specifies a prefix path for this notification configuration. Cloud Storage will send notifications for only objects in the bucket whose names begin with the prefix.
        payload-format: 'Specifies the payload format of notification messages. Notification details are available in the message attributes. ''none'' sends no payload. _PAYLOAD_FORMAT_ must be one of: *json*, *none*.'
        skip-topic-setup: Skips creation and permission assignment of the Cloud Pub/Sub topic. This is useful if the caller does not have permission to access the topic in question, or if the topic already exists and has the appropriate publish permission assigned.
        topic: Specifies the Cloud Pub/Sub topic to send notifications to. If not specified, this command chooses a topic whose project is your default project and whose ID is the same as the Cloud Storage bucket name.
