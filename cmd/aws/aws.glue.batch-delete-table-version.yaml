name: batch-delete-table-version
description: Deletes a specified batch of versions of a table.
flags:
    --catalog-id=: The ID of the Data Catalog where the tables reside.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --database-name=!: The database in the catalog in which the table resides.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --table-name=!: The name of the table.
    --version-ids=!:
        description: A list of the IDs of versions to be deleted.
        nargs: -1
documentation:
    command: Deletes a specified batch of versions of a table.
    flag:
        catalog-id: The ID of the Data Catalog where the tables reside. If none is provided, the Amazon Web Services account ID is used by default.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        database-name: The database in the catalog in which the table resides. For Hive compatibility, this name is entirely lowercase.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        table-name: The name of the table. For Hive compatibility, this name is entirely lowercase.
        version-ids: A list of the IDs of versions to be deleted. A `VersionId` is a string representation of an integer. Each version is incremented by 1.
