name: put-scaling-policy
description: Creates or updates a scaling policy for an Auto Scaling group.
flags:
    --adjustment-type=: Specifies how the scaling adjustment is interpreted (for example, an absolute number or a percentage).
    --auto-scaling-group-name=!: The name of the Auto Scaling group.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cooldown=: A cooldown period, in seconds, that applies to a specific simple scaling policy.
    --enabled: Indicates whether the scaling policy is enabled or disabled.
    --estimated-instance-warmup=: '*Not needed if the default instance warmup is defined for the group.*'
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --metric-aggregation-type=: The aggregation type for the CloudWatch metrics.
    --min-adjustment-magnitude=: The minimum value to scale by when the adjustment type is `PercentChangeInCapacity`.
    --min-adjustment-step=: Available for backward compatibility.
    --no-enabled: Indicates whether the scaling policy is enabled or disabled.
    --policy-name=!: The name of the policy.
    --policy-type=: 'One of the following policy types:'
    --predictive-scaling-configuration=: A predictive scaling policy.
    --scaling-adjustment=: The amount by which to scale, based on the specified adjustment type.
    --step-adjustments=:
        description: A set of adjustments that enable you to scale based on the size of the alarm breach.
        nargs: -1
    --target-tracking-configuration=: A target tracking scaling policy.
documentation:
    command: |-
        Creates or updates a scaling policy for an Auto Scaling group. Scaling policies are used to scale an Auto Scaling group based on configurable metrics. If no policies are defined, the dynamic scaling and predictive scaling features are not used.

        For more information about using dynamic scaling, see [Target tracking scaling policies](https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html) and [Step and simple scaling policies](https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-simple-step.html) in the *Amazon EC2 Auto Scaling User Guide*.

        For more information about using predictive scaling, see [Predictive scaling for Amazon EC2 Auto Scaling](https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-predictive-scaling.html) in the *Amazon EC2 Auto Scaling User Guide*.

        You can view the scaling policies for an Auto Scaling group using the [DescribePolicies](https://docs.aws.amazon.com/autoscaling/ec2/APIReference/API_DescribePolicies.html) API call. If you are no longer using a scaling policy, you can delete it by calling the [DeletePolicy](https://docs.aws.amazon.com/autoscaling/ec2/APIReference/API_DeletePolicy.html) API.
    flag:
        adjustment-type: |-
            Specifies how the scaling adjustment is interpreted (for example, an absolute number or a percentage). The valid values are `ChangeInCapacity`, `ExactCapacity`, and `PercentChangeInCapacity`.

            Required if the policy type is `StepScaling` or `SimpleScaling`. For more information, see [Scaling adjustment types](https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-simple-step.html#as-scaling-adjustment) in the *Amazon EC2 Auto Scaling User Guide*.
        auto-scaling-group-name: The name of the Auto Scaling group.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cooldown: |-
            A cooldown period, in seconds, that applies to a specific simple scaling policy. When a cooldown period is specified here, it overrides the default cooldown.

            Valid only if the policy type is `SimpleScaling`. For more information, see [Scaling cooldowns for Amazon EC2 Auto Scaling](https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-scaling-cooldowns.html) in the *Amazon EC2 Auto Scaling User Guide*.

            Default: None
        enabled: Indicates whether the scaling policy is enabled or disabled. The default is enabled. For more information, see [Disable a scaling policy for an Auto Scaling group](https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-enable-disable-scaling-policy.html) in the *Amazon EC2 Auto Scaling User Guide*.
        estimated-instance-warmup: |-
            *Not needed if the default instance warmup is defined for the group.*

            The estimated time, in seconds, until a newly launched instance can contribute to the CloudWatch metrics. This warm-up period applies to instances launched due to a specific target tracking or step scaling policy. When a warm-up period is specified here, it overrides the default instance warmup.

            Valid only if the policy type is `TargetTrackingScaling` or `StepScaling`.

            The default is to use the value for the default instance warmup defined for the group. If default instance warmup is null, then `EstimatedInstanceWarmup` falls back to the value of default cooldown.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        metric-aggregation-type: |-
            The aggregation type for the CloudWatch metrics. The valid values are `Minimum`, `Maximum`, and `Average`. If the aggregation type is null, the value is treated as `Average`.

            Valid only if the policy type is `StepScaling`.
        min-adjustment-magnitude: |-
            The minimum value to scale by when the adjustment type is `PercentChangeInCapacity`. For example, suppose that you create a step scaling policy to scale out an Auto Scaling group by 25 percent and you specify a `MinAdjustmentMagnitude` of 2. If the group has 4 instances and the scaling policy is performed, 25 percent of 4 is 1. However, because you specified a `MinAdjustmentMagnitude` of 2, Amazon EC2 Auto Scaling scales out the group by 2 instances.

            Valid only if the policy type is `StepScaling` or `SimpleScaling`. For more information, see [Scaling adjustment types](https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-simple-step.html#as-scaling-adjustment) in the *Amazon EC2 Auto Scaling User Guide*.

            Some Auto Scaling groups use instance weights. In this case, set the `MinAdjustmentMagnitude` to a value that is at least as large as your largest instance weight.
        min-adjustment-step: Available for backward compatibility. Use `MinAdjustmentMagnitude` instead.
        policy-name: The name of the policy.
        policy-type: |-
            One of the following policy types:

            - `TargetTrackingScaling`
            - `StepScaling`
            - `SimpleScaling` (default)
            - `PredictiveScaling`
        predictive-scaling-configuration: |-
            A predictive scaling policy. Provides support for predefined and custom metrics.

            Predefined metrics include CPU utilization, network in/out, and the Application Load Balancer request count.

            For more information, see [PredictiveScalingConfiguration](https://docs.aws.amazon.com/autoscaling/ec2/APIReference/API_PredictiveScalingConfiguration.html) in the *Amazon EC2 Auto Scaling API Reference*.

            Required if the policy type is `PredictiveScaling`.
        scaling-adjustment: |-
            The amount by which to scale, based on the specified adjustment type. A positive value adds to the current capacity while a negative number removes from the current capacity. For exact capacity, you must specify a non-negative value.

            Required if the policy type is `SimpleScaling`. (Not used with any other policy type.)
        step-adjustments: |-
            A set of adjustments that enable you to scale based on the size of the alarm breach.

            Required if the policy type is `StepScaling`. (Not used with any other policy type.)
        target-tracking-configuration: |-
            A target tracking scaling policy. Provides support for predefined or custom metrics.

            The following predefined metrics are available:

            - `ASGAverageCPUUtilization`
            - `ASGAverageNetworkIn`
            - `ASGAverageNetworkOut`
            - `ALBRequestCountPerTarget`

            If you specify `ALBRequestCountPerTarget` for the metric, you must specify the `ResourceLabel` property with the `PredefinedMetricSpecification`.

            For more information, see [TargetTrackingConfiguration](https://docs.aws.amazon.com/autoscaling/ec2/APIReference/API_TargetTrackingConfiguration.html) in the *Amazon EC2 Auto Scaling API Reference*.

            Required if the policy type is `TargetTrackingScaling`.
