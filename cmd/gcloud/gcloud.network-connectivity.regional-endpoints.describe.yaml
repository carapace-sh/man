name: describe
description: Describe a regional endpoint.
flags:
    --region=: The location Id.
documentation:
    command: |
        Retrieve and display details about a regional endpoint.
    flag:
        region: |-
            The location Id.
            +

            To set the `region` attribute:
            * provide the argument `regional_endpoint` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
