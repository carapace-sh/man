name: delete-function
description: Deletes a CloudFront function.
flags:
    --if-match=!: The current version (`ETag` value) of the function that you are deleting, which you can get using `DescribeFunction`.
    --name=!: The name of the function that you are deleting.
documentation:
    command: |-
        Deletes a CloudFront function.

        You cannot delete a function if it's associated with a cache behavior. First, update your distributions to remove the function association from all cache behaviors, then delete the function.

        To delete a function, you must provide the function's name and version (`ETag` value). To get these values, you can use `ListFunctions` and `DescribeFunction`.
    flag:
        if-match: The current version (`ETag` value) of the function that you are deleting, which you can get using `DescribeFunction`.
        name: The name of the function that you are deleting.
