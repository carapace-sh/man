name: update
description: Update a folder capability.
hidden: true
flags:
    --enable!: Enable the Capability.
    --no-enable!&: Enable the Capability
    --update-mask=: Update Mask.
documentation:
    command: |-
        Command to Update/Set the `value` field of the Folder capability. This
        can be done by using the `--enable` flag to set the value to True, and
        the `--no-enable` flag to set the value to False.

        This command can fail for the following reasons:
            * There is no folder parenting the given capability name.
            * The active account does not have permission to update the given
              folder/capability.

        ## EXAMPLES

        The following command updates a capability with the ID
        `folders/123/capabilities/app-management` to have
        the value True:

          $ gcloud resource-manager capabilities update "folders/123/capabilities/app-management" --enable

        In order to set the value to False, the following command can be used:

          $ gcloud resource-manager capabilities update "folders/123/capabilities/app-management" --no-enable
    flag:
        enable: Enable the Capability. Use *--enable* to enable and *--no-enable* to disable.
        no-enable: Enable the Capability
        update-mask: Update Mask. This is an optional field, and the only valid value this can be set to currently is "value".
