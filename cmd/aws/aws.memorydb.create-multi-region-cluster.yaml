name: create-multi-region-cluster
description: Creates a new multi-Region cluster.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description for the multi-Region cluster.
    --engine-version=: The version of the engine to be used for the multi-Region cluster.
    --engine=: The name of the engine to be used for the multi-Region cluster.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --multi-region-cluster-name-suffix=!: A suffix to be added to the Multi-Region cluster name.
    --multi-region-parameter-group-name=: The name of the multi-Region parameter group to be associated with the cluster.
    --no-tls-enabled: Whether to enable TLS encryption for the multi-Region cluster.
    --node-type=!: The node type to be used for the multi-Region cluster.
    --num-shards=: The number of shards for the multi-Region cluster.
    --tags=: A list of tags to be applied to the multi-Region cluster.
    --tls-enabled: Whether to enable TLS encryption for the multi-Region cluster.
documentation:
    command: Creates a new multi-Region cluster.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description for the multi-Region cluster.
        engine: The name of the engine to be used for the multi-Region cluster.
        engine-version: The version of the engine to be used for the multi-Region cluster.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        multi-region-cluster-name-suffix: A suffix to be added to the Multi-Region cluster name. Amazon MemoryDB automatically applies a prefix to the Multi-Region cluster Name when it is created. Each Amazon Region has its own prefix. For instance, a Multi-Region cluster Name created in the US-West-1 region will begin with "virxk", along with the suffix name you provide. The suffix guarantees uniqueness of the Multi-Region cluster name across multiple regions.
        multi-region-parameter-group-name: The name of the multi-Region parameter group to be associated with the cluster.
        node-type: The node type to be used for the multi-Region cluster.
        num-shards: The number of shards for the multi-Region cluster.
        tags: A list of tags to be applied to the multi-Region cluster.
        tls-enabled: Whether to enable TLS encryption for the multi-Region cluster.
