name: describe
description: '*(ALPHA)*  Display metadata for a Memorystore Memcached region.'
documentation:
    command: |
        *(ALPHA)*  Display all metadata associated with a Memorystore Memcached region given a valid
        region name.

        This command can fail for the following reasons:
          * The region specified does not exist.
          * The active account does not have permission to access the given
            region.
