name: list-on-premises-instances
description: Gets a list of names for one or more on-premises instances.
flags:
    --next-token=: An identifier returned from the previous list on-premises instances call.
    --registration-status=: 'The registration status of the on-premises instances:'
    --tag-filters=: The on-premises instance tags that are used to restrict the on-premises instance names returned.
completion:
    flag:
        registration-status:
            - Registered
            - Deregistered
documentation:
    command: |-
        Gets a list of names for one or more on-premises instances.

        Unless otherwise specified, both registered and deregistered on-premises instance names are listed. To list only registered or deregistered on-premises instance names, use the registration status parameter.
    flag:
        next-token: An identifier returned from the previous list on-premises instances call. It can be used to return the next set of on-premises instances in the list.
        registration-status: |-
            The registration status of the on-premises instances:

            - `Deregistered`: Include deregistered on-premises instances in the resulting list.
            - `Registered`: Include registered on-premises instances in the resulting list.
        tag-filters: The on-premises instance tags that are used to restrict the on-premises instance names returned.
