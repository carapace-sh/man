name: test-invoke-authorizer
description: Simulate the execution of an Authorizer in your RestApi with headers, parameters, and an incoming request body.
flags:
    --additional-context=: A key-value map of additional context variables.
    --authorizer-id=!: Specifies a test invoke authorizer request's Authorizer ID.
    --body=: The simulated request body of an incoming invocation request.
    --headers=: A key-value map of headers to simulate an incoming invocation request.
    --multi-value-headers=: The headers as a map from string to list of values to simulate an incoming invocation request.
    --path-with-query-string=: The URI path, including query string, of the simulated invocation request.
    --rest-api-id=!: The string identifier of the associated RestApi.
    --stage-variables=: A key-value map of stage variables to simulate an invocation on a deployed Stage.
documentation:
    command: Simulate the execution of an Authorizer in your RestApi with headers, parameters, and an incoming request body.
    flag:
        additional-context: A key-value map of additional context variables.
        authorizer-id: Specifies a test invoke authorizer request's Authorizer ID.
        body: The simulated request body of an incoming invocation request.
        headers: A key-value map of headers to simulate an incoming invocation request. This is where the incoming authorization token, or identity source, should be specified.
        multi-value-headers: The headers as a map from string to list of values to simulate an incoming invocation request. This is where the incoming authorization token, or identity source, may be specified.
        path-with-query-string: The URI path, including query string, of the simulated invocation request. Use this to specify path parameters and query string parameters.
        rest-api-id: The string identifier of the associated RestApi.
        stage-variables: A key-value map of stage variables to simulate an invocation on a deployed Stage.
