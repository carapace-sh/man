name: delete-alias
description: Remove one or more specified aliases from a set of aliases for a given user.
flags:
    --alias=!: The aliases to be removed from the user's set of aliases.
    --entity-id=!: The identifier for the member (user or group) from which to have the aliases removed.
    --organization-id=!: The identifier for the organization under which the user exists.
documentation:
    command: Remove one or more specified aliases from a set of aliases for a given user.
    flag:
        alias: The aliases to be removed from the user's set of aliases. Duplicate entries in the list are collapsed into single entries (the list is transformed into a set).
        entity-id: The identifier for the member (user or group) from which to have the aliases removed.
        organization-id: The identifier for the organization under which the user exists.
