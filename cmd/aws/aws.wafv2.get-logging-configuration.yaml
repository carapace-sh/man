name: get-logging-configuration
description: Returns the [LoggingConfiguration]() for the specified web ACL.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --log-scope=: The owner of the logging configuration, which must be set to `CUSTOMER` for the configurations that you manage.
    --log-type=: Used to distinguish between various logging options.
    --resource-arn=!: The Amazon Resource Name (ARN) of the web ACL for which you want to get the [LoggingConfiguration]().
completion:
    flag:
        log-scope:
            - CUSTOMER
            - SECURITY_LAKE
        log-type:
            - WAF_LOGS
documentation:
    command: Returns the [LoggingConfiguration]() for the specified web ACL.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        log-scope: |-
            The owner of the logging configuration, which must be set to `CUSTOMER` for the configurations that you manage.

            The log scope `SECURITY_LAKE` indicates a configuration that is managed through Amazon Security Lake. You can use Security Lake to collect log and event data from various sources for normalization, analysis, and management. For information, see [Collecting data from Amazon Web Services services](https://docs.aws.amazon.com/security-lake/latest/userguide/internal-sources.html) in the *Amazon Security Lake user guide*.

            Default: `CUSTOMER`
        log-type: |-
            Used to distinguish between various logging options. Currently, there is one option.

            Default: `WAF_LOGS`
        resource-arn: The Amazon Resource Name (ARN) of the web ACL for which you want to get the [LoggingConfiguration]().
