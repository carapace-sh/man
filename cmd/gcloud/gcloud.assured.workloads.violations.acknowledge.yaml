name: acknowledge
description: Acknowledge an existing Assured Workloads compliance violation.
flags:
    --acknowledge-type=: 'the acknowledge type for specified violation, which is one of:'
    --comment=!: Business justification used added to acknowledge a violation.
    --location=: The location for the violation.
    --organization=: The parent organization for the violation.
    --workload=: The workload for the violation.
documentation:
    command: Acknowledge an existing Assured Workloads compliance violation.
    flag:
        acknowledge-type: |-
            the acknowledge type for specified violation, which is one of:
                  SINGLE_VIOLATION - to acknowledge specified violation,
                  EXISTING_CHILD_RESOURCE_VIOLATIONS - to acknowledge specified org policy
                  violation and all associated child resource violations.
        comment: Business justification used added to acknowledge a violation.
        location: |-
            The location for the violation.
            +
            To set the `location` attribute:
            * provide the argument `violation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        organization: |-
            The parent organization for the violation.
            +
            To set the `organization` attribute:
            * provide the argument `violation` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
        workload: |-
            The workload for the violation.
            +
            To set the `workload` attribute:
            * provide the argument `violation` on the command line with a fully specified name;
            * provide the argument `--workload` on the command line.
