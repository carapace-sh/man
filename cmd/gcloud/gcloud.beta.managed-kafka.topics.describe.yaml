name: describe
description: '*(BETA)*  Describe a Managed Service for Apache Kafka topic.'
flags:
    --cluster=: The cluster name.
    --location=: ID of the location of the Managed Service for Apache Kafka resource.
documentation:
    command: |
        *(BETA)*  Describe a Managed Service for Apache Kafka topic.
    flag:
        cluster: |-
            The cluster name.
            +

            To set the `cluster` attribute:
            * provide the argument `topic` on the command line with a fully specified name;
            * provide the argument `--cluster` on the command line.
        location: |-
            ID of the location of the Managed Service for Apache Kafka resource. See
            https://cloud.google.com/managed-service-for-apache-kafka/docs/locations for a list of supported
            locations.
            +

            To set the `location` attribute:
            * provide the argument `topic` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
