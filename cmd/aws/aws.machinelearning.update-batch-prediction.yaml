name: update-batch-prediction
description: Updates the `BatchPredictionName` of a `BatchPrediction`.
flags:
    --batch-prediction-id=!: The ID assigned to the `BatchPrediction` during creation.
    --batch-prediction-name=!: A new user-supplied name or description of the `BatchPrediction`.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
documentation:
    command: |-
        Updates the `BatchPredictionName` of a `BatchPrediction`.

        You can use the `GetBatchPrediction` operation to view the contents of the updated data element.
    flag:
        batch-prediction-id: The ID assigned to the `BatchPrediction` during creation.
        batch-prediction-name: A new user-supplied name or description of the `BatchPrediction`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
