name: update-authentication-profile
description: This API is in preview release for Amazon Connect and is subject to change.
flags:
    --allowed-ips=: A list of IP address range strings that are allowed to access the instance.
    --authentication-profile-id=!: A unique identifier for the authentication profile.
    --blocked-ips=: A list of IP address range strings that are blocked from accessing the instance.
    --description=: The description for the authentication profile.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --name=: The name for the authentication profile.
    --no-session-inactivity-handling-enabled&: Determines if automatic logout on user inactivity is enabled.
    --periodic-session-duration=: The short lived session duration configuration for users logged in to Amazon Connect, in minutes.
    --session-inactivity-duration=: The period, in minutes, before an agent is automatically signed out of the contact center when they go inactive.
    --session-inactivity-handling-enabled: Determines if automatic logout on user inactivity is enabled.
documentation:
    command: |-
        This API is in preview release for Amazon Connect and is subject to change. To request access to this API, contact Amazon Web Services Support.

        Updates the selected authentication profile.
    flag:
        allowed-ips: A list of IP address range strings that are allowed to access the instance. For more information on how to configure IP addresses, see[Configure session timeouts](https://docs.aws.amazon.com/connect/latest/adminguide/authentication-profiles.html#configure-session-timeouts) in the *Amazon Connect Administrator Guide*.
        authentication-profile-id: A unique identifier for the authentication profile.
        blocked-ips: A list of IP address range strings that are blocked from accessing the instance. For more information on how to configure IP addresses, For more information on how to configure IP addresses, see [Configure IP-based access control](https://docs.aws.amazon.com/connect/latest/adminguide/authentication-profiles.html#configure-ip-based-ac) in the *Amazon Connect Administrator Guide*.
        description: The description for the authentication profile.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        name: The name for the authentication profile.
        periodic-session-duration: The short lived session duration configuration for users logged in to Amazon Connect, in minutes. This value determines the maximum possible time before an agent is authenticated. For more information, For more information on how to configure IP addresses, see [Configure session timeouts](https://docs.aws.amazon.com/connect/latest/adminguide/authentication-profiles.html#configure-session-timeouts) in the *Amazon Connect Administrator Guide*.
        session-inactivity-duration: The period, in minutes, before an agent is automatically signed out of the contact center when they go inactive.
        session-inactivity-handling-enabled: Determines if automatic logout on user inactivity is enabled.
