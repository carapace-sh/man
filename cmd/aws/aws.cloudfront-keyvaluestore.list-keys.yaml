name: list-keys
description: Returns a list of key value pairs.
flags:
    --kvs-arn=!: The Amazon Resource Name (ARN) of the Key Value Store.
    --max-results=: Maximum number of results that are returned per call.
    --next-token=: If nextToken is returned in the response, there are more results available.
documentation:
    command: Returns a list of key value pairs.
    flag:
        kvs-arn: The Amazon Resource Name (ARN) of the Key Value Store.
        max-results: Maximum number of results that are returned per call. The default is 10 and maximum allowed page is 50.
        next-token: If nextToken is returned in the response, there are more results available. Make the next call using the returned token to retrieve the next page.
