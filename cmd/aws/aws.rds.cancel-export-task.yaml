name: cancel-export-task
description: Cancels an export task in progress that is exporting a snapshot or cluster to Amazon S3.
flags:
    --export-task-identifier=!: The identifier of the snapshot or cluster export task to cancel.
documentation:
    command: Cancels an export task in progress that is exporting a snapshot or cluster to Amazon S3. Any data that has already been written to the S3 bucket isn't removed.
    flag:
        export-task-identifier: The identifier of the snapshot or cluster export task to cancel.
