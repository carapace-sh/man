name: get-reservation
description: Gets an Amazon Redshift Serverless reservation.
flags:
    --reservation-id=!: The ID of the reservation to retrieve.
documentation:
    command: Gets an Amazon Redshift Serverless reservation. A reservation gives you the option to commit to a specified number of Redshift Processing Units (RPUs) for a year at a discount from Serverless on-demand (OD) rates.
    flag:
        reservation-id: The ID of the reservation to retrieve.
