name: describe
description: '*(BETA)*  Describe a Network Connectivity Center operation.'
flags:
    --region=: The location Id.
documentation:
    command: |
        *(BETA)*  Retrieve details about an operation; this command is useful if you want to check on
        a long-running operation.
    flag:
        region: |-
            The location Id.
            +

            To set the `region` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
