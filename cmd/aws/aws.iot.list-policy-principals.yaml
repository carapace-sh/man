name: list-policy-principals
description: Lists the principals associated with the specified policy.
flags:
    --ascending-order=: Specifies the order for results.
    --marker=: The marker for the next set of results.
    --page-size=: The result page size.
    --policy-name=!: The policy name.
documentation:
    command: |-
        Lists the principals associated with the specified policy.

        **Note:** This action is deprecated and works as expected for backward compatibility, but we won't add enhancements. Use [ListTargetsForPolicy]() instead.

        Requires permission to access the [ListPolicyPrincipals](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        ascending-order: Specifies the order for results. If true, the results are returned in ascending creation order.
        marker: The marker for the next set of results.
        page-size: The result page size.
        policy-name: The policy name.
