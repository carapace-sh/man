name: list-device-pools
description: Gets information about device pools.
flags:
    --arn=!: The project ARN.
    --next-token=: An identifier that was returned from the previous call to this operation, which can be used to return the next set of items in the list.
    --type=: The device pools' type.
completion:
    flag:
        type:
            - CURATED
            - PRIVATE
documentation:
    command: Gets information about device pools.
    flag:
        arn: The project ARN.
        next-token: An identifier that was returned from the previous call to this operation, which can be used to return the next set of items in the list.
        type: |-
            The device pools' type.

            Allowed values include:

            - CURATED: A device pool that is created and managed by AWS Device Farm.
            - PRIVATE: A device pool that is created and managed by the device pool developer.
