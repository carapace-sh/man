name: create-transformer
description: Creates a transformer.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Reserved for future use.
    --edi-type=: Specifies the details for the EDI standard that is being used for the transformer.
    --file-format=: Specifies that the currently supported file formats for EDI transformations are `JSON` and `XML`.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --input-conversion=: Specify the `InputConversion` object, which contains the format options for the inbound transformation.
    --mapping-template=: Specifies the mapping template for the transformer.
    --mapping=: Specify the structure that contains the mapping template and its language (either XSLT or JSONATA).
    --name=!: Specifies the name of the transformer, used to identify it.
    --output-conversion=: A structure that contains the `OutputConversion` object, which contains the format options for the outbound transformation.
    --sample-document=: Specifies a sample EDI document that is used by a transformer as a guide for processing the EDI data.
    --sample-documents=: Specify a structure that contains the Amazon S3 bucket and an array of the corresponding keys used to identify the location for your sample documents.
    --tags=: Specifies the key-value pairs assigned to ARNs that you can use to group and search for resources by type.
completion:
    flag:
        file-format:
            - XML
            - JSON
            - NOT_USED
documentation:
    command: |-
        Creates a transformer. Amazon Web Services B2B Data Interchange currently supports two scenarios:

        - *Inbound EDI*: the Amazon Web Services customer receives an EDI file from their trading partner. Amazon Web Services B2B Data Interchange converts this EDI file into a JSON or XML file with a service-defined structure. A mapping template provided by the customer, in JSONata or XSLT format, is optionally applied to this file to produce a JSON or XML file with the structure the customer requires.
        - *Outbound EDI*: the Amazon Web Services customer has a JSON or XML file containing data that they wish to use in an EDI file. A mapping template, provided by the customer (in either JSONata or XSLT format) is applied to this file to generate a JSON or XML file in the service-defined structure. This file is then converted to an EDI file.

        The following fields are provided for backwards compatibility only: `fileFormat`, `mappingTemplate`, `ediType`, and `sampleDocument`.

        - Use the `mapping` data type in place of `mappingTemplate` and `fileFormat`
        - Use the `sampleDocuments` data type in place of `sampleDocument`
        - Use either the `inputConversion` or `outputConversion` in place of `ediType`
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Reserved for future use.
        edi-type: Specifies the details for the EDI standard that is being used for the transformer. Currently, only X12 is supported. X12 is a set of standards and corresponding messages that define specific business documents.
        file-format: Specifies that the currently supported file formats for EDI transformations are `JSON` and `XML`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        input-conversion: Specify the `InputConversion` object, which contains the format options for the inbound transformation.
        mapping: Specify the structure that contains the mapping template and its language (either XSLT or JSONATA).
        mapping-template: |-
            Specifies the mapping template for the transformer. This template is used to map the parsed EDI file using JSONata or XSLT.

            This parameter is available for backwards compatibility. Use the [Mapping](https://docs.aws.amazon.com/b2bi/latest/APIReference/API_Mapping.html) data type instead.
        name: Specifies the name of the transformer, used to identify it.
        output-conversion: A structure that contains the `OutputConversion` object, which contains the format options for the outbound transformation.
        sample-document: Specifies a sample EDI document that is used by a transformer as a guide for processing the EDI data.
        sample-documents: Specify a structure that contains the Amazon S3 bucket and an array of the corresponding keys used to identify the location for your sample documents.
        tags: Specifies the key-value pairs assigned to ARNs that you can use to group and search for resources by type. You can attach this metadata to resources (capabilities, partnerships, and so on) for any purpose.
