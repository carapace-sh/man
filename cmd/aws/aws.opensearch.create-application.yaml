name: create-application
description: Creates an OpenSearch UI application.
flags:
    --app-configs=: Configuration settings for the OpenSearch application, including administrative options.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Unique, case-sensitive identifier to ensure idempotency of the request.
    --data-sources=: The data sources to link to the OpenSearch application.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --iam-identity-center-options=: Configuration settings for integrating Amazon Web Services IAM Identity Center with the OpenSearch application.
    --name=!: The unique name of the OpenSearch application.
    --tag-list=: ""
documentation:
    command: Creates an OpenSearch UI application. For more information, see [Using the OpenSearch user interface in Amazon OpenSearch Service](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/application.html).
    flag:
        app-configs: Configuration settings for the OpenSearch application, including administrative options.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Unique, case-sensitive identifier to ensure idempotency of the request.
        data-sources: The data sources to link to the OpenSearch application.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        iam-identity-center-options: Configuration settings for integrating Amazon Web Services IAM Identity Center with the OpenSearch application.
        name: The unique name of the OpenSearch application. Names must be unique within an Amazon Web Services Region for each account.
        tag-list: ""
