name: list-browser-sessions
description: Retrieves a list of browser sessions in Amazon Bedrock that match the specified criteria.
flags:
    --browser-identifier=!: The unique identifier of the browser to list sessions for.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of results to return in a single call.
    --next-token=: The token for the next set of results.
    --status=: The status of the browser sessions to list.
completion:
    flag:
        status:
            - READY
            - TERMINATED
documentation:
    command: |-
        Retrieves a list of browser sessions in Amazon Bedrock that match the specified criteria. This operation returns summary information about each session, including identifiers, status, and timestamps.

        You can filter the results by browser identifier and session status. The operation supports pagination to handle large result sets efficiently.

        We recommend using pagination to ensure that the operation returns quickly and successfully when retrieving large numbers of sessions.

        The following operations are related to `ListBrowserSessions`:

        - [StartBrowserSession](https://docs.aws.amazon.com/API_StartBrowserSession.html)
        - [GetBrowserSession](https://docs.aws.amazon.com/API_GetBrowserSession.html)
    flag:
        browser-identifier: The unique identifier of the browser to list sessions for. If specified, only sessions for this browser are returned. If not specified, sessions for all browsers are returned.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The maximum number of results to return in a single call. The default value is 10. Valid values range from 1 to 100. To retrieve the remaining results, make another call with the returned `nextToken` value.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results. If not specified, Amazon Bedrock returns the first page of results.
        status: The status of the browser sessions to list. Valid values include ACTIVE, STOPPING, and STOPPED. If not specified, sessions with any status are returned.
