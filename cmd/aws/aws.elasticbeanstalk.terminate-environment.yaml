name: terminate-environment
description: Terminates the specified environment.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --environment-id=: The ID of the environment to terminate.
    --environment-name=: The name of the environment to terminate.
    --force-terminate: Terminates the target environment even if another environment in the same group is dependent on it.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-force-terminate: Terminates the target environment even if another environment in the same group is dependent on it.
    --no-terminate-resources: 'Indicates whether the associated AWS resources should shut down when the environment is terminated:'
    --terminate-resources: 'Indicates whether the associated AWS resources should shut down when the environment is terminated:'
documentation:
    command: Terminates the specified environment.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        environment-id: |-
            The ID of the environment to terminate.

            Condition: You must specify either this or an EnvironmentName, or both. If you do not specify either, AWS Elastic Beanstalk returns `MissingRequiredParameter` error.
        environment-name: |-
            The name of the environment to terminate.

            Condition: You must specify either this or an EnvironmentId, or both. If you do not specify either, AWS Elastic Beanstalk returns `MissingRequiredParameter` error.
        force-terminate: Terminates the target environment even if another environment in the same group is dependent on it.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        terminate-resources: |-
            Indicates whether the associated AWS resources should shut down when the environment is terminated:

            - `true`: The specified environment as well as the associated AWS resources, such as Auto Scaling group and LoadBalancer, are terminated.
            - `false`: AWS Elastic Beanstalk resource management is removed from the environment, but the AWS resources continue to operate.

            For more information, see the [AWS Elastic Beanstalk User Guide.](https://docs.aws.amazon.com/elasticbeanstalk/latest/ug/)

            Default: `true`

            Valid Values: `true` | `false`
