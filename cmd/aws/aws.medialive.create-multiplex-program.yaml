name: create-multiplex-program
description: Create a new program in the multiplex.
flags:
    --multiplex-id=!: ID of the multiplex where the program is to be created.
    --multiplex-program-settings=!: The settings for this multiplex program.
    --program-name=!: Name of multiplex program.
    --request-id=!: Unique request ID.
documentation:
    command: Create a new program in the multiplex.
    flag:
        multiplex-id: ID of the multiplex where the program is to be created.
        multiplex-program-settings: The settings for this multiplex program.
        program-name: Name of multiplex program.
        request-id: Unique request ID. This prevents retries from creating multiple resources.
