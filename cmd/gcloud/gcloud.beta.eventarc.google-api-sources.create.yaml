name: create
description: '*(BETA)*  Create an Eventarc Google API source.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --crypto-key=: Fully qualified name of the crypto key to use for customer-managed encryption.
    --destination-message-bus-project=: Project ID of the Google Cloud project for the message bus.
    --destination-message-bus=!: ID of the message bus or fully qualified identifier for the message bus.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location for the Eventarc Google API source, which should be one of the supported regions.
    --logging-config=: The logging config for the Google API source.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-organization-subscription&: The organization subscription for the resource.
    --organization-subscription: The organization subscription for the resource.
    --project-subscriptions=: The project subscriptions for the resource.
completion:
    flag:
        logging-config:
            - NONE
            - DEBUG
            - INFO
            - NOTICE
            - WARNING
            - ERROR
            - CRITICAL
            - ALERT
            - EMERGENCY
documentation:
    command: '*(BETA)*  Create an Eventarc Google API source.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        crypto-key: Fully qualified name of the crypto key to use for customer-managed encryption. If this is unspecified, Google-managed keys will be used for encryption.
        destination-message-bus: |-
            ID of the message bus or fully qualified identifier for the message bus.
            +
            To set the `message-bus` attribute:
            * provide the argument `--destination-message-bus` on the command line.
        destination-message-bus-project: |-
            Project ID of the Google Cloud project for the message bus.
            +
            To set the `project` attribute:
            * provide the argument `--destination-message-bus` on the command line with a fully specified name;
            * provide the argument `--destination-message-bus-project` on the command line;
            * provide the argument `--project` on the command line;
            * set the property `core/project`.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location for the Eventarc Google API source, which should be one of the supported regions. Alternatively, set the [eventarc/location] property.
            +
            To set the `location` attribute:
            * provide the argument `google_api_source` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `eventarc/location`.
        logging-config: 'The logging config for the Google API source. _LOGGING_CONFIG_ must be one of: *NONE*, *DEBUG*, *INFO*, *NOTICE*, *WARNING*, *ERROR*, *CRITICAL*, *ALERT*, *EMERGENCY*.'
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-organization-subscription: The organization subscription for the resource.
        organization-subscription: The organization subscription for the resource. Use *--organization-subscription* to enable and *--no-organization-subscription* to disable.
        project-subscriptions: The project subscriptions for the resource.
