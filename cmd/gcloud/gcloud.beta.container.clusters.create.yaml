documentation:
    command: '*(BETA)*  Create a cluster for running containers.'
    flag:
        accelerator: |-
            Attaches accelerators (e.g. GPUs) to all nodes.
            +
            *type*::: (Required) The specific type (e.g. nvidia-tesla-t4 for NVIDIA T4)
            of accelerator to attach to the instances. Use ```gcloud compute
            accelerator-types list``` to learn about all available accelerator types.
            +
            *count*::: (Optional) The number of accelerators to attach to the
            instances. The default value is 1.
            +
            *gpu-driver-version*::: (Optional) The NVIDIA driver version to install. GPU_DRIVER_VERSION must be one of:
            +
              `default`: Install the default driver version for this GKE version. For GKE version 1.30.1-gke.1156000 and later, this is the default option.
            +
              `latest`: Install the latest driver version available for this GKE version.
              Can only be used for nodes that use Container-Optimized OS.
            +
              `disabled`: Skip automatic driver installation. You must manually install a
              driver after you create the cluster. For GKE version 1.30.1-gke.1156000 and earlier, this is the default option.
              To manually install the GPU driver, refer to https://cloud.google.com/kubernetes-engine/docs/how-to/gpus#installing_drivers.
            +
            *gpu-partition-size*::: (Optional) The GPU partition size used when running multi-instance GPUs.
            For information about multi-instance GPUs,
            refer to: https://cloud.google.com/kubernetes-engine/docs/how-to/gpus-multi
            +
            *gpu-sharing-strategy*::: (Optional) The GPU sharing strategy (e.g. time-sharing) to use.
            For information about GPU sharing,
            refer to: https://cloud.google.com/kubernetes-engine/docs/concepts/timesharing-gpus
            +
            *max-shared-clients-per-gpu*::: (Optional) The max number of containers allowed
            to share each GPU on the node. This field is used together with `gpu-sharing-strategy`.
        additional-zones: |-
            (DEPRECATED) The set of additional zones in which the specified node footprint should be
            replicated. All zones must be in the same region as the cluster's primary zone.
            If additional-zones is not specified, all nodes will be in the cluster's primary
            zone.
            +
            Note that `NUM_NODES` nodes will be created in each zone, such that if you
            specify `--num-nodes=4` and choose one additional zone, 8 nodes will be created.
            +
            Multiple locations can be specified, separated by commas. For example:
            +
              $ {command} example-cluster --zone us-central1-a --additional-zones us-central1-b,us-central1-c
            +
            This flag is deprecated. Use --node-locations=PRIMARY_ZONE,[ZONE,...] instead.
        additive-vpc-scope-dns-domain: The domain used in Additive VPC scope. Only works with Cluster Scope.
        addons: |-
            Addons
            (https://cloud.google.com/kubernetes-engine/docs/reference/rest/v1/projects.locations.clusters#Cluster.AddonsConfig)
            are additional Kubernetes cluster components. Addons specified by this flag will
            be enabled. The others will be disabled. Default addons: HttpLoadBalancing, HorizontalPodAutoscaling.
            The Istio addon is deprecated and removed.
            For more information and migration, see https://cloud.google.com/istio/docs/istio-on-gke/migrate-to-anthos-service-mesh.
            ADDON must be one of: HttpLoadBalancing, HorizontalPodAutoscaling, KubernetesDashboard, NetworkPolicy, NodeLocalDNS, ConfigConnector, GcePersistentDiskCsiDriver, GcpFilestoreCsiDriver, BackupRestore, GcsFuseCsiDriver, ParallelstoreCsiDriver, HighScaleCheckpointing, LustreCsiDriver, RayOperator, Istio, CloudRun.
        aggregation-ca: The Certificate Authority Service caPool that will back the aggregation CA
        allow-route-overlap: |-
            Allows the provided cluster CIDRs to overlap with existing routes
            that are less specific and do not terminate at a VM.
            +
            When enabled, `--cluster-ipv4-cidr` must be fully specified (e.g. `10.96.0.0/14`
            , but not `/14`). If `--enable-ip-alias` is also specified, both
            `--cluster-ipv4-cidr` and `--services-ipv4-cidr` must be fully specified.
            +
            Must be used in conjunction with '--enable-ip-alias' or '--no-enable-ip-alias'.
        alpha-cluster-feature-gates: |-
            Selectively enable or disable Kubernetes alpha and beta kubernetesfeature gates on alpha GKE cluster.
            Alpha clusters are not covered by the Kubernetes Engine SLA and should not be used for production workloads.
        anonymous-authentication-config: |-
            Enable or restrict anonymous access to the cluster. When enabled,
                  anonymous users will be authenticated as system:anonymous with the group
                  system:unauthenticated. Limiting access restricts anonymous access to only
                  the health check endpoints /readyz, /livez, and /healthz.
            +
            _ANONYMOUS_AUTHENTICATION_CONFIG_ must be one of:
            +
            *ENABLED*::: 'ENABLED' enables anonymous calls.
            *LIMITED*::: 'LIMITED' restricts anonymous access to the cluster. Only calls to
            the health check endpoints are allowed anonymously, all other calls
            will be rejected.
            :::
            +
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        auto-monitoring-scope: |-
            Enables Auto-Monitoring for a specific scope within the cluster.
            ALL: Enables Auto-Monitoring for all supported workloads within the cluster.
            NONE: Disables Auto-Monitoring. _AUTO_MONITORING_SCOPE_ must be one of: *ALL*, *NONE*.
        autopilot-privileged-admission: |4
              Specify Cloud Storage object paths pointing to privileged workload allowlists
              to be authorized for use in Autopilot mode.

              The value is a comma-separated list of Cloud Storage object paths in the format 'gke://<partner_name>/<app_name>/<allowlist_path>' for GKE-owned allowlists and 'gs://<bucket_name>/<allowlist_path>' for user-owned allowlists.
              Wildcards are supported to authorize all allowlists under specific
              paths.

            Examples:
              $ {command} --autopilot-privileged-admission=gke://*
              $ {command} --autopilot-privileged-admission=gke://my-partner/my-app/my-allowlist.yaml
              $ {command} --autopilot-privileged-admission=gs://my-bucket/allowlists/my-allowlist.yaml
              $ {command} --autopilot-privileged-admission=gs://my-bucket/*
              $ {command} --autopilot-privileged-admission=gke://my-partner/my-app/*,gs://my-bucket/allowlists/my-allowlist.yaml
              $ {command} --autopilot-privileged-admission=""
        autopilot-workload-policies: |-
            Add Autopilot workload policies to the cluster.
            +
            Examples:
            +
              $ {command} example-cluster --autopilot-workload-policies=allow-net-admin
            +
            The only supported workload policy is 'allow-net-admin'.
        autoprovisioning-config-file: |-
            Path of the JSON/YAML file which contains information about the
            cluster's node autoprovisioning configuration. Currently it contains
            a list of resource limits, identity defaults for autoprovisioning, node upgrade
            settings, node management settings, minimum cpu platform, image type, node locations for
            autoprovisioning, disk type and size configuration, Shielded instance settings,
            and customer-managed encryption keys settings.
            +
            Resource limits are specified in the field 'resourceLimits'.
            Each resource limits definition contains three fields:
            resourceType, maximum and minimum.
            Resource type can be "cpu", "memory" or an accelerator (e.g.
            "nvidia-tesla-t4" for NVIDIA T4). Use gcloud compute accelerator-types
            list to learn about available accelerator types.
            Maximum is the maximum allowed amount with the unit of the resource.
            Minimum is the minimum allowed amount with the unit of the resource.
            +
            Identity default contains at most one of the below fields:
            serviceAccount: The Google Cloud Platform Service Account to be used by node VMs in
            autoprovisioned node pools. If not specified, the project's default service account
            is used.
            scopes: A list of scopes to be used by node instances in autoprovisioned node pools.
            Multiple scopes can be specified, separated by commas. For information on defaults,
            look at:
            https://cloud.google.com/sdk/gcloud/reference/container/clusters/create#--scopes
            +
            Node Upgrade settings are specified under the field
            'upgradeSettings', which has the following fields:
            maxSurgeUpgrade: Number of extra (surge) nodes to be created on
            each upgrade of an autoprovisioned node pool.
            maxUnavailableUpgrade: Number of nodes that can be unavailable at the
            same time on each upgrade of an autoprovisioned node pool.
            +
            Node Management settings are specified under the field
            'management', which has the following fields:
            autoUpgrade: A boolean field that indicates if node
            autoupgrade is enabled for autoprovisioned node pools.
            autoRepair: A boolean field that indicates if node
            autorepair is enabled for autoprovisioned node pools.
            +
            minCpuPlatform (deprecated): If specified, new autoprovisioned nodes will be
            scheduled on host with specified CPU architecture or a newer one.
            Note: Min CPU platform can only be specified in Beta and Alpha.
            +
            Autoprovisioned node image is specified under the 'imageType' field. If not specified
            the default value will be applied.
            +
            Autoprovisioning locations is a set of zones where new node pools
            can be created by Autoprovisioning. Autoprovisioning locations are
            specified in the field 'autoprovisioningLocations'. All zones must
            be in the same region as the cluster's master(s).
            +
            Disk type and size are specified under the 'diskType' and 'diskSizeGb' fields,
            respectively. If specified, new autoprovisioned nodes will be created with
            custom boot disks configured by these settings.
            +
            Shielded instance settings are specified under the 'shieldedInstanceConfig'
            field, which has the following fields:
            enableSecureBoot: A boolean field that indicates if secure boot is enabled for
            autoprovisioned nodes.
            enableIntegrityMonitoring: A boolean field that indicates if integrity
            monitoring is enabled for autoprovisioned nodes.
            +
            Customer Managed Encryption Keys (CMEK) used by new auto-provisioned node pools
            can be specified in the 'bootDiskKmsKey' field.
            +
            Use a full or relative path to a local file containing the value of autoprovisioning_config_file.
        autoprovisioning-enable-insecure-kubelet-readonly-port: |-
            Enables the Kubelet's insecure read only port for Autoprovisioned
            Node Pools.
            +
            If not set, the value from nodePoolDefaults.nodeConfigDefaults will be used.
            +
            To disable the readonly port
            `--no-autoprovisioning-enable-insecure-kubelet-readonly-port`.
        autoprovisioning-image-type: Node Autoprovisioning will create new nodes with the specified image type
        autoprovisioning-locations: |-
            Set of zones where new node pools can be created by autoprovisioning.
            All zones must be in the same region as the cluster's master(s).
            Multiple locations can be specified, separated by commas.
        autoprovisioning-max-surge-upgrade: |-
            Number of extra (surge) nodes to be created on each upgrade of an
            autoprovisioned node pool.
        autoprovisioning-max-unavailable-upgrade: |-
            Number of nodes that can be unavailable at the same time on each
            upgrade of an autoprovisioned node pool.
        autoprovisioning-min-cpu-platform: |-
            (DEPRECATED) If specified, new autoprovisioned nodes will be scheduled on host with
            specified CPU architecture or a newer one.
            +
            The `--autoprovisioning-min-cpu-platform` flag is deprecated and will be removed in an upcoming release. More info: https://cloud.google.com/kubernetes-engine/docs/release-notes#March_08_2022
        autoprovisioning-network-tags: |-
            Applies the given Compute Engine tags (comma separated) on all nodes in the auto-provisioned node pools of the new Standard cluster or the new Autopilot cluster.
            +
            Examples:
            +
              $ {command} example-cluster --autoprovisioning-network-tags=tag1,tag2
            +
            New nodes in auto-provisioned node pools, including ones created by resize or recreate, will have these tags
            on the Compute Engine API instance object and can be used in firewall rules.
            See https://cloud.google.com/sdk/gcloud/reference/compute/firewall-rules/create
            for examples.
        autoprovisioning-node-pool-soak-duration: |-
            Time in seconds to be spent waiting during blue-green upgrade before
            deleting the blue pool and completing the update.
            This argument should be used in conjunction with
            `--enable-autoprovisioning-blue-green-upgrade` to take effect.
        autoprovisioning-resource-manager-tags: |-
            Applies the specified comma-separated resource manager tags that has the
            GCE_FIREWALL purpose to all nodes in the new Autopilot cluster or
            all auto-provisioned nodes in the new Standard cluster.
            +
            Examples:
            +
              $ {command} example-cluster --autoprovisioning-resource-manager-tags=tagKeys/1234=tagValues/2345
              $ {command} example-cluster --autoprovisioning-resource-manager-tags=my-project/key1=value1
              $ {command} example-cluster --autoprovisioning-resource-manager-tags=12345/key1=value1,23456/key2=value2
              $ {command} example-cluster --autoprovisioning-resource-manager-tags=
            +
            All nodes in an Autopilot cluster or all auto-provisioned nodes in a Standard
            cluster, including nodes that are resized or re-created, will have the specified
            tags on the corresponding Instance object in the Compute Engine API. You can
            reference these tags in network firewall policy rules. For instructions, see
            https://cloud.google.com/firewall/docs/use-tags-for-firewalls.
        autoprovisioning-scopes: |-
            The scopes to be used by node instances in autoprovisioned node pools.
            Multiple scopes can be specified, separated by commas. For information
            on defaults, look at:
            https://cloud.google.com/sdk/gcloud/reference/container/clusters/create#--scopes
        autoprovisioning-service-account: |-
            The Google Cloud Platform Service Account to be used by node VMs in
            autoprovisioned node pools. If not specified, the project default
            service account is used.
        autoprovisioning-standard-rollout-policy: |-
            Standard rollout policy options for blue-green upgrade.
            This argument should be used in conjunction with
            `--enable-autoprovisioning-blue-green-upgrade` to take effect.
            +
            Batch sizes are specified by one of, batch-node-count or batch-percent.
            The duration between batches is specified by batch-soak-duration.
            +
            Example:
            `--standard-rollout-policy=batch-node-count=3,batch-soak-duration=60s`
            `--standard-rollout-policy=batch-percent=0.05,batch-soak-duration=180s`
        autoscaling-profile: |-
            Set autoscaling behaviour, choices are 'optimize-utilization' and 'balanced'.
            Default is 'balanced'.
        binauthz-evaluation-mode: 'Enable Binary Authorization for this cluster. _BINAUTHZ_EVALUATION_MODE_ must be one of: *disabled*, *policy-bindings*, *policy-bindings-and-project-singleton-policy-enforce*, *project-singleton-policy-enforce*.'
        binauthz-policy-bindings: |-
            The relative resource name of the Binary Authorization policy to audit
            and/or enforce. GKE policies have the following format:
            `projects/{project_number}/platforms/gke/policies/{policy_id}`.
        boot-disk-kms-key: |-
            The Customer Managed Encryption Key used to encrypt the boot disk attached
            to each node in the node pool. This should be of the form
            projects/[KEY_PROJECT_ID]/locations/[LOCATION]/keyRings/[RING_NAME]/cryptoKeys/[KEY_NAME].
            For more information about protecting resources with Cloud KMS Keys please
            see:
            https://cloud.google.com/compute/docs/disks/customer-managed-encryption
        boot-disk-provisioned-iops: Configure the Provisioned IOPS for the node pool boot disks. Only valid for hyperdisk-balanced boot disks.
        boot-disk-provisioned-throughput: Configure the Provisioned Throughput for the node pool boot disks. Only valid for hyperdisk-balanced boot disks.
        cloud-run-config: |-
            Configurations for Cloud Run addon, requires `--addons=CloudRun` for create
            and `--update-addons=CloudRun=ENABLED` for update.
            +
            *load-balancer-type*::: (Optional) Type of load-balancer-type EXTERNAL or
            INTERNAL.
            +
            Examples:
            +
              $ {command} example-cluster --cloud-run-config=load-balancer-type=INTERNAL
        cluster-ca: The Certificate Authority Service caPool that will back the cluster CA
        cluster-dns: |-
            DNS provider to use for this cluster. _CLUSTER_DNS_ must be one of:
            +
            *clouddns*::: Selects Cloud DNS as the DNS provider for the cluster.
            *default*::: Selects the default DNS provider (kube-dns) for the cluster.
            *kubedns*::: Selects Kube DNS as the DNS provider for the cluster.
            :::
            +
        cluster-dns-domain: |-
            DNS domain for this cluster.
            The default value is `cluster.local`.
            This is configurable when `--cluster-dns=clouddns` and
             `--cluster-dns-scope=vpc` are set.
            The value must be a valid DNS subdomain as defined in RFC 1123.
        cluster-dns-scope: |-
            DNS scope for the Cloud DNS zone created - valid only with
             `--cluster-dns=clouddns`. Defaults to cluster.
            +
            _CLUSTER_DNS_SCOPE_ must be one of:
            +
            *cluster*::: Configures the Cloud DNS zone to be private to the cluster.
            *vpc*::: Configures the Cloud DNS zone to be private to the VPC Network.
            :::
            +
        cluster-ipv4-cidr: |-
            The IP address range for the pods in this cluster in CIDR notation (e.g.
            10.0.0.0/14). Prior to Kubernetes version 1.7.0 this must be a subset of
            10.0.0.0/8; however, starting with version 1.7.0 can be any RFC 1918 IP range.
            +
            If you omit this option, a range is chosen automatically.  The automatically
            chosen range is randomly selected from 10.0.0.0/8 and will not include IP
            address ranges allocated to VMs, existing routes, or ranges allocated to other
            clusters. The automatically chosen range might conflict with reserved IP
            addresses, dynamic routes, or routes within VPCs that peer with this cluster.
            You should specify `--cluster-ipv4-cidr` to prevent conflicts.
            +
            This field is not applicable in a Shared VPC setup where the IP address range
            for the pods must be specified with `--cluster-secondary-range-name`
        cluster-secondary-range-name: |-
            Set the secondary range to be used as the source for pod IPs. Alias
            ranges will be allocated from this secondary range.  NAME must be the
            name of an existing secondary range in the cluster subnetwork.
            +

            Cannot be specified unless '--enable-ip-alias' option is also specified.
            Cannot be used with '--create-subnetwork' option.
        cluster-version: |-
            The Kubernetes version to use for the master and nodes. Defaults to
            server-specified.
            +
            The default Kubernetes version is available using the following command.
            +
              $ gcloud container get-server-config
        compliance: 'Sets enablement mode for Compliance. Must provide one of: enabled, disabled.'
        compliance-standards: |
            Comma-delimited list of standards to be enabled. See
            https://cloud.google.com/kubernetes-engine/fleet-management/docs/about-compliance-dashboard#how-compliance-works
        confidential-node-type: |-
            Enable confidential nodes for the cluster. Enabling Confidential Nodes
            will create nodes using Confidential VM
            https://cloud.google.com/compute/confidential-vm/docs/about-cvm. _CONFIDENTIAL_NODE_TYPE_ must be one of: *sev*, *sev_snp*, *tdx*.
        containerd-config-from-file: |-
            Path of the YAML file that contains containerd configuration entries like configuring access to private image registries.
            +
            For detailed information on the configuration usage, please refer to https://cloud.google.com/kubernetes-engine/docs/how-to/customize-containerd-configuration.
            +
            Note: Updating the containerd configuration of an existing cluster or node pool requires recreation of the existing nodes, which might cause disruptions in running workloads.
            +
            Use a full or relative path to a local file containing the value of containerd_config.
        control-plane-disk-encryption-key: The Cloud KMS symmetric encryption cryptoKey that will be used to encrypt the control plane disks
        control-plane-egress: |
            Configures the egress policy for the GKE control plane to control outbound
            traffic from the kube-apiserver.

            * `NONE`: (Recommended) Provides maximum security. This mode removes the control
              plane's public IP address and blocks all outbound traffic from the
              kube-apiserver by default, preventing unexpected data exfiltration. Webhooks
              that use `clientConfig.url` will be disabled. Essential GKE-managed services
              are still permitted to function via an internal allowlist.

            * `VIA_CONTROL_PLANE`: (Default) Maintains backward compatibility. The control
              plane retains its public IP address and allows egress traffic from the
              kube-apiserver.
        cp-disk-encryption-key: ""
        create-subnetwork: |-
            Create a new subnetwork for the cluster. The name and range of the
            subnetwork can be customized via optional 'name' and 'range' key-value
            pairs.
            +
            'name' specifies the name of the subnetwork to be created.
            +
            'range' specifies the IP range for the new subnetwork. This can either
            be a netmask size (e.g. '/20') or a CIDR range (e.g. '10.0.0.0/20').
            If a netmask size is specified, the IP is automatically taken from the
            free space in the cluster's network.
            +
            Examples:
            +
            Create a new subnetwork with a default name and size.
            +
              $ {command} --create-subnetwork ""
            +
            Create a new subnetwork named "my-subnet" with netmask of size 21.
            +
              $ {command} --create-subnetwork name=my-subnet,range=/21
            +
            Create a new subnetwork with a default name with the primary range of
            10.100.0.0/16.
            +
              $ {command} --create-subnetwork range=10.100.0.0/16
            +
            Create a new subnetwork with the name "my-subnet" with a default range.
            +
              $ {command} --create-subnetwork name=my-subnet
            +

            Cannot be specified unless '--enable-ip-alias' option is also specified.
            Cannot be used in conjunction with '--subnetwork' option.
        cross-connect-subnetworks: ""
        data-cache-count: Specifies the number of local SSDs to be utilized for GKE Data Cache in the cluster.
        database-encryption-key: |-
            Enable Database Encryption.
            +
            Enable database encryption that will be used to encrypt Kubernetes Secrets at
            the application layer. The key provided should be the resource ID in the format of
            `projects/[KEY_PROJECT_ID]/locations/[LOCATION]/keyRings/[RING_NAME]/cryptoKeys/[KEY_NAME]`.
            For more information, see
            https://cloud.google.com/kubernetes-engine/docs/how-to/encrypting-secrets.
        datapath-provider: |
            Select datapath provider for the cluster. Defaults to `legacy`.

            $ {command} --datapath-provider=legacy
            $ {command} --datapath-provider=advanced
        dataplane-v2-observability-mode: "(REMOVED) \nSelect Advanced Datapath Observability mode for the cluster. Defaults to `DISABLED`.\n+\nAdvanced Datapath Observability allows for a real-time view into pod-to-pod traffic within your cluster.\n+\nExamples:\n+\n  $ {command} --dataplane-v2-observability-mode=DISABLED\n+\n  $ {command} --dataplane-v2-observability-mode=INTERNAL_VPC_LB\n+\n  $ {command} --dataplane-v2-observability-mode=EXTERNAL_LB\n+\nFlag --dataplane-v2-observability-mode has been removed.\n+\n_DATAPLANE_V2_OBSERVABILITY_MODE_ must be one of:\n+\n*DISABLED*::: Disables Advanced Datapath Observability.\n*EXTERNAL_LB*::: Makes Advanced Datapath Observability available to the external network.\n*INTERNAL_VPC_LB*::: Makes Advanced Datapath Observability available from the VPC network.\n:::\n+"
        default-max-pods-per-node: |-
            The default max number of pods per node for node pools in the cluster.
            +
            This flag sets the default max-pods-per-node for node pools in the cluster. If
            --max-pods-per-node is not specified explicitly for a node pool, this flag
            value will be used.
            +
            Must be used in conjunction with '--enable-ip-alias'.
        disable-additive-vpc-scope: Disables Additive VPC Scope.
        disable-dataplane-v2-flow-observability: Disables Advanced Datapath Observability.
        disable-dataplane-v2-metrics: Stops exposing advanced datapath flow metrics on node port.
        disable-default-snat: |-
            Disable default source NAT rules applied in cluster nodes.
            +
            By default, cluster nodes perform source network address translation (SNAT)
            for packets sent from Pod IP address sources to destination IP addresses
            that are not in the non-masquerade CIDRs list.
            For more details about SNAT and IP masquerading, see:
            https://cloud.google.com/kubernetes-engine/docs/how-to/ip-masquerade-agent#how_ipmasq_works
            SNAT changes the packet's source IP address to the node's internal IP address.
            +
            When this flag is set, GKE does not perform SNAT for packets sent to any destination.
            You must set this flag if the cluster uses privately reused public IPs.
            +
            The --disable-default-snat flag is only applicable to private GKE clusters, which are
            inherently VPC-native. Thus, --disable-default-snat requires that you also set
            --enable-ip-alias and --enable-private-nodes.
        disable-l4-lb-firewall-reconciliation: |-
            Disable reconciliation on the cluster for L4 Load Balancer VPC
            firewalls targeting ingress traffic.
        disable-pod-cidr-overprovision: |-
            Disables pod cidr overprovision on nodes.
            Pod cidr overprovisioning is enabled by default.
        disable-pod-snapshots: Disable the Pod Snapshot feature on the cluster.
        disk-size: Size for node VM boot disks in GB. Defaults to 100GB.
        disk-type: 'Type of the node VM boot disk. For version 1.24 and later, defaults to pd-balanced. For versions earlier than 1.24, defaults to pd-standard. _DISK_TYPE_ must be one of: *pd-standard*, *pd-ssd*, *pd-balanced*, *hyperdisk-balanced*, *hyperdisk-extreme*, *hyperdisk-throughput*.'
        enable-alts: |
            Enable Workload ALTS.
        enable-authorized-networks-on-private-endpoint: |-
            Enable enforcement of --master-authorized-networks CIDR ranges for
            traffic reaching cluster's control plane via private IP.
        enable-auto-ipam: Enable the Auto IP Address Management (Auto IPAM) feature for the cluster.
        enable-autoprovisioning: |-
            Enables  node autoprovisioning for a cluster.
            +
            Cluster Autoscaler will be able to create new node pools. Requires maximum CPU
            and memory limits to be specified.
        enable-autoprovisioning-autorepair: |-
            Enable node autorepair for autoprovisioned node pools.
            Use --no-enable-autoprovisioning-autorepair to disable.
        enable-autoprovisioning-autoupgrade: |-
            Enable node autoupgrade for autoprovisioned node pools.
            Use --no-enable-autoprovisioning-autoupgrade to disable.
        enable-autoprovisioning-blue-green-upgrade: Whether to use blue-green upgrade for the autoprovisioned node pool.
        enable-autoprovisioning-surge-upgrade: Whether to use surge upgrade for the autoprovisioned node pool.
        enable-autorepair: |-
            Enable node autorepair feature for a cluster's default node pool(s).
            +
              $ {command} example-cluster --enable-autorepair
            +
            Node autorepair is enabled by default for clusters using COS, COS_CONTAINERD, UBUNTU or UBUNTU_CONTAINERD
            as a base image, use --no-enable-autorepair to disable.
            +
            See https://cloud.google.com/kubernetes-engine/docs/how-to/node-auto-repair for more info.
        enable-autoscaling: |-
            Enables autoscaling for a node pool.
            +
            Enables autoscaling in the node pool specified by --node-pool or
            the default node pool if --node-pool is not provided. If not already,
            --max-nodes or --total-max-nodes must also be set.
        enable-autoupgrade: |-
            Sets autoupgrade feature for a cluster's default node pool(s).
            +
              $ {command} example-cluster --enable-autoupgrade
            +
            See https://cloud.google.com/kubernetes-engine/docs/node-auto-upgrades for more info.
            +
            Enabled by default, use *--no-enable-autoupgrade* to disable.
        enable-basic-auth: |-
            Enable basic (username/password) auth for the cluster.  `--enable-basic-auth` is
            an alias for `--username=admin`; `--no-enable-basic-auth` is an alias for
            `--username=""`. Use `--password` to specify a password; if not, the server will
            randomly generate one. For cluster versions before 1.12, if neither
            `--enable-basic-auth` nor `--username` is specified, `--enable-basic-auth` will
            default to `true`. After 1.12, `--enable-basic-auth` will default to `false`.
        enable-binauthz: |-
            (DEPRECATED) Enable Binary Authorization for this cluster.
            +
            The `--enable-binauthz` flag is deprecated. Please use `--binauthz-evaluation-mode` instead.
        enable-cilium-clusterwide-network-policy: Enable Cilium Clusterwide Network Policies on the cluster. Disabled by default.
        enable-cloud-logging: |-
            (DEPRECATED) Automatically send logs from the cluster to the Google Cloud Logging API.
            +
            Legacy Logging and Monitoring is deprecated. Thus, flag `--enable-cloud-logging` is also deprecated and will be removed in an upcoming release. Please use `--logging` (optionally with `--monitoring`). For more details, please read: https://cloud.google.com/kubernetes-engine/docs/concepts/about-logs and https://cloud.google.com/kubernetes-engine/docs/how-to/configure-metrics.
        enable-cloud-monitoring: |-
            (DEPRECATED) Automatically send metrics from pods in the cluster to the Google Cloud Monitoring API. VM metrics will be collected by Google Compute Engine regardless of this setting.
            +
            Legacy Logging and Monitoring is deprecated. Thus, flag `--enable-cloud-monitoring` is also deprecated. Please use `--monitoring` (optionally with `--logging`). For more details, please read: https://cloud.google.com/kubernetes-engine/docs/how-to/configure-metrics and https://cloud.google.com/kubernetes-engine/docs/concepts/about-logs.
        enable-cloud-run-alpha: |-
            Enable Cloud Run alpha features on this cluster. Selecting this
            option will result in the cluster having all Cloud Run alpha API groups and
            features turned on.
            +
            Cloud Run alpha clusters are not covered by the Cloud Run SLA and should not be
            used for production workloads.
        enable-confidential-nodes: |-
            Enable confidential nodes for the cluster. Enabling Confidential Nodes
            will create nodes using Confidential VM
            https://cloud.google.com/compute/confidential-vm/docs/about-cvm.
        enable-confidential-storage: |-
            Enable confidential storage for the cluster. Enabling Confidential Storage will
            create boot disk with confidential mode
        enable-cost-allocation: |-
            Enable the cost management feature.
            +
            When enabled, you can get informational GKE cost breakdowns by cluster,
            namespace and label in your billing data exported to BigQuery
            (https://cloud.google.com/billing/docs/how-to/export-data-bigquery).
        enable-dataplane-v2: |-
            Enables the new eBPF dataplane for GKE clusters that is required for
            network security, scalability and visibility features.
        enable-dataplane-v2-flow-observability: Enables Advanced Datapath Observability which allows for a real-time view into pod-to-pod traffic within your cluster.
        enable-dataplane-v2-metrics: Exposes advanced datapath flow metrics on node port.
        enable-default-compute-class: |-
            Enable the default compute class to use for the cluster.
            +
            To disable Default Compute Class in an existing cluster, explicitly set flag
            `--no-enable-default-compute-class`.
        enable-dns-access: |-
            Enable access to the cluster's control plane over DNS-based endpoint.
            +
            DNS-based control plane access is recommended.
        enable-experimental-vertical-pod-autoscaling: Enable experimental vertical pod autoscaling featuresfor a cluster.
        enable-fleet: |-
            Set cluster project as the fleet host project. This will register the cluster to the same project.
            To register the cluster to a fleet in a different project, please use `--fleet-project=FLEET_HOST_PROJECT`.
            Example:
            $ {command} --enable-fleet
        enable-fqdn-network-policy: Enable FQDN Network Policies on the cluster. FQDN Network Policies are disabled by default.
        enable-gcfs: Specifies whether to enable GCFS on default initial node pool.
        enable-gke-oidc: |-
            (DEPRECATED) Enable GKE OIDC authentication on the cluster.
            +
            When enabled, users would be able to authenticate to Kubernetes cluster after
            properly setting OIDC config.
            +
            GKE OIDC is by default disabled when creating a new cluster. To disable GKE OIDC
            in an existing cluster, explicitly set flag `--no-enable-gke-oidc`.
            +
            GKE OIDC is being replaced by Identity Service across Anthos and GKE. Thus, flag `--enable-gke-oidc` is also deprecated. Please use `--enable-identity-service` to enable the Identity Service component
        enable-google-cloud-access: |-
            When you enable Google Cloud Access, any public IP addresses owned by Google
            Cloud can reach the public control plane endpoint of your cluster.
        enable-gvnic: |-
            Enable the use of GVNIC for this cluster. Requires re-creation of nodes using
            either a node-pool upgrade or node-pool creation.
        enable-identity-service: |-
            Enable Identity Service component on the cluster.
            +
            When enabled, users can authenticate to Kubernetes cluster with external
            identity providers.
            +
            Identity Service is by default disabled when creating a new cluster.
            To disable Identity Service in an existing cluster, explicitly set flag
            `--no-enable-identity-service`.
        enable-image-streaming: Specifies whether to enable image streaming on cluster.
        enable-insecure-binding-system-authenticated: |-
            Allow using `system:authenticated` as a subject in ClusterRoleBindings and RoleBindings.
            Allowing bindings that reference `system:authenticated` is a security risk and is not recommended.
            +
            To disallow binding `system:authenticated` in a cluster, explicitly set the
            `--no-enable-insecure-binding-system-authenticated` flag instead.
        enable-insecure-binding-system-unauthenticated: |-
            Allow using `system:unauthenticated` and `system:anonymous` as subjects in ClusterRoleBindings and RoleBindings.
            Allowing bindings that reference `system:unauthenticated` and `system:anonymous` are a security risk and is not recommended.
            +
            To disallow binding `system:authenticated` in a cluster, explicitly set the
            `--no-enable-insecure-binding-system-unauthenticated` flag instead.
        enable-insecure-kubelet-readonly-port: |-
            Enables the Kubelet's insecure read only port.
            +
            To disable the readonly port on a cluster or node-pool set the flag to
            `--no-enable-insecure-kubelet-readonly-port`.
        enable-intra-node-visibility: |-
            Enable Intra-node visibility for this cluster.
            +
            Enabling intra-node visibility makes your intra-node pod-to-pod traffic
            visible to the networking fabric. With this feature, you can use VPC flow
            logging or other VPC features for intra-node traffic.
            +
            Enabling it on an existing cluster causes the cluster
            master and the cluster nodes to restart, which might cause a disruption.
        enable-ip-access: |-
            Enable access to the cluster's control plane over private IP and
            public IP if --enable-private-endpoint is not enabled.
        enable-ip-alias: |-
            --enable-ip-alias creates a VPC-native cluster. If you set this option, you
            can optionally specify the IP address ranges to use for Pods and Services.
            For instructions, see
            https://cloud.google.com/kubernetes-engine/docs/how-to/alias-ips.
            +
            --no-enable-ip-alias creates a routes-based cluster. This type of cluster
            routes traffic between Pods using Google Cloud Routes. This option is not
            recommended; use the default VPC-native cluster type instead. For instructions,
            see
            https://cloud.google.com/kubernetes-engine/docs/how-to/routes-based-cluster
            +
            Note: For IPv6-only clusters, these flags are a no-op as IP Aliases do not
            apply, and any specified IP address ranges for Pods and Services will be
            ignored.
            +
            You can't specify both --enable-ip-alias and --no-enable-ip-alias.
            If you omit both --enable-ip-alias and --no-enable-ip-alias,
            the default is a VPC-native cluster.
        enable-k8s-certs-via-dns: Enable K8s client certificates Authentication to the cluster's control plane over DNS-based endpoint.
        enable-k8s-tokens-via-dns: Enable K8s Service Account tokens Authentication to the cluster's control plane over DNS-based endpoint.
        enable-kernel-module-signature-enforcement: |-
            Enforces that kernel modules are signed on all new nodes in the cluster unless
            explicitly overridden with `--no-enable-kernel-module-signature-enforcement`
            when creating the nodepool.
            Use `--no-enable-kernel-module-signature-enforcement` to disable.
            +
            Examples:
            +
              $ {command} example-cluster --enable-kernel-module-signature-enforcement
        enable-kubernetes-alpha: |-
            Enable Kubernetes alpha features on this cluster. Selecting this
            option will result in the cluster having all Kubernetes alpha API groups and
            features turned on. Cluster upgrades (both manual and automatic) will be
            disabled and the cluster will be automatically deleted after 30 days.
            +
            Alpha clusters are not covered by the Kubernetes Engine SLA and should not be
            used for production workloads.
        enable-kubernetes-unstable-apis: |-
            Enable Kubernetes beta API features on this cluster.
            Beta APIs are not expected to be production ready and
            should be avoided in production-grade environments.
        enable-kuberun-alpha: |-
            Enable Cloud Run alpha features on this cluster. Selecting this
            option will result in the cluster having all Cloud Run alpha API groups and
            features turned on.

            Cloud Run alpha clusters are not covered by the Cloud Run SLA and should not be
            used for production workloads.
        enable-l4-ilb-subsetting: Enable Subsetting for L4 ILB services created on this cluster.
        enable-legacy-authorization: |-
            Enables the legacy ABAC authentication for the cluster.
            User rights are granted through the use of policies which combine attributes
            together. For a detailed look at these properties and related formats, see
            https://kubernetes.io/docs/admin/authorization/abac/. To use RBAC permissions
            instead, create or update your cluster with the option
            `--no-enable-legacy-authorization`.
        enable-legacy-lustre-port: |-
            Allow the Lustre CSI driver to initialize LNet (the virtual network layer for Lustre kernel module) using port 6988.
            This flag is required to workaround a port conflict with the gke-metadata-server on GKE nodes.
        enable-logging-monitoring-system-only: |-
            (DEPRECATED) Enable Cloud Operations system-only monitoring and logging.
            +
            The `--enable-logging-monitoring-system-only` flag is deprecated and will be removed in an upcoming release. Please use `--logging` and `--monitoring` instead. For more information, please read: https://cloud.google.com/kubernetes-engine/docs/concepts/about-logs and https://cloud.google.com/kubernetes-engine/docs/how-to/configure-metrics.
        enable-lustre-multi-nic: |
            Enable Lustre multi-NIC configuration for all new nodes in the cluster unless
            explicitly overridden with `--no-enable-lustre-multi-nic` when creating the nodepool.
            When enabled, Lustre CSI driver will be configured to use multiple NICs on nodes in this cluster.
            Use `--no-enable-lustre-multi-nic` to disable.
        enable-managed-prometheus: |-
            Enables managed collection for Managed Service for Prometheus in the cluster.
            +
            See https://cloud.google.com/stackdriver/docs/managed-prometheus/setup-managed#enable-mgdcoll-gke
            for more info.
            +
            Enabled by default for cluster versions 1.27 or greater,
            use --no-enable-managed-prometheus to disable.
        enable-master-authorized-networks: |-
            Allow only specified set of CIDR blocks (specified by the
            `--master-authorized-networks` flag) to connect to Kubernetes master through
            HTTPS. Besides these blocks, the following have access as well:
            +
              1) The private network the cluster connects to if
              `--enable-private-nodes` is specified.
              2) Google Compute Engine Public IPs if `--enable-private-nodes` is not
              specified.
            +
            Use `--no-enable-master-authorized-networks` to disable. When disabled, public
            internet (0.0.0.0/0) is allowed to connect to Kubernetes master through HTTPS.
        enable-master-global-access: |-
            Use with private clusters to allow access to the master's private endpoint from any Google Cloud region or on-premises environment regardless of the
            private cluster's region.
        enable-master-metrics: |-
            (DEPRECATED) Enable sending metrics from master components to Cloud Operations.
            +
            The `--enable-master-metrics` flag is deprecated and will be removed in an upcoming release. Please use `--monitoring` instead. For more information, please read: https://cloud.google.com/kubernetes-engine/docs/how-to/configure-metrics.
        enable-mesh-certificates: |
            Enable Mesh Certificates.

            After the cluster is created, configure an issuing certificate authority using
            the Kubernetes API.

            To disable Mesh Certificates in an existing cluster, explicitly set flag
            `--no-enable-mesh-certificates`.
        enable-multi-networking: |-
            Enables multi-networking on the cluster.
            Multi-networking is disabled by default.
        enable-nested-virtualization: |-
            Enables the use of nested virtualization on the default initial node pool.
            Defaults to `false`. Can only be enabled on UBUNTU_CONTAINERD base image
            or COS_CONTAINERD base image with version 1.28.4-gke.1083000 and above.
        enable-network-egress-metering: |-
            Enable network egress metering on this cluster.
            +
            When enabled, a DaemonSet is deployed into the cluster. Each DaemonSet pod
            meters network egress traffic by collecting data from the conntrack table, and
            exports the metered metrics to the specified destination.
            +
            Network egress metering is disabled if this flag is omitted, or when
            `--no-enable-network-egress-metering` is set.
        enable-network-policy: Enable network policy enforcement for this cluster. If you are enabling network policy on an existing cluster the network policy addon must first be enabled on the master by using --update-addons=NetworkPolicy=ENABLED flag.
        enable-pod-security-policy: |-
            Enables the pod security policy admission controller for the cluster.  The pod
            security policy admission controller adds fine-grained pod create and update
            authorization controls through the PodSecurityPolicy API objects. For more
            information, see
            https://cloud.google.com/kubernetes-engine/docs/how-to/pod-security-policies.
        enable-pod-snapshots: Enable the Pod Snapshot feature on the cluster.
        enable-private-endpoint: Cluster is managed using the private IP address of the master API endpoint.
        enable-private-nodes: Cluster is created with no public IP addresses on the cluster nodes.
        enable-ray-cluster-logging: Enable automatic log processing sidecar for Ray clusters.
        enable-ray-cluster-monitoring: Enable automatic metrics collection for Ray clusters.
        enable-resource-consumption-metering: |-
            Enable resource consumption metering on this cluster.
            +
            When enabled, a table will be created in the specified BigQuery dataset to store
            resource consumption data. The resulting table can be joined with the resource
            usage table or with BigQuery billing export.
            +
            Resource consumption metering is enabled unless `--no-enable-resource-
            consumption-metering` is set.
        enable-runtime-vulnerability-insight: |
            Enables the GKE Runtime Vulnerability Insight API's features.

            To disable in an existing cluster, explicitly set flag to
            `--no-enable-runtime-vulnerability-insight`.
        enable-secret-manager: |-
            Enables the Secret Manager CSI driver provider component. See
            https://secrets-store-csi-driver.sigs.k8s.io/introduction
            https://github.com/GoogleCloudPlatform/secrets-store-csi-driver-provider-gcp
        enable-secret-manager-rotation: |-
            Enables the rotation of secrets in the Secret Manager CSI driver
            provider component.
        enable-secret-sync: |-
            Enables the Secret Sync component. See
            https://cloud.google.com/secret-manager/docs/sync-k8-secrets
        enable-secret-sync-rotation: |-
            Enables the rotation of secrets in the Secret Sync component.
            provider component.
        enable-security-posture: |-
            (DEPRECATED) Enables the GKE Security Posture API's features.

            To disable in an existing cluster, explicitly set flag to
            `--no-enable-security-posture`.
            +
            `--enable-security-posture` is deprecated and will be removed in an upcoming release. Please use `--security-posture=standard` to enable GKE Security Posture. For more details, please read: https://cloud.google.com/kubernetes-engine/docs/how-to/protect-workload-configuration.
        enable-service-externalips: Enables use of services with externalIPs field.
        enable-shielded-nodes: |-
            Enable Shielded Nodes for this cluster. Enabling Shielded Nodes will enable a
            more secure Node credential bootstrapping implementation. Starting with version
            1.18, clusters will have Shielded GKE nodes by default.
        enable-slice-controller: |
            Enable Slice Controller for the cluster.
            Use `--no-enable-slice-controller` to disable.
        enable-stackdriver-kubernetes: |-
            (DEPRECATED) Enable Cloud Operations for GKE.
            +
            The `--enable-stackdriver-kubernetes` flag is deprecated and will be removed in an upcoming release. Please use `--logging` and `--monitoring` instead. For more information, please read: https://cloud.google.com/kubernetes-engine/docs/concepts/about-logs and https://cloud.google.com/kubernetes-engine/docs/how-to/configure-metrics.
        enable-tpu: |
            Enable Cloud TPUs for this cluster.

            Can not be specified unless `--enable-ip-alias` is also specified.
        enable-tpu-service-networking: |
            Enable Cloud TPU's Service Networking mode. In this mode, the CIDR blocks used
            by the Cloud TPUs will be allocated and managed by Service Networking, instead
            of Kubernetes Engine.

            This cannot be specified if `tpu-ipv4-cidr` is specified.
        enable-vertical-pod-autoscaling: Enable vertical pod autoscaling for a cluster.
        enable-workload-certificates: |
            Enable Workload Certificates.

            After the cluster is created, configure an issuing certificate authority using
            the Kubernetes API.

            To disable Workload Certificates in an existing cluster, explicitly set flag
            `--no-enable-workload-certificates`.
        enable-workload-config-audit: |-
            (DEPRECATED) Enables Protect API's workload configuration auditing.

            To disable in an existing cluster, explicitly set flag to
            `--no-enable-workload-config-audit`.
            +
            `--enable-workload-config-audit` is deprecated and will be removed in an upcoming release. Please use `--security-posture=standard` to enable workload config audit. For more details, please read: https://cloud.google.com/kubernetes-engine/docs/how-to/protect-workload-configuration.
        enable-workload-monitoring-eap: Enable workload monitoring (EAP).
        enable-workload-vulnerability-scanning: |-
            (DEPRECATED) Enables Protect API's workload vulnerability scanning.

            To disable in an existing cluster, explicitly set flag to
            `--no-enable-workload-vulnerability-scanning`.
            +
            `--enable-workload-vulnerability-scanning` is deprecated and will be removed in an upcoming release. Please use `--workload-vulnerability-scanning=standard` to enable workload vulnerability scanning. For more details, please read: https://cloud.google.com/kubernetes-engine/docs/how-to/security-posture-vulnerability-scanning.
        ephemeral-storage: |-
            Parameters for the ephemeral storage filesystem.
            If unspecified, ephemeral storage is backed by the boot disk.
            +
            Examples:
            +
              $ {command} example_cluster --ephemeral-storage local-ssd-count=2
            +
            'local-ssd-count' specifies the number of local SSDs to use to back ephemeral
            storage. Local SDDs use NVMe interfaces. For first- and second-generation
            machine types, a nonzero count field is required for local ssd to be configured.
            For third-generation machine types, the count field is optional because the count
            is inferred from the machine type.
            +
            See https://cloud.google.com/compute/docs/disks/local-ssd for more information.
        ephemeral-storage-local-ssd: |-
            Parameters for the ephemeral storage filesystem.
            If unspecified, ephemeral storage is backed by the boot disk.
            +
            Examples:
            +
              $ {command} example_cluster --ephemeral-storage-local-ssd count=2
            +
            'count' specifies the number of local SSDs to use to back ephemeral
            storage. Local SDDs use NVMe interfaces. For first- and second-generation
            machine types, a nonzero count field is required for local ssd to be configured.
            For third-generation machine types, the count field is optional because the count
            is inferred from the machine type.
            +
            See https://cloud.google.com/compute/docs/disks/local-ssd for more information.
        etcd-api-ca: The Certificate Authority Service caPool that will back the etcd API CA
        etcd-peer-ca: The Certificate Authority Service caPool that will back the etcd peer CA
        fleet-project: |-
            Sets fleet host project for the cluster. If specified, the current cluster will be registered as a fleet membership under the fleet host project.
            +
            Example:
            $ {command} --fleet-project=my-project
        gateway-api: "Enables GKE Gateway controller in this cluster. The value of the flag specifies\nwhich Open Source Gateway API release channel will be used to define Gateway\nresources. _GATEWAY_API_ must be one of:\n+\n*disabled*::: Gateway controller will be disabled in the cluster.\n+\n*standard*::: Gateway controller will be enabled in the cluster.\nResource definitions from the `standard` OSS Gateway API release\nchannel will be installed. \n:::\n+"
        gkeops-etcd-backup-encryption-key: The Cloud KMS symmetric encryption cryptoKey that will be used to encrypt the disaster recovery etcd backups for the cluster
        gpudirect-strategy: |
            Set the GPUDirect strategy for the node pool, the possible value is RDMA.
        host-maintenance-interval: |
            Specify the frequency of planned maintenance events in the new cluster

            Examples:

              $ {command} example-cluster --host-maintenance-interval=PERIODIC

            The maintenance interval type must be either 'PERIODIC' or 'AS_NEEDED'
        hpa-profile: |-
            Set Horizontal Pod Autoscaler behavior. Accepted values are: none, performance.
            For more information, see https://cloud.google.com/kubernetes-engine/docs/how-to/horizontal-pod-autoscaling#hpa-profile.
        identity-provider: Enable 3P identity provider on the cluster.
        image: |
            A specific image to use on the new instances.
        image-family: |
            /
            A specific image-family from which the most recent image is used on new
            instances.  If both image and image family are specified, the image must be in
            the image family, and the image is used.
        image-project: |
            /
            A specific project from which contains the os image or image family.  This is
            required when using --image-type=CUSTOM.
        image-type: |-
            The image type to use for the cluster. Defaults to server-specified.
            +
            Image Type specifies the base OS that the nodes in the cluster will run on.
            If an image type is specified, that will be assigned to the cluster and all
            future upgrades will use the specified image type. If it is not specified the
            server will pick the default image type.
            +
            The default image type and the list of valid image types are available
            using the following command.
            +
              $ gcloud container get-server-config
        in-transit-encryption: 'Enable Dataplane V2 in-transit encryption. Dataplane v2 in-transit encryption is disabled by default. _IN_TRANSIT_ENCRYPTION_ must be one of: *inter-node-transparent*, *none*.'
        ipv6-access-type: 'IPv6 access type of the subnetwork. Defaults to ''external''. _IPV6_ACCESS_TYPE_ must be one of: *external*, *internal*.'
        issue-client-certificate: |-
            Issue a TLS client certificate with admin permissions.
            +
            When enabled, the certificate and private key pair will be present in
            MasterAuth field of the Cluster object. For cluster versions before 1.12, a
            client certificate will be issued by default. As of 1.12, client certificates
            are disabled by default.
        istio-config: |-
            (REMOVED) Configurations for Istio addon, requires --addons contains Istio for create,
            or --update-addons Istio=ENABLED for update.
            +
            *auth*::: (Optional) Type of auth MTLS_PERMISSIVE or MTLS_STRICT.
            +
            Examples:
            +
              $ {command} example-cluster --istio-config=auth=MTLS_PERMISSIVE
            +
            The `--istio-config` flag is no longer supported. For more information and migration, see https://cloud.google.com/istio/docs/istio-on-gke/migrate-to-anthos-service-mesh.
        kubecontext-override: |
            Name of kubectl context to use.

            $ {command} cluster-1 --kubecontext-override=my-kubecontext
        kubernetes-objects-changes-target: |
            Set kubernetes objects changes target [Currently only CLOUD_LOGGING value is supported].
        kubernetes-objects-snapshots-target: |
            Set kubernetes objects snapshots target [Currently only CLOUD_LOGGING value is supported].
        kuberun-config: |
            Configurations for Cloud Run addon, requires `--addons=CloudRun` for create
            and `--update-addons=CloudRun=ENABLED` for update.

            *load-balancer-type*::: (Optional) Type of load-balancer-type EXTERNAL or
            INTERNAL.

            Examples:

              $ {command} example-cluster --cloud-run-config=load-balancer-type=INTERNAL
        labels: |-
            Labels to apply to the Google Cloud resources in use by the Kubernetes Engine
            cluster. These are unrelated to Kubernetes labels.
            +
            Examples:
            +
              $ {command} example-cluster --labels=label_a=value1,label_b=,label_c=value3
        local-nvme-ssd-block: |-
            Adds the requested local SSDs on all nodes in default node pool(s) in the new cluster.
            +
            Examples:
            +
              $ {command} example_cluster --local-nvme-ssd-block count=2
            +
            'count' must be between 1-8
            +

            New nodes, including ones created by resize or recreate, will have these local SSDs.
            +
            For first- and second-generation machine types, a nonzero count field is
            required for local ssd to be configured. For third-generation machine types, the
            count field is optional because the count is inferred from the machine type.
            +
            See https://cloud.google.com/compute/docs/disks/local-ssd for more information.
        local-ssd-count: |-
            The number of local SSD disks to provision on each node, formatted and mounted
            in the filesystem.
            +
            Local SSDs have a fixed 375 GB capacity per device. The number of disks that
            can be attached to an instance is limited by the maximum number of disks
            available on a machine, which differs by compute zone. See
            https://cloud.google.com/compute/docs/disks/local-ssd for more information.
        local-ssd-encryption-mode: 'Encryption mode for Local SSDs on the cluster. _LOCAL_SSD_ENCRYPTION_MODE_ must be one of: *STANDARD_ENCRYPTION*, *EPHEMERAL_KEY_ENCRYPTION*.'
        location: Compute zone or region (e.g. us-central1-a or us-central1) for the cluster. Overrides the default compute/region or compute/zone value for this command invocation. Prefer using this flag over the --region or --zone flags.
        location-policy: |-
            Location policy specifies the algorithm used when scaling-up the node pool.
            +
            * `BALANCED` - Is a best effort policy that aims to balance the sizes of available
              zones.
            * `ANY` - Instructs the cluster autoscaler to prioritize utilization of unused
              reservations, and reduces preemption risk for Spot VMs.
            +
            _LOCATION_POLICY_ must be one of: *BALANCED*, *ANY*.
        logging: |-
            Set the components that have logging enabled. Valid component values are:
            `SYSTEM`, `WORKLOAD`, `API_SERVER`, `CONTROLLER_MANAGER`, `SCHEDULER`, `NONE`
            +
            For more information, see
            https://cloud.google.com/kubernetes-engine/docs/concepts/about-logs#available-logs
            +
            Examples:
            +
              $ {command} --logging=SYSTEM
              $ {command} --logging=SYSTEM,API_SERVER,WORKLOAD
              $ {command} --logging=NONE
        logging-variant: "Specifies the logging variant that will be deployed on all the nodes\nin the cluster. Valid logging variants are `MAX_THROUGHPUT`, `DEFAULT`.\nIf no value is specified, DEFAULT is used. _LOGGING_VARIANT_ must be one of:\n+\n*DEFAULT*::: 'DEFAULT' variant requests minimal resources but may not\nguarantee high throughput. \n*MAX_THROUGHPUT*::: 'MAX_THROUGHPUT' variant requests more node resources and is\nable to achieve logging throughput up to 10MB per sec. \n:::\n+"
        machine-type: |-
            The type of machine to use for nodes. Defaults to e2-medium.
            The list of predefined machine types is available using the following command:
            +
              $ gcloud compute machine-types list
            +
            You can also specify custom machine types by providing a string with the format "custom-CPUS-RAM"
            where "CPUS" is the number of virtual CPUs and "RAM" is the amount of RAM in
            MiB.
            +
            For example, to create a node pool using custom machines with 2 vCPUs and 12 GB
            of RAM:
            +
              $ {command} high-mem-pool --machine-type=custom-2-12288
        maintenance-interval: |
            Specify the frequency of planned maintenance events in the new cluster

            Examples:

              $ {command} example-cluster --maintenance-interval=PERIODIC

            The maintenance interval type must be either 'PERIODIC' or 'AS_NEEDED'
        maintenance-window: |-
            Set a time of day when you prefer maintenance to start on this cluster. For example:
            +
              $ {command} example-cluster --maintenance-window=12:43
            +
            The time corresponds to the UTC time zone, and must be in HH:MM format.
            +
            Non-emergency maintenance will occur in the 4 hour block starting at the
            specified time.
            +
            This is mutually exclusive with the recurring maintenance windows
            and will overwrite any existing window. Compatible with maintenance
            exclusions.
        maintenance-window-end: |-
            The end time for calculating the duration of the maintenance window,
            as expressed by the amount of time after the START_TIME, in the
            same format. The value for END_TIME must be in the future, relative
            to START_TIME. This only calculates the duration of the window,
            and doesn't set when the maintenance window stops recurring.
            Maintenance windows only stop recurring when they're removed. See
            $ gcloud topic datetimes for information on time formats.
            +
            This flag argument must be specified if any of the other arguments
            in this group are specified.
        maintenance-window-recurrence: |-
            An RFC 5545 RRULE, specifying how the window will recur. Note that minimum
            requirements for maintenance periods will be enforced. Note that FREQ=SECONDLY,
            MINUTELY, and HOURLY are not supported.
        maintenance-window-start: |-
            Start time of the first window (can occur in the past). The start time
            influences when the window will start for recurrences. See $ gcloud topic
            datetimes for information on time formats.
        managed-config: |
            Select managed config for the cluster. Defaults to `disabled`.

            $ {command} --managed-config=autofleet
        managed-otel-scope: |
            Specifies the scope of Managed OpenTelemetry within the cluster.

            COLLECTION_AND_INSTRUMENTATION_COMPONENTS: Enables GKE Managed
            OpenTelemetry Collector and other Instrumentations components like
            Instrumentation CRD within the cluster.
            NONE: Disables the GKE Managed OpenTelemetry.
        master-authorized-networks: The list of CIDR blocks (up to 100 for private cluster, 50 for public cluster) that are allowed to connect to Kubernetes master through HTTPS. Specified in CIDR notation (e.g. 1.2.3.4/30). Cannot be specified unless `--enable-master-authorized-networks` is also specified.
        master-ipv4-cidr: IPv4 CIDR range to use for the master network.  This should have a netmask of size /28 and should be used in conjunction with the --enable-private-nodes flag.
        master-logs: |-
            (DEPRECATED) Set which master components logs should be sent to Cloud Operations.

            Examples:

              $ {command} --master-logs APISERVER,SCHEDULER
            +
            The `--master-logs` flag is deprecated and will be removed in an upcoming release. Please use `--logging` instead. For more information, please read: https://cloud.google.com/kubernetes-engine/docs/concepts/about-logs.
        max-accelerator: |-
            Sets maximum limit for a single type of accelerators (e.g. GPUs) in cluster.
            +
            *type*::: (Required) The specific type (e.g. nvidia-tesla-t4 for NVIDIA T4)
            of accelerator for which the limit is set. Use ```gcloud compute
            accelerator-types list``` to learn about all available accelerator types.
            +
            *count*::: (Required) The maximum number of accelerators
            to which the cluster can be scaled.
        max-cpu: |-
            Maximum number of cores in the cluster.
            +
            Maximum number of cores to which the cluster can scale.
        max-memory: |-
            Maximum memory in the cluster.
            +
            Maximum number of gigabytes of memory to which the cluster can scale.
        max-nodes: |-
            Maximum number of nodes per zone in the node pool.
            +
            Maximum number of nodes per zone to which the node pool specified by --node-pool
            (or default node pool if unspecified) can scale. Ignored unless
            --enable-autoscaling is also specified.
        max-nodes-per-pool: The maximum number of nodes to allocate per default initial node pool. Kubernetes Engine will automatically create enough nodes pools such that each node pool contains less than `--max-nodes-per-pool` nodes. Defaults to 1000 nodes, but can be set as low as 100 nodes per pool on initial create.
        max-pods-per-node: |-
            The max number of pods per node for this node pool.
            +
            This flag sets the maximum number of pods that can be run at the same time on a
            node. This will override the value given with --default-max-pods-per-node flag
            set at the cluster level.
            +
            Must be used in conjunction with '--enable-ip-alias'.
        max-surge-upgrade: |-
            Number of extra (surge) nodes to be created on each upgrade of a node pool.
            +
            Specifies the number of extra (surge) nodes to be created during this node
            pool's upgrades. For example, running the following command will result in
            creating an extra node each time the node pool is upgraded:
            +
              $ {command} example-cluster --max-surge-upgrade=1 --max-unavailable-upgrade=0
            +
            Must be used in conjunction with '--max-unavailable-upgrade'.
        max-unavailable-upgrade: |-
            Number of nodes that can be unavailable at the same time on each upgrade of a
            node pool.
            +
            Specifies the number of nodes that can be unavailable at the same time while
            this node pool is being upgraded. For example, running the following command
            will result in having 3 nodes being upgraded in parallel (1 + 2), but keeping
            always at least 3 (5 - 2) available each time the node pool is upgraded:
            +
               $ {command} example-cluster --num-nodes=5 --max-surge-upgrade=1      --max-unavailable-upgrade=2
            +
            Must be used in conjunction with '--max-surge-upgrade'.
        membership-type: |-
            Specify a membership type for the cluster's fleet membership.
            Example:
            $ {command} --membership-type=LIGHTWEIGHT. _MEMBERSHIP_TYPE_ must be (only one value is supported):
            +
            *LIGHTWEIGHT*::: Fleet membership representing this cluster will be lightweight.
            +
            :::
            +
        metadata: |-
            Compute Engine metadata to be made available to the guest operating system
            running on nodes within the node pool.
            +
            Each metadata entry is a key/value pair separated by an equals sign.
            Metadata keys must be unique and less than 128 bytes in length. Values
            must be less than or equal to 32,768 bytes in length. The total size of
            all keys and values must be less than 512 KB. Multiple arguments can be
            passed to this flag. For example:
            +
            ``--metadata key-1=value-1,key-2=value-2,key-3=value-3''
            +
            Additionally, the following keys are reserved for use by Kubernetes
            Engine:
            +
            * ``cluster-location''
            * ``cluster-name''
            * ``cluster-uid''
            * ``configure-sh''
            * ``enable-os-login''
            * ``gci-update-strategy''
            * ``gci-ensure-gke-docker''
            * ``instance-template''
            * ``kube-env''
            * ``startup-script''
            * ``user-data''
            +
            Google Kubernetes Engine sets the following keys by default:
            +
            * ``serial-port-logging-enable''
            +
            See also Compute Engine's
            link:https://cloud.google.com/compute/docs/storing-retrieving-metadata[documentation]
            on storing and retrieving instance metadata.
        metadata-from-file: |-
            Same as ``--metadata'' except that the value for the entry will
            be read from a local file.
        min-accelerator: |-
            Sets minimum limit for a single type of accelerators (e.g. GPUs) in cluster. Defaults
            to 0 for all accelerator types if it isn't set.
            +
            *type*::: (Required) The specific type (e.g. nvidia-tesla-t4 for NVIDIA T4)
            of accelerator for which the limit is set. Use ```gcloud compute
            accelerator-types list``` to learn about all available accelerator types.
            +
            *count*::: (Required) The minimum number of accelerators
            to which the cluster can be scaled.
        min-cpu: |-
            Minimum number of cores in the cluster.
            +
            Minimum number of cores to which the cluster can scale.
        min-cpu-platform: |-
            When specified, the nodes for the new cluster's default node pool will be
            scheduled on host with specified CPU architecture or a newer one.
            +
            Examples:
            +
              $ {command} example-cluster --min-cpu-platform=PLATFORM
            +
            To list available CPU platforms in given zone, run:
            +
              $ gcloud beta compute zones describe ZONE --format="value(availableCpuPlatforms)"
            +
            CPU platform selection is available only in selected zones.
        min-memory: |-
            Minimum memory in the cluster.
            +
            Minimum number of gigabytes of memory to which the cluster can scale.
        min-nodes: |-
            Minimum number of nodes per zone in the node pool.
            +
            Minimum number of nodes per zone to which the node pool specified by --node-pool
            (or default node pool if unspecified) can scale. Ignored unless
            --enable-autoscaling is also specified.
        monitoring: |-
            Set the components that have monitoring enabled. Valid component values are:
            `SYSTEM`, `WORKLOAD` (Deprecated), `NONE`, `API_SERVER`, `CONTROLLER_MANAGER`,
            `SCHEDULER`, `DAEMONSET`, `DEPLOYMENT`, `HPA`, `POD`, `STATEFULSET`, `STORAGE`,
            `CADVISOR`, `KUBELET`, `DCGM`, `JOBSET`
            +
            For more information, see
            https://cloud.google.com/kubernetes-engine/docs/how-to/configure-metrics#available-metrics
            +
            Examples:
            +
              $ {command} --monitoring=SYSTEM,API_SERVER,POD
              $ {command} --monitoring=NONE
        network: The Compute Engine Network that the cluster will connect to. Google Kubernetes Engine will use this network when creating routes and firewalls for the clusters. Defaults to the 'default' network.
        network-performance-configs: |-
            Configures network performance settings for the cluster.
            Node pools can override with their own settings.
            +
            *total-egress-bandwidth-tier*::: Total egress bandwidth is the available
            outbound bandwidth from a VM, regardless of whether the traffic
            is going to internal IP or external IP destinations.
            The following tier values are allowed: [TIER_UNSPECIFIED,TIER_1].
            +
            See https://cloud.google.com/compute/docs/networking/configure-vm-with-high-bandwidth-configuration for more information.
        network-tier: |
            Set the network tier for the cluster, possible values are premium, standard and default.
            If use default, cluster will use project default network tier.
        no-allow-route-overlap: |
            Allows the provided cluster CIDRs to overlap with existing routes
            that are less specific and do not terminate at a VM.

            When enabled, `--cluster-ipv4-cidr` must be fully specified (e.g. `10.96.0.0/14`
            , but not `/14`). If `--enable-ip-alias` is also specified, both
            `--cluster-ipv4-cidr` and `--services-ipv4-cidr` must be fully specified.

            Must be used in conjunction with '--enable-ip-alias' or '--no-enable-ip-alias'.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-autoprovisioning-enable-insecure-kubelet-readonly-port: |
            Enables the Kubelet's insecure read only port for Autoprovisioned
            Node Pools.

            If not set, the value from nodePoolDefaults.nodeConfigDefaults will be used.

            To disable the readonly port
            `--no-autoprovisioning-enable-insecure-kubelet-readonly-port`.
        no-disable-additive-vpc-scope: Disables Additive VPC Scope.
        no-disable-default-snat: |
            Disable default source NAT rules applied in cluster nodes.

            By default, cluster nodes perform source network address translation (SNAT)
            for packets sent from Pod IP address sources to destination IP addresses
            that are not in the non-masquerade CIDRs list.
            For more details about SNAT and IP masquerading, see:
            https://cloud.google.com/kubernetes-engine/docs/how-to/ip-masquerade-agent#how_ipmasq_works
            SNAT changes the packet's source IP address to the node's internal IP address.

            When this flag is set, GKE does not perform SNAT for packets sent to any destination.
            You must set this flag if the cluster uses privately reused public IPs.

            The --disable-default-snat flag is only applicable to private GKE clusters, which are
            inherently VPC-native. Thus, --disable-default-snat requires that you also set
            --enable-ip-alias and --enable-private-nodes.
        no-disable-pod-cidr-overprovision: |
            Disables pod cidr overprovision on nodes.
            Pod cidr overprovisioning is enabled by default.
        no-enable-alts: |
            Enable Workload ALTS.
        no-enable-authorized-networks-on-private-endpoint: |
            Enable enforcement of --master-authorized-networks CIDR ranges for
            traffic reaching cluster's control plane via private IP.
        no-enable-autoprovisioning: |-
            Enables  node autoprovisioning for a cluster.

            Cluster Autoscaler will be able to create new node pools. Requires maximum CPU
            and memory limits to be specified.
        no-enable-autoprovisioning-autorepair: |
            Enable node autorepair for autoprovisioned node pools.
            Use --no-enable-autoprovisioning-autorepair to disable.
        no-enable-autoprovisioning-autoupgrade: |
            Enable node autoupgrade for autoprovisioned node pools.
            Use --no-enable-autoprovisioning-autoupgrade to disable.
        no-enable-autoprovisioning-blue-green-upgrade: |
            Whether to use blue-green upgrade for the autoprovisioned node pool.
        no-enable-autoprovisioning-surge-upgrade: |
            Whether to use surge upgrade for the autoprovisioned node pool.
        no-enable-autorepair: |-
            Enable node autorepair feature for a cluster's default node pool(s).

              $ {command} example-cluster --enable-autorepair

            Node autorepair is enabled by default for clusters using COS, COS_CONTAINERD, UBUNTU or UBUNTU_CONTAINERD
            as a base image, use --no-enable-autorepair to disable.

            See https://cloud.google.com/kubernetes-engine/docs/how-to/node-auto-repair for more info.
        no-enable-autoscaling: |-
            Enables autoscaling for a node pool.

            Enables autoscaling in the node pool specified by --node-pool or
            the default node pool if --node-pool is not provided. If not already,
            --max-nodes or --total-max-nodes must also be set.
        no-enable-autoupgrade: |-
            Sets autoupgrade feature for a cluster's default node pool(s).

              $ {command} example-cluster --enable-autoupgrade

            See https://cloud.google.com/kubernetes-engine/docs/node-auto-upgrades for more info.
        no-enable-basic-auth: |-
            Enable basic (username/password) auth for the cluster.  `--enable-basic-auth` is
            an alias for `--username=admin`; `--no-enable-basic-auth` is an alias for
            `--username=""`. Use `--password` to specify a password; if not, the server will
            randomly generate one. For cluster versions before 1.12, if neither
            `--enable-basic-auth` nor `--username` is specified, `--enable-basic-auth` will
            default to `true`. After 1.12, `--enable-basic-auth` will default to `false`.
        no-enable-binauthz: "(DEPRECATED) Enable Binary Authorization for this cluster.\n+\nThe `--enable-binauthz` flag is deprecated. Please use `--binauthz-evaluation-mode` instead. "
        no-enable-cilium-clusterwide-network-policy: Enable Cilium Clusterwide Network Policies on the cluster. Disabled by default.
        no-enable-cloud-logging: |-
            (DEPRECATED) Automatically send logs from the cluster to the Google Cloud Logging API.
            +
            Legacy Logging and Monitoring is deprecated. Thus, flag `--enable-cloud-logging` is also deprecated and will be removed in an upcoming release. Please use `--logging` (optionally with `--monitoring`). For more details, please read: https://cloud.google.com/kubernetes-engine/docs/concepts/about-logs and https://cloud.google.com/kubernetes-engine/docs/how-to/configure-metrics.
        no-enable-cloud-monitoring: |-
            (DEPRECATED) Automatically send metrics from pods in the cluster to the Google Cloud Monitoring API. VM metrics will be collected by Google Compute Engine regardless of this setting.
            +
            Legacy Logging and Monitoring is deprecated. Thus, flag `--enable-cloud-monitoring` is also deprecated. Please use `--monitoring` (optionally with `--logging`). For more details, please read: https://cloud.google.com/kubernetes-engine/docs/how-to/configure-metrics and https://cloud.google.com/kubernetes-engine/docs/concepts/about-logs.
        no-enable-cloud-run-alpha: |-
            Enable Cloud Run alpha features on this cluster. Selecting this
            option will result in the cluster having all Cloud Run alpha API groups and
            features turned on.

            Cloud Run alpha clusters are not covered by the Cloud Run SLA and should not be
            used for production workloads.
        no-enable-confidential-nodes: |-
            Enable confidential nodes for the cluster. Enabling Confidential Nodes
            will create nodes using Confidential VM
            https://cloud.google.com/compute/confidential-vm/docs/about-cvm.
        no-enable-confidential-storage: |
            Enable confidential storage for the cluster. Enabling Confidential Storage will
            create boot disk with confidential mode
        no-enable-cost-allocation: |
            Enable the cost management feature.

            When enabled, you can get informational GKE cost breakdowns by cluster,
            namespace and label in your billing data exported to BigQuery
            (https://cloud.google.com/billing/docs/how-to/export-data-bigquery).
        no-enable-dataplane-v2: |
            Enables the new eBPF dataplane for GKE clusters that is required for
            network security, scalability and visibility features.
        no-enable-default-compute-class: |
            Enable the default compute class to use for the cluster.

            To disable Default Compute Class in an existing cluster, explicitly set flag
            `--no-enable-default-compute-class`.
        no-enable-dns-access: |
            Enable access to the cluster's control plane over DNS-based endpoint.

            DNS-based control plane access is recommended.
        no-enable-experimental-vertical-pod-autoscaling: Enable experimental vertical pod autoscaling featuresfor a cluster.
        no-enable-fleet: |
            Set cluster project as the fleet host project. This will register the cluster to the same project.
            To register the cluster to a fleet in a different project, please use `--fleet-project=FLEET_HOST_PROJECT`.
            Example:
            $ {command} --enable-fleet
        no-enable-fqdn-network-policy: |
            Enable FQDN Network Policies on the cluster. FQDN Network Policies are disabled by default.
        no-enable-gcfs: Specifies whether to enable GCFS on default initial node pool.
        no-enable-gke-oidc: |-
            (DEPRECATED) Enable GKE OIDC authentication on the cluster.

            When enabled, users would be able to authenticate to Kubernetes cluster after
            properly setting OIDC config.

            GKE OIDC is by default disabled when creating a new cluster. To disable GKE OIDC
            in an existing cluster, explicitly set flag `--no-enable-gke-oidc`.
            +
            GKE OIDC is being replaced by Identity Service across Anthos and GKE. Thus, flag `--enable-gke-oidc` is also deprecated. Please use `--enable-identity-service` to enable the Identity Service component
        no-enable-google-cloud-access: |
            When you enable Google Cloud Access, any public IP addresses owned by Google
            Cloud can reach the public control plane endpoint of your cluster.
        no-enable-gvnic: |
            Enable the use of GVNIC for this cluster. Requires re-creation of nodes using
            either a node-pool upgrade or node-pool creation.
        no-enable-identity-service: |
            Enable Identity Service component on the cluster.

            When enabled, users can authenticate to Kubernetes cluster with external
            identity providers.

            Identity Service is by default disabled when creating a new cluster.
            To disable Identity Service in an existing cluster, explicitly set flag
            `--no-enable-identity-service`.
        no-enable-image-streaming: Specifies whether to enable image streaming on cluster.
        no-enable-insecure-binding-system-authenticated: |
            Allow using `system:authenticated` as a subject in ClusterRoleBindings and RoleBindings.
            Allowing bindings that reference `system:authenticated` is a security risk and is not recommended.

            To disallow binding `system:authenticated` in a cluster, explicitly set the
            `--no-enable-insecure-binding-system-authenticated` flag instead.
        no-enable-insecure-binding-system-unauthenticated: |
            Allow using `system:unauthenticated` and `system:anonymous` as subjects in ClusterRoleBindings and RoleBindings.
            Allowing bindings that reference `system:unauthenticated` and `system:anonymous` are a security risk and is not recommended.

            To disallow binding `system:authenticated` in a cluster, explicitly set the
            `--no-enable-insecure-binding-system-unauthenticated` flag instead.
        no-enable-insecure-kubelet-readonly-port: |
            Enables the Kubelet's insecure read only port.

            To disable the readonly port on a cluster or node-pool set the flag to
            `--no-enable-insecure-kubelet-readonly-port`.
        no-enable-intra-node-visibility: |
            Enable Intra-node visibility for this cluster.

            Enabling intra-node visibility makes your intra-node pod-to-pod traffic
            visible to the networking fabric. With this feature, you can use VPC flow
            logging or other VPC features for intra-node traffic.

            Enabling it on an existing cluster causes the cluster
            master and the cluster nodes to restart, which might cause a disruption.
        no-enable-ip-access: |
            Enable access to the cluster's control plane over private IP and
            public IP if --enable-private-endpoint is not enabled.
        no-enable-ip-alias: |
            --enable-ip-alias creates a VPC-native cluster. If you set this option, you
            can optionally specify the IP address ranges to use for Pods and Services.
            For instructions, see
            https://cloud.google.com/kubernetes-engine/docs/how-to/alias-ips.

            --no-enable-ip-alias creates a routes-based cluster. This type of cluster
            routes traffic between Pods using Google Cloud Routes. This option is not
            recommended; use the default VPC-native cluster type instead. For instructions,
            see
            https://cloud.google.com/kubernetes-engine/docs/how-to/routes-based-cluster

            Note: For IPv6-only clusters, these flags are a no-op as IP Aliases do not
            apply, and any specified IP address ranges for Pods and Services will be
            ignored.

            You can't specify both --enable-ip-alias and --no-enable-ip-alias.
            If you omit both --enable-ip-alias and --no-enable-ip-alias,
            the default is a VPC-native cluster.
        no-enable-k8s-certs-via-dns: 'Enable K8s client certificates Authentication to the cluster''s control plane over DNS-based endpoint. '
        no-enable-k8s-tokens-via-dns: 'Enable K8s Service Account tokens Authentication to the cluster''s control plane over DNS-based endpoint. '
        no-enable-kernel-module-signature-enforcement: |
            Enforces that kernel modules are signed on all new nodes in the cluster unless
            explicitly overridden with `--no-enable-kernel-module-signature-enforcement`
            when creating the nodepool.
            Use `--no-enable-kernel-module-signature-enforcement` to disable.

            Examples:

              $ {command} example-cluster --enable-kernel-module-signature-enforcement
        no-enable-kubernetes-alpha: |-
            Enable Kubernetes alpha features on this cluster. Selecting this
            option will result in the cluster having all Kubernetes alpha API groups and
            features turned on. Cluster upgrades (both manual and automatic) will be
            disabled and the cluster will be automatically deleted after 30 days.

            Alpha clusters are not covered by the Kubernetes Engine SLA and should not be
            used for production workloads.
        no-enable-kuberun-alpha: |-
            Enable Cloud Run alpha features on this cluster. Selecting this
            option will result in the cluster having all Cloud Run alpha API groups and
            features turned on.

            Cloud Run alpha clusters are not covered by the Cloud Run SLA and should not be
            used for production workloads.
        no-enable-l4-ilb-subsetting: Enable Subsetting for L4 ILB services created on this cluster.
        no-enable-legacy-authorization: |
            Enables the legacy ABAC authentication for the cluster.
            User rights are granted through the use of policies which combine attributes
            together. For a detailed look at these properties and related formats, see
            https://kubernetes.io/docs/admin/authorization/abac/. To use RBAC permissions
            instead, create or update your cluster with the option
            `--no-enable-legacy-authorization`.
        no-enable-legacy-lustre-port: |
            Allow the Lustre CSI driver to initialize LNet (the virtual network layer for Lustre kernel module) using port 6988.
            This flag is required to workaround a port conflict with the gke-metadata-server on GKE nodes.
        no-enable-logging-monitoring-system-only: |-
            (DEPRECATED) Enable Cloud Operations system-only monitoring and logging.
            +
            The `--enable-logging-monitoring-system-only` flag is deprecated and will be removed in an upcoming release. Please use `--logging` and `--monitoring` instead. For more information, please read: https://cloud.google.com/kubernetes-engine/docs/concepts/about-logs and https://cloud.google.com/kubernetes-engine/docs/how-to/configure-metrics.
        no-enable-lustre-multi-nic: |
            Enable Lustre multi-NIC configuration for all new nodes in the cluster unless
            explicitly overridden with `--no-enable-lustre-multi-nic` when creating the nodepool.
            When enabled, Lustre CSI driver will be configured to use multiple NICs on nodes in this cluster.
            Use `--no-enable-lustre-multi-nic` to disable.
        no-enable-managed-prometheus: |
            Enables managed collection for Managed Service for Prometheus in the cluster.

            See https://cloud.google.com/stackdriver/docs/managed-prometheus/setup-managed#enable-mgdcoll-gke
            for more info.

            Enabled by default for cluster versions 1.27 or greater,
            use --no-enable-managed-prometheus to disable.
        no-enable-master-authorized-networks: |
            Allow only specified set of CIDR blocks (specified by the
            `--master-authorized-networks` flag) to connect to Kubernetes master through
            HTTPS. Besides these blocks, the following have access as well:

              1) The private network the cluster connects to if
              `--enable-private-nodes` is specified.
              2) Google Compute Engine Public IPs if `--enable-private-nodes` is not
              specified.

            Use `--no-enable-master-authorized-networks` to disable. When disabled, public
            internet (0.0.0.0/0) is allowed to connect to Kubernetes master through HTTPS.
        no-enable-master-global-access: |
            Use with private clusters to allow access to the master's private endpoint from any Google Cloud region or on-premises environment regardless of the
            private cluster's region.
        no-enable-master-metrics: |-
            (DEPRECATED) Enable sending metrics from master components to Cloud Operations.
            +
            The `--enable-master-metrics` flag is deprecated and will be removed in an upcoming release. Please use `--monitoring` instead. For more information, please read: https://cloud.google.com/kubernetes-engine/docs/how-to/configure-metrics.
        no-enable-mesh-certificates: |
            Enable Mesh Certificates.

            After the cluster is created, configure an issuing certificate authority using
            the Kubernetes API.

            To disable Mesh Certificates in an existing cluster, explicitly set flag
            `--no-enable-mesh-certificates`.
        no-enable-multi-networking: |
            Enables multi-networking on the cluster.
            Multi-networking is disabled by default.
        no-enable-nested-virtualization: |
            Enables the use of nested virtualization on the default initial node pool.
            Defaults to `false`. Can only be enabled on UBUNTU_CONTAINERD base image
            or COS_CONTAINERD base image with version 1.28.4-gke.1083000 and above.
        no-enable-network-egress-metering: |
            Enable network egress metering on this cluster.

            When enabled, a DaemonSet is deployed into the cluster. Each DaemonSet pod
            meters network egress traffic by collecting data from the conntrack table, and
            exports the metered metrics to the specified destination.

            Network egress metering is disabled if this flag is omitted, or when
            `--no-enable-network-egress-metering` is set.
        no-enable-network-policy: Enable network policy enforcement for this cluster. If you are enabling network policy on an existing cluster the network policy addon must first be enabled on the master by using --update-addons=NetworkPolicy=ENABLED flag.
        no-enable-pod-security-policy: |
            Enables the pod security policy admission controller for the cluster.  The pod
            security policy admission controller adds fine-grained pod create and update
            authorization controls through the PodSecurityPolicy API objects. For more
            information, see
            https://cloud.google.com/kubernetes-engine/docs/how-to/pod-security-policies.
        no-enable-private-endpoint: Cluster is managed using the private IP address of the master API endpoint.
        no-enable-private-nodes: Cluster is created with no public IP addresses on the cluster nodes.
        no-enable-ray-cluster-logging: |
            Enable automatic log processing sidecar for Ray clusters.
        no-enable-ray-cluster-monitoring: |
            Enable automatic metrics collection for Ray clusters.
        no-enable-resource-consumption-metering: |
            Enable resource consumption metering on this cluster.

            When enabled, a table will be created in the specified BigQuery dataset to store
            resource consumption data. The resulting table can be joined with the resource
            usage table or with BigQuery billing export.

            Resource consumption metering is enabled unless `--no-enable-resource-
            consumption-metering` is set.
        no-enable-runtime-vulnerability-insight: |
            Enables the GKE Runtime Vulnerability Insight API's features.

            To disable in an existing cluster, explicitly set flag to
            `--no-enable-runtime-vulnerability-insight`.
        no-enable-secret-manager: |
            Enables the Secret Manager CSI driver provider component. See
            https://secrets-store-csi-driver.sigs.k8s.io/introduction
            https://github.com/GoogleCloudPlatform/secrets-store-csi-driver-provider-gcp
        no-enable-secret-manager-rotation: |
            Enables the rotation of secrets in the Secret Manager CSI driver
            provider component.
        no-enable-secret-sync: |
            Enables the Secret Sync component. See
            https://cloud.google.com/secret-manager/docs/sync-k8-secrets
        no-enable-secret-sync-rotation: |
            Enables the rotation of secrets in the Secret Sync component.
            provider component.
        no-enable-security-posture: |-
            (DEPRECATED) Enables the GKE Security Posture API's features.

            To disable in an existing cluster, explicitly set flag to
            `--no-enable-security-posture`.
            +
            `--enable-security-posture` is deprecated and will be removed in an upcoming release. Please use `--security-posture=standard` to enable GKE Security Posture. For more details, please read: https://cloud.google.com/kubernetes-engine/docs/how-to/protect-workload-configuration.
        no-enable-service-externalips: |
            Enables use of services with externalIPs field.
        no-enable-shielded-nodes: |
            Enable Shielded Nodes for this cluster. Enabling Shielded Nodes will enable a
            more secure Node credential bootstrapping implementation. Starting with version
            1.18, clusters will have Shielded GKE nodes by default.
        no-enable-slice-controller: |
            Enable Slice Controller for the cluster.
            Use `--no-enable-slice-controller` to disable.
        no-enable-stackdriver-kubernetes: |-
            (DEPRECATED) Enable Cloud Operations for GKE.
            +
            The `--enable-stackdriver-kubernetes` flag is deprecated and will be removed in an upcoming release. Please use `--logging` and `--monitoring` instead. For more information, please read: https://cloud.google.com/kubernetes-engine/docs/concepts/about-logs and https://cloud.google.com/kubernetes-engine/docs/how-to/configure-metrics.
        no-enable-tpu: |
            Enable Cloud TPUs for this cluster.

            Can not be specified unless `--enable-ip-alias` is also specified.
        no-enable-tpu-service-networking: |
            Enable Cloud TPU's Service Networking mode. In this mode, the CIDR blocks used
            by the Cloud TPUs will be allocated and managed by Service Networking, instead
            of Kubernetes Engine.

            This cannot be specified if `tpu-ipv4-cidr` is specified.
        no-enable-vertical-pod-autoscaling: Enable vertical pod autoscaling for a cluster.
        no-enable-workload-certificates: |
            Enable Workload Certificates.

            After the cluster is created, configure an issuing certificate authority using
            the Kubernetes API.

            To disable Workload Certificates in an existing cluster, explicitly set flag
            `--no-enable-workload-certificates`.
        no-enable-workload-config-audit: |-
            (DEPRECATED) Enables Protect API's workload configuration auditing.

            To disable in an existing cluster, explicitly set flag to
            `--no-enable-workload-config-audit`.
            +
            `--enable-workload-config-audit` is deprecated and will be removed in an upcoming release. Please use `--security-posture=standard` to enable workload config audit. For more details, please read: https://cloud.google.com/kubernetes-engine/docs/how-to/protect-workload-configuration.
        no-enable-workload-monitoring-eap: Enable workload monitoring (EAP).
        no-enable-workload-vulnerability-scanning: |-
            (DEPRECATED) Enables Protect API's workload vulnerability scanning.

            To disable in an existing cluster, explicitly set flag to
            `--no-enable-workload-vulnerability-scanning`.
            +
            `--enable-workload-vulnerability-scanning` is deprecated and will be removed in an upcoming release. Please use `--workload-vulnerability-scanning=standard` to enable workload vulnerability scanning. For more details, please read: https://cloud.google.com/kubernetes-engine/docs/how-to/security-posture-vulnerability-scanning.
        no-issue-client-certificate: |
            Issue a TLS client certificate with admin permissions.

            When enabled, the certificate and private key pair will be present in
            MasterAuth field of the Cluster object. For cluster versions before 1.12, a
            client certificate will be issued by default. As of 1.12, client certificates
            are disabled by default.
        no-preemptible: |-
            Create nodes using preemptible VM instances in the new cluster.

              $ {command} example-cluster --preemptible

            New nodes, including ones created by resize or recreate, will use preemptible
            VM instances. See https://cloud.google.com/kubernetes-engine/docs/preemptible-vm
            for more information on how to use Preemptible VMs with Kubernetes Engine.
        no-private-cluster: |-
            (DEPRECATED) Cluster is created with no public IP addresses on the cluster nodes.
            +
            The --private-cluster flag is deprecated and will be removed in a future release. Use --enable-private-nodes instead.
        no-shielded-integrity-monitoring: |
            Enables monitoring and attestation of the boot integrity of the
            instance. The attestation is performed against the integrity policy
            baseline. This baseline is initially derived from the implicitly
            trusted boot image when the instance is created.
        no-shielded-secure-boot: |
            The instance will boot with secure boot enabled.
        no-spot: |-
            Create nodes using spot VM instances in the new cluster.

              $ {command} example-cluster --spot

            New nodes, including ones created by resize or recreate, will use spot
            VM instances.
        node-labels: |-
            Applies the given Kubernetes labels on all nodes in the new node pool.
            +
            Examples:
            +
              $ {command} example-cluster --node-labels=label-a=value1,label-2=value2
            +
            Updating the node pool's --node-labels flag applies the labels to the Kubernetes Node objects for existing nodes in-place; it does not re-create or replace nodes. New nodes, including ones created by resizing or re-creating nodes, will have these labels on the Kubernetes API Node object. The labels can be used in the `nodeSelector` field. See [](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/) for examples.
            +
            Note that Kubernetes labels, intended to associate cluster components
            and resources with one another and manage resource lifecycles, are different
            from Google Kubernetes Engine labels that are used for the purpose of tracking
            billing and usage information.
        node-locations: |-
            The set of zones in which the specified node footprint should be replicated.
            All zones must be in the same region as the cluster's master(s), specified by
            the `-location`, `--zone`, or `--region` flag. Additionally, for zonal clusters,
            `--node-locations` must contain the cluster's primary zone. If not specified,
            all nodes will be in the cluster's primary zone (for zonal clusters) or spread
            across three randomly chosen zones within the cluster's region (for regional
            clusters).
            +
            Note that `NUM_NODES` nodes will be created in each zone, such that if you
            specify `--num-nodes=4` and choose two locations, 8 nodes will be created.
            +
            Multiple locations can be specified, separated by commas. For example:
            +
              $ {command} example-cluster --location us-central1-a --node-locations us-central1-a,us-central1-b
        node-taints: |-
            Applies the given kubernetes taints on all nodes in default node pool(s) in new
            cluster, which can be used with tolerations for pod scheduling.
            +
            Examples:
            +
              $ {command} example-cluster --node-taints=key1=val1:NoSchedule,key2=val2:PreferNoSchedule
            +
            To read more about node-taints, see https://cloud.google.com/kubernetes-engine/docs/node-taints.
        node-version: |-
            The Kubernetes version to use for nodes. Defaults to server-specified.
            +
            The default Kubernetes version is available using the following command.
            +
              $ gcloud container get-server-config
        notification-config: |-
            The notification configuration of the cluster. GKE supports publishing
            cluster upgrade notifications to any Pub/Sub topic you created in the same
            project. Create a subscription for the topic specified to receive notification
            messages. See https://cloud.google.com/pubsub/docs/admin on how to manage
            Pub/Sub topics and subscriptions. You can also use the filter option to
            specify which event types you'd like to receive from the following options:
            SecurityBulletinEvent, UpgradeEvent, UpgradeInfoEvent, UpgradeAvailableEvent.
            +
            Examples:
            +
              $ {command} example-cluster --notification-config=pubsub=ENABLED,pubsub-topic=projects/{project}/topics/{topic-name}
              $ {command} example-cluster --notification-config=pubsub=ENABLED,pubsub-topic=projects/{project}/topics/{topic-name},filter="SecurityBulletinEvent|UpgradeEvent"
            +
            The project of the Pub/Sub topic must be the same one as the cluster. It can
            be either the project ID or the project number.
        num-nodes: The number of nodes to be created in each of the cluster's zones.
        password: The password to use for cluster auth. Defaults to a server-specified randomly-generated string.
        patch-update: |-
            The patch update to use for the cluster.
            +
            Setting to 'accelerated' automatically upgrades the cluster to the latest patch available within the cluster's current minor version and release channel.
            Setting to 'default' automatically upgrades the cluster to the default patch upgrade targetversion available within the cluster's current minor version and release channel.
            +
            _PATCH_UPDATE_ must be one of: *accelerated*, *default*.
        performance-monitoring-unit: |-
            Sets the Performance Monitoring Unit level.
            Valid values are `architectural`, `standard` and `enhanced`. _PERFORMANCE_MONITORING_UNIT_ must be one of:
            +
            *architectural*::: Enables architectural PMU events tied to non last level cache (LLC) events.
            *enhanced*::: Enables most documented core/L2 and LLC PMU events.
            *standard*::: Enables most documented core/L2 PMU events.
            :::
            +
        placement-policy: |-
            Indicates the desired resource policy to use.
            +
            $ {command} node-pool-1 --cluster=example-cluster --placement-policy my-placement
        placement-type: |-
            Placement type allows to define the type of node placement within the default
            node pool of this cluster.
            +
            `UNSPECIFIED` - No requirements on the placement of nodes. This is the
            default option.
            +
            `COMPACT` - GKE will attempt to place the nodes in a close proximity to each
            other. This helps to reduce the communication latency between the nodes, but
            imposes additional limitations on the node pool size.
            +
              $ {command} example-cluster --placement-type=COMPACT
            +
            _PLACEMENT_TYPE_ must be one of: *UNSPECIFIED*, *COMPACT*.
        preemptible: |-
            Create nodes using preemptible VM instances in the new cluster.
            +
              $ {command} example-cluster --preemptible
            +
            New nodes, including ones created by resize or recreate, will use preemptible
            VM instances. See https://cloud.google.com/kubernetes-engine/docs/preemptible-vm
            for more information on how to use Preemptible VMs with Kubernetes Engine.
        private-cluster: |-
            (DEPRECATED) Cluster is created with no public IP addresses on the cluster nodes.
            +
            The --private-cluster flag is deprecated and will be removed in a future release. Use --enable-private-nodes instead.
        private-endpoint-subnetwork: |-
            Sets the subnetwork GKE uses to provision the control plane's
            private endpoint.
        private-ipv6-google-access-type: |-
            Sets the type of private access to Google services over IPv6.
            +
            PRIVATE_IPV6_GOOGLE_ACCESS_TYPE must be one of:
            +
              bidirectional
                Allows Google services to initiate connections to GKE pods in this
                cluster. This is not intended for common use, and requires previous
                integration with Google services.
            +
              disabled
                Default value. Disables private access to Google services over IPv6.
            +
              outbound-only
                Allows GKE pods to make fast, secure requests to Google services
                over IPv6. This is the most common use of private IPv6 access.
            +
              $ gcloud alpha container clusters create       --private-ipv6-google-access-type=disabled
              $ gcloud alpha container clusters create       --private-ipv6-google-access-type=outbound-only
              $ gcloud alpha container clusters create       --private-ipv6-google-access-type=bidirectional
            +
            _PRIVATE_IPV6_GOOGLE_ACCESS_TYPE_ must be one of: *bidirectional*, *disabled*, *outbound-only*.
        region: Compute region (e.g. us-central1) for a regional cluster. Overrides the default compute/region property value for this command invocation.
        release-channel: |-
            Release channel a cluster is subscribed to.
            +
            If left unspecified and a version is specified, the cluster is enrolled in the
            most mature release channel where the version is available (first checking
            STABLE, then REGULAR, and finally RAPID). Otherwise, if no release channel and
            no version is specified, the cluster is enrolled in the REGULAR channel with
            its default version.
            When a cluster is subscribed to a release channel, Google maintains both the
            master version and the node version. Node auto-upgrade is enabled by default
            for release channel clusters and can be controlled via [upgrade-scope
            exclusions](https://cloud.google.com/kubernetes-engine/docs/concepts/maintenance-windows-and-exclusions#scope_of_maintenance_to_exclude).
            +
            _CHANNEL_ must be one of:
            +
            *None*::: Use 'None' to opt-out of any release channel.
            +
            *extended*::: Clusters subscribed to 'extended' can remain on a minor version for 24 months
            from when the minor version is made available in the Regular channel.
            +
            *rapid*::: 'rapid' channel is offered on an early access basis for customers
            who want to test new releases.
            +
            WARNING: Versions available in the 'rapid' channel may be subject
            to unresolved issues with no known workaround and are not subject
            to any SLAs.
            +
            *regular*::: Clusters subscribed to 'regular' receive versions that are
            considered GA quality. 'regular' is intended for production users
            who want to take advantage of new features.
            +
            *stable*::: Clusters subscribed to 'stable' receive versions that are known to
            be stable and reliable in production.
            +
            :::
            +
        reservation: The name of the reservation, required when `--reservation-affinity=specific`.
        reservation-affinity: 'The type of the reservation for the default initial node pool. _RESERVATION_AFFINITY_ must be one of: *any*, *none*, *specific*.'
        resource-manager-tags: |-
            Applies the specified comma-separated resource manager tags that has the
            GCE_FIREWALL purpose to all nodes in the new default node pool(s) of a new cluster.
            +
            Examples:
            +
              $ {command} example-cluster --resource-manager-tags=tagKeys/1234=tagValues/2345
              $ {command} example-cluster --resource-manager-tags=my-project/key1=value1
              $ {command} example-cluster --resource-manager-tags=12345/key1=value1,23456/key2=value2
              $ {command} example-cluster --resource-manager-tags=
            +
            All nodes, including nodes that are resized or re-created, will have the
            specified tags on the corresponding Instance object in the Compute Engine API.
            You can reference these tags in network firewall policy rules. For instructions,
            see https://cloud.google.com/firewall/docs/use-tags-for-firewalls.
        resource-usage-bigquery-dataset: |-
            The name of the BigQuery dataset to which the cluster's usage of cloud
            resources is exported. A table will be created in the specified dataset to
            store cluster resource usage. The resulting table can be joined with BigQuery
            Billing Export to produce a fine-grained cost breakdown.
            +
            Examples:
            +
              $ {command} example-cluster --resource-usage-bigquery-dataset=example_bigquery_dataset_name
        scopes: |-
            Specifies scopes for the node instances.
            +
            Examples:
            +
              $ {command} example-cluster --scopes=https://www.googleapis.com/auth/devstorage.read_only
            +
              $ {command} example-cluster --scopes=bigquery,storage-rw,compute-ro
            +
            Multiple scopes can be specified, separated by commas. Various scopes are
            automatically added based on feature usage. Such scopes are not added if an
            equivalent scope already exists.
            +
            - `monitoring-write`: always added to ensure metrics can be written
            - `logging-write`: added if Cloud Logging is enabled
              (`--enable-cloud-logging`/`--logging`)
            - `monitoring`: added if Cloud Monitoring is enabled
              (`--enable-cloud-monitoring`/`--monitoring`)
            - `gke-default`: added for Autopilot clusters that use the default service
              account
            - `cloud-platform`: added for Autopilot clusters that use any other service
              account
            +
            SCOPE can be either the full URI of the scope or an alias. *Default* scopes are
            assigned to all instances. Available aliases are:
            +
            Alias | URI
            --- | ---
            bigquery | https://www.googleapis.com/auth/bigquery
            cloud-platform | https://www.googleapis.com/auth/cloud-platform
            cloud-source-repos | https://www.googleapis.com/auth/source.full_control
            cloud-source-repos-ro | https://www.googleapis.com/auth/source.read_only
            compute-ro | https://www.googleapis.com/auth/compute.readonly
            compute-rw | https://www.googleapis.com/auth/compute
            datastore | https://www.googleapis.com/auth/datastore
            default | https://www.googleapis.com/auth/devstorage.read_only
            | https://www.googleapis.com/auth/logging.write
            | https://www.googleapis.com/auth/monitoring.write
            | https://www.googleapis.com/auth/pubsub
            | https://www.googleapis.com/auth/service.management.readonly
            | https://www.googleapis.com/auth/servicecontrol
            | https://www.googleapis.com/auth/trace.append
            gke-default | https://www.googleapis.com/auth/devstorage.read_only
            | https://www.googleapis.com/auth/logging.write
            | https://www.googleapis.com/auth/monitoring
            | https://www.googleapis.com/auth/service.management.readonly
            | https://www.googleapis.com/auth/servicecontrol
            | https://www.googleapis.com/auth/trace.append
            logging-write | https://www.googleapis.com/auth/logging.write
            monitoring | https://www.googleapis.com/auth/monitoring
            monitoring-read | https://www.googleapis.com/auth/monitoring.read
            monitoring-write | https://www.googleapis.com/auth/monitoring.write
            pubsub | https://www.googleapis.com/auth/pubsub
            service-control | https://www.googleapis.com/auth/servicecontrol
            service-management | https://www.googleapis.com/auth/service.management.readonly
            sql (deprecated) | https://www.googleapis.com/auth/sqlservice
            sql-admin | https://www.googleapis.com/auth/sqlservice.admin
            storage-full | https://www.googleapis.com/auth/devstorage.full_control
            storage-ro | https://www.googleapis.com/auth/devstorage.read_only
            storage-rw | https://www.googleapis.com/auth/devstorage.read_write
            taskqueue | https://www.googleapis.com/auth/taskqueue
            trace | https://www.googleapis.com/auth/trace.append
            userinfo-email | https://www.googleapis.com/auth/userinfo.email
            +
            DEPRECATION WARNING: https://www.googleapis.com/auth/sqlservice account scope
            and `sql` alias do not provide SQL instance management capabilities and have
            been deprecated. Please, use https://www.googleapis.com/auth/sqlservice.admin
            or `sql-admin` to manage your Google SQL Service instances.
        secret-manager-rotation-interval: |-
            Set the rotation period for secrets in the Secret Manager CSI driver
            provider component. If you don't specify a time interval for the rotation, it will default to a rotation period of two minutes.
        secret-sync-rotation-interval: Set the rotation period for secrets in the Secret Sync component.
        security-group: |-
            The name of the RBAC security group for use with Google security groups
            in Kubernetes RBAC
            (https://kubernetes.io/docs/reference/access-authn-authz/rbac/).
            +
            To include group membership as part of the claims issued by Google
            during authentication, a group must be designated as a security group by
            including it as a direct member of this group.
            +
            If unspecified, no groups will be returned for use with RBAC.
        security-posture: |-
            Sets the mode of the Kubernetes security posture API's off-cluster features.
            +
            To enable advanced mode explicitly set the flag to
            `--security-posture=enterprise`.
            +
            To enable in standard mode explicitly set the flag to
            `--security-posture=standard`
            +
            To disable in an existing cluster, explicitly set the flag to
            `--security-posture=disabled`.
            +
            For more information on enablement, see https://cloud.google.com/kubernetes-engine/docs/concepts/about-security-posture-dashboard#feature-enablement.
            +
            _SECURITY_POSTURE_ must be one of: *disabled*, *standard*, *enterprise*.
        service-account: The Google Cloud Platform Service Account to be used by the node VMs. If a service account is specified, the cloud-platform and userinfo.email scopes are used. If no Service Account is specified, the project default service account is used.
        service-account-signing-keys: A Cloud KMS asymmetric signing cryptoKeyVersion that will be used to sign service account tokens
        service-account-verification-keys: A Cloud KMS asymmetric signing cryptoKeyVersion that will be used to verify service account tokens.  Maybe specified multiple times.
        services-ipv4-cidr: |-
            Set the IP range for the services IPs.
            +
            Can be specified as a netmask size (e.g. '/20') or as in CIDR notion
            (e.g. '10.100.0.0/20'). If given as a netmask size, the IP range will
            be chosen automatically from the available space in the network.
            +
            If unspecified, the services CIDR range will be chosen with a default
            mask size.
            +
            Cannot be specified unless '--enable-ip-alias' option is also specified.
        services-secondary-range-name: |-
            Set the secondary range to be used for services (e.g. ClusterIPs).
            NAME must be the name of an existing secondary range in the cluster
            subnetwork.
            +

            Cannot be specified unless '--enable-ip-alias' option is also specified.
            Cannot be used with '--create-subnetwork' option.
        shielded-integrity-monitoring: |-
            Enables monitoring and attestation of the boot integrity of the
            instance. The attestation is performed against the integrity policy
            baseline. This baseline is initially derived from the implicitly
            trusted boot image when the instance is created.
        shielded-secure-boot: The instance will boot with secure boot enabled.
        spot: |-
            Create nodes using spot VM instances in the new cluster.
            +
              $ {command} example-cluster --spot
            +
            New nodes, including ones created by resize or recreate, will use spot
            VM instances.
        stack-type: 'IP stack type of the cluster nodes. _STACK_TYPE_ must be one of: *ipv4*, *ipv4-ipv6*, *ipv6*.'
        storage-pools: |-
            A list of storage pools where the cluster's boot disks will be provisioned.
            +
            STORAGE_POOL must be in the format
            projects/project/zones/zone/storagePools/storagePool
        subnetwork: |-
            The Google Compute Engine subnetwork
            (https://cloud.google.com/compute/docs/subnetworks) to which the cluster is
            connected. The subnetwork must belong to the network specified by --network.
            +
            Cannot be used with the "--create-subnetwork" option.
        system-config-from-file: |-
            Path of the YAML/JSON file that contains the node configuration, including
            Linux kernel parameters (sysctls) and kubelet configs.
            +
            Examples:
            +
                kubeletConfig:
                  cpuManagerPolicy: static
                  memoryManager:
                    policy: Static
                  topologyManager:
                    policy: BestEffort
                    scope: pod
                linuxConfig:
                  sysctl:
                    net.core.somaxconn: '2048'
                    net.ipv4.tcp_rmem: '4096 87380 6291456'
                  hugepageConfig:
                    hugepage_size2m: '1024'
                    hugepage_size1g: '2'
                  swapConfig:
                    enabled: true
                    bootDiskProfile:
                      swapSizeGib: 8
                  cgroupMode: 'CGROUP_MODE_V2'
            +
            List of supported kubelet configs in 'kubeletConfig'.
            +
            KEY                                  | VALUE
            ------------------------------------ | ------------------------------------------------------------------------------------------
            cpuManagerPolicy                     | either 'static' or 'none'
            cpuCFSQuota                          | true or false (enabled by default)
            cpuCFSQuotaPeriod                    | interval (e.g., '100ms'. The value must be between 1ms and 1 second, inclusive.)
            memoryManager                        | specify memory manager policy
            topologyManager                      | specify topology manager policy and scope
            podPidsLimit                         | integer (The value must be greater than or equal to 1024 and less than 4194304.)
            containerLogMaxSize                  | positive number plus unit suffix (e.g., '100Mi', '0.2Gi'. The value must be between 10Mi and 500Mi, inclusive.)
            containerLogMaxFiles                 | integer (The value must be between [2, 10].)
            imageGcLowThresholdPercent           | integer (The value must be between [10, 85], and lower than imageGcHighThresholdPercent.)
            imageGcHighThresholdPercent          | integer (The value must be between [10, 85], and greater than imageGcLowThresholdPercent.)
            imageMinimumGcAge                    | interval (e.g., '100s', '1m'. The value must be less than '2m'.)
            imageMaximumGcAge                    | interval (e.g., '100s', '1m'. The value must be greater than imageMinimumGcAge.)
            evictionSoft                         | specify eviction soft thresholds
            evictionSoftGracePeriod              | specify eviction soft grace period
            evictionMinimumReclaim               | specify eviction minimum reclaim thresholds
            evictionMaxPodGracePeriodSeconds     | integer (Max grace period for pod termination during eviction, in seconds. The value must be between [0, 300].)
            allowedUnsafeSysctls                 | list of sysctls (Allowlisted groups: 'kernel.shm*', 'kernel.msg*', 'kernel.sem', 'fs.mqueue.*', and 'net.*', and sysctls under the groups.)
            singleProcessOomKill                 | true or false
            maxParallelImagePulls                | integer (The value must be between [2, 5].)
            +

            List of supported keys in memoryManager in 'kubeletConfig'.
            +
            KEY                                        | VALUE
            ------------------------------------------ | ------------------------------------------
            policy                                     | either 'Static' or 'None'
            +
            List of supported keys in topologyManager in 'kubeletConfig'.
            +
            KEY                                        | VALUE
            ------------------------------------------ | ------------------------------------------
            policy                                     | either 'none' or 'best-effort' or 'single-numa-node' or 'restricted'
            scope                                      | either 'pod' or 'container'
            +
            List of supported keys in evictionSoft in 'kubeletConfig'.
            +
            KEY                       | VALUE
            ------------------------- | ---------------------------------------------------------------------------------------------
            memoryAvailable           | quantity (e.g., '100Mi', '1Gi'. Represents the amount of memory available before soft eviction. The value must be at least 100Mi and less than 50% of the node's memory.)
            nodefsAvailable           | percentage (e.g., '20%'. Represents the nodefs available before soft eviction. The value must be between 10% and 50%, inclusive.)
            nodefsInodesFree          | percentage (e.g., '20%'. Represents the nodefs inodes free before soft eviction. The value must be between 5% and 50%, inclusive.)
            imagefsAvailable          | percentage (e.g., '20%'. Represents the imagefs available before soft eviction. The value must be between 15% and 50%, inclusive.)
            imagefsInodesFree         | percentage (e.g., '20%'. Represents the imagefs inodes free before soft eviction. The value must be between 5% and 50%, inclusive.)
            pidAvailable              | percentage (e.g., '20%'. Represents the pid available before soft eviction. The value must be between 10% and 50%, inclusive.)
            +
            List of supported keys in evictionSoftGracePeriod in 'kubeletConfig'.
            +
            KEY                       | VALUE
            ------------------------- | ---------------------------------------------------------------------------------------------
            memoryAvailable           | duration (e.g., '30s', '1m'. The grace period for soft eviction for this resource. The value must be positive and no more than '5m'.)
            nodefsAvailable           | duration (e.g., '30s', '1m'. The grace period for soft eviction for this resource. The value must be positive and no more than '5m'.)
            nodefsInodesFree          | duration (e.g., '30s', '1m'. The grace period for soft eviction for this resource. The value must be positive and no more than '5m'.)
            imagefsAvailable          | duration (e.g., '30s', '1m'. The grace period for soft eviction for this resource. The value must be positive and no more than '5m'.)
            imagefsInodesFree         | duration (e.g., '30s', '1m'. The grace period for soft eviction for this resource. The value must be positive and no more than '5m'.)
            pidAvailable              | duration (e.g., '30s', '1m'. The grace period for soft eviction for this resource. The value must be positive and no more than '5m'.)
            +
            List of supported keys in evictionMinimumReclaim in 'kubeletConfig'.
            +
            KEY                       | VALUE
            ------------------------- | ---------------------------------------------------------------------------------------------
            memoryAvailable           | percentage (e.g., '5%'. Represents the minimum reclaim threshold for memory available. The value must be positive and no more than 10%.)
            nodefsAvailable           | percentage (e.g., '5%'. Represents the minimum reclaim threshold for nodefs available. The value must be positive and no more than 10%.)
            nodefsInodesFree          | percentage (e.g., '5%'. Represents the minimum reclaim threshold for nodefs inodes free. The value must be positive and no more than 10%.)
            imagefsAvailable          | percentage (e.g., '5%'. Represents the minimum reclaim threshold for imagefs available. The value must be positive and no more than 10%.)
            imagefsInodesFree         | percentage (e.g., '5%'. Represents the minimum reclaim threshold for imagefs inodes free. The value must be positive and no more than 10%.)
            pidAvailable              | percentage (e.g., '5%'. Represents the minimum reclaim threshold for pid available. The value must be positive and no more than 10%.)
            +

            List of supported sysctls in 'linuxConfig'.
            +
            KEY                                        | VALUE
            ------------------------------------------ | ------------------------------------------
            net.core.netdev_max_backlog                        | Any positive integer, less than 2147483647
            net.core.rmem_default                              | Must be between [2304, 2147483647]
            net.core.rmem_max                                  | Must be between [2304, 2147483647]
            net.core.wmem_default                              | Must be between [4608, 2147483647]
            net.core.wmem_max                                  | Must be between [4608, 2147483647]
            net.core.optmem_max                                | Any positive integer, less than 2147483647
            net.core.somaxconn                                 | Must be between [128, 2147483647]
            net.ipv4.tcp_rmem                                  | Any positive integer tuple
            net.ipv4.tcp_wmem                                  | Any positive integer tuple
            net.ipv4.tcp_tw_reuse                              | Must be {0, 1, 2}
            net.ipv4.tcp_mtu_probing                           | Must be {0, 1, 2}
            net.ipv4.tcp_max_orphans                           | Must be between [16384, 262144]
            net.ipv4.tcp_max_tw_buckets                        | Must be between [4096, 2147483647]
            net.ipv4.tcp_syn_retries                           | Must be between [1, 127]
            net.ipv4.tcp_ecn                                   | Must be {0, 1, 2}
            net.ipv4.tcp_congestion_control                    | Must be string containing only letters and numbers
            net.netfilter.nf_conntrack_max                     | Must be between [65536, 4194304]
            net.netfilter.nf_conntrack_buckets                 | Must be between [65536, 524288]. Recommend setting: nf_conntrack_max = nf_conntrack_buckets * 4
            net.netfilter.nf_conntrack_tcp_timeout_close_wait  | Must be between [60, 3600]
            net.netfilter.nf_conntrack_tcp_timeout_time_wait   | Must be between [1, 600]
            net.netfilter.nf_conntrack_tcp_timeout_established | Must be between [600, 86400]
            net.netfilter.nf_conntrack_acct                    | Must be {0, 1}
            kernel.shmmni                                      | Must be between [4096, 32768]
            kernel.shmmax                                      | Must be between [0, 18446744073692774399]
            kernel.shmall                                      | Must be between [0, 18446744073692774399]
            kernel.perf_event_paranoid                         | Must be {-1, 0, 1, 2, 3}
            kernel.sched_rt_runtime_us                         | Must be [-1, 1000000]
            kernel.softlockup_panic                            | Must be {0, 1}
            kernel.yama.ptrace_scope                           | Must be {0, 1, 2, 3}
            kernel.kptr_restrict                               | Must be {0, 1, 2}
            kernel.dmesg_restrict                              | Must be {0, 1}
            kernel.sysrq                                       | Must be [0, 511]
            fs.aio-max-nr                                      | Must be between [65536, 4194304]
            fs.file-max                                        | Must be between [104857, 67108864]
            fs.inotify.max_user_instances                      | Must be between [8192, 1048576]
            fs.inotify.max_user_watches                        | Must be between [8192, 1048576]
            fs.nr_open                                         | Must be between [1048576, 2147483584]
            vm.dirty_background_ratio                          | Must be between [1, 100]
            vm.dirty_background_bytes                          | Must be between [0, 68719476736]
            vm.dirty_expire_centisecs                          | Must be between [0, 6000]
            vm.dirty_ratio                                     | Must be between [1, 100]
            vm.dirty_bytes                                     | Must be between [0, 68719476736]
            vm.dirty_writeback_centisecs                       | Must be between [0, 1000]
            vm.max_map_count                                   | Must be between [65536, 2147483647]
            vm.overcommit_memory                               | Must be one of {0, 1, 2}
            vm.overcommit_ratio                                | Must be between [0, 100]
            vm.vfs_cache_pressure                              | Must be between [0, 100]
            vm.swappiness                                      | Must be between [0, 200]
            vm.watermark_scale_factor                          | Must be between [10, 3000]
            vm.min_free_kbytes                                 | Must be between [67584, 1048576]
            +
            List of supported hugepage size in 'hugepageConfig'.
            +
            KEY             | VALUE
            ----------------| ---------------------------------------------
            hugepage_size2m | Number of 2M huge pages, any positive integer
            hugepage_size1g | Number of 1G huge pages, any positive integer
            +
            List of supported keys in 'swapConfig' under 'linuxConfig'.
            +
            KEY                                        | VALUE
            ------------------------------------------ | ------------------------------------------
            enabled                                    | boolean
            encryptionConfig                           | specify encryption settings for the swap space
            bootDiskProfile                            | specify swap on the node's boot disk
            ephemeralLocalSsdProfile                   | specify swap on the local SSD shared with pod ephemeral storage
            dedicatedLocalSsdProfile                   | specify swap on a new, separate local NVMe SSD exclusively for swap
            +
            List of supported keys in 'encryptionConfig' under 'swapConfig'.
            +
            KEY                                        | VALUE
            ------------------------------------------ | ------------------------------------------
            disabled                                   | boolean
            +
            List of supported keys in 'bootDiskProfile' under 'swapConfig'.
            +
            KEY                                        | VALUE
            ------------------------------------------ | ------------------------------------------
            swapSizeGib                                | integer
            swapSizePercent                            | integer
            +
            List of supported keys in 'ephemeralLocalSsdProfile' under 'swapConfig'.
            +
            KEY                                        | VALUE
            ------------------------------------------ | ------------------------------------------
            swapSizeGib                                | integer
            swapSizePercent                            | integer
            +
            List of supported keys in 'dedicatedLocalSsdProfile' under 'swapConfig'.
            +
            KEY                                        | VALUE
            ------------------------------------------ | ------------------------------------------
            diskCount                                  | integer
            +

            Allocated hugepage size should not exceed 60% of available memory on the node. For example, c2d-highcpu-4 has 8GB memory, total
            allocated hugepage of 2m and 1g should not exceed 8GB * 0.6 = 4.8GB.
            +
            1G hugepages are only available in following machine familes:
            c3, m2, c2d, c3d, h3, m3, a2, a3, g2.
            +
            Supported values for 'cgroupMode' under 'linuxConfig'.
            +
            * `CGROUP_MODE_V1`: Use cgroupv1 on the node pool.
            * `CGROUP_MODE_V2`: Use cgroupv2 on the node pool.
            * `CGROUP_MODE_UNSPECIFIED`: Use the default GKE cgroup configuration.
            +
            Supported values for 'transparentHugepageEnabled' under 'linuxConfig' which controls transparent hugepage support for anonymous memory.
            +
            * `TRANSPARENT_HUGEPAGE_ENABLED_ALWAYS`: Transparent hugepage is enabled system wide.
            * `TRANSPARENT_HUGEPAGE_ENABLED_MADVISE`: Transparent hugepage is enabled inside MADV_HUGEPAGE regions. This is the default kernel configuration.
            * `TRANSPARENT_HUGEPAGE_ENABLED_NEVER`: Transparent hugepage is disabled.
            * `TRANSPARENT_HUGEPAGE_ENABLED_UNSPECIFIED`: Default value. GKE will not modify the kernel configuration.
            +
            Supported values for 'transparentHugepageDefrag' under 'linuxConfig' which defines the transparent hugepage defrag configuration on the node.
            +
            * `TRANSPARENT_HUGEPAGE_DEFRAG_ALWAYS`: It means that an application requesting THP will stall on allocation failure and directly reclaim pages and compact memory in an effort to allocate a THP immediately.
            * `TRANSPARENT_HUGEPAGE_DEFRAG_DEFER`: It means that an application will wake kswapd in the background to reclaim pages and wake kcompactd to compact memory so that THP is available in the near future. It is the responsibility of khugepaged to then install the THP pages later.
            * `TRANSPARENT_HUGEPAGE_DEFRAG_DEFER_WITH_MADVISE`: It means that an application will enter direct reclaim and compaction like always, but only for regions that have used madvise(MADV_HUGEPAGE); all other regions will wake kswapd in the background to reclaim pages and wake kcompactd to compact memory so that THP is available in the near future.
            * `TRANSPARENT_HUGEPAGE_DEFRAG_MADVISE`: It means that an application will enter direct reclaim and compaction like always, but only for regions that have used madvise(MADV_HUGEPAGE); all other regions will wake kswapd in the background to reclaim pages and wake kcompactd to compact memory so that THP is available in the near future.
            * `TRANSPARENT_HUGEPAGE_DEFRAG_NEVER`: It means that an application will never enter direct reclaim or compaction.
            * `TRANSPARENT_HUGEPAGE_DEFRAG_UNSPECIFIED`: Default value. GKE will not modify the kernel configuration.
            +
            Note, updating the system configuration of an existing node pool requires recreation of the nodes which which might cause a disruption.
            +
            Use a full or relative path to a local file containing the value of system_config.
        tag-bindings: |
            List of tag-bindings KEY=VALUE pairs to bind.
            Each item must be expressed as
            `<tag-key-namespaced-name>=<tag-value-short-name>`.

            Example: `123/environment=production,123/costCenter=marketing`
        tags: |-
            Applies the given Compute Engine tags (comma separated) on all nodes in the new
            node-pool.
            +
            Examples:
            +
              $ {command} example-cluster --tags=tag1,tag2
            +
            New nodes, including ones created by resize or recreate, will have these tags
            on the Compute Engine API instance object and can be used in firewall rules.
            See https://cloud.google.com/sdk/gcloud/reference/compute/firewall-rules/create
            for examples.
        threads-per-core: |-
            The number of visible threads per physical core for each node. To disable
            simultaneous multithreading (SMT) set this to 1.
        tier: |-
            (DEPRECATED) Set the desired tier for the cluster.
            +
            The `--tier` flag is deprecated. More info: https://cloud.google.com/kubernetes-engine/docs/release-notes#September_02_2025. _TIER_ must be one of: *standard*, *enterprise*.
        timeout: Timeout (seconds) for waiting on the operation to complete.
        total-max-nodes: |-
            Maximum number of all nodes in the node pool.
            +
            Maximum number of all nodes to which the node pool specified by --node-pool
            (or default node pool if unspecified) can scale. Ignored unless
            --enable-autoscaling is also specified.
        total-min-nodes: |-
            Minimum number of all nodes in the node pool.
            +
            Minimum number of all nodes to which the node pool specified by --node-pool
            (or default node pool if unspecified) can scale. Ignored unless
            --enable-autoscaling is also specified.
        tpu-ipv4-cidr: |
            Set the IP range for the Cloud TPUs.

            Can be specified as a netmask size (e.g. '/20') or as in CIDR notion
            (e.g. '10.100.0.0/20'). If given as a netmask size, the IP range will be chosen
            automatically from the available space in the network.

            If unspecified, the TPU CIDR range will use automatic default '/20'.

            Can not be specified unless '--enable-tpu' and '--enable-ip-alias' are also
            specified.
        username: |-
            The user name to use for basic auth for the cluster. Use `--password` to specify
            a password; if not, the server will randomly generate one.
        workload-metadata: |-
            Type of metadata server available to pods running in the node pool. _WORKLOAD_METADATA_ must be one of:
            +
            *EXPOSED*::: [DEPRECATED] Pods running in this node pool have access to the node's underlying Compute Engine Metadata Server.
            *GCE_METADATA*::: Pods running in this node pool have access to the node's underlying Compute Engine Metadata Server.
            *GKE_METADATA*::: Run the Kubernetes Engine Metadata Server on this node. The Kubernetes Engine Metadata Server exposes a metadata API to workloads that is compatible with the V1 Compute Metadata APIs exposed by the Compute Engine and App Engine Metadata Servers. This feature can only be enabled if Workload Identity is enabled at the cluster level.
            *GKE_METADATA_SERVER*::: [DEPRECATED] Run the Kubernetes Engine Metadata Server on this node. The Kubernetes Engine Metadata Server exposes a metadata API to workloads that is compatible with the V1 Compute Metadata APIs exposed by the Compute Engine and App Engine Metadata Servers. This feature can only be enabled if Workload Identity is enabled at the cluster level.
            *SECURE*::: [DEPRECATED] Prevents pods not in hostNetwork from accessing certain VM metadata, specifically kube-env, which contains Kubelet credentials, and the instance identity token. This is a temporary security solution available while the bootstrapping process for cluster nodes is being redesigned with significant security improvements. This feature is scheduled to be deprecated in the future and later removed.
            :::
            +
        workload-metadata-from-node: Type of metadata server available to pods running in the node pool.
        workload-pool: |-
            Enable Workload Identity on the cluster.
            +
            When enabled, Kubernetes service accounts will be able to act as Cloud IAM
            Service Accounts, through the provided workload pool.
            +
            Currently, the only accepted workload pool is the workload pool of
            the Cloud project containing the cluster, `PROJECT_ID.svc.id.goog`.
            +
            For more information on Workload Identity, see
            +
                        https://cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
        workload-vulnerability-scanning: |-
            Sets the mode of the Kubernetes security posture API's workload
            vulnerability scanning.
            +
            To enable Advanced vulnerability insights mode explicitly set the flag to
            `--workload-vulnerability-scanning=enterprise`.
            +
            To enable in standard mode explicitly set the flag to
            `--workload-vulnerability-scanning=standard`.
            +
            To disable in an existing cluster, explicitly set the flag to
            `--workload-vulnerability-scanning=disabled`.
            +
            For more information on enablement, see https://cloud.google.com/kubernetes-engine/docs/concepts/about-security-posture-dashboard#feature-enablement.
            +
            _WORKLOAD_VULNERABILITY_SCANNING_ must be one of: *disabled*, *standard*, *enterprise*.
        zone: Compute zone (e.g. us-central1-a) for a zonal cluster. Overrides the default compute/zone property value for this command invocation.
