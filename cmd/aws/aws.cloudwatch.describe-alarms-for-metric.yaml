name: describe-alarms-for-metric
description: Retrieves the alarms for the specified metric.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dimensions=:
        description: The dimensions associated with the metric.
        nargs: -1
    --extended-statistic=: The percentile statistic for the metric.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --metric-name=!: The name of the metric.
    --namespace=!: The namespace of the metric.
    --period=: The period, in seconds, over which the statistic is applied.
    --statistic=: The statistic for the metric, other than percentiles.
    --unit=: The unit for the metric.
completion:
    flag:
        statistic:
            - SampleCount
            - Average
            - Sum
            - Minimum
            - Maximum
        unit:
            - Seconds
            - Microseconds
            - Milliseconds
            - Bytes
            - Kilobytes
            - Megabytes
            - Gigabytes
            - Terabytes
            - Bits
            - Kilobits
            - Megabits
            - Gigabits
            - Terabits
            - Percent
            - Count
            - Bytes/Second
            - Kilobytes/Second
            - Megabytes/Second
            - Gigabytes/Second
            - Terabytes/Second
            - Bits/Second
            - Kilobits/Second
            - Megabits/Second
            - Gigabits/Second
            - Terabits/Second
            - Count/Second
            - None
documentation:
    command: |-
        Retrieves the alarms for the specified metric. To filter the results, specify a statistic, period, or unit.

        This operation retrieves only standard alarms that are based on the specified metric. It does not return alarms based on math expressions that use the specified metric, or composite alarms that use the specified metric.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dimensions: The dimensions associated with the metric. If the metric has any associated dimensions, you must specify them in order for the call to succeed.
        extended-statistic: The percentile statistic for the metric. Specify a value between p0.0 and p100.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        metric-name: The name of the metric.
        namespace: The namespace of the metric.
        period: The period, in seconds, over which the statistic is applied.
        statistic: The statistic for the metric, other than percentiles. For percentile statistics, use `ExtendedStatistics`.
        unit: The unit for the metric.
