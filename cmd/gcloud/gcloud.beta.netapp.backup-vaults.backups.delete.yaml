name: delete
description: '*(BETA)*  Delete a Cloud NetApp Backup.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --backup-vault=: ID of the backup_vault or fully qualified identifier for the backup_vault.
    --location=: The location of the backup.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(BETA)*  Delete a Cloud NetApp Backup.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        backup-vault: |-
            ID of the backup_vault or fully qualified identifier for the backup_vault.
            +
            To set the `backup_vault` attribute:
            * provide the argument `--backup-vault` on the command line.
        location: |-
            The location of the backup.
            +
            To set the `location` attribute:
            * provide the argument `backup` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
