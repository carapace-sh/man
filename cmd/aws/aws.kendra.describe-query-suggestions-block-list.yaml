name: describe-query-suggestions-block-list
description: Gets information about a block list used for query suggestions for an index.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --id=!: The identifier of the block list you want to get information on.
    --index-id=!: The identifier of the index for the block list.
documentation:
    command: |-
        Gets information about a block list used for query suggestions for an index.

        This is used to check the current settings that are applied to a block list.

        `DescribeQuerySuggestionsBlockList` is currently not supported in the Amazon Web Services GovCloud (US-West) region.
    flag:
        cli-input-json: |-
