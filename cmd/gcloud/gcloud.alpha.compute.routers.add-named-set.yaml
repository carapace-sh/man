name: add-named-set
description: '*(ALPHA)*  Add an empty named set to a Compute Engine router.'
hidden: true
flags:
    --region=: Region of the router to insert.
    --set-name=!: Name of the named set to add.
    --set-type=!: Type of the set's elements.
completion:
    flag:
        set-type:
            - COMMUNITY
            - PREFIX
documentation:
    command: '*(ALPHA)*  *gcloud alpha compute routers add-named-set* adds an empty named set to a Compute Engine router.'
    flag:
        region: |-
            Region of the router to insert. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        set-name: Name of the named set to add.
        set-type: |-
            Type of the set's elements. _SET_TYPE_ must be one of:
            +
            *COMMUNITY*::: The Named Set is a Community Named Set.
            *PREFIX*::: The Named Set is a Prefix Named Set.
            :::
            +
