name: list-indices
description: Lists the search indices.
flags:
    --max-results=: The maximum number of results to return at one time.
    --next-token=: The token used to get the next set of results, or `null` if there are no additional results.
documentation:
    command: |-
        Lists the search indices.

        Requires permission to access the [ListIndices](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        max-results: The maximum number of results to return at one time.
        next-token: The token used to get the next set of results, or `null` if there are no additional results.
