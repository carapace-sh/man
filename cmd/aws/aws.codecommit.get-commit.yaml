name: get-commit
description: Returns information about a commit, including commit message and committer information.
flags:
    --commit-id=!: The commit ID.
    --repository-name=!: The name of the repository to which the commit was made.
documentation:
    command: Returns information about a commit, including commit message and committer information.
    flag:
        commit-id: The commit ID. Commit IDs are the full SHA ID of the commit.
        repository-name: The name of the repository to which the commit was made.
