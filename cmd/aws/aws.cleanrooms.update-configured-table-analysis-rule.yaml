name: update-configured-table-analysis-rule
description: Updates a configured table analysis rule.
flags:
    --analysis-rule-policy=!: The new analysis rule policy for the configured table analysis rule.
    --analysis-rule-type=!: The analysis rule type to be updated.
    --configured-table-identifier=!: The unique identifier for the configured table that the analysis rule applies to.
completion:
    flag:
        analysis-rule-type:
            - AGGREGATION
            - LIST
            - CUSTOM
documentation:
    command: Updates a configured table analysis rule.
    flag:
        analysis-rule-policy: The new analysis rule policy for the configured table analysis rule.
        analysis-rule-type: The analysis rule type to be updated. Configured table analysis rules are uniquely identified by their configured table identifier and analysis rule type.
        configured-table-identifier: The unique identifier for the configured table that the analysis rule applies to. Currently accepts the configured table ID.
