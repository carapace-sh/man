name: get-intent-versions
description: Gets information about all of the versions of an intent.
flags:
    --max-results=: The maximum number of intent versions to return in the response.
    --name=!: The name of the intent for which versions should be returned.
    --next-token=: A pagination token for fetching the next page of intent versions.
documentation:
    command: |-
        Gets information about all of the versions of an intent.

        The `GetIntentVersions` operation returns an `IntentMetadata` object for each version of an intent. For example, if an intent has three numbered versions, the `GetIntentVersions` operation returns four `IntentMetadata` objects in the response, one for each numbered version and one for the `$LATEST` version.

        The `GetIntentVersions` operation always returns at least one version, the `$LATEST` version.

        This operation requires permissions for the `lex:GetIntentVersions` action.
    flag:
        max-results: The maximum number of intent versions to return in the response. The default is 10.
        name: The name of the intent for which versions should be returned.
        next-token: A pagination token for fetching the next page of intent versions. If the response to this call is truncated, Amazon Lex returns a pagination token in the response. To fetch the next page of versions, specify the pagination token in the next request.
