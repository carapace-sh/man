name: describe-maintenance-windows
description: Retrieves the maintenance windows in an Amazon Web Services account.
flags:
    --filters=: Optional filters used to narrow down the scope of the returned maintenance windows.
    --max-results=: The maximum number of items to return for this call.
    --next-token=: The token for the next set of items to return.
documentation:
    command: Retrieves the maintenance windows in an Amazon Web Services account.
    flag:
        filters: Optional filters used to narrow down the scope of the returned maintenance windows. Supported filter keys are `Name` and `Enabled`. For example, `Name=MyMaintenanceWindow` and `Enabled=True`.
        max-results: The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
