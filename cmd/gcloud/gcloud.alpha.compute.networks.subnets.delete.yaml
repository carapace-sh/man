name: delete
description: '*(ALPHA)*  Delete Google Cloud subnetworks.'
flags:
    --region=: Region of the subnetworks to delete.
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute networks subnets delete* deletes one or more Google Cloud subnetworks.
        Subnetworks can only be deleted when no other resources,
        such as VM instances, refer to them.".
    flag:
        region: |-
            Region of the subnetworks to delete. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
