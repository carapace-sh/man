name: update-sql-injection-match-set
description: This is **AWS WAF Classic** documentation.
flags:
    --change-token=!: The value returned by the most recent call to [GetChangeToken]().
    --sql-injection-match-set-id=!: The `SqlInjectionMatchSetId` of the `SqlInjectionMatchSet` that you want to update.
    --updates=!: An array of `SqlInjectionMatchSetUpdate` objects that you want to insert into or delete from a [SqlInjectionMatchSet]().
documentation:
    command: "This is **AWS WAF Classic** documentation. For more information, see [AWS WAF Classic](https://docs.aws.amazon.com/waf/latest/developerguide/classic-waf-chapter.html) in the developer guide.\n\n**For the latest version of AWS WAF**, use the AWS WAFV2 API and see the [AWS WAF Developer Guide](https://docs.aws.amazon.com/waf/latest/developerguide/waf-chapter.html). With the latest version, AWS WAF has a single set of endpoints for regional and global use.\n\nInserts or deletes [SqlInjectionMatchTuple]() objects (filters) in a [SqlInjectionMatchSet](). For each `SqlInjectionMatchTuple` object, you specify the following values:\n\n- `Action`: Whether to insert the object into or delete the object from the array. To change a `SqlInjectionMatchTuple`, you delete the existing object and add a new one.\n- `FieldToMatch`: The part of web requests that you want AWS WAF to inspect and, if you want AWS WAF to inspect a header or custom query parameter, the name of the header or parameter.\n- `TextTransformation`: Which text transformation, if any, to perform on the web request before inspecting the request for snippets of malicious SQL code.\n  \n  You can only specify a single type of TextTransformation.\n\nYou use `SqlInjectionMatchSet` objects to specify which CloudFront requests that you want to allow, block, or count. For example, if you're receiving requests that contain snippets of SQL code in the query string and you want to block the requests, you can create a `SqlInjectionMatchSet` with the applicable settings, and then configure AWS WAF to block the requests.\n\nTo create and configure a `SqlInjectionMatchSet`, perform the following steps:\n\n1. Submit a [CreateSqlInjectionMatchSet]() request.\n2. Use [GetChangeToken]() to get the change token that you provide in the `ChangeToken` parameter of an [UpdateIPSet]() request.\n3. Submit an `UpdateSqlInjectionMatchSet` request to specify the parts of web requests that you want AWS WAF to inspect for snippets of SQL code.\n\nFor more information about how to use the AWS WAF API to allow or block HTTP requests, see the [AWS WAF Developer Guide](https://docs.aws.amazon.com/waf/latest/developerguide/)."
    flag:
        change-token: The value returned by the most recent call to [GetChangeToken]().
        sql-injection-match-set-id: The `SqlInjectionMatchSetId` of the `SqlInjectionMatchSet` that you want to update. `SqlInjectionMatchSetId` is returned by [CreateSqlInjectionMatchSet]() and by [ListSqlInjectionMatchSets]().
        updates: |-
            An array of `SqlInjectionMatchSetUpdate` objects that you want to insert into or delete from a [SqlInjectionMatchSet](). For more information, see the applicable data types:

            - [SqlInjectionMatchSetUpdate](): Contains `Action` and `SqlInjectionMatchTuple`
            - [SqlInjectionMatchTuple](): Contains `FieldToMatch` and `TextTransformation`
            - [FieldToMatch](): Contains `Data` and `Type`
