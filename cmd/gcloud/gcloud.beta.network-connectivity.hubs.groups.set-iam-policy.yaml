name: set-iam-policy
description: '*(BETA)*  Set the IAM policy of a group resource.'
flags:
    --hub=: Id of the hub.
documentation:
    command: |
        *(BETA)*  Replace the existing IAM policy of a group resource with a policy
        encoded in a JSON or YAML file.
    flag:
        hub: |-
            Id of the hub.
            +
            To set the `hub` attribute:
            * provide the argument `group` on the command line with a fully specified name;
            * provide the argument `--hub` on the command line.
