name: list-available-resource-dimensions
description: Retrieve the dimensions that can be queried for each specified metric type on a specified DB instance.
flags:
    --authorized-actions=: The actions to discover the dimensions you are authorized to access.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identifier=!: An immutable identifier for a data source that is unique within an Amazon Web Services Region.
    --max-results=: The maximum number of items to return in the response.
    --metrics=!: The types of metrics for which to retrieve dimensions.
    --next-token=: An optional pagination token provided by a previous request.
    --service-type=!: The Amazon Web Services service for which Performance Insights returns metrics.
completion:
    flag:
        service-type:
            - RDS
            - DOCDB
documentation:
    command: Retrieve the dimensions that can be queried for each specified metric type on a specified DB instance.
    flag:
        authorized-actions: |-
            The actions to discover the dimensions you are authorized to access. If you specify multiple actions, then the response will contain the dimensions common for all the actions.

            When you don't specify this request parameter or provide an empty list, the response contains all the available dimensions for the target database engine whether or not you are authorized to access them.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        identifier: An immutable identifier for a data source that is unique within an Amazon Web Services Region. Performance Insights gathers metrics from this data source. To use an Amazon RDS DB instance as a data source, specify its `DbiResourceId` value. For example, specify `db-ABCDEFGHIJKLMNOPQRSTU1VWZ`.
        max-results: The maximum number of items to return in the response. If more items exist than the specified `MaxRecords` value, a pagination token is included in the response so that the remaining results can be retrieved.
        metrics: The types of metrics for which to retrieve dimensions. Valid values include `db.load`.
        next-token: An optional pagination token provided by a previous request. If this parameter is specified, the response includes only records beyond the token, up to the value specified by `MaxRecords`.
        service-type: The Amazon Web Services service for which Performance Insights returns metrics.
