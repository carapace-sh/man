name: tag-resource
description: Add tags to a MediaConvert queue, preset, or job template.
flags:
    --arn=!: The Amazon Resource Name (ARN) of the resource that you want to tag.
    --tags=!: The tags that you want to add to the resource.
documentation:
    command: Add tags to a MediaConvert queue, preset, or job template. For information about tagging, see the User Guide at https://docs.aws.amazon.com/mediaconvert/latest/ug/tagging-resources.html
    flag:
        arn: The Amazon Resource Name (ARN) of the resource that you want to tag. To get the ARN, send a GET request with the resource name.
        tags: The tags that you want to add to the resource. You can tag resources with a key-value pair or with only a key.
