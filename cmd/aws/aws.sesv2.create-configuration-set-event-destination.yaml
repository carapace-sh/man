name: create-configuration-set-event-destination
description: Create an event destination.
flags:
    --configuration-set-name=!: The name of the configuration set .
    --event-destination-name=!: A name that identifies the event destination within the configuration set.
    --event-destination=!: An object that defines the event destination.
documentation:
    command: |-
        Create an event destination. *Events* include message sends, deliveries, opens, clicks, bounces, and complaints. *Event destinations* are places that you can send information about these events to. For example, you can send event data to Amazon EventBridge and associate a rule to send the event to the specified target.

        A single configuration set can include more than one event destination.
    flag:
        configuration-set-name: The name of the configuration set .
        event-destination: An object that defines the event destination.
        event-destination-name: A name that identifies the event destination within the configuration set.
