name: get-queue
description: Returns detailed information about a queue.
flags:
    --cluster-identifier=!: The name or ID of the cluster of the queue.
    --queue-identifier=!: The name or ID of the queue.
documentation:
    command: Returns detailed information about a queue. The information includes the compute node groups that the queue uses to schedule jobs.
    flag:
        cluster-identifier: The name or ID of the cluster of the queue.
        queue-identifier: The name or ID of the queue.
