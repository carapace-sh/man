name: describe-addon-versions
description: Describes the versions for an add-on.
flags:
    --addon-name=: The name of the add-on.
    --kubernetes-version=: The Kubernetes versions that you can use the add-on with.
    --max-results=: The maximum number of results, returned in paginated output.
    --next-token=: The `nextToken` value returned from a previous paginated request, where `maxResults` was used and the results exceeded the value of that parameter.
    --owners=: The owner of the add-on.
    --publishers=: The publisher of the add-on.
    --types=: The type of the add-on.
documentation:
    command: |-
        Describes the versions for an add-on.

        Information such as the Kubernetes versions that you can use the add-on with, the `owner`, `publisher`, and the `type` of the add-on are returned.
    flag:
        addon-name: The name of the add-on. The name must match one of the names returned by [`ListAddons`](https://docs.aws.amazon.com/eks/latest/APIReference/API_ListAddons.html) .
        kubernetes-version: The Kubernetes versions that you can use the add-on with.
        max-results: The maximum number of results, returned in paginated output. You receive `maxResults` in a single page, along with a `nextToken` response element. You can see the remaining results of the initial request by sending another request with the returned `nextToken` value. This value can be between 1 and 100. If you don't use this parameter, 100 results and a `nextToken` value, if applicable, are returned.
        next-token: |-
            The `nextToken` value returned from a previous paginated request, where `maxResults` was used and the results exceeded the value of that parameter. Pagination continues from the end of the previous results that returned the `nextToken` value. This value is null when there are no more results to return.

            This token should be treated as an opaque identifier that is used only to retrieve the next items in a list and not for other programmatic purposes.
        owners: The owner of the add-on. For valid `owners`, don't specify a value for this property.
        publishers: The publisher of the add-on. For valid `publishers`, don't specify a value for this property.
        types: The type of the add-on. For valid `types`, don't specify a value for this property.
