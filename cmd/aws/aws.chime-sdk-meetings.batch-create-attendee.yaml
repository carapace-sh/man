name: batch-create-attendee
description: Creates up to 100 attendees for an active Amazon Chime SDK meeting.
flags:
    --attendees=!: The attendee information, including attendees' IDs and join tokens.
    --meeting-id=!: The Amazon Chime SDK ID of the meeting to which you're adding attendees.
documentation:
    command: Creates up to 100 attendees for an active Amazon Chime SDK meeting. For more information about the Amazon Chime SDK, see [Using the Amazon Chime SDK](https://docs.aws.amazon.com/chime-sdk/latest/dg/meetings-sdk.html) in the *Amazon Chime Developer Guide*.
    flag:
        attendees: The attendee information, including attendees' IDs and join tokens.
        meeting-id: The Amazon Chime SDK ID of the meeting to which you're adding attendees.
