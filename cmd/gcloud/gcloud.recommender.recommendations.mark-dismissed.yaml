name: mark-dismissed
description: Mark recommendation's state as DISMISSED.
flags:
    --billing-account=: The Google Cloud Platform billing account ID to use for this invocation.
    --etag=!: Etag of a recommendation
    --folder=: The Google Cloud Platform folder ID to use for this invocation.
    --location=!: Location
    --organization=: The Google Cloud Platform organization ID to use for this invocation.
    --recommender=!: Recommender of the recommendations
documentation:
    command: |-
        Mark recommendation's state as DISMISSED. Can be applied to recommendations
        in ACTIVE state. The following parent resources are supported: project,
        billing account, folder, and organization as parent resources for
        recommendations.

        ## EXAMPLES
        To mark a recommendation as DISMISSED:

        $ gcloud recommender recommendations mark-dismissed abcd-1234 --project=project-id --location=global
        --recommender=google.compute.instance.MachineTypeRecommender --etag=abc123
    flag:
        billing-account: The Google Cloud Platform billing account ID to use for this invocation.
        etag: Etag of a recommendation
        folder: The Google Cloud Platform folder ID to use for this invocation.
        location: Location
        organization: The Google Cloud Platform organization ID to use for this invocation.
        recommender: Recommender of the recommendations
