name: update-association-status
description: Updates the status of the Amazon Web Services Systems Manager document (SSM document) associated with the specified managed node.
flags:
    --association-status=!: The association status.
    --instance-id=!: The managed node ID.
    --name=!: The name of the SSM document.
documentation:
    command: |-
        Updates the status of the Amazon Web Services Systems Manager document (SSM document) associated with the specified managed node.

        `UpdateAssociationStatus` is primarily used by the Amazon Web Services Systems Manager Agent (SSM Agent) to report status updates about your associations and is only used for associations created with the `InstanceId` legacy parameter.
    flag:
        association-status: The association status.
        instance-id: The managed node ID.
        name: The name of the SSM document.
