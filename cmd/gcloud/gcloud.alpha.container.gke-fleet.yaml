name: gke-fleet
description: '*(ALPHA)*  Centrally manage Google opinionated Fleet configurations for GKE clusters.'
hidden: true
documentation:
    command: |-
        *(ALPHA)*  Manage Google opinionated Fleet configurations for GKE
        clusters.
        Fleet provides a centralized control-plane to managed features and services on
        all
        registered cluster.

        A registered cluster is always associated with a Membership, a resource
        within fleet.

        ## EXAMPLES

        Initialize GKE fleets:

          $ gcloud alpha container gke-fleet init --help
