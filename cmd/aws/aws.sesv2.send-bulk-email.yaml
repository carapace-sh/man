name: send-bulk-email
description: Composes an email message to multiple destinations.
flags:
    --bulk-email-entries=!: The list of bulk email entry objects.
    --configuration-set-name=: The name of the configuration set to use when sending the email.
    --default-content=!: An object that contains the body of the message.
    --default-email-tags=: A list of tags, in the form of name/value pairs, to apply to an email that you send using the `SendEmail` operation.
    --endpoint-id=: The ID of the multi-region endpoint (global-endpoint).
    --feedback-forwarding-email-address-identity-arn=: This parameter is used only for sending authorization.
    --feedback-forwarding-email-address=: The address that you want bounce and complaint notifications to be sent to.
    --from-email-address-identity-arn=: This parameter is used only for sending authorization.
    --from-email-address=: The email address to use as the "From" address for the email.
    --reply-to-addresses=: The "Reply-to" email addresses for the message.
    --tenant-name=: The name of the tenant through which this bulk email will be sent.
documentation:
    command: Composes an email message to multiple destinations.
    flag:
        bulk-email-entries: The list of bulk email entry objects.
        configuration-set-name: The name of the configuration set to use when sending the email.
        default-content: An object that contains the body of the message. You can specify a template message.
        default-email-tags: A list of tags, in the form of name/value pairs, to apply to an email that you send using the `SendEmail` operation. Tags correspond to characteristics of the email that you define, so that you can publish email sending events.
        endpoint-id: The ID of the multi-region endpoint (global-endpoint).
        feedback-forwarding-email-address: The address that you want bounce and complaint notifications to be sent to.
        feedback-forwarding-email-address-identity-arn: |-
            This parameter is used only for sending authorization. It is the ARN of the identity that is associated with the sending authorization policy that permits you to use the email address specified in the `FeedbackForwardingEmailAddress` parameter.

            For example, if the owner of example.com (which has ARN arn:aws:ses:us-east-1:123456789012:identity/example.com) attaches a policy to it that authorizes you to use feedback@example.com, then you would specify the `FeedbackForwardingEmailAddressIdentityArn` to be arn:aws:ses:us-east-1:123456789012:identity/example.com, and the `FeedbackForwardingEmailAddress` to be feedback@example.com.

            For more information about sending authorization, see the [Amazon SES Developer Guide](https://docs.aws.amazon.com/ses/latest/DeveloperGuide/sending-authorization.html).
        from-email-address: The email address to use as the "From" address for the email. The address that you specify has to be verified.
        from-email-address-identity-arn: |-
            This parameter is used only for sending authorization. It is the ARN of the identity that is associated with the sending authorization policy that permits you to use the email address specified in the `FromEmailAddress` parameter.

            For example, if the owner of example.com (which has ARN arn:aws:ses:us-east-1:123456789012:identity/example.com) attaches a policy to it that authorizes you to use sender@example.com, then you would specify the `FromEmailAddressIdentityArn` to be arn:aws:ses:us-east-1:123456789012:identity/example.com, and the `FromEmailAddress` to be sender@example.com.

            For more information about sending authorization, see the [Amazon SES Developer Guide](https://docs.aws.amazon.com/ses/latest/DeveloperGuide/sending-authorization.html).
        reply-to-addresses: The "Reply-to" email addresses for the message. When the recipient replies to the message, each Reply-to address receives the reply.
        tenant-name: |-
            The name of the tenant through which this bulk email will be sent.

            The email sending operation will only succeed if all referenced resources (identities, configuration sets, and templates) are associated with this tenant.
