name: create-vpc-attachment
description: Creates a VPC attachment on an edge location of a core network.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: The client token associated with the request.
    --core-network-id=!: The ID of a core network for the VPC attachment.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --options=: Options for the VPC attachment.
    --routing-policy-label=: The routing policy label to apply to the VPC attachment for traffic routing decisions.
    --subnet-arns=!: The subnet ARN of the VPC attachment.
    --tags=: The key-value tags associated with the request.
    --vpc-arn=!: The ARN of the VPC.
documentation:
    command: Creates a VPC attachment on an edge location of a core network.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
