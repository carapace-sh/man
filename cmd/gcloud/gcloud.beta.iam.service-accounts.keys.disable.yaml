name: disable
description: '*(BETA)*  Disable a service account key.'
flags:
    --iam-account=: The name of the IAM ServiceAccount.
documentation:
    command: |
        *(BETA)*  Disable a service account key.

        If the service account does not exist, this command returns a `PERMISSION_DENIED` error.
    flag:
        iam-account: |-
            The name of the IAM ServiceAccount.
            +

            To set the `iam-account` attribute:
            * provide the argument `iam_key` on the command line with a fully specified name;
            * provide the argument `--iam-account` on the command line.
