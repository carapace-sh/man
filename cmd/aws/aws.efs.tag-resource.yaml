name: tag-resource
description: Creates a tag for an EFS resource.
flags:
    --resource-id=!: The ID specifying the EFS resource that you want to create a tag for.
    --tags=!: An array of `Tag` objects to add.
documentation:
    command: |-
        Creates a tag for an EFS resource. You can create tags for EFS file systems and access points using this API operation.

        This operation requires permissions for the `elasticfilesystem:TagResource` action.
    flag:
        resource-id: The ID specifying the EFS resource that you want to create a tag for.
        tags: An array of `Tag` objects to add. Each `Tag` object is a key-value pair.
