name: create
description: '*(BETA)*  Create a Filestore snapshot.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: Description of the snapshot.
    --instance-location=: Location of the Filestore instance.
    --instance-region=: Region of the Filestore instance.
    --instance=!: Name of the Filestore instance that you want to create a snapshot of.
    --labels=: List of label KEY=VALUE pairs to add.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(BETA)*  Create a Filestore snapshot of an instance.

        This command can fail for the following reasons:
          * A snapshot with the same name already exists.
          * The active account does not have permission to create snapshots.
          * Maximum number of snapshots for the instance has been reached.
          * The service tier of the instance does not support snapshots.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: 'Description of the snapshot. Limit: 2048 characters.'
        instance: Name of the Filestore instance that you want to create a snapshot of.
        instance-location: Location of the Filestore instance.
        instance-region: Region of the Filestore instance.
        labels: List of label KEY=VALUE pairs to add.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
