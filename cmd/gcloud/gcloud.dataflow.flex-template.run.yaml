name: run
description: Runs a job from the specified path.
flags:
    --additional-experiments=: Additional experiments to pass to the job.
    --additional-pipeline-options=: Additional pipeline options to pass to the job.
    --additional-user-labels=: Additional user labels to pass to the job.
    --dataflow-kms-key=: Cloud KMS key to protect the job resources.
    --disable-public-ips: Cloud Dataflow workers must not use public IP addresses.
    --enable-streaming-engine: Enabling Streaming Engine for the streaming job.
    --flexrs-goal=: FlexRS goal for the flex template job.
    --launcher-machine-type=: The machine type to use for launching the job.
    --max-workers=: Maximum number of workers to run.
    --network=: Compute Engine network for launching instances to run your pipeline.
    --no-disable-public-ips&: Cloud Dataflow workers must not use public IP addresses.
    --no-enable-streaming-engine&: Enabling Streaming Engine for the streaming job.
    --no-update!&: Set this to true for streaming update jobs.
    --num-workers=: Initial number of workers to use.
    --parameters=: Parameters to pass to the job.
    --region=: Region ID of the job's regional endpoint.
    --service-account-email=: Service account to run the workers as.
    --staging-location=: Default Google Cloud Storage location to stage local files.(Must
    --subnetwork=: Compute Engine subnetwork for launching instances to run your pipeline.
    --temp-location=: Default Google Cloud Storage location to stage temporary files.
    --template-file-gcs-location=!: Google Cloud Storage location of the flex template to run.
    --transform-name-mappings=: Transform name mappings for the streaming update job.
    --update!: Set this to true for streaming update jobs.
    --worker-machine-type=: Type of machine to use for workers.
    --worker-region=: Region to run the workers in.
    --worker-zone=: Zone to run the workers in.
completion:
    flag:
        flexrs-goal:
            - COST_OPTIMIZED
            - SPEED_OPTIMIZED
documentation:
    command: Runs a job from the specified flex template gcs path.
    flag:
        additional-experiments: 'Additional experiments to pass to the job. Example: --additional-experiments=experiment1,experiment2=value2'
        additional-pipeline-options: 'Additional pipeline options to pass to the job. Example: --additional-pipeline-options=option1=value1,option2=value2'
        additional-user-labels: 'Additional user labels to pass to the job. Example: --additional-user-labels=''key1=value1,key2=value2'''
        dataflow-kms-key: Cloud KMS key to protect the job resources.
        disable-public-ips: Cloud Dataflow workers must not use public IP addresses. Overrides the default *dataflow/disable_public_ips* property value for this command invocation.
        enable-streaming-engine: Enabling Streaming Engine for the streaming job. Overrides the default *dataflow/enable_streaming_engine* property value for this command invocation.
        flexrs-goal: 'FlexRS goal for the flex template job. _FLEXRS_GOAL_ must be one of: *COST_OPTIMIZED*, *SPEED_OPTIMIZED*.'
        launcher-machine-type: The machine type to use for launching the job. The default isn1-standard-1.
        max-workers: Maximum number of workers to run.
        network: Compute Engine network for launching instances to run your pipeline.
        no-disable-public-ips: Cloud Dataflow workers must not use public IP addresses.
        no-enable-streaming-engine: Enabling Streaming Engine for the streaming job.
        no-update: Set this to true for streaming update jobs.
        num-workers: Initial number of workers to use.
        parameters: Parameters to pass to the job.
        region: Region ID of the job's regional endpoint. Defaults to 'us-central1'.
        service-account-email: Service account to run the workers as.
        staging-location: Default Google Cloud Storage location to stage local files.(Must be a URL beginning with 'gs://'.)
        subnetwork: Compute Engine subnetwork for launching instances to run your pipeline.
        temp-location: Default Google Cloud Storage location to stage temporary files. If not set, defaults to the value for --staging-location.(Must be a URL beginning with 'gs://'.)
        template-file-gcs-location: Google Cloud Storage location of the flex template to run. (Must be a URL beginning with 'gs://'.)
        transform-name-mappings: Transform name mappings for the streaming update job.
        update: Set this to true for streaming update jobs. Use *--update* to enable and *--no-update* to disable.
        worker-machine-type: Type of machine to use for workers. Defaults to server-specified.
        worker-region: Region to run the workers in.
        worker-zone: Zone to run the workers in.
