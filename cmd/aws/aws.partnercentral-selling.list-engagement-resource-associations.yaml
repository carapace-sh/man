name: list-engagement-resource-associations
description: Lists the associations between resources and engagements where the caller is a member and has at least one snapshot in the engagement.
flags:
    --catalog=!: Specifies the catalog in which to search for engagement-resource associations.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --created-by=: Filters the response to include only snapshots of resources owned by the specified AWS account ID.
    --engagement-identifier=: Filters the results to include only associations related to the specified engagement.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: Limits the number of results returned in a single call.
    --next-token=: A token used for pagination of results.
    --page-size=: The size of each page to get in the AWS service call.
    --resource-identifier=: Filters the results to include only associations with the specified resource.
    --resource-type=: Filters the results to include only associations with resources of the specified type.
    --starting-token=: A token to specify where to start paginating.
completion:
    flag:
        resource-type:
            - Opportunity
documentation:
    command: Lists the associations between resources and engagements where the caller is a member and has at least one snapshot in the engagement.
    flag:
        catalog: |-
            Specifies the catalog in which to search for engagement-resource associations. Valid Values: "AWS" or "Sandbox"

            - `AWS` for production environments.
            - `Sandbox` for testing and development purposes.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        created-by: Filters the response to include only snapshots of resources owned by the specified AWS account ID. Use this when you want to find associations related to resources owned by a particular account.
        engagement-identifier: Filters the results to include only associations related to the specified engagement. Use this when you want to find all resources associated with a specific engagement.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: Limits the number of results returned in a single call. Use this to control the number of results returned, especially useful for pagination.
        next-token: A token used for pagination of results. Include this token in subsequent requests to retrieve the next set of results.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        resource-identifier: Filters the results to include only associations with the specified resource. Varies depending on the resource type. Use this when you want to find all engagements associated with a specific resource.
        resource-type: Filters the results to include only associations with resources of the specified type.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
