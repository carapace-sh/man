name: get-game-session-log-url
description: |-
    **This API works with the following fleet types:** EC2

    Retrieves the location of stored game session logs for a specified game session on Amazon GameLift Servers managed fleets.
flags:
    --game-session-id=!: A unique identifier for the game session to get logs for.
documentation:
    command: |-
        **This API works with the following fleet types:** EC2

        Retrieves the location of stored game session logs for a specified game session on Amazon GameLift Servers managed fleets. When a game session is terminated, Amazon GameLift Servers automatically stores the logs in Amazon S3 and retains them for 14 days. Use this URL to download the logs.

        See the [Amazon Web Services Service Limits](https://docs.aws.amazon.com/general/latest/gr/aws_service_limits.html#limits_gamelift) page for maximum log file sizes. Log files that exceed this limit are not saved.

        [All APIs by task](https://docs.aws.amazon.com/gamelift/latest/developerguide/reference-awssdk.html#reference-awssdk-resources-fleets)
    flag:
        game-session-id: A unique identifier for the game session to get logs for.
