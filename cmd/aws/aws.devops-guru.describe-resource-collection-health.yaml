name: describe-resource-collection-health
description: Returns the number of open proactive insights, open reactive insights, and the Mean Time to Recover (MTTR) for all closed insights in resource collections in your account.
flags:
    --next-token=: The pagination token to use to retrieve the next page of results for this operation.
    --resource-collection-type=!: An Amazon Web Services resource collection type.
completion:
    flag:
        resource-collection-type:
            - AWS_CLOUD_FORMATION
            - AWS_SERVICE
            - AWS_TAGS
documentation:
    command: Returns the number of open proactive insights, open reactive insights, and the Mean Time to Recover (MTTR) for all closed insights in resource collections in your account. You specify the type of Amazon Web Services resources collection. The two types of Amazon Web Services resource collections supported are Amazon Web Services CloudFormation stacks and Amazon Web Services resources that contain the same Amazon Web Services tag. DevOps Guru can be configured to analyze the Amazon Web Services resources that are defined in the stacks or that are tagged using the same tag *key*. You can specify up to 500 Amazon Web Services CloudFormation stacks.
    flag:
        next-token: The pagination token to use to retrieve the next page of results for this operation. If this value is null, it retrieves the first page.
        resource-collection-type: An Amazon Web Services resource collection type. This type specifies how analyzed Amazon Web Services resources are defined. The two types of Amazon Web Services resource collections supported are Amazon Web Services CloudFormation stacks and Amazon Web Services resources that contain the same Amazon Web Services tag. DevOps Guru can be configured to analyze the Amazon Web Services resources that are defined in the stacks or that are tagged using the same tag *key*. You can specify up to 500 Amazon Web Services CloudFormation stacks.
