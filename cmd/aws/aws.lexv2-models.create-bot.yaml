name: create-bot
description: Creates an Amazon Lex conversational bot.
flags:
    --bot-members=:
        description: The list of bot members in a network to be created.
        nargs: -1
    --bot-name=!: The name of the bot.
    --bot-tags=: A list of tags to add to the bot.
    --bot-type=: The type of a bot to create.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --data-privacy=!: Provides information on additional privacy protections Amazon Lex should use with the bot's data.
    --description=: A description of the bot.
    --error-log-settings=: Specifies the configuration for error logging during bot creation.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --idle-session-ttl-in-seconds=!: The time, in seconds, that Amazon Lex should keep information about a user's conversation with the bot.
    --role-arn=!: The Amazon Resource Name (ARN) of an IAM role that has permission to access the bot.
    --test-bot-alias-tags=: A list of tags to add to the test alias for a bot.
completion:
    flag:
        bot-type:
            - Bot
            - BotNetwork
documentation:
    command: Creates an Amazon Lex conversational bot.
    flag:
        bot-members: The list of bot members in a network to be created.
        bot-name: The name of the bot. The bot name must be unique in the account that creates the bot.
        bot-tags: A list of tags to add to the bot. You can only add tags when you create a bot. You can't use the `UpdateBot` operation to update tags. To update tags, use the `TagResource` operation.
        bot-type: The type of a bot to create.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        data-privacy: Provides information on additional privacy protections Amazon Lex should use with the bot's data.
        description: A description of the bot. It appears in lists to help you identify a particular bot.
        error-log-settings: Specifies the configuration for error logging during bot creation.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        idle-session-ttl-in-seconds: |-
            The time, in seconds, that Amazon Lex should keep information about a user's conversation with the bot.

            A user interaction remains active for the amount of time specified. If no conversation occurs during this time, the session expires and Amazon Lex deletes any data provided before the timeout.

            You can specify between 60 (1 minute) and 86,400 (24 hours) seconds.
        role-arn: The Amazon Resource Name (ARN) of an IAM role that has permission to access the bot.
        test-bot-alias-tags: A list of tags to add to the test alias for a bot. You can only add tags when you create a bot. You can't use the `UpdateAlias` operation to update tags. To update tags on the test alias, use the `TagResource` operation.
