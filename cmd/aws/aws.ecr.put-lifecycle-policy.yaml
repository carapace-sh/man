name: put-lifecycle-policy
description: Creates or updates the lifecycle policy for the specified repository.
flags:
    --lifecycle-policy-text=!: The JSON repository policy text to apply to the repository.
    --registry-id=: The Amazon Web Services account ID associated with the registry that contains the repository.
    --repository-name=!: The name of the repository to receive the policy.
documentation:
    command: Creates or updates the lifecycle policy for the specified repository. For more information, see [Lifecycle policy template](https://docs.aws.amazon.com/AmazonECR/latest/userguide/LifecyclePolicies.html).
    flag:
        lifecycle-policy-text: The JSON repository policy text to apply to the repository.
        registry-id: "The Amazon Web Services account ID associated with the registry that contains the repository. If you do\L not specify a registry, the default registry is assumed."
        repository-name: The name of the repository to receive the policy.
