name: promote-read-replica-dbcluster
description: Promotes a read replica DB cluster to a standalone DB cluster.
flags:
    --dbcluster-identifier=!: The identifier of the DB cluster read replica to promote.
documentation:
    command: Promotes a read replica DB cluster to a standalone DB cluster.
    flag:
        dbcluster-identifier: |-
            The identifier of the DB cluster read replica to promote. This parameter isn't case-sensitive.

            Constraints:

            - Must match the identifier of an existing DB cluster read replica.

            Example: `my-cluster-replica1`
