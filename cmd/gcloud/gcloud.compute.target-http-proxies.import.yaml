name: import
description: Import a target HTTP proxy.
flags:
    --global: If set, the target HTTP proxy is global.
    --no-global&: If set, the target HTTP proxy is global.
    --region=: Region of the target HTTP proxy to import.
    --source=: Path to a YAML file containing configuration export data.
documentation:
    command: |
        Imports a target HTTP proxy's configuration from a file.
    flag:
        global: If set, the target HTTP proxy is global.
        no-global: If set, the target HTTP proxy is global.
        region: |-
            Region of the target HTTP proxy to import. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        source: |-
            Path to a YAML file containing configuration export data.
                      Alternatively, you may omit this flag to read from standard input.For a schema describing the export/import format, see:
                      $CLOUDSDKROOT/lib/googlecloudsdk/schemas/compute/v1/TargetHttpProxy.yaml.
            +

                  Note: $CLOUDSDKROOT represents the Google Cloud CLI's installation directory.
