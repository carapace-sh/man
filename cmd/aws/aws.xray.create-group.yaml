name: create-group
description: Creates a group resource with a name and a filter expression.
flags:
    --filter-expression=: The filter expression defining criteria by which to group traces.
    --group-name=!: The case-sensitive name of the new group.
    --insights-configuration=: The structure containing configurations related to insights.
    --tags=: A map that contains one or more tag keys and tag values to attach to an X-Ray group.
documentation:
    command: Creates a group resource with a name and a filter expression.
    flag:
        filter-expression: The filter expression defining criteria by which to group traces.
        group-name: The case-sensitive name of the new group. Default is a reserved name and names must be unique.
        insights-configuration: |-
            The structure containing configurations related to insights.

            - The InsightsEnabled boolean can be set to true to enable insights for the new group or false to disable insights for the new group.
            - The NotificationsEnabled boolean can be set to true to enable insights notifications for the new group. Notifications may only be enabled on a group with InsightsEnabled set to true.
        tags: |-
            A map that contains one or more tag keys and tag values to attach to an X-Ray group. For more information about ways to use tags, see [Tagging Amazon Web Services resources](https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html) in the *Amazon Web Services General Reference*.

            The following restrictions apply to tags:

            - Maximum number of user-applied tags per resource: 50
            - Maximum tag key length: 128 Unicode characters
            - Maximum tag value length: 256 Unicode characters
            - Valid values for key and value: a-z, A-Z, 0-9, space, and the following characters: _ . : / = + - and @
            - Tag keys and values are case sensitive.
            - Don't use `aws:` as a prefix for keys; it's reserved for Amazon Web Services use.
