name: list-tables
description: List tables in the given table bucket.
flags:
    --continuation-token=: '`ContinuationToken` indicates to Amazon S3 that the list is being continued on this bucket with a token.'
    --max-tables=: The maximum number of tables to return.
    --namespace=: The namespace of the tables.
    --prefix=: The prefix of the tables.
    --table-bucket-arn=!: The Amazon resource Name (ARN) of the table bucket.
documentation:
    command: |-
        List tables in the given table bucket. For more information, see [S3 Tables](https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-tables-tables.html) in the *Amazon Simple Storage Service User Guide*.

        Permissions

        You must have the `s3tables:ListTables` permission to use this operation.
    flag:
        continuation-token: '`ContinuationToken` indicates to Amazon S3 that the list is being continued on this bucket with a token. `ContinuationToken` is obfuscated and is not a real key. You can use this `ContinuationToken` for pagination of the list results.'
        max-tables: The maximum number of tables to return.
        namespace: The namespace of the tables.
        prefix: The prefix of the tables.
        table-bucket-arn: The Amazon resource Name (ARN) of the table bucket.
