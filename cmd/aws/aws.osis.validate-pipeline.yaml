name: validate-pipeline
description: Checks whether an OpenSearch Ingestion pipeline configuration is valid prior to creation.
flags:
    --pipeline-configuration-body=!: The pipeline configuration in YAML format.
documentation:
    command: Checks whether an OpenSearch Ingestion pipeline configuration is valid prior to creation. For more information, see [Creating Amazon OpenSearch Ingestion pipelines](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/creating-pipeline.html).
    flag:
        pipeline-configuration-body: The pipeline configuration in YAML format. The command accepts the pipeline configuration as a string or within a .yaml file. If you provide the configuration as a string, each new line must be escaped with `\n`.
