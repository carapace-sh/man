    - name: create-access-source
      description: Creates an access source for a DNS view.
      flags:
        --cidr=!: The IP address or CIDR range that is allowed to send DNS queries to the Route 53 Global Resolver.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique string that identifies the request and ensures idempotency.
        --dns-view-id=!: The ID of the DNS view to associate with this access source.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --ip-address-type=: The IP address type for this access source.
        --name=: A descriptive name for the access source.
        --protocol=!: The DNS protocol that is permitted for this access source.
        --tags=: Tags to associate with the access source.
      completion:
        flag:
            ip-address-type:
                - IPV4
                - IPV6
            protocol:
                - DO53
                - DOH
                - DOT
      documentation:
        command: |-
            Creates an access source for a DNS view. Access sources define IP addresses or CIDR ranges that are allowed to send DNS queries to the Route 53 Global Resolver, along with the permitted DNS protocols.

            Route 53 Global Resolver is a global service that supports resolvers in multiple Amazon Web Services Regions but you must specify the US East (Ohio) Region to create, update, or otherwise work with Route 53 Global Resolver resources. That is, for example, specify `--region us-east-2` on Amazon Web Services CLI commands.
