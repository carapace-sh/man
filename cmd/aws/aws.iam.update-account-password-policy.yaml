name: update-account-password-policy
description: Updates the password policy settings for the Amazon Web Services account.
flags:
    --allow-users-to-change-password: Allows all IAM users in your account to use the Amazon Web Services Management Console to change their own passwords.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --hard-expiry: Prevents IAM users who are accessing the account via the Amazon Web Services Management Console from setting a new console password after their password has expired.
    --max-password-age=: The number of days that an IAM user password is valid.
    --minimum-password-length=: The minimum number of characters allowed in an IAM user password.
    --no-allow-users-to-change-password: Allows all IAM users in your account to use the Amazon Web Services Management Console to change their own passwords.
    --no-hard-expiry: Prevents IAM users who are accessing the account via the Amazon Web Services Management Console from setting a new console password after their password has expired.
    --no-require-lowercase-characters: Specifies whether IAM user passwords must contain at least one lowercase character from the ISO basic Latin alphabet (a to z).
    --no-require-numbers: Specifies whether IAM user passwords must contain at least one numeric character (0 to 9).
    --no-require-symbols: 'Specifies whether IAM user passwords must contain at least one of the following non-alphanumeric characters:'
    --no-require-uppercase-characters: Specifies whether IAM user passwords must contain at least one uppercase character from the ISO basic Latin alphabet (A to Z).
    --password-reuse-prevention=: Specifies the number of previous passwords that IAM users are prevented from reusing.
    --require-lowercase-characters: Specifies whether IAM user passwords must contain at least one lowercase character from the ISO basic Latin alphabet (a to z).
    --require-numbers: Specifies whether IAM user passwords must contain at least one numeric character (0 to 9).
    --require-symbols: 'Specifies whether IAM user passwords must contain at least one of the following non-alphanumeric characters:'
    --require-uppercase-characters: Specifies whether IAM user passwords must contain at least one uppercase character from the ISO basic Latin alphabet (A to Z).
documentation:
    command: |-
        Updates the password policy settings for the Amazon Web Services account.

        This operation does not support partial updates. No parameters are required, but if you do not specify a parameter, that parameter's value reverts to its default value. See the **Request Parameters** section for each parameter's default value. Also note that some parameters do not allow the default parameter to be explicitly set. Instead, to invoke the default value, do not include that parameter when you invoke the operation.

        For more information about using a password policy, see [Managing an IAM password policy](https://docs.aws.amazon.com/IAM/latest/UserGuide/Using_ManagingPasswordPolicies.html) in the *IAM User Guide*.
    flag:
        allow-users-to-change-password: |-
            Allows all IAM users in your account to use the Amazon Web Services Management Console to change their own passwords. For more information, see [Permitting IAM users to change their own passwords](https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_passwords_enable-user-change.html) in the *IAM User Guide*.

            If you do not specify a value for this parameter, then the operation uses the default value of `false`. The result is that IAM users in the account do not automatically have permissions to change their own password.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        hard-expiry: |-
            Prevents IAM users who are accessing the account via the Amazon Web Services Management Console from setting a new console password after their password has expired. The IAM user cannot access the console until an administrator resets the password.

            If you do not specify a value for this parameter, then the operation uses the default value of `false`. The result is that IAM users can change their passwords after they expire and continue to sign in as the user.

            In the Amazon Web Services Management Console, the custom password policy option **Allow users to change their own password** gives IAM users permissions to `iam:ChangePassword` for only their user and to the `iam:GetAccountPasswordPolicy` action. This option does not attach a permissions policy to each user, rather the permissions are applied at the account-level for all users by IAM. IAM users with `iam:ChangePassword` permission and active access keys can reset their own expired console password using the CLI or API.
        max-password-age: |-
            The number of days that an IAM user password is valid.

            If you do not specify a value for this parameter, then the operation uses the default value of `0`. The result is that IAM user passwords never expire.
        minimum-password-length: |-
            The minimum number of characters allowed in an IAM user password.

            If you do not specify a value for this parameter, then the operation uses the default value of `6`.
        password-reuse-prevention: |-
            Specifies the number of previous passwords that IAM users are prevented from reusing.

            If you do not specify a value for this parameter, then the operation uses the default value of `0`. The result is that IAM users are not prevented from reusing previous passwords.
        require-lowercase-characters: |-
            Specifies whether IAM user passwords must contain at least one lowercase character from the ISO basic Latin alphabet (a to z).

            If you do not specify a value for this parameter, then the operation uses the default value of `false`. The result is that passwords do not require at least one lowercase character.
        require-numbers: |-
            Specifies whether IAM user passwords must contain at least one numeric character (0 to 9).

            If you do not specify a value for this parameter, then the operation uses the default value of `false`. The result is that passwords do not require at least one numeric character.
        require-symbols: |-
            Specifies whether IAM user passwords must contain at least one of the following non-alphanumeric characters:

            ! @ # $ % ^ &amp; * ( ) _ + - = \[ ] { } | '

            If you do not specify a value for this parameter, then the operation uses the default value of `false`. The result is that passwords do not require at least one symbol character.
        require-uppercase-characters: |-
            Specifies whether IAM user passwords must contain at least one uppercase character from the ISO basic Latin alphabet (A to Z).

            If you do not specify a value for this parameter, then the operation uses the default value of `false`. The result is that passwords do not require at least one uppercase character.
