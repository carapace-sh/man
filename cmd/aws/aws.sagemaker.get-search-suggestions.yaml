name: get-search-suggestions
description: An auto-complete API for the search functionality in the SageMaker console.
flags:
    --resource=!: The name of the SageMaker resource to search for.
    --suggestion-query=: Limits the property names that are included in the response.
completion:
    flag:
        resource:
            - TrainingJob
            - Experiment
            - ExperimentTrial
            - ExperimentTrialComponent
            - Endpoint
            - Model
            - ModelPackage
            - ModelPackageGroup
            - Pipeline
            - PipelineExecution
            - FeatureGroup
            - FeatureMetadata
            - Image
            - ImageVersion
            - Project
            - HyperParameterTuningJob
            - ModelCard
            - PipelineVersion
documentation:
    command: An auto-complete API for the search functionality in the SageMaker console. It returns suggestions of possible matches for the property name to use in `Search` queries. Provides suggestions for `HyperParameters`, `Tags`, and `Metrics`.
    flag:
        resource: The name of the SageMaker resource to search for.
        suggestion-query: Limits the property names that are included in the response.
