name: create-iam-policy-assignment
description: Creates an assignment with one specified IAM policy, identified by its Amazon Resource Name (ARN).
flags:
    --assignment-name=!: The name of the assignment, also called a rule.
    --assignment-status=!: The status of the assignment.
    --aws-account-id=!: The ID of the Amazon Web Services account where you want to assign an IAM policy to Amazon Quick Sight users or groups.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identities=: The Amazon Quick Sight users, groups, or both that you want to assign the policy to.
    --namespace=!: The namespace that contains the assignment.
    --policy-arn=: The ARN for the IAM policy to apply to the Amazon Quick Sight users and groups specified in this assignment.
completion:
    flag:
        assignment-status:
            - ENABLED
            - DRAFT
            - DISABLED
documentation:
    command: Creates an assignment with one specified IAM policy, identified by its Amazon Resource Name (ARN). This policy assignment is attached to the specified groups or users of Amazon Quick Sight. Assignment names are unique per Amazon Web Services account. To avoid overwriting rules in other namespaces, use assignment names that are unique.
    flag:
        assignment-name: The name of the assignment, also called a rule. The name must be unique within the Amazon Web Services account.
        assignment-status: |-
            The status of the assignment. Possible values are as follows:

            - `ENABLED` - Anything specified in this assignment is used when creating the data source.
            - `DISABLED` - This assignment isn't used when creating the data source.
            - `DRAFT` - This assignment is an unfinished draft and isn't used when creating the data source.
        aws-account-id: The ID of the Amazon Web Services account where you want to assign an IAM policy to Amazon Quick Sight users or groups.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        identities: The Amazon Quick Sight users, groups, or both that you want to assign the policy to.
        namespace: The namespace that contains the assignment.
        policy-arn: The ARN for the IAM policy to apply to the Amazon Quick Sight users and groups specified in this assignment.
