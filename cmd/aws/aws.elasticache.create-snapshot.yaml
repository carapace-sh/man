name: create-snapshot
description: Creates a copy of an entire cluster or replication group at a specific moment in time.
flags:
    --cache-cluster-id=: The identifier of an existing cluster.
    --kms-key-id=: The ID of the KMS key used to encrypt the snapshot.
    --replication-group-id=: The identifier of an existing replication group.
    --snapshot-name=!: A name for the snapshot being created.
    --tags=: A list of tags to be added to this resource.
documentation:
    command: |-
        Creates a copy of an entire cluster or replication group at a specific moment in time.

        This operation is valid for Valkey or Redis OSS only.
    flag:
        cache-cluster-id: The identifier of an existing cluster. The snapshot is created from this cluster.
        kms-key-id: The ID of the KMS key used to encrypt the snapshot.
        replication-group-id: The identifier of an existing replication group. The snapshot is created from this replication group.
        snapshot-name: A name for the snapshot being created.
        tags: A list of tags to be added to this resource. A tag is a key-value pair. A tag key must be accompanied by a tag value, although null is accepted.
