name: rm
description: Delete objects and buckets.
flags:
    --additional-headers=: Includes arbitrary headers in storage API calls.
    --all-versions: Delete all [versions](https://cloud.google.com/storage/docs/object-versioning) of an object.
    --continue-on-error: If any operations are unsuccessful, the command will exit with a non-zero exit status after completing the remaining operations.
    --exclude-managed-folders: Excludes managed folders from command operations.
    --if-generation-match=: Execute only if the generation matches the generation of the requested object.
    --if-metageneration-match=: Execute only if the metageneration matches the metageneration of the requested object.
    --no-all-versions&: Delete all [versions](https://cloud.google.com/storage/docs/object-versioning) of an object.
    --no-exclude-managed-folders&: Excludes managed folders from command operations.
    --no-read-paths-from-stdin&: Read the list of URLs from stdin.
    --no-recursive&: Recursively delete the contents of buckets or directories that match the path expression.
    --read-paths-from-stdin: Read the list of URLs from stdin.
    --recursive: Recursively delete the contents of buckets or directories that match the path expression.
documentation:
    command: |
        Delete objects and buckets.
    flag:
        additional-headers: Includes arbitrary headers in storage API calls. Accepts a comma separated list of key=value pairs, e.g. `header1=value1,header2=value2`. Overrides the default *storage/additional_headers* property value for this command invocation.
        all-versions: Delete all [versions](https://cloud.google.com/storage/docs/object-versioning) of an object.
        continue-on-error: If any operations are unsuccessful, the command will exit with a non-zero exit status after completing the remaining operations. This flag takes effect only in sequential execution mode (i.e. processor and thread count are set to 1). Parallelism is default.
        exclude-managed-folders: Excludes managed folders from command operations. By default gcloud storage includes managed folders in recursive removals. Please note that this flag would not be applicable for hierarchical namespace buckets as we always list managed folders for these buckets.
        if-generation-match: Execute only if the generation matches the generation of the requested object.
        if-metageneration-match: Execute only if the metageneration matches the metageneration of the requested object.
        no-all-versions: Delete all [versions](https://cloud.google.com/storage/docs/object-versioning) of an object.
        no-exclude-managed-folders: Excludes managed folders from command operations. By default gcloud storage includes managed folders in recursive removals. Please note that this flag would not be applicable for hierarchical namespace buckets as we always list managed folders for these buckets.
        no-read-paths-from-stdin: Read the list of URLs from stdin.
        no-recursive: Recursively delete the contents of buckets or directories that match the path expression. By default, this will delete managed folders as well. If the path is set to a bucket, like ``gs://bucket'', the bucket is also deleted. This option implies the `--all-versions` option. If you want to delete only live object versions, use the ``**'' wildcard instead.
        read-paths-from-stdin: Read the list of URLs from stdin.
        recursive: Recursively delete the contents of buckets or directories that match the path expression. By default, this will delete managed folders as well. If the path is set to a bucket, like ``gs://bucket'', the bucket is also deleted. This option implies the `--all-versions` option. If you want to delete only live object versions, use the ``**'' wildcard instead.
