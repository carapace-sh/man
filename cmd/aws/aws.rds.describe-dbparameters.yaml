name: describe-dbparameters
description: Returns the detailed parameter list for a particular DB parameter group.
flags:
    --dbparameter-group-name=!: The name of a specific DB parameter group to return details for.
    --filters=: A filter that specifies one or more DB parameters to describe.
    --marker=: An optional pagination token provided by a previous `DescribeDBParameters` request.
    --max-records=: The maximum number of records to include in the response.
    --source=: The parameter types to return.
documentation:
    command: Returns the detailed parameter list for a particular DB parameter group.
    flag:
        dbparameter-group-name: |-
            The name of a specific DB parameter group to return details for.

            Constraints:

            - If supplied, must match the name of an existing DBParameterGroup.
        filters: |-
            A filter that specifies one or more DB parameters to describe.

            The only supported filter is `parameter-name`. The results list only includes information about the DB parameters with these names.
        marker: An optional pagination token provided by a previous `DescribeDBParameters` request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that you can retrieve the remaining results.

            Default: 100

            Constraints: Minimum 20, maximum 100.
        source: |-
            The parameter types to return.

            Default: All parameter types returned

            Valid Values: `user | system | engine-default`
