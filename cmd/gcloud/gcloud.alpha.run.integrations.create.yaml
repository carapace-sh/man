name: create
description: '*(ALPHA)*  *(REMOVED)*  Create a Cloud Run Integration.'
hidden: true
flags:
    --name=: Name of the integration.
    --parameters=: Comma-separated list of parameter names and values.
    --region=: Region in which the resource can be found.
    --service-account=: Name of the service account to use when deploying the integration.
    --service=: Name of the Cloud Run service to attach to the integration.
    --type=!: Type of the integration.
documentation:
    command: |4+
        *(ALPHA)*  *(REMOVED)*  Cloud Run integrations are no longer supported.

        *(ALPHA)*  *(REMOVED)*  Create a Cloud Run Integration.

        Cloud Run integrations are no longer supported.


    flag:
        name: Name of the integration.
        parameters: Comma-separated list of parameter names and values. Names must be one of the parameters shown when describing the integration type. Only simple values can be specified with this flag.
        region: Region in which the resource can be found. Alternatively, set the property [run/region].
        service: Name of the Cloud Run service to attach to the integration. It is required for some integrations.
        service-account: Name of the service account to use when deploying the integration.
        type: Type of the integration. To see available types and usage, use "gcloud run integrations types list" command.
