name: reschedule-maintenance
description: '*(BETA)*  Reschedule a Cloud SQL instance''s maintenance.'
flags:
    --reschedule-type=!: The type of reschedule operation to perform.
    --schedule-time=: When specifying SPECIFIC_TIME, the date and time at which to schedule the maintenance in ISO 8601 format.
completion:
    flag:
        reschedule-type:
            - IMMEDIATE
            - NEXT_AVAILABLE_WINDOW
            - SPECIFIC_TIME
documentation:
    command: |
        *(BETA)*  gcloud beta sql reschedule-maintenance reschedules a Cloud SQL instance's maintenance.
    flag:
        reschedule-type: 'The type of reschedule operation to perform. _RESCHEDULE_TYPE_ must be one of: *IMMEDIATE*, *NEXT_AVAILABLE_WINDOW*, *SPECIFIC_TIME*.'
        schedule-time: When specifying SPECIFIC_TIME, the date and time at which to schedule the maintenance in ISO 8601 format.
