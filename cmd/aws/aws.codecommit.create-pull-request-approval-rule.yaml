name: create-pull-request-approval-rule
description: Creates an approval rule for a pull request.
flags:
    --approval-rule-content=!: The content of the approval rule, including the number of approvals needed and the structure of an approval pool defined for approvals, if any.
    --approval-rule-name=!: The name for the approval rule.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --pull-request-id=!: The system-generated ID of the pull request for which you want to create the approval rule.
documentation:
    command: Creates an approval rule for a pull request.
    flag:
        approval-rule-content: "The content of the approval rule, including the number of approvals needed and the structure of an approval pool defined for approvals, if any. For more information about approval pools, see the CodeCommit User Guide.\n\nWhen you create the content of the approval rule, you can specify approvers in an approval pool in one of two ways:\n\n- **CodeCommitApprovers**: This option only requires an Amazon Web Services account and a resource. It can be used for both IAM users and federated access users whose name matches the provided resource name. This is a very powerful option that offers a great deal of flexibility. For example, if you specify the Amazon Web Services account *123456789012* and *Mary\\_Major*, all of the following would be counted as approvals coming from that user:\n  \n  - An IAM user in the account (arn:aws:iam::*123456789012*:user/*Mary\\_Major*)\n  - A federated user identified in IAM as Mary\\_Major (arn:aws:sts::*123456789012*:federated-user/*Mary\\_Major*)\n  \n  This option does not recognize an active session of someone assuming the role of CodeCommitReview with a role session name of *Mary\\_Major* (arn:aws:sts::*123456789012*:assumed-role/CodeCommitReview/*Mary\\_Major*) unless you include a wildcard (\\*Mary\\_Major).\n- **Fully qualified ARN**: This option allows you to specify the fully qualified Amazon Resource Name (ARN) of the IAM user or role.\n\nFor more information about IAM ARNs, wildcards, and formats, see [IAM Identifiers](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html) in the *IAM User Guide*."
        approval-rule-name: The name for the approval rule.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        pull-request-id: The system-generated ID of the pull request for which you want to create the approval rule.
