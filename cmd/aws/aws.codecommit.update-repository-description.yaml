name: update-repository-description
description: Sets or changes the comment or description for a repository.
flags:
    --repository-description=: The new comment or description for the specified repository.
    --repository-name=!: The name of the repository to set or change the comment or description for.
documentation:
    command: |-
        Sets or changes the comment or description for a repository.

        The description field for a repository accepts all HTML characters and all valid Unicode characters. Applications that do not HTML-encode the description and display it in a webpage can expose users to potentially malicious code. Make sure that you HTML-encode the description field in any application that uses this API to display the repository description on a webpage.
    flag:
        repository-description: The new comment or description for the specified repository. Repository descriptions are limited to 1,000 characters.
        repository-name: The name of the repository to set or change the comment or description for.
