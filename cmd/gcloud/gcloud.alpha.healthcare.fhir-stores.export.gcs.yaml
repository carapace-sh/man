name: gcs
description: '*(ALPHA)*  Export Cloud Healthcare API FHIR resources to Google Cloud Storage.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --dataset=: Cloud Healthcare dataset.
    --gcs-uri=!: The Cloud Storage destination location.
    --location=: Google Cloud location.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --resource-type=: String of comma-delimited FHIR resource types.
    --since=: If provided, only resources updated after this time are exported.
documentation:
    command: '*(ALPHA)*  Export Cloud Healthcare API FHIR resources to Google Cloud Storage.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        dataset: |-
            Cloud Healthcare dataset.
            +
            To set the `dataset` attribute:
            * provide the argument `fhir_store` on the command line with a fully specified name;
            * provide the argument `--dataset` on the command line.
        gcs-uri: |-
            The Cloud Storage destination location. Specify a path to a Cloud
            Storage bucket or folder rather than a concrete object. The exported outputs
            are organized by FHIR resource types. The server will create one object per
            resource type. Each object contains newline delimited JSON, and each line
            is a FHIR resource.
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `fhir_store` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `healthcare/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        resource-type: |-
            String of comma-delimited FHIR resource types. If provided, only resources of the specified
            resource type(s) are exported.
        since: |-
            If provided, only resources updated after this time are exported. The time uses the format
            YYYY-MM-DDThh:mm:ss.sss+zz:zz. For example, 2015-02-07T13:28:17.239+02:00 or 2017-01-01T00:00:00Z.
            The time must be specified to the second and include a time zone.
