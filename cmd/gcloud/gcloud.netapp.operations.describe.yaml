name: describe
description: Describe a Cloud NetApp Files operation.
flags:
    --location=: The location of the operation.
documentation:
    command: Describe a Cloud NetApp Files operation.
    flag:
        location: |-
            The location of the operation.
            +
            To set the `location` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
