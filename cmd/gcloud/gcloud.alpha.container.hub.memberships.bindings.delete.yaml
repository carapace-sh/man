name: delete
description: '*(ALPHA)*  Delete a Membership Binding.'
flags:
    --location=: Location for the binding.
    --membership=: Name of the binding.
documentation:
    command: |-
        *(ALPHA)*  This command can fail for the following reasons:
        * The Membership specified does not exist.
        * The Membership Binding specified does not exist.
        * The caller does not have permission to access the given Membership.
        * The caller did not specify the location (--location) if referring to
        location other than global.

        ## EXAMPLES

        To delete Membership Binding `BINDING_NAME` in global Membership
        `MEMBERSHIP_NAME` for a global membership:

          $ gcloud alpha container hub memberships bindings delete BINDING_NAME --membership=MEMBERSHIP_NAME

        To delete a Binding `BINDING_NAME` associated with regional membership
        `MEMBERSHIP_NAME`, provide the location LOCATION_NAME for the Membership where
        the Binding belongs along with the membership name.

        $ gcloud alpha container hub memberships bindings delete BINDING_NAME --membership=MEMBERSHIP_NAME --location=LOCATION_NAME
    flag:
        location: |-
            Location for the binding.
            +
            To set the `location` attribute:
            * provide the argument `BINDING` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkehub/location`.
        membership: |-
            Name of the binding.
            +
            To set the `membership` attribute:
            * provide the argument `BINDING` on the command line with a fully specified name;
            * provide the argument `--membership` on the command line.
