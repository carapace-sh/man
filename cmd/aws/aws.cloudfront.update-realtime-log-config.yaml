name: update-realtime-log-config
description: Updates a real-time log configuration.
flags:
    --arn=: The Amazon Resource Name (ARN) for this real-time log configuration.
    --end-points=: Contains information about the Amazon Kinesis data stream where you are sending real-time log data.
    --fields=: A list of fields to include in each real-time log record.
    --name=: The name for this real-time log configuration.
    --sampling-rate=: The sampling rate for this real-time log configuration.
documentation:
    command: |-
        Updates a real-time log configuration.

        When you update a real-time log configuration, all the parameters are updated with the values provided in the request. You cannot update some parameters independent of others. To update a real-time log configuration:

        1. Call `GetRealtimeLogConfig` to get the current real-time log configuration.
        2. Locally modify the parameters in the real-time log configuration that you want to update.
        3. Call this API (`UpdateRealtimeLogConfig`) by providing the entire real-time log configuration, including the parameters that you modified and those that you didn't.

        You cannot update a real-time log configuration's `Name` or `ARN`.
    flag:
        arn: The Amazon Resource Name (ARN) for this real-time log configuration.
        end-points: Contains information about the Amazon Kinesis data stream where you are sending real-time log data.
        fields: |-
            A list of fields to include in each real-time log record.

            For more information about fields, see [Real-time log configuration fields](https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/real-time-logs.html#understand-real-time-log-config-fields) in the *Amazon CloudFront Developer Guide*.
        name: The name for this real-time log configuration.
        sampling-rate: The sampling rate for this real-time log configuration. The sampling rate determines the percentage of viewer requests that are represented in the real-time log data. You must provide an integer between 1 and 100, inclusive.
