name: list-service-actions-for-provisioning-artifact
description: Returns a paginated list of self-service actions associated with the specified Product ID and Provisioning Artifact ID.
flags:
    --accept-language=: The language code.
    --page-size=: The maximum number of items to return with this call.
    --page-token=: The page token for the next set of results.
    --product-id=!: The product identifier.
    --provisioning-artifact-id=!: The identifier of the provisioning artifact.
documentation:
    command: Returns a paginated list of self-service actions associated with the specified Product ID and Provisioning Artifact ID.
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        page-size: The maximum number of items to return with this call.
        page-token: The page token for the next set of results. To retrieve the first set of results, use null.
        product-id: The product identifier. For example, `prod-abcdzk7xy33qa`.
        provisioning-artifact-id: The identifier of the provisioning artifact. For example, `pa-4abcdjnxjj6ne`.
