name: delete-resource-config
description: Records the configuration state for a custom resource that has been deleted.
flags:
    --resource-id=!: Unique identifier of the resource.
    --resource-type=!: The type of the resource.
documentation:
    command: Records the configuration state for a custom resource that has been deleted. This API records a new ConfigurationItem with a ResourceDeleted status. You can retrieve the ConfigurationItems recorded for this resource in your Config History.
    flag:
        resource-id: Unique identifier of the resource.
        resource-type: The type of the resource.
