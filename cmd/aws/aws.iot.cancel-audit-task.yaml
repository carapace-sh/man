name: cancel-audit-task
description: Cancels an audit that is in progress.
flags:
    --task-id=!: The ID of the audit you want to cancel.
documentation:
    command: |-
        Cancels an audit that is in progress. The audit can be either scheduled or on demand. If the audit isn't in progress, an "InvalidRequestException" occurs.

        Requires permission to access the [CancelAuditTask](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        task-id: The ID of the audit you want to cancel. You can only cancel an audit that is "IN\_PROGRESS".
