name: list-topics-detection-jobs
description: Gets a list of the topic detection jobs that you have submitted.
flags:
    --filter=: Filters the jobs that are returned.
    --max-results=: The maximum number of results to return in each page.
    --next-token=: Identifies the next page of results to return.
documentation:
    command: Gets a list of the topic detection jobs that you have submitted.
    flag:
        filter: Filters the jobs that are returned. Jobs can be filtered on their name, status, or the date and time that they were submitted. You can set only one filter at a time.
        max-results: The maximum number of results to return in each page. The default is 100.
        next-token: Identifies the next page of results to return.
