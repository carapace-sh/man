name: list-descendant
description: '*(ALPHA)*  List the details of the resident and descendant Security Health Analytics custom modules.'
flags:
    --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
    --folder=: Folder associated with the custom module.
    --limit=: Maximum number of resources to list.
    --organization=: Organization associated with the custom module.
    --page-size=: Some services group resource list output into pages.
    --parent=: Parent associated with the custom module.
    --sort-by=: Comma-separated list of resource field key names to sort by.
documentation:
    command: |-
        *(ALPHA)*  List the details of the resident and descendant Security Health Analytics
        custom modules for a specified organization or folder. For a project, this
        command lists only the custom modules that are created in the project.
        Modules created in a parent organization or folder are excluded from the
        list. To list the resident custom modules and the modules that are
        inherited from a parent organization and folder, use gcloud scc manage
        custom-modules sha list.

        ## EXAMPLES

        To list resident and inherited Security Health Analytics custom modules for
        organization `123`, run:

        $ gcloud alpha scc manage custom-modules sha list-descendant --organization=organizations/123

        To list resident and inherited Security Health Analytics custom modules for
        folder `456`, run:

        $ gcloud alpha scc manage custom-modules sha list-descendant --folder=folders/456

        To list resident and inherited Security Health Analytics custom modules for
        project `789`, run:

        $ gcloud alpha scc manage custom-modules sha list-descendant --project=projects/789
    flag:
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        folder: Folder associated with the custom module.
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        organization: Organization associated with the custom module.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is determined by the
            service if it supports paging, otherwise it is *unlimited* (no paging).
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        parent: |-
            Parent associated with the custom module. Can be one of
                          organizations/<id>, projects/<id or name>, folders/<id>
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
