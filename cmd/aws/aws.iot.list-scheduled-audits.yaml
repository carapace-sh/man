name: list-scheduled-audits
description: Lists all of your scheduled audits.
flags:
    --max-results=: The maximum number of results to return at one time.
    --next-token=: The token for the next set of results.
documentation:
    command: |-
        Lists all of your scheduled audits.

        Requires permission to access the [ListScheduledAudits](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        max-results: The maximum number of results to return at one time. The default is 25.
        next-token: The token for the next set of results.
