name: create-route
description: Creates a route in a route table within a VPC.
flags:
    --carrier-gateway-id=: The ID of the carrier gateway.
    --core-network-arn=: The Amazon Resource Name (ARN) of the core network.
    --destination-cidr-block=: The IPv4 CIDR address block used for the destination match.
    --destination-ipv6-cidr-block=: The IPv6 CIDR block used for the destination match.
    --destination-prefix-list-id=: The ID of a prefix list used for the destination match.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --egress-only-internet-gateway-id=: \[IPv6 traffic only] The ID of an egress-only internet gateway.
    --gateway-id=: The ID of an internet gateway or virtual private gateway attached to your VPC.
    --instance-id=: The ID of a NAT instance in your VPC.
    --local-gateway-id=: The ID of the local gateway.
    --nat-gateway-id=: \[IPv4 traffic only] The ID of a NAT gateway.
    --network-interface-id=: The ID of a network interface.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --odb-network-arn=: The Amazon Resource Name (ARN) of the ODB network.
    --route-table-id=!: The ID of the route table for the route.
    --transit-gateway-id=: The ID of a transit gateway.
    --vpc-endpoint-id=: The ID of a VPC endpoint.
    --vpc-peering-connection-id=: The ID of a VPC peering connection.
documentation:
    command: |-
        Creates a route in a route table within a VPC.

        You must specify either a destination CIDR block or a prefix list ID. You must also specify exactly one of the resources from the parameter list.

        When determining how to route traffic, we use the route with the most specific match. For example, traffic is destined for the IPv4 address `192.0.2.3`, and the route table includes the following two IPv4 routes:

        - `192.0.2.0/24` (goes to some target A)
        - `192.0.2.0/28` (goes to some target B)

        Both routes apply to the traffic destined for `192.0.2.3`. However, the second route in the list covers a smaller number of IP addresses and is therefore more specific, so we use that route to determine where to target the traffic.

        For more information about route tables, see [Route tables](https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Route_Tables.html) in the *Amazon VPC User Guide*.
    flag:
        carrier-gateway-id: |-
            The ID of the carrier gateway.

            You can only use this option when the VPC contains a subnet which is associated with a Wavelength Zone.
        core-network-arn: The Amazon Resource Name (ARN) of the core network.
        destination-cidr-block: The IPv4 CIDR address block used for the destination match. Routing decisions are based on the most specific match. We modify the specified CIDR block to its canonical form; for example, if you specify `100.68.0.18/18`, we modify it to `100.68.0.0/18`.
        destination-ipv6-cidr-block: The IPv6 CIDR block used for the destination match. Routing decisions are based on the most specific match.
        destination-prefix-list-id: The ID of a prefix list used for the destination match.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        egress-only-internet-gateway-id: \[IPv6 traffic only] The ID of an egress-only internet gateway.
        gateway-id: The ID of an internet gateway or virtual private gateway attached to your VPC.
        instance-id: The ID of a NAT instance in your VPC. The operation fails if you specify an instance ID unless exactly one network interface is attached.
        local-gateway-id: The ID of the local gateway.
        nat-gateway-id: \[IPv4 traffic only] The ID of a NAT gateway.
        network-interface-id: The ID of a network interface.
        odb-network-arn: The Amazon Resource Name (ARN) of the ODB network.
        route-table-id: The ID of the route table for the route.
        transit-gateway-id: The ID of a transit gateway.
        vpc-endpoint-id: The ID of a VPC endpoint. Supported for Gateway Load Balancer endpoints only.
        vpc-peering-connection-id: The ID of a VPC peering connection.
