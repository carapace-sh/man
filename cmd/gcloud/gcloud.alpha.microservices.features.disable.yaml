name: disable
description: '*(ALPHA)*  Disable a microservices feature.'
hidden: true
documentation:
    command: |-
        *(ALPHA)*  This command can fail for the following reasons:
        * The feature specified does not exist.
        * The active account does not have permission to disable the feature.

        ## EXAMPLES

        The following command disables the `observability` feature:

          $ gcloud alpha microservices features disable observability
