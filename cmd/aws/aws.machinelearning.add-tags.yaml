name: add-tags
description: Adds one or more tags to an object, up to a limit of 10. Each tag consists of a key and an optional value.
flags:
    --resource-id=!: The ID of the ML object to tag.
    --resource-type=!: The type of the ML object to tag.
    --tags=!: The key-value pairs to use to create tags.
completion:
    flag:
        resource-type:
            - BatchPrediction
            - DataSource
            - Evaluation
            - MLModel
documentation:
    command: Adds one or more tags to an object, up to a limit of 10. Each tag consists of a key and an optional value. If you add a tag using a key that is already associated with the ML object, `AddTags` updates the tag's value.
    flag:
        resource-id: The ID of the ML object to tag. For example, `exampleModelId`.
        resource-type: The type of the ML object to tag.
        tags: The key-value pairs to use to create tags. If you specify a key without specifying a value, Amazon ML creates a tag with the specified key and a value of null.
