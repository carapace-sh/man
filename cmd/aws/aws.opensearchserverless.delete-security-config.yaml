name: delete-security-config
description: Deletes a security configuration for OpenSearch Serverless.
flags:
    --client-token=: Unique, case-sensitive identifier to ensure idempotency of the request.
    --id=!: The security configuration identifier.
documentation:
    command: Deletes a security configuration for OpenSearch Serverless. For more information, see [SAML authentication for Amazon OpenSearch Serverless](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-saml.html).
    flag:
        client-token: Unique, case-sensitive identifier to ensure idempotency of the request.
        id: The security configuration identifier. For SAML the ID will be `saml/<accountId>/<idpProviderName>`. For example, `saml/123456789123/OKTADev`.
