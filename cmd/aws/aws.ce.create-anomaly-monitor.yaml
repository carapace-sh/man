name: create-anomaly-monitor
description: Creates a new cost anomaly detection monitor with the requested type and monitor specification.
flags:
    --anomaly-monitor=!: The cost anomaly detection monitor object that you want to create.
    --resource-tags=: An optional list of tags to associate with the specified [`AnomalyMonitor`](https://docs.aws.amazon.com/aws-cost-management/latest/APIReference/API_AnomalyMonitor.html) .
documentation:
    command: Creates a new cost anomaly detection monitor with the requested type and monitor specification.
    flag:
        anomaly-monitor: The cost anomaly detection monitor object that you want to create.
        resource-tags: |-
            An optional list of tags to associate with the specified [`AnomalyMonitor`](https://docs.aws.amazon.com/aws-cost-management/latest/APIReference/API_AnomalyMonitor.html) . You can use resource tags to control access to your `monitor` using IAM policies.

            Each tag consists of a key and a value, and each key must be unique for the resource. The following restrictions apply to resource tags:

            - Although the maximum number of array members is 200, you can assign a maximum of 50 user-tags to one resource. The remaining are reserved for Amazon Web Services use
            - The maximum length of a key is 128 characters
            - The maximum length of a value is 256 characters
            - Keys and values can only contain alphanumeric characters, spaces, and any of the following: `_.:/=+@-`
            - Keys and values are case sensitive
            - Keys and values are trimmed for any leading or trailing whitespaces
            - Don’t use `aws:` as a prefix for your keys. This prefix is reserved for Amazon Web Services use
