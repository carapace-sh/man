name: remove
description: '*(BETA)*  Remove an SSH public key from an OS Login profile.'
flags:
    --key-file=: The path to a file containing an SSH public key to remove from the
    --key=: The SSH public key to remove from the OS Login Profile.
documentation:
    command: |
        *(BETA)*  *gcloud beta compute os-login ssh-keys remove* accepts either a string containing an SSH public
        key or a filename for an SSH public key and removes that key from the
        user's OS Login profile. The key value used can either be the
        full SSH key or the OS Login fingerprint for that key.
    flag:
        key: The SSH public key to remove from the OS Login Profile. Key value can either be the SSH key or the OS Login fingerprint of the key.
        key-file: |-
            The path to a file containing an SSH public key to remove from the
            OS Login Profile. Key value can either be the SSH key or the OS Login fingerprint of the key.
