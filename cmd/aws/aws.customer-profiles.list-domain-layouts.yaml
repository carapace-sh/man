name: list-domain-layouts
description: Lists the existing layouts that can be used to view data for a specific domain.
flags:
    --domain-name=!: The unique name of the domain.
    --max-results=: The maximum number of objects returned per page.
    --next-token=: Identifies the next page of results to return.
documentation:
    command: Lists the existing layouts that can be used to view data for a specific domain. This API can only be invoked from the Amazon Connect admin website.
    flag:
        domain-name: The unique name of the domain.
        max-results: The maximum number of objects returned per page.
        next-token: Identifies the next page of results to return.
