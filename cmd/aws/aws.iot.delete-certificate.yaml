name: delete-certificate
description: Deletes the specified certificate.
flags:
    --certificate-id=!: The ID of the certificate.
    --force-delete=: Forces the deletion of a certificate if it is inactive and is not attached to an IoT thing.
documentation:
    command: |-
        Deletes the specified certificate.

        A certificate cannot be deleted if it has a policy or IoT thing attached to it or if its status is set to ACTIVE. To delete a certificate, first use the [DetachPolicy]() action to detach all policies. Next, use the [UpdateCertificate]() action to set the certificate to the INACTIVE status.

        Requires permission to access the [DeleteCertificate](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        certificate-id: The ID of the certificate. (The last part of the certificate ARN contains the certificate ID.)
        force-delete: Forces the deletion of a certificate if it is inactive and is not attached to an IoT thing.
