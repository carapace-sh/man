name: update
description: '*(BETA)*  Update the EkmConfig.'
flags:
    --default-ekm-connection=: The resource name of the EkmConnection to be used as the default EkmConnection for all `external-vpc` CryptoKeys in a project and location.
    --location=!: ID of the location or fully qualified identifier for the location.
documentation:
    command: |-
        *(BETA)*  gcloud beta kms ekm-config update can be used to update the EkmConfig. Applies to all CryptoKeys and
        CryptoKeyVersions with a `protection level` of `external vpc`.

        ## EXAMPLES

        The following command sets the default ekm-connection to `laplace` for its
        project `foo` and location `us-east1`:

          $ gcloud beta kms ekm-config update --location=us-east1
          --default-ekm-connection="projects/foo/locations/us-east1/ekmConnections/laplace"

        The following command removes the default-ekm-connection in `us-east1` for the
        current project:

        $ gcloud beta kms ekm-config update --location=us-east1 --default-ekm-connection=""
    flag:
        default-ekm-connection: The resource name of the EkmConnection to be used as the default EkmConnection for all `external-vpc` CryptoKeys in a project and location. Can be an empty string to remove the default EkmConnection.
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line.
