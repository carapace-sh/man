name: list-tags-for-resource
description: Returns a list of tags for the resource identified by a specified Amazon Resource Name (ARN).
flags:
    --next-token=: An identifier returned from the previous `ListTagsForResource` call.
    --resource-arn=!: The ARN of a CodeDeploy resource.
documentation:
    command: Returns a list of tags for the resource identified by a specified Amazon Resource Name (ARN). Tags are used to organize and categorize your CodeDeploy resources.
    flag:
        next-token: An identifier returned from the previous `ListTagsForResource` call. It can be used to return the next set of applications in the list.
        resource-arn: The ARN of a CodeDeploy resource. `ListTagsForResource` returns all the tags associated with the resource that is identified by the `ResourceArn`.
