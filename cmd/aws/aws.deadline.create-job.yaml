name: create-job
description: Creates a job.
flags:
    --attachments=: The attachments for the job.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: The unique token which the server uses to recognize retries of the same request.
    --farm-id=!: The farm ID of the farm to connect to the job.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-failed-tasks-count=: The number of task failures before the job stops running and is marked as `FAILED`.
    --max-retries-per-task=: The maximum number of retries for each task.
    --max-worker-count=: The maximum number of worker hosts that can concurrently process a job.
    --parameters=: The parameters for the job.
    --priority=!: The priority of the job.
    --queue-id=!: The ID of the queue that the job is submitted to.
    --source-job-id=: The job ID for the source job.
    --storage-profile-id=: The storage profile ID for the storage profile to connect to the job.
    --target-task-run-status=: The initial job status when it is created.
    --template-type=: The file type for the job template.
    --template=: The job template to use for this job.
completion:
    flag:
        target-task-run-status:
            - READY
            - SUSPENDED
        template-type:
            - JSON
            - YAML
documentation:
    command: Creates a job. A job is a set of instructions that Deadline Cloud uses to schedule and run work on available workers. For more information, see [Deadline Cloud jobs](https://docs.aws.amazon.com/deadline-cloud/latest/userguide/deadline-cloud-jobs.html).
    flag:
        attachments: The attachments for the job. Attach files required for the job to run to a render job.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: The unique token which the server uses to recognize retries of the same request.
        farm-id: The farm ID of the farm to connect to the job.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-failed-tasks-count: The number of task failures before the job stops running and is marked as `FAILED`.
        max-retries-per-task: The maximum number of retries for each task.
        max-worker-count: |-
            The maximum number of worker hosts that can concurrently process a job. When the `maxWorkerCount` is reached, no more workers will be assigned to process the job, even if the fleets assigned to the job's queue has available workers.

            You can't set the `maxWorkerCount` to 0. If you set it to -1, there is no maximum number of workers.

            If you don't specify the `maxWorkerCount`, Deadline Cloud won't throttle the number of workers used to process the job.
        parameters: The parameters for the job.
        priority: The priority of the job. The highest priority (first scheduled) is 100. When two jobs have the same priority, the oldest job is scheduled first.
        queue-id: The ID of the queue that the job is submitted to.
        source-job-id: The job ID for the source job.
        storage-profile-id: The storage profile ID for the storage profile to connect to the job.
        target-task-run-status: The initial job status when it is created. Jobs that are created with a `SUSPENDED` status will not run until manually requeued.
        template: The job template to use for this job.
        template-type: The file type for the job template.
