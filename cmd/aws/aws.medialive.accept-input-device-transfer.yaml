name: accept-input-device-transfer
description: Accept an incoming input device transfer.
flags:
    --input-device-id=!: The unique ID of the input device to accept.
documentation:
    command: Accept an incoming input device transfer. The ownership of the device will transfer to your AWS account.
    flag:
        input-device-id: The unique ID of the input device to accept. For example, hd-123456789abcdef.
