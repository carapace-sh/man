name: create
description: '*(BETA)*  Create a new BeyondCorp client connector service (Deprecated).'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --config-from-file=: Path to json file containing client connector service configuration.
    --display-name=: An arbitrary user-provided name for the client connector service.
    --egress-peered-vpc=!: The peered VPC owned by the consumer project.
    --ingress-config=!: The basic ingress config for client gateways.
    --location=: The location of the BeyondCorp Enterprise client connector.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: '*(BETA)*  Create a new BeyondCorp client connector service.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        config-from-file: |-
            Path to json file containing client connector service configuration.
            Example - "/file/path/configJson.txt" where configJson.txt contains -
            ```
            {
              "ingress":{
                "config":{
                  "transportProtocol":"TCP",
                  "destinationRoutes":[{
                    "address":"196.0.0.0",
                    "netmask":"255.255.255.0"
                  }]
                }
              },
              "egress":{
                "peeredVpc":{
                  "networkVpc":"projects/consumer-project-id/global/networks/my-vpc-network"
                }
              },
              "displayName":"my-service-resource"
            }
            ```
        display-name: |-
            An arbitrary user-provided name for the client connector service. The display name should follow format -
                * Must be 6 to 30 characters in length.
                * Can only contain lowercase letters, numbers and hyphens.
                * Must start with a letter.
        egress-peered-vpc: |-
            The peered VPC owned by the consumer project.
            Example - {"networkVpc": "projects/consumer-project-id/global/networks/my-vpc-network"}.
        ingress-config: |-
            The basic ingress config for client gateways.
            Example - {"transportProtocol": "TCP","destinationRoutes":[{"address":"196.0.0.1", "netmask":"255.255.255.0"}]}.
        location: |-
            The location of the BeyondCorp Enterprise client connector.
            +

            To set the `location` attribute:
            * provide the argument `client_connector_service` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
