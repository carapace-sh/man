name: describe
description: '*(BETA)*  Display the dry-run mode configuration for a Service Perimeter.'
flags:
    --policy=: The ID of the access policy.
documentation:
    command: |-
        *(BETA)*  The dry-run mode configuration is presented as a diff against the enforcement mode configuration. '+' indicates additions in `spec`,'-' indicates removals from `status` and entries without either of those indicate that they are the same across the dry-run and the enforcement mode configurations. When a particular field is completely empty, it will not be displayed.

        Note: When this command is executed on a Service Perimeter with no explicit dry-run mode configuration, the effective dry-run mode configuration is inherited from the enforcement mode configuration, and thus, the enforcement mode configuration is displayed in such cases.
    flag:
        policy: |-
            The ID of the access policy.
            +
            To set the `policy` attribute:
            * provide the argument `perimeter` on the command line with a fully specified name;
            * provide the argument `--policy` on the command line;
            * set the property `access_context_manager/policy`.
