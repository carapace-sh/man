name: create-bulk-import-job
description: Defines a job to ingest data to IoT SiteWise from Amazon S3.
flags:
    --adaptive-ingestion=: If set to true, ingest new data into IoT SiteWise storage.
    --delete-files-after-import=: If set to true, your data files is deleted from S3, after ingestion into IoT SiteWise storage.
    --error-report-location=!: The Amazon S3 destination where errors associated with the job creation request are saved.
    --files=!: The files in the specified Amazon S3 bucket that contain your data.
    --job-configuration=!: Contains the configuration information of a job, such as the file format used to save data in Amazon S3.
    --job-name=!: The unique name that helps identify the job request.
    --job-role-arn=!: The [ARN](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) of the IAM role that allows IoT SiteWise to read Amazon S3 data.
documentation:
    command: |-
        Defines a job to ingest data to IoT SiteWise from Amazon S3. For more information, see [Create a bulk import job (CLI)](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/CreateBulkImportJob.html) in the *Amazon Simple Storage Service User Guide*.

        Before you create a bulk import job, you must enable IoT SiteWise warm tier or IoT SiteWise cold tier. For more information about how to configure storage settings, see [PutStorageConfiguration](https://docs.aws.amazon.com/iot-sitewise/latest/APIReference/API_PutStorageConfiguration.html).

        Bulk import is designed to store historical data to IoT SiteWise.

        - Newly ingested data in the hot tier triggers notifications and computations.
        - After data moves from the hot tier to the warm or cold tier based on retention settings, it does not trigger computations or notifications.
        - Data older than 7 days does not trigger computations or notifications.
    flag:
        adaptive-ingestion: If set to true, ingest new data into IoT SiteWise storage. Measurements with notifications, metrics and transforms are computed. If set to false, historical data is ingested into IoT SiteWise as is.
        delete-files-after-import: If set to true, your data files is deleted from S3, after ingestion into IoT SiteWise storage.
        error-report-location: The Amazon S3 destination where errors associated with the job creation request are saved.
        files: The files in the specified Amazon S3 bucket that contain your data.
        job-configuration: Contains the configuration information of a job, such as the file format used to save data in Amazon S3.
        job-name: The unique name that helps identify the job request.
        job-role-arn: The [ARN](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) of the IAM role that allows IoT SiteWise to read Amazon S3 data.
