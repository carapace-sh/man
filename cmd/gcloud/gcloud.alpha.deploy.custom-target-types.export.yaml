name: export
description: '*(ALPHA)*  Returns the .yaml definition of the specified custom target type.'
flags:
    --destination=: Path to a YAML file where the configuration will be exported.
    --region=: The Cloud region for the custom_target_type.
documentation:
    command: '*(ALPHA)*  The exported yaml definition can be applied by `deploy apply` command.'
    flag:
        destination: |-
            Path to a YAML file where the configuration will be exported.
                      Alternatively, you may omit this flag to write to standard output.
        region: |-
            The Cloud region for the custom_target_type.  Alternatively, set the property [deploy/region].
            +
            To set the `region` attribute:
            * provide the argument `custom_target_type` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `deploy/region`.
