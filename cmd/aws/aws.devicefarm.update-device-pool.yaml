name: update-device-pool
description: Modifies the name, description, and rules in a device pool given the attributes and the pool ARN.
flags:
    --arn=!: The Amazon Resource Name (ARN) of the Device Farm device pool to update.
    --clear-max-devices: Sets whether the `maxDevices` parameter applies to your device pool.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description of the device pool to update.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-devices=: The number of devices that Device Farm can add to your device pool.
    --name=: A string that represents the name of the device pool to update.
    --no-clear-max-devices: Sets whether the `maxDevices` parameter applies to your device pool.
    --rules=:
        description: Represents the rules to modify for the device pool.
        nargs: -1
documentation:
    command: Modifies the name, description, and rules in a device pool given the attributes and the pool ARN. Rule updates are all-or-nothing, meaning they can only be updated as a whole (or not at all).
    flag:
        arn: The Amazon Resource Name (ARN) of the Device Farm device pool to update.
        clear-max-devices: |-
            Sets whether the `maxDevices` parameter applies to your device pool. If you set this parameter to `true`, the `maxDevices` parameter does not apply, and Device Farm does not limit the number of devices that it adds to your device pool. In this case, Device Farm adds all available devices that meet the criteria specified in the `rules` parameter.

            If you use this parameter in your request, you cannot use the `maxDevices` parameter in the same request.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description of the device pool to update.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-devices: |-
            The number of devices that Device Farm can add to your device pool. Device Farm adds devices that are available and that meet the criteria that you assign for the `rules` parameter. Depending on how many devices meet these constraints, your device pool might contain fewer devices than the value for this parameter.

            By specifying the maximum number of devices, you can control the costs that you incur by running tests.

            If you use this parameter in your request, you cannot use the `clearMaxDevices` parameter in the same request.
        name: A string that represents the name of the device pool to update.
        rules: Represents the rules to modify for the device pool. Updating rules is optional. If you update rules for your request, the update replaces the existing rules.
