name: set-smbguest-password
description: Sets the password for the guest user `smbguest`.
flags:
    --gateway-arn=!: The Amazon Resource Name (ARN) of the S3 File Gateway the SMB file share is associated with.
    --password=!: The password that you want to set for your SMB server.
documentation:
    command: Sets the password for the guest user `smbguest`. The `smbguest` user is the user when the authentication method for the file share is set to `GuestAccess`. This operation only supported for S3 File Gateways
    flag:
        gateway-arn: The Amazon Resource Name (ARN) of the S3 File Gateway the SMB file share is associated with.
        password: The password that you want to set for your SMB server.
