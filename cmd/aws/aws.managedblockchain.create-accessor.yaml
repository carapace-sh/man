name: create-accessor
description: Creates a new accessor for use with Amazon Managed Blockchain service that supports token based access.
flags:
    --accessor-type=!: The type of accessor.
    --client-request-token=!: This is a unique, case-sensitive identifier that you provide to ensure the idempotency of the operation.
    --network-type=: The blockchain network that the `Accessor` token is created for.
    --tags=: Tags to assign to the Accessor.
completion:
    flag:
        accessor-type:
            - BILLING_TOKEN
        network-type:
            - ETHEREUM_GOERLI
            - ETHEREUM_MAINNET
            - ETHEREUM_MAINNET_AND_GOERLI
            - POLYGON_MAINNET
            - POLYGON_MUMBAI
documentation:
    command: Creates a new accessor for use with Amazon Managed Blockchain service that supports token based access. The accessor contains information required for token based access.
    flag:
        accessor-type: |-
            The type of accessor.

            Currently, accessor type is restricted to `BILLING_TOKEN`.
        client-request-token: This is a unique, case-sensitive identifier that you provide to ensure the idempotency of the operation. An idempotent operation completes no more than once. This identifier is required only if you make a service request directly using an HTTP client. It is generated automatically if you use an Amazon Web Services SDK or the Amazon Web Services CLI.
        network-type: "The blockchain network that the `Accessor` token is created for.\n\n- Use the actual `networkType` value for the blockchain network that you are creating the `Accessor` token for.\n- With the shut down of the *Ethereum Goerli* and *Polygon Mumbai Testnet* networks the following `networkType` values are no longer available for selection and use.\n  \n  - `ETHEREUM_MAINNET_AND_GOERLI`\n  - `ETHEREUM_GOERLI`\n  - `POLYGON_MUMBAI`\n  \n  However, your existing `Accessor` tokens with these `networkType` values will remain unchanged."
        tags: |-
            Tags to assign to the Accessor.

            Each tag consists of a key and an optional value. You can specify multiple key-value pairs in a single request with an overall maximum of 50 tags allowed per resource.

            For more information about tags, see [Tagging Resources](https://docs.aws.amazon.com/managed-blockchain/latest/ethereum-dev/tagging-resources.html) in the *Amazon Managed Blockchain Ethereum Developer Guide*, or [Tagging Resources](https://docs.aws.amazon.com/managed-blockchain/latest/hyperledger-fabric-dev/tagging-resources.html) in the *Amazon Managed Blockchain Hyperledger Fabric Developer Guide*.
