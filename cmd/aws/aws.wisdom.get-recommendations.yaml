name: get-recommendations
description: Retrieves recommendations for the specified session.
flags:
    --assistant-id=!: The identifier of the Wisdom assistant.
    --max-results=: The maximum number of results to return per page.
    --session-id=!: The identifier of the session.
    --wait-time-seconds=: The duration (in seconds) for which the call waits for a recommendation to be made available before returning.
documentation:
    command: Retrieves recommendations for the specified session. To avoid retrieving the same recommendations in subsequent calls, use [NotifyRecommendationsReceived](https://docs.aws.amazon.com/wisdom/latest/APIReference/API_NotifyRecommendationsReceived.html). This API supports long-polling behavior with the `waitTimeSeconds` parameter. Short poll is the default behavior and only returns recommendations already available. To perform a manual query against an assistant, use [QueryAssistant](https://docs.aws.amazon.com/wisdom/latest/APIReference/API_QueryAssistant.html).
    flag:
        assistant-id: The identifier of the Wisdom assistant. Can be either the ID or the ARN. URLs cannot contain the ARN.
        max-results: The maximum number of results to return per page.
        session-id: The identifier of the session. Can be either the ID or the ARN. URLs cannot contain the ARN.
        wait-time-seconds: The duration (in seconds) for which the call waits for a recommendation to be made available before returning. If a recommendation is available, the call returns sooner than `WaitTimeSeconds`. If no messages are available and the wait time expires, the call returns successfully with an empty list.
