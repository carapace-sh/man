name: encrypt
description: Encrypt all existing volumes and storage pools in the same region with the desired Cloud NetApp Volumes KMS Config.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location of the kms_config.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        Encrypt the existing volumes with the desired KMS (Key Management System) Config using Customer Managed Encryption Keys (CMEK).
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location of the kms_config.
            +
            To set the `location` attribute:
            * provide the argument `kms_config` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
