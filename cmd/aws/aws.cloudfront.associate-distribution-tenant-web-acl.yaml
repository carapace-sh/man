name: associate-distribution-tenant-web-acl
description: Associates the WAF web ACL with a distribution tenant.
flags:
    --id=!: The ID of the distribution tenant.
    --if-match=: The current `ETag` of the distribution tenant.
    --web-aclarn=!: The Amazon Resource Name (ARN) of the WAF web ACL to associate.
documentation:
    command: Associates the WAF web ACL with a distribution tenant.
    flag:
        id: The ID of the distribution tenant.
        if-match: The current `ETag` of the distribution tenant. This value is returned in the response of the `GetDistributionTenant` API operation.
        web-aclarn: The Amazon Resource Name (ARN) of the WAF web ACL to associate.
