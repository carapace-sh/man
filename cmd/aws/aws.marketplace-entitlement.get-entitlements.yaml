name: get-entitlements
description: GetEntitlements retrieves entitlement values for a given product.
flags:
    --filter=: Filter is used to return entitlements for a specific customer or for a specific dimension.
    --max-results=: The maximum number of items to retrieve from the GetEntitlements operation.
    --next-token=: For paginated calls to GetEntitlements, pass the NextToken from the previous GetEntitlementsResult.
    --product-code=!: Product code is used to uniquely identify a product in AWS Marketplace.
documentation:
    command: |-
        GetEntitlements retrieves entitlement values for a given product. The results can be filtered based on customer identifier, AWS account ID, or product dimensions.

        The `CustomerIdentifier` parameter is on path for deprecation. Use `CustomerAWSAccountID` instead.

        These parameters are mutually exclusive. You can't specify both `CustomerIdentifier` and `CustomerAWSAccountID` in the same request.
    flag:
        filter: |-
            Filter is used to return entitlements for a specific customer or for a specific dimension. Filters are described as keys mapped to a lists of values. Filtered requests are *unioned* for each value in the value list, and then *intersected* for each filter key.

            `CustomerIdentifier` and `CustomerAWSAccountID` are mutually exclusive. You can't specify both in the same request.
        max-results: The maximum number of items to retrieve from the GetEntitlements operation. For pagination, use the NextToken field in subsequent calls to GetEntitlements.
        next-token: For paginated calls to GetEntitlements, pass the NextToken from the previous GetEntitlementsResult.
        product-code: Product code is used to uniquely identify a product in AWS Marketplace. The product code will be provided by AWS Marketplace when the product listing is created.
