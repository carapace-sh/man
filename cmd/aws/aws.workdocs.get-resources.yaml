name: get-resources
description: Retrieves a collection of resources, including folders and documents.
flags:
    --authentication-token=: The Amazon WorkDocs authentication token.
    --collection-type=: The collection type.
    --limit=: The maximum number of resources to return.
    --marker=: The marker for the next set of results.
    --user-id=: The user ID for the resource collection.
completion:
    flag:
        collection-type:
            - SHARED_WITH_ME
documentation:
    command: Retrieves a collection of resources, including folders and documents. The only `CollectionType` supported is `SHARED_WITH_ME`.
    flag:
        authentication-token: The Amazon WorkDocs authentication token. Not required when using Amazon Web Services administrator credentials to access the API.
        collection-type: The collection type.
        limit: The maximum number of resources to return.
        marker: The marker for the next set of results. This marker was received from a previous call.
        user-id: The user ID for the resource collection. This is a required field for accessing the API operation using IAM credentials.
