name: list-asset-models
description: Retrieves a paginated list of summaries of all asset models.
flags:
    --asset-model-types=: The type of asset model.
    --asset-model-version=: The version alias that specifies the latest or active version of the asset model.
    --max-results=: The maximum number of results to return for each paginated request.
    --next-token=: The token to be used for the next set of paginated results.
documentation:
    command: Retrieves a paginated list of summaries of all asset models.
    flag:
        asset-model-types: |-
            The type of asset model. If you don't provide an `assetModelTypes`, all types of asset models are returned.

            - **ASSET\_MODEL** – An asset model that you can use to create assets. Can't be included as a component in another asset model.
            - **COMPONENT\_MODEL** – A reusable component that you can include in the composite models of other asset models. You can't create assets directly from this type of asset model.
            - **INTERFACE** – An interface is a type of model that defines a standard structure that can be applied to different asset models.
        asset-model-version: The version alias that specifies the latest or active version of the asset model. The details are returned in the response. The default value is `LATEST`. See [Asset model versions](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/model-active-version.html) in the *IoT SiteWise User Guide*.
        max-results: |-
            The maximum number of results to return for each paginated request.

            Default: 50
        next-token: The token to be used for the next set of paginated results.
