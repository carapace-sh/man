name: search-system-templates
description: Searches for summary information about systems in the user's account.
flags:
    --filters=: An array of filters that limit the result set.
    --max-results=: The maximum number of results to return in the response.
    --next-token=: The string that specifies the next page of results.
documentation:
    command: Searches for summary information about systems in the user's account. You can filter by the ID of a workflow to return only systems that use the specified workflow.
    flag:
        filters: An array of filters that limit the result set. The only valid filter is `FLOW_TEMPLATE_ID`.
        max-results: The maximum number of results to return in the response.
        next-token: The string that specifies the next page of results. Use this when you're paginating results.
