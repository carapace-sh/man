name: describe
description: '*(ALPHA)*  Describe a Compute Engine ssl policy.'
flags:
    --global: If set, the SSL policy is global.
    --no-global&: If set, the SSL policy is global.
    --region=: Region of the SSL policy to describe.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute ssl-policies describe* is used to display all data associated with a Compute Engine
        SSL policy in a project.

        An SSL policy specifies the server-side support for SSL features. An SSL
        policy can be attached to a TargetHttpsProxy or a TargetSslProxy. This affects
        connections between clients and the load balancer. SSL
        policies do not affect the connection between the load balancers and the
        backends. SSL policies are used by Application Load Balancers and proxy
        Network Load Balancers.
    flag:
        global: If set, the SSL policy is global.
        no-global: If set, the SSL policy is global.
        region: Region of the SSL policy to describe. Overrides the default *compute/region* property value for this command invocation.
