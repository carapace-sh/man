name: create-ephemeris
description: Creates an Ephemeris with the specified `EphemerisData`.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --enabled: Whether to set the ephemeris status to `ENABLED` after validation.
    --ephemeris=: Ephemeris data.
    --expiration-time=: An overall expiration time for the ephemeris in UTC, after which it will become `EXPIRED`.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --kms-key-arn=: The ARN of a KMS key used to encrypt the ephemeris in Ground Station.
    --name=!: A name string associated with the ephemeris.
    --no-enabled: Whether to set the ephemeris status to `ENABLED` after validation.
    --priority=: Customer-provided priority score to establish the order in which overlapping ephemerides should be used.
    --satellite-id=!: AWS Ground Station satellite ID for this ephemeris.
    --tags=: Tags assigned to an ephemeris.
documentation:
    command: Creates an Ephemeris with the specified `EphemerisData`.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        enabled: |-
            Whether to set the ephemeris status to `ENABLED` after validation.

            Setting this to false will set the ephemeris status to `DISABLED` after validation.
        ephemeris: Ephemeris data.
        expiration-time: An overall expiration time for the ephemeris in UTC, after which it will become `EXPIRED`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        kms-key-arn: The ARN of a KMS key used to encrypt the ephemeris in Ground Station.
        name: A name string associated with the ephemeris. Used as a human-readable identifier for the ephemeris.
        priority: |-
            Customer-provided priority score to establish the order in which overlapping ephemerides should be used.

            The default for customer-provided ephemeris priority is 1, and higher numbers take precedence.

            Priority must be 1 or greater
        satellite-id: AWS Ground Station satellite ID for this ephemeris.
        tags: Tags assigned to an ephemeris.
