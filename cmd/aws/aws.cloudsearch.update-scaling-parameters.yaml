name: update-scaling-parameters
description: Configures scaling parameters for a domain.
flags:
    --domain-name=!: ""
    --scaling-parameters=!: ""
documentation:
    command: Configures scaling parameters for a domain. A domain's scaling parameters specify the desired search instance type and replication count. Amazon CloudSearch will still automatically scale your domain based on the volume of data and traffic, but not below the desired instance type and replication count. If the Multi-AZ option is enabled, these values control the resources used per Availability Zone. For more information, see [Configuring Scaling Options](http://docs.aws.amazon.com/cloudsearch/latest/developerguide/configuring-scaling-options.html) in the *Amazon CloudSearch Developer Guide*.
    flag:
        domain-name: ""
        scaling-parameters: ""
