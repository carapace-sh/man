name: list-log-groups-for-query
description: Returns a list of the log groups that were analyzed during a single CloudWatch Logs Insights query.
flags:
    --max-results=: Limits the number of returned log groups to the specified number.
    --next-token=: ""
    --query-id=!: The ID of the query to use.
documentation:
    command: |-
        Returns a list of the log groups that were analyzed during a single CloudWatch Logs Insights query. This can be useful for queries that use log group name prefixes or the `filterIndex` command, because the log groups are dynamically selected in these cases.

        For more information about field indexes, see [Create field indexes to improve query performance and reduce costs](https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatchLogs-Field-Indexing.html).
    flag:
        max-results: Limits the number of returned log groups to the specified number.
        next-token: ""
        query-id: The ID of the query to use. This query ID is from the response to your [StartQuery](https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_StartQuery.html) operation.
