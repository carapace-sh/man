name: stop-hyper-parameter-tuning-job
description: Stops a running hyperparameter tuning job and all running training jobs that the tuning job launched.
flags:
    --hyper-parameter-tuning-job-name=!: The name of the tuning job to stop.
documentation:
    command: |-
        Stops a running hyperparameter tuning job and all running training jobs that the tuning job launched.

        All model artifacts output from the training jobs are stored in Amazon Simple Storage Service (Amazon S3). All data that the training jobs write to Amazon CloudWatch Logs are still available in CloudWatch. After the tuning job moves to the `Stopped` state, it releases all reserved resources for the tuning job.
    flag:
        hyper-parameter-tuning-job-name: The name of the tuning job to stop.
