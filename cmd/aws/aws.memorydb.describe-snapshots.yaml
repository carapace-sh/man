name: describe-snapshots
description: Returns information about cluster snapshots.
flags:
    --cluster-name=: A user-supplied cluster identifier.
    --max-results=: The maximum number of records to include in the response.
    --next-token=: An optional argument to pass in case the total number of records exceeds the value of MaxResults.
    --show-detail=: A Boolean value which if true, the shard configuration is included in the snapshot description.
    --snapshot-name=: A user-supplied name of the snapshot.
    --source=: If set to system, the output shows snapshots that were automatically created by MemoryDB.
documentation:
    command: Returns information about cluster snapshots. By default, DescribeSnapshots lists all of your snapshots; it can optionally describe a single snapshot, or just the snapshots associated with a particular cluster.
    flag:
        cluster-name: A user-supplied cluster identifier. If this parameter is specified, only snapshots associated with that specific cluster are described.
        max-results: The maximum number of records to include in the response. If more records exist than the specified MaxResults value, a token is included in the response so that the remaining results can be retrieved.
        next-token: An optional argument to pass in case the total number of records exceeds the value of MaxResults. If nextToken is returned, there are more results available. The value of nextToken is a unique pagination token for each page. Make the call again using the returned token to retrieve the next page. Keep all other arguments unchanged.
        show-detail: A Boolean value which if true, the shard configuration is included in the snapshot description.
        snapshot-name: A user-supplied name of the snapshot. If this parameter is specified, only this named snapshot is described.
        source: If set to system, the output shows snapshots that were automatically created by MemoryDB. If set to user the output shows snapshots that were manually created. If omitted, the output shows both automatically and manually created snapshots.
