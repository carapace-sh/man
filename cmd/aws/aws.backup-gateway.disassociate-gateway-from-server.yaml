name: disassociate-gateway-from-server
description: Disassociates a backup gateway from the specified server.
flags:
    --gateway-arn=!: The Amazon Resource Name (ARN) of the gateway to disassociate.
documentation:
    command: Disassociates a backup gateway from the specified server. After the disassociation process finishes, the gateway can no longer access the virtual machines on the server.
    flag:
        gateway-arn: The Amazon Resource Name (ARN) of the gateway to disassociate.
