name: update-mlmodel
description: Updates the `MLModelName` and the `ScoreThreshold` of an `MLModel`.
flags:
    --mlmodel-id=!: The ID assigned to the `MLModel` during creation.
    --mlmodel-name=: A user-supplied name or description of the `MLModel`.
    --score-threshold=: The `ScoreThreshold` used in binary classification `MLModel` that marks the boundary between a positive prediction and a negative prediction.
documentation:
    command: |-
        Updates the `MLModelName` and the `ScoreThreshold` of an `MLModel`.

        You can use the `GetMLModel` operation to view the contents of the updated data element.
    flag:
        mlmodel-id: The ID assigned to the `MLModel` during creation.
        mlmodel-name: A user-supplied name or description of the `MLModel`.
        score-threshold: |-
            The `ScoreThreshold` used in binary classification `MLModel` that marks the boundary between a positive prediction and a negative prediction.

            Output values greater than or equal to the `ScoreThreshold` receive a positive result from the `MLModel`, such as `true`. Output values less than the `ScoreThreshold` receive a negative response from the `MLModel`, such as `false`.
