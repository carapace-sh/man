name: create-relay
description: Creates a relay resource which can be used in rules to relay incoming emails to defined relay destinations.
flags:
    --authentication=!: Authentication for the relay destination server—specify the secretARN where the SMTP credentials are stored.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique token that Amazon SES uses to recognize subsequent retries of the same request.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --relay-name=!: The unique name of the relay resource.
    --server-name=!: The destination relay server address.
    --server-port=!: The destination relay server port.
    --tags=:
        description: The tags used to organize, track, or control access for the resource.
        nargs: -1
documentation:
    command: Creates a relay resource which can be used in rules to relay incoming emails to defined relay destinations.
    flag:
        authentication: Authentication for the relay destination server—specify the secretARN where the SMTP credentials are stored.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique token that Amazon SES uses to recognize subsequent retries of the same request.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        relay-name: The unique name of the relay resource.
        server-name: The destination relay server address.
        server-port: The destination relay server port.
        tags: 'The tags used to organize, track, or control access for the resource. For example, { "tags": {"key1":"value1", "key2":"value2"} }.'
