name: list-cluster-events
description: Retrieves a list of event summaries for a specified HyperPod cluster.
flags:
    --cluster-name=!: The name or Amazon Resource Name (ARN) of the HyperPod cluster for which to list events.
    --event-time-after=: The start of the time range for filtering events.
    --event-time-before=: The end of the time range for filtering events.
    --instance-group-name=: The name of the instance group to filter events.
    --max-results=: The maximum number of events to return in the response.
    --next-token=: A token to retrieve the next set of results.
    --node-id=: The EC2 instance ID to filter events.
    --resource-type=: The type of resource for which to filter events.
    --sort-by=: The field to use for sorting the event list.
    --sort-order=: The order in which to sort the results.
completion:
    flag:
        resource-type:
            - Cluster
            - InstanceGroup
            - Instance
        sort-by:
            - EventTime
        sort-order:
            - Ascending
            - Descending
documentation:
    command: Retrieves a list of event summaries for a specified HyperPod cluster. The operation supports filtering, sorting, and pagination of results. This functionality is only supported when the `NodeProvisioningMode` is set to `Continuous`.
    flag:
        cluster-name: The name or Amazon Resource Name (ARN) of the HyperPod cluster for which to list events.
        event-time-after: The start of the time range for filtering events. Only events that occurred after this time are included in the results.
        event-time-before: The end of the time range for filtering events. Only events that occurred before this time are included in the results.
        instance-group-name: The name of the instance group to filter events. If specified, only events related to this instance group are returned.
        max-results: The maximum number of events to return in the response. Valid range is 1 to 100.
        next-token: A token to retrieve the next set of results. This token is obtained from the output of a previous `ListClusterEvents` call.
        node-id: The EC2 instance ID to filter events. If specified, only events related to this instance are returned.
        resource-type: The type of resource for which to filter events. Valid values are `Cluster`, `InstanceGroup`, or `Instance`.
        sort-by: The field to use for sorting the event list. Currently, the only supported value is `EventTime`.
        sort-order: The order in which to sort the results. Valid values are `Ascending` or `Descending` (the default is `Descending`).
