name: get-canary-runs
description: Retrieves a list of runs for a specified canary.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dry-run-id=: The DryRunId associated with an existing canary’s dry run.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: Specify this parameter to limit how many runs are returned each time you use the `GetCanaryRuns` operation.
    --name=!: The name of the canary that you want to see runs for.
    --next-token=: A token that indicates that there is more data available.
    --run-type=: '- When you provide `RunType=CANARY_RUN` and `dryRunId`, you will get an exception'
completion:
    flag:
        run-type:
            - CANARY_RUN
            - DRY_RUN
documentation:
    command: Retrieves a list of runs for a specified canary.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dry-run-id: The DryRunId associated with an existing canary’s dry run. You can use this DryRunId to retrieve information about the dry run.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: Specify this parameter to limit how many runs are returned each time you use the `GetCanaryRuns` operation. If you omit this parameter, the default of 100 is used.
        name: The name of the canary that you want to see runs for.
        next-token: |-
            A token that indicates that there is more data available. You can use this token in a subsequent `GetCanaryRuns` operation to retrieve the next set of results.

            When auto retry is enabled for the canary, the first subsequent retry is suffixed with \*1 indicating its the first retry and the next subsequent try is suffixed with \*2.
        run-type: |-
            - When you provide `RunType=CANARY_RUN` and `dryRunId`, you will get an exception
            - When a value is not provided for `RunType`, the default value is `CANARY_RUN`
            - When `CANARY_RUN` is provided, all canary runs excluding dry runs are returned
            - When `DRY_RUN` is provided, all dry runs excluding canary runs are returned
