name: get-domain-permissions-policy
description: Returns the resource policy attached to the specified domain.
flags:
    --domain-owner=: The 12-digit account number of the Amazon Web Services account that owns the domain.
    --domain=!: The name of the domain to which the resource policy is attached.
documentation:
    command: |-
        Returns the resource policy attached to the specified domain.

        The policy is a resource-based policy, not an identity-based policy. For more information, see [Identity-based policies and resource-based policies](https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_identity-vs-resource.html) in the *IAM User Guide*.
    flag:
        domain: The name of the domain to which the resource policy is attached.
        domain-owner: The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces.
