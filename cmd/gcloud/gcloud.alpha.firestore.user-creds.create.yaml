name: create
description: '*(ALPHA)*  Creates a Cloud Firestore user creds.'
flags:
    --database=!: The database to operate on.
documentation:
    command: |-
        ## EXAMPLES

        To create a user creds called test-user-creds-id under database testdb.

            $ gcloud alpha firestore user-creds create test-user-creds-id --database=testdb
    flag:
        database: |-
            The database to operate on.
            +
            For example, to operate on database `foo`:
            +
              $ {command} --database='foo'
