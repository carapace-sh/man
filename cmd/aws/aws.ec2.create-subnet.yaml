name: create-subnet
description: Creates a subnet in the specified VPC.
flags:
    --availability-zone-id=: The AZ ID or the Local Zone ID of the subnet.
    --availability-zone=: The Availability Zone or Local Zone for the subnet.
    --cidr-block=: The IPv4 network range for the subnet, in CIDR notation.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ipv4-ipam-pool-id=: An IPv4 IPAM pool ID for the subnet.
    --ipv4-netmask-length=: An IPv4 netmask length for the subnet.
    --ipv6-cidr-block=: The IPv6 network range for the subnet, in CIDR notation.
    --ipv6-ipam-pool-id=: An IPv6 IPAM pool ID for the subnet.
    --ipv6-native: Indicates whether to create an IPv6 only subnet.
    --ipv6-netmask-length=: An IPv6 netmask length for the subnet.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-ipv6-native: Indicates whether to create an IPv6 only subnet.
    --outpost-arn=: The Amazon Resource Name (ARN) of the Outpost.
    --tag-specifications=:
        description: The tags to assign to the subnet.
        nargs: -1
    --vpc-id=!: The ID of the VPC.
documentation:
    command: |-
        Creates a subnet in the specified VPC. For an IPv4 only subnet, specify an IPv4 CIDR block. If the VPC has an IPv6 CIDR block, you can create an IPv6 only subnet or a dual stack subnet instead. For an IPv6 only subnet, specify an IPv6 CIDR block. For a dual stack subnet, specify both an IPv4 CIDR block and an IPv6 CIDR block.

        A subnet CIDR block must not overlap the CIDR block of an existing subnet in the VPC. After you create a subnet, you can't change its CIDR block.

        The allowed size for an IPv4 subnet is between a /28 netmask (16 IP addresses) and a /16 netmask (65,536 IP addresses). Amazon Web Services reserves both the first four and the last IPv4 address in each subnet's CIDR block. They're not available for your use.

        If you've associated an IPv6 CIDR block with your VPC, you can associate an IPv6 CIDR block with a subnet when you create it.

        If you add more than one subnet to a VPC, they're set up in a star topology with a logical router in the middle.

        When you stop an instance in a subnet, it retains its private IPv4 address. It's therefore possible to have a subnet with no running instances (they're all stopped), but no remaining IP addresses available.

        For more information, see [Subnets](https://docs.aws.amazon.com/vpc/latest/userguide/configure-subnets.html) in the *Amazon VPC User Guide*.
    flag:
        availability-zone: |-
            The Availability Zone or Local Zone for the subnet.

            Default: Amazon Web Services selects one for you. If you create more than one subnet in your VPC, we do not necessarily select a different zone for each subnet.

            To create a subnet in a Local Zone, set this value to the Local Zone ID, for example `us-west-2-lax-1a`. For information about the Regions that support Local Zones, see [Available Local Zones](https://docs.aws.amazon.com/local-zones/latest/ug/available-local-zones.html).

            To create a subnet in an Outpost, set this value to the Availability Zone for the Outpost and specify the Outpost ARN.
        availability-zone-id: The AZ ID or the Local Zone ID of the subnet.
        cidr-block: |-
            The IPv4 network range for the subnet, in CIDR notation. For example, `10.0.0.0/24`. We modify the specified CIDR block to its canonical form; for example, if you specify `100.68.0.18/18`, we modify it to `100.68.0.0/18`.

            This parameter is not supported for an IPv6 only subnet.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ipv4-ipam-pool-id: An IPv4 IPAM pool ID for the subnet.
        ipv4-netmask-length: An IPv4 netmask length for the subnet.
        ipv6-cidr-block: The IPv6 network range for the subnet, in CIDR notation. This parameter is required for an IPv6 only subnet.
        ipv6-ipam-pool-id: An IPv6 IPAM pool ID for the subnet.
        ipv6-native: Indicates whether to create an IPv6 only subnet.
        ipv6-netmask-length: An IPv6 netmask length for the subnet.
        outpost-arn: The Amazon Resource Name (ARN) of the Outpost. If you specify an Outpost ARN, you must also specify the Availability Zone of the Outpost subnet.
        tag-specifications: The tags to assign to the subnet.
        vpc-id: The ID of the VPC.
