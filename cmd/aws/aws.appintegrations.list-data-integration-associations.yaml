name: list-data-integration-associations
description: Returns a paginated list of DataIntegration associations in the account.
flags:
    --data-integration-identifier=!: A unique identifier for the DataIntegration.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
documentation:
    command: |-
        Returns a paginated list of DataIntegration associations in the account.

        You cannot create a DataIntegration association for a DataIntegration that has been previously associated. Use a different DataIntegration, or recreate the DataIntegration using the [CreateDataIntegration](https://docs.aws.amazon.com/appintegrations/latest/APIReference/API_CreateDataIntegration.html) API.
    flag:
        data-integration-identifier: A unique identifier for the DataIntegration.
        max-results: The maximum number of results to return per page.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
