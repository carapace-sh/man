name: delete
description: Delete a Bigtable app profile.
flags:
    --force: Ignore warnings and force delete.
    --instance=: Bigtable instance for the app profile.
    --no-force&: Ignore warnings and force delete.
documentation:
    command: Delete a Bigtable app profile.
    flag:
        force: Ignore warnings and force delete.
        instance: |-
            Bigtable instance for the app profile.
            +
            To set the `instance` attribute:
            * provide the argument `app_profile` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line.
        no-force: Ignore warnings and force delete.
