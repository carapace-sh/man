name: get-sprites
description: '`GetSprites` returns the map''s sprites.'
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --color-scheme=!: Sets color tone for map such as dark and light for specific map styles.
    --file-name=!: '`Sprites` API: The name of the sprite ﬁle to retrieve, following pattern `sprites(@2x)?\.(png|json)`.'
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --style=!: Style specifies the desired map style for the `Sprites` APIs.
    --variant=!: Optimizes map styles for specific use case or industry.
completion:
    flag:
        color-scheme:
            - Light
            - Dark
        style:
            - Standard
            - Monochrome
            - Hybrid
            - Satellite
        variant:
            - Default
documentation:
    command: '`GetSprites` returns the map''s sprites.'
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        color-scheme: |-
            Sets color tone for map such as dark and light for specific map styles. It applies to only vector map styles such as Standard and Monochrome.

            Example: `Light`

            Default value: `Light`

            Valid values for ColorScheme are case sensitive.
        file-name: |-
            `Sprites` API: The name of the sprite ﬁle to retrieve, following pattern `sprites(@2x)?\.(png|json)`.

            Example: `sprites.png`
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        style: Style specifies the desired map style for the `Sprites` APIs.
        variant: |-
            Optimizes map styles for specific use case or industry. You can choose allowed variant only with Standard map style.

            Example: `Default`

            Valid values for Variant are case sensitive.
