name: create-framework
description: Creates a framework with one or more controls.
flags:
    --framework-controls=!: The controls that make up the framework.
    --framework-description=: An optional description of the framework with a maximum of 1,024 characters.
    --framework-name=!: The unique name of the framework.
    --framework-tags=: The tags to assign to the framework.
    --idempotency-token=: A customer-chosen string that you can use to distinguish between otherwise identical calls to `CreateFrameworkInput`.
documentation:
    command: Creates a framework with one or more controls. A framework is a collection of controls that you can use to evaluate your backup practices. By using pre-built customizable controls to define your policies, you can evaluate whether your backup practices comply with your policies and which resources are not yet in compliance.
    flag:
        framework-controls: The controls that make up the framework. Each control in the list has a name, input parameters, and scope.
        framework-description: An optional description of the framework with a maximum of 1,024 characters.
        framework-name: The unique name of the framework. The name must be between 1 and 256 characters, starting with a letter, and consisting of letters (a-z, A-Z), numbers (0-9), and underscores (\_).
        framework-tags: The tags to assign to the framework.
        idempotency-token: A customer-chosen string that you can use to distinguish between otherwise identical calls to `CreateFrameworkInput`. Retrying a successful request with the same idempotency token results in a success message with no action taken.
