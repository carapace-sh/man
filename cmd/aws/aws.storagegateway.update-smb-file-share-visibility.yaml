name: update-smb-file-share-visibility
description: Controls whether the shares on an S3 File Gateway are visible in a net view or browse list.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --file-shares-visible!: The shares on this gateway appear when listing shares.
    --gateway-arn=!: ""
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-file-shares-visible!: The shares on this gateway appear when listing shares.
documentation:
    command: Controls whether the shares on an S3 File Gateway are visible in a net view or browse list. The operation is only supported for S3 File Gateways.
    flag:
