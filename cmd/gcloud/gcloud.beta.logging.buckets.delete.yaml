name: delete
description: '*(BETA)*  Delete a bucket.'
flags:
    --billing-account=: Billing account of the bucket to delete.
    --folder=: Folder of the bucket to delete.
    --location=!: Location of the bucket.
    --organization=: Organization of the bucket to delete.
documentation:
    command: |-
        ## EXAMPLES

        To delete bucket 'my-bucket' in location 'global', run:

          $ gcloud beta logging buckets delete my-bucket --location=global
    flag:
        billing-account: Billing account of the bucket to delete.
        folder: Folder of the bucket to delete.
        location: Location of the bucket.
        organization: Organization of the bucket to delete.
