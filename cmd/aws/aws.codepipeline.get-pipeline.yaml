name: get-pipeline
description: Returns the metadata, structure, stages, and actions of a pipeline.
flags:
    --name=!: The name of the pipeline for which you want to get information.
    --version=: The version number of the pipeline.
documentation:
    command: Returns the metadata, structure, stages, and actions of a pipeline. Can be used to return the entire structure of a pipeline in JSON format, which can then be modified and used to update the pipeline structure with [UpdatePipeline]().
    flag:
        name: The name of the pipeline for which you want to get information. Pipeline names must be unique in an Amazon Web Services account.
        version: The version number of the pipeline. If you do not specify a version, defaults to the current version.
