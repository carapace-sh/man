name: create-application
description: Creates an application.
flags:
    --application-name=!: The name of the application.
    --compute-platform=: The destination platform type for the deployment (`Lambda`, `Server`, or `ECS`).
    --tags=: The metadata that you apply to CodeDeploy applications to help you organize and categorize them.
completion:
    flag:
        compute-platform:
            - Server
            - Lambda
            - ECS
documentation:
    command: Creates an application.
    flag:
        application-name: The name of the application. This name must be unique with the applicable user or Amazon Web Services account.
        compute-platform: The destination platform type for the deployment (`Lambda`, `Server`, or `ECS`).
        tags: The metadata that you apply to CodeDeploy applications to help you organize and categorize them. Each tag consists of a key and an optional value, both of which you define.
