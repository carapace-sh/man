name: create-vpc-endpoint
description: Creates a VPC endpoint.
flags:
    --client-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --dns-options=: The DNS options for the endpoint.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --ip-address-type=: The IP address type for the endpoint.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-private-dns-enabled: (Interface endpoint) Indicates whether to associate a private hosted zone with the specified VPC.
    --policy-document=: (Interface and gateway endpoints) A policy to attach to the endpoint that controls access to the service.
    --private-dns-enabled: (Interface endpoint) Indicates whether to associate a private hosted zone with the specified VPC.
    --resource-configuration-arn=: The Amazon Resource Name (ARN) of a resource configuration that will be associated with the VPC endpoint of type resource.
    --route-table-ids=: (Gateway endpoint) The route table IDs.
    --security-group-ids=: (Interface endpoint) The IDs of the security groups to associate with the endpoint network interfaces.
    --service-name=: The name of the endpoint service.
    --service-network-arn=: The Amazon Resource Name (ARN) of a service network that will be associated with the VPC endpoint of type service-network.
    --service-region=: The Region where the service is hosted.
    --subnet-configurations=: The subnet configurations for the endpoint.
    --subnet-ids=: (Interface and Gateway Load Balancer endpoints) The IDs of the subnets in which to create endpoint network interfaces.
    --tag-specifications=: The tags to associate with the endpoint.
    --vpc-endpoint-type=: The type of endpoint.
    --vpc-id=!: The ID of the VPC.
completion:
    flag:
        ip-address-type:
            - ipv4
            - dualstack
            - ipv6
        vpc-endpoint-type:
            - Interface
            - Gateway
            - GatewayLoadBalancer
            - Resource
            - ServiceNetwork
documentation:
    command: Creates a VPC endpoint. A VPC endpoint provides a private connection between the specified VPC and the specified endpoint service. You can use an endpoint service provided by Amazon Web Services, an Amazon Web Services Marketplace Partner, or another Amazon Web Services account. For more information, see the [Amazon Web Services PrivateLink User Guide](https://docs.aws.amazon.com/vpc/latest/privatelink/).
    flag:
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request. For more information, see [How to ensure idempotency](https://docs.aws.amazon.com/ec2/latest/devguide/ec2-api-idempotency.html).
        dns-options: The DNS options for the endpoint.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        ip-address-type: The IP address type for the endpoint.
        policy-document: (Interface and gateway endpoints) A policy to attach to the endpoint that controls access to the service. The policy must be in valid JSON format. If this parameter is not specified, we attach a default policy that allows full access to the service.
        private-dns-enabled: |-
            (Interface endpoint) Indicates whether to associate a private hosted zone with the specified VPC. The private hosted zone contains a record set for the default public DNS name for the service for the Region (for example, `kinesis.us-east-1.amazonaws.com`), which resolves to the private IP addresses of the endpoint network interfaces in the VPC. This enables you to make requests to the default public DNS name for the service instead of the public DNS names that are automatically generated by the VPC endpoint service.

            To use a private hosted zone, you must set the following VPC attributes to `true`: `enableDnsHostnames` and `enableDnsSupport`. Use [ModifyVpcAttribute]() to set the VPC attributes.
        resource-configuration-arn: The Amazon Resource Name (ARN) of a resource configuration that will be associated with the VPC endpoint of type resource.
        route-table-ids: (Gateway endpoint) The route table IDs.
        security-group-ids: (Interface endpoint) The IDs of the security groups to associate with the endpoint network interfaces. If this parameter is not specified, we use the default security group for the VPC.
        service-name: The name of the endpoint service.
        service-network-arn: The Amazon Resource Name (ARN) of a service network that will be associated with the VPC endpoint of type service-network.
        service-region: The Region where the service is hosted. The default is the current Region.
        subnet-configurations: The subnet configurations for the endpoint.
        subnet-ids: (Interface and Gateway Load Balancer endpoints) The IDs of the subnets in which to create endpoint network interfaces. For a Gateway Load Balancer endpoint, you can specify only one subnet.
        tag-specifications: The tags to associate with the endpoint.
        vpc-endpoint-type: |-
            The type of endpoint.

            Default: Gateway
        vpc-id: The ID of the VPC.
