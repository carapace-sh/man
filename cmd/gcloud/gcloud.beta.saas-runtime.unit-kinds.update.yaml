name: update
description: '*(BETA)*  Update a Unit Kind.'
flags:
    --add-dependencies=: Add new value to dependencies list.
    --add-input-variable-mappings=: Add new value to input_variable_mappings list.
    --add-output-variable-mappings=: Add new value to output_variable_mappings list.
    --clear-default-release: Clear default_release value and set to null.
    --clear-dependencies: Clear dependencies value and set to empty list.
    --clear-input-variable-mappings: Clear input_variable_mappings value and set to empty list.
    --clear-labels: Clear labels value and set to empty map.
    --clear-output-variable-mappings: Clear output_variable_mappings value and set to empty list.
    --default-release=!: ID of the release or fully qualified identifier for the release.
    --dependencies=: Set dependencies to new value.
    --input-variable-mappings=: Set input_variable_mappings to new value.
    --labels=: Set labels to new value.
    --location=: For resources [default-release, saas, unit_kind], provides fallback value for resource location attribute.
    --no-clear-default-release&: Clear default_release value and set to null.
    --no-clear-dependencies&: Clear dependencies value and set to empty list.
    --no-clear-input-variable-mappings&: Clear input_variable_mappings value and set to empty list.
    --no-clear-labels&: Clear labels value and set to empty map.
    --no-clear-output-variable-mappings&: Clear output_variable_mappings value and set to empty list.
    --output-variable-mappings=: Set output_variable_mappings to new value.
    --remove-dependencies=: Remove existing value from dependencies list.
    --remove-input-variable-mappings=: Remove existing value from input_variable_mappings list.
    --remove-labels=: Remove existing value from map labels.
    --remove-output-variable-mappings=: Remove existing value from output_variable_mappings list.
    --saas=!: ID of the saas or fully qualified identifier for the saas.
    --update-labels=: Update labels value or add key value pair.
documentation:
    command: '*(BETA)*  Update a Unit Kind'
    flag:
        add-dependencies: |-
            Add new value to dependencies list. List of other unit kinds that this release will depend on. Dependencies
            will be automatically provisioned if not found. Maximum 10.
            +
            *alias*:::
            An alias for the dependency. Used for input variable mapping.
            +
            *unitKind*:::
            The unit kind of the dependency.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --add-dependencies=alias=string,unitKind=string --add-dependencies=alias=string,unitKind=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --add-dependencies='[{"alias": "string", "unitKind": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --add-dependencies=path_to_file.(yaml|json)
            +
            ```
        add-input-variable-mappings: |-
            Add new value to input_variable_mappings list. List of inputVariables for this release that will either be retrieved from
            a dependency's outputVariables, or will be passed on to a dependency's
            inputVariables. Maximum 100.
            +
            *from*:::
            Output variables which will get their values from dependencies.
            +
            *dependency*::::
            Alias of the dependency that the outputVariable will pass its value to.
            +
            *outputVariable*::::
            Name of the outputVariable on the dependency.
            +
            *to*:::
            Input variables whose values will be passed on to dependencies.
            +
            *dependency*::::
            Alias of the dependency that the inputVariable will pass its value to.
            +
            *ignoreForLookup*::::
            Tells SaaS Runtime if this mapping should be used during lookup or not.
            +
            *inputVariable*::::
            Name of the inputVariable on the dependency.
            +
            *variable*:::
            name of the variable.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --add-input-variable-mappings=from={dependency=string,outputVariable=string},to={dependency=string,ignoreForLookup=boolean,inputVariable=string},variable=string --add-input-variable-mappings=from={dependency=string,outputVariable=string},to={dependency=string,ignoreForLookup=boolean,inputVariable=string},variable=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --add-input-variable-mappings='[{"from": {"dependency": "string", "outputVariable": "string"}, "to": {"dependency": "string", "ignoreForLookup": boolean, "inputVariable": "string"}, "variable": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --add-input-variable-mappings=path_to_file.(yaml|json)
            +
            ```
        add-output-variable-mappings: |-
            Add new value to output_variable_mappings list. List of outputVariables for this unit kind will be passed to this unit's
            outputVariables. Maximum 100.
            +
            *from*:::
            Output variables which will get their values from dependencies.
            +
            *dependency*::::
            Alias of the dependency that the outputVariable will pass its value to.
            +
            *outputVariable*::::
            Name of the outputVariable on the dependency.
            +
            *to*:::
            Input variables whose values will be passed on to dependencies.
            +
            *dependency*::::
            Alias of the dependency that the inputVariable will pass its value to.
            +
            *ignoreForLookup*::::
            Tells SaaS Runtime if this mapping should be used during lookup or not.
            +
            *inputVariable*::::
            Name of the inputVariable on the dependency.
            +
            *variable*:::
            name of the variable.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --add-output-variable-mappings=from={dependency=string,outputVariable=string},to={dependency=string,ignoreForLookup=boolean,inputVariable=string},variable=string --add-output-variable-mappings=from={dependency=string,outputVariable=string},to={dependency=string,ignoreForLookup=boolean,inputVariable=string},variable=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --add-output-variable-mappings='[{"from": {"dependency": "string", "outputVariable": "string"}, "to": {"dependency": "string", "ignoreForLookup": boolean, "inputVariable": "string"}, "variable": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --add-output-variable-mappings=path_to_file.(yaml|json)
            +
            ```
        clear-default-release: Clear default_release value and set to null.
        clear-dependencies: Clear dependencies value and set to empty list.
        clear-input-variable-mappings: Clear input_variable_mappings value and set to empty list.
        clear-labels: Clear labels value and set to empty map.
        clear-output-variable-mappings: Clear output_variable_mappings value and set to empty list.
        default-release: |-
            ID of the release or fully qualified identifier for the release.
            +
            To set the `release` attribute:
            * provide the argument `--default-release` on the command line.
        dependencies: |-
