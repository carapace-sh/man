name: update
description: '*(BETA)*  Update an existing Vertex AI Tensorboard experiment.'
flags:
    --clear-labels: Remove all labels.
    --description=: Description of the tensorboard experiment.
    --display-name=: Display name of the tensorboard experiment.
    --no-clear-labels&: Remove all labels.
    --region=: Cloud region for the tensorboard_experiment.
    --remove-labels=: List of label keys to remove.
    --tensorboard-id=: ID of the tensorboard for the tensorboard_experiment.
    --update-labels=: List of label KEY=VALUE pairs to update.
documentation:
    command: '*(BETA)*  Update an existing Vertex AI Tensorboard experiment.'
    flag:
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        description: Description of the tensorboard experiment.
        display-name: Display name of the tensorboard experiment.
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        region: |-
            Cloud region for the tensorboard_experiment.
            +
            To set the `region` attribute:
            * provide the argument `tensorboard_experiment` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        tensorboard-id: |-
            ID of the tensorboard for the tensorboard_experiment.
            +
            To set the `tensorboard-id` attribute:
            * provide the argument `tensorboard_experiment` on the command line with a fully specified name;
            * provide the argument `--tensorboard-id` on the command line.
        update-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
