name: create-registration-attachment
description: Create a new registration attachment to use for uploading a file or a URL to a file.
flags:
    --attachment-body=: The registration file to upload.
    --attachment-url=: Registration files have to be stored in an Amazon S3 bucket.
    --client-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --tags=: An array of tags (key and value pairs) to associate with the registration attachment.
documentation:
    command: |-
        Create a new registration attachment to use for uploading a file or a URL to a file. The maximum file size is 500KB and valid file extensions are PDF, JPEG and PNG. For example, many sender ID registrations require a signed “letter of authorization” (LOA) to be submitted.

        Use either `AttachmentUrl` or `AttachmentBody` to upload your attachment. If both are specified then an exception is returned.
    flag:
        attachment-body: The registration file to upload. The maximum file size is 500KB and valid file extensions are PDF, JPEG and PNG.
        attachment-url: Registration files have to be stored in an Amazon S3 bucket. The URI to use when sending is in the format `s3://BucketName/FileName`.
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If you don't specify a client token, a randomly generated token is used for the request to ensure idempotency.
        tags: An array of tags (key and value pairs) to associate with the registration attachment.
