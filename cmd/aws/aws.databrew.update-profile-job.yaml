name: update-profile-job
description: Modifies the definition of an existing profile job.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration=: Configuration for profile jobs.
    --encryption-key-arn=: The Amazon Resource Name (ARN) of an encryption key that is used to protect the job.
    --encryption-mode=: 'The encryption mode for the job, which can be one of the following:'
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --job-sample=: Sample configuration for Profile Jobs only.
    --log-subscription=: Enables or disables Amazon CloudWatch logging for the job.
    --max-capacity=: The maximum number of compute nodes that DataBrew can use when the job processes data.
    --max-retries=: The maximum number of times to retry the job after a job run fails.
    --name=!: The name of the job to be updated.
    --output-location=!: ""
    --role-arn=!: The Amazon Resource Name (ARN) of the Identity and Access Management (IAM) role to be assumed when DataBrew runs the job.
    --timeout=: The job's timeout in minutes.
    --validation-configurations=: List of validation configurations that are applied to the profile job.
completion:
    flag:
        encryption-mode:
            - SSE-KMS
            - SSE-S3
        log-subscription:
            - ENABLE
            - DISABLE
documentation:
    command: Modifies the definition of an existing profile job.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration: Configuration for profile jobs. Used to select columns, do evaluations, and override default parameters of evaluations. When configuration is null, the profile job will run with default settings.
        encryption-key-arn: The Amazon Resource Name (ARN) of an encryption key that is used to protect the job.
        encryption-mode: |-
            The encryption mode for the job, which can be one of the following:

            - `SSE-KMS` - Server-side encryption with keys managed by KMS.
            - `SSE-S3` - Server-side encryption with keys managed by Amazon S3.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        job-sample: Sample configuration for Profile Jobs only. Determines the number of rows on which the Profile job will be executed. If a JobSample value is not provided for profile jobs, the default value will be used. The default value is CUSTOM\_ROWS for the mode parameter and 20000 for the size parameter.
        log-subscription: Enables or disables Amazon CloudWatch logging for the job. If logging is enabled, CloudWatch writes one log stream for each job run.
        max-capacity: The maximum number of compute nodes that DataBrew can use when the job processes data.
        max-retries: The maximum number of times to retry the job after a job run fails.
        name: The name of the job to be updated.
        output-location: ""
        role-arn: The Amazon Resource Name (ARN) of the Identity and Access Management (IAM) role to be assumed when DataBrew runs the job.
        timeout: The job's timeout in minutes. A job that attempts to run longer than this timeout period ends with a status of `TIMEOUT`.
        validation-configurations: List of validation configurations that are applied to the profile job.
