name: put-application-policy
description: Sets the permission policy for an application.
flags:
    --application-id=!: The Amazon Resource Name (ARN) of the application.
    --statements=!: An array of policy statements applied to the application.
documentation:
    command: Sets the permission policy for an application. For the list of actions supported for this operation, see [Application Permissions](https://docs.aws.amazon.com/serverlessrepo/latest/devguide/access-control-resource-based.html#application-permissions) .
    flag:
        application-id: The Amazon Resource Name (ARN) of the application.
        statements: An array of policy statements applied to the application.
