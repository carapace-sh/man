name: complete-migration
description: Complete the migration of data.
flags:
    --force: Forces the migration to stop without ensuring that data is in sync.
    --no-force: Forces the migration to stop without ensuring that data is in sync.
    --replication-group-id=!: The ID of the replication group to which data is being migrated.
documentation:
    command: Complete the migration of data.
    flag:
        force: Forces the migration to stop without ensuring that data is in sync. It is recommended to use this option only to abort the migration and not recommended when application wants to continue migration to ElastiCache.
        replication-group-id: The ID of the replication group to which data is being migrated.
