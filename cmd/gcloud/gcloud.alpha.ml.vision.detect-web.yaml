name: detect-web
description: '*(ALPHA)*  Detect entities in an image from similar images on the web.'
flags:
    --include-geo-results: Whether to include results derived from the geo information in the image.
    --max-results=: Maximum number of results to be provided.
    --model-version=: Model version to use for the feature.
    --no-include-geo-results&: Whether to include results derived from the geo information in the image.
completion:
    flag:
        model-version:
            - builtin/latest
            - builtin/stable
documentation:
    command: |
        *(ALPHA)*  Detect entities in an image from similar images on the web.
    flag:
        include-geo-results: Whether to include results derived from the geo information in the image.
        max-results: Maximum number of results to be provided.
        model-version: 'Model version to use for the feature. _MODEL_VERSION_ must be one of: *builtin/latest*, *builtin/stable*.'
        no-include-geo-results: Whether to include results derived from the geo information in the image.
