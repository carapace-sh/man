name: create-inference-component
description: Creates an inference component, which is a SageMaker AI hosting object that you can use to deploy a model to an endpoint.
flags:
    --endpoint-name=!: The name of an existing endpoint where you host the inference component.
    --inference-component-name=!: A unique name to assign to the inference component.
    --runtime-config=: Runtime settings for a model that is deployed with an inference component.
    --specification=!: Details about the resources to deploy with this inference component, including the model, container, and compute resources.
    --tags=: A list of key-value pairs associated with the model.
    --variant-name=: The name of an existing production variant where you host the inference component.
documentation:
    command: Creates an inference component, which is a SageMaker AI hosting object that you can use to deploy a model to an endpoint. In the inference component settings, you specify the model, the endpoint, and how the model utilizes the resources that the endpoint hosts. You can optimize resource utilization by tailoring how the required CPU cores, accelerators, and memory are allocated. You can deploy multiple inference components to an endpoint, where each inference component contains one model and the resource utilization needs for that individual model. After you deploy an inference component, you can directly invoke the associated model when you use the InvokeEndpoint API action.
    flag:
        endpoint-name: The name of an existing endpoint where you host the inference component.
        inference-component-name: A unique name to assign to the inference component.
        runtime-config: Runtime settings for a model that is deployed with an inference component.
        specification: Details about the resources to deploy with this inference component, including the model, container, and compute resources.
        tags: A list of key-value pairs associated with the model. For more information, see [Tagging Amazon Web Services resources](https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html) in the *Amazon Web Services General Reference*.
        variant-name: The name of an existing production variant where you host the inference component.
