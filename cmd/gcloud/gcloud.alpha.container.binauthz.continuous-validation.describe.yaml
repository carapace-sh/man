name: describe
description: '*(ALPHA)*  Show the configuration of Binary Authorization Continuous Validation for the project.'
documentation:
    command: |-
        *(ALPHA)*  The output will contain "enabled: true" if Continuous Validation is enabled
        for the project, or "enabled: false" if CV is disabled.

        ## EXAMPLES

          $ gcloud alpha container binauthz continuous-validation describe
          enforcementPolicyConfig:
            enabled: true
          name: projects/my-project/continuousValidationConfig
          updateTime: '2020-01-01T01:23:45.678901234Z'
