name: enable-enforce
description: '*(BETA)*  Turns on enforcement of boolean Organization Policy constraint.'
flags:
    --folder=: Folder ID.
    --organization=: Organization ID.
documentation:
    command: |-
        *(BETA)*  Turns on enforcement of a boolean Organization Policy constraint at
        the specified resource.

        ## EXAMPLES

        The following command enables enforcement of the Organization Policy boolean
        constraint `compute.disableSerialPortAccess` on project `foo-project`:

          $ gcloud beta resource-manager org-policies enable-enforce compute.disableSerialPortAccess --project=foo-project
    flag:
        folder: Folder ID.
        organization: Organization ID.
