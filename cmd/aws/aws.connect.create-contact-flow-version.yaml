name: create-contact-flow-version
description: Publishes a new version of the flow provided.
flags:
    --contact-flow-id=!: The identifier of the flow.
    --contact-flow-version=: The identifier of the flow version.
    --description=: The description of the flow version.
    --flow-content-sha256=: Indicates the checksum value of the flow content.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --last-modified-region=: The Amazon Web Services Region where this resource was last modified.
    --last-modified-time=: The Amazon Web Services Region where this resource was last modified.
documentation:
    command: Publishes a new version of the flow provided. Versions are immutable and monotonically increasing. If the `FlowContentSha256` provided is different from the `FlowContentSha256` of the `$LATEST` published flow content, then an error is returned. This API only supports creating versions for flows of type `Campaign`.
    flag:
        contact-flow-id: The identifier of the flow.
        contact-flow-version: The identifier of the flow version.
        description: The description of the flow version.
        flow-content-sha256: Indicates the checksum value of the flow content.
        instance-id: The identifier of the Amazon Connect instance.
        last-modified-region: The Amazon Web Services Region where this resource was last modified.
        last-modified-time: The Amazon Web Services Region where this resource was last modified.
