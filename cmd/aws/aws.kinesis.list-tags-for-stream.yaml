name: list-tags-for-stream
description: Lists the tags for the specified Kinesis data stream.
flags:
    --exclusive-start-tag-key=: The key to use as the starting point for the list of tags.
    --limit=: The number of tags to return.
    --stream-arn=: The ARN of the stream.
    --stream-name=: The name of the stream.
documentation:
    command: |-
        Lists the tags for the specified Kinesis data stream. This operation has a limit of five transactions per second per account.

        When invoking this API, you must use either the `StreamARN` or the `StreamName` parameter, or both. It is recommended that you use the `StreamARN` input parameter when you invoke this API.
    flag:
        exclusive-start-tag-key: The key to use as the starting point for the list of tags. If this parameter is set, `ListTagsForStream` gets all tags that occur after `ExclusiveStartTagKey`.
        limit: The number of tags to return. If this number is less than the total number of tags associated with the stream, `HasMoreTags` is set to `true`. To list additional tags, set `ExclusiveStartTagKey` to the last key in the response.
        stream-arn: The ARN of the stream.
        stream-name: The name of the stream.
