name: disassociate-whats-app-business-account
description: Disassociate a WhatsApp Business Account (WABA) from your Amazon Web Services account.
flags:
    --id=!: The unique identifier of your WhatsApp Business Account.
documentation:
    command: Disassociate a WhatsApp Business Account (WABA) from your Amazon Web Services account.
    flag:
        id: The unique identifier of your WhatsApp Business Account. WABA identifiers are formatted as `waba-01234567890123456789012345678901`. Use [ListLinkedWhatsAppBusinessAccounts](https://docs.aws.amazon.com/social-messaging/latest/APIReference/API_ListLinkedWhatsAppBusinessAccounts.html) to list all WABAs and their details.
