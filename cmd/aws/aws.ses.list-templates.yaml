name: list-templates
description: Lists the email templates present in your Amazon SES account in the current Amazon Web Services Region.
flags:
    --max-items=: The maximum number of templates to return.
    --next-token=: A token returned from a previous call to `ListTemplates` to indicate the position in the list of email templates.
documentation:
    command: |-
        Lists the email templates present in your Amazon SES account in the current Amazon Web Services Region.

        You can execute this operation no more than once per second.
    flag:
        max-items: The maximum number of templates to return. This value must be at least 1 and less than or equal to 100. If more than 100 items are requested, the page size will automatically set to 100. If you do not specify a value, 10 is the default page size.
        next-token: A token returned from a previous call to `ListTemplates` to indicate the position in the list of email templates.
