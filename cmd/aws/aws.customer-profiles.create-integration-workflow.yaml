name: create-integration-workflow
description: Creates an integration workflow.
flags:
    --domain-name=!: The unique name of the domain.
    --integration-config=!: Configuration data for integration workflow.
    --object-type-name=!: The name of the profile object type.
    --role-arn=!: The Amazon Resource Name (ARN) of the IAM role.
    --tags=: The tags used to organize, track, or control access for this resource.
    --workflow-type=!: The type of workflow.
completion:
    flag:
        workflow-type:
            - APPFLOW_INTEGRATION
documentation:
    command: Creates an integration workflow. An integration workflow is an async process which ingests historic data and sets up an integration for ongoing updates. The supported Amazon AppFlow sources are Salesforce, ServiceNow, and Marketo.
    flag:
        domain-name: The unique name of the domain.
        integration-config: Configuration data for integration workflow.
        object-type-name: The name of the profile object type.
        role-arn: The Amazon Resource Name (ARN) of the IAM role. Customer Profiles assumes this role to create resources on your behalf as part of workflow execution.
        tags: The tags used to organize, track, or control access for this resource.
        workflow-type: The type of workflow. The only supported value is APPFLOW\_INTEGRATION.
