name: describe
description: '*(BETA)*  Describe a Compute Engine organization security policy rule.'
flags:
    --organization=: Organization which the organization security policy belongs to.
    --security-policy=!: short name of the security policy into which the rule should be described.
documentation:
    command: '*(BETA)*  *gcloud beta compute org-security-policies rules describe* is used to describe organization security policy rule.'
    flag:
        organization: Organization which the organization security policy belongs to. Must be set if SECURITY_POLICY is short name.
        security-policy: short name of the security policy into which the rule should be described.
