name: get-transfer-parameters
description: '*(REMOVED)*  Get transfer parameters of a specific domain.'
hidden: true
documentation:
    command: |-
        *(REMOVED)*  Get transfer parameters of a specific domain.

        This command has been removed. See https://cloud.google.com/domains/docs/deprecations/feature-deprecations.

        Get parameters needed to transfer an existing domain from a different
        registrar. The parameters include the current registrar, name servers,
        transfer lock state, price, and supported privacy modes.

        ## EXAMPLES

        To check if ``example.com'' is available for transfer, run:

          $ gcloud domains registrations get-transfer-parameters example.com
