name: start-engagement-from-opportunity-task
description: Similar to `StartEngagementByAcceptingInvitationTask`, this action is asynchronous and performs multiple steps before completion.
flags:
    --aws-submission=!: ""
    --catalog=!: Specifies the catalog in which the engagement is tracked.
    --client-token=!: A unique token provided by the client to help ensure the idempotency of the request.
    --identifier=!: The unique identifier of the opportunity from which the engagement task is to be initiated.
    --tags=: A map of the key-value pairs of the tag or tags to assign.
documentation:
    command: Similar to `StartEngagementByAcceptingInvitationTask`, this action is asynchronous and performs multiple steps before completion. This action orchestrates a comprehensive workflow that combines multiple API operations into a single task to create and initiate an engagement from an existing opportunity. It automatically executes a sequence of operations including `GetOpportunity`, `CreateEngagement` (if it doesn't exist), `CreateResourceSnapshot`, `CreateResourceSnapshotJob`, `CreateEngagementInvitation` (if not already invited/accepted), and `SubmitOpportunity`.
    flag:
        aws-submission: ""
        catalog: Specifies the catalog in which the engagement is tracked. Acceptable values include `AWS` for production and `Sandbox` for testing environments.
        client-token: A unique token provided by the client to help ensure the idempotency of the request. It helps prevent the same task from being performed multiple times.
        identifier: The unique identifier of the opportunity from which the engagement task is to be initiated. This helps ensure that the task is applied to the correct opportunity.
        tags: A map of the key-value pairs of the tag or tags to assign.
