name: set
description: Sets configuration of the Policy Controller components.
flags:
    --all-memberships: If supplied, apply to all Policy Controllers memberships in the fleet.
    --effect=: Applies only to "toleration" property.
    --location=: Location for the memberships.
    --memberships=!: IDs of the memberships or fully qualified identifiers for the memberships.
    --no-all-memberships&: If supplied, apply to all Policy Controllers memberships in the fleet.
completion:
    flag:
        effect:
            - NoSchedule
            - PreferNoSchedule
            - NoExecute
documentation:
    command: |-
        Customizes on-cluster components of Policy Controller. Supported
        properties may be set with this command, or removed with 'remove'. These
        components are managed as individual kubernetes deployments (e.g. 'admission')
        in the gatekeeper-system namespace.

        When setting cpu or memory limits and requests, Kubernetes-standard resource
        units are used.

        All properties set using this command will overwrite previous properties, with
        the exception of tolerations which can only be added, and any number may be
        added. To edit a toleration, use 'remove' to first delete it, and then 'set'
        the desired toleration.

        ## EXAMPLES

        To set the replica count for a component:

          $ gcloud container hub policycontroller deployment set admission replica-count 3

        To set the replica count for a component across all fleet memberships:

          $ gcloud container hub policycontroller deployment set admission replica-count 3 --all-memberships

        To set a toleration with key 'my-key' on a component (which is an 'Exists'
        operator):

          $ gcloud container hub policycontroller deployment set admission toleration my-key

        To set a toleration with key 'my-key' and 'my-value' on a component (which is
        an 'Equal' operator):

          $ gcloud container hub policycontroller deployment set admission toleration my-key=my-value

        To set a toleration with key 'my-key' and 'my-value' on a component, along
        with the effect 'NoSchedule' (which is an 'Equal' operator):

          $ gcloud container hub policycontroller deployment set admission toleration my-key=my-value --effect=NoSchedule

        To set a memory limit:

          $ gcloud container hub policycontroller deployment set audit memory-limit 4Gi

        To set a memory request:

          $ gcloud container hub policycontroller deployment set mutation memory-request 2Gi

        To set a cpu limit:

          $ gcloud container hub policycontroller deployment set admission cpu-limit 500m

        To set a cpu request:

          $ gcloud container hub policycontroller deployment set audit cpu-request 250m

        To set anti-affinity to achieve high availability on the mutation deployment:

          $ gcloud container hub policycontroller deployment set mutation pod-affinity anti
    flag:
        all-memberships: If supplied, apply to all Policy Controllers memberships in the fleet.
        effect: 'Applies only to "toleration" property. _EFFECT_ must be one of: *NoSchedule*, *PreferNoSchedule*, *NoExecute*.'
        location: |-
            Location for the memberships.
            +
            To set the `location` attribute:
            * provide the argument `--memberships` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkehub/location`.
        memberships: |-
            IDs of the memberships or fully qualified identifiers for the memberships.
            +
            To set the `memberships` attribute:
            * provide the argument `--memberships` on the command line.
        no-all-memberships: If supplied, apply to all Policy Controllers memberships in the fleet.
