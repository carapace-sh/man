name: get-tokens-from-refresh-token
description: Given a refresh token, issues new ID, access, and optionally refresh tokens for the user who owns the submitted token.
flags:
    --client-id=!: The app client that issued the refresh token to the user who wants to request new tokens.
    --client-metadata=: A map of custom key-value pairs that you can provide as input for certain custom workflows that this action triggers.
    --client-secret=: The client secret of the requested app client, if the client has a secret.
    --device-key=: When you enable device remembering, Amazon Cognito issues a device key that you can use for device authentication that bypasses multi-factor authentication (MFA).
    --refresh-token=!: A valid refresh token that can authorize the request for new tokens.
documentation:
    command: Given a refresh token, issues new ID, access, and optionally refresh tokens for the user who owns the submitted token. This operation issues a new refresh token and invalidates the original refresh token after an optional grace period when refresh token rotation is enabled. If refresh token rotation is disabled, issues new ID and access tokens only.
    flag:
        client-id: The app client that issued the refresh token to the user who wants to request new tokens.
        client-metadata: |-
            A map of custom key-value pairs that you can provide as input for certain custom workflows that this action triggers.

            You create custom workflows by assigning Lambda functions to user pool triggers. When you use the `GetTokensFromRefreshToken` API action, Amazon Cognito invokes the Lambda function the pre token generation trigger.

            For more information, see [Using Lambda triggers](https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-identity-pools-working-with-aws-lambda-triggers.html) in the *Amazon Cognito Developer Guide*.

            When you use the `ClientMetadata` parameter, note that Amazon Cognito won't do the following:

            - Store the `ClientMetadata` value. This data is available only to Lambda triggers that are assigned to a user pool to support custom workflows. If your user pool configuration doesn't include triggers, the `ClientMetadata` parameter serves no purpose.
            - Validate the `ClientMetadata` value.
            - Encrypt the `ClientMetadata` value. Don't send sensitive information in this parameter.
        client-secret: The client secret of the requested app client, if the client has a secret.
        device-key: |-
            When you enable device remembering, Amazon Cognito issues a device key that you can use for device authentication that bypasses multi-factor authentication (MFA). To implement `GetTokensFromRefreshToken` in a user pool with device remembering, you must capture the device key from the initial authentication request. If your application doesn't provide the key of a registered device, Amazon Cognito issues a new one. You must provide the confirmed device key in this request if device remembering is enabled in your user pool.

            For more information about device remembering, see [Working with devices](https://docs.aws.amazon.com/cognito/latest/developerguide/amazon-cognito-user-pools-device-tracking.html).
        refresh-token: A valid refresh token that can authorize the request for new tokens. When refresh token rotation is active in the requested app client, this token is invalidated after the request is complete and after an optional grace period.
