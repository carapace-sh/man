name: get-images
description: Retrieves a list of images corresponding to each timestamp for a given time range, sampling interval, and image format configuration.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --end-timestamp=!: The end timestamp for the range of images to be generated.
    --format-config=: The list of a key-value pair structure that contains extra parameters that can be applied when the image is generated.
    --format=!: The format that will be used to encode the image.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --height-pixels=: The height of the output image that is used in conjunction with the `WidthPixels` parameter.
    --image-selector-type=!: The origin of the Server or Producer timestamps to use to generate the images.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of images to be returned by the API.
    --next-token=: A token that specifies where to start paginating the next set of Images.
    --page-size=: The size of each page to get in the AWS service call.
    --sampling-interval=: The time interval in milliseconds (ms) at which the images need to be generated from the stream.
    --start-timestamp=!: The starting point from which the images should be generated.
    --starting-token=: A token to specify where to start paginating.
    --stream-arn=: The Amazon Resource Name (ARN) of the stream from which to retrieve the images.
    --stream-name=: The name of the stream from which to retrieve the images.
    --width-pixels=: The width of the output image that is used in conjunction with the `HeightPixels` parameter.
completion:
    flag:
        format:
            - JPEG
            - PNG
        image-selector-type:
            - PRODUCER_TIMESTAMP
            - SERVER_TIMESTAMP
documentation:
    command: Retrieves a list of images corresponding to each timestamp for a given time range, sampling interval, and image format configuration.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        end-timestamp: The end timestamp for the range of images to be generated. If the time range between `StartTimestamp` and `EndTimestamp` is more than 300 seconds above `StartTimestamp`, you will receive an `IllegalArgumentException`.
        format: The format that will be used to encode the image.
        format-config: The list of a key-value pair structure that contains extra parameters that can be applied when the image is generated. The `FormatConfig` key is the `JPEGQuality`, which indicates the JPEG quality key to be used to generate the image. The `FormatConfig` value accepts ints from 1 to 100. If the value is 1, the image will be generated with less quality and the best compression. If the value is 100, the image will be generated with the best quality and less compression. If no value is provided, the default value of the `JPEGQuality` key will be set to 80.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        height-pixels: The height of the output image that is used in conjunction with the `WidthPixels` parameter. When both `HeightPixels` and `WidthPixels` parameters are provided, the image will be stretched to fit the specified aspect ratio. If only the `HeightPixels` parameter is provided, its original aspect ratio will be used to calculate the `WidthPixels` ratio. If neither parameter is provided, the original image size will be returned.
        image-selector-type: The origin of the Server or Producer timestamps to use to generate the images.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: |-
            The maximum number of images to be returned by the API.

            The default limit is 25 images per API response. Providing a `MaxResults` greater than this value will result in a page size of 25. Any additional results will be paginated.
        next-token: A token that specifies where to start paginating the next set of Images. This is the `GetImages:NextToken` from a previously truncated response.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        sampling-interval: The time interval in milliseconds (ms) at which the images need to be generated from the stream. The minimum value that can be provided is 200 ms (5 images per second). If the timestamp range is less than the sampling interval, the image from the `startTimestamp` will be returned if available.
        start-timestamp: The starting point from which the images should be generated. This `StartTimestamp` must be within an inclusive range of timestamps for an image to be returned.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        stream-arn: The Amazon Resource Name (ARN) of the stream from which to retrieve the images. You must specify either the `StreamName` or the `StreamARN`.
        stream-name: The name of the stream from which to retrieve the images. You must specify either the `StreamName` or the `StreamARN`.
        width-pixels: The width of the output image that is used in conjunction with the `HeightPixels` parameter. When both `WidthPixels` and `HeightPixels` parameters are provided, the image will be stretched to fit the specified aspect ratio. If only the `WidthPixels` parameter is provided or if only the `HeightPixels` is provided, a `ValidationException` will be thrown. If neither parameter is provided, the original image size from the stream will be returned.
