name: update-options
description: Update pipeline options on-the-fly for running Dataflow jobs.
flags:
    --max-num-workers=: Upper-bound for autoscaling, between 1-1000.
    --min-num-workers=: Lower-bound for autoscaling, between 1-1000.
    --no-unset-worker-utilization-hint&: Unset --worker-utilization-hint.
    --region=: Region ID of the job's regional endpoint.
    --unset-worker-utilization-hint: Unset --worker-utilization-hint.
    --worker-utilization-hint=: Target CPU utilization for autoscaling, ranging from 0.1 to 0.9. Only supported for streaming-engine jobs with autoscaling enabled.
documentation:
    command: |-
        This command can modify properties of running Dataflow jobs. Currently, only
        updating autoscaling settings for Streaming Engine jobs is supported.

        Adjust the autoscaling settings for Streaming Engine Dataflow jobs by
        providing at-least one of --min-num-workers or --max-num-workers or
        --worker-utilization-hint (or all 3), or --unset-worker-utilization-hint
        (which cannot be run at the same time as --worker-utilization-hint but works
        with the others).
        Allow a few minutes for the changes to take effect.

        Note that autoscaling settings can only be modified on-the-fly for Streaming
        Engine jobs. Attempts to modify batch job or Streaming Appliance jobs will
        fail.


        ## EXAMPLES

        Modify autoscaling settings to scale between 5-10 workers:

          $ gcloud dataflow jobs update-options --min-num-workers=5 --max-num-workers=10

        Require a job to use at least 2 workers:

          $ gcloud dataflow jobs update-options --min-num-workers=2

        Require a job to use at most 20 workers:

          $ gcloud dataflow jobs update-options --max-num-workers=20

        Adjust the hint of target worker utilization to 70% for horizontal
        autoscaling:

          $ gcloud dataflow jobs update-options --worker-utilization-hint=0.7

        "Unset" worker utilization hint so that horizontal scaling will rely on its
        default CPU utilization target:

          $ gcloud dataflow jobs update-options --unset-worker-utilization-hint
    flag:
        max-num-workers: Upper-bound for autoscaling, between 1-1000. Only supported for streaming-engine jobs.
        min-num-workers: Lower-bound for autoscaling, between 1-1000. Only supported for streaming-engine jobs.
        no-unset-worker-utilization-hint: Unset --worker-utilization-hint. This causes the job autoscaling to fall back to internal tunings if they exist, or otherwise use the default hint value.
        region: Region ID of the job's regional endpoint. Defaults to 'us-central1'.
        unset-worker-utilization-hint: Unset --worker-utilization-hint. This causes the job autoscaling to fall back to internal tunings if they exist, or otherwise use the default hint value.
        worker-utilization-hint: Target CPU utilization for autoscaling, ranging from 0.1 to 0.9. Only supported for streaming-engine jobs with autoscaling enabled.
