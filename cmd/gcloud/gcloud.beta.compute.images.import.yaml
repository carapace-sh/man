documentation:
    command: |4
        *(BETA)*  *(DEPRECATED)*  This command is being deprecated. Instead, use the `gcloud migration vms image-imports` command. For more information, see https://cloud.google.com/migrate/virtual-machines/docs/5.0/migrate/image_import.


        *gcloud beta compute images import* imports Virtual Disk images, such as VMWare VMDK files
        and VHD files, into Compute Engine.

        Importing images involves four steps:
        *  Upload the virtual disk file to Cloud Storage.
        *  Import the image to Compute Engine.
        *  Detect the OS and bootloader contained on the disk.
        *  Translate the image to make a bootable image.
        This command performs all four of these steps as required,
        depending on the input arguments specified.

        Before importing an image, set up access to Cloud Storage and grant
        required roles to the user accounts and service accounts. For more
        information, see [](https://cloud.google.com/compute/docs/import/requirements-export-import-images).

        To override the detected OS, specify the `--os` flag.
        You can omit the translation step using the `--data-disk` flag.

        If you exported your disk from Compute Engine then you don't
        need to re-import it. Instead, use `gcloud beta compute images create`
        to create more images from the disk.

        Files stored on Cloud Storage and images in Compute Engine incur
        charges. See [](https://cloud.google.com/compute/docs/images/importing-virtual-disks#resource_cleanup).

        Troubleshooting: Image import/export tools rely on CloudBuild default
        behavior. They has been using the default CloudBuild service account in
        order to import/export images to/from Google Cloud Platform. However,
        Cloud Build has changed this default behavior and in new projects a
        custom user managed service account may need to be provided to perform
        the builds. If you get a CloudBuild service account related error, run
        gcloud with --cloudbuild-service-account=<custom service account>.
        See `gcloud compute images import --help` for details.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        aws-access-key-id: |-
            Access key ID for a temporary AWS credential.
            This ID must be generated using the AWS Security Token Service.
        aws-ami-export-location: |-
            An AWS S3 bucket location where the converted image file can be
            temporarily exported to before the import to Cloud Storage.
        aws-ami-id: AWS AMI ID of the image to import.
        aws-region: AWS region of the image that you want to import.
        aws-secret-access-key: |-
            Secret access key for a temporary AWS credential.
            This key must be generated using the AWS Security Token Service.
        aws-session-token: |-
            Session token for a temporary AWS credential. This session
            token must be generated using the AWS Security Token Service.
        aws-source-ami-file-path: |-
            S3 resource path of the exported image file that you want
            to import.
        byol: |-
            Specifies that you want to import an image with an existing license.
            Importing an image with an existing license is known as bring your
            own license (BYOL).
            +
            `--byol` can be specified in any of the following ways:
            +
               + `--byol --os=rhel-8`: imports a RHEL 8 image with an existing license.
               + `--os=rhel-8-byol`: imports a RHEL 8 image with an existing license.
               + `--byol`: detects the OS contained on the disk, and imports
                  the image with an existing license.
            +
            For more information about BYOL, see:
            https://cloud.google.com/compute/docs/nodes/bringing-your-own-licenses
        cloudbuild-service-account: |-
            Image import and export tools use Cloud Build to import and export images
            to and from your project.
            Cloud Build uses a specific service account to execute builds on your
            behalf.
            The Cloud Build service account generates an access token for other service
            accounts and it is also used for authentication when building the artifacts
            for the image import tool.
            +
            Use this flag to to specify a user-managed service account for
            image import and export. If you don't specify this flag, Cloud Build
            runs using your project's default Cloud Build service account.
            To set this option, specify the email address of the desired
            user-managed service account.
            Note: You must specify the `--logs-location` flag when
            you set a user-managed service account.
            +
            At minimum, the specified user-managed service account needs to have
            the following roles assigned:
            +
            * roles/compute.admin
            * roles/iam.serviceAccountTokenCreator
            * roles/iam.serviceAccountUser
        cmd-deprecated: |-
            The command you're using is deprecated and will be removed by December 31,
            2025. We recommend using `gcloud compute migration image-imports` instead.
            See our official documentation for more information.
            https://cloud.google.com/migrate/virtual-machines/docs/5.0/migrate/image_import.
        compute-service-account: |-
            A temporary virtual machine instance is created in your project during
            image import.  Image import tooling on this temporary instance
            must be authenticated.
            +
            A Compute Engine service account is an identity attached to an instance.
            Its access tokens can be accessed through the instance metadata server
            and can be used to authenticate image import tooling on the instance.
            +
            To set this option,  specify the email address corresponding to the
            required Compute Engine service account. If not provided, the
            image import on the temporary instance uses the project's default Compute
            Engine service account.
            +
            At a minimum, you need to grant the following roles to the
            specified Cloud Build service account:
            +
            * roles/compute.storageAdmin
            * roles/storage.objectViewer
        custom-workflow: |-
            Specifies a custom workflow to use for image translation. Workflow
            should be relative to the image_import directory here: [](https://github.com/GoogleCloudPlatform/compute-image-import/tree/main/daisy_workflows/image_import).
            For example: `debian/translate_debian_9.wf.json'
        data-disk: Specifies that the disk has no bootable OS installed on it. Imports the disk without making it bootable or installing Google tools on it.
        description: Description to set for the imported image.
        docker-image-tag: |
            Specify which docker image tag (of tools from compute-image-tools)
            should be used for this command. By default it's "release", while
            "latest" is supported as well. There may be more versions supported in
            the future.
        family: Family to set for the imported image.
        guest-environment: Installs the guest environment on the image. See https://cloud.google.com/compute/docs/images/guest-environment. Enabled by default, use *--no-guest-environment* to disable.
        guest-os-features: |-
            Enables one or more features for VM instances that use the
            image for their boot disks. See the descriptions of supported features at:
            https://cloud.google.com/compute/docs/images/create-delete-deprecate-private-images#guest-os-features. _GUEST_OS_FEATURE_ must be (only one value is supported): *UEFI_COMPATIBLE*.
        log-location: Directory in Cloud Storage to hold build logs. If not set, ```gs://<project num>.cloudbuild-logs.googleusercontent.com/``` is created and used.
        network: Name of the network in your project to use for the image import. When you import an image, the import tool creates and uses temporary VMs in your project for the import process. Use this flag to specify the network to use for these temporary VMs.
        no-address: |-
            Temporary VMs are created in your project during image import. Set
            this flag so that these temporary VMs are not assigned external IP
            addresses.
            +
            Note: The image import process requires package managers to be
            installed on the operating system for the virtual disk. These package
            managers might need to make requests to package repositories that are
            outside Google Cloud. To allow access for these updates, you need to
            configure Cloud NAT and Private Google Access.
             For more information, see https://cloud.google.com/compute/docs/import/importing-virtual-disks#no-external-ip.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-byol: |-
            Specifies that you want to import an image with an existing license.
            Importing an image with an existing license is known as bring your
            own license (BYOL).

            `--byol` can be specified in any of the following ways:

               + `--byol --os=rhel-8`: imports a RHEL 8 image with an existing license.
               + `--os=rhel-8-byol`: imports a RHEL 8 image with an existing license.
               + `--byol`: detects the OS contained on the disk, and imports
                  the image with an existing license.

            For more information about BYOL, see:
            https://cloud.google.com/compute/docs/nodes/bringing-your-own-licenses
        no-cmd-deprecated: |
            The command you're using is deprecated and will be removed by December 31,
            2025. We recommend using `gcloud compute migration image-imports` instead.
            See our official documentation for more information.
            https://cloud.google.com/migrate/virtual-machines/docs/5.0/migrate/image_import.
        no-data-disk: Specifies that the disk has no bootable OS installed on it. Imports the disk without making it bootable or installing Google tools on it.
        no-guest-environment: Installs the guest environment on the image. See https://cloud.google.com/compute/docs/images/guest-environment.
        no-sysprep-windows: Whether to generalize the image using Windows Sysprep.
        os: 'Specifies the OS of the disk image being imported. _OS_ must be one of: *centos-7*, *centos-stream-8*, *centos-stream-9*, *debian-10*, *debian-11*, *debian-8*, *debian-9*, *opensuse-15*, *rhel-6*, *rhel-6-byol*, *rhel-7*, *rhel-7-byol*, *rhel-8*, *rhel-8-byol*, *rhel-9*, *rhel-9-byol*, *rocky-8*, *rocky-9*, *sles-12*, *sles-12-byol*, *sles-15*, *sles-15-byol*, *sles-sap-12*, *sles-sap-12-byol*, *sles-sap-15*, *sles-sap-15-byol*, *ubuntu-1404*, *ubuntu-1604*, *ubuntu-1804*, *ubuntu-2004*, *ubuntu-2204*, *windows-10-x64-byol*, *windows-10-x86-byol*, *windows-11-x64-byol*, *windows-2008r2*, *windows-2008r2-byol*, *windows-2012*, *windows-2012-byol*, *windows-2012r2*, *windows-2012r2-byol*, *windows-2016*, *windows-2016-byol*, *windows-2019*, *windows-2019-byol*, *windows-2022*, *windows-2022-byol*, *windows-7-x64-byol*, *windows-7-x86-byol*, *windows-8-x64-byol*, *windows-8-x86-byol*.'
        source-file: |-
            A local file, or the Cloud Storage URI of the virtual
                          disk file to import. For example: ``gs://my-bucket/my-image.vmdk''
                          or ``./my-local-image.vmdk''. For more information about Cloud
                        Storage URIs, see
                        https://cloud.google.com/storage/docs/request-endpoints#json-api.
        source-image: An existing Compute Engine image from which to import.
        storage-location: |-
            Specifies a Cloud Storage location, either regional or multi-regional,
            where image content is to be stored. If not specified, the multi-region
            location closest to the source is chosen automatically.
        subnet: |-
            Name of the subnetwork in your project to use for the image import. When
            you import an image, the import tool creates and uses temporary VMs in
            your project for the import process. Use this flag to specify the
            subnetwork to use for these temporary VMs.
                * If the network resource is in legacy mode, do not provide this
                  property.
                * If the network is in auto subnet mode, specifying the subnetwork is
                  optional.
                * If the network is in custom subnet mode, then this field must be
                  specified.
        sysprep-windows: Whether to generalize the image using Windows Sysprep.
        timeout: |-
            Maximum time an import can last before it fails as "TIMEOUT". For example, if
            you specify `2h`, the process fails after 2 hours.
            See $ gcloud topic datetimes for information about duration formats.
            +
            This timeout option has a maximum value of 24 hours.
            +
            If you are importing a large image that takes longer than 24 hours to
            import, either use the RAW disk format to reduce the time needed for
            converting the image, or split the data into several smaller images.
        zone: Zone to use when importing the image. When you import an image, the import tool creates and uses temporary VMs in your project for the import process. Use this flag to specify the zone to use for these temporary VMs. Overrides the default *compute/zone* property value for this command invocation.
