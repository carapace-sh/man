name: describe-maintenance-window-targets
description: Lists the targets registered with the maintenance window.
flags:
    --filters=: Optional filters that can be used to narrow down the scope of the returned window targets.
    --max-results=: The maximum number of items to return for this call.
    --next-token=: The token for the next set of items to return.
    --window-id=!: The ID of the maintenance window whose targets should be retrieved.
documentation:
    command: Lists the targets registered with the maintenance window.
    flag:
        filters: Optional filters that can be used to narrow down the scope of the returned window targets. The supported filter keys are `Type`, `WindowTargetId`, and `OwnerInformation`.
        max-results: The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
        window-id: The ID of the maintenance window whose targets should be retrieved.
