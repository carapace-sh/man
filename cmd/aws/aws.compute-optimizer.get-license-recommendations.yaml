name: get-license-recommendations
description: Returns license recommendations for Amazon EC2 instances that run on a specific license.
flags:
    --account-ids=: The ID of the Amazon Web Services account for which to return license recommendations.
    --filters=: An array of objects to specify a filter that returns a more specific list of license recommendations.
    --max-results=: The maximum number of license recommendations to return with a single request.
    --next-token=: The token to advance to the next page of license recommendations.
    --resource-arns=: The ARN that identifies the Amazon EC2 instance.
documentation:
    command: |-
        Returns license recommendations for Amazon EC2 instances that run on a specific license.

        Compute Optimizer generates recommendations for licenses that meet a specific set of requirements. For more information, see the [Supported resources and requirements](https://docs.aws.amazon.com/compute-optimizer/latest/ug/requirements.html) in the *Compute Optimizer User Guide*.
    flag:
        account-ids: |-
            The ID of the Amazon Web Services account for which to return license recommendations.

            If your account is the management account of an organization, use this parameter to specify the member account for which you want to return license recommendations.

            Only one account ID can be specified per request.
        filters: An array of objects to specify a filter that returns a more specific list of license recommendations.
        max-results: |-
            The maximum number of license recommendations to return with a single request.

            To retrieve the remaining results, make another request with the returned `nextToken` value.
        next-token: The token to advance to the next page of license recommendations.
        resource-arns: |-
            The ARN that identifies the Amazon EC2 instance.

            The following is the format of the ARN:

            `arn:aws:ec2:region:aws_account_id:instance/instance-id`
