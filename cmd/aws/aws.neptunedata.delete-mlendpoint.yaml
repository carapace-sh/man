name: delete-mlendpoint
description: Cancels the creation of a Neptune ML inference endpoint.
flags:
    --clean: If this flag is set to `TRUE`, all Neptune ML S3 artifacts should be deleted when the job is stopped.
    --id=!: The unique identifier of the inference endpoint.
    --neptune-iam-role-arn=: The ARN of an IAM role providing Neptune access to SageMaker and Amazon S3 resources.
    --no-clean: If this flag is set to `TRUE`, all Neptune ML S3 artifacts should be deleted when the job is stopped.
documentation:
    command: |-
        Cancels the creation of a Neptune ML inference endpoint. See [Managing inference endpoints using the endpoints command](https://docs.aws.amazon.com/neptune/latest/userguide/machine-learning-api-endpoints.html).

        When invoking this operation in a Neptune cluster that has IAM authentication enabled, the IAM user or role making the request must have a policy attached that allows the [neptune-db:DeleteMLEndpoint](https://docs.aws.amazon.com/neptune/latest/userguide/iam-dp-actions.html#deletemlendpoint) IAM action in that cluster.
    flag:
        clean: If this flag is set to `TRUE`, all Neptune ML S3 artifacts should be deleted when the job is stopped. The default is `FALSE`.
        id: The unique identifier of the inference endpoint.
        neptune-iam-role-arn: The ARN of an IAM role providing Neptune access to SageMaker and Amazon S3 resources. This must be listed in your DB cluster parameter group or an error will be thrown.
