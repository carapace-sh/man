name: start-calculation-execution
description: Submits calculations for execution within a session.
flags:
    --calculation-configuration=: Contains configuration information for the calculation.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=: A unique case-sensitive string used to ensure the request to create the calculation is idempotent (executes only once).
    --code-block=: A string that contains the code of the calculation.
    --description=: A description of the calculation.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --session-id=!: The session ID.
documentation:
    command: |-
        Submits calculations for execution within a session. You can supply the code to run as an inline code block within the request.

        The request syntax requires the [StartCalculationExecutionRequest$CodeBlock]() parameter or the [CalculationConfiguration$CodeBlock]() parameter, but not both. Because [CalculationConfiguration$CodeBlock]() is deprecated, use the [StartCalculationExecutionRequest$CodeBlock]() parameter instead.
    flag:
        calculation-configuration: Contains configuration information for the calculation.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: |-
            A unique case-sensitive string used to ensure the request to create the calculation is idempotent (executes only once). If another `StartCalculationExecutionRequest` is received, the same response is returned and another calculation is not created. If a parameter has changed, an error is returned.

            This token is listed as not required because Amazon Web Services SDKs (for example the Amazon Web Services SDK for Java) auto-generate the token for users. If you are not using the Amazon Web Services SDK or the Amazon Web Services CLI, you must provide this token or the action will fail.
        code-block: A string that contains the code of the calculation. Use this parameter instead of [CalculationConfiguration$CodeBlock](), which is deprecated.
        description: A description of the calculation.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        session-id: The session ID.
