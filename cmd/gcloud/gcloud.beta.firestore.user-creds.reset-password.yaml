name: reset-password
description: '*(BETA)*  Resets a Cloud Firestore user creds.'
flags:
    --database=!: The database to operate on.
documentation:
    command: |-
        ## EXAMPLES

        To reset password for user creds 'test-user-creds-id' under database testdb.

            $ gcloud beta firestore user-creds reset-password test-user-creds-id --database='testdb'
    flag:
        database: |-
            The database to operate on.
            +
            For example, to operate on database `foo`:
            +
              $ {command} --database='foo'
