name: list-tags-for-resource
description: List all tags for an accelerator.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the accelerator to list tags for.
documentation:
    command: |-
        List all tags for an accelerator.

        For more information, see [Tagging in Global Accelerator](https://docs.aws.amazon.com/global-accelerator/latest/dg/tagging-in-global-accelerator.html) in the *Global Accelerator Developer Guide*.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the accelerator to list tags for. An ARN uniquely identifies an accelerator.
