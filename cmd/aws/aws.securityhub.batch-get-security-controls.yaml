name: batch-get-security-controls
description: Provides details about a batch of security controls for the current Amazon Web Services account and Amazon Web Services Region.
flags:
    --security-control-ids=!: A list of security controls (identified with `SecurityControlId`, `SecurityControlArn`, or a mix of both parameters).
documentation:
    command: Provides details about a batch of security controls for the current Amazon Web Services account and Amazon Web Services Region.
    flag:
        security-control-ids: A list of security controls (identified with `SecurityControlId`, `SecurityControlArn`, or a mix of both parameters). The security control ID or Amazon Resource Name (ARN) is the same across standards.
