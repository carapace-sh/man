name: create-environment-membership
description: Adds an environment member to an Cloud9 development environment.
flags:
    --environment-id=!: The ID of the environment that contains the environment member you want to add.
    --permissions=!: The type of environment member permissions you want to associate with this environment member.
    --user-arn=!: The Amazon Resource Name (ARN) of the environment member you want to add.
completion:
    flag:
        permissions:
            - read-write
            - read-only
documentation:
    command: |-
        Adds an environment member to an Cloud9 development environment.

        Cloud9 is no longer available to new customers. Existing customers of Cloud9 can continue to use the service as normal. [Learn more"](http://aws.amazon.com/blogs/devops/how-to-migrate-from-aws-cloud9-to-aws-ide-toolkits-or-aws-cloudshell/)
    flag:
        environment-id: The ID of the environment that contains the environment member you want to add.
        permissions: |-
            The type of environment member permissions you want to associate with this environment member. Available values include:

            - `read-only`: Has read-only access to the environment.
            - `read-write`: Has read-write access to the environment.
        user-arn: The Amazon Resource Name (ARN) of the environment member you want to add.
