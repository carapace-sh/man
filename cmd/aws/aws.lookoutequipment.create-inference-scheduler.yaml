name: create-inference-scheduler
description: Creates a scheduled inference.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=!: A unique identifier for the request.
    --data-delay-offset-in-minutes=: The interval (in minutes) of planned delay at the start of each inference segment.
    --data-input-configuration=!: Specifies configuration information for the input data for the inference scheduler, including delimiter, format, and dataset location.
    --data-output-configuration=!: Specifies configuration information for the output results for the inference scheduler, including the S3 location for the output.
    --data-upload-frequency=!: How often data is uploaded to the source Amazon S3 bucket for the input data.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --inference-scheduler-name=!: The name of the inference scheduler being created.
    --model-name=!: The name of the previously trained machine learning model being used to create the inference scheduler.
    --role-arn=!: The Amazon Resource Name (ARN) of a role with permission to access the data source being used for the inference.
    --server-side-kms-key-id=: Provides the identifier of the KMS key used to encrypt inference scheduler data by Amazon Lookout for Equipment.
    --tags=:
        description: Any tags associated with the inference scheduler.
        nargs: -1
completion:
    flag:
        data-upload-frequency:
            - PT5M
            - PT10M
            - PT15M
            - PT30M
            - PT1H
documentation:
    command: Creates a scheduled inference. Scheduling an inference is setting up a continuous real-time inference plan to analyze new measurement data. When setting up the schedule, you provide an S3 bucket location for the input data, assign it a delimiter between separate entries in the data, set an offset delay if desired, and set the frequency of inferencing. You must also provide an S3 bucket location for the output data.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique identifier for the request. If you do not set the client request token, Amazon Lookout for Equipment generates one.
        data-delay-offset-in-minutes: |-
            The interval (in minutes) of planned delay at the start of each inference segment. For example, if inference is set to run every ten minutes, the delay is set to five minutes and the time is 09:08. The inference scheduler will wake up at the configured interval (which, without a delay configured, would be 09:10) plus the additional five minute delay time (so 09:15) to check your Amazon S3 bucket. The delay provides a buffer for you to upload data at the same frequency, so that you don't have to stop and restart the scheduler when uploading new data.

            For more information, see [Understanding the inference process](https://docs.aws.amazon.com/lookout-for-equipment/latest/ug/understanding-inference-process.html).
        data-input-configuration: Specifies configuration information for the input data for the inference scheduler, including delimiter, format, and dataset location.
        data-output-configuration: Specifies configuration information for the output results for the inference scheduler, including the S3 location for the output.
        data-upload-frequency: |-
            How often data is uploaded to the source Amazon S3 bucket for the input data. The value chosen is the length of time between data uploads. For instance, if you select 5 minutes, Amazon Lookout for Equipment will upload the real-time data to the source bucket once every 5 minutes. This frequency also determines how often Amazon Lookout for Equipment runs inference on your data.

            For more information, see [Understanding the inference process](https://docs.aws.amazon.com/lookout-for-equipment/latest/ug/understanding-inference-process.html).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        inference-scheduler-name: The name of the inference scheduler being created.
        model-name: The name of the previously trained machine learning model being used to create the inference scheduler.
        role-arn: The Amazon Resource Name (ARN) of a role with permission to access the data source being used for the inference.
        server-side-kms-key-id: Provides the identifier of the KMS key used to encrypt inference scheduler data by Amazon Lookout for Equipment.
        tags: Any tags associated with the inference scheduler.
