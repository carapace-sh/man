name: delete-gateway
description: Deletes a gateway.
flags:
    --gateway-arn=!: The Amazon Resource Name (ARN) of the gateway that you want to delete.
documentation:
    command: Deletes a gateway. Before you can delete a gateway, you must deregister its instances and delete its bridges.
    flag:
        gateway-arn: The Amazon Resource Name (ARN) of the gateway that you want to delete.
