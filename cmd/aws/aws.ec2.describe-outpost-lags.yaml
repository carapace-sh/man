documentation:
    command: |-
        Describes the Outposts link aggregation groups (LAGs).

        LAGs are only available for second-generation Outposts racks at this time.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            The filters to use for narrowing down the request. The following filters are supported:

            - `service-link-virtual-interface-id` - The ID of the service link virtual interface.
            - `service-link-virtual-interface-arn` - The ARN of the service link virtual interface.
            - `outpost-id` - The Outpost ID.
            - `outpost-arn` - The Outpost ARN.
            - `owner-id` - The ID of the Amazon Web Services account that owns the service link virtual interface.
            - `vlan` - The ID of the address pool.
            - `local-address` - The local address.
            - `peer-address` - The peer address.
            - `peer-bgp-asn` - The peer BGP ASN.
            - `outpost-lag-id` - The Outpost LAG ID.
            - `configuration-state` - The configuration state of the service link virtual interface.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned `nextToken` value.
        next-token: The token for the next page of results.
        outpost-lag-ids: The IDs of the Outpost LAGs.
