name: update-rotation
description: Updates the information specified for an on-call rotation.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --contact-ids=:
        description: The Amazon Resource Names (ARNs) of the contacts to include in the updated rotation.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --recurrence=!: Information about how long the updated rotation lasts before restarting at the beginning of the shift order.
    --rotation-id=!: The Amazon Resource Name (ARN) of the rotation to update.
    --start-time=: The date and time the rotation goes into effect.
    --time-zone-id=: The time zone to base the updated rotation’s activity on, in Internet Assigned Numbers Authority (IANA) format.
documentation:
    command: Updates the information specified for an on-call rotation.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        contact-ids: |-
            The Amazon Resource Names (ARNs) of the contacts to include in the updated rotation.

            Only the `PERSONAL` contact type is supported. The contact types `ESCALATION` and `ONCALL_SCHEDULE` are not supported for this operation.

            The order in which you list the contacts is their shift order in the rotation schedule.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        recurrence: Information about how long the updated rotation lasts before restarting at the beginning of the shift order.
        rotation-id: The Amazon Resource Name (ARN) of the rotation to update.
        start-time: The date and time the rotation goes into effect.
        time-zone-id: |-
            The time zone to base the updated rotation’s activity on, in Internet Assigned Numbers Authority (IANA) format. For example: "America/Los\_Angeles", "UTC", or "Asia/Seoul". For more information, see the [Time Zone Database](https://www.iana.org/time-zones) on the IANA website.

            Designators for time zones that don’t support Daylight Savings Time Rules, such as Pacific Standard Time (PST), aren't supported.
