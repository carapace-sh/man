name: fetch-read-write-token
description: '*(ALPHA)*  Fetch the read/write token of a given gitRepositoryLink.'
flags:
    --connection=: The connection id of the gitRepositoryLink resource.
    --location=: The location id of the gitRepositoryLink resource.
documentation:
    command: |
        *(ALPHA)*  Fetch the read/write token of a given gitRepositoryLink.
    flag:
        connection: |-
            The connection id of the gitRepositoryLink resource.
            +
            To set the `connection` attribute:
            * provide the argument `git_repository_link` on the command line with a fully specified name;
            * provide the argument `--connection` on the command line.
        location: |-
            The location id of the gitRepositoryLink resource.
            +
            To set the `location` attribute:
            * provide the argument `git_repository_link` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
