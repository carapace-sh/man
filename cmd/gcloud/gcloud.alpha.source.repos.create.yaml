name: create
description: '*(ALPHA)*  Create a cloud source repository.'
documentation:
    command: |-
        *(ALPHA)*  This command creates a named git repository for the currently
        active Google Cloud Platform project.

        ## EXAMPLES

        To create a named repository in the current project issue the
        following commands:

          $ gcloud init

          $ gcloud alpha source repos create REPOSITORY_NAME

        Once you push contents to it, they can be browsed in the
        Developers Console.
