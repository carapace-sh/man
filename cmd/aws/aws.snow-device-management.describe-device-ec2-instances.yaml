name: describe-device-ec2-instances
description: Checks the current state of the Amazon EC2 instances.
flags:
    --instance-ids=!: A list of instance IDs associated with the managed device.
    --managed-device-id=!: The ID of the managed device.
documentation:
    command: Checks the current state of the Amazon EC2 instances. The output is similar to `describeDevice`, but the results are sourced from the device cache in the Amazon Web Services Cloud and include a subset of the available fields.
    flag:
        instance-ids: A list of instance IDs associated with the managed device.
        managed-device-id: The ID of the managed device.
