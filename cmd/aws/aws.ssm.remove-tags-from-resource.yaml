name: remove-tags-from-resource
description: Removes tag keys from the specified resource.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --resource-id=!: The ID of the resource from which you want to remove tags.
    --resource-type=!: The type of resource from which you want to remove a tag.
    --tag-keys=!:
        description: Tag keys that you want to remove from the specified resource.
        nargs: -1
completion:
    flag:
        resource-type:
            - Document
            - ManagedInstance
            - MaintenanceWindow
            - Parameter
            - PatchBaseline
            - OpsItem
            - OpsMetadata
            - Automation
            - Association
documentation:
    command: Removes tag keys from the specified resource.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        resource-id: |-
            The ID of the resource from which you want to remove tags. For example:

            ManagedInstance: mi-012345abcde

            MaintenanceWindow: mw-012345abcde

            `Automation`: `example-c160-4567-8519-012345abcde`

            PatchBaseline: pb-012345abcde

            OpsMetadata object: `ResourceID` for tagging is created from the Amazon Resource Name (ARN) for the object. Specifically, `ResourceID` is created from the strings that come after the word `opsmetadata` in the ARN. For example, an OpsMetadata object with an ARN of `arn:aws:ssm:us-east-2:1234567890:opsmetadata/aws/ssm/MyGroup/appmanager` has a `ResourceID` of either `aws/ssm/MyGroup/appmanager` or `/aws/ssm/MyGroup/appmanager`.

            For the Document and Parameter values, use the name of the resource.

            The `ManagedInstance` type for this API operation is only for on-premises managed nodes. Specify the name of the managed node in the following format: mi-ID\_number. For example, mi-1a2b3c4d5e6f.
        resource-type: |-
            The type of resource from which you want to remove a tag.

            The `ManagedInstance` type for this API operation is only for on-premises managed nodes. Specify the name of the managed node in the following format: `mi-ID_number`. For example, `mi-1a2b3c4d5e6f`.
        tag-keys: Tag keys that you want to remove from the specified resource.
