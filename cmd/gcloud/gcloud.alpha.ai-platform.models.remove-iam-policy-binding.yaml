name: remove-iam-policy-binding
description: '*(ALPHA)*  Remove IAM policy binding for a model.'
flags:
    --all: Remove all bindings with this role and principal, irrespective of any
    --condition-from-file=: Path to a local JSON or YAML file that defines the condition.
    --condition=: The condition of the binding that you want to remove.
    --member=!: The principal to remove the binding for.
    --no-all&: ""
    --region=: Google Cloud region of the regional endpoint to use for this command.
    --role=!: The role to remove the principal from.
completion:
    flag:
        region:
            - global
            - asia-east1
            - asia-northeast1
            - asia-southeast1
            - australia-southeast1
            - europe-west1
            - europe-west2
            - europe-west3
            - europe-west4
            - northamerica-northeast1
            - us-central1
            - us-east1
            - us-east4
            - us-west1
documentation:
    command: |-
        *(ALPHA)*  Remove an IAM policy binding from the IAM policy of a ML model. One binding
        consists of a member, a role, and an optional condition.
        See $ gcloud alpha ai-platform models get-iam-policy for examples of how to
        specify a model resource.
    flag:
        all: |-
            Remove all bindings with this role and principal, irrespective of any
            conditions.
        condition: |-
            The condition of the binding that you want to remove. When the condition is
            explicitly specified as `None` (`--condition=None`), a binding without a
            condition is removed. Otherwise, only a binding with a condition that exactly
            matches the specified condition (including the optional description) is removed.
            For more on conditions, refer to the conditions overview guide:
            https://cloud.google.com/iam/docs/conditions-overview
            +
            When using the `--condition` flag, include the following key-value pairs:
            +
            *expression*::: (Required) Condition expression that evaluates to True or False.
            This uses a subset of Common Expression Language syntax.
            +
            If the condition expression includes a comma, use a different delimiter to
            separate the key-value pairs. Specify the delimiter before listing the
            key-value pairs. For example, to specify a colon (`:`) as the delimiter, do the
            following: `--condition=^:^title=TITLE:expression=EXPRESSION`. For more
            information, see https://cloud.google.com/sdk/gcloud/reference/topic/escaping.
            +
            *title*::: (Required) A short string describing the purpose of the expression.
            +
            *description*::: (Optional) Additional description for the expression.
        condition-from-file: |-
            Path to a local JSON or YAML file that defines the condition.
            To see available fields, see the help for `--condition`. Use a full or relative path to a local file containing the value of condition.
        member: |-
            The principal to remove the binding for. Should be of the form `user|group|serviceAccount:email` or
            `domain:domain`.
            +
            Examples: `user:test-user@gmail.com`, `group:admins@example.com`,
            `serviceAccount:test123@example.domain.com`, or
            `domain:example.domain.com`.
            +
            Deleted principals have an additional `deleted:` prefix and a `?uid=UID` suffix,
            where ``UID'' is a unique identifier for the principal. Example:
            `deleted:user:test-user@gmail.com?uid=123456789012345678901`.
            +
            Some resources also accept the following special values:
            * `allUsers` - Special identifier that represents anyone who is on the internet,
               with or without a Google account.
            * `allAuthenticatedUsers` - Special identifier that represents anyone who is
               authenticated with a Google account or a service account.
        no-all: |-
            Remove all bindings with this role and principal, irrespective of any
            conditions.
        region: |-
            Google Cloud region of the regional endpoint to use for this command.
            For the global endpoint, the region needs to be specified as `global`.
            +
            Learn more about regional endpoints and see a list of available regions:
             https://cloud.google.com/ai-platform/prediction/docs/regional-endpoints
            +
            _REGION_ must be one of: *global*, *asia-east1*, *asia-northeast1*, *asia-southeast1*, *australia-southeast1*, *europe-west1*, *europe-west2*, *europe-west3*, *europe-west4*, *northamerica-northeast1*, *us-central1*, *us-east1*, *us-east4*, *us-west1*.
        role: The role to remove the principal from.
