name: create
description: Create a new snooze.
flags:
    --criteria-filter=: Optional.
    --criteria-policies=: The policies that the Snooze applies to.
    --display-name=: The display name for the Snooze.
    --end-time=: The end time for the Snooze.
    --snooze-from-file=: The path to a JSON or YAML file containing the snooze.
    --start-time=: The start time for the Snooze.
documentation:
    command: |
        Creates a new snooze. A snooze can be specified as a JSON/YAML value
        passed in as a file through the `--snooze-from-file` flag. A snooze
        can also be specified through command line flags. If a snooze is
        specified through `--snooze-from-file`, and additional flags are
        supplied, the flags will override the snooze's settings.

        For information about the JSON/YAML format of a snooze:
        https://cloud.google.com/monitoring/api/ref_v3/rest/v3/projects.snoozes
    flag:
        criteria-filter: 'Optional. When you define a Snooze, you can also define a filter for that snooze. The filter is a string containing one or more key-value pairs. The string uses the standard https://google.aip.dev/160 filter syntax. If you define a filter for a snooze, then the snooze can only apply to one alert policy. When the snooze is active, incidents won''t be created when the incident would have key-value pairs (labels) that match those specified by the filter in the snooze. Snooze filters support resource, metric, and metadata labels. If multiple labels are used, then they must be connected with an AND operator. For example: resource.labels.instance_id="1234567890" AND resource.labels.zone="us-central1-a" AND metric.labels.instance_name="test_group" AND metadata.user_labels.foo="bar" AND metadata.system_labels.region="us-central1"'
        criteria-policies: The policies that the Snooze applies to. Exactly 1 alert policy is required if `criteria-filter` is specified at the same time.
        display-name: The display name for the Snooze.
        end-time: The end time for the Snooze.
        snooze-from-file: The path to a JSON or YAML file containing the snooze. Use a full or relative path to a local file containing the value of snooze.
        start-time: The start time for the Snooze.
