name: discover
description: Discover a Datastream connection profile.
flags:
    --connection-profile-name=!: ID of the connection_profile or fully qualified identifier for the connection_profile.
    --connection-profile-object-file=: Path to a YAML (or JSON) file containing the configuration
    --full-hierarchy: Whether to retrieve the full hierarchy of data objects (TRUE) or only the current level (FALSE).
    --hierarchy-depth=: The number of hierarchy levels below the current level to be retrieved.
    --location=!: ID of the location or fully qualified identifier for the location.
    --mysql-rdbms-file=: Path to a YAML (or JSON) file containing the MySQL RDBMS to enrich with child data objects and metadata.
    --no-full-hierarchy&: Whether to retrieve the full hierarchy of data objects (TRUE) or only the current level (FALSE).
    --no-recursive&: (DEPRECATED) Whether to retrieve the full hierarchy of data objects (TRUE) or only the current level (FALSE).
    --oracle-rdbms-file=: Path to a YAML (or JSON) file containing the Oracle RDBMS to enrich with child data objects and metadata.
    --postgresql-rdbms-file=: Path to a YAML (or JSON) file containing the PostgreSQL RDBMS to enrich with child data objects and metadata.
    --recursive: (DEPRECATED) Whether to retrieve the full hierarchy of data objects (TRUE) or only the current level (FALSE).
    --recursive-depth=: (DEPRECATED) The number of hierarchy levels below the current level to be retrieved.
    --sqlserver-rdbms-file=: Path to a YAML (or JSON) file containing the SQL Server RDBMS to enrich with child data objects and metadata.
documentation:
    command: Discover data objects accessible from a Datastream connection profile
    flag:
        connection-profile-name: |-
            ID of the connection_profile or fully qualified identifier for the connection_profile.
            +
            To set the `connection_profile` attribute:
            * provide the argument `--connection-profile-name` on the command line.
        connection-profile-object-file: |-
            Path to a YAML (or JSON) file containing the configuration
                  for a connection profile object. If you pass - as the value of the
                  flag the file content will be read from stdin.
        full-hierarchy: Whether to retrieve the full hierarchy of data objects (TRUE) or only the current level (FALSE).
        hierarchy-depth: The number of hierarchy levels below the current level to be retrieved.
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line.
        mysql-rdbms-file: Path to a YAML (or JSON) file containing the MySQL RDBMS to enrich with child data objects and metadata. If you pass - as the value of the flag the file content will be read from stdin.
        no-full-hierarchy: Whether to retrieve the full hierarchy of data objects (TRUE) or only the current level (FALSE).
        no-recursive: |-
            (DEPRECATED) Whether to retrieve the full hierarchy of data objects (TRUE) or only the current level (FALSE).
            +
            The --recursive option is deprecated; use `--full-hierarchy` instead.
        oracle-rdbms-file: Path to a YAML (or JSON) file containing the Oracle RDBMS to enrich with child data objects and metadata. If you pass - as the value of the flag the file content will be read from stdin.
        postgresql-rdbms-file: Path to a YAML (or JSON) file containing the PostgreSQL RDBMS to enrich with child data objects and metadata. If you pass - as the value of the flag the file content will be read from stdin.
        recursive: |-
            (DEPRECATED) Whether to retrieve the full hierarchy of data objects (TRUE) or only the current level (FALSE).
            +
            The --recursive option is deprecated; use `--full-hierarchy` instead.
        recursive-depth: |-
            (DEPRECATED) The number of hierarchy levels below the current level to be retrieved.
            +
            The --recursive-depth option is deprecated; use `--hierarchy-depth` instead.
        sqlserver-rdbms-file: Path to a YAML (or JSON) file containing the SQL Server RDBMS to enrich with child data objects and metadata. If you pass - as the value of the flag the file content will be read from stdin.
