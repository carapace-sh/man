name: set-iam-policy
description: Set the IAM policy for a Data Catalog Policy Tag.
flags:
    --location=: Location of the policy tag.
    --taxonomy=: Taxonomy of the policy tag.
documentation:
    command: |
        Set the IAM policy for the given Data Catalog Policy Tag as
        defined in a JSON or YAML file.
    flag:
        location: |-
            Location of the policy tag.
            +

            To set the `location` attribute:
            * provide the argument `policy_tag` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        taxonomy: |-
            Taxonomy of the policy tag.
            +

            To set the `taxonomy` attribute:
            * provide the argument `policy_tag` on the command line with a fully specified name;
            * provide the argument `--taxonomy` on the command line.
