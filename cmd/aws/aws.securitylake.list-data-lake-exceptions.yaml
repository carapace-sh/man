name: list-data-lake-exceptions
description: Lists the Amazon Security Lake exceptions that you can use to find the source of problems and fix them.
flags:
    --max-results=: Lists the maximum number of failures in Security Lake.
    --next-token=: Lists if there are more results available.
    --regions=: The Amazon Web Services Regions from which exceptions are retrieved.
documentation:
    command: Lists the Amazon Security Lake exceptions that you can use to find the source of problems and fix them.
    flag:
        max-results: Lists the maximum number of failures in Security Lake.
        next-token: |-
            Lists if there are more results available. The value of nextToken is a unique pagination token for each page. Repeat the call using the returned token to retrieve the next page. Keep all other arguments unchanged.

            Each pagination token expires after 24 hours. Using an expired pagination token will return an HTTP 400 InvalidToken error.
        regions: The Amazon Web Services Regions from which exceptions are retrieved.
