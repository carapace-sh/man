name: set-task-status
description: Task runners call `SetTaskStatus` to notify AWS Data Pipeline that a task is completed and provide information about the final status.
flags:
    --error-id=: If an error occurred during the task, this value specifies the error code.
    --error-message=: If an error occurred during the task, this value specifies a text description of the error.
    --error-stack-trace=: If an error occurred during the task, this value specifies the stack trace associated with the error.
    --task-id=!: The ID of the task assigned to the task runner.
    --task-status=!: If `FINISHED`, the task successfully completed.
completion:
    flag:
        task-status:
            - FINISHED
            - FAILED
            - "FALSE"
documentation:
    command: Task runners call `SetTaskStatus` to notify AWS Data Pipeline that a task is completed and provide information about the final status. A task runner makes this call regardless of whether the task was sucessful. A task runner does not need to call `SetTaskStatus` for tasks that are canceled by the web service during a call to [ReportTaskProgress]().
    flag:
        error-id: If an error occurred during the task, this value specifies the error code. This value is set on the physical attempt object. It is used to display error information to the user. It should not start with string "Service\_" which is reserved by the system.
        error-message: If an error occurred during the task, this value specifies a text description of the error. This value is set on the physical attempt object. It is used to display error information to the user. The web service does not parse this value.
        error-stack-trace: If an error occurred during the task, this value specifies the stack trace associated with the error. This value is set on the physical attempt object. It is used to display error information to the user. The web service does not parse this value.
        task-id: The ID of the task assigned to the task runner. This value is provided in the response for [PollForTask]().
        task-status: If `FINISHED`, the task successfully completed. If `FAILED`, the task ended unsuccessfully. Preconditions use false.
