name: get-bootstrap-brokers
description: A list of brokers that a client application can use to bootstrap.
flags:
    --cluster-arn=!: The Amazon Resource Name (ARN) that uniquely identifies the cluster.
documentation:
    command: A list of brokers that a client application can use to bootstrap. This list doesn't necessarily include all of the brokers in the cluster. The following Python 3.6 example shows how you can use the Amazon Resource Name (ARN) of a cluster to get its bootstrap brokers. If you don't know the ARN of your cluster, you can use the `ListClusters` operation to get the ARNs of all the clusters in this account and Region.
    flag:
        cluster-arn: The Amazon Resource Name (ARN) that uniquely identifies the cluster.
