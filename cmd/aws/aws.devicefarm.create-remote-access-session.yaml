name: create-remote-access-session
description: Specifies and starts a remote access session.
flags:
    --app-arn=: The Amazon Resource Name (ARN) of the app to create the remote access session.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration=: The configuration information for the remote access session request.
    --device-arn=!: The ARN of the device for which you want to create a remote access session.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-arn=: The Amazon Resource Name (ARN) of the device instance for which you want to create a remote access session.
    --interaction-mode=: The interaction mode of the remote access session.
    --name=: The name of the remote access session to create.
    --no-skip-app-resign: When set to `true`, for private devices, Device Farm does not sign your app again.
    --project-arn=!: The Amazon Resource Name (ARN) of the project for which you want to create a remote access session.
    --skip-app-resign: When set to `true`, for private devices, Device Farm does not sign your app again.
completion:
    flag:
        interaction-mode:
            - INTERACTIVE
            - NO_VIDEO
            - VIDEO_ONLY
documentation:
    command: Specifies and starts a remote access session.
    flag:
        app-arn: The Amazon Resource Name (ARN) of the app to create the remote access session.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration: The configuration information for the remote access session request.
        device-arn: The ARN of the device for which you want to create a remote access session.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-arn: The Amazon Resource Name (ARN) of the device instance for which you want to create a remote access session.
        interaction-mode: The interaction mode of the remote access session. Changing the interactive mode of remote access sessions is no longer available.
        name: The name of the remote access session to create.
        project-arn: The Amazon Resource Name (ARN) of the project for which you want to create a remote access session.
        skip-app-resign: |-
            When set to `true`, for private devices, Device Farm does not sign your app again. For public devices, Device Farm always signs your apps again.

            For more information on how Device Farm modifies your uploads during tests, see [Do you modify my app?](http://aws.amazon.com/device-farm/faqs/)
