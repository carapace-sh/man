name: update-lake-formation-identity-center-configuration
description: Updates the IAM Identity Center connection parameters.
flags:
    --application-status=: Allows to enable or disable the IAM Identity Center connection.
    --catalog-id=: The identifier for the Data Catalog.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --external-filtering=: A list of the account IDs of Amazon Web Services accounts of third-party applications that are allowed to access data managed by Lake Formation.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --service-integrations=:
        description: A list of service integrations for enabling trusted identity propagation with external services such as Redshift.
        nargs: -1
    --share-recipients=:
        description: A list of Amazon Web Services account IDs or Amazon Web Services organization/organizational unit ARNs that are allowed to access to access data managed by Lake Formation.
        nargs: -1
completion:
    flag:
        application-status:
            - ENABLED
            - DISABLED
documentation:
    command: Updates the IAM Identity Center connection parameters.
    flag:
        application-status: Allows to enable or disable the IAM Identity Center connection.
        catalog-id: The identifier for the Data Catalog. By default, the account ID. The Data Catalog is the persistent metadata store. It contains database definitions, table definitions, view definitions, and other control information to manage your Lake Formation environment.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        external-filtering: A list of the account IDs of Amazon Web Services accounts of third-party applications that are allowed to access data managed by Lake Formation.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        service-integrations: A list of service integrations for enabling trusted identity propagation with external services such as Redshift.
        share-recipients: |-
            A list of Amazon Web Services account IDs or Amazon Web Services organization/organizational unit ARNs that are allowed to access to access data managed by Lake Formation.

            If the `ShareRecipients` list includes valid values, then the resource share is updated with the principals you want to have access to the resources.

            If the `ShareRecipients` value is null, both the list of share recipients and the resource share remain unchanged.

            If the `ShareRecipients` value is an empty list, then the existing share recipients list will be cleared, and the resource share will be deleted.
