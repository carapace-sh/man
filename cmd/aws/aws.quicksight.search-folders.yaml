name: search-folders
description: Searches the subfolders in a folder.
flags:
    --aws-account-id=!: The ID for the Amazon Web Services account that contains the folder.
    --filters=!: The filters to apply to the search.
    --max-results=: The maximum number of results to be returned per request.
    --next-token=: The token for the next set of results, or null if there are no more results.
documentation:
    command: Searches the subfolders in a folder.
    flag:
        aws-account-id: The ID for the Amazon Web Services account that contains the folder.
        filters: 'The filters to apply to the search. Currently, you can search only by the parent folder ARN. For example, `"Filters": [ { "Name": "PARENT_FOLDER_ARN", "Operator": "StringEquals", "Value": "arn:aws:quicksight:us-east-1:1:folder/folderId" } ]`.'
        max-results: The maximum number of results to be returned per request.
        next-token: The token for the next set of results, or null if there are no more results.
