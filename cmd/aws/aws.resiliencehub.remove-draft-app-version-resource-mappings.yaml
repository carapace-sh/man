name: remove-draft-app-version-resource-mappings
description: Removes resource mappings from a draft application version.
flags:
    --app-arn=!: Amazon Resource Name (ARN) of the Resilience Hub application.
    --app-registry-app-names=:
        description: The names of the registered applications you want to remove from the resource mappings.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --eks-source-names=:
        description: The names of the Amazon Elastic Kubernetes Service clusters and namespaces you want to remove from the resource mappings.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --logical-stack-names=:
        description: The names of the CloudFormation stacks you want to remove from the resource mappings.
        nargs: -1
    --resource-group-names=:
        description: The names of the resource groups you want to remove from the resource mappings.
        nargs: -1
    --resource-names=:
        description: The names of the resources you want to remove from the resource mappings.
        nargs: -1
    --terraform-source-names=:
        description: The names of the Terraform sources you want to remove from the resource mappings.
        nargs: -1
documentation:
    command: Removes resource mappings from a draft application version.
    flag:
        app-arn: 'Amazon Resource Name (ARN) of the Resilience Hub application. The format for this ARN is: arn:`partition`:resiliencehub:`region`:`account`:app/`app-id`. For more information about ARNs, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference* guide.'
        app-registry-app-names: The names of the registered applications you want to remove from the resource mappings.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        eks-source-names: |-
            The names of the Amazon Elastic Kubernetes Service clusters and namespaces you want to remove from the resource mappings.

            This parameter accepts values in "eks-cluster/namespace" format.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        logical-stack-names: The names of the CloudFormation stacks you want to remove from the resource mappings.
        resource-group-names: The names of the resource groups you want to remove from the resource mappings.
        resource-names: The names of the resources you want to remove from the resource mappings.
        terraform-source-names: The names of the Terraform sources you want to remove from the resource mappings.
