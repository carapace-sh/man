name: delete
description: '*(ALPHA)*  delete a reference image.'
flags:
    --location=: The location of reference image.
    --product=: The ID of product.
documentation:
    command: '*(ALPHA)*  delete a reference image.'
    flag:
        location: |-
            The location of reference image.
            +
            To set the `location` attribute:
            * provide the argument `reference_image` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        product: |-
            The ID of product.
            +
            To set the `product` attribute:
            * provide the argument `reference_image` on the command line with a fully specified name;
            * provide the argument `--product` on the command line.
