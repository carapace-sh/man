name: list-loader-jobs
description: Retrieves a list of the `loadIds` for all active loader jobs.
flags:
    --include-queued-loads: An optional parameter that can be used to exclude the load IDs of queued load requests when requesting a list of load IDs by setting the parameter to `FALSE`.
    --limit=: The number of load IDs to list.
    --no-include-queued-loads&: An optional parameter that can be used to exclude the load IDs of queued load requests when requesting a list of load IDs by setting the parameter to `FALSE`.
documentation:
    command: |-
        Retrieves a list of the `loadIds` for all active loader jobs.

        When invoking this operation in a Neptune cluster that has IAM authentication enabled, the IAM user or role making the request must have a policy attached that allows the [neptune-db:ListLoaderJobs](https://docs.aws.amazon.com/neptune/latest/userguide/iam-dp-actions.html#listloaderjobs) IAM action in that cluster..
    flag:
        include-queued-loads: An optional parameter that can be used to exclude the load IDs of queued load requests when requesting a list of load IDs by setting the parameter to `FALSE`. The default value is `TRUE`.
        limit: The number of load IDs to list. Must be a positive integer greater than zero and not more than `100` (which is the default).
