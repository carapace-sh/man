name: associate-ops-item-related-item
description: Associates a related item to a Systems Manager OpsCenter OpsItem.
flags:
    --association-type=!: The type of association that you want to create between an OpsItem and a resource.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ops-item-id=!: The ID of the OpsItem to which you want to associate a resource as a related item.
    --resource-type=!: The type of resource that you want to associate with an OpsItem.
    --resource-uri=!: The Amazon Resource Name (ARN) of the Amazon Web Services resource that you want to associate with the OpsItem.
documentation:
    command: Associates a related item to a Systems Manager OpsCenter OpsItem. For example, you can associate an Incident Manager incident or analysis with an OpsItem. Incident Manager and OpsCenter are tools in Amazon Web Services Systems Manager.
    flag:
        association-type: The type of association that you want to create between an OpsItem and a resource. OpsCenter supports `IsParentOf` and `RelatesTo` association types.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ops-item-id: The ID of the OpsItem to which you want to associate a resource as a related item.
        resource-type: |-
            The type of resource that you want to associate with an OpsItem. OpsCenter supports the following types:

            `AWS::SSMIncidents::IncidentRecord`: an Incident Manager incident.

            `AWS::SSM::Document`: a Systems Manager (SSM) document.
        resource-uri: The Amazon Resource Name (ARN) of the Amazon Web Services resource that you want to associate with the OpsItem.
