name: set-iam-policy
description: '*(BETA)*  Set the IAM policy for a Binary Authorization policy.'
documentation:
    command: |-
        *(BETA)*  See https://cloud.google.com/iam/docs/managing-policies for details of
        the policy file format and contents.

        ## EXAMPLES
        The following command will read an IAM policy defined in a JSON file
        'iam_policy.json' and set it for the current project's Binary Authorization
        policy:

          $ gcloud beta container binauthz policy set-iam-policy iam_policy.json
