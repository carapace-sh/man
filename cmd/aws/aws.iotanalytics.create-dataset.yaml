name: create-dataset
description: Used to create a dataset.
flags:
    --actions=!: A list of actions that create the dataset contents.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --content-delivery-rules=: When dataset contents are created, they are delivered to destinations specified here.
    --dataset-name=!: The name of the dataset.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --late-data-rules=: A list of data rules that send notifications to CloudWatch, when data arrives late.
    --retention-period=: Optional.
    --tags=: Metadata which can be used to manage the dataset.
    --triggers=: A list of triggers.
    --versioning-configuration=: Optional.
documentation:
    command: Used to create a dataset. A dataset stores data retrieved from a data store by applying a `queryAction` (a SQL query) or a `containerAction` (executing a containerized application). This operation creates the skeleton of a dataset. The dataset can be populated manually by calling `CreateDatasetContent` or automatically according to a trigger you specify.
    flag:
        actions: A list of actions that create the dataset contents.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        content-delivery-rules: When dataset contents are created, they are delivered to destinations specified here.
        dataset-name: The name of the dataset.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        late-data-rules: A list of data rules that send notifications to CloudWatch, when data arrives late. To specify `lateDataRules`, the dataset must use a [DeltaTimer](https://docs.aws.amazon.com/iotanalytics/latest/APIReference/API_DeltaTime.html) filter.
        retention-period: Optional. How long, in days, versions of dataset contents are kept for the dataset. If not specified or set to `null`, versions of dataset contents are retained for at most 90 days. The number of versions of dataset contents retained is determined by the `versioningConfiguration` parameter. For more information, see [Keeping Multiple Versions of IoT Analytics datasets](https://docs.aws.amazon.com/iotanalytics/latest/userguide/getting-started.html#aws-iot-analytics-dataset-versions) in the *IoT Analytics User Guide*.
        tags: Metadata which can be used to manage the dataset.
        triggers: A list of triggers. A trigger causes dataset contents to be populated at a specified time interval or when another dataset's contents are created. The list of triggers can be empty or contain up to five `DataSetTrigger` objects.
        versioning-configuration: Optional. How many versions of dataset contents are kept. If not specified or set to null, only the latest version plus the latest succeeded version (if they are different) are kept for the time period specified by the `retentionPeriod` parameter. For more information, see [Keeping Multiple Versions of IoT Analytics datasets](https://docs.aws.amazon.com/iotanalytics/latest/userguide/getting-started.html#aws-iot-analytics-dataset-versions) in the *IoT Analytics User Guide*.
