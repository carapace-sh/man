name: delete
description: '*(BETA)*  Delete Compute Engine virtual machine instance templates.'
flags:
    --global: If set, the instance templates are global.
    --no-global&: If set, the instance templates are global.
    --region=: Region of the instance templates to delete.
documentation:
    command: |
        *(BETA)*  *gcloud beta compute instance-templates delete* deletes one or more Compute Engine virtual machine
        instance templates.
    flag:
        global: If set, the instance templates are global.
        no-global: If set, the instance templates are global.
        region: Region of the instance templates to delete. Overrides the default *compute/region* property value for this command invocation.
