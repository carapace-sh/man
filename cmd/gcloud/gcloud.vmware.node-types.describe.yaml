name: describe
description: Display data associated with a Google Cloud VMware Engine node type.
flags:
    --location=: Location of the private cloud or cluster.
documentation:
    command: |
        Display data associated with a VMware Engine node type, such as its compute, storage, and memory.
    flag:
        location: |-
            Location of the private cloud or cluster.
            +
            To set the `location` attribute:
            * provide the argument `node_type` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/zone`.
