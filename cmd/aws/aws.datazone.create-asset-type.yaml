name: create-asset-type
description: Creates a custom asset type.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The descripton of the custom asset type.
    --domain-identifier=!: The unique identifier of the Amazon DataZone domain where the custom asset type is being created.
    --forms-input=!: The metadata forms that are to be attached to the custom asset type.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the custom asset type.
    --owning-project-identifier=!: The identifier of the Amazon DataZone project that is to own the custom asset type.
documentation:
    command: |-
        Creates a custom asset type.

        Prerequisites:

        - The `formsInput` field is required, however, can be passed as empty (e.g. `-forms-input {})`.
        - You must have `CreateAssetType` permissions.
        - The domain-identifier and owning-project-identifier must be valid and active.
        - The name of the asset type must be unique within the domain — duplicate names will cause failure.
        - JSON input must be valid — incorrect formatting causes Invalid JSON errors.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The descripton of the custom asset type.
        domain-identifier: The unique identifier of the Amazon DataZone domain where the custom asset type is being created.
        forms-input: The metadata forms that are to be attached to the custom asset type.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the custom asset type.
        owning-project-identifier: The identifier of the Amazon DataZone project that is to own the custom asset type.
