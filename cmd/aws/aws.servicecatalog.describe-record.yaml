name: describe-record
description: Gets information about the specified request operation.
flags:
    --accept-language=: The language code.
    --id=!: The record identifier of the provisioned product.
    --page-size=: The maximum number of items to return with this call.
    --page-token=: The page token for the next set of results.
documentation:
    command: |-
        Gets information about the specified request operation.

        Use this operation after calling a request operation (for example, [ProvisionProduct](), [TerminateProvisionedProduct](), or [UpdateProvisionedProduct]()).

        If a provisioned product was transferred to a new owner using [UpdateProvisionedProductProperties](), the new owner will be able to describe all past records for that product. The previous owner will no longer be able to describe the records, but will be able to use [ListRecordHistory]() to see the product's history from when he was the owner.
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        id: The record identifier of the provisioned product. This identifier is returned by the request operation.
        page-size: The maximum number of items to return with this call.
        page-token: The page token for the next set of results. To retrieve the first set of results, use null.
