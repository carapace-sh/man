name: create-trust-anchor
description: Creates a trust anchor to establish trust between IAM Roles Anywhere and your certificate authority (CA).
flags:
    --enabled: Specifies whether the trust anchor is enabled.
    --name=!: The name of the trust anchor.
    --no-enabled&: Specifies whether the trust anchor is enabled.
    --notification-settings=: A list of notification settings to be associated to the trust anchor.
    --source=!: The trust anchor type and its related certificate data.
    --tags=: The tags to attach to the trust anchor.
documentation:
    command: |-
        Creates a trust anchor to establish trust between IAM Roles Anywhere and your certificate authority (CA). You can define a trust anchor as a reference to an Private Certificate Authority (Private CA) or by uploading a CA certificate. Your Amazon Web Services workloads can authenticate with the trust anchor using certificates issued by the CA in exchange for temporary Amazon Web Services credentials.

        **Required permissions:** `rolesanywhere:CreateTrustAnchor`.
    flag:
        enabled: Specifies whether the trust anchor is enabled.
        name: The name of the trust anchor.
        notification-settings: A list of notification settings to be associated to the trust anchor.
        source: The trust anchor type and its related certificate data.
        tags: The tags to attach to the trust anchor.
