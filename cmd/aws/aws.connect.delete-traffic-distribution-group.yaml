name: delete-traffic-distribution-group
description: Deletes a traffic distribution group.
flags:
    --traffic-distribution-group-id=!: The identifier of the traffic distribution group.
documentation:
    command: |-
        Deletes a traffic distribution group. This API can be called only in the Region where the traffic distribution group is created.

        For more information about deleting traffic distribution groups, see [Delete traffic distribution groups](https://docs.aws.amazon.com/connect/latest/adminguide/delete-traffic-distribution-groups.html) in the *Amazon Connect Administrator Guide*.
    flag:
        traffic-distribution-group-id: The identifier of the traffic distribution group. This can be the ID or the ARN of the traffic distribution group.
