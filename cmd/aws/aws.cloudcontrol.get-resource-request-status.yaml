name: get-resource-request-status
description: Returns the current status of a resource operation request.
flags:
    --request-token=!: A unique token used to track the progress of the resource operation request.
documentation:
    command: Returns the current status of a resource operation request. For more information, see [Tracking the progress of resource operation requests](https://docs.aws.amazon.com/cloudcontrolapi/latest/userguide/resource-operations-manage-requests.html#resource-operations-manage-requests-track) in the *Amazon Web Services Cloud Control API User Guide*.
    flag:
        request-token: |-
            A unique token used to track the progress of the resource operation request.

            Request tokens are included in the `ProgressEvent` type returned by a resource operation request.
