name: list-model-invocation-jobs
description: Lists all batch inference jobs in the account.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of results to return.
    --name-contains=: Specify a string to filter for batch inference jobs whose names contain the string.
    --next-token=: If there were more results than the value you specified in the `maxResults` field in a previous `ListModelInvocationJobs` request, the response would have returned a `nextToken` value.
    --page-size=: The size of each page to get in the AWS service call.
    --sort-by=: An attribute by which to sort the results.
    --sort-order=: Specifies whether to sort the results by ascending or descending order.
    --starting-token=: A token to specify where to start paginating.
    --status-equals=: Specify a status to filter for batch inference jobs whose statuses match the string you specify.
    --submit-time-after=: Specify a time to filter for batch inference jobs that were submitted after the time you specify.
    --submit-time-before=: Specify a time to filter for batch inference jobs that were submitted before the time you specify.
completion:
    flag:
        sort-by:
            - CreationTime
        sort-order:
            - Ascending
            - Descending
        status-equals:
            - Submitted
            - InProgress
            - Completed
            - Failed
            - Stopping
            - Stopped
            - PartiallyCompleted
            - Expired
            - Validating
            - Scheduled
documentation:
    command: Lists all batch inference jobs in the account. For more information, see [View details about a batch inference job](https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference-view.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of results to return. If there are more results than the number that you specify, a `nextToken` value is returned. Use the `nextToken` in a request to return the next batch of results.
        name-contains: Specify a string to filter for batch inference jobs whose names contain the string.
        next-token: If there were more results than the value you specified in the `maxResults` field in a previous `ListModelInvocationJobs` request, the response would have returned a `nextToken` value. To see the next batch of results, send the `nextToken` value in another request.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        sort-by: An attribute by which to sort the results.
        sort-order: Specifies whether to sort the results by ascending or descending order.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        status-equals: "Specify a status to filter for batch inference jobs whose statuses match the string you specify.\n\nThe following statuses are possible:\n\n- Submitted – This job has been submitted to a queue for validation.\n- Validating – This job is being validated for the requirements described in [Format and upload your batch inference data](https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference-data.html). The criteria include the following:\n  \n  - Your IAM service role has access to the Amazon S3 buckets containing your files.\n  - Your files are .jsonl files and each individual record is a JSON object in the correct format. Note that validation doesn't check if the `modelInput` value matches the request body for the model.\n  - Your files fulfill the requirements for file size and number of records. For more information, see [Quotas for Amazon Bedrock](https://docs.aws.amazon.com/bedrock/latest/userguide/quotas.html).\n- Scheduled – This job has been validated and is now in a queue. The job will automatically start when it reaches its turn.\n- Expired – This job timed out because it was scheduled but didn't begin before the set timeout duration. Submit a new job request.\n- InProgress – This job has begun. You can start viewing the results in the output S3 location.\n- Completed – This job has successfully completed. View the output files in the output S3 location.\n- PartiallyCompleted – This job has partially completed. Not all of your records could be processed in time. View the output files in the output S3 location.\n- Failed – This job has failed. Check the failure message for any further details. For further assistance, reach out to the [Amazon Web Services Support Center](https://console.aws.amazon.com/support/home/).\n- Stopped – This job was stopped by a user.\n- Stopping – This job is being stopped by a user."
        submit-time-after: Specify a time to filter for batch inference jobs that were submitted after the time you specify.
        submit-time-before: Specify a time to filter for batch inference jobs that were submitted before the time you specify.
