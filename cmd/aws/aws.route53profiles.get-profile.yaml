name: get-profile
description: Returns information about a specified Route 53 Profile, such as whether whether the Profile is shared, and the current status of the Profile.
flags:
    --profile-id=!: ID of the Profile.
documentation:
    command: Returns information about a specified Route 53 Profile, such as whether whether the Profile is shared, and the current status of the Profile.
    flag:
        profile-id: ID of the Profile.
