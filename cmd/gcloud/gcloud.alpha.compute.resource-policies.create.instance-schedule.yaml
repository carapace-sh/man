name: instance-schedule
description: '*(ALPHA)*  Create a Compute Engine instance schedule resource policy.'
flags:
    --description=: An optional, textual description for the backend.
    --end-date=: The expiration time of the schedule policy.
    --initiation-date=: The start time of the schedule policy.
    --region=: Region of the resource policy to operate on.
    --timezone=: Timezone used in interpreting schedule.
    --vm-start-schedule=: Schedule for starting the instance, specified using standard CRON format.
    --vm-stop-schedule=: Schedule for stopping the instance, specified using standard CRON format.
documentation:
    command: |
        *(ALPHA)*  Create a Compute Engine instance schedule resource policy.
    flag:
        description: An optional, textual description for the backend.
        end-date: |-
            The expiration time of the schedule policy. The timestamp must be
                    an RFC3339 valid string.
        initiation-date: |-
            The start time of the schedule policy. The timestamp must be
            an RFC3339 valid string.
        region: |-
            Region of the resource policy to operate on. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        timezone: |-
            Timezone used in interpreting schedule. The value of this field must be
            a time zone name from the tz database
            http://en.wikipedia.org/wiki/Tz_database
        vm-start-schedule: Schedule for starting the instance, specified using standard CRON format.
        vm-stop-schedule: Schedule for stopping the instance, specified using standard CRON format.
