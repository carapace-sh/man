name: create-license
description: Creates a license.
flags:
    --beneficiary=!: License beneficiary.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=!: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --consumption-configuration=!: Configuration for consumption of the license.
    --entitlements=!:
        description: License entitlements.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --home-region=!: Home Region for the license.
    --issuer=!: License issuer.
    --license-metadata=:
        description: Information about the license.
        nargs: -1
    --license-name=!: License name.
    --product-name=!: Product name.
    --product-sku=!: Product SKU.
    --tags=:
        description: Tags to add to the license.
        nargs: -1
    --validity=!: Date and time range during which the license is valid, in ISO8601-UTC format.
documentation:
    command: Creates a license.
    flag:
        beneficiary: License beneficiary.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        consumption-configuration: Configuration for consumption of the license. Choose a provisional configuration for workloads running with continuous connectivity. Choose a borrow configuration for workloads with offline usage.
        entitlements: License entitlements.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        home-region: Home Region for the license.
        issuer: License issuer.
        license-metadata: Information about the license.
        license-name: License name.
        product-name: Product name.
        product-sku: Product SKU.
        tags: Tags to add to the license. For more information about tagging support in License Manager, see the [TagResource](https://docs.aws.amazon.com/license-manager/latest/APIReference/API_TagResource.html) operation.
        validity: Date and time range during which the license is valid, in ISO8601-UTC format.
