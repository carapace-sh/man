name: associate-managed-notification-additional-channel
description: Associates an additional Channel with a particular `ManagedNotificationConfiguration`.
flags:
    --channel-arn=!: The Amazon Resource Name (ARN) of the Channel to associate with the `ManagedNotificationConfiguration`.
    --managed-notification-configuration-arn=!: The Amazon Resource Name (ARN) of the `ManagedNotificationConfiguration` to associate with the additional Channel.
documentation:
    command: |-
        Associates an additional Channel with a particular `ManagedNotificationConfiguration`.

        Supported Channels include Amazon Q Developer in chat applications, the Console Mobile Application, and emails (notifications-contacts).
    flag:
        channel-arn: |-
            The Amazon Resource Name (ARN) of the Channel to associate with the `ManagedNotificationConfiguration`.

            Supported ARNs include Amazon Q Developer in chat applications, the Console Mobile Application, and email (notifications-contacts).
        managed-notification-configuration-arn: The Amazon Resource Name (ARN) of the `ManagedNotificationConfiguration` to associate with the additional Channel.
