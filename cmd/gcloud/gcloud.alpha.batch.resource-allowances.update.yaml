name: update
description: '*(ALPHA)*  Update a Batch resource allowance.'
flags:
    --location=: Google Cloud location for the resourceAllowance.
    --usage-limit=: Limit value of a UsageResourceAllowance within its one
documentation:
    command: |-
        *(ALPHA)*  This command updates a Batch resource allowance.

        ## EXAMPLES

        The following command updates a resource allowance limit to 0
        `projects/foo/locations/us-central1/resousrceAllowances/bar`:

          $ gcloud alpha batch resource-allowances update projects/foo/locations/us-central1/resousrceAllowances/bar
          --usage-limit 0
    flag:
        location: |-
            Google Cloud location for the resourceAllowance.
            +
            To set the `location` attribute:
            * provide the argument `RESOURCE_ALLOWANCE` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `batch/location`.
        usage-limit: |-
            Limit value of a UsageResourceAllowance within its one
                  duration. Limit cannot be a negative value. Default is 0.
