name: create-resource-gateway
description: A resource gateway is a point of ingress into the VPC where a resource resides.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ip-address-type=: A resource gateway can have IPv4, IPv6 or dualstack addresses.
    --ipv4-addresses-per-eni=: The number of IPv4 addresses in each ENI for the resource gateway.
    --name=!: The name of the resource gateway.
    --security-group-ids=:
        description: The IDs of the security groups to apply to the resource gateway.
        nargs: -1
    --subnet-ids=:
        description: The IDs of the VPC subnets in which to create the resource gateway.
        nargs: -1
    --tags=: The tags for the resource gateway.
    --vpc-identifier=: The ID of the VPC for the resource gateway.
completion:
    flag:
        ip-address-type:
            - IPV4
            - IPV6
            - DUALSTACK
documentation:
    command: A resource gateway is a point of ingress into the VPC where a resource resides. It spans multiple Availability Zones. For your resource to be accessible from all Availability Zones, you should create your resource gateways to span as many Availability Zones as possible. A VPC can have multiple resource gateways.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If you retry a request that completed successfully using the same client token and parameters, the retry succeeds without performing any actions. If the parameters aren't identical, the retry fails.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ip-address-type: |-
            A resource gateway can have IPv4, IPv6 or dualstack addresses. The IP address type of a resource gateway must be compatible with the subnets of the resource gateway and the IP address type of the resource, as described here:

            - **IPv4**Assign IPv4 addresses to your resource gateway network interfaces. This option is supported only if all selected subnets have IPv4 address ranges, and the resource also has an IPv4 address.
            - **IPv6**Assign IPv6 addresses to your resource gateway network interfaces. This option is supported only if all selected subnets are IPv6 only subnets, and the resource also has an IPv6 address.
            - **Dualstack**Assign both IPv4 and IPv6 addresses to your resource gateway network interfaces. This option is supported only if all selected subnets have both IPv4 and IPv6 address ranges, and the resource either has an IPv4 or IPv6 address.

            The IP address type of the resource gateway is independent of the IP address type of the client or the VPC endpoint through which the resource is accessed.
        ipv4-addresses-per-eni: The number of IPv4 addresses in each ENI for the resource gateway.
        name: The name of the resource gateway.
        security-group-ids: The IDs of the security groups to apply to the resource gateway. The security groups must be in the same VPC.
        subnet-ids: The IDs of the VPC subnets in which to create the resource gateway.
        tags: The tags for the resource gateway.
        vpc-identifier: The ID of the VPC for the resource gateway.
