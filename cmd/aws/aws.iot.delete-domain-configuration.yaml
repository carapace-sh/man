name: delete-domain-configuration
description: Deletes the specified domain configuration.
flags:
    --domain-configuration-name=!: The name of the domain configuration to be deleted.
documentation:
    command: |-
        Deletes the specified domain configuration.

        Requires permission to access the [DeleteDomainConfiguration](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        domain-configuration-name: The name of the domain configuration to be deleted.
