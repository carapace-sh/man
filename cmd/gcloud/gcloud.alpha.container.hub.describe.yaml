name: describe
description: '*(ALPHA)*  Show fleet info.'
documentation:
    command: |-
        *(ALPHA)*  This command can fail for the following reasons:
        * The project specified does not exist.
        * The project specified does not have a fleet.
        * The active account does not have permission to access the given project.

        ## EXAMPLES

        To print metadata for the fleet in project `example-foo-bar-1`, run:

          $ gcloud alpha container hub describe --project=example-foo-bar-1
