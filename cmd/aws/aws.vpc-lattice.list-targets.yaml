name: list-targets
description: Lists the targets for the target group.
flags:
    --max-results=: The maximum number of results to return.
    --next-token=: A pagination token for the next page of results.
    --target-group-identifier=!: The ID or ARN of the target group.
    --targets=: The targets.
documentation:
    command: Lists the targets for the target group. By default, all targets are included. You can use this API to check the health status of targets. You can also ﬁlter the results by target.
    flag:
        max-results: The maximum number of results to return.
        next-token: A pagination token for the next page of results.
        target-group-identifier: The ID or ARN of the target group.
        targets: The targets.
