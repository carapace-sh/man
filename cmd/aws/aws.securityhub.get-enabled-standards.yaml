name: get-enabled-standards
description: Returns a list of the standards that are currently enabled.
flags:
    --max-results=: The maximum number of results to return in the response.
    --next-token=: The token that is required for pagination.
    --standards-subscription-arns=: The list of the standards subscription ARNs for the standards to retrieve.
documentation:
    command: Returns a list of the standards that are currently enabled.
    flag:
        max-results: The maximum number of results to return in the response.
        next-token: |-
            The token that is required for pagination. On your first call to the `GetEnabledStandards` operation, set the value of this parameter to `NULL`.

            For subsequent calls to the operation, to continue listing data, set the value of this parameter to the value returned from the previous response.
        standards-subscription-arns: The list of the standards subscription ARNs for the standards to retrieve.
