name: associate-link
description: Associates a link to a device.
flags:
    --device-id=!: The ID of the device.
    --global-network-id=!: The ID of the global network.
    --link-id=!: The ID of the link.
documentation:
    command: Associates a link to a device. A device can be associated to multiple links and a link can be associated to multiple devices. The device and link must be in the same global network and the same site.
    flag:
        device-id: The ID of the device.
        global-network-id: The ID of the global network.
        link-id: The ID of the link.
