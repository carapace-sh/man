name: update-web-acl
description: This is **AWS WAF Classic** documentation.
flags:
    --change-token=!: The value returned by the most recent call to [GetChangeToken]().
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --default-action=: A default action for the web ACL, either ALLOW or BLOCK.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --updates=:
        description: An array of updates to make to the [WebACL]().
        nargs: -1
    --web-acl-id=!: The `WebACLId` of the [WebACL]() that you want to update.
documentation:
    command: "This is **AWS WAF Classic** documentation. For more information, see [AWS WAF Classic](https://docs.aws.amazon.com/waf/latest/developerguide/classic-waf-chapter.html) in the developer guide.\n\n**For the latest version of AWS WAF**, use the AWS WAFV2 API and see the [AWS WAF Developer Guide](https://docs.aws.amazon.com/waf/latest/developerguide/waf-chapter.html). With the latest version, AWS WAF has a single set of endpoints for regional and global use.\n\nInserts or deletes [ActivatedRule]() objects in a `WebACL`. Each `Rule` identifies web requests that you want to allow, block, or count. When you update a `WebACL`, you specify the following values:\n\n- A default action for the `WebACL`, either `ALLOW` or `BLOCK`. AWS WAF performs the default action if a request doesn't match the criteria in any of the `Rules` in a `WebACL`.\n- The `Rules` that you want to add or delete. If you want to replace one `Rule` with another, you delete the existing `Rule` and add the new one.\n- For each `Rule`, whether you want AWS WAF to allow requests, block requests, or count requests that match the conditions in the `Rule`.\n- The order in which you want AWS WAF to evaluate the `Rules` in a `WebACL`. If you add more than one `Rule` to a `WebACL`, AWS WAF evaluates each request against the `Rules` in order based on the value of `Priority`. (The `Rule` that has the lowest value for `Priority` is evaluated first.) When a web request matches all the predicates (such as `ByteMatchSets` and `IPSets`) in a `Rule`, AWS WAF immediately takes the corresponding action, allow or block, and doesn't evaluate the request against the remaining `Rules` in the `WebACL`, if any.\n\nTo create and configure a `WebACL`, perform the following steps:\n\n1. Create and update the predicates that you want to include in `Rules`. For more information, see [CreateByteMatchSet](), [UpdateByteMatchSet](), [CreateIPSet](), [UpdateIPSet](), [CreateSqlInjectionMatchSet](), and [UpdateSqlInjectionMatchSet]().\n2. Create and update the `Rules` that you want to include in the `WebACL`. For more information, see [CreateRule]() and [UpdateRule]().\n3. Create a `WebACL`. See [CreateWebACL]().\n4. Use `GetChangeToken` to get the change token that you provide in the `ChangeToken` parameter of an [UpdateWebACL]() request.\n5. Submit an `UpdateWebACL` request to specify the `Rules` that you want to include in the `WebACL`, to specify the default action, and to associate the `WebACL` with a CloudFront distribution.\n   \n   The `ActivatedRule` can be a rule group. If you specify a rule group as your `ActivatedRule` , you can exclude specific rules from that rule group.\n   \n   If you already have a rule group associated with a web ACL and want to submit an `UpdateWebACL` request to exclude certain rules from that rule group, you must first remove the rule group from the web ACL, the re-insert it again, specifying the excluded rules. For details, see [ActivatedRule$ExcludedRules]() .\n\nBe aware that if you try to add a RATE\\_BASED rule to a web ACL without setting the rule type when first creating the rule, the [UpdateWebACL]() request will fail because the request tries to add a REGULAR rule (the default rule type) with the specified ID, which does not exist.\n\nFor more information about how to use the AWS WAF API to allow or block HTTP requests, see the [AWS WAF Developer Guide](https://docs.aws.amazon.com/waf/latest/developerguide/)."
    flag:
        change-token: The value returned by the most recent call to [GetChangeToken]().
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        default-action: A default action for the web ACL, either ALLOW or BLOCK. AWS WAF performs the default action if a request doesn't match the criteria in any of the rules in a web ACL.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        updates: |-
            An array of updates to make to the [WebACL]().

            An array of `WebACLUpdate` objects that you want to insert into or delete from a [WebACL](). For more information, see the applicable data types:

            - [WebACLUpdate](): Contains `Action` and `ActivatedRule`
            - [ActivatedRule](): Contains `Action`, `OverrideAction`, `Priority`, `RuleId`, and `Type`. `ActivatedRule|OverrideAction` applies only when updating or adding a `RuleGroup` to a `WebACL`. In this case, you do not use `ActivatedRule|Action`. For all other update requests, `ActivatedRule|Action` is used instead of `ActivatedRule|OverrideAction`.
            - [WafAction](): Contains `Type`
        web-acl-id: The `WebACLId` of the [WebACL]() that you want to update. `WebACLId` is returned by [CreateWebACL]() and by [ListWebACLs]().
