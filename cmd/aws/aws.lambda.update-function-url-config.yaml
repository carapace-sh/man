name: update-function-url-config
description: Updates the configuration for a Lambda function URL.
flags:
    --auth-type=: The type of authentication that your function URL uses.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cors=: The [cross-origin resource sharing (CORS)](https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS) settings for your function URL.
    --function-name=!: The name or ARN of the Lambda function.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --invoke-mode=: 'Use one of the following options:'
    --qualifier=: The alias name.
completion:
    flag:
        auth-type:
            - NONE
            - AWS_IAM
        invoke-mode:
            - BUFFERED
            - RESPONSE_STREAM
documentation:
    command: Updates the configuration for a Lambda function URL.
    flag:
        auth-type: The type of authentication that your function URL uses. Set to `AWS_IAM` if you want to restrict access to authenticated users only. Set to `NONE` if you want to bypass IAM authentication to create a public endpoint. For more information, see [Security and auth model for Lambda function URLs](https://docs.aws.amazon.com/lambda/latest/dg/urls-auth.html).
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cors: The [cross-origin resource sharing (CORS)](https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS) settings for your function URL.
        function-name: |-
            The name or ARN of the Lambda function.

            **Name formats**

            - **Function name** – `my-function`.
            - **Function ARN** – `arn:aws:lambda:us-west-2:123456789012:function:my-function`.
            - **Partial ARN** – `123456789012:function:my-function`.

            The length constraint applies only to the full ARN. If you specify only the function name, it is limited to 64 characters in length.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        invoke-mode: |-
            Use one of the following options:

            - `BUFFERED` – This is the default option. Lambda invokes your function using the `Invoke` API operation. Invocation results are available when the payload is complete. The maximum payload size is 6 MB.
            - `RESPONSE_STREAM` – Your function streams payload results as they become available. Lambda invokes your function using the `InvokeWithResponseStream` API operation. The maximum response payload size is 200 MB.
        qualifier: The alias name.
