name: get-event-types
description: Gets all event types or a specific event type if name is provided.
flags:
    --max-results=: The maximum number of objects to return for the request.
    --name=: The name.
    --next-token=: The next token for the subsequent request.
documentation:
    command: Gets all event types or a specific event type if name is provided. This is a paginated API. If you provide a null `maxResults`, this action retrieves a maximum of 10 records per page. If you provide a `maxResults`, the value must be between 5 and 10. To get the next page results, provide the pagination token from the `GetEventTypesResponse` as part of your request. A null pagination token fetches the records from the beginning.
    flag:
        max-results: The maximum number of objects to return for the request.
        name: The name.
        next-token: The next token for the subsequent request.
