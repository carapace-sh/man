name: delete
description: Delete a Security Health Analytics custom module.
flags:
    --folder=: Folder associated with the custom module.
    --no-validate-only&: If present, the request is validated (including IAM checks) but no action is taken.
    --organization=: Organization associated with the custom module.
    --parent=: Parent associated with the custom module.
    --validate-only: If present, the request is validated (including IAM checks) but no action is taken.
documentation:
    command: |-
        Delete a Security Health Analytics custom module. User specifies the custom
        module as well as the parent of the module to delete. A validation_only flag
        is optional. When set to true only validations (including IAM checks) will
        done for the request (module will not be deleted).

        ## EXAMPLES

        To delete an Security Health Analytics custom module with ID
        `123456` for organization `123`, run:

          $ gcloud scc manage custom-modules sha delete 123456 --organization=123

        To delete a Security Health Analytics custom module with ID
        `123456` for folder `456`, run:

          $ gcloud scc manage custom-modules sha delete 123456 --folder=456

        To delete a Security Health Analytics custom module with ID
        `123456` for project `789`, run:

          $ gcloud scc manage custom-modules sha delete 123456 --project=789

        You can also specify the parent more generally:

          $ gcloud scc manage custom-modules sha delete 123456 --parent=organizations/123

        Or just specify the fully qualified module name:

          $ gcloud scc manage custom-modules sha delete
          organizations/123/locations/global/securityHealthAnalyticsCustomModules/123456
    flag:
        folder: Folder associated with the custom module.
        no-validate-only: If present, the request is validated (including IAM checks) but no action is taken.
        organization: Organization associated with the custom module.
        parent: |-
            Parent associated with the custom module. Can be one of
                          organizations/<id>, projects/<id or name>, folders/<id>
        validate-only: If present, the request is validated (including IAM checks) but no action is taken.
