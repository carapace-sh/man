name: create-analysis-template
description: Creates a new analysis template.
flags:
    --analysis-parameters=:
        description: The parameters of the analysis template.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The description of the analysis template.
    --error-message-configuration=: The configuration that specifies the level of detail in error messages returned by analyses using this template.
    --format=!: The format of the analysis template.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --membership-identifier=!: The identifier for a membership resource.
    --name=!: The name of the analysis template.
    --schema=: ""
    --source=!: The information in the analysis template.
    --tags=: An optional label that you can assign to a resource when you create it.
completion:
    flag:
        format:
            - SQL
            - PYSPARK_1_0
documentation:
    command: Creates a new analysis template.
    flag:
        analysis-parameters: The parameters of the analysis template.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The description of the analysis template.
        error-message-configuration: The configuration that specifies the level of detail in error messages returned by analyses using this template. When set to `DETAILED`, error messages include more information to help troubleshoot issues with PySpark jobs. Detailed error messages may expose underlying data, including sensitive information. Recommended for faster troubleshooting in development and testing environments.
        format: The format of the analysis template.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        membership-identifier: The identifier for a membership resource.
        name: The name of the analysis template.
        schema: ""
        source: The information in the analysis template.
        tags: An optional label that you can assign to a resource when you create it. Each tag consists of a key and an optional value, both of which you define. When you use tagging, you can also use tag-based access control in IAM policies to control access to this resource.
