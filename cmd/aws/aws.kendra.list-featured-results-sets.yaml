name: list-featured-results-sets
description: Lists all your sets of featured results for a given index.
flags:
    --index-id=!: The identifier of the index used for featuring results.
    --max-results=: The maximum number of featured results sets to return.
    --next-token=: If the response is truncated, Amazon Kendra returns a pagination token in the response.
documentation:
    command: Lists all your sets of featured results for a given index. Features results are placed above all other results for certain queries. If there's an exact match of a query, then one or more specific documents are featured in the search results.
    flag:
        index-id: The identifier of the index used for featuring results.
        max-results: The maximum number of featured results sets to return.
        next-token: If the response is truncated, Amazon Kendra returns a pagination token in the response. You can use this pagination token to retrieve the next set of featured results sets.
