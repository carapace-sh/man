name: update-regex-pattern-set
description: This is **AWS WAF Classic** documentation.
flags:
    --change-token=!: The value returned by the most recent call to [GetChangeToken]().
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --regex-pattern-set-id=!: The `RegexPatternSetId` of the [RegexPatternSet]() that you want to update.
    --updates=!:
        description: An array of `RegexPatternSetUpdate` objects that you want to insert into or delete from a [RegexPatternSet]().
        nargs: -1
documentation:
    command: |-
        This is **AWS WAF Classic** documentation. For more information, see [AWS WAF Classic](https://docs.aws.amazon.com/waf/latest/developerguide/classic-waf-chapter.html) in the developer guide.

        **For the latest version of AWS WAF**, use the AWS WAFV2 API and see the [AWS WAF Developer Guide](https://docs.aws.amazon.com/waf/latest/developerguide/waf-chapter.html). With the latest version, AWS WAF has a single set of endpoints for regional and global use.

        Inserts or deletes `RegexPatternString` objects in a [RegexPatternSet](). For each `RegexPatternString` object, you specify the following values:

        - Whether to insert or delete the `RegexPatternString`.
        - The regular expression pattern that you want to insert or delete. For more information, see [RegexPatternSet]().

        For example, you can create a `RegexPatternString` such as `B[a@]dB[o0]t`. AWS WAF will match this `RegexPatternString` to:

        - BadBot
        - BadB0t
        - B@dBot
        - B@dB0t

        To create and configure a `RegexPatternSet`, perform the following steps:

        1. Create a `RegexPatternSet.` For more information, see [CreateRegexPatternSet]().
        2. Use [GetChangeToken]() to get the change token that you provide in the `ChangeToken` parameter of an `UpdateRegexPatternSet` request.
        3. Submit an `UpdateRegexPatternSet` request to specify the regular expression pattern that you want AWS WAF to watch for.

        For more information about how to use the AWS WAF API to allow or block HTTP requests, see the [AWS WAF Developer Guide](https://docs.aws.amazon.com/waf/latest/developerguide/).
    flag:
        change-token: The value returned by the most recent call to [GetChangeToken]().
        cli-input-json: |-
            Reads arguments from the JSON string provided.
