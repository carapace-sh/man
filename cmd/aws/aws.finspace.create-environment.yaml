name: create-environment
description: Create a new FinSpace environment.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --data-bundles=: The list of Amazon Resource Names (ARN) of the data bundles to install.
    --description=: The description of the FinSpace environment to be created.
    --federation-mode=: Authentication mode for the environment.
    --federation-parameters=: Configuration information when authentication mode is FEDERATED.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --kms-key-id=: The KMS key id to encrypt your data in the FinSpace environment.
    --name=!: The name of the FinSpace environment to be created.
    --superuser-parameters=: Configuration information for the superuser.
    --tags=: Add tags to your FinSpace environment.
completion:
    flag:
        federation-mode:
            - FEDERATED
            - LOCAL
documentation:
    command: Create a new FinSpace environment.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        data-bundles: |-
            The list of Amazon Resource Names (ARN) of the data bundles to install. Currently supported data bundle ARNs:

            - `arn:aws:finspace:${Region}::data-bundle/capital-markets-sample` - Contains sample Capital Markets datasets, categories and controlled vocabularies.
            - `arn:aws:finspace:${Region}::data-bundle/taq` (default) - Contains trades and quotes data in addition to sample Capital Markets data.
        description: The description of the FinSpace environment to be created.
        federation-mode: |-
            Authentication mode for the environment.

            - `FEDERATED` - Users access FinSpace through Single Sign On (SSO) via your Identity provider.
            - `LOCAL` - Users access FinSpace via email and password managed within the FinSpace environment.
        federation-parameters: Configuration information when authentication mode is FEDERATED.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        kms-key-id: The KMS key id to encrypt your data in the FinSpace environment.
        name: The name of the FinSpace environment to be created.
        superuser-parameters: Configuration information for the superuser.
        tags: Add tags to your FinSpace environment.
