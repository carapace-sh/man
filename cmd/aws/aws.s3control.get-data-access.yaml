name: get-data-access
description: Returns a temporary access credential from S3 Access Grants to the grantee or client application.
flags:
    --account-id=!: The Amazon Web Services account ID of the S3 Access Grants instance.
    --duration-seconds=: The session duration, in seconds, of the temporary access credential that S3 Access Grants vends to the grantee or client application.
    --permission=!: 'The type of permission granted to your S3 data, which can be set to one of the following values:'
    --privilege=: The scope of the temporary access credential that S3 Access Grants vends to the grantee or client application.
    --target-type=: The type of `Target`.
    --target=!: The S3 URI path of the data to which you are requesting temporary access credentials.
completion:
    flag:
        permission:
            - READ
            - WRITE
            - READWRITE
        privilege:
            - Minimal
            - Default
        target-type:
            - Object
documentation:
    command: |-
        Returns a temporary access credential from S3 Access Grants to the grantee or client application. The [temporary credential](https://docs.aws.amazon.com/STS/latest/APIReference/API_Credentials.html) is an Amazon Web Services STS token that grants them access to the S3 data.

        Permissions

        You must have the `s3:GetDataAccess` permission to use this operation.

        Additional Permissions

        The IAM role that S3 Access Grants assumes must have the following permissions specified in the trust policy when registering the location: `sts:AssumeRole`, for directory users or groups `sts:SetContext`, and for IAM users or roles `sts:SetSourceIdentity`.

        You must URL encode any signed header values that contain spaces. For example, if your header value is `my file.txt`, containing two spaces after `my`, you must URL encode this value to `my%20%20file.txt`.
    flag:
        account-id: The Amazon Web Services account ID of the S3 Access Grants instance.
        duration-seconds: The session duration, in seconds, of the temporary access credential that S3 Access Grants vends to the grantee or client application. The default value is 1 hour, but the grantee can specify a range from 900 seconds (15 minutes) up to 43200 seconds (12 hours). If the grantee requests a value higher than this maximum, the operation fails.
        permission: |-
            The type of permission granted to your S3 data, which can be set to one of the following values:

            - `READ` – Grant read-only access to the S3 data.
            - `WRITE` – Grant write-only access to the S3 data.
            - `READWRITE` – Grant both read and write access to the S3 data.
        privilege: |-
            The scope of the temporary access credential that S3 Access Grants vends to the grantee or client application.

            - `Default` – The scope of the returned temporary access token is the scope of the grant that is closest to the target scope.
            - `Minimal` – The scope of the returned temporary access token is the same as the requested target scope as long as the requested scope is the same as or a subset of the grant scope.
        target: The S3 URI path of the data to which you are requesting temporary access credentials. If the requesting account has an access grant for this data, S3 Access Grants vends temporary access credentials in the response.
        target-type: The type of `Target`. The only possible value is `Object`. Pass this value if the target data that you would like to access is a path to an object. Do not pass this value if the target data is a bucket or a bucket and a prefix.
