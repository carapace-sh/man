name: create-sdi-source
description: Create an SdiSource for each video source that uses the SDI protocol.
flags:
    --mode=: Applies only if the type is QUAD.
    --name=: Specify a name that is unique in the AWS account.
    --request-id=: An ID that you assign to a create request.
    --tags=: A collection of key-value pairs.
    --type=: 'Specify the type of the SDI source: SINGLE: The source is a single-link source.'
completion:
    flag:
        mode:
            - QUADRANT
            - INTERLEAVE
        type:
            - SINGLE
            - QUAD
documentation:
    command: Create an SdiSource for each video source that uses the SDI protocol. You will reference the SdiSource when you create an SDI input in MediaLive. You will also reference it in an SdiSourceMapping, in order to create a connection between the logical SdiSource and the physical SDI card and port that the physical SDI source uses.
    flag:
        mode: 'Applies only if the type is QUAD. Specify the mode for handling the quad-link signal: QUADRANT or INTERLEAVE.'
        name: Specify a name that is unique in the AWS account. We recommend you assign a name that describes the source, for example curling-cameraA. Names are case-sensitive.
        request-id: An ID that you assign to a create request. This ID ensures idempotency when creating resources.
        tags: A collection of key-value pairs.
        type: 'Specify the type of the SDI source: SINGLE: The source is a single-link source. QUAD: The source is one part of a quad-link source.'
