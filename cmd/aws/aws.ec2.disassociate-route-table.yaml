name: disassociate-route-table
description: Disassociates a subnet or gateway from a route table.
flags:
    --association-id=!: The association ID representing the current association between the route table and subnet or gateway.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: |-
        Disassociates a subnet or gateway from a route table.

        After you perform this action, the subnet no longer uses the routes in the route table. Instead, it uses the routes in the VPC's main route table. For more information about route tables, see [Route tables](https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Route_Tables.html) in the *Amazon VPC User Guide*.
    flag:
        association-id: The association ID representing the current association between the route table and subnet or gateway.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
