name: get-playback-key-pair
description: Gets a specified playback authorization key pair and returns the `arn` and `fingerprint`.
flags:
    --arn=!: ARN of the key pair to be returned.
documentation:
    command: Gets a specified playback authorization key pair and returns the `arn` and `fingerprint`. The `privateKey` held by the caller can be used to generate viewer authorization tokens, to grant viewers access to private channels. For more information, see [Setting Up Private Channels](https://docs.aws.amazon.com/ivs/latest/userguide/private-channels.html) in the *Amazon IVS User Guide*.
    flag:
        arn: ARN of the key pair to be returned.
