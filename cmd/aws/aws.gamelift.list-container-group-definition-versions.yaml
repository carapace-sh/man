name: list-container-group-definition-versions
description: |-
    **This API works with the following fleet types:** Container

    Retrieves all versions of a container group definition.
flags:
    --limit=: The maximum number of results to return.
    --name=!: The unique identifier for the container group definition to retrieve properties for.
    --next-token=: A token that indicates the start of the next sequential page of results.
documentation:
    command: |-
        **This API works with the following fleet types:** Container

        Retrieves all versions of a container group definition. Use the pagination parameters to retrieve results in a set of sequential pages.

        **Request options:**

        - Get all versions of a specified container group definition. Specify the container group definition name or ARN value. (If the ARN value has a version number, it's ignored.)

        **Results:**

        If successful, this operation returns the complete properties of a set of container group definition versions that match the request.

        This operation returns the list of container group definitions in descending version order (latest first).

        **Learn more**

        - [Manage a container group definition](https://docs.aws.amazon.com/gamelift/latest/developerguide/containers-create-groups.html)
    flag:
        limit: The maximum number of results to return. Use this parameter with `NextToken` to get results as a set of sequential pages.
        name: The unique identifier for the container group definition to retrieve properties for. You can use either the `Name` or `ARN` value.
        next-token: A token that indicates the start of the next sequential page of results. Use the token that is returned with a previous call to this operation. To start at the beginning of the result set, do not specify a value.
