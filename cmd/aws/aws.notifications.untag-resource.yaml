name: untag-resource
description: Untags a resource with a specified Amazon Resource Name (ARN).
flags:
    --arn=!: The Amazon Resource Name (ARN) to use to untag a resource.
    --tag-keys=!: The tag keys to use to untag a resource.
documentation:
    command: |-
        Untags a resource with a specified Amazon Resource Name (ARN).

        For more information, see [Tagging your Amazon Web Services resources](https://docs.aws.amazon.com/tag-editor/latest/userguide/tagging.html) in the *Tagging Amazon Web Services Resources User Guide*.
    flag:
        arn: The Amazon Resource Name (ARN) to use to untag a resource.
        tag-keys: The tag keys to use to untag a resource.
