name: update
description: Update a Compute Engine interconnect MACsec configuration.
flags:
    --enabled: Enable or disable MACsec on this Interconnect.
    --fail-open: If enabled, the Interconnect will be configured with a should-secure
    --no-enabled&: Enable or disable MACsec on this Interconnect.
    --no-fail-open&: If enabled, the Interconnect will be configured with a should-secure
documentation:
    command: |
        *gcloud compute interconnects macsec update* is used to update MACsec configuration of interconnect. An
        interconnect represents a single specific connection between Google and
        the customer.

        For an example, refer to the *EXAMPLES* section below.
    flag:
        enabled: |-
            Enable or disable MACsec on this Interconnect. MACsec enablement will fail
            if the MACsec configuration is not specified. Use --no-enabled to disable
            it.
        fail-open: |-
            If enabled, the Interconnect will be configured with a should-secure
            MACsec security policy, that allows the Google router to fallback to
            cleartext traffic if the MKA session cannot be established. By default,
            the Interconnect will be configured with a must-secure security policy
            that drops all traffic if the MKA session cannot be established with your
            router. Use --no-fail-open to disable it.
        no-enabled: |
            Enable or disable MACsec on this Interconnect. MACsec enablement will fail
            if the MACsec configuration is not specified. Use --no-enabled to disable
            it.
        no-fail-open: |
            If enabled, the Interconnect will be configured with a should-secure
            MACsec security policy, that allows the Google router to fallback to
            cleartext traffic if the MKA session cannot be established. By default,
            the Interconnect will be configured with a must-secure security policy
            that drops all traffic if the MKA session cannot be established with your
            router. Use --no-fail-open to disable it.
