name: cancel
description: '*(BETA)*  Cancel an execution.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: Region in which the resource can be found.
documentation:
    command: |
        *(BETA)*  Cancel an execution.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. Defaults to --no-async. Use *--async* to enable and *--no-async* to disable.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete. Defaults to --no-async.
        region: Region in which the resource can be found. Alternatively, set the property [run/region].
