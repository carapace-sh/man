name: create-dedicated-ip-pool
description: Create a new pool of dedicated IP addresses.
flags:
    --pool-name=!: The name of the dedicated IP pool.
    --tags=: An object that defines the tags (keys and values) that you want to associate with the pool.
documentation:
    command: Create a new pool of dedicated IP addresses. A pool can include one or more dedicated IP addresses that are associated with your Amazon Pinpoint account. You can associate a pool with a configuration set. When you send an email that uses that configuration set, Amazon Pinpoint sends it using only the IP addresses in the associated pool.
    flag:
        pool-name: The name of the dedicated IP pool.
        tags: An object that defines the tags (keys and values) that you want to associate with the pool.
