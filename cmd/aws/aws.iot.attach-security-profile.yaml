name: attach-security-profile
description: Associates a Device Defender security profile with a thing group or this account.
flags:
    --security-profile-name=!: The security profile that is attached.
    --security-profile-target-arn=!: The ARN of the target (thing group) to which the security profile is attached.
documentation:
    command: |-
        Associates a Device Defender security profile with a thing group or this account. Each thing group or account can have up to five security profiles associated with it.

        Requires permission to access the [AttachSecurityProfile](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        security-profile-name: The security profile that is attached.
        security-profile-target-arn: The ARN of the target (thing group) to which the security profile is attached.
