name: describe-notification-configuration
description: Gets the `NotificationConfiguration` for a given Kinesis video stream.
flags:
    --stream-arn=: The Amazon Resource Name (ARN) of the Kinesis video stream from where you want to retrieve the notification configuration.
    --stream-name=: The name of the stream from which to retrieve the notification configuration.
documentation:
    command: Gets the `NotificationConfiguration` for a given Kinesis video stream.
    flag:
        stream-arn: The Amazon Resource Name (ARN) of the Kinesis video stream from where you want to retrieve the notification configuration. You must specify either the `StreamName` or the StreamARN.
        stream-name: The name of the stream from which to retrieve the notification configuration. You must specify either the `StreamName` or the `StreamARN`.
