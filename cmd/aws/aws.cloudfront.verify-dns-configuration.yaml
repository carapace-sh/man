name: verify-dns-configuration
description: Verify the DNS configuration for your domain names.
flags:
    --domain=: The domain name that you're verifying.
    --identifier=!: The identifier of the distribution tenant.
documentation:
    command: Verify the DNS configuration for your domain names. This API operation checks whether your domain name points to the correct routing endpoint of the connection group, such as d111111abcdef8.cloudfront.net. You can use this API operation to troubleshoot and resolve DNS configuration issues.
    flag:
        domain: The domain name that you're verifying.
        identifier: The identifier of the distribution tenant. You can specify the ARN, ID, or name of the distribution tenant.
