name: create-map
description: This operation is no longer current and may be deprecated in the future.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration=!: Specifies the `MapConfiguration`, including the map style, for the map resource that you create.
    --description=: An optional description for the map resource.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --map-name=!: The name for the map resource.
    --pricing-plan=: No longer used.
    --tags=: Applies one or more tags to the map resource.
completion:
    flag:
        pricing-plan:
            - RequestBasedUsage
            - MobileAssetTracking
            - MobileAssetManagement
documentation:
    command: |-
        This operation is no longer current and may be deprecated in the future. We recommend upgrading to the Maps API V2 unless you require `Grab` data.

        - `CreateMap` is part of a previous Amazon Location Service Maps API (version 1) which has been superseded by a more intuitive, powerful, and complete API (version 2).
        - The Maps API version 2 has a simplified interface that can be used without creating or managing map resources.
        - If you are using an AWS SDK or the AWS CLI, note that the Maps API version 2 is found under `geo-maps` or `geo_maps`, not under `location`.
        - Since `Grab` is not yet fully supported in Maps API version 2, we recommend you continue using API version 1 when using `Grab`.
        - Start your version 2 API journey with the [Maps V2 API Reference](https://docs.aws.amazon.com/location/latest/APIReference/API_Operations_Amazon_Location_Service_Maps_V2.html) or the [Developer Guide](https://docs.aws.amazon.com/location/latest/developerguide/maps.html).

        Creates a map resource in your Amazon Web Services account, which provides map tiles of different styles sourced from global location data providers.

        If your application is tracking or routing assets you use in your business, such as delivery vehicles or employees, you must not use Esri as your geolocation provider. See section 82 of the [Amazon Web Services service terms](http://aws.amazon.com/service-terms) for more details.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration: Specifies the `MapConfiguration`, including the map style, for the map resource that you create. The map style defines the look of maps and the data provider for your map resource.
        description: An optional description for the map resource.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        map-name: |-
            The name for the map resource.

            Requirements:

            - Must contain only alphanumeric characters (A–Z, a–z, 0–9), hyphens (-), periods (.), and underscores (\_).
            - Must be a unique map resource name.
            - No spaces allowed. For example, `ExampleMap`.
        pricing-plan: No longer used. If included, the only allowed value is `RequestBasedUsage`.
        tags: |-
            Applies one or more tags to the map resource. A tag is a key-value pair helps manage, identify, search, and filter your resources by labelling them.

            Format: `"key" : "value"`

            Restrictions:

            - Maximum 50 tags per resource
            - Each resource tag must be unique with a maximum of one value.
            - Maximum key length: 128 Unicode characters in UTF-8
            - Maximum value length: 256 Unicode characters in UTF-8
            - Can use alphanumeric characters (A–Z, a–z, 0–9), and the following characters: + - = . _ : / @.
            - Cannot use "aws:" as a prefix for a key.
