name: batch-disassociate-client-device-from-core-device
description: Disassociates a list of client devices from a core device.
flags:
    --core-device-thing-name=!: The name of the core device.
    --entries=: The list of client devices to disassociate.
documentation:
    command: Disassociates a list of client devices from a core device. After you disassociate a client device from a core device, the client device won't be able to use cloud discovery to retrieve the core device's connectivity information and certificates.
    flag:
        core-device-thing-name: The name of the core device. This is also the name of the IoT thing.
        entries: The list of client devices to disassociate.
