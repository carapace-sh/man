name: list-group-memberships
description: For the specified group in the specified identity store, returns the list of all `GroupMembership` objects and returns results in paginated form.
flags:
    --group-id=!: The identifier for a group in the identity store.
    --identity-store-id=!: The globally unique identifier for the identity store.
    --max-results=: The maximum number of results to be returned per request.
    --next-token=: The pagination token used for the `ListUsers`, `ListGroups` and `ListGroupMemberships` API operations.
documentation:
    command: |-
        For the specified group in the specified identity store, returns the list of all `GroupMembership` objects and returns results in paginated form.

        If you have access to a member account, you can use this API operation from the member account. For more information, see [Limiting access to the identity store from member accounts](https://docs.aws.amazon.com/singlesignon/latest/userguide/manage-your-accounts.html#limiting-access-from-member-accounts) in the *IAM Identity Center User Guide*.
    flag:
        group-id: The identifier for a group in the identity store.
        identity-store-id: The globally unique identifier for the identity store.
        max-results: The maximum number of results to be returned per request. This parameter is used in all `List` requests to specify how many results to return in one page.
        next-token: The pagination token used for the `ListUsers`, `ListGroups` and `ListGroupMemberships` API operations. This value is generated by the identity store service. It is returned in the API response if the total results are more than the size of one page. This token is also returned when it is used in the API request to search for the next page.
