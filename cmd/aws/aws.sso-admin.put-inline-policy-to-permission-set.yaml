name: put-inline-policy-to-permission-set
description: Attaches an inline policy to a permission set.
flags:
    --inline-policy=!: The inline policy to attach to a [PermissionSet]().
    --instance-arn=!: The ARN of the IAM Identity Center instance under which the operation will be executed.
    --permission-set-arn=!: The ARN of the permission set.
documentation:
    command: |-
        Attaches an inline policy to a permission set.

        If the permission set is already referenced by one or more account assignments, you will need to call `ProvisionPermissionSet` after this action to apply the corresponding IAM policy updates to all assigned accounts.
    flag:
        inline-policy: The inline policy to attach to a [PermissionSet]().
        instance-arn: The ARN of the IAM Identity Center instance under which the operation will be executed. For more information about ARNs, see [Amazon Resource Names (ARNs) and Amazon Web Services Service Namespaces](/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference*.
        permission-set-arn: The ARN of the permission set.
