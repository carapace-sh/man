name: list-domains
description: Lists all the domains in the Amazon Web Services account.
flags:
    --max-results=: The maximum number of results that are returned per call.
    --next-token=: If `NextToken` is returned, there are more results available.
documentation:
    command: Lists all the domains in the Amazon Web Services account.
    flag:
        max-results: The maximum number of results that are returned per call. You can use `NextToken` to obtain more pages of results. The default is 100; the maximum allowed page size is also 100.
        next-token: If `NextToken` is returned, there are more results available. The value of `NextToken` is a unique pagination token for each page. Make the call again using the returned token to retrieve the next page. Keep all other arguments unchanged. Each pagination token expires after 24 hours.
