name: start-route-analysis
description: Starts analyzing the routing path between the specified source and destination.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --destination=!: The destination.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --global-network-id=!: The ID of the global network.
    --include-return-path: Indicates whether to analyze the return path.
    --no-include-return-path: Indicates whether to analyze the return path.
    --no-use-middleboxes: Indicates whether to include the location of middlebox appliances in the route analysis.
    --source=!: The source from which traffic originates.
    --use-middleboxes: Indicates whether to include the location of middlebox appliances in the route analysis.
documentation:
    command: Starts analyzing the routing path between the specified source and destination. For more information, see [Route Analyzer](https://docs.aws.amazon.com/vpc/latest/tgw/route-analyzer.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        destination: The destination.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        global-network-id: The ID of the global network.
        include-return-path: Indicates whether to analyze the return path. The default is `false`.
        source: The source from which traffic originates.
        use-middleboxes: Indicates whether to include the location of middlebox appliances in the route analysis. The default is `false`.
