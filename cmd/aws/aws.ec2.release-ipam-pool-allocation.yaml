name: release-ipam-pool-allocation
description: Release an allocation within an IPAM pool.
flags:
    --cidr=!: The CIDR of the allocation you want to release.
    --dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --ipam-pool-allocation-id=!: The ID of the allocation.
    --ipam-pool-id=!: The ID of the IPAM pool which contains the allocation you want to release.
    --no-dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
documentation:
    command: |-
        Release an allocation within an IPAM pool. The Region you use should be the IPAM pool locale. The locale is the Amazon Web Services Region where this IPAM pool is available for allocations. You can only use this action to release manual allocations. To remove an allocation for a resource without deleting the resource, set its monitored state to false using [ModifyIpamResourceCidr](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_ModifyIpamResourceCidr.html). For more information, see [Release an allocation](https://docs.aws.amazon.com/vpc/latest/ipam/release-alloc-ipam.html) in the *Amazon VPC IPAM User Guide*.

        All EC2 API actions follow an [eventual consistency](https://docs.aws.amazon.com/ec2/latest/devguide/eventual-consistency.html) model.
    flag:
        cidr: The CIDR of the allocation you want to release.
        dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        ipam-pool-allocation-id: The ID of the allocation.
        ipam-pool-id: The ID of the IPAM pool which contains the allocation you want to release.
