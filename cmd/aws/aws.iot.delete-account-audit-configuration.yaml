name: delete-account-audit-configuration
description: Restores the default settings for Device Defender audits for this account.
flags:
    --delete-scheduled-audits=: If true, all scheduled audits are deleted.
documentation:
    command: |-
        Restores the default settings for Device Defender audits for this account. Any configuration data you entered is deleted and all audit checks are reset to disabled.

        Requires permission to access the [DeleteAccountAuditConfiguration](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        delete-scheduled-audits: If true, all scheduled audits are deleted.
