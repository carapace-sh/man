name: execute-statement
description: Runs an SQL statement, which can be data manipulation language (DML) or data definition language (DDL).
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --cluster-identifier=: The cluster identifier.
    --database=: The name of the database.
    --db-user=: The database user name.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-with-event: A value that indicates whether to send an event to the Amazon EventBridge event bus after the SQL statement runs.
    --parameters=:
        description: The parameters for the SQL statement.
        nargs: -1
    --result-format=: The data format of the result of the SQL statement.
    --secret-arn=: The name or ARN of the secret that enables access to the database.
    --session-id=: The session identifier of the query.
    --session-keep-alive-seconds=: The number of seconds to keep the session alive after the query finishes.
    --sql=!: The SQL statement text to run.
    --statement-name=: The name of the SQL statement.
    --with-event: A value that indicates whether to send an event to the Amazon EventBridge event bus after the SQL statement runs.
    --workgroup-name=: The serverless workgroup name or Amazon Resource Name (ARN).
completion:
    flag:
        result-format:
            - JSON
            - CSV
documentation:
    command: "Runs an SQL statement, which can be data manipulation language (DML) or data definition language (DDL). This statement must be a single SQL statement. Depending on the authorization method, use one of the following combinations of request parameters:\n\n- Secrets Manager - when connecting to a cluster, provide the `secret-arn` of a secret stored in Secrets Manager which has `username` and `password`. The specified secret contains credentials to connect to the `database` you specify. When you are connecting to a cluster, you also supply the database name, If you provide a cluster identifier (`dbClusterIdentifier`), it must match the cluster identifier stored in the secret. When you are connecting to a serverless workgroup, you also supply the database name.\n- Temporary credentials - when connecting to your data warehouse, choose one of the following options:\n  \n  - When connecting to a serverless workgroup, specify the workgroup name and database name. The database user name is derived from the IAM identity. For example, `arn:iam::123456789012:user:foo` has the database user name `IAM:foo`. Also, permission to call the `redshift-serverless:GetCredentials` operation is required.\n  - When connecting to a cluster as an IAM identity, specify the cluster identifier and the database name. The database user name is derived from the IAM identity. For example, `arn:iam::123456789012:user:foo` has the database user name `IAM:foo`. Also, permission to call the `redshift:GetClusterCredentialsWithIAM` operation is required.\n  - When connecting to a cluster as a database user, specify the cluster identifier, the database name, and the database user name. Also, permission to call the `redshift:GetClusterCredentials` operation is required.\n\nFor more information about the Amazon Redshift Data API and CLI usage examples, see [Using the Amazon Redshift Data API](https://docs.aws.amazon.com/redshift/latest/mgmt/data-api.html) in the *Amazon Redshift Management Guide*."
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        cluster-identifier: The cluster identifier. This parameter is required when connecting to a cluster and authenticating using either Secrets Manager or temporary credentials.
        database: The name of the database. This parameter is required when authenticating using either Secrets Manager or temporary credentials.
        db-user: The database user name. This parameter is required when connecting to a cluster as a database user and authenticating using temporary credentials.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        parameters: The parameters for the SQL statement.
        result-format: The data format of the result of the SQL statement. If no format is specified, the default is JSON.
        secret-arn: The name or ARN of the secret that enables access to the database. This parameter is required when authenticating using Secrets Manager.
        session-id: The session identifier of the query.
        session-keep-alive-seconds: The number of seconds to keep the session alive after the query finishes. The maximum time a session can keep alive is 24 hours. After 24 hours, the session is forced closed and the query is terminated.
        sql: The SQL statement text to run.
        statement-name: The name of the SQL statement. You can name the SQL statement when you create it to identify the query.
        with-event: A value that indicates whether to send an event to the Amazon EventBridge event bus after the SQL statement runs.
        workgroup-name: The serverless workgroup name or Amazon Resource Name (ARN). This parameter is required when connecting to a serverless workgroup and authenticating using either Secrets Manager or temporary credentials.
