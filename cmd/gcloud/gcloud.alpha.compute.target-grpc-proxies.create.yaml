name: create
description: '*(ALPHA)*  Create a target gRPC proxy.'
flags:
    --description=: An optional, textual description for the target gRPC proxy.
    --global-url-map: If set, the URL map is global.
    --no-global-url-map&: If set, the URL map is global.
    --no-validate-for-proxyless&: If specified, configuration in the associated urlMap and the
    --url-map-region=: Region of the URL map to operate on.
    --url-map=!: A reference to a URL map resource.
    --validate-for-proxyless: If specified, configuration in the associated urlMap and the
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute target-grpc-proxies create* is used to create target gRPC proxies. A target gRPC proxy is
        a component of load balancers intended for load balancing gRPC traffic.
        Global forwarding rules reference a target gRPC proxy. The Target gRPC
        proxy references a URL map which specifies how traffic routes to gRPC
        backend services.
    flag:
        description: An optional, textual description for the target gRPC proxy.
        global-url-map: If set, the URL map is global.
        no-global-url-map: If set, the URL map is global.
        no-validate-for-proxyless: |
            If specified, configuration in the associated urlMap and the
            BackendServices is checked to allow only the features that are supported
            in the latest release of gRPC.

            If unspecified, no such configuration checks are performed. This may cause
            unexpected behavior in gRPC applications if unsupported features are
            configured.
        url-map: |-
            A reference to a URL map resource. A URL map defines the mapping of URLs
            to backend services. Before you can refer to a URL map, you must
            create the URL map. To delete a URL map that a target proxy is referring
            to, you must first delete the target gRPC proxy.
        url-map-region: Region of the URL map to operate on. Overrides the default *compute/region* property value for this command invocation.
        validate-for-proxyless: |-
            If specified, configuration in the associated urlMap and the
            BackendServices is checked to allow only the features that are supported
            in the latest release of gRPC.
            +
            If unspecified, no such configuration checks are performed. This may cause
            unexpected behavior in gRPC applications if unsupported features are
            configured.
