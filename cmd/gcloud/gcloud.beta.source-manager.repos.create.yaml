name: create
description: '*(BETA)*  Create a Secure Source Manager repository.'
flags:
    --default-branch=: Default branch name of the repository.
    --description=: Description of the repository.
    --gitignores=: List of gitignore template names user can choose from.
    --instance=!: A Secure Source Manager instance ID.
    --license=: License template name user can choose from.
    --readme=: README template name.
    --region=: Secure Source Manager location.
documentation:
    command: |
        *(BETA)*  Create a Secure Source Manager repository.
    flag:
        default-branch: Default branch name of the repository.
        description: Description of the repository. Cannot exceed 500 characters.
        gitignores: 'List of gitignore template names user can choose from. Full list can be found here: https://cloud.google.com/secure-source-manager/docs/reference/rest/v1/projects.locations.repositories#InitialConfig'
        instance: A Secure Source Manager instance ID.
        license: 'License template name user can choose from. Full list can be found here: https://cloud.google.com/secure-source-manager/docs/reference/rest/v1/projects.locations.repositories#InitialConfig'
        readme: 'README template name. Valid template name(s) are: default.'
        region: |-
            Secure Source Manager location.
            +
            To set the `region` attribute:
            * provide the argument `repository` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
