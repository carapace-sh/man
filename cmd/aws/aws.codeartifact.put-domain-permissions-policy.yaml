name: put-domain-permissions-policy
description: Sets a resource policy on a domain that specifies permissions to access it.
flags:
    --domain-owner=: The 12-digit account number of the Amazon Web Services account that owns the domain.
    --domain=!: The name of the domain on which to set the resource policy.
    --policy-document=!: A valid displayable JSON Aspen policy string to be set as the access control resource policy on the provided domain.
    --policy-revision=: The current revision of the resource policy to be set.
documentation:
    command: |-
        Sets a resource policy on a domain that specifies permissions to access it.

        When you call `PutDomainPermissionsPolicy`, the resource policy on the domain is ignored when evaluting permissions. This ensures that the owner of a domain cannot lock themselves out of the domain, which would prevent them from being able to update the resource policy.
    flag:
        domain: The name of the domain on which to set the resource policy.
        domain-owner: The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces.
        policy-document: A valid displayable JSON Aspen policy string to be set as the access control resource policy on the provided domain.
        policy-revision: The current revision of the resource policy to be set. This revision is used for optimistic locking, which prevents others from overwriting your changes to the domain's resource policy.
