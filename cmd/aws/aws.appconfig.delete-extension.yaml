name: delete-extension
description: Deletes an AppConfig extension.
flags:
    --extension-identifier=!: The name, ID, or Amazon Resource Name (ARN) of the extension you want to delete.
    --version-number=: A specific version of an extension to delete.
documentation:
    command: Deletes an AppConfig extension. You must delete all associations to an extension before you delete the extension.
    flag:
        extension-identifier: The name, ID, or Amazon Resource Name (ARN) of the extension you want to delete.
        version-number: A specific version of an extension to delete. If omitted, the highest version is deleted.
