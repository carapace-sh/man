name: get-bucket-bundles
description: Returns the bundles that you can apply to a Amazon Lightsail bucket.
flags:
    --include-inactive: A Boolean value that indicates whether to include inactive (unavailable) bundles in the response of your request.
    --no-include-inactive: A Boolean value that indicates whether to include inactive (unavailable) bundles in the response of your request.
documentation:
    command: |-
        Returns the bundles that you can apply to a Amazon Lightsail bucket.

        The bucket bundle specifies the monthly cost, storage quota, and data transfer quota for a bucket.

        Use the [UpdateBucketBundle](https://docs.aws.amazon.com/lightsail/2016-11-28/api-reference/API_UpdateBucketBundle.html) action to update the bundle for a bucket.
    flag:
        include-inactive: A Boolean value that indicates whether to include inactive (unavailable) bundles in the response of your request.
