name: describe
description: '*(BETA)*  Describe the EkmConfig.'
flags:
    --location=!: ID of the location or fully qualified identifier for the location.
documentation:
    command: |-
        *(BETA)*  gcloud beta kms ekm-config describe can be used to retrieve the EkmConfig.

        ## EXAMPLES

        The following command retrieves the EkmConfig in `us-east1` for the current
        project:

        $ gcloud beta kms ekm-config describe --location=us-east1

        The following command retrieves the EkmConfig for its project `foo` and
        location `us-east1`:

          $ gcloud beta kms ekm-config describe --location="projects/foo/locations/us-east1"
    flag:
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line.
