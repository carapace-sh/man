name: list-vpc-endpoints
description: Returns the OpenSearch Serverless-managed interface VPC endpoints associated with the current account.
flags:
    --max-results=: An optional parameter that specifies the maximum number of results to return.
    --next-token=: If your initial `ListVpcEndpoints` operation returns a `nextToken`, you can include the returned `nextToken` in subsequent `ListVpcEndpoints` operations, which returns results in the next page.
    --vpc-endpoint-filters=: Filter the results according to the current status of the VPC endpoint.
documentation:
    command: Returns the OpenSearch Serverless-managed interface VPC endpoints associated with the current account. For more information, see [Access Amazon OpenSearch Serverless using an interface endpoint](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-vpc.html).
    flag:
        max-results: An optional parameter that specifies the maximum number of results to return. You can use `nextToken` to get the next page of results. The default is 20.
        next-token: If your initial `ListVpcEndpoints` operation returns a `nextToken`, you can include the returned `nextToken` in subsequent `ListVpcEndpoints` operations, which returns results in the next page.
        vpc-endpoint-filters: Filter the results according to the current status of the VPC endpoint. Possible statuses are `CREATING`, `DELETING`, `UPDATING`, `ACTIVE`, and `FAILED`.
