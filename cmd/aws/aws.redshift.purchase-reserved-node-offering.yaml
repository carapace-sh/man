name: purchase-reserved-node-offering
description: Allows you to purchase reserved nodes.
flags:
    --node-count=: The number of reserved nodes that you want to purchase.
    --reserved-node-offering-id=!: The unique identifier of the reserved node offering you want to purchase.
documentation:
    command: |-
        Allows you to purchase reserved nodes. Amazon Redshift offers a predefined set of reserved node offerings. You can purchase one or more of the offerings. You can call the [DescribeReservedNodeOfferings]() API to obtain the available reserved node offerings. You can call this API by providing a specific reserved node offering and the number of nodes you want to reserve.

        For more information about reserved node offerings, go to [Purchasing Reserved Nodes](https://docs.aws.amazon.com/redshift/latest/mgmt/purchase-reserved-node-instance.html) in the *Amazon Redshift Cluster Management Guide*.
    flag:
        node-count: |-
            The number of reserved nodes that you want to purchase.

            Default: `1`
        reserved-node-offering-id: The unique identifier of the reserved node offering you want to purchase.
