name: update-subscriber
description: Updates an existing subscription for the given Amazon Security Lake account ID.
flags:
    --sources=: The supported Amazon Web Services services from which logs and events are collected.
    --subscriber-description=: The description of the Security Lake account subscriber.
    --subscriber-id=!: A value created by Security Lake that uniquely identifies your subscription.
    --subscriber-identity=: The Amazon Web Services identity used to access your data.
    --subscriber-name=: The name of the Security Lake account subscriber.
documentation:
    command: Updates an existing subscription for the given Amazon Security Lake account ID. You can update a subscriber by changing the sources that the subscriber consumes data from.
    flag:
        sources: The supported Amazon Web Services services from which logs and events are collected. For the list of supported Amazon Web Services services, see the [Amazon Security Lake User Guide](https://docs.aws.amazon.com/security-lake/latest/userguide/internal-sources.html).
        subscriber-description: The description of the Security Lake account subscriber.
        subscriber-id: A value created by Security Lake that uniquely identifies your subscription.
        subscriber-identity: The Amazon Web Services identity used to access your data.
        subscriber-name: The name of the Security Lake account subscriber.
