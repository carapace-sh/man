name: create-code-security-scan-configuration
description: Creates a scan configuration for code security scanning.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration=!: The configuration settings for the code security scan.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --level=!: The security level for the scan configuration.
    --name=!: The name of the scan configuration.
    --scope-settings=: The scope settings that define which repositories will be scanned.
    --tags=: The tags to apply to the scan configuration.
completion:
    flag:
        level:
            - ORGANIZATION
            - ACCOUNT
documentation:
    command: Creates a scan configuration for code security scanning.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration: The configuration settings for the code security scan.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        level: The security level for the scan configuration.
        name: The name of the scan configuration.
        scope-settings: |-
            The scope settings that define which repositories will be scanned. Include this parameter to create a default scan configuration. Otherwise Amazon Inspector creates a general scan configuration.

            A default scan configuration automatically applies to all existing and future projects imported into Amazon Inspector. Use the `BatchAssociateCodeSecurityScanConfiguration` operation to associate a general scan configuration with projects.
        tags: The tags to apply to the scan configuration.
