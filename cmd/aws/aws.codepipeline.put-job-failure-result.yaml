name: put-job-failure-result
description: Represents the failure of a job as returned to the pipeline by a job worker.
flags:
    --failure-details=!: The details about the failure of a job.
    --job-id=!: The unique system-generated ID of the job that failed.
documentation:
    command: Represents the failure of a job as returned to the pipeline by a job worker. Used for custom actions only.
    flag:
        failure-details: The details about the failure of a job.
        job-id: The unique system-generated ID of the job that failed. This is the same ID returned from `PollForJobs`.
