name: create
description: Create a new Custom Intercept Profile.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: Brief description of the security profile
    --intercept-endpoint-group-location=: Location of the intercept endpoint group.
    --intercept-endpoint-group=!: ID of the intercept endpoint group or fully qualified identifier for the intercept endpoint group.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: location of the security_profile - Global.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --organization=: Organization ID to which the changes should apply.
documentation:
    command: |4+
        Create a new Custom Intercept Security Profile.

    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *False*.
        description: Brief description of the security profile
        intercept-endpoint-group: |-
            ID of the intercept endpoint group or fully qualified identifier for the intercept endpoint group.
            +
            To set the `id` attribute:
            * provide the argument `--intercept-endpoint-group` on the command line.
        intercept-endpoint-group-location: |-
            Location of the intercept endpoint group.
            +
            To set the `location` attribute:
            * provide the argument `--intercept-endpoint-group` on the command line with a fully specified name;
            * provide the argument `--intercept-endpoint-group-location` on the command line;
            * provide the argument `--location` on the command line;
            * provide the argument `networksecurity.projects.locations.interceptEndpointGroupAssociations` on the command line with a fully specified name.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            location of the security_profile - Global.
            +
            To set the `location` attribute:
            * provide the argument `security_profile` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        organization: |-
            Organization ID to which the changes should apply.
            +
            To set the `organization` attribute:
            * provide the argument `security_profile` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
