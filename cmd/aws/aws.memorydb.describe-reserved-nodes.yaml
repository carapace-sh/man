name: describe-reserved-nodes
description: Returns information about reserved nodes for this account, or about a specified reserved node.
flags:
    --duration=: The duration filter value, specified in years or seconds.
    --max-results=: The maximum number of records to include in the response.
    --next-token=: An optional marker returned from a prior request.
    --node-type=: The node type filter value.
    --offering-type=: The offering type filter value.
    --reservation-id=: The reserved node identifier filter value.
    --reserved-nodes-offering-id=: The offering identifier filter value.
documentation:
    command: Returns information about reserved nodes for this account, or about a specified reserved node.
    flag:
        duration: The duration filter value, specified in years or seconds. Use this parameter to show only reservations for this duration.
        max-results: The maximum number of records to include in the response. If more records exist than the specified MaxRecords value, a marker is included in the response so that the remaining results can be retrieved.
        next-token: An optional marker returned from a prior request. Use this marker for pagination of results from this operation. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by MaxRecords.
        node-type: The node type filter value. Use this parameter to show only those reservations matching the specified node type. For more information, see [Supported node types](https://docs.aws.amazon.com/memorydb/latest/devguide/nodes.reserved.html#reserved-nodes-supported).
        offering-type: 'The offering type filter value. Use this parameter to show only the available offerings matching the specified offering type. Valid values: "All Upfront"|"Partial Upfront"| "No Upfront"'
        reservation-id: The reserved node identifier filter value. Use this parameter to show only the reservation that matches the specified reservation ID.
        reserved-nodes-offering-id: The offering identifier filter value. Use this parameter to show only purchased reservations matching the specified offering identifier.
