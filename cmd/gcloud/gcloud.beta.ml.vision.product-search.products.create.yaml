name: create
description: '*(BETA)*  create a product.'
flags:
    --category=!: The category for the product.
    --description=: An optional description of this product.
    --display-name=!: The display name of this product.
    --location=: The location of product.
    --product-labels=: Labels that can be attached to the product.
completion:
    flag:
        category:
            - apparel
            - homegoods
            - toys
documentation:
    command: '*(BETA)*  Create a product.'
    flag:
        category: 'The category for the product. After being set, it cannot be changed. _CATEGORY_ must be one of: *apparel*, *homegoods*, *toys*.'
        description: An optional description of this product. It can be up to 4096 characters long.
        display-name: |-
            The display name of this product. It must not be empty and can be up to 4096 characters
            long.
        location: |-
            The location of product.
            +
            To set the `location` attribute:
            * provide the argument `product` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        product-labels: |-
            Labels that can be attached to the product. Labels are specified as
            key-value pairs. Multiple values can be assigned to the same key and
            one product may have up to 100 product labels.
