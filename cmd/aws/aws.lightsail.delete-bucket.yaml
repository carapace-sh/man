name: delete-bucket
description: Deletes a Amazon Lightsail bucket.
flags:
    --bucket-name=!: The name of the bucket to delete.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --force-delete: A Boolean value that indicates whether to force delete the bucket.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-force-delete: A Boolean value that indicates whether to force delete the bucket.
documentation:
    command: |-
        Deletes a Amazon Lightsail bucket.

        When you delete your bucket, the bucket name is released and can be reused for a new bucket in your account or another Amazon Web Services account.
    flag:
        bucket-name: |-
            The name of the bucket to delete.

            Use the [GetBuckets](https://docs.aws.amazon.com/lightsail/2016-11-28/api-reference/API_GetBuckets.html) action to get a list of bucket names that you can specify.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        force-delete: |-
            A Boolean value that indicates whether to force delete the bucket.

            You must force delete the bucket if it has one of the following conditions:

            - The bucket is the origin of a distribution.
            - The bucket has instances that were granted access to it using the [SetResourceAccessForBucket](https://docs.aws.amazon.com/lightsail/2016-11-28/api-reference/API_SetResourceAccessForBucket.html) action.
            - The bucket has objects.
            - The bucket has access keys.

            Force deleting a bucket might impact other resources that rely on the bucket, such as instances, distributions, or software that use the issued access keys.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
