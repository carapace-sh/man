name: batch-get-member-ec2-deep-inspection-status
description: Retrieves Amazon Inspector deep inspection activation status of multiple member accounts within your organization.
flags:
    --account-ids=: The unique identifiers for the Amazon Web Services accounts to retrieve Amazon Inspector deep inspection activation status for.
documentation:
    command: Retrieves Amazon Inspector deep inspection activation status of multiple member accounts within your organization. You must be the delegated administrator of an organization in Amazon Inspector to use this API.
    flag:
        account-ids: The unique identifiers for the Amazon Web Services accounts to retrieve Amazon Inspector deep inspection activation status for.
