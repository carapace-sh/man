name: create-chime-webhook-configuration
description: Creates an AWS Chatbot configuration for Amazon Chime.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration-name=!: The name of the configuration.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --iam-role-arn=!: A user-defined role that AWS Chatbot assumes.
    --logging-level=: Logging levels include `ERROR`, `INFO`, or `NONE`.
    --sns-topic-arns=!: The Amazon Resource Names (ARNs) of the SNS topics that deliver notifications to AWS Chatbot.
    --tags=: A map of tags assigned to a resource.
    --webhook-description=!: A description of the webhook.
    --webhook-url=!: The URL for the Amazon Chime webhook.
documentation:
    command: Creates an AWS Chatbot configuration for Amazon Chime.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration-name: The name of the configuration.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        iam-role-arn: |-
            A user-defined role that AWS Chatbot assumes. This is not the service-linked role.

            For more information, see [IAM policies for AWS Chatbot](https://docs.aws.amazon.com/chatbot/latest/adminguide/chatbot-iam-policies.html) in the *AWS Chatbot Administrator Guide*.
        logging-level: Logging levels include `ERROR`, `INFO`, or `NONE`.
        sns-topic-arns: The Amazon Resource Names (ARNs) of the SNS topics that deliver notifications to AWS Chatbot.
        tags: A map of tags assigned to a resource. A tag is a string-to-string map of key-value pairs.
        webhook-description: |-
            A description of the webhook. We recommend using the convention `RoomName/WebhookName`.

            For more information, see [Tutorial: Get started with Amazon Chime](https://docs.aws.amazon.com/chatbot/latest/adminguide/chime-setup.html) in the *AWS Chatbot Administrator Guide*.
        webhook-url: The URL for the Amazon Chime webhook.
