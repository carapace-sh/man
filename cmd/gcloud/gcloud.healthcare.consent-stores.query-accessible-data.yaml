name: query-accessible-data
description: Queries all accessible data IDs.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --dataset=: Cloud Healthcare dataset.
    --gcs-uri=!: The Cloud Storage destination for the result file.
    --location=: Google Cloud location.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --request-attributes=: Comma-separated list of request attributes associated with this access request.
    --resource-attributes=: Comma-separated list of resources attributes associated with the type of data being
documentation:
    command: Queries all data IDs that are consented for a given use in the given Cloud Healthcare API consent store and writes them to a specified destination.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        dataset: |-
            Cloud Healthcare dataset.
            +
            To set the `dataset` attribute:
            * provide the argument `consent_store` on the command line with a fully specified name;
            * provide the argument `--dataset` on the command line.
        gcs-uri: |-
            The Cloud Storage destination for the result file. The Cloud Healthcare API service account
            must have the `roles/storage.objectAdmin` Cloud IAM role for this Cloud Storage location.
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `consent_store` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `healthcare/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        request-attributes: |-
            Comma-separated list of request attributes associated with this access request. Each
            attribute has the form "KEY=VALUE".
        resource-attributes: |-
            Comma-separated list of resources attributes associated with the type of data being
            requested. Each attribute has the form "KEY=VALUE". If no values are specified, then all
            data types are included in the output.
