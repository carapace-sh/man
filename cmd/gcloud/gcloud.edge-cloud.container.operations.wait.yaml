name: wait
description: Poll long-running edge container operation until it completes.
flags:
    --location=: The global location name.
documentation:
    command: |
        Poll a long-running edge container operation until it completes. When
        the operation is complete, this command will display the results of the
        analysis.
    flag:
        location: |-
            The global location name.
            +
            To set the `location` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `edge_container/location`.
