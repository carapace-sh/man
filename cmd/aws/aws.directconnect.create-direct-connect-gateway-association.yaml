name: create-direct-connect-gateway-association
description: Creates an association between a Direct Connect gateway and a virtual private gateway.
flags:
    --add-allowed-prefixes-to-direct-connect-gateway=: The Amazon VPC prefixes to advertise to the Direct Connect gateway
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --direct-connect-gateway-id=!: The ID of the Direct Connect gateway.
    --gateway-id=: The ID of the virtual private gateway or transit gateway.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --virtual-gateway-id=: The ID of the virtual private gateway.
documentation:
    command: Creates an association between a Direct Connect gateway and a virtual private gateway. The virtual private gateway must be attached to a VPC and must not be associated with another Direct Connect gateway.
    flag:
        add-allowed-prefixes-to-direct-connect-gateway: |-
            The Amazon VPC prefixes to advertise to the Direct Connect gateway

            This parameter is required when you create an association to a transit gateway.

            For information about how to set the prefixes, see [Allowed Prefixes](https://docs.aws.amazon.com/directconnect/latest/UserGuide/multi-account-associate-vgw.html#allowed-prefixes) in the *Direct Connect User Guide*.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        direct-connect-gateway-id: The ID of the Direct Connect gateway.
        gateway-id: The ID of the virtual private gateway or transit gateway.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        virtual-gateway-id: The ID of the virtual private gateway.
