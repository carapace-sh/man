name: update
description: '*(BETA)*  Update a preview feature''s activation status.'
flags:
    --activation-status=!: The activation status of the preview feature.
    --custom-rollout-plan=: Use a custom rollout plan by name.
    --rollout-plan=: Use a predefined rollout plan.
completion:
    flag:
        activation-status:
            - enabled
            - unspecified
        rollout-plan:
            - fast-rollout
            - two-day-rollout
documentation:
    command: '*(BETA)*  Update a preview feature''s activation status.'
    flag:
        activation-status: 'The activation status of the preview feature. _ACTIVATION_STATUS_ must be one of: *enabled*, *unspecified*.'
        custom-rollout-plan: Use a custom rollout plan by name.
        rollout-plan: 'Use a predefined rollout plan. _ROLLOUT_PLAN_ must be one of: *fast-rollout*, *two-day-rollout*.'
