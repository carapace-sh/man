name: describe-configuration-sets
description: Describes the specified configuration sets or all in your account.
flags:
    --configuration-set-names=: An array of strings.
    --filters=: An array of filters to apply to the results that are returned.
    --max-results=: The maximum number of results to return per each request.
    --next-token=: The token to be used for the next set of paginated results.
documentation:
    command: |-
        Describes the specified configuration sets or all in your account.

        If you specify configuration set names, the output includes information for only the specified configuration sets. If you specify filters, the output includes information for only those configuration sets that meet the filter criteria. If you don't specify configuration set names or filters, the output includes information for all configuration sets.

        If you specify a configuration set name that isn't valid, an error is returned.
    flag:
        configuration-set-names: An array of strings. Each element can be either a ConfigurationSetName or ConfigurationSetArn.
        filters: An array of filters to apply to the results that are returned.
        max-results: The maximum number of results to return per each request.
        next-token: The token to be used for the next set of paginated results. You don't need to supply a value for this field in the initial request.
