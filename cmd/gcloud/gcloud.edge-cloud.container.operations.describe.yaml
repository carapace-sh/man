name: describe
description: Get description of a long-running edge container operation.
flags:
    --location=: The global location name.
documentation:
    command: |
        Get information about a long-running edge container operation.
    flag:
        location: |-
            The global location name.
            +
            To set the `location` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `edge_container/location`.
