name: provision
description: '*(ALPHA)*  Provision a new Spectrum Access System''s deployment.'
hidden: true
flags:
    --deployment-name=: The display name to use in case a new SAS Portal deployment needs to be created.
    --organization-name=: The display name to use in case a new SAS Portal organization needs to be created.
documentation:
    command: |-
        ## EXAMPLES

        The following command provisions a new SAS deployment:

          $ gcloud spectrum-access provision --organization-name=MyOrgName
          --deployment-name=MyDeploymentName
    flag:
        deployment-name: The display name to use in case a new SAS Portal deployment needs to be created. If not set, a default display name of the form "Cloud [ID]" will be used where ID is the current Cloud Platform Project ID.
        organization-name: The display name to use in case a new SAS Portal organization needs to be created. If not set, a default display name of the form "Cloud organizations/[ID]" will be used where ID is the current Cloud Platform Organization ID.
