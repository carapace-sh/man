name: get-style-descriptor
description: '`GetStyleDescriptor` returns information about the style.'
flags:
    --color-scheme=: Sets color tone for map such as dark and light for specific map styles.
    --contour-density=: Displays the shape and steepness of terrain features using elevation lines.
    --key=: 'Optional: The API key to be used for authorization.'
    --political-view=: Specifies the political view using ISO 3166-2 or ISO 3166-3 country code format.
    --style=!: Style specifies the desired map style.
    --terrain=: Adjusts how physical terrain details are rendered on the map.
    --traffic=: Displays real-time traffic information overlay on map, such as incident events and flow events.
    --travel-modes=: Renders additional map information relevant to selected travel modes.
completion:
    flag:
        color-scheme:
            - Light
            - Dark
        contour-density:
            - Medium
        style:
            - Standard
            - Monochrome
            - Hybrid
            - Satellite
        terrain:
            - Hillshade
        traffic:
            - All
documentation:
    command: |-
        `GetStyleDescriptor` returns information about the style.

        For more information, see [Style dynamic maps](https://docs.aws.amazon.com/location/latest/developerguide/styling-dynamic-maps.html) in the *Amazon Location Service Developer Guide*.
    flag:
        color-scheme: |-
            Sets color tone for map such as dark and light for specific map styles. It applies to only vector map styles such as Standard and Monochrome.

            Example: `Light`

            Default value: `Light`

            Valid values for ColorScheme are case sensitive.
        contour-density: |-
            Displays the shape and steepness of terrain features using elevation lines. The density value controls how densely the available contour line information is rendered on the map.

            This parameter is valid only for the `Standard` map style.
        key: 'Optional: The API key to be used for authorization. Either an API key or valid SigV4 signature must be provided when making a request.'
        political-view: |-
            Specifies the political view using ISO 3166-2 or ISO 3166-3 country code format.

            The following political views are currently supported:

            - `ARG`: Argentina's view on the Southern Patagonian Ice Field and Tierra Del Fuego, including the Falkland Islands, South Georgia, and South Sandwich Islands
            - `EGY`: Egypt's view on Bir Tawil
            - `IND`: India's view on Gilgit-Baltistan
            - `KEN`: Kenya's view on the Ilemi Triangle
            - `MAR`: Morocco's view on Western Sahara
            - `RUS`: Russia's view on Crimea
            - `SDN`: Sudan's view on the Halaib Triangle
            - `SRB`: Serbia's view on Kosovo, Vukovar, and Sarengrad Islands
            - `SUR`: Suriname's view on the Courantyne Headwaters and Lawa Headwaters
            - `SYR`: Syria's view on the Golan Heights
            - `TUR`: Turkey's view on Cyprus and Northern Cyprus
            - `TZA`: Tanzania's view on Lake Malawi
            - `URY`: Uruguay's view on Rincon de Artigas
            - `VNM`: Vietnam's view on the Paracel Islands and Spratly Islands
        style: Style specifies the desired map style.
        terrain: |-
            Adjusts how physical terrain details are rendered on the map.

            The following terrain styles are currently supported:

            - `Hillshade`: Displays the physical terrain details through shading and highlighting of elevation change and geographic features.

            This parameter is valid only for the `Standard` map style.
        traffic: |-
            Displays real-time traffic information overlay on map, such as incident events and flow events.

            This parameter is valid only for the `Standard` map style.
        travel-modes: |-
            Renders additional map information relevant to selected travel modes. Information for multiple travel modes can be displayed simultaneously, although this increases the overall information density rendered on the map.

            This parameter is valid only for the `Standard` map style.
