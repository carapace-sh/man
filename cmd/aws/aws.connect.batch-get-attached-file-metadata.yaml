name: batch-get-attached-file-metadata
description: Allows you to retrieve metadata about multiple attached files on an associated resource.
flags:
    --associated-resource-arn=!: The resource to which the attached file is (being) uploaded to.
    --file-ids=!: The unique identifiers of the attached file resource.
    --instance-id=!: The unique identifier of the Connect instance.
documentation:
    command: Allows you to retrieve metadata about multiple attached files on an associated resource. Each attached file provided in the input list must be associated with the input AssociatedResourceArn.
    flag:
        associated-resource-arn: |-
            The resource to which the attached file is (being) uploaded to. The supported resources are [Cases](https://docs.aws.amazon.com/connect/latest/adminguide/cases.html) and [Email](https://docs.aws.amazon.com/connect/latest/adminguide/setup-email-channel.html).

            This value must be a valid ARN.
        file-ids: The unique identifiers of the attached file resource.
        instance-id: The unique identifier of the Connect instance.
