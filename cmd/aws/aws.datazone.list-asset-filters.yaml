name: list-asset-filters
description: Lists asset filters.
flags:
    --asset-identifier=!: The ID of the data asset.
    --domain-identifier=!: The ID of the domain where you want to list asset filters.
    --max-results=: The maximum number of asset filters to return in a single call to `ListAssetFilters`.
    --next-token=: When the number of asset filters is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of asset filters, the response includes a pagination token named `NextToken`.
    --status=: The status of the asset filter.
completion:
    flag:
        status:
            - VALID
            - INVALID
documentation:
    command: |-
        Lists asset filters.

        Prerequisites:

        - A valid domain and asset must exist.
        - The asset must have at least one filter created to return results.
    flag:
        asset-identifier: The ID of the data asset.
        domain-identifier: The ID of the domain where you want to list asset filters.
        max-results: The maximum number of asset filters to return in a single call to `ListAssetFilters`. When the number of asset filters to be listed is greater than the value of `MaxResults`, the response contains a `NextToken` value that you can use in a subsequent call to `ListAssetFilters` to list the next set of asset filters.
        next-token: When the number of asset filters is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of asset filters, the response includes a pagination token named `NextToken`. You can specify this `NextToken` value in a subsequent call to `ListAssetFilters` to list the next set of asset filters.
        status: The status of the asset filter.
