name: delete
description: Deletes an endpoint.
flags:
    --location=: The name of the region for the endpoint.
    --namespace=: The name of the namespace for the endpoint.
    --service=: The name of the service for the endpoint.
documentation:
    command: Deletes an endpoint.
    flag:
        location: |-
            The name of the region for the endpoint.
            +
            To set the `location` attribute:
            * provide the argument `endpoint` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        namespace: |-
            The name of the namespace for the endpoint.
            +
            To set the `namespace` attribute:
            * provide the argument `endpoint` on the command line with a fully specified name;
            * provide the argument `--namespace` on the command line.
        service: |-
            The name of the service for the endpoint.
            +
            To set the `service` attribute:
            * provide the argument `endpoint` on the command line with a fully specified name;
            * provide the argument `--service` on the command line.
