name: create
description: '*(ALPHA)*  Create a new association between a security policy and an organization or folder resource.'
flags:
    --excluded-folders=: List of folders to exclude from the application of this security policy.
    --excluded-projects=: List of projects to exclude from the application of this security policy.
    --folder=: ID of the folder to associate the security policy with.
    --name=: Name to identify this association.
    --no-replace-association-on-target&: By default, if you attempt to insert an association to an organization or folder resource that is already associated with a security policy the method will fail.
    --organization=: ID of the organization to associate the security policy with.
    --project-number=: Project number to associate the security policy with.
    --replace-association-on-target: By default, if you attempt to insert an association to an organization or folder resource that is already associated with a security policy the method will fail.
    --security-policy=!: Security policy ID of the association.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute org-security-policies associations create* is used to create organization security policy associations. An
        organization security policy is a set of rules that controls access to various
        resources.

        This command has billing implications. Projects in the hierarchy with
        effective hierarchical security policies will be automatically enrolled into
        Cloud Armor Enterprise if not already enrolled.
    flag:
        excluded-folders: List of folders to exclude from the application of this security policy. Folders should be specified in the form "folders/123".
        excluded-projects: List of projects to exclude from the application of this security policy. Projects should be specified in the form "projects/123".
        folder: ID of the folder to associate the security policy with.
        name: Name to identify this association. If unspecified, the name will be set to "organization-{ORGANIZATION_ID}" or "folder-{FOLDER_ID}".
        no-replace-association-on-target: By default, if you attempt to insert an association to an organization or folder resource that is already associated with a security policy the method will fail. If this is set, the existing  association will be deleted at the same time that the new association is created.
        organization: ID of the organization to associate the security policy with. Must be set if SECURITY_POLICY is short name.
        project-number: Project number to associate the security policy with.
        replace-association-on-target: By default, if you attempt to insert an association to an organization or folder resource that is already associated with a security policy the method will fail. If this is set, the existing  association will be deleted at the same time that the new association is created.
        security-policy: Security policy ID of the association.
