name: start-import-task
description: Import data into existing Neptune Analytics graph from Amazon Simple Storage Service (S3).
flags:
    --blank-node-handling=: The method to handle blank nodes in the dataset.
    --fail-on-error: If set to true, the task halts when an import error is encountered.
    --format=: Specifies the format of Amazon S3 data to be imported.
    --graph-identifier=!: The unique identifier of the Neptune Analytics graph.
    --import-options=: ""
    --no-fail-on-error: If set to true, the task halts when an import error is encountered.
    --parquet-type=: The parquet type of the import task.
    --role-arn=!: The ARN of the IAM role that will allow access to the data that is to be imported.
    --source=!: A URL identifying the location of the data to be imported.
completion:
    flag:
        blank-node-handling:
            - convertToIri
        format:
            - CSV
            - OPEN_CYPHER
            - PARQUET
            - NTRIPLES
        parquet-type:
            - COLUMNAR
documentation:
    command: Import data into existing Neptune Analytics graph from Amazon Simple Storage Service (S3). The graph needs to be empty and in the AVAILABLE state.
    flag:
        blank-node-handling: The method to handle blank nodes in the dataset. Currently, only `convertToIri` is supported, meaning blank nodes are converted to unique IRIs at load time. Must be provided when format is `ntriples`. For more information, see [Handling RDF values](https://docs.aws.amazon.com/neptune-analytics/latest/userguide/using-rdf-data.html#rdf-handling).
        fail-on-error: If set to true, the task halts when an import error is encountered. If set to false, the task skips the data that caused the error and continues if possible.
        format: Specifies the format of Amazon S3 data to be imported. Valid values are CSV, which identifies the Gremlin CSV format or OPENCYPHER, which identies the openCypher load format.
        graph-identifier: The unique identifier of the Neptune Analytics graph.
        import-options: ""
        parquet-type: The parquet type of the import task.
        role-arn: The ARN of the IAM role that will allow access to the data that is to be imported.
        source: A URL identifying the location of the data to be imported. This can be an Amazon S3 path, or can point to a Neptune database endpoint or snapshot.
