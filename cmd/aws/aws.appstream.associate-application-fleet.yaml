name: associate-application-fleet
description: Associates the specified application with the specified fleet.
flags:
    --application-arn=!: The ARN of the application.
    --fleet-name=!: The name of the fleet.
documentation:
    command: Associates the specified application with the specified fleet. This is only supported for Elastic fleets.
    flag:
        application-arn: The ARN of the application.
        fleet-name: The name of the fleet.
