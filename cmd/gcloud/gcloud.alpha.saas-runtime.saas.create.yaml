name: create
description: '*(ALPHA)*  Create a SaaS.'
hidden: true
flags:
    --labels=: The labels on the resource, which can be used for categorization.
    --location=: Location ID
    --locations=!: Required, List of locations that the service is available in.
documentation:
    command: '*(ALPHA)*  Create a SaaS'
    flag:
        labels: |-
            The labels on the resource, which can be used for categorization.
            similar to Kubernetes resource labels.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: |-
            Location ID
            +
            To set the `location` attribute:
            * provide the argument `saas` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        locations: |-
            Required, List of locations that the service is available in. Rollout refers to the
            list to generate a rollout plan.
            +
            *name*:::
            Name of location.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --locations=name=string --locations=name=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --locations='[{"name": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --locations=path_to_file.(yaml|json)
            +
            ```
