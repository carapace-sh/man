name: update
description: '*(BETA)*  Updates the AutokeyConfig for a folder.'
documentation:
    command: |-
        *(BETA)*  gcloud beta kms autokey-config update can be used to update the AutokeyConfig of a folder.

        ## EXAMPLES

        The following command updates the AutokeyConfig for the folder mentioned in
        the config.yaml file:

        $ gcloud beta kms autokey-config update config.yaml
