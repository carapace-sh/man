name: describe-query-definitions
description: This operation returns a paginated list of your saved CloudWatch Logs Insights query definitions.
flags:
    --max-results=: Limits the number of returned query definitions to the specified number.
    --next-token=: ""
    --query-definition-name-prefix=: Use this parameter to filter your results to only the query definitions that have names that start with the prefix you specify.
    --query-language=: The query language used for this query.
completion:
    flag:
        query-language:
            - CWLI
            - SQL
            - PPL
documentation:
    command: |-
        This operation returns a paginated list of your saved CloudWatch Logs Insights query definitions. You can retrieve query definitions from the current account or from a source account that is linked to the current account.

        You can use the `queryDefinitionNamePrefix` parameter to limit the results to only the query definitions that have names that start with a certain string.
    flag:
        max-results: Limits the number of returned query definitions to the specified number.
        next-token: ""
        query-definition-name-prefix: Use this parameter to filter your results to only the query definitions that have names that start with the prefix you specify.
        query-language: The query language used for this query. For more information about the query languages that CloudWatch Logs supports, see [Supported query languages](https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_AnalyzeLogData_Languages.html).
