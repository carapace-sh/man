name: delete-service
description: Deletes a service.
flags:
    --service-identifier=!: The ID or ARN of the service.
documentation:
    command: Deletes a service. A service can't be deleted if it's associated with a service network. If you delete a service, all resources related to the service, such as the resource policy, auth policy, listeners, listener rules, and access log subscriptions, are also deleted. For more information, see [Delete a service](https://docs.aws.amazon.com/vpc-lattice/latest/ug/services.html#delete-service) in the *Amazon VPC Lattice User Guide*.
    flag:
        service-identifier: The ID or ARN of the service.
