name: get-entity-records
description: This API is used to query preview data from a given connection type or from a native Amazon S3 based Glue Data Catalog.
flags:
    --catalog-id=: The catalog ID of the catalog that contains the connection.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --connection-name=: The name of the connection that contains the connection type credentials.
    --connection-options=: Connector options that are required to query the data.
    --data-store-api-version=: The API version of the SaaS connector.
    --entity-name=!: Name of the entity that we want to query the preview data from the given connection type.
    --filter-predicate=: A filter predicate that you can apply in the query request.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --limit=!: Limits the number of records fetched with the request.
    --next-token=: A continuation token, included if this is a continuation call.
    --order-by=: A parameter that orders the response preview data.
    --selected-fields=: List of fields that we want to fetch as part of preview data.
documentation:
    command: |-
        This API is used to query preview data from a given connection type or from a native Amazon S3 based Glue Data Catalog.

        Returns records as an array of JSON blobs. Each record is formatted using Jackson JsonNode based on the field type defined by the `DescribeEntity` API.

        Spark connectors generate schemas according to the same data type mapping as in the `DescribeEntity` API. Spark connectors convert data to the appropriate data types matching the schema when returning rows.
    flag:
        catalog-id: The catalog ID of the catalog that contains the connection. This can be null, By default, the Amazon Web Services Account ID is the catalog ID.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        connection-name: The name of the connection that contains the connection type credentials.
        connection-options: Connector options that are required to query the data.
        data-store-api-version: The API version of the SaaS connector.
        entity-name: Name of the entity that we want to query the preview data from the given connection type.
        filter-predicate: A filter predicate that you can apply in the query request.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        limit: Limits the number of records fetched with the request.
        next-token: A continuation token, included if this is a continuation call.
        order-by: A parameter that orders the response preview data.
        selected-fields: List of fields that we want to fetch as part of preview data.
