name: get-data-endpoint
description: Gets an endpoint for a specified stream for either reading or writing.
flags:
    --apiname=!: The name of the API action for which to get an endpoint.
    --stream-arn=: The Amazon Resource Name (ARN) of the stream that you want to get the endpoint for.
    --stream-name=: The name of the stream that you want to get the endpoint for.
completion:
    flag:
        apiname:
            - PUT_MEDIA
            - GET_MEDIA
            - LIST_FRAGMENTS
            - GET_MEDIA_FOR_FRAGMENT_LIST
            - GET_HLS_STREAMING_SESSION_URL
            - GET_DASH_STREAMING_SESSION_URL
            - GET_CLIP
            - GET_IMAGES
documentation:
    command: |-
        Gets an endpoint for a specified stream for either reading or writing. Use this endpoint in your application to read from the specified stream (using the `GetMedia` or `GetMediaForFragmentList` operations) or write to it (using the `PutMedia` operation).

        The returned endpoint does not have the API name appended. The client needs to add the API name to the returned endpoint.

        In the request, specify the stream either by `StreamName` or `StreamARN`.
    flag:
        apiname: The name of the API action for which to get an endpoint.
        stream-arn: The Amazon Resource Name (ARN) of the stream that you want to get the endpoint for. You must specify either this parameter or a `StreamName` in the request.
        stream-name: The name of the stream that you want to get the endpoint for. You must specify either this parameter or a `StreamARN` in the request.
