name: create
description: Create a Datastream stream.
flags:
    --backfill-all: Automatically backfill objects included in the stream source
    --backfill-none: Do not automatically backfill any objects.
    --bigquery-destination-config=: Path to a YAML (or JSON) file containing the configuration for Google BigQuery Destination Config.
    --destination=!: ID of the connection_profile or fully qualified identifier for the connection_profile.
    --display-name=!: Friendly name for the stream.
    --force: Create the stream without validating it.
    --gcs-destination-config=: Path to a YAML (or JSON) file containing the configuration for Google Cloud Storage Destination Config.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The Cloud location for the stream.
    --mongodb-excluded-objects=: Path to a YAML (or JSON) file containing the MongoDB data sources to avoid backfilling.
    --mongodb-source-config=: Path to a YAML (or JSON) file containing the configuration for MongoDB Source Config.
    --mysql-excluded-objects=: Path to a YAML (or JSON) file containing the MySQL data sources to avoid backfilling.
    --mysql-source-config=: Path to a YAML (or JSON) file containing the configuration for MySQL Source Config.
    --no-backfill-all&: Automatically backfill objects included in the stream source
    --no-backfill-none&: Do not automatically backfill any objects.
    --no-force&: Create the stream without validating it.
    --no-validate-only&: Only validate the stream, but do not create any resources.
    --oracle-excluded-objects=: Path to a YAML (or JSON) file containing the Oracle data sources to avoid backfilling.
    --oracle-source-config=: Path to a YAML (or JSON) file containing the configuration for Oracle Source Config.
    --postgresql-excluded-objects=: Path to a YAML (or JSON) file containing the PostgreSQL data sources to avoid backfilling.
    --postgresql-source-config=: Path to a YAML (or JSON) file containing the configuration for PostgreSQL Source Config.
    --salesforce-excluded-objects=: Path to a YAML (or JSON) file containing the Salesforce data sources to avoid backfilling.
    --salesforce-source-config=: Path to a YAML (or JSON) file containing the configuration for Salesforce Source Config.
    --source=!: ID of the connection_profile or fully qualified identifier for the connection_profile.
    --sqlserver-excluded-objects=: Path to a YAML (or JSON) file containing the SQL Server data sources to avoid backfilling.
    --sqlserver-source-config=: Path to a YAML (or JSON) file containing the configuration for SQL Server Source Config.
    --validate-only: Only validate the stream, but do not create any resources.
documentation:
    command: |
        Create a Datastream stream. If successful, the response body contains a newly created instance of Operation.
        To get the operation result, call: describe OPERATION
    flag:
        backfill-all: |-
            Automatically backfill objects included in the stream source
                  configuration. Specific objects can be excluded. This flag is equivalent
                  to selecting the Automatic backfill type in the Google Cloud console.
        backfill-none: |-
            Do not automatically backfill any objects. This flag is equivalent
                  to selecting the Manual backfill type in the Google Cloud console.
        bigquery-destination-config: |-
            Path to a YAML (or JSON) file containing the configuration for Google BigQuery Destination Config.
            +
            The YAML (or JSON) file should be formatted as follows:
            +
            BigQuery configuration with source hierarchy datasets and merge mode (merge mode is by default):
            +
            ```
            {
              "sourceHierarchyDatasets": {
                "datasetTemplate": {
                  "location": "us-central1",
                  "datasetIdPrefix": "my_prefix",
                  "kmsKeyName": "projects/{project}/locations/{location}/keyRings/{key_ring}/cryptoKeys/{cryptoKey}"
                }
              },
              "merge": {}
              "dataFreshness": "3600s"
            }
            ```
            +
            BigQuery configuration with source hierarchy datasets and append only mode:
            ```
            {
              "sourceHierarchyDatasets": {
                "datasetTemplate": {
                  "location": "us-central1",
                  "datasetIdPrefix": "my_prefix",
                  "kmsKeyName": "projects/{project}/locations/{location}/keyRings/{key_ring}/cryptoKeys/{cryptoKey}"
                }
              },
              "appendOnly": {}
            }
            ```
            +
            BigQuery configuration with single target dataset and merge mode:
            +
            ```
            {
              "singleTargetDataset": {
                "datasetId": "projectId:my_dataset"
              },
              "merge": {}
              "dataFreshness": "3600s"
            }
            ```
            +
            BigQuery configuration with Big Lake table configuration:
            ```
            {
              "singleTargetDataset": {
                "datasetId": "projectId:datasetId"
              },
              "appendOnly": {},
              "blmtConfig": {
                "bucket": "bucketName",
                "tableFormat": "ICEBERG",
                "fileFormat": "PARQUET",
                "connectionName": "projectId.region.connectionName",
                "rootPath": "/root"
              }
            }
            ```
        destination: |-
            ID of the connection_profile or fully qualified identifier for the connection_profile.
            +
            To set the `connection_profile` attribute:
            * provide the argument `--destination` on the command line.
        display-name: Friendly name for the stream.
        force: Create the stream without validating it.
        gcs-destination-config: |-
            Path to a YAML (or JSON) file containing the configuration for Google Cloud Storage Destination Config.
            +
            The JSON file is formatted as follows:
            +
            ```
             {
             "path": "some/path",
             "fileRotationMb":5,
             "fileRotationInterval":"15s",
             "avroFileFormat": {}
             }
            ```
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The Cloud location for the stream.
            +
            To set the `location` attribute:
            * provide the argument `stream` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        mongodb-excluded-objects: |-
            Path to a YAML (or JSON) file containing the MongoDB data sources to avoid backfilling.
            +
            The JSON file is formatted as follows, with camelCase field naming:
            +
            ```
              {
                "databases": [
                  {
                    "database":"sample_database",
                    "collections": [
                      {
                        "collection": "sample_collection",
                        "fields": [
                          {
                            "field": "sample_field",
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ```
        mongodb-source-config: |-
            Path to a YAML (or JSON) file containing the configuration for MongoDB Source Config.
            +
            The JSON file is formatted as follows, with snake_case field naming:
            +
            ```
              {
                "includeObjects": {},
                "excludeObjects": {
                  "databases": [
                    {
                      "database": "sampleDb",
                      "collections": [
                        {
                          "collection": "sampleCollection",
                          "fields": [
                            {
                              "field": "SAMPLE_FIELD",
                            }
                          ]
                        }
                      ]
                    }
                  ]
                }
              }
            ```
        mysql-excluded-objects: |-
            Path to a YAML (or JSON) file containing the MySQL data sources to avoid backfilling.
            +
            The JSON file is formatted as follows, with camelCase field naming:
            +
            ```
              {
                "mysqlDatabases": [
                  {
                    "database":"sample_database",
                    "mysqlTables": [
                      {
                        "table": "sample_table",
                        "mysqlColumns": [
                          {
                            "column": "sample_column",
                          }
                          ]
                      }
                    ]
                  }
                ]
              }
            ```
        mysql-source-config: |-
            Path to a YAML (or JSON) file containing the configuration for MySQL Source Config.
            +
            The JSON file is formatted as follows, with camelCase field naming:
            +
            ```
              {
                "includeObjects": {},
                "excludeObjects":  {
                  "mysqlDatabases": [
                      {
                        "database":"sample_database",
                        "mysqlTables": [
                          {
                            "table": "sample_table",
                            "mysqlColumns": [
                              {
                                "column": "sample_column",
                              }
                             ]
                          }
                        ]
                      }
                    ]
                  }
              }
            ```
        no-backfill-all: |-
            Automatically backfill objects included in the stream source
                  configuration. Specific objects can be excluded. This flag is equivalent
                  to selecting the Automatic backfill type in the Google Cloud console.
        no-backfill-none: |-
            Do not automatically backfill any objects. This flag is equivalent
                  to selecting the Manual backfill type in the Google Cloud console.
        no-force: Create the stream without validating it.
        no-validate-only: |-
            Only validate the stream, but do not create any resources.
                  The default is false.
        oracle-excluded-objects: |-
            Path to a YAML (or JSON) file containing the Oracle data sources to avoid backfilling.
            +
            The JSON file is formatted as follows, with camelCase field naming:
            +
            ```
              {
                "oracleSchemas": [
                  {
                    "schema": "SAMPLE",
                    "oracleTables": [
                      {
                        "table": "SAMPLE_TABLE",
                        "oracleColumns": [
                          {
                            "column": "COL",
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ```
        oracle-source-config: |-
            Path to a YAML (or JSON) file containing the configuration for Oracle Source Config.
            +
            The JSON file is formatted as follows, with camelCase field naming:
            +
            ```
              {
                "includeObjects": {},
                "excludeObjects": {
                  "oracleSchemas": [
                    {
                      "schema": "SAMPLE",
                      "oracleTables": [
                        {
                          "table": "SAMPLE_TABLE",
                          "oracleColumns": [
                            {
                              "column": "COL",
                            }
                          ]
                        }
                      ]
                    }
                  ]
                }
              }
            ```
        postgresql-excluded-objects: |-
            Path to a YAML (or JSON) file containing the PostgreSQL data sources to avoid backfilling.
            +
            The JSON file is formatted as follows, with camelCase field naming:
            +
            ```
              {
                "postgresqlSchemas": [
                  {
                    "schema": "SAMPLE",
                    "postgresqlTables": [
                      {
                        "table": "SAMPLE_TABLE",
                        "postgresqlColumns": [
                          {
                            "column": "COL",
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ```
        postgresql-source-config: |-
            Path to a YAML (or JSON) file containing the configuration for PostgreSQL Source Config.
            +
            The JSON file is formatted as follows, with camelCase field naming:
            +
            ```
              {
                "includeObjects": {},
                "excludeObjects": {
                  "postgresqlSchemas": [
                    {
                      "schema": "SAMPLE",
                      "postgresqlTables": [
                        {
                          "table": "SAMPLE_TABLE",
                          "postgresqlColumns": [
                            {
                              "column": "COL",
                            }
                          ]
                        }
                      ]
                    }
                  ]
                },
                "replicationSlot": "SAMPLE_REPLICATION_SLOT",
                "publication": "SAMPLE_PUBLICATION"
              }
            ```
        salesforce-excluded-objects: |-
            Path to a YAML (or JSON) file containing the Salesforce data sources to avoid backfilling.
            +
            The JSON file is formatted as follows, with camelCase field naming:
            +
            ```
              {
                "objects": [
                  {
                    "objectName": "SAMPLE",
                  },
                  {
                    "objectName": "SAMPLE2",
                  }
                ]
              }
            ```
        salesforce-source-config: |-
            Path to a YAML (or JSON) file containing the configuration for Salesforce Source Config.
            +
            The JSON file is formatted as follows, with camelCase field naming:
            +
            ```
              {
                "pollingInterval": "3000s",
                "includeObjects": {},
                "excludeObjects": {
                  "objects": [
                    {
                      "objectName": "SAMPLE",
                      "fields": [
                        {
                          "fieldName": "SAMPLE_FIELD",
                        }
                      ]
                    }
                  ]
                }
              }
            ```
        source: |-
            ID of the connection_profile or fully qualified identifier for the connection_profile.
            +
            To set the `connection_profile` attribute:
            * provide the argument `--source` on the command line.
        sqlserver-excluded-objects: |-
            Path to a YAML (or JSON) file containing the SQL Server data sources to avoid backfilling.
            +
            The JSON file is formatted as follows, with camelCase field naming:
            +
            ```
              {
                "schemas": [
                  {
                    "schema": "SAMPLE",
                    "tables": [
                      {
                        "table": "SAMPLE_TABLE",
                        "columns": [
                          {
                            "column": "COL",
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ```
        sqlserver-source-config: |-
            Path to a YAML (or JSON) file containing the configuration for SQL Server Source Config.
            +
            The JSON file is formatted as follows, with camelCase field naming:
            +
            ```
              {
                "includeObjects": {},
                "excludeObjects": {
                  "schemas": [
                    {
                      "schema": "SAMPLE",
                      "tables": [
                        {
                          "table": "SAMPLE_TABLE",
                          "columns": [
                            {
                              "column": "COL",
                            }
                          ]
                        }
                      ]
                    }
                  ]
                },
                "maxConcurrentCdcTasks": 2,
                "maxConcurrentBackfillTasks": 10,
                "transactionLogs": {}  # Or changeTables
              }
            ```
        validate-only: |-
            Only validate the stream, but do not create any resources.
                  The default is false.
