name: tag-resource
description: Adds or updates tags for the Amazon Web Services resource with the specified ARN.
flags:
    --resource-arn=!: ARN of the resource for which tags are to be added or updated.
    --tags=!: Array of tags to be added or updated.
documentation:
    command: Adds or updates tags for the Amazon Web Services resource with the specified ARN.
    flag:
        resource-arn: ARN of the resource for which tags are to be added or updated. The ARN must be URL-encoded.
        tags: Array of tags to be added or updated. Array of maps, each of the form `string:string (key:value)`. See [Best practices and strategies](https://docs.aws.amazon.com/tag-editor/latest/userguide/best-practices-and-strats.html) in *Tagging Amazon Web Services Resources and Tag Editor* for details, including restrictions that apply to tags and "Tag naming limits and requirements"; Amazon IVS has no service-specific constraints beyond what is documented there.
