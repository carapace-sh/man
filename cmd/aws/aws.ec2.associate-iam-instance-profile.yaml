name: associate-iam-instance-profile
description: Associates an IAM instance profile with a running or stopped instance.
flags:
    --iam-instance-profile=!: The IAM instance profile.
    --instance-id=!: The ID of the instance.
documentation:
    command: Associates an IAM instance profile with a running or stopped instance. You cannot associate more than one IAM instance profile with an instance.
    flag:
        iam-instance-profile: The IAM instance profile.
        instance-id: The ID of the instance.
