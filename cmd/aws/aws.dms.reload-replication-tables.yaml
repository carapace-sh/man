name: reload-replication-tables
description: Reloads the target database table with the source data for a given DMS Serverless replication configuration.
flags:
    --reload-option=: Options for reload.
    --replication-config-arn=!: The Amazon Resource Name of the replication config for which to reload tables.
    --tables-to-reload=!: The list of tables to reload.
completion:
    flag:
        reload-option:
            - data-reload
            - validate-only
documentation:
    command: |-
        Reloads the target database table with the source data for a given DMS Serverless replication configuration.

        You can only use this operation with a task in the RUNNING state, otherwise the service will throw an `InvalidResourceStateFault` exception.
    flag:
        reload-option: Options for reload. Specify `data-reload` to reload the data and re-validate it if validation is enabled. Specify `validate-only` to re-validate the table. This option applies only when validation is enabled for the replication.
        replication-config-arn: The Amazon Resource Name of the replication config for which to reload tables.
        tables-to-reload: The list of tables to reload.
