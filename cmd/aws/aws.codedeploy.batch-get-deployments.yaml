name: batch-get-deployments
description: Gets information about one or more deployments.
flags:
    --deployment-ids=!: A list of deployment IDs, separated by spaces.
documentation:
    command: Gets information about one or more deployments. The maximum number of deployments that can be returned is 25.
    flag:
        deployment-ids: A list of deployment IDs, separated by spaces. The maximum number of deployment IDs you can specify is 25.
