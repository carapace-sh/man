name: execute-statement
description: This operation allows you to perform reads and singleton writes on data stored in DynamoDB, using PartiQL.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --consistent-read: The consistency of a read operation.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --limit=: The maximum number of items to evaluate (not necessarily the number of matching items).
    --next-token=: Set this value to get remaining results, if `NextToken` was returned in the statement response.
    --no-consistent-read: The consistency of a read operation.
    --parameters=: The parameters for the PartiQL statement, if any.
    --return-consumed-capacity=: ""
    --return-values-on-condition-check-failure=: An optional parameter that returns the item attributes for an `ExecuteStatement` operation that failed a condition check.
    --statement=!: The PartiQL statement representing the operation to run.
completion:
    flag:
        return-consumed-capacity:
            - INDEXES
            - TOTAL
            - NONE
        return-values-on-condition-check-failure:
            - ALL_OLD
            - NONE
documentation:
    command: |-
        This operation allows you to perform reads and singleton writes on data stored in DynamoDB, using PartiQL.

        For PartiQL reads (`SELECT` statement), if the total number of processed items exceeds the maximum dataset size limit of 1 MB, the read stops and results are returned to the user as a `LastEvaluatedKey` value to continue the read in a subsequent operation. If the filter criteria in `WHERE` clause does not match any data, the read will return an empty result set.

        A single `SELECT` statement response can return up to the maximum number of items (if using the Limit parameter) or a maximum of 1 MB of data (and then apply any filtering to the results using `WHERE` clause). If `LastEvaluatedKey` is present in the response, you need to paginate the result set. If `NextToken` is present, you need to paginate the result set and include `NextToken`.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        consistent-read: The consistency of a read operation. If set to `true`, then a strongly consistent read is used; otherwise, an eventually consistent read is used.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        limit: The maximum number of items to evaluate (not necessarily the number of matching items). If DynamoDB processes the number of items up to the limit while processing the results, it stops the operation and returns the matching values up to that point, along with a key in `LastEvaluatedKey` to apply in a subsequent operation so you can pick up where you left off. Also, if the processed dataset size exceeds 1 MB before DynamoDB reaches this limit, it stops the operation and returns the matching values up to the limit, and a key in `LastEvaluatedKey` to apply in a subsequent operation to continue the operation.
        next-token: Set this value to get remaining results, if `NextToken` was returned in the statement response.
        parameters: The parameters for the PartiQL statement, if any.
        return-consumed-capacity: ""
        return-values-on-condition-check-failure: |-
            An optional parameter that returns the item attributes for an `ExecuteStatement` operation that failed a condition check.

            There is no additional cost associated with requesting a return value aside from the small network and processing overhead of receiving a larger response. No read capacity units are consumed.
        statement: The PartiQL statement representing the operation to run.
