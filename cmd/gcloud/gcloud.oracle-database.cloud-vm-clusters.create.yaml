name: create
description: Create a new CloudVmCluster.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --backup-odb-subnet=!: ID of the odbSubnet or fully qualified identifier for the odbSubnet.
    --backup-subnet-cidr=: CIDR range of the backup subnet.
    --cidr=: Network settings.
    --diagnostics-data-collection-options-events-enabled: Indicates whether diagnostic collection is enabled for the VM cluster
    --diagnostics-data-collection-options-health-monitoring-enabled: Indicates whether health monitoring is enabled for the VM cluster
    --diagnostics-data-collection-options-incident-logs-enabled: Indicates whether incident logs and trace collection are enabled for the VM
    --display-name=: User friendly name for this resource.
    --exadata-infrastructure=!: ID of the cloudExadataInfrastructure or fully qualified identifier for the cloudExadataInfrastructure.
    --labels=: Labels or tags associated with the VM Cluster.
    --location=: For resources [backup-odb-subnet, cloud_vm_cluster, exadata-infrastructure, odb-network, odb-subnet], provides fallback value for resource location attribute.
    --network=!: ID of the network or fully qualified identifier for the network.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-diagnostics-data-collection-options-events-enabled&: Indicates whether diagnostic collection is enabled for the VM cluster
    --no-diagnostics-data-collection-options-health-monitoring-enabled&: Indicates whether health monitoring is enabled for the VM cluster
    --no-diagnostics-data-collection-options-incident-logs-enabled&: Indicates whether incident logs and trace collection are enabled for the VM
    --no-properties-local-backup-enabled&: Use local backup.
    --no-properties-sparse-diskgroup-enabled&: Use exadata sparse snapshots.
    --odb-network=: For resources [backup-odb-subnet, odb-network, odb-subnet], provides fallback value for resource odb-network attribute.
    --odb-subnet=!: ID of the odbSubnet or fully qualified identifier for the odbSubnet.
    --properties-cluster-name=: OCI Cluster name.
    --properties-cpu-core-count=!: Number of enabled CPU cores.
    --properties-data-storage-size-tb=: The data disk group size to be allocated in TBs.
    --properties-db-node-storage-size-gb=: Local storage per VM.
    --properties-db-server-ocids=: OCID of database servers.
    --properties-disk-redundancy=: The type of redundancy.
    --properties-gi-version=: Grid Infrastructure Version.
    --properties-hostname-prefix=: Prefix for VM cluster host names.
    --properties-license-type=!: License type of VM Cluster.
    --properties-local-backup-enabled: Use local backup.
    --properties-memory-size-gb=: Memory allocated in GBs.
    --properties-node-count=: Number of database servers.
    --properties-ocpu-count=: OCPU count per VM.
    --properties-sparse-diskgroup-enabled: Use exadata sparse snapshots.
    --properties-ssh-public-keys=: SSH public keys to be stored with cluster.
    --properties-system-version=: Operating system version of the image.
    --request-id=: An optional ID to identify the request.
    --time-zone-id=: IANA Time Zone Database time zone.
    --time-zone-version=: IANA Time Zone Database version number.
completion:
    flag:
        properties-disk-redundancy:
            - high
            - normal
        properties-license-type:
            - bring-your-own-license
            - license-included
documentation:
    command: Create a new CloudVmCluster.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        backup-odb-subnet: |-
            ID of the odbSubnet or fully qualified identifier for the odbSubnet.
            +
            To set the `odb-subnet` attribute:
            * provide the argument `--backup-odb-subnet` on the command line.
        backup-subnet-cidr: CIDR range of the backup subnet.
        cidr: Network settings. CIDR to use for cluster IP allocation.
        diagnostics-data-collection-options-events-enabled: Indicates whether diagnostic collection is enabled for the VM cluster
        diagnostics-data-collection-options-health-monitoring-enabled: Indicates whether health monitoring is enabled for the VM cluster
        diagnostics-data-collection-options-incident-logs-enabled: |-
            Indicates whether incident logs and trace collection are enabled for the VM
            cluster
        display-name: User friendly name for this resource.
        exadata-infrastructure: |-
            ID of the cloudExadataInfrastructure or fully qualified identifier for the cloudExadataInfrastructure.
            +
            To set the `cloud-exadata-infrastructure` attribute:
            * provide the argument `--exadata-infrastructure` on the command line.
        labels: |-
            Labels or tags associated with the VM Cluster.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: For resources [backup-odb-subnet, cloud_vm_cluster, exadata-infrastructure, odb-network, odb-subnet], provides fallback value for resource location attribute. When the resource's full URI path is not provided, location will fallback to this flag value.
        network: |-
            ID of the network or fully qualified identifier for the network.
            +
            To set the `network` attribute:
            * provide the argument `--network` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-diagnostics-data-collection-options-events-enabled: Indicates whether diagnostic collection is enabled for the VM cluster
        no-diagnostics-data-collection-options-health-monitoring-enabled: Indicates whether health monitoring is enabled for the VM cluster
        no-diagnostics-data-collection-options-incident-logs-enabled: |-
            Indicates whether incident logs and trace collection are enabled for the VM
            cluster
        no-properties-local-backup-enabled: Use local backup.
        no-properties-sparse-diskgroup-enabled: Use exadata sparse snapshots.
        odb-network: For resources [backup-odb-subnet, odb-network, odb-subnet], provides fallback value for resource odb-network attribute. When the resource's full URI path is not provided, odb-network will fallback to this flag value.
        odb-subnet: |-
            ID of the odbSubnet or fully qualified identifier for the odbSubnet.
            +
            To set the `odb-subnet` attribute:
            * provide the argument `--odb-subnet` on the command line.
        properties-cluster-name: OCI Cluster name.
        properties-cpu-core-count: Number of enabled CPU cores.
        properties-data-storage-size-tb: The data disk group size to be allocated in TBs.
        properties-db-node-storage-size-gb: Local storage per VM.
        properties-db-server-ocids: OCID of database servers.
        properties-disk-redundancy: |-
            The type of redundancy. _PROPERTIES_DISK_REDUNDANCY_ must be one of:
            +
            *high*::: High -  3 way mirror.
            *normal*::: Normal - 2 way mirror.
            :::
            +
        properties-gi-version: Grid Infrastructure Version.
        properties-hostname-prefix: Prefix for VM cluster host names.
        properties-license-type: |-
            License type of VM Cluster. _PROPERTIES_LICENSE_TYPE_ must be one of:
            +
            *bring-your-own-license*::: Bring your own license
            *license-included*::: License included part of offer
            :::
            +
        properties-local-backup-enabled: Use local backup.
        properties-memory-size-gb: Memory allocated in GBs.
        properties-node-count: Number of database servers.
        properties-ocpu-count: OCPU count per VM. Minimum is 0.1.
        properties-sparse-diskgroup-enabled: Use exadata sparse snapshots.
        properties-ssh-public-keys: SSH public keys to be stored with cluster.
        properties-system-version: Operating system version of the image.
        request-id: |-
            An optional ID to identify the request. This value is used to identify
            duplicate requests. If you make a request with the same request ID
            and the original request is still in progress or completed, the server
            ignores the second request. This prevents clients from
            accidentally creating duplicate commitments.
            +
            The request ID must be a valid UUID with the exception that zero UUID is
            not supported (00000000-0000-0000-0000-000000000000).
        time-zone-id: IANA Time Zone Database time zone. For example "America/New_York".
        time-zone-version: IANA Time Zone Database version number. For example "2019a".
