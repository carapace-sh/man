name: update-automated-reasoning-policy-test-case
description: Updates an existing Automated Reasoning policy test.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=: A unique, case-sensitive identifier to ensure that the operation completes no more than one time.
    --confidence-threshold=: The updated minimum confidence level for logic validation.
    --expected-aggregated-findings-result=!: The updated expected result of the Automated Reasoning check.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --guard-content=!: The updated content to be validated by the Automated Reasoning policy.
    --last-updated-at=!: The timestamp when the test was last updated.
    --policy-arn=!: The Amazon Resource Name (ARN) of the Automated Reasoning policy that contains the test.
    --query-content=: The updated input query or prompt that generated the content.
    --test-case-id=!: The unique identifier of the test to update.
completion:
    flag:
        expected-aggregated-findings-result:
            - VALID
            - INVALID
            - SATISFIABLE
            - IMPOSSIBLE
            - TRANSLATION_AMBIGUOUS
            - TOO_COMPLEX
            - NO_TRANSLATION
documentation:
    command: Updates an existing Automated Reasoning policy test. You can modify the content, query, expected result, and confidence threshold.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: A unique, case-sensitive identifier to ensure that the operation completes no more than one time. If this token matches a previous request, Amazon Bedrock ignores the request, but does not return an error.
        confidence-threshold: The updated minimum confidence level for logic validation. If null is provided, the threshold will be removed.
        expected-aggregated-findings-result: The updated expected result of the Automated Reasoning check.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        guard-content: The updated content to be validated by the Automated Reasoning policy.
        last-updated-at: The timestamp when the test was last updated. This is used as a concurrency token to prevent conflicting modifications.
        policy-arn: The Amazon Resource Name (ARN) of the Automated Reasoning policy that contains the test.
        query-content: The updated input query or prompt that generated the content.
        test-case-id: The unique identifier of the test to update.
