name: update-custom-domain-association
description: Updates an Amazon Redshift Serverless certificate associated with a custom domain.
flags:
    --custom-domain-certificate-arn=!: The custom domain name’s certificate Amazon resource name (ARN).
    --custom-domain-name=!: The custom domain name associated with the workgroup.
    --workgroup-name=!: The name of the workgroup associated with the database.
documentation:
    command: Updates an Amazon Redshift Serverless certificate associated with a custom domain.
    flag:
        custom-domain-certificate-arn: The custom domain name’s certificate Amazon resource name (ARN). This is optional.
        custom-domain-name: The custom domain name associated with the workgroup.
        workgroup-name: The name of the workgroup associated with the database.
