name: authorize-security-group-egress
description: Adds the specified outbound (egress) rules to a security group.
flags:
    --cidr-ip=: Not supported.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --from-port=: Not supported.
    --group-id=!: The ID of the security group.
    --ip-permissions=: The permissions for the security group rules.
    --ip-protocol=: Not supported.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --source-security-group-name=: Not supported.
    --source-security-group-owner-id=: Not supported.
    --tag-specifications=: The tags applied to the security group rule.
    --to-port=: Not supported.
documentation:
    command: |-
        Adds the specified outbound (egress) rules to a security group.

        An outbound rule permits instances to send traffic to the specified IPv4 or IPv6 address ranges, the IP address ranges specified by a prefix list, or the instances that are associated with a source security group. For more information, see [Security group rules](https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html).

        You must specify exactly one of the following destinations: an IPv4 or IPv6 address range, a prefix list, or a security group. You must specify a protocol for each rule (for example, TCP). If the protocol is TCP or UDP, you must also specify a port or port range. If the protocol is ICMP or ICMPv6, you must also specify the ICMP type and code.

        Rule changes are propagated to instances associated with the security group as quickly as possible. However, a small delay might occur.

        For examples of rules that you can add to security groups for specific access scenarios, see [Security group rules for different use cases](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/security-group-rules-reference.html) in the *Amazon EC2 User Guide*.

        For information about security group quotas, see [Amazon VPC quotas](https://docs.aws.amazon.com/vpc/latest/userguide/amazon-vpc-limits.html) in the *Amazon VPC User Guide*.
    flag:
        cidr-ip: Not supported. Use IP permissions instead.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        from-port: Not supported. Use IP permissions instead.
        group-id: The ID of the security group.
        ip-permissions: The permissions for the security group rules.
        ip-protocol: Not supported. Use IP permissions instead.
        source-security-group-name: Not supported. Use IP permissions instead.
        source-security-group-owner-id: Not supported. Use IP permissions instead.
        tag-specifications: The tags applied to the security group rule.
        to-port: Not supported. Use IP permissions instead.
