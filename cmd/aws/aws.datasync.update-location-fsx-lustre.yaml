name: update-location-fsx-lustre
description: Modifies the following configuration parameters of the Amazon FSx for Lustre transfer location that you're using with DataSync.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --location-arn=!: Specifies the Amazon Resource Name (ARN) of the FSx for Lustre transfer location that you're updating.
    --subdirectory=: Specifies a mount path for your FSx for Lustre file system.
documentation:
    command: |-
        Modifies the following configuration parameters of the Amazon FSx for Lustre transfer location that you're using with DataSync.

        For more information, see [Configuring DataSync transfers with FSx for Lustre](https://docs.aws.amazon.com/datasync/latest/userguide/create-lustre-location.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        location-arn: Specifies the Amazon Resource Name (ARN) of the FSx for Lustre transfer location that you're updating.
        subdirectory: |-
            Specifies a mount path for your FSx for Lustre file system. The path can include subdirectories.

            When the location is used as a source, DataSync reads data from the mount path. When the location is used as a destination, DataSync writes data to the mount path. If you don't include this parameter, DataSync uses the file system's root directory (`/`).
