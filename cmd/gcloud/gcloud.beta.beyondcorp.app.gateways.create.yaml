name: create
description: '*(BETA)*  Create a new Beyondcorp AppConnector Gateway.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --display-name=: An arbitrary user-provided name for the connection.
    --host-type=: The type of network connnectivity used by the connection.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location of the beyondcorp service.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --type=: The type of network connnectivity used by the connection.
completion:
    flag:
        host-type:
            - regional-mig
        type:
            - tcp
documentation:
    command: '*(BETA)*  Create a new Beyondcorp AppConnector Gateway.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        display-name: An arbitrary user-provided name for the connection. Cannot exceed 64 characters.
        host-type: |-
            The type of network connnectivity used by the connection. _HOST_TYPE_ must be (only one value is supported):
            +
            *regional-mig*::: REGIONAL MIG
            :::
            +
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location of the beyondcorp service.
            +

            To set the `location` attribute:
            * provide the argument `app_gateway` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        type: |-
            The type of network connnectivity used by the connection. _TYPE_ must be (only one value is supported):
            +
            *tcp*::: TCP connection
            :::
            +
