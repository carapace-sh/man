name: list
description: '*(BETA)*  List MCP services for a project, folder or organization.'
hidden: true
flags:
    --available: Return the services available to the project, folder or organization to enable for MCP.
    --enabled: (DEFAULT) Return the MCP services which the project, folder or organization has enabled.
    --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
    --folder=: The Google Cloud Platform folder ID to use for this invocation.
    --limit=: Maximum number of resources to list.
    --no-available&: Return the services available to the project, folder or organization to enable for MCP.
    --no-enabled&: (DEFAULT) Return the MCP services which the project, folder or organization has enabled.
    --organization=: The Google Cloud Platform organization ID to use for this invocation.
    --page-size=: Some services group resource list output into pages.
    --sort-by=: Comma-separated list of resource field key names to sort by.
documentation:
    command: |-
        *(BETA)*  This command lists the MCP services that are enabled or available (with MCP
        endpoints) to be MCP enabled
        by a project, folder or organization.

        ## EXAMPLES

        To list the services the current project has enabled for MCP, run:

          $ gcloud beta services mcp list --enabled

        To list the services the current project can enable for MCP, run:

          $ gcloud beta services mcp list --available
    flag:
        available: Return the services available to the project, folder or organization to enable for MCP.
        enabled: (DEFAULT) Return the MCP services which the project, folder or organization has enabled.
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        folder: The Google Cloud Platform folder ID to use for this invocation.
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        no-available: Return the services available to the project, folder or organization to enable for MCP.
        no-enabled: (DEFAULT) Return the MCP services which the project, folder or organization has enabled.
        organization: The Google Cloud Platform organization ID to use for this invocation.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is *1000*.
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
