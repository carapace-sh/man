name: list-dimensions
description: List the set of dimensions that are defined for your Amazon Web Services accounts.
flags:
    --max-results=: The maximum number of results to retrieve at one time.
    --next-token=: The token for the next set of results.
documentation:
    command: |-
        List the set of dimensions that are defined for your Amazon Web Services accounts.

        Requires permission to access the [ListDimensions](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        max-results: The maximum number of results to retrieve at one time.
        next-token: The token for the next set of results.
