name: get-ipam-pool-allocations
description: Get a list of all the CIDR allocations in an IPAM pool.
flags:
    --dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --filters=: One or more filters for the request.
    --ipam-pool-allocation-id=: The ID of the allocation.
    --ipam-pool-id=!: The ID of the IPAM pool you want to see the allocations for.
    --max-results=: The maximum number of results you would like returned per page.
    --next-token=: The token for the next page of results.
    --no-dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
documentation:
    command: |-
        Get a list of all the CIDR allocations in an IPAM pool. The Region you use should be the IPAM pool locale. The locale is the Amazon Web Services Region where this IPAM pool is available for allocations.

        If you use this action after [AllocateIpamPoolCidr](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_AllocateIpamPoolCidr.html) or [ReleaseIpamPoolAllocation](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_ReleaseIpamPoolAllocation.html), note that all EC2 API actions follow an [eventual consistency](https://docs.aws.amazon.com/ec2/latest/devguide/eventual-consistency.html) model.
    flag:
        dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: One or more filters for the request. For more information about filtering, see [Filtering CLI output](https://docs.aws.amazon.com/cli/latest/userguide/cli-usage-filter.html).
        ipam-pool-allocation-id: The ID of the allocation.
        ipam-pool-id: The ID of the IPAM pool you want to see the allocations for.
        max-results: The maximum number of results you would like returned per page.
        next-token: The token for the next page of results.
