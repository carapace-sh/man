name: list-optimization-jobs
description: Lists the optimization jobs in your account and their properties.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --creation-time-after=: Filters the results to only those optimization jobs that were created after the specified time.
    --creation-time-before=: Filters the results to only those optimization jobs that were created before the specified time.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --last-modified-time-after=: Filters the results to only those optimization jobs that were updated after the specified time.
    --last-modified-time-before=: Filters the results to only those optimization jobs that were updated before the specified time.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of optimization jobs to return in the response.
    --name-contains=: Filters the results to only those optimization jobs with a name that contains the specified string.
    --next-token=: A token that you use to get the next set of results following a truncated response.
    --optimization-contains=: Filters the results to only those optimization jobs that apply the specified optimization techniques.
    --page-size=: The size of each page to get in the AWS service call.
    --sort-by=: The field by which to sort the optimization jobs in the response.
    --sort-order=: The sort order for results.
    --starting-token=: A token to specify where to start paginating.
    --status-equals=: Filters the results to only those optimization jobs with the specified status.
completion:
    flag:
        sort-by:
            - Name
            - CreationTime
            - Status
        sort-order:
            - Ascending
            - Descending
        status-equals:
            - INPROGRESS
            - COMPLETED
            - FAILED
            - STARTING
            - STOPPING
            - STOPPED
documentation:
    command: Lists the optimization jobs in your account and their properties.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        creation-time-after: Filters the results to only those optimization jobs that were created after the specified time.
        creation-time-before: Filters the results to only those optimization jobs that were created before the specified time.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        last-modified-time-after: Filters the results to only those optimization jobs that were updated after the specified time.
        last-modified-time-before: Filters the results to only those optimization jobs that were updated before the specified time.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of optimization jobs to return in the response. The default is 50.
        name-contains: Filters the results to only those optimization jobs with a name that contains the specified string.
        next-token: A token that you use to get the next set of results following a truncated response. If the response to the previous request was truncated, that response provides the value for this token.
        optimization-contains: Filters the results to only those optimization jobs that apply the specified optimization techniques. You can specify either `Quantization` or `Compilation`.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        sort-by: The field by which to sort the optimization jobs in the response. The default is `CreationTime`
        sort-order: The sort order for results. The default is `Ascending`
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        status-equals: Filters the results to only those optimization jobs with the specified status.
