name: create-web-acl
description: This is **AWS WAF Classic** documentation.
flags:
    --change-token=!: The value returned by the most recent call to [GetChangeToken]().
    --default-action=!: The action that you want AWS WAF to take when a request doesn't match the criteria specified in any of the `Rule` objects that are associated with the `WebACL`.
    --metric-name=!: A friendly name or description for the metrics for this `WebACL`.The name can contain only alphanumeric characters (A-Z, a-z, 0-9), with maximum length 128 and minimum length one.
    --name=!: A friendly name or description of the [WebACL]().
    --tags=: ""
documentation:
    command: |-
        This is **AWS WAF Classic** documentation. For more information, see [AWS WAF Classic](https://docs.aws.amazon.com/waf/latest/developerguide/classic-waf-chapter.html) in the developer guide.

        **For the latest version of AWS WAF**, use the AWS WAFV2 API and see the [AWS WAF Developer Guide](https://docs.aws.amazon.com/waf/latest/developerguide/waf-chapter.html). With the latest version, AWS WAF has a single set of endpoints for regional and global use.

        Creates a `WebACL`, which contains the `Rules` that identify the CloudFront web requests that you want to allow, block, or count. AWS WAF evaluates `Rules` in order based on the value of `Priority` for each `Rule`.

        You also specify a default action, either `ALLOW` or `BLOCK`. If a web request doesn't match any of the `Rules` in a `WebACL`, AWS WAF responds to the request with the default action.

        To create and configure a `WebACL`, perform the following steps:

        1. Create and update the `ByteMatchSet` objects and other predicates that you want to include in `Rules`. For more information, see [CreateByteMatchSet](), [UpdateByteMatchSet](), [CreateIPSet](), [UpdateIPSet](), [CreateSqlInjectionMatchSet](), and [UpdateSqlInjectionMatchSet]().
        2. Create and update the `Rules` that you want to include in the `WebACL`. For more information, see [CreateRule]() and [UpdateRule]().
        3. Use [GetChangeToken]() to get the change token that you provide in the `ChangeToken` parameter of a `CreateWebACL` request.
        4. Submit a `CreateWebACL` request.
        5. Use `GetChangeToken` to get the change token that you provide in the `ChangeToken` parameter of an [UpdateWebACL]() request.
        6. Submit an [UpdateWebACL]() request to specify the `Rules` that you want to include in the `WebACL`, to specify the default action, and to associate the `WebACL` with a CloudFront distribution.

        For more information about how to use the AWS WAF API, see the [AWS WAF Developer Guide](https://docs.aws.amazon.com/waf/latest/developerguide/).
    flag:
        change-token: The value returned by the most recent call to [GetChangeToken]().
        default-action: The action that you want AWS WAF to take when a request doesn't match the criteria specified in any of the `Rule` objects that are associated with the `WebACL`.
        metric-name: A friendly name or description for the metrics for this `WebACL`.The name can contain only alphanumeric characters (A-Z, a-z, 0-9), with maximum length 128 and minimum length one. It can't contain whitespace or metric names reserved for AWS WAF, including "All" and "Default\_Action." You can't change `MetricName` after you create the `WebACL`.
        name: A friendly name or description of the [WebACL](). You can't change `Name` after you create the `WebACL`.
        tags: ""
