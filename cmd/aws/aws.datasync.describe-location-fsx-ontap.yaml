name: describe-location-fsx-ontap
description: Provides details about how an DataSync transfer location for an Amazon FSx for NetApp ONTAP file system is configured.
flags:
    --location-arn=!: Specifies the Amazon Resource Name (ARN) of the FSx for ONTAP file system location that you want information about.
documentation:
    command: |-
        Provides details about how an DataSync transfer location for an Amazon FSx for NetApp ONTAP file system is configured.

        If your location uses SMB, the `DescribeLocationFsxOntap` operation doesn't actually return a `Password`.
    flag:
        location-arn: Specifies the Amazon Resource Name (ARN) of the FSx for ONTAP file system location that you want information about.
