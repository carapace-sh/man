name: get-repository-sync-status
description: Get the sync status of a repository used for Proton template sync.
flags:
    --branch=!: The repository branch.
    --repository-name=!: The repository name.
    --repository-provider=!: The repository provider.
    --sync-type=!: The repository sync type.
completion:
    flag:
        repository-provider:
            - GITHUB
            - GITHUB_ENTERPRISE
            - BITBUCKET
        sync-type:
            - TEMPLATE_SYNC
            - SERVICE_SYNC
documentation:
    command: |-
        Get the sync status of a repository used for Proton template sync. For more information about template sync, see .

        A repository sync status isn't tied to the Proton Repository resource (or any other Proton resource). Therefore, tags on an Proton Repository resource have no effect on this action. Specifically, you can't use these tags to control access to this action using Attribute-based access control (ABAC).

        For more information about ABAC, see [ABAC](https://docs.aws.amazon.com/proton/latest/userguide/security_iam_service-with-iam.html#security_iam_service-with-iam-tags) in the *Proton User Guide*.
    flag:
        branch: The repository branch.
        repository-name: The repository name.
        repository-provider: The repository provider.
        sync-type: The repository sync type.
