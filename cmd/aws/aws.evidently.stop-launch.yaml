name: stop-launch
description: Stops a launch that is currently running.
flags:
    --desired-state=: Specify whether to consider the launch as `COMPLETED` or `CANCELLED` after it stops.
    --launch=!: The name of the launch to stop.
    --project=!: The name or ARN of the project that contains the launch that you want to stop.
    --reason=: A string that describes why you are stopping the launch.
completion:
    flag:
        desired-state:
            - COMPLETED
            - CANCELLED
documentation:
    command: Stops a launch that is currently running. After you stop a launch, you will not be able to resume it or restart it. Also, it will not be evaluated as a rule for traffic allocation, and the traffic that was allocated to the launch will instead be available to the feature's experiment, if there is one. Otherwise, all traffic will be served the default variation after the launch is stopped.
    flag:
        desired-state: Specify whether to consider the launch as `COMPLETED` or `CANCELLED` after it stops.
        launch: The name of the launch to stop.
        project: The name or ARN of the project that contains the launch that you want to stop.
        reason: A string that describes why you are stopping the launch.
