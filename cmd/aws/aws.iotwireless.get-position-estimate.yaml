name: get-position-estimate
description: Get estimated position information as a payload in GeoJSON format.
flags:
    --cell-towers=: Retrieves an estimated device position by resolving measurement data from cellular radio towers.
    --gnss=: Retrieves an estimated device position by resolving the global navigation satellite system (GNSS) scan data.
    --ip=: Retrieves an estimated device position by resolving the IP address information from the device.
    --timestamp=: Optional information that specifies the time when the position information will be resolved.
    --wi-fi-access-points=: Retrieves an estimated device position by resolving WLAN measurement data.
documentation:
    command: Get estimated position information as a payload in GeoJSON format. The payload measurement data is resolved using solvers that are provided by third-party vendors.
    flag:
        cell-towers: Retrieves an estimated device position by resolving measurement data from cellular radio towers. The position is resolved using HERE's cellular-based solver.
        gnss: Retrieves an estimated device position by resolving the global navigation satellite system (GNSS) scan data. The position is resolved using the GNSS solver powered by LoRa Cloud.
        ip: Retrieves an estimated device position by resolving the IP address information from the device. The position is resolved using MaxMind's IP-based solver.
        timestamp: Optional information that specifies the time when the position information will be resolved. It uses the Unix timestamp format. If not specified, the time at which the request was received will be used.
        wi-fi-access-points: Retrieves an estimated device position by resolving WLAN measurement data. The position is resolved using HERE's Wi-Fi based solver.
