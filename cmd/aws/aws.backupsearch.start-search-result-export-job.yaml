name: start-search-result-export-job
description: This operations starts a job to export the results of search job to a designated S3 bucket.
flags:
    --client-token=: Include this parameter to allow multiple identical calls for idempotency.
    --export-specification=!: This specification contains a required string of the destination bucket; optionally, you can include the destination prefix.
    --role-arn=: This parameter specifies the role ARN used to start the search results export jobs.
    --search-job-identifier=!: The unique string that specifies the search job.
    --tags=: Optional tags to include.
documentation:
    command: This operations starts a job to export the results of search job to a designated S3 bucket.
    flag:
        client-token: |-
            Include this parameter to allow multiple identical calls for idempotency.

            A client token is valid for 8 hours after the first request that uses it is completed. After this time, any request with the same token is treated as a new request.
        export-specification: This specification contains a required string of the destination bucket; optionally, you can include the destination prefix.
        role-arn: This parameter specifies the role ARN used to start the search results export jobs.
        search-job-identifier: The unique string that specifies the search job.
        tags: 'Optional tags to include. A tag is a key-value pair you can use to manage, filter, and search for your resources. Allowed characters include UTF-8 letters, numbers, spaces, and the following characters: + - = . _ : /.'
