name: enable-macie
description: Enables Amazon Macie and specifies the configuration settings for a Macie account.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive token that you provide to ensure the idempotency of the request.
    --finding-publishing-frequency=: Specifies how often to publish updates to policy findings for the account.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --status=: Specifies the new status for the account.
completion:
    flag:
        finding-publishing-frequency:
            - FIFTEEN_MINUTES
            - ONE_HOUR
            - SIX_HOURS
        status:
            - PAUSED
            - ENABLED
documentation:
    command: Enables Amazon Macie and specifies the configuration settings for a Macie account.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive token that you provide to ensure the idempotency of the request.
        finding-publishing-frequency: Specifies how often to publish updates to policy findings for the account. This includes publishing updates to Security Hub and Amazon EventBridge (formerly Amazon CloudWatch Events).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        status: Specifies the new status for the account. To enable Amazon Macie and start all Macie activities for the account, set this value to ENABLED.
