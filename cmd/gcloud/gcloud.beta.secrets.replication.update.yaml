name: update
description: '*(BETA)*  Update a secret replica''s metadata.'
flags:
    --location=: Location of replica to update.
    --no-remove-cmek&: Remove customer managed encryption key so that future versions will be encrypted by a Google managed encryption key.
    --remove-cmek: Remove customer managed encryption key so that future versions will be encrypted by a Google managed encryption key.
    --set-kms-key=: New KMS key with which to encrypt and decrypt future secret versions.
documentation:
    command: |-
        *(BETA)*  Update a secret replica's metadata (e.g. cmek policy). This command will
        return an error if given a secret that does not exist or if given a
        location that the given secret doesn't exist in.

        The --remove-kms-key flag is only valid for Secrets that have an
        automatic replication policy or exist in a single location. To remove
        keys from a Secret with multiple user managed replicas, please use the
        set-replication command.

        ## EXAMPLES

        To remove CMEK from a secret called 'my-secret', run:

          $ gcloud beta secrets replication update my-secret --remove-cmek

        To set the CMEK key on an automatic secret called my-secret to a specified
        KMS key, run:

          $gcloud beta secrets replication update my-secret
          --set-kms-key=projects/my-project/locations/global/keyRings/my-keyring/cryptoKeys/my-key

        To set the CMEK key on a secret called my-secret to a specified KMS key in
        a specified location in its replication, run:

          $gcloud beta secrets replication update my-secret
          --set-kms-key=projects/my-project/locations/us-central1/keyRings/my-keyring/cryptoKeys/my-key
          --location=us-central1
    flag:
        location: Location of replica to update. For secrets with automatic replication policies, this can be omitted.
        no-remove-cmek: Remove customer managed encryption key so that future versions will be encrypted by a Google managed encryption key.
        remove-cmek: Remove customer managed encryption key so that future versions will be encrypted by a Google managed encryption key.
        set-kms-key: New KMS key with which to encrypt and decrypt future secret versions.
