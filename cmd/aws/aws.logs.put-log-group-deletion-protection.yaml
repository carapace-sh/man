name: put-log-group-deletion-protection
description: Enables or disables deletion protection for the specified log group.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --deletion-protection-enabled!: Whether to enable deletion protection.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --log-group-identifier=!: The name or ARN of the log group.
    --no-deletion-protection-enabled!: Whether to enable deletion protection.
documentation:
    command: |-
        Enables or disables deletion protection for the specified log group. When enabled on a log group, deletion protection blocks all deletion operations until it is explicitly disabled.

        For information about the parameters that are common to all actions, see [Common Parameters](https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/CommonParameters.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        deletion-protection-enabled: |-
            Whether to enable deletion protection.

            Type: Boolean

            Required: Yes
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        log-group-identifier: |-
            The name or ARN of the log group.

            Type: String

            Length Constraints: Minimum length of 1. Maximum length of 512.

            Pattern: `[\.\-_/#A-Za-z0-9]+`

            Required: Yes
