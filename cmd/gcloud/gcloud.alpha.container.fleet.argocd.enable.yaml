name: enable
description: '*(ALPHA)*  Enable Config Delivery Argo CD Feature on a membership.'
hidden: true
flags:
    --config-membership=!: ID of the membership or fully qualified identifier for the membership.
    --location=: Location for the membership.
documentation:
    command: |-
        *(ALPHA)*  This command enables Config Delivery Argo CD Feature on a membership.

        ## EXAMPLES

        To enable the Config Delivery Argo CD Feature, run:

          $ gcloud alpha container fleet argocd enable --config-membership=CONFIG_MEMBERSHIP
    flag:
        config-membership: |-
            ID of the membership or fully qualified identifier for the membership.
            +
            To set the `membership` attribute:
            * provide the argument `--config-membership` on the command line.
        location: |-
            Location for the membership.
            +
            To set the `location` attribute:
            * provide the argument `--config-membership` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkehub/location`.
