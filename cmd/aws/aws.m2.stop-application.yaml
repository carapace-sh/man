name: stop-application
description: Stops a running application.
flags:
    --application-id=!: The unique identifier of the application you want to stop.
    --force-stop: Stopping an application process can take a long time.
    --no-force-stop&: Stopping an application process can take a long time.
documentation:
    command: Stops a running application.
    flag:
        application-id: The unique identifier of the application you want to stop.
        force-stop: Stopping an application process can take a long time. Setting this parameter to true lets you force stop the application so you don't need to wait until the process finishes to apply another action on the application. The default value is false.
