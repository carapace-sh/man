name: apply
description: '*(BETA)*  Update the Identity Service Feature.'
flags:
    --config=: The path to an identity-service.yaml configuration file.
    --fleet-default-member-config=: The path to an identity-service.yaml configuration file.
    --location=: Location for the membership.
    --membership=!: ID of the membership or fully qualified identifier for the membership.
    --origin=: Applies the fleet-level default membership configuration to a membership.
completion:
    flag:
        origin:
            - fleet
documentation:
    command: '*(BETA)*  This command updates the Identity Service Feature in a fleet.'
    flag:
        config: The path to an identity-service.yaml configuration file.
        fleet-default-member-config: The path to an identity-service.yaml configuration file.
        location: |-
            Location for the membership.
            +
            To set the `location` attribute:
            * provide the argument `--membership` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkehub/location`.
        membership: |-
            ID of the membership or fully qualified identifier for the membership.
            +
            To set the `membership` attribute:
            * provide the argument `--membership` on the command line.
        origin: 'Applies the fleet-level default membership configuration to a membership. _ORIGIN_ must be (only one value is supported): *fleet*.'
