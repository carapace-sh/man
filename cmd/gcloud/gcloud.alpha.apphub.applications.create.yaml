name: create
description: '*(ALPHA)*  Create an Apphub application.'
flags:
    --async: Return immediately, without waiting for the operation in progress to complete.
    --business-owners=: Business owners of the application
    --criticality-type=: Criticality Type of the application.
    --description=: Description of the Application
    --developer-owners=: Developer owners of the application
    --display-name=: Human-friendly display name
    --environment-type=: Environment Type of the application.
    --location=: The Cloud location for the application.
    --no-async&: Return immediately, without waiting for the operation in progress to complete.
    --operator-owners=: Operator owners of the application
    --scope-type=!: Scope of the Application.
completion:
    flag:
        criticality-type:
            - HIGH
            - LOW
            - MEDIUM
            - MISSION_CRITICAL
            - TYPE_UNSPECIFIED
        environment-type:
            - DEVELOPMENT
            - PRODUCTION
            - STAGING
            - TEST
            - TYPE_UNSPECIFIED
        scope-type:
            - GLOBAL
            - REGIONAL
documentation:
    command: '*(ALPHA)*  Create an Apphub application.'
    flag:
        async: Return immediately, without waiting for the operation in progress to complete.
        business-owners: Business owners of the application
        criticality-type: |-
            Criticality Type of the application. _CRITICALITY_TYPE_ must be one of:
            +
            *HIGH*::: High impact
            *LOW*::: Low impact
            *MEDIUM*::: Medium impact
            *MISSION_CRITICAL*::: Mission critical service, application or workload
            *TYPE_UNSPECIFIED*::: Unspecified criticality type
            :::
            +
        description: Description of the Application
        developer-owners: Developer owners of the application
        display-name: Human-friendly display name
        environment-type: |-
            Environment Type of the application. _ENVIRONMENT_TYPE_ must be one of:
            +
            *DEVELOPMENT*::: Development environment
            *PRODUCTION*::: Production environment
            *STAGING*::: Staging environment
            *TEST*::: Test environment
            *TYPE_UNSPECIFIED*::: Unspecified environment type
            :::
            +
        location: |-
            The Cloud location for the application.
            +
            To set the `location` attribute:
            * provide the argument `application` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: Return immediately, without waiting for the operation in progress to complete.
        operator-owners: Operator owners of the application
        scope-type: |-
            Scope of the Application. _SCOPE_TYPE_ must be one of:
            +
            *GLOBAL*::: Represents a global application
            *REGIONAL*::: Represents a regional application
            :::
            +
