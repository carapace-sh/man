name: get-lifecycle-policy-preview
description: Retrieves the results of the lifecycle policy preview request for the specified repository.
flags:
    --filter=: An optional parameter that filters results based on image tag status and all tags, if tagged.
    --image-ids=: The list of imageIDs to be included.
    --max-results=: "The maximum number of repository results returned by `GetLifecyclePolicyPreviewRequest` in\L paginated output."
    --next-token=: "The `nextToken` value returned from a previous paginated\L `GetLifecyclePolicyPreviewRequest` request where `maxResults` was used and the\L results exceeded the value of that parameter."
    --registry-id=: The Amazon Web Services account ID associated with the registry that contains the repository.
    --repository-name=!: The name of the repository.
documentation:
    command: Retrieves the results of the lifecycle policy preview request for the specified repository.
    flag:
        filter: An optional parameter that filters results based on image tag status and all tags, if tagged.
        image-ids: The list of imageIDs to be included.
        max-results: "The maximum number of repository results returned by `GetLifecyclePolicyPreviewRequest` in\L paginated output. When this parameter is used, `GetLifecyclePolicyPreviewRequest` only returns\L `maxResults` results in a single page along with a `nextToken`\L response element. The remaining results of the initial request can be seen by sending\L another `GetLifecyclePolicyPreviewRequest` request with the returned `nextToken`\L value. This value can be between 1 and 100. If this\L parameter is not used, then `GetLifecyclePolicyPreviewRequest` returns up to\L100 results and a `nextToken` value, if\L applicable. This option cannot be used when you specify images with `imageIds`."
        next-token: "The `nextToken` value returned from a previous paginated\L `GetLifecyclePolicyPreviewRequest` request where `maxResults` was used and the\L results exceeded the value of that parameter. Pagination continues from the end of the\L previous results that returned the `nextToken` value. This value is\L `null` when there are no more results to return. This option cannot be used when you specify images with `imageIds`."
        registry-id: The Amazon Web Services account ID associated with the registry that contains the repository. If you do not specify a registry, the default registry is assumed.
        repository-name: The name of the repository.
