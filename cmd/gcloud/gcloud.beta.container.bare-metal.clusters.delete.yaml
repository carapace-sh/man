documentation:
    command: '*(BETA)*  Delete an Anthos cluster on bare metal.'
    flag:
        allow-missing: If set, and the Bare Metal cluster is not found, the request will succeed but no action will be taken.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        force: If set, the operation will also apply to the child node pools. This flag is required if the cluster has any associated node pools.
        ignore-errors: If set, the deletion of a bare metal user cluster resource will succeed even if errors occur during deletion.
        location: |-
            Google Cloud location for the cluster.
            +
            To set the `location` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_bare_metal/location`.
        no-allow-missing: If set, and the Bare Metal cluster is not found, the request will succeed but no action will be taken.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-force: If set, the operation will also apply to the child node pools. This flag is required if the cluster has any associated node pools.
        no-ignore-errors: If set, the deletion of a bare metal user cluster resource will succeed even if errors occur during deletion.
        no-validate-only: If set, only validate the request, but do not actually perform the operation.
        validate-only: If set, only validate the request, but do not actually perform the operation.
