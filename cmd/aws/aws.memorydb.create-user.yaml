name: create-user
description: Creates a MemoryDB user.
flags:
    --access-string=!: Access permissions string used for this user.
    --authentication-mode=!: Denotes the user's authentication properties, such as whether it requires a password to authenticate.
    --tags=: A list of tags to be added to this resource.
    --user-name=!: The name of the user.
documentation:
    command: Creates a MemoryDB user. For more information, see [Authenticating users with Access Contol Lists (ACLs)](https://docs.aws.amazon.com/MemoryDB/latest/devguide/clusters.acls.html).
    flag:
        access-string: Access permissions string used for this user.
        authentication-mode: Denotes the user's authentication properties, such as whether it requires a password to authenticate.
        tags: A list of tags to be added to this resource. A tag is a key-value pair. A tag key must be accompanied by a tag value, although null is accepted.
        user-name: The name of the user. This value must be unique as it also serves as the user identifier.
