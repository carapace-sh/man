name: update-document-version
description: Changes the status of the document version to ACTIVE.
flags:
    --authentication-token=: Amazon WorkDocs authentication token.
    --document-id=!: The ID of the document.
    --version-id=!: The version ID of the document.
    --version-status=: The status of the version.
completion:
    flag:
        version-status:
            - ACTIVE
documentation:
    command: |-
        Changes the status of the document version to ACTIVE.

        Amazon WorkDocs also sets its document container to ACTIVE. This is the last step in a document upload, after the client uploads the document to an S3-presigned URL returned by [InitiateDocumentVersionUpload]().
    flag:
        authentication-token: Amazon WorkDocs authentication token. Not required when using Amazon Web Services administrator credentials to access the API.
        document-id: The ID of the document.
        version-id: The version ID of the document.
        version-status: The status of the version.
