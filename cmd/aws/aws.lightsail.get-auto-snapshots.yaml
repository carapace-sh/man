name: get-auto-snapshots
description: Returns the available automatic snapshots for an instance or disk.
flags:
    --resource-name=!: The name of the source instance or disk from which to get automatic snapshot information.
documentation:
    command: Returns the available automatic snapshots for an instance or disk. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-configuring-automatic-snapshots).
    flag:
        resource-name: The name of the source instance or disk from which to get automatic snapshot information.
