name: create-sync-configuration
description: Creates a sync configuration which allows Amazon Web Services to sync content from a Git repository to update a specified Amazon Web Services resource.
flags:
    --branch=!: The branch in the repository from which changes will be synced.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --config-file=!: The file name of the configuration file that manages syncing between the connection and the repository.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --publish-deployment-status=: Whether to enable or disable publishing of deployment status to source providers.
    --pull-request-comment=: A toggle that specifies whether to enable or disable pull request comments for the sync configuration to be created.
    --repository-link-id=!: The ID of the repository link created for the connection.
    --resource-name=!: The name of the Amazon Web Services resource (for example, a CloudFormation stack in the case of CFN\_STACK\_SYNC) that will be synchronized from the linked repository.
    --role-arn=!: The ARN of the IAM role that grants permission for Amazon Web Services to use Git sync to update a given Amazon Web Services resource on your behalf.
    --sync-type=!: The type of sync configuration.
    --trigger-resource-update-on=: When to trigger Git sync to begin the stack update.
completion:
    flag:
        publish-deployment-status:
            - ENABLED
            - DISABLED
        pull-request-comment:
            - ENABLED
            - DISABLED
        sync-type:
            - CFN_STACK_SYNC
        trigger-resource-update-on:
            - ANY_CHANGE
            - FILE_CHANGE
documentation:
    command: Creates a sync configuration which allows Amazon Web Services to sync content from a Git repository to update a specified Amazon Web Services resource. Parameters for the sync configuration are determined by the sync type.
    flag:
        branch: The branch in the repository from which changes will be synced.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        config-file: The file name of the configuration file that manages syncing between the connection and the repository. This configuration file is stored in the repository.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        publish-deployment-status: Whether to enable or disable publishing of deployment status to source providers.
        pull-request-comment: A toggle that specifies whether to enable or disable pull request comments for the sync configuration to be created.
        repository-link-id: The ID of the repository link created for the connection. A repository link allows Git sync to monitor and sync changes to files in a specified Git repository.
        resource-name: The name of the Amazon Web Services resource (for example, a CloudFormation stack in the case of CFN\_STACK\_SYNC) that will be synchronized from the linked repository.
        role-arn: The ARN of the IAM role that grants permission for Amazon Web Services to use Git sync to update a given Amazon Web Services resource on your behalf.
        sync-type: The type of sync configuration.
        trigger-resource-update-on: When to trigger Git sync to begin the stack update.
