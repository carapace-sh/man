name: update-data-set
description: Updates a dataset.
flags:
    --aws-account-id=!: The Amazon Web Services account ID.
    --column-groups=: Groupings of columns that work together in certain Amazon Quick Sight features.
    --column-level-permission-rules=: A set of one or more definitions of a `ColumnLevelPermissionRule`.
    --data-prep-configuration=: The data preparation configuration for the dataset.
    --data-set-id=!: The ID for the dataset that you want to update.
    --data-set-usage-configuration=: ""
    --dataset-parameters=: The parameter declarations of the dataset.
    --field-folders=: The folder that contains fields and nested subfolders for your dataset.
    --import-mode=!: Indicates whether you want to import the data into SPICE.
    --logical-table-map=: Configures the combination and transformation of the data from the physical tables.
    --name=!: The display name for the dataset.
    --performance-configuration=: The configuration for the performance optimization of the dataset that contains a `UniqueKey` configuration.
    --physical-table-map=!: Declares the physical tables that are available in the underlying data sources.
    --row-level-permission-data-set=: The row-level security configuration for the data you want to create.
    --row-level-permission-tag-configuration=: The configuration of tags on a dataset to set row-level security.
    --semantic-model-configuration=: The semantic model configuration for the dataset.
completion:
    flag:
        import-mode:
            - SPICE
            - DIRECT_QUERY
documentation:
    command: Updates a dataset. This operation doesn't support datasets that include uploaded files as a source. Partial updates are not supported by this operation.
    flag:
        aws-account-id: The Amazon Web Services account ID.
        column-groups: Groupings of columns that work together in certain Amazon Quick Sight features. Currently, only geospatial hierarchy is supported.
        column-level-permission-rules: A set of one or more definitions of a `ColumnLevelPermissionRule`.
        data-prep-configuration: The data preparation configuration for the dataset. This configuration defines the source tables, transformation steps, and destination tables used to prepare the data. Required when using the new data preparation experience.
        data-set-id: The ID for the dataset that you want to update. This ID is unique per Amazon Web Services Region for each Amazon Web Services account.
        data-set-usage-configuration: ""
        dataset-parameters: The parameter declarations of the dataset.
        field-folders: The folder that contains fields and nested subfolders for your dataset.
        import-mode: Indicates whether you want to import the data into SPICE.
        logical-table-map: Configures the combination and transformation of the data from the physical tables. This parameter is used with the legacy data preparation experience.
        name: The display name for the dataset.
        performance-configuration: The configuration for the performance optimization of the dataset that contains a `UniqueKey` configuration.
        physical-table-map: Declares the physical tables that are available in the underlying data sources.
        row-level-permission-data-set: The row-level security configuration for the data you want to create. This parameter is used with the legacy data preparation experience.
        row-level-permission-tag-configuration: The configuration of tags on a dataset to set row-level security. Row-level security tags are currently supported for anonymous embedding only. This parameter is used with the legacy data preparation experience.
        semantic-model-configuration: The semantic model configuration for the dataset. This configuration defines how the prepared data is structured for an analysis, including table mappings and row-level security configurations. Required when using the new data preparation experience.
