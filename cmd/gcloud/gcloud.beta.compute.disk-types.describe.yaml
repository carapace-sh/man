name: describe
description: '*(BETA)*  Describe a Compute Engine disk type.'
flags:
    --region=: Region of the disk type to describe.
    --zone=: Zone of the disk type to describe.
documentation:
    command: |
        *(BETA)*  *gcloud beta compute disk-types describe* displays all data associated with a Compute Engine
        disk type.
    flag:
        region: Region of the disk type to describe. Overrides the default *compute/region* property value for this command invocation.
        zone: Zone of the disk type to describe. Overrides the default *compute/zone* property value for this command invocation.
