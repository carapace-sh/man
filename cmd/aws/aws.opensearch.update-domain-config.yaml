name: update-domain-config
description: Modifies the cluster configuration of the specified Amazon OpenSearch Service domain.
flags:
    --access-policies=: Identity and Access Management (IAM) access policy as a JSON-formatted string.
    --advanced-options=: Key-value pairs to specify advanced configuration options.
    --advanced-security-options=: Options for fine-grained access control.
    --aiml-options=: Options for all machine learning features for the specified domain.
    --auto-tune-options=: Options for Auto-Tune.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cluster-config=: Changes that you want to make to the cluster configuration, such as the instance type and number of EC2 instances.
    --cognito-options=: Key-value pairs to configure Amazon Cognito authentication for OpenSearch Dashboards.
    --domain-endpoint-options=: Additional options for the domain endpoint, such as whether to require HTTPS for all traffic.
    --domain-name=!: The name of the domain that you're updating.
    --dry-run: This flag, when set to True, specifies whether the `UpdateDomain` request should return the results of a dry run analysis without actually applying the change.
    --dry-run-mode=: The type of dry run to perform.
    --ebs-options=: The type and size of the EBS volume to attach to instances in the domain.
    --encryption-at-rest-options=: Encryption at rest options for the domain.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identity-center-options=: ""
    --ip-address-type=: Specify either dual stack or IPv4 as your IP address type.
    --log-publishing-options=: Options to publish OpenSearch logs to Amazon CloudWatch Logs.
    --no-dry-run: This flag, when set to True, specifies whether the `UpdateDomain` request should return the results of a dry run analysis without actually applying the change.
    --node-to-node-encryption-options=: Node-to-node encryption options for the domain.
    --off-peak-window-options=: Off-peak window options for the domain.
    --snapshot-options=: Option to set the time, in UTC format, for the daily automated snapshot.
    --software-update-options=: Service software update options for the domain.
    --vpc-options=: Options to specify the subnets and security groups for a VPC endpoint.
completion:
    flag:
        dry-run-mode:
            - Basic
            - Verbose
        ip-address-type:
            - ipv4
            - dualstack
documentation:
    command: Modifies the cluster configuration of the specified Amazon OpenSearch Service domain.
    flag:
        access-policies: Identity and Access Management (IAM) access policy as a JSON-formatted string.
        advanced-options: |-
            Key-value pairs to specify advanced configuration options. The following key-value pairs are supported:

            - `"rest.action.multi.allow_explicit_index": "true" | "false"` - Note the use of a string rather than a boolean. Specifies whether explicit references to indexes are allowed inside the body of HTTP requests. If you want to configure access policies for domain sub-resources, such as specific indexes and domain APIs, you must disable this property. Default is true.
            - `"indices.fielddata.cache.size": "80"` - Note the use of a string rather than a boolean. Specifies the percentage of heap space allocated to field data. Default is unbounded.
            - `"indices.query.bool.max_clause_count": "1024"` - Note the use of a string rather than a boolean. Specifies the maximum number of clauses allowed in a Lucene boolean query. Default is 1,024. Queries with more than the permitted number of clauses result in a `TooManyClauses` error.

            For more information, see [Advanced cluster parameters](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/createupdatedomains.html#createdomain-configure-advanced-options).
        advanced-security-options: Options for fine-grained access control.
        aiml-options: Options for all machine learning features for the specified domain.
        auto-tune-options: Options for Auto-Tune.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cluster-config: Changes that you want to make to the cluster configuration, such as the instance type and number of EC2 instances.
        cognito-options: Key-value pairs to configure Amazon Cognito authentication for OpenSearch Dashboards.
        domain-endpoint-options: Additional options for the domain endpoint, such as whether to require HTTPS for all traffic.
        domain-name: The name of the domain that you're updating.
        dry-run: This flag, when set to True, specifies whether the `UpdateDomain` request should return the results of a dry run analysis without actually applying the change. A dry run determines what type of deployment the update will cause.
        dry-run-mode: |-
            The type of dry run to perform.

            - `Basic` only returns the type of deployment (blue/green or dynamic) that the update will cause.
            - `Verbose` runs an additional check to validate the changes you're making. For more information, see [Validating a domain update](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/managedomains-configuration-changes#validation-check).
        ebs-options: The type and size of the EBS volume to attach to instances in the domain.
        encryption-at-rest-options: Encryption at rest options for the domain.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        identity-center-options: ""
        ip-address-type: Specify either dual stack or IPv4 as your IP address type. Dual stack allows you to share domain resources across IPv4 and IPv6 address types, and is the recommended option. If your IP address type is currently set to dual stack, you can't change it.
        log-publishing-options: Options to publish OpenSearch logs to Amazon CloudWatch Logs.
        node-to-node-encryption-options: Node-to-node encryption options for the domain.
        off-peak-window-options: Off-peak window options for the domain.
        snapshot-options: Option to set the time, in UTC format, for the daily automated snapshot. Default value is `0` hours.
        software-update-options: Service software update options for the domain.
        vpc-options: Options to specify the subnets and security groups for a VPC endpoint. For more information, see [Launching your Amazon OpenSearch Service domains using a VPC](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/vpc.html).
