name: list-assets
description: Retrieves a paginated list of asset summaries.
flags:
    --asset-model-id=: The ID of the asset model by which to filter the list of assets.
    --filter=: The filter for the requested list of assets.
    --max-results=: The maximum number of results to return for each paginated request.
    --next-token=: The token to be used for the next set of paginated results.
completion:
    flag:
        filter:
            - ALL
            - TOP_LEVEL
documentation:
    command: |-
        Retrieves a paginated list of asset summaries.

        You can use this operation to do the following:

        - List assets based on a specific asset model.
        - List top-level assets.

        You can't use this operation to list all assets. To retrieve summaries for all of your assets, use [ListAssetModels](https://docs.aws.amazon.com/iot-sitewise/latest/APIReference/API_ListAssetModels.html) to get all of your asset model IDs. Then, use ListAssets to get all assets for each asset model.
    flag:
        asset-model-id: The ID of the asset model by which to filter the list of assets. This parameter is required if you choose `ALL` for `filter`. This can be either the actual ID in UUID format, or else `externalId:` followed by the external ID, if it has one. For more information, see [Referencing objects with external IDs](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/object-ids.html#external-id-references) in the *IoT SiteWise User Guide*.
        filter: |-
            The filter for the requested list of assets. Choose one of the following options:

            - `ALL` – The list includes all assets for a given asset model ID. The `assetModelId` parameter is required if you filter by `ALL`.
            - `TOP_LEVEL` – The list includes only top-level assets in the asset hierarchy tree.

            Default: `ALL`
        max-results: |-
            The maximum number of results to return for each paginated request.

            Default: 50
        next-token: The token to be used for the next set of paginated results.
