name: reset-distribution-cache
description: Deletes currently cached content from your Amazon Lightsail content delivery network (CDN) distribution.
flags:
    --distribution-name=: The name of the distribution for which to reset cache.
documentation:
    command: |-
        Deletes currently cached content from your Amazon Lightsail content delivery network (CDN) distribution.

        After resetting the cache, the next time a content request is made, your distribution pulls, serves, and caches it from the origin.
    flag:
        distribution-name: |-
            The name of the distribution for which to reset cache.

            Use the `GetDistributions` action to get a list of distribution names that you can specify.
