name: resume
description: '*(ALPHA)*  Resume a Database Migration Service migration job.'
flags:
    --region=: The name of the region.
documentation:
    command: |
        *(ALPHA)*  Resume a Database Migration Service migration job.
    flag:
        region: |-
            The name of the region.
            +
            To set the `region` attribute:
            * provide the argument `migration_job` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
