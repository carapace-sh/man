name: tag-resource
description: Assigns a set of key-value pairs to a resource.
flags:
    --resource-arn=!: The ARN that uniquely identifies the resource.
    --tags=!: Key-value pairs that are used to help organize your resources.
documentation:
    command: Assigns a set of key-value pairs to a resource.
    flag:
        resource-arn: The ARN that uniquely identifies the resource.
        tags: 'Key-value pairs that are used to help organize your resources. You can assign your own metadata to the resources you create. For clarity, this is the structure to assign tags: `[{"Key":"string","Value":"string"}]`.'
