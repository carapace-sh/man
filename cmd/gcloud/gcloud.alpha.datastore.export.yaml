name: export
description: '*(ALPHA)*  Export Cloud Datastore entities to Google Cloud Storage.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --kinds=: A list specifying what kinds will be included in the operation.
    --namespaces=: A list specifying what namespaces will be included in the operation.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --operation-labels=: A string:string map of custom labels to associate with this operation.
documentation:
    command: |-
        *(ALPHA)*  Export a copy of all or a subset of entities from Google Cloud Datastore
        to another storage system, such as Google Cloud Storage. Recent
        updates to entities may not be reflected in the export. The export occurs in
        the background and its progress can be monitored and managed via the operation
        commands.  The output of an export may only be used once the operation has
        completed. If an export operation is cancelled before completion then it may
        leave partial data behind in Google Cloud Storage.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        kinds: |-
            A list specifying what kinds will be included in the operation. When
            omitted, all Kinds are included. For example, to operate on only the
            'Customer' and 'Order' Kinds:
            +
              $ {command} --kinds='Customer','Order'
        namespaces: |-
            A list specifying what namespaces will be included in the operation.
            When omitted, all namespaces are included in the operation,
            including the default namespace. To specify that *only* the default
            namespace should be operated on, use the special symbol '(default)'.
            For example, to operate on entities from both the 'customers' and default
            namespaces:
            +
              $ {command} --namespaces='(default)','customers'
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        operation-labels: |-
            A string:string map of custom labels to associate with this operation.
            For example:
            +
              $ {command} --operation-labels=comment='customer orders','sales rep'=pending
