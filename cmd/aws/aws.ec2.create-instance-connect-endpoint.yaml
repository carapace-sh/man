name: create-instance-connect-endpoint
description: Creates an EC2 Instance Connect Endpoint.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ip-address-type=: The IP address type of the endpoint.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-preserve-client-ip: Indicates whether the client IP address is preserved as the source.
    --preserve-client-ip: Indicates whether the client IP address is preserved as the source.
    --security-group-ids=:
        description: One or more security groups to associate with the endpoint.
        nargs: -1
    --subnet-id=!: The ID of the subnet in which to create the EC2 Instance Connect Endpoint.
    --tag-specifications=:
        description: The tags to apply to the EC2 Instance Connect Endpoint during creation.
        nargs: -1
completion:
    flag:
        ip-address-type:
            - ipv4
            - dualstack
            - ipv6
documentation:
    command: |-
        Creates an EC2 Instance Connect Endpoint.

        An EC2 Instance Connect Endpoint allows you to connect to an instance, without requiring the instance to have a public IPv4 or public IPv6 address. For more information, see [Connect to your instances using EC2 Instance Connect Endpoint](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Connect-using-EC2-Instance-Connect-Endpoint.html) in the *Amazon EC2 User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ip-address-type: |-
            The IP address type of the endpoint.

            If no value is specified, the default value is determined by the IP address type of the subnet:

            - `dualstack` - If the subnet has both IPv4 and IPv6 CIDRs
            - `ipv4` - If the subnet has only IPv4 CIDRs
            - `ipv6` - If the subnet has only IPv6 CIDRs

            `PreserveClientIp` is only supported on IPv4 EC2 Instance Connect Endpoints. To use `PreserveClientIp`, the value for `IpAddressType` must be `ipv4`.
        preserve-client-ip: |-
            Indicates whether the client IP address is preserved as the source. The following are the possible values.

            - `true` - Use the client IP address as the source.
            - `false` - Use the network interface IP address as the source.

            `PreserveClientIp` is only supported on IPv4 EC2 Instance Connect Endpoints. To use `PreserveClientIp`, the value for `IpAddressType` must be `ipv4`.

            Default: `false`
        security-group-ids: One or more security groups to associate with the endpoint. If you don't specify a security group, the default security group for your VPC will be associated with the endpoint.
        subnet-id: The ID of the subnet in which to create the EC2 Instance Connect Endpoint.
        tag-specifications: The tags to apply to the EC2 Instance Connect Endpoint during creation.
