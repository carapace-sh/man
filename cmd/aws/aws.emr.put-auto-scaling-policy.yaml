name: put-auto-scaling-policy
description: Creates or updates an automatic scaling policy for a core instance group or task instance group in an Amazon EMR cluster.
flags:
    --auto-scaling-policy=!: Specifies the definition of the automatic scaling policy.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cluster-id=!: Specifies the ID of a cluster.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-group-id=!: Specifies the ID of the instance group to which the automatic scaling policy is applied.
documentation:
    command: Creates or updates an automatic scaling policy for a core instance group or task instance group in an Amazon EMR cluster. The automatic scaling policy defines how an instance group dynamically adds and terminates Amazon EC2 instances in response to the value of a CloudWatch metric.
    flag:
        auto-scaling-policy: Specifies the definition of the automatic scaling policy.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cluster-id: Specifies the ID of a cluster. The instance group to which the automatic scaling policy is applied is within this cluster.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-group-id: Specifies the ID of the instance group to which the automatic scaling policy is applied.
