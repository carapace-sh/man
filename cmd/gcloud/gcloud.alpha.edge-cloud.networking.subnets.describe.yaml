name: describe
description: '*(ALPHA)*  Show details about the Distributed Cloud Edge Network subnet.'
flags:
    --location=: The global location name.
    --zone=: The name of the Google Distributed Cloud Edge zone.
documentation:
    command: |
        *(ALPHA)*  Show details about the Distributed Cloud Edge Network subnet.
    flag:
        location: |-
            The global location name.
            +
            To set the `location` attribute:
            * provide the argument `subnet` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        zone: |-
            The name of the Google Distributed Cloud Edge zone.
            +
            To set the `zone` attribute:
            * provide the argument `subnet` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line.
