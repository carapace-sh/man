name: show-rows
description: '*(ALPHA)*  Display selected rows in a specified table or view.'
flags:
    --dataset=: The id of the BigQuery dataset.
    --limit=: How many rows to return in the result.
    --start=: First row to return in the result.
    --table=!: ID of the table or fully qualified identifier for the table.
documentation:
    command: '*(ALPHA)*  Display selected rows in a specified table or view.'
    flag:
        dataset: |-
            The id of the BigQuery dataset.
            +
            To set the `dataset` attribute:
            * provide the argument `--table` on the command line with a fully specified name;
            * provide the argument `--dataset` on the command line.
        limit: How many rows to return in the result.
        start: First row to return in the result.
        table: |-
            ID of the table or fully qualified identifier for the table.
            +
            To set the `table` attribute:
            * provide the argument `--table` on the command line.
