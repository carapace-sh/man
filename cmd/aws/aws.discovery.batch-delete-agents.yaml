name: batch-delete-agents
description: Deletes one or more agents or collectors as specified by ID.
flags:
    --delete-agents=!: The list of agents to delete.
documentation:
    command: Deletes one or more agents or collectors as specified by ID. Deleting an agent or collector does not delete the previously discovered data. To delete the data collected, use `StartBatchDeleteConfigurationTask`.
    flag:
        delete-agents: The list of agents to delete.
