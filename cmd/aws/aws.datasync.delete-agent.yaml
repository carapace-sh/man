name: delete-agent
description: Removes an DataSync agent resource from your Amazon Web Services account.
flags:
    --agent-arn=!: The Amazon Resource Name (ARN) of the agent to delete.
documentation:
    command: |-
        Removes an DataSync agent resource from your Amazon Web Services account.

        Keep in mind that this operation (which can't be undone) doesn't remove the agent's virtual machine (VM) or Amazon EC2 instance from your storage environment. For next steps, you can delete the VM or instance from your storage environment or reuse it to [activate a new agent](https://docs.aws.amazon.com/datasync/latest/userguide/activate-agent.html).
    flag:
        agent-arn: The Amazon Resource Name (ARN) of the agent to delete. Use the `ListAgents` operation to return a list of agents for your account and Amazon Web Services Region.
