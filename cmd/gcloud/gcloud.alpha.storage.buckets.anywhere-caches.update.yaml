name: update
description: '*(ALPHA)*  Update Anywhere Cache instances.'
flags:
    --admission-policy=: The cache admission policy decides for each cache miss, whether to insert the missed block or not.
    --ttl=: Cache entry time-to-live.
completion:
    flag:
        admission-policy:
            - ADMIT_ON_FIRST_MISS
            - ADMIT_ON_SECOND_MISS
documentation:
    command: |4
        *(ALPHA)*  Update one or more Anywhere Cache instances. A cache instance can be
        updated if its state is created or pending creation.
    flag:
        admission-policy: 'The cache admission policy decides for each cache miss, whether to insert the missed block or not. _ADMISSION_POLICY_ must be one of: *ADMIT_ON_FIRST_MISS*, *ADMIT_ON_SECOND_MISS*.'
        ttl: Cache entry time-to-live. Default to 24h if not provided.
