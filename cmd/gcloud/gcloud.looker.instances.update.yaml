name: update
description: Update a Looker instance.
flags:
    --add-developer-users=: Number of additional Developer Users to allocate to the Looker Instance.
    --add-standard-users=: Number of additional Standard Users to allocate to the Looker Instance.
    --add-viewer-users=: Number of additional Viewer Users to allocate to the Looker Instance.
    --allowed-email-domains=!: This specifies the entire allowed email domain list.
    --async: Return immediately, without waiting for the operation in progress to
    --class-type=: The class type of the Looker instance.
    --clear-psc-allowed-vpcs: Remove all service attachments from the PSC config of the instance.
    --clear-psc-service-attachments: Remove all allowed VPCs from the PSC config of the instance.
    --custom-domain=: Domain name wanted to serve the Looker instance.
    --deny-maintenance-period-end-date=!: 'End date of the deny maintenance period in format: YYYY-MM-DD'
    --deny-maintenance-period-start-date=!: 'Start date of the deny maintenance period in format: YYYY-MM-DD'
    --deny-maintenance-period-time=!: Time in UTC when the period starts and ends.
    --egress-enabled: This specifies whether controlled egress is enabled on the Looker instance.
    --egress-fqdns=: List of FQDNs that are allowed to egress from the Looker instance.
    --linked-lsp-project-number=: The Looker Studio Pro project number to be linked.
    --maintenance-window-day=!: Day of the week for the maintenance window, in UTC time zone.
    --maintenance-window-time=!: Hour of day for maintenance window, in UTC time zone.
    --marketplace-enabled: This specifies whether marketplace is enabled for controlled egress on the Looker instance.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-psc-allowed-vpcs&: Remove all service attachments from the PSC config of the instance.
    --no-clear-psc-service-attachments&: Remove all allowed VPCs from the PSC config of the instance.
    --no-egress-enabled&: This specifies whether controlled egress is enabled on the Looker instance.
    --no-marketplace-enabled&: This specifies whether marketplace is enabled for controlled egress on the Looker instance.
    --no-public-ip-enabled&: This specifies whether public IP is enabled on the Looker instance.
    --oauth-client-id=!: The client ID from an external OAuth application.
    --oauth-client-secret=!: The client secret from an external OAuth application.
    --psc-allowed-vpcs=: List of VPCs that are allowed ingress into the Looker instance.
    --psc-service-attachment=: Service attachments representing egress connections for the Looker instance.
    --public-ip-enabled: This specifies whether public IP is enabled on the Looker instance.
    --region=: The name of the Looker region of the instance.
completion:
    flag:
        class-type:
            - p1
            - r1
        maintenance-window-day:
            - friday
            - monday
            - saturday
            - sunday
            - thursday
            - tuesday
            - wednesday
documentation:
    command: |
        Update the metadata and/or configuration parameters of a Looker instance.

        This command can fail for the following reasons:
          * The instance specified does not exist.
          * The active account does not have permission to update the given
            instance.
    flag:
        add-developer-users: Number of additional Developer Users to allocate to the Looker Instance.
        add-standard-users: Number of additional Standard Users to allocate to the Looker Instance.
        add-viewer-users: Number of additional Viewer Users to allocate to the Looker Instance.
        allowed-email-domains: This specifies the entire allowed email domain list.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        class-type: 'The class type of the Looker instance. _CLASS_TYPE_ must be one of: *p1*, *r1*.'
        clear-psc-allowed-vpcs: Remove all service attachments from the PSC config of the instance.
        clear-psc-service-attachments: Remove all allowed VPCs from the PSC config of the instance.
        custom-domain: Domain name wanted to serve the Looker instance.
        deny-maintenance-period-end-date: 'End date of the deny maintenance period in format: YYYY-MM-DD'
        deny-maintenance-period-start-date: 'Start date of the deny maintenance period in format: YYYY-MM-DD'
        deny-maintenance-period-time: |-
            Time in UTC when the period starts and ends.  A valid time of day must be
            specified in 24hr format (ex: 13:00, 17:30, 23:45).
        egress-enabled: |-
            This specifies whether controlled egress is enabled on the Looker instance. To disable controlled egress,
            use the `--no-egress-enabled` flag.
        egress-fqdns: 'List of FQDNs that are allowed to egress from the Looker instance. Example: `--egress-fqdns="github.com,my.salesforce.com"`. To clear all egress FQDNs, use `--egress-fqdns=""`.'
        linked-lsp-project-number: The Looker Studio Pro project number to be linked.
        maintenance-window-day: 'Day of the week for the maintenance window, in UTC time zone. _MAINTENANCE_WINDOW_DAY_ must be one of: *friday*, *monday*, *saturday*, *sunday*, *thursday*, *tuesday*, *wednesday*.'
        maintenance-window-time: |-
            Hour of day for maintenance window, in UTC time zone. A valid time of day must be
            specified in 24hr format (ex: 13:00, 17:30, 23:45). Maintenance will be scheduled
            within 60 minutes. To set the maintenance-window-time* attribute:
            * provide the argument *--maintenance-window-time* on the command line.
        marketplace-enabled: |-
            This specifies whether marketplace is enabled for controlled egress on the Looker instance. To disable marketplace for controlled egress,
            use the `--no-marketplace-enabled` flag.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-psc-allowed-vpcs: |
            Remove all service attachments from the PSC config of the instance.
        no-clear-psc-service-attachments: |
            Remove all allowed VPCs from the PSC config of the instance.
        no-egress-enabled: |
            This specifies whether controlled egress is enabled on the Looker instance. To disable controlled egress,
            use the `--no-egress-enabled` flag.
        no-marketplace-enabled: |
            This specifies whether marketplace is enabled for controlled egress on the Looker instance. To disable marketplace for controlled egress,
            use the `--no-marketplace-enabled` flag.
        no-public-ip-enabled: |
            This specifies whether public IP is enabled on the Looker instance.
        oauth-client-id: The client ID from an external OAuth application.
        oauth-client-secret: The client secret from an external OAuth application.
        psc-allowed-vpcs: List of VPCs that are allowed ingress into the Looker instance.
        psc-service-attachment: |-
            Service attachments representing egress connections for the Looker instance.
            This flag can be repeated.
            (Example: --psc-service-attachment domain="mydomain.com",attachment="projects/my-project/regions/us-east1/serviceAttachments/sa" --psc-service-attachments domain="mydomain2.com",attachment="projects/my-project/regions/us-east1/serviceAttachments/sa2")
            +
            You can also assign multiple domains to a single service attachment.
            (Example: --psc-service-attachment multiple-domains="mydomain.com;mydomain2.com",attachment="projects/my-project/regions/us-east1/serviceAttachments/sa")
        public-ip-enabled: This specifies whether public IP is enabled on the Looker instance.
        region: |-
            The name of the Looker region of the instance. Overrides the default
            looker/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `looker/region`.
