name: unlink
description: '*(ALPHA)*  *(DEPRECATED)*  Unlink the account (if any) linked with a project.'
documentation:
    command: |4
        *(ALPHA)*  *(DEPRECATED)*  The `gcloud alpha billing accounts projects` group has been moved to `gcloud
        billing projects`. Please use the new, shorter commands instead.

        This command unlinks a project from its linked billing
        account. This disables billing on the project.
