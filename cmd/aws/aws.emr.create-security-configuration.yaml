name: create-security-configuration
description: Creates a security configuration, which is stored in the service and can be specified when a cluster is created.
flags:
    --name=!: The name of the security configuration.
    --security-configuration=!: The security configuration details in JSON format.
documentation:
    command: Creates a security configuration, which is stored in the service and can be specified when a cluster is created.
    flag:
        name: The name of the security configuration.
        security-configuration: The security configuration details in JSON format. For JSON parameters and examples, see [Use Security Configurations to Set Up Cluster Security](https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-security-configurations.html) in the *Amazon EMR Management Guide*.
