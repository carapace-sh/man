name: delete
description: '*(ALPHA)*  Delete a service account from a project.'
flags:
    --recommend=: If true, checks Active Assist recommendation for the risk level of service account deletion, and issues a warning in the prompt.
documentation:
    command: |-
        *(ALPHA)*  If the service account does not exist, this command returns a
        `PERMISSION_DENIED` error.
    flag:
        recommend: If true, checks Active Assist recommendation for the risk level of service account deletion, and issues a warning in the prompt. Optional flag is set to false by default. For details see https://cloud.google.com/recommender/docs/change-risk-recommendations
