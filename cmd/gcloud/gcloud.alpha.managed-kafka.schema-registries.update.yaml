name: update
description: '*(ALPHA)*  Update the mode and compatibility of a schema registry.'
flags:
    --compatibility=: The compatibility of the schema registry to update.
    --location=: ID of the location of the Managed Service for Apache Kafka resource.
    --mode=: The mode of the schema registry to update.
documentation:
    command: |-
        ## EXAMPLES

        Modify the mode of the schema registry to READONLY:

          $ gcloud alpha managed-kafka schema-registries update --mode=READONLY

        Modify the compatibility of the schema registry to BACKWARDS:

          $ gcloud alpha managed-kafka schema-registries update --compatibility=BACKWARDS
    flag:
        compatibility: The compatibility of the schema registry to update.
        location: |-
            ID of the location of the Managed Service for Apache Kafka resource. See
            https://cloud.google.com/managed-service-for-apache-kafka/docs/locations for a list of supported
            locations.
            +

            To set the `location` attribute:
            * provide the argument `schema_registry` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        mode: The mode of the schema registry to update.
