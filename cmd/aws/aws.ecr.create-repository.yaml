name: create-repository
description: Creates a repository.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --encryption-configuration=: The encryption configuration for the repository.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --image-scanning-configuration=: The `imageScanningConfiguration` parameter is being deprecated, in favor of specifying the image scanning configuration at the registry level.
    --image-tag-mutability-exclusion-filters=:
        description: A list of filters that specify which image tags should be excluded from the repository's image tag mutability setting.
        nargs: -1
    --image-tag-mutability=: The tag mutability setting for the repository.
    --registry-id=: The Amazon Web Services account ID associated with the registry to create the repository.
    --repository-name=!: The name to use for the repository.
    --tags=:
        description: The metadata that you apply to the repository to help you categorize and organize them.
        nargs: -1
completion:
    flag:
        image-tag-mutability:
            - MUTABLE
            - IMMUTABLE
            - IMMUTABLE_WITH_EXCLUSION
            - MUTABLE_WITH_EXCLUSION
documentation:
    command: Creates a repository. For more information, see [Amazon ECR repositories](https://docs.aws.amazon.com/AmazonECR/latest/userguide/Repositories.html) in the *Amazon Elastic Container Registry User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        encryption-configuration: The encryption configuration for the repository. This determines how the contents of your repository are encrypted at rest.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        image-scanning-configuration: |-
            The `imageScanningConfiguration` parameter is being deprecated, in favor of specifying the image scanning configuration at the registry level. For more information, see `PutRegistryScanningConfiguration`.

            The image scanning configuration for the repository. This determines whether images are scanned for known vulnerabilities after being pushed to the repository.
        image-tag-mutability: The tag mutability setting for the repository. If this parameter is omitted, the default setting of `MUTABLE` will be used which will allow image tags to be overwritten. If `IMMUTABLE` is specified, all image tags within the repository will be immutable which will prevent them from being overwritten.
        image-tag-mutability-exclusion-filters: A list of filters that specify which image tags should be excluded from the repository's image tag mutability setting.
        registry-id: The Amazon Web Services account ID associated with the registry to create the repository. If you do not specify a registry, the default registry is assumed.
        repository-name: |-
            The name to use for the repository. The repository name may be specified on its own (such as `nginx-web-app`) or it can be prepended with a namespace to group the repository into a category (such as `project-a/nginx-web-app`).

            The repository name must start with a letter and can only contain lowercase letters, numbers, hyphens, underscores, and forward slashes.
        tags: The metadata that you apply to the repository to help you categorize and organize them. Each tag consists of a key and an optional value, both of which you define. Tag keys can have a maximum character length of 128 characters, and tag values can have a maximum length of 256 characters.
