name: describe
description: Get metadata for a root Certificate Authority.
flags:
    --location=: The location of the CERTIFICATE_AUTHORITY.
    --pool=: The ID of the CA Pool.
documentation:
    command: |
        Returns metadata for the given Certificate Authority.
    flag:
        location: |-
            The location of the CERTIFICATE_AUTHORITY.
            +
            To set the `location` attribute:
            * provide the argument `certificate_authority` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `privateca/location`.
        pool: |-
            The ID of the CA Pool.
            +
            To set the `pool` attribute:
            * provide the argument `certificate_authority` on the command line with a fully specified name;
            * provide the argument `--pool` on the command line.
