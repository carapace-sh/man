name: list-workspace-service-account-tokens
description: Returns a list of tokens for a workspace service account.
flags:
    --max-results=: The maximum number of tokens to include in the results.
    --next-token=: The token for the next set of service accounts to return.
    --service-account-id=!: The ID of the service account for which to return tokens.
    --workspace-id=!: The ID of the workspace for which to return tokens.
documentation:
    command: |-
        Returns a list of tokens for a workspace service account.

        This does not return the key for each token. You cannot access keys after they are created. To create a new key, delete the token and recreate it.

        Service accounts are only available for workspaces that are compatible with Grafana version 9 and above.
    flag:
        max-results: The maximum number of tokens to include in the results.
        next-token: The token for the next set of service accounts to return. (You receive this token from a previous `ListWorkspaceServiceAccountTokens` operation.)
        service-account-id: The ID of the service account for which to return tokens.
        workspace-id: The ID of the workspace for which to return tokens.
