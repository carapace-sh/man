name: set-type-default-version
description: Specify the default version of an extension.
flags:
    --arn=: The Amazon Resource Name (ARN) of the extension for which you want version summary information.
    --type-name=: The name of the extension.
    --type=: The kind of extension.
    --version-id=: The ID of a specific version of the extension.
completion:
    flag:
        type:
            - RESOURCE
            - MODULE
            - HOOK
documentation:
    command: Specify the default version of an extension. The default version of an extension will be used in CloudFormation operations.
    flag:
        arn: |-
            The Amazon Resource Name (ARN) of the extension for which you want version summary information.

            Conditional: You must specify either `TypeName` and `Type`, or `Arn`.
        type: |-
            The kind of extension.

            Conditional: You must specify either `TypeName` and `Type`, or `Arn`.
        type-name: |-
            The name of the extension.

            Conditional: You must specify either `TypeName` and `Type`, or `Arn`.
        version-id: The ID of a specific version of the extension. The version ID is the value at the end of the Amazon Resource Name (ARN) assigned to the extension version when it is registered.
