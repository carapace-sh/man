name: list-accepted-portfolio-shares
description: Lists all imported portfolios for which account-to-account shares were accepted by this account.
flags:
    --accept-language=: The language code.
    --page-size=: The maximum number of items to return with this call.
    --page-token=: The page token for the next set of results.
    --portfolio-share-type=: The type of shared portfolios to list.
completion:
    flag:
        portfolio-share-type:
            - IMPORTED
            - AWS_SERVICECATALOG
            - AWS_ORGANIZATIONS
documentation:
    command: Lists all imported portfolios for which account-to-account shares were accepted by this account. By specifying the `PortfolioShareType`, you can list portfolios for which organizational shares were accepted by this account.
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        page-size: The maximum number of items to return with this call.
        page-token: The page token for the next set of results. To retrieve the first set of results, use null.
        portfolio-share-type: |-
            The type of shared portfolios to list. The default is to list imported portfolios.

            - `AWS_ORGANIZATIONS` - List portfolios accepted and shared via organizational sharing by the management account or delegated administrator of your organization.
            - `AWS_SERVICECATALOG` - Deprecated type.
            - `IMPORTED` - List imported portfolios that have been accepted and shared through account-to-account sharing.
