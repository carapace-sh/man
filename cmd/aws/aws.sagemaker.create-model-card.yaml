name: create-model-card
description: Creates an Amazon SageMaker Model Card.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --content=!: The content of the model card.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --model-card-name=!: The unique name of the model card.
    --model-card-status=!: The approval status of the model card within your organization.
    --security-config=: An optional Key Management Service key to encrypt, decrypt, and re-encrypt model card content for regulated workloads with highly sensitive data.
    --tags=:
        description: Key-value pairs used to manage metadata for model cards.
        nargs: -1
completion:
    flag:
        model-card-status:
            - Draft
            - PendingReview
            - Approved
            - Archived
documentation:
    command: |-
        Creates an Amazon SageMaker Model Card.

        For information about how to use model cards, see [Amazon SageMaker Model Card](https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        content: The content of the model card. Content must be in [model card JSON schema](https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html#model-cards-json-schema) and provided as a string.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        model-card-name: The unique name of the model card.
        model-card-status: |-
            The approval status of the model card within your organization. Different organizations might have different criteria for model card review and approval.

            - `Draft`: The model card is a work in progress.
            - `PendingReview`: The model card is pending review.
            - `Approved`: The model card is approved.
            - `Archived`: The model card is archived. No more updates should be made to the model card, but it can still be exported.
        security-config: An optional Key Management Service key to encrypt, decrypt, and re-encrypt model card content for regulated workloads with highly sensitive data.
        tags: Key-value pairs used to manage metadata for model cards.
