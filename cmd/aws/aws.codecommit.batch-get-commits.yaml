name: batch-get-commits
description: Returns information about the contents of one or more commits in a repository.
flags:
    --commit-ids=!: The full commit IDs of the commits to get information about.
    --repository-name=!: The name of the repository that contains the commits.
documentation:
    command: Returns information about the contents of one or more commits in a repository.
    flag:
        commit-ids: |-
            The full commit IDs of the commits to get information about.

            You must supply the full SHA IDs of each commit. You cannot use shortened SHA IDs.
        repository-name: The name of the repository that contains the commits.
