name: get-ebsvolume-recommendations
description: Returns Amazon Elastic Block Store (Amazon EBS) volume recommendations.
flags:
    --account-ids=: The ID of the Amazon Web Services account for which to return volume recommendations.
    --filters=: An array of objects to specify a filter that returns a more specific list of volume recommendations.
    --max-results=: The maximum number of volume recommendations to return with a single request.
    --next-token=: The token to advance to the next page of volume recommendations.
    --volume-arns=: The Amazon Resource Name (ARN) of the volumes for which to return recommendations.
documentation:
    command: |-
        Returns Amazon Elastic Block Store (Amazon EBS) volume recommendations.

        Compute Optimizer generates recommendations for Amazon EBS volumes that meet a specific set of requirements. For more information, see the [Supported resources and requirements](https://docs.aws.amazon.com/compute-optimizer/latest/ug/requirements.html) in the *Compute Optimizer User Guide*.
    flag:
        account-ids: |-
            The ID of the Amazon Web Services account for which to return volume recommendations.

            If your account is the management account of an organization, use this parameter to specify the member account for which you want to return volume recommendations.

            Only one account ID can be specified per request.
        filters: An array of objects to specify a filter that returns a more specific list of volume recommendations.
        max-results: |-
            The maximum number of volume recommendations to return with a single request.

            To retrieve the remaining results, make another request with the returned `nextToken` value.
        next-token: The token to advance to the next page of volume recommendations.
        volume-arns: The Amazon Resource Name (ARN) of the volumes for which to return recommendations.
