name: move
description: '*(BETA)*  Move a disk between zones.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --destination-zone=!: The zone to move the disk to.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --zone=: Zone of the disk to operate on.
documentation:
    command: |
        *(BETA)*  *gcloud beta compute disks move* facilitates moving a Compute Engine disk volume from one zone to another. You cannot move a disk if it is attached to a running or stopped instance; use the gcloud compute instances move command instead.

        The `gcloud compute disks move` command does not support regional persistent disks. See https://cloud.google.com/compute/docs/disks/regional-persistent-disk for more details.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        destination-zone: The zone to move the disk to.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        zone: |-
            Zone of the disk to operate on. If not specified and the ``compute/zone'' property isn't set, you
            might be prompted to select a zone (interactive mode only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
