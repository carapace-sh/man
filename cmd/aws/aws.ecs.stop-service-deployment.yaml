name: stop-service-deployment
description: Stops an ongoing service deployment.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --service-deployment-arn=!: The ARN of the service deployment that you want to stop.
    --stop-type=: How you want Amazon ECS to stop the service.
completion:
    flag:
        stop-type:
            - ABORT
            - ROLLBACK
documentation:
    command: "Stops an ongoing service deployment.\n\nThe following stop types are avaiable:\n\n- ROLLBACK - This option rolls back the service deployment to the previous service revision.\n  \n  You can use this option even if you didn't configure the service deployment for the rollback option.\n\nFor more information, see [Stopping Amazon ECS service deployments](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/stop-service-deployment.html) in the *Amazon Elastic Container Service Developer Guide*."
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        service-deployment-arn: The ARN of the service deployment that you want to stop.
        stop-type: |-
            How you want Amazon ECS to stop the service.

            The valid values are `ROLLBACK`.
