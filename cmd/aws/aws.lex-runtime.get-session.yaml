name: get-session
description: Returns session information for a specified bot, alias, and user ID.
flags:
    --bot-alias=!: The alias in use for the bot that contains the session data.
    --bot-name=!: The name of the bot that contains the session data.
    --checkpoint-label-filter=: A string used to filter the intents returned in the `recentIntentSummaryView` structure.
    --user-id=!: The ID of the client application user.
documentation:
    command: Returns session information for a specified bot, alias, and user ID.
    flag:
        bot-alias: The alias in use for the bot that contains the session data.
        bot-name: The name of the bot that contains the session data.
        checkpoint-label-filter: |-
            A string used to filter the intents returned in the `recentIntentSummaryView` structure.

            When you specify a filter, only intents with their `checkpointLabel` field set to that string are returned.
        user-id: The ID of the client application user. Amazon Lex uses this to identify a user's conversation with your bot.
