name: create-profile
description: Creates a customer profile.
flags:
    --business-name=!: Specifies the name for the business associated with this profile.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Reserved for future use.
    --email=: Specifies the email address associated with this customer profile.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --logging=!: Specifies whether or not logging is enabled for this profile.
    --name=!: Specifies the name of the profile.
    --phone=!: Specifies the phone number associated with the profile.
    --tags=:
        description: Specifies the key-value pairs assigned to ARNs that you can use to group and search for resources by type.
        nargs: -1
completion:
    flag:
        logging:
            - ENABLED
            - DISABLED
documentation:
    command: Creates a customer profile. You can have up to five customer profiles, each representing a distinct private network. A profile is the mechanism used to create the concept of a private network.
    flag:
        business-name: Specifies the name for the business associated with this profile.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Reserved for future use.
        email: Specifies the email address associated with this customer profile.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        logging: Specifies whether or not logging is enabled for this profile.
        name: Specifies the name of the profile.
        phone: Specifies the phone number associated with the profile.
        tags: Specifies the key-value pairs assigned to ARNs that you can use to group and search for resources by type. You can attach this metadata to resources (capabilities, partnerships, and so on) for any purpose.
