name: deprecate-flow-template
description: Deprecates the specified workflow.
flags:
    --id=!: The ID of the workflow to be deleted.
documentation:
    command: Deprecates the specified workflow. This action marks the workflow for deletion. Deprecated flows can't be deployed, but existing deployments will continue to run.
    flag:
        id: |-
            The ID of the workflow to be deleted.

            The ID should be in the following format.

            `urn:tdm:REGION/ACCOUNT ID/default:workflow:WORKFLOWNAME`
