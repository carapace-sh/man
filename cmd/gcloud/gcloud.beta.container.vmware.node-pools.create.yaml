documentation:
    command: '*(BETA)*  Create a node pool in an Anthos cluster on VMware.'
    flag:
        annotations: Annotations on the node pool.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        boot-disk-size: Size of VMware disk to be used during creation in GB.
        cluster: |-
            cluster of the node_pool.
            +
            To set the `cluster` attribute:
            * provide the argument `node_pool` on the command line with a fully specified name;
            * provide the argument `--cluster` on the command line.
        cpus: Number of CPUs for each node in the node pool.
        display-name: Display name for the resource.
        enable-load-balancer: If set, enable the use of load balancer on the node pool instances.
        image: OS image name in vCenter.
        image-type: OS image type to use on node pool instances.
        location: |-
            Google Cloud location for the node_pool.
            +
            To set the `location` attribute:
            * provide the argument `node_pool` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_vmware/location`.
        max-replicas: Maximum number of replicas in the node pool.
        memory: Size of memory for each node in the node pool in MB.
        min-replicas: Minimum number of replicas in the node pool.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-validate-only: If set, only validate the request, but do not actually perform the operation.
        node-labels: Kubernetes labels (key/value pairs) to be applied to each node.
        node-taints: |-
            Applies the given kubernetes taints on all nodes in the new node pool, which can
            be used with tolerations for pod scheduling.
            +
            Taint effect must be one of the following: `NoSchedule`, `PreferNoSchedule`, or `NoExecute`.
            +
            Examples:
            +
              $ {command} node-pool-1 --cluster=example-cluster --node-taints=key1=val1:NoSchedule,key2=val2:PreferNoSchedule
        replicas: Number of replicas to use on node pool instances.
        validate-only: If set, only validate the request, but do not actually perform the operation.
