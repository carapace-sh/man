name: put-profile-object-type
description: Defines a ProfileObjectType.
flags:
    --allow-profile-creation: Indicates whether a profile should be created when data is received if one doesn’t exist for an object of this type.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=!: Description of the profile object type.
    --domain-name=!: The unique name of the domain.
    --encryption-key=: The customer-provided key to encrypt the profile object that will be created in this profile object type.
    --expiration-days=: The number of days until the data in the object expires.
    --fields=: A map of the name and ObjectType field.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --keys=: A list of unique keys that can be used to map data to the profile.
    --max-profile-object-count=: The amount of profile object max count assigned to the object type
    --no-allow-profile-creation: Indicates whether a profile should be created when data is received if one doesn’t exist for an object of this type.
    --object-type-name=!: The name of the profile object type.
    --source-last-updated-timestamp-format=: The format of your `sourceLastUpdatedTimestamp` that was previously set up.
    --tags=: The tags used to organize, track, or control access for this resource.
    --template-id=: A unique identifier for the object template.
documentation:
    command: |-
        Defines a ProfileObjectType.

        To add or remove tags on an existing ObjectType, see [TagResource](https://docs.aws.amazon.com/customerprofiles/latest/APIReference/API_TagResource.html)/[UntagResource](https://docs.aws.amazon.com/customerprofiles/latest/APIReference/API_UntagResource.html).
    flag:
        allow-profile-creation: Indicates whether a profile should be created when data is received if one doesn’t exist for an object of this type. The default is `FALSE`. If the AllowProfileCreation flag is set to `FALSE`, then the service tries to fetch a standard profile and associate this object with the profile. If it is set to `TRUE`, and if no match is found, then the service creates a new standard profile.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: Description of the profile object type.
        domain-name: The unique name of the domain.
        encryption-key: The customer-provided key to encrypt the profile object that will be created in this profile object type.
        expiration-days: The number of days until the data in the object expires.
        fields: A map of the name and ObjectType field.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        keys: A list of unique keys that can be used to map data to the profile.
        max-profile-object-count: The amount of profile object max count assigned to the object type
        object-type-name: The name of the profile object type.
        source-last-updated-timestamp-format: The format of your `sourceLastUpdatedTimestamp` that was previously set up.
        tags: The tags used to organize, track, or control access for this resource.
        template-id: 'A unique identifier for the object template. For some attributes in the request, the service will use the default value from the object template when TemplateId is present. If these attributes are present in the request, the service may return a `BadRequestException`. These attributes include: AllowProfileCreation, SourceLastUpdatedTimestampFormat, Fields, and Keys. For example, if AllowProfileCreation is set to true when TemplateId is set, the service may return a `BadRequestException`.'
