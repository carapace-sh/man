name: create-resource-snapshot
description: This action allows you to create an immutable snapshot of a specific resource, such as an opportunity, within the context of an engagement.
flags:
    --catalog=!: Specifies the catalog where the snapshot is created.
    --client-token=!: Specifies a unique, client-generated UUID to ensure that the request is handled exactly once.
    --engagement-identifier=!: The unique identifier of the engagement associated with this snapshot.
    --resource-identifier=!: The unique identifier of the specific resource to be snapshotted.
    --resource-snapshot-template-identifier=!: The name of the template that defines the schema for the snapshot.
    --resource-type=!: Specifies the type of resource for which the snapshot is being created.
completion:
    flag:
        resource-type:
            - Opportunity
documentation:
    command: This action allows you to create an immutable snapshot of a specific resource, such as an opportunity, within the context of an engagement. The snapshot captures a subset of the resource's data based on the schema defined by the provided template.
    flag:
        catalog: Specifies the catalog where the snapshot is created. Valid values are `AWS` and `Sandbox`.
        client-token: Specifies a unique, client-generated UUID to ensure that the request is handled exactly once. This token helps prevent duplicate snapshot creations.
        engagement-identifier: The unique identifier of the engagement associated with this snapshot. This field links the snapshot to a specific engagement context.
        resource-identifier: 'The unique identifier of the specific resource to be snapshotted. The format and constraints of this identifier depend on the `ResourceType` specified. For example: For `Opportunity` type, it will be an opportunity ID.'
        resource-snapshot-template-identifier: The name of the template that defines the schema for the snapshot. This template determines which subset of the resource data will be included in the snapshot. Must correspond to an existing and valid template for the specified `ResourceType`.
        resource-type: 'Specifies the type of resource for which the snapshot is being created. This field determines the structure and content of the snapshot. Must be one of the supported resource types, such as: `Opportunity`.'
