name: deactivate-type
description: Deactivates a public third-party extension, such as a resource or module, or a CloudFormation Hook when you no longer use it.
flags:
    --arn=: The Amazon Resource Name (ARN) for the extension in this account and Region.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --type-name=: The type name of the extension in this account and Region.
    --type=: The extension type.
completion:
    flag:
        type:
            - RESOURCE
            - MODULE
            - HOOK
documentation:
    command: |-
        Deactivates a public third-party extension, such as a resource or module, or a CloudFormation Hook when you no longer use it.

        Deactivating an extension deletes the configuration details that are associated with it. To temporarily disable a CloudFormation Hook instead, you can use [SetTypeConfiguration](https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_SetTypeConfiguration.html).

        Once deactivated, an extension can't be used in any CloudFormation operation. This includes stack update operations where the stack template includes the extension, even if no updates are being made to the extension. In addition, deactivated extensions aren't automatically updated if a new version of the extension is released.

        To see which extensions are currently activated, use [ListTypes](https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_ListTypes.html).
    flag:
        arn: |-
            The Amazon Resource Name (ARN) for the extension in this account and Region.

            Conditional: You must specify either `Arn`, or `TypeName` and `Type`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        type: |-
            The extension type.

            Conditional: You must specify either `Arn`, or `TypeName` and `Type`.
        type-name: |-
            The type name of the extension in this account and Region. If you specified a type name alias when enabling the extension, use the type name alias.

            Conditional: You must specify either `Arn`, or `TypeName` and `Type`.
