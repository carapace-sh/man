name: create
description: '*(ALPHA)*  Create an OAuth client.'
flags:
    --allowed-grant-types=!: A list of OAuth grant types that are allowed for the OAuth client.
    --allowed-redirect-uris=!: A list of redirect uris that is allowed for redirecting when the authorization is completed.
    --allowed-scopes=!: A list of scopes that the OAuth client is allowed to request during OAuth flows.
    --client-type=!: The type of OAuth client.
    --description=: A description of the OAuth client.
    --disabled: Disables the OAuth client.
    --display-name=: A display name for the OAuth client.
    --location=: The location name.
    --no-disabled&: Disables the OAuth client.
completion:
    flag:
        client-type:
            - confidential-client
            - public-client
documentation:
    command: |
        *(ALPHA)*  Create a new OAuth client.
    flag:
        allowed-grant-types: |-
            A list of OAuth grant types that are allowed for the OAuth client.
            +
            The following grant types are currently supported:
            +
            * `authorization-code-grant`
            +
            * `refresh-token-grant`
        allowed-redirect-uris: A list of redirect uris that is allowed for redirecting when the authorization is completed.
        allowed-scopes: |-
            A list of scopes that the OAuth client is allowed to request during OAuth flows.
            +
            The following scopes are currently supported:
            +
            * `https://www.googleapis.com/auth/cloud-platform`: View, edit, configure, and delete your
                                                                Google Cloud data, and view the email
                                                                address for your Google Account.
            +
            * `openid`: Associate you with your personal info on Google Cloud.
            +
            * `email`: The OAuth client can read a federated identity's email address.
            +
            * `groups`: The OAuth client can read a federated identity's groups.
        client-type: 'The type of OAuth client. _CLIENT_TYPE_ must be one of: *confidential-client*, *public-client*.'
        description: A description of the OAuth client. Cannot exceed 256 characters.
        disabled: Disables the OAuth client. You cannot use a disabled OAuth client for login. Include `--no-disabled` to enable a disabled OAuth client.
        display-name: A display name for the OAuth client. Cannot exceed 32 characters.
        location: |-
            The location name.
            +
            To set the `location` attribute:
            * provide the argument `oauth_client` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-disabled: Disables the OAuth client. You cannot use a disabled OAuth client for login. Include `--no-disabled` to enable a disabled OAuth client.
