name: update-host
description: Updates a specified host with the provided configurations.
flags:
    --host-arn=!: The Amazon Resource Name (ARN) of the host to be updated.
    --provider-endpoint=: The URL or endpoint of the host to be updated.
    --vpc-configuration=: The VPC configuration of the host to be updated.
documentation:
    command: Updates a specified host with the provided configurations.
    flag:
        host-arn: The Amazon Resource Name (ARN) of the host to be updated.
        provider-endpoint: The URL or endpoint of the host to be updated.
        vpc-configuration: The VPC configuration of the host to be updated. A VPC must be configured and the infrastructure to be represented by the host must already be connected to the VPC.
