name: attach-disk
description: Attaches a block storage disk to a running or stopped Lightsail instance and exposes it to the instance with the specified disk name.
flags:
    --auto-mounting: A Boolean value used to determine the automatic mounting of a storage volume to a virtual computer.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --disk-name=!: The unique Lightsail disk name (`my-disk`).
    --disk-path=!: The disk path to expose to the instance (`/dev/xvdf`).
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-name=!: The name of the Lightsail instance where you want to utilize the storage disk.
    --no-auto-mounting: A Boolean value used to determine the automatic mounting of a storage volume to a virtual computer.
documentation:
    command: |-
        Attaches a block storage disk to a running or stopped Lightsail instance and exposes it to the instance with the specified disk name.

        The `attach disk` operation supports tag-based access control via resource tags applied to the resource identified by `disk name`. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-controlling-access-using-tags).
    flag:
        auto-mounting: |-
            A Boolean value used to determine the automatic mounting of a storage volume to a virtual computer. The default value is `False`.

            This value only applies to Lightsail for Research resources.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        disk-name: The unique Lightsail disk name (`my-disk`).
        disk-path: The disk path to expose to the instance (`/dev/xvdf`).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-name: The name of the Lightsail instance where you want to utilize the storage disk.
