name: retry-build
description: Restarts a build.
flags:
    --id=: Specifies the identifier of the build to restart.
    --idempotency-token=: A unique, case sensitive identifier you provide to ensure the idempotency of the `RetryBuild` request.
documentation:
    command: Restarts a build.
    flag:
        id: Specifies the identifier of the build to restart.
        idempotency-token: A unique, case sensitive identifier you provide to ensure the idempotency of the `RetryBuild` request. The token is included in the `RetryBuild` request and is valid for five minutes. If you repeat the `RetryBuild` request with the same token, but change a parameter, CodeBuild returns a parameter mismatch error.
