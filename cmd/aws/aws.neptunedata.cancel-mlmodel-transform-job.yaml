name: cancel-mlmodel-transform-job
description: Cancels a specified model transform job.
flags:
    --clean: If this flag is set to `TRUE`, all Neptune ML S3 artifacts should be deleted when the job is stopped.
    --id=!: The unique ID of the model transform job to be canceled.
    --neptune-iam-role-arn=: The ARN of an IAM role that provides Neptune access to SageMaker and Amazon S3 resources.
    --no-clean&: If this flag is set to `TRUE`, all Neptune ML S3 artifacts should be deleted when the job is stopped.
documentation:
    command: |-
        Cancels a specified model transform job. See [Use a trained model to generate new model artifacts](https://docs.aws.amazon.com/neptune/latest/userguide/machine-learning-model-transform.html).

        When invoking this operation in a Neptune cluster that has IAM authentication enabled, the IAM user or role making the request must have a policy attached that allows the [neptune-db:CancelMLModelTransformJob](https://docs.aws.amazon.com/neptune/latest/userguide/iam-dp-actions.html#cancelmlmodeltransformjob) IAM action in that cluster.
    flag:
        clean: If this flag is set to `TRUE`, all Neptune ML S3 artifacts should be deleted when the job is stopped. The default is `FALSE`.
        id: The unique ID of the model transform job to be canceled.
        neptune-iam-role-arn: The ARN of an IAM role that provides Neptune access to SageMaker and Amazon S3 resources. This must be listed in your DB cluster parameter group or an error will occur.
