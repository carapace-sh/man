name: list-compliance-items
description: For a specified resource ID, this API operation returns a list of compliance statuses for different resource types.
flags:
    --filters=: One or more compliance filters.
    --max-results=: The maximum number of items to return for this call.
    --next-token=: A token to start the list.
    --resource-ids=: The ID for the resources from which to get compliance information.
    --resource-types=: The type of resource from which to get compliance information.
documentation:
    command: For a specified resource ID, this API operation returns a list of compliance statuses for different resource types. Currently, you can only specify one resource ID per call. List results depend on the criteria specified in the filter.
    flag:
        filters: One or more compliance filters. Use a filter to return a more specific list of results.
        max-results: The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: A token to start the list. Use this token to get the next set of results.
        resource-ids: The ID for the resources from which to get compliance information. Currently, you can only specify one resource ID.
        resource-types: The type of resource from which to get compliance information. Currently, the only supported resource type is `ManagedInstance`.
