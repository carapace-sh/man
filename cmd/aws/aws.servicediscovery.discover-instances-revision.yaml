name: discover-instances-revision
description: Discovers the increasing revision associated with an instance.
flags:
    --namespace-name=!: The `HttpName` name of the namespace.
    --owner-account=: The ID of the Amazon Web Services account that owns the namespace associated with the instance, as specified in the namespace `ResourceOwner` field.
    --service-name=!: The name of the service that you specified when you registered the instance.
documentation:
    command: Discovers the increasing revision associated with an instance.
    flag:
        namespace-name: The `HttpName` name of the namespace. The `HttpName` is found in the `HttpProperties` member of the `Properties` member of the namespace.
        owner-account: The ID of the Amazon Web Services account that owns the namespace associated with the instance, as specified in the namespace `ResourceOwner` field. For instances associated with namespaces that are shared with your account, you must specify an `OwnerAccount`. For more information about shared namespaces, see [Cross-account Cloud Map namespace sharing](https://docs.aws.amazon.com/cloud-map/latest/dg/sharing-namespaces.html) in the *Cloud Map Developer Guide*.
        service-name: The name of the service that you specified when you registered the instance.
