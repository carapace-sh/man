name: describe-flow
description: Displays the details of a flow.
flags:
    --flow-arn=!: The ARN of the flow that you want to describe.
documentation:
    command: Displays the details of a flow. The response includes the flow Amazon Resource Name (ARN), name, and Availability Zone, as well as details about the source, outputs, and entitlements.
    flag:
        flow-arn: The ARN of the flow that you want to describe.
