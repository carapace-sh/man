name: untag-resource
description: Deletes specified tags from a resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource to delete tags from.
    --tag-keys=!: The keys of the tags to be removed.
documentation:
    command: Deletes specified tags from a resource.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource to delete tags from. Currently, the supported resource is an Amazon ECR Public repository.
        tag-keys: The keys of the tags to be removed.
