name: save
description: '*(BETA)*  Save a snapshot of the environment.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Region where Composer environment runs or in which to create the environment.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --snapshot-location=: The Cloud Storage location where to save the snapshot.
documentation:
    command: '*(BETA)*  Save a snapshot of the environment.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            Region where Composer environment runs or in which to create the environment.
            +
            To set the `location` attribute:
            * provide the argument `environment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `composer/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        snapshot-location: The Cloud Storage location where to save the snapshot. It must start with the prefix gs://. Default value is /snapshots directory in the Cloud Storage bucket of the environment.
