name: list-domain-configurations
description: Gets a list of domain configurations for the user.
flags:
    --marker=: The marker for the next set of results.
    --page-size=: The result page size.
    --service-type=: The type of service delivered by the endpoint.
completion:
    flag:
        service-type:
            - DATA
            - CREDENTIAL_PROVIDER
            - JOBS
documentation:
    command: |-
        Gets a list of domain configurations for the user. This list is sorted alphabetically by domain configuration name.

        Requires permission to access the [ListDomainConfigurations](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        marker: The marker for the next set of results.
        page-size: The result page size.
        service-type: The type of service delivered by the endpoint.
