name: associate-permission
description: Adds or updates a permission policy for a Amazon Q Business application, allowing cross-account access for an ISV.
flags:
    --actions=!:
        description: The list of Amazon Q Business actions that the ISV is allowed to perform.
        nargs: -1
    --application-id=!: The unique identifier of the Amazon Q Business application.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --conditions=:
        description: The conditions that restrict when the permission is effective.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --principal=!: The Amazon Resource Name of the IAM role for the ISV that is being granted permission.
    --statement-id=!: A unique identifier for the policy statement.
documentation:
    command: Adds or updates a permission policy for a Amazon Q Business application, allowing cross-account access for an ISV. This operation creates a new policy statement for the specified Amazon Q Business application. The policy statement defines the IAM actions that the ISV is allowed to perform on the Amazon Q Business application's resources.
    flag:
        actions: The list of Amazon Q Business actions that the ISV is allowed to perform.
        application-id: The unique identifier of the Amazon Q Business application.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        conditions: The conditions that restrict when the permission is effective. These conditions can be used to limit the permission based on specific attributes of the request.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        principal: The Amazon Resource Name of the IAM role for the ISV that is being granted permission.
        statement-id: A unique identifier for the policy statement.
