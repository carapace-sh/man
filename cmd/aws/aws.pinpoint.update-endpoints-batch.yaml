name: update-endpoints-batch
description: Creates a new batch of endpoints for an application or updates the settings and attributes of a batch of existing endpoints for an application.
flags:
    --application-id=!: The unique identifier for the application.
    --endpoint-batch-request=!: ""
documentation:
    command: Creates a new batch of endpoints for an application or updates the settings and attributes of a batch of existing endpoints for an application. You can also use this operation to define custom attributes for a batch of endpoints. If an update includes one or more values for a custom attribute, Amazon Pinpoint replaces (overwrites) any existing values with the new values.
    flag:
        application-id: The unique identifier for the application. This identifier is displayed as the **Project ID** on the Amazon Pinpoint console.
        endpoint-batch-request: ""
