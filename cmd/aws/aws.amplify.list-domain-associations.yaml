name: list-domain-associations
description: Returns the domain associations for an Amplify app.
flags:
    --app-id=!: The unique ID for an Amplify app.
    --max-results=: The maximum number of records to list in a single response.
    --next-token=: A pagination token.
documentation:
    command: Returns the domain associations for an Amplify app.
    flag:
        app-id: The unique ID for an Amplify app.
        max-results: The maximum number of records to list in a single response.
        next-token: A pagination token. Set to null to start listing apps from the start. If non-null, a pagination token is returned in a result. Pass its value in here to list more projects.
