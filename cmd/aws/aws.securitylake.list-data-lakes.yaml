name: list-data-lakes
description: Retrieves the Amazon Security Lake configuration object for the specified Amazon Web Services Regions.
flags:
    --regions=: The list of Regions where Security Lake is enabled.
documentation:
    command: Retrieves the Amazon Security Lake configuration object for the specified Amazon Web Services Regions. You can use this operation to determine whether Security Lake is enabled for a Region.
    flag:
        regions: The list of Regions where Security Lake is enabled.
