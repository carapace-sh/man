name: stop-query
description: Stops a CloudWatch Logs Insights query that is in progress.
flags:
    --query-id=!: The ID number of the query to stop.
documentation:
    command: Stops a CloudWatch Logs Insights query that is in progress. If the query has already ended, the operation returns an error indicating that the specified query is not running.
    flag:
        query-id: The ID number of the query to stop. To find this ID number, use `DescribeQueries`.
