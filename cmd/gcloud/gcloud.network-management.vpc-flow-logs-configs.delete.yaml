name: delete
description: Deletes the specified VPC Flow Logs configuration.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location id of the vpcFlowLogsConfig resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --organization=: The organization id of the vpcFlowLogsConfig resource.
documentation:
    command: Deletes the specified VPC Flow Logs configuration.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location id of the vpcFlowLogsConfig resource.
            +
            To set the `location` attribute:
            * provide the argument `vpc_flow_logs_config` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        organization: |-
            The organization id of the vpcFlowLogsConfig resource.
            +
            To set the `organization` attribute:
            * provide the argument `vpc_flow_logs_config` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line. Must be specified for resource of type [networkmanagement.organizations.locations.vpcFlowLogsConfigs].
