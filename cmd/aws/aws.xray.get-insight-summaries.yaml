name: get-insight-summaries
description: Retrieves the summaries of all insights in the specified group matching the provided filter values.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --end-time=!: The end of the time frame in which the insights ended.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --group-arn=: The Amazon Resource Name (ARN) of the group.
    --group-name=: The name of the group.
    --max-results=: The maximum number of results to display.
    --next-token=: Pagination token.
    --start-time=!: The beginning of the time frame in which the insights started.
    --states=: The list of insight states.
documentation:
    command: Retrieves the summaries of all insights in the specified group matching the provided filter values.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        end-time: The end of the time frame in which the insights ended. The end time can't be more than 30 days old.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        group-arn: The Amazon Resource Name (ARN) of the group. Required if the GroupName isn't provided.
        group-name: The name of the group. Required if the GroupARN isn't provided.
        max-results: The maximum number of results to display.
        next-token: Pagination token.
        start-time: The beginning of the time frame in which the insights started. The start time can't be more than 30 days old.
        states: The list of insight states.
