name: stop-resource-snapshot-job
description: Stops a resource snapshot job.
flags:
    --catalog=!: Specifies the catalog related to the request.
    --resource-snapshot-job-identifier=!: The identifier of the job to stop.
documentation:
    command: Stops a resource snapshot job. The job must be started prior to being stopped.
    flag:
        catalog: |-
            Specifies the catalog related to the request. Valid values are:

            - AWS: Stops the request from the production AWS environment.
            - Sandbox: Stops the request from a sandbox environment used for testing or development purposes.
        resource-snapshot-job-identifier: The identifier of the job to stop.
