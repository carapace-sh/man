name: delete-data-protection-policy
description: Deletes the data protection policy from the specified log group.
flags:
    --log-group-identifier=!: The name or ARN of the log group that you want to delete the data protection policy for.
documentation:
    command: |-
        Deletes the data protection policy from the specified log group.

        For more information about data protection policies, see [PutDataProtectionPolicy](https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_PutDataProtectionPolicy.html).
    flag:
        log-group-identifier: The name or ARN of the log group that you want to delete the data protection policy for.
