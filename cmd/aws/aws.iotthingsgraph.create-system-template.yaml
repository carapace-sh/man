name: create-system-template
description: Creates a system.
flags:
    --compatible-namespace-version=: The namespace version in which the system is to be created.
    --definition=!: The `DefinitionDocument` used to create the system.
documentation:
    command: Creates a system. The system is validated against the entities in the latest version of the user's namespace unless another namespace version is specified in the request.
    flag:
        compatible-namespace-version: |-
            The namespace version in which the system is to be created.

            If no value is specified, the latest version is used by default.
        definition: The `DefinitionDocument` used to create the system.
