name: list-indices
description: Lists the Amazon Kendra indexes that you created.
flags:
    --max-results=: The maximum number of indices to return.
    --next-token=: If the previous response was incomplete (because there is more data to retrieve), Amazon Kendra returns a pagination token in the response.
documentation:
    command: Lists the Amazon Kendra indexes that you created.
    flag:
        max-results: The maximum number of indices to return.
        next-token: If the previous response was incomplete (because there is more data to retrieve), Amazon Kendra returns a pagination token in the response. You can use this pagination token to retrieve the next set of indexes.
