name: delete-instance-access-control-attribute-configuration
description: Disables the attributes-based access control (ABAC) feature for the specified IAM Identity Center instance and deletes all of the attribute mappings that have been configured.
flags:
    --instance-arn=!: The ARN of the IAM Identity Center instance under which the operation will be executed.
documentation:
    command: Disables the attributes-based access control (ABAC) feature for the specified IAM Identity Center instance and deletes all of the attribute mappings that have been configured. Once deleted, any attributes that are received from an identity source and any custom attributes you have previously configured will not be passed. For more information about ABAC, see [Attribute-Based Access Control](/singlesignon/latest/userguide/abac.html) in the *IAM Identity Center User Guide*.
    flag:
        instance-arn: The ARN of the IAM Identity Center instance under which the operation will be executed.
