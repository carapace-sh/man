name: update-proxy
description: Updates the properties of the specified proxy.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --listener-properties-to-add=:
        description: Listener properties for HTTP and HTTPS traffic to add.
        nargs: -1
    --listener-properties-to-remove=:
        description: Listener properties for HTTP and HTTPS traffic to remove.
        nargs: -1
    --nat-gateway-id=!: The NAT Gateway the proxy is attached to.
    --proxy-arn=: The Amazon Resource Name (ARN) of a proxy.
    --proxy-name=: The descriptive name of the proxy.
    --tls-intercept-properties=: TLS decryption on traffic to filter on attributes in the HTTP header.
    --update-token=!: A token used for optimistic locking.
documentation:
    command: Updates the properties of the specified proxy.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        listener-properties-to-add: Listener properties for HTTP and HTTPS traffic to add.
        listener-properties-to-remove: Listener properties for HTTP and HTTPS traffic to remove.
        nat-gateway-id: The NAT Gateway the proxy is attached to.
        proxy-arn: |-
            The Amazon Resource Name (ARN) of a proxy.

            You must specify the ARN or the name, and you can specify both.
        proxy-name: |-
            The descriptive name of the proxy. You can't change the name of a proxy after you create it.

            You must specify the ARN or the name, and you can specify both.
        tls-intercept-properties: TLS decryption on traffic to filter on attributes in the HTTP header.
        update-token: |-
            A token used for optimistic locking. Network Firewall returns a token to your requests that access the proxy. The token marks the state of the proxy resource at the time of the request.

            To make changes to the proxy, you provide the token in your request. Network Firewall uses the token to ensure that the proxy hasn't changed since you last retrieved it. If it has changed, the operation fails with an `InvalidTokenException`. If this happens, retrieve the proxy again to get a current copy of it with a current token. Reapply your changes as needed, then try the operation again using the new token.
