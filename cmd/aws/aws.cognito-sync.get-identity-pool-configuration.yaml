name: get-identity-pool-configuration
description: Gets the configuration settings of an identity pool.
flags:
    --identity-pool-id=!: A name-spaced GUID (for example, us-east-1:23EC4050-6AEA-7089-A2DD-08002EXAMPLE) created by Amazon Cognito.
documentation:
    command: |-
        Gets the configuration settings of an identity pool.

        This API can only be called with developer credentials. You cannot call this API with the temporary user credentials provided by Cognito Identity.
    flag:
        identity-pool-id: A name-spaced GUID (for example, us-east-1:23EC4050-6AEA-7089-A2DD-08002EXAMPLE) created by Amazon Cognito. This is the ID of the pool for which to return a configuration.
