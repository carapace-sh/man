name: update
description: '*(BETA)*  Update a Bigtable logical view.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --deletion-protection=: Whether the view is protected from deletion.
    --instance=: Bigtable instance for the logical view.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --query=: The query of the view.
documentation:
    command: '*(BETA)*  Update a Bigtable logical view.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        deletion-protection: Whether the view is protected from deletion.
        instance: |-
            Bigtable instance for the logical view.
            +
            To set the `instance` attribute:
            * provide the argument `logical_view` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        query: The query of the view.
