name: describe-configuration-aggregator-sources-status
description: Returns status information for sources within an aggregator.
flags:
    --configuration-aggregator-name=!: The name of the configuration aggregator.
    --limit=: The maximum number of AggregatorSourceStatus returned on each page.
    --next-token=: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
    --update-status=: Filters the status type.
documentation:
    command: Returns status information for sources within an aggregator. The status includes information about the last time Config verified authorization between the source account and an aggregator account. In case of a failure, the status contains the related error code or message.
    flag:
        configuration-aggregator-name: The name of the configuration aggregator.
        limit: The maximum number of AggregatorSourceStatus returned on each page. The default is maximum. If you specify 0, Config uses the default.
        next-token: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
        update-status: |-
            Filters the status type.

            - Valid value FAILED indicates errors while moving data.
            - Valid value SUCCEEDED indicates the data was successfully moved.
            - Valid value OUTDATED indicates the data is not the most recent.
