name: update-location-fsx-ontap
description: Modifies the following configuration parameters of the Amazon FSx for NetApp ONTAP transfer location that you're using with DataSync.
flags:
    --location-arn=!: Specifies the Amazon Resource Name (ARN) of the FSx for ONTAP transfer location that you're updating.
    --protocol=: Specifies the data transfer protocol that DataSync uses to access your Amazon FSx file system.
    --subdirectory=: Specifies a path to the file share in the storage virtual machine (SVM) where you want to transfer data to or from.
documentation:
    command: |-
        Modifies the following configuration parameters of the Amazon FSx for NetApp ONTAP transfer location that you're using with DataSync.

        For more information, see [Configuring DataSync transfers with FSx for ONTAP](https://docs.aws.amazon.com/datasync/latest/userguide/create-ontap-location.html).
    flag:
        location-arn: Specifies the Amazon Resource Name (ARN) of the FSx for ONTAP transfer location that you're updating.
        protocol: Specifies the data transfer protocol that DataSync uses to access your Amazon FSx file system.
        subdirectory: |-
            Specifies a path to the file share in the storage virtual machine (SVM) where you want to transfer data to or from.

            You can specify a junction path (also known as a mount point), qtree path (for NFS file shares), or share name (for SMB file shares). For example, your mount path might be `/vol1`, `/vol1/tree1`, or `/share1`.

            Don't specify a junction path in the SVM's root volume. For more information, see [Managing FSx for ONTAP storage virtual machines](https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/managing-svms.html) in the *Amazon FSx for NetApp ONTAP User Guide*.
