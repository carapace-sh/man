name: create
description: '*(BETA)*  Create a schedule.'
flags:
    --accelerator-count=: The number of accelerators used by the runtime.
    --accelerator-type=: The type of hardware accelerator used by the runtime.
    --cron-schedule=!: Cron schedule (https://en.wikipedia.org/wiki/Cron) to launch scheduled runs.
    --disk-size-gb=: The disk size of the runtime in GB.
    --disk-type=: The type of the persistent disk.
    --display-name=!: The display name of the schedule.
    --enable-internet-access: Enable public internet access for the runtime.
    --enable-queueing: Enables new scheduled runs to be queued when max_concurrent_runs limit is reached.
    --end-time=: Timestamp after which no new runs can be scheduled.
    --execution-display-name=!: The display name of the execution.
    --execution-timeout=: The max running time of the execution job, as a duration.
    --gcs-notebook-uri=!: The Cloud Storage uri pointing to the notebook.
    --gcs-output-uri=!: The Cloud Storage location to upload notebook execution results to.
    --generation=: The version of the Cloud Storage object to read.
    --kernel-name=: The kernel name to use for the execution.
    --kms-key=!: ID of the key or fully qualified identifier for the key.
    --kms-keyring=: KMS keyring id of the key.
    --kms-location=: Cloud location for the key.
    --kms-project=: Cloud project id for the key.
    --machine-type=: The Compute Engine machine type selected for the runtime.
    --max-concurrent-runs=: Maximum number of runs that can be started concurrently for this Schedule.
    --max-runs=: The max runs for the schedule.
    --network=!: ID of the network or fully qualified identifier for the network.
    --no-enable-internet-access&: Enable public internet access for the runtime.
    --no-enable-queueing&: Enables new scheduled runs to be queued when max_concurrent_runs limit is reached.
    --region=!: ID of the region or fully qualified identifier for the region.
    --service-account=!: The service account to run the execution as
    --start-time=: The timestamp after which the first run can be scheduled.
    --subnetwork-region=: Google Cloud region of this subnetwork https://cloud.google.com/compute/docs/regions-zones/#locations.
    --subnetwork=!: ID of the subnetwork or fully qualified identifier for the subnetwork.
completion:
    flag:
        accelerator-type:
            - NVIDIA_TESLA_V100
            - NVIDIA_TESLA_T4
            - NVIDIA_TESLA_A100
            - NVIDIA_A100_80GB
            - NVIDIA_L4
        disk-type:
            - PD_STANDARD
            - PD_SSD
            - PD_BALANCED
            - PD_EXTREME
documentation:
    command: |
        *(BETA)*  Create a schedule to run a Workbench notebook execution job.
    flag:
        accelerator-count: The number of accelerators used by the runtime.
        accelerator-type: 'The type of hardware accelerator used by the runtime. If specified, --accelerator-count must also be specified. _ACCELERATOR_TYPE_ must be one of: *NVIDIA_TESLA_V100*, *NVIDIA_TESLA_T4*, *NVIDIA_TESLA_A100*, *NVIDIA_A100_80GB*, *NVIDIA_L4*.'
        cron-schedule: 'Cron schedule (https://en.wikipedia.org/wiki/Cron) to launch scheduled runs. To explicitly set a timezone to the cron tab, apply a prefix in the cron tab: "CRON_TZ=${IANA_TIME_ZONE}" or "TZ=${IANA_TIME_ZONE}". The ${IANA_TIME_ZONE} may only be a valid string from IANA time zone database. For example, "CRON_TZ=America/New_York 1 * * * *", or "TZ=America/New_York 1 * * * *".'
        disk-size-gb: The disk size of the runtime in GB. If specified, the --disk-type must also be specified. The minimum size is 10GB and the maximum is 65536GB.
        disk-type: 'The type of the persistent disk. _DISK_TYPE_ must be one of: *PD_STANDARD*, *PD_SSD*, *PD_BALANCED*, *PD_EXTREME*.'
        display-name: The display name of the schedule.
        enable-internet-access: Enable public internet access for the runtime. Enabled by default, use *--no-enable-internet-access* to disable.
        enable-queueing: Enables new scheduled runs to be queued when max_concurrent_runs limit is reached. If set to true, new runs will be queued instead of skipped.
        end-time: Timestamp after which no new runs can be scheduled. If specified, the schedule will be completed when either end_time is reached or when scheduled_run_count >= max_run_count. If neither end time nor max_run_count is specified, new runs will keep getting scheduled until this Schedule is paused or deleted. Must be in the RFC 3339 (https://www.rfc-editor.org/rfc/rfc3339.txt) format. E.g. "2026-01-01T00:00:00Z" or "2026-01-01T00:00:00-05:00"
        execution-display-name: The display name of the execution.
        execution-timeout: The max running time of the execution job, as a duration. See '$ gcloud topic datetimes' for details on formatting the input duration.
        gcs-notebook-uri: 'The Cloud Storage uri pointing to the notebook. Format: gs://bucket/notebook_file.ipynb'
        gcs-output-uri: 'The Cloud Storage location to upload notebook execution results to. Format: gs://bucket-name.'
        generation: The version of the Cloud Storage object to read. If unset, the current version of the object will be used.
        kernel-name: The kernel name to use for the execution.
        kms-key: |-
            ID of the key or fully qualified identifier for the key.
            +
            To set the `kms-key` attribute:
            * provide the argument `--kms-key` on the command line.
        kms-keyring: |-
            KMS keyring id of the key.
            +
            To set the `kms-keyring` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-keyring` on the command line.
        kms-location: |-
            Cloud location for the key.
            +
            To set the `kms-location` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-location` on the command line.
        kms-project: |-
            Cloud project id for the key.
            +
            To set the `kms-project` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-project` on the command line.
        machine-type: The Compute Engine machine type selected for the runtime.
        max-concurrent-runs: Maximum number of runs that can be started concurrently for this Schedule. This is the limit for starting the scheduled requests and not the execution of the notebook execution jobs created by the requests.
        max-runs: The max runs for the schedule.
        network: |-
            ID of the network or fully qualified identifier for the network.
            +
            To set the `network` attribute:
            * provide the argument `--network` on the command line.
        no-enable-internet-access: Enable public internet access for the runtime.
        no-enable-queueing: Enables new scheduled runs to be queued when max_concurrent_runs limit is reached. If set to true, new runs will be queued instead of skipped.
        region: |-
            ID of the region or fully qualified identifier for the region.
            +
            To set the `region` attribute:
            * provide the argument `--region` on the command line.
        service-account: The service account to run the execution as
        start-time: The timestamp after which the first run can be scheduled. Defaults to the schedule creation time. Must be in the RFC 3339 (https://www.rfc-editor.org/rfc/rfc3339.txt) format. E.g. "2026-01-01T00:00:00Z" or "2026-01-01T00:00:00-05:00"
        subnetwork: |-
            ID of the subnetwork or fully qualified identifier for the subnetwork.
            +
            To set the `subnetwork` attribute:
            * provide the argument `--subnetwork` on the command line.
        subnetwork-region: |-
            Google Cloud region of this subnetwork https://cloud.google.com/compute/docs/regions-zones/#locations.
            +
            To set the `subnetwork-region` attribute:
            * provide the argument `--subnetwork` on the command line with a fully specified name;
            * provide the argument `--subnetwork-region` on the command line.
