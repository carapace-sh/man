name: describe
description: '*(ALPHA)*  Retrieve information about a table.'
flags:
    --instance=: Name of the Bigtable instance.
    --view=: The view to be applied to the returned table's fields.
completion:
    flag:
        view:
            - encryption
            - full
            - name
            - replication
            - schema
            - stats
documentation:
    command: '*(ALPHA)*  Retrieve information about a table.'
    flag:
        instance: |-
            Name of the Bigtable instance.
            +
            To set the `instance` attribute:
            * provide the argument `table` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line.
        view: |-
            The view to be applied to the returned table's fields. _VIEW_ must be one of:
            +
            *encryption*::: Only populates `name` and fields related to the table's encryption status.
            *full*::: Populates all fields.
            *name*::: Only populates `name`.
            *replication*::: Only populates `name` and fields related to the table's replication.
            *schema*::: Only populates `name` and fields related to the table's schema.
            *stats*::: Only populates `name` and fields related to the table's statistics (e.g. TableStats and ColumnFamilyStats).
            :::
            +
