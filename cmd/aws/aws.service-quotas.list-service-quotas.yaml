name: list-service-quotas
description: Lists the applied quota values for the specified Amazon Web Services service.
flags:
    --max-results=: Specifies the maximum number of results that you want included on each page of the response.
    --next-token=: Specifies a value for receiving additional results after you receive a `NextToken` response in a previous request.
    --quota-applied-at-level=: Filters the response to return applied quota values for the `ACCOUNT`, `RESOURCE`, or `ALL` levels.
    --quota-code=: Specifies the quota identifier.
    --service-code=!: Specifies the service identifier.
completion:
    flag:
        quota-applied-at-level:
            - ACCOUNT
            - RESOURCE
            - ALL
documentation:
    command: Lists the applied quota values for the specified Amazon Web Services service. For some quotas, only the default values are available. If the applied quota value is not available for a quota, the quota is not retrieved. Filter responses to return applied quota values at either the account level, resource level, or all levels.
    flag:
        max-results: |-
            Specifies the maximum number of results that you want included on each page of the response. If you do not include this parameter, it defaults to a value appropriate to the operation. If additional items exist beyond those included in the current response, the `NextToken` response element is present and has a value (is not null). Include that value as the `NextToken` request parameter in the next call to the operation to get the next part of the results.

            An API operation can return fewer results than the maximum even when there are more results available. You should check `NextToken` after every operation to ensure that you receive all of the results.
        next-token: Specifies a value for receiving additional results after you receive a `NextToken` response in a previous request. A `NextToken` response indicates that more output is available. Set this parameter to the value of the previous call's `NextToken` response to indicate where the output should continue from.
        quota-applied-at-level: Filters the response to return applied quota values for the `ACCOUNT`, `RESOURCE`, or `ALL` levels. `ACCOUNT` is the default.
        quota-code: Specifies the quota identifier. To find the quota code for a specific quota, use the [ListServiceQuotas]() operation, and look for the `QuotaCode` response in the output for the quota you want.
        service-code: Specifies the service identifier. To find the service code value for an Amazon Web Services service, use the [ListServices]() operation.
