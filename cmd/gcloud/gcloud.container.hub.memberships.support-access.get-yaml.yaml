name: get-yaml
description: Generates YAML for anthos support RBAC policies.
flags:
    --location=: The location of the membership resource, e.g. `us-central1`.
    --rbac-output-file=: If specified, the generated RBAC policy will be written to the
documentation:
    command: |-
        ## EXAMPLES

          To generate the YAML for support access RBAC policies with membership
          `my-membership`, run:

            $ gcloud container hub memberships support-access get-yaml my-membership
    flag:
        location: |-
            The location of the membership resource, e.g. `us-central1`.
            If not specified, defaults to `global`.
            +

            To set the `location` attribute:
            * provide the argument `MEMBERSHIP_NAME` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkehub/location`.
        rbac-output-file: |-
            If specified, the generated RBAC policy will be written to the
            designated local file.
