name: delete-domain
description: Deletes an Amazon OpenSearch Service domain and all of its data.
flags:
    --domain-name=!: The name of the domain you want to permanently delete.
documentation:
    command: Deletes an Amazon OpenSearch Service domain and all of its data. You can't recover a domain after you delete it.
    flag:
        domain-name: The name of the domain you want to permanently delete.
