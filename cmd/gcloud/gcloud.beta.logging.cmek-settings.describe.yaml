name: describe
description: '*(BETA)*  Display the CMEK settings for the Cloud Logging Logs Router.'
hidden: true
flags:
    --billing-account=: Billing account of the CMEK settings to describe.
    --folder=: Folder of the CMEK settings to describe.
    --organization=: Organization of the CMEK settings to describe.
documentation:
    command: |-
        *(BETA)*  If *kmsKeyName* is present in the output, then CMEK is enabled for your
        project, folder, organization or billing-account. You can also find the Logs
        Router service account using this command.

        ## EXAMPLE

        To describe the Logs Router CMEK settings for a project, run:

          $ gcloud beta logging cmek-settings describe --project=[PROJECT_ID]

        To describe the Logs Router CMEK settings for an organization, run:

          $ gcloud beta logging cmek-settings describe --organization=[ORGANIZATION_ID]

          kmsKeyName:
          'projects/my-project/locations/my-location/keyRings/my-keyring/cryptoKeys/key'
          name: 'organizations/[ORGANIZATION_ID]/cmekSettings'
          serviceAccountId:
          '[SERVICE_ACCOUNT_ID]@gcp-sa-logging.iam.gserviceaccount.com'
    flag:
        billing-account: Billing account of the CMEK settings to describe.
        folder: Folder of the CMEK settings to describe.
        organization: Organization of the CMEK settings to describe.
