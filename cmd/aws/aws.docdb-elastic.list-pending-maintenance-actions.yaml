name: list-pending-maintenance-actions
description: Retrieves a list of all maintenance actions that are pending.
flags:
    --max-results=: The maximum number of results to include in the response.
    --next-token=: An optional pagination token provided by a previous request.
documentation:
    command: Retrieves a list of all maintenance actions that are pending.
    flag:
        max-results: The maximum number of results to include in the response. If more records exist than the specified `maxResults` value, a pagination token (marker) is included in the response so that the remaining results can be retrieved.
        next-token: An optional pagination token provided by a previous request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `maxResults`.
