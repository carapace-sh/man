name: import
description: '*(BETA)*  Import TrustConfig.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Certificate Manager location.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --source=: Path to a YAML file containing the configuration export data.
    --update-mask=: Update mask used to specify fields to be overwritten in the TrustConfig by import.
documentation:
    command: |
        *(BETA)*  Import a TrustConfig.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            Certificate Manager location.
            +
            To set the `location` attribute:
            * provide the argument `trust_config` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * default value of location is [global].
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        source: |-
            Path to a YAML file containing the configuration export data. The
            YAML file must not contain any output-only fields. Alternatively, you
            may omit this flag to read from standard input. For a schema
            describing the export/import format, see:
            $CLOUDSDKROOT/lib/googlecloudsdk/schemas/...
            +
            $CLOUDSDKROOT is can be obtained with the following command:
            +
              $ gcloud info --format='value(installation.sdk_root)'
        update-mask: |-
            Update mask used to specify fields to be overwritten in the TrustConfig by import.
            TrustConfig must already exist. Fields specified in the update-mask are relative to the
            TrustConfig. The flag can be a comma-separated list of updatable non-nested fields,
            e.g. description or trust_stores. Valid example: --update-mask=description,trust_stores.
