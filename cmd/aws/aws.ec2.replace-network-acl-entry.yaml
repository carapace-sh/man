name: replace-network-acl-entry
description: Replaces an entry (rule) in a network ACL.
flags:
    --cidr-block=: The IPv4 network range to allow or deny, in CIDR notation (for example `172.16.0.0/24`).
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --egress!: Indicates whether to replace the egress rule.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --icmp-type-code=: 'ICMP protocol: The ICMP or ICMPv6 type and code.'
    --ingress!: Indicates whether to replace the egress rule.
    --ipv6-cidr-block=: The IPv6 network range to allow or deny, in CIDR notation (for example `2001:bd8:1234:1a00::/64`).
    --network-acl-id=!: The ID of the ACL.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --port-range=: 'TCP or UDP protocols: The range of ports the rule applies to.'
    --protocol=!: The protocol number.
    --rule-action=!: Indicates whether to allow or deny the traffic that matches the rule.
    --rule-number=!: The rule number of the entry to replace.
completion:
    flag:
        rule-action:
            - allow
            - deny
documentation:
    command: Replaces an entry (rule) in a network ACL. For more information, see [Network ACLs](https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html) in the *Amazon VPC User Guide*.
    flag:
        cidr-block: The IPv4 network range to allow or deny, in CIDR notation (for example `172.16.0.0/24`).
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        egress: |-
            Indicates whether to replace the egress rule.

            Default: If no value is specified, we replace the ingress rule.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        icmp-type-code: 'ICMP protocol: The ICMP or ICMPv6 type and code. Required if specifying protocol 1 (ICMP) or protocol 58 (ICMPv6) with an IPv6 CIDR block.'
        ipv6-cidr-block: The IPv6 network range to allow or deny, in CIDR notation (for example `2001:bd8:1234:1a00::/64`).
        network-acl-id: The ID of the ACL.
        port-range: 'TCP or UDP protocols: The range of ports the rule applies to. Required if specifying protocol 6 (TCP) or 17 (UDP).'
        protocol: The protocol number. A value of "-1" means all protocols. If you specify "-1" or a protocol number other than "6" (TCP), "17" (UDP), or "1" (ICMP), traffic on all ports is allowed, regardless of any ports or ICMP types or codes that you specify. If you specify protocol "58" (ICMPv6) and specify an IPv4 CIDR block, traffic for all ICMP types and codes allowed, regardless of any that you specify. If you specify protocol "58" (ICMPv6) and specify an IPv6 CIDR block, you must specify an ICMP type and code.
        rule-action: Indicates whether to allow or deny the traffic that matches the rule.
        rule-number: The rule number of the entry to replace.
