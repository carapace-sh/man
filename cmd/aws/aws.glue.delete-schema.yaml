name: delete-schema
description: Deletes the entire schema set, including the schema set and all of its versions.
flags:
    --schema-id=!: This is a wrapper structure that may contain the schema name and Amazon Resource Name (ARN).
documentation:
    command: Deletes the entire schema set, including the schema set and all of its versions. To get the status of the delete operation, you can call `GetSchema` API after the asynchronous call. Deleting a registry will deactivate all online operations for the schema, such as the `GetSchemaByDefinition`, and `RegisterSchemaVersion` APIs.
    flag:
        schema-id: This is a wrapper structure that may contain the schema name and Amazon Resource Name (ARN).
