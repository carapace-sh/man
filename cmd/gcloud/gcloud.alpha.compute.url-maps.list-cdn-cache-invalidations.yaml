name: list-cdn-cache-invalidations
description: '*(ALPHA)*  List Cloud CDN cache invalidations for a URL map.'
flags:
    --global: (Default) The URL map is global.
    --limit=: The maximum number of invalidations to list.
    --no-global&: (Default) The URL map is global.
    --region=&: 'Region of the URL map to describe. '
documentation:
    command: |
        *(ALPHA)*  List Cloud CDN cache invalidations for a URL map. A cache invalidation
        instructs Cloud CDN to stop using cached content. You can list
        invalidations to check which have completed.
    flag:
        global: (Default) The URL map is global. Regional URL maps are not supported.
        limit: The maximum number of invalidations to list. This has an upper limit of 1000. For more results, use Cloud Logging.
        no-global: (Default) The URL map is global. Regional URL maps are not supported.
        region: 'Region of the URL map to describe. '
