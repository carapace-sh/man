name: update-access-policy
description: Updates an existing access policy that specifies an identity's access to an IoT SiteWise Monitor portal or project resource.
flags:
    --access-policy-id=!: The ID of the access policy.
    --access-policy-identity=!: The identity for this access policy.
    --access-policy-permission=!: The permission level for this access policy.
    --access-policy-resource=!: The IoT SiteWise Monitor resource for this access policy.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
completion:
    flag:
        access-policy-permission:
            - ADMINISTRATOR
            - VIEWER
documentation:
    command: Updates an existing access policy that specifies an identity's access to an IoT SiteWise Monitor portal or project resource.
    flag:
        access-policy-id: The ID of the access policy.
        access-policy-identity: The identity for this access policy. Choose an IAM Identity Center user, an IAM Identity Center group, or an IAM user.
        access-policy-permission: The permission level for this access policy. Note that a project `ADMINISTRATOR` is also known as a project owner.
        access-policy-resource: The IoT SiteWise Monitor resource for this access policy. Choose either a portal or a project.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request. Don't reuse this client token if a new idempotent request is required.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
