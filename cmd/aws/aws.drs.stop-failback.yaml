name: stop-failback
description: Stops the failback process for a specified Recovery Instance.
flags:
    --recovery-instance-id=!: The ID of the Recovery Instance we want to stop failback for.
documentation:
    command: Stops the failback process for a specified Recovery Instance. This changes the Failback State of the Recovery Instance back to FAILBACK\_NOT\_STARTED.
    flag:
        recovery-instance-id: The ID of the Recovery Instance we want to stop failback for.
