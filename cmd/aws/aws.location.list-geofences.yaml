name: list-geofences
description: Lists geofences stored in a given geofence collection.
flags:
    --collection-name=!: The name of the geofence collection storing the list of geofences.
    --max-results=: An optional limit for the number of geofences returned in a single call.
    --next-token=: The pagination token specifying which page of results to return in the response.
documentation:
    command: Lists geofences stored in a given geofence collection.
    flag:
        collection-name: The name of the geofence collection storing the list of geofences.
        max-results: |-
            An optional limit for the number of geofences returned in a single call.

            Default value: `100`
        next-token: |-
            The pagination token specifying which page of results to return in the response. If no token is provided, the default page is the first page.

            Default value: `null`
