name: describe-placement-groups
description: Describes the specified placement groups or all of your placement groups.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dry-run: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response.
    --filters=:
        description: The filters.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --group-ids=:
        description: The IDs of the placement groups.
        nargs: -1
    --group-names=:
        description: The names of the placement groups.
        nargs: -1
    --no-dry-run: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response.
documentation:
    command: |-
        Describes the specified placement groups or all of your placement groups.

        To describe a specific placement group that is *shared* with your account, you must specify the ID of the placement group using the `GroupId` parameter. Specifying the name of a *shared* placement group using the `GroupNames` parameter will result in an error.

        For more information, see [Placement groups](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/placement-groups.html) in the *Amazon EC2 User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dry-run: Checks whether you have the required permissions for the operation, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            The filters.

            - `group-name` - The name of the placement group.
            - `group-arn` - The Amazon Resource Name (ARN) of the placement group.
            - `spread-level` - The spread level for the placement group (`host` | `rack`).
            - `state` - The state of the placement group (`pending` | `available` | `deleting` | `deleted`).
            - `strategy` - The strategy of the placement group (`cluster` | `spread` | `partition`).
            - `tag:<key>` - The key/value combination of a tag assigned to the resource. Use the tag key in the filter name and the tag value as the filter value. For example, to find all resources that have a tag with the key `Owner` and the value `TeamA`, specify `tag:Owner` for the filter name and `TeamA` for the filter value.
            - `tag-key` - The key of a tag assigned to the resource. Use this filter to find all resources that have a tag with a specific key, regardless of the tag value.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        group-ids: The IDs of the placement groups.
        group-names: |-
            The names of the placement groups.

            Constraints:

            - You can specify a name only if the placement group is owned by your account.
            - If a placement group is *shared* with your account, specifying the name results in an error. You must use the `GroupId` parameter instead.
