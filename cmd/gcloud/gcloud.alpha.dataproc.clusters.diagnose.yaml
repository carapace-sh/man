name: diagnose
description: '*(ALPHA)*  Run a detailed diagnostic on a cluster.'
flags:
    --end-time=: Time instant to stop the diagnosis at (in %Y-%m-%dT%H:%M:%S.%fZ format).
    --job-id=&: (DEPRECATED) The job on which to perform the diagnosis.
    --job-ids=: A list of jobs on which to perform the diagnosis.
    --region=: Dataproc region for the cluster.
    --start-time=: Time instant to start the diagnosis from (in %Y-%m-%dT%H:%M:%S.%fZ format).
    --tarball-access=: Target access privileges for diagnostic tarball.
    --tarball-gcs-dir=: The output Cloud Storage directory for the diagnostic tarball.
    --timeout=&: Client side timeout on how long to wait for Dataproc operations.
    --workers=&: A list of workers in the cluster to run the diagnostic script on.
    --yarn-application-id=&: (DEPRECATED) The yarn application on which to perform the diagnosis.
    --yarn-application-ids=: A list of yarn applications on which to perform the diagnosis.
completion:
    flag:
        tarball-access:
            - GOOGLE_CLOUD_SUPPORT
            - GOOGLE_DATAPROC_DIAGNOSE
documentation:
    command: '*(ALPHA)*  Run a detailed diagnostic on a cluster.'
    flag:
        end-time: Time instant to stop the diagnosis at (in %Y-%m-%dT%H:%M:%S.%fZ format).
        job-id: |-
            (DEPRECATED) The job on which to perform the diagnosis.
            +
            The --job-id option is deprecated and will be removed in upcoming release; use --job-ids instead.
        job-ids: A list of jobs on which to perform the diagnosis.
        region: |-
            Dataproc region for the cluster. Each Dataproc region constitutes an independent resource namespace constrained to deploying instances into Compute Engine zones inside the region. Overrides the default `dataproc/region` property value for this command invocation.
            +
            To set the `region` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `dataproc/region`.
        start-time: Time instant to start the diagnosis from (in %Y-%m-%dT%H:%M:%S.%fZ format).
        tarball-access: 'Target access privileges for diagnostic tarball. _TARBALL_ACCESS_ must be one of: *GOOGLE_CLOUD_SUPPORT*, *GOOGLE_DATAPROC_DIAGNOSE*.'
        tarball-gcs-dir: The output Cloud Storage directory for the diagnostic tarball. If not specified, a task-specific directory in the cluster's staging bucket will be used.
        timeout: Client side timeout on how long to wait for Dataproc operations. See $ gcloud topic datetimes for information on duration formats.
        workers: A list of workers in the cluster to run the diagnostic script on.
        yarn-application-id: |-
            (DEPRECATED) The yarn application on which to perform the diagnosis.
            +
            The --yarn-application-id option is deprecated and will be removed in upcoming release; use --yarn-application-ids instead.
        yarn-application-ids: A list of yarn applications on which to perform the diagnosis.
