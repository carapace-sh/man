completion:
    flag:
        architecture:
            - ARM64
            - X86_64
documentation:
    command: |
        *(BETA)*  *gcloud beta compute images create* is used to create custom disk images.
        The resulting image can be provided during instance or disk creation
        so that the instance attached to the resulting disks has access
        to a known set of software or files from the image.

        Images can be created from gzipped compressed tarball containing raw
        disk data, existing disks in any zone, existing images, and existing
        snapshots inside the same project.

        Images are global resources, so they can be used across zones and
        projects.

        To learn more about creating image tarballs, visit
        [](https://cloud.google.com/compute/docs/creating-custom-image).
    flag:
        architecture: 'Specifies the architecture or processor type that this image can support. For available processor types on Compute Engine, see https://cloud.google.com/compute/docs/cpu-platforms. _ARCHITECTURE_ must be one of: *ARM64*, *X86_64*.'
        csek-key-file: |-
            Path to a Customer-Supplied Encryption Key (CSEK) key file that maps
            Compute Engine images to user managed keys to be used when
            creating, mounting, or taking snapshots of disks.
            +
            If you pass `-` as value of the flag, the CSEK is read from stdin.
            See https://cloud.google.com/compute/docs/disks/customer-supplied-encryption for more details.
        description: An optional, textual description for the image being created.
        family: The family of the image. When creating an instance or disk, specifying a family will cause the latest non-deprecated image in the family to be used.
        forbidden-database-file: |-
            Comma-separated list of file paths that point to revoked X.509
            certificates in DER format or raw binary files. When you create a Shielded
            VM instance from this image, these certificates or files are added to the
            forbidden signature database (dbx).
        force: |-
            By default, image creation fails when it is created from a disk that
            is attached to a running instance. When this flag is used, image
            creation from disk will proceed even if the disk is in use.
        force-create: |-
            (DEPRECATED)           DEPRECATED, use --force instead.
                      By default, image creation fails when it is created from a disk that
                      is attached to a running instance. When this flag is used, image
                      creation from disk will proceed even if the disk is in use.
            +
            Flag force-create is deprecated. Use --force instead.
        guest-os-features: |-
            Enables one or more features for VM instances that use the
            image for their boot disks. See the descriptions of supported features at:
            https://cloud.google.com/compute/docs/images/create-delete-deprecate-private-images#guest-os-features. _GUEST_OS_FEATURE_ must be one of: *BARE_METAL_LINUX_COMPATIBLE*, *GVNIC*, *IDPF*, *MULTI_IP_SUBNET*, *SEV_CAPABLE*, *SEV_LIVE_MIGRATABLE*, *SEV_LIVE_MIGRATABLE_V2*, *SEV_SNP_CAPABLE*, *SNP_SVSM_CAPABLE*, *TDX_CAPABLE*, *UEFI_COMPATIBLE*, *VIRTIO_SCSI_MULTIQUEUE*, *WINDOWS*.
        key-exchange-key-file: |-
            Comma-separated list of file paths that point to X.509 certificates in DER
            format or raw binary files. When you create a Shielded VM instance from
            this image, these certificates or files are used as key exchange keys
            (KEK).
        kms-key: |-
            ID of the key or fully qualified identifier for the key.
            +
            To set the `kms-key` attribute:
            * provide the argument `--kms-key` on the command line.
        kms-keyring: |-
            The KMS keyring of the key.
            +
            To set the `kms-keyring` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-keyring` on the command line.
        kms-location: |-
            The Google Cloud location for the key.
            +
            To set the `kms-location` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-location` on the command line.
        kms-project: |-
            The Google Cloud project for the key.
            +
            To set the `kms-project` attribute:
            * provide the argument `--kms-key` on the command line with a fully specified name;
            * provide the argument `--kms-project` on the command line;
            * set the property `core/project`.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        licenses: Comma-separated list of URIs to license resources.
        locked: |
            Specifies that any boot disk created from this image can't be used
            for data backup operations such as snapshot creation, image creation,
            instance snapshot creation, and disk cloning.

            If a VM instance is created using this image, the boot disk is fixed
            to this VM. The disk can't be attached to any other VMs, whether in
            `read-write` mode or in `read-only` mode. Also, any VM created from this
            disk, has the following characteristics:

            * The VM can't be used for creating machine images or instance templates
            * After the VM is created, you can't attach any secondary disk
            * After the VM is deleted, the attached boot disk can't be retained
        no-force: |
            By default, image creation fails when it is created from a disk that
            is attached to a running instance. When this flag is used, image
            creation from disk will proceed even if the disk is in use.
        no-force-create: |-
            (DEPRECATED)           DEPRECATED, use --force instead.
                      By default, image creation fails when it is created from a disk that
                      is attached to a running instance. When this flag is used, image
                      creation from disk will proceed even if the disk is in use.
            +
            Flag force-create is deprecated. Use --force instead.
        no-locked: |
            Specifies that any boot disk created from this image can't be used
            for data backup operations such as snapshot creation, image creation,
            instance snapshot creation, and disk cloning.

            If a VM instance is created using this image, the boot disk is fixed
            to this VM. The disk can't be attached to any other VMs, whether in
            `read-write` mode or in `read-only` mode. Also, any VM created from this
            disk, has the following characteristics:

            * The VM can't be used for creating machine images or instance templates
            * After the VM is created, you can't attach any secondary disk
            * After the VM is deleted, the attached boot disk can't be retained
        no-require-csek-key-create: |
            Refuse to create images not protected by a user managed key in
            the key file when --csek-key-file is given. This behavior is enabled
            by default to prevent incorrect gcloud invocations from accidentally
            creating images with no user managed key. Disabling the check
            allows creation of some images without a matching
            Customer-Supplied Encryption Key in the supplied --csek-key-file.
            See https://cloud.google.com/compute/docs/disks/customer-supplied-encryption for more details.
        platform-key-file: |-
            File path that points to an X.509 certificate in DER format or raw binary
            file. When you create a Shielded VM instance from this image, this
            certificate or raw binary file is used as the platform key (PK).
        require-csek-key-create: |-
            Refuse to create images not protected by a user managed key in
            the key file when --csek-key-file is given. This behavior is enabled
            by default to prevent incorrect gcloud invocations from accidentally
            creating images with no user managed key. Disabling the check
            allows creation of some images without a matching
            Customer-Supplied Encryption Key in the supplied --csek-key-file.
            See https://cloud.google.com/compute/docs/disks/customer-supplied-encryption for more details. Enabled by default, use *--no-require-csek-key-create* to disable.
        signature-database-file: |-
            Comma-separated list of file paths that point to valid X.509 certificates
            in DER format or raw binary files. When you create a Shielded VM instance
            from this image, these certificates or files are  added to the signature
            database (db).
        source-disk: |-
            A source disk to create the image from. The value for this option can be
            the name of a disk with the zone specified via ``--source-disk-zone''
            flag.
        source-disk-project: |-
            Project name of the source disk. Must also specify
            --source-disk when using this flag.
        source-disk-zone: |-
            Zone of the source disk to operate on. If not specified and the ``compute/zone'' property isn't set, you
            might be prompted to select a zone (interactive mode only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
        source-image: |-
            The name of an image to clone. May be used with
            ``--source-image-project'' to clone an image in a different
            project.
        source-image-family: |-
            The family of the source image. This will cause the latest non-
            deprecated image in the family to be used as the source image.
            May be used with ``--source-image-project'' to refer to an image
            family in a different project.
        source-image-project: |-
            The project name of the source image. Must also specify either
            ``--source-image'' or ``--source-image-family'' when using
            this flag.
        source-snapshot: |-
            A source snapshot to create the image from. The value for this option
            can be the name of a snapshot within the same project as the destination
            image.
        source-uri: |-
            The full Cloud Storage URI where the disk image is stored.
            This file must be a gzip-compressed tarball whose name ends in
            ``.tar.gz''.
            For more information about Cloud Storage URIs,
            see https://cloud.google.com/storage/docs/request-endpoints#json-api.
        storage-location: |-
            Specifies a Cloud Storage location, either regional or multi-regional,
            where image content is to be stored. If not specified, the multi-region
            location closest to the source is chosen automatically.
        user-licenses: URI for the license resource. For multiple licenses, you can provide a comma-separated list of URIs.
