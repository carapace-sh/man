name: put-image-recipe-policy
description: Applies a policy to an image recipe.
flags:
    --image-recipe-arn=!: The Amazon Resource Name (ARN) of the image recipe that this policy should be applied to.
    --policy=!: The policy to apply.
documentation:
    command: Applies a policy to an image recipe. We recommend that you call the RAM API [CreateResourceShare](https://docs.aws.amazon.com/ram/latest/APIReference/API_CreateResourceShare.html) to share resources. If you call the Image Builder API `PutImageRecipePolicy`, you must also call the RAM API [PromoteResourceShareCreatedFromPolicy](https://docs.aws.amazon.com/ram/latest/APIReference/API_PromoteResourceShareCreatedFromPolicy.html) in order for the resource to be visible to all principals with whom the resource is shared.
    flag:
        image-recipe-arn: The Amazon Resource Name (ARN) of the image recipe that this policy should be applied to.
        policy: The policy to apply.
