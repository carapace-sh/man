name: add-job
description: '*(ALPHA)*  Add Dataproc jobs to workflow template.'
documentation:
    command: |-
        ## EXAMPLES

        To add a Hadoop MapReduce job, run:

          $ gcloud alpha dataproc workflow-templates add-job hadoop --workflow-template my_template --jar my_jar.jar \
              -- arg1 arg2

        To add a Spark Scala or Java job, run:

          $ gcloud alpha dataproc workflow-templates add-job spark --workflow-template my_template --jar my_jar.jar \
              -- arg1 arg2

        To add a PySpark job, run:

          $ gcloud alpha dataproc workflow-templates add-job pyspark --workflow-template my_template my_script.py \
              -- arg1 arg2

        To add a Spark SQL job, run:

          $ gcloud alpha dataproc workflow-templates add-job spark-sql --workflow-template my_template --file my_queries.q

        To add a Pig job, run:

          $ gcloud alpha dataproc workflow-templates add-job pig --workflow-template my_template --file my_script.pig

        To add a Hive job, run:

          $ gcloud alpha dataproc workflow-templates add-job hive --workflow-template my_template --file my_queries.q
