name: delete
description: Delete transcoder job templates.
flags:
    --location=: Transcoder location for resources
documentation:
    command: Delete transcoder job templates.
    flag:
        location: |-
            Transcoder location for resources
            +
            To set the `location` attribute:
            * provide the argument `template_id` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `transcoder/location`.
