name: set-iam-policy
description: '*(ALPHA)*  Set the IAM policy for a Cloud Deploy target.'
flags:
    --region=: Location of the target.
documentation:
    command: |
        *(ALPHA)*  Set the IAM policy associated with a Cloud Deploy target.

        See https://cloud.google.com/iam/docs/managing-policies for details of
        the policy file format and contents.
    flag:
        region: |-
            Location of the target.
            +

            To set the `region` attribute:
            * provide the argument `target` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `deploy/region`.
