name: describe
description: '*(ALPHA)*  *(DEPRECATED)*  Describe a Dataplex job running a particular datascan.'
hidden: true
flags:
    --datascan=: Datascan ID of the Dataplex datascan resource.
    --location=: Location of the Dataplex resource.
    --view=: 'There are two possible views: ''basic'' and ''full''.'
completion:
    flag:
        view:
            - basic
            - full
documentation:
    command: |4
        *(ALPHA)*  *(DEPRECATED)*  This command is deprecated. Please use `gcloud alpha dataplex datascans jobs` instead.

        Describe a Dataplex job running a particular datascan.

        Displays all details of a Dataplex job given a valid job ID.
    flag:
        datascan: |-
            Datascan ID of the Dataplex datascan resource.
            +

            To set the `datascan` attribute:
            * provide the argument `job` on the command line with a fully specified name;
            * provide the argument `--datascan` on the command line.
        location: |-
            Location of the Dataplex resource.
            +

            To set the `location` attribute:
            * provide the argument `job` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
        view: |-
            There are two possible views: 'basic' and 'full'. The default view is 'basic'. _VIEW_ must be one of:
            +
            *basic*::: Does not include spec and result data in response.
            +
            *full*::: Includes spec and result data in response.
            +
            :::
            +
