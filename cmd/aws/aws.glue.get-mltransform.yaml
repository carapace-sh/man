name: get-mltransform
description: Gets an Glue machine learning transform artifact and all its corresponding metadata.
flags:
    --transform-id=!: The unique identifier of the transform, generated at the time that the transform was created.
documentation:
    command: Gets an Glue machine learning transform artifact and all its corresponding metadata. Machine learning transforms are a special type of transform that use machine learning to learn the details of the transformation to be performed by learning from examples provided by humans. These transformations are then saved by Glue. You can retrieve their metadata by calling `GetMLTransform`.
    flag:
        transform-id: The unique identifier of the transform, generated at the time that the transform was created.
