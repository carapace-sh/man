name: list-replicators
description: Lists the replicators.
flags:
    --max-results=: The maximum number of results to return in the response.
    --next-token=: If the response of ListReplicators is truncated, it returns a NextToken in the response.
    --replicator-name-filter=: Returns replicators starting with given name.
documentation:
    command: Lists the replicators.
    flag:
        max-results: The maximum number of results to return in the response. If there are more results, the response includes a NextToken parameter.
        next-token: If the response of ListReplicators is truncated, it returns a NextToken in the response. This NextToken should be sent in the subsequent request to ListReplicators.
        replicator-name-filter: Returns replicators starting with given name.
