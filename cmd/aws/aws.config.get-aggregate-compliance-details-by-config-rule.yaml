name: get-aggregate-compliance-details-by-config-rule
description: Returns the evaluation results for the specified Config rule for a specific resource in a rule.
flags:
    --account-id=!: The 12-digit account ID of the source account.
    --aws-region=!: The source region from where the data is aggregated.
    --compliance-type=: The resource compliance status.
    --config-rule-name=!: The name of the Config rule for which you want compliance information.
    --configuration-aggregator-name=!: The name of the configuration aggregator.
    --limit=: The maximum number of evaluation results returned on each page.
    --next-token=: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
completion:
    flag:
        compliance-type:
            - COMPLIANT
            - NON_COMPLIANT
            - NOT_APPLICABLE
            - INSUFFICIENT_DATA
documentation:
    command: |-
        Returns the evaluation results for the specified Config rule for a specific resource in a rule. The results indicate which Amazon Web Services resources were evaluated by the rule, when each resource was last evaluated, and whether each resource complies with the rule.

        The results can return an empty result page. But if you have a `nextToken`, the results are displayed on the next page.
    flag:
        account-id: The 12-digit account ID of the source account.
        aws-region: The source region from where the data is aggregated.
        compliance-type: |-
            The resource compliance status.

            For the `GetAggregateComplianceDetailsByConfigRuleRequest` data type, Config supports only the `COMPLIANT` and `NON_COMPLIANT`. Config does not support the `NOT_APPLICABLE` and `INSUFFICIENT_DATA` values.
        config-rule-name: The name of the Config rule for which you want compliance information.
        configuration-aggregator-name: The name of the configuration aggregator.
        limit: The maximum number of evaluation results returned on each page. The default is 50. You cannot specify a number greater than 100. If you specify 0, Config uses the default.
        next-token: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
