name: describe-orderable-db-instance-options
description: Describes the orderable DB instance options for a specified DB engine.
flags:
    --availability-zone-group=: The Availability Zone group associated with a Local Zone.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --db-instance-class=: A filter to include only the available options for the specified DB instance class.
    --engine-version=: A filter to include only the available options for the specified engine version.
    --engine=!: The name of the database engine to describe DB instance options for.
    --filters=:
        description: This parameter isn't currently supported.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --license-model=: A filter to include only the available options for the specified license model.
    --marker=: An optional pagination token provided by a previous DescribeOrderableDBInstanceOptions request.
    --max-items=: The  total number of items to return in the command's output.
    --max-records=: The maximum number of records to include in the response.
    --no-vpc: Specifies whether to show only VPC or non-VPC offerings.
    --page-size=: The size of each page to get in the AWS service call.
    --starting-token=: A token to specify where to start paginating.
    --vpc: Specifies whether to show only VPC or non-VPC offerings.
documentation:
    command: Describes the orderable DB instance options for a specified DB engine.
    flag:
        availability-zone-group: |-
            The Availability Zone group associated with a Local Zone. Specify this parameter to retrieve available options for the Local Zones in the group.

            Omit this parameter to show the available options in the specified Amazon Web Services Region.

            This setting doesn't apply to RDS Custom DB instances.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        db-instance-class: A filter to include only the available options for the specified DB instance class.
        engine: |-
            The name of the database engine to describe DB instance options for.

            Valid Values:

            - `aurora-mysql`
            - `aurora-postgresql`
            - `custom-oracle-ee`
            - `custom-oracle-ee-cdb`
            - `custom-oracle-se2`
            - `custom-oracle-se2-cdb`
            - `db2-ae`
            - `db2-se`
            - `mariadb`
            - `mysql`
            - `oracle-ee`
            - `oracle-ee-cdb`
            - `oracle-se2`
            - `oracle-se2-cdb`
            - `postgres`
            - `sqlserver-ee`
            - `sqlserver-se`
            - `sqlserver-ex`
            - `sqlserver-web`
        engine-version: A filter to include only the available options for the specified engine version.
        filters: This parameter isn't currently supported.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        license-model: |-
            A filter to include only the available options for the specified license model.

            RDS Custom supports only the BYOL licensing model.
        marker: An optional pagination token provided by a previous DescribeOrderableDBInstanceOptions request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that you can retrieve the remaining results.

            Default: 100

            Constraints: Minimum 20, maximum 1000.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        vpc: |-
            Specifies whether to show only VPC or non-VPC offerings. RDS Custom supports only VPC offerings.

            RDS Custom supports only VPC offerings. If you describe non-VPC offerings for RDS Custom, the output shows VPC offerings.
