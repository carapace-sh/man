name: update-service-pipeline
description: Update the service pipeline.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --deployment-type=!: The deployment type.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --service-name=!: The name of the service to that the pipeline is associated with.
    --spec=!: The spec for the service pipeline to update.
    --template-major-version=: The major version of the service template that was used to create the service that the pipeline is associated with.
    --template-minor-version=: The minor version of the service template that was used to create the service that the pipeline is associated with.
completion:
    flag:
        deployment-type:
            - NONE
            - CURRENT_VERSION
            - MINOR_VERSION
            - MAJOR_VERSION
documentation:
    command: |-
        Update the service pipeline.

        There are four modes for updating a service pipeline. The `deploymentType` field defines the mode.

        `NONE`

        In this mode, a deployment *doesn't* occur. Only the requested metadata parameters are updated.

        `CURRENT_VERSION`

        In this mode, the service pipeline is deployed and updated with the new spec that you provide. Only requested parameters are updated. *Don’t* include major or minor version parameters when you use this `deployment-type`.

        `MINOR_VERSION`

        In this mode, the service pipeline is deployed and updated with the published, recommended (latest) minor version of the current major version in use, by default. You can specify a different minor version of the current major version in use.

        `MAJOR_VERSION`

        In this mode, the service pipeline is deployed and updated with the published, recommended (latest) major and minor version of the current template by default. You can specify a different major version that's higher than the major version in use and a minor version.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        deployment-type: |-
            The deployment type.

            There are four modes for updating a service pipeline. The `deploymentType` field defines the mode.

            `NONE`

            In this mode, a deployment *doesn't* occur. Only the requested metadata parameters are updated.

            `CURRENT_VERSION`

            In this mode, the service pipeline is deployed and updated with the new spec that you provide. Only requested parameters are updated. *Don’t* include major or minor version parameters when you use this `deployment-type`.

            `MINOR_VERSION`

            In this mode, the service pipeline is deployed and updated with the published, recommended (latest) minor version of the current major version in use, by default. You can specify a different minor version of the current major version in use.

            `MAJOR_VERSION`

            In this mode, the service pipeline is deployed and updated with the published, recommended (latest) major and minor version of the current template, by default. You can specify a different major version that's higher than the major version in use and a minor version.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        service-name: The name of the service to that the pipeline is associated with.
        spec: The spec for the service pipeline to update.
        template-major-version: The major version of the service template that was used to create the service that the pipeline is associated with.
        template-minor-version: The minor version of the service template that was used to create the service that the pipeline is associated with.
