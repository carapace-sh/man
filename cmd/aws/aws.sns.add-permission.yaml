name: add-permission
description: Adds a statement to a topic's access control policy, granting access for the specified Amazon Web Services accounts to the specified actions.
flags:
    --action-name=!:
        description: The action you want to allow for the specified principal(s).
        nargs: -1
    --aws-account-id=!:
        description: The Amazon Web Services account IDs of the users (principals) who will be given access to the specified actions.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --label=!: A unique identifier for the new policy statement.
    --topic-arn=!: The ARN of the topic whose access control policy you wish to modify.
documentation:
    command: |-
        Adds a statement to a topic's access control policy, granting access for the specified Amazon Web Services accounts to the specified actions.

        To remove the ability to change topic permissions, you must deny permissions to the `AddPermission`, `RemovePermission`, and `SetTopicAttributes` actions in your IAM policy.
    flag:
        action-name: |-
            The action you want to allow for the specified principal(s).

            Valid values: Any Amazon SNS action name, for example `Publish`.
        aws-account-id: The Amazon Web Services account IDs of the users (principals) who will be given access to the specified actions. The users must have Amazon Web Services account, but do not need to be signed up for this service.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        label: A unique identifier for the new policy statement.
        topic-arn: The ARN of the topic whose access control policy you wish to modify.
