name: describe-event-subscriptions
description: Lists all the subscription descriptions for a customer account.
flags:
    --filters=: This parameter is not currently supported.
    --marker=: An optional pagination token provided by a previous DescribeOrderableDBInstanceOptions request.
    --max-records=: The maximum number of records to include in the response.
    --subscription-name=: The name of the event notification subscription you want to describe.
documentation:
    command: |-
        Lists all the subscription descriptions for a customer account. The description for a subscription includes SubscriptionName, SNSTopicARN, CustomerID, SourceType, SourceID, CreationTime, and Status.

        If you specify a SubscriptionName, lists the description for that subscription.
    flag:
        filters: This parameter is not currently supported.
        marker: An optional pagination token provided by a previous DescribeOrderableDBInstanceOptions request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords` .
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that the remaining results can be retrieved.

            Default: 100

            Constraints: Minimum 20, maximum 100.
        subscription-name: The name of the event notification subscription you want to describe.
