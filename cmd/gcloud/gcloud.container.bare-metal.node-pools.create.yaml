name: create
description: Create a node pool in an Anthos cluster on bare metal.
flags:
    --annotations=: Annotations on the node pool.
    --async: Return immediately, without waiting for the operation in progress to
    --cluster=: cluster of the node_pool.
    --disable-serialize-image-pulls: If set, prevent the Kubelet from pulling multiple images at a time.
    --display-name=: Display name for the resource.
    --location=: Google Cloud location for the node_pool.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-disable-serialize-image-pulls&: If set, prevent the Kubelet from pulling multiple images at a time.
    --no-validate-only&: If set, only validate the request, but do not actually perform the operation.
    --node-configs-from-file=&: ""
    --node-configs=: Bare Metal Node Pool node configuration.
    --node-labels=: Labels assigned to nodes of a node pool.
    --node-taints=: Node taint applied to every Kubernetes node in a node pool.
    --registry-burst=: Maximum size of bursty pulls, temporarily allow pulls to burst to this number, while still not exceeding registry_pull_qps.
    --registry-pull-qps=: Limit of registry pulls per second.
    --validate-only: If set, only validate the request, but do not actually perform the operation.
documentation:
    command: Create a node pool in an Anthos cluster on bare metal.
    flag:
        annotations: Annotations on the node pool.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        cluster: |-
            cluster of the node_pool.
            +
            To set the `cluster` attribute:
            * provide the argument `node_pool` on the command line with a fully specified name;
            * provide the argument `--cluster` on the command line.
        disable-serialize-image-pulls: If set, prevent the Kubelet from pulling multiple images at a time.
        display-name: Display name for the resource.
        location: |-
            Google Cloud location for the node_pool.
            +
            To set the `location` attribute:
            * provide the argument `node_pool` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_bare_metal/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-disable-serialize-image-pulls: If set, prevent the Kubelet from pulling multiple images at a time.
        no-validate-only: If set, only validate the request, but do not actually perform the operation.
        node-configs: Bare Metal Node Pool node configuration.
        node-configs-from-file: |+
            Path of the YAML/JSON file that contains the node configs.

            Examples:

              nodeConfigs:
              - nodeIP: 10.200.0.10
                labels:
                  node1: label1
                  node2: label2
              - nodeIP: 10.200.0.11
                labels:
                  node3: label3
                  node4: label4

            List of supported fields in `nodeConfigs`

            KEY           | VALUE                     | NOTE
            --------------|---------------------------|---------------------------
            nodeIP        | string                    | required, mutable
            labels        | one or more key-val pairs | optional, mutable

        node-labels: Labels assigned to nodes of a node pool.
        node-taints: Node taint applied to every Kubernetes node in a node pool.
        registry-burst: Maximum size of bursty pulls, temporarily allow pulls to burst to this number, while still not exceeding registry_pull_qps.
        registry-pull-qps: Limit of registry pulls per second.
        validate-only: If set, only validate the request, but do not actually perform the operation.
