# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: s3files
description: Amazon S3 Files
commands:
    - name: create-access-point
      description: Creates an S3 File System Access Point for application-specific access with POSIX user identity and root directory enforcement.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier to ensure that the operation completes no more than one time.
        --file-system-id=!: The ID or Amazon Resource Name (ARN) of the S3 File System.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --posix-user=: The POSIX identity with uid, gid, and secondary group IDs for user enforcement when accessing the file system through this access point.
        --root-directory=: The root directory path for the access point, with optional creation permissions for newly created directories.
        --tags=:
            description: An array of key-value pairs to apply to the access point for resource tagging.
            nargs: -1
      documentation:
        command: Creates an S3 File System Access Point for application-specific access with POSIX user identity and root directory enforcement. Access points provide a way to manage access to shared datasets in multi-tenant scenarios.
        flag:
            cli-input-json: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            cli-input-yaml: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            client-token: A unique, case-sensitive identifier to ensure that the operation completes no more than one time. If this token matches a previous request, Amazon Web Services ignores the request, but does not return an error.
            file-system-id: The ID or Amazon Resource Name (ARN) of the S3 File System.
            generate-cli-skeleton: |-
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            posix-user: The POSIX identity with uid, gid, and secondary group IDs for user enforcement when accessing the file system through this access point.
            root-directory: The root directory path for the access point, with optional creation permissions for newly created directories.
            tags: An array of key-value pairs to apply to the access point for resource tagging.
    - name: create-file-system
      description: Creates an S3 File System resource scoped to a bucket or prefix within a bucket, enabling file system access to S3 data.
      flags:
        --accept-bucket-warning: Set to true to acknowledge and accept any warnings about the bucket configuration.
        --bucket=!: The Amazon Resource Name (ARN) of the S3 bucket that will be accessible through the file system.
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --client-token=: A unique, case-sensitive identifier that you provide to ensure idempotent creation.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --kms-key-id=: The ARN, key ID, or alias of the KMS key to use for encryption.
        --no-accept-bucket-warning: Set to true to acknowledge and accept any warnings about the bucket configuration.
        --prefix=: An optional prefix within the S3 bucket to scope the file system access.
        --role-arn=!: The ARN of the IAM role that grants the S3 Files service permission to read and write data between the file system and the S3 bucket.
        --tags=:
            description: An array of key-value pairs to apply as tags to the file system resource.
            nargs: -1
      documentation:
        command: Creates an S3 File System resource scoped to a bucket or prefix within a bucket, enabling file system access to S3 data. To create a file system, you need an S3 bucket and an IAM role that grants the service permission to access the bucket.
        flag:
            accept-bucket-warning: Set to true to acknowledge and accept any warnings about the bucket configuration. If not specified, the operation may fail if there are bucket configuration warnings.
            bucket: The Amazon Resource Name (ARN) of the S3 bucket that will be accessible through the file system. The bucket must exist and be in the same Amazon Web Services Region as the file system.
            cli-input-json: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            cli-input-yaml: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            client-token: A unique, case-sensitive identifier that you provide to ensure idempotent creation. Up to 64 ASCII characters are allowed. If you don't specify a client token, the Amazon Web Services SDK automatically generates one.
            generate-cli-skeleton: |-
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            kms-key-id: 'The ARN, key ID, or alias of the KMS key to use for encryption. If not specified, the service uses a service-owned key for encryption. You can specify a KMS key using the following formats: key ID, ARN, key alias, or key alias ARN. If you use `KmsKeyId`, the file system will be encrypted.'
            prefix: An optional prefix within the S3 bucket to scope the file system access. If specified, the file system provides access only to objects with keys that begin with this prefix. If not specified, the file system provides access to the entire bucket.
            role-arn: The ARN of the IAM role that grants the S3 Files service permission to read and write data between the file system and the S3 bucket. This role must have the necessary permissions to access the specified bucket and prefix.
            tags: An array of key-value pairs to apply as tags to the file system resource. Each tag is a user-defined key-value pair. You can use tags to categorize and manage your file systems. Each key must be unique for the resource.
    - name: create-mount-target
      description: Creates a mount target resource as an endpoint for mounting the S3 File System from compute resources in a specific Availability Zone and VPC.
      flags:
        --cli-input-json=: Read arguments from the JSON string provided.
        --cli-input-yaml=: Read arguments from the YAML string provided.
        --file-system-id=!: The ID or Amazon Resource Name (ARN) of the S3 File System to create the mount target for.
        --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
        --ip-address-type=: The IP address type for the mount target.
        --ipv4-address=: A specific IPv4 address to assign to the mount target.
        --ipv6-address=: A specific IPv6 address to assign to the mount target.
        --security-groups=:
            description: An array of VPC security group IDs to associate with the mount target's network interface.
            nargs: -1
        --subnet-id=!: The ID of the subnet where the mount target will be created.
      completion:
        flag:
            ip-address-type:
                - IPV4_ONLY
                - IPV6_ONLY
                - DUAL_STACK
      documentation:
        command: Creates a mount target resource as an endpoint for mounting the S3 File System from compute resources in a specific Availability Zone and VPC. Mount targets provide network access to the file system.
        flag:
            cli-input-json: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            cli-input-yaml: |-
                Reads arguments from the JSON string provided.
                The JSON string follows the  format  provided  by --generate-cli-skeleton.
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
                It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            file-system-id: The ID or Amazon Resource Name (ARN) of the S3 File System to create the mount target for.
            generate-cli-skeleton: |-
                If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
                This may  not  be  specified  along with --cli-input-yaml.
            ip-address-type: The IP address type for the mount target. If not specified, `IPV4_ONLY` is used. The IP address type must match the IP configuration of the specified subnet.
            ipv4-address: A specific IPv4 address to assign to the mount target. If not specified and the IP address type supports IPv4, an address is automatically assigned from the subnet's available IPv4 address range. The address must be within the subnet's CIDR block and not already in use.
            ipv6-address: A specific IPv6 address to assign to the mount target. If not specified and the IP address type supports IPv6, an address is automatically assigned from the subnet's available IPv6 address range. The address must be within the subnet's IPv6 CIDR block and not already in use.
            security-groups: An array of VPC security group IDs to associate with the mount target's network interface. These security groups control network access to the mount target. If not specified, the default security group for the subnet's VPC is used. All security groups must belong to the same VPC as the subnet.
            subnet-id: The ID of the subnet where the mount target will be created. The subnet must be in the same Amazon Web Services Region as the file system. For file systems with regional availability, you can create mount targets in any subnet within the Region. The subnet determines the Availability Zone where the mount target will be located.
