name: reboot-replication-instance
description: Reboots a replication instance.
flags:
    --force-failover=: If this parameter is `true`, the reboot is conducted through a Multi-AZ failover.
    --force-planned-failover=: If this parameter is `true`, the reboot is conducted through a planned Multi-AZ failover where resources are released and cleaned up prior to conducting the failover.
    --replication-instance-arn=!: The Amazon Resource Name (ARN) of the replication instance.
documentation:
    command: Reboots a replication instance. Rebooting results in a momentary outage, until the replication instance becomes available again.
    flag:
        force-failover: If this parameter is `true`, the reboot is conducted through a Multi-AZ failover. If the instance isn't configured for Multi-AZ, then you can't specify `true`. ( `--force-planned-failover` and `--force-failover` can't both be set to `true`.)
        force-planned-failover: If this parameter is `true`, the reboot is conducted through a planned Multi-AZ failover where resources are released and cleaned up prior to conducting the failover. If the instance isn''t configured for Multi-AZ, then you can't specify `true`. ( `--force-planned-failover` and `--force-failover` can't both be set to `true`.)
        replication-instance-arn: The Amazon Resource Name (ARN) of the replication instance.
