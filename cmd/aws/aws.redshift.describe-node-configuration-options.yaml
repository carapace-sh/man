name: describe-node-configuration-options
description: Returns properties of possible node configurations such as node type, number of nodes, and disk usage for the specified action type.
flags:
    --action-type=!: The action type to evaluate for possible node configurations.
    --cluster-identifier=: The identifier of the cluster to evaluate for possible node configurations.
    --filters=: A set of name, operator, and value items to filter the results.
    --marker=: An optional parameter that specifies the starting point to return a set of response records.
    --max-records=: The maximum number of response records to return in each call.
    --owner-account=: The Amazon Web Services account used to create or copy the snapshot.
    --snapshot-arn=: The Amazon Resource Name (ARN) of the snapshot associated with the message to describe node configuration.
    --snapshot-identifier=: The identifier of the snapshot to evaluate for possible node configurations.
completion:
    flag:
        action-type:
            - restore-cluster
            - recommend-node-config
            - resize-cluster
documentation:
    command: Returns properties of possible node configurations such as node type, number of nodes, and disk usage for the specified action type.
    flag:
        action-type: The action type to evaluate for possible node configurations. Specify "restore-cluster" to get configuration combinations based on an existing snapshot. Specify "recommend-node-config" to get configuration recommendations based on an existing cluster or snapshot. Specify "resize-cluster" to get configuration combinations for elastic resize based on an existing cluster.
        cluster-identifier: The identifier of the cluster to evaluate for possible node configurations.
        filters: A set of name, operator, and value items to filter the results.
        marker: An optional parameter that specifies the starting point to return a set of response records. When the results of a [DescribeNodeConfigurationOptions]() request exceed the value specified in `MaxRecords`, Amazon Web Services returns a value in the `Marker` field of the response. You can retrieve the next set of response records by providing the returned marker value in the `Marker` parameter and retrying the request.
        max-records: |-
            The maximum number of response records to return in each call. If the number of remaining response records exceeds the specified `MaxRecords` value, a value is returned in a `marker` field of the response. You can retrieve the next set of records by retrying the command with the returned marker value.

            Default: `500`

            Constraints: minimum 100, maximum 500.
        owner-account: The Amazon Web Services account used to create or copy the snapshot. Required if you are restoring a snapshot you do not own, optional if you own the snapshot.
        snapshot-arn: The Amazon Resource Name (ARN) of the snapshot associated with the message to describe node configuration.
        snapshot-identifier: The identifier of the snapshot to evaluate for possible node configurations.
