name: disable-insight-rules
description: Disables the specified Contributor Insights rules.
flags:
    --rule-names=!: An array of the rule names to disable.
documentation:
    command: Disables the specified Contributor Insights rules. When rules are disabled, they do not analyze log groups and do not incur costs.
    flag:
        rule-names: An array of the rule names to disable. If you need to find out the names of your rules, use [DescribeInsightRules](https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/API_DescribeInsightRules.html).
