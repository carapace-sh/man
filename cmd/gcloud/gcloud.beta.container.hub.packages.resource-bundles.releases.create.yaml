documentation:
    command: '*(BETA)*  Create Package Rollouts Release.'
    flag:
        lifecycle: Lifecycle of the Release.
        location: Google Cloud zone or region.
        no-skip-creating-variant-resources: Whether to opt-in to the alternate variant upload flow.
        resource-bundle: Resource Bundle name.
        skip-creating-variant-resources: Whether to opt-in to the alternate variant upload flow.
        source: |-
            Source file or directory to create the Release from.
                      e.g. ``--source=manifest.yaml'', ``--source=/manifests-dir/''
                      Can optionally be paired with the ``--variants-pattern'' arg to create
                      multiple variants of a Release.
        variants-pattern: |-
            Glob pattern to Variants of the Release, to be paired with the
                    ``--source'' arg.
                    ex: --source=/manifests-dir/ --variants-pattern=```**```,
                        --source=/manifests-dir/ --variants-pattern=us-```*```.yaml,
                        --source=/manifests/dir/ --variants-pattern=```*/*```.yaml
