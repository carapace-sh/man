name: generate-access-logs
description: Returns the website access logs for a specific time range using a presigned URL.
flags:
    --app-id=!: The unique ID for an Amplify app.
    --domain-name=!: The name of the domain.
    --end-time=: The time at which the logs should end.
    --start-time=: The time at which the logs should start.
documentation:
    command: Returns the website access logs for a specific time range using a presigned URL.
    flag:
        app-id: The unique ID for an Amplify app.
        domain-name: The name of the domain.
        end-time: The time at which the logs should end. The time range specified is inclusive of the end time.
        start-time: The time at which the logs should start. The time range specified is inclusive of the start time.
