name: download-named-set
description: '*(ALPHA)*  Download a named set from a Compute Engine router.'
hidden: true
flags:
    --file-format=: Format of the file passed to --file-name.
    --file-name=!: The name of the file to download the named set config to.
    --region=: Region of the router to export.
    --set-name=!: Name of the named set to download.
completion:
    flag:
        file-format:
            - json
            - yaml
documentation:
    command: '*(ALPHA)*  *gcloud alpha compute routers download-named-set* downloads a named set from a Compute Engine router.'
    flag:
        file-format: 'Format of the file passed to --file-name. _FILE_FORMAT_ must be one of: *json*, *yaml*.'
        file-name: The name of the file to download the named set config to.
        region: |-
            Region of the router to export. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        set-name: Name of the named set to download.
