name: remove-route-policy-term
description: Remove a route policy term of a Compute Engine router.
flags:
    --policy-name=!: Name of the route policy from which the term should be removed.
    --priority=!: Order of the term within the policy.
    --region=: Region of the router to remove a route policy term from.
documentation:
    command: |
        *gcloud compute routers remove-route-policy-term* removes a term of a route policy.
    flag:
        policy-name: Name of the route policy from which the term should be removed.
        priority: Order of the term within the policy.
        region: |-
            Region of the router to remove a route policy term from. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
