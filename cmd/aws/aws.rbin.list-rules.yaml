name: list-rules
description: Lists the Recycle Bin retention rules in the Region.
flags:
    --exclude-resource-tags=: \[Region-level retention rules only] Information about the exclusion tags used to identify resources that are to be excluded, or ignored, by the retention rule.
    --lock-state=: The lock state of the retention rules to list.
    --max-results=: The maximum number of results to return with a single call.
    --next-token=: The token for the next page of results.
    --resource-tags=: \[Tag-level retention rules only] Information about the resource tags used to identify resources that are retained by the retention rule.
    --resource-type=!: The resource type retained by the retention rule.
completion:
    flag:
        lock-state:
            - locked
            - pending_unlock
            - unlocked
        resource-type:
            - EBS_SNAPSHOT
            - EC2_IMAGE
documentation:
    command: Lists the Recycle Bin retention rules in the Region.
    flag:
        exclude-resource-tags: \[Region-level retention rules only] Information about the exclusion tags used to identify resources that are to be excluded, or ignored, by the retention rule.
        lock-state: The lock state of the retention rules to list. Only retention rules with the specified lock state are returned.
        max-results: The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned `NextToken` value.
        next-token: The token for the next page of results.
        resource-tags: \[Tag-level retention rules only] Information about the resource tags used to identify resources that are retained by the retention rule.
        resource-type: The resource type retained by the retention rule. Only retention rules that retain the specified resource type are listed. Currently, only Amazon EBS snapshots and EBS-backed AMIs are supported. To list retention rules that retain snapshots, specify `EBS_SNAPSHOT`. To list retention rules that retain EBS-backed AMIs, specify `EC2_IMAGE`.
