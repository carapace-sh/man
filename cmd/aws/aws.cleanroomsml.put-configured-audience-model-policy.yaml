name: put-configured-audience-model-policy
description: Create or update the resource policy for a configured audience model.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configured-audience-model-arn=!: The Amazon Resource Name (ARN) of the configured audience model that the resource policy will govern.
    --configured-audience-model-policy=!: The IAM resource policy.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --policy-existence-condition=: Use this to prevent unexpected concurrent modification of the policy.
    --previous-policy-hash=: A cryptographic hash of the contents of the policy used to prevent unexpected concurrent modification of the policy.
completion:
    flag:
        policy-existence-condition:
            - POLICY_MUST_EXIST
            - POLICY_MUST_NOT_EXIST
documentation:
    command: Create or update the resource policy for a configured audience model.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
