name: update
description: Update an Anthos on VMware admin cluster.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Google Cloud location for the admin_cluster.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --required-platform-version=: Platform version required for upgrading an admin cluster or a user cluster.
documentation:
    command: Update an Anthos on VMware admin cluster.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            Google Cloud location for the admin_cluster.
            +
            To set the `location` attribute:
            * provide the argument `admin_cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_vmware/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        required-platform-version: Platform version required for upgrading an admin cluster or a user cluster. If the current platform version is lower than the required version, the platform version will be updated to the required version. If it is not installed in the platform, download the required version bundle.
