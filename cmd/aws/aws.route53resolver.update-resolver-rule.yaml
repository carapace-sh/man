    command: Updates settings for a specified Resolver rule. `ResolverRuleId` is required, and all other parameters are optional. If you don't specify a parameter, it retains its current value.
    flag:
        config: The new settings for the Resolver rule.
        resolver-rule-id: The ID of the Resolver rule that you want to update.
