name: cancel-automated-reasoning-policy-build-workflow
description: Cancels a running Automated Reasoning policy build workflow.
flags:
    --build-workflow-id=!: The unique identifier of the build workflow to cancel.
    --policy-arn=!: The Amazon Resource Name (ARN) of the Automated Reasoning policy whose build workflow you want to cancel.
documentation:
    command: Cancels a running Automated Reasoning policy build workflow. This stops the policy generation process and prevents further processing of the source documents.
    flag:
        build-workflow-id: The unique identifier of the build workflow to cancel. You can get this ID from the StartAutomatedReasoningPolicyBuildWorkflow response or by listing build workflows.
        policy-arn: The Amazon Resource Name (ARN) of the Automated Reasoning policy whose build workflow you want to cancel.
