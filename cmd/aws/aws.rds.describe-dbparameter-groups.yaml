name: describe-dbparameter-groups
description: Returns a list of `DBParameterGroup` descriptions.
flags:
    --dbparameter-group-name=: The name of a specific DB parameter group to return details for.
    --filters=: This parameter isn't currently supported.
    --marker=: An optional pagination token provided by a previous `DescribeDBParameterGroups` request.
    --max-records=: The maximum number of records to include in the response.
documentation:
    command: Returns a list of `DBParameterGroup` descriptions. If a `DBParameterGroupName` is specified, the list will contain only the description of the specified DB parameter group.
    flag:
        dbparameter-group-name: |-
            The name of a specific DB parameter group to return details for.

            Constraints:

            - If supplied, must match the name of an existing DBClusterParameterGroup.
        filters: This parameter isn't currently supported.
        marker: An optional pagination token provided by a previous `DescribeDBParameterGroups` request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that you can retrieve the remaining results.

            Default: 100

            Constraints: Minimum 20, maximum 100.
