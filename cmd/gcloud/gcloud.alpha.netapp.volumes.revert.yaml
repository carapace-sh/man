name: revert
description: '*(ALPHA)*  Revert a Cloud NetApp Volume back to a specified Snapshot.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location of the volume.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --snapshot=!: ID of the snapshot or fully qualified identifier for the snapshot.
documentation:
    command: |
        *(ALPHA)*  Revert a Cloud NetApp Volume back to a specified source Snapshot
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location of the volume.
            +
            To set the `location` attribute:
            * provide the argument `volume` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        snapshot: |-
            ID of the snapshot or fully qualified identifier for the snapshot.
            +
            To set the `snapshot` attribute:
            * provide the argument `--snapshot` on the command line.
