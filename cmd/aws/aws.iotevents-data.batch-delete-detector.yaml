name: batch-delete-detector
description: Deletes one or more detectors that were created.
flags:
    --detectors=!: The list of one or more detectors to be deleted.
documentation:
    command: Deletes one or more detectors that were created. When a detector is deleted, its state will be cleared and the detector will be removed from the list of detectors. The deleted detector will no longer appear if referenced in the [ListDetectors](https://docs.aws.amazon.com/iotevents/latest/apireference/API_iotevents-data_ListDetectors.html) API call.
    flag:
        detectors: The list of one or more detectors to be deleted.
