name: list-app-assessments
description: Lists the assessments for an Resilience Hub application.
flags:
    --app-arn=: Amazon Resource Name (ARN) of the Resilience Hub application.
    --assessment-name=: The name for the assessment.
    --assessment-status=: The current status of the assessment for the resiliency policy.
    --compliance-status=: The current status of compliance for the resiliency policy.
    --invoker=: Specifies the entity that invoked a specific assessment, either a `User` or the `System`.
    --max-results=: Maximum number of results to include in the response.
    --next-token=: Null, or the token from a previous call to get the next set of results.
    --reverse-order=: The default is to sort by ascending **startTime**.
completion:
    flag:
        compliance-status:
            - PolicyBreached
            - PolicyMet
            - NotApplicable
            - MissingPolicy
        invoker:
            - User
            - System
documentation:
    command: Lists the assessments for an Resilience Hub application. You can use request parameters to refine the results for the response object.
    flag:
        app-arn: 'Amazon Resource Name (ARN) of the Resilience Hub application. The format for this ARN is: arn:`partition`:resiliencehub:`region`:`account`:app/`app-id`. For more information about ARNs, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference* guide.'
        assessment-name: The name for the assessment.
        assessment-status: The current status of the assessment for the resiliency policy.
        compliance-status: The current status of compliance for the resiliency policy.
        invoker: Specifies the entity that invoked a specific assessment, either a `User` or the `System`.
        max-results: Maximum number of results to include in the response. If more results exist than the specified `MaxResults` value, a token is included in the response so that the remaining results can be retrieved.
        next-token: Null, or the token from a previous call to get the next set of results.
        reverse-order: The default is to sort by ascending **startTime**. To sort by descending **startTime**, set reverseOrder to `true`.
