name: create-backup
description: '*(BETA)*  Create a backup of a Redis cluster.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --backup-id=: The ID of the backup.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: The name of the Redis region of the cluster.
    --ttl=: The time to live for the backup.
documentation:
    command: |
        *(BETA)*  Create a backup of a Redis cluster. The backup can be used to seed a new cluster or
        exported to a Google Cloud Storage bucket.

        The created backup will be added into the backup collection associated with the cluster.
        Describe the cluster to get the backup collection name.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        backup-id: The ID of the backup.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            The name of the Redis region of the cluster. Overrides the default
            redis/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `redis/region`.
        ttl: |-
            The time to live for the backup. The backup will be deleted automatically after the TTL
            is reached. For example, "10d" for 10 days. The minimum value is 1 day. If not specified, the
            default value is 100 years.
