name: stop-contact-recording
description: Stops recording a call when a contact is being recorded.
flags:
    --contact-id=!: The identifier of the contact.
    --contact-recording-type=: The type of recording being operated on.
    --initial-contact-id=!: The identifier of the contact.
    --instance-id=!: The identifier of the Amazon Connect instance.
completion:
    flag:
        contact-recording-type:
            - AGENT
            - IVR
            - SCREEN
documentation:
    command: |-
        Stops recording a call when a contact is being recorded. StopContactRecording is a one-time action. If you use StopContactRecording to stop recording an ongoing call, you can't use StartContactRecording to restart it. For scenarios where the recording has started and you want to suspend it for sensitive information (for example, to collect a credit card number), and then restart it, use SuspendContactRecording and ResumeContactRecording.

        Only voice recordings are supported at this time.
    flag:
        contact-id: The identifier of the contact.
        contact-recording-type: The type of recording being operated on.
        initial-contact-id: The identifier of the contact. This is the identifier of the contact associated with the first interaction with the contact center.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
