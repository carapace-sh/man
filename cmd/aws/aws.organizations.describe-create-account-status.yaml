name: describe-create-account-status
description: Retrieves the current status of an asynchronous request to create an account.
flags:
    --create-account-request-id=!: Specifies the `Id` value that uniquely identifies the `CreateAccount` request.
documentation:
    command: |-
        Retrieves the current status of an asynchronous request to create an account.

        This operation can be called only from the organization's management account or by a member account that is a delegated administrator.
    flag:
        create-account-request-id: |-
            Specifies the `Id` value that uniquely identifies the `CreateAccount` request. You can get the value from the `CreateAccountStatus.Id` response in an earlier [CreateAccount]() request, or from the [ListCreateAccountStatus]() operation.

            The [regex pattern](http://wikipedia.org/wiki/regex) for a create account request ID string requires "car-" followed by from 8 to 32 lowercase letters or digits.
