name: untag-resource
description: Removes tags from the resource.
flags:
    --resource-arn=!: The ARN of the resource.
    --tag-keys=!: A list of keys.
documentation:
    command: |-
        Removes tags from the resource.

        **Required permissions:** `rolesanywhere:UntagResource`.
    flag:
        resource-arn: The ARN of the resource.
        tag-keys: A list of keys. Tag keys are the unique identifiers of tags.
