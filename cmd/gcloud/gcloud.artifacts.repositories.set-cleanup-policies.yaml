name: set-cleanup-policies
description: Set or update cleanup policies for an Artifact Registry repository.
flags:
    --dry-run: Disable deleting images according to cleanup policies.
    --location=: Location of the repository.
    --no-dry-run&: Disable deleting images according to cleanup policies.
    --overwrite=&: (REMOVED) Delete existing policies and replace with the specified set of policies.
    --policy=: Path to a local JSON formatted file containing valid cleanup policies.
documentation:
    command: |
        Set or update cleanup policies for an Artifact Registry repository.

        This command can fail for the following reasons:
          * The given repository does not exist.
          * The active account does not have permission to update repositories.
          * A valid cleanup policy format was not provided.
          * The repository exceeds the maximum number of cleanup policies.

        See https://cloud.google.com/artifact-registry/docs/repositories/cleanup-policy
        for details of the cleanup policy file format and contents.
    flag:
        dry-run: Disable deleting images according to cleanup policies.
        location: |-
            Location of the repository. Overrides the default artifacts/location property value
            for this command invocation. To configure the default location, use the command:
            gcloud config set artifacts/location.
            +

            To set the `location` attribute:
            * provide the argument `repository` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `artifacts/location`.
        no-dry-run: |
            Disable deleting images according to cleanup policies.
        overwrite: |-
            (REMOVED) Delete existing policies and replace with the specified set of policies.
            +
            Flag --overwrite is obsolete and should be omitted.
        policy: Path to a local JSON formatted file containing valid cleanup policies.
