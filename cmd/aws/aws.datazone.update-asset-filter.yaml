name: update-asset-filter
description: Updates an asset filter.
flags:
    --asset-identifier=!: The ID of the data asset.
    --configuration=: The configuration of the asset filter.
    --description=: The description of the asset filter.
    --domain-identifier=!: The ID of the domain where you want to update an asset filter.
    --identifier=!: The ID of the asset filter.
    --name=: The name of the asset filter.
documentation:
    command: |-
        Updates an asset filter.

        Prerequisites:

        - The domain, asset, and asset filter identifier must all exist.
        - The asset must contain the columns being referenced in the update.
        - If applying a row filter, ensure the column referenced in the expression exists in the asset schema.
    flag:
        asset-identifier: The ID of the data asset.
        configuration: The configuration of the asset filter.
        description: The description of the asset filter.
        domain-identifier: The ID of the domain where you want to update an asset filter.
        identifier: The ID of the asset filter.
        name: The name of the asset filter.
