documentation:
    command: |
        *(BETA)*  Updates Firebase Data Connect service connector.
    flag:
        add-source-files: |-
            Add new value to source_files list. The files that comprise the source set.
            +
            *contentFromFile*:::
            The file's textual content. Use a full or relative path to a local file containing the value of contentFromFile.
            +
            *path*:::
            The file name including folder path, if applicable. The path should be
            relative to a local workspace (e.g. dataconnect/(schema|connector)/*.gql)
            and not an absolute path (e.g. /absolute/path/(schema|connector)/*.gql).
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --add-source-files=contentFromFile=path_to_file,path=string --add-source-files=contentFromFile=path_to_file,path=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --add-source-files='[{"contentFromFile": path_to_file, "path": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --add-source-files=path_to_file.(yaml|json)
            +
            ```
        allow-missing: |-
            If true and the Connector is not found, a new Connector will be
            created. In this case, `update_mask` is ignored. Use *--allow-missing* to enable and *--no-allow-missing* to disable.
        annotations: |-
            Set annotations to new value. Stores small amounts of arbitrary data.
            +
            *KEY*:::
            Sets `KEY` value.
            +
            *VALUE*:::
            Sets `VALUE` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --annotations=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --annotations='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --annotations=path_to_file.(yaml|json)
            +
            ```
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        clear-annotations: Clear annotations value and set to empty map.
        clear-labels: Clear labels value and set to empty map.
        clear-source: Set connector.source back to default value.
        clear-source-files: Clear source_files value and set to empty list.
        display-name: Mutable human-readable name. 63 character limit.
        labels: |-
            Set labels to new value. Labels as key value pairs.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: |-
            The location id of the connector resource.
            +
            To set the `location` attribute:
            * provide the argument `connector` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-allow-missing: |-
            If true and the Connector is not found, a new Connector will be
            created. In this case, `update_mask` is ignored.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-annotations: Clear annotations value and set to empty map.
        no-clear-labels: Clear labels value and set to empty map.
        no-clear-source: Set connector.source back to default value.
        no-clear-source-files: Clear source_files value and set to empty list.
        no-validate-only: |-
            If set, validate the request and preview the Connector, but do not
            actually update it.
        remove-annotations: |-
            Remove existing value from map annotations. Sets `remove_annotations` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-annotations=string,string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-annotations=["string"]
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-annotations=path_to_file.(yaml|json)
            +
            ```
        remove-labels: |-
            Remove existing value from map labels. Sets `remove_labels` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-labels=string,string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-labels=["string"]
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-labels=path_to_file.(yaml|json)
            +
            ```
        remove-source-files: |-
            Remove existing value from source_files list. The files that comprise the source set.
            +
            *contentFromFile*:::
            The file's textual content. Use a full or relative path to a local file containing the value of contentFromFile.
            +
            *path*:::
            The file name including folder path, if applicable. The path should be
            relative to a local workspace (e.g. dataconnect/(schema|connector)/*.gql)
            and not an absolute path (e.g. /absolute/path/(schema|connector)/*.gql).
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-source-files=contentFromFile=path_to_file,path=string --remove-source-files=contentFromFile=path_to_file,path=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-source-files='[{"contentFromFile": path_to_file, "path": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-source-files=path_to_file.(yaml|json)
            +
            ```
        request-id: |-
            An optional request ID to identify requests. Specify a unique request ID
            so that if you must retry your request, the server will know to ignore
            the request if it has already been completed. The server will guarantee
            that for at least 60 minutes since the first request.
            +
            For example, consider a situation where you make an initial request and the
            request times out. If you make the request again with the same request
            ID, the server can check if original operation with the same request ID
            was received, and if so, will ignore the second request. This prevents
            clients from accidentally creating duplicate commitments.
            +
            The request ID must be a valid UUID with the exception that zero UUID is
            not supported (00000000-0000-0000-0000-000000000000).
        service: |-
            The service id of the connector resource.
            +
            To set the `service` attribute:
            * provide the argument `connector` on the command line with a fully specified name;
            * provide the argument `--service` on the command line.
        source-files: |-
            Set source_files to new value. The files that comprise the source set.
            +
            *contentFromFile*:::
            The file's textual content. Use a full or relative path to a local file containing the value of contentFromFile.
            +
            *path*:::
            The file name including folder path, if applicable. The path should be
            relative to a local workspace (e.g. dataconnect/(schema|connector)/*.gql)
            and not an absolute path (e.g. /absolute/path/(schema|connector)/*.gql).
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --source-files=contentFromFile=path_to_file,path=string --source-files=contentFromFile=path_to_file,path=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --source-files='[{"contentFromFile": path_to_file, "path": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --source-files=path_to_file.(yaml|json)
            +
            ```
        update-annotations: |-
            Update annotations value or add key value pair. Stores small amounts of arbitrary data.
            +
            *KEY*:::
            Sets `KEY` value.
            +
            *VALUE*:::
            Sets `VALUE` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --update-annotations=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --update-annotations='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --update-annotations=path_to_file.(yaml|json)
            +
            ```
        update-labels: |-
            Update labels value or add key value pair. Labels as key value pairs.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --update-labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --update-labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --update-labels=path_to_file.(yaml|json)
            +
            ```
        validate-only: |-
            If set, validate the request and preview the Connector, but do not
            actually update it. Use *--validate-only* to enable and *--no-validate-only* to disable.
