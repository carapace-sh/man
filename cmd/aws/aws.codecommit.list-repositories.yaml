name: list-repositories
description: Gets information about one or more repositories.
flags:
    --next-token=: An enumeration token that allows the operation to batch the results of the operation.
    --order=: The order in which to sort the results of a list repositories operation.
    --sort-by=: The criteria used to sort the results of a list repositories operation.
completion:
    flag:
        order:
            - ascending
            - descending
        sort-by:
            - repositoryName
            - lastModifiedDate
documentation:
    command: Gets information about one or more repositories.
    flag:
        next-token: An enumeration token that allows the operation to batch the results of the operation. Batch sizes are 1,000 for list repository operations. When the client sends the token back to CodeCommit, another page of 1,000 records is retrieved.
        order: The order in which to sort the results of a list repositories operation.
        sort-by: The criteria used to sort the results of a list repositories operation.
