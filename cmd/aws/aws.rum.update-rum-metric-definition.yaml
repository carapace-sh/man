name: update-rum-metric-definition
description: Modifies one existing metric definition for CloudWatch RUM extended metrics.
flags:
    --app-monitor-name=!: The name of the CloudWatch RUM app monitor that sends these metrics.
    --destination-arn=: This parameter is required if `Destination` is `Evidently`.
    --destination=!: The destination to send the metrics to.
    --metric-definition-id=!: The ID of the metric definition to update.
    --metric-definition=!: A structure that contains the new definition that you want to use for this metric.
completion:
    flag:
        destination:
            - CloudWatch
            - Evidently
documentation:
    command: Modifies one existing metric definition for CloudWatch RUM extended metrics. For more information about extended metrics, see [BatchCreateRumMetricsDefinitions](https://docs.aws.amazon.com/cloudwatchrum/latest/APIReference/API_BatchCreateRumMetricsDefinitions.html).
    flag:
        app-monitor-name: The name of the CloudWatch RUM app monitor that sends these metrics.
        destination: The destination to send the metrics to. Valid values are `CloudWatch` and `Evidently`. If you specify `Evidently`, you must also specify the ARN of the CloudWatchEvidently experiment that will receive the metrics and an IAM role that has permission to write to the experiment.
        destination-arn: |-
            This parameter is required if `Destination` is `Evidently`. If `Destination` is `CloudWatch`, do not use this parameter.

            This parameter specifies the ARN of the Evidently experiment that is to receive the metrics. You must have already defined this experiment as a valid destination. For more information, see [PutRumMetricsDestination](https://docs.aws.amazon.com/cloudwatchrum/latest/APIReference/API_PutRumMetricsDestination.html).
        metric-definition: A structure that contains the new definition that you want to use for this metric.
        metric-definition-id: The ID of the metric definition to update.
