name: modify-ipam-policy-allocation-rules
description: Modifies the allocation rules in an IPAM policy.
flags:
    --allocation-rules=: The new allocation rules to apply to the IPAM policy.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ipam-policy-id=!: The ID of the IPAM policy whose allocation rules you want to modify.
    --locale=!: The locale for which to modify the allocation rules.
    --no-dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --resource-type=!: The resource type for which to modify the allocation rules.
completion:
    flag:
        resource-type:
            - alb
            - eip
            - rds
            - rnat
documentation:
    command: |-
        Modifies the allocation rules in an IPAM policy.

        An IPAM policy is a set of rules that define how public IPv4 addresses from IPAM pools are allocated to Amazon Web Services resources. Each rule maps an Amazon Web Services service to IPAM pools that the service will use to get IP addresses. A single policy can have multiple rules and be applied to multiple Amazon Web Services Regions. If the IPAM pool run out of addresses then the services fallback to Amazon-provided IP addresses. A policy can be applied to an individual Amazon Web Services account or an entity within Amazon Web Services Organizations.

        Allocation rules are optional configurations within an IPAM policy that map Amazon Web Services resource types to specific IPAM pools. If no rules are defined, the resource types default to using Amazon-provided IP addresses.
