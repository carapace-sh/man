name: decapsulate
description: '*(ALPHA)*  Decapsulate an input file using a key-encapsulation key version.'
flags:
    --ciphertext-file=!: File path of the ciphertext file to decapsulate.
    --key=: to use for decapsulation.
    --keyring=: Key ring of the key.
    --location=: Location of the keyring.
    --no-skip-integrity-verification&: Skip integrity verification on request and response API fields.
    --shared-secret-file=!: File path of the shared secret file to output.
    --skip-integrity-verification: Skip integrity verification on request and response API fields.
documentation:
    command: |-
        *(ALPHA)*  Decapsulates the given ciphertext file using the provided key-encapsulation
        key version and saves the decapsulated shared secret to the shared secret file.

        By default, the command performs integrity verification on data sent to and
        received from Cloud KMS. Use `--skip-integrity-verification` to disable
        integrity verification.

        ## EXAMPLES
        The following command will read the file '/tmp/my/secret.file.enc', decapsulate it
        using the key encapsulation CryptoKey `my-key` Version 3 and write the shared secret
        to '/tmp/my/secret.file.dec'.

          $ gcloud alpha kms decapsulate \
          --location=us-central1 \
          --keyring=my-keyring \
          --key=my-key \
          --version=3 \
          --ciphertext-file=/tmp/my/secret.file.enc \
          --shared-secret-file=/tmp/my/secret.file.dec
    flag:
        ciphertext-file: File path of the ciphertext file to decapsulate.
        key: to use for decapsulation.
        keyring: Key ring of the key.
        location: Location of the keyring.
        no-skip-integrity-verification: Skip integrity verification on request and response API fields.
        shared-secret-file: File path of the shared secret file to output.
        skip-integrity-verification: Skip integrity verification on request and response API fields.
