    --add-acl-grant=: Key-value pairs mirroring the JSON accepted by your cloud provider.
    --add-default-object-acl-grant=: Adds default object ACL grant.
    --additional-headers=: Includes arbitrary headers in storage API calls.
    --autoclass-terminal-storage-class=: The storage class that objects in the bucket eventually transition to if they are not read for a certain length of time.
    --canned-acl=: Applies predefined, or "canned," ACLs to a resource.
