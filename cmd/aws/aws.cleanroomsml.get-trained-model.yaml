name: get-trained-model
description: Returns information about a trained model.
flags:
    --membership-identifier=!: The membership ID of the member that created the trained model that you are interested in.
    --trained-model-arn=!: The Amazon Resource Name (ARN) of the trained model that you are interested in.
    --version-identifier=: The version identifier of the trained model to retrieve.
documentation:
    command: Returns information about a trained model.
    flag:
        membership-identifier: The membership ID of the member that created the trained model that you are interested in.
        trained-model-arn: The Amazon Resource Name (ARN) of the trained model that you are interested in.
        version-identifier: The version identifier of the trained model to retrieve. If not specified, the operation returns information about the latest version of the trained model.
