name: create
description: '*(BETA)*  Create a new gateway advertised route.'
flags:
    --advertise-to-hub: The gateway should advertise this route toward the hub.
    --async: Return immediately, without waiting for the operation in progress to
    --description=: Description of the advertised route to be created.
    --ip-range=!: Advertise this IP range.
    --labels=: List of label KEY=VALUE pairs to add.
    --no-advertise-to-hub&: The gateway should advertise this route toward the hub.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --priority=: This route's priority.
    --region=: The location Id.
    --spoke=: Id of the spoke.
documentation:
    command: '*(BETA)*  Create a new gateway advertised route with the given name.'
    flag:
        advertise-to-hub: The gateway should advertise this route toward the hub.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: Description of the advertised route to be created.
        ip-range: Advertise this IP range.
        labels: List of label KEY=VALUE pairs to add.
        no-advertise-to-hub: The gateway should advertise this route toward the hub.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        priority: This route's priority. Must be between 0 and 65335.
        region: |-
            The location Id.
            +

            To set the `region` attribute:
            * provide the argument `gateway_advertised_route` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
        spoke: |-
            Id of the spoke.
            +
            To set the `spoke` attribute:
            * provide the argument `gateway_advertised_route` on the command line with a fully specified name;
            * provide the argument `--spoke` on the command line.
