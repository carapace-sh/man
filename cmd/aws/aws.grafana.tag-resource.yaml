name: tag-resource
description: The `TagResource` operation associates tags with an Amazon Managed Grafana resource.
flags:
    --resource-arn=!: The ARN of the resource the tag is associated with.
    --tags=!: The list of tag keys and values to associate with the resource.
documentation:
    command: |-
        The `TagResource` operation associates tags with an Amazon Managed Grafana resource. Currently, the only resource that can be tagged is workspaces.

        If you specify a new tag key for the resource, this tag is appended to the list of tags associated with the resource. If you specify a tag key that is already associated with the resource, the new tag value that you specify replaces the previous value for that tag.
    flag:
        resource-arn: The ARN of the resource the tag is associated with.
        tags: The list of tag keys and values to associate with the resource. You can associate tag keys only, tags (key and values) only or a combination of tag keys and tags.
