name: tag-resource
description: Associates the specified tags to a resource with the specified `resourceArn`.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource to add tags to.
    --tags=!: The tags to add to the resource.
documentation:
    command: Associates the specified tags to a resource with the specified `resourceArn`. If existing tags on a resource aren't specified in the request parameters, they aren't changed. When a resource is deleted, the tags associated with that resource are also deleted.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource to add tags to.
        tags: The tags to add to the resource. A tag is an array of key-value pairs. Tag keys can have a maximum character length of 128 characters, and tag values can have a maximum length of 256 characters.
