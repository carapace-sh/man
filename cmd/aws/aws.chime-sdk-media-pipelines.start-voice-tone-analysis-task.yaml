name: start-voice-tone-analysis-task
description: Starts a voice tone analysis task.
flags:
    --client-request-token=: The unique identifier for the client request.
    --identifier=!: The unique identifier of the resource to be updated.
    --kinesis-video-stream-source-task-configuration=: The task configuration for the Kinesis video stream source of the media insights pipeline.
    --language-code=!: The language code.
completion:
    flag:
        language-code:
            - en-US
documentation:
    command: |-
        Starts a voice tone analysis task. For more information about voice tone analysis, see [Using Amazon Chime SDK voice analytics](https://docs.aws.amazon.com/chime-sdk/latest/dg/voice-analytics.html) in the *Amazon Chime SDK Developer Guide*.

        Before starting any voice tone analysis tasks, you must provide all notices and obtain all consents from the speaker as required under applicable privacy and biometrics laws, and as required under the [AWS service terms](https://aws.amazon.com/service-terms/) for the Amazon Chime SDK.
    flag:
        client-request-token: The unique identifier for the client request. Use a different token for different voice tone analysis tasks.
        identifier: The unique identifier of the resource to be updated. Valid values include the ID and ARN of the media insights pipeline.
        kinesis-video-stream-source-task-configuration: The task configuration for the Kinesis video stream source of the media insights pipeline.
        language-code: The language code.
