name: describe-dashboard-snapshot-job-result
description: Describes the result of an existing snapshot job that has finished running.
flags:
    --aws-account-id=!: The ID of the Amazon Web Services account that the dashboard snapshot job is executed in.
    --dashboard-id=!: The ID of the dashboard that you have started a snapshot job for.
    --snapshot-job-id=!: The ID of the job to be described.
documentation:
    command: |-
        Describes the result of an existing snapshot job that has finished running.

        A finished snapshot job will return a `COMPLETED` or `FAILED` status when you poll the job with a `DescribeDashboardSnapshotJob` API call.

        If the job has not finished running, this operation returns a message that says `Dashboard Snapshot Job with id <SnapshotjobId> has not reached a terminal state.`.
    flag:
        aws-account-id: The ID of the Amazon Web Services account that the dashboard snapshot job is executed in.
        dashboard-id: The ID of the dashboard that you have started a snapshot job for.
        snapshot-job-id: The ID of the job to be described. The job ID is set when you start a new job with a `StartDashboardSnapshotJob` API call.
