name: generate-query
description: Generates an SQL query from a natural language query.
flags:
    --query-generation-input=!: Specifies information about a natural language query to transform into SQL.
    --transformation-configuration=!: Specifies configurations for transforming the natural language query into SQL.
documentation:
    command: Generates an SQL query from a natural language query. For more information, see [Generate a query for structured data](https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-generate-query.html) in the Amazon Bedrock User Guide.
    flag:
        query-generation-input: Specifies information about a natural language query to transform into SQL.
        transformation-configuration: Specifies configurations for transforming the natural language query into SQL.
