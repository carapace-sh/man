name: describe-template-definition
description: Provides a detailed description of the definition of a template.
flags:
    --alias-name=: The alias of the template that you want to describe.
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the template.
    --template-id=!: The ID of the template that you're describing.
    --version-number=: The version number of the template.
documentation:
    command: |-
        Provides a detailed description of the definition of a template.

        If you do not need to know details about the content of a template, for instance if you are trying to check the status of a recently created or updated template, use the [`DescribeTemplate`](https://docs.aws.amazon.com/quicksight/latest/APIReference/API_DescribeTemplate.html) instead.
    flag:
        alias-name: The alias of the template that you want to describe. If you name a specific alias, you describe the version that the alias points to. You can specify the latest version of the template by providing the keyword `$LATEST` in the `AliasName` parameter. The keyword `$PUBLISHED` doesn't apply to templates.
        aws-account-id: The ID of the Amazon Web Services account that contains the template. You must be using the Amazon Web Services account that the template is in.
        template-id: The ID of the template that you're describing.
        version-number: The version number of the template.
