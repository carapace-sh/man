name: update-resolver
description: Updates a `Resolver` object.
flags:
    --api-id=!: The API ID.
    --caching-config=: The caching configuration for the resolver.
    --code=: The `resolver` code that contains the request and response functions.
    --data-source-name=: The new data source name.
    --field-name=!: The new field name.
    --kind=: The resolver type.
    --max-batch-size=: The maximum batching size for a resolver.
    --metrics-config=: Enables or disables enhanced resolver metrics for specified resolvers.
    --pipeline-config=: The `PipelineConfig`.
    --request-mapping-template=: The new request mapping template.
    --response-mapping-template=: The new response mapping template.
    --runtime=: ""
    --sync-config=: The `SyncConfig` for a resolver attached to a versioned data source.
    --type-name=!: The new type name.
completion:
    flag:
        kind:
            - UNIT
            - PIPELINE
        metrics-config:
            - ENABLED
            - DISABLED
documentation:
    command: Updates a `Resolver` object.
    flag:
        api-id: The API ID.
        caching-config: The caching configuration for the resolver.
        code: The `resolver` code that contains the request and response functions. When code is used, the `runtime` is required. The `runtime` value must be `APPSYNC_JS`.
        data-source-name: The new data source name.
        field-name: The new field name.
        kind: |-
            The resolver type.

            - **UNIT**: A UNIT resolver type. A UNIT resolver is the default resolver type. You can use a UNIT resolver to run a GraphQL query against a single data source.
            - **PIPELINE**: A PIPELINE resolver type. You can use a PIPELINE resolver to invoke a series of `Function` objects in a serial manner. You can use a pipeline resolver to run a GraphQL query against multiple data sources.
        max-batch-size: The maximum batching size for a resolver.
        metrics-config: |-
            Enables or disables enhanced resolver metrics for specified resolvers. Note that `metricsConfig` won't be used unless the `resolverLevelMetricsBehavior` value is set to `PER_RESOLVER_METRICS`. If the `resolverLevelMetricsBehavior` is set to `FULL_REQUEST_RESOLVER_METRICS` instead, `metricsConfig` will be ignored. However, you can still set its value.

            `metricsConfig` can be `ENABLED` or `DISABLED`.
        pipeline-config: The `PipelineConfig`.
        request-mapping-template: |-
            The new request mapping template.

            A resolver uses a request mapping template to convert a GraphQL expression into a format that a data source can understand. Mapping templates are written in Apache Velocity Template Language (VTL).

            VTL request mapping templates are optional when using an Lambda data source. For all other data sources, VTL request and response mapping templates are required.
        response-mapping-template: The new response mapping template.
        runtime: ""
        sync-config: The `SyncConfig` for a resolver attached to a versioned data source.
        type-name: The new type name.
