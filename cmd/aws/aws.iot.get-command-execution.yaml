name: get-command-execution
description: Gets information about the specific command execution on a single device.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --execution-id=!: The unique identifier for the command execution.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --include-result: Can be used to specify whether to include the result of the command execution in the `GetCommandExecution` API response.
    --no-include-result: Can be used to specify whether to include the result of the command execution in the `GetCommandExecution` API response.
    --target-arn=!: The Amazon Resource Number (ARN) of the device on which the command execution is being performed.
documentation:
    command: Gets information about the specific command execution on a single device.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        execution-id: The unique identifier for the command execution. This information is returned as a response of the `StartCommandExecution` API request.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        include-result: Can be used to specify whether to include the result of the command execution in the `GetCommandExecution` API response. Your device can use this field to provide additional information about the command execution. You only need to specify this field when using the `AWS-IoT` namespace.
        target-arn: The Amazon Resource Number (ARN) of the device on which the command execution is being performed.
