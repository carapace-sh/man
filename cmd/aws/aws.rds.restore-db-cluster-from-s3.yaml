name: restore-db-cluster-from-s3
description: Creates an Amazon Aurora DB cluster from MySQL data stored in an Amazon S3 bucket.
flags:
    --availability-zones=:
        description: A list of Availability Zones (AZs) where instances in the restored DB cluster can be created.
        nargs: -1
    --backtrack-window=: The target backtrack window, in seconds.
    --backup-retention-period=: The number of days for which automated backups of the restored DB cluster are retained.
    --character-set-name=: A value that indicates that the restored DB cluster should be associated with the specified CharacterSet.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --copy-tags-to-snapshot: Specifies whether to copy all tags from the restored DB cluster to snapshots of the restored DB cluster.
    --database-name=: The database name for the restored DB cluster.
    --db-cluster-identifier=!: The name of the DB cluster to create from the source data in the Amazon S3 bucket.
    --db-cluster-parameter-group-name=: The name of the DB cluster parameter group to associate with the restored DB cluster.
    --db-subnet-group-name=: A DB subnet group to associate with the restored DB cluster.
    --deletion-protection: Specifies whether to enable deletion protection for the DB cluster.
    --domain-iam-role-name=: Specify the name of the IAM role to be used when making API calls to the Directory Service.
    --domain=: Specify the Active Directory directory ID to restore the DB cluster in.
    --enable-cloudwatch-logs-exports=:
        description: The list of logs that the restored DB cluster is to export to CloudWatch Logs.
        nargs: -1
    --enable-iam-database-authentication: Specifies whether to enable mapping of Amazon Web Services Identity and Access Management (IAM) accounts to database accounts.
    --engine-lifecycle-support=: The life cycle type for this DB cluster.
    --engine-version=: The version number of the database engine to use.
    --engine=!: The name of the database engine to be used for this DB cluster.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --kms-key-id=: The Amazon Web Services KMS key identifier for an encrypted DB cluster.
    --manage-master-user-password: Specifies whether to manage the master user password with Amazon Web Services Secrets Manager.
    --master-user-password=: The password for the master database user.
    --master-user-secret-kms-key-id=: The Amazon Web Services KMS key identifier to encrypt a secret that is automatically generated and managed in Amazon Web Services Secrets Manager.
    --master-username=!: The name of the master user for the restored DB cluster.
    --network-type=: The network type of the DB cluster.
    --no-copy-tags-to-snapshot: Specifies whether to copy all tags from the restored DB cluster to snapshots of the restored DB cluster.
    --no-deletion-protection: Specifies whether to enable deletion protection for the DB cluster.
    --no-enable-iam-database-authentication: Specifies whether to enable mapping of Amazon Web Services Identity and Access Management (IAM) accounts to database accounts.
    --no-manage-master-user-password: Specifies whether to manage the master user password with Amazon Web Services Secrets Manager.
    --no-storage-encrypted: Specifies whether the restored DB cluster is encrypted.
    --option-group-name=: A value that indicates that the restored DB cluster should be associated with the specified option group.
    --port=: The port number on which the instances in the restored DB cluster accept connections.
    --preferred-backup-window=: The daily time range during which automated backups are created if automated backups are enabled using the `BackupRetentionPeriod` parameter.
    --preferred-maintenance-window=: The weekly time range during which system maintenance can occur, in Universal Coordinated Time (UTC).
    --s3-bucket-name=!: The name of the Amazon S3 bucket that contains the data used to create the Amazon Aurora DB cluster.
    --s3-ingestion-role-arn=!: The Amazon Resource Name (ARN) of the Amazon Web Services Identity and Access Management (IAM) role that authorizes Amazon RDS to access the Amazon S3 bucket on your behalf.
    --s3-prefix=: The prefix for all of the file names that contain the data used to create the Amazon Aurora DB cluster.
    --serverless-v2-scaling-configuration=: ""
    --source-engine-version=!: The version of the database that the backup files were created from.
    --source-engine=!: The identifier for the database engine that was backed up to create the files stored in the Amazon S3 bucket.
    --storage-encrypted: Specifies whether the restored DB cluster is encrypted.
    --storage-type=: Specifies the storage type to be associated with the DB cluster.
    --tags=:
        nargs: -1
    --vpc-security-group-ids=:
        description: A list of EC2 VPC security groups to associate with the restored DB cluster.
        nargs: -1
documentation:
    command: |-
        Creates an Amazon Aurora DB cluster from MySQL data stored in an Amazon S3 bucket. Amazon RDS must be authorized to access the Amazon S3 bucket and the data must be created using the Percona XtraBackup utility as described in [Migrating Data from MySQL by Using an Amazon S3 Bucket](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraMySQL.Migrating.ExtMySQL.html#AuroraMySQL.Migrating.ExtMySQL.S3) in the *Amazon Aurora User Guide*.

        This operation only restores the DB cluster, not the DB instances for that DB cluster. You must invoke the `CreateDBInstance` operation to create DB instances for the restored DB cluster, specifying the identifier of the restored DB cluster in `DBClusterIdentifier`. You can create DB instances only after the `RestoreDBClusterFromS3` operation has completed and the DB cluster is available.

        For more information on Amazon Aurora, see [What is Amazon Aurora?](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_AuroraOverview.html) in the *Amazon Aurora User Guide*.

        This operation only applies to Aurora DB clusters. The source DB engine must be MySQL.
    flag:
        availability-zones: A list of Availability Zones (AZs) where instances in the restored DB cluster can be created.
        backtrack-window: |-
            The target backtrack window, in seconds. To disable backtracking, set this value to 0.

            Currently, Backtrack is only supported for Aurora MySQL DB clusters.

            Default: 0

            Constraints:

            - If specified, this value must be set to a number from 0 to 259,200 (72 hours).
        backup-retention-period: |-
            The number of days for which automated backups of the restored DB cluster are retained. You must specify a minimum value of 1.

            Default: 1

            Constraints:

            - Must be a value from 1 to 35
        character-set-name: A value that indicates that the restored DB cluster should be associated with the specified CharacterSet.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        copy-tags-to-snapshot: Specifies whether to copy all tags from the restored DB cluster to snapshots of the restored DB cluster. The default is not to copy them.
        database-name: The database name for the restored DB cluster.
        db-cluster-identifier: |-
            The name of the DB cluster to create from the source data in the Amazon S3 bucket. This parameter isn't case-sensitive.

            Constraints:

            - Must contain from 1 to 63 letters, numbers, or hyphens.
            - First character must be a letter.
            - Can't end with a hyphen or contain two consecutive hyphens.

            Example: `my-cluster1`
        db-cluster-parameter-group-name: |-
            The name of the DB cluster parameter group to associate with the restored DB cluster. If this argument is omitted, the default parameter group for the engine version is used.

            Constraints:

            - If supplied, must match the name of an existing DBClusterParameterGroup.
        db-subnet-group-name: |-
            A DB subnet group to associate with the restored DB cluster.

            Constraints: If supplied, must match the name of an existing DBSubnetGroup.

            Example: `mydbsubnetgroup`
        deletion-protection: Specifies whether to enable deletion protection for the DB cluster. The database can't be deleted when deletion protection is enabled. By default, deletion protection isn't enabled.
        domain: |-
            Specify the Active Directory directory ID to restore the DB cluster in. The domain must be created prior to this operation.

            For Amazon Aurora DB clusters, Amazon RDS can use Kerberos Authentication to authenticate users that connect to the DB cluster. For more information, see [Kerberos Authentication](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/kerberos-authentication.html) in the *Amazon Aurora User Guide*.
        domain-iam-role-name: Specify the name of the IAM role to be used when making API calls to the Directory Service.
        enable-cloudwatch-logs-exports: |-
            The list of logs that the restored DB cluster is to export to CloudWatch Logs. The values in the list depend on the DB engine being used.

            **Aurora MySQL**

            Possible values are `audit`, `error`, `general`, `instance`, `slowquery`, and `iam-db-auth-error`.

            **Aurora PostgreSQL**

            Possible value are `instance`, `postgresql`, and `iam-db-auth-error`.

            For more information about exporting CloudWatch Logs for Amazon RDS, see [Publishing Database Logs to Amazon CloudWatch Logs](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_LogAccess.html#USER_LogAccess.Procedural.UploadtoCloudWatch) in the *Amazon RDS User Guide*.

            For more information about exporting CloudWatch Logs for Amazon Aurora, see [Publishing Database Logs to Amazon CloudWatch Logs](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_LogAccess.html#USER_LogAccess.Procedural.UploadtoCloudWatch) in the *Amazon Aurora User Guide*.
        enable-iam-database-authentication: |-
            Specifies whether to enable mapping of Amazon Web Services Identity and Access Management (IAM) accounts to database accounts. By default, mapping isn't enabled.

            For more information, see [IAM Database Authentication](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/UsingWithRDS.IAMDBAuth.html) in the *Amazon Aurora User Guide*.
        engine: |-
            The name of the database engine to be used for this DB cluster.

            Valid Values: `aurora-mysql` (for Aurora MySQL)
        engine-lifecycle-support: |-
            The life cycle type for this DB cluster.

            By default, this value is set to `open-source-rds-extended-support`, which enrolls your DB cluster into Amazon RDS Extended Support. At the end of standard support, you can avoid charges for Extended Support by setting the value to `open-source-rds-extended-support-disabled`. In this case, RDS automatically upgrades your restored DB cluster to a higher engine version, if the major engine version is past its end of standard support date.

            You can use this setting to enroll your DB cluster into Amazon RDS Extended Support. With RDS Extended Support, you can run the selected major engine version on your DB cluster past the end of standard support for that engine version. For more information, see the following sections:

            - Amazon Aurora - [Amazon RDS Extended Support with Amazon Aurora](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/extended-support.html) in the *Amazon Aurora User Guide*
            - Amazon RDS - [Amazon RDS Extended Support with Amazon RDS](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/extended-support.html) in the *Amazon RDS User Guide*

            Valid for Cluster Type: Aurora DB clusters and Multi-AZ DB clusters

            Valid Values: `open-source-rds-extended-support | open-source-rds-extended-support-disabled`

            Default: `open-source-rds-extended-support`
        engine-version: |-
            The version number of the database engine to use.

            To list all of the available engine versions for `aurora-mysql` (Aurora MySQL), use the following command:

            `aws rds describe-db-engine-versions --engine aurora-mysql --query "DBEngineVersions[].EngineVersion"`

            **Aurora MySQL**

            Examples: `5.7.mysql_aurora.2.12.0`, `8.0.mysql_aurora.3.04.0`
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        kms-key-id: |-
            The Amazon Web Services KMS key identifier for an encrypted DB cluster.

            The Amazon Web Services KMS key identifier is the key ARN, key ID, alias ARN, or alias name for the KMS key. To use a KMS key in a different Amazon Web Services account, specify the key ARN or alias ARN.

            If the StorageEncrypted parameter is enabled, and you do not specify a value for the `KmsKeyId` parameter, then Amazon RDS will use your default KMS key. There is a default KMS key for your Amazon Web Services account. Your Amazon Web Services account has a different default KMS key for each Amazon Web Services Region.
        manage-master-user-password: |-
            Specifies whether to manage the master user password with Amazon Web Services Secrets Manager.

            For more information, see [Password management with Amazon Web Services Secrets Manager](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-secrets-manager.html) in the *Amazon RDS User Guide* and [Password management with Amazon Web Services Secrets Manager](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/rds-secrets-manager.html) in the *Amazon Aurora User Guide.*

            Constraints:

            - Can't manage the master user password with Amazon Web Services Secrets Manager if `MasterUserPassword` is specified.
        master-user-password: |-
            The password for the master database user. This password can contain any printable ASCII character except "/", """, or "@".

            Constraints:

            - Must contain from 8 to 41 characters.
            - Can't be specified if `ManageMasterUserPassword` is turned on.
        master-user-secret-kms-key-id: |-
            The Amazon Web Services KMS key identifier to encrypt a secret that is automatically generated and managed in Amazon Web Services Secrets Manager.

            This setting is valid only if the master user password is managed by RDS in Amazon Web Services Secrets Manager for the DB cluster.

            The Amazon Web Services KMS key identifier is the key ARN, key ID, alias ARN, or alias name for the KMS key. To use a KMS key in a different Amazon Web Services account, specify the key ARN or alias ARN.

            If you don't specify `MasterUserSecretKmsKeyId`, then the `aws/secretsmanager` KMS key is used to encrypt the secret. If the secret is in a different Amazon Web Services account, then you can't use the `aws/secretsmanager` KMS key to encrypt the secret, and you must use a customer managed KMS key.

            There is a default KMS key for your Amazon Web Services account. Your Amazon Web Services account has a different default KMS key for each Amazon Web Services Region.
        master-username: |-
            The name of the master user for the restored DB cluster.

            Constraints:

            - Must be 1 to 16 letters or numbers.
            - First character must be a letter.
            - Can't be a reserved word for the chosen database engine.
        network-type: |-
            The network type of the DB cluster.

            Valid Values:

            - `IPV4`
            - `DUAL`

            The network type is determined by the `DBSubnetGroup` specified for the DB cluster. A `DBSubnetGroup` can support only the IPv4 protocol or the IPv4 and the IPv6 protocols (`DUAL`).

            For more information, see [Working with a DB instance in a VPC](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_VPC.WorkingWithRDSInstanceinaVPC.html) in the *Amazon Aurora User Guide.*
        option-group-name: |-
            A value that indicates that the restored DB cluster should be associated with the specified option group.

            Permanent options can't be removed from an option group. An option group can't be removed from a DB cluster once it is associated with a DB cluster.
        port: |-
            The port number on which the instances in the restored DB cluster accept connections.

            Default: `3306`
        preferred-backup-window: |-
            The daily time range during which automated backups are created if automated backups are enabled using the `BackupRetentionPeriod` parameter.

            The default is a 30-minute window selected at random from an 8-hour block of time for each Amazon Web Services Region. To view the time blocks available, see [Backup window](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Managing.Backups.html#Aurora.Managing.Backups.BackupWindow) in the *Amazon Aurora User Guide*.

            Constraints:

            - Must be in the format `hh24:mi-hh24:mi`.
            - Must be in Universal Coordinated Time (UTC).
            - Must not conflict with the preferred maintenance window.
            - Must be at least 30 minutes.
        preferred-maintenance-window: |-
            The weekly time range during which system maintenance can occur, in Universal Coordinated Time (UTC).

            Format: `ddd:hh24:mi-ddd:hh24:mi`

            The default is a 30-minute window selected at random from an 8-hour block of time for each Amazon Web Services Region, occurring on a random day of the week. To see the time blocks available, see [Adjusting the Preferred Maintenance Window](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_UpgradeDBInstance.Maintenance.html#AdjustingTheMaintenanceWindow.Aurora) in the *Amazon Aurora User Guide*.

            Valid Days: Mon, Tue, Wed, Thu, Fri, Sat, Sun.

            Constraints: Minimum 30-minute window.
        s3-bucket-name: The name of the Amazon S3 bucket that contains the data used to create the Amazon Aurora DB cluster.
        s3-ingestion-role-arn: The Amazon Resource Name (ARN) of the Amazon Web Services Identity and Access Management (IAM) role that authorizes Amazon RDS to access the Amazon S3 bucket on your behalf.
        s3-prefix: The prefix for all of the file names that contain the data used to create the Amazon Aurora DB cluster. If you do not specify a **SourceS3Prefix** value, then the Amazon Aurora DB cluster is created by using all of the files in the Amazon S3 bucket.
        serverless-v2-scaling-configuration: ""
        source-engine: |-
            The identifier for the database engine that was backed up to create the files stored in the Amazon S3 bucket.

            Valid Values: `mysql`
        source-engine-version: |-
            The version of the database that the backup files were created from.

            MySQL versions 5.7 and 8.0 are supported.

            Example: `5.7.40`, `8.0.28`
        storage-encrypted: Specifies whether the restored DB cluster is encrypted.
        storage-type: |-
            Specifies the storage type to be associated with the DB cluster.

            Valid Values: `aurora`, `aurora-iopt1`

            Default: `aurora`

            Valid for: Aurora DB clusters only
        tags: ""
        vpc-security-group-ids: A list of EC2 VPC security groups to associate with the restored DB cluster.
