name: create-share
description: Creates a cross-account shared resource.
flags:
    --principal-subscriber=!: The principal subscriber is the account being offered shared access to the resource.
    --resource-arn=!: The ARN of the resource to be shared.
    --share-name=: A name that the owner defines for the share.
documentation:
    command: |-
        Creates a cross-account shared resource. The resource owner makes an offer to share the resource with the principal subscriber (an AWS user with a different account than the resource owner).

        The following resources support cross-account sharing:

        - HealthOmics variant stores
        - HealthOmics annotation stores
        - Private workflows
    flag:
        principal-subscriber: The principal subscriber is the account being offered shared access to the resource.
        resource-arn: The ARN of the resource to be shared.
        share-name: A name that the owner defines for the share.
