documentation:
    command: |
        *(ALPHA)*  List Cloud Storage objects.

        Bucket URLs like `gs://bucket` match all the objects inside a bucket,
        but `gs://b*` fails because it matches a list of buckets.
    flag:
        additional-headers: Includes arbitrary headers in storage API calls. Accepts a comma separated list of key=value pairs, e.g. `header1=value1,header2=value2`. Overrides the default *storage/additional_headers* property value for this command invocation.
        decryption-keys: A comma-separated list of customer-supplied encryption keys (RFC 4648 section 4 base64-encoded AES256 strings) that will be used to decrypt Cloud Storage objects. Data encrypted with a customer-managed encryption key (CMEK) is decrypted automatically, so CMEKs do not need to be listed here.
        encryption-key: The encryption key to use for encrypting target objects. The specified encryption key can be a customer-supplied encryption key (An RFC 4648 section 4 base64-encoded AES256 string), or a customer-managed encryption key of the form `projects/{project}/locations/{location}/keyRings/{key-ring}/cryptoKeys/{crypto-key}`. The specified key also acts as a decryption key, which is useful when copying or moving encrypted data to a new location. Using this flag in an `objects update` command triggers a rewrite of target objects.
        exhaustive: For features like soft delete, the API may return an empty list. If present, continue querying. This may incur costs from repeated LIST calls and may not return any additional objects.
        fetch-encrypted-object-hashes: API requests to the LIST endpoint do not fetch the hashes for encrypted objects by default. If this flag is set, a GET request is sent for each encrypted object in order to fetch hashes. This can significantly increase the cost of the command.
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        metadata-filter: Server side filtering for objects. Works only for Google Cloud Storage URLs. The filter only works for objects, and not directories or buckets, which means commands like `storage ls` and `storage du` will still list directories or buckets even if they do not contain any objects matching the filter. See https://cloud.google.com/storage/docs/listing-objects#filter-by-object-contexts-syntax for more details.
        next-page-token: Page token for resuming LIST calls.
        no-exhaustive: For features like soft delete, the API may return an empty list. If present, continue querying. This may incur costs from repeated LIST calls and may not return any additional objects.
        no-fetch-encrypted-object-hashes: API requests to the LIST endpoint do not fetch the hashes for encrypted objects by default. If this flag is set, a GET request is sent for each encrypted object in order to fetch hashes. This can significantly increase the cost of the command.
        no-raw: Shows metadata in the format returned by the API instead of standardizing it.
        no-soft-deleted: Displays soft-deleted resources only. For objects, it will exclude live and noncurrent ones.
        no-stat: Emulates gsutil stat-style behavior. Does not show past object versions and changes output format.
        no-uri: |
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is determined by the
            service if it supports paging, otherwise it is *unlimited* (no paging).
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        raw: Shows metadata in the format returned by the API instead of standardizing it.
        soft-deleted: Displays soft-deleted resources only. For objects, it will exclude live and noncurrent ones.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
        stat: Emulates gsutil stat-style behavior. Does not show past object versions and changes output format.
        uri: |-
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
