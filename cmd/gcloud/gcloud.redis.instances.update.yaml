name: update
description: Update Memorystore Redis instances.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --clear-labels: Remove all labels.
    --display-name=: A human-readable name for the instance.
    --enable-auth: Enables Redis AUTH for the instance.
    --maintenance-version=: Specifies which maintenance version to apply to your instance during self-service maintenance.
    --maintenance-window-any: Removes the user-specified maintenance window.
    --maintenance-window-day=: Day of week for maintenance window, in UTC time zone.
    --maintenance-window-hour=: Hour of day (0 to 23) for maintenance window, in UTC time zone.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-labels&: Remove all labels.
    --no-enable-auth&: Enables Redis AUTH for the instance.
    --no-maintenance-window-any&: Removes the user-specified maintenance window.
    --persistence-mode=: Operation mode for automated persistence.
    --rdb-snapshot-period=: The attempted period between RDB snapshots.
    --rdb-snapshot-start-time=: Date and time of the first snapshot in the ISO 1801 format, and alignment time for future snapshots.
    --read-replicas-mode=: Read replicas mode used by the instance.
    --region=: The name of the Redis region of the instance.
    --remove-labels=: List of label keys to remove.
    --remove-redis-config=: A list of Redis config parameters to remove.
    --replica-count=: The replica count of the instance.
    --secondary-ip-range=: Required only when read-replicas-mode is enabled on the instance.
    --size=: The memory size of the instance in GiB.
    --update-labels=: List of label KEY=VALUE pairs to update.
    --update-redis-config=: A list of Redis config KEY=VALUE pairs to update according to
completion:
    flag:
        maintenance-window-day:
            - day-of-week-unspecified
            - friday
            - monday
            - saturday
            - sunday
            - thursday
            - tuesday
            - wednesday
        persistence-mode:
            - disabled
            - rdb
        rdb-snapshot-period:
            - 12h
            - 1h
            - 24h
            - 6h
        read-replicas-mode:
            - read-replicas-disabled
            - read-replicas-enabled
documentation:
    command: |
        Update the metadata and/or configuration parameters of a Redis instance.

        This command can fail for the following reasons:
          * The instance specified does not exist.
          * The active account does not have permission to update the given
            instance.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        display-name: A human-readable name for the instance.
        enable-auth: Enables Redis AUTH for the instance.
        maintenance-version: |-
            Specifies which maintenance version to apply to your instance during self-service maintenance.
            To view the available maintenance versions for your instance, run `gcloud redis
            instances describe [INSTANCE_ID]`. Acceptable values for this flag are either `current_default` or
            one of the specific versions listed by the describe command. If you pass the value
            `current_default`, the Memorystore updates to the most recent available maintenance version during self service maintenance.
        maintenance-window-any: Removes the user-specified maintenance window.
        maintenance-window-day: |-
            Day of week for maintenance window, in UTC time zone.
            MAINTENANCE_WINDOW_DAY must be one of: SUNDAY, MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY. _MAINTENANCE_WINDOW_DAY_ must be one of: *day-of-week-unspecified*, *friday*, *monday*, *saturday*, *sunday*, *thursday*, *tuesday*, *wednesday*.
        maintenance-window-hour: Hour of day (0 to 23) for maintenance window, in UTC time zone.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        no-enable-auth: |
            Enables Redis AUTH for the instance.
        no-maintenance-window-any: |
            Removes the user-specified maintenance window.
        persistence-mode: |-
            Operation mode for automated persistence. _PERSISTENCE_MODE_ must be one of:
            +
            *disabled*::: RDB mode is disabled
            *rdb*::: Automatic RDB persistence
            :::
            +
        rdb-snapshot-period: |-
            The attempted period between RDB snapshots. _RDB_SNAPSHOT_PERIOD_ must be one of:
            +
            *12h*::: 12 hours
            *1h*::: 1 hour
            *24h*::: 24 hours
            *6h*::: 6 hours
            :::
            +
        rdb-snapshot-start-time: Date and time of the first snapshot in the ISO 1801 format, and alignment time for future snapshots. For example, 2022-11-02T03:00:00Z.
        read-replicas-mode: |-
            Read replicas mode used by the instance. Only works against standard tier instances with
            5GB and above provisioned capacity and Redis version 5.0 and above.
            This is an irreversible update i.e. Read replicas can not be disabled for the instance
            once it is enabled. Also this update is exclusive and cannot be clubbed with other update
            operations. _READ_REPLICAS_MODE_ must be one of:
            +
            *read-replicas-disabled*::: If read replica is not enabled on the instance, no changes are done. If read replica is
            enabled for the instance, update operation fails
            +
            *read-replicas-enabled*::: Read replica is enabled for the instance if not already enabled. Read endpoint will be
            provided and the instance can scale up and down the number of replicas.
            +
            :::
            +
        region: |-
            The name of the Redis region of the instance. Overrides the default
            redis/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `redis/region`.
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        remove-redis-config: |-
            A list of Redis config parameters to remove. Removing a non-existent
            config parameter is silently ignored.
        replica-count: The replica count of the instance. Valid from 0 to 5.
        secondary-ip-range: |-
            Required only when read-replicas-mode is enabled on the instance. The CIDR range of
            internal addresses that are reserved for this instance. For example, 10.0.0.0/28 or
            192.168.0.0/28. Range must be unique and non-overlapping with existing ranges in the
            network. If value 'auto' passed, the service will automatically pick an available range.
        size: The memory size of the instance in GiB.
        update-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        update-redis-config: |-
            A list of Redis config KEY=VALUE pairs to update according to
            http://cloud.google.com/memorystore/docs/reference/redis-configs. If a config parameter is already set,
            its value is modified; otherwise a new Redis config parameter is added.
            Currently, the only supported parameters are:
            +
            Redis version 3.2 and newer: maxmemory-policy, notify-keyspace-events, timeout.
            +
            Redis version 4.0 and newer: activedefrag, lfu-decay-time, lfu-log-factor, maxmemory-gb.
            +
            Redis version 5.0 and newer: stream-node-max-bytes, stream-node-max-entries.
            +
            Redis version 7.0 and newer: maxmemory-clients, lazyfree-lazy-eviction, lazyfree-lazy-expire, lazyfree-lazy-user-del, lazyfree-lazy-user-flush.
