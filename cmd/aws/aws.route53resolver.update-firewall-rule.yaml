name: update-firewall-rule
description: Updates the specified firewall rule.
flags:
    --action=: 'The action that DNS Firewall should take on a DNS query when it matches one of the domains in the rule''s domain list, or a threat in a DNS Firewall Advanced rule:'
    --block-override-dns-type=: The DNS record's type.
    --block-override-domain=: The custom DNS record to send back in response to the query.
    --block-override-ttl=: The recommended amount of time, in seconds, for the DNS resolver or web browser to cache the provided override record.
    --block-response=: The way that you want DNS Firewall to block the request.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --confidence-threshold=: The confidence threshold for DNS Firewall Advanced.
    --dns-threat-protection=: The type of the DNS Firewall Advanced rule.
    --firewall-domain-list-id=: The ID of the domain list to use in the rule.
    --firewall-domain-redirection-action=: How you want the the rule to evaluate DNS redirection in the DNS redirection chain, such as CNAME or DNAME.
    --firewall-rule-group-id=!: The unique identifier of the firewall rule group for the rule.
    --firewall-threat-protection-id=: The DNS Firewall Advanced rule ID.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=: The name of the rule.
    --priority=: The setting that determines the processing order of the rule in the rule group.
    --qtype=: The DNS query type you want the rule to evaluate.
completion:
    flag:
        action:
            - ALLOW
            - BLOCK
            - ALERT
        block-override-dns-type:
            - CNAME
        block-response:
            - NODATA
            - NXDOMAIN
            - OVERRIDE
        confidence-threshold:
            - LOW
            - MEDIUM
            - HIGH
        dns-threat-protection:
            - DGA
            - DNS_TUNNELING
        firewall-domain-redirection-action:
            - INSPECT_REDIRECTION_DOMAIN
            - TRUST_REDIRECTION_DOMAIN
documentation:
    command: Updates the specified firewall rule.
    flag:
        action: |-
            The action that DNS Firewall should take on a DNS query when it matches one of the domains in the rule's domain list, or a threat in a DNS Firewall Advanced rule:

            - `ALLOW` - Permit the request to go through. Not available for DNS Firewall Advanced rules.
            - `ALERT` - Permit the request to go through but send an alert to the logs.
            - `BLOCK` - Disallow the request. This option requires additional details in the rule's `BlockResponse`.
        block-override-dns-type: The DNS record's type. This determines the format of the record value that you provided in `BlockOverrideDomain`. Used for the rule action `BLOCK` with a `BlockResponse` setting of `OVERRIDE`.
        block-override-domain: The custom DNS record to send back in response to the query. Used for the rule action `BLOCK` with a `BlockResponse` setting of `OVERRIDE`.
        block-override-ttl: The recommended amount of time, in seconds, for the DNS resolver or web browser to cache the provided override record. Used for the rule action `BLOCK` with a `BlockResponse` setting of `OVERRIDE`.
        block-response: |-
            The way that you want DNS Firewall to block the request. Used for the rule action setting `BLOCK`.

            - `NODATA` - Respond indicating that the query was successful, but no response is available for it.
            - `NXDOMAIN` - Respond indicating that the domain name that's in the query doesn't exist.
            - `OVERRIDE` - Provide a custom override in the response. This option requires custom handling details in the rule's `BlockOverride*` settings.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        confidence-threshold: |-
            The confidence threshold for DNS Firewall Advanced. You must provide this value when you create a DNS Firewall Advanced rule. The confidence level values mean:

            - `LOW`: Provides the highest detection rate for threats, but also increases false positives.
            - `MEDIUM`: Provides a balance between detecting threats and false positives.
            - `HIGH`: Detects only the most well corroborated threats with a low rate of false positives.
        dns-threat-protection: |-
            The type of the DNS Firewall Advanced rule. Valid values are:

            - `DGA`: Domain generation algorithms detection. DGAs are used by attackers to generate a large number of domains to to launch malware attacks.
            - `DNS_TUNNELING`: DNS tunneling detection. DNS tunneling is used by attackers to exfiltrate data from the client by using the DNS tunnel without making a network connection to the client.
        firewall-domain-list-id: The ID of the domain list to use in the rule.
        firewall-domain-redirection-action: |-
            How you want the the rule to evaluate DNS redirection in the DNS redirection chain, such as CNAME or DNAME.

            `INSPECT_REDIRECTION_DOMAIN`: (Default) inspects all domains in the redirection chain. The individual domains in the redirection chain must be added to the domain list.

            `TRUST_REDIRECTION_DOMAIN`: Inspects only the first domain in the redirection chain. You don't need to add the subsequent domains in the domain in the redirection list to the domain list.
        firewall-rule-group-id: The unique identifier of the firewall rule group for the rule.
        firewall-threat-protection-id: The DNS Firewall Advanced rule ID.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the rule.
        priority: |-
            The setting that determines the processing order of the rule in the rule group. DNS Firewall processes the rules in a rule group by order of priority, starting from the lowest setting.

            You must specify a unique priority for each rule in a rule group. To make it easier to insert rules later, leave space between the numbers, for example, use 100, 200, and so on. You can change the priority setting for the rules in a rule group at any time.
        qtype: "The DNS query type you want the rule to evaluate. Allowed values are;\n\n- A: Returns an IPv4 address.\n- AAAA: Returns an Ipv6 address.\n- CAA: Restricts CAs that can create SSL/TLS certifications for the domain.\n- CNAME: Returns another domain name.\n- DS: Record that identifies the DNSSEC signing key of a delegated zone.\n- MX: Specifies mail servers.\n- NAPTR: Regular-expression-based rewriting of domain names.\n- NS: Authoritative name servers.\n- PTR: Maps an IP address to a domain name.\n- SOA: Start of authority record for the zone.\n- SPF: Lists the servers authorized to send emails from a domain.\n- SRV: Application specific values that identify servers.\n- TXT: Verifies email senders and application-specific values.\n- A query type you define by using the DNS type ID, for example 28 for AAAA. The values must be defined as TYPENUMBER, where the NUMBER can be 1-65334, for example, TYPE28. For more information, see [List of DNS record types](https://en.wikipedia.org/wiki/List_of_DNS_record_types).\n  \n  If you set up a firewall BLOCK rule with action NXDOMAIN on query type equals AAAA, this action will not be applied to synthetic IPv6 addresses generated when DNS64 is enabled."
