name: create-vm-maintenance
description: '*(ALPHA)*  *(DEPRECATED)*  Create a Compute Engine VM Maintenance Resource Policy.'
flags:
    --daily-window: Maintenance activity window starts daily at START_TIME.
    --description=: An optional, textual description for the backend.
    --no-daily-window&: Maintenance activity window starts daily at START_TIME.
    --region=: Region of the resource policy to operate on.
    --start-time=!: Start time of a four-hour window in which maintenance should start in daily cadence.
documentation:
    command: |4

        *(ALPHA)*  *(DEPRECATED)*  `create-vm-maintenance` is deprecated.
        Use `compute resource-policies create vm-maintenance` instead.


        Create a Compute Engine VM Maintenance Resource Policy.
    flag:
        daily-window: Maintenance activity window starts daily at START_TIME.
        description: An optional, textual description for the backend.
        no-daily-window: Maintenance activity window starts daily at START_TIME.
        region: |-
            Region of the resource policy to operate on. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        start-time: |-
            Start time of a four-hour window in which maintenance should start in daily cadence.        Valid choices are 00:00, 04:00, 08:00, 12:00,
                    16:00 and 20:00 UTC. For example, `--start-time="08:00"`.
