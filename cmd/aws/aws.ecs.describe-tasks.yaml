name: describe-tasks
description: Describes a specified task or tasks.
flags:
    --cluster=: The short name or full Amazon Resource Name (ARN) of the cluster that hosts the task or tasks to describe.
    --include=: Specifies whether you want to see the resource tags for the task.
    --tasks=!: A list of up to 100 task IDs or full ARN entries.
documentation:
    command: |-
        Describes a specified task or tasks.

        Currently, stopped tasks appear in the returned results for at least one hour.

        If you have tasks with tags, and then delete the cluster, the tagged tasks are returned in the response. If you create a new cluster with the same name as the deleted cluster, the tagged tasks are not included in the response.
    flag:
        cluster: The short name or full Amazon Resource Name (ARN) of the cluster that hosts the task or tasks to describe. If you do not specify a cluster, the default cluster is assumed.
        include: Specifies whether you want to see the resource tags for the task. If `TAGS` is specified, the tags are included in the response. If this field is omitted, tags aren't included in the response.
        tasks: A list of up to 100 task IDs or full ARN entries.
