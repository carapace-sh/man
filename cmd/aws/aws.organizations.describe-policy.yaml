name: describe-policy
description: Retrieves information about a policy.
flags:
    --policy-id=!: The unique identifier (ID) of the policy that you want details about.
documentation:
    command: |-
        Retrieves information about a policy.

        This operation can be called only from the organization's management account or by a member account that is a delegated administrator.
    flag:
        policy-id: |-
            The unique identifier (ID) of the policy that you want details about. You can get the ID from the [ListPolicies]() or [ListPoliciesForTarget]() operations.

            The [regex pattern](http://wikipedia.org/wiki/regex) for a policy ID string requires "p-" followed by from 8 to 128 lowercase or uppercase letters, digits, or the underscore character (\_).
