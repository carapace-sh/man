name: update
description: '*(ALPHA)*  Update the all-instances configuration of a managed instance group.'
flags:
    --labels=: Add labels to the group's all instances configuration.
    --metadata=: Add metadata to the group's all instances configuration.
    --region=: Region of the managed instance group to update the all instances configuration for.
    --zone=: Zone of the managed instance group to update the all instances configuration for.
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute instance-groups managed all-instances-config update* updates the group's all-instances configuration and applies
        it only to new instances that are added to the group.

        To apply a revised all-instances configuration to existing instances
        in the group, use one of the following methods:

        - Update instances using the `update-instances` command.
        - Recreate instances using the `recreate-instances` command.
        - Use the `rolling-action start-update` command.
        - Use the API to set the group's `updatePolicy.type` to `PROACTIVE`.
    flag:
        labels: Add labels to the group's all instances configuration.
        metadata: Add metadata to the group's all instances configuration.
        region: |-
            Region of the managed instance group to update the all instances configuration for. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            Overrides the default *compute/region* property value for this command invocation.
        zone: |-
            Zone of the managed instance group to update the all instances configuration for. If not specified, you might be prompted to select a zone (interactive mode
            only).
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            Overrides the default *compute/zone* property value for this command invocation.
