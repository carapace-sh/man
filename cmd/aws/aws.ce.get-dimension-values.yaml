name: get-dimension-values
description: Retrieves all available filter values for a specified filter over a period of time.
flags:
    --billing-view-arn=: The Amazon Resource Name (ARN) that uniquely identifies a specific billing view.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --context=: The context for the call to `GetDimensionValues`.
    --dimension=!: The name of the dimension.
    --filter=: ""
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: This field is only used when SortBy is provided in the request.
    --next-page-token=: The token to retrieve the next set of results.
    --search-string=: The value that you want to search the filter values for.
    --sort-by=:
        description: The value that you want to sort the data by.
        nargs: -1
    --time-period=!: The start date and end date for retrieving the dimension values.
completion:
    flag:
        context:
            - COST_AND_USAGE
            - RESERVATIONS
            - SAVINGS_PLANS
        dimension:
            - AZ
            - INSTANCE_TYPE
            - LINKED_ACCOUNT
            - PAYER_ACCOUNT
            - LINKED_ACCOUNT_NAME
            - OPERATION
            - PURCHASE_TYPE
            - REGION
            - SERVICE
            - SERVICE_CODE
            - USAGE_TYPE
            - USAGE_TYPE_GROUP
            - RECORD_TYPE
            - OPERATING_SYSTEM
            - TENANCY
            - SCOPE
            - PLATFORM
            - SUBSCRIPTION_ID
            - LEGAL_ENTITY_NAME
            - DEPLOYMENT_OPTION
            - DATABASE_ENGINE
            - CACHE_ENGINE
            - INSTANCE_TYPE_FAMILY
            - BILLING_ENTITY
            - RESERVATION_ID
            - RESOURCE_ID
            - RIGHTSIZING_TYPE
            - SAVINGS_PLANS_TYPE
            - SAVINGS_PLAN_ARN
            - PAYMENT_OPTION
            - AGREEMENT_END_DATE_TIME_AFTER
            - AGREEMENT_END_DATE_TIME_BEFORE
            - INVOICING_ENTITY
            - ANOMALY_TOTAL_IMPACT_ABSOLUTE
            - ANOMALY_TOTAL_IMPACT_PERCENTAGE
documentation:
    command: Retrieves all available filter values for a specified filter over a period of time. You can search the dimension values for an arbitrary string.
    flag:
        billing-view-arn: The Amazon Resource Name (ARN) that uniquely identifies a specific billing view. The ARN is used to specify which particular billing view you want to interact with or retrieve information from when making API calls related to Amazon Web Services Billing and Cost Management features. The BillingViewArn can be retrieved by calling the ListBillingViews API.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        context: "The context for the call to `GetDimensionValues`. This can be `RESERVATIONS` or `COST_AND_USAGE`. The default value is `COST_AND_USAGE`. If the context is set to `RESERVATIONS`, the resulting dimension values can be used in the `GetReservationUtilization` operation. If the context is set to `COST_AND_USAGE`, the resulting dimension values can be used in the `GetCostAndUsage` operation.\n\nIf you set the context to `COST_AND_USAGE`, you can use the following dimensions for searching:\n\n- AZ - The Availability Zone. An example is `us-east-1a`.\n- BILLING\\_ENTITY - The Amazon Web Services seller that your account is with. Possible values are the following:\n  \n  \\- Amazon Web Services(Amazon Web Services): The entity that sells Amazon Web Services services.\n  \n  \\- AISPL (Amazon Internet Services Pvt. Ltd.): The local Indian entity that's an acting reseller for Amazon Web Services services in India.\n  \n  \\- Amazon Web Services Marketplace: The entity that supports the sale of solutions that are built on Amazon Web Services by third-party software providers.\n- CACHE\\_ENGINE - The Amazon ElastiCache operating system. Examples are Windows or Linux.\n- DEPLOYMENT\\_OPTION - The scope of Amazon Relational Database Service deployments. Valid values are `SingleAZ` and `MultiAZ`.\n- DATABASE\\_ENGINE - The Amazon Relational Database Service database. Examples are Aurora or MySQL.\n- INSTANCE\\_TYPE - The type of Amazon EC2 instance. An example is `m4.xlarge`.\n- INSTANCE\\_TYPE\\_FAMILY - A family of instance types optimized to fit different use cases. Examples are `Compute Optimized` (for example, `C4`, `C5`, `C6g`, and `C7g`), `Memory Optimization` (for example, `R4`, `R5n`, `R5b`, and `R6g`).\n- INVOICING\\_ENTITY - The name of the entity that issues the Amazon Web Services invoice.\n- LEGAL\\_ENTITY\\_NAME - The name of the organization that sells you Amazon Web Services services, such as Amazon Web Services.\n- LINKED\\_ACCOUNT - The description in the attribute map that includes the full name of the member account. The value field contains the Amazon Web Services ID of the member account.\n- OPERATING\\_SYSTEM - The operating system. Examples are Windows or Linux.\n- OPERATION - The action performed. Examples include `RunInstance` and `CreateBucket`.\n- PLATFORM - The Amazon EC2 operating system. Examples are Windows or Linux.\n- PURCHASE\\_TYPE - The reservation type of the purchase that this usage is related to. Examples include On-Demand Instances and Standard Reserved Instances.\n- RESERVATION\\_ID - The unique identifier for an Amazon Web Services Reservation Instance.\n- SAVINGS\\_PLAN\\_ARN - The unique identifier for your Savings Plans.\n- SAVINGS\\_PLANS\\_TYPE - Type of Savings Plans (EC2 Instance or Compute).\n- SERVICE - The Amazon Web Services service such as Amazon DynamoDB.\n- TENANCY - The tenancy of a resource. Examples are shared or dedicated.\n- USAGE\\_TYPE - The type of usage. An example is DataTransfer-In-Bytes. The response for the `GetDimensionValues` operation includes a unit attribute. Examples include GB and Hrs.\n- USAGE\\_TYPE\\_GROUP - The grouping of common usage types. An example is Amazon EC2: CloudWatch – Alarms. The response for this operation includes a unit attribute.\n- REGION - The Amazon Web Services Region.\n- RECORD\\_TYPE - The different types of charges such as Reserved Instance (RI) fees, usage costs, tax refunds, and credits.\n- RESOURCE\\_ID - The unique identifier of the resource. ResourceId is an opt-in feature only available for last 14 days for EC2-Compute Service.\n\nIf you set the context to `RESERVATIONS`, you can use the following dimensions for searching:\n\n- AZ - The Availability Zone. An example is `us-east-1a`.\n- CACHE\\_ENGINE - The Amazon ElastiCache operating system. Examples are Windows or Linux.\n- DEPLOYMENT\\_OPTION - The scope of Amazon Relational Database Service deployments. Valid values are `SingleAZ` and `MultiAZ`.\n- INSTANCE\\_TYPE - The type of Amazon EC2 instance. An example is `m4.xlarge`.\n- LINKED\\_ACCOUNT - The description in the attribute map that includes the full name of the member account. The value field contains the Amazon Web Services ID of the member account.\n- PLATFORM - The Amazon EC2 operating system. Examples are Windows or Linux.\n- REGION - The Amazon Web Services Region.\n- SCOPE (Utilization only) - The scope of a Reserved Instance (RI). Values are regional or a single Availability Zone.\n- TAG (Coverage only) - The tags that are associated with a Reserved Instance (RI).\n- TENANCY - The tenancy of a resource. Examples are shared or dedicated.\n\nIf you set the context to `SAVINGS_PLANS`, you can use the following dimensions for searching:\n\n- SAVINGS\\_PLANS\\_TYPE - Type of Savings Plans (EC2 Instance or Compute)\n- PAYMENT\\_OPTION - The payment option for the given Savings Plans (for example, All Upfront)\n- REGION - The Amazon Web Services Region.\n- INSTANCE\\_TYPE\\_FAMILY - The family of instances (For example, `m5`)\n- LINKED\\_ACCOUNT - The description in the attribute map that includes the full name of the member account. The value field contains the Amazon Web Services ID of the member account.\n- SAVINGS\\_PLAN\\_ARN - The unique identifier for your Savings Plans."
        dimension: The name of the dimension. Each `Dimension` is available for a different `Context`. For more information, see `Context`. `LINK_ACCOUNT_NAME` and `SERVICE_CODE` can only be used in [CostCategoryRule](https://docs.aws.amazon.com/aws-cost-management/latest/APIReference/AAPI_CostCategoryRule.html).
        filter: ""
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: |-
            This field is only used when SortBy is provided in the request. The maximum number of objects that are returned for this request. If MaxResults isn't specified with SortBy, the request returns 1000 results as the default value for this parameter.

            For `GetDimensionValues`, MaxResults has an upper limit of 1000.
        next-page-token: The token to retrieve the next set of results. Amazon Web Services provides the token when the response from a previous call has more results than the maximum page size.
        search-string: The value that you want to search the filter values for.
        sort-by: |-
            The value that you want to sort the data by.

            The key represents cost and usage metrics. The following values are supported:

            - `BlendedCost`
            - `UnblendedCost`
            - `AmortizedCost`
            - `NetAmortizedCost`
            - `NetUnblendedCost`
            - `UsageQuantity`
            - `NormalizedUsageAmount`

            The supported values for the `SortOrder` key are `ASCENDING` or `DESCENDING`.

            When you specify a `SortBy` paramater, the context must be `COST_AND_USAGE`. Further, when using `SortBy`, `NextPageToken` and `SearchString` aren't supported.
        time-period: The start date and end date for retrieving the dimension values. The start date is inclusive, but the end date is exclusive. For example, if `start` is `2017-01-01` and `end` is `2017-05-01`, then the cost and usage data is retrieved from `2017-01-01` up to and including `2017-04-30` but not including `2017-05-01`.
