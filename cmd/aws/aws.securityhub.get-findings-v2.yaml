name: get-findings-v2
description: Return a list of findings that match the specified criteria.
flags:
    --filters=: The finding attributes used to define a condition to filter the returned OCSF findings.
    --max-results=: The maximum number of results to return.
    --next-token=: The token required for pagination.
    --sort-criteria=: The finding attributes used to sort the list of returned findings.
documentation:
    command: Return a list of findings that match the specified criteria. `GetFindings` and `GetFindingsV2` both use `securityhub:GetFindings` in the `Action` element of an IAM policy statement. You must have permission to perform the `securityhub:GetFindings` action. This API is in public preview and subject to change.
    flag:
        filters: The finding attributes used to define a condition to filter the returned OCSF findings. You can filter up to 10 composite filters. For each filter type inside of a composite filter, you can provide up to 20 filters.
        max-results: The maximum number of results to return.
        next-token: The token required for pagination. On your first call, set the value of this parameter to `NULL`. For subsequent calls, to continue listing data, set the value of this parameter to the value returned in the previous response.
        sort-criteria: The finding attributes used to sort the list of returned findings.
