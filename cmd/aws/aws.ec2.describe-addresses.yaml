name: describe-addresses
description: Describes the specified Elastic IP addresses or all of your Elastic IP addresses.
flags:
    --allocation-ids=: Information about the allocation IDs.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: One or more filters.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --public-ips=: One or more Elastic IP addresses.
documentation:
    command: Describes the specified Elastic IP addresses or all of your Elastic IP addresses.
    flag:
        allocation-ids: Information about the allocation IDs.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            One or more filters. Filter names and values are case-sensitive.

            - `allocation-id` - The allocation ID for the address.
            - `association-id` - The association ID for the address.
            - `instance-id` - The ID of the instance the address is associated with, if any.
            - `network-border-group` - A unique set of Availability Zones, Local Zones, or Wavelength Zones from where Amazon Web Services advertises IP addresses.
            - `network-interface-id` - The ID of the network interface that the address is associated with, if any.
            - `network-interface-owner-id` - The Amazon Web Services account ID of the owner.
            - `private-ip-address` - The private IP address associated with the Elastic IP address.
            - `public-ip` - The Elastic IP address, or the carrier IP address.
            - `tag`:&lt;key&gt; - The key/value combination of a tag assigned to the resource. Use the tag key in the filter name and the tag value as the filter value. For example, to find all resources that have a tag with the key `Owner` and the value `TeamA`, specify `tag:Owner` for the filter name and `TeamA` for the filter value.
            - `tag-key` - The key of a tag assigned to the resource. Use this filter to find all resources assigned a tag with a specific key, regardless of the tag value.
        public-ips: |-
            One or more Elastic IP addresses.

            Default: Describes all your Elastic IP addresses.
