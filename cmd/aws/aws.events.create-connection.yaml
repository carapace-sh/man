name: create-connection
description: Creates a connection.
flags:
    --auth-parameters=!: The authorization parameters to use to authorize with the endpoint.
    --authorization-type=!: The type of authorization to use for the connection.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description for the connection to create.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --invocation-connectivity-parameters=: For connections to private APIs, the parameters to use for invoking the API.
    --kms-key-identifier=: The identifier of the KMS customer managed key for EventBridge to use, if you choose to use a customer managed key to encrypt this connection.
    --name=!: The name for the connection to create.
completion:
    flag:
        authorization-type:
            - BASIC
            - OAUTH_CLIENT_CREDENTIALS
            - API_KEY
documentation:
    command: |-
        Creates a connection. A connection defines the authorization type and credentials to use for authorization with an API destination HTTP endpoint.

        For more information, see [Connections for endpoint targets](https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-target-connection.html) in the *Amazon EventBridge User Guide*.
    flag:
        auth-parameters: |-
            The authorization parameters to use to authorize with the endpoint.

            You must include only authorization parameters for the `AuthorizationType` you specify.
        authorization-type: |-
            The type of authorization to use for the connection.

            OAUTH tokens are refreshed when a 401 or 407 response is returned.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description for the connection to create.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        invocation-connectivity-parameters: |-
            For connections to private APIs, the parameters to use for invoking the API.

            For more information, see [Connecting to private APIs](https://docs.aws.amazon.com/eventbridge/latest/userguide/connection-private.html) in the *Amazon EventBridge User Guide* .
        kms-key-identifier: |-
            The identifier of the KMS customer managed key for EventBridge to use, if you choose to use a customer managed key to encrypt this connection. The identifier can be the key Amazon Resource Name (ARN), KeyId, key alias, or key alias ARN.

            If you do not specify a customer managed key identifier, EventBridge uses an Amazon Web Services owned key to encrypt the connection.

            For more information, see [Identify and view keys](https://docs.aws.amazon.com/kms/latest/developerguide/viewing-keys.html) in the *Key Management Service Developer Guide*.
        name: The name for the connection to create.
