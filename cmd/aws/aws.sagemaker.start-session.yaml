name: start-session
description: Initiates a remote connection session between a local integrated development environments (IDEs) and a remote SageMaker space.
flags:
    --resource-identifier=!: The Amazon Resource Name (ARN) of the resource to which the remote connection will be established.
documentation:
    command: Initiates a remote connection session between a local integrated development environments (IDEs) and a remote SageMaker space.
    flag:
        resource-identifier: The Amazon Resource Name (ARN) of the resource to which the remote connection will be established. For example, this identifies the specific ARN space application you want to connect to from your local IDE.
