name: describe-maintenance-window-execution-tasks
description: For a given maintenance window execution, lists the tasks that were run.
flags:
    --filters=: Optional filters used to scope down the returned tasks.
    --max-results=: The maximum number of items to return for this call.
    --next-token=: The token for the next set of items to return.
    --window-execution-id=!: The ID of the maintenance window execution whose task executions should be retrieved.
documentation:
    command: For a given maintenance window execution, lists the tasks that were run.
    flag:
        filters: Optional filters used to scope down the returned tasks. The supported filter key is `STATUS` with the corresponding values `PENDING`, `IN_PROGRESS`, `SUCCESS`, `FAILED`, `TIMED_OUT`, `CANCELLING`, and `CANCELLED`.
        max-results: The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
        window-execution-id: The ID of the maintenance window execution whose task executions should be retrieved.
