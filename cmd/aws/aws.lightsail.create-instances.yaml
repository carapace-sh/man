name: create-instances
description: Creates one or more Amazon Lightsail instances.
flags:
    --add-ons=: An array of objects representing the add-ons to enable for the new instance.
    --availability-zone=!: The Availability Zone in which to create your instance.
    --blueprint-id=!: The ID for a virtual private server image (`app_wordpress_x_x` or `app_lamp_x_x`).
    --bundle-id=!: The bundle of specification information for your virtual private server (or *instance*), including the pricing plan (`medium_x_x`).
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --custom-image-name=: (Discontinued) The name for your custom image.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-names=!: The names to use for your new Lightsail instances.
    --ip-address-type=: The IP address type for the instance.
    --key-pair-name=: The name of your key pair.
    --tags=: The tag keys and optional values to add to the resource during create.
    --user-data=: A launch script you can create that configures a server with additional user data.
completion:
    flag:
        ip-address-type:
            - dualstack
            - ipv4
            - ipv6
documentation:
    command: |-
        Creates one or more Amazon Lightsail instances.

        The `create instances` operation supports tag-based access control via request tags. For more information, see the [Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-controlling-access-using-tags).
    flag:
        add-ons: An array of objects representing the add-ons to enable for the new instance.
        availability-zone: 'The Availability Zone in which to create your instance. Use the following format: `us-east-2a` (case sensitive). You can get a list of Availability Zones by using the [get regions](http://docs.aws.amazon.com/lightsail/2016-11-28/api-reference/API_GetRegions.html) operation. Be sure to add the `include Availability Zones` parameter to your request.'
        blueprint-id: |-
            The ID for a virtual private server image (`app_wordpress_x_x` or `app_lamp_x_x`). Use the `get blueprints` operation to return a list of available images (or *blueprints*).

            Use active blueprints when creating new instances. Inactive blueprints are listed to support customers with existing instances and are not necessarily available to create new instances. Blueprints are marked inactive when they become outdated due to operating system updates or new application releases.
        bundle-id: The bundle of specification information for your virtual private server (or *instance*), including the pricing plan (`medium_x_x`).
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        custom-image-name: |-
            (Discontinued) The name for your custom image.

            In releases prior to June 12, 2017, this parameter was ignored by the API. It is now discontinued.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-names: 'The names to use for your new Lightsail instances. Separate multiple values using quotation marks and commas, for example: `["MyFirstInstance","MySecondInstance"]`'
        ip-address-type: |-
            The IP address type for the instance.

            The possible values are `ipv4` for IPv4 only, `ipv6` for IPv6 only, and `dualstack` for IPv4 and IPv6.

            The default value is `dualstack`.
        key-pair-name: The name of your key pair.
        tags: |-
            The tag keys and optional values to add to the resource during create.

            Use the `TagResource` action to tag a resource after it's created.
        user-data: |-
            A launch script you can create that configures a server with additional user data. For example, you might want to run `apt-get -y update`.

            Depending on the machine image you choose, the command to get software on your instance varies. Amazon Linux and CentOS use `yum`, Debian and Ubuntu use `apt-get`, and FreeBSD uses `pkg`. For a complete list, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/compare-options-choose-lightsail-instance-image).
