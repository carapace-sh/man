name: list-profiles
description: Lists the profiles associated with your Amazon Web Services account for your current or specified region.
flags:
    --max-results=: Specifies the maximum number of profiles to return.
    --next-token=: When additional results are obtained from the command, a `NextToken` parameter is returned in the output.
documentation:
    command: Lists the profiles associated with your Amazon Web Services account for your current or specified region. A profile is the mechanism used to create the concept of a private network.
    flag:
        max-results: Specifies the maximum number of profiles to return.
        next-token: When additional results are obtained from the command, a `NextToken` parameter is returned in the output. You can then pass the `NextToken` parameter in a subsequent command to continue listing additional resources.
