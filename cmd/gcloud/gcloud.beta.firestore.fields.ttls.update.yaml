name: update
description: '*(BETA)*  Update the TTL configuration of the given field.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --collection-group=: Collection group of the field.
    --database=: Database of the field.
    --disable-ttl: Set to make this field no longer the TTL for its collection group.
    --enable-ttl: Set to enable this field as the TTL for its collection group.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-disable-ttl&: Set to make this field no longer the TTL for its collection group.
    --no-enable-ttl&: Set to enable this field as the TTL for its collection group.
documentation:
    command: |
        *(BETA)*  Update the TTL configuration of the given field.

        This enables or disables using a field as the TTL field for its collection group or kind. Note
        that only one field can be the TTL field for a collection group.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        collection-group: |-
            Collection group of the field.
            +

            To set the `collection-group` attribute:
            * provide the argument `field` on the command line with a fully specified name;
            * provide the argument `--collection-group` on the command line.
        database: |-
            Database of the field.
            +

            To set the `database` attribute:
            * provide the argument `field` on the command line with a fully specified name;
            * provide the argument `--database` on the command line;
            * the default value of argument [--database] is `(default)`.
        disable-ttl: Set to make this field no longer the TTL for its collection group.
        enable-ttl: Set to enable this field as the TTL for its collection group.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-disable-ttl: Set to make this field no longer the TTL for its collection group.
        no-enable-ttl: Set to enable this field as the TTL for its collection group.
