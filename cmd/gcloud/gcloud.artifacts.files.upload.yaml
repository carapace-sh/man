name: upload
description: Uploads files to Artifact Registry.
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --file=: The name under which the file will be uploaded.
    --location=: Location of the repository.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-skip-existing&: If specified, skip uploading files that already exist in the repository, and continue to upload the remaining files.
    --repository=: ID of the repository or fully qualified identifier for the repository.
    --skip-existing: If specified, skip uploading files that already exist in the repository, and continue to upload the remaining files.
    --source-directory=: The directory you are uploading.
    --source=: The path to the file you are uploading.
documentation:
    command: Uploads files to Artifact Registry.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        file: The name under which the file will be uploaded. If not specified, the name of the local file is used.
        location: |-
            Location of the repository.
            +
            To set the `location` attribute:
            * provide the argument `--repository` on the command line with a fully specified name;
            * set the property `artifacts/repository` with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `artifacts/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-skip-existing: If specified, skip uploading files that already exist in the repository, and continue to upload the remaining files.
        repository: |-
            ID of the repository or fully qualified identifier for the repository.
            +
            To set the `repository` attribute:
            * provide the argument `--repository` on the command line;
            * set the property `artifacts/repository`.
        skip-existing: If specified, skip uploading files that already exist in the repository, and continue to upload the remaining files.
        source: The path to the file you are uploading.
        source-directory: The directory you are uploading.
