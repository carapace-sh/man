name: get-selling-system-settings
description: Retrieves the currently set system settings, which include the IAM Role used for resource snapshot jobs.
flags:
    --catalog=!: Specifies the catalog in which the settings are defined.
documentation:
    command: Retrieves the currently set system settings, which include the IAM Role used for resource snapshot jobs.
    flag:
        catalog: Specifies the catalog in which the settings are defined. Acceptable values include `AWS` for production and `Sandbox` for testing environments.
