name: register-app-instance-user-endpoint
description: Registers an endpoint under an Amazon Chime `AppInstanceUser`.
flags:
    --allow-messages=: Boolean that controls whether the AppInstanceUserEndpoint is opted in to receive messages.
    --app-instance-user-arn=!: The ARN of the `AppInstanceUser`.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=!: The unique ID assigned to the request.
    --endpoint-attributes=!: The attributes of an `Endpoint`.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=: The name of the `AppInstanceUserEndpoint`.
    --resource-arn=!: The ARN of the resource to which the endpoint belongs.
    --type=!: The type of the `AppInstanceUserEndpoint`.
completion:
    flag:
        allow-messages:
            - ALL
            - NONE
        type:
            - APNS
            - APNS_SANDBOX
            - GCM
documentation:
    command: Registers an endpoint under an Amazon Chime `AppInstanceUser`. The endpoint receives messages for a user. For push notifications, the endpoint is a mobile device used to receive mobile push notifications for a user.
    flag:
        allow-messages: Boolean that controls whether the AppInstanceUserEndpoint is opted in to receive messages. `ALL` indicates the endpoint receives all messages. `NONE` indicates the endpoint receives no messages.
        app-instance-user-arn: The ARN of the `AppInstanceUser`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: The unique ID assigned to the request. Use different tokens to register other endpoints.
        endpoint-attributes: The attributes of an `Endpoint`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the `AppInstanceUserEndpoint`.
        resource-arn: The ARN of the resource to which the endpoint belongs.
        type: |-
            The type of the `AppInstanceUserEndpoint`. Supported types:

            - `APNS`: The mobile notification service for an Apple device.
            - `APNS_SANDBOX`: The sandbox environment of the mobile notification service for an Apple device.
            - `GCM`: The mobile notification service for an Android device.

            Populate the `ResourceArn` value of each type as `PinpointAppArn`.
