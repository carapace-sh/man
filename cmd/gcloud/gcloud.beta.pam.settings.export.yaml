name: export
description: '*(BETA)*  Export Privileged Access Manager (PAM) settings configured on a project, folder, or organization to a local YAML file.'
flags:
    --destination=: Path to a YAML file where the configuration will be exported.
    --folder=: The name of the folder
    --location=!: ID of the location or fully qualified identifier for the location.
    --organization=: The name of the organization
documentation:
    command: |
        *(BETA)*  Export the Privileged Access Manager (PAM) settings configured for a specified project,
        folder, or organization to a local YAML file.
    flag:
        destination: |-
            Path to a YAML file where the configuration will be exported.
            The exported data will not contain any output-only fields.
            Alternatively, you may omit this flag to write to standard output.
            For a schema describing the export/import format, see
            $CLOUDSDKROOT/lib/googlecloudsdk/schemas/...
        folder: |-
            The name of the folder
            +
            To set the `folder` attribute:
            * provide the argument `--location` on the command line with a fully specified name;
            * provide the argument `--folder` on the command line. Must be specified for resource of type [privilegedaccessmanager.folders.locations].
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line.
        organization: |-
            The name of the organization
            +
            To set the `organization` attribute:
            * provide the argument `--location` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line. Must be specified for resource of type [privilegedaccessmanager.organizations.locations].
