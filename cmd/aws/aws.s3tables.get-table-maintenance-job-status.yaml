name: get-table-maintenance-job-status
description: Gets the status of a maintenance job for a table.
flags:
    --name=!: The name of the table containing the maintenance job status you want to check.
    --namespace=!: The name of the namespace the table is associated with.
    --table-bucket-arn=!: The Amazon Resource Name (ARN) of the table bucket.
documentation:
    command: |-
        Gets the status of a maintenance job for a table. For more information, see [S3 Tables maintenance](https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-tables-maintenance.html) in the *Amazon Simple Storage Service User Guide*.

        Permissions

        You must have the `s3tables:GetTableMaintenanceJobStatus` permission to use this operation.
    flag:
        name: The name of the table containing the maintenance job status you want to check.
        namespace: The name of the namespace the table is associated with.
        table-bucket-arn: The Amazon Resource Name (ARN) of the table bucket.
