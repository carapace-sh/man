name: list-rules
description: Lists existing rules.
flags:
    --action=: The action of the rule.
    --asset-types=: The asset types of the rule.
    --data-product: The data product of the rule.
    --domain-identifier=!: The ID of the domain in which the rules are to be listed.
    --include-cascaded: Specifies whether to include cascading rules in the results.
    --max-results=: The maximum number of rules to return in a single call to `ListRules`.
    --next-token=: When the number of rules is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of rules, the response includes a pagination token named `NextToken`.
    --no-data-product: The data product of the rule.
    --no-include-cascaded: Specifies whether to include cascading rules in the results.
    --project-ids=: The IDs of projects in which rules are to be listed.
    --rule-type=: The type of the rule.
    --target-identifier=!: The target ID of the rule.
    --target-type=!: The target type of the rule.
completion:
    flag:
        action:
            - CREATE_LISTING_CHANGE_SET
            - CREATE_SUBSCRIPTION_REQUEST
        rule-type:
            - METADATA_FORM_ENFORCEMENT
        target-type:
            - DOMAIN_UNIT
documentation:
    command: Lists existing rules. In Amazon DataZone, a rule is a formal agreement that enforces specific requirements across user workflows (e.g., publishing assets to the catalog, requesting subscriptions, creating projects) within the Amazon DataZone data portal. These rules help maintain consistency, ensure compliance, and uphold governance standards in data management processes. For instance, a metadata enforcement rule can specify the required information for creating a subscription request or publishing a data asset to the catalog, ensuring alignment with organizational standards.
    flag:
        action: The action of the rule.
        asset-types: The asset types of the rule.
        data-product: The data product of the rule.
        domain-identifier: The ID of the domain in which the rules are to be listed.
        include-cascaded: Specifies whether to include cascading rules in the results.
        max-results: The maximum number of rules to return in a single call to `ListRules`. When the number of rules to be listed is greater than the value of `MaxResults`, the response contains a `NextToken` value that you can use in a subsequent call to `ListRules` to list the next set of rules.
        next-token: When the number of rules is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of rules, the response includes a pagination token named `NextToken`. You can specify this `NextToken` value in a subsequent call to `ListRules` to list the next set of rules.
        project-ids: The IDs of projects in which rules are to be listed.
        rule-type: The type of the rule.
        target-identifier: The target ID of the rule.
        target-type: The target type of the rule.
