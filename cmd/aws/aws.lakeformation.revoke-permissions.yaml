name: revoke-permissions
description: Revokes permissions to the principal to access metadata in the Data Catalog and data organized in underlying data storage such as Amazon S3.
flags:
    --catalog-id=: The identifier for the Data Catalog.
    --condition=: ""
    --permissions-with-grant-option=: Indicates a list of permissions for which to revoke the grant option allowing the principal to pass permissions to other principals.
    --permissions=!: The permissions revoked to the principal on the resource.
    --principal=!: The principal to be revoked permissions on the resource.
    --resource=!: The resource to which permissions are to be revoked.
documentation:
    command: Revokes permissions to the principal to access metadata in the Data Catalog and data organized in underlying data storage such as Amazon S3.
    flag:
        catalog-id: The identifier for the Data Catalog. By default, the account ID. The Data Catalog is the persistent metadata store. It contains database definitions, table definitions, and other control information to manage your Lake Formation environment.
        condition: ""
        permissions: The permissions revoked to the principal on the resource. For information about permissions, see [Security and Access Control to Metadata and Data](https://docs.aws.amazon.com/lake-formation/latest/dg/security-data-access.html).
        permissions-with-grant-option: Indicates a list of permissions for which to revoke the grant option allowing the principal to pass permissions to other principals.
        principal: The principal to be revoked permissions on the resource.
        resource: The resource to which permissions are to be revoked.
