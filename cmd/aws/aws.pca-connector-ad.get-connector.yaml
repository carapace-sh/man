name: get-connector
description: Lists information about your connector.
flags:
    --connector-arn=!: The Amazon Resource Name (ARN) that was returned when you called [CreateConnector](https://docs.aws.amazon.com/pca-connector-ad/latest/APIReference/API_CreateConnector.html).
documentation:
    command: Lists information about your connector. You specify the connector on input by its ARN (Amazon Resource Name).
    flag:
        connector-arn: The Amazon Resource Name (ARN) that was returned when you called [CreateConnector](https://docs.aws.amazon.com/pca-connector-ad/latest/APIReference/API_CreateConnector.html).
