name: describe-transit-gateways
description: Describes one or more transit gateways.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: One or more filters.
    --max-results=: The maximum number of results to return with a single call.
    --next-token=: The token for the next page of results.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --transit-gateway-ids=: The IDs of the transit gateways.
documentation:
    command: Describes one or more transit gateways. By default, all transit gateways are described. Alternatively, you can filter the results.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            One or more filters. The possible values are:

            - `options.propagation-default-route-table-id` - The ID of the default propagation route table.
            - `options.amazon-side-asn` - The private ASN for the Amazon side of a BGP session.
            - `options.association-default-route-table-id` - The ID of the default association route table.
            - `options.auto-accept-shared-attachments` - Indicates whether there is automatic acceptance of attachment requests (`enable` | `disable`).
            - `options.default-route-table-association` - Indicates whether resource attachments are automatically associated with the default association route table (`enable` | `disable`).
            - `options.default-route-table-propagation` - Indicates whether resource attachments automatically propagate routes to the default propagation route table (`enable` | `disable`).
            - `options.dns-support` - Indicates whether DNS support is enabled (`enable` | `disable`).
            - `options.vpn-ecmp-support` - Indicates whether Equal Cost Multipath Protocol support is enabled (`enable` | `disable`).
            - `owner-id` - The ID of the Amazon Web Services account that owns the transit gateway.
            - `state` - The state of the transit gateway (`available` | `deleted` | `deleting` | `modifying` | `pending`).
            - `transit-gateway-id` - The ID of the transit gateway.
            - `tag-key`- The key/value combination of a tag assigned to the resource. Use the tag key in the filter name and the tag value as the filter value. For example, to find all resources that have a tag with the key `Owner` and the value `TeamA`, specify `tag:Owner` for the filter name and `TeamA` for the filter value.
        max-results: The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned `nextToken` value.
        next-token: The token for the next page of results.
        transit-gateway-ids: The IDs of the transit gateways.
