name: create
description: '*(BETA)*  Creates a restore.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --backup=!: Name of the backup from which to restore under the backup plan specified
    --description=: Optional text description for the restore.
    --filter-file=: JSON/YAML file containing the configuration of the fine-grained
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: Google Cloud location.
    --no-async&: ""
    --no-wait-for-completion&: Wait for the created restore to complete.
    --restore-plan=: Restore Plan name.
    --volume-data-restore-policy-overrides-file=: If provided, defines an array of volume data restore policy overrides
    --wait-for-completion: Wait for the created restore to complete.
documentation:
    command: |-
        *(BETA)*  Creates a Backup for GKE restore.

        ## EXAMPLES

        To create a restore ``my-restore'' in location ``us-central1'' under restore
        plan ``my-restore-plan'', run:

          $ gcloud beta container backup-restore restores create my-restore --project=my-project --location=us-central1
          --restore-plan=my-restore-plan
          --backup=projects/my-project/locations/us-east1/backupPlans/my-backup-plan/backups/my-backup
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        backup: |-
            Name of the backup from which to restore under the backup plan specified
            in restore plan.
            Format: projects/<project>/locations/<location>/backupPlans/<backupPlan>/backups/<backup>.
        description: Optional text description for the restore.
        filter-file: |-
            JSON/YAML file containing the configuration of the fine-grained
            restore filter which can be used to further refine the resource
            selection of the Restore beyond the coarse-grained scope defined
            in the RestorePlan.
            +
            For more information about examples and how to use this filter,
            please refer to the Backup for GKE documentation:
            https://cloud.google.com/kubernetes-engine/docs/add-on/backup-for-gke/how-to/fine-grained-restore.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `restore` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkebackup/location`.
        no-async: |
            Return immediately, without waiting for the operation in progress to
            complete.
        no-wait-for-completion: Wait for the created restore to complete.
        restore-plan: |-
            Restore Plan name.
            +
            To set the `restore-plan` attribute:
            * provide the argument `restore` on the command line with a fully specified name;
            * provide the argument `--restore-plan` on the command line;
            * set the property `gkebackup/restore_plan`.
        volume-data-restore-policy-overrides-file: |-
            If provided, defines an array of volume data restore policy overrides
            from the given config file in yaml.
        wait-for-completion: Wait for the created restore to complete.
