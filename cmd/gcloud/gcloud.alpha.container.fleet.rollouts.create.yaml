name: create
description: '*(ALPHA)*  Create a rollout resource.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --binauthz-evaluation-mode=: Configure binary authorization mode for clusters to onboard the fleet,
    --binauthz-policy-bindings=: The relative resource name of the Binary Authorization policy to audit
    --config-sync-upgrade: Upgrade the config sync of the clusters in the fleet.
    --control-plane-upgrade: Upgrade the control plane of the clusters in the fleet.
    --display-name=: Display name of the rollout to be created (optional).
    --labels=: Labels for the rollout.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-config-sync-upgrade&: Upgrade the config sync of the clusters in the fleet.
    --no-control-plane-upgrade&: Upgrade the control plane of the clusters in the fleet.
    --security-posture=: To apply standard security posture to clusters in the fleet,
    --soak-duration=!: Soak time before starting the next wave.
    --start-time=: Start time (in the future) of the rollout.
    --target-version=!: The version to upgrade clusters from the fleet to.
    --workload-vulnerability-scanning=: To apply standard vulnerability scanning to clusters in the fleet,
completion:
    flag:
        binauthz-evaluation-mode:
            - disabled
            - policy-bindings
        security-posture:
            - disabled
            - standard
        workload-vulnerability-scanning:
            - disabled
            - standard
            - enterprise
documentation:
    command: '*(ALPHA)*  Create a rollout resource.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        binauthz-evaluation-mode: |-
            Configure binary authorization mode for clusters to onboard the fleet,
            +
              $ {command} --binauthz-evaluation-mode=policy-bindings
            +
            _BINAUTHZ_EVALUATION_MODE_ must be one of: *disabled*, *policy-bindings*.
        binauthz-policy-bindings: |-
            The relative resource name of the Binary Authorization policy to audit
            and/or enforce. GKE policies have the following format:
            `projects/{project_number}/platforms/gke/policies/{policy_id}`.
        config-sync-upgrade: Upgrade the config sync of the clusters in the fleet.
        control-plane-upgrade: Upgrade the control plane of the clusters in the fleet.
        display-name: |-
            Display name of the rollout to be created (optional). 4-30
            characters, alphanumeric and [ '"!-] only.
        labels: Labels for the rollout.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-config-sync-upgrade: Upgrade the config sync of the clusters in the fleet.
        no-control-plane-upgrade: Upgrade the control plane of the clusters in the fleet.
        security-posture: |-
            To apply standard security posture to clusters in the fleet,
            +
              $ {command} --security-posture=standard
            +
            _SECURITY_POSTURE_ must be one of: *disabled*, *standard*.
        soak-duration: |-
            Soak time before starting the next wave. e.g. `4h`, `2d6h`.
            Soak duration is required for Rollouts.
            +
            See $ gcloud topic datetimes for information on duration formats.
        start-time: |-
            Start time (in the future) of the rollout.
            +
            See $ gcloud topic datetimes for information on datetime formats.
        target-version: The version to upgrade clusters from the fleet to.
        workload-vulnerability-scanning: |-
            To apply standard vulnerability scanning to clusters in the fleet,
            +
              $ {command} --workload-vulnerability-scanning=standard
            +
            _WORKLOAD_VULNERABILITY_SCANNING_ must be one of: *disabled*, *standard*, *enterprise*.
