name: create-bot-alias
description: Creates an alias for the specified version of a bot.
flags:
    --bot-alias-locale-settings=: Maps configuration information to a specific locale.
    --bot-alias-name=!: The alias to create.
    --bot-id=!: The unique identifier of the bot that the alias applies to.
    --bot-version=: The version of the bot that this alias points to.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --conversation-log-settings=: Specifies whether Amazon Lex logs text and audio for a conversation with the bot.
    --description=: A description of the alias.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --sentiment-analysis-settings=: ""
    --tags=: A list of tags to add to the bot alias.
documentation:
    command: |-
        Creates an alias for the specified version of a bot. Use an alias to enable you to change the version of a bot without updating applications that use the bot.

        For example, you can create an alias called "PROD" that your applications use to call the Amazon Lex bot.
    flag:
        bot-alias-locale-settings: Maps configuration information to a specific locale. You can use this parameter to specify a specific Lambda function to run different functions in different locales.
        bot-alias-name: The alias to create. The name must be unique for the bot.
        bot-id: The unique identifier of the bot that the alias applies to.
        bot-version: The version of the bot that this alias points to. You can use the [UpdateBotAlias](https://docs.aws.amazon.com/lexv2/latest/APIReference/API_UpdateBotAlias.html) operation to change the bot version associated with the alias.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        conversation-log-settings: Specifies whether Amazon Lex logs text and audio for a conversation with the bot. When you enable conversation logs, text logs store text input, transcripts of audio input, and associated metadata in Amazon CloudWatch Logs. Audio logs store audio input in Amazon S3.
        description: A description of the alias. Use this description to help identify the alias.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        sentiment-analysis-settings: ""
        tags: A list of tags to add to the bot alias. You can only add tags when you create an alias, you can't use the `UpdateBotAlias` operation to update the tags on a bot alias. To update tags, use the `TagResource` operation.
