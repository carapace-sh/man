name: update-security-group-rule-descriptions-ingress
description: Updates the description of an ingress (inbound) security group rule.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --group-id=: The ID of the security group.
    --group-name=: \[Default VPC] The name of the security group.
    --ip-permissions=: The IP permissions for the security group rule.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --security-group-rule-descriptions=: The description for the ingress security group rules.
documentation:
    command: Updates the description of an ingress (inbound) security group rule. You can replace an existing description, or add a description to a rule that did not have one previously. You can remove a description for a security group rule by omitting the description parameter in the request.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        group-id: The ID of the security group. You must specify either the security group ID or the security group name in the request. For security groups in a nondefault VPC, you must specify the security group ID.
        group-name: \[Default VPC] The name of the security group. You must specify either the security group ID or the security group name. For security groups in a nondefault VPC, you must specify the security group ID.
        ip-permissions: The IP permissions for the security group rule. You must specify either IP permissions or a description.
        security-group-rule-descriptions: The description for the ingress security group rules. You must specify either a description or IP permissions.
