name: list-model-explainability-job-definitions
description: Lists model explainability job definitions that satisfy various filters.
flags:
    --creation-time-after=: A filter that returns only model explainability jobs created after a specified time.
    --creation-time-before=: A filter that returns only model explainability jobs created before a specified time.
    --endpoint-name=: Name of the endpoint to monitor for model explainability.
    --max-results=: The maximum number of jobs to return in the response.
    --name-contains=: Filter for model explainability jobs whose name contains a specified string.
    --next-token=: The token returned if the response is truncated.
    --sort-by=: Whether to sort results by the `Name` or `CreationTime` field.
    --sort-order=: Whether to sort the results in `Ascending` or `Descending` order.
completion:
    flag:
        sort-by:
            - Name
            - CreationTime
        sort-order:
            - Ascending
            - Descending
documentation:
    command: Lists model explainability job definitions that satisfy various filters.
    flag:
        creation-time-after: A filter that returns only model explainability jobs created after a specified time.
        creation-time-before: A filter that returns only model explainability jobs created before a specified time.
        endpoint-name: Name of the endpoint to monitor for model explainability.
        max-results: The maximum number of jobs to return in the response. The default value is 10.
        name-contains: Filter for model explainability jobs whose name contains a specified string.
        next-token: The token returned if the response is truncated. To retrieve the next set of job executions, use it in the next request.
        sort-by: Whether to sort results by the `Name` or `CreationTime` field. The default is `CreationTime`.
        sort-order: Whether to sort the results in `Ascending` or `Descending` order. The default is `Descending`.
