name: update-group-query
description: Updates the resource query of a group.
flags:
    --group-name=: Don't use this parameter.
    --group=: The name or the Amazon resource name (ARN) of the resource group to query.
    --resource-query=!: The resource query to determine which Amazon Web Services resources are members of this resource group.
documentation:
    command: |-
        Updates the resource query of a group. For more information about resource queries, see [Create a tag-based group in Resource Groups](https://docs.aws.amazon.com/ARG/latest/userguide/gettingstarted-query.html#gettingstarted-query-cli-tag).

        **Minimum permissions**

        To run this command, you must have the following permissions:

        - `resource-groups:UpdateGroupQuery`
    flag:
        group: The name or the Amazon resource name (ARN) of the resource group to query.
        group-name: Don't use this parameter. Use `Group` instead.
        resource-query: |-
            The resource query to determine which Amazon Web Services resources are members of this resource group.

            A resource group can contain either a `Configuration` or a `ResourceQuery`, but not both.
