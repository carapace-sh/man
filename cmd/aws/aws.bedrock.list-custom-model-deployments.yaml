name: list-custom-model-deployments
description: Lists custom model deployments in your account.
flags:
    --created-after=: Filters deployments created after the specified date and time.
    --created-before=: Filters deployments created before the specified date and time.
    --max-results=: The maximum number of results to return in a single call.
    --model-arn-equals=: Filters deployments by the Amazon Resource Name (ARN) of the associated custom model.
    --name-contains=: Filters deployments whose names contain the specified string.
    --next-token=: The token for the next set of results.
    --sort-by=: The field to sort the results by.
    --sort-order=: The sort order for the results.
    --status-equals=: Filters deployments by status.
completion:
    flag:
        sort-by:
            - CreationTime
        sort-order:
            - Ascending
            - Descending
        status-equals:
            - Creating
            - Active
            - Failed
documentation:
    command: |-
        Lists custom model deployments in your account. You can filter the results by creation time, name, status, and associated model. Use this operation to manage and monitor your custom model deployments.

        We recommend using pagination to ensure that the operation returns quickly and successfully.

        The following actions are related to the `ListCustomModelDeployments` operation:

        - [CreateCustomModelDeployment](https://docs.aws.amazon.com/bedrock/latest/APIReference/API_CreateCustomModelDeployment.html)
        - [GetCustomModelDeployment](https://docs.aws.amazon.com/bedrock/latest/APIReference/API_GetCustomModelDeployment.html)
        - [DeleteCustomModelDeployment](https://docs.aws.amazon.com/bedrock/latest/APIReference/API_DeleteCustomModelDeployment.html)
    flag:
        created-after: Filters deployments created after the specified date and time.
        created-before: Filters deployments created before the specified date and time.
        max-results: The maximum number of results to return in a single call.
        model-arn-equals: Filters deployments by the Amazon Resource Name (ARN) of the associated custom model.
        name-contains: Filters deployments whose names contain the specified string.
        next-token: The token for the next set of results. Use this token to retrieve additional results when the response is truncated.
        sort-by: The field to sort the results by. The only supported value is `CreationTime`.
        sort-order: The sort order for the results. Valid values are `Ascending` and `Descending`. Default is `Descending`.
        status-equals: Filters deployments by status. Valid values are `CREATING`, `ACTIVE`, and `FAILED`.
