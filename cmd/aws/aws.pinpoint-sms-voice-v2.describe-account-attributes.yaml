name: describe-account-attributes
description: Describes attributes of your Amazon Web Services account.
flags:
    --max-results=: The maximum number of results to return per each request.
    --next-token=: The token to be used for the next set of paginated results.
documentation:
    command: |-
        Describes attributes of your Amazon Web Services account. The supported account attributes include account tier, which indicates whether your account is in the sandbox or production environment. When you're ready to move your account out of the sandbox, create an Amazon Web Services Support case for a service limit increase request.

        New accounts are placed into an SMS or voice sandbox. The sandbox protects both Amazon Web Services end recipients and SMS or voice recipients from fraud and abuse.
    flag:
        max-results: The maximum number of results to return per each request.
        next-token: The token to be used for the next set of paginated results. You don't need to supply a value for this field in the initial request.
