name: send-pipeline-execution-step-success
description: Notifies the pipeline that the execution of a callback step succeeded and provides a list of the step's output parameters.
flags:
    --callback-token=!: The pipeline generated token from the Amazon SQS queue.
    --client-request-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the operation.
    --output-parameters=: A list of the output parameters of the callback step.
documentation:
    command: Notifies the pipeline that the execution of a callback step succeeded and provides a list of the step's output parameters. When a callback step is run, the pipeline generates a callback token and includes the token in a message sent to Amazon Simple Queue Service (Amazon SQS).
    flag:
        callback-token: The pipeline generated token from the Amazon SQS queue.
        client-request-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the operation. An idempotent operation completes no more than one time.
        output-parameters: A list of the output parameters of the callback step.
