name: delete-load-balancer-tls-certificate
description: Deletes an SSL/TLS certificate associated with a Lightsail load balancer.
flags:
    --certificate-name=!: The SSL/TLS certificate name.
    --force: When `true`, forces the deletion of an SSL/TLS certificate.
    --load-balancer-name=!: The load balancer name.
    --no-force: When `true`, forces the deletion of an SSL/TLS certificate.
documentation:
    command: |-
        Deletes an SSL/TLS certificate associated with a Lightsail load balancer.

        The `DeleteLoadBalancerTlsCertificate` operation supports tag-based access control via resource tags applied to the resource identified by `load balancer name`. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-controlling-access-using-tags).
    flag:
        certificate-name: The SSL/TLS certificate name.
        force: |-
            When `true`, forces the deletion of an SSL/TLS certificate.

            There can be two certificates associated with a Lightsail load balancer: the primary and the backup. The `force` parameter is required when the primary SSL/TLS certificate is in use by an instance attached to the load balancer.
        load-balancer-name: The load balancer name.
