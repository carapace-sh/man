name: simulate-maintenance-event
description: '*(ALPHA)*  Simulates a maintenance event on a Cloud TPU VM.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --workers=: The zero-based ID(s) of workers on which to simulate maintenance.
    --zone=: The compute/zone of the Cloud TPU.
documentation:
    command: '*(ALPHA)*  For testing the resilience of applications build on top of Cloud TPUs.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        workers: |-
            The zero-based ID(s) of workers on which to simulate maintenance. By default, only
            the first (ID 0) worker VM is flagged for maintenance.
        zone: |-
            The compute/zone of the Cloud TPU.
            +
            If not specified, will use `default` compute/zone.
            +

            To set the `zone` attribute:
            * provide the argument `tpu` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line;
            * set the property `compute/zone`.
