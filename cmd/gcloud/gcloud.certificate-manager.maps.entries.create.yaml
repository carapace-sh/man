name: create
description: Create a certificate map entry.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --certificates=!: IDs of the certificates or fully qualified identifiers for the certificates.
    --description=: Text description of a certificate map entry.
    --hostname=: A domain name (FQDN), which controls when list of certificates specified in the resource will be taken under consideration for certificate selection.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The Cloud location for the certificate map entry.
    --map=: The certificate map for the certificate map entry.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-set-primary&: The certificate will be used as the default cert if no other certificate in the map matches on SNI.
    --set-primary: The certificate will be used as the default cert if no other certificate in the map matches on SNI.
documentation:
    command: |-
        This command creates a certificate map entry.

        ## EXAMPLES

        To create a certificate map entry with name simple-entry, run:

          $ gcloud certificate-manager maps entries create simple-entry --map=simple-map --certificates=simple-cert
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        certificates: |-
            IDs of the certificates or fully qualified identifiers for the certificates.
            +
            To set the `certificate` attribute:
            * provide the argument `--certificates` on the command line.
        description: Text description of a certificate map entry.
        hostname: A domain name (FQDN), which controls when list of certificates specified in the resource will be taken under consideration for certificate selection.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The Cloud location for the certificate map entry.
            +
            To set the `location` attribute:
            * provide the argument `entry` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * default value of location is [global].
        map: |-
            The certificate map for the certificate map entry.
            +
            To set the `map` attribute:
            * provide the argument `entry` on the command line with a fully specified name;
            * provide the argument `--map` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-set-primary: The certificate will be used as the default cert if no other certificate in the map matches on SNI.
        set-primary: The certificate will be used as the default cert if no other certificate in the map matches on SNI.
