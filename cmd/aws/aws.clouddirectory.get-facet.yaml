name: get-facet
description: Gets details of the [Facet](), such as facet name, attributes, [Rule]()s, or `ObjectType`.
flags:
    --name=!: The name of the facet to retrieve.
    --schema-arn=!: The Amazon Resource Name (ARN) that is associated with the [Facet]().
documentation:
    command: Gets details of the [Facet](), such as facet name, attributes, [Rule]()s, or `ObjectType`. You can call this on all kinds of schema facets -- published, development, or applied.
    flag:
        name: The name of the facet to retrieve.
        schema-arn: The Amazon Resource Name (ARN) that is associated with the [Facet](). For more information, see [arns]().
