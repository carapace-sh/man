name: stop-dev-environment
description: Pauses a specified Dev Environment and places it in a non-running state.
flags:
    --id=!: The system-generated unique ID of the Dev Environment.
    --project-name=!: The name of the project in the space.
    --space-name=!: The name of the space.
documentation:
    command: Pauses a specified Dev Environment and places it in a non-running state. Stopped Dev Environments do not consume compute minutes.
    flag:
        id: The system-generated unique ID of the Dev Environment.
        project-name: The name of the project in the space.
        space-name: The name of the space.
