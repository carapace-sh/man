name: describe-directories
description: Obtains information about the directories that belong to this account.
flags:
    --directory-ids=: A list of identifiers of the directories for which to obtain the information.
    --limit=: The maximum number of items to return.
    --next-token=: The `DescribeDirectoriesResult.NextToken` value from a previous call to [DescribeDirectories]().
documentation:
    command: |-
        Obtains information about the directories that belong to this account.

        You can retrieve information about specific directories by passing the directory identifiers in the `DirectoryIds` parameter. Otherwise, all directories that belong to the current account are returned.

        This operation supports pagination with the use of the `NextToken` request and response parameters. If more results are available, the `DescribeDirectoriesResult.NextToken` member contains a token that you pass in the next call to [DescribeDirectories]() to retrieve the next set of items.

        You can also specify a maximum number of return results with the `Limit` parameter.
    flag:
        directory-ids: |-
            A list of identifiers of the directories for which to obtain the information. If this member is null, all directories that belong to the current account are returned.

            An empty list results in an `InvalidParameterException` being thrown.
        limit: The maximum number of items to return. If this value is zero, the maximum number of items is specified by the limitations of the operation.
        next-token: The `DescribeDirectoriesResult.NextToken` value from a previous call to [DescribeDirectories](). Pass null if this is the first call.
