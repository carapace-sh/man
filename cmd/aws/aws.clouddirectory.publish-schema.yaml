name: publish-schema
description: Publishes a development schema with a major version and a recommended minor version.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --development-schema-arn=!: The Amazon Resource Name (ARN) that is associated with the development schema.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --minor-version=: The minor version under which the schema will be published.
    --name=: The new name under which the schema will be published.
    --version=!: The major version under which the schema will be published.
documentation:
    command: Publishes a development schema with a major version and a recommended minor version.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        development-schema-arn: The Amazon Resource Name (ARN) that is associated with the development schema. For more information, see [arns]().
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        minor-version: The minor version under which the schema will be published. This parameter is recommended. Schemas have both a major and minor version associated with them.
        name: The new name under which the schema will be published. If this is not provided, the development schema is considered.
        version: The major version under which the schema will be published. Schemas have both a major and minor version associated with them.
