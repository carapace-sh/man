name: delete-bgp-peer
description: Deletes the specified BGP peer on the specified virtual interface with the specified customer address and ASN.
flags:
    --asn-long=: The long ASN for the BGP peer to be deleted from a Direct Connect virtual interface.
    --asn=: The autonomous system number (ASN).
    --bgp-peer-id=: The ID of the BGP peer.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --customer-address=: The IP address assigned to the customer interface.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --virtual-interface-id=: The ID of the virtual interface.
documentation:
    command: |-
        Deletes the specified BGP peer on the specified virtual interface with the specified customer address and ASN.

        You cannot delete the last BGP peer from a virtual interface.
    flag:
        asn: |-
            The autonomous system number (ASN). The valid range is from 1 to 2147483646 for Border Gateway Protocol (BGP) configuration. If you provide a number greater than the maximum, an error is returned. Use `asnLong` instead.

            You can use `asnLong` or `asn`, but not both. We recommend using `asnLong` as it supports a greater pool of numbers.

            - The `asnLong` attribute accepts both ASN and long ASN ranges.
            - If you provide a value in the same API call for both `asn` and `asnLong`, the API will only accept the value for `asnLong`.
        asn-long: |-
            The long ASN for the BGP peer to be deleted from a Direct Connect virtual interface. The valid range is from 1 to 4294967294 for BGP configuration.

            You can use `asnLong` or `asn`, but not both. We recommend using `asnLong` as it supports a greater pool of numbers.

            - The `asnLong` attribute accepts both ASN and long ASN ranges.
            - If you provide a value in the same API call for both `asn` and `asnLong`, the API will only accept the value for `asnLong`.
        bgp-peer-id: The ID of the BGP peer.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        customer-address: The IP address assigned to the customer interface.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        virtual-interface-id: The ID of the virtual interface.
