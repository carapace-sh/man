name: describe-capacity-block-offerings
description: Describes Capacity Block offerings available for purchase in the Amazon Web Services Region that you're currently using.
flags:
    --capacity-duration-hours=!: The reservation duration for the Capacity Block, in hours.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --end-date-range=: The latest end date for the Capacity Block offering.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-count=: The number of instances for which to reserve capacity.
    --instance-type=: The type of instance for which the Capacity Block offering reserves capacity.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of items to return for this request.
    --next-token=: The token to use to retrieve the next page of results.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --page-size=: The size of each page to get in the AWS service call.
    --start-date-range=: The earliest start date for the Capacity Block offering.
    --starting-token=: A token to specify where to start paginating.
    --ultraserver-count=: The number of EC2 UltraServers in the offerings.
    --ultraserver-type=: The EC2 UltraServer type of the Capacity Block offerings.
documentation:
    command: |-
        Describes Capacity Block offerings available for purchase in the Amazon Web Services Region that you're currently using. With Capacity Blocks, you can purchase a specific GPU instance type or EC2 UltraServer for a period of time.

        To search for an available Capacity Block offering, you specify a reservation duration and instance count.
    flag:
        capacity-duration-hours: The reservation duration for the Capacity Block, in hours. You must specify the duration in 1-day increments up 14 days, and in 7-day increments up to 182 days.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        end-date-range: The latest end date for the Capacity Block offering.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-count: The number of instances for which to reserve capacity. Each Capacity Block can have up to 64 instances, and you can have up to 256 instances across Capacity Blocks.
        instance-type: The type of instance for which the Capacity Block offering reserves capacity.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of items to return for this request. To get the next page of items, make another request with the token returned in the output. For more information, see [Pagination](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Query-Requests.html#api-pagination).
        next-token: The token to use to retrieve the next page of results.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        start-date-range: The earliest start date for the Capacity Block offering.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        ultraserver-count: The number of EC2 UltraServers in the offerings.
        ultraserver-type: The EC2 UltraServer type of the Capacity Block offerings.
