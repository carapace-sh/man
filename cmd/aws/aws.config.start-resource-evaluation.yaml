name: start-resource-evaluation
description: Runs an on-demand evaluation for the specified resource to determine whether the resource details will comply with configured Config rules.
flags:
    --client-token=: A client token is a unique, case-sensitive string of up to 64 ASCII characters.
    --evaluation-context=: Returns an `EvaluationContext` object.
    --evaluation-mode=!: The mode of an evaluation.
    --evaluation-timeout=: The timeout for an evaluation.
    --resource-details=!: Returns a `ResourceDetails` object.
completion:
    flag:
        evaluation-mode:
            - DETECTIVE
            - PROACTIVE
documentation:
    command: |-
        Runs an on-demand evaluation for the specified resource to determine whether the resource details will comply with configured Config rules. You can also use it for evaluation purposes. Config recommends using an evaluation context. It runs an execution against the resource details with all of the Config rules in your account that match with the specified proactive mode and resource type.

        Ensure you have the `cloudformation:DescribeType` role setup to validate the resource type schema.

        You can find the [Resource type schema](https://docs.aws.amazon.com/cloudformation-cli/latest/userguide/resource-type-schema.html) in "*Amazon Web Services public extensions*" within the CloudFormation registry or with the following CLI commmand: `aws cloudformation describe-type --type-name "AWS::S3::Bucket" --type RESOURCE`.

        For more information, see [Managing extensions through the CloudFormation registry](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/registry.html#registry-view) and [Amazon Web Services resource and property types reference](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-template-resource-type-ref.html) in the CloudFormation User Guide.
    flag:
        client-token: |-
            A client token is a unique, case-sensitive string of up to 64 ASCII characters. To make an idempotent API request using one of these actions, specify a client token in the request.

            Avoid reusing the same client token for other API requests. If you retry a request that completed successfully using the same client token and the same parameters, the retry succeeds without performing any further actions. If you retry a successful request using the same client token, but one or more of the parameters are different, other than the Region or Availability Zone, the retry fails with an IdempotentParameterMismatch error.
        evaluation-context: Returns an `EvaluationContext` object.
        evaluation-mode: |-
            The mode of an evaluation.

            The only valid value for this API is `PROACTIVE`.
        evaluation-timeout: The timeout for an evaluation. The default is 900 seconds. You cannot specify a number greater than 3600. If you specify 0, Config uses the default.
        resource-details: Returns a `ResourceDetails` object.
