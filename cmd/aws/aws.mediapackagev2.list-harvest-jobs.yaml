name: list-harvest-jobs
description: Retrieves a list of harvest jobs that match the specified criteria.
flags:
    --channel-group-name=!: The name of the channel group to filter the harvest jobs by.
    --channel-name=: The name of the channel to filter the harvest jobs by.
    --max-results=: The maximum number of harvest jobs to return in a single request.
    --next-token=: A token used for pagination.
    --origin-endpoint-name=: The name of the origin endpoint to filter the harvest jobs by.
    --status=: The status to filter the harvest jobs by.
completion:
    flag:
        status:
            - QUEUED
            - IN_PROGRESS
            - CANCELLED
            - COMPLETED
            - FAILED
documentation:
    command: Retrieves a list of harvest jobs that match the specified criteria.
    flag:
        channel-group-name: The name of the channel group to filter the harvest jobs by. If specified, only harvest jobs associated with channels in this group will be returned.
        channel-name: The name of the channel to filter the harvest jobs by. If specified, only harvest jobs associated with this channel will be returned.
        max-results: The maximum number of harvest jobs to return in a single request. If not specified, a default value will be used.
        next-token: A token used for pagination. Provide this value in subsequent requests to retrieve the next set of results.
        origin-endpoint-name: The name of the origin endpoint to filter the harvest jobs by. If specified, only harvest jobs associated with this origin endpoint will be returned.
        status: The status to filter the harvest jobs by. If specified, only harvest jobs with this status will be returned.
