name: update
description: '*(ALPHA)*  Updates an App Engine application.'
flags:
    --no-split-health-checks&: Enables/disables split health checks by default on new deployments.
    --service-account=: The app-level default service account to update the app with.
    --split-health-checks: Enables/disables split health checks by default on new deployments.
    --ssl-policy=: The app-level SSL policy to update the app with.
completion:
    flag:
        ssl-policy:
            - TLS_VERSION_1_0
            - TLS_VERSION_1_2
documentation:
    command: |+
        *(ALPHA)*  This command is used to update settings on an app engine application.

    flag:
        no-split-health-checks: Enables/disables split health checks by default on new deployments.
        service-account: The app-level default service account to update the app with.
        split-health-checks: Enables/disables split health checks by default on new deployments. Use *--split-health-checks* to enable and *--no-split-health-checks* to disable.
        ssl-policy: 'The app-level SSL policy to update the app with. _SSL_POLICY_ must be one of: *TLS_VERSION_1_0*, *TLS_VERSION_1_2*.'
