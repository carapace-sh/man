name: untag-resource
description: Removes tags from an Cloud9 development environment.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the Cloud9 development environment to remove tags from.
    --tag-keys=!: The tag names of the tags to remove from the given Cloud9 development environment.
documentation:
    command: |-
        Removes tags from an Cloud9 development environment.

        Cloud9 is no longer available to new customers. Existing customers of Cloud9 can continue to use the service as normal. [Learn more"](http://aws.amazon.com/blogs/devops/how-to-migrate-from-aws-cloud9-to-aws-ide-toolkits-or-aws-cloudshell/)
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the Cloud9 development environment to remove tags from.
        tag-keys: The tag names of the tags to remove from the given Cloud9 development environment.
