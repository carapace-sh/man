name: create-profile
description: Creates an empty Route 53 Profile.
flags:
    --client-token=!: '`ClientToken` is an idempotency token that ensures a call to `CreateProfile` completes only once.'
    --name=!: A name for the Profile.
    --tags=: A list of the tag keys and values that you want to associate with the Route 53 Profile.
documentation:
    command: Creates an empty Route 53 Profile.
    flag:
        client-token: '`ClientToken` is an idempotency token that ensures a call to `CreateProfile` completes only once. You choose the value to pass. For example, an issue might prevent you from getting a response from `CreateProfile`. In this case, safely retry your call to `CreateProfile` by using the same `CreateProfile` parameter value.'
        name: A name for the Profile.
        tags: A list of the tag keys and values that you want to associate with the Route 53 Profile.
