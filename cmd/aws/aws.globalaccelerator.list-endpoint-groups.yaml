name: list-endpoint-groups
description: List the endpoint groups that are associated with a listener.
flags:
    --listener-arn=!: The Amazon Resource Name (ARN) of the listener.
    --max-results=: The number of endpoint group objects that you want to return with this call.
    --next-token=: The token for the next set of results.
documentation:
    command: List the endpoint groups that are associated with a listener.
    flag:
        listener-arn: The Amazon Resource Name (ARN) of the listener.
        max-results: The number of endpoint group objects that you want to return with this call. The default value is 10.
        next-token: The token for the next set of results. You receive this token from a previous call.
