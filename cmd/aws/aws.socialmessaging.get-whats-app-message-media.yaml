name: get-whats-app-message-media
description: Get a media file from the WhatsApp service.
flags:
    --destination-s3-file=: The `bucketName` and `key` of the S3 media file.
    --destination-s3-presigned-url=: The presign url of the media file.
    --media-id=!: The unique identifier for the media file.
    --metadata-only: Set to `True` to get only the metadata for the file.
    --no-metadata-only&: Set to `True` to get only the metadata for the file.
    --origination-phone-number-id=!: The unique identifier of the originating phone number for the WhatsApp message media.
documentation:
    command: Get a media file from the WhatsApp service. On successful completion the media file is retrieved from Meta and stored in the specified Amazon S3 bucket. Use either `destinationS3File` or `destinationS3PresignedUrl` for the destination. If both are used then an `InvalidParameterException` is returned.
    flag:
        destination-s3-file: The `bucketName` and `key` of the S3 media file.
        destination-s3-presigned-url: The presign url of the media file.
        media-id: The unique identifier for the media file.
        metadata-only: Set to `True` to get only the metadata for the file.
        origination-phone-number-id: The unique identifier of the originating phone number for the WhatsApp message media. The phone number identifiers are formatted as `phone-number-id-01234567890123456789012345678901`. Use [GetLinkedWhatsAppBusinessAccount](https://docs.aws.amazon.com/social-messaging/latest/APIReference/API_GetLinkedWhatsAppBusinessAccountPhoneNumber.html) to find a phone number's id.
