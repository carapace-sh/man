name: detach-network-interface
description: Detaches a network interface from an instance.
flags:
    --attachment-id=!: The ID of the attachment.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --force: Specifies whether to force a detachment.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-force&: Specifies whether to force a detachment.
documentation:
    command: Detaches a network interface from an instance.
    flag:
        attachment-id: The ID of the attachment.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        force: |-
            Specifies whether to force a detachment.

            - Use the `Force` parameter only as a last resort to detach a network interface from a failed instance.
            - If you use the `Force` parameter to detach a network interface, you might not be able to attach a different network interface to the same index on the instance without first stopping and starting the instance.
            - If you force the detachment of a network interface, the [instance metadata](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-metadata.html) might not get updated. This means that the attributes associated with the detached network interface might still be visible. The instance metadata will get updated when you stop and start the instance.
