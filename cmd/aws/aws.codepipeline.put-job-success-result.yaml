name: put-job-success-result
description: Represents the success of a job as returned to the pipeline by a job worker.
flags:
    --continuation-token=: A token generated by a job worker, such as a CodeDeploy deployment ID, that a successful job provides to identify a custom action in progress.
    --current-revision=: The ID of the current revision of the artifact successfully worked on by the job.
    --execution-details=: The execution details of the successful job, such as the actions taken by the job worker.
    --job-id=!: The unique system-generated ID of the job that succeeded.
    --output-variables=: Key-value pairs produced as output by a job worker that can be made available to a downstream action configuration.
documentation:
    command: Represents the success of a job as returned to the pipeline by a job worker. Used for custom actions only.
    flag:
        continuation-token: A token generated by a job worker, such as a CodeDeploy deployment ID, that a successful job provides to identify a custom action in progress. Future jobs use this token to identify the running instance of the action. It can be reused to return more information about the progress of the custom action. When the action is complete, no continuation token should be supplied.
        current-revision: The ID of the current revision of the artifact successfully worked on by the job.
        execution-details: The execution details of the successful job, such as the actions taken by the job worker.
        job-id: The unique system-generated ID of the job that succeeded. This is the same ID returned from `PollForJobs`.
        output-variables: Key-value pairs produced as output by a job worker that can be made available to a downstream action configuration. `outputVariables` can be included only when there is no continuation token on the request.
