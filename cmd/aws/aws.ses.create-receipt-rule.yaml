name: create-receipt-rule
description: Creates a receipt rule.
flags:
    --after=: The name of an existing rule after which the new rule is placed.
    --rule-set-name=!: The name of the rule set where the receipt rule is added.
    --rule=!: A data structure that contains the specified rule's name, actions, recipients, domains, enabled status, scan status, and TLS policy.
documentation:
    command: |-
        Creates a receipt rule.

        For information about setting up receipt rules, see the [Amazon SES Developer Guide](https://docs.aws.amazon.com/ses/latest/dg/receiving-email-receipt-rules-console-walkthrough.html).

        You can execute this operation no more than once per second.
    flag:
        after: The name of an existing rule after which the new rule is placed. If this parameter is null, the new rule is inserted at the beginning of the rule list.
        rule: A data structure that contains the specified rule's name, actions, recipients, domains, enabled status, scan status, and TLS policy.
        rule-set-name: The name of the rule set where the receipt rule is added.
