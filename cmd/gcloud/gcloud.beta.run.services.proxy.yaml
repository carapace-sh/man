name: proxy
description: '*(BETA)*  Proxy a service to localhost authenticating as the active account or with the specified token.'
flags:
    --cluster-location=&: Zone in which the cluster is located.
    --cluster=&: ID of the cluster or fully qualified identifier for the cluster.
    --context=&: The name of the context in your kubectl config file to use for connecting.
    --kubeconfig=&: The absolute path to your kubectl config file.
    --namespace=: 'Specific to Cloud Run for Anthos: Kubernetes namespace for the service.'
    --no-show-exec-error&: If true and command fails, print the underlying command that was executed and its exit status.
    --platform=&: Target platform for running commands.
    --port=: Local port number to expose the proxied service.
    --region=: Region in which the resource can be found.
    --show-exec-error&: If true and command fails, print the underlying command that was executed and its exit status.
    --tag=: Traffic tag of the service to expose via the proxy.
    --token=: The specific identity token to add to all requests of the proxied service.
completion:
    flag:
        platform:
            - gke
            - kubernetes
            - managed
documentation:
    command: |
        *(BETA)*  Runs a server on localhost that proxies requests to the specified Cloud Run
        Service with credentials attached.

        You can use this to test services protected with IAM authentication.

        The Cloud Run service must be reachable from the machine running this
        command. For example, if the Cloud Run Service is configured to only allow
        `internal` ingress, this command will not work from outside the service's
        VPC network.
    flag:
        cluster: |-
            ID of the cluster or fully qualified identifier for the cluster.

            To set the `cluster` attribute:
            * provide the argument `--cluster` on the command line;
            * set the property `run/cluster`;
            * specify the cluster from a list of available clusters.
        cluster-location: |-
            Zone in which the cluster is located. Alternatively, set the property [run/cluster_location].

            To set the `location` attribute:
            * provide the argument `--cluster` on the command line with a fully specified name;
            * set the property `run/cluster` with a fully specified name;
            * specify the cluster from a list of available clusters with a fully specified name;
            * provide the argument `--cluster-location` on the command line;
            * set the property `run/cluster_location`;
            * specify the cluster location from a list of available zones.
        context: The name of the context in your kubectl config file to use for connecting.
        kubeconfig: The absolute path to your kubectl config file. If not specified, the colon- or semicolon-delimited list of paths specified by $KUBECONFIG will be used. If $KUBECONFIG is unset, this defaults to `~/.kube/config`.
        namespace: |-
            Specific to Cloud Run for Anthos: Kubernetes namespace for the service.
            +
            To set the `namespace` attribute:
            * provide the argument `SERVICE` on the command line with a fully specified name;
            * provide the argument `--namespace` on the command line;
            * set the property `run/namespace`;
            * For Cloud Run on Kubernetes Engine, defaults to "default". Otherwise, defaults to project ID.;
            * provide the argument `project` on the command line;
            * set the property `core/project`.
        no-show-exec-error: If true and command fails, print the underlying command that was executed and its exit status.
        platform: 'Target platform for running commands. Alternatively, set the property [run/platform]. '
        port: Local port number to expose the proxied service. If not specified, it will be set to 8080.
        region: Region in which the resource can be found. Alternatively, set the property [run/region].
        show-exec-error: If true and command fails, print the underlying command that was executed and its exit status.
        tag: Traffic tag of the service to expose via the proxy. If not specified, the default service URL will be proxied which may serve different revisions based on traffic-splits. Custom tags can be used to proxy specific revisions. Please see https://cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration#tags.
        token: The specific identity token to add to all requests of the proxied service. If not specified, the identity token of the currently active authenticated account will be used (e.g. gcloud auth print-identity-token).
