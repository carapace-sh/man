name: update-account-settings
description: Updates the settings for the specified Amazon Chime account.
flags:
    --account-id=!: The Amazon Chime account ID.
    --account-settings=!: The Amazon Chime account settings to update.
documentation:
    command: Updates the settings for the specified Amazon Chime account. You can update settings for remote control of shared screens, or for the dial-out option. For more information about these settings, see [Use the Policies Page](https://docs.aws.amazon.com/chime/latest/ag/policies.html) in the *Amazon Chime Administration Guide*.
    flag:
        account-id: The Amazon Chime account ID.
        account-settings: The Amazon Chime account settings to update.
