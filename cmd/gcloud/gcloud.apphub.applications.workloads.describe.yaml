name: describe
description: Describe an Apphub application workload.
flags:
    --application=: Name for the application
    --location=: The Cloud location for the workload.
documentation:
    command: Describe an Apphub application workload.
    flag:
        application: |-
            Name for the application
            +
            To set the `application` attribute:
            * provide the argument `workload` on the command line with a fully specified name;
            * provide the argument `--application` on the command line.
        location: |-
            The Cloud location for the workload.
            +
            To set the `location` attribute:
            * provide the argument `workload` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
