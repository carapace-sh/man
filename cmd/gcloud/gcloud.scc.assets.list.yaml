name: list
description: '*(DEPRECATED)*  List Cloud Security Command Center assets.'
flags:
    --compare-duration=: The result's "state_change" attribute is updated to indicate whether the asset was added, removed,
    --field-mask=: Field mask to specify the Asset fields to be listed in the response.
    --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
    --limit=: Maximum number of resources to list.
    --order-by=: Expression that defines what fields and order to use for sorting.
    --page-size=: Some services group resource list output into pages.
    --page-token=: The value returned by the last 'ListAssetsResponse'; indicates
    --read-time=: Time used as a reference point when filtering.
    --sort-by=: Comma-separated list of resource field key names to sort by.
documentation:
    command: |4-
        *(DEPRECATED)*  Security Command Center Asset APIs are deprecated and will be removed on or after
        June 26, 2024. Use Cloud Asset Inventory instead [(gcloud asset)](https://cloud.google.com/sdk/gcloud/reference/asset).
        For more information, [see the deprecation notice at Assets Page](https://cloud.google.com/security-command-center/docs/how-to-use-security-command-center#assets_page).


        List Cloud Security Command Center assets.
    flag:
        compare-duration: |-
            The result's "state_change" attribute is updated to indicate whether the asset was added, removed,
            or remained present during the compare_duration period of time that precedes the read_time. See
            `$ gcloud topic datetimes` for information on supported duration formats.
        field-mask: |-
            Field mask to specify the Asset fields to be listed in the response. An empty field mask will list all fields.
            Example field mask: "asset.security_center_properties.resource_type,asset.security_center_properties.resource_parent"
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        order-by: |-
            Expression that defines what fields and order to use for sorting.
            Example order by: "resource_properties.sort_prop ASC"
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is determined by the
            service if it supports paging, otherwise it is *unlimited* (no paging).
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        page-token: |-
            The value returned by the last 'ListAssetsResponse'; indicates
            that this is a continuation of a prior 'ListAssets' call, and that the
            system should return the next page of data.
        read-time: |-
            Time used as a reference point when filtering. Absence of this field will default to the API's
            version of NOW. See `$ gcloud topic datetimes` for information on supported time formats.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
