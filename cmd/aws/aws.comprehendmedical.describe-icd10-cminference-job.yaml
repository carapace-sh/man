name: describe-icd10-cminference-job
description: Gets the properties associated with an InferICD10CM job.
flags:
    --job-id=!: The identifier that Amazon Comprehend Medical generated for the job.
documentation:
    command: Gets the properties associated with an InferICD10CM job. Use this operation to get the status of an inference job.
    flag:
        job-id: The identifier that Amazon Comprehend Medical generated for the job. `The StartICD10CMInferenceJob` operation returns this identifier in its response.
