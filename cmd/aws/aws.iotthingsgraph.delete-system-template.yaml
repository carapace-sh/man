name: delete-system-template
description: Deletes a system.
flags:
    --id=!: The ID of the system to be deleted.
documentation:
    command: Deletes a system. New deployments can't contain the system after its deletion. Existing deployments that contain the system will continue to work because they use a snapshot of the system that is taken when it is deployed.
    flag:
        id: |-
            The ID of the system to be deleted.

            The ID should be in the following format.

            `urn:tdm:REGION/ACCOUNT ID/default:system:SYSTEMNAME`
