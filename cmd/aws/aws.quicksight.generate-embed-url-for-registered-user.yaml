name: generate-embed-url-for-registered-user
description: Generates an embed URL that you can use to embed an Amazon QuickSight experience in your website.
flags:
    --allowed-domains=: The domains that you want to add to the allow list for access to the generated URL that is then embedded.
    --aws-account-id=!: The ID for the Amazon Web Services account that contains the dashboard that you're embedding.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --experience-configuration=!: The experience that you want to embed.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --session-lifetime-in-minutes=: How many minutes the session is valid.
    --user-arn=!: The Amazon Resource Name for the registered user.
documentation:
    command: "Generates an embed URL that you can use to embed an Amazon QuickSight experience in your website. This action can be used for any type of user registered in an Amazon QuickSight account. Before you use this action, make sure that you have configured the relevant Amazon QuickSight resource and permissions.\n\nThe following rules apply to the generated URL:\n\n- It contains a temporary bearer token. It is valid for 5 minutes after it is generated. Once redeemed within this period, it cannot be re-used again.\n- The URL validity period should not be confused with the actual session lifetime that can be customized using the `SessionLifetimeInMinutes` parameter.\n  \n  The resulting user session is valid for 15 minutes (minimum) to 10 hours (maximum). The default session duration is 10 hours.\n- You are charged only when the URL is used or there is interaction with Amazon QuickSight.\n\nFor more information, see [Embedded Analytics](https://docs.aws.amazon.com/quicksight/latest/user/embedded-analytics.html) in the *Amazon QuickSight User Guide*.\n\nFor more information about the high-level steps for embedding and for an interactive demo of the ways you can customize embedding, visit the [Amazon QuickSight Developer Portal](https://docs.aws.amazon.com/quicksight/latest/user/quicksight-dev-portal.html)."
    flag:
        allowed-domains: |-
            The domains that you want to add to the allow list for access to the generated URL that is then embedded. This optional parameter overrides the static domains that are configured in the Manage QuickSight menu in the QuickSight console. Instead, it allows only the domains that you include in this parameter. You can list up to three domains or subdomains in each API call.

            To include all subdomains under a specific domain to the allow list, use `*`. For example, `https://*.sapp.amazon.com` includes all subdomains under `https://sapp.amazon.com`.
        aws-account-id: The ID for the Amazon Web Services account that contains the dashboard that you're embedding.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        experience-configuration: The experience that you want to embed. For registered users, you can embed QuickSight dashboards, QuickSight visuals, the QuickSight Q search bar, the QuickSight Generative Q&amp;A experience, or the entire QuickSight console.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        session-lifetime-in-minutes: How many minutes the session is valid. The session lifetime must be in \[15-600] minutes range.
        user-arn: The Amazon Resource Name for the registered user.
