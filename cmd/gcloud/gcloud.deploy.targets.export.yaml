name: export
description: Returns the .yaml definition of the specified target.
flags:
    --destination=: Path to a YAML file where the configuration will be exported.
    --region=: The Cloud region for the target.
documentation:
    command: The exported YAML definition can be applied by 'deploy apply' command.
    flag:
        destination: |-
            Path to a YAML file where the configuration will be exported.
                      Alternatively, you may omit this flag to write to standard output.
        region: |-
            The Cloud region for the target.  Alternatively, set the property [deploy/region].
            +
            To set the `region` attribute:
            * provide the argument `target` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `deploy/region`.
