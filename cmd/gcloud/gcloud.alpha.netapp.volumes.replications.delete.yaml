name: delete
description: '*(ALPHA)*  Delete a Cloud NetApp Storage Pool.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location of the replication.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --volume=: ID of the volume or fully qualified identifier for the volume.
documentation:
    command: |
        *(ALPHA)*  Delete a Cloud NetApp Volume Replication.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location of the replication.
            +
            To set the `location` attribute:
            * provide the argument `replication` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        volume: |-
            ID of the volume or fully qualified identifier for the volume.
            +
            To set the `volume` attribute:
            * provide the argument `--volume` on the command line.
