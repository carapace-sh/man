name: untag-resource
description: Removes one or more tags from the specified resource.
flags:
    --resource-arn=!: The ARN of the canary or group that you're removing tags from.
    --tag-keys=!: The list of tag keys to remove from the resource.
documentation:
    command: Removes one or more tags from the specified resource.
    flag:
        resource-arn: |-
            The ARN of the canary or group that you're removing tags from.

            The ARN format of a canary is `arn:aws:synthetics:Region:account-id:canary:canary-name`.

            The ARN format of a group is `arn:aws:synthetics:Region:account-id:group:group-name`
        tag-keys: The list of tag keys to remove from the resource.
