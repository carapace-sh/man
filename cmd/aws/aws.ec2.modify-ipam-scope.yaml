name: modify-ipam-scope
description: Modify an IPAM scope.
flags:
    --description=: The description of the scope you want to modify.
    --dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --external-authority-configuration=: The configuration that links an Amazon VPC IPAM scope to an external authority system.
    --ipam-scope-id=!: The ID of the scope you want to modify.
    --no-dry-run&: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --no-remove-external-authority-configuration&: Remove the external authority configuration.
    --remove-external-authority-configuration: Remove the external authority configuration.
documentation:
    command: Modify an IPAM scope.
    flag:
        description: The description of the scope you want to modify.
        dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        external-authority-configuration: |-
            The configuration that links an Amazon VPC IPAM scope to an external authority system. It specifies the type of external system and the external resource identifier that identifies your account or instance in that system.

            In IPAM, an external authority is a third-party IP address management system that provides CIDR blocks when you provision address space for top-level IPAM pools. This allows you to use your existing IP management system to control which address ranges are allocated to Amazon Web Services while using Amazon VPC IPAM to manage subnets within those ranges.
        ipam-scope-id: The ID of the scope you want to modify.
        remove-external-authority-configuration: Remove the external authority configuration. `true` to remove.
