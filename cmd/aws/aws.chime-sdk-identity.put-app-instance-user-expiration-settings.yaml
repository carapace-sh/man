name: put-app-instance-user-expiration-settings
description: Sets the number of days before the `AppInstanceUser` is automatically deleted.
flags:
    --app-instance-user-arn=!: The ARN of the `AppInstanceUser`.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --expiration-settings=: Settings that control the interval after which an `AppInstanceUser` is automatically deleted.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
documentation:
    command: |-
        Sets the number of days before the `AppInstanceUser` is automatically deleted.

        A background process deletes expired `AppInstanceUsers` within 6 hours of expiration. Actual deletion times may vary.

        Expired `AppInstanceUsers` that have not yet been deleted appear as active, and you can update their expiration settings. The system honors the new settings.
