name: describe-key-phrases-detection-job
description: Gets the properties associated with a key phrases detection job.
flags:
    --job-id=!: The identifier that Amazon Comprehend generated for the job.
documentation:
    command: Gets the properties associated with a key phrases detection job. Use this operation to get the status of a detection job.
    flag:
        job-id: The identifier that Amazon Comprehend generated for the job. The `StartKeyPhrasesDetectionJob` operation returns this identifier in its response.
