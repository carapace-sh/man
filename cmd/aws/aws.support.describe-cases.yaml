name: describe-cases
description: Returns a list of cases that you specify by passing one or more case IDs.
flags:
    --after-time=: The start date for a filtered date search on support case communications.
    --before-time=: The end date for a filtered date search on support case communications.
    --case-id-list=: A list of ID numbers of the support cases you want returned.
    --display-id=: The ID displayed for a case in the Amazon Web Services Support Center user interface.
    --include-communications=: Specifies whether to include communications in the `DescribeCases` response.
    --include-resolved-cases=: Specifies whether to include resolved support cases in the `DescribeCases` response.
    --language=: The language in which Amazon Web Services Support handles the case.
    --max-results=: The maximum number of results to return before paginating.
    --next-token=: A resumption point for pagination.
documentation:
    command: |-
        Returns a list of cases that you specify by passing one or more case IDs. You can use the `afterTime` and `beforeTime` parameters to filter the cases by date. You can set values for the `includeResolvedCases` and `includeCommunications` parameters to specify how much information to return.

        The response returns the following in JSON format:

        - One or more [CaseDetails](https://docs.aws.amazon.com/awssupport/latest/APIReference/API_CaseDetails.html) data types.
        - One or more `nextToken` values, which specify where to paginate the returned records represented by the `CaseDetails` objects.

        Case data is available for 12 months after creation. If a case was created more than 12 months ago, a request might return an error.

        - You must have a Business, Enterprise On-Ramp, or Enterprise Support plan to use the Amazon Web Services Support API.
        - If you call the Amazon Web Services Support API from an account that doesn't have a Business, Enterprise On-Ramp, or Enterprise Support plan, the `SubscriptionRequiredException` error message appears. For information about changing your support plan, see [Amazon Web Services Support](http://aws.amazon.com/premiumsupport/).
    flag:
        after-time: The start date for a filtered date search on support case communications. Case communications are available for 12 months after creation.
        before-time: The end date for a filtered date search on support case communications. Case communications are available for 12 months after creation.
        case-id-list: A list of ID numbers of the support cases you want returned. The maximum number of cases is 100.
        display-id: The ID displayed for a case in the Amazon Web Services Support Center user interface.
        include-communications: Specifies whether to include communications in the `DescribeCases` response. By default, communications are included.
        include-resolved-cases: Specifies whether to include resolved support cases in the `DescribeCases` response. By default, resolved cases aren't included.
        language: The language in which Amazon Web Services Support handles the case. Amazon Web Services Support currently supports Chinese (“zh”), English ("en"), Japanese ("ja") and Korean (“ko”). You must specify the ISO 639-1 code for the `language` parameter if you want support in that language.
        max-results: The maximum number of results to return before paginating.
        next-token: A resumption point for pagination.
