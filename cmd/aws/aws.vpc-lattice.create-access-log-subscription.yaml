name: create-access-log-subscription
description: Enables access logs to be sent to Amazon CloudWatch, Amazon S3, and Amazon Kinesis Data Firehose.
flags:
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --destination-arn=!: The Amazon Resource Name (ARN) of the destination.
    --resource-identifier=!: The ID or ARN of the service network or service.
    --service-network-log-type=: The type of log that monitors your Amazon VPC Lattice service networks.
    --tags=: The tags for the access log subscription.
completion:
    flag:
        service-network-log-type:
            - SERVICE
            - RESOURCE
documentation:
    command: Enables access logs to be sent to Amazon CloudWatch, Amazon S3, and Amazon Kinesis Data Firehose. The service network owner can use the access logs to audit the services in the network. The service network owner can only see access logs from clients and services that are associated with their service network. Access log entries represent traffic originated from VPCs associated with that network. For more information, see [Access logs](https://docs.aws.amazon.com/vpc-lattice/latest/ug/monitoring-access-logs.html) in the *Amazon VPC Lattice User Guide*.
    flag:
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If you retry a request that completed successfully using the same client token and parameters, the retry succeeds without performing any actions. If the parameters aren't identical, the retry fails.
        destination-arn: The Amazon Resource Name (ARN) of the destination. The supported destination types are CloudWatch Log groups, Kinesis Data Firehose delivery streams, and Amazon S3 buckets.
        resource-identifier: The ID or ARN of the service network or service.
        service-network-log-type: The type of log that monitors your Amazon VPC Lattice service networks.
        tags: The tags for the access log subscription.
