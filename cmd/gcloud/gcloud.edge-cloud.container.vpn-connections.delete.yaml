name: delete
description: Delete a VPN connection between an Edge Container cluster and a VPC network.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The global location name.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        Delete a VPN connection.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The global location name.
            +
            To set the `location` attribute:
            * provide the argument `vpn_connection` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `edge_container/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
