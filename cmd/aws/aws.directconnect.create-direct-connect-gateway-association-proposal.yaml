name: create-direct-connect-gateway-association-proposal
description: Creates a proposal to associate the specified virtual private gateway or transit gateway with the specified Direct Connect gateway.
flags:
    --add-allowed-prefixes-to-direct-connect-gateway=:
        description: The Amazon VPC prefixes to advertise to the Direct Connect gateway.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --direct-connect-gateway-id=!: The ID of the Direct Connect gateway.
    --direct-connect-gateway-owner-account=!: The ID of the Amazon Web Services account that owns the Direct Connect gateway.
    --gateway-id=!: The ID of the virtual private gateway or transit gateway.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --remove-allowed-prefixes-to-direct-connect-gateway=:
        description: The Amazon VPC prefixes to no longer advertise to the Direct Connect gateway.
        nargs: -1
documentation:
    command: |-
        Creates a proposal to associate the specified virtual private gateway or transit gateway with the specified Direct Connect gateway.

        You can associate a Direct Connect gateway and virtual private gateway or transit gateway that is owned by any Amazon Web Services account.
    flag:
        add-allowed-prefixes-to-direct-connect-gateway: The Amazon VPC prefixes to advertise to the Direct Connect gateway.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        direct-connect-gateway-id: The ID of the Direct Connect gateway.
        direct-connect-gateway-owner-account: The ID of the Amazon Web Services account that owns the Direct Connect gateway.
        gateway-id: The ID of the virtual private gateway or transit gateway.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        remove-allowed-prefixes-to-direct-connect-gateway: The Amazon VPC prefixes to no longer advertise to the Direct Connect gateway.
