name: batch-import-evidence-to-assessment-control
description: Adds one or more pieces of evidence to a control in an Audit Manager assessment.
flags:
    --assessment-id=!: The identifier for the assessment.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --control-id=!: The identifier for the control.
    --control-set-id=!: The identifier for the control set.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --manual-evidence=!: The list of manual evidence objects.
documentation:
    command: |-
        Adds one or more pieces of evidence to a control in an Audit Manager assessment.

        You can import manual evidence from any S3 bucket by specifying the S3 URI of the object. You can also upload a file from your browser, or enter plain text in response to a risk assessment question.

        The following restrictions apply to this action:

        - `manualEvidence` can be only one of the following: `evidenceFileName`, `s3ResourcePath`, or `textResponse`
        - Maximum size of an individual evidence file: 100 MB
        - Number of daily manual evidence uploads per control: 100
        - Supported file formats: See [Supported file types for manual evidence](https://docs.aws.amazon.com/audit-manager/latest/userguide/upload-evidence.html#supported-manual-evidence-files) in the *Audit Manager User Guide*

        For more information about Audit Manager service restrictions, see [Quotas and restrictions for Audit Manager](https://docs.aws.amazon.com/audit-manager/latest/userguide/service-quotas.html).
    flag:
        assessment-id: The identifier for the assessment.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        control-id: The identifier for the control.
        control-set-id: The identifier for the control set.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        manual-evidence: The list of manual evidence objects.
