name: stop-assessment-run
description: Stops the assessment run that is specified by the ARN of the assessment run.
flags:
    --assessment-run-arn=!: The ARN of the assessment run that you want to stop.
    --stop-action=: An input option that can be set to either START\_EVALUATION or SKIP\_EVALUATION.
completion:
    flag:
        stop-action:
            - START_EVALUATION
            - SKIP_EVALUATION
documentation:
    command: Stops the assessment run that is specified by the ARN of the assessment run.
    flag:
        assessment-run-arn: The ARN of the assessment run that you want to stop.
        stop-action: An input option that can be set to either START\_EVALUATION or SKIP\_EVALUATION. START\_EVALUATION (the default value), stops the AWS agent from collecting data and begins the results evaluation and the findings generation process. SKIP\_EVALUATION cancels the assessment run immediately, after which no findings are generated.
