name: modify-db-shard-group
description: Modifies the settings of an Aurora Limitless Database DB shard group.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --compute-redundancy=: Specifies whether to create standby DB shard groups for the DB shard group.
    --db-shard-group-identifier=!: The name of the DB shard group to modify.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-acu=: The maximum capacity of the DB shard group in Aurora capacity units (ACUs).
    --min-acu=: The minimum capacity of the DB shard group in Aurora capacity units (ACUs).
documentation:
    command: Modifies the settings of an Aurora Limitless Database DB shard group. You can change one or more settings by specifying these parameters and the new values in the request.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        compute-redundancy: |-
            Specifies whether to create standby DB shard groups for the DB shard group. Valid values are the following:

            - 0 - Creates a DB shard group without a standby DB shard group. This is the default value.
            - 1 - Creates a DB shard group with a standby DB shard group in a different Availability Zone (AZ).
            - 2 - Creates a DB shard group with two standby DB shard groups in two different AZs.
        db-shard-group-identifier: The name of the DB shard group to modify.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-acu: The maximum capacity of the DB shard group in Aurora capacity units (ACUs).
        min-acu: The minimum capacity of the DB shard group in Aurora capacity units (ACUs).
