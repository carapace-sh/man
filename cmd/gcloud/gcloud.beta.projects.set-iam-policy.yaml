name: set-iam-policy
description: '*(BETA)*  Set IAM policy for a project.'
documentation:
    command: |-
        *(BETA)*  Sets the IAM policy for a project, given a project ID and a file encoded in
        JSON or YAML that contains the IAM policy.

        ## EXAMPLES

        The following command reads an IAM policy defined in a JSON file `policy.json`
        and sets it for a project with the ID `example-project-id-1`:

          $ gcloud beta projects set-iam-policy example-project-id-1 policy.json
