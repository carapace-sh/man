name: export-table-to-point-in-time
description: Exports table data to an S3 bucket.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Providing a `ClientToken` makes the call to `ExportTableToPointInTimeInput` idempotent, meaning that multiple identical calls have the same effect as one single call.
    --export-format=: The format for the exported data.
    --export-time=: Time in the past from which to export table data, counted in seconds from the start of the Unix epoch.
    --export-type=: Choice of whether to execute as a full export or incremental export.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --incremental-export-specification=: Optional object containing the parameters specific to an incremental export.
    --s3-bucket-owner=: The ID of the Amazon Web Services account that owns the bucket the export will be stored in.
    --s3-bucket=!: The name of the Amazon S3 bucket to export the snapshot to.
    --s3-prefix=: The Amazon S3 bucket prefix to use as the file name and path of the exported snapshot.
    --s3-sse-algorithm=: Type of encryption used on the bucket where export data will be stored.
    --s3-sse-kms-key-id=: The ID of the KMS managed key used to encrypt the S3 bucket where export data will be stored (if applicable).
    --table-arn=!: The Amazon Resource Name (ARN) associated with the table to export.
completion:
    flag:
        export-format:
            - DYNAMODB_JSON
            - ION
        export-type:
            - FULL_EXPORT
            - INCREMENTAL_EXPORT
        s3-sse-algorithm:
            - AES256
            - KMS
documentation:
    command: Exports table data to an S3 bucket. The table must have point in time recovery enabled, and you can export data from any time within the point in time recovery window.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: |-
            Providing a `ClientToken` makes the call to `ExportTableToPointInTimeInput` idempotent, meaning that multiple identical calls have the same effect as one single call.

            A client token is valid for 8 hours after the first request that uses it is completed. After 8 hours, any request with the same client token is treated as a new request. Do not resubmit the same request with the same client token for more than 8 hours, or the result might not be idempotent.

            If you submit a request with the same client token but a change in other parameters within the 8-hour idempotency window, DynamoDB returns an `ImportConflictException`.
        export-format: The format for the exported data. Valid values for `ExportFormat` are `DYNAMODB_JSON` or `ION`.
        export-time: Time in the past from which to export table data, counted in seconds from the start of the Unix epoch. The table export will be a snapshot of the table's state at this point in time.
        export-type: Choice of whether to execute as a full export or incremental export. Valid values are FULL\_EXPORT or INCREMENTAL\_EXPORT. The default value is FULL\_EXPORT. If INCREMENTAL\_EXPORT is provided, the IncrementalExportSpecification must also be used.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        incremental-export-specification: Optional object containing the parameters specific to an incremental export.
        s3-bucket: The name of the Amazon S3 bucket to export the snapshot to.
        s3-bucket-owner: |-
            The ID of the Amazon Web Services account that owns the bucket the export will be stored in.

            S3BucketOwner is a required parameter when exporting to a S3 bucket in another account.
        s3-prefix: The Amazon S3 bucket prefix to use as the file name and path of the exported snapshot.
        s3-sse-algorithm: |-
            Type of encryption used on the bucket where export data will be stored. Valid values for `S3SseAlgorithm` are:

            - `AES256` - server-side encryption with Amazon S3 managed keys
            - `KMS` - server-side encryption with KMS managed keys
        s3-sse-kms-key-id: The ID of the KMS managed key used to encrypt the S3 bucket where export data will be stored (if applicable).
        table-arn: The Amazon Resource Name (ARN) associated with the table to export.
