name: deactivate-pipeline
description: Deactivates the specified running pipeline.
flags:
    --cancel-active=: Indicates whether to cancel any running objects.
    --pipeline-id=!: The ID of the pipeline.
documentation:
    command: |-
        Deactivates the specified running pipeline. The pipeline is set to the `DEACTIVATING` state until the deactivation process completes.

        To resume a deactivated pipeline, use [ActivatePipeline](). By default, the pipeline resumes from the last completed execution. Optionally, you can specify the date and time to resume the pipeline.
    flag:
        cancel-active: Indicates whether to cancel any running objects. The default is true, which sets the state of any running objects to `CANCELED`. If this value is false, the pipeline is deactivated after all running objects finish.
        pipeline-id: The ID of the pipeline.
