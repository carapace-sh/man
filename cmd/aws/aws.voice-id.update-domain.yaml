name: update-domain
description: Updates the specified domain.
flags:
    --description=: A brief description about this domain.
    --domain-id=!: The identifier of the domain to be updated.
    --name=!: The name of the domain.
    --server-side-encryption-configuration=!: The configuration, containing the KMS key identifier, to be used by Voice ID for the server-side encryption of your data.
documentation:
    command: Updates the specified domain. This API has clobber behavior, and clears and replaces all attributes. If an optional field, such as 'Description' is not provided, it is removed from the domain.
    flag:
        description: A brief description about this domain.
        domain-id: The identifier of the domain to be updated.
        name: The name of the domain.
        server-side-encryption-configuration: The configuration, containing the KMS key identifier, to be used by Voice ID for the server-side encryption of your data. Changing the domain's associated KMS key immediately triggers an asynchronous process to remove dependency on the old KMS key, such that the domain's data can only be accessed using the new KMS key. The domain's `ServerSideEncryptionUpdateDetails` contains the details for this process.
