name: list-reusable-delegation-sets
description: Retrieves a list of the reusable delegation sets that are associated with the current Amazon Web Services account.
flags:
    --marker=: If the value of `IsTruncated` in the previous response was `true`, you have more reusable delegation sets.
    --max-items=: The number of reusable delegation sets that you want Amazon Route 53 to return in the response to this request.
documentation:
    command: Retrieves a list of the reusable delegation sets that are associated with the current Amazon Web Services account.
    flag:
        marker: |-
            If the value of `IsTruncated` in the previous response was `true`, you have more reusable delegation sets. To get another group, submit another `ListReusableDelegationSets` request.

            For the value of `marker`, specify the value of `NextMarker` from the previous response, which is the ID of the first reusable delegation set that Amazon Route 53 will return if you submit another request.

            If the value of `IsTruncated` in the previous response was `false`, there are no more reusable delegation sets to get.
        max-items: The number of reusable delegation sets that you want Amazon Route 53 to return in the response to this request. If you specify a value greater than 100, Route 53 returns only the first 100 reusable delegation sets.
