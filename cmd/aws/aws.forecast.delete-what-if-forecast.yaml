name: delete-what-if-forecast
description: Deletes a what-if forecast created using the [CreateWhatIfForecast]() operation.
flags:
    --what-if-forecast-arn=!: The Amazon Resource Name (ARN) of the what-if forecast that you want to delete.
documentation:
    command: |-
        Deletes a what-if forecast created using the [CreateWhatIfForecast]() operation. You can delete only what-if forecasts that have a status of `ACTIVE` or `CREATE_FAILED`. To get the status, use the [DescribeWhatIfForecast]() operation.

        You can't delete a what-if forecast while it is being exported. After a what-if forecast is deleted, you can no longer query the what-if analysis.
    flag:
        what-if-forecast-arn: The Amazon Resource Name (ARN) of the what-if forecast that you want to delete.
