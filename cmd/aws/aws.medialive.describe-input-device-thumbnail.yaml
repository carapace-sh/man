name: describe-input-device-thumbnail
description: Get the latest thumbnail data for the input device.
flags:
    --accept=!: The HTTP Accept header.
    --input-device-id=!: The unique ID of this input device.
completion:
    flag:
        accept:
            - image/jpeg
documentation:
    command: Get the latest thumbnail data for the input device.
    flag:
        accept: The HTTP Accept header. Indicates the requested type for the thumbnail.
        input-device-id: The unique ID of this input device. For example, hd-123456789abcdef.
