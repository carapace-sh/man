name: list
description: '*(ALPHA)*  Lists the NATs on a Compute Engine router.'
flags:
    --region=: Region of the NATs to list.
    --router-region=&: 'Region of the router to operate on. '
    --router=!: Router to use for NAT.
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute routers nats list* is used to list the NATs on a Compute Engine router.
    flag:
        region: |-
            Region of the NATs to list. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        router: Router to use for NAT.
        router-region: 'Region of the router to operate on. '
