name: cancel-job-run
description: Cancels a job run.
flags:
    --id=!: The ID of the job run to cancel.
    --virtual-cluster-id=!: The ID of the virtual cluster for which the job run will be canceled.
documentation:
    command: Cancels a job run. A job run is a unit of work, such as a Spark jar, PySpark script, or SparkSQL query, that you submit to Amazon EMR on EKS.
    flag:
        id: The ID of the job run to cancel.
        virtual-cluster-id: The ID of the virtual cluster for which the job run will be canceled.
