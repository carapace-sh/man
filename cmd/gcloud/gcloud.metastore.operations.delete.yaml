name: delete
description: Delete one or more completed Dataproc Metastore operations.
flags:
    --location=: Location to which the operations belongs.
documentation:
    command: Delete one or more completed Dataproc Metastore operations.
    flag:
        location: |-
            Location to which the operations belongs.
            +
            To set the `location` attribute:
            * provide the argument `operations` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `metastore/location`.
