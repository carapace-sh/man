name: list-intents
description: Get a list of intents that meet the specified criteria.
flags:
    --bot-id=!: The unique identifier of the bot that contains the intent.
    --bot-version=!: The version of the bot that contains the intent.
    --filters=: Provides the specification of a filter used to limit the intents in the response to only those that match the filter specification.
    --locale-id=!: The identifier of the language and locale of the intents to list.
    --max-results=: The maximum number of intents to return in each page of results.
    --next-token=: If the response from the `ListIntents` operation contains more results than specified in the `maxResults` parameter, a token is returned in the response.
    --sort-by=: Determines the sort order for the response from the `ListIntents` operation.
documentation:
    command: Get a list of intents that meet the specified criteria.
    flag:
        bot-id: The unique identifier of the bot that contains the intent.
        bot-version: The version of the bot that contains the intent.
        filters: Provides the specification of a filter used to limit the intents in the response to only those that match the filter specification. You can only specify one filter and only one string to filter on.
        locale-id: The identifier of the language and locale of the intents to list. The string must match one of the supported locales. For more information, see [Supported languages](https://docs.aws.amazon.com/lexv2/latest/dg/how-languages.html).
        max-results: The maximum number of intents to return in each page of results. If there are fewer results than the max page size, only the actual number of results are returned.
        next-token: |-
            If the response from the `ListIntents` operation contains more results than specified in the `maxResults` parameter, a token is returned in the response.

            Use the returned token in the `nextToken` parameter of a `ListIntents` request to return the next page of results. For a complete set of results, call the `ListIntents` operation until the `nextToken` returned in the response is null.
        sort-by: Determines the sort order for the response from the `ListIntents` operation. You can choose to sort by the intent name or last updated date in either ascending or descending order.
