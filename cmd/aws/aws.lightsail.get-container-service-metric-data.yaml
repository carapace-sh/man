name: get-container-service-metric-data
description: Returns the data points of a specific metric of your Amazon Lightsail container service.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --end-time=!: The end time of the time period.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --metric-name=!: The metric for which you want to return information.
    --period=!: The granularity, in seconds, of the returned data points.
    --service-name=!: The name of the container service for which to get metric data.
    --start-time=!: The start time of the time period.
    --statistics=!: The statistic for the metric.
completion:
    flag:
        metric-name:
            - CPUUtilization
            - MemoryUtilization
documentation:
    command: |-
        Returns the data points of a specific metric of your Amazon Lightsail container service.

        Metrics report the utilization of your resources. Monitor and collect metric data regularly to maintain the reliability, availability, and performance of your resources.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        end-time: The end time of the time period.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        metric-name: "The metric for which you want to return information.\n\nValid container service metric names are listed below, along with the most useful statistics to include in your request, and the published unit value.\n\n- `CPUUtilization` - The average percentage of compute units that are currently in use across all nodes of the container service. This metric identifies the processing power required to run containers on each node of the container service.\n  \n  Statistics: The most useful statistics are `Maximum` and `Average`.\n  \n  Unit: The published unit is `Percent`.\n- `MemoryUtilization` - The average percentage of available memory that is currently in use across all nodes of the container service. This metric identifies the memory required to run containers on each node of the container service.\n  \n  Statistics: The most useful statistics are `Maximum` and `Average`.\n  \n  Unit: The published unit is `Percent`."
        period: |-
            The granularity, in seconds, of the returned data points.

            All container service metric data is available in 5-minute (300 seconds) granularity.
        service-name: The name of the container service for which to get metric data.
        start-time: The start time of the time period.
        statistics: |-
            The statistic for the metric.

            The following statistics are available:

            - `Minimum` - The lowest value observed during the specified period. Use this value to determine low volumes of activity for your application.
            - `Maximum` - The highest value observed during the specified period. Use this value to determine high volumes of activity for your application.
            - `Sum` - All values submitted for the matching metric added together. You can use this statistic to determine the total volume of a metric.
            - `Average` - The value of `Sum` / `SampleCount` during the specified period. By comparing this statistic with the `Minimum` and `Maximum` values, you can determine the full scope of a metric and how close the average use is to the `Minimum` and `Maximum` values. This comparison helps you to know when to increase or decrease your resources.
            - `SampleCount` - The count, or number, of data points used for the statistical calculation.
