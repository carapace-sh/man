name: add-mapping
description: '*(BETA)*  Add new vlan to ip mapping rule to an L2-forwarding attachment.'
flags:
    --appliance-ip-address=: A single IPv4 or IPv6 address used as the destination IP address
    --appliance-name=: The name of the L2 appliance mapping rule.
    --inner-vlan-to-appliance-mappings=: A list of mapping rules from inner VLAN tags to IP addresses.
    --region=: Region of the interconnect attachment to patch.
    --vlan-key=!: Desired VLAN key for L2 forwarding mapping for the attachment.
documentation:
    command: '*(BETA)*  *gcloud beta compute interconnects attachments l2-forwarding add-mapping* add new vlan to ip mapping rule to an L2-forwarding attachment.'
    flag:
        appliance-ip-address: |-
            A single IPv4 or IPv6 address used as the destination IP address
                 for ingress packets that match on a VLAN tag, but do not match a more
                 specific inner VLAN tag.
        appliance-name: The name of the L2 appliance mapping rule.
        inner-vlan-to-appliance-mappings: |-
            A list of mapping rules from inner VLAN tags to IP addresses. If the inner
            VLAN is not explicitly mapped to an IP address range, the
            applianceIpAddress is used.
        region: |-
            Region of the interconnect attachment to patch. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        vlan-key: |-
            Desired VLAN key for L2 forwarding mapping for the attachment. If not
            supplied, all mappings will be displayed.
