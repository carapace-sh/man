name: create-capacity-manager-data-export
description: Creates a new data export configuration for EC2 Capacity Manager.
flags:
    --client-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --output-format=!: The file format for the exported data.
    --s3-bucket-name=!: The name of the S3 bucket where the capacity data export files will be delivered.
    --s3-bucket-prefix=: The S3 key prefix for the exported data files.
    --schedule=!: The frequency at which data exports are generated.
    --tag-specifications=: The tags to apply to the data export configuration.
completion:
    flag:
        output-format:
            - csv
            - parquet
        schedule:
            - hourly
documentation:
    command: Creates a new data export configuration for EC2 Capacity Manager. This allows you to automatically export capacity usage data to an S3 bucket on a scheduled basis. The exported data includes metrics for On-Demand, Spot, and Capacity Reservations usage across your organization.
    flag:
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request. For more information, see Ensure Idempotency.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        output-format: The file format for the exported data. Parquet format is recommended for large datasets and better compression.
        s3-bucket-name: The name of the S3 bucket where the capacity data export files will be delivered. The bucket must exist and you must have write permissions to it.
        s3-bucket-prefix: The S3 key prefix for the exported data files. This allows you to organize exports in a specific folder structure within your bucket. If not specified, files are placed at the bucket root.
        schedule: The frequency at which data exports are generated.
        tag-specifications: The tags to apply to the data export configuration. You can tag the export for organization and cost tracking purposes.
