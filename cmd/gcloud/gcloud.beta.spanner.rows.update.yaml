name: update
description: '*(BETA)*  Update a row in a Cloud Spanner database.'
flags:
    --data=!: The column names and values for the row being updated.
    --database=!: ID of the database or fully qualified identifier for the database.
    --instance=: The Cloud Spanner instance for the database.
    --table=!: The Cloud Spanner table name.
documentation:
    command: |-
        ## EXAMPLES

        To update a row with SingerId=1,SingName=abc in table Singers under
        my-database and my-instance, run:

          $ gcloud beta spanner rows update --table=Singers --database=my-database --instance=my-instance --data=SingerId=1,SingerName=abc

          $ gcloud beta spanner rows update --table=Singers --database=my-database --instance=my-instance --flags-file=path/to/file.yaml
    flag:
        data: The column names and values for the row being updated. For complicated input values, such as arrays, use the `--flags-file` flag. See $ gcloud topic flags-file for more information.
        database: |-
            ID of the database or fully qualified identifier for the database.
            +
            To set the `database` attribute:
            * provide the argument `--database` on the command line.
        instance: |-
            The Cloud Spanner instance for the database.
            +
            To set the `instance` attribute:
            * provide the argument `--database` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line;
            * set the property `spanner/instance`.
        table: The Cloud Spanner table name.
