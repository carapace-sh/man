name: describe-dbsubnet-groups
description: Returns a list of DBSubnetGroup descriptions.
flags:
    --dbsubnet-group-name=: The name of the DB subnet group to return details for.
    --filters=: This parameter isn't currently supported.
    --marker=: An optional pagination token provided by a previous DescribeDBSubnetGroups request.
    --max-records=: The maximum number of records to include in the response.
documentation:
    command: |-
        Returns a list of DBSubnetGroup descriptions. If a DBSubnetGroupName is specified, the list will contain only the descriptions of the specified DBSubnetGroup.

        For an overview of CIDR ranges, go to the [Wikipedia Tutorial](http://en.wikipedia.org/wiki/Classless_Inter-Domain_Routing).
    flag:
        dbsubnet-group-name: The name of the DB subnet group to return details for.
        filters: This parameter isn't currently supported.
        marker: An optional pagination token provided by a previous DescribeDBSubnetGroups request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that you can retrieve the remaining results.

            Default: 100

            Constraints: Minimum 20, maximum 100.
