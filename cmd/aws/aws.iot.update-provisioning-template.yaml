name: update-provisioning-template
description: Updates a provisioning template.
flags:
    --default-version-id=: The ID of the default provisioning template version.
    --description=: The description of the provisioning template.
    --enabled=: True to enable the provisioning template, otherwise false.
    --pre-provisioning-hook=: Updates the pre-provisioning hook template.
    --provisioning-role-arn=: The ARN of the role associated with the provisioning template.
    --remove-pre-provisioning-hook=: Removes pre-provisioning hook template.
    --template-name=!: The name of the provisioning template.
documentation:
    command: |-
        Updates a provisioning template.

        Requires permission to access the [UpdateProvisioningTemplate](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        default-version-id: The ID of the default provisioning template version.
        description: The description of the provisioning template.
        enabled: True to enable the provisioning template, otherwise false.
        pre-provisioning-hook: Updates the pre-provisioning hook template. Only supports template of type `FLEET_PROVISIONING`. For more information about provisioning template types, see [type](https://docs.aws.amazon.com/iot/latest/apireference/API_CreateProvisioningTemplate.html#iot-CreateProvisioningTemplate-request-type).
        provisioning-role-arn: The ARN of the role associated with the provisioning template. This IoT role grants permission to provision a device.
        remove-pre-provisioning-hook: Removes pre-provisioning hook template.
        template-name: The name of the provisioning template.
