name: update-schedule
description: Updates the specified schedule.
flags:
    --action-after-completion=: Specifies the action that EventBridge Scheduler applies to the schedule after the schedule completes invoking the target.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Unique, case-sensitive identifier you provide to ensure the idempotency of the request.
    --description=: The description you specify for the schedule.
    --end-date=: The date, in UTC, before which the schedule can invoke its target.
    --flexible-time-window=!: Allows you to configure a time window during which EventBridge Scheduler invokes the schedule.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --group-name=: The name of the schedule group with which the schedule is associated.
    --kms-key-arn=: The ARN for the customer managed KMS key that that you want EventBridge Scheduler to use to encrypt and decrypt your data.
    --name=!: The name of the schedule that you are updating.
    --schedule-expression-timezone=: The timezone in which the scheduling expression is evaluated.
    --schedule-expression=!: The expression that defines when the schedule runs.
    --start-date=: The date, in UTC, after which the schedule can begin invoking its target.
    --state=: Specifies whether the schedule is enabled or disabled.
    --target=!: The schedule target.
completion:
    flag:
        action-after-completion:
            - NONE
            - DELETE
        state:
            - ENABLED
            - DISABLED
documentation:
    command: |-
        Updates the specified schedule. When you call `UpdateSchedule`, EventBridge Scheduler uses all values, including empty values, specified in the request and overrides the existing schedule. This is by design. This means that if you do not set an optional field in your request, that field will be set to its system-default value after the update.

        Before calling this operation, we recommend that you call the `GetSchedule` API operation and make a note of all optional parameters for your `UpdateSchedule` call.
    flag:
        action-after-completion: Specifies the action that EventBridge Scheduler applies to the schedule after the schedule completes invoking the target.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Unique, case-sensitive identifier you provide to ensure the idempotency of the request. If you do not specify a client token, EventBridge Scheduler uses a randomly generated token for the request to ensure idempotency.
        description: The description you specify for the schedule.
        end-date: The date, in UTC, before which the schedule can invoke its target. Depending on the schedule's recurrence expression, invocations might stop on, or before, the `EndDate` you specify. EventBridge Scheduler ignores `EndDate` for one-time schedules.
        flexible-time-window: Allows you to configure a time window during which EventBridge Scheduler invokes the schedule.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        group-name: The name of the schedule group with which the schedule is associated. You must provide this value in order for EventBridge Scheduler to find the schedule you want to update. If you omit this value, EventBridge Scheduler assumes the group is associated to the default group.
        kms-key-arn: The ARN for the customer managed KMS key that that you want EventBridge Scheduler to use to encrypt and decrypt your data.
        name: The name of the schedule that you are updating.
        schedule-expression: |-
            The expression that defines when the schedule runs. The following formats are supported.

            - `at` expression - `at(yyyy-mm-ddThh:mm:ss)`
            - `rate` expression - `rate(value unit)`
            - `cron` expression - `cron(fields)`

            You can use `at` expressions to create one-time schedules that invoke a target once, at the time and in the time zone, that you specify. You can use `rate` and `cron` expressions to create recurring schedules. Rate-based schedules are useful when you want to invoke a target at regular intervals, such as every 15 minutes or every five days. Cron-based schedules are useful when you want to invoke a target periodically at a specific time, such as at 8:00 am (UTC+0) every 1st day of the month.

            A `cron` expression consists of six fields separated by white spaces: `(minutes hours day_of_month month day_of_week year)`.

            A `rate` expression consists of a *value* as a positive integer, and a *unit* with the following options: `minute` | `minutes` | `hour` | `hours` | `day` | `days`

            For more information and examples, see [Schedule types on EventBridge Scheduler](https://docs.aws.amazon.com/scheduler/latest/UserGuide/schedule-types.html) in the *EventBridge Scheduler User Guide*.
        schedule-expression-timezone: The timezone in which the scheduling expression is evaluated.
        start-date: The date, in UTC, after which the schedule can begin invoking its target. Depending on the schedule's recurrence expression, invocations might occur on, or after, the `StartDate` you specify. EventBridge Scheduler ignores `StartDate` for one-time schedules.
        state: Specifies whether the schedule is enabled or disabled.
        target: The schedule target. You can use this operation to change the target that your schedule invokes.
