name: list-graphs
description: Returns the list of behavior graphs that the calling account is an administrator account of.
flags:
    --max-results=: The maximum number of graphs to return at a time.
    --next-token=: For requests to get the next page of results, the pagination token that was returned with the previous set of results.
documentation:
    command: |-
        Returns the list of behavior graphs that the calling account is an administrator account of. This operation can only be called by an administrator account.

        Because an account can currently only be the administrator of one behavior graph within a Region, the results always contain a single behavior graph.
    flag:
        max-results: The maximum number of graphs to return at a time. The total must be less than the overall limit on the number of results to return, which is currently 200.
        next-token: For requests to get the next page of results, the pagination token that was returned with the previous set of results. The initial request does not include a pagination token.
