name: repair
description: Repair a cluster.
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --cluster-repair-action=: '`--cluster-repair-action` flag indicates the repair operation is at'
    --dataproc-super-user=&: Whether to use Dataproc superuser permissions.
    --graceful-decommission-timeout=: The graceful decommission timeout for decommissioning Node Managers
    --no-async&: Return immediately, without waiting for the operation in progress to
    --node-pool=: Each `--node-pool` flag represents either the primary or secondary
    --region=: Dataproc region for the cluster.
    --timeout=&: Client side timeout on how long to wait for Dataproc operations.
documentation:
    command: Repair a cluster.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        cluster-repair-action: |-
            `--cluster-repair-action` flag indicates the repair operation is at
            the cluster level. `--node-pool` flag should not be specified with
            this flag. Valid values : ['REPAIR_ERROR_DUE_TO_UPDATE_CLUSTER'].
        dataproc-super-user: Whether to use Dataproc superuser permissions. If true, IAM checks for `dataproc.googleapis.com/clusters.repair` permission, otherwise `dataproc.googleapis.com/clusters.update`
        graceful-decommission-timeout: |-
            The graceful decommission timeout for decommissioning Node Managers
            in the cluster, used when removing nodes. Graceful decommissioning
            allows removing nodes from the cluster without interrupting jobs in
            progress. Timeout specifies how long to wait for jobs in progress to
            finish before forcefully removing nodes (and potentially
            interrupting jobs). Timeout defaults to 0 if not set (for forceful
            decommission), and the maximum allowed timeout is 1 day.
            See $ gcloud topic datetimes for information on duration formats.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        node-pool: |-
            Each `--node-pool` flag represents either the primary or secondary
            worker pool associated with the cluster and an action on specified
            nodes.
            *id:*::: Valid values : ['PRIMARY_WORKER_POOL', 'SECONDARY_WORKER_POOL'].
            *repair-action:*::: Valid values : ['DELETE'].
        region: |-
            Dataproc region for the cluster. Each Dataproc region constitutes an independent resource namespace constrained to deploying instances into Compute Engine zones inside the region. Overrides the default `dataproc/region` property value for this command invocation.
            +
            To set the `region` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `dataproc/region`.
        timeout: Client side timeout on how long to wait for Dataproc operations. See $ gcloud topic datetimes for information on duration formats.
