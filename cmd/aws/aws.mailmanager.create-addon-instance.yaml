name: create-addon-instance
description: Creates an Add On instance for the subscription indicated in the request.
flags:
    --addon-subscription-id=!: The unique ID of a previously created subscription that an Add On instance is created for.
    --client-token=: A unique token that Amazon SES uses to recognize subsequent retries of the same request.
    --tags=: The tags used to organize, track, or control access for the resource.
documentation:
    command: Creates an Add On instance for the subscription indicated in the request. The resulting Amazon Resource Name (ARN) can be used in a conditional statement for a rule set or traffic policy.
    flag:
        addon-subscription-id: The unique ID of a previously created subscription that an Add On instance is created for. You can only have one instance per subscription.
        client-token: A unique token that Amazon SES uses to recognize subsequent retries of the same request.
        tags: 'The tags used to organize, track, or control access for the resource. For example, { "tags": {"key1":"value1", "key2":"value2"} }.'
