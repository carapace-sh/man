name: describe
description: '*(ALPHA)*  Get description of a long-running Immersive Stream for XR operation.'
flags:
    --location=: Global location name.
documentation:
    command: |
        *(ALPHA)*  Get information about a long-running Immersive Stream for XR operation.
    flag:
        location: |-
            Global location name.
            +
            To set the `location` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * global is the only supported location.
