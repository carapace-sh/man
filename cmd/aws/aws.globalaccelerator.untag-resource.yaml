name: untag-resource
description: Remove tags from a Global Accelerator resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the Global Accelerator resource to remove tags from.
    --tag-keys=!: The tag key pairs that you want to remove from the specified resources.
documentation:
    command: |-
        Remove tags from a Global Accelerator resource. When you specify a tag key, the action removes both that key and its associated value. The operation succeeds even if you attempt to remove tags from an accelerator that was already removed.

        For more information, see [Tagging in Global Accelerator](https://docs.aws.amazon.com/global-accelerator/latest/dg/tagging-in-global-accelerator.html) in the *Global Accelerator Developer Guide*.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the Global Accelerator resource to remove tags from. An ARN uniquely identifies a resource.
        tag-keys: The tag key pairs that you want to remove from the specified resources.
