name: update-membership
description: Updates membership configuration.
flags:
    --incident-response-team=: Optional element for UpdateMembership to update the membership name.
    --membership-accounts-configurations-update=: The `membershipAccountsConfigurationsUpdate` field in the `UpdateMembershipRequest` structure allows you to update the configuration settings for accounts within a membership.
    --membership-id=!: Required element for UpdateMembership to identify the membership to update.
    --membership-name=: Optional element for UpdateMembership to update the membership name.
    --no-undo-membership-cancellation: The `undoMembershipCancellation` parameter is a boolean flag that indicates whether to reverse a previously requested membership cancellation.
    --opt-in-features=: Optional element for UpdateMembership to enable or disable opt-in features for the service.
    --undo-membership-cancellation: The `undoMembershipCancellation` parameter is a boolean flag that indicates whether to reverse a previously requested membership cancellation.
documentation:
    command: Updates membership configuration.
    flag:
        incident-response-team: Optional element for UpdateMembership to update the membership name.
        membership-accounts-configurations-update: |-
            The `membershipAccountsConfigurationsUpdate` field in the `UpdateMembershipRequest` structure allows you to update the configuration settings for accounts within a membership.

            This field is optional and contains a structure of type `MembershipAccountsConfigurationsUpdate` that specifies the updated account configurations for the membership.
        membership-id: Required element for UpdateMembership to identify the membership to update.
        membership-name: Optional element for UpdateMembership to update the membership name.
        opt-in-features: Optional element for UpdateMembership to enable or disable opt-in features for the service.
        undo-membership-cancellation: |-
            The `undoMembershipCancellation` parameter is a boolean flag that indicates whether to reverse a previously requested membership cancellation. When set to true, this will revoke the cancellation request and maintain the membership status.

            This parameter is optional and can be used in scenarios where you need to restore a membership that was marked for cancellation but hasn't been fully terminated yet.

            - If set to `true`, the cancellation request will be revoked
            - If set to `false` the service will throw a ValidationException.
