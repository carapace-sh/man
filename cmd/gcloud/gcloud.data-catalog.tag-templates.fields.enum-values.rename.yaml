name: rename
description: '*(DEPRECATED)*  Rename an enum value in Data Catalog tag template enum field.'
flags:
    --field=: Tag template field that contains enum value.
    --location=: Location of the enum value.
    --new-id=!: New display name of the enum value.
    --tag-template=: Tag template that contains enum value.
documentation:
    command: |4-
        *(DEPRECATED)*  This command is deprecated. Please use `gcloud dataplex aspect-types` instead.

        Rename an enum value in Data Catalog tag template enum field.
    flag:
        field: |-
            Tag template field that contains enum value.
            +

            To set the `field` attribute:
            * provide the argument `enum_value` on the command line with a fully specified name;
            * provide the argument `--field` on the command line.
        location: |-
            Location of the enum value.
            +

            To set the `location` attribute:
            * provide the argument `enum_value` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        new-id: New display name of the enum value.
        tag-template: |-
            Tag template that contains enum value.
            +

            To set the `tag-template` attribute:
            * provide the argument `enum_value` on the command line with a fully specified name;
            * provide the argument `--tag-template` on the command line.
