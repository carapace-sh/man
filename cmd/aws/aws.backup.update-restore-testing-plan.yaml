name: update-restore-testing-plan
description: This request will send changes to your specified restore testing plan.
flags:
    --restore-testing-plan-name=!: The name of the restore testing plan name.
    --restore-testing-plan=!: Specifies the body of a restore testing plan.
documentation:
    command: |-
        This request will send changes to your specified restore testing plan. `RestoreTestingPlanName` cannot be updated after it is created.

        `RecoveryPointSelection` can contain:

        - `Algorithm`
        - `ExcludeVaults`
        - `IncludeVaults`
        - `RecoveryPointTypes`
        - `SelectionWindowDays`
    flag:
        restore-testing-plan: Specifies the body of a restore testing plan.
        restore-testing-plan-name: The name of the restore testing plan name.
