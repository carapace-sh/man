name: import
description: '*(BETA)*  Import an `AuthzPolicy` resource.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location Id.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --source=: Path to a YAML file containing the configuration export data.
documentation:
    command: |
        *(BETA)*  Import an `AuthzPolicy` resource defined in a YAML file.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location Id.
            +

            To set the `location` attribute:
            * provide the argument `authz_policy` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        source: |-
            Path to a YAML file containing the configuration export data. The
            YAML file must not contain any output-only fields. Alternatively, you
            may omit this flag to read from standard input. For a schema
            describing the export/import format, see:
            $CLOUDSDKROOT/lib/googlecloudsdk/schemas/...
            +
            $CLOUDSDKROOT is can be obtained with the following command:
            +
              $ gcloud info --format='value(installation.sdk_root)'
