name: update-position
description: Update the position information of a resource.
flags:
    --position=!: The position information of the resource.
    --resource-identifier=!: Resource identifier of the resource for which position is updated.
    --resource-type=!: Resource type of the resource for which position is updated.
completion:
    flag:
        resource-type:
            - WirelessDevice
            - WirelessGateway
documentation:
    command: |-
        Update the position information of a resource.

        This action is no longer supported. Calls to update the position information should use the [UpdateResourcePosition](https://docs.aws.amazon.com/iot-wireless/latest/apireference/API_UpdateResourcePosition.html) API operation instead.
    flag:
        position: The position information of the resource.
        resource-identifier: Resource identifier of the resource for which position is updated.
        resource-type: Resource type of the resource for which position is updated.
