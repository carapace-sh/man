name: create-code-security-scan-configuration
description: Creates a scan configuration for code security scanning.
flags:
    --configuration=!: The configuration settings for the code security scan.
    --level=!: The security level for the scan configuration.
    --name=!: The name of the scan configuration.
    --scope-settings=: The scope settings that define which repositories will be scanned.
    --tags=: The tags to apply to the scan configuration.
completion:
    flag:
        level:
            - ORGANIZATION
            - ACCOUNT
documentation:
    command: Creates a scan configuration for code security scanning.
    flag:
        configuration: The configuration settings for the code security scan.
        level: The security level for the scan configuration.
        name: The name of the scan configuration.
        scope-settings: |-
            The scope settings that define which repositories will be scanned. Include this parameter to create a default scan configuration. Otherwise Amazon Inspector creates a general scan configuration.

            A default scan configuration automatically applies to all existing and future projects imported into Amazon Inspector. Use the `BatchAssociateCodeSecurityScanConfiguration` operation to associate a general scan configuration with projects.
        tags: The tags to apply to the scan configuration.
