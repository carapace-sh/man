documentation:
    command: Describes the specified Network Access Scope analyses.
    flag:
        analysis-start-time-begin: Filters the results based on the start time. The analysis must have started on or after this time.
        analysis-start-time-end: Filters the results based on the start time. The analysis must have started on or before this time.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: There are no supported filters.
        max-results: The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned `nextToken` value.
        network-insights-access-scope-analysis-ids: The IDs of the Network Access Scope analyses.
        network-insights-access-scope-id: The ID of the Network Access Scope.
        next-token: The token for the next page of results.
