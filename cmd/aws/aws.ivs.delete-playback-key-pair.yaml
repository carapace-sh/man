name: delete-playback-key-pair
description: Deletes a specified authorization key pair.
flags:
    --arn=!: ARN of the key pair to be deleted.
documentation:
    command: Deletes a specified authorization key pair. This invalidates future viewer tokens generated using the key pair’s `privateKey`. For more information, see [Setting Up Private Channels](https://docs.aws.amazon.com/ivs/latest/userguide/private-channels.html) in the *Amazon IVS User Guide*.
    flag:
        arn: ARN of the key pair to be deleted.
