name: validate-message
description: '*(ALPHA)*  Validate a message against a Pub/Sub schema.'
flags:
    --definition-file=: File containing schema definition.
    --definition=: Inline schema definition.
    --message-encoding=!: The encoding of the message.
    --message=!: The message to validate against the schema.
    --schema-name=: Name or full path of an existing schema.
    --type=!: Type of inline schema.
completion:
    flag:
        message-encoding:
            - binary
            - json
        type:
            - avro
            - protocol-buffer
documentation:
    command: |
        *(ALPHA)*  Validate a message against a Pub/Sub schema.
    flag:
        definition: Inline schema definition.
        definition-file: File containing schema definition. Use a full or relative path to a local file containing the value of definition_file.
        message: The message to validate against the schema.
        message-encoding: 'The encoding of the message. _MESSAGE_ENCODING_ must be one of: *binary*, *json*.'
        schema-name: Name or full path of an existing schema.
        type: 'Type of inline schema. _TYPE_ must be one of: *avro*, *protocol-buffer*.'
