name: describe-configuration-options
description: Describes the configuration options that are used in a particular configuration template or environment, or that a specified solution stack defines.
flags:
    --application-name=: The name of the application associated with the configuration template or environment.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --environment-name=: The name of the environment whose configuration options you want to describe.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --options=:
        description: If specified, restricts the descriptions to only the specified options.
        nargs: -1
    --platform-arn=: The ARN of the custom platform.
    --solution-stack-name=: The name of the solution stack whose configuration options you want to describe.
    --template-name=: The name of the configuration template whose configuration options you want to describe.
documentation:
    command: Describes the configuration options that are used in a particular configuration template or environment, or that a specified solution stack defines. The description includes the values the options, their default values, and an indication of the required action on a running environment if an option value is changed.
    flag:
        application-name: The name of the application associated with the configuration template or environment. Only needed if you want to describe the configuration options associated with either the configuration template or environment.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        environment-name: The name of the environment whose configuration options you want to describe.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        options: If specified, restricts the descriptions to only the specified options.
        platform-arn: The ARN of the custom platform.
        solution-stack-name: The name of the solution stack whose configuration options you want to describe.
        template-name: The name of the configuration template whose configuration options you want to describe.
