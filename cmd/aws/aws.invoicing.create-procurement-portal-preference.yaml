name: create-procurement-portal-preference
description: Creates a procurement portal preference configuration for e-invoice delivery and purchase order retrieval.
flags:
    --buyer-domain=!: The domain identifier for the buyer in the procurement portal.
    --buyer-identifier=!: The unique identifier for the buyer in the procurement portal.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure idempotency of the request.
    --contacts=!:
        description: List of contact information for portal administrators and technical contacts responsible for the e-invoice integration.
        nargs: -1
    --einvoice-delivery-enabled!: Indicates whether e-invoice delivery is enabled for this procurement portal preference.
    --einvoice-delivery-preference=: Specifies the e-invoice delivery configuration including document types, attachment types, and customization settings for the portal.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-einvoice-delivery-enabled!: Indicates whether e-invoice delivery is enabled for this procurement portal preference.
    --no-purchase-order-retrieval-enabled!: Indicates whether purchase order retrieval is enabled for this procurement portal preference.
    --procurement-portal-instance-endpoint=: The endpoint URL where e-invoices will be delivered to the procurement portal.
    --procurement-portal-name=!: The name of the procurement portal.
    --procurement-portal-shared-secret=: The shared secret or authentication credential used to establish secure communication with the procurement portal.
    --purchase-order-retrieval-enabled!: Indicates whether purchase order retrieval is enabled for this procurement portal preference.
    --resource-tags=:
        description: The tags to apply to this procurement portal preference resource.
        nargs: -1
    --selector=: ""
    --supplier-domain=!: The domain identifier for the supplier in the procurement portal.
    --supplier-identifier=!: The unique identifier for the supplier in the procurement portal.
    --test-env-preference=: Configuration settings for the test environment of the procurement portal.
completion:
    flag:
        buyer-domain:
            - NetworkID
        procurement-portal-name:
            - SAP_BUSINESS_NETWORK
            - COUPA
        supplier-domain:
            - NetworkID
documentation:
    command: Creates a procurement portal preference configuration for e-invoice delivery and purchase order retrieval. This preference defines how invoices are delivered to a procurement portal and how purchase orders are retrieved.
    flag:
        buyer-domain: The domain identifier for the buyer in the procurement portal.
        buyer-identifier: The unique identifier for the buyer in the procurement portal.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier that you provide to ensure idempotency of the request.
        contacts: List of contact information for portal administrators and technical contacts responsible for the e-invoice integration.
        einvoice-delivery-enabled: Indicates whether e-invoice delivery is enabled for this procurement portal preference. Set to true to enable e-invoice delivery, false to disable.
        einvoice-delivery-preference: Specifies the e-invoice delivery configuration including document types, attachment types, and customization settings for the portal.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        procurement-portal-instance-endpoint: The endpoint URL where e-invoices will be delivered to the procurement portal. Must be a valid HTTPS URL.
        procurement-portal-name: The name of the procurement portal.
        procurement-portal-shared-secret: The shared secret or authentication credential used to establish secure communication with the procurement portal. This value must be encrypted at rest.
        purchase-order-retrieval-enabled: Indicates whether purchase order retrieval is enabled for this procurement portal preference. Set to true to enable PO retrieval, false to disable.
        resource-tags: The tags to apply to this procurement portal preference resource. Each tag consists of a key and an optional value.
        selector: ""
        supplier-domain: The domain identifier for the supplier in the procurement portal.
        supplier-identifier: The unique identifier for the supplier in the procurement portal.
        test-env-preference: Configuration settings for the test environment of the procurement portal. Includes test credentials and endpoints that are used for validation before production deployment.
