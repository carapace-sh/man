name: send-automation-signal
description: Sends a signal to an Automation execution to change the current behavior or status of the execution.
flags:
    --automation-execution-id=!: The unique identifier for an existing Automation execution that you want to send the signal to.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --payload=: The data sent with the signal.
    --signal-type=!: The type of signal to send to an Automation execution.
completion:
    flag:
        signal-type:
            - Approve
            - Reject
            - StartStep
            - StopStep
            - Resume
            - Revoke
documentation:
    command: Sends a signal to an Automation execution to change the current behavior or status of the execution.
    flag:
        automation-execution-id: The unique identifier for an existing Automation execution that you want to send the signal to.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        payload: |-
            The data sent with the signal. The data schema depends on the type of signal used in the request.

            For `Approve` and `Reject` signal types, the payload is an optional comment that you can send with the signal type. For example:

            `Comment="Looks good"`

            For `StartStep` and `Resume` signal types, you must send the name of the Automation step to start or resume as the payload. For example:

            `StepName="step1"`

            For the `StopStep` signal type, you must send the step execution ID as the payload. For example:

            `StepExecutionId="97fff367-fc5a-4299-aed8-0123456789ab"`
        signal-type: The type of signal to send to an Automation execution.
