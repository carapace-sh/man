name: update
description: '*(ALPHA)*  Update a group.'
flags:
    --add-posix-group=&: Group id (gid) and a name for a POSIX group that you want to add
    --clear-description: Clear existing description on group being updated.
    --clear-display-name: Clear existing display name on group being updated.
    --clear-posix-groups: Clear all POSIX groups from the specified Cloud Identity
    --description=: Replace existing description on group being updated.
    --display-name=: Replace existing display name on group being updated.
    --dynamic-user-query=: Query that determines the memberships of the dynamic group.
    --no-clear-description&: Clear existing description on group being updated.
    --no-clear-display-name&: Clear existing display name on group being updated.
    --no-clear-posix-groups&: Clear all POSIX groups from the specified Cloud Identity
    --remove-posix-groups=: Remove POSIX groups from the specified Cloud Identity group.
documentation:
    command: '*(ALPHA)*  Update a group.'
    flag:
        add-posix-group: |
            Group id (gid) and a name for a POSIX group that you want to add
            to the specified Cloud Identity group. You can specify multiple
            POSIX groups to add with multiple instances of this flag.

            For example, use '--add-posix-group=gid=1005,name=eng'
            to add a single group, or '--add-posix-group=gid=1005,name=eng
            --add-posix-group=gid=1006,name=docs' to add multiple groups.

            Caution: POSIX groups are deprecated. As of September 26, 2024, you
            can no longer create new POSIX groups. For more information, see
            [POSIX groups
            deprecation](https://cloud.google.com/identity/docs/deprecations/posix-groups).
        clear-description: Clear existing description on group being updated.
        clear-display-name: Clear existing display name on group being updated.
        clear-posix-groups: |-
            Clear all POSIX groups from the specified Cloud Identity
            group.
        description: Replace existing description on group being updated.
        display-name: Replace existing display name on group being updated.
        dynamic-user-query: |-
            Query that determines the memberships of the dynamic group.
            +
            Example of a query:
            `--dynamic-user-query="user.organizations.exists(org,org.title=='SWE')"`
        no-clear-description: Clear existing description on group being updated.
        no-clear-display-name: |
            Clear existing display name on group being updated.
        no-clear-posix-groups: |
            Clear all POSIX groups from the specified Cloud Identity
            group.
        remove-posix-groups: |-
            Remove POSIX groups from the specified Cloud Identity group.
            You can specify multiple POSIX groups by either name or gid by
            using a comma-separated list.
            +
            For example, use '--remove-posix-groups=1005,1006' to remove POSIX
            groups with group ids '1005' and '1006', or use
            '--remove-posix-groups=eng,docs' to remove POSIX groups named 'eng'
            and 'docs'.
