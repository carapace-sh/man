name: create-upload-url
description: Generates a pre-signed URL, request headers used to upload a code resource, and code artifact identifier for the uploaded resource.
flags:
    --scan-name=!: The name of the scan that will use the uploaded resource.
documentation:
    command: |-
        Generates a pre-signed URL, request headers used to upload a code resource, and code artifact identifier for the uploaded resource.

        You can upload your code resource to the URL with the request headers using any HTTP client.
    flag:
        scan-name: The name of the scan that will use the uploaded resource. CodeGuru Security uses the unique scan name to track revisions across multiple scans of the same resource. Use this `scanName` when you call `CreateScan` on the code resource you upload to this URL.
