            +
            ```
        update-proxy-protocol-config-metadata-headers: |-
            Update proxy_protocol_config_metadata_headers value or add key value pair. Custom resource specific headers along with the values.
            The names should conform to RFC 9110:
            > Field names SHOULD constrain themselves to alphanumeric characters, "-",
