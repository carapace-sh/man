name: delete-explainability
description: Deletes an Explainability resource.
flags:
    --explainability-arn=!: The Amazon Resource Name (ARN) of the Explainability resource to delete.
documentation:
    command: |-
        Deletes an Explainability resource.

        You can delete only predictor that have a status of `ACTIVE` or `CREATE_FAILED`. To get the status, use the [DescribeExplainability]() operation.
    flag:
        explainability-arn: The Amazon Resource Name (ARN) of the Explainability resource to delete.
