name: create
description: Create Transcoder job templates.
flags:
    --file=: Path to job template.
    --json=: Job template in json format.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: Transcoder location for resources
documentation:
    command: Create Transcoder job templates.
    flag:
        file: Path to job template.
        json: Job template in json format.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            Transcoder location for resources
            +
            To set the `location` attribute:
            * provide the argument `template_id` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `transcoder/location`.
