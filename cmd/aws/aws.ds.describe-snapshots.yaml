name: describe-snapshots
description: Obtains information about the directory snapshots that belong to this account.
flags:
    --directory-id=: The identifier of the directory for which to retrieve snapshot information.
    --limit=: The maximum number of objects to return.
    --next-token=: The *DescribeSnapshotsResult.NextToken* value from a previous call to [DescribeSnapshots]().
    --snapshot-ids=: A list of identifiers of the snapshots to obtain the information for.
documentation:
    command: |-
        Obtains information about the directory snapshots that belong to this account.

        This operation supports pagination with the use of the *NextToken* request and response parameters. If more results are available, the *DescribeSnapshots.NextToken* member contains a token that you pass in the next call to [DescribeSnapshots]() to retrieve the next set of items.

        You can also specify a maximum number of return results with the *Limit* parameter.
    flag:
        directory-id: The identifier of the directory for which to retrieve snapshot information.
        limit: The maximum number of objects to return.
        next-token: The *DescribeSnapshotsResult.NextToken* value from a previous call to [DescribeSnapshots](). Pass null if this is the first call.
        snapshot-ids: A list of identifiers of the snapshots to obtain the information for. If this member is null or empty, all snapshots are returned using the *Limit* and *NextToken* members.
