name: update-queue-max-contacts
description: Updates the maximum number of contacts allowed in a queue before it is considered full.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --max-contacts=: The maximum number of contacts that can be in the queue before it is considered full.
    --queue-id=!: The identifier for the queue.
documentation:
    command: Updates the maximum number of contacts allowed in a queue before it is considered full.
    flag:
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        max-contacts: The maximum number of contacts that can be in the queue before it is considered full.
        queue-id: The identifier for the queue.
