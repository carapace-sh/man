name: delete-chap-credentials
description: Deletes Challenge-Handshake Authentication Protocol (CHAP) credentials for a specified iSCSI target and initiator pair.
flags:
    --initiator-name=!: The iSCSI initiator that connects to the target.
    --target-arn=!: The Amazon Resource Name (ARN) of the iSCSI volume target.
documentation:
    command: Deletes Challenge-Handshake Authentication Protocol (CHAP) credentials for a specified iSCSI target and initiator pair. This operation is supported in volume and tape gateway types.
    flag:
        initiator-name: The iSCSI initiator that connects to the target.
        target-arn: The Amazon Resource Name (ARN) of the iSCSI volume target. Use the [DescribeStorediSCSIVolumes]() operation to return to retrieve the TargetARN for specified VolumeARN.
