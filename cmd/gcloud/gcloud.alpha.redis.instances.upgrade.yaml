name: upgrade
description: '*(ALPHA)*  Upgrade a Memorystore for Redis instance to a specified Redis version.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --redis-version=!: Target version of Redis software.
    --region=: The name of the Redis region of the instance.
completion:
    flag:
        redis-version:
            - redis_4_0
            - redis_5_0
            - redis_6_x
            - redis_7_0
            - redis_7_2
documentation:
    command: |
        *(ALPHA)*  Upgrade a Memorystore for Redis instance to a specified Redis version.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        redis-version: |-
            Target version of Redis software. _VERSION_ must be one of:
            +
            *redis_4_0*::: Redis 4.0 compatibility
            *redis_5_0*::: Redis 5.0 compatibility
            *redis_6_x*::: Redis 6.x compatibility
            *redis_7_0*::: Redis 7.0 compatibility
            *redis_7_2*::: Redis 7.2 compatibility
            :::
            +
        region: |-
            The name of the Redis region of the instance. Overrides the default
            redis/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `redis/region`.
