name: create-kx-scaling-group
description: Creates a new scaling group.
flags:
    --availability-zone-id=!: The identifier of the availability zones.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=!: A token that ensures idempotency.
    --environment-id=!: A unique identifier for the kdb environment, where you want to create the scaling group.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --host-type=!: The memory and CPU capabilities of the scaling group host on which FinSpace Managed kdb clusters will be placed.
    --scaling-group-name=!: A unique identifier for the kdb scaling group.
    --tags=: A list of key-value pairs to label the scaling group.
documentation:
    command: Creates a new scaling group.
    flag:
        availability-zone-id: The identifier of the availability zones.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A token that ensures idempotency. This token expires in 10 minutes.
        environment-id: A unique identifier for the kdb environment, where you want to create the scaling group.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        host-type: |-
            The memory and CPU capabilities of the scaling group host on which FinSpace Managed kdb clusters will be placed.

            You can add one of the following values:

            - `kx.sg.large` – The host type with a configuration of 16 GiB memory and 2 vCPUs.
            - `kx.sg.xlarge` – The host type with a configuration of 32 GiB memory and 4 vCPUs.
            - `kx.sg.2xlarge` – The host type with a configuration of 64 GiB memory and 8 vCPUs.
            - `kx.sg.4xlarge` – The host type with a configuration of 108 GiB memory and 16 vCPUs.
            - `kx.sg.8xlarge` – The host type with a configuration of 216 GiB memory and 32 vCPUs.
            - `kx.sg.16xlarge` – The host type with a configuration of 432 GiB memory and 64 vCPUs.
            - `kx.sg.32xlarge` – The host type with a configuration of 864 GiB memory and 128 vCPUs.
            - `kx.sg1.16xlarge` – The host type with a configuration of 1949 GiB memory and 64 vCPUs.
            - `kx.sg1.24xlarge` – The host type with a configuration of 2948 GiB memory and 96 vCPUs.
        scaling-group-name: A unique identifier for the kdb scaling group.
        tags: A list of key-value pairs to label the scaling group. You can add up to 50 tags to a scaling group.
