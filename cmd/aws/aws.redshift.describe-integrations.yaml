name: describe-integrations
description: Describes one or more zero-ETL or S3 event integrations with Amazon Redshift.
flags:
    --filters=: A filter that specifies one or more resources to return.
    --integration-arn=: The unique identifier of the integration.
    --marker=: An optional pagination token provided by a previous `DescribeIntegrations` request.
    --max-records=: The maximum number of response records to return in each call.
documentation:
    command: Describes one or more zero-ETL or S3 event integrations with Amazon Redshift.
    flag:
        filters: A filter that specifies one or more resources to return.
        integration-arn: The unique identifier of the integration.
        marker: An optional pagination token provided by a previous `DescribeIntegrations` request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of response records to return in each call. If the number of remaining response records exceeds the specified `MaxRecords` value, a value is returned in a `marker` field of the response. You can retrieve the next set of records by retrying the command with the returned marker value.

            Default: `100`

            Constraints: minimum 20, maximum 100.
