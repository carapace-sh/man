name: create-resource-policy-statement
description: Adds a new resource policy statement to a bot or bot alias.
flags:
    --action=!:
        description: The Amazon Lex action that this policy either allows or denies.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --condition=: Specifies a condition when the policy is in effect.
    --effect=!: Determines whether the statement allows or denies access to the resource.
    --expected-revision-id=: The identifier of the revision of the policy to edit.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --principal=!:
        description: An IAM principal, such as an IAM user, IAM role, or Amazon Web Services services that is allowed or denied access to a resource.
        nargs: -1
    --resource-arn=!: The Amazon Resource Name (ARN) of the bot or bot alias that the resource policy is attached to.
    --statement-id=!: The name of the statement.
completion:
    flag:
        effect:
            - Allow
            - Deny
documentation:
    command: |-
        Adds a new resource policy statement to a bot or bot alias. If a resource policy exists, the statement is added to the current resource policy. If a policy doesn't exist, a new policy is created.

        You can't create a resource policy statement that allows cross-account access.

        You need to add the `CreateResourcePolicy` or `UpdateResourcePolicy` action to the bot role in order to call the API.
    flag:
        action: The Amazon Lex action that this policy either allows or denies. The action must apply to the resource type of the specified ARN. For more information, see [Actions, resources, and condition keys for Amazon Lex V2](https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazonlexv2.html).
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        condition: |-
            Specifies a condition when the policy is in effect. If the principal of the policy is a service principal, you must provide two condition blocks, one with a SourceAccount global condition key and one with a SourceArn global condition key.

            For more information, see [IAM JSON policy elements: Condition](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_condition.html) .
        effect: Determines whether the statement allows or denies access to the resource.
        expected-revision-id: |-
            The identifier of the revision of the policy to edit. If this revision ID doesn't match the current revision ID, Amazon Lex throws an exception.

            If you don't specify a revision, Amazon Lex overwrites the contents of the policy with the new values.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        principal: 'An IAM principal, such as an IAM user, IAM role, or Amazon Web Services services that is allowed or denied access to a resource. For more information, see [Amazon Web Services JSON policy elements: Principal](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_principal.html).'
        resource-arn: The Amazon Resource Name (ARN) of the bot or bot alias that the resource policy is attached to.
        statement-id: 'The name of the statement. The ID is the same as the `Sid` IAM property. The statement name must be unique within the policy. For more information, see [IAM JSON policy elements: Sid](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_sid.html).'
