name: list-tables
description: The `ListTables` operation returns a list of tables for a specified keyspace.
flags:
    --keyspace-name=!: The name of the keyspace.
    --max-results=: The total number of tables to return in the output.
    --next-token=: The pagination token.
documentation:
    command: |-
        The `ListTables` operation returns a list of tables for a specified keyspace.

        To read keyspace metadata using `ListTables`, the IAM principal needs `Select` action permissions for the system keyspace.
    flag:
        keyspace-name: The name of the keyspace.
        max-results: The total number of tables to return in the output. If the total number of tables available is more than the value specified, a `NextToken` is provided in the output. To resume pagination, provide the `NextToken` value as an argument of a subsequent API invocation.
        next-token: The pagination token. To resume pagination, provide the `NextToken` value as an argument of a subsequent API invocation.
