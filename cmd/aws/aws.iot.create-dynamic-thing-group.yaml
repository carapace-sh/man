name: create-dynamic-thing-group
description: Creates a dynamic thing group.
flags:
    --index-name=: The dynamic thing group index name.
    --query-string=!: The dynamic thing group search query string.
    --query-version=: The dynamic thing group query version.
    --tags=: Metadata which can be used to manage the dynamic thing group.
    --thing-group-name=!: The dynamic thing group name to create.
    --thing-group-properties=: The dynamic thing group properties.
documentation:
    command: |-
        Creates a dynamic thing group.

        Requires permission to access the [CreateDynamicThingGroup](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        index-name: |-
            The dynamic thing group index name.

            Currently one index is supported: `AWS_Things`.
        query-string: |-
            The dynamic thing group search query string.

            See [Query Syntax](https://docs.aws.amazon.com/iot/latest/developerguide/query-syntax.html) for information about query string syntax.
        query-version: |-
            The dynamic thing group query version.

            Currently one query version is supported: "2017-09-30". If not specified, the query version defaults to this value.
        tags: Metadata which can be used to manage the dynamic thing group.
        thing-group-name: The dynamic thing group name to create.
        thing-group-properties: The dynamic thing group properties.
