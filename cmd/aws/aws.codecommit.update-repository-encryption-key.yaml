name: update-repository-encryption-key
description: Updates the Key Management Service encryption key used to encrypt and decrypt a CodeCommit repository.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --kms-key-id=!: The ID of the encryption key.
    --repository-name=!: The name of the repository for which you want to update the KMS encryption key used to encrypt and decrypt the repository.
documentation:
    command: Updates the Key Management Service encryption key used to encrypt and decrypt a CodeCommit repository.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
