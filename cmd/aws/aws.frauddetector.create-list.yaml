name: create-list
description: Creates a list.
flags:
    --description=: The description of the list.
    --elements=: The names of the elements, if providing.
    --name=!: The name of the list.
    --tags=: A collection of the key and value pairs.
    --variable-type=: The variable type of the list.
documentation:
    command: |-
        Creates a list.

        List is a set of input data for a variable in your event dataset. You use the input data in a rule that's associated with your detector. For more information, see [Lists](https://docs.aws.amazon.com/frauddetector/latest/ug/lists.html).
    flag:
        description: The description of the list.
        elements: The names of the elements, if providing. You can also create an empty list and add elements later using the [UpdateList](https://docs.aws.amazon.com/frauddetector/latest/api/API_Updatelist.html) API.
        name: The name of the list.
        tags: A collection of the key and value pairs.
        variable-type: The variable type of the list. You can only assign the variable type with String data type. For more information, see [Variable types](https://docs.aws.amazon.com/frauddetector/latest/ug/create-a-variable.html#variable-types).
