name: delete-connector-destination
description: Delete a connector destination linked to a cloud-to-cloud (C2C) connector.
flags:
    --identifier=!: The identifier of the connector destination.
documentation:
    command: |-
        Delete a connector destination linked to a cloud-to-cloud (C2C) connector.

        Deletion can't be done if the account association has used this connector destination.
    flag:
        identifier: The identifier of the connector destination.
