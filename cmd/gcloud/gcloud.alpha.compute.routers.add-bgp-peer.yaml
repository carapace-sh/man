    --instance=: Router appliance instance of the BGP peer being added.
    --interface=!: The name of the interface for this BGP peer.
    --ipv4-nexthop-address=: If IPv4 route exchange is enabled for IPv6-based BGP, the IPv4 next hop address of the Cloud Router interface for this BGP peer.
    --ipv6-nexthop-address=: If IPv6 route exchange is enabled for IPv4-based BGP, the IPv6 next hop address of the Cloud Router interface for this BGP peer.
    --md5-authentication-key=: The MD5 authentication key for this BGP peer.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-enable-ipv4&: If IPv4 is enabled, the peer connection can be established with IPv4 route exchange.
    --no-enable-ipv6&: If IPv6 is enabled, the peer connection can be established with IPv6 route exchange.
    --no-enabled&: If enabled, the peer connection can be established with routing information.
