name: disable
description: '*(ALPHA)*  Disable a service for consumption for a project, folder or organization.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --bypass-api-usage-check: If specified, the system will bypass usage checks for services that are being removed.
    --bypass-dependency-service-check: If specified, the disable call will bypass the check for dependencies and the dependencies will remain enabled.
    --disable-dependency-services: If specified, the disable call will proceed disabling the service and all the enabled services depend on the service to be disabled
    --folder=: The Google Cloud Platform folder ID to use for this invocation.
    --force: If specified, the disable call will proceed even if there are enabled services which depend on the service to be disabled, or the service to be disabled was used in the last 30 days, or the service to be disabled was enabled in the last 3 days.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-bypass-api-usage-check&: If specified, the system will bypass usage checks for services that are being removed.
    --no-bypass-dependency-service-check&: If specified, the disable call will bypass the check for dependencies and the dependencies will remain enabled.
    --no-disable-dependency-services&: If specified, the disable call will proceed disabling the service and all the enabled services depend on the service to be disabled
    --no-force&: If specified, the disable call will proceed even if there are enabled services which depend on the service to be disabled, or the service to be disabled was used in the last 30 days, or the service to be disabled was enabled in the last 3 days.
    --no-validate-only&: Validate the disable action, but don't actually perform it
    --organization=: The Google Cloud Platform organization ID to use for this invocation.
    --validate-only: Validate the disable action, but don't actually perform it
documentation:
    command: |-
        *(ALPHA)*  This command disables one or more previously-enabled services for
        consumption.

        To see a list of the enabled services for a project, run:

          $ gcloud alpha services list

        More information on listing services can be found at:
        https://cloud.google.com/service-usage/docs/list-services and on
        disabling a service at:
        https://cloud.google.com/service-usage/docs/enable-disable

        ## EXAMPLES
        To disable a service called `my-consumed-service` for the current
        project, run:

          $ gcloud alpha services disable my-consumed-service

        To disable a service called `my-consumed-service` for the project
        `my-project`, run:

          $ gcloud alpha services disable my-consumed-service --project=my-project

        To disable a service called `my-consumed-service` for the folder
        `my-folder`, run:

          $ gcloud alpha services disable my-consumed-service --folder=my-folder

        To disable a service called `my-consumed-service` for the organization
        `my-organization`, run:

          $ gcloud alpha services disable my-consumed-service --organization=my-organization

        To run the same command asynchronously (non-blocking), run:

          $ gcloud alpha services disable my-consumed-service --async
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        bypass-api-usage-check: If specified, the system will bypass usage checks for services that are being removed. Otherwise, the system will check if the service to be removed was used in the last 30 days or enabled in the last 3 days. If so, the system will return an error.
        bypass-dependency-service-check: If specified, the disable call will bypass the check for dependencies and the dependencies will remain enabled.
        disable-dependency-services: If specified, the disable call will proceed disabling the service and all the enabled services depend on the service to be disabled
        folder: The Google Cloud Platform folder ID to use for this invocation.
        force: 'If specified, the disable call will proceed even if there are enabled services which depend on the service to be disabled, or the service to be disabled was used in the last 30 days, or the service to be disabled was enabled in the last 3 days. Forcing the call means that the services which depend on the service to be disabled will also be disabled. (Note): If  --bypass-api-usage-check, --bypass-dependency-service-check, or --disable-dependency-services flags are used, they will take precedence over --force.'
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-bypass-api-usage-check: If specified, the system will bypass usage checks for services that are being removed. Otherwise, the system will check if the service to be removed was used in the last 30 days or enabled in the last 3 days. If so, the system will return an error.
        no-bypass-dependency-service-check: If specified, the disable call will bypass the check for dependencies and the dependencies will remain enabled.
        no-disable-dependency-services: If specified, the disable call will proceed disabling the service and all the enabled services depend on the service to be disabled
        no-force: 'If specified, the disable call will proceed even if there are enabled services which depend on the service to be disabled, or the service to be disabled was used in the last 30 days, or the service to be disabled was enabled in the last 3 days. Forcing the call means that the services which depend on the service to be disabled will also be disabled. (Note): If  --bypass-api-usage-check, --bypass-dependency-service-check, or --disable-dependency-services flags are used, they will take precedence over --force.'
        no-validate-only: Validate the disable action, but don't actually perform it
        organization: The Google Cloud Platform organization ID to use for this invocation.
        validate-only: Validate the disable action, but don't actually perform it
