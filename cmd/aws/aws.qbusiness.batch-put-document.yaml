name: batch-put-document
description: Adds one or more documents to an Amazon Q Business index.
flags:
    --application-id=!: The identifier of the Amazon Q Business application.
    --data-source-sync-id=: The identifier of the data source sync during which the documents were added.
    --documents=!: One or more documents to add to the index.
    --index-id=!: The identifier of the Amazon Q Business index to add the documents to.
    --role-arn=: The Amazon Resource Name (ARN) of an IAM role with permission to access your S3 bucket.
documentation:
    command: |-
        Adds one or more documents to an Amazon Q Business index.

        You use this API to:

        - ingest your structured and unstructured documents and documents stored in an Amazon S3 bucket into an Amazon Q Business index.
        - add custom attributes to documents in an Amazon Q Business index.
        - attach an access control list to the documents added to an Amazon Q Business index.

        You can see the progress of the deletion, and any error messages related to the process, by using CloudWatch.
    flag:
        application-id: The identifier of the Amazon Q Business application.
        data-source-sync-id: The identifier of the data source sync during which the documents were added.
        documents: |-
            One or more documents to add to the index.

            Ensure that the name of your document doesn't contain any confidential information. Amazon Q Business returns document names in chat responses and citations when relevant.
        index-id: The identifier of the Amazon Q Business index to add the documents to.
        role-arn: The Amazon Resource Name (ARN) of an IAM role with permission to access your S3 bucket.
