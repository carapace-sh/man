name: add-interface
description: '*(ALPHA)*  Add an interface to a Distributed Cloud Edge Network router.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --interconnect-attachment=: Interconnect attachment of the interface being added.
    --interface-name=!: The name of the interface being added.
    --ip-address=: Link-local address of the router for this interface.
    --ip-mask-length=: Subnet mask for the link-local IP range of the interface.
    --location=: The Cloud location for the router.
    --loopback-ip-addresses=: The list of ip ranges for the loopback interface.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --subnetwork=: Subnetwork of the interface being added.
    --zone=: The zone of the router.
documentation:
    command: '*(ALPHA)*  Create an interface to a Distributed Cloud Edge Network router.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        interconnect-attachment: Interconnect attachment of the interface being added.
        interface-name: The name of the interface being added.
        ip-address: Link-local address of the router for this interface.
        ip-mask-length: Subnet mask for the link-local IP range of the interface. The interface IP address and BGP peer IP address must be selected from the subnet defined by this link-local range.
        location: |-
            The Cloud location for the router.
            +
            To set the `location` attribute:
            * provide the argument `router` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        loopback-ip-addresses: The list of ip ranges for the loopback interface.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        subnetwork: Subnetwork of the interface being added.
        zone: |-
            The zone of the router.
            +
            To set the `zone` attribute:
            * provide the argument `router` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line.
