        odb-subnet: |-
            ID of the odbSubnet or fully qualified identifier for the odbSubnet.
            +
            To set the `odb-subnet` attribute:
            * provide the argument `--odb-subnet` on the command line.
        properties-additional-ecpu-count-per-node: |-
            The number of additional ECPUs per node for an Exadata VM cluster on
            exascale infrastructure.
        properties-cluster-name: |-
            The cluster name for Exascale vm cluster. The cluster name must begin with
            an alphabetic character and may contain hyphens(-) but can not contain
            underscores(_). It should be not more than 11 characters and is not case
            sensitive.
            OCI Cluster name.
        properties-enabled-ecpu-count-per-node: |-
            The number of ECPUs enabled per node for an exadata vm cluster on
            exascale infrastructure.
        properties-exascale-db-storage-vault: |-
            ID of the exascaleDbStorageVault or fully qualified identifier for the exascaleDbStorageVault.
            +
            To set the `exascale-db-storage-vault` attribute:
            * provide the argument `--properties-exascale-db-storage-vault` on the command line.
        properties-grid-image-id: Grid Infrastructure Version.
        properties-hostname-prefix: Prefix for VM cluster host names.
        properties-license-model: |-
            The license type of the ExadbVmCluster. _PROPERTIES_LICENSE_MODEL_ must be (only one value is supported):
            +
            :::
            +
        properties-node-count: The number of nodes/VMs in the ExadbVmCluster.
        properties-scan-listener-port-tcp: SCAN listener port - TCP
        properties-shape-attribute: |-
            The shape attribute of the VM cluster. The type of Exascale storage used
            for Exadata VM cluster. The default is SMART_STORAGE which supports Oracle
            Database 23ai and later. _PROPERTIES_SHAPE_ATTRIBUTE_ must be (only one value is supported):
            +
            :::
            +
        properties-ssh-public-keys: The SSH public keys for the ExadbVmCluster.
        request-id: |-
            An optional request ID to identify requests. Specify a unique request ID
            so that if you must retry your request, the server will know to ignore
            the request if it has already been completed. The server will guarantee
            that for at least 60 minutes since the first request.
            +
            For example, consider a situation where you make an initial request and the
            request times out. If you make the request again with the same request
            ID, the server can check if original operation with the same request ID
            was received, and if so, will ignore the second request. This prevents
            clients from accidentally creating duplicate commitments.
            +
            The request ID must be a valid UUID with the exception that zero UUID is
            not supported (00000000-0000-0000-0000-000000000000).
        time-zone-id: IANA Time Zone Database time zone. For example "America/New_York".
        time-zone-version: IANA Time Zone Database version number. For example "2019a".
        vm-file-system-storage-size-in-gbs-per-node: |-
            The storage allocation for the exadbvmcluster per node, in gigabytes (GB).
            This field is used to calculate the total storage allocation for the
            exadbvmcluster.
