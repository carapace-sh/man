name: create
description: Creates an Artifact Registry attachment in a repository.
flags:
    --attachment-namespace=: Namespace of the attachment
    --attachment-type=!: Type of the attachment
    --files=!: Comma-seperated list of files that are part of this attachment
    --location=: Location of the attachment.
    --repository=: Repository of the attachment.
    --target=!: Target of the attachment, should be fully qualified version name
documentation:
    command: Creates an Artifact Registry attachment in a repository.
    flag:
        attachment-namespace: Namespace of the attachment
        attachment-type: Type of the attachment
        files: Comma-seperated list of files that are part of this attachment
        location: |-
            Location of the attachment.
            +
            To set the `location` attribute:
            * provide the argument `attachment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `artifacts/location`.
        repository: |-
            Repository of the attachment.
            +
            To set the `repository` attribute:
            * provide the argument `attachment` on the command line with a fully specified name;
            * provide the argument `--repository` on the command line;
            * set the property `artifacts/repository`.
        target: Target of the attachment, should be fully qualified version name
