name: send-event
description: Stores events in Amazon Fraud Detector without generating fraud predictions for those events.
flags:
    --assigned-label=: The label to associate with the event.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --entities=!:
        description: An array of entities.
        nargs: -1
    --event-id=!: The event ID to upload.
    --event-timestamp=!: The timestamp that defines when the event under evaluation occurred.
    --event-type-name=!: The event type name of the event.
    --event-variables=!: Names of the event type's variables you defined in Amazon Fraud Detector to represent data elements and their corresponding values for the event you are sending for evaluation.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --label-timestamp=: The timestamp associated with the label.
documentation:
    command: Stores events in Amazon Fraud Detector without generating fraud predictions for those events. For example, you can use `SendEvent` to upload a historical dataset, which you can then later use to train a model.
    flag:
        assigned-label: The label to associate with the event. Required if specifying `labelTimestamp`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        entities: An array of entities.
        event-id: The event ID to upload.
        event-timestamp: The timestamp that defines when the event under evaluation occurred. The timestamp must be specified using ISO 8601 standard in UTC.
        event-type-name: The event type name of the event.
        event-variables: Names of the event type's variables you defined in Amazon Fraud Detector to represent data elements and their corresponding values for the event you are sending for evaluation.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        label-timestamp: The timestamp associated with the label. Required if specifying `assignedLabel`.
