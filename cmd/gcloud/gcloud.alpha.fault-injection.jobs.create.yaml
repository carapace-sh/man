name: create
description: '*(ALPHA)*  Create a Fault injection testing job.'
hidden: true
flags:
    --dry-run: Dry run mode.
    --experiment=!: ID of the experiment or fully qualified identifier for the experiment.
    --fault-targets=!: targets for the faults in experiment.
    --location=: The Cloud location for the job.
    --no-dry-run&: Dry run mode.
documentation:
    command: '*(ALPHA)*  Create a Fault injection testing job.'
    flag:
        dry-run: Dry run mode.
        experiment: |-
            ID of the experiment or fully qualified identifier for the experiment.
            +
            To set the `experiment` attribute:
            * provide the argument `--experiment` on the command line.
        fault-targets: targets for the faults in experiment. Provide them in sequence
        location: |-
            The Cloud location for the job.
            +
            To set the `location` attribute:
            * provide the argument `JOB` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-dry-run: Dry run mode.
