name: cancel
description: '*(ALPHA)*  Cancel a Dataproc Metastore operation.'
flags:
    --location=: Location to which the operation belongs.
documentation:
    command: '*(ALPHA)*  Cancel a Dataproc Metastore operation.'
    flag:
        location: |-
            Location to which the operation belongs.
            +
            To set the `location` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `metastore/location`.
