name: start-access-logging
description: Starts access logging on the specified container.
flags:
    --container-name=!: The name of the container that you want to start access logging on.
documentation:
    command: Starts access logging on the specified container. When you enable access logging on a container, MediaStore delivers access logs for objects stored in that container to Amazon CloudWatch Logs.
    flag:
        container-name: The name of the container that you want to start access logging on.
