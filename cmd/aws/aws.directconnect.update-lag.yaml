name: update-lag
description: Updates the attributes of the specified link aggregation group (LAG).
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --encryption-mode=: The LAG MAC Security (MACsec) encryption mode.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --lag-id=!: The ID of the LAG.
    --lag-name=: The name of the LAG.
    --minimum-links=: The minimum number of physical connections that must be operational for the LAG itself to be operational.
documentation:
    command: "Updates the attributes of the specified link aggregation group (LAG).\n\nYou can update the following LAG attributes:\n\n- The name of the LAG.\n- The value for the minimum number of connections that must be operational for the LAG itself to be operational.\n- The LAG's MACsec encryption mode.\n  \n  Amazon Web Services assigns this value to each connection which is part of the LAG.\n- The tags\n\nIf you adjust the threshold value for the minimum number of operational connections, ensure that the new value does not cause the LAG to fall below the threshold and become non-operational."
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        encryption-mode: |-
            The LAG MAC Security (MACsec) encryption mode.

            Amazon Web Services applies the value to all connections which are part of the LAG.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        lag-id: The ID of the LAG.
        lag-name: The name of the LAG.
        minimum-links: The minimum number of physical connections that must be operational for the LAG itself to be operational.
