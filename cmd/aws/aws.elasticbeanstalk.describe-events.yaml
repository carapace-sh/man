name: describe-events
description: Returns list of event descriptions matching criteria up to the last 6 weeks.
flags:
    --application-name=: If specified, AWS Elastic Beanstalk restricts the returned descriptions to include only those associated with this application.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --end-time=: If specified, AWS Elastic Beanstalk restricts the returned descriptions to those that occur up to, but not including, the `EndTime`.
    --environment-id=: If specified, AWS Elastic Beanstalk restricts the returned descriptions to those associated with this environment.
    --environment-name=: If specified, AWS Elastic Beanstalk restricts the returned descriptions to those associated with this environment.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-items=: The  total number of items to return in the command's output.
    --max-records=: Specifies the maximum number of events that can be returned, beginning with the most recent event.
    --next-token=: Pagination token.
    --page-size=: The size of each page to get in the AWS service call.
    --platform-arn=: The ARN of a custom platform version.
    --request-id=: If specified, AWS Elastic Beanstalk restricts the described events to include only those associated with this request ID.
    --severity=: If specified, limits the events returned from this call to include only those with the specified severity or higher.
    --start-time=: If specified, AWS Elastic Beanstalk restricts the returned descriptions to those that occur on or after this time.
    --starting-token=: A token to specify where to start paginating.
    --template-name=: If specified, AWS Elastic Beanstalk restricts the returned descriptions to those that are associated with this environment configuration.
    --version-label=: If specified, AWS Elastic Beanstalk restricts the returned descriptions to those associated with this application version.
completion:
    flag:
        severity:
            - TRACE
            - DEBUG
            - INFO
            - WARN
            - ERROR
            - FATAL
documentation:
    command: |-
        Returns list of event descriptions matching criteria up to the last 6 weeks.

        This action returns the most recent 1,000 events from the specified `NextToken`.
    flag:
        application-name: If specified, AWS Elastic Beanstalk restricts the returned descriptions to include only those associated with this application.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        end-time: If specified, AWS Elastic Beanstalk restricts the returned descriptions to those that occur up to, but not including, the `EndTime`.
        environment-id: If specified, AWS Elastic Beanstalk restricts the returned descriptions to those associated with this environment.
        environment-name: If specified, AWS Elastic Beanstalk restricts the returned descriptions to those associated with this environment.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-records: Specifies the maximum number of events that can be returned, beginning with the most recent event.
        next-token: Pagination token. If specified, the events return the next batch of results.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        platform-arn: The ARN of a custom platform version. If specified, AWS Elastic Beanstalk restricts the returned descriptions to those associated with this custom platform version.
        request-id: If specified, AWS Elastic Beanstalk restricts the described events to include only those associated with this request ID.
        severity: If specified, limits the events returned from this call to include only those with the specified severity or higher.
        start-time: If specified, AWS Elastic Beanstalk restricts the returned descriptions to those that occur on or after this time.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        template-name: If specified, AWS Elastic Beanstalk restricts the returned descriptions to those that are associated with this environment configuration.
        version-label: If specified, AWS Elastic Beanstalk restricts the returned descriptions to those associated with this application version.
