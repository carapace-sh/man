name: update
description: '*(ALPHA)*  Update the FloorSetting resource.'
flags:
    --add-integrated-services=: Set the list of integrated services for the floor setting.
    --add-rai-settings-filters=: Add rai filter settings.
    --advanced-config-deidentify-template=: The sdp filter settings enforcement.
    --advanced-config-inspect-template=: The sdp filter settings enforcement.
    --basic-config-filter-enforcement=: The sdp filter settings enforcement.
    --clear-integrated-services: Clear all integrated services from the floor setting.
    --clear-rai-settings-filters: Clear all rai filter settings.
    --enable-floor-setting-enforcement=: Enable or disable the floor setting enforcement
    --enable-google-mcp-server-cloud-logging: Enable Cloud Logging for Google MCP server sanitization to log Model Armor sanitization results.
    --enable-multi-language-detection: Enable multi-language detection for floor setting, allowing Model Armor to process content in multiple languages.
    --enable-vertex-ai-cloud-logging: Enable Cloud Logging for Vertex AI sanitization to log Model Armor sanitization results.
    --full-uri=!: Full uri of the floor setting
    --google-mcp-server-enforcement-type=: Specifies the enforcement mode for Google MCP server sanitization, such as "INSPECT_ONLY" or "INSPECT_AND_BLOCK".
    --malicious-uri-filter-settings-enforcement=: Malicious URI filter settings.
    --no-clear-integrated-services&: Clear all integrated services from the floor setting.
    --no-clear-rai-settings-filters&: Clear all rai filter settings.
    --no-enable-google-mcp-server-cloud-logging&: Enable Cloud Logging for Google MCP server sanitization to log Model Armor sanitization results.
    --no-enable-multi-language-detection&: Enable multi-language detection for floor setting, allowing Model Armor to process content in multiple languages.
    --no-enable-vertex-ai-cloud-logging&: Enable Cloud Logging for Vertex AI sanitization to log Model Armor sanitization results.
    --pi-and-jailbreak-filter-settings-confidence-level=: The pi and jailbreak filter settings confidence level.
    --pi-and-jailbreak-filter-settings-enforcement=: The pi and jailbreak filter settings enforcement.
    --rai-settings-filters=: Set rai_settings_filters to new value.
    --remove-integrated-services=: Remove specified service(s) from the list of integrated services.
    --remove-rai-settings-filters=: Remove rai filter settings.
    --vertex-ai-enforcement-type=: Specifies the enforcement mode for Vertex AI sanitization, such as "INSPECT_ONLY" or "INSPECT_AND_BLOCK".
documentation:
    command: '*(ALPHA)*  Updates the floor setting resource with the given name.'
    flag:
        add-integrated-services: Set the list of integrated services for the floor setting. This can be used to enable project-wide Model Armor sanitization for the respective services.
        add-rai-settings-filters: |-
            Add rai filter settings. Sets `add_rai_settings_filters` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --add-rai-settings-filters=string,string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --add-rai-settings-filters=["string"]
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --add-rai-settings-filters=path_to_file.(yaml|json)
            +
            ```
        advanced-config-deidentify-template: The sdp filter settings enforcement. The value can be either "enable" or "disable".
        advanced-config-inspect-template: The sdp filter settings enforcement. The value can be either "enable" or "disable".
        basic-config-filter-enforcement: The sdp filter settings enforcement. The value can be either "ENABLED" or "DISABLED"
        clear-integrated-services: Clear all integrated services from the floor setting.
        clear-rai-settings-filters: Clear all rai filter settings.
        enable-floor-setting-enforcement: Enable or disable the floor setting enforcement
        enable-google-mcp-server-cloud-logging: Enable Cloud Logging for Google MCP server sanitization to log Model Armor sanitization results. Use *--enable-google-mcp-server-cloud-logging* to enable and *--no-enable-google-mcp-server-cloud-logging* to disable.
        enable-multi-language-detection: Enable multi-language detection for floor setting, allowing Model Armor to process content in multiple languages. Use *--enable-multi-language-detection* to enable and *--no-enable-multi-language-detection* to disable.
        enable-vertex-ai-cloud-logging: Enable Cloud Logging for Vertex AI sanitization to log Model Armor sanitization results. Use *--enable-vertex-ai-cloud-logging* to enable and *--no-enable-vertex-ai-cloud-logging* to disable.
        full-uri: Full uri of the floor setting
        google-mcp-server-enforcement-type: Specifies the enforcement mode for Google MCP server sanitization, such as "INSPECT_ONLY" or "INSPECT_AND_BLOCK". Default is "INSPECT_ONLY".
        malicious-uri-filter-settings-enforcement: Malicious URI filter settings.
        no-clear-integrated-services: Clear all integrated services from the floor setting.
        no-clear-rai-settings-filters: Clear all rai filter settings.
        no-enable-google-mcp-server-cloud-logging: Enable Cloud Logging for Google MCP server sanitization to log Model Armor sanitization results.
        no-enable-multi-language-detection: Enable multi-language detection for floor setting, allowing Model Armor to process content in multiple languages.
        no-enable-vertex-ai-cloud-logging: Enable Cloud Logging for Vertex AI sanitization to log Model Armor sanitization results.
        pi-and-jailbreak-filter-settings-confidence-level: The pi and jailbreak filter settings confidence level. The value can be either "high", "medium-and-above" or "low-and-above"
        pi-and-jailbreak-filter-settings-enforcement: The pi and jailbreak filter settings enforcement. The value can be either "enable" or "disable".
        rai-settings-filters: |-
            Set rai_settings_filters to new value. List of Responsible AI filters enabled for floor setting. Sets `rai_settings_filters` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --rai-settings-filters=string,string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --rai-settings-filters=["string"]
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --rai-settings-filters=path_to_file.(yaml|json)
            +
            ```
        remove-integrated-services: Remove specified service(s) from the list of integrated services.
        remove-rai-settings-filters: |-
            Remove rai filter settings. Sets `remove_rai_settings_filters` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-rai-settings-filters=string,string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-rai-settings-filters=["string"]
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-rai-settings-filters=path_to_file.(yaml|json)
            +
            ```
        vertex-ai-enforcement-type: Specifies the enforcement mode for Vertex AI sanitization, such as "INSPECT_ONLY" or "INSPECT_AND_BLOCK". Default is "INSPECT_ONLY".
