name: update-phone-number-settings
description: Updates the phone number settings for the administrator's AWS account, such as the default outbound calling name.
flags:
    --calling-name=!: The default outbound calling name for the account.
documentation:
    command: Updates the phone number settings for the administrator's AWS account, such as the default outbound calling name. You can update the default outbound calling name once every seven days. Outbound calling names can take up to 72 hours to update.
    flag:
        calling-name: The default outbound calling name for the account.
