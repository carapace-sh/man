name: list-application-assignments
description: Lists Amazon Web Services account users that are assigned to an application.
flags:
    --application-arn=!: Specifies the ARN of the application.
    --max-results=: Specifies the total number of results that you want included in each response.
    --next-token=: Specifies that you want to receive the next page of results.
documentation:
    command: Lists Amazon Web Services account users that are assigned to an application.
    flag:
        application-arn: Specifies the ARN of the application.
        max-results: Specifies the total number of results that you want included in each response. If additional items exist beyond the number you specify, the `NextToken` response element is returned with a value (not null). Include the specified value as the `NextToken` request parameter in the next call to the operation to get the next set of results. Note that the service might return fewer results than the maximum even when there are more results available. You should check `NextToken` after every operation to ensure that you receive all of the results.
        next-token: Specifies that you want to receive the next page of results. Valid only if you received a `NextToken` response in the previous request. If you did, it indicates that more output is available. Set this parameter to the value provided by the previous call's `NextToken` response to request the next page of results.
