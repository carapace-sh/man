name: create
description: Create an address group.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --capacity=!: Capacity of the address group.
    --description=: Description of the address group.
    --items=: Items of the address group.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location Id.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --purpose=: List of Address Group purposes.
    --type=!: Type of the address group.
completion:
    flag:
        type:
            - ipv4
            - ipv6
documentation:
    command: |
        Create a new address group with the given name.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        capacity: Capacity of the address group.
        description: Description of the address group.
        items: Items of the address group.
        labels: List of label KEY=VALUE pairs to add.
        location: |-
            The location Id.
            +

            To set the `location` attribute:
            * provide the argument `address_group` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        purpose: 'List of Address Group purposes. _PURPOSE_ must be one of: *cloud-armor*, *default*.'
        type: 'Type of the address group. _TYPE_ must be one of: *ipv4*, *ipv6*.'
