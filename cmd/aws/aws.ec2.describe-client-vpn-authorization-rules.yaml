name: describe-client-vpn-authorization-rules
description: Describes the authorization rules for a specified Client VPN endpoint.
flags:
    --client-vpn-endpoint-id=!: The ID of the Client VPN endpoint.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: One or more filters.
    --max-results=: The maximum number of results to return for the request in a single page.
    --next-token=: The token to retrieve the next page of results.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: Describes the authorization rules for a specified Client VPN endpoint.
    flag:
        client-vpn-endpoint-id: The ID of the Client VPN endpoint.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            One or more filters. Filter names and values are case-sensitive.

            - `description` - The description of the authorization rule.
            - `destination-cidr` - The CIDR of the network to which the authorization rule applies.
            - `group-id` - The ID of the Active Directory group to which the authorization rule grants access.
        max-results: The maximum number of results to return for the request in a single page. The remaining results can be seen by sending another request with the nextToken value.
        next-token: The token to retrieve the next page of results.
