name: delete-file-share
description: Deletes a file share from an S3 File Gateway.
flags:
    --file-share-arn=!: The Amazon Resource Name (ARN) of the file share to be deleted.
    --force-delete=: If this value is set to `true`, the operation deletes a file share immediately and aborts all data uploads to Amazon Web Services.
documentation:
    command: Deletes a file share from an S3 File Gateway. This operation is only supported for S3 File Gateways.
    flag:
        file-share-arn: The Amazon Resource Name (ARN) of the file share to be deleted.
        force-delete: |-
            If this value is set to `true`, the operation deletes a file share immediately and aborts all data uploads to Amazon Web Services. Otherwise, the file share is not deleted until all data is uploaded to Amazon Web Services. This process aborts the data upload process, and the file share enters the `FORCE_DELETING` status.

            Valid Values: `true` | `false`
