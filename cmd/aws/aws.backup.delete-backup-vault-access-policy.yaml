name: delete-backup-vault-access-policy
description: Deletes the policy document that manages permissions on a backup vault.
flags:
    --backup-vault-name=!: The name of a logical container where backups are stored.
documentation:
    command: Deletes the policy document that manages permissions on a backup vault.
    flag:
        backup-vault-name: The name of a logical container where backups are stored. Backup vaults are identified by names that are unique to the account used to create them and the Amazon Web Services Region where they are created. They consist of lowercase letters, numbers, and hyphens.
