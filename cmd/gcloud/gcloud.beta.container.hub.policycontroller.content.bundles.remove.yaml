name: remove
description: '*(BETA)*  Removes a bundle installation for Policy Controller content.'
flags:
    --all-memberships: If supplied, apply to all Policy Controllers memberships in the fleet.
    --location=: Location for the memberships.
    --memberships=!: IDs of the memberships or fully qualified identifiers for the memberships.
    --no-all-memberships&: If supplied, apply to all Policy Controllers memberships in the fleet.
documentation:
    command: |-
        *(BETA)*  Google-defined policy bundles of constraints can be installed onto Policy
        Controller installations. This command removes those bundles.

        ## EXAMPLES

        To remove a policy bundle:

          $ gcloud beta container hub policycontroller content bundles remove cis-k8s-v1.5.1
    flag:
        all-memberships: If supplied, apply to all Policy Controllers memberships in the fleet.
        location: |-
            Location for the memberships.
            +
            To set the `location` attribute:
            * provide the argument `--memberships` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkehub/location`.
        memberships: |-
            IDs of the memberships or fully qualified identifiers for the memberships.
            +
            To set the `memberships` attribute:
            * provide the argument `--memberships` on the command line.
        no-all-memberships: If supplied, apply to all Policy Controllers memberships in the fleet.
