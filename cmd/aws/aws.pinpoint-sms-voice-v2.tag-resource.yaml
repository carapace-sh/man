name: tag-resource
description: Adds or overwrites only the specified tags for the specified resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource.
    --tags=!: An array of key and value pair tags that are associated with the resource.
documentation:
    command: Adds or overwrites only the specified tags for the specified resource. When you specify an existing tag key, the value is overwritten with the new value. Each tag consists of a key and an optional value. Tag keys must be unique per resource. For more information about tags, see [Tags](https://docs.aws.amazon.com/sms-voice/latest/userguide/phone-numbers-tags.html) in the *End User MessagingSMS User Guide*.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource.
        tags: An array of key and value pair tags that are associated with the resource.
