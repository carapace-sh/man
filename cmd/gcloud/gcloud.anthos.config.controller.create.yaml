name: create
description: Create Anthos Config Controller instances.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --cluster-ipv4-cidr-block=: The IP address range for the cluster pod IPs.
    --cluster-named-range=: The name of the existing secondary range in the clusters subnetwork to use for pod IP addresses.
    --full-management: Enable full cluster management type.
    --location=: The name of the Config Controller instance location.
    --man-block=: (DEPRECATED) Master Authorized Network.
    --man-blocks=: Master Authorized Network.
    --master-ipv4-cidr-block=: The /28 network that the control plane will use.
    --network=: Existing VPC Network to put the GKE cluster and nodes in.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-use-private-endpoint&: Only allow access to the master's private endpoint IP.
    --services-ipv4-cidr-block=: The IP address range for the cluster service IPs.
    --services-named-range=: The name of the existing secondary range in the clusters subnetwork to use for service ClusterIPs.
    --subnet=: Specifies the subnet that the VM instances are a part of.
    --use-private-endpoint: Only allow access to the master's private endpoint IP.
documentation:
    command: Create an Anthos Config Controller instance.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        cluster-ipv4-cidr-block: The IP address range for the cluster pod IPs. Can be specified as a netmask size (e.g. '/14') or as in CIDR notation (e.g. '10.100.0.0/20'). Defaults to '/20' if flag is not provided.
        cluster-named-range: The name of the existing secondary range in the clusters subnetwork to use for pod IP addresses. Alternatively, `--cluster_cidr_block` can be used to automatically create a GKE-managed one.
        full-management: Enable full cluster management type.
        location: |-
            The name of the Config Controller instance location. Currently, only ``us-central1'', ``us-east1'', ``us-east4'', ``us-east5'', ``us-west2'', ``northamerica-northeast1'', ``northamerica-northeast2'', ``europe-north1'', ``europe-west1'', ``europe-west3'', ``europe-west6'', ``australia-southeast1'', ``australia-southeast2'', ``asia-northeast1'', ``asia-northeast2'' and ``asia-southeast1'' are supported.
            +
            To set the `location` attribute:
            * provide the argument `name` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        man-block: |-
            (DEPRECATED) Master Authorized Network. Allows access to the Kubernetes control plane from this block. Defaults to `0.0.0.0/0` if flag is not provided.
            +
            The --man-block option is deprecated; use --man-blocks instead.
        man-blocks: Master Authorized Network. Allows users to specify multiple blocks to access the Kubernetescontrol plane from this block. Defaults to `0.0.0.0/0` if flag is not provided.
        master-ipv4-cidr-block: The /28 network that the control plane will use. Defaults to '172.16.0.128/28' if flag is not provided.
        network: Existing VPC Network to put the GKE cluster and nodes in. Defaults to 'default' if flag is not provided. If `--subnet=SUBNET` is also specified, subnet must be a subnetwork of the network specified by this `--network=NETWORK` flag.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-use-private-endpoint: Only allow access to the master's private endpoint IP.
        services-ipv4-cidr-block: The IP address range for the cluster service IPs. Can be specified as a netmask size (e.g. '/14') or as in CIDR notation (e.g. '10.100.0.0/20'). Defaults to '/24' if flag is not provided.
        services-named-range: The name of the existing secondary range in the clusters subnetwork to use for service ClusterIPs. Alternatively, `--services_cidr_block` can be used to automatically create a GKE-managed one.
        subnet: Specifies the subnet that the VM instances are a part of. `--network=NETWORK` must also be specified, subnet must be a subnetwork of the network specified by the `--network=NETWORK` flag.
        use-private-endpoint: Only allow access to the master's private endpoint IP.
