name: delete-message-template-attachment
description: Deletes the attachment file from the Amazon Q in Connect message template that is referenced by `$LATEST` qualifier.
flags:
    --attachment-id=!: The identifier of the attachment file.
    --knowledge-base-id=!: The identifier of the knowledge base.
    --message-template-id=!: The identifier of the message template.
documentation:
    command: Deletes the attachment file from the Amazon Q in Connect message template that is referenced by `$LATEST` qualifier. Attachments on available message template versions will remain unchanged.
    flag:
        attachment-id: The identifier of the attachment file.
        knowledge-base-id: The identifier of the knowledge base. Can be either the ID or the ARN. URLs cannot contain the ARN.
        message-template-id: The identifier of the message template. Can be either the ID or the ARN. It cannot contain any qualifier.
