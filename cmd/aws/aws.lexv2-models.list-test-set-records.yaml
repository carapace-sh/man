name: list-test-set-records
description: The list of test set records.
flags:
    --max-results=: The maximum number of test set records to return in each page.
    --next-token=: If the response from the ListTestSetRecords operation contains more results than specified in the maxResults parameter, a token is returned in the response.
    --test-set-id=!: The identifier of the test set to list its test set records.
documentation:
    command: The list of test set records.
    flag:
        max-results: The maximum number of test set records to return in each page. If there are fewer records than the max page size, only the actual number of records are returned.
        next-token: If the response from the ListTestSetRecords operation contains more results than specified in the maxResults parameter, a token is returned in the response. Use that token in the nextToken parameter to return the next page of results.
        test-set-id: The identifier of the test set to list its test set records.
