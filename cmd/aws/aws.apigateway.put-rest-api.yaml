name: put-rest-api
description: A feature of the API Gateway control service for updating an existing API with an input of external API definitions.
flags:
    --body=!: The PUT request body containing external API definitions.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --fail-on-warnings: A query parameter to indicate whether to rollback the API update (`true`) or not (`false`) when a warning is encountered.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --mode=: The `mode` query parameter to specify the update mode.
    --no-fail-on-warnings: A query parameter to indicate whether to rollback the API update (`true`) or not (`false`) when a warning is encountered.
    --parameters=: Custom header parameters as part of the request.
    --rest-api-id=!: The string identifier of the associated RestApi.
completion:
    flag:
        mode:
            - merge
            - overwrite
documentation:
    command: A feature of the API Gateway control service for updating an existing API with an input of external API definitions. The update can take the form of merging the supplied definition into the existing API or overwriting the existing API.
    flag:
        body: The PUT request body containing external API definitions. Currently, only OpenAPI definition JSON/YAML files are supported. The maximum size of the API definition file is 6MB.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        fail-on-warnings: A query parameter to indicate whether to rollback the API update (`true`) or not (`false`) when a warning is encountered. The default value is `false`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        mode: The `mode` query parameter to specify the update mode. Valid values are "merge" and "overwrite". By default, the update mode is "merge".
        parameters: Custom header parameters as part of the request. For example, to exclude DocumentationParts from an imported API, set `ignore=documentation` as a `parameters` value, as in the AWS CLI command of `aws apigateway import-rest-api --parameters ignore=documentation --body 'file:///path/to/imported-api-body.json'`.
        rest-api-id: The string identifier of the associated RestApi.
