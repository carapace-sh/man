name: start-deployment
description: Starts a deployment for a manually deployed app.
flags:
    --app-id=!: The unique ID for an Amplify app.
    --branch-name=!: The name of the branch to use for the deployment job.
    --job-id=: The job ID for this deployment that is generated by the `CreateDeployment` request.
    --source-url-type=: The type of source specified by the `sourceURL`.
    --source-url=: The source URL for the deployment that is used when calling `StartDeployment` without `CreateDeployment`.
completion:
    flag:
        source-url-type:
            - ZIP
            - BUCKET_PREFIX
documentation:
    command: |-
        Starts a deployment for a manually deployed app. Manually deployed apps are not connected to a Git repository.

        The maximum duration between the `CreateDeployment` call and the `StartDeployment` call cannot exceed 8 hours. If the duration exceeds 8 hours, the `StartDeployment` call and the associated `Job` will fail.
    flag:
        app-id: The unique ID for an Amplify app.
        branch-name: The name of the branch to use for the deployment job.
        job-id: The job ID for this deployment that is generated by the `CreateDeployment` request.
        source-url: The source URL for the deployment that is used when calling `StartDeployment` without `CreateDeployment`. The source URL can be either an HTTP GET URL that is publicly accessible and downloads a single .zip file, or an Amazon S3 bucket and prefix.
        source-url-type: The type of source specified by the `sourceURL`. If the value is `ZIP`, the source is a .zip file. If the value is `BUCKET_PREFIX`, the source is an Amazon S3 bucket and prefix. If no value is specified, the default is `ZIP`.
