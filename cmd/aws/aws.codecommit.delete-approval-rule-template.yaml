name: delete-approval-rule-template
description: Deletes a specified approval rule template.
flags:
    --approval-rule-template-name=!: The name of the approval rule template to delete.
documentation:
    command: Deletes a specified approval rule template. Deleting a template does not remove approval rules on pull requests already created with the template.
    flag:
        approval-rule-template-name: The name of the approval rule template to delete.
