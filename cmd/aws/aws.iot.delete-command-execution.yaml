name: delete-command-execution
description: Delete a command execution.
flags:
    --execution-id=!: The unique identifier of the command execution that you want to delete from your account.
    --target-arn=!: The Amazon Resource Number (ARN) of the target device for which you want to delete command executions.
documentation:
    command: |-
        Delete a command execution.

        Only command executions that enter a terminal state can be deleted from your account.
    flag:
        execution-id: The unique identifier of the command execution that you want to delete from your account.
        target-arn: The Amazon Resource Number (ARN) of the target device for which you want to delete command executions.
