name: create-assessment-template
description: Creates an assessment template for the assessment target that is specified by the ARN of the assessment target.
flags:
    --assessment-target-arn=!: The ARN that specifies the assessment target for which you want to create the assessment template.
    --assessment-template-name=!: The user-defined name that identifies the assessment template that you want to create.
    --duration-in-seconds=!: The duration of the assessment run in seconds.
    --rules-package-arns=!: The ARNs that specify the rules packages that you want to attach to the assessment template.
    --user-attributes-for-findings=: The user-defined attributes that are assigned to every finding that is generated by the assessment run that uses this assessment template.
documentation:
    command: Creates an assessment template for the assessment target that is specified by the ARN of the assessment target. If the [service-linked role](https://docs.aws.amazon.com/inspector/latest/userguide/inspector_slr.html) isn’t already registered, this action also creates and registers a service-linked role to grant Amazon Inspector access to AWS Services needed to perform security assessments.
    flag:
        assessment-target-arn: The ARN that specifies the assessment target for which you want to create the assessment template.
        assessment-template-name: The user-defined name that identifies the assessment template that you want to create. You can create several assessment templates for an assessment target. The names of the assessment templates that correspond to a particular assessment target must be unique.
        duration-in-seconds: The duration of the assessment run in seconds.
        rules-package-arns: The ARNs that specify the rules packages that you want to attach to the assessment template.
        user-attributes-for-findings: The user-defined attributes that are assigned to every finding that is generated by the assessment run that uses this assessment template. An attribute is a key and value pair (an [Attribute]() object). Within an assessment template, each key must be unique.
