name: bitbucket-data-center
description: '*(BETA)*  Create a Cloud Build Connection for Bitbucket Data Center.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --authorizer-token-secret-version=!: Secret containing the REPO_ADMIN personal access token.
    --host-uri=: URI of the Bitbucket Data Center instance.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --read-authorizer-token-secret-version=!: Secret containing the REPO_READ personal access token.
    --region=: The Google Cloud region.
    --service-directory-service=!: Service Directory service resource to use for accessing the Bitbucket Data Center.
    --ssl-ca-file=: File containing the SSL_CA to be used.
    --webhook-secret-secret-version=!: Secret containing the webhook secret string for validating webhook events sent by
documentation:
    command: |
        *(BETA)*  Create a Cloud Build Connection for Bitbucket Data Center.

        A Bitbucket Data Center Connection can be created by using a personal access token with `REPO_ADMIN`
        scope permission. A `REPO_READ` scoped personal access token will also be required.

        If the Bitbucket Data Center can only be accessed within a VPC, a Service Directory
        service resource can be provided for connecting to it.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        authorizer-token-secret-version: Secret containing the REPO_ADMIN personal access token.
        host-uri: URI of the Bitbucket Data Center instance.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        read-authorizer-token-secret-version: Secret containing the REPO_READ personal access token.
        region: |-
            The Google Cloud region.
            +
            To set the `region` attribute:
            * provide the argument `connection` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `builds/region`.
        service-directory-service: Service Directory service resource to use for accessing the Bitbucket Data Center. Necessary only if the server has no public access from the internet.
        ssl-ca-file: File containing the SSL_CA to be used.
        webhook-secret-secret-version: |-
            Secret containing the webhook secret string for validating webhook events sent by
            Bitbucket Data Center.
