name: csv
description: '*(BETA)*  Imports data into a Cloud SQL instance from a CSV file.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --columns=: The columns to import from csv file.
    --database=!: The database (for example, guestbook) to which the import is made.
    --escape=: Specifies the character that should appear before a data character that needs to be escaped.
    --fields-terminated-by=: Specifies the character that splits column values.
    --lines-terminated-by=: Specifies the character that split line records.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --quote=: Specifies the character that encloses values from columns that have string data type.
    --table=!: The database table to import csv file into.
    --user=: PostgreSQL user for this import operation.
documentation:
    command: |-
        *(BETA)*  Imports data into a Cloud SQL instance from a plain text file in a Google
        Cloud Storage bucket with one line per row and comma-separated fields.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        columns: The columns to import from csv file. These correspond to actual database columns to import. If not set, all columns from csv file are imported to corresponding database columns.
        database: The database (for example, guestbook) to which the import is made.
        escape: Specifies the character that should appear before a data character that needs to be escaped. The value of this argument has to be a character in Hex ASCII Code. For example, "22" represents double quotes. This flag is only available for MySQL and Postgres. If this flag is not provided, double quotes character will be used as the default value.
        fields-terminated-by: Specifies the character that splits column values. The value of this argument has to be a character in Hex ASCII Code. For example, "2C" represents a comma. This flag is only available for MySQL and Postgres. If this flag is not provided, a comma character will be used as the default value.
        lines-terminated-by: Specifies the character that split line records. The value of this argument has to be a character in Hex ASCII Code. For example, "0A" represents a new line. This flag is only available for MySQL. If this flag is not provided, a new line character will be used as the default value.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        quote: Specifies the character that encloses values from columns that have string data type. The value of this argument has to be a character in Hex ASCII Code. For example, "22" represents double quotes. This flag is only available for MySQL and Postgres. If this flag is not provided, double quotes character will be used as the default value.
        table: The database table to import csv file into.
        user: PostgreSQL user for this import operation.
