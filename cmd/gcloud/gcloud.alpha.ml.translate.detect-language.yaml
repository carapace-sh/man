name: detect-language
description: '*(ALPHA)*  Use the Google Cloud Translation API to detect languages.'
flags:
    --content-file=: Specify a local file path with content.
    --content=: Content of the input in string format.
    --mime-type=: Format of the source text, for example, 'text/html', 'text/plain'.
    --model=: Language detection model to be used.
    --zone=: Location to make calls.
documentation:
    command: |
        *(ALPHA)*  Detects the language of text in a request.
    flag:
        content: Content of the input in string format.
        content-file: Specify a local file path with content.
        mime-type: |-
            Format of the source text, for example, 'text/html', 'text/plain'. Defaults to
            'text/html'.
        model: |-
            Language detection model to be used. If not specified, the default
            (language-detection/default) model is used.
            Authorization requires the following Google IAM permission on the specified resource model:
            +
                cloudtranslate.languageDetectionModels.predict
        zone: |-
            Location to make calls. Non-global location is required for requests using AutoML models.
            Currently, only 'us-central1' is supported as a non-global location. Defaults to 'global'.
