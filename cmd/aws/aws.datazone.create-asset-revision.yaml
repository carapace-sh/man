name: create-asset-revision
description: Creates a revision of the asset.
flags:
    --client-token=: A unique, case-sensitive identifier that is provided to ensure the idempotency of the request.
    --description=: The revised description of the asset.
    --domain-identifier=!: The unique identifier of the domain where the asset is being revised.
    --forms-input=: The metadata forms to be attached to the asset as part of asset revision.
    --glossary-terms=: The glossary terms to be attached to the asset as part of asset revision.
    --identifier=!: The identifier of the asset.
    --name=!: Te revised name of the asset.
    --prediction-configuration=: The configuration of the automatically generated business-friendly metadata for the asset.
    --type-revision=: The revision type of the asset.
documentation:
    command: |-
        Creates a revision of the asset.

        Asset revisions represent new versions of existing assets, capturing changes to either the underlying data or its metadata. They maintain a historical record of how assets evolve over time, who made changes, and when those changes occurred. This versioning capability is crucial for governance and compliance, allowing organizations to track changes, understand their impact, and roll back if necessary.

        Prerequisites:

        - Asset must already exist in the domain with identifier.
        - `formsInput` is required when asset has the form type. `typeRevision` should be the latest version of form type.
        - The form content must include all required fields (e.g., `bucketArn` for `S3ObjectCollectionForm`).
        - The owning project of the original asset must still exist and be active.
        - User must have write access to the project and domain.
    flag:
        client-token: A unique, case-sensitive identifier that is provided to ensure the idempotency of the request.
        description: The revised description of the asset.
        domain-identifier: The unique identifier of the domain where the asset is being revised.
        forms-input: The metadata forms to be attached to the asset as part of asset revision.
        glossary-terms: The glossary terms to be attached to the asset as part of asset revision.
        identifier: The identifier of the asset.
        name: Te revised name of the asset.
        prediction-configuration: The configuration of the automatically generated business-friendly metadata for the asset.
        type-revision: The revision type of the asset.
