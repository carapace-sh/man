name: disassociate-member-from-group
description: Removes a member from a group.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --group-id=!: The identifier for the group from which members are removed.
    --member-id=!: The identifier for the member to be removed from the group.
    --organization-id=!: The identifier for the organization under which the group exists.
documentation:
    command: Removes a member from a group.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        group-id: |-
            The identifier for the group from which members are removed.

            The identifier can accept *GroupId*, *Groupname*, or *email*. The following identity formats are available:

            - Group ID: 12345678-1234-1234-1234-123456789012 or S-1-1-12-1234567890-123456789-123456789-1234
            - Email address: group@domain.tld
            - Group name: group
        member-id: |-
            The identifier for the member to be removed from the group.

            The member ID can accept *UserID or GroupId*, *Username or Groupname*, or *email*.

            - Member ID: 12345678-1234-1234-1234-123456789012 or S-1-1-12-1234567890-123456789-123456789-1234
            - Email address: member@domain.tld
            - Member name: member
        organization-id: The identifier for the organization under which the group exists.
