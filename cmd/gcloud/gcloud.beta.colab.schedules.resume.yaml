name: resume
description: '*(BETA)*  Resume a schedule.'
flags:
    --enable-catch-up: Enables backfilling missed runs when the schedule is resumed from PAUSED state.
    --no-enable-catch-up&: Enables backfilling missed runs when the schedule is resumed from PAUSED state.
    --region=: Cloud region for the schedule.
documentation:
    command: |
        *(BETA)*  Resume a Colab Enterprise notebook execution schedule.
    flag:
        enable-catch-up: Enables backfilling missed runs when the schedule is resumed from PAUSED state. If enabled, all missed runs will be scheduled and new runs will be scheduled after the backfill is complete.
        no-enable-catch-up: Enables backfilling missed runs when the schedule is resumed from PAUSED state. If enabled, all missed runs will be scheduled and new runs will be scheduled after the backfill is complete.
        region: |-
            Cloud region for the schedule.
            +
            To set the `region` attribute:
            * provide the argument `schedule` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `colab/region`.
