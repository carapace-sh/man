name: list-stack-set-operation-results
description: Returns summary information about the results of a StackSet operation.
flags:
    --call-as=: \[Service-managed permissions] Specifies whether you are acting as an account administrator in the organization's management account or as a delegated administrator in a member account.
    --filters=: The filter to apply to operation results.
    --max-results=: The maximum number of results to be returned with a single call.
    --next-token=: The token for the next set of items to return.
    --operation-id=!: The ID of the StackSet operation.
    --stack-set-name=!: The name or unique ID of the StackSet that you want to get operation results for.
completion:
    flag:
        call-as:
            - SELF
            - DELEGATED_ADMIN
documentation:
    command: |-
        Returns summary information about the results of a StackSet operation.

        This API provides *eventually consistent* reads meaning it may take some time but will eventually return the most up-to-date data.
    flag:
        call-as: "\\[Service-managed permissions] Specifies whether you are acting as an account administrator in the organization's management account or as a delegated administrator in a member account.\n\nBy default, `SELF` is specified. Use `SELF` for StackSets with self-managed permissions.\n\n- If you are signed in to the management account, specify `SELF`.\n- If you are signed in to a delegated administrator account, specify `DELEGATED_ADMIN`.\n  \n  Your Amazon Web Services account must be registered as a delegated administrator in the management account. For more information, see [Register a delegated administrator](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-delegated-admin.html) in the *CloudFormation User Guide*."
        filters: The filter to apply to operation results.
        max-results: The maximum number of results to be returned with a single call. If the number of available results exceeds this maximum, the response includes a `NextToken` value that you can assign to the `NextToken` request parameter to get the next set of results.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
        operation-id: The ID of the StackSet operation.
        stack-set-name: The name or unique ID of the StackSet that you want to get operation results for.
