name: list-connector-entities
description: Returns the list of available connector entities supported by Amazon AppFlow.
flags:
    --api-version=: The version of the API that's used by the connector.
    --connector-profile-name=: The name of the connector profile.
    --connector-type=: The type of connector, such as Salesforce, Amplitude, and so on.
    --entities-path=: This optional parameter is specific to connector implementation.
    --max-results=: The maximum number of items that the operation returns in the response.
    --next-token=: A token that was provided by your prior `ListConnectorEntities` operation if the response was too big for the page size.
completion:
    flag:
        connector-type:
            - Salesforce
            - Singular
            - Slack
            - Redshift
            - S3
            - Marketo
            - Googleanalytics
            - Zendesk
            - Servicenow
            - Datadog
            - Trendmicro
            - Snowflake
            - Dynatrace
            - Infornexus
            - Amplitude
            - Veeva
            - EventBridge
            - LookoutMetrics
            - Upsolver
            - Honeycode
            - CustomerProfiles
            - SAPOData
            - CustomConnector
            - Pardot
documentation:
    command: Returns the list of available connector entities supported by Amazon AppFlow. For example, you can query Salesforce for *Account* and *Opportunity* entities, or query ServiceNow for the *Incident* entity.
    flag:
        api-version: The version of the API that's used by the connector.
        connector-profile-name: The name of the connector profile. The name is unique for each `ConnectorProfile` in the Amazon Web Services account, and is used to query the downstream connector.
        connector-type: The type of connector, such as Salesforce, Amplitude, and so on.
        entities-path: This optional parameter is specific to connector implementation. Some connectors support multiple levels or categories of entities. You can find out the list of roots for such providers by sending a request without the `entitiesPath` parameter. If the connector supports entities at different roots, this initial request returns the list of roots. Otherwise, this request returns all entities supported by the provider.
        max-results: The maximum number of items that the operation returns in the response.
        next-token: A token that was provided by your prior `ListConnectorEntities` operation if the response was too big for the page size. You specify this token to get the next page of results in paginated response.
