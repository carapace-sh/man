name: get-tags
description: Returns a list of tags that are associated with a resource group, specified by an Amazon resource name (ARN).
flags:
    --arn=!: The Amazon resource name (ARN) of the resource group whose tags you want to retrieve.
documentation:
    command: |-
        Returns a list of tags that are associated with a resource group, specified by an Amazon resource name (ARN).

        **Minimum permissions**

        To run this command, you must have the following permissions:

        - `resource-groups:GetTags`
    flag:
        arn: The Amazon resource name (ARN) of the resource group whose tags you want to retrieve.
