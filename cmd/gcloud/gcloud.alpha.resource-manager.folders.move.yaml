name: move
description: '*(ALPHA)*  Move a folder to a new position within the same organization.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --folder=: ID for the folder to use as a parent
    --no-async&: Return immediately, without waiting for the operation in progress to
    --organization=: ID for the organization to use as a parent
documentation:
    command: |-
        *(ALPHA)*  Move the given folder under a new parent folder or under the organization.
        Exactly one of --folder or --organization must be provided.

        This command can fail for the following reasons:
            * There is no folder with the given ID.
            * There is no parent with the given type and ID.
            * The new parent is not in the same organization of the given folder.
            * Permission missing for performing this move.

        ## EXAMPLES

        The following command moves a folder with the ID `123456789` into a
        folder with the ID `2345`:

          $ gcloud alpha resource-manager folders move 123456789 --folder=2345

        The following command moves a folder with the ID `123456789` into an
        organization with ID `1234`:

          $ gcloud alpha resource-manager folders move 123456789 --organization=1234
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        folder: ID for the folder to use as a parent
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        organization: ID for the organization to use as a parent
