name: get-action-type
description: Returns information about an action type created for an external provider, where the action is to be used by customers of the external provider.
flags:
    --action-version=!: A string that describes the action type version.
    --category=!: Defines what kind of action can be taken in the stage.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --owner=!: The creator of an action type that was created with any supported integration model.
    --provider=!: The provider of the action type being called.
completion:
    flag:
        category:
            - Source
            - Build
            - Deploy
            - Test
            - Invoke
            - Approval
            - Compute
documentation:
    command: Returns information about an action type created for an external provider, where the action is to be used by customers of the external provider. The action can be created with any supported integration model.
    flag:
        action-version: A string that describes the action type version.
        category: |-
            Defines what kind of action can be taken in the stage. The following are the valid values:

            - `Source`
            - `Build`
            - `Test`
            - `Deploy`
            - `Approval`
            - `Invoke`
            - `Compute`
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        owner: 'The creator of an action type that was created with any supported integration model. There are two valid values: `AWS` and `ThirdParty`.'
        provider: The provider of the action type being called. The provider name is specified when the action type is created.
