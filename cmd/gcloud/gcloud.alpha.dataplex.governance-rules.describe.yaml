name: describe
description: '*(ALPHA)*  Describe a Dataplex Governance Rule.'
hidden: true
flags:
    --location=: Location of the Dataplex resource.
documentation:
    command: |
        *(ALPHA)*  Displays all details of an Governance Rule given a valid Governance Rule name.
    flag:
        location: |-
            Location of the Dataplex resource.
            +

            To set the `location` attribute:
            * provide the argument `governance_rule` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
