name: remove-cluster-endpoints
description: '*(ALPHA)*  Remove existing Memorystore cluster endpoints.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --cluster-endpoint=!: Required, Resource details of a redis cluster endpoint.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: The name of the Redis region of the cluster.
documentation:
    command: |
        *(ALPHA)*  To remove one cluster endpoint from an existing Redis cluster, two PSC connections MUST be removed as a pair: one to the Redis cluster's discovery service attachment and the other to its additional service attachment.

        Multiple cluster endpoints COULD be removed simultaneously.

        This command can fail for the following reasons:
          * The cluster specified does not exist.
          * Some connections in the to be removed list do not exist.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        cluster-endpoint: |-
            Required, Resource details of a redis cluster endpoint.
            +
            *psc-connection*:::
            Sets `psc-connection` value.
            +
            *psc-connection-id*::::
            Sets `psc-connection-id` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --cluster-endpoint=psc-connection=[{psc-connection-id=string}] --cluster-endpoint=psc-connection=[{psc-connection-id=string}]
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --cluster-endpoint='[{"psc-connection": [{"psc-connection-id": "string"}]}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --cluster-endpoint=path_to_file.(yaml|json)
            +
            ```
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            The name of the Redis region of the cluster. Overrides the default
            redis/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `redis/region`.
