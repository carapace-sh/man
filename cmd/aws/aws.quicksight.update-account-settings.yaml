name: update-account-settings
description: Updates the Amazon QuickSight settings in your Amazon Web Services account.
flags:
    --aws-account-id=!: The ID for the Amazon Web Services account that contains the QuickSight settings that you want to list.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --default-namespace=!: The default namespace for this Amazon Web Services account.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-termination-protection-enabled: A boolean value that determines whether or not an QuickSight account can be deleted.
    --notification-email=: The email address that you want QuickSight to send notifications to regarding your Amazon Web Services account or QuickSight subscription.
    --termination-protection-enabled: A boolean value that determines whether or not an QuickSight account can be deleted.
documentation:
    command: Updates the Amazon QuickSight settings in your Amazon Web Services account.
    flag:
        aws-account-id: The ID for the Amazon Web Services account that contains the QuickSight settings that you want to list.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        default-namespace: The default namespace for this Amazon Web Services account. Currently, the default is `default`. IAM users that register for the first time with QuickSight provide an email address that becomes associated with the default namespace.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        notification-email: The email address that you want QuickSight to send notifications to regarding your Amazon Web Services account or QuickSight subscription.
        termination-protection-enabled: A boolean value that determines whether or not an QuickSight account can be deleted. A `True` value doesn't allow the account to be deleted and results in an error message if a user tries to make a `DeleteAccountSubscription` request. A `False` value will allow the account to be deleted.
