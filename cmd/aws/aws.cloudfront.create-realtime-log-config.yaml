name: create-realtime-log-config
description: Creates a real-time log configuration.
flags:
    --end-points=!: Contains information about the Amazon Kinesis data stream where you are sending real-time log data.
    --fields=!: A list of fields to include in each real-time log record.
    --name=!: A unique name to identify this real-time log configuration.
    --sampling-rate=!: The sampling rate for this real-time log configuration.
documentation:
    command: |-
        Creates a real-time log configuration.

        After you create a real-time log configuration, you can attach it to one or more cache behaviors to send real-time log data to the specified Amazon Kinesis data stream.

        For more information about real-time log configurations, see [Real-time logs](https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/real-time-logs.html) in the *Amazon CloudFront Developer Guide*.
    flag:
        end-points: Contains information about the Amazon Kinesis data stream where you are sending real-time log data.
        fields: |-
            A list of fields to include in each real-time log record.

            For more information about fields, see [Real-time log configuration fields](https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/real-time-logs.html#understand-real-time-log-config-fields) in the *Amazon CloudFront Developer Guide*.
        name: A unique name to identify this real-time log configuration.
        sampling-rate: The sampling rate for this real-time log configuration. You can specify a whole number between 1 and 100 (inclusive) to determine the percentage of viewer requests that are represented in the real-time log data.
