name: create-assistant-association
description: Creates an association between an Amazon Connect Wisdom assistant and another resource.
flags:
    --assistant-id=!: The identifier of the Wisdom assistant.
    --association-type=!: The type of association.
    --association=!: The identifier of the associated resource.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --tags=: The tags used to organize, track, or control access for this resource.
completion:
    flag:
        association-type:
            - KNOWLEDGE_BASE
documentation:
    command: Creates an association between an Amazon Connect Wisdom assistant and another resource. Currently, the only supported association is with a knowledge base. An assistant can have only a single association.
    flag:
        assistant-id: The identifier of the Wisdom assistant. Can be either the ID or the ARN. URLs cannot contain the ARN.
        association: The identifier of the associated resource.
        association-type: The type of association.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If not provided, the Amazon Web Services SDK populates this field. For more information about idempotency, see [Making retries safe with idempotent APIs](https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/).
        tags: The tags used to organize, track, or control access for this resource.
