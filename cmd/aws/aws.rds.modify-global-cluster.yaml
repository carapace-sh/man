name: modify-global-cluster
description: Modifies a setting for an Amazon Aurora global database cluster.
flags:
    --allow-major-version-upgrade: Specifies whether to allow major version upgrades.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --deletion-protection: Specifies whether to enable deletion protection for the global database cluster.
    --engine-version=: The version number of the database engine to which you want to upgrade.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --global-cluster-identifier=!: The cluster identifier for the global cluster to modify.
    --new-global-cluster-identifier=: The new cluster identifier for the global database cluster.
    --no-allow-major-version-upgrade: Specifies whether to allow major version upgrades.
    --no-deletion-protection: Specifies whether to enable deletion protection for the global database cluster.
documentation:
    command: |-
        Modifies a setting for an Amazon Aurora global database cluster. You can change one or more database configuration parameters by specifying these parameters and the new values in the request. For more information on Amazon Aurora, see [What is Amazon Aurora?](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_AuroraOverview.html) in the *Amazon Aurora User Guide*.

        This operation only applies to Aurora global database clusters.
    flag:
        allow-major-version-upgrade: |-
            Specifies whether to allow major version upgrades.

            Constraints: Must be enabled if you specify a value for the `EngineVersion` parameter that's a different major version than the global cluster's current version.

            If you upgrade the major version of a global database, the cluster and DB instance parameter groups are set to the default parameter groups for the new version. Apply any custom parameter groups after completing the upgrade.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        deletion-protection: Specifies whether to enable deletion protection for the global database cluster. The global database cluster can't be deleted when deletion protection is enabled.
        engine-version: |-
            The version number of the database engine to which you want to upgrade.

            To list all of the available engine versions for `aurora-mysql` (for MySQL-based Aurora global databases), use the following command:

            ``aws rds describe-db-engine-versions --engine aurora-mysql --query '*[]|[?SupportsGlobalDatabases == `true`].[EngineVersion]'``

            To list all of the available engine versions for `aurora-postgresql` (for PostgreSQL-based Aurora global databases), use the following command:

            ``aws rds describe-db-engine-versions --engine aurora-postgresql --query '*[]|[?SupportsGlobalDatabases == `true`].[EngineVersion]'``
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        global-cluster-identifier: |-
            The cluster identifier for the global cluster to modify. This parameter isn't case-sensitive.

            Constraints:

            - Must match the identifier of an existing global database cluster.
        new-global-cluster-identifier: |-
            The new cluster identifier for the global database cluster. This value is stored as a lowercase string.

            Constraints:

            - Must contain from 1 to 63 letters, numbers, or hyphens.
            - The first character must be a letter.
            - Can't end with a hyphen or contain two consecutive hyphens.

            Example: `my-cluster2`
