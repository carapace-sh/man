name: copy-dbparameter-group
description: Copies the specified DB parameter group.
flags:
    --source-dbparameter-group-identifier=!: The identifier or ARN for the source DB parameter group.
    --tags=: The tags to be assigned to the copied DB parameter group.
    --target-dbparameter-group-description=!: A description for the copied DB parameter group.
    --target-dbparameter-group-identifier=!: The identifier for the copied DB parameter group.
documentation:
    command: Copies the specified DB parameter group.
    flag:
        source-dbparameter-group-identifier: |-
            The identifier or ARN for the source DB parameter group. For information about creating an ARN, see [Constructing an Amazon Resource Name (ARN)](https://docs.aws.amazon.com/neptune/latest/UserGuide/tagging.ARN.html#tagging.ARN.Constructing).

            Constraints:

            - Must specify a valid DB parameter group.
            - Must specify a valid DB parameter group identifier, for example `my-db-param-group`, or a valid ARN.
        tags: The tags to be assigned to the copied DB parameter group.
        target-dbparameter-group-description: A description for the copied DB parameter group.
        target-dbparameter-group-identifier: |-
            The identifier for the copied DB parameter group.

            Constraints:

            - Cannot be null, empty, or blank.
            - Must contain from 1 to 255 letters, numbers, or hyphens.
            - First character must be a letter.
            - Cannot end with a hyphen or contain two consecutive hyphens.

            Example: `my-db-parameter-group`
