name: delete-data-provider
description: Deletes the specified data provider.
flags:
    --data-provider-identifier=!: The identifier of the data provider to delete.
documentation:
    command: |-
        Deletes the specified data provider.

        All migration projects associated with the data provider must be deleted or modified before you can delete the data provider.
    flag:
        data-provider-identifier: The identifier of the data provider to delete.
