name: verify-pin-data
description: Verifies pin-related data such as PIN and PIN Offset using algorithms including VISA PVV and IBM3624.
flags:
    --dukpt-attributes=: The attributes and values for the DUKPT encrypted PIN block data.
    --encrypted-pin-block=!: The encrypted PIN block data that Amazon Web Services Payment Cryptography verifies.
    --encryption-key-identifier=!: The `keyARN` of the encryption key under which the PIN block data is encrypted.
    --encryption-wrapped-key=: ""
    --pin-block-format=!: The PIN encoding format for pin data generation as specified in ISO 9564. Amazon Web Services Payment Cryptography supports `ISO_Format_0` and `ISO_Format_3`.
    --pin-data-length=: The length of PIN being verified.
    --primary-account-number=: The Primary Account Number (PAN), a unique identifier for a payment credit or debit card that associates the card with a specific account holder.
    --verification-attributes=!: The attributes and values for PIN data verification.
    --verification-key-identifier=!: The `keyARN` of the PIN verification key.
completion:
    flag:
        pin-block-format:
            - ISO_FORMAT_0
            - ISO_FORMAT_1
            - ISO_FORMAT_3
            - ISO_FORMAT_4
documentation:
    command: |-
        Verifies pin-related data such as PIN and PIN Offset using algorithms including VISA PVV and IBM3624. For more information, see [Verify PIN data](https://docs.aws.amazon.com/payment-cryptography/latest/userguide/verify-pin-data.html) in the *Amazon Web Services Payment Cryptography User Guide*.

        This operation verifies PIN data for user payment card. A card holder PIN data is never transmitted in clear to or from Amazon Web Services Payment Cryptography. This operation uses PIN Verification Key (PVK) for PIN or PIN Offset generation and then encrypts it using PIN Encryption Key (PEK) to create an `EncryptedPinBlock` for transmission from Amazon Web Services Payment Cryptography.

        For information about valid keys for this operation, see [Understanding key attributes](https://docs.aws.amazon.com/payment-cryptography/latest/userguide/keys-validattributes.html) and [Key types for specific data operations](https://docs.aws.amazon.com/payment-cryptography/latest/userguide/crypto-ops-validkeys-ops.html) in the *Amazon Web Services Payment Cryptography User Guide*.

        **Cross-account use**: This operation can't be used across different Amazon Web Services accounts.

        **Related operations:**

        - [GeneratePinData]()
        - [TranslatePinData]()
    flag:
        dukpt-attributes: The attributes and values for the DUKPT encrypted PIN block data.
        encrypted-pin-block: The encrypted PIN block data that Amazon Web Services Payment Cryptography verifies.
        encryption-key-identifier: The `keyARN` of the encryption key under which the PIN block data is encrypted. This key type can be PEK or BDK.
        encryption-wrapped-key: ""
        pin-block-format: |-
            The PIN encoding format for pin data generation as specified in ISO 9564. Amazon Web Services Payment Cryptography supports `ISO_Format_0` and `ISO_Format_3`.

            The `ISO_Format_0` PIN block format is equivalent to the ANSI X9.8, VISA-1, and ECI-1 PIN block formats. It is similar to a VISA-4 PIN block format. It supports a PIN from 4 to 12 digits in length.

            The `ISO_Format_3` PIN block format is the same as `ISO_Format_0` except that the fill digits are random values from 10 to 15.
        pin-data-length: The length of PIN being verified.
        primary-account-number: The Primary Account Number (PAN), a unique identifier for a payment credit or debit card that associates the card with a specific account holder.
        verification-attributes: The attributes and values for PIN data verification.
        verification-key-identifier: The `keyARN` of the PIN verification key.
