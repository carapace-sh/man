name: list-object-versions
description: 'End of support notice: Beginning November 21, 2025, Amazon S3 will stop returning `DisplayName`.'
flags:
    --bucket=!: The bucket name that contains the objects.
    --delimiter=: A delimiter is a character that you specify to group keys.
    --encoding-type=: ""
    --expected-bucket-owner=: The account ID of the expected bucket owner.
    --key-marker=: Specifies the key to start with when listing objects in a bucket.
    --max-keys=: Sets the maximum number of keys returned in the response.
    --optional-object-attributes=: Specifies the optional fields that you want returned in the response.
    --prefix=: Use this parameter to select only those keys that begin with the specified prefix.
    --request-payer=: ""
    --version-id-marker=: Specifies the object version you want to start listing from.
completion:
    flag:
        encoding-type:
            - url
        request-payer:
            - requester
documentation:
    command: |-
        End of support notice: Beginning November 21, 2025, Amazon S3 will stop returning `DisplayName`. Update your applications to use canonical IDs (unique identifier for Amazon Web Services accounts), Amazon Web Services account ID (12 digit identifier) or IAM ARNs (full resource naming) as a direct replacement of `DisplayName`.

        This change affects the following Amazon Web Services Regions: US East (N. Virginia) Region, US West (N. California) Region, US West (Oregon) Region, Asia Pacific (Singapore) Region, Asia Pacific (Sydney) Region, Asia Pacific (Tokyo) Region, Europe (Ireland) Region, and South America (São Paulo) Region.

        This operation is not supported for directory buckets.

        Returns metadata about all versions of the objects in a bucket. You can also use request parameters as selection criteria to return metadata about a subset of all the object versions.

        To use this operation, you must have permission to perform the `s3:ListBucketVersions` action. Be aware of the name difference.

        A `200 OK` response can contain valid or invalid XML. Make sure to design your application to parse the contents of the response and handle it appropriately.

        To use this operation, you must have READ access to the bucket.

        The following operations are related to `ListObjectVersions`:

        - [ListObjectsV2](https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjectsV2.html)
        - [GetObject](https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObject.html)
        - [PutObject](https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutObject.html)
        - [DeleteObject](https://docs.aws.amazon.com/AmazonS3/latest/API/API_DeleteObject.html)

        You must URL encode any signed header values that contain spaces. For example, if your header value is `my file.txt`, containing two spaces after `my`, you must URL encode this value to `my%20%20file.txt`.
    flag:
        bucket: The bucket name that contains the objects.
        delimiter: |-
            A delimiter is a character that you specify to group keys. All keys that contain the same string between the `prefix` and the first occurrence of the delimiter are grouped under a single result element in `CommonPrefixes`. These groups are counted as one result against the `max-keys` limitation. These keys are not returned elsewhere in the response.

            `CommonPrefixes` is filtered out from results if it is not lexicographically greater than the key-marker.
        encoding-type: ""
        expected-bucket-owner: The account ID of the expected bucket owner. If the account ID that you provide does not match the actual owner of the bucket, the request fails with the HTTP status code `403 Forbidden` (access denied).
        key-marker: Specifies the key to start with when listing objects in a bucket.
        max-keys: Sets the maximum number of keys returned in the response. By default, the action returns up to 1,000 key names. The response might contain fewer keys but will never contain more. If additional keys satisfy the search criteria, but were not returned because `max-keys` was exceeded, the response contains `<isTruncated>true</isTruncated>`. To return the additional keys, see `key-marker` and `version-id-marker`.
        optional-object-attributes: Specifies the optional fields that you want returned in the response. Fields that you do not specify are not returned.
        prefix: Use this parameter to select only those keys that begin with the specified prefix. You can use prefixes to separate a bucket into different groupings of keys. (You can think of using `prefix` to make groups in the same way that you'd use a folder in a file system.) You can use `prefix` with `delimiter` to roll up numerous objects into a single result under `CommonPrefixes`.
        request-payer: ""
        version-id-marker: Specifies the object version you want to start listing from.
