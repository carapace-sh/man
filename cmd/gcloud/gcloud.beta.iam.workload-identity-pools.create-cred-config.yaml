name: create-cred-config
description: '*(BETA)*  Create a configuration file for generated credentials.'
flags:
    --app-id-uri=: The custom Application ID URI for the Azure access token.
    --aws: Use AWS.
    --azure: Use Azure.
    --credential-cert-configuration-output-file=: Path for the certificate configuration file.
    --credential-cert-path=: Path of the X.509 certificate file.
    --credential-cert-private-key-path=!: Path of the X.509 private key file.
    --credential-cert-trust-chain-path=: Path for the trust chain file.
    --credential-source-field-name=: Subject token field name (key) in a JSON credential source.
    --credential-source-file=: Location of the credential source file.
    --credential-source-headers=: Headers to use when querying the credential-source-url.
    --credential-source-type=: Format of the credential source (JSON or text).
    --credential-source-url=: URL to obtain the credential from.
    --enable-imdsv2: Adds the AWS IMDSv2 session token Url to the credential source to enforce the AWS IMDSv2 flow.
    --executable-command=: The full command to run to retrieve the credential.
    --executable-output-file=: Absolute path to the file storing the executable response.
    --executable-timeout-millis=: Timeout duration, in milliseconds, to wait for the executable to finish.
    --no-aws&: Use AWS.
    --no-azure&: Use Azure.
    --no-enable-imdsv2&: Adds the AWS IMDSv2 session token Url to the credential source to enforce the AWS IMDSv2 flow.
    --output-file=!: Location to store the generated credential configuration file.
    --service-account-token-lifetime-seconds=: Lifetime duration of the service account access token in seconds.
    --service-account=!: Email of the service account to impersonate.
    --sts-location=: The location to use for the Security Token Service token endpoint.
    --subject-token-type=: The type of token being used for authorization.
documentation:
    command: |-
        *(BETA)*  This command creates a configuration file to allow access to authenticated
        Google Cloud actions from a variety of external accounts.
    flag:
        app-id-uri: The custom Application ID URI for the Azure access token.
        aws: Use AWS.
        azure: Use Azure.
        credential-cert-configuration-output-file: Path for the certificate configuration file. If specified, a certificate configuration file will be created at the specified path. If not specified, the certificate configuration will be created at the default gcloud location.
        credential-cert-path: Path of the X.509 certificate file.
        credential-cert-private-key-path: Path of the X.509 private key file.
        credential-cert-trust-chain-path: Path for the trust chain file. A trust chain file is required if there are intermediate certificates in the certificate chain in between the root certificate stored in the workload identity pool provider trust store. This trust chain file should be a list of PEM certificates, with the leaf certificate at the top.
        credential-source-field-name: Subject token field name (key) in a JSON credential source.
        credential-source-file: Location of the credential source file.
        credential-source-headers: Headers to use when querying the credential-source-url.
        credential-source-type: Format of the credential source (JSON or text).
        credential-source-url: URL to obtain the credential from.
        enable-imdsv2: Adds the AWS IMDSv2 session token Url to the credential source to enforce the AWS IMDSv2 flow.
        executable-command: The full command to run to retrieve the credential. Must be an absolute path for the program including arguments.
        executable-output-file: Absolute path to the file storing the executable response.
        executable-timeout-millis: Timeout duration, in milliseconds, to wait for the executable to finish.
        no-aws: Use AWS.
        no-azure: Use Azure.
        no-enable-imdsv2: Adds the AWS IMDSv2 session token Url to the credential source to enforce the AWS IMDSv2 flow.
        output-file: Location to store the generated credential configuration file.
        service-account: Email of the service account to impersonate.
        service-account-token-lifetime-seconds: Lifetime duration of the service account access token in seconds. Defaults to one hour if not specified. If a lifetime greater than one hour is required, the service account must be added as an allowed value in an Organization Policy that enforces the `constraints/iam.allowServiceAccountCredentialLifetimeExtension` constraint.
        sts-location: The location to use for the Security Token Service token endpoint. For example, specifying `us-central1` will configure the client to use the regional endpoint `sts.us-central1.rep.googleapis.com`. If not specified, the global endpoint `sts.googleapis.com` is used.
        subject-token-type: The type of token being used for authorization. This defaults to urn:ietf:params:oauth:token-type:jwt.
