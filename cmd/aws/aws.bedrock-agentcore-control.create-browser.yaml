name: create-browser
description: Creates a custom browser.
flags:
    --browser-signing=: The browser signing configuration that enables cryptographic agent identification using HTTP message signatures for web bot authentication.
    --client-token=: A unique, case-sensitive identifier to ensure that the operation completes no more than one time.
    --description=: The description of the browser.
    --execution-role-arn=: The Amazon Resource Name (ARN) of the IAM role that provides permissions for the browser to access Amazon Web Services services.
    --name=!: The name of the browser.
    --network-configuration=!: The network configuration for the browser.
    --recording=: The recording configuration for the browser.
    --tags=: A map of tag keys and values to assign to the browser.
documentation:
    command: Creates a custom browser.
    flag:
        browser-signing: The browser signing configuration that enables cryptographic agent identification using HTTP message signatures for web bot authentication.
        client-token: A unique, case-sensitive identifier to ensure that the operation completes no more than one time. If this token matches a previous request, Amazon Bedrock ignores the request but does not return an error.
        description: The description of the browser.
        execution-role-arn: The Amazon Resource Name (ARN) of the IAM role that provides permissions for the browser to access Amazon Web Services services.
        name: The name of the browser. The name must be unique within your account.
        network-configuration: The network configuration for the browser. This configuration specifies the network mode for the browser.
        recording: The recording configuration for the browser. When enabled, browser sessions are recorded and stored in the specified Amazon S3 location.
        tags: A map of tag keys and values to assign to the browser. Tags enable you to categorize your resources in different ways, for example, by purpose, owner, or environment.
