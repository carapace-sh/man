name: describe
description: Get detailed information about the custom job by given id.
flags:
    --region=: Cloud region for the custom job.
documentation:
    command: |-
        ## EXAMPLES

        To get a job ``123'' under project ``example'' in region
        ``us-central1'', run:

          $ gcloud ai custom-jobs describe 123 --project=example --region=us-central1
    flag:
        region: |-
            Cloud region for the custom job.
            +
            To set the `region` attribute:
            * provide the argument `custom_job` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
