name: delete-thing
description: Deletes the specified thing.
flags:
    --expected-version=: The expected version of the thing record in the registry.
    --thing-name=!: The name of the thing to delete.
documentation:
    command: |-
        Deletes the specified thing. Returns successfully with no error if the deletion is successful or you specify a thing that doesn't exist.

        Requires permission to access the [DeleteThing](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        expected-version: The expected version of the thing record in the registry. If the version of the record in the registry does not match the expected version specified in the request, the `DeleteThing` request is rejected with a `VersionConflictException`.
        thing-name: The name of the thing to delete.
