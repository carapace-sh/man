documentation:
    command: Allows you to send a request that sends a voice message. This operation uses [Amazon Polly](http://aws.amazon.com/polly/) to convert a text script into a voice message.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration-set-name: The name of the configuration set to use. This can be either the ConfigurationSetName or ConfigurationSetArn.
        context: You can specify custom data in this field. If you do, that data is logged to the event destination.
        destination-phone-number: The destination phone number in E.164 format.
        dry-run: When set to true, the message is checked and validated, but isn't sent to the end recipient.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-price-per-minute: The maximum amount to spend per voice message, in US dollars.
        message-body: The text to convert to a voice message.
        message-body-text-type: |-
            Specifies if the MessageBody field contains text or [speech synthesis markup language (SSML)](https://docs.aws.amazon.com/polly/latest/dg/what-is.html).

            - TEXT: This is the default value. When used the maximum character limit is 3000.
            - SSML: When used the maximum character limit is 6000 including SSML tagging.
        message-feedback-enabled: Set to true to enable message feedback for the message. When a user receives the message you need to update the message status using [PutMessageFeedback]().
        origination-identity: |-
            The origination identity to use for the voice call. This can be the PhoneNumber, PhoneNumberId, PhoneNumberArn, PoolId, or PoolArn.

            If you are using a shared End User MessagingSMS resource then you must use the full Amazon Resource Name(ARN).
        protect-configuration-id: The unique identifier for the protect configuration.
        time-to-live: How long the voice message is valid for. By default this is 72 hours.
        voice-id: The voice for the [Amazon Polly](https://docs.aws.amazon.com/polly/latest/dg/what-is.html) service to use. By default this is set to "MATTHEW".
