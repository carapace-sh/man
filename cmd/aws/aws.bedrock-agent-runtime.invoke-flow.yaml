name: invoke-flow
description: Invokes an alias of a flow to run the inputs that you specify and return the output of each node as a stream.
flags:
    --enable-trace: Specifies whether to return the trace for the flow or not.
    --execution-id=: The unique identifier for the current flow execution.
    --flow-alias-identifier=!: The unique identifier of the flow alias.
    --flow-identifier=!: The unique identifier of the flow.
    --inputs=!: A list of objects, each containing information about an input into the flow.
    --model-performance-configuration=: Model performance settings for the request.
    --no-enable-trace: Specifies whether to return the trace for the flow or not.
documentation:
    command: |-
        Invokes an alias of a flow to run the inputs that you specify and return the output of each node as a stream. If there's an error, the error is returned. For more information, see [Test a flow in Amazon Bedrock](https://docs.aws.amazon.com/bedrock/latest/userguide/flows-test.html) in the [Amazon Bedrock User Guide](https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-service.html).

        The CLI doesn't support streaming operations in Amazon Bedrock, including `InvokeFlow`.
    flag:
        enable-trace: Specifies whether to return the trace for the flow or not. Traces track inputs and outputs for nodes in the flow. For more information, see [Track each step in your prompt flow by viewing its trace in Amazon Bedrock](https://docs.aws.amazon.com/bedrock/latest/userguide/flows-trace.html).
        execution-id: The unique identifier for the current flow execution. If you don't provide a value, Amazon Bedrock creates the identifier for you.
        flow-alias-identifier: The unique identifier of the flow alias.
        flow-identifier: The unique identifier of the flow.
        inputs: A list of objects, each containing information about an input into the flow.
        model-performance-configuration: Model performance settings for the request.
