name: delete-dashboards
description: Deletes all dashboards that you specify.
flags:
    --dashboard-names=!: The dashboards to be deleted.
documentation:
    command: Deletes all dashboards that you specify. You can specify up to 100 dashboards to delete. If there is an error during this call, no dashboards are deleted.
    flag:
        dashboard-names: The dashboards to be deleted. This parameter is required.
