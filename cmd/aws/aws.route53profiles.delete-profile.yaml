name: delete-profile
description: Deletes the specified Route 53 Profile.
flags:
    --profile-id=!: The ID of the Profile that you want to delete.
documentation:
    command: Deletes the specified Route 53 Profile. Before you can delete a profile, you must first disassociate it from all VPCs.
    flag:
        profile-id: The ID of the Profile that you want to delete.
