name: describe
description: Show details about a database migration private connection.
flags:
    --region=: The name of the region.
documentation:
    command: Show details about a private connection.
    flag:
        region: |-
            The name of the region.
            +
            To set the `region` attribute:
            * provide the argument `private_connection` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
