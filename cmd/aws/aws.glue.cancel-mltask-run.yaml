name: cancel-mltask-run
description: Cancels (stops) a task run.
flags:
    --task-run-id=!: A unique identifier for the task run.
    --transform-id=!: The unique identifier of the machine learning transform.
documentation:
    command: Cancels (stops) a task run. Machine learning task runs are asynchronous tasks that Glue runs on your behalf as part of various machine learning workflows. You can cancel a machine learning task run at any time by calling `CancelMLTaskRun` with a task run's parent transform's `TransformID` and the task run's `TaskRunId`.
    flag:
        task-run-id: A unique identifier for the task run.
        transform-id: The unique identifier of the machine learning transform.
