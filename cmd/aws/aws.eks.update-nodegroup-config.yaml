name: update-nodegroup-config
description: Updates an Amazon EKS managed node group configuration.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --cluster-name=!: The name of your cluster.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --labels=: The Kubernetes `labels` to apply to the nodes in the node group after the update.
    --node-repair-config=: The node auto repair configuration for the node group.
    --nodegroup-name=!: The name of the managed node group to update.
    --scaling-config=: The scaling configuration details for the Auto Scaling group after the update.
    --taints=: The Kubernetes taints to be applied to the nodes in the node group after the update.
    --update-config=: The node group update configuration.
documentation:
    command: Updates an Amazon EKS managed node group configuration. Your node group continues to function during the update. The response output includes an update ID that you can use to track the status of your node group update with the [`DescribeUpdate`](https://docs.aws.amazon.com/eks/latest/APIReference/API_DescribeUpdate.html) API operation. You can update the Kubernetes labels and taints for a node group and the scaling and version update configuration.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
        cluster-name: The name of your cluster.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        labels: The Kubernetes `labels` to apply to the nodes in the node group after the update.
        node-repair-config: The node auto repair configuration for the node group.
        nodegroup-name: The name of the managed node group to update.
        scaling-config: The scaling configuration details for the Auto Scaling group after the update.
        taints: The Kubernetes taints to be applied to the nodes in the node group after the update. For more information, see [Node taints on managed node groups](https://docs.aws.amazon.com/eks/latest/userguide/node-taints-managed-node-groups.html).
        update-config: The node group update configuration.
