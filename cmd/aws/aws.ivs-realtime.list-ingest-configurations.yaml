name: list-ingest-configurations
description: Lists all IngestConfigurations in your account, in the AWS region where the API request is processed.
flags:
    --filter-by-stage-arn=: Filters the response list to match the specified stage ARN.
    --filter-by-state=: Filters the response list to match the specified state.
    --max-results=: Maximum number of results to return.
    --next-token=: The first IngestConfiguration to retrieve.
completion:
    flag:
        filter-by-state:
            - ACTIVE
            - INACTIVE
documentation:
    command: Lists all IngestConfigurations in your account, in the AWS region where the API request is processed.
    flag:
        filter-by-stage-arn: Filters the response list to match the specified stage ARN. Only one filter (by stage ARN or by state) can be used at a time.
        filter-by-state: Filters the response list to match the specified state. Only one filter (by stage ARN or by state) can be used at a time.
        max-results: 'Maximum number of results to return. Default: 50.'
        next-token: The first IngestConfiguration to retrieve. This is used for pagination; see the `nextToken` response field.
