name: describe-tlsinspection-configuration
description: Returns the data objects for the specified TLS inspection configuration.
flags:
    --tlsinspection-configuration-arn=: The Amazon Resource Name (ARN) of the TLS inspection configuration.
    --tlsinspection-configuration-name=: The descriptive name of the TLS inspection configuration.
documentation:
    command: Returns the data objects for the specified TLS inspection configuration.
    flag:
        tlsinspection-configuration-arn: |-
            The Amazon Resource Name (ARN) of the TLS inspection configuration.

            You must specify the ARN or the name, and you can specify both.
        tlsinspection-configuration-name: |-
            The descriptive name of the TLS inspection configuration. You can't change the name of a TLS inspection configuration after you create it.

            You must specify the ARN or the name, and you can specify both.
