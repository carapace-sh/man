name: test-authorization
description: Tests if a specified principal is authorized to perform an IoT action on a specified resource.
flags:
    --auth-infos=!: A list of authorization info objects.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-id=: The MQTT client ID.
    --cognito-identity-pool-id=: The Cognito identity pool ID.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --policy-names-to-add=: When testing custom authorization, the policies specified here are treated as if they are attached to the principal being authorized.
    --policy-names-to-skip=: When testing custom authorization, the policies specified here are treated as if they are not attached to the principal being authorized.
    --principal=: The principal.
documentation:
    command: |-
        Tests if a specified principal is authorized to perform an IoT action on a specified resource. Use this to test and debug the authorization behavior of devices that connect to the IoT device gateway.

        Requires permission to access the [TestAuthorization](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        auth-infos: A list of authorization info objects. Simulating authorization will create a response for each `authInfo` object in the list.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-id: The MQTT client ID.
        cognito-identity-pool-id: The Cognito identity pool ID.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        policy-names-to-add: When testing custom authorization, the policies specified here are treated as if they are attached to the principal being authorized.
        policy-names-to-skip: When testing custom authorization, the policies specified here are treated as if they are not attached to the principal being authorized.
        principal: The principal. Valid principals are CertificateArn (arn:aws:iot:*region*:*accountId*:cert/*certificateId*), thingGroupArn (arn:aws:iot:*region*:*accountId*:thinggroup/*groupName*) and CognitoId (*region*:*id*).
