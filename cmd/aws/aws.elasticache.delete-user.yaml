name: delete-user
description: 'For Valkey engine version 7.2 onwards and Redis OSS 6.0 onwards: Deletes a user.'
flags:
    --user-id=!: The ID of the user.
documentation:
    command: 'For Valkey engine version 7.2 onwards and Redis OSS 6.0 onwards: Deletes a user. The user will be removed from all user groups and in turn removed from all replication groups. For more information, see [Using Role Based Access Control (RBAC)](http://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Clusters.RBAC.html).'
    flag:
        user-id: The ID of the user.
