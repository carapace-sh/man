name: update-fleet
description: Updates a fleet.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: The unique token which the server uses to recognize retries of the same request.
    --configuration=: The fleet configuration to update.
    --description=: The description of the fleet to update.
    --display-name=: The display name of the fleet to update.
    --farm-id=!: The farm ID to update.
    --fleet-id=!: The fleet ID to update.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --host-configuration=: Provides a script that runs as a worker is starting up that you can use to provide additional configuration for workers in your fleet.
    --max-worker-count=: The maximum number of workers in the fleet.
    --min-worker-count=: The minimum number of workers in the fleet.
    --role-arn=: The IAM role ARN that the fleet's workers assume while running jobs.
documentation:
    command: Updates a fleet.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: The unique token which the server uses to recognize retries of the same request.
        configuration: The fleet configuration to update.
        description: |-
            The description of the fleet to update.

            This field can store any content. Escape or encode this content before displaying it on a webpage or any other system that might interpret the content of this field.
        display-name: |-
            The display name of the fleet to update.

            This field can store any content. Escape or encode this content before displaying it on a webpage or any other system that might interpret the content of this field.
        farm-id: The farm ID to update.
        fleet-id: The fleet ID to update.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        host-configuration: Provides a script that runs as a worker is starting up that you can use to provide additional configuration for workers in your fleet.
        max-worker-count: |-
            The maximum number of workers in the fleet.

            Deadline Cloud limits the number of workers to less than or equal to the fleet's maximum worker count. The service maintains eventual consistency for the worker count. If you make multiple rapid calls to `CreateWorker` before the field updates, you might exceed your fleet's maximum worker count. For example, if your `maxWorkerCount` is 10 and you currently have 9 workers, making two quick `CreateWorker` calls might successfully create 2 workers instead of 1, resulting in 11 total workers.
        min-worker-count: The minimum number of workers in the fleet.
        role-arn: The IAM role ARN that the fleet's workers assume while running jobs.
