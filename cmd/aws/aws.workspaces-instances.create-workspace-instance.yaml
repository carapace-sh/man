name: create-workspace-instance
description: Launches a new WorkSpace Instance with specified configuration parameters, enabling programmatic workspace deployment.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Unique token to ensure idempotent instance creation, preventing duplicate workspace launches.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --managed-instance=!: Comprehensive configuration settings for the WorkSpaces Instance, including network, compute, and storage parameters.
    --tags=:
        description: Optional metadata tags for categorizing and managing WorkSpaces Instances.
        nargs: -1
documentation:
    command: Launches a new WorkSpace Instance with specified configuration parameters, enabling programmatic workspace deployment.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
