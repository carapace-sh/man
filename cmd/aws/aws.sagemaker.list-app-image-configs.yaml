name: list-app-image-configs
description: Lists the AppImageConfigs in your account and their properties.
flags:
    --creation-time-after=: A filter that returns only AppImageConfigs created on or after the specified time.
    --creation-time-before=: A filter that returns only AppImageConfigs created on or before the specified time.
    --max-results=: The total number of items to return in the response.
    --modified-time-after=: A filter that returns only AppImageConfigs modified on or after the specified time.
    --modified-time-before=: A filter that returns only AppImageConfigs modified on or before the specified time.
    --name-contains=: A filter that returns only AppImageConfigs whose name contains the specified string.
    --next-token=: If the previous call to `ListImages` didn't return the full set of AppImageConfigs, the call returns a token for getting the next set of AppImageConfigs.
    --sort-by=: The property used to sort results.
    --sort-order=: The sort order.
completion:
    flag:
        sort-by:
            - CreationTime
            - LastModifiedTime
            - Name
        sort-order:
            - Ascending
            - Descending
documentation:
    command: Lists the AppImageConfigs in your account and their properties. The list can be filtered by creation time or modified time, and whether the AppImageConfig name contains a specified string.
    flag:
        creation-time-after: A filter that returns only AppImageConfigs created on or after the specified time.
        creation-time-before: A filter that returns only AppImageConfigs created on or before the specified time.
        max-results: The total number of items to return in the response. If the total number of items available is more than the value specified, a `NextToken` is provided in the response. To resume pagination, provide the `NextToken` value in the as part of a subsequent call. The default value is 10.
        modified-time-after: A filter that returns only AppImageConfigs modified on or after the specified time.
        modified-time-before: A filter that returns only AppImageConfigs modified on or before the specified time.
        name-contains: A filter that returns only AppImageConfigs whose name contains the specified string.
        next-token: If the previous call to `ListImages` didn't return the full set of AppImageConfigs, the call returns a token for getting the next set of AppImageConfigs.
        sort-by: The property used to sort results. The default value is `CreationTime`.
        sort-order: The sort order. The default value is `Descending`.
