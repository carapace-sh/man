name: delete-event-bus
description: Deletes the specified custom event bus or partner event bus.
flags:
    --name=!: The name of the event bus to delete.
documentation:
    command: Deletes the specified custom event bus or partner event bus. All rules associated with this event bus need to be deleted. You can't delete your account's default event bus.
    flag:
        name: The name of the event bus to delete.
