name: delete-dbcluster
description: The DeleteDBCluster action deletes a previously provisioned DB cluster.
flags:
    --dbcluster-identifier=!: The DB cluster identifier for the DB cluster to be deleted.
    --final-dbsnapshot-identifier=: The DB cluster snapshot identifier of the new DB cluster snapshot created when `SkipFinalSnapshot` is set to `false`.
    --no-skip-final-snapshot&: Determines whether a final DB cluster snapshot is created before the DB cluster is deleted.
    --skip-final-snapshot: Determines whether a final DB cluster snapshot is created before the DB cluster is deleted.
documentation:
    command: |-
        The DeleteDBCluster action deletes a previously provisioned DB cluster. When you delete a DB cluster, all automated backups for that DB cluster are deleted and can't be recovered. Manual DB cluster snapshots of the specified DB cluster are not deleted.

        Note that the DB Cluster cannot be deleted if deletion protection is enabled. To delete it, you must first set its `DeletionProtection` field to `False`.
    flag:
        dbcluster-identifier: |-
            The DB cluster identifier for the DB cluster to be deleted. This parameter isn't case-sensitive.

            Constraints:

            - Must match an existing DBClusterIdentifier.
        final-dbsnapshot-identifier: |-
            The DB cluster snapshot identifier of the new DB cluster snapshot created when `SkipFinalSnapshot` is set to `false`.

            Specifying this parameter and also setting the `SkipFinalShapshot` parameter to true results in an error.

            Constraints:

            - Must be 1 to 255 letters, numbers, or hyphens.
            - First character must be a letter
            - Cannot end with a hyphen or contain two consecutive hyphens
        skip-final-snapshot: |-
            Determines whether a final DB cluster snapshot is created before the DB cluster is deleted. If `true` is specified, no DB cluster snapshot is created. If `false` is specified, a DB cluster snapshot is created before the DB cluster is deleted.

            You must specify a `FinalDBSnapshotIdentifier` parameter if `SkipFinalSnapshot` is `false`.

            Default: `false`
