name: create-named-query
description: Creates a named query in the specified workgroup.
flags:
    --client-request-token=: A unique case-sensitive string used to ensure the request to create the query is idempotent (executes only once).
    --database=!: The database to which the query belongs.
    --description=: The query description.
    --name=!: The query name.
    --query-string=!: The contents of the query with all query statements.
    --work-group=: The name of the workgroup in which the named query is being created.
documentation:
    command: Creates a named query in the specified workgroup. Requires that you have access to the workgroup.
    flag:
        client-request-token: |-
            A unique case-sensitive string used to ensure the request to create the query is idempotent (executes only once). If another `CreateNamedQuery` request is received, the same response is returned and another query is not created. If a parameter has changed, for example, the `QueryString`, an error is returned.

            This token is listed as not required because Amazon Web Services SDKs (for example the Amazon Web Services SDK for Java) auto-generate the token for users. If you are not using the Amazon Web Services SDK or the Amazon Web Services CLI, you must provide this token or the action will fail.
        database: The database to which the query belongs.
        description: The query description.
        name: The query name.
        query-string: The contents of the query with all query statements.
        work-group: The name of the workgroup in which the named query is being created.
