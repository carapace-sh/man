name: list-stream-sessions
description: Gets a summary of current and previous streams for a specified channel in your account, in the AWS region where the API request is processed.
flags:
    --channel-arn=!: Channel ARN used to filter the list.
    --max-results=: Maximum number of streams to return.
    --next-token=: The first stream to retrieve.
documentation:
    command: Gets a summary of current and previous streams for a specified channel in your account, in the AWS region where the API request is processed.
    flag:
        channel-arn: Channel ARN used to filter the list.
        max-results: 'Maximum number of streams to return. Default: 100.'
        next-token: The first stream to retrieve. This is used for pagination; see the `nextToken` response field.
