name: list-resource-evaluations
description: Returns a list of proactive resource evaluations.
flags:
    --filters=: Returns a `ResourceEvaluationFilters` object.
    --limit=: The maximum number of evaluations returned on each page.
    --next-token=: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
documentation:
    command: Returns a list of proactive resource evaluations.
    flag:
        filters: Returns a `ResourceEvaluationFilters` object.
        limit: The maximum number of evaluations returned on each page. The default is 10. You cannot specify a number greater than 100. If you specify 0, Config uses the default.
        next-token: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
