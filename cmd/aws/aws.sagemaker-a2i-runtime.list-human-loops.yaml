name: list-human-loops
description: Returns information about human loops, given the specified parameters.
flags:
    --creation-time-after=: (Optional) The timestamp of the date when you want the human loops to begin in ISO 8601 format.
    --creation-time-before=: (Optional) The timestamp of the date before which you want the human loops to begin in ISO 8601 format.
    --flow-definition-arn=!: The Amazon Resource Name (ARN) of a flow definition.
    --max-results=: The total number of items to return.
    --next-token=: A token to display the next page of results.
    --sort-order=: Optional.
completion:
    flag:
        sort-order:
            - Ascending
            - Descending
documentation:
    command: Returns information about human loops, given the specified parameters. If a human loop was deleted, it will not be included.
    flag:
        creation-time-after: (Optional) The timestamp of the date when you want the human loops to begin in ISO 8601 format. For example, `2020-02-24`.
        creation-time-before: (Optional) The timestamp of the date before which you want the human loops to begin in ISO 8601 format. For example, `2020-02-24`.
        flow-definition-arn: The Amazon Resource Name (ARN) of a flow definition.
        max-results: The total number of items to return. If the total number of available items is more than the value specified in `MaxResults`, then a `NextToken` is returned in the output. You can use this token to display the next page of results.
        next-token: A token to display the next page of results.
        sort-order: 'Optional. The order for displaying results. Valid values: `Ascending` and `Descending`.'
