name: list-web-apps
description: Lists all web apps associated with your Amazon Web Services account for your current region.
flags:
    --max-results=: The maximum number of items to return.
    --next-token=: Returns the `NextToken` parameter in the output.
documentation:
    command: Lists all web apps associated with your Amazon Web Services account for your current region.
    flag:
        max-results: The maximum number of items to return.
        next-token: Returns the `NextToken` parameter in the output. You can then pass the `NextToken` parameter in a subsequent command to continue listing additional web apps.
