name: list-recommenders
description: Returns a list of recommenders in a given Domain dataset group.
flags:
    --dataset-group-arn=: The Amazon Resource Name (ARN) of the Domain dataset group to list the recommenders for.
    --max-results=: The maximum number of recommenders to return.
    --next-token=: A token returned from the previous call to `ListRecommenders` for getting the next set of recommenders (if they exist).
documentation:
    command: Returns a list of recommenders in a given Domain dataset group. When a Domain dataset group is not specified, all the recommenders associated with the account are listed. The response provides the properties for each recommender, including the Amazon Resource Name (ARN). For more information on recommenders, see [CreateRecommender](https://docs.aws.amazon.com/personalize/latest/dg/API_CreateRecommender.html).
    flag:
        dataset-group-arn: The Amazon Resource Name (ARN) of the Domain dataset group to list the recommenders for. When a Domain dataset group is not specified, all the recommenders associated with the account are listed.
        max-results: The maximum number of recommenders to return.
        next-token: A token returned from the previous call to `ListRecommenders` for getting the next set of recommenders (if they exist).
