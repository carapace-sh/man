name: update-partition
description: Updates a partition.
flags:
    --catalog-id=: The ID of the Data Catalog where the partition to be updated resides.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --database-name=!: The name of the catalog database in which the table in question resides.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --partition-input=!: The new partition object to update the partition to.
    --partition-value-list=!: List of partition key values that define the partition to update.
    --table-name=!: The name of the table in which the partition to be updated is located.
documentation:
    command: Updates a partition.
    flag:
        catalog-id: The ID of the Data Catalog where the partition to be updated resides. If none is provided, the Amazon Web Services account ID is used by default.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        database-name: The name of the catalog database in which the table in question resides.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        partition-input: |-
            The new partition object to update the partition to.

            The `Values` property can't be changed. If you want to change the partition key values for a partition, delete and recreate the partition.
        partition-value-list: List of partition key values that define the partition to update.
        table-name: The name of the table in which the partition to be updated is located.
