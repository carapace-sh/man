name: update
description: '*(ALPHA)*  Update a Bigtable memory layer.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --disable: Disable the memory layer for the cluster.
    --fixed-capacity=: Specify fixed capacity for memory layer as a key-value dictionary.
    --instance=: Bigtable instance for the cluster.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-disable&: Disable the memory layer for the cluster.
documentation:
    command: '*(ALPHA)*  Update a Bigtable memory layer.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        disable: Disable the memory layer for the cluster.
        fixed-capacity: |-
            Specify fixed capacity for memory layer as a key-value dictionary.
            +
            Keys can be:
            +
              *storage-size-gib*: The storage size of the memory layer in GiB.
            +
              *max-request-units-per-second*: The max request units per second that can be served by the memory layer. Once request units reach the configured max request units per second, reads will be throttled and fallback to the backing persistent data store.
        instance: |-
            Bigtable instance for the cluster.
            +
            To set the `instance` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-disable: Disable the memory layer for the cluster.
