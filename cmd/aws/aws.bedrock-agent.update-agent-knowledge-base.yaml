name: update-agent-knowledge-base
description: Updates the configuration for a knowledge base that has been associated with an agent.
flags:
    --agent-id=!: The unique identifier of the agent associated with the knowledge base that you want to update.
    --agent-version=!: The version of the agent associated with the knowledge base that you want to update.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: Specifies a new description for the knowledge base associated with an agent.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --knowledge-base-id=!: The unique identifier of the knowledge base that has been associated with an agent.
    --knowledge-base-state=: Specifies whether the agent uses the knowledge base or not when sending an [InvokeAgent](https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_InvokeAgent.html) request.
completion:
    flag:
        knowledge-base-state:
            - ENABLED
            - DISABLED
documentation:
    command: Updates the configuration for a knowledge base that has been associated with an agent.
    flag:
        agent-id: The unique identifier of the agent associated with the knowledge base that you want to update.
        agent-version: The version of the agent associated with the knowledge base that you want to update.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: Specifies a new description for the knowledge base associated with an agent.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        knowledge-base-id: The unique identifier of the knowledge base that has been associated with an agent.
        knowledge-base-state: Specifies whether the agent uses the knowledge base or not when sending an [InvokeAgent](https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_InvokeAgent.html) request.
