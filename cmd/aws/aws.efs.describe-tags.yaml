name: describe-tags
description: DEPRECATED - The `DescribeTags` action is deprecated and not maintained.
flags:
    --file-system-id=!: The ID of the file system whose tag set you want to retrieve.
    --marker=: (Optional) An opaque pagination token returned from a previous `DescribeTags` operation (String).
    --max-items=: (Optional) The maximum number of file system tags to return in the response.
documentation:
    command: |-
        DEPRECATED - The `DescribeTags` action is deprecated and not maintained. To view tags associated with EFS resources, use the `ListTagsForResource` API action.

        Returns the tags associated with a file system. The order of tags returned in the response of one `DescribeTags` call and the order of tags returned across the responses of a multiple-call iteration (when using pagination) is unspecified.

        This operation requires permissions for the `elasticfilesystem:DescribeTags` action.
    flag:
        file-system-id: The ID of the file system whose tag set you want to retrieve.
        marker: (Optional) An opaque pagination token returned from a previous `DescribeTags` operation (String). If present, it specifies to continue the list from where the previous call left off.
        max-items: (Optional) The maximum number of file system tags to return in the response. Currently, this number is automatically set to 100, and other values are ignored. The response is paginated at 100 per page if you have more than 100 tags.
