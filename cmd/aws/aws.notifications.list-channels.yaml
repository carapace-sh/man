name: list-channels
description: Returns a list of Channels for a `NotificationConfiguration`.
flags:
    --max-results=: The maximum number of results to be returned in this call.
    --next-token=: The start token for paginated calls.
    --notification-configuration-arn=!: The Amazon Resource Name (ARN) of the `NotificationConfiguration`.
documentation:
    command: Returns a list of Channels for a `NotificationConfiguration`.
    flag:
        max-results: The maximum number of results to be returned in this call. The default value is 20.
        next-token: The start token for paginated calls. Retrieved from the response of a previous ListNotificationEvents call. `NextToken` uses Base64 encoding.
        notification-configuration-arn: The Amazon Resource Name (ARN) of the `NotificationConfiguration`.
