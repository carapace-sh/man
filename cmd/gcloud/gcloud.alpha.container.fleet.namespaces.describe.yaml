name: describe
description: '*(ALPHA)*  *(REMOVED)*  Show fleet namespace info.'
hidden: true
documentation:
    command: |-
        *(ALPHA)*  *(REMOVED)*  Show fleet namespace info.

        This command has been removed as of version 447.0.0. Use `gcloud fleet scopes namespaces describe` instead.

        This command can fail for the following reasons:
        * The project specified does not exist.
        * The namespace specified does not exist in the project.
        * The caller does not have permission to access the project or namespace.

        ## EXAMPLES

        To print metadata for the namespace `NAMESPACE` in the active project,
        run:

          $ gcloud alpha container fleet namespaces describe NAMESPACE

        To print metadata for the namespace `NAMESPACE` in project `PROJECT_ID`,
        run:

          $ gcloud alpha container fleet namespaces describe NAMESPACE --project=PROJECT_ID
