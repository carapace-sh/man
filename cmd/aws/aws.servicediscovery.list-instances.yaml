name: list-instances
description: Lists summary information about the instances that you registered by using a specified service.
flags:
    --max-results=: The maximum number of instances that you want Cloud Map to return in the response to a `ListInstances` request.
    --next-token=: For the first `ListInstances` request, omit this value.
    --service-id=!: The ID or Amazon Resource Name (ARN) of the service that you want to list instances for.
documentation:
    command: Lists summary information about the instances that you registered by using a specified service.
    flag:
        max-results: The maximum number of instances that you want Cloud Map to return in the response to a `ListInstances` request. If you don't specify a value for `MaxResults`, Cloud Map returns up to 100 instances.
        next-token: |-
            For the first `ListInstances` request, omit this value.

            If more than `MaxResults` instances match the specified criteria, you can submit another `ListInstances` request to get the next group of results. Specify the value of `NextToken` from the previous response in the next request.
        service-id: The ID or Amazon Resource Name (ARN) of the service that you want to list instances for. For services created in a shared namespace, specify the service ARN. For more information about shared namespaces, see [Cross-account Cloud Map namespace sharing](https://docs.aws.amazon.com/cloud-map/latest/dg/sharing-namespaces.html) in the *Cloud Map Developer Guide*.
