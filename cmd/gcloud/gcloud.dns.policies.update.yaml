name: update
description: Update an existing Cloud DNS policy.
flags:
    --alternative-name-servers=: List of alternative name servers to forward to.
    --description=: A description of the policy.
    --enable-dns64-all-queries: Specifies whether to allow networks bound to this policy to use DNS64 for IPv6-only VM instances.
    --enable-inbound-forwarding: Specifies whether to allow networks bound to this policy to receive DNS queries sent by VMs or applications over VPN connections.
    --enable-logging: Specifies whether to enable query logging.
    --networks=: The comma separated list of network names to associate with the policy.
    --no-enable-dns64-all-queries&: Specifies whether to allow networks bound to this policy to use DNS64 for IPv6-only VM instances.
    --no-enable-inbound-forwarding&: Specifies whether to allow networks bound to this policy to receive DNS queries sent by VMs or applications over VPN connections.
    --no-enable-logging&: Specifies whether to enable query logging.
    --private-alternative-name-servers=: List of alternative name servers to forward to.
documentation:
    command: |-
        Update an existing Cloud DNS policy.

        ## EXAMPLES

        To change the description of a policy, run:

          $ gcloud dns policies update mypolicy --description="Hello, world!"
    flag:
        alternative-name-servers: List of alternative name servers to forward to. Non-RFC1918 addresses will forward to the target through the Internet.RFC1918 addresses will forward through the VPC.
        description: A description of the policy.
        enable-dns64-all-queries: Specifies whether to allow networks bound to this policy to use DNS64 for IPv6-only VM instances. Use *--enable-dns64-all-queries* to enable and *--no-enable-dns64-all-queries* to disable.
        enable-inbound-forwarding: Specifies whether to allow networks bound to this policy to receive DNS queries sent by VMs or applications over VPN connections. Defaults to False.
        enable-logging: Specifies whether to enable query logging. Defaults to False.
        networks: The comma separated list of network names to associate with the policy.
        no-enable-dns64-all-queries: Specifies whether to allow networks bound to this policy to use DNS64 for IPv6-only VM instances.
        no-enable-inbound-forwarding: Specifies whether to allow networks bound to this policy to receive DNS queries sent by VMs or applications over VPN connections. Defaults to False.
        no-enable-logging: Specifies whether to enable query logging. Defaults to False.
        private-alternative-name-servers: List of alternative name servers to forward to. All addresses specified for this parameter will be reached through the VPC.
