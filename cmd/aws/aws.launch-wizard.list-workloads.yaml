name: list-workloads
description: Lists the available workload names.
flags:
    --max-results=: The maximum number of items to return for this request.
    --next-token=: The token returned from a previous paginated request.
documentation:
    command: Lists the available workload names. You can use the [ListWorkloadDeploymentPatterns](https://docs.aws.amazon.com/launchwizard/latest/APIReference/API_ListWorkloadDeploymentPatterns.html) operation to discover the available deployment patterns for a given workload.
    flag:
        max-results: The maximum number of items to return for this request. To get the next page of items, make another request with the token returned in the output.
        next-token: The token returned from a previous paginated request. Pagination continues from the end of the items returned by the previous request.
