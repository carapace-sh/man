name: list-pipes
description: Get the pipes associated with this account.
flags:
    --current-state=: The state the pipe is in.
    --desired-state=: The state the pipe should be in.
    --limit=: The maximum number of pipes to include in the response.
    --name-prefix=: A value that will return a subset of the pipes associated with this account.
    --next-token=: If `nextToken` is returned, there are more results available.
    --source-prefix=: The prefix matching the pipe source.
    --target-prefix=: The prefix matching the pipe target.
completion:
    flag:
        current-state:
            - RUNNING
            - STOPPED
            - CREATING
            - UPDATING
            - DELETING
            - STARTING
            - STOPPING
            - CREATE_FAILED
            - UPDATE_FAILED
            - START_FAILED
            - STOP_FAILED
            - DELETE_FAILED
            - CREATE_ROLLBACK_FAILED
            - DELETE_ROLLBACK_FAILED
            - UPDATE_ROLLBACK_FAILED
        desired-state:
            - RUNNING
            - STOPPED
documentation:
    command: Get the pipes associated with this account. For more information about pipes, see [Amazon EventBridge Pipes](https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-pipes.html) in the Amazon EventBridge User Guide.
    flag:
        current-state: The state the pipe is in.
        desired-state: The state the pipe should be in.
        limit: The maximum number of pipes to include in the response.
        name-prefix: 'A value that will return a subset of the pipes associated with this account. For example, `"NamePrefix": "ABC"` will return all endpoints with "ABC" in the name.'
        next-token: If `nextToken` is returned, there are more results available. The value of `nextToken` is a unique pagination token for each page. Make the call again using the returned token to retrieve the next page. Keep all other arguments unchanged. Each pagination token expires after 24 hours. Using an expired pagination token will return an HTTP 400 InvalidToken error.
        source-prefix: The prefix matching the pipe source.
        target-prefix: The prefix matching the pipe target.
