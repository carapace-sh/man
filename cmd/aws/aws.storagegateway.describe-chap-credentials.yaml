name: describe-chap-credentials
description: Returns an array of Challenge-Handshake Authentication Protocol (CHAP) credentials information for a specified iSCSI target, one for each target-initiator pair.
flags:
    --target-arn=!: The Amazon Resource Name (ARN) of the iSCSI volume target.
documentation:
    command: Returns an array of Challenge-Handshake Authentication Protocol (CHAP) credentials information for a specified iSCSI target, one for each target-initiator pair. This operation is supported in the volume and tape gateway types.
    flag:
        target-arn: The Amazon Resource Name (ARN) of the iSCSI volume target. Use the [DescribeStorediSCSIVolumes]() operation to return to retrieve the TargetARN for specified VolumeARN.
