name: create-algorithm
description: Create a machine learning algorithm that you can use in SageMaker and list in the Amazon Web Services Marketplace.
flags:
    --algorithm-description=: A description of the algorithm.
    --algorithm-name=!: The name of the algorithm.
    --certify-for-marketplace: Whether to certify the algorithm so that it can be listed in Amazon Web Services Marketplace.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --inference-specification=: 'Specifies details about inference jobs that the algorithm runs, including the following:'
    --no-certify-for-marketplace: Whether to certify the algorithm so that it can be listed in Amazon Web Services Marketplace.
    --tags=: An array of key-value pairs.
    --training-specification=!: 'Specifies details about training jobs run by this algorithm, including the following:'
    --validation-specification=: Specifies configurations for one or more training jobs and that SageMaker runs to test the algorithm's training code and, optionally, one or more batch transform jobs that SageMaker runs to test the algorithm's inference code.
documentation:
    command: Create a machine learning algorithm that you can use in SageMaker and list in the Amazon Web Services Marketplace.
    flag:
        algorithm-description: A description of the algorithm.
        algorithm-name: The name of the algorithm.
        certify-for-marketplace: Whether to certify the algorithm so that it can be listed in Amazon Web Services Marketplace.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        inference-specification: |-
            Specifies details about inference jobs that the algorithm runs, including the following:

            - The Amazon ECR paths of containers that contain the inference code and model artifacts.
            - The instance types that the algorithm supports for transform jobs and real-time endpoints used for inference.
            - The input and output content formats that the algorithm supports for inference.
        tags: An array of key-value pairs. You can use tags to categorize your Amazon Web Services resources in different ways, for example, by purpose, owner, or environment. For more information, see [Tagging Amazon Web Services Resources](https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html).
        training-specification: |-
            Specifies details about training jobs run by this algorithm, including the following:

            - The Amazon ECR path of the container and the version digest of the algorithm.
            - The hyperparameters that the algorithm supports.
            - The instance types that the algorithm supports for training.
            - Whether the algorithm supports distributed training.
            - The metrics that the algorithm emits to Amazon CloudWatch.
            - Which metrics that the algorithm emits can be used as the objective metric for hyperparameter tuning jobs.
            - The input channels that the algorithm supports for training data. For example, an algorithm might support `train`, `validation`, and `test` channels.
        validation-specification: Specifies configurations for one or more training jobs and that SageMaker runs to test the algorithm's training code and, optionally, one or more batch transform jobs that SageMaker runs to test the algorithm's inference code.
