name: list-resources-for-web-acl
description: This is **AWS WAF Classic Regional** documentation.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --resource-type=: The type of resource to list, either an application load balancer or Amazon API Gateway.
    --web-acl-id=!: The unique identifier (ID) of the web ACL for which to list the associated resources.
