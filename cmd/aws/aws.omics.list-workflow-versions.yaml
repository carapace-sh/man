name: list-workflow-versions
description: Lists the workflow versions for the specified workflow.
flags:
    --max-results=: The maximum number of workflows to return in one page of results.
    --starting-token=: Specify the pagination token from a previous request to retrieve the next page of results.
    --type=: The workflow type.
    --workflow-id=!: The workflow's ID.
    --workflow-owner-id=: The 12-digit account ID of the workflow owner.
completion:
    flag:
        type:
            - PRIVATE
            - READY2RUN
documentation:
    command: Lists the workflow versions for the specified workflow. For more information, see [Workflow versioning in Amazon Web Services HealthOmics](https://docs.aws.amazon.com/omics/latest/dev/workflow-versions.html) in the *Amazon Web Services HealthOmics User Guide*.
    flag:
        max-results: The maximum number of workflows to return in one page of results.
        starting-token: Specify the pagination token from a previous request to retrieve the next page of results.
        type: The workflow type.
        workflow-id: The workflow's ID. The `workflowId` is not the UUID.
        workflow-owner-id: The 12-digit account ID of the workflow owner. The workflow owner ID can be retrieved using the `GetShare` API operation. If you are the workflow owner, you do not need to include this ID.
