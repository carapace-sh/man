name: set-iam-policy
description: '*(BETA)*  Set the IAM policy for a Cloud DNS managed-zone.'
flags:
    --policy-file=!: JSON or YAML file with the IAM policy
documentation:
    command: |-
        *(BETA)*  This command sets the IAM policy of the specified managed-zone.

        ## EXAMPLES

        To set the IAM policy of your managed-zone , run:

          $ gcloud beta dns managed-zones set-iam-policy my-zone --policy-file=policy.json
    flag:
        policy-file: JSON or YAML file with the IAM policy
