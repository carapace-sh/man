name: list-provisioned-capacity
description: This operation lists the provisioned capacity units for the specified AWS account.
flags:
    --account-id=!: The AWS account ID of the account that owns the vault.
documentation:
    command: This operation lists the provisioned capacity units for the specified AWS account.
    flag:
        account-id: The AWS account ID of the account that owns the vault. You can either specify an AWS account ID or optionally a single '-' (hyphen), in which case Amazon S3 Glacier uses the AWS account ID associated with the credentials used to sign the request. If you use an account ID, don't include any hyphens ('-') in the ID.
