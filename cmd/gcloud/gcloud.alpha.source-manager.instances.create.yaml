name: create
description: '*(ALPHA)*  Create a Secure Source Manager instance.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --ca-pool=: CA Pool path for private instance.
    --enable-workforce-identity-federation: Bool indicator for workforce identity federation instance.
    --is-private!: Bool indicator for private instance.
    --kms-key=: KMS key used to encrypt instance optionally.
    --max-wait=: Time to synchronously wait for the operation to complete, after which the operation continues asynchronously.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-enable-workforce-identity-federation&: Bool indicator for workforce identity federation instance.
    --psc-allowed-projects=: List of additional projects allowed to connect to the instance via private service connect.
    --region=: Secure Source Manager location.
documentation:
    command: |
        *(ALPHA)*  Create a Secure Source Manager instance.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        ca-pool: CA Pool path for private instance.
        enable-workforce-identity-federation: Bool indicator for workforce identity federation instance.
        is-private: Bool indicator for private instance.
        kms-key: KMS key used to encrypt instance optionally.
        max-wait: Time to synchronously wait for the operation to complete, after which the operation continues asynchronously. Ignored if `--no-async` isn't specified. See $ gcloud topic datetimes for information on time formats.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-enable-workforce-identity-federation: Bool indicator for workforce identity federation instance.
        psc-allowed-projects: List of additional projects allowed to connect to the instance via private service connect.
        region: |-
            Secure Source Manager location.
            +
            To set the `region` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
