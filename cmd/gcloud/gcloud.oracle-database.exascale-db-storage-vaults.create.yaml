name: create
description: Create exascaleDbStorageVaults.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --display-name=!: The display name for the ExascaleDbStorageVault.
    --exascale-db-storage-details-total-size-gbs=!: The total storage allocation for the ExascaleDbStorageVault, in gigabytes
    --gcp-oracle-zone=: The GCP Oracle zone where Oracle ExascaleDbStorageVault is hosted.
    --labels=: The labels or tags associated with the ExascaleDbStorageVault.
    --location=: The location id of the exascaleDbStorageVault resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --properties-additional-flash-cache-percent=: The size of additional flash cache in percentage of high capacity
    --properties-description=: The description of the ExascaleDbStorageVault.
    --request-id=: An optional request ID to identify requests.
documentation:
    command: Create an exascaleDbStorageVault
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        display-name: |-
            The display name for the ExascaleDbStorageVault. The name does not have to
            be unique within your project. The name must be 1-255 characters long and
            can only contain alphanumeric characters.
        exascale-db-storage-details-total-size-gbs: |-
            The total storage allocation for the ExascaleDbStorageVault, in gigabytes
            (GB).
        gcp-oracle-zone: |-
            The GCP Oracle zone where Oracle ExascaleDbStorageVault is hosted.
            Example: us-east4-b-r2.
            If not specified, the system will pick a zone based on availability.
        labels: |-
            The labels or tags associated with the ExascaleDbStorageVault.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: |-
            The location id of the exascaleDbStorageVault resource.
            +
            To set the `location` attribute:
            * provide the argument `exascale_db_storage_vault` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        properties-additional-flash-cache-percent: |-
            The size of additional flash cache in percentage of high capacity
            database storage.
        properties-description: The description of the ExascaleDbStorageVault.
        request-id: |-
            An optional request ID to identify requests. Specify a unique request ID
            so that if you must retry your request, the server will know to ignore
            the request if it has already been completed. The server will guarantee
            that for at least 60 minutes since the first request.
            +
            For example, consider a situation where you make an initial request and the
            request times out. If you make the request again with the same request
            ID, the server can check if original operation with the same request ID
            was received, and if so, will ignore the second request. This prevents
            clients from accidentally creating duplicate commitments.
            +
            The request ID must be a valid UUID with the exception that zero UUID is
            not supported (00000000-0000-0000-0000-000000000000).
