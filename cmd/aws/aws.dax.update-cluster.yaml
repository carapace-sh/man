name: update-cluster
description: Modifies the settings for a DAX cluster.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cluster-name=!: The name of the DAX cluster to be modified.
    --description=: A description of the changes being made to the cluster.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --notification-topic-arn=: The Amazon Resource Name (ARN) that identifies the topic.
    --notification-topic-status=: The current state of the topic.
    --parameter-group-name=: The name of a parameter group for this cluster.
    --preferred-maintenance-window=: A range of time when maintenance of DAX cluster software will be performed.
    --security-group-ids=:
        description: A list of user-specified security group IDs to be assigned to each node in the DAX cluster.
        nargs: -1
documentation:
    command: Modifies the settings for a DAX cluster. You can use this action to change one or more cluster configuration parameters by specifying the parameters and the new values.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cluster-name: The name of the DAX cluster to be modified.
        description: A description of the changes being made to the cluster.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        notification-topic-arn: The Amazon Resource Name (ARN) that identifies the topic.
        notification-topic-status: The current state of the topic. A value of “active” means that notifications will be sent to the topic. A value of “inactive” means that notifications will not be sent to the topic.
        parameter-group-name: The name of a parameter group for this cluster.
        preferred-maintenance-window: 'A range of time when maintenance of DAX cluster software will be performed. For example: `sun:01:00-sun:09:00`. Cluster maintenance normally takes less than 30 minutes, and is performed automatically within the maintenance window.'
        security-group-ids: A list of user-specified security group IDs to be assigned to each node in the DAX cluster. If this parameter is not specified, DAX assigns the default VPC security group to each node.
