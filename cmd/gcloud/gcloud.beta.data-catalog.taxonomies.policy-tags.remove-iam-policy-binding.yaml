name: remove-iam-policy-binding
description: '*(BETA)*  Remove an IAM policy binding from a Data Catalog policy tag.'
flags:
    --location=: Location of the policy tag.
    --member=!: The principal to remove the binding for.
    --role=!: The role to remove the principal from.
    --taxonomy=: Taxonomy of the policy tag.
documentation:
    command: '*(BETA)*  Remove an IAM policy binding from a Data Catalog policy tag.'
    flag:
        location: |-
            Location of the policy tag.
            +

            To set the `location` attribute:
            * provide the argument `policy_tag` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        member: |-
            The principal to remove the binding for. Should be of the form `user|group|serviceAccount:email` or
            `domain:domain`.
            +
            Examples: `user:test-user@gmail.com`, `group:admins@example.com`,
            `serviceAccount:test123@example.domain.com`, or
            `domain:example.domain.com`.
            +
            Deleted principals have an additional `deleted:` prefix and a `?uid=UID` suffix,
            where ``UID'' is a unique identifier for the principal. Example:
            `deleted:user:test-user@gmail.com?uid=123456789012345678901`.
            +
            Some resources also accept the following special values:
            * `allUsers` - Special identifier that represents anyone who is on the internet,
               with or without a Google account.
            * `allAuthenticatedUsers` - Special identifier that represents anyone who is
               authenticated with a Google account or a service account.
        role: The role to remove the principal from.
        taxonomy: |-
            Taxonomy of the policy tag.
            +

            To set the `taxonomy` attribute:
            * provide the argument `policy_tag` on the command line with a fully specified name;
            * provide the argument `--taxonomy` on the command line.
