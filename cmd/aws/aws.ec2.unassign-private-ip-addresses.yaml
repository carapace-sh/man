name: unassign-private-ip-addresses
description: Unassigns the specified secondary private IP addresses or IPv4 Prefix Delegation prefixes from a network interface.
flags:
    --ipv4-prefixes=: The IPv4 prefixes to unassign from the network interface.
    --network-interface-id=!: The ID of the network interface.
    --private-ip-addresses=: The secondary private IP addresses to unassign from the network interface.
documentation:
    command: Unassigns the specified secondary private IP addresses or IPv4 Prefix Delegation prefixes from a network interface.
    flag:
        ipv4-prefixes: The IPv4 prefixes to unassign from the network interface.
        network-interface-id: The ID of the network interface.
        private-ip-addresses: The secondary private IP addresses to unassign from the network interface. You can specify this option multiple times to unassign more than one IP address.
