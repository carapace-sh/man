name: describe
description: '*(ALPHA)*  Describe a Cloud NetApp Volume Snapshot.'
flags:
    --location=: The location of the snapshot.
    --volume=: ID of the volume or fully qualified identifier for the volume.
documentation:
    command: |
        *(ALPHA)*  Describe a Cloud NetApp Volume Snapshot.
    flag:
        location: |-
            The location of the snapshot.
            +
            To set the `location` attribute:
            * provide the argument `snapshot` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
        volume: |-
            ID of the volume or fully qualified identifier for the volume.
            +
            To set the `volume` attribute:
            * provide the argument `--volume` on the command line.
