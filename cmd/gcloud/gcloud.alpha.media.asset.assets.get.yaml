documentation:
    command: '*(ALPHA)*  Delete a new Media Asset asset.'
    flag:
        asset-type: |-
            Google Cloud Media Asset asset type.
            +
            To set the `asset_type` attribute:
            * provide the argument `asset` on the command line with a fully specified name;
            * provide the argument `--asset_type` on the command line.
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `asset` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `media_asset/location`.
        read-mask: Extra fields to be poplulated as part of the asset resource in the response.
