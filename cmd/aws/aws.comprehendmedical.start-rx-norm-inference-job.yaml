name: start-rx-norm-inference-job
description: Starts an asynchronous job to detect medication entities and link them to the RxNorm ontology.
flags:
    --client-request-token=: A unique identifier for the request.
    --data-access-role-arn=!: The Amazon Resource Name (ARN) of the AWS Identity and Access Management (IAM) role that grants Amazon Comprehend Medical read access to your input data.
    --input-data-config=!: Specifies the format and location of the input data for the job.
    --job-name=: The identifier of the job.
    --kmskey=: An AWS Key Management Service key to encrypt your output files.
    --language-code=!: The language of the input documents.
    --output-data-config=!: Specifies where to send the output files.
completion:
    flag:
        language-code:
            - en
documentation:
    command: Starts an asynchronous job to detect medication entities and link them to the RxNorm ontology. Use the `DescribeRxNormInferenceJob` operation to track the status of a job.
    flag:
        client-request-token: A unique identifier for the request. If you don't set the client request token, Amazon Comprehend Medical generates one.
        data-access-role-arn: The Amazon Resource Name (ARN) of the AWS Identity and Access Management (IAM) role that grants Amazon Comprehend Medical read access to your input data. For more information, see [Role-Based Permissions Required for Asynchronous Operations](https://docs.aws.amazon.com/comprehend/latest/dg/access-control-managing-permissions-med.html#auth-role-permissions-med).
        input-data-config: Specifies the format and location of the input data for the job.
        job-name: The identifier of the job.
        kmskey: An AWS Key Management Service key to encrypt your output files. If you do not specify a key, the files are written in plain text.
        language-code: The language of the input documents. All documents must be in the same language.
        output-data-config: Specifies where to send the output files.
