name: start-automated-reasoning-policy-build-workflow
description: Starts a new build workflow for an Automated Reasoning policy.
flags:
    --build-workflow-type=!: The type of build workflow to start (e.g., DOCUMENT\_INGESTION for processing new documents, POLICY\_REPAIR for fixing existing policies).
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=: A unique, case-sensitive identifier to ensure that the operation completes no more than once.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --policy-arn=!: The Amazon Resource Name (ARN) of the Automated Reasoning policy for which to start the build workflow.
    --source-content=!: The source content for the build workflow, such as documents to analyze or repair instructions for existing policies.
completion:
    flag:
        build-workflow-type:
            - INGEST_CONTENT
            - REFINE_POLICY
            - IMPORT_POLICY
documentation:
    command: Starts a new build workflow for an Automated Reasoning policy. This initiates the process of analyzing source documents and generating policy rules, variables, and types.
    flag:
        build-workflow-type: The type of build workflow to start (e.g., DOCUMENT\_INGESTION for processing new documents, POLICY\_REPAIR for fixing existing policies).
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: A unique, case-sensitive identifier to ensure that the operation completes no more than once. If this token matches a previous request, Amazon Bedrock ignores the request but doesn't return an error.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        policy-arn: The Amazon Resource Name (ARN) of the Automated Reasoning policy for which to start the build workflow.
        source-content: The source content for the build workflow, such as documents to analyze or repair instructions for existing policies.
