name: describe-intent
description: Returns metadata about an intent.
flags:
    --bot-id=!: The identifier of the bot associated with the intent.
    --bot-version=!: The version of the bot associated with the intent.
    --intent-id=!: The identifier of the intent to describe.
    --locale-id=!: The identifier of the language and locale of the intent to describe.
documentation:
    command: Returns metadata about an intent.
    flag:
        bot-id: The identifier of the bot associated with the intent.
        bot-version: The version of the bot associated with the intent.
        intent-id: The identifier of the intent to describe.
        locale-id: The identifier of the language and locale of the intent to describe. The string must match one of the supported locales. For more information, see [Supported languages](https://docs.aws.amazon.com/lexv2/latest/dg/how-languages.html).
