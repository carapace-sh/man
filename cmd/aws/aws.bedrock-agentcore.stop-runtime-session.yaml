name: stop-runtime-session
description: Stops a session that is running in an running AgentCore Runtime agent.
flags:
    --agent-runtime-arn=!: The ARN of the agent that contains the session that you want to stop.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Idempotent token used to identify the request.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --qualifier=: Optional qualifier to specify an agent alias, such as `prod`code&gt; or `dev`.
    --runtime-session-id=!: The ID of the session that you want to stop.
documentation:
    command: Stops a session that is running in an running AgentCore Runtime agent.
    flag:
        agent-runtime-arn: The ARN of the agent that contains the session that you want to stop.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Idempotent token used to identify the request. If you use the same token with multiple requests, the same response is returned. Use ClientToken to prevent the same request from being processed more than once.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        qualifier: Optional qualifier to specify an agent alias, such as `prod`code&gt; or `dev`. If you don't provide a value, the DEFAULT alias is used.
        runtime-session-id: The ID of the session that you want to stop.
