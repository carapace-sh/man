name: add-application-input
description: Adds a streaming source to your SQL-based Kinesis Data Analytics application.
flags:
    --application-name=!: The name of your existing application to which you want to add the streaming source.
    --current-application-version-id=!: The current version of your application.
    --input=!: The [Input]() to add.
documentation:
    command: |-
        Adds a streaming source to your SQL-based Kinesis Data Analytics application.

        You can add a streaming source when you create an application, or you can use this operation to add a streaming source after you create an application. For more information, see [CreateApplication]().

        Any configuration update, including adding a streaming source using this operation, results in a new version of the application. You can use the [DescribeApplication]() operation to find the current application version.
    flag:
        application-name: The name of your existing application to which you want to add the streaming source.
        current-application-version-id: The current version of your application. You must provide the `ApplicationVersionID` or the `ConditionalToken`.You can use the [DescribeApplication]() operation to find the current application version.
        input: The [Input]() to add.
