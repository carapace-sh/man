name: add-resource-policies
description: '*(BETA)*  Add resource policies to Compute Engine VM instances.'
flags:
    --resource-policies=!: A list of resource policy names to be added to the instance.
    --zone=: Zone of the instance to add resource policies to.
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute instances add-resource-policies* adds resource policies to Compute Engine
        virtual instances. These policies define time windows in which
        live migrations take place.

        ## EXAMPLES

        To add resource policy ``pol1'' to instance ``inst1'', run this:

          $ gcloud beta compute instances add-resource-policies inst1 --resource-policies=pol1

        For information on how to create resource policies, see:

          $ gcloud compute resource-policies create --help
    flag:
        resource-policies: A list of resource policy names to be added to the instance. The policies must exist in the same region as the instance.
        zone: |-
            Zone of the instance to add resource policies to. If not specified, you might be prompted to select a zone (interactive mode
            only). `gcloud` attempts to identify the appropriate zone by searching for
            resources in your currently active project. If the zone cannot be determined,
            `gcloud` prompts you for a selection with all available Google Cloud Platform
            zones.
            +
            To avoid prompting when this flag is omitted, the user can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
