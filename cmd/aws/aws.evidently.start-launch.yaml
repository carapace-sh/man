name: start-launch
description: Starts an existing launch.
flags:
    --launch=!: The name of the launch to start.
    --project=!: The name or ARN of the project that contains the launch to start.
documentation:
    command: Starts an existing launch. To create a launch, use [CreateLaunch](https://docs.aws.amazon.com/cloudwatchevidently/latest/APIReference/API_CreateLaunch.html).
    flag:
        launch: The name of the launch to start.
        project: The name or ARN of the project that contains the launch to start.
