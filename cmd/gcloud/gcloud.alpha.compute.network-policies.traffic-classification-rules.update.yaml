name: update
description: '*(ALPHA)*  Updates a Compute Engine network policy rule.'
flags:
    --action=: Action to take if the request matches the match condition.
    --description=: An optional, textual description for the rule.
    --dest-ip-ranges=: Destination IP ranges to match for this rule.
    --disabled: Use this flag to disable the rule.
    --dscp-mode=: When set to AUTO, the DSCP value will be picked automatically based on selected traffic class.
    --dscp-value=: Custom DSCP value from 0-63 range.
    --layer4-configs=: A list of destination protocols and ports to which the network policy rule will apply.
    --network-policy-region=: Region of the network policy to operate on.
    --network-policy=!: Network policy ID with which to update rule.
    --new-priority=: New priority for the rule to update.
    --no-disabled&: Use this flag to disable the rule.
    --priority=!: Priority of the rule to be updated.
    --src-ip-ranges=: CIDR IP address range.
    --target-secure-tags=: An optional, list of target secure tags with a name of the format tagValues/ or full namespaced name
    --target-service-accounts=: List of target service accounts for the rule.
    --traffic-class=: The traffic class that be applied to matching packet.
completion:
    flag:
        action:
            - apply_traffic_classification
        dscp-mode:
            - auto
            - custom
        traffic-class:
            - tc1
            - tc2
            - tc3
            - tc4
            - tc5
            - tc6
documentation:
    command: '*(ALPHA)*  *gcloud alpha compute network-policies traffic-classification-rules update* is used to update network policy rules.'
    flag:
        action: 'Action to take if the request matches the match condition. _ACTION_ must be (only one value is supported): *apply_traffic_classification*.'
        description: An optional, textual description for the rule.
        dest-ip-ranges: Destination IP ranges to match for this rule.
        disabled: Use this flag to disable the rule. Disabled rules will not affect traffic. Use *--disabled* to enable and *--no-disabled* to disable.
        dscp-mode: 'When set to AUTO, the DSCP value will be picked automatically based on selected traffic class. Otherwise, DSCP value must be specified. _DSCP_MODE_ must be one of: *auto*, *custom*.'
        dscp-value: Custom DSCP value from 0-63 range.
        layer4-configs: A list of destination protocols and ports to which the network policy rule will apply.
        network-policy: Network policy ID with which to update rule.
        network-policy-region: Region of the network policy to operate on. Overrides the default *compute/region* property value for this command invocation.
        new-priority: 'New priority for the rule to update. Valid priority range: [1, 2147482647].'
        no-disabled: Use this flag to disable the rule. Disabled rules will not affect traffic.
        priority: Priority of the rule to be updated. Valid in [1, 2147482647].
        src-ip-ranges: CIDR IP address range.
        target-secure-tags: An optional, list of target secure tags with a name of the format tagValues/ or full namespaced name
        target-service-accounts: List of target service accounts for the rule.
        traffic-class: 'The traffic class that be applied to matching packet. _TRAFFIC_CLASS_ must be one of: *tc1*, *tc2*, *tc3*, *tc4*, *tc5*, *tc6*.'
