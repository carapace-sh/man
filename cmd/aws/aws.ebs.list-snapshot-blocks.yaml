name: list-snapshot-blocks
description: Returns information about the blocks in an Amazon Elastic Block Store snapshot.
flags:
    --max-results=: The maximum number of blocks to be returned by the request.
    --next-token=: The token to request the next page of results.
    --snapshot-id=!: The ID of the snapshot from which to get block indexes and block tokens.
    --starting-block-index=: The block index from which the list should start.
documentation:
    command: |-
        Returns information about the blocks in an Amazon Elastic Block Store snapshot.

        You should always retry requests that receive server (`5xx`) error responses, and `ThrottlingException` and `RequestThrottledException` client error responses. For more information see [Error retries](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/error-retries.html) in the *Amazon Elastic Compute Cloud User Guide*.
    flag:
        max-results: |-
            The maximum number of blocks to be returned by the request.

            Even if additional blocks can be retrieved from the snapshot, the request can return less blocks than **MaxResults** or an empty array of blocks.

            To retrieve the next set of blocks from the snapshot, make another request with the returned **NextToken** value. The value of **NextToken** is `null` when there are no more blocks to return.
        next-token: |-
            The token to request the next page of results.

            If you specify **NextToken**, then **StartingBlockIndex** is ignored.
        snapshot-id: The ID of the snapshot from which to get block indexes and block tokens.
        starting-block-index: |-
            The block index from which the list should start. The list in the response will start from this block index or the next valid block index in the snapshot.

            If you specify **NextToken**, then **StartingBlockIndex** is ignored.
