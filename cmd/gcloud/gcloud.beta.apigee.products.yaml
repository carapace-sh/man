name: products
description: '*(BETA)*  Manage Apigee API products.'
documentation:
    command: |
        *(BETA)*  Manage Apigee API products.

        `gcloud beta apigee products` manipulates API products. These are collections of
        deployed API resources, combined with quota settings and metadata,
        used to deliver customized and productized API bundles to the
        developer community.
