name: get-vocabulary-filter
description: Provides information about the specified custom vocabulary filter.
flags:
    --vocabulary-filter-name=!: The name of the custom vocabulary filter you want information about.
documentation:
    command: |-
        Provides information about the specified custom vocabulary filter.

        To get a list of your custom vocabulary filters, use the operation.
    flag:
        vocabulary-filter-name: The name of the custom vocabulary filter you want information about. Custom vocabulary filter names are case sensitive.
