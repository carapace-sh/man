name: list-segments
description: Returns a list of audience segments that you have created in your account in this Region.
flags:
    --max-results=: The maximum number of results to include in the response.
    --next-token=: The token to use when requesting the next set of results.
documentation:
    command: Returns a list of audience segments that you have created in your account in this Region.
    flag:
        max-results: The maximum number of results to include in the response. If you omit this, the default of 50 is used.
        next-token: The token to use when requesting the next set of results. You received this token from a previous `ListSegments` operation.
