name: delete-schema
description: Deletes a schema.
flags:
    --schema-arn=!: The Amazon Resource Name (ARN) of the schema to delete.
documentation:
    command: Deletes a schema. Before deleting a schema, you must delete all datasets referencing the schema. For more information on schemas, see [CreateSchema](https://docs.aws.amazon.com/personalize/latest/dg/API_CreateSchema.html).
    flag:
        schema-arn: The Amazon Resource Name (ARN) of the schema to delete.
