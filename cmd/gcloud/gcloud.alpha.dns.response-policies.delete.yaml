name: delete
description: '*(ALPHA)*  Deletes a Cloud DNS response policy.'
flags:
    --location=: Specifies the desired service location the request is sent to.
documentation:
    command: |-
        *(ALPHA)*  This command deletes a new Cloud DNS response policy.

        ## EXAMPLES

        To delete a global response policy (default), run:

          $ gcloud alpha dns response-policies delete myresponsepolicy
    flag:
        location: Specifies the desired service location the request is sent to. Defaults to Cloud DNS global service. Use --location=global if you want to target the global service.
