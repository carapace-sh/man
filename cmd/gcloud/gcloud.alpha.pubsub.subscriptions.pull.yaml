name: pull
description: '*(ALPHA)*  Pulls one or more Cloud Pub/Sub messages from a subscription.'
flags:
    --auto-ack: Automatically ACK every message pulled from this subscription.
    --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
    --limit=: Maximum number of resources to list.
    --max-messages=: (DEPRECATED) The maximum number of messages that Cloud Pub/Sub can return in this response.
    --no-auto-ack&: Automatically ACK every message pulled from this subscription.
    --no-return-immediately&: If this flag is set, the system responds immediately with any messages readily available in memory buffers.
    --no-uri&: Print a list of resource URIs instead of the default output, and change the
    --no-wait&: (DEPRECATED) Wait (for a bounded amount of time) for new messages from the subscription, if there are none.
    --page-size=: Some services group resource list output into pages.
    --return-immediately: If this flag is set, the system responds immediately with any messages readily available in memory buffers.
    --sort-by=: Comma-separated list of resource field key names to sort by.
    --uri: Print a list of resource URIs instead of the default output, and change the
    --wait: (DEPRECATED) Wait (for a bounded amount of time) for new messages from the subscription, if there are none.
documentation:
    command: |-
        *(ALPHA)*  Returns one or more messages from the specified Cloud Pub/Sub
        subscription, if there are any messages enqueued.

        By default, this command returns only one message from the
        subscription. Use the `--limit` flag to specify the max messages to
        return.

        Please note that this command is not guaranteed to return all the
        messages in your backlog or the maximum specified in the --limit
        argument.  Receiving fewer messages than available occasionally
        is normal.
    flag:
        auto-ack: Automatically ACK every message pulled from this subscription. Use --no-auto-ack to disable this flag.
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        max-messages: |-
            (DEPRECATED) The maximum number of messages that Cloud Pub/Sub can return in this response.
            +
            `--max-messages` is deprecated. Please use --limit instead.
        no-auto-ack: Automatically ACK every message pulled from this subscription. Use --no-auto-ack to disable this flag.
        no-return-immediately: If this flag is set, the system responds immediately with any messages readily available in memory buffers. If no messages are available in the buffers, returns an empty list of messages as response, even if having messages in the backlog. Do not set this flag as it adversely impacts the performance of pull. Use --no-return-immediately to disable this flag.
        no-uri: |
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
        no-wait: |-
            (DEPRECATED) Wait (for a bounded amount of time) for new messages from the subscription, if there are none.
            +
            `--wait` is deprecated. This flag is non-operational, as the wait behavior is now the default.
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is determined by the
            service if it supports paging, otherwise it is *unlimited* (no paging).
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        return-immediately: If this flag is set, the system responds immediately with any messages readily available in memory buffers. If no messages are available in the buffers, returns an empty list of messages as response, even if having messages in the backlog. Do not set this flag as it adversely impacts the performance of pull. Use --no-return-immediately to disable this flag.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
        uri: |-
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
        wait: |-
            (DEPRECATED) Wait (for a bounded amount of time) for new messages from the subscription, if there are none.
            +
            `--wait` is deprecated. This flag is non-operational, as the wait behavior is now the default. Enabled by default, use *--no-wait* to disable.
