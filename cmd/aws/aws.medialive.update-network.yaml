name: update-network
description: Change the settings for a Network.
flags:
    --ip-pools=: Include this parameter only if you want to change the pool of IP addresses in the network.
    --name=: Include this parameter only if you want to change the name of the Network.
    --network-id=!: The ID of the network
    --routes=: Include this parameter only if you want to change or add routes in the Network.
documentation:
    command: Change the settings for a Network.
    flag:
        ip-pools: Include this parameter only if you want to change the pool of IP addresses in the network. An array of IpPoolCreateRequests that identify a collection of IP addresses in this network that you want to reserve for use in MediaLive Anywhere. MediaLive Anywhere uses these IP addresses for Push inputs (in both Bridge and NAT networks) and for output destinations (only in Bridge networks). Each IpPoolUpdateRequest specifies one CIDR block.
        name: Include this parameter only if you want to change the name of the Network. Specify a name that is unique in the AWS account. Names are case-sensitive.
        network-id: The ID of the network
        routes: Include this parameter only if you want to change or add routes in the Network. An array of Routes that MediaLive Anywhere needs to know about in order to route encoding traffic.
