name: update
description: Update a Compute Engine partner provider interconnect attachment.
hidden: true
flags:
    --bandwidth=: Provisioned capacity of the attachment.
    --description=: Human-readable plain-text description of attachment.
    --partner-interconnect-name=: Plain text name of the Interconnect this attachment is connected to,
    --partner-name=: Plain text name of the Partner providing this attachment.
    --partner-portal-url=: URL of the Partner's portal for this Attachment.
    --region=: Region of the interconnect attachment to patch.
completion:
    flag:
        bandwidth:
            - 100g
            - 100m
            - 10g
            - 1g
            - 200m
            - 20g
            - 2g
            - 300m
            - 400m
            - 500m
            - 50g
            - 50m
            - 5g
documentation:
    command: |-
        *gcloud compute interconnects attachments provider update* is used to update partner provider interconnect attachments. An
        interconnect attachment binds the underlying connectivity of an Interconnect
        to a path into and out of the customer's cloud network.
    flag:
        bandwidth: |-
            Provisioned capacity of the attachment. _BANDWIDTH_ must be one of:
            +
            *50m*::: 50 Mbit/s
            *100m*::: 100 Mbit/s
            *200m*::: 200 Mbit/s
            *300m*::: 300 Mbit/s
            *400m*::: 400 Mbit/s
            *500m*::: 500 Mbit/s
            *1g*::: 1 Gbit/s
            *2g*::: 2 Gbit/s
            *5g*::: 5 Gbit/s
            *10g*::: 10 Gbit/s
            *20g*::: 20 Gbit/s
            *50g*::: 50 Gbit/s
            *100g*::: 100 Gbit/s
            :::
            +
        description: Human-readable plain-text description of attachment.
        partner-interconnect-name: |-
            Plain text name of the Interconnect this attachment is connected to,
            as displayed in the Partner's portal. For instance "Chicago 1".
        partner-name: |-
            Plain text name of the Partner providing this attachment. This value
            may be validated to match approved Partner values.
        partner-portal-url: |-
            URL of the Partner's portal for this Attachment. The Partner may wish
            to customize this to be a deep-link to the specific resource on the
            Partner portal. This value may be validated to match approved Partner
            values.
        region: |-
            Region of the interconnect attachment to patch. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
