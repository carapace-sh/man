name: create
description: '*(ALPHA)*  Create a Pub/Sub Lite topic.'
flags:
    --location=: ID of the location or fully qualified identifier for the location.
    --message-retention-period=: How long a published message is retained.
    --partitions=!: Number of partitions in the topic.
    --per-partition-bytes=!: Provisioned storage, in bytes, per partition.
    --per-partition-publish-mib=: Topic partition publish throughput capacity in MiB/s.
    --per-partition-subscribe-mib=: Topic partition subscribe throughput capacity in MiB/s.
    --throughput-reservation=: Reservation ID to use for topic throughput.
    --zone=&: (DEPRECATED) ID of the location of the Pub/Sub Lite resource.
documentation:
    command: '*(ALPHA)*  Create a Pub/Sub Lite topic.'
    flag:
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line;
            * provide the argument `--zone` on the command line.
        message-retention-period: |-
            How long a published message is retained. If unset, messages will only be
            dropped to make space for new ones once the `per-partition-bytes` limit is
            reached.
            A valid example value of this flag would be `message-retention-period="2w"`.
        partitions: Number of partitions in the topic.
        per-partition-bytes: |-
            Provisioned storage, in bytes, per partition. If the number of bytes
            stored in any of the topic's partitions exceeds this value, older
            messages will be dropped to make room for newer ones, regardless of the
            value of `message-retention-period`.
            A valid example value of this flag would be `per-partition-bytes=30GiB`.
        per-partition-publish-mib: Topic partition publish throughput capacity in MiB/s. Must be between 4 and 16.
        per-partition-subscribe-mib: Topic partition subscribe throughput capacity in MiB/s. Must be between 4 and 32.
        throughput-reservation: Reservation ID to use for topic throughput.
        zone: |
            (DEPRECATED) ID of the location of the Pub/Sub Lite resource.
            +
            zone is deprecated and will be removed in an upcoming release. Please use --location instead.
