name: get-comments-for-pull-request
description: Returns comments made on a pull request.
flags:
    --after-commit-id=: The full commit ID of the commit in the source branch that was the tip of the branch at the time the comment was made.
    --before-commit-id=: The full commit ID of the commit in the destination branch that was the tip of the branch at the time the pull request was created.
    --max-results=: A non-zero, non-negative integer used to limit the number of returned results.
    --next-token=: An enumeration token that, when provided in a request, returns the next batch of the results.
    --pull-request-id=!: The system-generated ID of the pull request.
    --repository-name=: The name of the repository that contains the pull request.
documentation:
    command: |-
        Returns comments made on a pull request.

        Reaction counts might include numbers from user identities who were deleted after the reaction was made. For a count of reactions from active identities, use GetCommentReactions.
    flag:
        after-commit-id: 'The full commit ID of the commit in the source branch that was the tip of the branch at the time the comment was made. Requirement is conditional: `afterCommitId` must be specified when `repositoryName` is included.'
        before-commit-id: 'The full commit ID of the commit in the destination branch that was the tip of the branch at the time the pull request was created. Requirement is conditional: `beforeCommitId` must be specified when `repositoryName` is included.'
        max-results: A non-zero, non-negative integer used to limit the number of returned results. The default is 100 comments. You can return up to 500 comments with a single request.
        next-token: An enumeration token that, when provided in a request, returns the next batch of the results.
        pull-request-id: The system-generated ID of the pull request. To get this ID, use [ListPullRequests]().
        repository-name: 'The name of the repository that contains the pull request. Requirement is conditional: `repositoryName` must be specified when `beforeCommitId` and `afterCommitId` are included.'
