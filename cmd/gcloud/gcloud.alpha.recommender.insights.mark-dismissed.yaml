name: mark-dismissed
description: '*(ALPHA)*  Mark an insight''s state as DISMISSED.'
flags:
    --billing-account=: The Google Cloud Platform billing account ID to use for this invocation.
    --etag=!: Etag of a insight
    --folder=: The Google Cloud Platform folder ID to use for this invocation.
    --insight-type=!: Insight Type of the insights
    --location=!: Location
    --organization=: The Google Cloud Platform organization ID to use for this invocation.
    --recommendation-change-type=: '_Recommendation change type_ must be one of: *dismiss*, *leave_unchanged*.'
completion:
    flag:
        recommendation-change-type:
            - dismiss
            - leave_unchanged
documentation:
    command: |-
        *(ALPHA)*  Mark an insight's state as DISMISSED. Can be applied to insights in ACTIVE
        state. The following are currently supported: project, billing_account,
        folder, and organization.
    flag:
        billing-account: The Google Cloud Platform billing account ID to use for this invocation.
        etag: Etag of a insight
        folder: The Google Cloud Platform folder ID to use for this invocation.
        insight-type: Insight Type of the insights
        location: Location
        organization: The Google Cloud Platform organization ID to use for this invocation.
        recommendation-change-type: '_Recommendation change type_ must be one of: *dismiss*, *leave_unchanged*.'
