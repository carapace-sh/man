name: create-channel
description: Creates a channel for CloudTrail to ingest events from a partner or external source.
flags:
    --destinations=!: One or more event data stores to which events arriving through a channel will be logged.
    --name=!: The name of the channel.
    --source=!: The name of the partner or external event source.
    --tags=: ""
documentation:
    command: Creates a channel for CloudTrail to ingest events from a partner or external source. After you create a channel, a CloudTrail Lake event data store can log events from the partner or source that you specify.
    flag:
        destinations: One or more event data stores to which events arriving through a channel will be logged.
        name: The name of the channel.
        source: |-
            The name of the partner or external event source. You cannot change this name after you create the channel. A maximum of one channel is allowed per source.

            A source can be either `Custom` for all valid non-Amazon Web Services events, or the name of a partner event source. For information about the source names for available partners, see [Additional information about integration partners](https://docs.aws.amazon.com/awscloudtrail/latest/userguide/query-event-data-store-integration.html#cloudtrail-lake-partner-information) in the CloudTrail User Guide.
        tags: ""
