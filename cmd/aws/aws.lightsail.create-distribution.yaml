name: create-distribution
description: Creates an Amazon Lightsail content delivery network (CDN) distribution.
flags:
    --bundle-id=!: The bundle ID to use for the distribution.
    --cache-behavior-settings=: An object that describes the cache behavior settings for the distribution.
    --cache-behaviors=: An array of objects that describe the per-path cache behavior for the distribution.
    --certificate-name=: The name of the SSL/TLS certificate that you want to attach to the distribution.
    --default-cache-behavior=!: An object that describes the default cache behavior for the distribution.
    --distribution-name=!: The name for the distribution.
    --ip-address-type=: The IP address type for the distribution.
    --origin=!: An object that describes the origin resource for the distribution, such as a Lightsail instance, bucket, or load balancer.
    --tags=: The tag keys and optional values to add to the distribution during create.
    --viewer-minimum-tls-protocol-version=: The minimum TLS protocol version for the SSL/TLS certificate.
completion:
    flag:
        ip-address-type:
            - dualstack
            - ipv4
            - ipv6
        viewer-minimum-tls-protocol-version:
            - TLSv1.1_2016
            - TLSv1.2_2018
            - TLSv1.2_2019
            - TLSv1.2_2021
documentation:
    command: |-
        Creates an Amazon Lightsail content delivery network (CDN) distribution.

        A distribution is a globally distributed network of caching servers that improve the performance of your website or web application hosted on a Lightsail instance. For more information, see [Content delivery networks in Amazon Lightsail](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-content-delivery-network-distributions).
    flag:
        bundle-id: |-
            The bundle ID to use for the distribution.

            A distribution bundle describes the specifications of your distribution, such as the monthly cost and monthly network transfer quota.

            Use the `GetDistributionBundles` action to get a list of distribution bundle IDs that you can specify.
        cache-behavior-settings: An object that describes the cache behavior settings for the distribution.
        cache-behaviors: An array of objects that describe the per-path cache behavior for the distribution.
        certificate-name: |-
            The name of the SSL/TLS certificate that you want to attach to the distribution.

            Use the [GetCertificates](https://docs.aws.amazon.com/lightsail/2016-11-28/api-reference/API_GetCertificates.html) action to get a list of certificate names that you can specify.
        default-cache-behavior: An object that describes the default cache behavior for the distribution.
        distribution-name: The name for the distribution.
        ip-address-type: |-
            The IP address type for the distribution.

            The possible values are `ipv4` for IPv4 only, and `dualstack` for IPv4 and IPv6.

            The default value is `dualstack`.
        origin: |-
            An object that describes the origin resource for the distribution, such as a Lightsail instance, bucket, or load balancer.

            The distribution pulls, caches, and serves content from the origin.
        tags: |-
            The tag keys and optional values to add to the distribution during create.

            Use the `TagResource` action to tag a resource after it's created.
        viewer-minimum-tls-protocol-version: The minimum TLS protocol version for the SSL/TLS certificate.
