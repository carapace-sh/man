name: create-worker-block
description: The `CreateWorkerBlock` operation allows you to prevent a Worker from working on your HITs.
flags:
    --reason=!: A message explaining the reason for blocking the Worker.
    --worker-id=!: The ID of the Worker to block.
documentation:
    command: The `CreateWorkerBlock` operation allows you to prevent a Worker from working on your HITs. For example, you can block a Worker who is producing poor quality work. You can block up to 100,000 Workers.
    flag:
        reason: A message explaining the reason for blocking the Worker. This parameter enables you to keep track of your Workers. The Worker does not see this message.
        worker-id: The ID of the Worker to block.
