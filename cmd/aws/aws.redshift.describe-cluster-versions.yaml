name: describe-cluster-versions
description: Returns descriptions of the available Amazon Redshift cluster versions.
flags:
    --cluster-parameter-group-family=: The name of a specific cluster parameter group family to return details for.
    --cluster-version=: The specific cluster version to return.
    --marker=: An optional parameter that specifies the starting point to return a set of response records.
    --max-records=: The maximum number of response records to return in each call.
documentation:
    command: Returns descriptions of the available Amazon Redshift cluster versions. You can call this operation even before creating any clusters to learn more about the Amazon Redshift versions. For more information about managing clusters, go to [Amazon Redshift Clusters](https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-clusters.html) in the *Amazon Redshift Cluster Management Guide*.
    flag:
        cluster-parameter-group-family: |-
            The name of a specific cluster parameter group family to return details for.

            Constraints:

            - Must be 1 to 255 alphanumeric characters
            - First character must be a letter
            - Cannot end with a hyphen or contain two consecutive hyphens
        cluster-version: |-
            The specific cluster version to return.

            Example: `1.0`
        marker: An optional parameter that specifies the starting point to return a set of response records. When the results of a [DescribeClusterVersions]() request exceed the value specified in `MaxRecords`, Amazon Web Services returns a value in the `Marker` field of the response. You can retrieve the next set of response records by providing the returned marker value in the `Marker` parameter and retrying the request.
        max-records: |-
            The maximum number of response records to return in each call. If the number of remaining response records exceeds the specified `MaxRecords` value, a value is returned in a `marker` field of the response. You can retrieve the next set of records by retrying the command with the returned marker value.

            Default: `100`

            Constraints: minimum 20, maximum 100.
