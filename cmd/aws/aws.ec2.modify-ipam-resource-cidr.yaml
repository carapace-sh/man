name: modify-ipam-resource-cidr
description: Modify a resource CIDR.
flags:
    --current-ipam-scope-id=!: The ID of the current scope that the resource CIDR is in.
    --destination-ipam-scope-id=: The ID of the scope you want to transfer the resource CIDR to.
    --dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --monitored!: Determines if the resource is monitored by IPAM.
    --no-dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --no-monitored!: Determines if the resource is monitored by IPAM.
    --resource-cidr=!: The CIDR of the resource you want to modify.
    --resource-id=!: The ID of the resource you want to modify.
    --resource-region=!: The Amazon Web Services Region of the resource you want to modify.
documentation:
    command: |-
        Modify a resource CIDR. You can use this action to transfer resource CIDRs between scopes and ignore resource CIDRs that you do not want to manage. If set to false, the resource will not be tracked for overlap, it cannot be auto-imported into a pool, and it will be removed from any pool it has an allocation in.

        For more information, see [Move resource CIDRs between scopes](https://docs.aws.amazon.com/vpc/latest/ipam/move-resource-ipam.html) and [Change the monitoring state of resource CIDRs](https://docs.aws.amazon.com/vpc/latest/ipam/change-monitoring-state-ipam.html) in the *Amazon VPC IPAM User Guide*.
    flag:
        current-ipam-scope-id: The ID of the current scope that the resource CIDR is in.
        destination-ipam-scope-id: The ID of the scope you want to transfer the resource CIDR to.
        dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        monitored: Determines if the resource is monitored by IPAM. If a resource is monitored, the resource is discovered by IPAM and you can view details about the resource’s CIDR.
        resource-cidr: The CIDR of the resource you want to modify.
        resource-id: The ID of the resource you want to modify.
        resource-region: The Amazon Web Services Region of the resource you want to modify.
