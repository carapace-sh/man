name: export
description: '*(BETA)*  Export a Compute Engine virtual machine instance''s configuration to a file.'
flags:
    --destination=: Path to a YAML file where the configuration will be exported.
    --zone=: The name of the Google Compute Engine zone.
documentation:
    command: |
        *(BETA)*  Export a Compute Engine virtual machine instance's configuration to a file.
    flag:
        destination: |-
            Path to a YAML file where the configuration will be exported.
            The exported data will not contain any output-only fields.
            Alternatively, you may omit this flag to write to standard output.
            For a schema describing the export/import format, see
            $CLOUDSDKROOT/lib/googlecloudsdk/schemas/...
        zone: |-
            The name of the Google Compute Engine zone.
            +
            To set the `zone` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line;
            * set the property `compute/zone`.
