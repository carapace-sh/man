documentation:
    command: '*(ALPHA)*  Create a new DbSystem.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        data-collection-options-is-diagnostics-events-enabled: Indicates whether to enable data collection for diagnostics.
        data-collection-options-is-incident-logs-enabled: Indicates whether to enable incident logs and trace collection.
        database-admin-password: The password for the default ADMIN user.
        database-character-set: The character set for the database. The default is AL32UTF8.
        database-db-home-name: The name of the DbHome resource associated with the Database.
        database-db-name: |-
            The database name. The name must begin with an alphabetic character and can
            contain a maximum of eight alphanumeric characters. Special characters are
            not permitted.
        database-db-unique-name: The DB_UNIQUE_NAME of the Oracle Database being backed up.
        database-id: The database ID of the Database.
        database-name: |-
            Identifier. The name of the Database resource in the following format:
            projects/{project}/locations/{region}/databases/{database}
        database-ncharacter-set: The national character set for the database. The default is AL16UTF16.
        database-tde-wallet-password: The TDE wallet password for the database.
        db-backup-config-auto-enabled: If set to true, enables automatic backups on the database.
        db-backup-config-auto-full-day: |-
            The day of the week on which the full backup should be performed on the
            database. If no value is provided, it will default to Sunday. _DB_BACKUP_CONFIG_AUTO_FULL_DAY_ must be one of:
            +
            *friday*::: Friday
            *monday*::: Monday
            *saturday*::: Saturday
            *sunday*::: Sunday
            *thursday*::: Thursday
            *tuesday*::: Tuesday
            *wednesday*::: Wednesday
            :::
            +
        db-backup-config-auto-full-window: |-
            The window in which the full backup should be performed on the database.
            If no value is provided, the default is anytime. _DB_BACKUP_CONFIG_AUTO_FULL_WINDOW_ must be (only one value is supported):
            +
            :::
            +
        db-backup-config-auto-incremental-window: |-
            The window in which the incremental backup should be performed on the
            database. If no value is provided, the default is anytime except the auto
            full backup day. _DB_BACKUP_CONFIG_AUTO_INCREMENTAL_WINDOW_ must be (only one value is supported):
            +
            :::
            +
        db-backup-config-deletion-policy: |-
            This defines when the backups will be deleted after Database termination. _DB_BACKUP_CONFIG_DELETION_POLICY_ must be (only one value is supported):
            +
            :::
            +
        db-backup-config-destination-details: |-
            Details of the database backup destinations.
            +
            *type*:::
            The type of the database backup destination.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --db-backup-config-destination-details=type=string --db-backup-config-destination-details=type=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --db-backup-config-destination-details='[{"type": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --db-backup-config-destination-details=path_to_file.(yaml|json)
            +
            ```
        db-backup-config-retention-period-days: |-
            The number of days an automatic backup is retained before being
            automatically deleted. This value determines the earliest point in time to
            which a database can be restored. Min: 1, Max: 60.
        db-home-display-name: |-
            The display name for the Database Home. The name does not have to
            be unique within your project.
        db-home-is-unified-auditing-enabled: Whether unified auditing is enabled for the Database Home.
        db-home-version: |-
            A valid Oracle Database version. For a list of supported versions, use the
            ListDbVersions operation.
        db-system-options-storage-management: |-
            The storage option used in DB system. _DB_SYSTEM_OPTIONS_STORAGE_MANAGEMENT_ must be (only one value is supported):
            +
            :::
            +
        display-name: |-
            The display name for the System db. The name does not have to
            be unique within your project.
        gcp-oracle-zone: |-
            The GCP Oracle zone where Oracle DbSystem is hosted.
            Example: us-east4-b-r2.
            If not specified, the system will pick a zone based on availability.
        labels: |-
            The labels or tags associated with the DbSystem.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: For resources [db_system, odb-network, odb-subnet], provides fallback value for resource location attribute. When the resource's full URI path is not provided, location will fallback to this flag value.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-data-collection-options-is-diagnostics-events-enabled: Indicates whether to enable data collection for diagnostics.
        no-data-collection-options-is-incident-logs-enabled: Indicates whether to enable incident logs and trace collection.
        no-db-backup-config-auto-enabled: If set to true, enables automatic backups on the database.
        no-db-home-is-unified-auditing-enabled: Whether unified auditing is enabled for the Database Home.
        odb-network: For resources [odb-network, odb-subnet], provides fallback value for resource odb-network attribute. When the resource's full URI path is not provided, odb-network will fallback to this flag value.
        odb-subnet: |-
            ID of the odbSubnet or fully qualified identifier for the odbSubnet.
            +
            To set the `odb-subnet` attribute:
            * provide the argument `--odb-subnet` on the command line.
        properties-compute-count: The number of CPU cores to enable for the DbSystem.
        properties-compute-model: |-
            The compute model of the DbSystem. _PROPERTIES_COMPUTE_MODEL_ must be (only one value is supported):
            +
            :::
            +
        properties-data-storage-size-gb: The data storage size in GB that is currently available to DbSystems.
        properties-database-edition: |-
            The database edition of the DbSystem. _PROPERTIES_DATABASE_EDITION_ must be (only one value is supported):
            +
            :::
            +
        properties-db-version: The Oracle Database version.
        properties-domain: The host domain name of the DbSystem.
        properties-hostname-prefix: Prefix for DB System host names.
        properties-initial-data-storage-size-gb: The initial data storage size in GB.
        properties-license-model: |-
            The license model of the DbSystem. _PROPERTIES_LICENSE_MODEL_ must be (only one value is supported):
            +
            :::
            +
        properties-memory-size-gb: The memory size in GB.
        properties-node-count: The number of nodes in the DbSystem.
        properties-private-ip: The private IP address of the DbSystem.
        properties-reco-storage-size-gb: The reco/redo storage size in GB.
        properties-shape: Shape of DB System.
        properties-ssh-public-keys: SSH public keys to be stored with the DbSystem.
        request-id: |-
            An optional request ID to identify requests. Specify a unique request ID
            so that if you must retry your request, the server will know to ignore
            the request if it has already been completed. The server will guarantee
            that for at least 60 minutes since the first request.
            +
            For example, consider a situation where you make an initial request and the
            request times out. If you make the request again with the same request
            ID, the server can check if original operation with the same request ID
            was received, and if so, will ignore the second request. This prevents
            clients from accidentally creating duplicate commitments.
            +
            The request ID must be a valid UUID with the exception that zero UUID is
            not supported (00000000-0000-0000-0000-000000000000).
        time-zone-id: IANA Time Zone Database time zone. For example "America/New_York".
        time-zone-version: IANA Time Zone Database version number. For example "2019a".
