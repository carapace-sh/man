name: create-container
description: Creates a storage container to hold objects.
flags:
    --container-name=!: The name for the container.
    --tags=: An array of key:value pairs that you define.
documentation:
    command: Creates a storage container to hold objects. A container is similar to a bucket in the Amazon S3 service.
    flag:
        container-name: The name for the container. The name must be from 1 to 255 characters. Container names must be unique to your AWS account within a specific region. As an example, you could create a container named `movies` in every region, as long as you don’t have an existing container with that name.
        tags: An array of key:value pairs that you define. These values can be anything that you want. Typically, the tag key represents a category (such as "environment") and the tag value represents a specific value within that category (such as "test," "development," or "production"). You can add up to 50 tags to each container. For more information about tagging, including naming and usage conventions, see [Tagging Resources in MediaStore](https://docs.aws.amazon.com/mediastore/latest/ug/tagging.html).
