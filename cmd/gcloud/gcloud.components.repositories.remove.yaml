name: remove
description: Remove a registered Trusted Test component repository.
flags:
    --all: Remove all registered repositories.
    --architecture-override=&: THIS ARGUMENT NEEDS HELP TEXT.
    --no-all&: Remove all registered repositories.
    --operating-system-override=&: THIS ARGUMENT NEEDS HELP TEXT.
    --sdk-root-override=&: THIS ARGUMENT NEEDS HELP TEXT.
    --snapshot-url-override=&: THIS ARGUMENT NEEDS HELP TEXT.
documentation:
    command: |
        Remove a registered Trusted Tester component repository from the list
        of repositories used by the component manager.  After removing a
        repository, you can run:
          $ gcloud components update
        to revert back to the standard version of any components that were
        installed from that repository.
    flag:
        all: Remove all registered repositories.
        architecture-override: THIS ARGUMENT NEEDS HELP TEXT.
        no-all: Remove all registered repositories.
        operating-system-override: THIS ARGUMENT NEEDS HELP TEXT.
        sdk-root-override: THIS ARGUMENT NEEDS HELP TEXT.
        snapshot-url-override: THIS ARGUMENT NEEDS HELP TEXT.
