name: disassociate-tracker-consumer
description: Removes the association between a tracker resource and a geofence collection.
flags:
    --consumer-arn=!: The Amazon Resource Name (ARN) for the geofence collection to be disassociated from the tracker resource.
    --tracker-name=!: The name of the tracker resource to be dissociated from the consumer.
documentation:
    command: |-
        Removes the association between a tracker resource and a geofence collection.

        Once you unlink a tracker resource from a geofence collection, the tracker positions will no longer be automatically evaluated against geofences.
    flag:
        consumer-arn: |-
            The Amazon Resource Name (ARN) for the geofence collection to be disassociated from the tracker resource. Used when you need to specify a resource across all Amazon Web Services.

            - Format example: `arn:aws:geo:region:account-id:geofence-collection/ExampleGeofenceCollectionConsumer`
        tracker-name: The name of the tracker resource to be dissociated from the consumer.
