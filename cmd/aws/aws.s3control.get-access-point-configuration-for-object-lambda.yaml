name: get-access-point-configuration-for-object-lambda
description: This operation is not supported by directory buckets.
flags:
    --account-id=!: The account ID for the account that owns the specified Object Lambda Access Point.
    --name=!: The name of the Object Lambda Access Point you want to return the configuration for.
documentation:
    command: |-
        This operation is not supported by directory buckets.

        Returns configuration for an Object Lambda Access Point.

        The following actions are related to `GetAccessPointConfigurationForObjectLambda`:

        - [PutAccessPointConfigurationForObjectLambda](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_PutAccessPointConfigurationForObjectLambda.html)

        You must URL encode any signed header values that contain spaces. For example, if your header value is `my file.txt`, containing two spaces after `my`, you must URL encode this value to `my%20%20file.txt`.
    flag:
        account-id: The account ID for the account that owns the specified Object Lambda Access Point.
        name: The name of the Object Lambda Access Point you want to return the configuration for.
