name: destroy
description: '*(ALPHA)*  Schedule a version to be destroyed.'
flags:
    --key=: The containing key.
    --keyring=: Key ring of the key.
    --location=: Location of the keyring.
documentation:
    command: |-
        *(ALPHA)*  Schedules the given version for destruction in 24 hours.

        After that time period passes it is automatically destroyed. Once
        destroyed, the key material is removed but the version number can
        not be reused.

        Only versions which are Enabled or Disabled can be Scheduled
        for destruction.

        ## EXAMPLES

        The following command schedules version 9 of key `frodo` within
        keyring `fellowship` and location `us-east1` for destruction:

          $ gcloud alpha kms keys versions destroy 9 --location=us-east1 --keyring=fellowship --key=frodo
    flag:
        key: The containing key.
        keyring: Key ring of the key.
        location: Location of the keyring.
