name: disable-control
description: This API call turns off a control.
flags:
    --control-identifier=: The ARN of the control.
    --enabled-control-identifier=: The ARN of the enabled control to be disabled, which uniquely identifies the control instance on the target organizational unit.
    --target-identifier=: The ARN of the organizational unit.
documentation:
    command: This API call turns off a control. It starts an asynchronous operation that deletes Amazon Web Services resources on the specified organizational unit and the accounts it contains. The resources will vary according to the control that you specify. For usage examples, see the [*Controls Reference Guide*](https://docs.aws.amazon.com/controltower/latest/controlreference/control-api-examples-short.html) .
    flag:
        control-identifier: The ARN of the control. Only **Strongly recommended** and **Elective** controls are permitted, with the exception of the **Region deny** control. For information on how to find the `controlIdentifier`, see [the overview page](https://docs.aws.amazon.com/controltower/latest/APIReference/Welcome.html).
        enabled-control-identifier: The ARN of the enabled control to be disabled, which uniquely identifies the control instance on the target organizational unit.
        target-identifier: The ARN of the organizational unit. For information on how to find the `targetIdentifier`, see [the overview page](https://docs.aws.amazon.com/controltower/latest/APIReference/Welcome.html).
