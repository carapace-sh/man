name: start-iap-tunnel
description: '*(ALPHA)*  Starts an IAP tunnel to a Cloud Run instance.'
hidden: true
flags:
    --container=: name of a specific container to SSH into.
    --deployment-name=!: The name of the deployment to connect to.
    --iap-tunnel-url-override=&: Allows for overriding the connection endpoint for integration testing.
    --instance=: ID of a specific instance to SSH into.
    --project-id=!: The project id of the project that the deployment is in.
    --project-number=!: The project number of the project that the deployment is in.
    --region=: Region in which the resource can be found.
    --workload-type=!: The type of the workload.
documentation:
    command: |
        *(ALPHA)*  Starts a tunnel to Cloud Identity-Aware Proxy for TCP forwarding through which
        another process can SSH into a Cloud Run instance. This command is only to be used by
        other gcloud commands (gcloud run ssh), and should not be used directly.
    flag:
        container: name of a specific container to SSH into.
        deployment-name: The name of the deployment to connect to.
        iap-tunnel-url-override: Allows for overriding the connection endpoint for integration testing.
        instance: ID of a specific instance to SSH into.
        project-id: The project id of the project that the deployment is in.
        project-number: The project number of the project that the deployment is in.
        region: Region in which the resource can be found. Alternatively, set the property [run/region].
        workload-type: The type of the workload. One of service, job, or worker-pool.
