name: get-configuration
description: (Deprecated) Retrieves the latest deployed configuration.
flags:
    --application=!: The application to get.
    --client-configuration-version=: The configuration version returned in the most recent [GetConfiguration]() response.
    --client-id=!: The clientId parameter in the following command is a unique, user-specified ID to identify the client for the configuration.
    --configuration=!: The configuration to get.
    --environment=!: The environment to get.
completion:
    positional:
        - - $files
documentation:
    command: |-
        (Deprecated) Retrieves the latest deployed configuration.

        Note the following important information.

        - This API action is deprecated. Calls to receive configuration data should use the [StartConfigurationSession](https://docs.aws.amazon.com/appconfig/2019-10-09/APIReference/API_appconfigdata_StartConfigurationSession.html) and [GetLatestConfiguration](https://docs.aws.amazon.com/appconfig/2019-10-09/APIReference/API_appconfigdata_GetLatestConfiguration.html) APIs instead.
        - [GetConfiguration]() is a priced call. For more information, see [Pricing](https://aws.amazon.com/systems-manager/pricing/).
    flag:
        application: The application to get. Specify either the application name or the application ID.
        client-configuration-version: |-
            The configuration version returned in the most recent [GetConfiguration]() response.

            AppConfig uses the value of the `ClientConfigurationVersion` parameter to identify the configuration version on your clients. If you don’t send `ClientConfigurationVersion` with each call to [GetConfiguration](), your clients receive the current configuration. You are charged each time your clients receive a configuration.

            To avoid excess charges, we recommend you use the [StartConfigurationSession](https://docs.aws.amazon.com/appconfig/2019-10-09/APIReference/StartConfigurationSession.html) and [GetLatestConfiguration](https://docs.aws.amazon.com/appconfig/2019-10-09/APIReference/GetLatestConfiguration.html) APIs, which track the client configuration version on your behalf. If you choose to continue using [GetConfiguration](), we recommend that you include the `ClientConfigurationVersion` value with every call to [GetConfiguration](). The value to use for `ClientConfigurationVersion` comes from the `ConfigurationVersion` attribute returned by [GetConfiguration]() when there is new or updated data, and should be saved for subsequent calls to [GetConfiguration]().

            For more information about working with configurations, see [Retrieving feature flags and configuration data in AppConfig](http://docs.aws.amazon.com/appconfig/latest/userguide/retrieving-feature-flags.html) in the *AppConfig User Guide*.
        client-id: The clientId parameter in the following command is a unique, user-specified ID to identify the client for the configuration. This ID enables AppConfig to deploy the configuration in intervals, as defined in the deployment strategy.
        configuration: The configuration to get. Specify either the configuration name or the configuration ID.
        environment: The environment to get. Specify either the environment name or the environment ID.
