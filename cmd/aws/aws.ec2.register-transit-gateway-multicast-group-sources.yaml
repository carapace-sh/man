name: register-transit-gateway-multicast-group-sources
description: Registers sources (network interfaces) with the specified transit gateway multicast group.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --group-ip-address=: The IP address assigned to the transit gateway multicast group.
    --network-interface-ids=!: The group sources' network interface IDs to register with the transit gateway multicast group.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --transit-gateway-multicast-domain-id=!: The ID of the transit gateway multicast domain.
documentation:
    command: |-
        Registers sources (network interfaces) with the specified transit gateway multicast group.

        A multicast source is a network interface attached to a supported instance that sends multicast traffic. For more information about supported instances, see [Multicast on transit gateways](https://docs.aws.amazon.com/vpc/latest/tgw/tgw-multicast-overview.html) in the *Amazon Web Services Transit Gateways Guide*.

        After you add the source, use [SearchTransitGatewayMulticastGroups](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_SearchTransitGatewayMulticastGroups.html) to verify that the source was added to the multicast group.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        group-ip-address: The IP address assigned to the transit gateway multicast group.
        network-interface-ids: The group sources' network interface IDs to register with the transit gateway multicast group.
        transit-gateway-multicast-domain-id: The ID of the transit gateway multicast domain.
