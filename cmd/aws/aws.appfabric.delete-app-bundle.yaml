name: delete-app-bundle
description: Deletes an app bundle.
flags:
    --app-bundle-identifier=!: The ID or Amazon Resource Name (ARN) of the app bundle that needs to be deleted.
documentation:
    command: Deletes an app bundle. You must delete all associated app authorizations before you can delete an app bundle.
    flag:
        app-bundle-identifier: The ID or Amazon Resource Name (ARN) of the app bundle that needs to be deleted.
