name: update
description: '*(BETA)*  Update a Managed Service for Apache Kafka connector.'
flags:
    --config-file=: The path to the JSON or YAML file containing the configuration that are overridden
    --configs=: Configuration for the connector that are overridden from the connector defaults.
    --connect-cluster=: The connect cluster name.
    --location=: ID of the location of the Managed Service for Apache Kafka resource.
    --task-restart-max-backoff=!: The maximum amount of time to wait before retrying a failed task in seconds.
    --task-restart-min-backoff=!: The minimum amount of time to wait before retrying a failed task in seconds.
documentation:
    command: |
        *(BETA)*  Update a Managed Service for Apache Kafka connector.
    flag:
        config-file: |-
            The path to the JSON or YAML file containing the configuration that are overridden
            from the connector defaults. This also supports inline JSON or YAML. Sets `config_file` value.
            +
            :::
            *Input Example:*
            +
            ```
            +
            --config-file=string
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --config-file=path_to_file.(yaml|json)
            +
            ```
        configs: |-
            Configuration for the connector that are overridden from the connector defaults.
            The key of the map is a Kafka topic property name, for example:
            `cleanup.policy=compact`,`compression.type=producer`.
        connect-cluster: |-
            The connect cluster name.
            +

            To set the `connect-cluster` attribute:
            * provide the argument `connector` on the command line with a fully specified name;
            * provide the argument `--connect-cluster` on the command line.
        location: |-
            ID of the location of the Managed Service for Apache Kafka resource. See
            https://cloud.google.com/managed-service-for-apache-kafka/docs/locations for a list of supported
            locations.
            +

            To set the `location` attribute:
            * provide the argument `connector` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        task-restart-max-backoff: |-
            The maximum amount of time to wait before retrying a failed task in seconds.
            This sets an upper bound for the backoff delay. The default value is 1800s (30 minutes).
            See $ gcloud topic datetimes for information on duration formats.
        task-restart-min-backoff: |-
            The minimum amount of time to wait before retrying a failed task in seconds.
            This sets a lower bound for the backoff delay. The default value is 60s.
            See $ gcloud topic datetimes for information on duration formats.
