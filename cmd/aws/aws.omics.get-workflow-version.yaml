name: get-workflow-version
description: Gets information about a workflow version.
flags:
    --export=: The export format for the workflow.
    --type=: The workflow's type.
    --version-name=!: The workflow version name.
    --workflow-id=!: The workflow's ID.
    --workflow-owner-id=: The 12-digit account ID of the workflow owner.
completion:
    flag:
        type:
            - PRIVATE
            - READY2RUN
documentation:
    command: Gets information about a workflow version. For more information, see [Workflow versioning in Amazon Web Services HealthOmics](https://docs.aws.amazon.com/omics/latest/dev/workflow-versions.html) in the *Amazon Web Services HealthOmics User Guide*.
    flag:
        export: The export format for the workflow.
        type: The workflow's type.
        version-name: The workflow version name.
        workflow-id: The workflow's ID. The `workflowId` is not the UUID.
        workflow-owner-id: The 12-digit account ID of the workflow owner. The workflow owner ID can be retrieved using the `GetShare` API operation. If you are the workflow owner, you do not need to include this ID.
