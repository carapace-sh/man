name: tag-resource
description: Associates tags with an OpenSearch Serverless resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource.
    --tags=!: A list of tags (key-value pairs) to add to the resource.
documentation:
    command: Associates tags with an OpenSearch Serverless resource. For more information, see [Tagging Amazon OpenSearch Serverless collections](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/tag-collection.html).
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource. The resource must be active (not in the `DELETING` state), and must be owned by the account ID included in the request.
        tags: A list of tags (key-value pairs) to add to the resource. All tag keys in the request must be unique.
