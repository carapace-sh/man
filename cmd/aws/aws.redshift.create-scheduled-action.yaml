name: create-scheduled-action
description: Creates a scheduled action.
flags:
    --enable=: If true, the schedule is enabled.
    --end-time=: The end time in UTC of the scheduled action.
    --iam-role=!: The IAM role to assume to run the target action.
    --schedule=!: The schedule in `at( )` or `cron( )` format.
    --scheduled-action-description=: The description of the scheduled action.
    --scheduled-action-name=!: The name of the scheduled action.
    --start-time=: The start time in UTC of the scheduled action.
    --target-action=!: A JSON format string of the Amazon Redshift API operation with input parameters.
documentation:
    command: Creates a scheduled action. A scheduled action contains a schedule and an Amazon Redshift API action. For example, you can create a schedule of when to run the `ResizeCluster` API operation.
    flag:
        enable: If true, the schedule is enabled. If false, the scheduled action does not trigger. For more information about `state` of the scheduled action, see [ScheduledAction]().
        end-time: The end time in UTC of the scheduled action. After this time, the scheduled action does not trigger. For more information about this parameter, see [ScheduledAction]().
        iam-role: The IAM role to assume to run the target action. For more information about this parameter, see [ScheduledAction]().
        schedule: The schedule in `at( )` or `cron( )` format. For more information about this parameter, see [ScheduledAction]().
        scheduled-action-description: The description of the scheduled action.
        scheduled-action-name: The name of the scheduled action. The name must be unique within an account. For more information about this parameter, see [ScheduledAction]().
        start-time: The start time in UTC of the scheduled action. Before this time, the scheduled action does not trigger. For more information about this parameter, see [ScheduledAction]().
        target-action: A JSON format string of the Amazon Redshift API operation with input parameters. For more information about this parameter, see [ScheduledAction]().
