name: provision-ipam-pool-cidr
description: Provision a CIDR to an IPAM pool.
flags:
    --cidr-authorization-context=: A signed document that proves that you are authorized to bring a specified IP address range to Amazon using BYOIP.
    --cidr=: The CIDR you want to assign to the IPAM pool.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --ipam-external-resource-verification-token-id=: Verification token ID.
    --ipam-pool-id=!: The ID of the IPAM pool to which you want to assign a CIDR.
    --netmask-length=: The netmask length of the CIDR you'd like to provision to a pool.
    --no-dry-run&: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --verification-method=: The method for verifying control of a public IP address range.
completion:
    flag:
        verification-method:
            - remarks-x509
            - dns-token
documentation:
    command: |-
        Provision a CIDR to an IPAM pool. You can use this action to provision new CIDRs to a top-level pool or to transfer a CIDR from a top-level pool to a pool within it.

        For more information, see [Provision CIDRs to pools](https://docs.aws.amazon.com/vpc/latest/ipam/prov-cidr-ipam.html) in the *Amazon VPC IPAM User Guide*.
    flag:
        cidr: The CIDR you want to assign to the IPAM pool. Either "NetmaskLength" or "Cidr" is required. This value will be null if you specify "NetmaskLength" and will be filled in during the provisioning process.
        cidr-authorization-context: A signed document that proves that you are authorized to bring a specified IP address range to Amazon using BYOIP. This option only applies to IPv4 and IPv6 pools in the public scope.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/ec2/latest/devguide/ec2-api-idempotency.html).
        dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        ipam-external-resource-verification-token-id: Verification token ID. This option only applies to IPv4 and IPv6 pools in the public scope.
        ipam-pool-id: The ID of the IPAM pool to which you want to assign a CIDR.
        netmask-length: The netmask length of the CIDR you'd like to provision to a pool. Can be used for provisioning Amazon-provided IPv6 CIDRs to top-level pools and for provisioning CIDRs to pools with source pools. Cannot be used to provision BYOIP CIDRs to top-level pools. Either "NetmaskLength" or "Cidr" is required.
        verification-method: The method for verifying control of a public IP address range. Defaults to `remarks-x509` if not specified. This option only applies to IPv4 and IPv6 pools in the public scope.
