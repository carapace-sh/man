name: delete-security-profile
description: Deletes a Device Defender security profile.
flags:
    --expected-version=: The expected version of the security profile.
    --security-profile-name=!: The name of the security profile to be deleted.
documentation:
    command: |-
        Deletes a Device Defender security profile.

        Requires permission to access the [DeleteSecurityProfile](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        expected-version: The expected version of the security profile. A new version is generated whenever the security profile is updated. If you specify a value that is different from the actual version, a `VersionConflictException` is thrown.
        security-profile-name: The name of the security profile to be deleted.
