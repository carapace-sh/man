name: deploy
description: '*(ALPHA)*  Deploy a Google Cloud Function locally.'
flags:
    --build-env-vars-file=: Path to a local YAML file with definitions for all build environment variables.
    --builder=: Name of the builder to use for pack, e.g. `gcr.io/serverless-runtimes/google-22-full/builder/go`.
    --clear-build-env-vars: Remove all build environment variables.
    --clear-env-vars: Remove all environment variables.
    --entry-point=: Name of a Google Cloud Function (as defined in source code) that will
    --env-vars-file=: Path to a local YAML file with definitions for all environment variables.
    --gen2&: If enabled, this command will use Cloud Functions (Second generation).
    --ignore-file=: Override the .gcloudignore file in the source directory and use the specified file instead.
    --no-clear-build-env-vars&: Remove all build environment variables.
    --no-clear-env-vars&: Remove all environment variables.
    --no-gen2&: If enabled, this command will use Cloud Functions (Second generation).
    --port=: Port for the deployment to run on.
    --remove-build-env-vars=: List of build environment variables to be removed.
    --remove-env-vars=: List of environment variables to be removed.
    --runtime=: Runtime in which to run the function.
    --set-build-env-vars=: List of key-value pairs to set as build environment variables.
    --set-env-vars=: List of key-value pairs to set as environment variables.
    --source=: Location of source code to deploy.
    --update-build-env-vars=: List of key-value pairs to set as build environment variables.
    --update-env-vars=: List of key-value pairs to set as environment variables.
documentation:
    command: |
        *(ALPHA)*  `gcloud alpha functions local deploy` Deploy a Google Cloud Function locally.
    flag:
        build-env-vars-file: Path to a local YAML file with definitions for all build environment variables. All existing build environment variables will be removed before the new build environment variables are added.
        builder: Name of the builder to use for pack, e.g. `gcr.io/serverless-runtimes/google-22-full/builder/go`.
        clear-build-env-vars: Remove all build environment variables.
        clear-env-vars: Remove all environment variables.
        entry-point: |-
            Name of a Google Cloud Function (as defined in source code) that will
            be executed. Defaults to the resource name suffix (ID of the function), if
             not specified.
        env-vars-file: Path to a local YAML file with definitions for all environment variables. All existing environment variables will be removed before the new environment variables are added.
        gen2: If enabled, this command will use Cloud Functions (Second generation). If disabled with `--no-gen2`, Cloud Functions (First generation) will be used. If not specified, the value of this flag will be taken from the `functions/gen2` configuration property. If the `functions/gen2` configuration property is not set, defaults to looking up the given function and using its generation.
        ignore-file: Override the .gcloudignore file in the source directory and use the specified file instead. By default, the source directory is your current directory. Note that it could be changed by the --source flag, in which case your .gcloudignore file will be searched in the overridden directory.  For example, `--ignore-file=.mygcloudignore` combined with `--source=./mydir` would point to `./mydir/.mygcloudignore`
        no-clear-build-env-vars: Remove all build environment variables.
        no-clear-env-vars: Remove all environment variables.
        no-gen2: If enabled, this command will use Cloud Functions (Second generation). If disabled with `--no-gen2`, Cloud Functions (First generation) will be used. If not specified, the value of this flag will be taken from the `functions/gen2` configuration property. If the `functions/gen2` configuration property is not set, defaults to looking up the given function and using its generation.
        port: Port for the deployment to run on. The default port is 8080 for new local deployments.
        remove-build-env-vars: List of build environment variables to be removed.
        remove-env-vars: List of environment variables to be removed.
        runtime: |-
            Runtime in which to run the function.
            +
            Required when deploying a new function; optional when updating
            an existing function.
            +
            For a list of available runtimes, run `gcloud functions runtimes list`.
        set-build-env-vars: List of key-value pairs to set as build environment variables. All existing build environment variables will be removed first.
        set-env-vars: List of key-value pairs to set as environment variables. All existing environment variables will be removed first.
        source: |-
            Location of source code to deploy.
            +
            Location of the source can be one of the following three options:
            +
            * Source code in Google Cloud Storage (must be a `.zip` archive),
            * Reference to source repository or,
            * Local filesystem path (root directory of function source).
            +
            Note that, depending on your runtime type, Cloud Functions will look
            for files with specific names for deployable functions. For Node.js,
            these filenames are `index.js` or `function.js`. For Python, this is
            `main.py`.
            +
            If you do not specify the `--source` flag:
            +
            * The current directory will be used for new function deployments.
            * If the function was previously deployed using a local filesystem path,
            then the function's source code will be updated using the current
            directory.
            * If the function was previously deployed using a Google Cloud Storage
            location or a source repository, then the function's source code will not
            be updated.
            +
            The value of the flag will be interpreted as a Cloud Storage location, if
            it starts with `gs://`.
            +
            The value will be interpreted as a reference to a source repository, if it
            starts with `https://`.
            +
            Otherwise, it will be interpreted as the local filesystem path. When
            deploying source from the local filesystem, this command skips files
            specified in the `.gcloudignore` file (see `gcloud topic gcloudignore` for
            more information). If the `.gcloudignore` file doesn't exist, the command
            will try to create it.
            +
            The minimal source repository URL is:
            `https://source.developers.google.com/projects/${PROJECT}/repos/${REPO}`
            +
            By using the URL above, sources from the root directory of the
            repository on the revision tagged `master` will be used.
            +
            If you want to deploy from a revision different from `master`, append one
            of the following three sources to the URL:
            +
            * `/revisions/${REVISION}`,
            * `/moveable-aliases/${MOVEABLE_ALIAS}`,
            * `/fixed-aliases/${FIXED_ALIAS}`.
            +
            If you'd like to deploy sources from a directory different from the root,
            you must specify a revision, a moveable alias, or a fixed alias, as above,
            and append `/paths/${PATH_TO_SOURCES_DIRECTORY}` to the URL.
            +
            Overall, the URL should match the following regular expression:
            +
            ```
            ^https://source\.developers\.google\.com/projects/
            (?<accountId>[^/]+)/repos/(?<repoName>[^/]+)
            (((/revisions/(?<commit>[^/]+))|(/moveable-aliases/(?<branch>[^/]+))|
            (/fixed-aliases/(?<tag>[^/]+)))(/paths/(?<path>.*))?)?$
            ```
            +
            An example of a validly formatted source repository URL is:
            +
            ```
            https://source.developers.google.com/projects/123456789/repos/testrepo/
            moveable-aliases/alternate-branch/paths/path-to=source
            ```
        update-build-env-vars: List of key-value pairs to set as build environment variables.
        update-env-vars: List of key-value pairs to set as environment variables.
