name: update-data-source
description: Updates a `DataSource` object.
flags:
    --api-id=!: The API ID.
    --description=: The new description for the data source.
    --dynamodb-config=: The new Amazon DynamoDB configuration.
    --elasticsearch-config=: The new OpenSearch configuration.
    --event-bridge-config=: The new Amazon EventBridge settings.
    --http-config=: The new HTTP endpoint configuration.
    --lambda-config=: The new Lambda configuration.
    --metrics-config=: Enables or disables enhanced data source metrics for specified data sources.
    --name=!: The new name for the data source.
    --open-search-service-config=: The new OpenSearch configuration.
    --relational-database-config=: The new relational database configuration.
    --service-role-arn=: The new service role Amazon Resource Name (ARN) for the data source.
    --type=!: The new data source type.
completion:
    flag:
        metrics-config:
            - ENABLED
            - DISABLED
        type:
            - AWS_LAMBDA
            - AMAZON_DYNAMODB
            - AMAZON_ELASTICSEARCH
            - NONE
            - HTTP
            - RELATIONAL_DATABASE
            - AMAZON_OPENSEARCH_SERVICE
            - AMAZON_EVENTBRIDGE
            - AMAZON_BEDROCK_RUNTIME
documentation:
    command: Updates a `DataSource` object.
    flag:
        api-id: The API ID.
        description: The new description for the data source.
        dynamodb-config: The new Amazon DynamoDB configuration.
        elasticsearch-config: |-
            The new OpenSearch configuration.

            As of September 2021, Amazon Elasticsearch service is Amazon OpenSearch Service. This configuration is deprecated. Instead, use [UpdateDataSourceRequest$openSearchServiceConfig]() to update an OpenSearch data source.
        event-bridge-config: The new Amazon EventBridge settings.
        http-config: The new HTTP endpoint configuration.
        lambda-config: The new Lambda configuration.
        metrics-config: |-
            Enables or disables enhanced data source metrics for specified data sources. Note that `metricsConfig` won't be used unless the `dataSourceLevelMetricsBehavior` value is set to `PER_DATA_SOURCE_METRICS`. If the `dataSourceLevelMetricsBehavior` is set to `FULL_REQUEST_DATA_SOURCE_METRICS` instead, `metricsConfig` will be ignored. However, you can still set its value.

            `metricsConfig` can be `ENABLED` or `DISABLED`.
        name: The new name for the data source.
        open-search-service-config: The new OpenSearch configuration.
        relational-database-config: The new relational database configuration.
        service-role-arn: The new service role Amazon Resource Name (ARN) for the data source.
        type: The new data source type.
