name: reboot
description: Reboot a Persistent Resource.
flags:
    --region=: Cloud region for the persistent resource.
documentation:
    command: |-
        ## EXAMPLES

        To reboot a persistent resource ``123'' under project ``example'' in region
        ``us-central1'', run:

          $ gcloud ai persistent-resources reboot 123 --project=example --region=us-central1
    flag:
        region: |-
            Cloud region for the persistent resource.
            +
            To set the `region` attribute:
            * provide the argument `persistent_resource` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
