name: list-webhooks
description: Returns a list of webhooks for an Amplify app.
flags:
    --app-id=!: The unique ID for an Amplify app.
    --max-results=: The maximum number of records to list in a single response.
    --next-token=: A pagination token.
documentation:
    command: Returns a list of webhooks for an Amplify app.
    flag:
        app-id: The unique ID for an Amplify app.
        max-results: The maximum number of records to list in a single response.
        next-token: A pagination token. Set to null to start listing webhooks from the start. If non-null,the pagination token is returned in a result. Pass its value in here to list more webhooks.
