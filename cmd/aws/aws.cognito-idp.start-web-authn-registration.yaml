name: start-web-authn-registration
description: Requests credential creation options from your user pool for the currently signed-in user.
flags:
    --access-token=!: A valid access token that Amazon Cognito issued to the currently signed-in user.
documentation:
    command: |-
        Requests credential creation options from your user pool for the currently signed-in user. Returns information about the user pool, the user profile, and authentication requirements. Users must provide this information in their request to enroll your application with their passkey provider.

        Authorize this action with a signed-in user's access token. It must include the scope `aws.cognito.signin.user.admin`.
    flag:
        access-token: A valid access token that Amazon Cognito issued to the currently signed-in user. Must include a scope claim for `aws.cognito.signin.user.admin`.
