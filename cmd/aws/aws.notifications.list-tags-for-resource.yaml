name: list-tags-for-resource
description: Returns a list of tags for a specified Amazon Resource Name (ARN).
flags:
    --arn=!: The Amazon Resource Name (ARN) to use to list tags.
documentation:
    command: |-
        Returns a list of tags for a specified Amazon Resource Name (ARN).

        For more information, see [Tagging your Amazon Web Services resources](https://docs.aws.amazon.com/tag-editor/latest/userguide/tagging.html) in the *Tagging Amazon Web Services Resources User Guide*.

        This is only supported for `NotificationConfigurations`.
    flag:
        arn: The Amazon Resource Name (ARN) to use to list tags.
