name: modify-endpoint
description: Modifies the specified endpoint.
flags:
    --certificate-arn=: The Amazon Resource Name (ARN) of the certificate used for SSL connection.
    --database-name=: The name of the endpoint database.
    --dms-transfer-settings=: The settings in JSON format for the DMS transfer type of source endpoint.
    --doc-db-settings=: Settings in JSON format for the source DocumentDB endpoint.
    --dynamo-db-settings=: Settings in JSON format for the target Amazon DynamoDB endpoint.
    --elasticsearch-settings=: Settings in JSON format for the target OpenSearch endpoint.
    --endpoint-arn=!: The Amazon Resource Name (ARN) string that uniquely identifies the endpoint.
    --endpoint-identifier=: The database endpoint identifier.
    --endpoint-type=: The type of endpoint.
    --engine-name=: The database engine name.
    --exact-settings=: If this attribute is Y, the current call to `ModifyEndpoint` replaces all existing endpoint settings with the exact settings that you specify in this call.
    --external-table-definition=: The external table definition.
    --extra-connection-attributes=: Additional attributes associated with the connection.
    --gcp-my-sqlsettings=: Settings in JSON format for the source GCP MySQL endpoint.
    --ibmdb2-settings=: Settings in JSON format for the source IBM Db2 LUW endpoint.
    --kafka-settings=: Settings in JSON format for the target Apache Kafka endpoint.
    --kinesis-settings=: Settings in JSON format for the target endpoint for Amazon Kinesis Data Streams.
    --microsoft-sqlserver-settings=: Settings in JSON format for the source and target Microsoft SQL Server endpoint.
    --mongo-db-settings=: Settings in JSON format for the source MongoDB endpoint.
    --my-sqlsettings=: Settings in JSON format for the source and target MySQL endpoint.
    --neptune-settings=: Settings in JSON format for the target Amazon Neptune endpoint.
    --oracle-settings=: Settings in JSON format for the source and target Oracle endpoint.
    --password=: The password to be used to login to the endpoint database.
    --port=: The port used by the endpoint database.
    --postgre-sqlsettings=: Settings in JSON format for the source and target PostgreSQL endpoint.
    --redis-settings=: Settings in JSON format for the Redis target endpoint.
    --redshift-settings=: ""
    --s3-settings=: Settings in JSON format for the target Amazon S3 endpoint.
    --server-name=: The name of the server where the endpoint database resides.
    --service-access-role-arn=: The Amazon Resource Name (ARN) for the IAM role you want to use to modify the endpoint.
    --ssl-mode=: The SSL mode used to connect to the endpoint.
    --sybase-settings=: Settings in JSON format for the source and target SAP ASE endpoint.
    --timestream-settings=: Settings in JSON format for the target Amazon Timestream endpoint.
    --username=: The user name to be used to login to the endpoint database.
completion:
    flag:
        endpoint-type:
            - source
            - target
        ssl-mode:
            - none
            - require
            - verify-ca
            - verify-full
documentation:
    command: |-
        Modifies the specified endpoint.

        For a MySQL source or target endpoint, don't explicitly specify the database using the `DatabaseName` request parameter on the `ModifyEndpoint` API call. Specifying `DatabaseName` when you modify a MySQL endpoint replicates all the task tables to this single database. For MySQL endpoints, you specify the database only when you specify the schema in the table-mapping rules of the DMS task.
    flag:
        certificate-arn: The Amazon Resource Name (ARN) of the certificate used for SSL connection.
        database-name: The name of the endpoint database. For a MySQL source or target endpoint, do not specify DatabaseName.
        dms-transfer-settings: |-
            The settings in JSON format for the DMS transfer type of source endpoint.

            Attributes include the following:

            - serviceAccessRoleArn - The Amazon Resource Name (ARN) used by the service access IAM role. The role must allow the `iam:PassRole` action.
            - BucketName - The name of the S3 bucket to use.

            Shorthand syntax for these settings is as follows: `ServiceAccessRoleArn=string ,BucketName=string`

            JSON syntax for these settings is as follows: `{ "ServiceAccessRoleArn": "string", "BucketName": "string"}`
        doc-db-settings: Settings in JSON format for the source DocumentDB endpoint. For more information about the available settings, see the configuration properties section in [Using DocumentDB as a Target for Database Migration Service](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Source.DocumentDB.html) in the *Database Migration Service User Guide.*
        dynamo-db-settings: Settings in JSON format for the target Amazon DynamoDB endpoint. For information about other available settings, see [Using Object Mapping to Migrate Data to DynamoDB](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Target.DynamoDB.html#CHAP_Target.DynamoDB.ObjectMapping) in the *Database Migration Service User Guide.*
        elasticsearch-settings: Settings in JSON format for the target OpenSearch endpoint. For more information about the available settings, see [Extra Connection Attributes When Using OpenSearch as a Target for DMS](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Target.Elasticsearch.html#CHAP_Target.Elasticsearch.Configuration) in the *Database Migration Service User Guide.*
        endpoint-arn: The Amazon Resource Name (ARN) string that uniquely identifies the endpoint.
        endpoint-identifier: The database endpoint identifier. Identifiers must begin with a letter and must contain only ASCII letters, digits, and hyphens. They can't end with a hyphen or contain two consecutive hyphens.
        endpoint-type: The type of endpoint. Valid values are `source` and `target`.
        engine-name: The database engine name. Valid values, depending on the EndpointType, include `"mysql"`, `"oracle"`, `"postgres"`, `"mariadb"`, `"aurora"`, `"aurora-postgresql"`, `"redshift"`, `"s3"`, `"db2"`, `"db2-zos"`, `"azuredb"`, `"sybase"`, `"dynamodb"`, `"mongodb"`, `"kinesis"`, `"kafka"`, `"elasticsearch"`, `"documentdb"`, `"sqlserver"`, `"neptune"`, and `"babelfish"`.
        exact-settings: |-
            If this attribute is Y, the current call to `ModifyEndpoint` replaces all existing endpoint settings with the exact settings that you specify in this call. If this attribute is N, the current call to `ModifyEndpoint` does two things:

            - It replaces any endpoint settings that already exist with new values, for settings with the same names.
            - It creates new endpoint settings that you specify in the call, for settings with different names.

            For example, if you call `create-endpoint ... --endpoint-settings '{"a":1}' ...`, the endpoint has the following endpoint settings: `'{"a":1}'`. If you then call `modify-endpoint ... --endpoint-settings '{"b":2}' ...` for the same endpoint, the endpoint has the following settings: `'{"a":1,"b":2}'`.

            However, suppose that you follow this with a call to `modify-endpoint ... --endpoint-settings '{"b":2}' --exact-settings ...` for that same endpoint again. Then the endpoint has the following settings: `'{"b":2}'`. All existing settings are replaced with the exact settings that you specify.
        external-table-definition: The external table definition.
        extra-connection-attributes: Additional attributes associated with the connection. To reset this parameter, pass the empty string ("") as an argument.
        gcp-my-sqlsettings: Settings in JSON format for the source GCP MySQL endpoint.
        ibmdb2-settings: Settings in JSON format for the source IBM Db2 LUW endpoint. For information about other available settings, see [Extra connection attributes when using Db2 LUW as a source for DMS](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Source.DB2.html#CHAP_Source.DB2.ConnectionAttrib) in the *Database Migration Service User Guide.*
        kafka-settings: Settings in JSON format for the target Apache Kafka endpoint. For more information about the available settings, see [Using object mapping to migrate data to a Kafka topic](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Target.Kafka.html#CHAP_Target.Kafka.ObjectMapping) in the *Database Migration Service User Guide.*
        kinesis-settings: Settings in JSON format for the target endpoint for Amazon Kinesis Data Streams. For more information about the available settings, see [Using object mapping to migrate data to a Kinesis data stream](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Target.Kinesis.html#CHAP_Target.Kinesis.ObjectMapping) in the *Database Migration Service User Guide.*
        microsoft-sqlserver-settings: Settings in JSON format for the source and target Microsoft SQL Server endpoint. For information about other available settings, see [Extra connection attributes when using SQL Server as a source for DMS](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Source.SQLServer.html#CHAP_Source.SQLServer.ConnectionAttrib) and [Extra connection attributes when using SQL Server as a target for DMS](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Target.SQLServer.html#CHAP_Target.SQLServer.ConnectionAttrib) in the *Database Migration Service User Guide.*
        mongo-db-settings: Settings in JSON format for the source MongoDB endpoint. For more information about the available settings, see the configuration properties section in [Endpoint configuration settings when using MongoDB as a source for Database Migration Service](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Source.MongoDB.html#CHAP_Source.MongoDB.Configuration) in the *Database Migration Service User Guide.*
        my-sqlsettings: Settings in JSON format for the source and target MySQL endpoint. For information about other available settings, see [Extra connection attributes when using MySQL as a source for DMS](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Source.MySQL.html#CHAP_Source.MySQL.ConnectionAttrib) and [Extra connection attributes when using a MySQL-compatible database as a target for DMS](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Target.MySQL.html#CHAP_Target.MySQL.ConnectionAttrib) in the *Database Migration Service User Guide.*
        neptune-settings: Settings in JSON format for the target Amazon Neptune endpoint. For more information about the available settings, see [Specifying graph-mapping rules using Gremlin and R2RML for Amazon Neptune as a target](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Target.Neptune.html#CHAP_Target.Neptune.EndpointSettings) in the *Database Migration Service User Guide.*
        oracle-settings: Settings in JSON format for the source and target Oracle endpoint. For information about other available settings, see [Extra connection attributes when using Oracle as a source for DMS](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Source.Oracle.html#CHAP_Source.Oracle.ConnectionAttrib) and [Extra connection attributes when using Oracle as a target for DMS](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Target.Oracle.html#CHAP_Target.Oracle.ConnectionAttrib) in the *Database Migration Service User Guide.*
        password: The password to be used to login to the endpoint database.
        port: The port used by the endpoint database.
        postgre-sqlsettings: Settings in JSON format for the source and target PostgreSQL endpoint. For information about other available settings, see [Extra connection attributes when using PostgreSQL as a source for DMS](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Source.PostgreSQL.html#CHAP_Source.PostgreSQL.ConnectionAttrib) and [Extra connection attributes when using PostgreSQL as a target for DMS](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Target.PostgreSQL.html#CHAP_Target.PostgreSQL.ConnectionAttrib) in the *Database Migration Service User Guide.*
        redis-settings: Settings in JSON format for the Redis target endpoint.
        redshift-settings: ""
        s3-settings: Settings in JSON format for the target Amazon S3 endpoint. For more information about the available settings, see [Extra Connection Attributes When Using Amazon S3 as a Target for DMS](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Target.S3.html#CHAP_Target.S3.Configuring) in the *Database Migration Service User Guide.*
        server-name: The name of the server where the endpoint database resides.
        service-access-role-arn: The Amazon Resource Name (ARN) for the IAM role you want to use to modify the endpoint. The role must allow the `iam:PassRole` action.
        ssl-mode: The SSL mode used to connect to the endpoint. The default value is `none`.
        sybase-settings: Settings in JSON format for the source and target SAP ASE endpoint. For information about other available settings, see [Extra connection attributes when using SAP ASE as a source for DMS](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Source.SAP.html#CHAP_Source.SAP.ConnectionAttrib) and [Extra connection attributes when using SAP ASE as a target for DMS](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Target.SAP.html#CHAP_Target.SAP.ConnectionAttrib) in the *Database Migration Service User Guide.*
        timestream-settings: Settings in JSON format for the target Amazon Timestream endpoint.
        username: The user name to be used to login to the endpoint database.
