name: list
description: List Transfer Service transfer agent pools.
flags:
    --limit=: Return the first items from the API up to this limit.
    --names=: The names of the agent pools you want to list.
    --page-size=: Retrieve batches of this many items from the API.
documentation:
    command: |
        List Transfer Service transfer pools in a given project to show their
        configurations.
    flag:
        limit: Return the first items from the API up to this limit.
        names: The names of the agent pools you want to list. Separate multiple names with commas (e.g., --name=foo,bar). If not specified, all agent pools in your current project will be listed.
        page-size: Retrieve batches of this many items from the API.
