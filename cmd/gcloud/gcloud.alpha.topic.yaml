name: topic
description: '*(ALPHA)*  gcloud supplementary help.'
documentation:
    command: |-
        *(ALPHA)*  The gcloud alpha topic command group provides supplementary help for topics not
        directly associated with individual commands.

        More information on gcloud alpha topic can be found by running:

          $ gcloud topic [TOPIC_NAME]

        For a list of available topics run:

          $ gcloud topic --help
