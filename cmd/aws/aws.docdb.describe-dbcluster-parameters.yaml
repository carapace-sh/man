name: describe-dbcluster-parameters
description: Returns the detailed parameter list for a particular cluster parameter group.
flags:
    --dbcluster-parameter-group-name=!: The name of a specific cluster parameter group to return parameter details for.
    --filters=: This parameter is not currently supported.
    --marker=: An optional pagination token provided by a previous request.
    --max-records=: The maximum number of records to include in the response.
    --source=: A value that indicates to return only parameters for a specific source.
documentation:
    command: Returns the detailed parameter list for a particular cluster parameter group.
    flag:
        dbcluster-parameter-group-name: |-
            The name of a specific cluster parameter group to return parameter details for.

            Constraints:

            - If provided, must match the name of an existing `DBClusterParameterGroup`.
        filters: This parameter is not currently supported.
        marker: An optional pagination token provided by a previous request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token (marker) is included in the response so that the remaining results can be retrieved.

            Default: 100

            Constraints: Minimum 20, maximum 100.
        source: A value that indicates to return only parameters for a specific source. Parameter sources can be `engine`, `service`, or `customer`.
