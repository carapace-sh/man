name: create-trusted-token-issuer
description: Creates a connection to a trusted token issuer in an instance of IAM Identity Center.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Specifies a unique, case-sensitive ID that you provide to ensure the idempotency of the request.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-arn=!: Specifies the ARN of the instance of IAM Identity Center to contain the new trusted token issuer configuration.
    --name=!: Specifies the name of the new trusted token issuer configuration.
    --tags=:
        description: Specifies tags to be attached to the new trusted token issuer configuration.
        nargs: -1
    --trusted-token-issuer-configuration=!: Specifies settings that apply to the new trusted token issuer configuration.
    --trusted-token-issuer-type=!: Specifies the type of the new trusted token issuer.
completion:
    flag:
        trusted-token-issuer-type:
            - OIDC_JWT
documentation:
    command: |-
        Creates a connection to a trusted token issuer in an instance of IAM Identity Center. A trusted token issuer enables trusted identity propagation to be used with applications that authenticate outside of Amazon Web Services.

        This trusted token issuer describes an external identity provider (IdP) that can generate claims or assertions in the form of access tokens for a user. Applications enabled for IAM Identity Center can use these tokens for authentication.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: |-
            Specifies a unique, case-sensitive ID that you provide to ensure the idempotency of the request. This lets you safely retry the request without accidentally performing the same operation a second time. Passing the same value to a later call to an operation requires that you also pass the same value for all other parameters. We recommend that you use a [UUID type of value.](https://wikipedia.org/wiki/Universally_unique_identifier).

            If you don't provide this value, then Amazon Web Services generates a random one for you.

            If you retry the operation with the same `ClientToken`, but with different parameters, the retry fails with an `IdempotentParameterMismatch` error.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-arn: Specifies the ARN of the instance of IAM Identity Center to contain the new trusted token issuer configuration.
        name: Specifies the name of the new trusted token issuer configuration.
        tags: Specifies tags to be attached to the new trusted token issuer configuration.
        trusted-token-issuer-configuration: Specifies settings that apply to the new trusted token issuer configuration. The settings that are available depend on what `TrustedTokenIssuerType` you specify.
        trusted-token-issuer-type: Specifies the type of the new trusted token issuer.
