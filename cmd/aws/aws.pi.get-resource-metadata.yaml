name: get-resource-metadata
description: Retrieve the metadata for different features.
flags:
    --identifier=!: An immutable identifier for a data source that is unique for an Amazon Web Services Region.
    --service-type=!: The Amazon Web Services service for which Performance Insights returns metrics.
completion:
    flag:
        service-type:
            - RDS
            - DOCDB
documentation:
    command: Retrieve the metadata for different features. For example, the metadata might indicate that a feature is turned on or off on a specific DB instance.
    flag:
        identifier: An immutable identifier for a data source that is unique for an Amazon Web Services Region. Performance Insights gathers metrics from this data source. To use a DB instance as a data source, specify its `DbiResourceId` value. For example, specify `db-ABCDEFGHIJKLMNOPQRSTU1VW2X`.
        service-type: The Amazon Web Services service for which Performance Insights returns metrics.
