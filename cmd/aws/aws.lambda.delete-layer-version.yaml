name: delete-layer-version
description: Deletes a version of an [Lambda layer](https://docs.aws.amazon.com/lambda/latest/dg/configuration-layers.html).
flags:
    --layer-name=!: The name or Amazon Resource Name (ARN) of the layer.
    --version-number=!: The version number.
documentation:
    command: Deletes a version of an [Lambda layer](https://docs.aws.amazon.com/lambda/latest/dg/configuration-layers.html). Deleted versions can no longer be viewed or added to functions. To avoid breaking functions, a copy of the version remains in Lambda until no functions refer to it.
    flag:
        layer-name: The name or Amazon Resource Name (ARN) of the layer.
        version-number: The version number.
