name: list-impersonation-roles
description: Lists all the impersonation roles for the given WorkMail organization.
flags:
    --max-results=: The maximum number of results returned in a single call.
    --next-token=: The token used to retrieve the next page of results.
    --organization-id=!: The WorkMail organization to which the listed impersonation roles belong.
documentation:
    command: Lists all the impersonation roles for the given WorkMail organization.
    flag:
        max-results: The maximum number of results returned in a single call.
        next-token: The token used to retrieve the next page of results. The first call doesn't require a token.
        organization-id: The WorkMail organization to which the listed impersonation roles belong.
