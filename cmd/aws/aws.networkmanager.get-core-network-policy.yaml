name: get-core-network-policy
description: Returns details about a core network policy.
flags:
    --alias=: The alias of a core network policy
    --core-network-id=!: The ID of a core network.
    --policy-version-id=: The ID of a core network policy version.
completion:
    flag:
        alias:
            - LIVE
            - LATEST
documentation:
    command: Returns details about a core network policy. You can get details about your current live policy or any previous policy version.
    flag:
        alias: The alias of a core network policy
        core-network-id: The ID of a core network.
        policy-version-id: The ID of a core network policy version.
