name: get-account-settings
description: Retrieves account settings for the specified Amazon Chime account ID, such as remote control and dialout settings.
flags:
    --account-id=!: The Amazon Chime account ID.
documentation:
    command: Retrieves account settings for the specified Amazon Chime account ID, such as remote control and dialout settings. For more information about these settings, see [Use the Policies Page](https://docs.aws.amazon.com/chime/latest/ag/policies.html) in the *Amazon Chime Administration Guide*.
    flag:
        account-id: The Amazon Chime account ID.
