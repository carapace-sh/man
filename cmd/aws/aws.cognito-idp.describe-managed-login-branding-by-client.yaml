name: describe-managed-login-branding-by-client
description: Given the ID of a user pool app client, returns detailed information about the style assigned to the app client.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-id=!: The app client that's assigned to the branding style that you want more information about.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-return-merged-resources: When `true`, returns values for branding options that are unchanged from Amazon Cognito defaults.
    --return-merged-resources: When `true`, returns values for branding options that are unchanged from Amazon Cognito defaults.
    --user-pool-id=!: The ID of the user pool that contains the app client where you want more information about the managed login branding style.
documentation:
    command: Given the ID of a user pool app client, returns detailed information about the style assigned to the app client.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-id: The app client that's assigned to the branding style that you want more information about.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        return-merged-resources: When `true`, returns values for branding options that are unchanged from Amazon Cognito defaults. When `false` or when you omit this parameter, returns only values that you customized in your branding style.
        user-pool-id: The ID of the user pool that contains the app client where you want more information about the managed login branding style.
