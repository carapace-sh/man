name: update
description: '*(BETA)*  Update a Cloud Healthcare API HL7v2 store.'
flags:
    --dataset=: Cloud Healthcare dataset.
    --location=: Google Cloud location.
    --pubsub-topic=: Google Cloud Pub/Sub topic name to send updates to.
documentation:
    command: '*(BETA)*  Update a Cloud Healthcare API HL7v2 store.'
    flag:
        dataset: |-
            Cloud Healthcare dataset.
            +
            To set the `dataset` attribute:
            * provide the argument `hl7v2_store` on the command line with a fully specified name;
            * provide the argument `--dataset` on the command line.
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `hl7v2_store` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `healthcare/location`.
        pubsub-topic: |-
            Google Cloud Pub/Sub topic name to send updates to.
            +
            Note: A topic must be created before publishing or subscribing to it. For instructions
            on creating topics, refer to: https://cloud.google.com/pubsub/docs/admin#create_a_topic
