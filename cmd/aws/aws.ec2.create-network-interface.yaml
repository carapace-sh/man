name: create-network-interface
description: Creates a network interface in the specified subnet.
flags:
    --client-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --connection-tracking-specification=: A connection tracking specification for the network interface.
    --description=: A description for the network interface.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --enable-primary-ipv6: If you’re creating a network interface in a dual-stack or IPv6-only subnet, you have the option to assign a primary IPv6 IP address.
    --groups=: The IDs of the security groups.
    --interface-type=: The type of network interface.
    --ipv4-prefix-count=: The number of IPv4 prefixes that Amazon Web Services automatically assigns to the network interface.
    --ipv4-prefixes=: The IPv4 prefixes assigned to the network interface.
    --ipv6-address-count=: The number of IPv6 addresses to assign to a network interface.
    --ipv6-addresses=: The IPv6 addresses from the IPv6 CIDR block range of your subnet.
    --ipv6-prefix-count=: The number of IPv6 prefixes that Amazon Web Services automatically assigns to the network interface.
    --ipv6-prefixes=: The IPv6 prefixes assigned to the network interface.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-enable-primary-ipv6: If you’re creating a network interface in a dual-stack or IPv6-only subnet, you have the option to assign a primary IPv6 IP address.
    --operator=: Reserved for internal use.
    --private-ip-address=: The primary private IPv4 address of the network interface.
    --private-ip-addresses=: The private IPv4 addresses.
    --secondary-private-ip-address-count=: The number of secondary private IPv4 addresses to assign to a network interface.
    --subnet-id=!: The ID of the subnet to associate with the network interface.
    --tag-specifications=: The tags to apply to the new network interface.
completion:
    flag:
        interface-type:
            - efa
            - efa-only
            - branch
            - trunk
documentation:
    command: |-
        Creates a network interface in the specified subnet.

        The number of IP addresses you can assign to a network interface varies by instance type.

        For more information about network interfaces, see [Elastic network interfaces](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-eni.html) in the *Amazon EC2 User Guide*.
    flag:
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/ec2/latest/devguide/ec2-api-idempotency.html).
        connection-tracking-specification: A connection tracking specification for the network interface.
        description: A description for the network interface.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        enable-primary-ipv6: If you’re creating a network interface in a dual-stack or IPv6-only subnet, you have the option to assign a primary IPv6 IP address. A primary IPv6 address is an IPv6 GUA address associated with an ENI that you have enabled to use a primary IPv6 address. Use this option if the instance that this ENI will be attached to relies on its IPv6 address not changing. Amazon Web Services will automatically assign an IPv6 address associated with the ENI attached to your instance to be the primary IPv6 address. Once you enable an IPv6 GUA address to be a primary IPv6, you cannot disable it. When you enable an IPv6 GUA address to be a primary IPv6, the first IPv6 GUA will be made the primary IPv6 address until the instance is terminated or the network interface is detached. If you have multiple IPv6 addresses associated with an ENI attached to your instance and you enable a primary IPv6 address, the first IPv6 GUA address associated with the ENI becomes the primary IPv6 address.
        groups: The IDs of the security groups.
        interface-type: |-
            The type of network interface. The default is `interface`.

            If you specify `efa-only`, do not assign any IP addresses to the network interface. EFA-only network interfaces do not support IP addresses.

            The only supported values are `interface`, `efa`, `efa-only`, and `trunk`.
        ipv4-prefix-count: |-
            The number of IPv4 prefixes that Amazon Web Services automatically assigns to the network interface.

            You can't specify a count of IPv4 prefixes if you've specified one of the following: specific IPv4 prefixes, specific private IPv4 addresses, or a count of private IPv4 addresses.
        ipv4-prefixes: |-
            The IPv4 prefixes assigned to the network interface.

            You can't specify IPv4 prefixes if you've specified one of the following: a count of IPv4 prefixes, specific private IPv4 addresses, or a count of private IPv4 addresses.
        ipv6-address-count: |-
            The number of IPv6 addresses to assign to a network interface. Amazon EC2 automatically selects the IPv6 addresses from the subnet range.

            You can't specify a count of IPv6 addresses using this parameter if you've specified one of the following: specific IPv6 addresses, specific IPv6 prefixes, or a count of IPv6 prefixes.

            If your subnet has the `AssignIpv6AddressOnCreation` attribute set, you can override that setting by specifying 0 as the IPv6 address count.
        ipv6-addresses: |-
            The IPv6 addresses from the IPv6 CIDR block range of your subnet.

            You can't specify IPv6 addresses using this parameter if you've specified one of the following: a count of IPv6 addresses, specific IPv6 prefixes, or a count of IPv6 prefixes.
        ipv6-prefix-count: |-
            The number of IPv6 prefixes that Amazon Web Services automatically assigns to the network interface.

            You can't specify a count of IPv6 prefixes if you've specified one of the following: specific IPv6 prefixes, specific IPv6 addresses, or a count of IPv6 addresses.
        ipv6-prefixes: |-
            The IPv6 prefixes assigned to the network interface.

            You can't specify IPv6 prefixes if you've specified one of the following: a count of IPv6 prefixes, specific IPv6 addresses, or a count of IPv6 addresses.
        operator: Reserved for internal use.
        private-ip-address: The primary private IPv4 address of the network interface. If you don't specify an IPv4 address, Amazon EC2 selects one for you from the subnet's IPv4 CIDR range. If you specify an IP address, you cannot indicate any IP addresses specified in `privateIpAddresses` as primary (only one IP address can be designated as primary).
        private-ip-addresses: |-
            The private IPv4 addresses.

            You can't specify private IPv4 addresses if you've specified one of the following: a count of private IPv4 addresses, specific IPv4 prefixes, or a count of IPv4 prefixes.
        secondary-private-ip-address-count: |-
            The number of secondary private IPv4 addresses to assign to a network interface. When you specify a number of secondary IPv4 addresses, Amazon EC2 selects these IP addresses within the subnet's IPv4 CIDR range. You can't specify this option and specify more than one private IP address using `privateIpAddresses`.

            You can't specify a count of private IPv4 addresses if you've specified one of the following: specific private IPv4 addresses, specific IPv4 prefixes, or a count of IPv4 prefixes.
        subnet-id: The ID of the subnet to associate with the network interface.
        tag-specifications: The tags to apply to the new network interface.
