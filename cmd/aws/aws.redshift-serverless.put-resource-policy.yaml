name: put-resource-policy
description: Creates or updates a resource policy.
flags:
    --policy=!: The policy to create or update.
    --resource-arn=!: The Amazon Resource Name (ARN) of the account to create or update a resource policy for.
documentation:
    command: Creates or updates a resource policy. Currently, you can use policies to share snapshots across Amazon Web Services accounts.
    flag:
        policy: |-
            The policy to create or update. For example, the following policy grants a user authorization to restore a snapshot.

            `"{\"Version\": \"2012-10-17\", \"Statement\" : [{ \"Sid\": \"AllowUserRestoreFromSnapshot\", \"Principal\":{\"AWS\": [\"739247239426\"]}, \"Action\": [\"redshift-serverless:RestoreFromSnapshot\"] , \"Effect\": \"Allow\" }]}"`
        resource-arn: The Amazon Resource Name (ARN) of the account to create or update a resource policy for.
