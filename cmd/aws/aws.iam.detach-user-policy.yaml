name: detach-user-policy
description: Removes the specified managed policy from the specified user.
flags:
    --policy-arn=!: The Amazon Resource Name (ARN) of the IAM policy you want to detach.
    --user-name=!: The name (friendly name, not ARN) of the IAM user to detach the policy from.
documentation:
    command: |-
        Removes the specified managed policy from the specified user.

        A user can also have inline policies embedded with it. To delete an inline policy, use [DeleteUserPolicy](https://docs.aws.amazon.com/IAM/latest/APIReference/API_DeleteUserPolicy.html). For information about policies, see [Managed policies and inline policies](https://docs.aws.amazon.com/IAM/latest/UserGuide/policies-managed-vs-inline.html) in the *IAM User Guide*.
    flag:
        policy-arn: |-
            The Amazon Resource Name (ARN) of the IAM policy you want to detach.

            For more information about ARNs, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference*.
        user-name: |-
            The name (friendly name, not ARN) of the IAM user to detach the policy from.

            This parameter allows (through its [regex pattern](http://wikipedia.org/wiki/regex)) a string of characters consisting of upper and lowercase alphanumeric characters with no spaces. You can also include any of the following characters: \_+=,.@-
