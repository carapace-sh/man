name: create-kx-volume
description: Creates a new volume with a specific amount of throughput and storage capacity.
flags:
    --availability-zone-ids=!:
        description: The identifier of the availability zones.
        nargs: -1
    --az-mode=!: The number of availability zones you want to assign per volume.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A token that ensures idempotency.
    --description=: A description of the volume.
    --environment-id=!: A unique identifier for the kdb environment, whose clusters can attach to the volume.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --nas1-configuration=: Specifies the configuration for the Network attached storage (NAS\_1) file system volume.
    --tags=: A list of key-value pairs to label the volume.
    --volume-name=!: A unique identifier for the volume.
    --volume-type=!: The type of file system volume.
completion:
    flag:
        az-mode:
            - SINGLE
            - MULTI
        volume-type:
            - NAS_1
documentation:
    command: Creates a new volume with a specific amount of throughput and storage capacity.
    flag:
        availability-zone-ids: The identifier of the availability zones.
        az-mode: The number of availability zones you want to assign per volume. Currently, FinSpace only supports `SINGLE` for volumes. This places dataview in a single AZ.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A token that ensures idempotency. This token expires in 10 minutes.
        description: A description of the volume.
        environment-id: A unique identifier for the kdb environment, whose clusters can attach to the volume.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        nas1-configuration: Specifies the configuration for the Network attached storage (NAS\_1) file system volume. This parameter is required when you choose `volumeType` as *NAS\_1*.
        tags: A list of key-value pairs to label the volume. You can add up to 50 tags to a volume.
        volume-name: A unique identifier for the volume.
        volume-type: The type of file system volume. Currently, FinSpace only supports `NAS_1` volume type. When you select `NAS_1` volume type, you must also provide `nas1Configuration`.
