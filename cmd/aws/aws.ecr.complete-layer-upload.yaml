name: complete-layer-upload
description: Informs Amazon ECR that the image layer upload has completed for a specified registry, repository name, and upload ID.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --layer-digests=!: The `sha256` digest of the image layer.
    --registry-id=: The Amazon Web Services account ID associated with the registry to which to upload layers.
    --repository-name=!: The name of the repository to associate with the image layer.
    --upload-id=!: The upload ID from a previous [InitiateLayerUpload]() operation to associate with the image layer.
documentation:
    command: |-
        Informs Amazon ECR that the image layer upload has completed for a specified registry, repository name, and upload ID. You can optionally provide a `sha256` digest of the image layer for data validation purposes.

        When an image is pushed, the CompleteLayerUpload API is called once per each new image layer to verify that the upload has completed.

        This operation is used by the Amazon ECR proxy and is not generally used by customers for pulling and pushing images. In most cases, you should use the `docker` CLI to pull, tag, and push images.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        layer-digests: The `sha256` digest of the image layer.
        registry-id: The Amazon Web Services account ID associated with the registry to which to upload layers. If you do not specify a registry, the default registry is assumed.
        repository-name: The name of the repository to associate with the image layer.
        upload-id: The upload ID from a previous [InitiateLayerUpload]() operation to associate with the image layer.
