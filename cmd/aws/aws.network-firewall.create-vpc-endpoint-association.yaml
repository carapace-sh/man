name: create-vpc-endpoint-association
description: Creates a firewall endpoint for an Network Firewall firewall.
flags:
    --description=: A description of the VPC endpoint association.
    --firewall-arn=!: The Amazon Resource Name (ARN) of the firewall.
    --subnet-mapping=!: ""
    --tags=: The key:value pairs to associate with the resource.
    --vpc-id=!: The unique identifier of the VPC where you want to create a firewall endpoint.
documentation:
    command: Creates a firewall endpoint for an Network Firewall firewall. This type of firewall endpoint is independent of the firewall endpoints that you specify in the `Firewall` itself, and you define it in addition to those endpoints after the firewall has been created. You can define a VPC endpoint association using a different VPC than the one you used in the firewall specifications.
    flag:
        description: A description of the VPC endpoint association.
        firewall-arn: The Amazon Resource Name (ARN) of the firewall.
        subnet-mapping: ""
        tags: The key:value pairs to associate with the resource.
        vpc-id: The unique identifier of the VPC where you want to create a firewall endpoint.
