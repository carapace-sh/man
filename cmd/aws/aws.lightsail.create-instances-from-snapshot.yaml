name: create-instances-from-snapshot
description: Creates one or more new instances from a manual or automatic snapshot of an instance.
flags:
    --add-ons=: An array of objects representing the add-ons to enable for the new instance.
    --attached-disk-mapping=: An object containing information about one or more disk mappings.
    --availability-zone=!: The Availability Zone where you want to create your instances.
    --bundle-id=!: The bundle of specification information for your virtual private server (or *instance*), including the pricing plan (`micro_x_x`).
    --instance-names=!: The names for your new instances.
    --instance-snapshot-name=: The name of the instance snapshot on which you are basing your new instances.
    --ip-address-type=: The IP address type for the instance.
    --key-pair-name=: The name for your key pair.
    --no-use-latest-restorable-auto-snapshot: A Boolean value to indicate whether to use the latest available automatic snapshot.
    --restore-date=: The date of the automatic snapshot to use for the new instance.
    --source-instance-name=: The name of the source instance from which the source automatic snapshot was created.
    --tags=: The tag keys and optional values to add to the resource during create.
    --use-latest-restorable-auto-snapshot: A Boolean value to indicate whether to use the latest available automatic snapshot.
    --user-data=: You can create a launch script that configures a server with additional user data.
completion:
    flag:
        ip-address-type:
            - dualstack
            - ipv4
            - ipv6
documentation:
    command: |-
        Creates one or more new instances from a manual or automatic snapshot of an instance.

        The `create instances from snapshot` operation supports tag-based access control via request tags and resource tags applied to the resource identified by `instance snapshot name`. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-controlling-access-using-tags).
    flag:
        add-ons: An array of objects representing the add-ons to enable for the new instance.
        attached-disk-mapping: An object containing information about one or more disk mappings.
        availability-zone: 'The Availability Zone where you want to create your instances. Use the following formatting: `us-east-2a` (case sensitive). You can get a list of Availability Zones by using the [get regions](http://docs.aws.amazon.com/lightsail/2016-11-28/api-reference/API_GetRegions.html) operation. Be sure to add the `include Availability Zones` parameter to your request.'
        bundle-id: The bundle of specification information for your virtual private server (or *instance*), including the pricing plan (`micro_x_x`).
        instance-names: The names for your new instances.
        instance-snapshot-name: |-
            The name of the instance snapshot on which you are basing your new instances. Use the get instance snapshots operation to return information about your existing snapshots.

            Constraint:

            - This parameter cannot be defined together with the `source instance name` parameter. The `instance snapshot name` and `source instance name` parameters are mutually exclusive.
        ip-address-type: |-
            The IP address type for the instance.

            The possible values are `ipv4` for IPv4 only, `ipv6` for IPv6 only, and `dualstack` for IPv4 and IPv6.

            The default value is `dualstack`.
        key-pair-name: The name for your key pair.
        restore-date: |-
            The date of the automatic snapshot to use for the new instance. Use the `get auto snapshots` operation to identify the dates of the available automatic snapshots.

            Constraints:

            - Must be specified in `YYYY-MM-DD` format.
            - This parameter cannot be defined together with the `use latest restorable auto snapshot` parameter. The `restore date` and `use latest restorable auto snapshot` parameters are mutually exclusive.
            - Define this parameter only when creating a new instance from an automatic snapshot. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-configuring-automatic-snapshots).
        source-instance-name: |-
            The name of the source instance from which the source automatic snapshot was created.

            Constraints:

            - This parameter cannot be defined together with the `instance snapshot name` parameter. The `source instance name` and `instance snapshot name` parameters are mutually exclusive.
            - Define this parameter only when creating a new instance from an automatic snapshot. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-configuring-automatic-snapshots).
        tags: |-
            The tag keys and optional values to add to the resource during create.

            Use the `TagResource` action to tag a resource after it's created.
        use-latest-restorable-auto-snapshot: |-
            A Boolean value to indicate whether to use the latest available automatic snapshot.

            Constraints:

            - This parameter cannot be defined together with the `restore date` parameter. The `use latest restorable auto snapshot` and `restore date` parameters are mutually exclusive.
            - Define this parameter only when creating a new instance from an automatic snapshot. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-configuring-automatic-snapshots).
        user-data: |-
            You can create a launch script that configures a server with additional user data. For example, `apt-get -y update`.

            Depending on the machine image you choose, the command to get software on your instance varies. Amazon Linux and CentOS use `yum`, Debian and Ubuntu use `apt-get`, and FreeBSD uses `pkg`. For a complete list, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/compare-options-choose-lightsail-instance-image).
