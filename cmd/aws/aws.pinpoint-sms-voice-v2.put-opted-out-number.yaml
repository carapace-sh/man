name: put-opted-out-number
description: Creates an opted out destination phone number in the opt-out list.
flags:
    --opt-out-list-name=!: The OptOutListName or OptOutListArn to add the phone number to.
    --opted-out-number=!: The phone number to add to the OptOutList in E.164 format.
documentation:
    command: |-
        Creates an opted out destination phone number in the opt-out list.

        If the destination phone number isn't valid or if the specified opt-out list doesn't exist, an error is returned.
    flag:
        opt-out-list-name: |-
            The OptOutListName or OptOutListArn to add the phone number to.

            If you are using a shared End User MessagingSMS resource then you must use the full Amazon Resource Name(ARN).
        opted-out-number: The phone number to add to the OptOutList in E.164 format.
