name: describe-reserved-dbinstances-offerings
description: Lists available reserved DB instance offerings.
flags:
    --dbinstance-class=: The DB instance class filter value.
    --duration=: Duration filter value, specified in years or seconds.
    --filters=: This parameter isn't currently supported.
    --marker=: An optional pagination token provided by a previous request.
    --max-records=: The maximum number of records to include in the response.
    --multi-az=: Specifies whether to show only those reservations that support Multi-AZ.
    --offering-type=: The offering type filter value.
    --product-description=: Product description filter value.
    --reserved-dbinstances-offering-id=: The offering identifier filter value.
documentation:
    command: Lists available reserved DB instance offerings.
    flag:
        dbinstance-class: The DB instance class filter value. Specify this parameter to show only the available offerings matching the specified DB instance class.
        duration: |-
            Duration filter value, specified in years or seconds. Specify this parameter to show only reservations for this duration.

            Valid Values: `1 | 3 | 31536000 | 94608000`
        filters: This parameter isn't currently supported.
        marker: An optional pagination token provided by a previous request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more than the `MaxRecords` value is available, a pagination token called a marker is included in the response so you can retrieve the remaining results.

            Default: 100

            Constraints: Minimum 20, maximum 100.
        multi-az: Specifies whether to show only those reservations that support Multi-AZ.
        offering-type: |-
            The offering type filter value. Specify this parameter to show only the available offerings matching the specified offering type.

            Valid Values: `"Partial Upfront" | "All Upfront" | "No Upfront"`
        product-description: |-
            Product description filter value. Specify this parameter to show only the available offerings that contain the specified product description.

            The results show offerings that partially match the filter value.
        reserved-dbinstances-offering-id: |-
            The offering identifier filter value. Specify this parameter to show only the available offering that matches the specified reservation identifier.

            Example: `438012d3-4052-4cc7-b2e3-8d3372e0e706`
