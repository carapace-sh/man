name: describe-cache-engine-versions
description: Returns a list of the available cache engines and their versions.
flags:
    --cache-parameter-group-family=: The name of a specific cache parameter group family to return details for.
    --default-only: If `true`, specifies that only the default version of the specified engine or engine and major version combination is to be returned.
    --engine-version=: The cache engine version to return.
    --engine=: The cache engine to return.
    --marker=: An optional marker returned from a prior request.
    --max-records=: The maximum number of records to include in the response.
    --no-default-only&: If `true`, specifies that only the default version of the specified engine or engine and major version combination is to be returned.
documentation:
    command: Returns a list of the available cache engines and their versions.
    flag:
        cache-parameter-group-family: |-
            The name of a specific cache parameter group family to return details for.

            Valid values are: `memcached1.4` | `memcached1.5` | `memcached1.6` | `redis2.6` | `redis2.8` | `redis3.2` | `redis4.0` | `redis5.0` | `redis6.x` | `redis6.2` | `redis7` | `valkey7`

            Constraints:

            - Must be 1 to 255 alphanumeric characters
            - First character must be a letter
            - Cannot end with a hyphen or contain two consecutive hyphens
        default-only: If `true`, specifies that only the default version of the specified engine or engine and major version combination is to be returned.
        engine: 'The cache engine to return. Valid values: `memcached` | `redis`'
        engine-version: |-
            The cache engine version to return.

            Example: `1.4.14`
        marker: An optional marker returned from a prior request. Use this marker for pagination of results from this operation. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a marker is included in the response so that the remaining results can be retrieved.

            Default: 100

            Constraints: minimum 20; maximum 100.
