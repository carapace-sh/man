name: describe
description: '*(ALPHA)*  Describe an internal range.'
flags:
    --region=: The location ID.
documentation:
    command: |
        *(ALPHA)*  Retrieve and display details about an internal range.
    flag:
        region: |-
            The location ID.
            +

            To set the `region` attribute:
            * provide the argument `internal_range` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * use default global location
            .
