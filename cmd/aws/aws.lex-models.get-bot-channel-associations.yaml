name: get-bot-channel-associations
description: Returns a list of all of the channels associated with the specified bot.
flags:
    --bot-alias=!: An alias pointing to the specific version of the Amazon Lex bot to which this association is being made.
    --bot-name=!: The name of the Amazon Lex bot in the association.
    --max-results=: The maximum number of associations to return in the response.
    --name-contains=: Substring to match in channel association names.
    --next-token=: A pagination token for fetching the next page of associations.
documentation:
    command: |-
        Returns a list of all of the channels associated with the specified bot.

        The `GetBotChannelAssociations` operation requires permissions for the `lex:GetBotChannelAssociations` action.
    flag:
        bot-alias: An alias pointing to the specific version of the Amazon Lex bot to which this association is being made.
        bot-name: The name of the Amazon Lex bot in the association.
        max-results: The maximum number of associations to return in the response. The default is 50.
        name-contains: Substring to match in channel association names. An association will be returned if any part of its name matches the substring. For example, "xyz" matches both "xyzabc" and "abcxyz." To return all bot channel associations, use a hyphen ("-") as the `nameContains` parameter.
        next-token: A pagination token for fetching the next page of associations. If the response to this call is truncated, Amazon Lex returns a pagination token in the response. To fetch the next page of associations, specify the pagination token in the next request.
