name: create-profile-job
description: Creates a new job to analyze a dataset and create its data profile.
flags:
    --configuration=: Configuration for profile jobs.
    --dataset-name=!: The name of the dataset that this job is to act upon.
    --encryption-key-arn=: The Amazon Resource Name (ARN) of an encryption key that is used to protect the job.
    --encryption-mode=: 'The encryption mode for the job, which can be one of the following:'
    --job-sample=: Sample configuration for profile jobs only.
    --log-subscription=: Enables or disables Amazon CloudWatch logging for the job.
    --max-capacity=: The maximum number of nodes that DataBrew can use when the job processes data.
    --max-retries=: The maximum number of times to retry the job after a job run fails.
    --name=!: The name of the job to be created.
    --output-location=!: ""
    --role-arn=!: The Amazon Resource Name (ARN) of the Identity and Access Management (IAM) role to be assumed when DataBrew runs the job.
    --tags=: Metadata tags to apply to this job.
    --timeout=: The job's timeout in minutes.
    --validation-configurations=: List of validation configurations that are applied to the profile job.
completion:
    flag:
        encryption-mode:
            - SSE-KMS
            - SSE-S3
        log-subscription:
            - ENABLE
            - DISABLE
documentation:
    command: Creates a new job to analyze a dataset and create its data profile.
    flag:
        configuration: Configuration for profile jobs. Used to select columns, do evaluations, and override default parameters of evaluations. When configuration is null, the profile job will run with default settings.
        dataset-name: The name of the dataset that this job is to act upon.
        encryption-key-arn: The Amazon Resource Name (ARN) of an encryption key that is used to protect the job.
        encryption-mode: |-
            The encryption mode for the job, which can be one of the following:

            - `SSE-KMS` - `SSE-KMS` - Server-side encryption with KMS-managed keys.
            - `SSE-S3` - Server-side encryption with keys managed by Amazon S3.
        job-sample: Sample configuration for profile jobs only. Determines the number of rows on which the profile job will be executed. If a JobSample value is not provided, the default value will be used. The default value is CUSTOM\_ROWS for the mode parameter and 20000 for the size parameter.
        log-subscription: Enables or disables Amazon CloudWatch logging for the job. If logging is enabled, CloudWatch writes one log stream for each job run.
        max-capacity: The maximum number of nodes that DataBrew can use when the job processes data.
        max-retries: The maximum number of times to retry the job after a job run fails.
        name: The name of the job to be created. Valid characters are alphanumeric (A-Z, a-z, 0-9), hyphen (-), period (.), and space.
        output-location: ""
        role-arn: The Amazon Resource Name (ARN) of the Identity and Access Management (IAM) role to be assumed when DataBrew runs the job.
        tags: Metadata tags to apply to this job.
        timeout: The job's timeout in minutes. A job that attempts to run longer than this timeout period ends with a status of `TIMEOUT`.
        validation-configurations: List of validation configurations that are applied to the profile job.
