name: create-ops-metadata
description: If you create a new application in Application Manager, Amazon Web Services Systems Manager calls this API operation to specify information about the new application, including the application type.
flags:
    --metadata=: Metadata for a new Application Manager application.
    --resource-id=!: A resource ID for a new Application Manager application.
    --tags=: Optional metadata that you assign to a resource.
documentation:
    command: If you create a new application in Application Manager, Amazon Web Services Systems Manager calls this API operation to specify information about the new application, including the application type.
    flag:
        metadata: Metadata for a new Application Manager application.
        resource-id: A resource ID for a new Application Manager application.
        tags: |-
            Optional metadata that you assign to a resource. You can specify a maximum of five tags for an OpsMetadata object. Tags enable you to categorize a resource in different ways, such as by purpose, owner, or environment. For example, you might want to tag an OpsMetadata object to identify an environment or target Amazon Web Services Region. In this case, you could specify the following key-value pairs:

            - `Key=Environment,Value=Production`
            - `Key=Region,Value=us-east-2`
