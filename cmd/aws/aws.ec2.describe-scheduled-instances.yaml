name: describe-scheduled-instances
description: Describes the specified Scheduled Instances or all your Scheduled Instances.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: The filters.
    --max-results=: The maximum number of results to return in a single call.
    --next-token=: The token for the next set of results.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --scheduled-instance-ids=: The Scheduled Instance IDs.
    --slot-start-time-range=: The time period for the first schedule to start.
documentation:
    command: Describes the specified Scheduled Instances or all your Scheduled Instances.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            The filters.

            - `availability-zone` - The Availability Zone (for example, `us-west-2a`).
            - `instance-type` - The instance type (for example, `c4.large`).
            - `platform` - The platform (`Linux/UNIX` or `Windows`).
        max-results: The maximum number of results to return in a single call. This value can be between 5 and 300. The default value is 100. To retrieve the remaining results, make another call with the returned `NextToken` value.
        next-token: The token for the next set of results.
        scheduled-instance-ids: The Scheduled Instance IDs.
        slot-start-time-range: The time period for the first schedule to start.
