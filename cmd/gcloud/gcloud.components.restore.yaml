name: restore
description: '*(DEPRECATED)*  Restore the Google Cloud CLI installation to its state before a reinstall.'
hidden: true
flags:
    --architecture-override=&: THIS ARGUMENT NEEDS HELP TEXT.
    --operating-system-override=&: THIS ARGUMENT NEEDS HELP TEXT.
    --sdk-root-override=&: THIS ARGUMENT NEEDS HELP TEXT.
    --snapshot-url-override=&: THIS ARGUMENT NEEDS HELP TEXT.
documentation:
    command: |-
        *(DEPRECATED)*  Restore the Google Cloud CLI installation to its state before a reinstall.

        Starting with release 473.0.0, the Google Cloud CLI updates in place instead of making a backup copy of the installation directory when running `gcloud components update`, `install`, and `remove` commands (this reduces the time taken by those operations). Consequently, this command has no backup to restore in those cases. Instead, to restore your installation to a previous version, run `gcloud components update --version=<previous_version>`, or install the previous version directly from https://cloud.google.com/sdk/docs/install.

        This is an undo operation, which restores the Google Cloud CLI installation on
        the local workstation to the state it was in just before the most recent
        `gcloud components reinstall` command. A `restore` command does not undo a
        previous `restore` command.

        ## EXAMPLES
        To restore the Google Cloud CLI installation to its state before reinstalling,
        run:

          $ gcloud components restore
