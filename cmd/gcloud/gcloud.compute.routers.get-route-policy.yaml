name: get-route-policy
description: Get a route policy from a Compute Engine router.
flags:
    --policy-name=!: Name of the route policy to get.
    --region=: Region of the router to get.
documentation:
    command: |
        *gcloud compute routers get-route-policy* gets a route policy from a Compute Engine router.
    flag:
        policy-name: Name of the route policy to get.
        region: |-
            Region of the router to get. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
