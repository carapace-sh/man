name: update-contact
description: Updates a contact's preferences for a list.
flags:
    --attributes-data=: The attribute data attached to a contact.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --contact-list-name=!: The name of the contact list.
    --email-address=!: The contact's email address.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-unsubscribe-all: A boolean value status noting if the contact is unsubscribed from all contact list topics.
    --topic-preferences=:
        description: The contact's preference for being opted-in to or opted-out of a topic.
        nargs: -1
    --unsubscribe-all: A boolean value status noting if the contact is unsubscribed from all contact list topics.
documentation:
    command: |-
        Updates a contact's preferences for a list.

        You must specify all existing topic preferences in the `TopicPreferences` object, not just the ones that need updating; otherwise, all your existing preferences will be removed.
    flag:
        attributes-data: The attribute data attached to a contact.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        contact-list-name: The name of the contact list.
        email-address: The contact's email address.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        topic-preferences: The contact's preference for being opted-in to or opted-out of a topic.
        unsubscribe-all: A boolean value status noting if the contact is unsubscribed from all contact list topics.
