name: delete-package
description: Deletes a specific version from a software package.
flags:
    --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
    --package-name=!: The name of the target software package.
documentation:
    command: |-
        Deletes a specific version from a software package.

        **Note:** All package versions must be deleted before deleting the software package.

        Requires permission to access the [DeletePackageVersion](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        client-token: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request. Don't reuse this client token if a new idempotent request is required.
        package-name: The name of the target software package.
