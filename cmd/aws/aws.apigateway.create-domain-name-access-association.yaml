name: create-domain-name-access-association
description: Creates a domain name access association resource between an access association source and a private custom domain name.
flags:
    --access-association-source-type=!: The type of the domain name access association source.
    --access-association-source=!: The identifier of the domain name access association source.
    --domain-name-arn=!: The ARN of the domain name.
    --tags=: The key-value map of strings.
completion:
    flag:
        access-association-source-type:
            - VPCE
documentation:
    command: Creates a domain name access association resource between an access association source and a private custom domain name.
    flag:
        access-association-source: The identifier of the domain name access association source. For a VPCE, the value is the VPC endpoint ID.
        access-association-source-type: The type of the domain name access association source.
        domain-name-arn: The ARN of the domain name.
        tags: The key-value map of strings. The valid character set is \[a-zA-Z+-=.\_:/]. The tag key can be up to 128 characters and must not start with `aws:`. The tag value can be up to 256 characters.
