name: set-iam-policy
description: '*(BETA)*  Set IAM policy for a folder.'
documentation:
    command: |-
        *(BETA)*  Sets the IAM policy for a folder, given a folder ID and a file encoded in
        JSON or YAML that contains the IAM policy.

        ## EXAMPLES

        The following command reads an IAM policy defined in a JSON file `policy.json`
        and sets it for a folder with the ID `3589215982`:

          $ gcloud beta resource-manager folders set-iam-policy 3589215982 policy.json
