name: list-archives
description: Lists your archives.
flags:
    --event-source-arn=: The ARN of the event source associated with the archive.
    --limit=: The maximum number of results to return.
    --name-prefix=: A name prefix to filter the archives returned.
    --next-token=: The token returned by a previous call, which you can use to retrieve the next set of results.
    --state=: The state of the archive.
completion:
    flag:
        state:
            - ENABLED
            - DISABLED
            - CREATING
            - UPDATING
            - CREATE_FAILED
            - UPDATE_FAILED
documentation:
    command: Lists your archives. You can either list all the archives or you can provide a prefix to match to the archive names. Filter parameters are exclusive.
    flag:
        event-source-arn: The ARN of the event source associated with the archive.
        limit: The maximum number of results to return.
        name-prefix: A name prefix to filter the archives returned. Only archives with name that match the prefix are returned.
        next-token: |-
            The token returned by a previous call, which you can use to retrieve the next set of results.

            The value of `nextToken` is a unique pagination token for each page. To retrieve the next page of results, make the call again using the returned token. Keep all other arguments unchanged.

            Using an expired pagination token results in an `HTTP 400 InvalidToken` error.
        state: The state of the archive.
