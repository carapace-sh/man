name: list-subscriptions-by-topic
description: Returns a list of the subscriptions to a specific topic.
flags:
    --next-token=: Token returned by the previous `ListSubscriptionsByTopic` request.
    --topic-arn=!: The ARN of the topic for which you wish to find subscriptions.
documentation:
    command: |-
        Returns a list of the subscriptions to a specific topic. Each call returns a limited list of subscriptions, up to 100. If there are more subscriptions, a `NextToken` is also returned. Use the `NextToken` parameter in a new `ListSubscriptionsByTopic` call to get further results.

        This action is throttled at 30 transactions per second (TPS).
    flag:
        next-token: Token returned by the previous `ListSubscriptionsByTopic` request.
        topic-arn: The ARN of the topic for which you wish to find subscriptions.
