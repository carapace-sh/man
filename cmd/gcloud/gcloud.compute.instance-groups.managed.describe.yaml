name: describe
description: Display detailed information about an instance group.
flags:
    --region=: Region of the managed instance group to describe.
    --zone=: Zone of the managed instance group to describe.
documentation:
    command: |
        *gcloud compute instance-groups managed describe* displays all data associated with an instance group in a project.
    flag:
        region: |-
            Region of the managed instance group to describe. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            Overrides the default *compute/region* property value for this command invocation.
        zone: |-
            Zone of the managed instance group to describe. If not specified, you might be prompted to select a zone (interactive mode
            only).
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            Overrides the default *compute/zone* property value for this command invocation.
