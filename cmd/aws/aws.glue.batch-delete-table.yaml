name: batch-delete-table
description: Deletes multiple tables at once.
flags:
    --catalog-id=: The ID of the Data Catalog where the table resides.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --database-name=!: The name of the catalog database in which the tables to delete reside.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --tables-to-delete=!: A list of the table to delete.
    --transaction-id=: The transaction ID at which to delete the table contents.
documentation:
    command: |-
        Deletes multiple tables at once.

        After completing this operation, you no longer have access to the table versions and partitions that belong to the deleted table. Glue deletes these "orphaned" resources asynchronously in a timely manner, at the discretion of the service.

        To ensure the immediate deletion of all related resources, before calling `BatchDeleteTable`, use `DeleteTableVersion` or `BatchDeleteTableVersion`, and `DeletePartition` or `BatchDeletePartition`, to delete any resources that belong to the table.
    flag:
        catalog-id: The ID of the Data Catalog where the table resides. If none is provided, the Amazon Web Services account ID is used by default.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        database-name: The name of the catalog database in which the tables to delete reside. For Hive compatibility, this name is entirely lowercase.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        tables-to-delete: A list of the table to delete.
        transaction-id: The transaction ID at which to delete the table contents.
