name: schema
description: '*(ALPHA)*  Migrate schema from a source database to Cloud Spanner.'
flags:
    --dry-run: Flag for generating DDL and schema conversion report without creating a Cloud Spanner database.
    --log-level=: To configure the log level for the execution (INFO, VERBOSE).
    --no-dry-run&: Flag for generating DDL and schema conversion report without creating a Cloud Spanner database.
    --no-show-exec-error&: If true and command fails, print the underlying command that was executed and its exit status.
    --prefix=: File prefix for generated files.
    --show-exec-error&: If true and command fails, print the underlying command that was executed and its exit status.
    --source-profile=: Flag for specifying connection profile for source database (e.g., "file=<path>,format=dump").
    --source=!: Flag for specifying source database (e.g., PostgreSQL, MySQL, DynamoDB).
    --target-profile=!: Flag for specifying connection profile for target database (e.g., "dialect=postgresql)".
    --target=: 'Specifies the target database, defaults to Spanner (accepted values: Spanner) (default "Spanner").'
documentation:
