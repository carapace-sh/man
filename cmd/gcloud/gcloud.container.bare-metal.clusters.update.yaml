completion:
    flag:
        binauthz-evaluation-mode:
            - DISABLED
            - PROJECT_SINGLETON_POLICY_ENFORCE
documentation:
    command: Update an Anthos cluster on bare metal.
    flag:
        add-annotations: Add the given key-value pairs to the current annotations, or update its value if the key already exists.
        admin-users: Users that will be granted the cluster-admin role on the cluster, providing full access to the cluster.
        allow-missing: If set, and the Anthos cluster on bare metal is not found, the update request will try to create a new cluster with the provided configuration.
        api-server-args: API Server argument configuration.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        bgp-address-pools: |-
            BGP load balancer address pools configurations.
            +
            Examples:
            +
            To specify configurations for two address pools `pool1` and `pool2`,
            +
            ```
            $ {command} example_cluster
                  --bgp-address-pools 'pool=pool1,avoid-buggy-ips=True,manual-assign=True,addresses=192.168.1.1/32;192.168.1.2-192.168.1.3'
                  --bgp-address-pools 'pool=pool2,avoid-buggy-ips=False,manual-assign=False,addresses=192.168.2.1/32;192.168.2.2-192.168.2.3'
            ```
            +
            Use quote around the flag value to escape semicolon in the terminal.
        bgp-asn: BGP autonomous system number (ASN) of the cluster.
        bgp-load-balancer-node-configs: |-
            BGP load balancer data plane node configurations.
            +
            Examples:
            +
            To specify configurations for two nodes of IP `192.168.0.1` and `192.168.1.1`,
            +
            ```
            $ {command} example_cluster
                  --bgp-load-balancer-node-configs 'node-ip=192.168.0.1,labels=KEY1=VALUE1;KEY2=VALUE2'
                  --bgp-load-balancer-node-configs 'node-ip=192.168.1.1,labels=KEY3=VALUE3'
            ```
            +
            Use quote around the flag value to escape semicolon in the terminal.
        bgp-load-balancer-node-labels: Labels assigned to nodes of a BGP node pool.
        bgp-load-balancer-node-taints: Node taint applied to every Kubernetes node in a node pool.
        bgp-load-balancer-registry-burst: Maximum size of bursty pulls, temporarily allow pulls to burst to this number, while still not exceeding registry_pull_qps.
        bgp-load-balancer-registry-pull-qps: Limit of registry pulls per second.
        bgp-peer-configs: |-
            List of BGP peers that the cluster will connect to. At least one peer must be configured for each control plane node.
            +
            Examples:
            +
            To specify configurations for two peers of BGP autonomous system number (ASN) 10000 and 20000,
            +
            ```
            $ {command} example_cluster
                  --bgp-peer-configs 'asn=10000,ip=192.168.1.1,control-plane-nodes=192.168.1.2;192.168.1.3'
                  --bgp-peer-configs 'asn=20000,ip=192.168.2.1,control-plane-nodes=192.168.2.2;192.168.2.3'
            ```
            +
            Use quote around the flag value to escape semicolon in the terminal.
        binauthz-evaluation-mode: 'Set Binary Authorization evaluation mode for this cluster. _BINAUTHZ_EVALUATION_MODE_ must be one of: *DISABLED*, *PROJECT_SINGLETON_POLICY_ENFORCE*.'
        clear-annotations: Clear all the current annotations
        control-plane-node-configs: Control plane node configuration.
        control-plane-node-configs-from-file: |+
            Path of the YAML/JSON file that contains the control plane node configs.

            Examples:

              nodeConfigs:
              - nodeIP: 10.200.0.10
                labels:
                  node1: label1
                  node2: label2
              - nodeIP: 10.200.0.11
                labels:
                  node3: label3
                  node4: label4

            List of supported fields in `nodeConfigs`

            KEY           | VALUE                     | NOTE
            --------------|---------------------------|---------------------------
            nodeIP        | string                    | required, mutable
            labels        | one or more key-val pairs | optional, mutable

        control-plane-node-labels: Labels assigned to nodes of a node pool.
        control-plane-node-taints: Node taint applied to every Kubernetes node in a node pool.
        control-plane-registry-burst: Maximum size of bursty pulls, temporarily allow pulls to burst to this number, while still not exceeding registry_pull_qps.
        control-plane-registry-pull-qps: Limit of registry pulls per second.
        description: Description for the resource.
        disable-bgp-load-balancer-serialize-image-pulls: If set, prevent the Kubelet from pulling multiple images at a time.
        disable-control-plane-serialize-image-pulls: If set, prevent the Kubelet from pulling multiple images at a time.
        disable-metal-lb-load-balancer-serialize-image-pulls: If set, prevent the Kubelet from pulling multiple images at a time.
        disable-sr-iov-config: If set, the SR-IOV operator won't be installed.
        enable-application-logs: Whether collection of application logs/metrics should be enabled (in addition to system logs/metrics).
        enable-bgp-load-balancer-serialize-image-pulls: If set, enable the Kubelet to pull multiple images at a time.
        enable-control-plane-serialize-image-pulls: If set, enable the Kubelet to pull multiple images at a time.
        enable-metal-lb-load-balancer-serialize-image-pulls: If set, enable the Kubelet to pull multiple images at a time.
        enable-sr-iov-config: If set, install the SR-IOV operator.
        island-mode-service-address-cidr-blocks: IPv4 address range for all services in the cluster.
        location: |-
            Google Cloud location for the cluster.
            +
            To set the `location` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_bare_metal/location`.
        login-user: User name used to access node machines.
        maintenance-address-cidr-blocks: IPv4 addresses to be placed into maintenance mode.
        metal-lb-address-pools: |-
            MetalLB load balancer configurations.
            +
            Examples:
            +
            To specify MetalLB load balancer configurations for two address pools `pool1` and `pool2`,
            +
            ```
            $ {command} example_cluster
                  --metal-lb-address-pools 'pool=pool1,avoid-buggy-ips=True,manual-assign=True,addresses=192.168.1.1/32;192.168.1.2-192.168.1.3'
                  --metal-lb-address-pools 'pool=pool2,avoid-buggy-ips=False,manual-assign=False,addresses=192.168.2.1/32;192.168.2.2-192.168.2.3'
            ```
            +
            Use quote around the flag value to escape semicolon in the terminal.
        metal-lb-address-pools-from-file: |+
            Path of the YAML/JSON file that contains the MetalLB address pools.

            Examples:

              addressPools:
              - pool: pool-1
                addresses:
                - 10.200.0.14/32
                - 10.200.0.15/32
                avoidBuggyIPs: True
                manualAssign: True
              - pool: pool-2
                addresses:
                - 10.200.0.16/32
                avoidBuggyIPs: False
                manualAssign: False

            List of supported fields in `addressPools`

            KEY           | VALUE                 | NOTE
            --------------|-----------------------|---------------------------
            pool          | string                | required, mutable
            addresses     | one or more IP ranges | required, mutable
            avoidBuggyIPs | bool                  | optional, mutable, defaults to False
            manualAssign  | bool                  | optional, mutable, defaults to False

        metal-lb-load-balancer-node-configs: MetalLB load balancer node configuration.
        metal-lb-load-balancer-node-configs-from-file: |+
            Path of the YAML/JSON file that contains the Metal LB node configs.

            Examples:

              nodeConfigs:
              - nodeIP: 10.200.0.10
                labels:
                  node1: label1
                  node2: label2
              - nodeIP: 10.200.0.11
                labels:
                  node3: label3
                  node4: label4

            List of supported fields in `nodeConfigs`

            KEY           | VALUE                     | NOTE
            --------------|---------------------------|---------------------------
            nodeIP        | string                    | required, mutable
            labels        | one or more key-val pairs | optional, mutable

        metal-lb-load-balancer-node-labels: Labels assigned to nodes of a MetalLB node pool.
        metal-lb-load-balancer-node-taints: Node taint applied to every node in a MetalLB node pool.
        metal-lb-load-balancer-registry-burst: Maximum size of bursty pulls, temporarily allow pulls to burst to this number, while still not exceeding registry_pull_qps.
        metal-lb-load-balancer-registry-pull-qps: Limit of registry pulls per second.
        no-allow-missing: If set, and the Anthos cluster on bare metal is not found, the update request will try to create a new cluster with the provided configuration.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-annotations: Clear all the current annotations
        no-disable-bgp-load-balancer-serialize-image-pulls: If set, prevent the Kubelet from pulling multiple images at a time.
        no-disable-control-plane-serialize-image-pulls: If set, prevent the Kubelet from pulling multiple images at a time.
        no-disable-metal-lb-load-balancer-serialize-image-pulls: If set, prevent the Kubelet from pulling multiple images at a time.
        no-disable-sr-iov-config: If set, the SR-IOV operator won't be installed.
        no-enable-application-logs: Whether collection of application logs/metrics should be enabled (in addition to system logs/metrics).
        no-enable-bgp-load-balancer-serialize-image-pulls: If set, enable the Kubelet to pull multiple images at a time.
        no-enable-control-plane-serialize-image-pulls: If set, enable the Kubelet to pull multiple images at a time.
        no-enable-metal-lb-load-balancer-serialize-image-pulls: If set, enable the Kubelet to pull multiple images at a time.
        no-enable-sr-iov-config: If set, install the SR-IOV operator.
        no-validate-only: If set, only validate the request, but do not actually perform the operation.
        remove-annotations: Remove annotations of the given keys.
        set-annotations: Replace all the current annotations
        validate-only: If set, only validate the request, but do not actually perform the operation.
