name: stop-canary
description: Stops the canary to prevent all future runs.
flags:
    --name=!: The name of the canary that you want to stop.
documentation:
    command: |-
        Stops the canary to prevent all future runs. If the canary is currently running,the run that is in progress completes on its own, publishes metrics, and uploads artifacts, but it is not recorded in Synthetics as a completed run.

        You can use `StartCanary` to start it running again with the canary’s current schedule at any point in the future.
    flag:
        name: The name of the canary that you want to stop. To find the names of your canaries, use [ListCanaries](https://docs.aws.amazon.com/AmazonSynthetics/latest/APIReference/API_DescribeCanaries.html).
