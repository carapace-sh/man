name: create
description: '*(ALPHA)*  *(DEPRECATED)*  Create a Dataplex Datascan.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --data-profile-spec-file=: path to the JSON file containing the Data Profile Spec for the Data Profile Scan
    --data-quality-spec-file=: path to the JSON file containing the Data Quality Spec for the Data Quality Scan
    --data-source-entity=: 'Dataplex entity that contains the data for the Datascan, of the form: `projects/{project_number}/locations/{location_id}/lakes/{lake_id}/zones/{zone_id}/entities/{entity_id}`.'
    --data-source-resource=: 'Service-qualified full resource name of the cloud resource that contains the data for the Datascan, of the form: `//bigquery.googleapis.com/projects/{project_number}/datasets/{dataset_id}/tables/{table_id}`.'
    --description=: Description of the Datascan
    --display-name=: Display name of the Datascan
    --field=: Field that contains values that monotonically increase over time (e.g. timestamp).
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location of the Dataplex resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-validate-only&: Validate the create action, but don't actually perform it.
    --on-demand=: If set, the scan runs one-time shortly after Datascan Creation.
    --scan-type=!: Specify the type of scan.
    --schedule=: Cron schedule (https://en.wikipedia.org/wiki/Cron) for running scans periodically.
    --validate-only: Validate the create action, but don't actually perform it.
completion:
    flag:
        scan-type:
            - PROFILE
            - QUALITY
documentation:
    command: |+
        *(ALPHA)*  *(DEPRECATED)*  Create a Dataplex Datascan.

        This command is deprecated. Please use `gcloud alpha dataplex datascans create data-profile` instead to create a data profile scan and use `gcloud alpha dataplex datascans create data-quality` to create a data quality scan.

    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        data-profile-spec-file: path to the JSON file containing the Data Profile Spec for the Data Profile Scan
        data-quality-spec-file: path to the JSON file containing the Data Quality Spec for the Data Quality Scan
        data-source-entity: 'Dataplex entity that contains the data for the Datascan, of the form: `projects/{project_number}/locations/{location_id}/lakes/{lake_id}/zones/{zone_id}/entities/{entity_id}`.'
        data-source-resource: 'Service-qualified full resource name of the cloud resource that contains the data for the Datascan, of the form: `//bigquery.googleapis.com/projects/{project_number}/datasets/{dataset_id}/tables/{table_id}`.'
        description: Description of the Datascan
        display-name: Display name of the Datascan
        field: Field that contains values that monotonically increase over time (e.g. timestamp).
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location of the Dataplex resource.
            +
            To set the `location` attribute:
            * provide the argument `datascan` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-validate-only: Validate the create action, but don't actually perform it.
        on-demand: If set, the scan runs one-time shortly after Datascan Creation.
        scan-type: 'Specify the type of scan. _SCAN_TYPE_ must be one of: *PROFILE*, *QUALITY*.'
        schedule: 'Cron schedule (https://en.wikipedia.org/wiki/Cron) for running scans periodically. To explicitly set a timezone to the cron tab, apply a prefix in the cron tab: "CRON_TZ=${IANA_TIME_ZONE}" or "TZ=${IANA_TIME_ZONE}". The ${IANA_TIME_ZONE} may only be a valid string from IANA time zone database. For example, `CRON_TZ=America/New_York 1 * * * *` or `TZ=America/New_York 1 * * * *`. This field is required for RECURRING scans.'
        validate-only: Validate the create action, but don't actually perform it.
