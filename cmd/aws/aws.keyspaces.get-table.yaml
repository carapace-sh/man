name: get-table
description: Returns information about the table, including the table's name and current status, the keyspace name, configuration settings, and metadata.
flags:
    --keyspace-name=!: The name of the keyspace that the table is stored in.
    --table-name=!: The name of the table.
documentation:
    command: |-
        Returns information about the table, including the table's name and current status, the keyspace name, configuration settings, and metadata.

        To read table metadata using `GetTable`, the IAM principal needs `Select` action permissions for the table and the system keyspace.
    flag:
        keyspace-name: The name of the keyspace that the table is stored in.
        table-name: The name of the table.
