name: update-notification-settings
description: The `UpdateNotificationSettings` operation creates, updates, disables or re-enables notifications for a HIT type.
flags:
    --active: Specifies whether notifications are sent for HITs of this HIT type, according to the notification specification.
    --hittype-id=!: The ID of the HIT type whose notification specification is being updated.
    --no-active&: Specifies whether notifications are sent for HITs of this HIT type, according to the notification specification.
    --notification=: The notification specification for the HIT type.
documentation:
    command: The `UpdateNotificationSettings` operation creates, updates, disables or re-enables notifications for a HIT type. If you call the UpdateNotificationSettings operation for a HIT type that already has a notification specification, the operation replaces the old specification with a new one. You can call the UpdateNotificationSettings operation to enable or disable notifications for the HIT type, without having to modify the notification specification itself by providing updates to the Active status without specifying a new notification specification. To change the Active status of a HIT type's notifications, the HIT type must already have a notification specification, or one must be provided in the same call to `UpdateNotificationSettings`.
    flag:
        active: Specifies whether notifications are sent for HITs of this HIT type, according to the notification specification. You must specify either the Notification parameter or the Active parameter for the call to UpdateNotificationSettings to succeed.
        hittype-id: The ID of the HIT type whose notification specification is being updated.
        notification: The notification specification for the HIT type.
