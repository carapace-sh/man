name: init
description: '*(ALPHA)*  Initialize or reinitialize gcloud.'
flags:
    --console-only: Prevent the command from launching a browser for authorization.
    --no-browser: Prevent the command from launching a browser for authorization.
    --no-console-only&: Prevent the command from launching a browser for authorization.
    --no-launch-browser: Prevent the command from launching a browser for authorization.
    --no-skip-diagnostics&: Do not run diagnostics.
    --skip-diagnostics: Do not run diagnostics.
documentation:
    command: |-
        *(ALPHA)*  gcloud alpha init launches an interactive Getting Started workflow for the gcloud
        command-line tool.
        It performs the following setup steps:

        - Authorizes gcloud and other SDK tools to access Google Cloud using
          your user account credentials, or from an account of your choosing whose
          credentials are already available.
        - Sets up a new or existing configuration.
        - Sets properties in that configuration, including the current project and
          optionally, the default Google Compute Engine region and zone you'd like to
          use.

        gcloud alpha init can be used for initial setup of gcloud and to create new or
        reinitialize gcloud configurations. More information about configurations can
        be found by running `gcloud topic configurations`.

        Properties set by gcloud alpha init are local and persistent, and are not affected by
        remote changes to the project. For example, the default Compute Engine zone in
        your configuration remains stable, even if you or another user changes the
        project-level default zone in the Cloud Platform Console.

        To sync the configuration, re-run `gcloud alpha init`.

        ## EXAMPLES

        To launch an interactive Getting Started workflow, run:

          $ gcloud alpha init

        To launch an interactive Getting Started workflow without diagnostics, run:

          $ gcloud alpha init --skip-diagnostics
    flag:
        console-only: Prevent the command from launching a browser for authorization. Use this flag if you are on a machine that does not have a browser and you cannot install the gcloud CLI on another machine with a browser.
        no-browser: Prevent the command from launching a browser for authorization. Use this flag if you are on a machine that does not have a browser but you can install the gcloud CLI on another machine with a browser.
        no-console-only: Prevent the command from launching a browser for authorization. Use this flag if you are on a machine that does not have a browser and you cannot install the gcloud CLI on another machine with a browser.
        no-launch-browser: Prevent the command from launching a browser for authorization. Use this flag if you are on a machine that does not have a browser and you cannot install the gcloud CLI on another machine with a browser.
        no-skip-diagnostics: Do not run diagnostics.
        skip-diagnostics: Do not run diagnostics.
