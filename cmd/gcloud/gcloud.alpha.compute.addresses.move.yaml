name: move
description: '*(ALPHA)*  Move an address to another project.'
flags:
    --description=: Description of moved new address.
    --global: If set, the address is global.
    --new-name=: Name of moved new address.
    --no-global&: If set, the address is global.
    --region=: Region of the address to operate on.
    --target-project=!: The target project to move address to.
documentation:
    command: |-
        ## EXAMPLES

        The following command moves address `external-ip1` in region `us-central1` to
        project `test-playground` with new address name `test-ip1`:

           $ gcloud alpha compute addresses move external-ip1 --new-name=test-ip1
           --target-project=test-playground --region=us-central1
    flag:
        description: Description of moved new address.
        global: If set, the address is global.
        new-name: Name of moved new address. If not specified, current address's name is used.
        no-global: If set, the address is global.
        region: Region of the address to operate on. Overrides the default *compute/region* property value for this command invocation.
        target-project: The target project to move address to. It can be either a project name or a project numerical ID. It must not be the same as the current project.
