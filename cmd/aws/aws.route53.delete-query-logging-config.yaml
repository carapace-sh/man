name: delete-query-logging-config
description: Deletes a configuration for DNS query logging.
flags:
    --id=!: The ID of the configuration that you want to delete.
documentation:
    command: |-
        Deletes a configuration for DNS query logging. If you delete a configuration, Amazon Route 53 stops sending query logs to CloudWatch Logs. Route 53 doesn't delete any logs that are already in CloudWatch Logs.

        For more information about DNS query logs, see [CreateQueryLoggingConfig](https://docs.aws.amazon.com/Route53/latest/APIReference/API_CreateQueryLoggingConfig.html).
    flag:
        id: The ID of the configuration that you want to delete.
