name: alter-metadata-resource-location
description: '*(ALPHA)*  Alter metadata resource location.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location-uri=!: The new location URI for the metadata resource.
    --location=: The location of the Dataproc Metastore service.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --resource-name=!: The relative metadata resource name in the following format.
documentation:
    command: |
        *(ALPHA)*  Alter metadata resource location from a Dataproc Metastore service's underlying metadata store.

        If run asynchronously with `--async`, exits after printing
        one operation name that can be used to poll the status of the
        creation via:

          {top_command} metastore operations describe
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location of the Dataproc Metastore service.
            +
            If not specified, will use `default` metastore/location.
            +

            To set the `location` attribute:
            * provide the argument `service` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `metastore/location`.
        location-uri: The new location URI for the metadata resource.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        resource-name: |-
            The relative metadata resource name in the following format.
             `databases/{database_id}`
             or
             `databases/{database_id}/tables/{table_id}`
             or
             `databases/{database_id}/tables/{table_id}/partitions/{partition_id}`
