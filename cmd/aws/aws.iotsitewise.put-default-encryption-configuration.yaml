name: put-default-encryption-configuration
description: Sets the default encryption configuration for the Amazon Web Services account.
flags:
    --encryption-type=!: The type of encryption used for the encryption configuration.
    --kms-key-id=: The Key ID of the customer managed key used for KMS encryption.
completion:
    flag:
        encryption-type:
            - SITEWISE_DEFAULT_ENCRYPTION
            - KMS_BASED_ENCRYPTION
documentation:
    command: Sets the default encryption configuration for the Amazon Web Services account. For more information, see [Key management](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/key-management.html) in the *IoT SiteWise User Guide*.
    flag:
        encryption-type: The type of encryption used for the encryption configuration.
        kms-key-id: The Key ID of the customer managed key used for KMS encryption. This is required if you use `KMS_BASED_ENCRYPTION`.
