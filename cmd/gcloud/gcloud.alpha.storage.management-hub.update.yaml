name: update
description: '*(ALPHA)*  *(DEPRECATED)*  Updates Management Hub.'
flags:
    --exclude-bucket-id-regexes=: Sets filter for bucket id regexes to exclude.
    --exclude-bucket-ids=: Comma separated list of bucket ids to exclude in the management hub filter.
    --exclude-locations=: Comma separated list of [locations](https://cloud.google.com/storage/docs/locations#available-locations) to exclude in Management Hub filter.
    --include-bucket-id-regexes=: Sets filter for bucket id regexes to include.
    --include-bucket-ids=: Comma separated list of bucket ids to include in the management hub filter.
    --include-locations=: Comma separated list of [locations](https://cloud.google.com/storage/docs/locations#available-locations) to include in management hub filter.
    --inherit-from-parent: Specifies management hub config to be inherited from parent.
    --no-inherit-from-parent&: Specifies management hub config to be inherited from parent.
    --organization=: Specifies organization id for the management hub.
    --sub-folder=: Specifies sub-folder id for the management hub.
documentation:
    command: |4
        *(ALPHA)*  *(DEPRECATED)*  This command group is deprecated. Use `gcloud alpha storage intelligence-configs` command group instead.


        Update management hub plan for the organization, sub-folder
         or project.
    flag:
        exclude-bucket-id-regexes: Sets filter for bucket id regexes to exclude. Accepts list of bucket id regexes in comma separated format. If the regex contains special characters that may have a specific meaning in the shell, escape them using backslashes(\). To clear bucket id regexes list, provide flag with an empty list. e.g `--exclude-bucket-id-regexes=""` or `--exclude-bucket-id-regexes=` .
        exclude-bucket-ids: Comma separated list of bucket ids to exclude in the management hub filter. To clear bucket id list, provide flag with an empty list. e.g `--exclude-bucket-ids=""` or `--exclude-bucket-ids=` .
        exclude-locations: Comma separated list of [locations](https://cloud.google.com/storage/docs/locations#available-locations) to exclude in Management Hub filter. To clear excluded locations, provide flag with empty list. e.g `--exclude-locations=""` or `--exclude-locations=` .
        include-bucket-id-regexes: Sets filter for bucket id regexes to include. Accepts list of bucket id regexes in comma separated format. If the regex contains special characters that may have a specific meaning in the shell, escape them using backslashes(\). To clear bucket id regexes list, provide flag with empty list. e.g `--include-bucket-id-regexes=""` or `--include-bucket-id-regexes=` .
        include-bucket-ids: Comma separated list of bucket ids to include in the management hub filter. To clear bucket id list, provide flag with empty list. e.g `--include-bucket-ids=""` or `--include-bucket-ids=` .
        include-locations: Comma separated list of [locations](https://cloud.google.com/storage/docs/locations#available-locations) to include in management hub filter. To clear included locations, provide flag with empty list. e.g `--include-locations=""` or `--include-locations=` .
        inherit-from-parent: Specifies management hub config to be inherited from parent.
        no-inherit-from-parent: Specifies management hub config to be inherited from parent.
        organization: Specifies organization id for the management hub.
        sub-folder: Specifies sub-folder id for the management hub.
