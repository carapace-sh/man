name: delete-service
description: Deletes an Amazon Web Services Migration Hub Refactor Spaces service.
flags:
    --application-identifier=!: Deletes a Refactor Spaces service.
    --environment-identifier=!: The ID of the environment that the service is in.
    --service-identifier=!: The ID of the service to delete.
documentation:
    command: Deletes an Amazon Web Services Migration Hub Refactor Spaces service.
    flag:
        application-identifier: |-
            Deletes a Refactor Spaces service.

            The `RefactorSpacesSecurityGroup` security group must be removed from all Amazon Web Services resources in the virtual private cloud (VPC) prior to deleting a service with a URL endpoint in a VPC.
        environment-identifier: The ID of the environment that the service is in.
        service-identifier: The ID of the service to delete.
