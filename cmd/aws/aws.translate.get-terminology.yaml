name: get-terminology
description: Retrieves a custom terminology.
flags:
    --name=!: The name of the custom terminology being retrieved.
    --terminology-data-format=: The data format of the custom terminology being retrieved.
completion:
    flag:
        terminology-data-format:
            - CSV
            - TMX
            - TSV
documentation:
    command: Retrieves a custom terminology.
    flag:
        name: The name of the custom terminology being retrieved.
        terminology-data-format: |-
            The data format of the custom terminology being retrieved.

            If you don't specify this parameter, Amazon Translate returns a file with the same format as the file that was imported to create the terminology.

            If you specify this parameter when you retrieve a multi-directional terminology resource, you must specify the same format as the input file that was imported to create it. Otherwise, Amazon Translate throws an error.
