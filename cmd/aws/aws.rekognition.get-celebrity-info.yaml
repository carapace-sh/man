name: get-celebrity-info
description: Gets the name and additional information about a celebrity based on their Amazon Rekognition ID.
flags:
    --id=!: The ID for the celebrity.
documentation:
    command: |-
        Gets the name and additional information about a celebrity based on their Amazon Rekognition ID. The additional information is returned as an array of URLs. If there is no additional information about the celebrity, this list is empty.

        For more information, see Getting information about a celebrity in the Amazon Rekognition Developer Guide.

        This operation requires permissions to perform the `rekognition:GetCelebrityInfo` action.
    flag:
        id: The ID for the celebrity. You get the celebrity ID from a call to the [RecognizeCelebrities]() operation, which recognizes celebrities in an image.
