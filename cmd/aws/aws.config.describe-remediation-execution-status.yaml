name: describe-remediation-execution-status
description: Provides a detailed view of a Remediation Execution for a set of resources including state, timestamps for when steps for the remediation execution occur, and any error messages for steps that have failed.
flags:
    --config-rule-name=!: The name of the Config rule.
    --limit=: The maximum number of RemediationExecutionStatuses returned on each page.
    --next-token=: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
    --resource-keys=: A list of resource keys to be processed with the current request.
documentation:
    command: Provides a detailed view of a Remediation Execution for a set of resources including state, timestamps for when steps for the remediation execution occur, and any error messages for steps that have failed. When you specify the limit and the next token, you receive a paginated response.
    flag:
        config-rule-name: The name of the Config rule.
        limit: The maximum number of RemediationExecutionStatuses returned on each page. The default is maximum. If you specify 0, Config uses the default.
        next-token: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
        resource-keys: A list of resource keys to be processed with the current request. Each element in the list consists of the resource type and resource ID.
