name: du
description: '*(ALPHA)*  Displays the amount of space in bytes used by storage resources.'
flags:
    --additional-headers=: Includes arbitrary headers in storage API calls.
    --all-versions: Includes noncurrent object versions for a bucket with Object Versioning enabled.
    --exclude-name-pattern-file=: Similar to -e, but excludes patterns from the given file.
    --exclude-name-pattern=: Exclude a pattern from the report.
    --metadata-filter=: Server side filtering for objects.
    --readable-sizes: Prints object sizes in human-readable format.
    --summarize: Displays only the summary for each argument.
    --total: Includes a total size of all input sources.
    --zero-terminator: Ends each output line with a 0 byte rather than a newline.
documentation:
    command: |
        *(ALPHA)*  Displays the amount of space in bytes used by the objects in a bucket,
        subdirectory, or project. This command calculates the current space usage
        by making a series of object listing requests, which can take a long time
        for large buckets. If your bucket contains hundreds of thousands of
        objects, or if you want to monitor your bucket size over time, use
        Monitoring instead, as described in [Get bucket size](https://cloud.google.com/storage/docs/getting-bucket-size)
    flag:
        additional-headers: Includes arbitrary headers in storage API calls. Accepts a comma separated list of key=value pairs, e.g. `header1=value1,header2=value2`. Overrides the default *storage/additional_headers* property value for this command invocation.
        all-versions: Includes noncurrent object versions for a bucket with Object Versioning enabled. Also prints the generation and metageneration number for each listed object.
        exclude-name-pattern: 'Exclude a pattern from the report. Example: `-e "*.o"` excludes any object that ends in ".o". Can be specified multiple times.'
        exclude-name-pattern-file: Similar to -e, but excludes patterns from the given file. The patterns to exclude should be listed one per line.
        metadata-filter: Server side filtering for objects. Works only for Google Cloud Storage URLs. The filter only works for objects, and not directories or buckets, which means commands like `storage ls` and `storage du` will still list directories or buckets even if they do not contain any objects matching the filter. See https://cloud.google.com/storage/docs/listing-objects#filter-by-object-contexts-syntax for more details.
        readable-sizes: Prints object sizes in human-readable format. For example, 1 KiB, 234 MiB, or 2GiB.
        summarize: Displays only the summary for each argument.
        total: Includes a total size of all input sources.
        zero-terminator: Ends each output line with a 0 byte rather than a newline. You can use this to make the output machine-readable.
