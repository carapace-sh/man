name: populate-id-mapping-table
description: Defines the information that's necessary to populate an ID mapping table.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --id-mapping-table-identifier=!: The unique identifier of the ID mapping table that you want to populate.
    --job-type=: The job type of the rule-based ID mapping job.
    --membership-identifier=!: The unique identifier of the membership that contains the ID mapping table that you want to populate.
completion:
    flag:
        job-type:
            - BATCH
            - INCREMENTAL
            - DELETE_ONLY
documentation:
    command: Defines the information that's necessary to populate an ID mapping table.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        id-mapping-table-identifier: The unique identifier of the ID mapping table that you want to populate.
        job-type: |-
            The job type of the rule-based ID mapping job. Valid values include:

            `INCREMENTAL`: Processes only new or changed data since the last job run. This is the default job type if the ID mapping workflow was created in Entity Resolution with `incrementalRunConfig` specified.

            `BATCH`: Processes all data from the input source, regardless of previous job runs. This is the default job type if the ID mapping workflow was created in Entity Resolution but `incrementalRunConfig` wasn't specified.

            `DELETE_ONLY`: Processes only deletion requests from `BatchDeleteUniqueId`, which is set in Entity Resolution.

            For more information about `incrementalRunConfig` and `BatchDeleteUniqueId`, see the [Entity Resolution API Reference](https://docs.aws.amazon.com/entityresolution/latest/apireference/Welcome.html).
        membership-identifier: The unique identifier of the membership that contains the ID mapping table that you want to populate.
