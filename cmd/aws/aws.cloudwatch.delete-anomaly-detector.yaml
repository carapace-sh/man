name: delete-anomaly-detector
description: Deletes the specified anomaly detection model from your account.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dimensions=:
        description: The metric dimensions associated with the anomaly detection model to delete.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --metric-math-anomaly-detector=: The metric math anomaly detector to be deleted.
    --metric-name=: The metric name associated with the anomaly detection model to delete.
    --namespace=: The namespace associated with the anomaly detection model to delete.
    --single-metric-anomaly-detector=: A single metric anomaly detector to be deleted.
    --stat=: The statistic associated with the anomaly detection model to delete.
documentation:
    command: Deletes the specified anomaly detection model from your account. For more information about how to delete an anomaly detection model, see [Deleting an anomaly detection model](https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Create_Anomaly_Detection_Alarm.html#Delete_Anomaly_Detection_Model) in the *CloudWatch User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dimensions: The metric dimensions associated with the anomaly detection model to delete.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        metric-math-anomaly-detector: |-
            The metric math anomaly detector to be deleted.

            When using `MetricMathAnomalyDetector`, you cannot include following parameters in the same operation:

            - `Dimensions`,
            - `MetricName`
            - `Namespace`
            - `Stat`
            - the `SingleMetricAnomalyDetector` parameters of `DeleteAnomalyDetectorInput`

            Instead, specify the metric math anomaly detector attributes as part of the `MetricMathAnomalyDetector` property.
        metric-name: The metric name associated with the anomaly detection model to delete.
        namespace: The namespace associated with the anomaly detection model to delete.
        single-metric-anomaly-detector: |-
            A single metric anomaly detector to be deleted.

            When using `SingleMetricAnomalyDetector`, you cannot include the following parameters in the same operation:

            - `Dimensions`,
            - `MetricName`
            - `Namespace`
            - `Stat`
            - the `MetricMathAnomalyDetector` parameters of `DeleteAnomalyDetectorInput`

            Instead, specify the single metric anomaly detector attributes as part of the `SingleMetricAnomalyDetector` property.
        stat: The statistic associated with the anomaly detection model to delete.
