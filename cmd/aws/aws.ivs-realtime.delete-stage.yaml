name: delete-stage
description: Shuts down and deletes the specified stage (disconnecting all participants).
flags:
    --arn=!: ARN of the stage to be deleted.
documentation:
    command: Shuts down and deletes the specified stage (disconnecting all participants). This operation also removes the `stageArn` from the associated [IngestConfiguration](), if there are participants using the IngestConfiguration to publish to the stage.
    flag:
        arn: ARN of the stage to be deleted.
