name: resume
description: '*(ALPHA)*  Resume a rollout resource.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-validate-only&: Generate a new schedule without actually resuming the rollout.
    --schedule-offset=: Offset to shift the schedule by when resuming a paused rollout, e.g. `8h`, `7d12h`.
    --validate-only: Generate a new schedule without actually resuming the rollout.
documentation:
    command: '*(ALPHA)*  Resume a rollout resource.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-validate-only: |
            Generate a new schedule without actually resuming the rollout.
        schedule-offset: |-
            Offset to shift the schedule by when resuming a paused rollout, e.g. `8h`, `7d12h`.
            +
            See $ gcloud topic datetimes for information on duration formats.
        validate-only: Generate a new schedule without actually resuming the rollout.
