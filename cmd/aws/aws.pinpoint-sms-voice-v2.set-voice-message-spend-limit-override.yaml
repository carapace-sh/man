name: set-voice-message-spend-limit-override
description: Sets an account level monthly spend limit override for sending voice messages.
flags:
    --monthly-limit=!: The new monthly limit to enforce on voice messages.
documentation:
    command: Sets an account level monthly spend limit override for sending voice messages. The requested spend limit must be less than or equal to the `MaxLimit`, which is set by Amazon Web Services.
    flag:
        monthly-limit: The new monthly limit to enforce on voice messages.
