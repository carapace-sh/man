name: tag-resource
description: Applies tag values to a behavior graph.
flags:
    --resource-arn=!: The ARN of the behavior graph to assign the tags to.
    --tags=!: The tags to assign to the behavior graph.
documentation:
    command: Applies tag values to a behavior graph.
    flag:
        resource-arn: The ARN of the behavior graph to assign the tags to.
        tags: The tags to assign to the behavior graph. You can add up to 50 tags. For each tag, you provide the tag key and the tag value. Each tag key can contain up to 128 characters. Each tag value can contain up to 256 characters.
