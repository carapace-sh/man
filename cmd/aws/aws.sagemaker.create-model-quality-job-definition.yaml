name: create-model-quality-job-definition
description: Creates a definition for a job that monitors model quality and drift.
flags:
    --job-definition-name=!: The name of the monitoring job definition.
    --job-resources=!: ""
    --model-quality-app-specification=!: The container that runs the monitoring job.
    --model-quality-baseline-config=: Specifies the constraints and baselines for the monitoring job.
    --model-quality-job-input=!: A list of the inputs that are monitored.
    --model-quality-job-output-config=!: ""
    --network-config=: Specifies the network configuration for the monitoring job.
    --role-arn=!: The Amazon Resource Name (ARN) of an IAM role that Amazon SageMaker AI can assume to perform tasks on your behalf.
    --stopping-condition=: ""
    --tags=: (Optional) An array of key-value pairs.
documentation:
    command: Creates a definition for a job that monitors model quality and drift. For information about model monitor, see [Amazon SageMaker AI Model Monitor](https://docs.aws.amazon.com/sagemaker/latest/dg/model-monitor.html).
    flag:
        job-definition-name: The name of the monitoring job definition.
        job-resources: ""
        model-quality-app-specification: The container that runs the monitoring job.
        model-quality-baseline-config: Specifies the constraints and baselines for the monitoring job.
        model-quality-job-input: A list of the inputs that are monitored. Currently endpoints are supported.
        model-quality-job-output-config: ""
        network-config: Specifies the network configuration for the monitoring job.
        role-arn: The Amazon Resource Name (ARN) of an IAM role that Amazon SageMaker AI can assume to perform tasks on your behalf.
        stopping-condition: ""
        tags: (Optional) An array of key-value pairs. For more information, see [Using Cost Allocation Tags](https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-alloc-tags.html#allocation-whatURL) in the *Amazon Web Services Billing and Cost Management User Guide*.
