name: add-instances
description: '*(BETA)*  Adds instances to an unmanaged instance group by name.'
flags:
    --instances=!: A list of names of instances to add to the instance group.
    --zone=: Zone of the instance group to operate on.
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute instance-groups unmanaged add-instances* adds existing instances to an unmanaged instance group
        by name.
        For example:

          $ gcloud beta compute instance-groups unmanaged add-instances my-group \
              --instances my-instance-1,my-instance-2 --zone us-central1-a
    flag:
        instances: A list of names of instances to add to the instance group. These must exist beforehand and must live in the same zone as the instance group.
        zone: |-
            Zone of the instance group to operate on. If not specified and the ``compute/zone'' property isn't set, you
            might be prompted to select a zone (interactive mode only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
