name: update-resource
description: Updates data for the resource.
flags:
    --booking-options=: The resource's booking options to be updated.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: Updates the resource description.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --hidden-from-global-address-list: If enabled, the resource is hidden from the global address list.
    --name=: The name of the resource to be updated.
    --no-hidden-from-global-address-list: If enabled, the resource is hidden from the global address list.
    --organization-id=!: The identifier associated with the organization for which the resource is updated.
    --resource-id=!: The identifier of the resource to be updated.
    --type=: Updates the resource type.
completion:
    flag:
        type:
            - ROOM
            - EQUIPMENT
documentation:
    command: Updates data for the resource. To have the latest information, it must be preceded by a [DescribeResource]() call. The dataset in the request should be the one expected when performing another `DescribeResource` call.
    flag:
        booking-options: The resource's booking options to be updated.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: Updates the resource description.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        hidden-from-global-address-list: If enabled, the resource is hidden from the global address list.
        name: The name of the resource to be updated.
        organization-id: The identifier associated with the organization for which the resource is updated.
        resource-id: |-
            The identifier of the resource to be updated.

            The identifier can accept *ResourceId*, *Resourcename*, or *email*. The following identity formats are available:

            - Resource ID: r-0123456789a0123456789b0123456789
            - Email address: resource@domain.tld
            - Resource name: resource
        type: Updates the resource type.
