name: list-dead-letter-source-queues
description: Returns a list of your queues that have the `RedrivePolicy` queue attribute configured with a dead-letter queue.
flags:
    --max-results=: Maximum number of results to include in the response.
    --next-token=: Pagination token to request the next set of results.
    --queue-url=!: The URL of a dead-letter queue.
documentation:
    command: |-
        Returns a list of your queues that have the `RedrivePolicy` queue attribute configured with a dead-letter queue.

        The `ListDeadLetterSourceQueues` methods supports pagination. Set parameter `MaxResults` in the request to specify the maximum number of results to be returned in the response. If you do not set `MaxResults`, the response includes a maximum of 1,000 results. If you set `MaxResults` and there are additional results to display, the response includes a value for `NextToken`. Use `NextToken` as a parameter in your next request to `ListDeadLetterSourceQueues` to receive the next page of results.

        For more information about using dead-letter queues, see [Using Amazon SQS Dead-Letter Queues](https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html) in the *Amazon SQS Developer Guide*.
    flag:
        max-results: Maximum number of results to include in the response. Value range is 1 to 1000. You must set `MaxResults` to receive a value for `NextToken` in the response.
        next-token: Pagination token to request the next set of results.
        queue-url: |-
            The URL of a dead-letter queue.

            Queue URLs and names are case-sensitive.
