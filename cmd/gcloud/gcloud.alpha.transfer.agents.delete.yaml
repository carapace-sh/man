name: delete
description: '*(ALPHA)*  Delete Transfer Service transfer agents.'
flags:
    --all: Delete all agents running on your machine.
    --container-manager=: The container manager to use for running agents.
    --ids=: The IDs of the agents you want to delete.
    --no-all&: Delete all agents running on your machine.
    --no-uninstall&: Fully uninstall the agent container image in addition to deleting the agents.
    --uninstall: Fully uninstall the agent container image in addition to deleting the agents.
completion:
    flag:
        container-manager:
            - docker
            - podman
documentation:
    command: |
        *(ALPHA)*  Delete Transfer Service agents from your machine.
    flag:
        all: Delete all agents running on your machine.
        container-manager: 'The container manager to use for running agents. _CONTAINER_MANAGER_ must be one of: *docker*, *podman*.'
        ids: The IDs of the agents you want to delete. Separate multiple agent IDs with commas, with no spaces following the commas.
        no-all: Delete all agents running on your machine.
        no-uninstall: Fully uninstall the agent container image in addition to deleting the agents. Uninstalling the container image will free up space, but you'll need to reinstall it to run agents on this machine in the future.
        uninstall: Fully uninstall the agent container image in addition to deleting the agents. Uninstalling the container image will free up space, but you'll need to reinstall it to run agents on this machine in the future.
