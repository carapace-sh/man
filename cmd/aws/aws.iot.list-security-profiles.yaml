name: list-security-profiles
description: Lists the Device Defender security profiles you've created.
flags:
    --dimension-name=: A filter to limit results to the security profiles that use the defined dimension.
    --max-results=: The maximum number of results to return at one time.
    --metric-name=: The name of the custom metric.
    --next-token=: The token for the next set of results.
documentation:
    command: |-
        Lists the Device Defender security profiles you've created. You can filter security profiles by dimension or custom metric.

        Requires permission to access the [ListSecurityProfiles](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.

        `dimensionName` and `metricName` cannot be used in the same request.
    flag:
        dimension-name: A filter to limit results to the security profiles that use the defined dimension. Cannot be used with `metricName`
        max-results: The maximum number of results to return at one time.
        metric-name: The name of the custom metric. Cannot be used with `dimensionName`.
        next-token: The token for the next set of results.
