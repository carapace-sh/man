name: list-participant-replicas
description: Lists all the replicas for a participant from a source stage.
flags:
    --max-results=: Maximum number of results to return.
    --next-token=: The first participant to retrieve.
    --participant-id=!: Participant ID of the publisher that has been replicated.
    --source-stage-arn=!: ARN of the stage where the participant is publishing.
documentation:
    command: Lists all the replicas for a participant from a source stage.
    flag:
        max-results: 'Maximum number of results to return. Default: 50.'
        next-token: The first participant to retrieve. This is used for pagination; see the `nextToken` response field.
        participant-id: Participant ID of the publisher that has been replicated. This is assigned by IVS and returned by [CreateParticipantToken]() or the `jti` (JWT ID) used to [create a self signed token](https://docs.aws.amazon.com/ivs/latest/RealTimeUserGuide/getting-started-distribute-tokens.html#getting-started-distribute-tokens-self-signed).
        source-stage-arn: ARN of the stage where the participant is publishing.
