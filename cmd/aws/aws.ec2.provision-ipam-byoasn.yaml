name: provision-ipam-byoasn
description: Provisions your Autonomous System Number (ASN) for use in your Amazon Web Services account.
flags:
    --asn-authorization-context=!: An ASN authorization context.
    --asn=!: A public 2-byte or 4-byte ASN.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --ipam-id=!: An IPAM ID.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: 'Provisions your Autonomous System Number (ASN) for use in your Amazon Web Services account. This action requires authorization context for Amazon to bring the ASN to an Amazon Web Services account. For more information, see [Tutorial: Bring your ASN to IPAM](https://docs.aws.amazon.com/vpc/latest/ipam/tutorials-byoasn.html) in the *Amazon VPC IPAM guide*.'
    flag:
        asn: A public 2-byte or 4-byte ASN.
        asn-authorization-context: An ASN authorization context.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        ipam-id: An IPAM ID.
