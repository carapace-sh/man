name: search-analyses
description: Searches for analyses that belong to the user specified in the filter.
flags:
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the analyses that you're searching for.
    --filters=!: The structure for the search filters that you want to apply to your search.
    --max-results=: The maximum number of results to return.
    --next-token=: A pagination token that can be used in a subsequent request.
documentation:
    command: |-
        Searches for analyses that belong to the user specified in the filter.

        This operation is eventually consistent. The results are best effort and may not reflect very recent updates and changes.
    flag:
        aws-account-id: The ID of the Amazon Web Services account that contains the analyses that you're searching for.
        filters: The structure for the search filters that you want to apply to your search.
        max-results: The maximum number of results to return.
        next-token: A pagination token that can be used in a subsequent request.
