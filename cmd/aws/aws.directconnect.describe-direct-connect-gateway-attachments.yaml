name: describe-direct-connect-gateway-attachments
description: Lists the attachments between your Direct Connect gateways and virtual interfaces.
flags:
    --direct-connect-gateway-id=: The ID of the Direct Connect gateway.
    --max-results=: The maximum number of results to return with a single call.
    --next-token=: The token provided in the previous call to retrieve the next page.
    --virtual-interface-id=: The ID of the virtual interface.
documentation:
    command: Lists the attachments between your Direct Connect gateways and virtual interfaces. You must specify a Direct Connect gateway, a virtual interface, or both. If you specify a Direct Connect gateway, the response contains all virtual interfaces attached to the Direct Connect gateway. If you specify a virtual interface, the response contains all Direct Connect gateways attached to the virtual interface. If you specify both, the response contains the attachment between the Direct Connect gateway and the virtual interface.
    flag:
        direct-connect-gateway-id: The ID of the Direct Connect gateway.
        max-results: |-
            The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned `nextToken` value.

            If `MaxResults` is given a value larger than 100, only 100 results are returned.
        next-token: The token provided in the previous call to retrieve the next page.
        virtual-interface-id: The ID of the virtual interface.
