name: export
description: '*(BETA)*  Export the Binary Authorization policy for the current project.'
documentation:
    command: |-
        *(BETA)*  This function's default output is a valid policy YAML file. If dumped to a
        file and edited, the new policy can be provided to the `$ gcloud beta container binauthz policy
        import` command to cause these edits to be reflected in the project policy.

        ## EXAMPLES

        To export the current project's policy:

            $ gcloud beta container binauthz policy export > my_policy.yaml
