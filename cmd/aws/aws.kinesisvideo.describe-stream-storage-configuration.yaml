name: describe-stream-storage-configuration
description: Retrieves the current storage configuration for the specified Kinesis video stream.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --stream-arn=: The Amazon Resource Name (ARN) of the stream for which you want to retrieve the storage configuration.
    --stream-name=: The name of the stream for which you want to retrieve the storage configuration.
documentation:
    command: |-
        Retrieves the current storage configuration for the specified Kinesis video stream.

        In the request, you must specify either the `StreamName` or the `StreamARN`.

        You must have permissions for the `KinesisVideo:DescribeStreamStorageConfiguration` action.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
