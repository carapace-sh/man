name: delete
description: '*(DEPRECATED)*  Delete a node pool in an Anthos cluster on AWS.'
flags:
    --allow-missing: Allow idempotent deletion of node pool.
    --async: Return immediately, without waiting for the operation in progress to
    --cluster=: cluster of the node_pool.
    --ignore-errors: Force delete an AWS node pool.
    --location=: Google Cloud location for the node_pool.
    --no-allow-missing&: Allow idempotent deletion of node pool.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-ignore-errors&: Force delete an AWS node pool.
    --no-validate-only&: Validate the node pool to delete, but don't actually perform it.
    --validate-only: Validate the node pool to delete, but don't actually perform it.
documentation:
    command: |+
        *(DEPRECATED)*  Delete a node pool in an Anthos cluster on AWS.

        This command is deprecated. See https://cloud.google.com/kubernetes-engine/multi-cloud/docs/aws/deprecations/deprecation-announcement for more details.

    flag:
        allow-missing: |-
            Allow idempotent deletion of node pool.
              The request will still succeed in case the node pool does not exist.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        cluster: |-
            cluster of the node_pool.
            +
            To set the `cluster` attribute:
            * provide the argument `node_pool` on the command line with a fully specified name;
            * provide the argument `--cluster` on the command line.
        ignore-errors: |-
            Force delete an AWS node pool.
              Deletion of the AWS node pool will succeed even if errors occur
              during deleting in-node pool resources. Using this parameter may
              result in orphaned resources in the node pool.
        location: |-
            Google Cloud location for the node_pool.
            +
            To set the `location` attribute:
            * provide the argument `node_pool` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_aws/location`.
        no-allow-missing: |
            Allow idempotent deletion of node pool.
              The request will still succeed in case the node pool does not exist.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-ignore-errors: |
            Force delete an AWS node pool.
              Deletion of the AWS node pool will succeed even if errors occur
              during deleting in-node pool resources. Using this parameter may
              result in orphaned resources in the node pool.
        no-validate-only: Validate the node pool to delete, but don't actually perform it.
        validate-only: Validate the node pool to delete, but don't actually perform it.
