name: list-simulations
description: Lists the SimSpace Weaver simulations in the Amazon Web Services account used to make the API call.
flags:
    --max-results=: The maximum number of simulations to list.
    --next-token=: If SimSpace Weaver returns `nextToken`, then there are more results available.
documentation:
    command: Lists the SimSpace Weaver simulations in the Amazon Web Services account used to make the API call.
    flag:
        max-results: The maximum number of simulations to list.
        next-token: If SimSpace Weaver returns `nextToken`, then there are more results available. The value of `nextToken` is a unique pagination token for each page. To retrieve the next page, call the operation again using the returned token. Keep all other arguments unchanged. If no results remain, then `nextToken` is set to `null`. Each pagination token expires after 24 hours. If you provide a token that isn't valid, then you receive an *HTTP 400 ValidationException* error.
