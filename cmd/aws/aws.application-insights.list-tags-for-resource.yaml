name: list-tags-for-resource
description: Retrieve a list of the tags (keys and values) that are associated with a specified application.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the application that you want to retrieve tag information for.
documentation:
    command: Retrieve a list of the tags (keys and values) that are associated with a specified application. A *tag* is a label that you optionally define and associate with an application. Each tag consists of a required *tag key* and an optional associated *tag value*. A tag key is a general label that acts as a category for more specific tag values. A tag value acts as a descriptor within a tag key.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the application that you want to retrieve tag information for.
