name: update-job
description: Updates an existing job definition.
flags:
    --job-name=!: The name of the job definition to update.
    --job-update=!: Specifies the values with which to update the job definition.
documentation:
    command: Updates an existing job definition. The previous job definition is completely overwritten by this information.
    flag:
        job-name: The name of the job definition to update.
        job-update: Specifies the values with which to update the job definition. Unspecified configuration is removed or reset to default values.
