name: retrieve-memory-records
description: Searches for and retrieves memory records from an AgentCore Memory resource based on specified search criteria.
flags:
    --max-results=: The maximum number of results to return in a single call.
    --memory-id=!: The identifier of the AgentCore Memory resource from which to retrieve memory records.
    --namespace=!: The namespace to filter memory records by.
    --next-token=: The token for the next set of results.
    --search-criteria=!: The search criteria to use for finding relevant memory records.
documentation:
    command: |-
        Searches for and retrieves memory records from an AgentCore Memory resource based on specified search criteria. We recommend using pagination to ensure that the operation returns quickly and successfully.

        To use this operation, you must have the `bedrock-agentcore:RetrieveMemoryRecords` permission.
    flag:
        max-results: The maximum number of results to return in a single call. Minimum value of 1, maximum value of 100. Default is 20.
        memory-id: The identifier of the AgentCore Memory resource from which to retrieve memory records.
        namespace: The namespace to filter memory records by. If specified, only memory records in this namespace are searched.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        search-criteria: The search criteria to use for finding relevant memory records. This includes the search query, memory strategy ID, and other search parameters.
