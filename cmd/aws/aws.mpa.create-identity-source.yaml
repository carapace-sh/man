            This may  not  be  specified  along with --cli-input-yaml.
        identity-source-parameters: A `IdentitySourceParameters` object. Contains details for the resource that provides identities to the identity source. For example, an IAM Identity Center instance.
        tags: Tag you want to attach to the identity source.
