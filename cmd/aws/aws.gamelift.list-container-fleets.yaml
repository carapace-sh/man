name: list-container-fleets
description: Retrieves a collection of container fleet resources in an Amazon Web Services Region.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --container-group-definition-name=: The container group definition to filter the list on.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --limit=: The maximum number of results to return.
    --max-items=: The  total number of items to return in the command's output.
    --next-token=: A token that indicates the start of the next sequential page of results.
    --page-size=: The size of each page to get in the AWS service call.
    --starting-token=: A token to specify where to start paginating.
documentation:
    command: |-
        Retrieves a collection of container fleet resources in an Amazon Web Services Region. For fleets that have multiple locations, this operation retrieves fleets based on their home Region only.

        **Request options**

        - Get a list of all fleets. Call this operation without specifying a container group definition.
        - Get a list of fleets filtered by container group definition. Provide the container group definition name or ARN value.
        - To get a list of all Amazon GameLift Servers Realtime fleets with a specific configuration script, provide the script ID.

        Use the pagination parameters to retrieve results as a set of sequential pages.

        If successful, this operation returns a collection of container fleets that match the request parameters. A NextToken value is also returned if there are more result pages to retrieve.

        Fleet IDs are returned in no particular order.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        container-group-definition-name: The container group definition to filter the list on. Use this parameter to retrieve only those fleets that use the specified container group definition. You can specify the container group definition's name to get fleets with the latest versions. Alternatively, provide an ARN value to get fleets with a specific version number.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        limit: The maximum number of results to return. Use this parameter with `NextToken` to get results as a set of sequential pages.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        next-token: A token that indicates the start of the next sequential page of results. Use the token that is returned with a previous call to this operation. To start at the beginning of the result set, do not specify a value.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
