name: ungroup-resources
description: Removes the specified resources from the specified group.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --group=!: The name or the Amazon resource name (ARN) of the resource group from which to remove the resources.
    --resource-arns=!:
        description: The Amazon resource names (ARNs) of the resources to be removed from the group.
        nargs: -1
documentation:
    command: |-
        Removes the specified resources from the specified group. This operation works only with static groups that you populated using the [GroupResources]() operation. It doesn't work with any resource groups that are automatically populated by tag-based or CloudFormation stack-based queries.

        **Minimum permissions**

        To run this command, you must have the following permissions:

        - `resource-groups:UngroupResources`
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        group: The name or the Amazon resource name (ARN) of the resource group from which to remove the resources.
        resource-arns: The Amazon resource names (ARNs) of the resources to be removed from the group.
