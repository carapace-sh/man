name: update-network-analyzer-configuration
description: Update network analyzer configuration.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration-name=!: ""
    --description=: ""
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --multicast-groups-to-add=:
        description: Multicast group resources to add to the network analyzer configuration.
        nargs: -1
    --multicast-groups-to-remove=:
        description: Multicast group resources to remove from the network analyzer configuration.
        nargs: -1
    --trace-content=: ""
    --wireless-devices-to-add=:
        description: Wireless device resources to add to the network analyzer configuration.
        nargs: -1
    --wireless-devices-to-remove=:
        description: Wireless device resources to remove from the network analyzer configuration.
        nargs: -1
    --wireless-gateways-to-add=:
        description: Wireless gateway resources to add to the network analyzer configuration.
        nargs: -1
    --wireless-gateways-to-remove=:
        description: Wireless gateway resources to remove from the network analyzer configuration.
        nargs: -1
documentation:
    command: Update network analyzer configuration.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configuration-name: ""
        description: ""
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        multicast-groups-to-add: Multicast group resources to add to the network analyzer configuration. Provide the `MulticastGroupId` of the resource to add in the input array.
        multicast-groups-to-remove: Multicast group resources to remove from the network analyzer configuration. Provide the `MulticastGroupId` of the resources to remove in the input array.
        trace-content: ""
        wireless-devices-to-add: Wireless device resources to add to the network analyzer configuration. Provide the `WirelessDeviceId` of the resource to add in the input array.
        wireless-devices-to-remove: Wireless device resources to remove from the network analyzer configuration. Provide the `WirelessDeviceId` of the resources to remove in the input array.
        wireless-gateways-to-add: Wireless gateway resources to add to the network analyzer configuration. Provide the `WirelessGatewayId` of the resource to add in the input array.
        wireless-gateways-to-remove: Wireless gateway resources to remove from the network analyzer configuration. Provide the `WirelessGatewayId` of the resources to remove in the input array.
