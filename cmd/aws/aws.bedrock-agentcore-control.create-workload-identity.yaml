name: create-workload-identity
description: Creates a new workload identity.
flags:
    --allowed-resource-oauth2-return-urls=: The list of allowed OAuth2 return URLs for resources associated with this workload identity.
    --name=!: The name of the workload identity.
    --tags=: A map of tag keys and values to assign to the workload identity.
documentation:
    command: Creates a new workload identity.
    flag:
        allowed-resource-oauth2-return-urls: The list of allowed OAuth2 return URLs for resources associated with this workload identity.
        name: The name of the workload identity. The name must be unique within your account.
        tags: A map of tag keys and values to assign to the workload identity. Tags enable you to categorize your resources in different ways, for example, by purpose, owner, or environment.
