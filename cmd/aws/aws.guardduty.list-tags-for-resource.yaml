name: list-tags-for-resource
description: Lists tags for a resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) for the given GuardDuty resource.
documentation:
    command: Lists tags for a resource. Tagging is currently supported for detectors, finding filters, IP sets, threat intel sets, and publishing destination, with a limit of 50 tags per resource. When invoked, this operation returns all assigned tags for a given resource.
    flag:
        resource-arn: The Amazon Resource Name (ARN) for the given GuardDuty resource.
