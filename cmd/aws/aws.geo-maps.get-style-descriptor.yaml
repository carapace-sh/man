name: get-style-descriptor
description: '`GetStyleDescriptor` returns information about the style.'
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --color-scheme=: Sets color tone for map such as dark and light for specific map styles.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --key=: 'Optional: The API key to be used for authorization.'
    --political-view=: Specifies the political view using ISO 3166-2 or ISO 3166-3 country code format.
    --style=!: Style specifies the desired map style.
completion:
    flag:
        color-scheme:
            - Light
            - Dark
        style:
            - Standard
            - Monochrome
            - Hybrid
            - Satellite
documentation:
    command: '`GetStyleDescriptor` returns information about the style.'
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        color-scheme: |-
            Sets color tone for map such as dark and light for specific map styles. It applies to only vector map styles such as Standard and Monochrome.

            Example: `Light`

            Default value: `Light`

            Valid values for ColorScheme are case sensitive.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        key: 'Optional: The API key to be used for authorization. Either an API key or valid SigV4 signature must be provided when making a request.'
        political-view: |-
            Specifies the political view using ISO 3166-2 or ISO 3166-3 country code format.

            The following political views are currently supported:

            - `ARG`: Argentina's view on the Southern Patagonian Ice Field and Tierra Del Fuego, including the Falkland Islands, South Georgia, and South Sandwich Islands
            - `EGY`: Egypt's view on Bir Tawil
            - `IND`: India's view on Gilgit-Baltistan
            - `KEN`: Kenya's view on the Ilemi Triangle
            - `MAR`: Morocco's view on Western Sahara
            - `RUS`: Russia's view on Crimea
            - `SDN`: Sudan's view on the Halaib Triangle
            - `SRB`: Serbia's view on Kosovo, Vukovar, and Sarengrad Islands
            - `SUR`: Suriname's view on the Courantyne Headwaters and Lawa Headwaters
            - `SYR`: Syria's view on the Golan Heights
            - `TUR`: Turkey's view on Cyprus and Northern Cyprus
            - `TZA`: Tanzania's view on Lake Malawi
            - `URY`: Uruguay's view on Rincon de Artigas
            - `VNM`: Vietnam's view on the Paracel Islands and Spratly Islands
        style: Style specifies the desired map style.
