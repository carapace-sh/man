name: restore-backup
description: Restores a specified CloudHSM backup that is in the `PENDING_DELETION` state.
flags:
    --backup-id=!: The ID of the backup to be restored.
documentation:
    command: |-
        Restores a specified CloudHSM backup that is in the `PENDING_DELETION` state. For more information on deleting a backup, see [DeleteBackup]().

        **Cross-account use:** No. You cannot perform this operation on an CloudHSM backup in a different Amazon Web Services account.
    flag:
        backup-id: The ID of the backup to be restored. To find the ID of a backup, use the [DescribeBackups]() operation.
