completion:
    flag:
        aggregation-interval:
            - interval-1-min
            - interval-10-min
            - interval-15-min
            - interval-30-sec
            - interval-5-min
            - interval-5-sec
        cross-project-metadata:
            - cross-project-metadata-disabled
            - cross-project-metadata-enabled
        metadata:
            - custom-metadata
            - exclude-all-metadata
            - include-all-metadata
        state:
            - disabled
            - enabled
documentation:
    command: Updates one or more fields in an existing VPC Flow Logs configuration.
    flag:
        add-metadata-fields: Add new value to metadata_fields list.
        aggregation-interval: |-
            The aggregation interval for the logs. Default value is INTERVAL_5_SEC. _AGGREGATION_INTERVAL_ must be one of:
            +
            *interval-1-min*::: Aggregate logs in 1m intervals.
            *interval-10-min*::: Aggregate logs in 10m intervals.
            *interval-15-min*::: Aggregate logs in 15m intervals.
            *interval-30-sec*::: Aggregate logs in 30s intervals.
            *interval-5-min*::: Aggregate logs in 5m intervals.
            *interval-5-sec*::: Aggregate logs in 5s intervals.
            :::
            +
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        clear-labels: Clear labels value and set to empty map.
        clear-metadata-fields: Clear metadata_fields value and set to empty list.
        cross-project-metadata: |-
            Determines whether to include cross project annotations in the logs.
            This field is available only for organization configurations. If not
            specified in org configs will be set to CROSS_PROJECT_METADATA_ENABLED. _CROSS_PROJECT_METADATA_ must be one of:
            +
            *cross-project-metadata-disabled*::: When CROSS_PROJECT_METADATA_DISABLED, metadata from other projects will
            not be included in the logs.
            *cross-project-metadata-enabled*::: When CROSS_PROJECT_METADATA_ENABLED, metadata from other projects will be
            included in the logs.
            :::
            +
        description: |-
            The user-supplied description of the VPC Flow Logs configuration.
            Maximum of 512 characters.
        filter-expr: Export filter used to define which VPC Flow Logs should be logged.
        flow-sampling: |-
            The value of the field must be in (0, 1]. The sampling rate of VPC Flow
            Logs where 1.0 means all collected logs are reported.
            Setting the sampling rate to 0.0 is not allowed. If you want to disable VPC
            Flow Logs, use the state field instead.
            Default value is 1.0.
        interconnect-attachment: |-
            Traffic will be logged from the Interconnect Attachment.
            Format:
            projects/{project_id}/regions/{region}/interconnectAttachments/{name}
        labels: |-
            Set labels to new value. Resource labels to represent user-provided metadata.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: |-
            The location id of the vpcFlowLogsConfig resource.
            +
            To set the `location` attribute:
            * provide the argument `vpc_flow_logs_config` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        metadata: |-
            Configures whether all, none or a subset of metadata fields should be
            added to the reported VPC flow logs.
            Default value is INCLUDE_ALL_METADATA. _METADATA_ must be one of:
            +
            *custom-metadata*::: Include only custom fields (specified in metadata_fields).
            *exclude-all-metadata*::: Exclude all metadata fields.
            *include-all-metadata*::: Include all metadata fields.
            :::
            +
        metadata-fields: Set metadata_fields to new value.
        network: |-
            Traffic will be logged from VMs, VPN tunnels and Interconnect Attachments
            within the network.
            Format: projects/{project_id}/global/networks/{name}
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-labels: Clear labels value and set to empty map.
        no-clear-metadata-fields: Clear metadata_fields value and set to empty list.
        organization: |-
            The organization id of the vpcFlowLogsConfig resource.
            +
            To set the `organization` attribute:
            * provide the argument `vpc_flow_logs_config` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line. Must be specified for resource of type [networkmanagement.organizations.locations.vpcFlowLogsConfigs].
        remove-labels: |-
            Remove existing value from map labels. Sets `remove_labels` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-labels=string,string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-labels=["string"]
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-labels=path_to_file.(yaml|json)
            +
            ```
        remove-metadata-fields: Remove existing value from metadata_fields list.
        state: |-
            The state of the VPC Flow Log configuration. Default value is ENABLED.
            When creating a new configuration, it must be enabled.
            Setting state=DISABLED will pause the log generation for this config. _STATE_ must be one of:
            +
            *disabled*::: When DISABLED, this configuration will not generate logs.
            *enabled*::: When ENABLED, this configuration will generate logs.
            :::
            +
        subnet: |-
            Traffic will be logged from VMs within the subnetwork.
            Format: projects/{project_id}/regions/{region}/subnetworks/{name}
        update-labels: |-
            Update labels value or add key value pair. Resource labels to represent user-provided metadata.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --update-labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --update-labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --update-labels=path_to_file.(yaml|json)
            +
            ```
        vpn-tunnel: |-
            Traffic will be logged from the VPN Tunnel.
            Format: projects/{project_id}/regions/{region}/vpnTunnels/{name}
