name: update
description: Update an OAuth client credential.
flags:
    --disabled: Disables the OAuth client credential.
    --display-name=: A display name for the OAuth client credential.
    --location=: The location name.
    --no-disabled&: Disables the OAuth client credential.
    --oauth-client=: ID to use for the OAuth client, which becomes the final component of the resource name.
documentation:
    command: |
        Update an OAuth client credential.
    flag:
        disabled: |-
            Disables the OAuth client credential. You cannot use a disabled OAuth client credential for
            OAuth. Include `--no-disabled` to enable a disabled OAuth client credential.
        display-name: A display name for the OAuth client credential. Cannot exceed 32 characters.
        location: |-
            The location name.
            +
            To set the `location` attribute:
            * provide the argument `credential` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-disabled: |-
            Disables the OAuth client credential. You cannot use a disabled OAuth client credential for
            OAuth. Include `--no-disabled` to enable a disabled OAuth client credential.
        oauth-client: |-
            ID to use for the OAuth client, which becomes the final component of the resource name.
            This value should be 4-32 characters, and may contain the characters [a-z0-9-].
            The prefix `gcp-` is reserved for use by Google, and may not be specified.
            +

            To set the `oauth-client` attribute:
            * provide the argument `credential` on the command line with a fully specified name;
            * provide the argument `--oauth-client` on the command line.
