name: drop
description: '*(BETA)*  Reset the dry-run mode configuration of a Service Perimeter.'
flags:
    --async: Return immediately, without waiting for the operation in
    --no-async&: Return immediately, without waiting for the operation in
    --policy=: The ID of the access policy.
documentation:
    command: '*(BETA)*  Removes the explicit dry-run mode configuration for a Service Perimeter. After this operation, the effective dry-run mode configuration is implicitly inherited from the enforcement mode configuration. No audit logs will be generated in this state.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in
                        progress to complete.
        no-async: |-
            Return immediately, without waiting for the operation in
                        progress to complete.
        policy: |-
            The ID of the access policy.
            +
            To set the `policy` attribute:
            * provide the argument `perimeter` on the command line with a fully specified name;
            * provide the argument `--policy` on the command line;
            * set the property `access_context_manager/policy`.
