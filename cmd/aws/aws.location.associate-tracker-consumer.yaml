name: associate-tracker-consumer
description: Creates an association between a geofence collection and a tracker resource.
flags:
    --consumer-arn=!: The Amazon Resource Name (ARN) for the geofence collection to be associated to tracker resource.
    --tracker-name=!: The name of the tracker resource to be associated with a geofence collection.
documentation:
    command: |-
        Creates an association between a geofence collection and a tracker resource. This allows the tracker resource to communicate location data to the linked geofence collection.

        You can associate up to five geofence collections to each tracker resource.

        Currently not supported — Cross-account configurations, such as creating associations between a tracker resource in one account and a geofence collection in another account.
    flag:
        consumer-arn: |-
            The Amazon Resource Name (ARN) for the geofence collection to be associated to tracker resource. Used when you need to specify a resource across all Amazon Web Services.

            - Format example: `arn:aws:geo:region:account-id:geofence-collection/ExampleGeofenceCollectionConsumer`
        tracker-name: The name of the tracker resource to be associated with a geofence collection.
