name: list-command-invocations
description: An invocation is copy of a command sent to a specific managed node.
flags:
    --command-id=: (Optional) The invocations for a specific command ID.
    --details: (Optional) If set this returns the response of the command executions and any command output.
    --filters=: (Optional) One or more filters.
    --instance-id=: (Optional) The command execution details for a specific managed node ID.
    --max-results=: (Optional) The maximum number of items to return for this call.
    --next-token=: (Optional) The token for the next set of items to return.
    --no-details: (Optional) If set this returns the response of the command executions and any command output.
documentation:
    command: An invocation is copy of a command sent to a specific managed node. A command can apply to one or more managed nodes. A command invocation applies to one managed node. For example, if a user runs `SendCommand` against three managed nodes, then a command invocation is created for each requested managed node ID. `ListCommandInvocations` provide status about command execution.
    flag:
        command-id: (Optional) The invocations for a specific command ID.
        details: (Optional) If set this returns the response of the command executions and any command output. The default value is `false`.
        filters: (Optional) One or more filters. Use a filter to return a more specific list of results.
        instance-id: (Optional) The command execution details for a specific managed node ID.
        max-results: (Optional) The maximum number of items to return for this call. The call also returns a token that you can specify in a subsequent call to get the next set of results.
        next-token: (Optional) The token for the next set of items to return. (You received this token from a previous call.)
