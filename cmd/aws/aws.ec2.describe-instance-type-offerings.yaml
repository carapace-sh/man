name: describe-instance-type-offerings
description: Lists the instance types that are offered for the specified location.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: One or more filters.
    --location-type=: The location type.
    --max-results=: The maximum number of items to return for this request.
    --next-token=: The token returned from a previous paginated request.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
completion:
    flag:
        location-type:
            - region
            - availability-zone
            - availability-zone-id
            - outpost
documentation:
    command: Lists the instance types that are offered for the specified location. If no location is specified, the default is to list the instance types that are offered in the current Region.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            One or more filters. Filter names and values are case-sensitive.

            - `instance-type` - The instance type. For a list of possible values, see [Instance](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_Instance.html).
            - `location` - The location. For a list of possible identifiers, see [Regions and Zones](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-regions-availability-zones.html).
        location-type: |-
            The location type.

            - `availability-zone` - The Availability Zone. When you specify a location filter, it must be an Availability Zone for the current Region.
            - `availability-zone-id` - The AZ ID. When you specify a location filter, it must be an AZ ID for the current Region.
            - `outpost` - The Outpost ARN. When you specify a location filter, it must be an Outpost ARN for the current Region.
            - `region` - The current Region. If you specify a location filter, it must match the current Region.
        max-results: The maximum number of items to return for this request. To get the next page of items, make another request with the token returned in the output. For more information, see [Pagination](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Query-Requests.html#api-pagination).
        next-token: The token returned from a previous paginated request. Pagination continues from the end of the items returned by the previous request.
