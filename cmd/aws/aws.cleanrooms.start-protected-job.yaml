name: start-protected-job
description: Creates a protected job that is started by Clean Rooms.
flags:
    --compute-configuration=: The compute configuration for the protected job.
    --job-parameters=!: The job parameters.
    --membership-identifier=!: A unique identifier for the membership to run this job against.
    --result-configuration=: The details needed to write the job results.
    --type=!: The type of protected job to start.
completion:
    flag:
        type:
            - PYSPARK
documentation:
    command: Creates a protected job that is started by Clean Rooms.
    flag:
        compute-configuration: The compute configuration for the protected job.
        job-parameters: The job parameters.
        membership-identifier: A unique identifier for the membership to run this job against. Currently accepts a membership ID.
        result-configuration: The details needed to write the job results.
        type: The type of protected job to start.
