name: update-recipe-job
description: Modifies the definition of an existing DataBrew recipe job.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --data-catalog-outputs=:
        description: One or more artifacts that represent the Glue Data Catalog output from running the job.
        nargs: -1
    --database-outputs=:
        description: Represents a list of JDBC database output objects which defines the output destination for a DataBrew recipe job to write into.
        nargs: -1
    --encryption-key-arn=: The Amazon Resource Name (ARN) of an encryption key that is used to protect the job.
    --encryption-mode=: 'The encryption mode for the job, which can be one of the following:'
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --log-subscription=: Enables or disables Amazon CloudWatch logging for the job.
    --max-capacity=: The maximum number of nodes that DataBrew can consume when the job processes data.
    --max-retries=: The maximum number of times to retry the job after a job run fails.
    --name=!: The name of the job to update.
    --outputs=:
        description: One or more artifacts that represent the output from running the job.
        nargs: -1
    --role-arn=!: The Amazon Resource Name (ARN) of the Identity and Access Management (IAM) role to be assumed when DataBrew runs the job.
    --timeout=: The job's timeout in minutes.
completion:
    flag:
        encryption-mode:
            - SSE-KMS
            - SSE-S3
        log-subscription:
            - ENABLE
            - DISABLE
documentation:
    command: Modifies the definition of an existing DataBrew recipe job.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        data-catalog-outputs: One or more artifacts that represent the Glue Data Catalog output from running the job.
        database-outputs: Represents a list of JDBC database output objects which defines the output destination for a DataBrew recipe job to write into.
        encryption-key-arn: The Amazon Resource Name (ARN) of an encryption key that is used to protect the job.
        encryption-mode: |-
            The encryption mode for the job, which can be one of the following:

            - `SSE-KMS` - Server-side encryption with keys managed by KMS.
            - `SSE-S3` - Server-side encryption with keys managed by Amazon S3.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        log-subscription: Enables or disables Amazon CloudWatch logging for the job. If logging is enabled, CloudWatch writes one log stream for each job run.
        max-capacity: The maximum number of nodes that DataBrew can consume when the job processes data.
        max-retries: The maximum number of times to retry the job after a job run fails.
        name: The name of the job to update.
        outputs: One or more artifacts that represent the output from running the job.
        role-arn: The Amazon Resource Name (ARN) of the Identity and Access Management (IAM) role to be assumed when DataBrew runs the job.
        timeout: The job's timeout in minutes. A job that attempts to run longer than this timeout period ends with a status of `TIMEOUT`.
