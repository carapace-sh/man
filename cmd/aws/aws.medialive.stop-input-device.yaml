name: stop-input-device
description: Stop an input device that is attached to a MediaConnect flow.
flags:
    --input-device-id=!: The unique ID of the input device to stop.
documentation:
    command: Stop an input device that is attached to a MediaConnect flow. (There is no need to stop a device that is attached to a MediaLive input; MediaLive automatically stops the device when the channel stops.)
    flag:
        input-device-id: The unique ID of the input device to stop. For example, hd-123456789abcdef.
