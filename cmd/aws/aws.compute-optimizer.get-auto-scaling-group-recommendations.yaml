name: get-auto-scaling-group-recommendations
description: Returns Amazon EC2 Auto Scaling group recommendations.
flags:
    --account-ids=: The ID of the Amazon Web Services account for which to return Amazon EC2 Auto Scaling group recommendations.
    --auto-scaling-group-arns=: The Amazon Resource Name (ARN) of the Amazon EC2 Auto Scaling groups for which to return recommendations.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --filters=: An array of objects to specify a filter that returns a more specific list of Amazon EC2 Auto Scaling group recommendations.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of Amazon EC2 Auto Scaling group recommendations to return with a single request.
    --next-token=: The token to advance to the next page of Amazon EC2 Auto Scaling group recommendations.
    --recommendation-preferences=: An object to specify the preferences for the Amazon EC2 Auto Scaling group recommendations to return in the response.
documentation:
    command: |-
        Returns Amazon EC2 Auto Scaling group recommendations.

        Compute Optimizer generates recommendations for Amazon EC2 Auto Scaling groups that meet a specific set of requirements. For more information, see the [Supported resources and requirements](https://docs.aws.amazon.com/compute-optimizer/latest/ug/requirements.html) in the *Compute Optimizer User Guide*.
    flag:
        account-ids: |-
            The ID of the Amazon Web Services account for which to return Amazon EC2 Auto Scaling group recommendations.

            If your account is the management account of an organization, use this parameter to specify the member account for which you want to return Amazon EC2 Auto Scaling group recommendations.

            Only one account ID can be specified per request.
        auto-scaling-group-arns: The Amazon Resource Name (ARN) of the Amazon EC2 Auto Scaling groups for which to return recommendations.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        filters: An array of objects to specify a filter that returns a more specific list of Amazon EC2 Auto Scaling group recommendations.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: |-
            The maximum number of Amazon EC2 Auto Scaling group recommendations to return with a single request.

            To retrieve the remaining results, make another request with the returned `nextToken` value.
        next-token: The token to advance to the next page of Amazon EC2 Auto Scaling group recommendations.
        recommendation-preferences: An object to specify the preferences for the Amazon EC2 Auto Scaling group recommendations to return in the response.
