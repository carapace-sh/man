name: describe
description: Show details about a certificate template.
flags:
    --location=: The location of the Certificate Template.
documentation:
    command: Show details about a certificate template.
    flag:
        location: |-
            The location of the Certificate Template.
            +
            To set the `location` attribute:
            * provide the argument `certificate_template` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `privateca/location`.
