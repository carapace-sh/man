name: update-pipeline
description: Updates an OpenSearch Ingestion pipeline.
flags:
    --buffer-options=: Key-value pairs to configure persistent buffering for the pipeline.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --encryption-at-rest-options=: Key-value pairs to configure encryption for data that is written to a persistent buffer.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --log-publishing-options=: Key-value pairs to configure log publishing.
    --max-units=: The maximum pipeline capacity, in Ingestion Compute Units (ICUs)
    --min-units=: The minimum pipeline capacity, in Ingestion Compute Units (ICUs).
    --pipeline-configuration-body=: The pipeline configuration in YAML format.
    --pipeline-name=!: The name of the pipeline to update.
    --pipeline-role-arn=: The Amazon Resource Name (ARN) of the IAM role that grants the pipeline permission to access Amazon Web Services resources.
documentation:
    command: Updates an OpenSearch Ingestion pipeline. For more information, see [Updating Amazon OpenSearch Ingestion pipelines](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/update-pipeline.html).
    flag:
        buffer-options: Key-value pairs to configure persistent buffering for the pipeline.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        encryption-at-rest-options: Key-value pairs to configure encryption for data that is written to a persistent buffer.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        log-publishing-options: Key-value pairs to configure log publishing.
        max-units: The maximum pipeline capacity, in Ingestion Compute Units (ICUs)
        min-units: The minimum pipeline capacity, in Ingestion Compute Units (ICUs).
        pipeline-configuration-body: The pipeline configuration in YAML format. The command accepts the pipeline configuration as a string or within a .yaml file. If you provide the configuration as a string, each new line must be escaped with `\n`.
        pipeline-name: The name of the pipeline to update.
        pipeline-role-arn: The Amazon Resource Name (ARN) of the IAM role that grants the pipeline permission to access Amazon Web Services resources.
