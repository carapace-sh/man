name: disassociate-traffic-distribution-group-user
description: Disassociates an agent from a traffic distribution group.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --traffic-distribution-group-id=!: The identifier of the traffic distribution group.
    --user-id=!: The identifier for the user.
documentation:
    command: Disassociates an agent from a traffic distribution group. This API can be called only in the Region where the traffic distribution group is created.
    flag:
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        traffic-distribution-group-id: The identifier of the traffic distribution group. This can be the ID or the ARN of the traffic distribution group.
        user-id: The identifier for the user. This can be the ID or the ARN of the user.
