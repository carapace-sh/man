name: create
description: Create a new regional endpoint.
flags:
    --address=: The IP Address of the Regional Endpoint.
    --async: Return immediately, without waiting for the operation in progress to
    --description=: Description of the regional endpoint.
    --enable-global-access: Whether the REGIONAL or GLOBAL access is enabled.
    --labels=: List of label KEY=VALUE pairs to add.
    --network=: Consumer's VPC network that this regional endpoint belongs to.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-enable-global-access&: Whether the REGIONAL or GLOBAL access is enabled.
    --region=: The location Id.
    --subnetwork=: The name of the subnetwork from which the IP address will be allocated.
    --target-google-api=!: The service endpoint the regional endpoint will connect to.
documentation:
    command: Create a new regional endpoint with the given name.
    flag:
        address: |-
            The IP Address of the Regional Endpoint. When no address is provided, an IP from the subnetwork is allocated. Use one of the following formats:
            - IPv4 address as in ``10.0.0.1''
            - Address resource URI as in ``projects/{project}/regions/{region}/addresses/{address_name}'' for an IPv4 or IPv6 address.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: Description of the regional endpoint.
        enable-global-access: Whether the REGIONAL or GLOBAL access is enabled.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        network: Consumer's VPC network that this regional endpoint belongs to.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-enable-global-access: |
            Whether the REGIONAL or GLOBAL access is enabled.
        region: |-
            The location Id.
            +

            To set the `region` attribute:
            * provide the argument `regional_endpoint` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
        subnetwork: The name of the subnetwork from which the IP address will be allocated.
        target-google-api: The service endpoint the regional endpoint will connect to.
