name: describe
description: '*(ALPHA)*  Route View for a Mesh or Gateway.'
flags:
    --gateway=: Parent Gateway of the mesh_or_gateway_route_view
    --location=: Location of the mesh_or_gateway_route_view
    --mesh=: Parent Mesh of the mesh_or_gateway_route_view
    --route-view=!: ID of the mesh_or_gateway_route_view or fully qualified identifier for the mesh_or_gateway_route_view.
documentation:
    command: |-
        *(ALPHA)*  Describe a Route Views for a Mesh or Gateway

        ## EXAMPLES
        Describe a Route Views for a Mesh

          $ gcloud alpha network-services route-views describe --project=$PROJECT_ID --location=$LOCATION --mesh mesh1
          --route-view $ROUTE_VIEW_ID
          $ gcloud alpha network-services route-views describe
          --route-view=projects/-/locations/-/meshes/-/routeViews/$ROUTE_VIEW_ID

        Describe a Route Views for a Gateway

          $ gcloud alpha network-services route-views describe --project=$PROJECT_ID --location=$LOCATION --gateway gateway1
          --route-view $ROUTE_VIEW_ID
          $ gcloud alpha network-services route-views describe
          --route-view=projects/-/locations/-/gateways/-/routeViews/$ROUTE_VIEW_ID
    flag:
        gateway: |-
            Parent Gateway of the mesh_or_gateway_route_view
            +
            To set the `gateway` attribute:
            * provide the argument `--route-view` on the command line with a fully specified name;
            * provide the argument `--gateway` on the command line. Must be specified for resource of type [networkservices.projects.locations.gateways.routeViews].
        location: |-
            Location of the mesh_or_gateway_route_view
            +
            To set the `location` attribute:
            * provide the argument `--route-view` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        mesh: |-
            Parent Mesh of the mesh_or_gateway_route_view
            +
            To set the `mesh` attribute:
            * provide the argument `--route-view` on the command line with a fully specified name;
            * provide the argument `--mesh` on the command line. Must be specified for resource of type [networkservices.projects.locations.meshes.routeViews].
        route-view: |-
            ID of the mesh_or_gateway_route_view or fully qualified identifier for the mesh_or_gateway_route_view.
            +
            To set the `route_view` attribute:
            * provide the argument `--route-view` on the command line.
