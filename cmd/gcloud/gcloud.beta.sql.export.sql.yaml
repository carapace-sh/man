name: sql
description: '*(BETA)*  Exports data from a Cloud SQL instance to a SQL file.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --clean: Include SQL statements (DROP <object>) required to drop database objects prior to import; corresponds to the clean flag for pg_dump.
    --database=: Database(s) from which the export is made.
    --if-exists: Include an SQL statement (IF EXISTS) with each drop statement produced by the clean flag; corresponds to the if-exists flag for pg_dump.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clean&: Include SQL statements (DROP <object>) required to drop database objects prior to import; corresponds to the clean flag for pg_dump.
    --no-if-exists&: Include an SQL statement (IF EXISTS) with each drop statement produced by the clean flag; corresponds to the if-exists flag for pg_dump.
    --no-offload&: Offload an export to a temporary instance.
    --no-parallel&: Perform a parallel export.
    --offload: Offload an export to a temporary instance.
    --parallel: Perform a parallel export.
    --table=: Tables to export from the specified database.
    --threads=: Specifies the number of threads to use for the parallel export.
documentation:
    command: |-
        *(BETA)*  Exports data from a Cloud SQL instance to a Google Cloud Storage
        bucket as a SQL dump file.

        NOTE: Certain roles and permissions are required to export data to Google
        Cloud Storage. For more information on exporting data from Google Cloud SQL
        see [Export from Cloud SQL to a SQL dump file](https://cloud.google.com/sql/docs/mysql/import-export/import-export-sql#gcloud).
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        clean: Include SQL statements (DROP <object>) required to drop database objects prior to import; corresponds to the clean flag for pg_dump. Only applies to PostgreSQL non-parallel exports.
        database: 'Database(s) from which the export is made. Information on requirements can be found here: https://cloud.google.com/sql/docs/mysql/admin-api/v1beta4/instances/export#exportContext.databases'
        if-exists: Include an SQL statement (IF EXISTS) with each drop statement produced by the clean flag; corresponds to the if-exists flag for pg_dump. Only applies to PostgreSQL non-parallel exports.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clean: Include SQL statements (DROP <object>) required to drop database objects prior to import; corresponds to the clean flag for pg_dump. Only applies to PostgreSQL non-parallel exports.
        no-if-exists: Include an SQL statement (IF EXISTS) with each drop statement produced by the clean flag; corresponds to the if-exists flag for pg_dump. Only applies to PostgreSQL non-parallel exports.
        no-offload: Offload an export to a temporary instance. Doing so reduces strain on source instances and allows other operations to be performed while the export is in progress.
        no-parallel: Perform a parallel export. This flag is only applicable to MySQL and Postgres.
        offload: Offload an export to a temporary instance. Doing so reduces strain on source instances and allows other operations to be performed while the export is in progress.
        parallel: Perform a parallel export. This flag is only applicable to MySQL and Postgres.
        table: Tables to export from the specified database. If you specify tables, specify one and only one database. For PostgreSQL instances, only one table can be exported at a time.
        threads: Specifies the number of threads to use for the parallel export. If `--parallel` is specified and this flag is not provided, Cloud SQL uses a default thread count to optimize performance.
