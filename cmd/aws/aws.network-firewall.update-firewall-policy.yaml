name: update-firewall-policy
description: Updates the properties of the specified firewall policy.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description of the firewall policy.
    --dry-run: Indicates whether you want Network Firewall to just check the validity of the request, rather than run the request.
    --encryption-configuration=: A complex type that contains settings for encryption of your firewall policy resources.
    --firewall-policy-arn=: The Amazon Resource Name (ARN) of the firewall policy.
    --firewall-policy-name=: The descriptive name of the firewall policy.
    --firewall-policy=!: The updated firewall policy to use for the firewall.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-dry-run: Indicates whether you want Network Firewall to just check the validity of the request, rather than run the request.
    --update-token=!: A token used for optimistic locking.
documentation:
    command: Updates the properties of the specified firewall policy.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description of the firewall policy.
        dry-run: |-
            Indicates whether you want Network Firewall to just check the validity of the request, rather than run the request.

            If set to `TRUE`, Network Firewall checks whether the request can run successfully, but doesn't actually make the requested changes. The call returns the value that the request would return if you ran it with dry run set to `FALSE`, but doesn't make additions or changes to your resources. This option allows you to make sure that you have the required permissions to run the request and that your request parameters are valid.

            If set to `FALSE`, Network Firewall makes the requested changes to your resources.
        encryption-configuration: A complex type that contains settings for encryption of your firewall policy resources.
        firewall-policy: The updated firewall policy to use for the firewall. You can't add or remove a [TLSInspectionConfiguration]() after you create a firewall policy. However, you can replace an existing TLS inspection configuration with another `TLSInspectionConfiguration`.
        firewall-policy-arn: |-
            The Amazon Resource Name (ARN) of the firewall policy.

            You must specify the ARN or the name, and you can specify both.
        firewall-policy-name: |-
            The descriptive name of the firewall policy. You can't change the name of a firewall policy after you create it.

            You must specify the ARN or the name, and you can specify both.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        update-token: |-
            A token used for optimistic locking. Network Firewall returns a token to your requests that access the firewall policy. The token marks the state of the policy resource at the time of the request.

            To make changes to the policy, you provide the token in your request. Network Firewall uses the token to ensure that the policy hasn't changed since you last retrieved it. If it has changed, the operation fails with an `InvalidTokenException`. If this happens, retrieve the firewall policy again to get a current copy of it with current token. Reapply your changes as needed, then try the operation again using the new token.
