name: print-access-token
description: '*(DEPRECATED)*  Generate an access token for an Anthos cluster on AWS.'
hidden: true
flags:
    --exec-credential: If set, format access token as a Kubernetes execCredential object.
    --location=: Google Cloud location for the cluster.
    --no-exec-credential&: If set, format access token as a Kubernetes execCredential object.
documentation:
    command: |+
        *(DEPRECATED)*  Generate an access token for an Anthos cluster on AWS.

        This command is deprecated. See https://cloud.google.com/kubernetes-engine/multi-cloud/docs/aws/deprecations/deprecation-announcement for more details.

    flag:
        exec-credential: If set, format access token as a Kubernetes execCredential object.
        location: |-
            Google Cloud location for the cluster.
            +
            To set the `location` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `container_aws/location`.
        no-exec-credential: If set, format access token as a Kubernetes execCredential object.
