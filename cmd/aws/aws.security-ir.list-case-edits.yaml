name: list-case-edits
description: Views the case history for edits made to a designated case.
flags:
    --case-id=!: Required element used with ListCaseEdits to identify the case to query.
    --max-results=: Optional element to identify how many results to obtain.
    --next-token=: An optional string that, if supplied, must be copied from the output of a previous call to ListCaseEdits.
documentation:
    command: Views the case history for edits made to a designated case.
    flag:
        case-id: Required element used with ListCaseEdits to identify the case to query.
        max-results: Optional element to identify how many results to obtain. There is a maximum value of 25.
        next-token: An optional string that, if supplied, must be copied from the output of a previous call to ListCaseEdits. When provided in this manner, the API fetches the next page of results.
