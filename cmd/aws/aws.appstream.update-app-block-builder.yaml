name: update-app-block-builder
description: Updates an app block builder.
flags:
    --access-endpoints=: The list of interface VPC endpoint (interface endpoint) objects.
    --attributes-to-delete=: The attributes to delete from the app block builder.
    --description=: The description of the app block builder.
    --display-name=: The display name of the app block builder.
    --enable-default-internet-access=: Enables or disables default internet access for the app block builder.
    --iam-role-arn=: The Amazon Resource Name (ARN) of the IAM role to apply to the app block builder.
    --instance-type=: The instance type to use when launching the app block builder.
    --name=!: The unique name for the app block builder.
    --platform=: The platform of the app block builder.
    --vpc-config=: The VPC configuration for the app block builder.
completion:
    flag:
        platform:
            - WINDOWS
            - WINDOWS_SERVER_2016
            - WINDOWS_SERVER_2019
            - WINDOWS_SERVER_2022
            - AMAZON_LINUX2
            - RHEL8
            - ROCKY_LINUX8
documentation:
    command: |-
        Updates an app block builder.

        If the app block builder is in the `STARTING` or `STOPPING` state, you can't update it. If the app block builder is in the `RUNNING` state, you can only update the DisplayName and Description. If the app block builder is in the `STOPPED` state, you can update any attribute except the Name.
    flag:
        access-endpoints: The list of interface VPC endpoint (interface endpoint) objects. Administrators can connect to the app block builder only through the specified endpoints.
        attributes-to-delete: The attributes to delete from the app block builder.
        description: The description of the app block builder.
        display-name: The display name of the app block builder.
        enable-default-internet-access: Enables or disables default internet access for the app block builder.
        iam-role-arn: |-
            The Amazon Resource Name (ARN) of the IAM role to apply to the app block builder. To assume a role, the app block builder calls the AWS Security Token Service (STS) `AssumeRole` API operation and passes the ARN of the role to use. The operation creates a new session with temporary credentials. AppStream 2.0 retrieves the temporary credentials and creates the **appstream\_machine\_role** credential profile on the instance.

            For more information, see [Using an IAM Role to Grant Permissions to Applications and Scripts Running on AppStream 2.0 Streaming Instances](https://docs.aws.amazon.com/appstream2/latest/developerguide/using-iam-roles-to-grant-permissions-to-applications-scripts-streaming-instances.html) in the *Amazon AppStream 2.0 Administration Guide*.
        instance-type: |-
            The instance type to use when launching the app block builder. The following instance types are available:

            - stream.standard.small
            - stream.standard.medium
            - stream.standard.large
            - stream.standard.xlarge
            - stream.standard.2xlarge
        name: The unique name for the app block builder.
        platform: |-
            The platform of the app block builder.

            `WINDOWS_SERVER_2019` is the only valid value.
        vpc-config: |-
            The VPC configuration for the app block builder.

            App block builders require that you specify at least two subnets in different availability zones.
