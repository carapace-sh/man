name: modify-volume-attribute
description: Modifies a volume attribute.
flags:
    --auto-enable-io=: Indicates whether the volume should be auto-enabled for I/O operations.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --volume-id=!: The ID of the volume.
documentation:
    command: |-
        Modifies a volume attribute.

        By default, all I/O operations for the volume are suspended when the data on the volume is determined to be potentially inconsistent, to prevent undetectable, latent data corruption. The I/O access to the volume can be resumed by first enabling I/O access and then checking the data consistency on your volume.

        You can change the default behavior to resume I/O operations. We recommend that you change this only for boot volumes or for volumes that are stateless or disposable.
    flag:
        auto-enable-io: Indicates whether the volume should be auto-enabled for I/O operations.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        volume-id: The ID of the volume.
