name: update-app-version
description: Updates the Resilience Hub application version.
flags:
    --additional-info=: Additional configuration parameters for an Resilience Hub application.
    --app-arn=!: Amazon Resource Name (ARN) of the Resilience Hub application.
documentation:
    command: |-
        Updates the Resilience Hub application version.

        This API updates the Resilience Hub application draft version. To use this information for running resiliency assessments, you must publish the Resilience Hub application using the `PublishAppVersion` API.
    flag:
        additional-info: |-
            Additional configuration parameters for an Resilience Hub application. If you want to implement `additionalInfo` through the Resilience Hub console rather than using an API call, see [Configure the application configuration parameters](https://docs.aws.amazon.com/resilience-hub/latest/userguide/app-config-param.html).

            Currently, this parameter accepts a key-value mapping (in a string format) of only one failover region and one associated account.

            Key: `"failover-regions"`

            Value: `"[{"region":"<REGION>", "accounts":[{"id":"<ACCOUNT_ID>"}]}]"`
        app-arn: 'Amazon Resource Name (ARN) of the Resilience Hub application. The format for this ARN is: arn:`partition`:resiliencehub:`region`:`account`:app/`app-id`. For more information about ARNs, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference* guide.'
