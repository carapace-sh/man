name: describe
description: '*(ALPHA)*  Describes an AlloyDB instance within a given cluster.'
flags:
    --cluster=!: AlloyDB cluster ID
    --region=!: Regional location (e.g. `asia-east1`, `us-east1`).
    --view=: View of the instance to return.
completion:
    flag:
        view:
            - basic
            - full
documentation:
    command: '*(ALPHA)*  Describes an AlloyDB instance within a given cluster.'
    flag:
        cluster: AlloyDB cluster ID
        region: Regional location (e.g. `asia-east1`, `us-east1`). See the full list of regions at https://cloud.google.com/sql/docs/instance-locations.
