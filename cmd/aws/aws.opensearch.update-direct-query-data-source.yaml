name: update-direct-query-data-source
description: Updates the configuration or properties of an existing direct query data source in Amazon OpenSearch Service.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --data-source-name=!: A unique, user-defined label to identify the data source within your OpenSearch Service environment.
    --data-source-type=!: The supported Amazon Web Services service that you want to use as the source for direct queries in OpenSearch Service.
    --description=: An optional text field for providing additional context and details about the data source.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --open-search-arns=!:
        description: A list of Amazon Resource Names (ARNs) for the OpenSearch collections that are associated with the direct query data source.
        nargs: -1
documentation:
    command: Updates the configuration or properties of an existing direct query data source in Amazon OpenSearch Service.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        data-source-name: A unique, user-defined label to identify the data source within your OpenSearch Service environment.
        data-source-type: The supported Amazon Web Services service that you want to use as the source for direct queries in OpenSearch Service.
        description: An optional text field for providing additional context and details about the data source.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        open-search-arns: A list of Amazon Resource Names (ARNs) for the OpenSearch collections that are associated with the direct query data source.
