name: list-edge-agent-configurations
description: Returns an array of edge configurations associated with the specified Edge Agent.
flags:
    --hub-device-arn=!: The "Internet of Things (IoT) Thing" Arn of the edge agent.
    --max-results=: The maximum number of edge configurations to return in the response.
    --next-token=: If you specify this parameter, when the result of a `ListEdgeAgentConfigurations` operation is truncated, the call returns the `NextToken` in the response.
documentation:
    command: |-
        Returns an array of edge configurations associated with the specified Edge Agent.

        In the request, you must specify the Edge Agent `HubDeviceArn`.
    flag:
        hub-device-arn: The "Internet of Things (IoT) Thing" Arn of the edge agent.
        max-results: The maximum number of edge configurations to return in the response. The default is 5.
        next-token: If you specify this parameter, when the result of a `ListEdgeAgentConfigurations` operation is truncated, the call returns the `NextToken` in the response. To get another batch of edge configurations, provide this token in your next request.
