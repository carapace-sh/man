flags:
    --next-token=: A pagination token.
    --resource-arn=!: The Amazon Resource Number (ARN) of an X-Ray group or sampling rule.
documentation:
    command: Returns a list of tags that are applied to the specified Amazon Web Services X-Ray group or sampling rule.
