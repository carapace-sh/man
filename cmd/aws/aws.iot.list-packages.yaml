name: list-packages
description: Lists the software packages associated to the account.
flags:
    --max-results=: The maximum number of results returned at one time.
    --next-token=: The token for the next set of results.
documentation:
    command: |-
        Lists the software packages associated to the account.

        Requires permission to access the [ListPackages](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        max-results: The maximum number of results returned at one time.
        next-token: The token for the next set of results.
