name: get-cost-categories
description: Retrieves an array of Cost Category names and values incurred cost.
flags:
    --billing-view-arn=: The Amazon Resource Name (ARN) that uniquely identifies a specific billing view.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cost-category-name=: ""
    --filter=: ""
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: This field is only used when the `SortBy` value is provided in the request.
    --next-page-token=: If the number of objects that are still available for retrieval exceeds the quota, Amazon Web Services returns a NextPageToken value in the response.
    --search-string=: The value that you want to search the filter values for.
    --sort-by=: The value that you sort the data by.
    --time-period=!: ""
documentation:
    command: |-
        Retrieves an array of Cost Category names and values incurred cost.

        If some Cost Category names and values are not associated with any cost, they will not be returned by this API.
    flag:
        billing-view-arn: The Amazon Resource Name (ARN) that uniquely identifies a specific billing view. The ARN is used to specify which particular billing view you want to interact with or retrieve information from when making API calls related to Amazon Web Services Billing and Cost Management features. The BillingViewArn can be retrieved by calling the ListBillingViews API.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cost-category-name: ""
        filter: ""
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: |-
            This field is only used when the `SortBy` value is provided in the request.

            The maximum number of objects that are returned for this request. If `MaxResults` isn't specified with the `SortBy` value, the request returns 1000 results as the default value for this parameter.

            For `GetCostCategories`, MaxResults has an upper quota of 1000.
        next-page-token: If the number of objects that are still available for retrieval exceeds the quota, Amazon Web Services returns a NextPageToken value in the response. To retrieve the next batch of objects, provide the NextPageToken from the previous call in your next request.
        search-string: |-
            The value that you want to search the filter values for.

            If you don't specify a `CostCategoryName`, `SearchString` is used to filter Cost Category names that match the `SearchString` pattern. If you specify a `CostCategoryName`, `SearchString` is used to filter Cost Category values that match the `SearchString` pattern.
        sort-by: |-
            The value that you sort the data by.

            The key represents the cost and usage metrics. The following values are supported:

            - `BlendedCost`
            - `UnblendedCost`
            - `AmortizedCost`
            - `NetAmortizedCost`
            - `NetUnblendedCost`
            - `UsageQuantity`
            - `NormalizedUsageAmount`

            The supported key values for the `SortOrder` value are `ASCENDING` and `DESCENDING`.

            When you use the `SortBy` value, the `NextPageToken` and `SearchString` key values aren't supported.
        time-period: ""
