name: update-application
description: Updates an existing Amazon Q Business application.
flags:
    --application-id=!: The identifier of the Amazon Q Business application.
    --attachments-configuration=: An option to allow end users to upload files directly during chat.
    --auto-subscription-configuration=: An option to enable updating the default subscription type assigned to an Amazon Q Business application using IAM identity federation for user management.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description for the Amazon Q Business application.
    --display-name=: A name for the Amazon Q Business application.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identity-center-instance-arn=: The Amazon Resource Name (ARN) of the IAM Identity Center instance you are either creating for—or connecting to—your Amazon Q Business application.
    --personalization-configuration=: Configuration information about chat response personalization.
    --q-apps-configuration=: An option to allow end users to create and use Amazon Q Apps in the web experience.
    --role-arn=: An Amazon Web Services Identity and Access Management (IAM) role that gives Amazon Q Business permission to access Amazon CloudWatch logs and metrics.
documentation:
    command: |-
        Updates an existing Amazon Q Business application.

        Amazon Q Business applications may securely transmit data for processing across Amazon Web Services Regions within your geography. For more information, see [Cross region inference in Amazon Q Business](https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/cross-region-inference.html).

        An Amazon Q Apps service-linked role will be created if it's absent in the Amazon Web Services account when `QAppsConfiguration` is enabled in the request. For more information, see [Using service-linked roles for Q Apps](https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/using-service-linked-roles-qapps.html).
    flag:
        application-id: The identifier of the Amazon Q Business application.
        attachments-configuration: An option to allow end users to upload files directly during chat.
        auto-subscription-configuration: An option to enable updating the default subscription type assigned to an Amazon Q Business application using IAM identity federation for user management.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description for the Amazon Q Business application.
        display-name: A name for the Amazon Q Business application.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        identity-center-instance-arn: The Amazon Resource Name (ARN) of the IAM Identity Center instance you are either creating for—or connecting to—your Amazon Q Business application.
        personalization-configuration: Configuration information about chat response personalization. For more information, see [Personalizing chat responses](https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/personalizing-chat-responses.html).
        q-apps-configuration: An option to allow end users to create and use Amazon Q Apps in the web experience.
        role-arn: An Amazon Web Services Identity and Access Management (IAM) role that gives Amazon Q Business permission to access Amazon CloudWatch logs and metrics.
