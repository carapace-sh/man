name: create-channel-group
description: Create a channel group to group your channels and origin endpoints.
flags:
    --channel-group-name=!: The name that describes the channel group.
    --client-token=: A unique, case-sensitive token that you provide to ensure the idempotency of the request.
    --description=: Enter any descriptive text that helps you to identify the channel group.
    --tags=: A comma-separated list of tag key:value pairs that you define.
documentation:
    command: Create a channel group to group your channels and origin endpoints. A channel group is the top-level resource that consists of channels and origin endpoints that are associated with it and that provides predictable URLs for stream delivery. All channels and origin endpoints within the channel group are guaranteed to share the DNS. You can create only one channel group with each request.
    flag:
        channel-group-name: The name that describes the channel group. The name is the primary identifier for the channel group, and must be unique for your account in the AWS Region. You can't use spaces in the name. You can't change the name after you create the channel group.
        client-token: A unique, case-sensitive token that you provide to ensure the idempotency of the request.
        description: Enter any descriptive text that helps you to identify the channel group.
        tags: |-
            A comma-separated list of tag key:value pairs that you define. For example:

            `"Key1": "Value1",`

            `"Key2": "Value2"`
