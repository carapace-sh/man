name: get-table
description: Retrieves the `Table` definition in a Data Catalog for a specified table.
flags:
    --catalog-id=: The ID of the Data Catalog where the table resides.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --database-name=!: The name of the database in the catalog in which the table resides.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --include-status-details: Specifies whether to include status details related to a request to create or update an Glue Data Catalog view.
    --name=!: The name of the table for which to retrieve the definition.
    --no-include-status-details: Specifies whether to include status details related to a request to create or update an Glue Data Catalog view.
    --query-as-of-time=: The time as of when to read the table contents.
    --transaction-id=: The transaction ID at which to read the table contents.
documentation:
    command: Retrieves the `Table` definition in a Data Catalog for a specified table.
    flag:
        catalog-id: The ID of the Data Catalog where the table resides. If none is provided, the Amazon Web Services account ID is used by default.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        database-name: The name of the database in the catalog in which the table resides. For Hive compatibility, this name is entirely lowercase.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        include-status-details: Specifies whether to include status details related to a request to create or update an Glue Data Catalog view.
        name: The name of the table for which to retrieve the definition. For Hive compatibility, this name is entirely lowercase.
        query-as-of-time: The time as of when to read the table contents. If not set, the most recent transaction commit time will be used. Cannot be specified along with `TransactionId`.
        transaction-id: The transaction ID at which to read the table contents.
