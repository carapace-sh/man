name: get-exclusions-preview
description: Retrieves the exclusions preview (a list of ExclusionPreview objects) specified by the preview token.
flags:
    --assessment-template-arn=!: The ARN that specifies the assessment template for which the exclusions preview was requested.
    --locale=: The locale into which you want to translate the exclusion's title, description, and recommendation.
    --max-results=: You can use this parameter to indicate the maximum number of items you want in the response.
    --next-token=: You can use this parameter when paginating results.
    --preview-token=!: The unique identifier associated of the exclusions preview.
completion:
    flag:
        locale:
            - EN_US
documentation:
    command: Retrieves the exclusions preview (a list of ExclusionPreview objects) specified by the preview token. You can obtain the preview token by running the CreateExclusionsPreview API.
    flag:
        assessment-template-arn: The ARN that specifies the assessment template for which the exclusions preview was requested.
        locale: The locale into which you want to translate the exclusion's title, description, and recommendation.
        max-results: You can use this parameter to indicate the maximum number of items you want in the response. The default value is 100. The maximum value is 500.
        next-token: You can use this parameter when paginating results. Set the value of this parameter to null on your first call to the GetExclusionsPreviewRequest action. Subsequent calls to the action fill nextToken in the request with the value of nextToken from the previous response to continue listing data.
        preview-token: The unique identifier associated of the exclusions preview.
