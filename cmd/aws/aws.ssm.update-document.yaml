name: update-document
description: Updates one or more values for an SSM document.
flags:
    --attachments=: A list of key-value pairs that describe attachments to a version of a document.
    --content=!: A valid JSON or YAML string.
    --display-name=: The friendly name of the SSM document that you want to update.
    --document-format=: Specify the document format for the new document version.
    --document-version=: The version of the document that you want to update.
    --name=!: The name of the SSM document that you want to update.
    --target-type=: Specify a new target type for the document.
    --version-name=: An optional field specifying the version of the artifact you are updating with the document.
completion:
    flag:
        document-format:
            - YAML
            - JSON
            - TEXT
documentation:
    command: Updates one or more values for an SSM document.
    flag:
        attachments: A list of key-value pairs that describe attachments to a version of a document.
        content: A valid JSON or YAML string.
        display-name: The friendly name of the SSM document that you want to update. This value can differ for each version of the document. If you don't specify a value for this parameter in your request, the existing value is applied to the new document version.
        document-format: Specify the document format for the new document version. Systems Manager supports JSON and YAML documents. JSON is the default format.
        document-version: |-
            The version of the document that you want to update. Currently, Systems Manager supports updating only the latest version of the document. You can specify the version number of the latest version or use the `$LATEST` variable.

            If you change a document version for a State Manager association, Systems Manager immediately runs the association unless you previously specifed the `apply-only-at-cron-interval` parameter.
        name: The name of the SSM document that you want to update.
        target-type: Specify a new target type for the document.
        version-name: An optional field specifying the version of the artifact you are updating with the document. For example, 12.6. This value is unique across all versions of a document, and can't be changed.
