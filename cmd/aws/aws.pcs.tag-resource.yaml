name: tag-resource
description: Adds or edits tags on an PCS resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource.
    --tags=!: 1 or more tags added to the resource.
documentation:
    command: Adds or edits tags on an PCS resource. Each tag consists of a tag key and a tag value. The tag key and tag value are case-sensitive strings. The tag value can be an empty (null) string. To add a tag, specify a new tag key and a tag value. To edit a tag, specify an existing tag key and a new tag value.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource.
        tags: 1 or more tags added to the resource. Each tag consists of a tag key and tag value. The tag value is optional and can be an empty string.
