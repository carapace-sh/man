name: batch-get-flow-association
description: Retrieve the flow associations for the given resources.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --resource-ids=!: A list of resource identifiers to retrieve flow associations.
    --resource-type=: The type of resource association.
completion:
    flag:
        resource-type:
            - WHATSAPP_MESSAGING_PHONE_NUMBER
            - VOICE_PHONE_NUMBER
            - INBOUND_EMAIL
            - OUTBOUND_EMAIL
            - ANALYTICS_CONNECTOR
documentation:
    command: Retrieve the flow associations for the given resources.
    flag:
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        resource-ids: |-
            A list of resource identifiers to retrieve flow associations.

            - Amazon Web Services End User Messaging SMS phone number ARN when using `SMS_PHONE_NUMBER`
            - Amazon Web Services End User Messaging Social phone number ARN when using `WHATSAPP_MESSAGING_PHONE_NUMBER`
        resource-type: The type of resource association.
