name: describe
description: Describe an Artifact Registry attachment.
flags:
    --location=: Location of the attachment.
    --repository=: The repository associated with the attachment.
documentation:
    command: |
        Describe an Artifact Registry attachment.

        This command can fail for the following reasons:
          * The specified attachment does not exist.
          * The active account does not have permission to view attachments.
    flag:
        location: |-
            Location of the attachment. Overrides the default artifacts/location property value
            for this command invocation. To configure the default location, use the command:
            gcloud config set artifacts/location.
            +

            To set the `location` attribute:
            * provide the argument `attachment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `artifacts/location`.
        repository: |-
            The repository associated with the attachment. Overrides the default artifacts/repository property value
            for this command invocation. To configure the default repository, use the command:
            gcloud config set artifacts/repository.
            +

            To set the `repository` attribute:
            * provide the argument `attachment` on the command line with a fully specified name;
            * provide the argument `--repository` on the command line;
            * set the property `artifacts/repository`.
