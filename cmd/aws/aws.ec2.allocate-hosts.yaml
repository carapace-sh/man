name: allocate-hosts
description: Allocates a Dedicated Host to your account.
flags:
    --asset-ids=: The IDs of the Outpost hardware assets on which to allocate the Dedicated Hosts.
    --auto-placement=: Indicates whether the host accepts any untargeted instance launches that match its instance type configuration, or if it only accepts Host tenancy instance launches that specify its unique host ID.
    --availability-zone-id=: The ID of the Availability Zone.
    --availability-zone=: The Availability Zone in which to allocate the Dedicated Host.
    --client-token=: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --host-maintenance=: Indicates whether to enable or disable host maintenance for the Dedicated Host.
    --host-recovery=: Indicates whether to enable or disable host recovery for the Dedicated Host.
    --instance-family=: Specifies the instance family to be supported by the Dedicated Hosts.
    --instance-type=: Specifies the instance type to be supported by the Dedicated Hosts.
    --outpost-arn=: The Amazon Resource Name (ARN) of the Amazon Web Services Outpost on which to allocate the Dedicated Host.
    --quantity=: The number of Dedicated Hosts to allocate to your account with these parameters.
    --tag-specifications=: The tags to apply to the Dedicated Host during creation.
completion:
    flag:
        auto-placement:
            - "on"
            - "off"
        host-maintenance:
            - "on"
            - "off"
        host-recovery:
            - "on"
            - "off"
documentation:
    command: Allocates a Dedicated Host to your account. At a minimum, specify the supported instance type or instance family, the Availability Zone in which to allocate the host, and the number of hosts to allocate.
    flag:
        asset-ids: |-
            The IDs of the Outpost hardware assets on which to allocate the Dedicated Hosts. Targeting specific hardware assets on an Outpost can help to minimize latency between your workloads. This parameter is supported only if you specify **OutpostArn**. If you are allocating the Dedicated Hosts in a Region, omit this parameter.

            - If you specify this parameter, you can omit **Quantity**. In this case, Amazon EC2 allocates a Dedicated Host on each specified hardware asset.
            - If you specify both **AssetIds** and **Quantity**, then the value for **Quantity** must be equal to the number of asset IDs specified.
        auto-placement: |-
            Indicates whether the host accepts any untargeted instance launches that match its instance type configuration, or if it only accepts Host tenancy instance launches that specify its unique host ID. For more information, see [Understanding auto-placement and affinity](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/how-dedicated-hosts-work.html#dedicated-hosts-understanding) in the *Amazon EC2 User Guide*.

            Default: `off`
        availability-zone: The Availability Zone in which to allocate the Dedicated Host.
        availability-zone-id: The ID of the Availability Zone.
        client-token: Unique, case-sensitive identifier that you provide to ensure the idempotency of the request. For more information, see [Ensuring Idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html).
        host-maintenance: Indicates whether to enable or disable host maintenance for the Dedicated Host. For more information, see [Host maintenance](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-hosts-maintenance.html) in the *Amazon EC2 User Guide*.
        host-recovery: |-
            Indicates whether to enable or disable host recovery for the Dedicated Host. Host recovery is disabled by default. For more information, see [Host recovery](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-hosts-recovery.html) in the *Amazon EC2 User Guide*.

            Default: `off`
        instance-family: |-
            Specifies the instance family to be supported by the Dedicated Hosts. If you specify an instance family, the Dedicated Hosts support multiple instance types within that instance family.

            If you want the Dedicated Hosts to support a specific instance type only, omit this parameter and specify **InstanceType** instead. You cannot specify **InstanceFamily** and **InstanceType** in the same request.
        instance-type: |-
            Specifies the instance type to be supported by the Dedicated Hosts. If you specify an instance type, the Dedicated Hosts support instances of the specified instance type only.

            If you want the Dedicated Hosts to support multiple instance types in a specific instance family, omit this parameter and specify **InstanceFamily** instead. You cannot specify **InstanceType** and **InstanceFamily** in the same request.
        outpost-arn: |-
            The Amazon Resource Name (ARN) of the Amazon Web Services Outpost on which to allocate the Dedicated Host. If you specify **OutpostArn**, you can optionally specify **AssetIds**.

            If you are allocating the Dedicated Host in a Region, omit this parameter.
        quantity: The number of Dedicated Hosts to allocate to your account with these parameters. If you are allocating the Dedicated Hosts on an Outpost, and you specify **AssetIds**, you can omit this parameter. In this case, Amazon EC2 allocates a Dedicated Host on each specified hardware asset. If you specify both **AssetIds** and **Quantity**, then the value that you specify for **Quantity** must be equal to the number of asset IDs specified.
        tag-specifications: The tags to apply to the Dedicated Host during creation.
