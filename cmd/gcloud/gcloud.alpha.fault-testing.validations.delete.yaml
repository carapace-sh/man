name: delete
description: '*(ALPHA)*  Delete validations.'
hidden: true
flags:
    --force: Should always be set to true.
    --location=: The location id of the validation resource.
    --no-force&: Should always be set to true.
documentation:
    command: '*(ALPHA)*  Delete a validation'
    flag:
        force: |-
            Should always be set to true. If set to true, any ValidationResources under
            this Validation will also be deleted. (Otherwise, the request will only
            work if the Validation has no ValidationResources.)
        location: |-
            The location id of the validation resource.
            +
            To set the `location` attribute:
            * provide the argument `validation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-force: |-
            Should always be set to true. If set to true, any ValidationResources under
            this Validation will also be deleted. (Otherwise, the request will only
            work if the Validation has no ValidationResources.)
