name: update
description: '*(ALPHA)*  Update an Immersive Stream for XR service instance.'
flags:
    --add-region=: Flag used to specify region and capacity required for the service instance's availability.
    --async: Return immediately, without waiting for the operation in progress to
    --fallback-url=: Fallback url to redirect users to when this service instance is unable to provide the streaming experience
    --location=: Google Cloud location for the instance.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --remove-region=: Region to remove
    --update-region=: Flag used to specify region and capacity required for the service instance's availability.
documentation:
    command: |
        *(ALPHA)*  Update an Immersive Stream for XR service instance.
        This command can be used to update one of the following:
          - the capacity for an existing region of the service instance
          - the content build version served by the instance
          - the fallback url to redirect users to when the service instance is
            unable to provide the streaming experience

        If updating the capacity, only one region may be updated for each
        command execution, and the new capacity may not be 0 or exceed the
        quota limit.
    flag:
        add-region: |-
            Flag used to specify region and capacity required for the service instance's availability.
            +
            'region' is the region in which the instance is deployed.
            +
            'capacity' is the maxium number of concurrent streaming sessions that the instance can support in the given region.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        fallback-url: Fallback url to redirect users to when this service instance is unable to provide the streaming experience
        location: |-
            Google Cloud location for the instance.
            +
            To set the `location` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * location is always global.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        remove-region: Region to remove
        update-region: |-
            Flag used to specify region and capacity required for the service instance's availability.
            +
            'region' is the region in which the instance is deployed.
            +
            'capacity' is the maxium number of concurrent streaming sessions that the instance can support in the given region.
