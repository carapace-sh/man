name: create
description: '*(ALPHA)*  Create a Firewall Plus endpoint.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: Description of the endpoint
    --enable-jumbo-frames: Enable jumbo frames for the firewall endpoint.
    --labels=: List of label KEY=VALUE pairs to add.
    --max-wait=: Time to synchronously wait for the operation to complete, after which the operation continues asynchronously.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-enable-jumbo-frames&: Enable jumbo frames for the firewall endpoint.
    --organization=: Organization ID of the firewall endpoint.
    --target-firewall-attachment=: Target firewall attachment where third party endpoint forwards traffic.
    --zone=: Zone of the firewall endpoint.
documentation:
    command: |+
        *(ALPHA)*  Create a firewall endpoint. Successful creation of an endpoint results
        in an endpoint in READY state. Check the progress of endpoint creation
        by using `gcloud network-security firewall-endpoints list`.

        For more examples, refer to the EXAMPLES section below.

    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        description: Description of the endpoint
        enable-jumbo-frames: Enable jumbo frames for the firewall endpoint. To disable jumbo frames, use --no-enable-jumbo-frames.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        max-wait: Time to synchronously wait for the operation to complete, after which the operation continues asynchronously. Ignored if --no-async isn't specified. See $ gcloud topic datetimes for information on time formats.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-enable-jumbo-frames: Enable jumbo frames for the firewall endpoint. To disable jumbo frames, use --no-enable-jumbo-frames.
        organization: |-
            Organization ID of the firewall endpoint.
            +
            To set the `organization` attribute:
            * provide the argument `FIREWALL_ENDPOINT` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
        target-firewall-attachment: Target firewall attachment where third party endpoint forwards traffic.
        zone: |-
            Zone of the firewall endpoint.
            +
            To set the `zone` attribute:
            * provide the argument `FIREWALL_ENDPOINT` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line.
