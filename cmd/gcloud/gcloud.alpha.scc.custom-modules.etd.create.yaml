name: create
description: '*(ALPHA)*  Create an Event Threat Detection custom module.'
flags:
    --custom-config-from-file=!: Path to a JSON file that contains the configuration for the Event Threat Detection custom module.
    --display-name=!: Sets the display name of the Event Threat Detection custom module.
    --enablement-state=!: Sets the enablement state of the Event Threat Detection custom module.
    --folder=: Folder where the Event Threat Detection custom module resides.
    --module-type=!: Sets the module type of the Event Threat Detection custom module.
    --organization=: Organization where the Event Threat Detection custom module resides.
completion:
    flag:
        enablement-state:
            - disabled
            - enabled
            - enablement-state-unspecified
            - inherited
documentation:
    command: '*(ALPHA)*  Create an Event Threat Detection custom module.'
    flag:
        custom-config-from-file: Path to a JSON file that contains the configuration for the Event Threat Detection custom module. Use a full or relative path to a local file containing the value of custom_config.
        display-name: Sets the display name of the Event Threat Detection custom module. This display name becomes the finding category for all findings that are returned by this custom module. The display name must be between 1 and 128 characters, start with a lowercase letter, and contain alphanumeric characters or underscores only.
        enablement-state: 'Sets the enablement state of the Event Threat Detection custom module. From the following list of possible enablement states, specify either enabled or disabled only. _ENABLEMENT_STATE_ must be one of: *disabled*, *enabled*, *enablement-state-unspecified*, *inherited*.'
        folder: Folder where the Event Threat Detection custom module resides. Formatted as `folders/456` or just `456`.
        module-type: Sets the module type of the Event Threat Detection custom module.
        organization: Organization where the Event Threat Detection custom module resides. Formatted as `organizations/123` or just `123`.
