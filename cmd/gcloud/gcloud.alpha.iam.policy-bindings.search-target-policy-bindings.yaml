name: search-target-policy-bindings
description: '*(ALPHA)*  Search policy bindings by target.'
hidden: true
flags:
    --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
    --folder=: The folder id of the location resource.
    --limit=: Maximum number of resources to list.
    --location=!: ID of the location or fully qualified identifier for the location.
    --organization=: The organization id of the location resource.
    --page-size=: Some services group resource list output into pages.
    --sort-by=: Comma-separated list of resource field key names to sort by.
    --target=!: The target resource, which is bound to the policy in the binding.
documentation:
    command: |
        *(ALPHA)*  Search policy bindings by target.
    flag:
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        folder: |-
            The folder id of the location resource.
            +
            To set the `folder` attribute:
            * provide the argument `--location` on the command line with a fully specified name;
            * provide the argument `--folder` on the command line. Must be specified for resource of type [iam.folders.locations].
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line.
        organization: |-
            The organization id of the location resource.
            +
            To set the `organization` attribute:
            * provide the argument `--location` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line. Must be specified for resource of type [iam.organizations.locations].
        page-size: |-
            Some services group resource list output into pages. This flag specifies
            the maximum number of resources per page. The default is determined by the
            service if it supports paging, otherwise it is *unlimited* (no paging).
            Paging may be applied before or after *--filter* and *--limit* depending
            on the service.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
        target: |-
            The target resource, which is bound to the policy in the binding.
            +
            Format:
            +
            * `//iam.googleapis.com/locations/global/workforcePools/POOL_ID`
            * `//iam.googleapis.com/projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL_ID`
            * `//iam.googleapis.com/locations/global/workspace/WORKSPACE_ID`
            * `//cloudresourcemanager.googleapis.com/projects/{project_number}`
            * `//cloudresourcemanager.googleapis.com/folders/{folder_id}`
            * `//cloudresourcemanager.googleapis.com/organizations/{organization_id}`
