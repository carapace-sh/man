name: describe-experience
description: Gets information about your Amazon Kendra experience such as a search application.
flags:
    --id=!: The identifier of your Amazon Kendra experience you want to get information on.
    --index-id=!: The identifier of the index for your Amazon Kendra experience.
documentation:
    command: Gets information about your Amazon Kendra experience such as a search application. For more information on creating a search application experience, see [Building a search experience with no code](https://docs.aws.amazon.com/kendra/latest/dg/deploying-search-experience-no-code.html).
    flag:
        id: The identifier of your Amazon Kendra experience you want to get information on.
        index-id: The identifier of the index for your Amazon Kendra experience.
