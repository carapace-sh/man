name: update-policy-template
description: Updates the specified policy template.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: Specifies a new description to apply to the policy template.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --policy-store-id=!: Specifies the ID of the policy store that contains the policy template that you want to update.
    --policy-template-id=!: Specifies the ID of the policy template that you want to update.
    --statement=!: Specifies new statement content written in Cedar policy language to replace the current body of the policy template.
documentation:
    command: |-
        Updates the specified policy template. You can update only the description and the some elements of the [policyBody](https://docs.aws.amazon.com/verifiedpermissions/latest/apireference/API_UpdatePolicyTemplate.html#amazonverifiedpermissions-UpdatePolicyTemplate-request-policyBody).

        Changes you make to the policy template content are immediately (within the constraints of eventual consistency) reflected in authorization decisions that involve all template-linked policies instantiated from this template.

        Verified Permissions is [*eventually consistent*](https://wikipedia.org/wiki/Eventual_consistency) . It can take a few seconds for a new or changed element to propagate through the service and be visible in the results of other Verified Permissions operations.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: Specifies a new description to apply to the policy template.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        policy-store-id: Specifies the ID of the policy store that contains the policy template that you want to update.
        policy-template-id: Specifies the ID of the policy template that you want to update.
        statement: |-
            Specifies new statement content written in Cedar policy language to replace the current body of the policy template.

            You can change only the following elements of the policy body:

            - The `action` referenced by the policy template.
            - Any conditional clauses, such as `when` or `unless` clauses.

            You **can't** change the following elements:

            - The effect (`permit` or `forbid`) of the policy template.
            - The `principal` referenced by the policy template.
            - The `resource` referenced by the policy template.
