name: update-job-priority
description: Updates an existing S3 Batch Operations job's priority.
flags:
    --account-id=!: The Amazon Web Services account ID associated with the S3 Batch Operations job.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --job-id=!: The ID for the job whose priority you want to update.
    --priority=!: The priority you want to assign to this job.
documentation:
    command: |-
        Updates an existing S3 Batch Operations job's priority. For more information, see [S3 Batch Operations](https://docs.aws.amazon.com/AmazonS3/latest/userguide/batch-ops.html) in the *Amazon S3 User Guide*.

        Permissions

        To use the `UpdateJobPriority` operation, you must have permission to perform the `s3:UpdateJobPriority` action.

        Related actions include:

        - [CreateJob](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_CreateJob.html)
        - [ListJobs](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_ListJobs.html)
        - [DescribeJob](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_DescribeJob.html)
        - [UpdateJobStatus](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_UpdateJobStatus.html)

        You must URL encode any signed header values that contain spaces. For example, if your header value is `my file.txt`, containing two spaces after `my`, you must URL encode this value to `my%20%20file.txt`.
    flag:
        account-id: The Amazon Web Services account ID associated with the S3 Batch Operations job.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
