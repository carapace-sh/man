name: list-scheduled-actions
description: Returns a list of scheduled actions.
flags:
    --max-results=: An optional parameter that specifies the maximum number of results to return.
    --namespace-name=: The name of namespace associated with the scheduled action to retrieve.
    --next-token=: If `nextToken` is returned, there are more results available.
documentation:
    command: Returns a list of scheduled actions. You can use the flags to filter the list of returned scheduled actions.
    flag:
        max-results: An optional parameter that specifies the maximum number of results to return. Use `nextToken` to display the next page of results.
        namespace-name: The name of namespace associated with the scheduled action to retrieve.
        next-token: If `nextToken` is returned, there are more results available. The value of `nextToken` is a unique pagination token for each page. Make the call again using the returned token to retrieve the next page.
