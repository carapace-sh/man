name: create
description: Create a Dataplex Entry resource.
flags:
    --aspects=: Path to a YAML or JSON file containing Aspects to add or update.
    --entry-group=: Entry group containing Dataplex Entries.
    --entry-source-ancestors=: Information about individual items in the hierarchy of an Entry.
    --entry-source-create-time=: The creation date and time of the resource in the source system.
    --entry-source-description=: Description of the Entry.
    --entry-source-display-name=: User friendly display name.
    --entry-source-labels=: List of label KEY=VALUE pairs to add.
    --entry-source-platform=: The platform containing the source system.
    --entry-source-resource=: The name of the resource in the source system.
    --entry-source-system=: The name of the source system.
    --entry-source-update-time=: The update date and time of the resource in the source system.
    --entry-type-location=: The location of the EntryType resource.
    --entry-type-project=: The project of the EntryType resource.
    --entry-type=!: ID of the entry type or fully qualified identifier for the entry type.
    --fully-qualified-name=: A name for the entry that can reference it in an external system.
    --location=: Location of the Dataplex resource.
    --parent-entry=!: ID of the entry or fully qualified identifier for the entry.
documentation:
    command: Create a Dataplex Entry resource.
    flag:
        aspects: |-
            Path to a YAML or JSON file containing Aspects to add or update.
            +
            When this flag is specified, only Aspects referenced in the file are
            going to be added or updated. Specifying this flag does not remove any
            Aspects from the entry. In other words, specifying this flag will not
            lead to a full replacement of Aspects with a contents of the provided
            file.
            +
            Content of the file contains a map, where keys are in the format
            ``ASPECT_TYPE@PATH'', or just ``ASPECT_TYPE'', if the Aspect is attached
            to an entry itself rather than to a specific column defined in the
            schema.
            +
            Values in the map represent Aspect's content, which must conform to a
            template defined for a given ``ASPECT_TYPE''. Each Aspect will be replaced
            fully by the provided content. That means data in the Aspect will be
            replaced and not merged with existing contents of that Aspect in the Entry.
            +
            ``ASPECT_TYPE'' is expected to be in a format
            ``PROJECT_ID.LOCATION.ASPECT_TYPE_ID''.
            +
            ``PATH'' can be either empty (which means a 'root' path, such that Aspect
            is attached to the entry itself) or point to a specific column defined
            in the schema. For example: `Schema.some_column`.
            +
            Example YAML format:
            +
            ```
              project-id1.us-central1.my-aspect-type1:
                data:
                  aspectField1: someValue
                  aspectField2: someOtherValue
              project-id2.us-central1.my-aspect-type2@Schema.column1:
                data:
                  aspectField3: someValue3
            ```
            +
            Example JSON format:
            +
            ```
              {
                "project-id1.us-central1.my-aspect-type1": {
                  "data": {
                    "aspectField1": "someValue",
                    "aspectField2": "someOtherValue"
                  }
                },
                "project-id2.us-central1.my-aspect-type2@Schema.column1": {
                  "data": {
                    "aspectField3": "someValue3"
                  }
                }
              }
            ```
        entry-group: |-
            Entry group containing Dataplex Entries.
            +

            To set the `entry-group` attribute:
            * provide the argument `entry` on the command line with a fully specified name;
            * provide the argument `--entry-group` on the command line.
        entry-source-ancestors: Information about individual items in the hierarchy of an Entry.
        entry-source-create-time: The creation date and time of the resource in the source system.
        entry-source-description: Description of the Entry.
        entry-source-display-name: User friendly display name.
        entry-source-labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        entry-source-platform: The platform containing the source system.
        entry-source-resource: The name of the resource in the source system.
        entry-source-system: The name of the source system.
        entry-source-update-time: The update date and time of the resource in the source system.
        entry-type: |-
            ID of the entry type or fully qualified identifier for the entry type.
            +
            To set the `entry_type` attribute:
            * provide the argument `--entry-type` on the command line.
        entry-type-location: |-
            The location of the EntryType resource.
            +
            To set the `entry-type-location` attribute:
            * provide the argument `--entry-type` on the command line with a fully specified name;
            * provide the argument `--entry-type-location` on the command line.
        entry-type-project: |-
            The project of the EntryType resource.
            +
            To set the `entry-type-project` attribute:
            * provide the argument `--entry-type` on the command line with a fully specified name;
            * provide the argument `--entry-type-project` on the command line.
        fully-qualified-name: A name for the entry that can reference it in an external system. The maximum size of the field is 4000 characters.
        location: |-
            Location of the Dataplex resource.
            +

            To set the `location` attribute:
            * provide the argument `entry` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
        parent-entry: |-
            ID of the entry or fully qualified identifier for the entry.
            +
            To set the `entry` attribute:
            * provide the argument `--parent-entry` on the command line.
