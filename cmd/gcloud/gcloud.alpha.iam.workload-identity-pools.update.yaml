name: update
description: '*(ALPHA)*  Update a workload identity pool.'
flags:
    --description=: A description of the pool.
    --disabled: Whether the pool is disabled.
    --display-name=: A display name for the pool.
    --location=: The location name.
    --no-disabled&: Whether the pool is disabled.
documentation:
    command: '*(ALPHA)*  Update a workload identity pool.'
    flag:
        description: A description of the pool. Cannot exceed 256 characters.
        disabled: |-
            Whether the pool is disabled. You cannot use a disabled pool to exchange tokens, or use
            existing tokens to access resources. If the pool is re-enabled, existing tokens grant access
            again.
        display-name: A display name for the pool. Cannot exceed 32 characters.
        location: |-
            The location name.
            +
            To set the `location` attribute:
            * provide the argument `workload_identity_pool` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-disabled: |-
            Whether the pool is disabled. You cannot use a disabled pool to exchange tokens, or use
            existing tokens to access resources. If the pool is re-enabled, existing tokens grant access
            again.
