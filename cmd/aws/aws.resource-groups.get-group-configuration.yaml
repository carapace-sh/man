name: get-group-configuration
description: Retrieves the service configuration associated with the specified resource group.
flags:
    --group=: The name or the Amazon resource name (ARN) of the resource group for which you want to retrive the service configuration.
documentation:
    command: |-
        Retrieves the service configuration associated with the specified resource group. For details about the service configuration syntax, see [Service configurations for Resource Groups](https://docs.aws.amazon.com/ARG/latest/APIReference/about-slg.html).

        **Minimum permissions**

        To run this command, you must have the following permissions:

        - `resource-groups:GetGroupConfiguration`
    flag:
        group: The name or the Amazon resource name (ARN) of the resource group for which you want to retrive the service configuration.
