name: update-participant-authentication
description: Instructs Amazon Connect to resume the authentication process.
flags:
    --code=: The `code` query parameter provided by Cognito in the `redirectUri`.
    --error-description=: The `error_description` parameter provided by Cognito in the `redirectUri`.
    --error=: The `error` query parameter provided by Cognito in the `redirectUri`.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --state=!: The `state` query parameter that was provided by Cognito in the `redirectUri`.
documentation:
    command: |-
        Instructs Amazon Connect to resume the authentication process. The subsequent actions depend on the request body contents:

        - **If a code is provided**: Connect retrieves the identity information from Amazon Cognito and imports it into Connect Customer Profiles.
        - **If an error is provided**: The error branch of the Authenticate Customer block is executed.

        The API returns a success response to acknowledge the request. However, the interaction and exchange of identity information occur asynchronously after the response is returned.
    flag:
        code: The `code` query parameter provided by Cognito in the `redirectUri`.
        error: The `error` query parameter provided by Cognito in the `redirectUri`.
        error-description: The `error_description` parameter provided by Cognito in the `redirectUri`.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        state: The `state` query parameter that was provided by Cognito in the `redirectUri`. This will also match the `state` parameter provided in the `AuthenticationUrl` from the [GetAuthenticationUrl](https://docs.aws.amazon.com/connect/latest/APIReference/API_GetAuthenticationUrl.html) response.
