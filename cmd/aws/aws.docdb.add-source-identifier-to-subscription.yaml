name: add-source-identifier-to-subscription
description: Adds a source identifier to an existing event notification subscription.
flags:
    --source-identifier=!: 'The identifier of the event source to be added:'
    --subscription-name=!: The name of the Amazon DocumentDB event notification subscription that you want to add a source identifier to.
documentation:
    command: Adds a source identifier to an existing event notification subscription.
    flag:
        source-identifier: |-
            The identifier of the event source to be added:

            - If the source type is an instance, a `DBInstanceIdentifier` must be provided.
            - If the source type is a security group, a `DBSecurityGroupName` must be provided.
            - If the source type is a parameter group, a `DBParameterGroupName` must be provided.
            - If the source type is a snapshot, a `DBSnapshotIdentifier` must be provided.
        subscription-name: The name of the Amazon DocumentDB event notification subscription that you want to add a source identifier to.
