name: create-site
description: Creates a new site in a global network.
flags:
    --description=: A description of your site.
    --global-network-id=!: The ID of the global network.
    --location=: The site location.
    --tags=: The tags to apply to the resource during creation.
documentation:
    command: Creates a new site in a global network.
    flag:
        description: |-
            A description of your site.

            Constraints: Maximum length of 256 characters.
        global-network-id: The ID of the global network.
        location: |-
            The site location. This information is used for visualization in the Network Manager console. If you specify the address, the latitude and longitude are automatically calculated.

            - `Address`: The physical address of the site.
            - `Latitude`: The latitude of the site.
            - `Longitude`: The longitude of the site.
        tags: The tags to apply to the resource during creation.
