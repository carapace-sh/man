name: start-pipeline-execution
description: Starts the specified pipeline.
flags:
    --client-request-token=: The system-generated unique ID used to identify a unique execution request.
    --name=!: The name of the pipeline to start.
    --source-revisions=: A list that allows you to specify, or override, the source revision for a pipeline execution that's being started.
    --variables=: A list that overrides pipeline variables for a pipeline execution that's being started.
documentation:
    command: Starts the specified pipeline. Specifically, it begins processing the latest commit to the source location specified as part of the pipeline.
    flag:
        client-request-token: The system-generated unique ID used to identify a unique execution request.
        name: The name of the pipeline to start.
        source-revisions: A list that allows you to specify, or override, the source revision for a pipeline execution that's being started. A source revision is the version with all the changes to your application code, or source artifact, for the pipeline execution.
        variables: A list that overrides pipeline variables for a pipeline execution that's being started. Variable names must match `[A-Za-z0-9@\-_]+`, and the values can be anything except an empty string.
