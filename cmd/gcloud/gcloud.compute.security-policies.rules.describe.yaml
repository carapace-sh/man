name: describe
description: Describe a Compute Engine security policy rule.
flags:
    --region=: Region of the security policy to describe.
    --security-policy=: The security policy that this rule belongs to.
documentation:
    command: |-
        *gcloud compute security-policies rules describe* displays all data associated with a security policy rule.

        ## EXAMPLES

        To describe the rule at priority 1000, run:

          $ gcloud compute security-policies rules describe 1000 \
             --security-policy=my-policy
    flag:
        region: |-
            Region of the security policy to describe. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            Overrides the default *compute/region* property value for this command invocation.
        security-policy: The security policy that this rule belongs to.
