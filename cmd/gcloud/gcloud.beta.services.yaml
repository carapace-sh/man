name: services
description: '*(BETA)*  List, enable and disable APIs and services.'
documentation:
    command: |-
        *(BETA)*  The gcloud services command group lets you manage your project's access to
        services provided by Google and third parties.

        ## EXAMPLES

        To see how to enable a service, run:

          $ gcloud beta services enable --help

        To see how to list services, run:

          $ gcloud beta services list --help

        To see how to disable a service, run:

          $ gcloud beta services disable --help
