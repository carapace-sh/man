name: create-environment-account-connection
description: Create an environment account connection in an environment account so that environment infrastructure resources can be provisioned in the environment account from a management account.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: When included, if two identical requests are made with the same client token, Proton returns the environment account connection that the first request created.
    --codebuild-role-arn=: The Amazon Resource Name (ARN) of an IAM service role in the environment account.
    --component-role-arn=: The Amazon Resource Name (ARN) of the IAM service role that Proton uses when provisioning directly defined components in the associated environment account.
    --environment-name=!: The name of the Proton environment that's created in the associated management account.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --management-account-id=!: The ID of the management account that accepts or rejects the environment account connection.
    --role-arn=: The Amazon Resource Name (ARN) of the IAM service role that's created in the environment account.
    --tags=: An optional list of metadata items that you can associate with the Proton environment account connection.
documentation:
    command: |-
        Create an environment account connection in an environment account so that environment infrastructure resources can be provisioned in the environment account from a management account.

        An environment account connection is a secure bi-directional connection between a *management account* and an *environment account* that maintains authorization and permissions. For more information, see [Environment account connections](https://docs.aws.amazon.com/proton/latest/userguide/ag-env-account-connections.html) in the *Proton User guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: When included, if two identical requests are made with the same client token, Proton returns the environment account connection that the first request created.
        codebuild-role-arn: The Amazon Resource Name (ARN) of an IAM service role in the environment account. Proton uses this role to provision infrastructure resources using CodeBuild-based provisioning in the associated environment account.
        component-role-arn: |-
            The Amazon Resource Name (ARN) of the IAM service role that Proton uses when provisioning directly defined components in the associated environment account. It determines the scope of infrastructure that a component can provision in the account.

            You must specify `componentRoleArn` to allow directly defined components to be associated with any environments running in this account.

            For more information about components, see [Proton components](https://docs.aws.amazon.com/proton/latest/userguide/ag-components.html) in the *Proton User Guide*.
        environment-name: The name of the Proton environment that's created in the associated management account.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        management-account-id: The ID of the management account that accepts or rejects the environment account connection. You create and manage the Proton environment in this account. If the management account accepts the environment account connection, Proton can use the associated IAM role to provision environment infrastructure resources in the associated environment account.
        role-arn: The Amazon Resource Name (ARN) of the IAM service role that's created in the environment account. Proton uses this role to provision infrastructure resources in the associated environment account.
        tags: |-
            An optional list of metadata items that you can associate with the Proton environment account connection. A tag is a key-value pair.

            For more information, see [Proton resources and tagging](https://docs.aws.amazon.com/proton/latest/userguide/resources.html) in the *Proton User Guide*.
