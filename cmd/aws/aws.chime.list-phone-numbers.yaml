name: list-phone-numbers
description: Lists the phone numbers for the specified Amazon Chime account, Amazon Chime user, Amazon Chime Voice Connector, or Amazon Chime Voice Connector group.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --filter-name=: The filter to use to limit the number of results.
    --filter-value=: The value to use for the filter.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of results to return in a single call.
    --next-token=: The token to use to retrieve the next page of results.
    --product-type=: The phone number product type.
    --status=: The phone number status.
completion:
    flag:
        filter-name:
            - AccountId
            - UserId
            - VoiceConnectorId
            - VoiceConnectorGroupId
            - SipRuleId
        product-type:
            - BusinessCalling
            - VoiceConnector
            - SipMediaApplicationDialIn
        status:
            - AcquireInProgress
            - AcquireFailed
            - Unassigned
            - Assigned
            - ReleaseInProgress
            - DeleteInProgress
            - ReleaseFailed
            - DeleteFailed
documentation:
    command: Lists the phone numbers for the specified Amazon Chime account, Amazon Chime user, Amazon Chime Voice Connector, or Amazon Chime Voice Connector group.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        filter-name: The filter to use to limit the number of results.
        filter-value: The value to use for the filter.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The maximum number of results to return in a single call.
        next-token: The token to use to retrieve the next page of results.
        product-type: The phone number product type.
        status: The phone number status.
