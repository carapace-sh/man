name: get-call-analytics-category
description: Provides information about the specified Call Analytics category.
flags:
    --category-name=!: The name of the Call Analytics category you want information about.
documentation:
    command: |-
        Provides information about the specified Call Analytics category.

        To get a list of your Call Analytics categories, use the operation.
    flag:
        category-name: The name of the Call Analytics category you want information about. Category names are case sensitive.
