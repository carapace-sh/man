name: update-folder
description: Updates the specified attributes of the specified folder.
flags:
    --authentication-token=: Amazon WorkDocs authentication token.
    --folder-id=!: The ID of the folder.
    --name=: The name of the folder.
    --parent-folder-id=: The ID of the parent folder.
    --resource-state=: The resource state of the folder.
completion:
    flag:
        resource-state:
            - ACTIVE
            - RESTORING
            - RECYCLING
            - RECYCLED
documentation:
    command: Updates the specified attributes of the specified folder. The user must have access to both the folder and its parent folder, if applicable.
    flag:
        authentication-token: Amazon WorkDocs authentication token. Not required when using Amazon Web Services administrator credentials to access the API.
        folder-id: The ID of the folder.
        name: The name of the folder.
        parent-folder-id: The ID of the parent folder.
        resource-state: The resource state of the folder. Only ACTIVE and RECYCLED are accepted values from the API.
