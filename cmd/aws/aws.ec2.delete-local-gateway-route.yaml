name: delete-local-gateway-route
description: Deletes the specified route from the specified local gateway route table.
flags:
    --destination-cidr-block=: The CIDR range for the route.
    --destination-prefix-list-id=: Use a prefix list in place of `DestinationCidrBlock`.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --local-gateway-route-table-id=!: The ID of the local gateway route table.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: Deletes the specified route from the specified local gateway route table.
    flag:
        destination-cidr-block: The CIDR range for the route. This must match the CIDR for the route exactly.
        destination-prefix-list-id: Use a prefix list in place of `DestinationCidrBlock`. You cannot use `DestinationPrefixListId` and `DestinationCidrBlock` in the same request.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        local-gateway-route-table-id: The ID of the local gateway route table.
