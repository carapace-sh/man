name: delete
description: '*(ALPHA)*  Delete a Compute Engine organization security policy association.'
flags:
    --organization=: ID of the organization in which the security policy is to be detached.
    --security-policy=!: short name or ID of the security policy ID of the association.
documentation:
    command: '*(ALPHA)*  *gcloud alpha compute org-security-policies associations delete* is used to delete organization security policy association.'
    flag:
        organization: ID of the organization in which the security policy is to be detached. Must be set if SECURITY_POLICY is short name.
        security-policy: short name or ID of the security policy ID of the association.
