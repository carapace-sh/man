name: create-subnet-cidr-reservation
description: Creates a subnet CIDR reservation.
flags:
    --cidr=!: The IPv4 or IPV6 CIDR range to reserve.
    --description=: The description to assign to the subnet CIDR reservation.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --reservation-type=!: The type of reservation.
    --subnet-id=!: The ID of the subnet.
    --tag-specifications=: The tags to assign to the subnet CIDR reservation.
completion:
    flag:
        reservation-type:
            - prefix
            - explicit
documentation:
    command: Creates a subnet CIDR reservation. For more information, see [Subnet CIDR reservations](https://docs.aws.amazon.com/vpc/latest/userguide/subnet-cidr-reservation.html) in the *Amazon VPC User Guide* and [Manage prefixes for your network interfaces](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/work-with-prefixes.html) in the *Amazon EC2 User Guide*.
    flag:
        cidr: The IPv4 or IPV6 CIDR range to reserve.
        description: The description to assign to the subnet CIDR reservation.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        reservation-type: |-
            The type of reservation. The reservation type determines how the reserved IP addresses are assigned to resources.

            - `prefix` - Amazon Web Services assigns the reserved IP addresses to network interfaces.
            - `explicit` - You assign the reserved IP addresses to network interfaces.
        subnet-id: The ID of the subnet.
        tag-specifications: The tags to assign to the subnet CIDR reservation.
