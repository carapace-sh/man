name: sign-and-create
description: '*(ALPHA)*  Sign and create a Binary Authorization Attestation using a Cloud KMS key.'
flags:
    --artifact-url=!: Container URL.
    --attestor-project=: Project ID of the Google Cloud project for the attestor.
    --attestor=!: ID of the attestor or fully qualified identifier for the attestor.
    --dsse-type=: DSSE type used for pae encoding.
    --keyversion-key=: The key of the CryptoKeyVersion.
    --keyversion-keyring=: The keyring of the CryptoKeyVersion.
    --keyversion-location=: The location of the CryptoKeyVersion.
    --keyversion-project=: Project ID of the Google Cloud project for the CryptoKeyVersion.
    --keyversion=!: ID of the CryptoKeyVersion or fully qualified identifier for the CryptoKeyVersion.
    --no-pae-encode-payload&: Whether to pae-encode the payload before signing.
    --no-validate&: Whether to validate that the Attestation can be verified by the
    --note-project=: The Container Analysis project for the note.
    --note=!: ID of the note or fully qualified identifier for the note.
    --pae-encode-payload: Whether to pae-encode the payload before signing.
    --public-key-id-override=: If provided, the ID of the public key that will be used to verify the
    --validate: Whether to validate that the Attestation can be verified by the
documentation:
    command: |-
        *(ALPHA)*  This command signs and creates a Binary Authorization attestation for your
        project. The attestation is created for the specified artifact (e.g. a gcr.io
        container URL), associate with the specified attestor, and stored under the
        specified project.

        ## EXAMPLES

        To sign and create an attestation in the project "my_proj" as the attestor
        with resource path "projects/foo/attestors/bar" with the key
        "projects/foo/locations/us-west1/keyRings/aring/cryptoKeys/akey/cryptoKeyVersions/1",
        run:

            $ gcloud alpha container binauthz attestations sign-and-create \
                --project=my_proj \
                --artifact-url='gcr.io/example-project/example-image@sha256:abcd' \
                --attestor=projects/foo/attestors/bar \
                --keyversion-project=foo \
                --keyversion-location=us-west1 \
                --keyversion-keyring=aring \
                --keyversion-key=akey \
                --keyversion=1

        To sign and create an attestation in the project "my_proj" in note "bar"
        with the key "projects/foo/locations/us-west1/keyRings/aring/cryptoKeys/akey/cryptoKeyVersions/1",
        run:

            $ gcloud alpha container binauthz attestations sign-and-create \
                --project=my_proj \
                --artifact-url='gcr.io/example-project/example-image@sha256:abcd' \
                --note=projects/my_proj/notes/bar \
                --keyversion-project=foo \
                --keyversion-location=us-west1 \
                --keyversion-keyring=aring \
                --keyversion-key=akey \
                --keyversion=1
    flag:
        artifact-url: Container URL. May be in the `gcr.io/repository/image` format, or may optionally contain the `http` or `https` scheme
        attestor: |-
            ID of the attestor or fully qualified identifier for the attestor.
            +
            To set the `name` attribute:
            * provide the argument `--attestor` on the command line.
        attestor-project: |-
            Project ID of the Google Cloud project for the attestor.
            +
            To set the `project` attribute:
            * provide the argument `--attestor` on the command line with a fully specified name;
            * provide the argument `--attestor-project` on the command line;
            * provide the argument `--project` on the command line;
            * set the property `core/project`.
        dsse-type: DSSE type used for pae encoding.
        keyversion: |-
            ID of the CryptoKeyVersion or fully qualified identifier for the CryptoKeyVersion.
            +
            To set the `version` attribute:
            * provide the argument `--keyversion` on the command line.
        keyversion-key: |-
            The key of the CryptoKeyVersion.
            +
            To set the `key` attribute:
            * provide the argument `--keyversion` on the command line with a fully specified name;
            * provide the argument `--keyversion-key` on the command line.
        keyversion-keyring: |-
            The keyring of the CryptoKeyVersion.
            +
            To set the `keyring` attribute:
            * provide the argument `--keyversion` on the command line with a fully specified name;
            * provide the argument `--keyversion-keyring` on the command line.
        keyversion-location: |-
            The location of the CryptoKeyVersion.
            +
            To set the `location` attribute:
            * provide the argument `--keyversion` on the command line with a fully specified name;
            * provide the argument `--keyversion-location` on the command line.
        keyversion-project: |-
            Project ID of the Google Cloud project for the CryptoKeyVersion.
            +
            To set the `project` attribute:
            * provide the argument `--keyversion` on the command line with a fully specified name;
            * provide the argument `--keyversion-project` on the command line;
            * provide the argument `--project` on the command line;
            * set the property `core/project`.
        no-pae-encode-payload: |
            Whether to pae-encode the payload before signing.
        no-validate: |
            Whether to validate that the Attestation can be verified by the
            provided Attestor.
        note: |-
            ID of the note or fully qualified identifier for the note.
            +
            To set the `note` attribute:
            * provide the argument `--note` on the command line.
        note-project: |-
            The Container Analysis project for the note.
            +
            To set the `project` attribute:
            * provide the argument `--note` on the command line with a fully specified name;
            * provide the argument `--note-project` on the command line.
        pae-encode-payload: Whether to pae-encode the payload before signing.
        public-key-id-override: |-
            If provided, the ID of the public key that will be used to verify the
            Attestation instead of the default generated one. This ID should match
            the one found on the Attestor resource(s) which will use this
            Attestation.
            +
            This parameter is only necessary if the `--public-key-id-override`
            flag was provided when this KMS key was added to the Attestor.
        validate: |-
            Whether to validate that the Attestation can be verified by the
            provided Attestor.
