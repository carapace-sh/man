name: env-init
description: '*(BETA)*  Print the commands required to export env variables of a datastore.'
flags:
    --data-dir=: The directory to be used to store/retrieve data/config for an emulator run.
documentation:
    command: |-
        *(BETA)*  Prints the commands but does not execute them. It will output
        in shell syntax or on Windows it will be in cmd.exe syntax.

        ## EXAMPLES

        To print the env variables exports for a datastore emulator, run:

          $ gcloud beta emulators datastore env-init --data-dir=DATA-DIR

        You can use this command to set env vars in a bash script by adding the below
        line in the script.

          eval $(gcloud beta emulators datastore env-init --data-dir=DATA-DIR)
    flag:
        data-dir: |-
            The directory to be used to store/retrieve data/config for an emulator run. The default value is `<USER_CONFIG_DIR>/emulators/datastore`. The value of USER_CONFIG_DIR can be found by running:
            +
              $ gcloud info --format='get(config.paths.global_config_dir)'
