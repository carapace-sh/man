name: create-file-cache
description: Creates a new Amazon File Cache resource.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=: An idempotency token for resource creation, in a string of up to 63 ASCII characters.
    --copy-tags-to-data-repository-associations: A boolean flag indicating whether tags for the cache should be copied to data repository associations.
    --data-repository-associations=:
        description: A list of up to 8 configurations for data repository associations (DRAs) to be created during the cache creation.
        nargs: -1
    --file-cache-type-version=!: Sets the Lustre version for the cache that you're creating, which must be `2.12`.
    --file-cache-type=!: The type of cache that you're creating, which must be `LUSTRE`.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --kms-key-id=: Specifies the ID of the Key Management Service (KMS) key to use for encrypting data on an Amazon File Cache.
    --lustre-configuration=: The configuration for the Amazon File Cache resource being created.
    --no-copy-tags-to-data-repository-associations: A boolean flag indicating whether tags for the cache should be copied to data repository associations.
    --security-group-ids=:
        description: A list of IDs specifying the security groups to apply to all network interfaces created for Amazon File Cache access.
        nargs: -1
    --storage-capacity=!: The storage capacity of the cache in gibibytes (GiB).
    --subnet-ids=!:
        nargs: -1
    --tags=:
        nargs: -1
completion:
    flag:
        file-cache-type:
            - LUSTRE
documentation:
    command: |-
        Creates a new Amazon File Cache resource.

        You can use this operation with a client request token in the request that Amazon File Cache uses to ensure idempotent creation. If a cache with the specified client request token exists and the parameters match, `CreateFileCache` returns the description of the existing cache. If a cache with the specified client request token exists and the parameters don't match, this call returns `IncompatibleParameterError`. If a file cache with the specified client request token doesn't exist, `CreateFileCache` does the following:

        - Creates a new, empty Amazon File Cache resource with an assigned ID, and an initial lifecycle state of `CREATING`.
        - Returns the description of the cache in JSON format.

        The `CreateFileCache` call returns while the cache's lifecycle state is still `CREATING`. You can check the cache creation status by calling the [DescribeFileCaches](https://docs.aws.amazon.com/fsx/latest/APIReference/API_DescribeFileCaches.html) operation, which returns the cache state along with other information.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: |-
            An idempotency token for resource creation, in a string of up to 63 ASCII characters. This token is automatically filled on your behalf when you use the Command Line Interface (CLI) or an Amazon Web Services SDK.

            By using the idempotent operation, you can retry a `CreateFileCache` operation without the risk of creating an extra cache. This approach can be useful when an initial call fails in a way that makes it unclear whether a cache was created. Examples are if a transport level timeout occurred, or your connection was reset. If you use the same client request token and the initial call created a cache, the client receives success as long as the parameters are the same.
        copy-tags-to-data-repository-associations: A boolean flag indicating whether tags for the cache should be copied to data repository associations. This value defaults to false.
        data-repository-associations: |-
            A list of up to 8 configurations for data repository associations (DRAs) to be created during the cache creation. The DRAs link the cache to either an Amazon S3 data repository or a Network File System (NFS) data repository that supports the NFSv3 protocol.

            The DRA configurations must meet the following requirements:

            - All configurations on the list must be of the same data repository type, either all S3 or all NFS. A cache can't link to different data repository types at the same time.
            - An NFS DRA must link to an NFS file system that supports the NFSv3 protocol.

            DRA automatic import and automatic export is not supported.
        file-cache-type: The type of cache that you're creating, which must be `LUSTRE`.
        file-cache-type-version: Sets the Lustre version for the cache that you're creating, which must be `2.12`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        kms-key-id: Specifies the ID of the Key Management Service (KMS) key to use for encrypting data on an Amazon File Cache. If a `KmsKeyId` isn't specified, the Amazon FSx-managed KMS key for your account is used. For more information, see [Encrypt](https://docs.aws.amazon.com/kms/latest/APIReference/API_Encrypt.html) in the *Key Management Service API Reference*.
        lustre-configuration: The configuration for the Amazon File Cache resource being created.
        security-group-ids: A list of IDs specifying the security groups to apply to all network interfaces created for Amazon File Cache access. This list isn't returned in later requests to describe the cache.
        storage-capacity: The storage capacity of the cache in gibibytes (GiB). Valid values are 1200 GiB, 2400 GiB, and increments of 2400 GiB.
        subnet-ids: ""
        tags: ""
