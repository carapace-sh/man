name: purchase-offering
description: Immediately purchases offerings for an AWS account.
flags:
    --offering-id=!: The ID of the offering.
    --offering-promotion-id=: The ID of the offering promotion to be applied to the purchase.
    --quantity=!: The number of device slots to purchase in an offering request.
documentation:
    command: Immediately purchases offerings for an AWS account. Offerings renew with the latest total purchased quantity for an offering, unless the renewal was overridden. The API returns a `NotEligible` error if the user is not permitted to invoke the operation. If you must be able to invoke this operation, contact [aws-devicefarm-support@amazon.com](mailto:aws-devicefarm-support@amazon.com).
    flag:
        offering-id: The ID of the offering.
        offering-promotion-id: The ID of the offering promotion to be applied to the purchase.
        quantity: The number of device slots to purchase in an offering request.
