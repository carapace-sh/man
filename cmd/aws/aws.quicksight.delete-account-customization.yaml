name: delete-account-customization
description: This API permanently deletes all QuickSight customizations for the specified Amazon Web Services account and namespace in this Amazon Web Services Region.
flags:
    --aws-account-id=!: The ID for the Amazon Web Services account that you want to delete QuickSight customizations from in this Amazon Web Services Region.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --namespace=: The QuickSight namespace that you're deleting the customizations from.
documentation:
    command: |-
        This API permanently deletes all QuickSight customizations for the specified Amazon Web Services account and namespace in this Amazon Web Services Region. When you delete account customizations:

        - All customizations are removed including themes, branding, and visual settings
        - The deletion affects only the specified Amazon Web Services Region - customizations in other regions remain unchanged
        - This action cannot be undone through the API
        - Users will see default QuickSight styling after customizations are deleted

        **Before proceeding:** Ensure you have backups of any custom themes or branding elements you may want to recreate.

        Deletes all Amazon QuickSight customizations in this Amazon Web Services Region for the specified Amazon Web Services account and QuickSight namespace.
    flag:
        aws-account-id: The ID for the Amazon Web Services account that you want to delete QuickSight customizations from in this Amazon Web Services Region.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        namespace: The QuickSight namespace that you're deleting the customizations from.
