name: get-place
description: '`GetPlace` finds a place by its unique ID.'
flags:
    --additional-features=: A list of optional additional parameters such as time zone that can be requested for each result.
    --intended-use=: Indicates if the results will be stored.
    --key=: 'Optional: The API key to be used for authorization.'
    --language=: A list of [BCP 47](https://en.wikipedia.org/wiki/IETF_language_tag) compliant language codes for the results to be rendered in.
    --place-id=!: The `PlaceId` of the place you wish to receive the information for.
    --political-view=: The alpha-2 or alpha-3 character code for the political view of a country.
completion:
    flag:
        intended-use:
            - SingleUse
            - Storage
documentation:
    command: '`GetPlace` finds a place by its unique ID. A `PlaceId` is returned by other place operations.'
    flag:
        additional-features: A list of optional additional parameters such as time zone that can be requested for each result.
        intended-use: |-
            Indicates if the results will be stored. Defaults to `SingleUse`, if left empty.

            Storing the response of an GetPlace query is required to comply with service terms, but charged at a higher cost per request. Please review the [user agreement](https://aws.amazon.com/location/sla/) and [service pricing structure](https://aws.amazon.com/location/pricing/) to determine the correct setting for your use case.
        key: 'Optional: The API key to be used for authorization. Either an API key or valid SigV4 signature must be provided when making a request.'
        language: A list of [BCP 47](https://en.wikipedia.org/wiki/IETF_language_tag) compliant language codes for the results to be rendered in. If there is no data for the result in the requested language, data will be returned in the default language for the entry.
        place-id: The `PlaceId` of the place you wish to receive the information for.
        political-view: The alpha-2 or alpha-3 character code for the political view of a country. The political view applies to the results of the request to represent unresolved territorial claims through the point of view of the specified country.
