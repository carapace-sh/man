name: list-versions-by-function
description: Returns a list of [versions](https://docs.aws.amazon.com/lambda/latest/dg/versioning-aliases.html), with the version-specific configuration of each.
flags:
    --function-name=!: The name or ARN of the Lambda function.
    --marker=: Specify the pagination token that's returned by a previous request to retrieve the next page of results.
    --max-items=: The maximum number of versions to return.
documentation:
    command: Returns a list of [versions](https://docs.aws.amazon.com/lambda/latest/dg/versioning-aliases.html), with the version-specific configuration of each. Lambda returns up to 50 versions per call.
    flag:
        function-name: |-
            The name or ARN of the Lambda function.

            **Name formats**

            - **Function name** - `MyFunction`.
            - **Function ARN** - `arn:aws:lambda:us-west-2:123456789012:function:MyFunction`.
            - **Partial ARN** - `123456789012:function:MyFunction`.

            The length constraint applies only to the full ARN. If you specify only the function name, it is limited to 64 characters in length.
        marker: Specify the pagination token that's returned by a previous request to retrieve the next page of results.
        max-items: The maximum number of versions to return. Note that `ListVersionsByFunction` returns a maximum of 50 items in each response, even if you set the number higher.
