name: get-group
description: Given a user pool ID and a group name, returns information about the user group.
flags:
    --group-name=!: The name of the group that you want to get information about.
    --user-pool-id=!: The ID of the user pool that contains the group that you want to query.
documentation:
    command: |-
        Given a user pool ID and a group name, returns information about the user group.

        For more information about user pool groups, see [Adding groups to a user pool](https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-user-groups.html).

        Amazon Cognito evaluates Identity and Access Management (IAM) policies in requests for this API operation. For this operation, you must use IAM credentials to authorize requests, and you must grant yourself the corresponding IAM permission in a policy.

        **Learn more**

        - [Signing Amazon Web Services API Requests](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_aws-signing.html)
        - [Using the Amazon Cognito user pools API and user pool endpoints](https://docs.aws.amazon.com/cognito/latest/developerguide/user-pools-API-operations.html)
    flag:
        group-name: The name of the group that you want to get information about.
        user-pool-id: The ID of the user pool that contains the group that you want to query.
