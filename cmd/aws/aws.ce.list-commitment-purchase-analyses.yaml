name: list-commitment-purchase-analyses
description: Lists the commitment purchase analyses for your account.
flags:
    --analysis-ids=:
        description: The analysis IDs associated with the commitment purchase analyses.
        nargs: -1
    --analysis-status=: The status of the analysis.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --next-page-token=: The token to retrieve the next set of results.
    --page-size=: The number of analyses that you want returned in a single response object.
completion:
    flag:
        analysis-status:
            - SUCCEEDED
            - PROCESSING
            - FAILED
documentation:
    command: Lists the commitment purchase analyses for your account.
    flag:
        analysis-ids: The analysis IDs associated with the commitment purchase analyses.
        analysis-status: The status of the analysis.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
