name: create-subscription
description: Subscribes an IAM Identity Center user or a group to a pricing tier for an Amazon Q Business application.
flags:
    --application-id=!: The identifier of the Amazon Q Business application the subscription should be added to.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A token that you provide to identify the request to create a subscription for your Amazon Q Business application.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --principal=!: The IAM Identity Center `UserId` or `GroupId` of a user or group in the IAM Identity Center instance connected to the Amazon Q Business application.
    --type=!: The type of Amazon Q Business subscription you want to create.
completion:
    flag:
        type:
            - Q_LITE
            - Q_BUSINESS
documentation:
    command: |-
        Subscribes an IAM Identity Center user or a group to a pricing tier for an Amazon Q Business application.

        Amazon Q Business offers two subscription tiers: `Q_LITE` and `Q_BUSINESS`. Subscription tier determines feature access for the user. For more information on subscriptions and pricing tiers, see [Amazon Q Business pricing](https://aws.amazon.com/q/business/pricing/).

        For an example IAM role policy for assigning subscriptions, see [Set up required permissions](https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/setting-up.html#permissions) in the Amazon Q Business User Guide.
    flag:
        application-id: The identifier of the Amazon Q Business application the subscription should be added to.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A token that you provide to identify the request to create a subscription for your Amazon Q Business application.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        principal: The IAM Identity Center `UserId` or `GroupId` of a user or group in the IAM Identity Center instance connected to the Amazon Q Business application.
        type: The type of Amazon Q Business subscription you want to create.
