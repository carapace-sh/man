name: create-global-cluster
description: Creates a Neptune global database spread across multiple Amazon Regions.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --deletion-protection: The deletion protection setting for the new global database.
    --engine-version=: The Neptune engine version to be used by the global database.
    --engine=: The name of the database engine to be used in the global database.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --global-cluster-identifier=!: The cluster identifier of the new global database cluster.
    --no-deletion-protection: The deletion protection setting for the new global database.
    --no-storage-encrypted: The storage encryption setting for the new global database cluster.
    --source-db-cluster-identifier=: (*Optional*) The Amazon Resource Name (ARN) of an existing Neptune DB cluster to use as the primary cluster of the new global database.
    --storage-encrypted: The storage encryption setting for the new global database cluster.
documentation:
    command: |-
        Creates a Neptune global database spread across multiple Amazon Regions. The global database contains a single primary cluster with read-write capability, and read-only secondary clusters that receive data from the primary cluster through high-speed replication performed by the Neptune storage subsystem.

        You can create a global database that is initially empty, and then add a primary cluster and secondary clusters to it, or you can specify an existing Neptune cluster during the create operation to become the primary cluster of the global database.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        deletion-protection: The deletion protection setting for the new global database. The global database can't be deleted when deletion protection is enabled.
        engine: |-
            The name of the database engine to be used in the global database.

            Valid values: `neptune`
        engine-version: |-
            The Neptune engine version to be used by the global database.

            Valid values: `1.2.0.0` or above.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        global-cluster-identifier: The cluster identifier of the new global database cluster.
        source-db-cluster-identifier: (*Optional*) The Amazon Resource Name (ARN) of an existing Neptune DB cluster to use as the primary cluster of the new global database.
        storage-encrypted: The storage encryption setting for the new global database cluster.
