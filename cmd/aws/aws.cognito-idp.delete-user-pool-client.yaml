name: delete-user-pool-client
description: Deletes a user pool app client.
flags:
    --client-id=!: The ID of the user pool app client that you want to delete.
    --user-pool-id=!: The ID of the user pool where you want to delete the client.
documentation:
    command: Deletes a user pool app client. After you delete an app client, users can no longer sign in to the associated application.
    flag:
        client-id: The ID of the user pool app client that you want to delete.
        user-pool-id: The ID of the user pool where you want to delete the client.
