name: update-incident-record
description: Update the details of an incident record.
flags:
    --arn=!: The Amazon Resource Name (ARN) of the incident record you are updating.
    --chat-channel=: The Chatbot chat channel where responders can collaborate.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A token that ensures that a client calls the operation only once with the specified details.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --impact=: Defines the impact of the incident to customers and applications.
    --notification-targets=: The Amazon SNS targets that Incident Manager notifies when a client updates an incident.
    --status=: The status of the incident.
    --summary=: A longer description of what occurred during the incident.
    --title=: A brief description of the incident.
completion:
    flag:
        status:
            - OPEN
            - RESOLVED
documentation:
    command: Update the details of an incident record. You can use this operation to update an incident record from the defined chat channel. For more information about using actions in chat channels, see [Interacting through chat](https://docs.aws.amazon.com/incident-manager/latest/userguide/chat.html#chat-interact).
    flag:
        arn: The Amazon Resource Name (ARN) of the incident record you are updating.
        chat-channel: The Chatbot chat channel where responders can collaborate.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A token that ensures that a client calls the operation only once with the specified details.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        impact: |-
            Defines the impact of the incident to customers and applications. If you provide an impact for an incident, it overwrites the impact provided by the response plan.

            **Supported impact codes**

            - `1` - Critical
            - `2` - High
            - `3` - Medium
            - `4` - Low
            - `5` - No Impact
        notification-targets: |-
            The Amazon SNS targets that Incident Manager notifies when a client updates an incident.

            Using multiple SNS topics creates redundancy in the event that a Region is down during the incident.
        status: The status of the incident. Possible statuses are `Open` or `Resolved`.
        summary: A longer description of what occurred during the incident.
        title: A brief description of the incident.
