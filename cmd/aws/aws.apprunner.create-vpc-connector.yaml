name: create-vpc-connector
description: Create an App Runner VPC connector resource.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --security-groups=:
        description: A list of IDs of security groups that App Runner should use for access to Amazon Web Services resources under the specified subnets.
        nargs: -1
    --subnets=!:
        description: A list of IDs of subnets that App Runner should use when it associates your service with a custom Amazon VPC.
        nargs: -1
    --tags=:
        description: A list of metadata items that you can associate with your VPC connector resource.
        nargs: -1
    --vpc-connector-name=!: A name for the VPC connector.
documentation:
    command: Create an App Runner VPC connector resource. App Runner requires this resource when you want to associate your App Runner service to a custom Amazon Virtual Private Cloud (Amazon VPC).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        security-groups: A list of IDs of security groups that App Runner should use for access to Amazon Web Services resources under the specified subnets. If not specified, App Runner uses the default security group of the Amazon VPC. The default security group allows all outbound traffic.
        subnets: |-
            A list of IDs of subnets that App Runner should use when it associates your service with a custom Amazon VPC. Specify IDs of subnets of a single Amazon VPC. App Runner determines the Amazon VPC from the subnets you specify.

            App Runner only supports subnets of IP address type *IPv4* and *dual stack* (IPv4 and IPv6).
        tags: A list of metadata items that you can associate with your VPC connector resource. A tag is a key-value pair.
        vpc-connector-name: A name for the VPC connector.
