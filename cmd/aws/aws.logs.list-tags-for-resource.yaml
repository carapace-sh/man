name: list-tags-for-resource
description: Displays the tags associated with a CloudWatch Logs resource.
flags:
    --resource-arn=!: The ARN of the resource that you want to view tags for.
documentation:
    command: Displays the tags associated with a CloudWatch Logs resource. Currently, log groups and destinations support tagging.
    flag:
        resource-arn: |-
            The ARN of the resource that you want to view tags for.

            The ARN format of a log group is `arn:aws:logs:Region:account-id:log-group:log-group-name`

            The ARN format of a destination is `arn:aws:logs:Region:account-id:destination:destination-name`

            For more information about ARN format, see [CloudWatch Logs resources and operations](https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/iam-access-control-overview-cwl.html).
