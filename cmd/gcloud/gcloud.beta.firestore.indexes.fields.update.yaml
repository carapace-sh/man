name: update
description: '*(BETA)*  Update the index configuration of the given field.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --clear-exemption: If provided, the field's current index configuration will be
    --collection-group=: Collection group of the field.
    --database=: Database of the field.
    --disable-indexes: If provided, the field will no longer be indexed at all.
    --index=: An index for the field.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-exemption&: If provided, the field's current index configuration will be
    --no-disable-indexes&: If provided, the field will no longer be indexed at all.
documentation:
    command: |
        *(BETA)*  Update the index configuration of the given field.

        This creates an exemption for the field in question, allowing one to modify the field's index
        settings and override the defaults.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        clear-exemption: |-
            If provided, the field's current index configuration will be
            reverted to inherit from its ancestor index configurations.
        collection-group: |-
            Collection group of the field.
            +

            To set the `collection-group` attribute:
            * provide the argument `field` on the command line with a fully specified name;
            * provide the argument `--collection-group` on the command line.
        database: |-
            Database of the field.
            +

            To set the `database` attribute:
            * provide the argument `field` on the command line with a fully specified name;
            * provide the argument `--database` on the command line;
            * the default value of argument [--database] is `(default)`.
        disable-indexes: If provided, the field will no longer be indexed at all.
        index: |-
            An index for the field.
            +
            This flag can be repeated to provide multiple indexes. Any existing indexes will
            be overwritten with the ones provided. Any omitted indexes will be deleted if
            they currently exist.
            +
            The following keys are allowed:
            +
            *order*:::: Specifies the order. Valid options are: 'ascending', 'descending'.
            Exactly one of 'order' or 'array-config' must be specified.
            +
            *array-config*:::: Specifies the configuration for an array field. The only
            valid option is 'contains'. Exactly one of 'order' or 'array-config' must be
            specified.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-exemption: |
            If provided, the field's current index configuration will be
            reverted to inherit from its ancestor index configurations.
        no-disable-indexes: If provided, the field will no longer be indexed at all.
