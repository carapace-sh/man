name: get-auto-scaling-group-recommendations
description: Returns Auto Scaling group recommendations.
flags:
    --account-ids=: The ID of the Amazon Web Services account for which to return Auto Scaling group recommendations.
    --auto-scaling-group-arns=: The Amazon Resource Name (ARN) of the Auto Scaling groups for which to return recommendations.
    --filters=: An array of objects to specify a filter that returns a more specific list of Auto Scaling group recommendations.
    --max-results=: The maximum number of Auto Scaling group recommendations to return with a single request.
    --next-token=: The token to advance to the next page of Auto Scaling group recommendations.
    --recommendation-preferences=: An object to specify the preferences for the Auto Scaling group recommendations to return in the response.
documentation:
    command: |-
        Returns Auto Scaling group recommendations.

        Compute Optimizer generates recommendations for Amazon EC2 Auto Scaling groups that meet a specific set of requirements. For more information, see the [Supported resources and requirements](https://docs.aws.amazon.com/compute-optimizer/latest/ug/requirements.html) in the *Compute Optimizer User Guide*.
    flag:
        account-ids: |-
            The ID of the Amazon Web Services account for which to return Auto Scaling group recommendations.

            If your account is the management account of an organization, use this parameter to specify the member account for which you want to return Auto Scaling group recommendations.

            Only one account ID can be specified per request.
        auto-scaling-group-arns: The Amazon Resource Name (ARN) of the Auto Scaling groups for which to return recommendations.
        filters: An array of objects to specify a filter that returns a more specific list of Auto Scaling group recommendations.
        max-results: |-
            The maximum number of Auto Scaling group recommendations to return with a single request.

            To retrieve the remaining results, make another request with the returned `nextToken` value.
        next-token: The token to advance to the next page of Auto Scaling group recommendations.
        recommendation-preferences: An object to specify the preferences for the Auto Scaling group recommendations to return in the response.
