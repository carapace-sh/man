name: batch-get-applications
description: Gets information about one or more applications.
flags:
    --application-names=!: A list of application names separated by spaces.
documentation:
    command: Gets information about one or more applications. The maximum number of applications that can be returned is 100.
    flag:
        application-names: A list of application names separated by spaces. The maximum number of application names you can specify is 100.
