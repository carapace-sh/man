name: create-bucket-metadata-configuration
description: Creates an S3 Metadata V2 metadata configuration for a general purpose bucket.
flags:
    --bucket=!: The general purpose bucket that you want to create the metadata configuration for.
    --checksum-algorithm=: The checksum algorithm to use with your metadata configuration.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --content-m-d5=: The `Content-MD5` header for the metadata configuration.
    --expected-bucket-owner=: The expected owner of the general purpose bucket that corresponds to your metadata configuration.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --metadata-configuration=!: The contents of your metadata configuration.
completion:
    flag:
        checksum-algorithm:
            - CRC32
            - CRC32C
            - SHA1
            - SHA256
            - CRC64NVME
documentation:
    command: "Creates an S3 Metadata V2 metadata configuration for a general purpose bucket. For more information, see [Accelerating data discovery with S3 Metadata](https://docs.aws.amazon.com/AmazonS3/latest/userguide/metadata-tables-overview.html) in the *Amazon S3 User Guide*.\n\nPermissions\n\nTo use this operation, you must have the following permissions. For more information, see [Setting up permissions for configuring metadata tables](https://docs.aws.amazon.com/AmazonS3/latest/userguide/metadata-tables-permissions.html) in the *Amazon S3 User Guide*.\n\nIf you want to encrypt your metadata tables with server-side encryption with Key Management Service (KMS) keys (SSE-KMS), you need additional permissions in your KMS key policy. For more information, see [Setting up permissions for configuring metadata tables](https://docs.aws.amazon.com/AmazonS3/latest/userguide/metadata-tables-permissions.html) in the *Amazon S3 User Guide*.\n\nIf you also want to integrate your table bucket with Amazon Web Services analytics services so that you can query your metadata table, you need additional permissions. For more information, see [Integrating Amazon S3 Tables with Amazon Web Services analytics services](https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-tables-integrating-aws.html) in the *Amazon S3 User Guide*.\n\nTo query your metadata tables, you need additional permissions. For more information, see [Permissions for querying metadata tables](https://docs.aws.amazon.com/AmazonS3/latest/userguide/metadata-tables-bucket-query-permissions.html) in the *Amazon S3 User Guide*.\n\n- `s3:CreateBucketMetadataTableConfiguration`\n  \n  The IAM policy action name is the same for the V1 and V2 API operations.\n- `s3tables:CreateTableBucket`\n- `s3tables:CreateNamespace`\n- `s3tables:GetTable`\n- `s3tables:CreateTable`\n- `s3tables:PutTablePolicy`\n- `s3tables:PutTableEncryption`\n- `kms:DescribeKey`\n\nThe following operations are related to `CreateBucketMetadataConfiguration`:\n\n- [DeleteBucketMetadataConfiguration](https://docs.aws.amazon.com/AmazonS3/latest/API/API_DeleteBucketMetadataConfiguration.html)\n- [GetBucketMetadataConfiguration](https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetBucketMetadataConfiguration.html)\n- [UpdateBucketMetadataInventoryTableConfiguration](https://docs.aws.amazon.com/AmazonS3/latest/API/API_UpdateBucketMetadataInventoryTableConfiguration.html)\n- [UpdateBucketMetadataJournalTableConfiguration](https://docs.aws.amazon.com/AmazonS3/latest/API/API_UpdateBucketMetadataJournalTableConfiguration.html)"
    flag:
        bucket: The general purpose bucket that you want to create the metadata configuration for.
        checksum-algorithm: The checksum algorithm to use with your metadata configuration.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        content-m-d5: The `Content-MD5` header for the metadata configuration.
        expected-bucket-owner: The expected owner of the general purpose bucket that corresponds to your metadata configuration.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        metadata-configuration: The contents of your metadata configuration.
