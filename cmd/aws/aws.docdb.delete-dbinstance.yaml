name: delete-dbinstance
description: Deletes a previously provisioned instance.
flags:
    --dbinstance-identifier=!: The instance identifier for the instance to be deleted.
documentation:
    command: Deletes a previously provisioned instance.
    flag:
        dbinstance-identifier: |-
            The instance identifier for the instance to be deleted. This parameter isn't case sensitive.

            Constraints:

            - Must match the name of an existing instance.
