name: untag-resource
description: Removes one or more tags from a resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource.
    --resource-tag-keys=!: A list of tag keys associated with tags that need to be removed from the resource.
documentation:
    command: Removes one or more tags from a resource. Specify only tag keys in your request. Don't specify the value.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource. For a list of supported resources, see [ResourceTag](https://docs.aws.amazon.com/aws-cost-management/latest/APIReference/API_ResourceTag.html).
        resource-tag-keys: A list of tag keys associated with tags that need to be removed from the resource. If you specify a tag key that doesn't exist, it's ignored. Although the maximum number of array members is 200, user-tag maximum is 50. The remaining are reserved for Amazon Web Services use.
