name: update-device
description: Updates the details for an existing device.
flags:
    --awslocation=: The Amazon Web Services location of the device, if applicable.
    --description=: A description of the device.
    --device-id=!: The ID of the device.
    --global-network-id=!: The ID of the global network.
    --location=: ""
    --model=: The model of the device.
    --serial-number=: The serial number of the device.
    --site-id=: The ID of the site.
    --type=: The type of the device.
    --vendor=: The vendor of the device.
documentation:
    command: Updates the details for an existing device. To remove information for any of the parameters, specify an empty string.
    flag:
        awslocation: The Amazon Web Services location of the device, if applicable. For an on-premises device, you can omit this parameter.
        description: |-
            A description of the device.

            Constraints: Maximum length of 256 characters.
        device-id: The ID of the device.
        global-network-id: The ID of the global network.
        location: ""
        model: |-
            The model of the device.

            Constraints: Maximum length of 128 characters.
        serial-number: |-
            The serial number of the device.

            Constraints: Maximum length of 128 characters.
        site-id: The ID of the site.
        type: The type of the device.
        vendor: |-
            The vendor of the device.

            Constraints: Maximum length of 128 characters.
