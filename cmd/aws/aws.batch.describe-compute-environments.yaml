name: describe-compute-environments
description: Describes one or more of your compute environments.
flags:
    --compute-environments=: A list of up to 100 compute environment names or full Amazon Resource Name (ARN) entries.
    --max-results=: The maximum number of cluster results returned by `DescribeComputeEnvironments` in paginated output.
    --next-token=: The `nextToken` value returned from a previous paginated `DescribeComputeEnvironments` request where `maxResults` was used and the results exceeded the value of that parameter.
documentation:
    command: |-
        Describes one or more of your compute environments.

        If you're using an unmanaged compute environment, you can use the `DescribeComputeEnvironment` operation to determine the `ecsClusterArn` that you launch your Amazon ECS container instances into.
    flag:
        compute-environments: A list of up to 100 compute environment names or full Amazon Resource Name (ARN) entries.
        max-results: The maximum number of cluster results returned by `DescribeComputeEnvironments` in paginated output. When this parameter is used, `DescribeComputeEnvironments` only returns `maxResults` results in a single page along with a `nextToken` response element. The remaining results of the initial request can be seen by sending another `DescribeComputeEnvironments` request with the returned `nextToken` value. This value can be between 1 and 100. If this parameter isn't used, then `DescribeComputeEnvironments` returns up to 100 results and a `nextToken` value if applicable.
        next-token: |-
            The `nextToken` value returned from a previous paginated `DescribeComputeEnvironments` request where `maxResults` was used and the results exceeded the value of that parameter. Pagination continues from the end of the previous results that returned the `nextToken` value. This value is `null` when there are no more results to return.

            Treat this token as an opaque identifier that's only used to retrieve the next items in a list and not for other programmatic purposes.
