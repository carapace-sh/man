name: get-application
description: Retrieves metadata information about one of your applications.
flags:
    --application=!: The name, ID, or ARN of the application.
documentation:
    command: Retrieves metadata information about one of your applications. The application can be specified by its ARN, ID, or name (which is unique within one account in one region at a given point in time). Specify by ARN or ID in automated workflows if you want to make sure that the exact same application is returned or a `ResourceNotFoundException` is thrown, avoiding the ABA addressing problem.
    flag:
        application: The name, ID, or ARN of the application.
