name: tag-resource
description: Associates the specified tags to a resource with the specified `ResourceArn`.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) that identifies the resource for which to list the tags.
    --tags=!: An array of tag object.
documentation:
    command: Associates the specified tags to a resource with the specified `ResourceArn`. If existing tags on a resource are not specified in the request parameters, they are not changed. If existing tags are specified, however, then their values will be updated. When a resource is deleted, the tags associated with that resource are deleted as well.
    flag:
        resource-arn: |-
            The Amazon Resource Name (ARN) that identifies the resource for which to list the tags. The following resources are supported:

            - `ConfigurationRecorder`
            - `ConfigRule`
            - `OrganizationConfigRule`
            - `ConformancePack`
            - `OrganizationConformancePack`
            - `ConfigurationAggregator`
            - `AggregationAuthorization`
            - `StoredQuery`
        tags: An array of tag object.
