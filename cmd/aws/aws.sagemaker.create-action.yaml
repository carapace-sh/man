name: create-action
description: Creates an *action*.
flags:
    --action-name=!: The name of the action.
    --action-type=!: The action type.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The description of the action.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --metadata-properties=: ""
    --properties=: A list of properties to add to the action.
    --source=!: The source type, ID, and URI.
    --status=: The status of the action.
    --tags=:
        description: A list of tags to apply to the action.
        nargs: -1
completion:
    flag:
        status:
            - Unknown
            - InProgress
            - Completed
            - Failed
            - Stopping
            - Stopped
documentation:
    command: Creates an *action*. An action is a lineage tracking entity that represents an action or activity. For example, a model deployment or an HPO job. Generally, an action involves at least one input or output artifact. For more information, see [Amazon SageMaker ML Lineage Tracking](https://docs.aws.amazon.com/sagemaker/latest/dg/lineage-tracking.html).
    flag:
        action-name: The name of the action. Must be unique to your account in an Amazon Web Services Region.
        action-type: The action type.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The description of the action.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        metadata-properties: ""
        properties: A list of properties to add to the action.
        source: The source type, ID, and URI.
        status: The status of the action.
        tags: A list of tags to apply to the action.
