name: get-property-value
description: Gets the property values for a component, component type, entity, or workspace.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --component-name=: The name of the component whose property values the operation returns.
    --component-path=: This string specifies the path to the composite component, starting from the top-level component.
    --component-type-id=: The ID of the component type whose property values the operation returns.
    --entity-id=: The ID of the entity whose property values the operation returns.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of results to return at one time.
    --next-token=: The string that specifies the next page of results.
    --property-group-name=: The property group name.
    --selected-properties=!: The properties whose values the operation returns.
    --tabular-conditions=: The tabular conditions.
    --workspace-id=!: The ID of the workspace whose values the operation returns.
documentation:
    command: |-
        Gets the property values for a component, component type, entity, or workspace.

        You must specify a value for either `componentName`, `componentTypeId`, `entityId`, or `workspaceId`.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        component-name: The name of the component whose property values the operation returns.
        component-path: This string specifies the path to the composite component, starting from the top-level component.
        component-type-id: The ID of the component type whose property values the operation returns.
        entity-id: The ID of the entity whose property values the operation returns.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: |-
            The maximum number of results to return at one time. The default is 25.

            Valid Range: Minimum value of 1. Maximum value of 250.
        next-token: The string that specifies the next page of results.
        property-group-name: The property group name.
        selected-properties: The properties whose values the operation returns.
        tabular-conditions: The tabular conditions.
        workspace-id: The ID of the workspace whose values the operation returns.
