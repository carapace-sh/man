name: get-variables
description: Gets all of the variables or the specific variable.
flags:
    --max-results=: The max size per page determined for the get variable request.
    --name=: The name of the variable.
    --next-token=: The next page token of the get variable request.
documentation:
    command: Gets all of the variables or the specific variable. This is a paginated API. Providing null `maxSizePerPage` results in retrieving maximum of 100 records per page. If you provide `maxSizePerPage` the value must be between 50 and 100. To get the next page result, a provide a pagination token from `GetVariablesResult` as part of your request. Null pagination token fetches the records from the beginning.
    flag:
        max-results: The max size per page determined for the get variable request.
        name: The name of the variable.
        next-token: The next page token of the get variable request.
