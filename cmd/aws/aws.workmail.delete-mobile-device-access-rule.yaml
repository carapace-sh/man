name: delete-mobile-device-access-rule
description: Deletes a mobile device access rule for the specified WorkMail organization.
flags:
    --mobile-device-access-rule-id=!: The identifier of the rule to be deleted.
    --organization-id=!: The WorkMail organization under which the rule will be deleted.
documentation:
    command: |-
        Deletes a mobile device access rule for the specified WorkMail organization.

        Deleting already deleted and non-existing rules does not produce an error. In those cases, the service sends back an HTTP 200 response with an empty HTTP body.
    flag:
        mobile-device-access-rule-id: The identifier of the rule to be deleted.
        organization-id: The WorkMail organization under which the rule will be deleted.
