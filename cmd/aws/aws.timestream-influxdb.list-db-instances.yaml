name: list-db-instances
description: Returns a list of Timestream for InfluxDB DB instances.
flags:
    --max-results=: The maximum number of items to return in the output.
    --next-token=: The pagination token.
documentation:
    command: Returns a list of Timestream for InfluxDB DB instances.
    flag:
        max-results: The maximum number of items to return in the output. If the total number of items available is more than the value specified, a NextToken is provided in the output. To resume pagination, provide the NextToken value as argument of a subsequent API invocation.
        next-token: The pagination token. To resume pagination, provide the NextToken value as argument of a subsequent API invocation.
