name: put-method
description: Add a method to an existing Resource resource.
flags:
    --api-key-required: Specifies whether the method required a valid ApiKey.
    --authorization-scopes=: A list of authorization scopes configured on the method.
    --authorization-type=!: The method's authorization type.
    --authorizer-id=: Specifies the identifier of an Authorizer to use on this Method, if the type is CUSTOM or COGNITO\_USER\_POOLS.
    --http-method=!: Specifies the method request's HTTP method type.
    --no-api-key-required&: Specifies whether the method required a valid ApiKey.
    --operation-name=: A human-friendly operation identifier for the method.
    --request-models=: Specifies the Model resources used for the request's content type.
    --request-parameters=: A key-value map defining required or optional method request parameters that can be accepted by API Gateway.
    --request-validator-id=: The identifier of a RequestValidator for validating the method request.
    --resource-id=!: The Resource identifier for the new Method resource.
    --rest-api-id=!: The string identifier of the associated RestApi.
documentation:
    command: Add a method to an existing Resource resource.
    flag:
        api-key-required: Specifies whether the method required a valid ApiKey.
        authorization-scopes: A list of authorization scopes configured on the method. The scopes are used with a `COGNITO_USER_POOLS` authorizer to authorize the method invocation. The authorization works by matching the method scopes against the scopes parsed from the access token in the incoming request. The method invocation is authorized if any method scopes matches a claimed scope in the access token. Otherwise, the invocation is not authorized. When the method scope is configured, the client must provide an access token instead of an identity token for authorization purposes.
        authorization-type: The method's authorization type. Valid values are `NONE` for open access, `AWS_IAM` for using AWS IAM permissions, `CUSTOM` for using a custom authorizer, or `COGNITO_USER_POOLS` for using a Cognito user pool.
        authorizer-id: Specifies the identifier of an Authorizer to use on this Method, if the type is CUSTOM or COGNITO\_USER\_POOLS. The authorizer identifier is generated by API Gateway when you created the authorizer.
        http-method: Specifies the method request's HTTP method type.
        operation-name: A human-friendly operation identifier for the method. For example, you can assign the `operationName` of `ListPets` for the `GET /pets` method in the `PetStore` example.
        request-models: Specifies the Model resources used for the request's content type. Request models are represented as a key/value map, with a content type as the key and a Model name as the value.
        request-parameters: A key-value map defining required or optional method request parameters that can be accepted by API Gateway. A key defines a method request parameter name matching the pattern of `method.request.{location}.{name}`, where `location` is `querystring`, `path`, or `header` and `name` is a valid and unique parameter name. The value associated with the key is a Boolean flag indicating whether the parameter is required (`true`) or optional (`false`). The method request parameter names defined here are available in Integration to be mapped to integration request parameters or body-mapping templates.
        request-validator-id: The identifier of a RequestValidator for validating the method request.
        resource-id: The Resource identifier for the new Method resource.
        rest-api-id: The string identifier of the associated RestApi.
