name: get-findings
description: Describes Amazon GuardDuty findings specified by finding IDs.
flags:
    --detector-id=!: The ID of the detector that specifies the GuardDuty service whose findings you want to retrieve.
    --finding-ids=!: The IDs of the findings that you want to retrieve.
    --sort-criteria=: Represents the criteria used for sorting findings.
documentation:
    command: Describes Amazon GuardDuty findings specified by finding IDs.
    flag:
        detector-id: |-
            The ID of the detector that specifies the GuardDuty service whose findings you want to retrieve.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
        finding-ids: The IDs of the findings that you want to retrieve.
        sort-criteria: Represents the criteria used for sorting findings.
