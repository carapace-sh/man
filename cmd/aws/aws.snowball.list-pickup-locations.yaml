            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The maximum number of locations to list per page.
        next-token: HTTP requests are stateless. To identify what object comes "next" in the list of `ListPickupLocationsRequest` objects, you have the option of specifying `NextToken` as the starting point for your returned list.
