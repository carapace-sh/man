name: create-domain
description: Creates an Amazon DataZone domain.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier that is provided to ensure the idempotency of the request.
    --description=: The description of the Amazon DataZone domain.
    --domain-execution-role=!: The domain execution role that is created when an Amazon DataZone domain is created.
    --domain-version=: The version of the domain that is created.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --kms-key-identifier=: The identifier of the Amazon Web Services Key Management Service (KMS) key that is used to encrypt the Amazon DataZone domain, metadata, and reporting data.
    --name=!: The name of the Amazon DataZone domain.
    --service-role=: The service role of the domain that is created.
    --single-sign-on=: The single-sign on configuration of the Amazon DataZone domain.
    --tags=: The tags specified for the Amazon DataZone domain.
completion:
    flag:
        domain-version:
            - V1
            - V2
documentation:
    command: Creates an Amazon DataZone domain.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier that is provided to ensure the idempotency of the request.
        description: The description of the Amazon DataZone domain.
        domain-execution-role: The domain execution role that is created when an Amazon DataZone domain is created. The domain execution role is created in the Amazon Web Services account that houses the Amazon DataZone domain.
        domain-version: The version of the domain that is created.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        kms-key-identifier: The identifier of the Amazon Web Services Key Management Service (KMS) key that is used to encrypt the Amazon DataZone domain, metadata, and reporting data.
        name: The name of the Amazon DataZone domain.
        service-role: The service role of the domain that is created.
        single-sign-on: The single-sign on configuration of the Amazon DataZone domain.
        tags: The tags specified for the Amazon DataZone domain.
