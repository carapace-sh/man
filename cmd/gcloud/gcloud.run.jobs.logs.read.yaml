name: read
description: Read logs for Cloud Run jobs.
flags:
    --freshness=: Return entries that are not older than this value.
    --limit=: Maximum number of resources to list.
    --log-filter=: Filter expression that specifies the log entries to return.
    --order=: Ordering of returned log entries based on timestamp field.
    --region=: Region in which the resource can be found.
completion:
    flag:
        order:
            - desc
            - asc
documentation:
    command: |
        gcloud run jobs logs read reads log entries. Log entries matching *--log-filter* are
        returned according to the specified --order.
        If the log entries come from multiple logs, then entries from
        different logs might be intermingled in the results.
    flag:
        freshness: Return entries that are not older than this value. Works only with DESC ordering and filters without a timestamp. See $ gcloud topic datetimes for information on duration formats.
        limit: |-
            Maximum number of resources to list. The default is *unlimited*.
            This flag interacts with other flags that are applied in this order:
            *--flatten*, *--sort-by*, *--filter*, *--limit*.
        log-filter: 'Filter expression that specifies the log entries to return. Detailed information about filters can be found at: https://cloud.google.com/logging/docs/view/logging-query-language'
        order: 'Ordering of returned log entries based on timestamp field. _ORDER_ must be one of: *desc*, *asc*.'
        region: Region in which the resource can be found. Alternatively, set the property [run/region].
