name: add-tags
description: Attaches tags to an existing Elasticsearch domain.
flags:
    --arn=!: Specify the `ARN` for which you want to add the tags.
    --tag-list=!: List of `Tag` that need to be added for the Elasticsearch domain.
documentation:
    command: Attaches tags to an existing Elasticsearch domain. Tags are a set of case-sensitive key value pairs. An Elasticsearch domain may have up to 10 tags. See [Tagging Amazon Elasticsearch Service Domains for more information.](http://docs.aws.amazon.com/elasticsearch-service/latest/developerguide/es-managedomains.html#es-managedomains-awsresorcetagging)
    flag:
        arn: Specify the `ARN` for which you want to add the tags.
        tag-list: List of `Tag` that need to be added for the Elasticsearch domain.
