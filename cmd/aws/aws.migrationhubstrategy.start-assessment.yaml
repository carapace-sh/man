name: start-assessment
description: Starts the assessment of an on-premises environment.
flags:
    --assessment-data-source-type=: The data source type of an assessment to be started.
    --assessment-targets=: List of criteria for assessment.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --s3bucket-for-analysis-data=: The S3 bucket used by the collectors to send analysis data to the service.
    --s3bucket-for-report-data=: The S3 bucket where all the reports generated by the service are stored.
completion:
    flag:
        assessment-data-source-type:
            - StrategyRecommendationsApplicationDataCollector
            - ManualImport
            - ApplicationDiscoveryService
documentation:
    command: Starts the assessment of an on-premises environment.
    flag:
        assessment-data-source-type: The data source type of an assessment to be started.
        assessment-targets: List of criteria for assessment.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        s3bucket-for-analysis-data: The S3 bucket used by the collectors to send analysis data to the service. The bucket name must begin with `migrationhub-strategy-`.
        s3bucket-for-report-data: The S3 bucket where all the reports generated by the service are stored. The bucket name must begin with `migrationhub-strategy-`.
