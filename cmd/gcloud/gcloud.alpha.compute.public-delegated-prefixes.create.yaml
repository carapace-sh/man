name: create
description: '*(ALPHA)*  Creates a Compute Engine public delegated prefix.'
flags:
    --allocatable-prefix-length=: The allocatable prefix length supported by this PDP.
    --description=: Description of this public delegated prefix.
    --enable-live-migration: Specify if this public delegated prefix is meant to be live migrated.
    --global: If set, the public delegated prefix is global.
    --mode=: Specifies the mode of this IPv6 PDP.
    --no-enable-live-migration&: Specify if this public delegated prefix is meant to be live migrated.
    --no-global&: If set, the public delegated prefix is global.
    --public-advertised-prefix=: Public advertised prefix that this delegated prefix is created from.
    --public-delegated-prefix=: Regional Public delegated prefix that this delegated prefix is created from.
    --purpose=: The purpose of the public delegated prefix.
    --range=!: IP range from this public delegated prefix that should be delegated, in CIDR format.
    --region=: Region of the public delegated prefix to operate on.
completion:
    flag:
        mode:
            - delegation
            - external-ipv6-forwarding-rule-creation
            - external-ipv6-subnetwork-creation
            - internal-ipv6-subnetwork-creation
        purpose:
            - APPLICATION_AND_PROXY_LOAD_BALANCERS
            - PASSTHROUGH_LOAD_BALANCER_AVAILABILITY_GROUP0
            - PASSTHROUGH_LOAD_BALANCER_AVAILABILITY_GROUP1
documentation:
    command: |-
        ## EXAMPLES

        To create a public delegated prefix:

          $ gcloud alpha compute public-delegated-prefixes create my-public-delegated-prefix --public-advertised-prefix=my-pap \
            --range=120.120.10.128/27 --global
    flag:
        allocatable-prefix-length: The allocatable prefix length supported by this PDP.
        description: Description of this public delegated prefix.
        enable-live-migration: Specify if this public delegated prefix is meant to be live migrated.
        global: If set, the public delegated prefix is global.
        mode: 'Specifies the mode of this IPv6 PDP. _MODE_ must be one of: *delegation*, *external-ipv6-forwarding-rule-creation*, *external-ipv6-subnetwork-creation*, *internal-ipv6-subnetwork-creation*.'
        no-enable-live-migration: Specify if this public delegated prefix is meant to be live migrated.
        no-global: If set, the public delegated prefix is global.
        public-advertised-prefix: Public advertised prefix that this delegated prefix is created from.
        public-delegated-prefix: Regional Public delegated prefix that this delegated prefix is created from.
        purpose: 'The purpose of the public delegated prefix. This field can only be set for the top-level global public delegated prefix. _PURPOSE_ must be one of: *APPLICATION_AND_PROXY_LOAD_BALANCERS*, *PASSTHROUGH_LOAD_BALANCER_AVAILABILITY_GROUP0*, *PASSTHROUGH_LOAD_BALANCER_AVAILABILITY_GROUP1*.'
        range: IP range from this public delegated prefix that should be delegated, in CIDR format. It must be smaller than parent public advertised prefix range.
        region: Region of the public delegated prefix to operate on. Overrides the default *compute/region* property value for this command invocation.
