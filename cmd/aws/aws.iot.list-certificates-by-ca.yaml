name: list-certificates-by-ca
description: List the device certificates signed by the specified CA certificate.
flags:
    --ascending-order=: Specifies the order for results.
    --ca-certificate-id=!: The ID of the CA certificate.
    --marker=: The marker for the next set of results.
    --page-size=: The result page size.
documentation:
    command: |-
        List the device certificates signed by the specified CA certificate.

        Requires permission to access the [ListCertificatesByCA](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        ascending-order: Specifies the order for results. If True, the results are returned in ascending order, based on the creation date.
        ca-certificate-id: The ID of the CA certificate. This operation will list all registered device certificate that were signed by this CA certificate.
        marker: The marker for the next set of results.
        page-size: The result page size.
