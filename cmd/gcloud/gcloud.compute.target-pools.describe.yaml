name: describe
description: Describe a Compute Engine target pool.
flags:
    --region=: Region of the target pool to describe.
documentation:
    command: |-
        *gcloud compute target-pools describe* displays all data associated with a Compute Engine
        target pool in a project.
    flag:
        region: |-
            Region of the target pool to describe. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
