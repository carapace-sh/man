name: start-device-discovery
description: This API is used to start device discovery for hub-connected and third-party-connected devices.
flags:
    --account-association-id=: The identifier of the cloud-to-cloud account association to use for discovery of third-party devices.
    --authentication-material-type=: The type of authentication material used for device discovery jobs.
    --authentication-material=: The authentication material required to start the local device discovery job request.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: An idempotency token.
    --connector-association-identifier=: The id of the connector association.
    --controller-identifier=: The id of the end-user's IoT hub.
    --custom-protocol-detail=: Additional protocol-specific details required for device discovery, which vary based on the discovery type.
    --discovery-type=!: The discovery type supporting the type of device to be discovered in the device discovery task request.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --tags=: A set of key/value pairs that are used to manage the device discovery request.
completion:
    flag:
        authentication-material-type:
            - ZWAVE_INSTALL_CODE
        discovery-type:
            - ZWAVE
            - ZIGBEE
            - CLOUD
            - CUSTOM
documentation:
    command: This API is used to start device discovery for hub-connected and third-party-connected devices. The authentication material (install code) is passed as a message to the controller telling it to start the discovery.
    flag:
        account-association-id: The identifier of the cloud-to-cloud account association to use for discovery of third-party devices.
        authentication-material: The authentication material required to start the local device discovery job request.
        authentication-material-type: The type of authentication material used for device discovery jobs.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: An idempotency token. If you retry a request that completed successfully initially using the same client token and parameters, then the retry attempt will succeed without performing any further actions.
        connector-association-identifier: The id of the connector association.
        controller-identifier: The id of the end-user's IoT hub.
        custom-protocol-detail: |-
            Additional protocol-specific details required for device discovery, which vary based on the discovery type.

            For a `DiscoveryType` of `CUSTOM`, the string-to-string map must have a key value of `Name` set to a non-empty-string.
        discovery-type: The discovery type supporting the type of device to be discovered in the device discovery task request.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        tags: A set of key/value pairs that are used to manage the device discovery request.
