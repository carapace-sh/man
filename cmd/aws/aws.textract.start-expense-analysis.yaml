name: start-expense-analysis
description: Starts the asynchronous analysis of invoices or receipts for data like contact information, items purchased, and vendor names.
flags:
    --client-request-token=: The idempotent token that's used to identify the start request.
    --document-location=!: The location of the document to be processed.
    --job-tag=: An identifier you specify that's included in the completion notification published to the Amazon SNS topic.
    --kmskey-id=: The KMS key used to encrypt the inference results.
    --notification-channel=: The Amazon SNS topic ARN that you want Amazon Textract to publish the completion status of the operation to.
    --output-config=: Sets if the output will go to a customer defined bucket.
documentation:
    command: |-
        Starts the asynchronous analysis of invoices or receipts for data like contact information, items purchased, and vendor names.

        `StartExpenseAnalysis` can analyze text in documents that are in JPEG, PNG, and PDF format. The documents must be stored in an Amazon S3 bucket. Use the [DocumentLocation]() parameter to specify the name of your S3 bucket and the name of the document in that bucket.

        `StartExpenseAnalysis` returns a job identifier (`JobId`) that you will provide to `GetExpenseAnalysis` to retrieve the results of the operation. When the analysis of the input invoices/receipts is finished, Amazon Textract publishes a completion status to the Amazon Simple Notification Service (Amazon SNS) topic that you provide to the `NotificationChannel`. To obtain the results of the invoice and receipt analysis operation, ensure that the status value published to the Amazon SNS topic is `SUCCEEDED`. If so, call [GetExpenseAnalysis](), and pass the job identifier (`JobId`) that was returned by your call to `StartExpenseAnalysis`.

        For more information, see [Analyzing Invoices and Receipts](https://docs.aws.amazon.com/textract/latest/dg/invoice-receipts.html).
    flag:
        client-request-token: The idempotent token that's used to identify the start request. If you use the same token with multiple `StartDocumentTextDetection` requests, the same `JobId` is returned. Use `ClientRequestToken` to prevent the same job from being accidentally started more than once. For more information, see [Calling Amazon Textract Asynchronous Operations](https://docs.aws.amazon.com/textract/latest/dg/api-async.html)
        document-location: The location of the document to be processed.
        job-tag: An identifier you specify that's included in the completion notification published to the Amazon SNS topic. For example, you can use `JobTag` to identify the type of document that the completion notification corresponds to (such as a tax form or a receipt).
        kmskey-id: The KMS key used to encrypt the inference results. This can be in either Key ID or Key Alias format. When a KMS key is provided, the KMS key will be used for server-side encryption of the objects in the customer bucket. When this parameter is not enabled, the result will be encrypted server side,using SSE-S3.
        notification-channel: The Amazon SNS topic ARN that you want Amazon Textract to publish the completion status of the operation to.
        output-config: Sets if the output will go to a customer defined bucket. By default, Amazon Textract will save the results internally to be accessed by the `GetExpenseAnalysis` operation.
