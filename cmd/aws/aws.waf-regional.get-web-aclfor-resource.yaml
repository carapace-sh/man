name: get-web-aclfor-resource
description: This is **AWS WAF Classic Regional** documentation.
flags:
    --resource-arn=!: The ARN (Amazon Resource Name) of the resource for which to get the web ACL, either an application load balancer or Amazon API Gateway stage.
documentation:
    command: |-
        This is **AWS WAF Classic Regional** documentation. For more information, see [AWS WAF Classic](https://docs.aws.amazon.com/waf/latest/developerguide/classic-waf-chapter.html) in the developer guide.

        **For the latest version of AWS WAF**, use the AWS WAFV2 API and see the [AWS WAF Developer Guide](https://docs.aws.amazon.com/waf/latest/developerguide/waf-chapter.html). With the latest version, AWS WAF has a single set of endpoints for regional and global use.

        Returns the web ACL for the specified resource, either an application load balancer or Amazon API Gateway stage.
    flag:
        resource-arn: |-
            The ARN (Amazon Resource Name) of the resource for which to get the web ACL, either an application load balancer or Amazon API Gateway stage.

            The ARN should be in one of the following formats:

            - For an Application Load Balancer: `arn:aws:elasticloadbalancing:region:account-id:loadbalancer/app/load-balancer-name/load-balancer-id`
            - For an Amazon API Gateway stage: `arn:aws:apigateway:region::/restapis/api-id/stages/stage-name`
