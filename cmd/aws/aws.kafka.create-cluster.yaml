name: create-cluster
description: Creates a new MSK cluster.
flags:
    --broker-node-group-info=!: Information about the broker nodes in the cluster.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-authentication=: Includes all client authentication related information.
    --cluster-name=!: The name of the cluster.
    --configuration-info=: Represents the configuration that you want MSK to use for the brokers in a cluster.
    --encryption-info=: Includes all encryption-related information.
    --enhanced-monitoring=: Specifies the level of monitoring for the MSK cluster.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --kafka-version=!: The version of Apache Kafka.
    --logging-info=: ""
    --number-of-broker-nodes=!: The number of broker nodes in the cluster.
    --open-monitoring=: The settings for open monitoring.
    --rebalancing=: Specifies if intelligent rebalancing should be turned on for the new MSK Provisioned cluster with Express brokers.
    --storage-mode=: This controls storage mode for supported storage tiers.
    --tags=: Create tags when creating the cluster.
completion:
    flag:
        enhanced-monitoring:
            - DEFAULT
            - PER_BROKER
            - PER_TOPIC_PER_BROKER
            - PER_TOPIC_PER_PARTITION
        storage-mode:
            - LOCAL
            - TIERED
documentation:
    command: Creates a new MSK cluster.
    flag:
        broker-node-group-info: Information about the broker nodes in the cluster.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-authentication: Includes all client authentication related information.
        cluster-name: The name of the cluster.
        configuration-info: Represents the configuration that you want MSK to use for the brokers in a cluster.
        encryption-info: Includes all encryption-related information.
        enhanced-monitoring: Specifies the level of monitoring for the MSK cluster. The possible values are DEFAULT, PER\_BROKER, PER\_TOPIC\_PER\_BROKER, and PER\_TOPIC\_PER\_PARTITION.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        kafka-version: The version of Apache Kafka.
        logging-info: ""
        number-of-broker-nodes: The number of broker nodes in the cluster.
        open-monitoring: The settings for open monitoring.
        rebalancing: Specifies if intelligent rebalancing should be turned on for the new MSK Provisioned cluster with Express brokers. By default, intelligent rebalancing status is ACTIVE for all new clusters.
        storage-mode: This controls storage mode for supported storage tiers.
        tags: Create tags when creating the cluster.
