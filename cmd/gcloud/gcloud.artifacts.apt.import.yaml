name: import
description: Import one or more Debian packages into an artifact repository.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --gcs-source=!: The Google Cloud Storage location of a package to import.
    --location=: Location of the repository.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *gcloud artifacts apt import* imports Debian packages from Google Cloud Storage into the specified
        artifact repository.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        gcs-source: |-
            The Google Cloud Storage location of a package to import.
            To import multiple packages, use wildcards at the end of the path.
        location: |-
            Location of the repository.
            +
            To set the `location` attribute:
            * provide the argument `repository` on the command line with a fully specified name;
            * set the property `artifacts/repository` with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `artifacts/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
