name: list-signing-jobs
description: Lists all your signing jobs.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --is-revoked: Filters results to return only signing jobs with revoked signatures.
    --job-invoker=: Filters results to return only signing jobs initiated by a specified IAM entity.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: Specifies the maximum number of items to return in the response.
    --next-token=: String for specifying the next set of paginated results to return.
    --no-is-revoked: Filters results to return only signing jobs with revoked signatures.
    --page-size=: The size of each page to get in the AWS service call.
    --platform-id=: The ID of microcontroller platform that you specified for the distribution of your code image.
    --requested-by=: The IAM principal that requested the signing job.
    --signature-expires-after=: Filters results to return only signing jobs with signatures expiring after a specified timestamp.
    --signature-expires-before=: Filters results to return only signing jobs with signatures expiring before a specified timestamp.
    --starting-token=: A token to specify where to start paginating.
    --status=: A status value with which to filter your results.
completion:
    flag:
        status:
            - InProgress
            - Failed
            - Succeeded
documentation:
    command: Lists all your signing jobs. You can use the `maxResults` parameter to limit the number of signing jobs that are returned in the response. If additional jobs remain to be listed, AWS Signer returns a `nextToken` value. Use this value in subsequent calls to `ListSigningJobs` to fetch the remaining values. You can continue calling `ListSigningJobs` with your `maxResults` parameter and with new values that Signer returns in the `nextToken` parameter until all of your signing jobs have been returned.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        is-revoked: Filters results to return only signing jobs with revoked signatures.
        job-invoker: Filters results to return only signing jobs initiated by a specified IAM entity.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: Specifies the maximum number of items to return in the response. Use this parameter when paginating results. If additional items exist beyond the number you specify, the `nextToken` element is set in the response. Use the `nextToken` value in a subsequent request to retrieve additional items.
        next-token: String for specifying the next set of paginated results to return. After you receive a response with truncated results, use this parameter in a subsequent request. Set it to the value of `nextToken` from the response that you just received.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        platform-id: The ID of microcontroller platform that you specified for the distribution of your code image.
        requested-by: The IAM principal that requested the signing job.
        signature-expires-after: Filters results to return only signing jobs with signatures expiring after a specified timestamp.
        signature-expires-before: Filters results to return only signing jobs with signatures expiring before a specified timestamp.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        status: A status value with which to filter your results.
