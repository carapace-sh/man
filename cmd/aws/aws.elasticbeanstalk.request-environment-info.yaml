name: request-environment-info
description: Initiates a request to compile the specified type of information of the deployed environment.
flags:
    --environment-id=: The ID of the environment of the requested data.
    --environment-name=: The name of the environment of the requested data.
    --info-type=!: The type of information to request.
completion:
    flag:
        info-type:
            - tail
            - bundle
documentation:
    command: |-
        Initiates a request to compile the specified type of information of the deployed environment.

        Setting the `InfoType` to `tail` compiles the last lines from the application server log files of every Amazon EC2 instance in your environment.

        Setting the `InfoType` to `bundle` compresses the application server log files for every Amazon EC2 instance into a `.zip` file. Legacy and .NET containers do not support bundle logs.

        Use [RetrieveEnvironmentInfo]() to obtain the set of logs.

        Related Topics

        - [RetrieveEnvironmentInfo]()
    flag:
        environment-id: |-
            The ID of the environment of the requested data.

            If no such environment is found, `RequestEnvironmentInfo` returns an `InvalidParameterValue` error.

            Condition: You must specify either this or an EnvironmentName, or both. If you do not specify either, AWS Elastic Beanstalk returns `MissingRequiredParameter` error.
        environment-name: |-
            The name of the environment of the requested data.

            If no such environment is found, `RequestEnvironmentInfo` returns an `InvalidParameterValue` error.

            Condition: You must specify either this or an EnvironmentId, or both. If you do not specify either, AWS Elastic Beanstalk returns `MissingRequiredParameter` error.
        info-type: The type of information to request.
