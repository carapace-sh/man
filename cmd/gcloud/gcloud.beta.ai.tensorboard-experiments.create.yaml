name: create
description: '*(BETA)*  Create a new Vertex AI Tensorboard experiment.'
flags:
    --description=: Description of the tensorboard-experiment.
    --display-name=: Display name of the tensorboard-experiment.
    --labels=: List of label KEY=VALUE pairs to add.
    --region=: Cloud region for the tensorboard.
    --tensorboard-experiment-id=!: Id of the Tensorboard experiment.
documentation:
    command: '*(BETA)*  Create a new Vertex AI Tensorboard experiment.'
    flag:
        description: Description of the tensorboard-experiment.
        display-name: Display name of the tensorboard-experiment.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        region: |-
            Cloud region for the tensorboard.
            +
            To set the `region` attribute:
            * provide the argument `tensorboard` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
        tensorboard-experiment-id: Id of the Tensorboard experiment.
