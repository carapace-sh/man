name: describe
description: '*(ALPHA)*  Show metadata for an operation.'
flags:
    --location=: Region or zone of the Operation to get.
documentation:
    command: |-
        *(ALPHA)*  Show metadata for an operation, given a valid operation ID.

        This command can fail for the following reasons:
            * The operation specified does not exist.
            * You do not have permission to view the operation.

        ## EXAMPLES

        The following command prints metadata for an operation with the
        ID `fc.3589215982`:

          $ gcloud alpha resource-manager operations describe fc.3589215982
    flag:
        location: Region or zone of the Operation to get. This field is not required if the Operation is on a global resource such as a Project or TagKey.
