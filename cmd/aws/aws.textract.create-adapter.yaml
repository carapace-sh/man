name: create-adapter
description: Creates an adapter, which can be fine-tuned for enhanced performance on user provided documents.
flags:
    --adapter-name=!: The name to be assigned to the adapter being created.
    --auto-update=: Controls whether or not the adapter should automatically update.
    --client-request-token=: Idempotent token is used to recognize the request.
    --description=: The description to be assigned to the adapter being created.
    --feature-types=!: The type of feature that the adapter is being trained on.
    --tags=: A list of tags to be added to the adapter.
completion:
    flag:
        auto-update:
            - ENABLED
            - DISABLED
documentation:
    command: Creates an adapter, which can be fine-tuned for enhanced performance on user provided documents. Takes an AdapterName and FeatureType. Currently the only supported feature type is `QUERIES`. You can also provide a Description, Tags, and a ClientRequestToken. You can choose whether or not the adapter should be AutoUpdated with the AutoUpdate argument. By default, AutoUpdate is set to DISABLED.
    flag:
        adapter-name: The name to be assigned to the adapter being created.
        auto-update: Controls whether or not the adapter should automatically update.
        client-request-token: Idempotent token is used to recognize the request. If the same token is used with multiple CreateAdapter requests, the same session is returned. This token is employed to avoid unintentionally creating the same session multiple times.
        description: The description to be assigned to the adapter being created.
        feature-types: 'The type of feature that the adapter is being trained on. Currrenly, supported feature types are: `QUERIES`'
        tags: A list of tags to be added to the adapter.
