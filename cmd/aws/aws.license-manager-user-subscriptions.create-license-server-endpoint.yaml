name: create-license-server-endpoint
description: Creates a network endpoint for the Remote Desktop Services (RDS) license server.
flags:
    --identity-provider-arn=!: The Amazon Resource Name (ARN) that identifies the `IdentityProvider` resource that contains details about a registered identity provider.
    --license-server-settings=!: The `LicenseServerSettings` resource to create for the endpoint.
    --tags=: The tags that apply for the license server endpoint.
documentation:
    command: Creates a network endpoint for the Remote Desktop Services (RDS) license server.
    flag:
        identity-provider-arn: The Amazon Resource Name (ARN) that identifies the `IdentityProvider` resource that contains details about a registered identity provider. In the case of Active Directory, that can be a self-managed Active Directory or an Amazon Web Services Managed Active Directory that contains user identity details.
        license-server-settings: The `LicenseServerSettings` resource to create for the endpoint. The settings include the type of license server and the Secrets Manager secret that enables administrators to add or remove users associated with the license server.
        tags: The tags that apply for the license server endpoint.
