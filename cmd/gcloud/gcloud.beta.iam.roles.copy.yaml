name: copy
description: '*(BETA)*  Create a role from an existing role.'
flags:
    --dest-organization=: The organization of the destination role.
    --dest-project=: The project of the destination role.
    --destination=: The destination role ID for the new custom role.
    --source-organization=: The organization of the source role if it is an custom role.
    --source-project=: The project of the source role if it is an custom role.
    --source=: The source role ID.
documentation:
    command: '*(BETA)*  This command creates a role from an existing role.'
    flag:
        dest-organization: The organization of the destination role.
        dest-project: The project of the destination role.
        destination: 'The destination role ID for the new custom role. For example: viewer.'
        source: 'The source role ID. For predefined roles, for example: roles/viewer. For custom roles, for example: myCompanyAdmin.'
        source-organization: The organization of the source role if it is an custom role.
        source-project: The project of the source role if it is an custom role.
