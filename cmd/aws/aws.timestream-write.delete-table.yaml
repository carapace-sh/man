name: delete-table
description: Deletes a given Timestream table.
flags:
    --database-name=!: The name of the database where the Timestream database is to be deleted.
    --table-name=!: The name of the Timestream table to be deleted.
documentation:
    command: |-
        Deletes a given Timestream table. This is an irreversible operation. After a Timestream database table is deleted, the time-series data stored in the table cannot be recovered.

        Due to the nature of distributed retries, the operation can return either success or a ResourceNotFoundException. Clients should consider them equivalent.

        See [code sample](https://docs.aws.amazon.com/timestream/latest/developerguide/code-samples.delete-table.html) for details.
    flag:
        database-name: The name of the database where the Timestream database is to be deleted.
        table-name: The name of the Timestream table to be deleted.
