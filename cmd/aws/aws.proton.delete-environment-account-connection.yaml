name: delete-environment-account-connection
description: In an environment account, delete an environment account connection.
flags:
    --id=!: The ID of the environment account connection to delete.
documentation:
    command: |-
        In an environment account, delete an environment account connection.

        After you delete an environment account connection that’s in use by an Proton environment, Proton *can’t* manage the environment infrastructure resources until a new environment account connection is accepted for the environment account and associated environment. You're responsible for cleaning up provisioned resources that remain without an environment connection.

        For more information, see [Environment account connections](https://docs.aws.amazon.com/proton/latest/userguide/ag-env-account-connections.html) in the *Proton User guide*.
    flag:
        id: The ID of the environment account connection to delete.
