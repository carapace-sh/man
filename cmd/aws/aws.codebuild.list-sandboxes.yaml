name: list-sandboxes
description: Gets a list of sandboxes.
flags:
    --max-results=: The maximum number of sandbox records to be retrieved.
    --next-token=: The next token, if any, to get paginated results.
    --sort-order=: The order in which sandbox records should be retrieved.
completion:
    flag:
        sort-order:
            - ASCENDING
            - DESCENDING
documentation:
    command: Gets a list of sandboxes.
    flag:
        max-results: The maximum number of sandbox records to be retrieved.
        next-token: The next token, if any, to get paginated results. You will get this value from previous execution of list sandboxes.
        sort-order: The order in which sandbox records should be retrieved.
