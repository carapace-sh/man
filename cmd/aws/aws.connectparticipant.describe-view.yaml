name: describe-view
description: Retrieves the view for the specified view token.
flags:
    --connection-token=!: The connection token.
    --view-token=!: An encrypted token originating from the interactive message of a ShowView block operation.
documentation:
    command: |-
        Retrieves the view for the specified view token.

        For security recommendations, see [Amazon Connect Chat security best practices](https://docs.aws.amazon.com/connect/latest/adminguide/security-best-practices.html#bp-security-chat).
    flag:
        connection-token: The connection token.
        view-token: An encrypted token originating from the interactive message of a ShowView block operation. Represents the desired view.
