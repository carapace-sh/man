name: stop-pipeline-execution
description: Stops the specified pipeline execution.
flags:
    --abandon: Use this option to stop the pipeline execution by abandoning, rather than finishing, in-progress actions.
    --no-abandon: Use this option to stop the pipeline execution by abandoning, rather than finishing, in-progress actions.
    --pipeline-execution-id=!: The ID of the pipeline execution to be stopped in the current stage.
    --pipeline-name=!: The name of the pipeline to stop.
    --reason=: Use this option to enter comments, such as the reason the pipeline was stopped.
documentation:
    command: Stops the specified pipeline execution. You choose to either stop the pipeline execution by completing in-progress actions without starting subsequent actions, or by abandoning in-progress actions. While completing or abandoning in-progress actions, the pipeline execution is in a `Stopping` state. After all in-progress actions are completed or abandoned, the pipeline execution is in a `Stopped` state.
    flag:
        abandon: |-
            Use this option to stop the pipeline execution by abandoning, rather than finishing, in-progress actions.

            This option can lead to failed or out-of-sequence tasks.
        pipeline-execution-id: The ID of the pipeline execution to be stopped in the current stage. Use the `GetPipelineState` action to retrieve the current pipelineExecutionId.
        pipeline-name: The name of the pipeline to stop.
        reason: Use this option to enter comments, such as the reason the pipeline was stopped.
