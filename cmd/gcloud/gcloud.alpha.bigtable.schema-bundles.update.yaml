name: update
description: '*(ALPHA)*  Update an existing Bigtable schema bundle.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --ignore-warnings: If true, backwards incompatible changes will be allowed.
    --instance=: Name of the Bigtable instance.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-ignore-warnings&: If true, backwards incompatible changes will be allowed.
    --proto-descriptors-file=!: Path of a file that contains a protobuf-serialized `google.protobuf.FileDescriptorSet` message.
    --table=: Name of the Bigtable table.
documentation:
    command: '*(ALPHA)*  Update an existing Bigtable schema bundle.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        ignore-warnings: If true, backwards incompatible changes will be allowed.
        instance: |-
            Name of the Bigtable instance.
            +
            To set the `instance` attribute:
            * provide the argument `schema_bundle` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-ignore-warnings: |
            If true, backwards incompatible changes will be allowed.
        proto-descriptors-file: |-
            Path of a file that contains a protobuf-serialized `google.protobuf.FileDescriptorSet` message. If specified, the schema bundle contains the protobuf schema.
            To generate the file, install and run `protoc` with the following command:
            +
              protoc --proto_path=IMPORT_PATH --include_imports --descriptor_set_out=DESCRIPTOR_OUTPUT_LOCATION path/to/file.proto
            +
            where the --proto_path option specificies where to look for .proto files when resolving import directives (the current directory is used if you do not provide a value),
            and the --descriptor_set_out option specifies where you want the generated FileDescriptorSet to be written.
        table: |-
            Name of the Bigtable table.
            +
            To set the `table` attribute:
            * provide the argument `schema_bundle` on the command line with a fully specified name;
            * provide the argument `--table` on the command line.
