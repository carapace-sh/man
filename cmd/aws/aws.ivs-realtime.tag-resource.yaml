name: tag-resource
description: Adds or updates tags for the AWS resource with the specified ARN.
flags:
    --resource-arn=!: The ARN of the resource to be tagged.
    --tags=!: Array of tags to be added or updated.
documentation:
    command: Adds or updates tags for the AWS resource with the specified ARN.
    flag:
        resource-arn: The ARN of the resource to be tagged. The ARN must be URL-encoded.
        tags: Array of tags to be added or updated. Array of maps, each of the form `string:string (key:value)`. See [Best practices and strategies](https://docs.aws.amazon.com/tag-editor/latest/userguide/best-practices-and-strats.html) in *Tagging AWS Resources and Tag Editor* for details, including restrictions that apply to tags and "Tag naming limits and requirements"; Amazon IVS has no constraints on tags beyond what is documented there.
