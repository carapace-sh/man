name: create
description: Create an insight config.
flags:
    --app-hub-application=: The App Hub application to which the insight config is associated.
    --artifact-config=: Specifies a single artifact configuration.
    --location=: The region of the insight config.
    --target-projects=&: A comma-separated list of target project IDs/numbers to which the insight config is associated.
documentation:
    command: |
        Create an insights config.
    flag:
        app-hub-application: The App Hub application to which the insight config is associated.
        artifact-config: |-
            Specifies a single artifact configuration. This flag can be repeated for
            multiple configurations.
            +
            Each configuration can be provided in a key-value format.
            +
            Format examples:
            `--artifact-config=uri={REGION}-docker.pkg.dev/my-project/my-repo/my-image,buildProject=my-project`
            `--artifact-config=[uri={REGION}-docker.pkg.dev/my-project/my-repo/my-image,buildProject=my-project]`
            +
            Supported keys within a configuration:
            - `buildProject`: String, e.g., `my-project`
            - `uri`: String, e.g., `{REGION}-docker.pkg.dev/my-project/my-repo/my-image`
        location: |-
            The region of the insight config.
            +
            To set the `location` attribute:
            * provide the argument `insights_config` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        target-projects: |
            A comma-separated list of target project IDs/numbers to which the insight config is associated.

            Format examples:
            `--target-projects=123567890,my-project`
            `--target-projects=projects/1234567890,projects/my-project`
