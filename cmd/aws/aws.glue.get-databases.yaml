name: get-databases
description: Retrieves all databases defined in a given Data Catalog.
flags:
    --attributes-to-get=: Specifies the database fields returned by the `GetDatabases` call.
    --catalog-id=: The ID of the Data Catalog from which to retrieve `Databases`.
    --max-results=: The maximum number of databases to return in one response.
    --next-token=: A continuation token, if this is a continuation call.
    --resource-share-type=: Allows you to specify that you want to list the databases shared with your account.
completion:
    flag:
        resource-share-type:
            - FOREIGN
            - ALL
            - FEDERATED
documentation:
    command: Retrieves all databases defined in a given Data Catalog.
    flag:
        attributes-to-get: Specifies the database fields returned by the `GetDatabases` call. This parameter doesn’t accept an empty list. The request must include the `NAME`.
        catalog-id: The ID of the Data Catalog from which to retrieve `Databases`. If none is provided, the Amazon Web Services account ID is used by default.
        max-results: The maximum number of databases to return in one response.
        next-token: A continuation token, if this is a continuation call.
        resource-share-type: |-
            Allows you to specify that you want to list the databases shared with your account. The allowable values are `FEDERATED`, `FOREIGN` or `ALL`.

            - If set to `FEDERATED`, will list the federated databases (referencing an external entity) shared with your account.
            - If set to `FOREIGN`, will list the databases shared with your account.
            - If set to `ALL`, will list the databases shared with your account, as well as the databases in yor local account.
