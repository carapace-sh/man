name: set
description: '*(ALPHA)*  Set the setting for an IAP resource.'
flags:
    --folder=: Folder ID.
    --organization=: Organization ID.
    --region=: Region name.
    --resource-type=: Resource type of the IAP resource.
    --service=: Service name.
completion:
    flag:
        resource-type:
            - app-engine
            - iap_web
            - compute
            - organization
            - folder
            - forwarding-rule
            - cloud-run
            - backend-services
documentation:
    command: '*(ALPHA)*  Set the setting for an IAP resource.'
    flag:
        folder: Folder ID.
        organization: Organization ID.
        region: Region name. Not applicable for `app-engine`. Required when `resource-type=compute` and regional scoped. Not applicable for global scoped compute. Required when `resource-type=cloud-run`.
        resource-type: 'Resource type of the IAP resource. For Backend Services, you can use both `compute` and `backend-services` as resource type. _RESOURCE_TYPE_ must be one of: *app-engine*, *iap_web*, *compute*, *organization*, *folder*, *forwarding-rule*, *cloud-run*, *backend-services*.'
        service: Service name. Optional when `resource-type` is `compute` or `app-engine`.
