name: describe
description: '*(ALPHA)*  Describe a Compute Engine network policy.'
flags:
    --region=: Region of the network policy to describe.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute network-policies describe* is used to describe network policies. A network
        policy is a set of rules that classifies network traffic.
    flag:
        region: Region of the network policy to describe. Overrides the default *compute/region* property value for this command invocation.
