name: describe
description: Show metadata for a workflow.
flags:
    --location=: The Cloud location for the workflow.
    --revision-id=: The revision ID of the workflow to describe.
documentation:
    command: |
        Display all metadata associated with a workflow of given name and revisionID.
        If revisionID is not provided, the metadata for the latest revision is retrieved.
    flag:
        location: |-
            The Cloud location for the workflow. Alternatively, set the property [workflows/location].
            +

            To set the `location` attribute:
            * provide the argument `workflow` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `workflows/location`.
        revision-id: The revision ID of the workflow to describe.
