name: create
description: '*(ALPHA)*  Create a Bare Metal Solution NFS share.'
flags:
    --allowed-client=!: Adds an allowed client to the NFS share.
    --async: Return immediately, without waiting for the operation in progress to
    --labels=: List of label KEY=VALUE pairs to add.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: Region of the resource.
    --size-gib=!: The requested size of the NFS share in GiB
    --storage-type=!: Specifies the storage type of the underlying volume which will be created for the NFS share.
completion:
    flag:
        storage-type:
            - HDD
            - SSD
documentation:
    command: |
        *(ALPHA)*  Create a Bare Metal Solution NFS share.
    flag:
        allowed-client: |-
            Adds an allowed client to the NFS share. This flag can be repeated to specify multiple allowed clients.
            +
            *network*::: The name of the network to allow.
            +
            *network-project-id*::: The project ID of the allowed client network.
            If not present, the project ID of the NFS share will be used.
            +
            *cidr*::: The subnet of IP addresses permitted to access the NFS
            share.
            +
            *mount-permissions*::: The mount permissions for the allowed client.
            ``MOUNT_PERMISSIONS'' must be one of: `READ_ONLY`, `READ_WRITE`.
            +
            *allow-dev*::: If ``yes'', allows creation of devices.
            +
            *allow-suid*::: If ``yes'', allows SUID.
            +
            *enable-root-squash*::: If ``yes'', enables root squashing which
            is a special mapping of the remote superuser (root) identity when
            using identity authentication .
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            Region of the resource.
            +
            To set the `region` attribute:
            * provide the argument `nfs_share` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
        size-gib: The requested size of the NFS share in GiB
        storage-type: |-
            Specifies the storage type of the underlying volume which will be created for the NFS share. _STORAGE_TYPE_ must be one of:
            +
            *HDD*::: The storage type of the underlying volume will be HDD
            *SSD*::: The storage type of the underlying volume will be SSD
            :::
            +
