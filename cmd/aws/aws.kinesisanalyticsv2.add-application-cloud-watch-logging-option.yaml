name: add-application-cloud-watch-logging-option
description: Adds an Amazon CloudWatch log stream to monitor application configuration errors.
flags:
    --application-name=!: The Kinesis Data Analytics application name.
    --cloud-watch-logging-option=!: Provides the Amazon CloudWatch log stream Amazon Resource Name (ARN).
    --conditional-token=: A value you use to implement strong concurrency for application updates.
    --current-application-version-id=: The version ID of the SQL-based Kinesis Data Analytics application.
documentation:
    command: Adds an Amazon CloudWatch log stream to monitor application configuration errors.
    flag:
        application-name: The Kinesis Data Analytics application name.
        cloud-watch-logging-option: Provides the Amazon CloudWatch log stream Amazon Resource Name (ARN).
        conditional-token: A value you use to implement strong concurrency for application updates. You must provide the `CurrentApplicationVersionId` or the `ConditionalToken`. You get the application's current `ConditionalToken` using [DescribeApplication](). For better concurrency support, use the `ConditionalToken` parameter instead of `CurrentApplicationVersionId`.
        current-application-version-id: The version ID of the SQL-based Kinesis Data Analytics application. You must provide the `CurrentApplicationVersionId` or the `ConditionalToken`.You can retrieve the application version ID using [DescribeApplication](). For better concurrency support, use the `ConditionalToken` parameter instead of `CurrentApplicationVersionId`.
