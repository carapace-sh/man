name: create-notification-configuration
description: Creates a notification configuration.
flags:
    --client-token=: An idempotency token.
    --destination-name=!: The name of the destination for the notification configuration.
    --event-type=!: The type of event triggering a device notification to the customer-managed destination.
    --tags=: A set of key/value pairs that are used to manage the notification configuration.
completion:
    flag:
        event-type:
            - DEVICE_COMMAND
            - DEVICE_COMMAND_REQUEST
            - DEVICE_DISCOVERY_STATUS
            - DEVICE_EVENT
            - DEVICE_LIFE_CYCLE
            - DEVICE_STATE
            - DEVICE_OTA
            - CONNECTOR_ASSOCIATION
            - ACCOUNT_ASSOCIATION
            - CONNECTOR_ERROR_REPORT
documentation:
    command: Creates a notification configuration. A configuration is a connection between an event type and a destination that you have already created.
    flag:
        client-token: An idempotency token. If you retry a request that completed successfully initially using the same client token and parameters, then the retry attempt will succeed without performing any further actions.
        destination-name: The name of the destination for the notification configuration.
        event-type: The type of event triggering a device notification to the customer-managed destination.
        tags: A set of key/value pairs that are used to manage the notification configuration.
