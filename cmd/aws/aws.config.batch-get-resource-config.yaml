name: batch-get-resource-config
description: Returns the `BaseConfigurationItem` for one or more requested resources.
flags:
    --resource-keys=!: A list of resource keys to be processed with the current request.
documentation:
    command: |-
        Returns the `BaseConfigurationItem` for one or more requested resources. The operation also returns a list of resources that are not processed in the current request. If there are no unprocessed resources, the operation returns an empty unprocessedResourceKeys list.

        - The API does not return results for deleted resources.
        - The API does not return any tags for the requested resources. This information is filtered out of the supplementaryConfiguration section of the API response.
    flag:
        resource-keys: A list of resource keys to be processed with the current request. Each element in the list consists of the resource type and resource ID.
