name: start
description: '*(BETA)*  Start a stopped virtual machine instance.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --csek-key-file=: Path to a Customer-Supplied Encryption Key (CSEK) key file that maps
    --no-async&: Return immediately, without waiting for the operation in progress to
    --zone=: Zone of the instances to operate on.
documentation:
    command: |
        *(BETA)*  *gcloud beta compute instances start* is used to start a stopped Compute Engine virtual
        machine. Only a stopped virtual machine can be started.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        csek-key-file: |-
            Path to a Customer-Supplied Encryption Key (CSEK) key file that maps
            Compute Engine resources to user managed keys to be used when
            creating, mounting, or taking snapshots of disks.
            +
            If you pass `-` as value of the flag, the CSEK is read from stdin.
            See https://cloud.google.com/compute/docs/disks/customer-supplied-encryption for more details.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        zone: |-
            Zone of the instances to operate on. If not specified, you might be prompted to select a zone (interactive mode
            only). `gcloud` attempts to identify the appropriate zone by searching for
            resources in your currently active project. If the zone cannot be determined,
            `gcloud` prompts you for a selection with all available Google Cloud Platform
            zones.
            +
            To avoid prompting when this flag is omitted, the user can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
