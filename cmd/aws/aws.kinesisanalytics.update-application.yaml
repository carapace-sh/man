name: update-application
description: This documentation is for version 1 of the Amazon Kinesis Data Analytics API, which only supports SQL applications.
flags:
    --application-name=!: Name of the Amazon Kinesis Analytics application to update.
    --application-update=!: Describes application updates.
    --current-application-version-id=!: The current application version ID.
documentation:
    command: |-
        This documentation is for version 1 of the Amazon Kinesis Data Analytics API, which only supports SQL applications. Version 2 of the API supports SQL and Java applications. For more information about version 2, see [Amazon Kinesis Data Analytics API V2 Documentation](/kinesisanalytics/latest/apiv2/Welcome.html).

        Updates an existing Amazon Kinesis Analytics application. Using this API, you can update application code, input configuration, and output configuration.

        Note that Amazon Kinesis Analytics updates the `CurrentApplicationVersionId` each time you update your application.

        This operation requires permission for the `kinesisanalytics:UpdateApplication` action.
    flag:
        application-name: Name of the Amazon Kinesis Analytics application to update.
        application-update: Describes application updates.
        current-application-version-id: The current application version ID. You can use the [DescribeApplication](https://docs.aws.amazon.com/kinesisanalytics/latest/dev/API_DescribeApplication.html) operation to get this value.
