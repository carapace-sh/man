name: get-pipeline-definition
description: Gets the definition of the specified pipeline.
flags:
    --pipeline-id=!: The ID of the pipeline.
    --version=: The version of the pipeline definition to retrieve.
documentation:
    command: Gets the definition of the specified pipeline. You can call `GetPipelineDefinition` to retrieve the pipeline definition that you provided using [PutPipelineDefinition]().
    flag:
        pipeline-id: The ID of the pipeline.
        version: The version of the pipeline definition to retrieve. Set this parameter to `latest` (default) to use the last definition saved to the pipeline or `active` to use the last definition that was activated.
