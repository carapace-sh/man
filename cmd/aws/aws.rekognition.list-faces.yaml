name: list-faces
description: Returns metadata for faces in the specified collection.
flags:
    --collection-id=!: ID of the collection from which to list the faces.
    --face-ids=: An array of face IDs to filter results with when listing faces in a collection.
    --max-results=: Maximum number of faces to return.
    --next-token=: If the previous response was incomplete (because there is more data to retrieve), Amazon Rekognition returns a pagination token in the response.
    --user-id=: An array of user IDs to filter results with when listing faces in a collection.
documentation:
    command: |-
        Returns metadata for faces in the specified collection. This metadata includes information such as the bounding box coordinates, the confidence (that the bounding box contains a face), and face ID. For an example, see Listing Faces in a Collection in the Amazon Rekognition Developer Guide.

        This operation requires permissions to perform the `rekognition:ListFaces` action.
    flag:
        collection-id: ID of the collection from which to list the faces.
        face-ids: An array of face IDs to filter results with when listing faces in a collection.
        max-results: Maximum number of faces to return.
        next-token: If the previous response was incomplete (because there is more data to retrieve), Amazon Rekognition returns a pagination token in the response. You can use this pagination token to retrieve the next set of faces.
        user-id: An array of user IDs to filter results with when listing faces in a collection.
