name: get-node
description: Returns detailed information about a node.
flags:
    --member-id=: The unique identifier of the member that owns the node.
    --network-id=!: The unique identifier of the network that the node is on.
    --node-id=!: The unique identifier of the node.
documentation:
    command: |-
        Returns detailed information about a node.

        Applies to Hyperledger Fabric and Ethereum.
    flag:
        member-id: |-
            The unique identifier of the member that owns the node.

            Applies only to Hyperledger Fabric and is required for Hyperledger Fabric.
        network-id: The unique identifier of the network that the node is on.
        node-id: The unique identifier of the node.
