name: remove
description: Remove project zonal metadata.
flags:
    --all: If provided, all project zonal metadata entries are removed from VM instances in the zone.
    --keys=: The keys for which you want to remove project zonal metadata
    --no-all&: If provided, all project zonal metadata entries are removed from VM instances in the zone.
    --zone=!: The zone in which you want to remove project zonal metadata
documentation:
    command: |-
        *gcloud compute project-zonal-metadata remove* is used to remove project zonal metadata from all VMs within the
        specified zone. For information about metadata, see
        [](https://cloud.google.com/compute/docs/metadata).

        Only the metadata keys that you provide in the command get removed. All other
        existing metadata entries remain the same.

        After you remove a specific project zonal metadata entry, if that metadata key
        has any project-wide value configured, then the VMs in the zone automatically
        inherit that project-wide value.
    flag:
        all: If provided, all project zonal metadata entries are removed from VM instances in the zone.
        keys: The keys for which you want to remove project zonal metadata
        no-all: If provided, all project zonal metadata entries are removed from VM instances in the zone.
        zone: The zone in which you want to remove project zonal metadata
