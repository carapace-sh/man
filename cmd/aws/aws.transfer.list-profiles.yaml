name: list-profiles
description: Returns a list of the profiles for your system.
flags:
    --max-results=: The maximum number of items to return.
    --next-token=: When there are additional results that were not returned, a `NextToken` parameter is returned.
    --profile-type=: Indicates whether to list only `LOCAL` type profiles or only `PARTNER` type profiles.
completion:
    flag:
        profile-type:
            - LOCAL
            - PARTNER
documentation:
    command: Returns a list of the profiles for your system. If you want to limit the results to a certain number, supply a value for the `MaxResults` parameter. If you ran the command previously and received a value for `NextToken`, you can supply that value to continue listing profiles from where you left off.
    flag:
        max-results: The maximum number of items to return.
        next-token: When there are additional results that were not returned, a `NextToken` parameter is returned. You can use that value for a subsequent call to `ListProfiles` to continue listing results.
        profile-type: Indicates whether to list only `LOCAL` type profiles or only `PARTNER` type profiles. If not supplied in the request, the command lists all types of profiles.
