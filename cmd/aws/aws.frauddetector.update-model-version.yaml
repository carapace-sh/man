name: update-model-version
description: Updates a model version.
flags:
    --external-events-detail=: The details of the external events data used for training the model version.
    --ingested-events-detail=: The details of the ingested event used for training the model version.
    --major-version-number=!: The major version number.
    --model-id=!: The model ID.
    --model-type=!: The model type.
    --tags=: A collection of key and value pairs.
completion:
    flag:
        model-type:
            - ONLINE_FRAUD_INSIGHTS
            - TRANSACTION_FRAUD_INSIGHTS
            - ACCOUNT_TAKEOVER_INSIGHTS
documentation:
    command: Updates a model version. Updating a model version retrains an existing model version using updated training data and produces a new minor version of the model. You can update the training data set location and data access role attributes using this action. This action creates and trains a new minor version of the model, for example version 1.01, 1.02, 1.03.
    flag:
        external-events-detail: The details of the external events data used for training the model version. Required if `trainingDataSource` is `EXTERNAL_EVENTS`.
        ingested-events-detail: The details of the ingested event used for training the model version. Required if your `trainingDataSource` is `INGESTED_EVENTS`.
        major-version-number: The major version number.
        model-id: The model ID.
        model-type: The model type.
        tags: A collection of key and value pairs.
