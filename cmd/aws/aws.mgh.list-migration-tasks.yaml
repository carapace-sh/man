name: list-migration-tasks
description: Lists all, or filtered by resource name, migration tasks associated with the user account making this call.
flags:
    --max-results=: Value to specify how many results are returned per page.
    --next-token=: If a `NextToken` was returned by a previous call, there are more results available.
    --resource-name=: Filter migration tasks by discovered resource name.
documentation:
    command: |-
        Lists all, or filtered by resource name, migration tasks associated with the user account making this call. This API has the following traits:

        - Can show a summary list of the most recent migration tasks.
        - Can show a summary list of migration tasks associated with a given discovered resource.
        - Lists migration tasks in a paginated interface.
    flag:
        max-results: Value to specify how many results are returned per page.
        next-token: If a `NextToken` was returned by a previous call, there are more results available. To retrieve the next page of results, make the call again using the returned token in `NextToken`.
        resource-name: Filter migration tasks by discovered resource name.
