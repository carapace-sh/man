name: describe
description: Describe a Compute Engine reservation block.
flags:
    --block-name=!: The name of the reservation block.
    --full-view=: The view type for the reservation block.
    --zone=: Zone of the reservation to describe.
completion:
    flag:
        full-view:
            - BLOCK_VIEW_BASIC
            - BLOCK_VIEW_FULL
documentation:
    command: Describe a Compute Engine reservation block.
    flag:
        block-name: The name of the reservation block.
        full-view: |-
            The view type for the reservation block. _FULL_VIEW_ must be one of:
            +
            *BLOCK_VIEW_BASIC*::: Basic default view of the reservation block.
            *BLOCK_VIEW_FULL*::: Full detailed view of the reservation block.
            :::
            +
        zone: |-
            Zone of the reservation to describe. If not specified and the ``compute/zone'' property isn't set, you
            might be prompted to select a zone (interactive mode only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
