# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: oplog
description: Show operation history (last 20 entries)
group: operation history
flags:
    --since=: Start from this oplog SHA instead of the head
    -h, --help: Print help
documentation:
    command: Displays the operation log (oplog) which tracks all operations performed in your GitButler workspace. This is useful for understanding what changes have been made and for potentially undoing or restoring to previous states.
