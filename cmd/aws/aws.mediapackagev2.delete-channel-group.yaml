name: delete-channel-group
description: Delete a channel group.
flags:
    --channel-group-name=!: The name that describes the channel group.
documentation:
    command: Delete a channel group. You must delete the channel group's channels and origin endpoints before you can delete the channel group. If you delete a channel group, you'll lose access to the egress domain and will have to create a new channel group to replace it.
    flag:
        channel-group-name: The name that describes the channel group. The name is the primary identifier for the channel group, and must be unique for your account in the AWS Region.
