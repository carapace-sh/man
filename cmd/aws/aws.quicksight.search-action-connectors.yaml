name: search-action-connectors
description: Searches for action connectors in the specified Amazon Web Services account using filters.
flags:
    --aws-account-id=!: The Amazon Web Services account ID in which to search for action connectors.
    --filters=!: The search filters to apply.
    --max-results=: The maximum number of action connectors to return in a single response.
    --next-token=: A pagination token to retrieve the next set of results.
documentation:
    command: Searches for action connectors in the specified Amazon Web Services account using filters. You can search by connector name, type, or user permissions.
    flag:
        aws-account-id: The Amazon Web Services account ID in which to search for action connectors.
        filters: The search filters to apply. You can filter by connector name, type, or user permissions. Maximum of one filter is supported.
        max-results: The maximum number of action connectors to return in a single response. Valid range is 1 to 100.
        next-token: A pagination token to retrieve the next set of results. Use the token returned from a previous call to continue searching.
