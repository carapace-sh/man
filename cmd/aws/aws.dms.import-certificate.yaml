name: import-certificate
description: Uploads the specified certificate.
flags:
    --certificate-identifier=!: A customer-assigned name for the certificate.
    --certificate-pem=: The contents of a `.pem` file, which contains an X.509 certificate.
    --certificate-wallet=: The location of an imported Oracle Wallet certificate for use with SSL.
    --tags=: The tags associated with the certificate.
documentation:
    command: Uploads the specified certificate.
    flag:
        certificate-identifier: A customer-assigned name for the certificate. Identifiers must begin with a letter and must contain only ASCII letters, digits, and hyphens. They can't end with a hyphen or contain two consecutive hyphens.
        certificate-pem: The contents of a `.pem` file, which contains an X.509 certificate.
        certificate-wallet: |-
            The location of an imported Oracle Wallet certificate for use with SSL. Provide the name of a `.sso` file using the `fileb://` prefix. You can't provide the certificate inline.

            Example: `filebase64("${path.root}/rds-ca-2019-root.sso")`
        tags: The tags associated with the certificate.
