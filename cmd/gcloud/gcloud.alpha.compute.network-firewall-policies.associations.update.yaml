name: update
description: '*(ALPHA)*  Update association between a firewall policy and a network.'
hidden: true
flags:
    --firewall-policy-region=: Region of the firewall policy to update.
    --firewall-policy=!: Firewall policy ID with which to update association.
    --global-firewall-policy: If set, the firewall policy is global.
    --name=!: Name of the association.
    --no-global-firewall-policy&: If set, the firewall policy is global.
    --priority=!: Priority of the association.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute network-firewall-policies associations update* is used to update network firewall policy associations. A
        network firewall policy is a set of rules that controls access to various
        resources.
    flag:
        firewall-policy: Firewall policy ID with which to update association.
        firewall-policy-region: Region of the firewall policy to update. Overrides the default *compute/region* property value for this command invocation.
        global-firewall-policy: If set, the firewall policy is global.
        name: Name of the association.
        no-global-firewall-policy: If set, the firewall policy is global.
        priority: Priority of the association.
