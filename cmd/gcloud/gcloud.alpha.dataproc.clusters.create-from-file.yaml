name: create-from-file
description: '*(ALPHA)*  Create a cluster from a file.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --file=!: The path to a YAML file containing a Dataproc Cluster resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: Dataproc region to use.
    --timeout=&: Client side timeout on how long to wait for Dataproc operations.
documentation:
    command: '*(ALPHA)*  Create a cluster from a file.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        file: |-
            The path to a YAML file containing a Dataproc Cluster resource.
            +
            For more information, see:
            https://cloud.google.com/dataproc/docs/reference/rest/v1/projects.regions.clusters#Cluster.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: Dataproc region to use. Each Dataproc region constitutes an independent resource namespace constrained to deploying instances into Compute Engine zones inside the region. Overrides the default *dataproc/region* property value for this command invocation.
        timeout: Client side timeout on how long to wait for Dataproc operations. See $ gcloud topic datetimes for information on duration formats.
