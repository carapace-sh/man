name: create-user
description: Creates a user account for the specified Amazon Connect instance.
flags:
    --directory-user-id=: The identifier of the user account in the directory used for identity management.
    --hierarchy-group-id=: The identifier of the hierarchy group for the user.
    --identity-info=: The information about the identity of the user.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --password=: The password for the user account.
    --phone-config=!: The phone settings for the user.
    --routing-profile-id=!: The identifier of the routing profile for the user.
    --security-profile-ids=!: The identifier of the security profile for the user.
    --tags=: The tags used to organize, track, or control access for this resource.
    --username=!: The user name for the account.
documentation:
    command: |-
        Creates a user account for the specified Amazon Connect instance.

        Certain [UserIdentityInfo](https://docs.aws.amazon.com/connect/latest/APIReference/API_UserIdentityInfo.html) parameters are required in some situations. For example, `Email`, `FirstName` and `LastName` are required if you are using Amazon Connect or SAML for identity management.

        For information about how to create users using the Amazon Connect admin website, see [Add Users](https://docs.aws.amazon.com/connect/latest/adminguide/user-management.html) in the *Amazon Connect Administrator Guide*.
    flag:
        directory-user-id: |-
            The identifier of the user account in the directory used for identity management. If Amazon Connect cannot access the directory, you can specify this identifier to authenticate users. If you include the identifier, we assume that Amazon Connect cannot access the directory. Otherwise, the identity information is used to authenticate users from your directory.

            This parameter is required if you are using an existing directory for identity management in Amazon Connect when Amazon Connect cannot access your directory to authenticate users. If you are using SAML for identity management and include this parameter, an error is returned.
        hierarchy-group-id: The identifier of the hierarchy group for the user.
        identity-info: The information about the identity of the user.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        password: The password for the user account. A password is required if you are using Amazon Connect for identity management. Otherwise, it is an error to include a password.
        phone-config: The phone settings for the user.
        routing-profile-id: The identifier of the routing profile for the user.
        security-profile-ids: The identifier of the security profile for the user.
        tags: 'The tags used to organize, track, or control access for this resource. For example, { "Tags": {"key1":"value1", "key2":"value2"} }.'
        username: |-
            The user name for the account. For instances not using SAML for identity management, the user name can include up to 20 characters. If you are using SAML for identity management, the user name can include up to 64 characters from \[a-zA-Z0-9\_-.\\@]+.

            Username can include @ only if used in an email format. For example:

            - Correct: testuser
            - Correct: testuser@example.com
            - Incorrect: testuser@example
