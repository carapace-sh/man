name: restore
description: '*(ALPHA)*  Restore a version scheduled for destruction.'
flags:
    --key=: The containing key.
    --keyring=: Key ring of the key.
    --location=: Location of the keyring.
documentation:
    command: |-
        *(ALPHA)*  Restores the given version that was scheduled to be destroyed.

        This moves the version from Scheduled for destruction to Disabled.
        Only versions which are Scheduled for destruction can be Restored.

        ## EXAMPLES

        The following command restores version 9 of key `frodo` within
        keyring `fellowship` and location `us-east1` which was previously scheduled
        for destruction:

          $ gcloud alpha kms keys versions restore 9 --location=us-east1 --keyring=fellowship --key=frodo
    flag:
        key: The containing key.
        keyring: Key ring of the key.
        location: Location of the keyring.
