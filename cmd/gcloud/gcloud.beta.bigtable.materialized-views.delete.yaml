name: delete
description: '*(BETA)*  Delete a Bigtable materialized view.'
flags:
    --instance=: Bigtable instance for the materialized view.
documentation:
    command: '*(BETA)*  Delete a Bigtable materialized view.'
    flag:
        instance: |-
            Bigtable instance for the materialized view.
            +
            To set the `instance` attribute:
            * provide the argument `materialized_view` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line.
