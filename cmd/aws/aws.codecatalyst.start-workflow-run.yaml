name: start-workflow-run
description: Begins a run of a specified workflow.
flags:
    --client-token=: A user-specified idempotency token.
    --project-name=!: The name of the project in the space.
    --space-name=!: The name of the space.
    --workflow-id=!: The system-generated unique ID of the workflow.
documentation:
    command: Begins a run of a specified workflow.
    flag:
        client-token: A user-specified idempotency token. Idempotency ensures that an API request completes only once. With an idempotent request, if the original request completes successfully, the subsequent retries return the result from the original successful request and have no additional effect.
        project-name: The name of the project in the space.
        space-name: The name of the space.
        workflow-id: The system-generated unique ID of the workflow. To retrieve a list of workflow IDs, use [ListWorkflows]().
