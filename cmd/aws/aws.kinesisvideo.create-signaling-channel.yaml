name: create-signaling-channel
description: Creates a signaling channel.
flags:
    --channel-name=!: A name for the signaling channel that you are creating.
    --channel-type=: A type of the signaling channel that you are creating.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --single-master-configuration=: A structure containing the configuration for the `SINGLE_MASTER` channel type.
    --tags=:
        description: A set of tags (key-value pairs) that you want to associate with this channel.
        nargs: -1
completion:
    flag:
        channel-type:
            - SINGLE_MASTER
            - FULL_MESH
documentation:
    command: |-
        Creates a signaling channel.

        `CreateSignalingChannel` is an asynchronous operation.
    flag:
        channel-name: A name for the signaling channel that you are creating. It must be unique for each Amazon Web Services account and Amazon Web Services Region.
        channel-type: A type of the signaling channel that you are creating. Currently, `SINGLE_MASTER` is the only supported channel type.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        single-master-configuration: A structure containing the configuration for the `SINGLE_MASTER` channel type. The default configuration for the channel message's time to live is 60 seconds (1 minute).
        tags: A set of tags (key-value pairs) that you want to associate with this channel.
