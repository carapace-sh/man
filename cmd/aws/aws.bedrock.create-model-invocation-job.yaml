name: create-model-invocation-job
description: Creates a batch inference job to invoke a model on multiple prompts.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=: A unique, case-sensitive identifier to ensure that the API request completes no more than one time.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --input-data-config=!: Details about the location of the input to the batch inference job.
    --job-name=!: A name to give the batch inference job.
    --model-id=!: The unique identifier of the foundation model to use for the batch inference job.
    --output-data-config=!: Details about the location of the output of the batch inference job.
    --role-arn=!: The Amazon Resource Name (ARN) of the service role with permissions to carry out and manage batch inference.
    --tags=: Any tags to associate with the batch inference job.
    --timeout-duration-in-hours=: The number of hours after which to force the batch inference job to time out.
    --vpc-config=: The configuration of the Virtual Private Cloud (VPC) for the data in the batch inference job.
documentation:
    command: |-
        Creates a batch inference job to invoke a model on multiple prompts. Format your data according to [Format your inference data](https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference-data) and upload it to an Amazon S3 bucket. For more information, see [Process multiple prompts with batch inference](https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference.html).

        The response returns a `jobArn` that you can use to stop or get details about the job.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: A unique, case-sensitive identifier to ensure that the API request completes no more than one time. If this token matches a previous request, Amazon Bedrock ignores the request, but does not return an error. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        input-data-config: Details about the location of the input to the batch inference job.
        job-name: A name to give the batch inference job.
        model-id: The unique identifier of the foundation model to use for the batch inference job.
        output-data-config: Details about the location of the output of the batch inference job.
        role-arn: The Amazon Resource Name (ARN) of the service role with permissions to carry out and manage batch inference. You can use the console to create a default service role or follow the steps at [Create a service role for batch inference](https://docs.aws.amazon.com/bedrock/latest/userguide/batch-iam-sr.html).
        tags: Any tags to associate with the batch inference job. For more information, see [Tagging Amazon Bedrock resources](https://docs.aws.amazon.com/bedrock/latest/userguide/tagging.html).
        timeout-duration-in-hours: The number of hours after which to force the batch inference job to time out.
        vpc-config: The configuration of the Virtual Private Cloud (VPC) for the data in the batch inference job. For more information, see [Protect batch inference jobs using a VPC](https://docs.aws.amazon.com/bedrock/latest/userguide/batch-vpc).
