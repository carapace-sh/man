name: describe-document
description: Describes the specified Amazon Web Services Systems Manager document (SSM document).
flags:
    --document-version=: The document version for which you want information.
    --name=!: The name of the SSM document.
    --version-name=: An optional field specifying the version of the artifact associated with the document.
documentation:
    command: Describes the specified Amazon Web Services Systems Manager document (SSM document).
    flag:
        document-version: The document version for which you want information. Can be a specific version or the default version.
        name: |-
            The name of the SSM document.

            If you're calling a shared SSM document from a different Amazon Web Services account, `Name` is the full Amazon Resource Name (ARN) of the document.
        version-name: An optional field specifying the version of the artifact associated with the document. For example, 12.6. This value is unique across all versions of a document, and can't be changed.
