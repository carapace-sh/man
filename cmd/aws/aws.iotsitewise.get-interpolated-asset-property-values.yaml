name: get-interpolated-asset-property-values
description: Get interpolated values for an asset property for a specified time interval, during a period of time.
flags:
    --asset-id=: The ID of the asset, in UUID format.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --end-time-in-seconds=!: The inclusive end of the range from which to interpolate data, expressed in seconds in Unix epoch time.
    --end-time-offset-in-nanos=: The nanosecond offset converted from `endTimeInSeconds`.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --interval-in-seconds=!: The time interval in seconds over which to interpolate data.
    --interval-window-in-seconds=: The query interval for the window, in seconds.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of results to return for each paginated request.
    --next-token=: The token to be used for the next set of paginated results.
    --page-size=: The size of each page to get in the AWS service call.
    --property-alias=: The alias that identifies the property, such as an OPC-UA server data stream path (for example, `/company/windfarm/3/turbine/7/temperature`).
    --property-id=: The ID of the asset property, in UUID format.
    --quality=!: The quality of the asset property value.
    --start-time-in-seconds=!: The exclusive start of the range from which to interpolate data, expressed in seconds in Unix epoch time.
    --start-time-offset-in-nanos=: The nanosecond offset converted from `startTimeInSeconds`.
    --starting-token=: A token to specify where to start paginating.
    --type=!: The interpolation type.
completion:
    flag:
        quality:
            - GOOD
            - BAD
            - UNCERTAIN
documentation:
    command: |-
        Get interpolated values for an asset property for a specified time interval, during a period of time. If your time series is missing data points during the specified time interval, you can use interpolation to estimate the missing data.

        For example, you can use this operation to return the interpolated temperature values for a wind turbine every 24 hours over a duration of 7 days.

        To identify an asset property, you must specify one of the following:

        - The `assetId` and `propertyId` of an asset property.
        - A `propertyAlias`, which is a data stream alias (for example, `/company/windfarm/3/turbine/7/temperature`). To define an asset property's alias, see [UpdateAssetProperty](https://docs.aws.amazon.com/iot-sitewise/latest/APIReference/API_UpdateAssetProperty.html).
    flag:
        asset-id: The ID of the asset, in UUID format.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        end-time-in-seconds: The inclusive end of the range from which to interpolate data, expressed in seconds in Unix epoch time.
        end-time-offset-in-nanos: The nanosecond offset converted from `endTimeInSeconds`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        interval-in-seconds: The time interval in seconds over which to interpolate data. Each interval starts when the previous one ends.
        interval-window-in-seconds: |-
            The query interval for the window, in seconds. IoT SiteWise computes each interpolated value by using data points from the timestamp of each interval, minus the window to the timestamp of each interval plus the window. If not specified, the window ranges between the start time minus the interval and the end time plus the interval.

            - If you specify a value for the `intervalWindowInSeconds` parameter, the value for the `type` parameter must be `LINEAR_INTERPOLATION`.
            - If a data point isn't found during the specified query window, IoT SiteWise won't return an interpolated value for the interval. This indicates that there's a gap in the ingested data points.

            For example, you can get the interpolated temperature values for a wind turbine every 24 hours over a duration of 7 days. If the interpolation starts on July 1, 2021, at 9 AM with a window of 2 hours, IoT SiteWise uses the data points from 7 AM (9 AM minus 2 hours) to 11 AM (9 AM plus 2 hours) on July 2, 2021 to compute the first interpolated value. Next, IoT SiteWise uses the data points from 7 AM (9 AM minus 2 hours) to 11 AM (9 AM plus 2 hours) on July 3, 2021 to compute the second interpolated value, and so on.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of results to return for each paginated request. If not specified, the default value is 10.
        next-token: The token to be used for the next set of paginated results.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        property-alias: The alias that identifies the property, such as an OPC-UA server data stream path (for example, `/company/windfarm/3/turbine/7/temperature`). For more information, see [Mapping industrial data streams to asset properties](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/connect-data-streams.html) in the *IoT SiteWise User Guide*.
        property-id: The ID of the asset property, in UUID format.
        quality: The quality of the asset property value. You can use this parameter as a filter to choose only the asset property values that have a specific quality.
        start-time-in-seconds: The exclusive start of the range from which to interpolate data, expressed in seconds in Unix epoch time.
        start-time-offset-in-nanos: The nanosecond offset converted from `startTimeInSeconds`.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        type: "The interpolation type.\n\nValid values: `LINEAR_INTERPOLATION | LOCF_INTERPOLATION`\n\n- `LINEAR_INTERPOLATION` – Estimates missing data using [linear interpolation](https://en.wikipedia.org/wiki/Linear_interpolation).\n  \n  For example, you can use this operation to return the interpolated temperature values for a wind turbine every 24 hours over a duration of 7 days. If the interpolation starts July 1, 2021, at 9 AM, IoT SiteWise returns the first interpolated value on July 2, 2021, at 9 AM, the second interpolated value on July 3, 2021, at 9 AM, and so on.\n- `LOCF_INTERPOLATION` – Estimates missing data using last observation carried forward interpolation\n  \n  If no data point is found for an interval, IoT SiteWise returns the last observed data point for the previous interval and carries forward this interpolated value until a new data point is found.\n  \n  For example, you can get the state of an on-off valve every 24 hours over a duration of 7 days. If the interpolation starts July 1, 2021, at 9 AM, IoT SiteWise returns the last observed data point between July 1, 2021, at 9 AM and July 2, 2021, at 9 AM as the first interpolated value. If a data point isn't found after 9 AM on July 2, 2021, IoT SiteWise uses the same interpolated value for the rest of the days."
