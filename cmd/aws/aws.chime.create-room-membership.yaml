name: create-room-membership
description: Adds a member to a chat room in an Amazon Chime Enterprise account.
flags:
    --account-id=!: The Amazon Chime account ID.
    --member-id=!: The Amazon Chime member ID (user ID or bot ID).
    --role=: The role of the member.
    --room-id=!: The room ID.
completion:
    flag:
        role:
            - Administrator
            - Member
documentation:
    command: Adds a member to a chat room in an Amazon Chime Enterprise account. A member can be either a user or a bot. The member role designates whether the member is a chat room administrator or a general chat room member.
    flag:
        account-id: The Amazon Chime account ID.
        member-id: The Amazon Chime member ID (user ID or bot ID).
        role: The role of the member.
        room-id: The room ID.
