name: create-remote-access-session
description: Specifies and starts a remote access session.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-id=: Unique identifier for the client.
    --configuration=: The configuration information for the remote access session request.
    --device-arn=!: The ARN of the device for which you want to create a remote access session.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-arn=: The Amazon Resource Name (ARN) of the device instance for which you want to create a remote access session.
    --interaction-mode=: The interaction mode of the remote access session.
    --name=: The name of the remote access session to create.
    --no-remote-debug-enabled: Set to `true` if you want to access devices remotely for debugging in your remote access session.
    --no-remote-record-enabled: Set to `true` to enable remote recording for the remote access session.
    --no-skip-app-resign: When set to `true`, for private devices, Device Farm does not sign your app again.
    --project-arn=!: The Amazon Resource Name (ARN) of the project for which you want to create a remote access session.
    --remote-debug-enabled: Set to `true` if you want to access devices remotely for debugging in your remote access session.
    --remote-record-app-arn=: The Amazon Resource Name (ARN) for the app to be recorded in the remote access session.
    --remote-record-enabled: Set to `true` to enable remote recording for the remote access session.
    --skip-app-resign: When set to `true`, for private devices, Device Farm does not sign your app again.
    --ssh-public-key=: Ignored.
completion:
    flag:
        interaction-mode:
            - INTERACTIVE
            - NO_VIDEO
            - VIDEO_ONLY
documentation:
    command: Specifies and starts a remote access session.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-id: |-
            Unique identifier for the client. If you want access to multiple devices on the same client, you should pass the same `clientId` value in each call to `CreateRemoteAccessSession`. This identifier is required only if `remoteDebugEnabled` is set to `true`.

            Remote debugging is [no longer supported](https://docs.aws.amazon.com/devicefarm/latest/developerguide/history.html).
        configuration: The configuration information for the remote access session request.
        device-arn: The ARN of the device for which you want to create a remote access session.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-arn: The Amazon Resource Name (ARN) of the device instance for which you want to create a remote access session.
        interaction-mode: |-
            The interaction mode of the remote access session. Valid values are:

            - INTERACTIVE: You can interact with the iOS device by viewing, touching, and rotating the screen. You cannot run XCUITest framework-based tests in this mode.
            - NO\_VIDEO: You are connected to the device, but cannot interact with it or view the screen. This mode has the fastest test execution speed. You can run XCUITest framework-based tests in this mode.
            - VIDEO\_ONLY: You can view the screen, but cannot touch or rotate it. You can run XCUITest framework-based tests and watch the screen in this mode.
        name: The name of the remote access session to create.
        project-arn: The Amazon Resource Name (ARN) of the project for which you want to create a remote access session.
        remote-debug-enabled: |-
            Set to `true` if you want to access devices remotely for debugging in your remote access session.

            Remote debugging is [no longer supported](https://docs.aws.amazon.com/devicefarm/latest/developerguide/history.html).
        remote-record-app-arn: The Amazon Resource Name (ARN) for the app to be recorded in the remote access session.
        remote-record-enabled: Set to `true` to enable remote recording for the remote access session.
        skip-app-resign: |-
            When set to `true`, for private devices, Device Farm does not sign your app again. For public devices, Device Farm always signs your apps again.

            For more information on how Device Farm modifies your uploads during tests, see [Do you modify my app?](http://aws.amazon.com/device-farm/faqs/)
        ssh-public-key: |-
            Ignored. The public key of the `ssh` key pair you want to use for connecting to remote devices in your remote debugging session. This key is required only if `remoteDebugEnabled` is set to `true`.

            Remote debugging is [no longer supported](https://docs.aws.amazon.com/devicefarm/latest/developerguide/history.html).
