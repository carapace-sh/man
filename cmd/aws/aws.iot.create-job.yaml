name: create-job
description: Creates a job.
flags:
    --abort-config=: Allows you to create the criteria to abort a job.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A short text description of the job.
    --destination-package-versions=: The package version Amazon Resource Names (ARNs) that are installed on the device when the job successfully completes.
    --document-parameters=: Parameters of an Amazon Web Services managed template that you can specify to create the job document.
    --document-source=: An S3 link, or S3 object URL, to the job document.
    --document=: The job document.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --job-executions-retry-config=: Allows you to create the criteria to retry a job.
    --job-executions-rollout-config=: Allows you to create a staged rollout of the job.
    --job-id=!: A job identifier which must be unique for your account.
    --job-template-arn=: The ARN of the job template used to create the job.
    --namespace-id=: The namespace used to indicate that a job is a customer-managed job.
    --presigned-url-config=: Configuration information for pre-signed S3 URLs.
    --scheduling-config=: The configuration that allows you to schedule a job for a future date and time in addition to specifying the end behavior for each job execution.
    --tags=: Metadata which can be used to manage the job.
    --target-selection=: Specifies whether the job will continue to run (CONTINUOUS), or will be complete after all those things specified as targets have completed the job (SNAPSHOT).
    --targets=!: A list of things and thing groups to which the job should be sent.
    --timeout-config=: Specifies the amount of time each device has to finish its execution of the job.
completion:
    flag:
        target-selection:
            - CONTINUOUS
            - SNAPSHOT
documentation:
    command: |-
        Creates a job.

        Requires permission to access the [CreateJob](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        abort-config: Allows you to create the criteria to abort a job.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A short text description of the job.
        destination-package-versions: |-
            The package version Amazon Resource Names (ARNs) that are installed on the device when the job successfully completes. The package version must be in either the Published or Deprecated state when the job deploys. For more information, see [Package version lifecycle](https://docs.aws.amazon.com/iot/latest/developerguide/preparing-to-use-software-package-catalog.html#package-version-lifecycle).

            **Note:**The following Length Constraints relates to a single ARN. Up to 25 package version ARNs are allowed.
        document: The job document. Required if you don't specify a value for `documentSource`.
        document-parameters: |-
            Parameters of an Amazon Web Services managed template that you can specify to create the job document.

            `documentParameters` can only be used when creating jobs from Amazon Web Services managed templates. This parameter can't be used with custom job templates or to create jobs from them.
        document-source: |-
            An S3 link, or S3 object URL, to the job document. The link is an Amazon S3 object URL and is required if you don't specify a value for `document`.

            For example, `--document-source https://s3.region-code.amazonaws.com/example-firmware/device-firmware.1.0`

            For more information, see [Methods for accessing a bucket](https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-bucket-intro.html).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        job-executions-retry-config: Allows you to create the criteria to retry a job.
        job-executions-rollout-config: Allows you to create a staged rollout of the job.
        job-id: A job identifier which must be unique for your account. We recommend using a UUID. Alpha-numeric characters, "-" and "\_" are valid for use here.
        job-template-arn: The ARN of the job template used to create the job.
        namespace-id: |-
            The namespace used to indicate that a job is a customer-managed job.

            When you specify a value for this parameter, Amazon Web Services IoT Core sends jobs notifications to MQTT topics that contain the value in the following format.

            `$aws/things/THING_NAME/jobs/JOB_ID/notify-namespace-NAMESPACE_ID/`

            The `namespaceId` feature is only supported by IoT Greengrass at this time. For more information, see [Setting up IoT Greengrass core devices.](https://docs.aws.amazon.com/greengrass/v2/developerguide/setting-up.html)
        presigned-url-config: Configuration information for pre-signed S3 URLs.
        scheduling-config: The configuration that allows you to schedule a job for a future date and time in addition to specifying the end behavior for each job execution.
        tags: Metadata which can be used to manage the job.
        target-selection: |-
            Specifies whether the job will continue to run (CONTINUOUS), or will be complete after all those things specified as targets have completed the job (SNAPSHOT). If continuous, the job may also be run on a thing when a change is detected in a target. For example, a job will run on a thing when the thing is added to a target group, even after the job was completed by all things originally in the group.

            We recommend that you use continuous jobs instead of snapshot jobs for dynamic thing group targets. By using continuous jobs, devices that join the group receive the job execution even after the job has been created.
        targets: A list of things and thing groups to which the job should be sent.
        timeout-config: Specifies the amount of time each device has to finish its execution of the job. The timer is started when the job execution status is set to `IN_PROGRESS`. If the job execution status is not set to another terminal state before the time expires, it will be automatically set to `TIMED_OUT`.
