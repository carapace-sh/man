name: list-sessions
description: Lists sessions in an AgentCore Memory resource based on specified criteria.
flags:
    --actor-id=!: The identifier of the actor for which to list sessions.
    --max-results=: The maximum number of results to return in a single call.
    --memory-id=!: The identifier of the AgentCore Memory resource for which to list sessions.
    --next-token=: The token for the next set of results.
documentation:
    command: |-
        Lists sessions in an AgentCore Memory resource based on specified criteria. We recommend using pagination to ensure that the operation returns quickly and successfully.

        To use this operation, you must have the `bedrock-agentcore:ListSessions` permission.
    flag:
        actor-id: The identifier of the actor for which to list sessions. If specified, only sessions involving this actor are returned.
        max-results: The maximum number of results to return in a single call. Minimum value of 1, maximum value of 100. Default is 20.
        memory-id: The identifier of the AgentCore Memory resource for which to list sessions.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
