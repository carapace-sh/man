name: delete-mitigation-action
description: Deletes a defined mitigation action from your Amazon Web Services accounts.
flags:
    --action-name=!: The name of the mitigation action that you want to delete.
documentation:
    command: |-
        Deletes a defined mitigation action from your Amazon Web Services accounts.

        Requires permission to access the [DeleteMitigationAction](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        action-name: The name of the mitigation action that you want to delete.
