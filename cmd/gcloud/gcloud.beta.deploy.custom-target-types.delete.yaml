name: delete
description: '*(BETA)*  Delete a custom target type.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: Location of the custom target type.
documentation:
    command: '*(BETA)*  Delete a custom target type for a specified region.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            Location of the custom target type.
            +

            To set the `region` attribute:
            * provide the argument `custom_target_type` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `deploy/region`.
