name: infer-connections
description: '*(ALPHA)*  Infer connections for a space.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --catalog-template-revision-uris=: A comma-separated list of catalog template revision URIs to infer connections for.
    --location=: The Cloud location for the space.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-use-gemini&: Use Gemini to infer connections.
    --use-gemini: Use Gemini to infer connections.
documentation:
    command: '*(ALPHA)*  Infers connections for catalog and shared template revisions within a space. If no URIs are provided, it processes all templates in the space, but may fail if a shared template is unexpectedly missing.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        catalog-template-revision-uris: 'A comma-separated list of catalog template revision URIs to infer connections for. If not provided, the system infers connections for the latest revisions of all catalog templates in all the catalogs present in the space. Format: `projects/{projectId}/locations/{locationId}/spaces/{spaceId}/catalogs/{catalogId}/templates/{templateId}/revisions/{revisionId}`'
        location: |-
            The Cloud location for the space.
            +
            To set the `location` attribute:
            * provide the argument `space` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-use-gemini: Use Gemini to infer connections.
        use-gemini: Use Gemini to infer connections.
