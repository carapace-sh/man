name: delete-audience-model
description: Specifies an audience model that you want to delete.
flags:
    --audience-model-arn=!: The Amazon Resource Name (ARN) of the audience model that you want to delete.
documentation:
    command: Specifies an audience model that you want to delete. You can't delete an audience model if there are any configured audience models that depend on the audience model.
    flag:
        audience-model-arn: The Amazon Resource Name (ARN) of the audience model that you want to delete.
