name: set-identity-feedback-forwarding-enabled
description: Given an identity (an email address or a domain), enables or disables whether Amazon SES forwards bounce and complaint notifications as email.
flags:
    --forwarding-enabled=!: Sets whether Amazon SES forwards bounce and complaint notifications as email.
    --identity=!: The identity for which to set bounce and complaint notification forwarding.
documentation:
    command: |-
        Given an identity (an email address or a domain), enables or disables whether Amazon SES forwards bounce and complaint notifications as email. Feedback forwarding can only be disabled when Amazon Simple Notification Service (Amazon SNS) topics are specified for both bounces and complaints.

        Feedback forwarding does not apply to delivery notifications. Delivery notifications are only available through Amazon SNS.

        You can execute this operation no more than once per second.

        For more information about using notifications with Amazon SES, see the [Amazon SES Developer Guide](https://docs.aws.amazon.com/ses/latest/dg/monitor-sending-activity-using-notifications.html).
    flag:
        forwarding-enabled: Sets whether Amazon SES forwards bounce and complaint notifications as email. `true` specifies that Amazon SES forwards bounce and complaint notifications as email, in addition to any Amazon SNS topic publishing otherwise specified. `false` specifies that Amazon SES publishes bounce and complaint notifications only through Amazon SNS. This value can only be set to `false` when Amazon SNS topics are set for both `Bounce` and `Complaint` notification types.
        identity: 'The identity for which to set bounce and complaint notification forwarding. Examples: `user@example.com`, `example.com`.'
