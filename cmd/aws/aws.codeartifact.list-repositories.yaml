name: list-repositories
description: Returns a list of [RepositorySummary](https://docs.aws.amazon.com/codeartifact/latest/APIReference/API_RepositorySummary.html) objects.
flags:
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
    --repository-prefix=: A prefix used to filter returned repositories.
documentation:
    command: Returns a list of [RepositorySummary](https://docs.aws.amazon.com/codeartifact/latest/APIReference/API_RepositorySummary.html) objects. Each `RepositorySummary` contains information about a repository in the specified Amazon Web Services account and that matches the input parameters.
    flag:
        max-results: The maximum number of results to return per page.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        repository-prefix: A prefix used to filter returned repositories. Only repositories with names that start with `repositoryPrefix` are returned.
