name: reject-domain-name-access-association
description: Rejects a domain name access association with a private custom domain name.
flags:
    --domain-name-access-association-arn=!: The ARN of the domain name access association resource.
    --domain-name-arn=!: The ARN of the domain name.
documentation:
    command: |-
        Rejects a domain name access association with a private custom domain name.

        To reject a domain name access association with an access association source in another AWS account, use this operation. To remove a domain name access association with an access association source in your own account, use the DeleteDomainNameAccessAssociation operation.
    flag:
        domain-name-access-association-arn: The ARN of the domain name access association resource.
        domain-name-arn: The ARN of the domain name.
