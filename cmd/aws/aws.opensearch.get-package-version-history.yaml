name: get-package-version-history
description: Returns a list of Amazon OpenSearch Service package versions, along with their creation time, commit message, and plugin properties (if the package is a zip plugin package).
flags:
    --max-results=: An optional parameter that specifies the maximum number of results to return.
    --next-token=: If your initial `GetPackageVersionHistory` operation returns a `nextToken`, you can include the returned `nextToken` in subsequent `GetPackageVersionHistory` operations, which returns results in the next page.
    --package-id=!: The unique identifier of the package.
documentation:
    command: Returns a list of Amazon OpenSearch Service package versions, along with their creation time, commit message, and plugin properties (if the package is a zip plugin package). For more information, see [Custom packages for Amazon OpenSearch Service](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/custom-packages.html).
    flag:
        max-results: An optional parameter that specifies the maximum number of results to return. You can use `nextToken` to get the next page of results.
        next-token: If your initial `GetPackageVersionHistory` operation returns a `nextToken`, you can include the returned `nextToken` in subsequent `GetPackageVersionHistory` operations, which returns results in the next page.
        package-id: The unique identifier of the package.
