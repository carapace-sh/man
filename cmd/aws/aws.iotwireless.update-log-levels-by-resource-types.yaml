name: update-log-levels-by-resource-types
description: Set default log level, or log levels by resource types.
flags:
    --default-log-level=: ""
    --fuota-task-log-options=: ""
    --wireless-device-log-options=: ""
    --wireless-gateway-log-options=: ""
completion:
    flag:
        default-log-level:
            - INFO
            - ERROR
            - DISABLED
documentation:
    command: Set default log level, or log levels by resource types. This can be for wireless device, wireless gateway, or FUOTA task log options, and is used to control the log messages that'll be displayed in CloudWatch.
    flag:
        default-log-level: ""
        fuota-task-log-options: ""
        wireless-device-log-options: ""
        wireless-gateway-log-options: ""
