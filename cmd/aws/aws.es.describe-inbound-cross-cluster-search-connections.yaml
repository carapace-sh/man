name: describe-inbound-cross-cluster-search-connections
description: Lists all the inbound cross-cluster search connections for a destination domain.
flags:
    --filters=: A list of filters used to match properties for inbound cross-cluster search connection.
    --max-results=: Set this value to limit the number of results returned.
    --next-token=: NextToken is sent in case the earlier API call results contain the NextToken.
documentation:
    command: Lists all the inbound cross-cluster search connections for a destination domain.
    flag:
        filters: |-
            A list of filters used to match properties for inbound cross-cluster search connection. Available `Filter` names for this operation are:

            - cross-cluster-search-connection-id
            - source-domain-info.domain-name
            - source-domain-info.owner-id
            - source-domain-info.region
            - destination-domain-info.domain-name
        max-results: Set this value to limit the number of results returned. If not specified, defaults to 100.
        next-token: NextToken is sent in case the earlier API call results contain the NextToken. It is used for pagination.
