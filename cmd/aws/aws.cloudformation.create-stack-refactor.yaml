name: create-stack-refactor
description: Creates a refactor across multiple stacks, with the list of stacks and resources that are affected.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description to help you identify the stack refactor.
    --enable-stack-creation: Determines if a new stack is created with the refactor.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-enable-stack-creation: Determines if a new stack is created with the refactor.
    --resource-mappings=: The mappings for the stack resource `Source` and stack resource `Destination`.
    --stack-definitions=!: The stacks being refactored.
documentation:
    command: Creates a refactor across multiple stacks, with the list of stacks and resources that are affected.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
