name: add-tags
description: Add tags to Compute Engine virtual machine instances.
flags:
    --tags=!: Specifies strings to be attached to the instance for later
    --zone=: Zone of the instance to set tags on.
documentation:
    command: |
        *gcloud compute instances add-tags* is used to add tags to Compute Engine virtual
        machine instances.

        Tags can be used to identify the instances when adding network
        firewall rules. Tags can also be used to get firewall rules that
        already exist to be applied to the instance. See
        gcloud_compute_firewall-rules_create(1) for more details.

        To list instances with their respective status and tags, run:

          $ gcloud compute instances list --format="table(name,status,tags.list())"

        To list instances tagged with a specific tag, `tag1`, run:

          $ gcloud compute instances list --filter='tags:tag1'
    flag:
        tags: |-
            Specifies strings to be attached to the instance for later
            identifying the instance when adding network firewall rules.
            Multiple tags can be attached by repeating this flag.
        zone: |-
            Zone of the instance to set tags on. If not specified, you might be prompted to select a zone (interactive mode
            only). `gcloud` attempts to identify the appropriate zone by searching for
            resources in your currently active project. If the zone cannot be determined,
            `gcloud` prompts you for a selection with all available Google Cloud Platform
            zones.
            +
            To avoid prompting when this flag is omitted, the user can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
