name: create-slot
description: Creates a slot in an intent.
flags:
    --bot-id=!: The identifier of the bot associated with the slot.
    --bot-version=!: The version of the bot associated with the slot.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description of the slot.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --intent-id=!: The identifier of the intent that contains the slot.
    --locale-id=!: The identifier of the language and locale that the slot will be used in.
    --multiple-values-setting=: Indicates whether the slot returns multiple values in one response.
    --obfuscation-setting=: Determines how slot values are used in Amazon CloudWatch logs.
    --slot-name=!: The name of the slot.
    --slot-type-id=: The unique identifier for the slot type associated with this slot.
    --sub-slot-setting=: Specifications for the constituent sub slots and the expression for the composite slot.
    --value-elicitation-setting=!: Specifies prompts that Amazon Lex sends to the user to elicit a response that provides the value for the slot.
documentation:
    command: Creates a slot in an intent. A slot is a variable needed to fulfill an intent. For example, an `OrderPizza` intent might need slots for size, crust, and number of pizzas. For each slot, you define one or more utterances that Amazon Lex uses to elicit a response from the user.
    flag:
        bot-id: The identifier of the bot associated with the slot.
        bot-version: The version of the bot associated with the slot.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description of the slot. Use this to help identify the slot in lists.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        intent-id: The identifier of the intent that contains the slot.
        locale-id: The identifier of the language and locale that the slot will be used in. The string must match one of the supported locales. All of the bots, intents, slot types used by the slot must have the same locale. For more information, see [Supported languages](https://docs.aws.amazon.com/lexv2/latest/dg/how-languages.html).
        multiple-values-setting: |-
            Indicates whether the slot returns multiple values in one response. Multi-value slots are only available in the `en-US` locale. If you set this value to `true` in any other locale, Amazon Lex throws a `ValidationException`.

            If the `multipleValuesSetting` is not set, the default value is `false`.
        obfuscation-setting: |-
            Determines how slot values are used in Amazon CloudWatch logs. If the value of the `obfuscationSetting` parameter is `DefaultObfuscation`, slot values are obfuscated in the log output. If the value is `None`, the actual value is present in the log output.

            The default is to obfuscate values in the CloudWatch logs.
        slot-name: The name of the slot. Slot names must be unique within the bot that contains the slot.
        slot-type-id: The unique identifier for the slot type associated with this slot. The slot type determines the values that can be entered into the slot.
        sub-slot-setting: Specifications for the constituent sub slots and the expression for the composite slot.
        value-elicitation-setting: Specifies prompts that Amazon Lex sends to the user to elicit a response that provides the value for the slot.
