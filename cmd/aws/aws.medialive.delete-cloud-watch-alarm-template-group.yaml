name: delete-cloud-watch-alarm-template-group
description: Deletes a cloudwatch alarm template group.
flags:
    --identifier=!: A cloudwatch alarm template group's identifier.
documentation:
    command: Deletes a cloudwatch alarm template group. You must detach this group from all signal maps and ensure its existing templates are moved to another group or deleted.
    flag:
        identifier: A cloudwatch alarm template group's identifier. Can be either be its id or current name.
