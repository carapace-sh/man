name: list-tags-for-resource
description: Lists the tags associated with the specified resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource for which you want to list tags.
documentation:
    command: |-
        Lists the tags associated with the specified resource.

        This feature is currently available only for AgentCore Runtime, Browser, Code Interpreter tool, and Gateway.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource for which you want to list tags.
