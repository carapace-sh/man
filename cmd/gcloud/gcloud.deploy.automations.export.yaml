name: export
description: Returns the YAML definition of the specified Automation.
flags:
    --delivery-pipeline=: The delivery pipeline associated with the automation.
    --destination=: Path to a YAML file where the configuration will be exported.
    --region=: The Cloud region for the automation.
documentation:
    command: |-
        The exported yaml definition can be applied by using the `deploy apply`
        command.
    flag:
        delivery-pipeline: |-
            The delivery pipeline associated with the automation.  Alternatively, set the property [deploy/delivery-pipeline].
            +
            To set the `delivery-pipeline` attribute:
            * provide the argument `automation` on the command line with a fully specified name;
            * provide the argument `--delivery-pipeline` on the command line;
            * set the property `deploy/delivery_pipeline`.
        destination: |-
            Path to a YAML file where the configuration will be exported.
                      Alternatively, you may omit this flag to write to standard output.
        region: |-
            The Cloud region for the automation.  Alternatively, set the property [deploy/region].
            +
            To set the `region` attribute:
            * provide the argument `automation` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `deploy/region`.
