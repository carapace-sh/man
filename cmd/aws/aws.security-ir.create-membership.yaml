name: create-membership
description: Creates a new membership.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: The `clientToken` field is an idempotency key used to ensure that repeated attempts for a single action will be ignored by the server during retries.
    --cover-entire-organization: The `coverEntireOrganization` parameter is a boolean flag that determines whether the membership should be applied to the entire Amazon Web Services Organization.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --incident-response-team=!: Required element used in combination with CreateMembership to add customer incident response team members and trusted partners to the membership.
    --membership-name=!: Required element used in combination with CreateMembership to create a name for the membership.
    --no-cover-entire-organization: The `coverEntireOrganization` parameter is a boolean flag that determines whether the membership should be applied to the entire Amazon Web Services Organization.
    --opt-in-features=: Optional element to enable the monitoring and investigation opt-in features for the service.
    --tags=: Optional element for customer configured tags.
documentation:
    command: Creates a new membership.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: The `clientToken` field is an idempotency key used to ensure that repeated attempts for a single action will be ignored by the server during retries. A caller supplied unique ID (typically a UUID) should be provided.
        cover-entire-organization: |-
            The `coverEntireOrganization` parameter is a boolean flag that determines whether the membership should be applied to the entire Amazon Web Services Organization. When set to true, the membership will be created for all accounts within the organization. When set to false, the membership will only be created for specified accounts.

            This parameter is optional. If not specified, the default value is false.

            - If set to *true*: The membership will automatically include all existing and future accounts in the Amazon Web Services Organization.
            - If set to *false*: The membership will only apply to explicitly specified accounts.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        incident-response-team: Required element used in combination with CreateMembership to add customer incident response team members and trusted partners to the membership.
        membership-name: Required element used in combination with CreateMembership to create a name for the membership.
        opt-in-features: Optional element to enable the monitoring and investigation opt-in features for the service.
        tags: Optional element for customer configured tags.
