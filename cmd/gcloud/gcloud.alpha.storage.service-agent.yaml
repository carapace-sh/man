name: service-agent
description: '*(ALPHA)*  Manage a project''s Cloud Storage service agent, which is used to perform Cloud KMS operations.'
flags:
    --authorize-cmek=: Adds appropriate encrypt/decrypt permissions to the specified Cloud
documentation:
    command: |+
        *(ALPHA)*  *gcloud alpha storage service-agent* displays the Cloud Storage service agent, which is used to
        perform Cloud KMS operations against your a default or supplied project.
        If the project does not yet have a service agent, *gcloud alpha storage service-agent* creates one.

    flag:
        authorize-cmek: |-
            Adds appropriate encrypt/decrypt permissions to the specified Cloud
            KMS key. This allows the Cloud Storage service agent to write and
            read Cloud KMS-encrypted objects in buckets associated with the
            service agent's project.
