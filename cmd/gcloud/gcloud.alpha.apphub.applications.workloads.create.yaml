name: create
description: '*(ALPHA)*  Create an Apphub application workload.'
flags:
    --application=: Name for the application
    --async: Return immediately, without waiting for the operation in progress to complete.
    --business-owners=: Business owners of the workload
    --criticality-type=: Criticality Type of the workload.
    --description=: Description of the Workload
    --developer-owners=: Developer owners of the workload
    --discovered-workload=!: ID of the discoveredWorkload or fully qualified identifier for the discoveredWorkload.
    --display-name=: Human-friendly display name
    --environment-type=: Environment Type of the workload.
    --location=: The Cloud location for the workload.
    --no-async&: Return immediately, without waiting for the operation in progress to complete.
    --operator-owners=: Operator owners of the workload
completion:
    flag:
        criticality-type:
            - HIGH
            - LOW
            - MEDIUM
            - MISSION_CRITICAL
            - TYPE_UNSPECIFIED
        environment-type:
            - DEVELOPMENT
            - PRODUCTION
            - STAGING
            - TEST
            - TYPE_UNSPECIFIED
documentation:
    command: '*(ALPHA)*  Create an Apphub application workload.'
    flag:
        application: |-
            Name for the application
            +
            To set the `application` attribute:
            * provide the argument `WORKLOAD` on the command line with a fully specified name;
            * provide the argument `--application` on the command line.
        async: Return immediately, without waiting for the operation in progress to complete.
        business-owners: Business owners of the workload
        criticality-type: |-
            Criticality Type of the workload. _CRITICALITY_TYPE_ must be one of:
            +
            *HIGH*::: High impact
            *LOW*::: Low impact
            *MEDIUM*::: Medium impact
            *MISSION_CRITICAL*::: Mission critical service, application or workload
            *TYPE_UNSPECIFIED*::: Unspecified criticality type
            :::
            +
        description: Description of the Workload
        developer-owners: Developer owners of the workload
        discovered-workload: |-
            ID of the discoveredWorkload or fully qualified identifier for the discoveredWorkload.
            +
            To set the `discovered_workload` attribute:
            * provide the argument `--discovered-workload` on the command line.
        display-name: Human-friendly display name
        environment-type: |-
            Environment Type of the workload. _ENVIRONMENT_TYPE_ must be one of:
            +
            *DEVELOPMENT*::: Development environment
            *PRODUCTION*::: Production environment
            *STAGING*::: Staging environment
            *TEST*::: Test environment
            *TYPE_UNSPECIFIED*::: Unspecified environment type
            :::
            +
        location: |-
            The Cloud location for the workload.
            +
            To set the `location` attribute:
            * provide the argument `WORKLOAD` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: Return immediately, without waiting for the operation in progress to complete.
        operator-owners: Operator owners of the workload
