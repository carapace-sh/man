name: delete
description: Delete health checks.
flags:
    --global: If set, the  health checks are global.
    --no-global&: If set, the  health checks are global.
    --region=: Region of the  health checks to delete.
documentation:
    command: |
        *gcloud compute health-checks delete* deletes one or more Compute Engine
        health checks.
    flag:
        global: If set, the  health checks are global.
        no-global: If set, the  health checks are global.
        region: |-
            Region of the  health checks to delete. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
