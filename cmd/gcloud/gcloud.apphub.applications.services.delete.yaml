name: delete
description: Delete an Apphub application service.
flags:
    --application=: Name for the application
    --async: Return immediately, without waiting for the operation in progress to complete.
    --location=: The Cloud location for the service.
    --no-async&: Return immediately, without waiting for the operation in progress to complete.
documentation:
    command: Delete an Apphub application service.
    flag:
        application: |-
            Name for the application
            +
            To set the `application` attribute:
            * provide the argument `service` on the command line with a fully specified name;
            * provide the argument `--application` on the command line.
        async: Return immediately, without waiting for the operation in progress to complete.
        location: |-
            The Cloud location for the service.
            +
            To set the `location` attribute:
            * provide the argument `service` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: Return immediately, without waiting for the operation in progress to complete.
