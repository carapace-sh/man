name: get-document-content
description: Retrieves the content of a document that was ingested into Amazon Q Business.
flags:
    --application-id=!: The unique identifier of the Amazon Q Business application containing the document.
    --data-source-id=: The identifier of the data source from which the document was ingested.
    --document-id=!: The unique identifier of the document that is indexed via BatchPutDocument API or file-upload or connector sync.
    --index-id=!: The identifier of the index where documents are indexed.
    --output-format=: Document outputFormat.
completion:
    flag:
        output-format:
            - RAW
            - EXTRACTED
documentation:
    command: Retrieves the content of a document that was ingested into Amazon Q Business. This API validates user authorization against document ACLs before returning a pre-signed URL for secure document access. You can download or view source documents referenced in chat responses through the URL.
    flag:
        application-id: The unique identifier of the Amazon Q Business application containing the document. This ensures the request is scoped to the correct application environment and its associated security policies.
        data-source-id: The identifier of the data source from which the document was ingested. This field is not present if the document is ingested by directly calling the BatchPutDocument API. If the document is from a file-upload data source, the datasource will be "uploaded-docs-file-stat-datasourceid".
        document-id: The unique identifier of the document that is indexed via BatchPutDocument API or file-upload or connector sync. It is also found in chat or chatSync response.
        index-id: The identifier of the index where documents are indexed.
        output-format: Document outputFormat. Defaults to RAW if not selected.
