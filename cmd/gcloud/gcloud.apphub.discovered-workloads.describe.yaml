name: describe
description: Describe an Apphub discovered workload.
flags:
    --location=: The Cloud location for the discoveredWorkload.
documentation:
    command: Describe an Apphub discovered workload.
    flag:
        location: |-
            The Cloud location for the discoveredWorkload.
            +
            To set the `location` attribute:
            * provide the argument `discovered_workload` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
