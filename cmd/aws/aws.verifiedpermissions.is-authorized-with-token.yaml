name: is-authorized-with-token
description: Makes an authorization decision about a service request described in the parameters.
flags:
    --access-token=: Specifies an access token for the principal to be authorized.
    --action=: Specifies the requested action to be authorized.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --context=: Specifies additional context that can be used to make more granular authorization decisions.
    --entities=: (Optional) Specifies the list of resources and their associated attributes that Verified Permissions can examine when evaluating the policies.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --identity-token=: Specifies an identity token for the principal to be authorized.
    --policy-store-id=!: Specifies the ID of the policy store.
    --resource=: Specifies the resource for which the authorization decision is made.
documentation:
    command: |-
        Makes an authorization decision about a service request described in the parameters. The principal in this request comes from an external identity source in the form of an identity token formatted as a [JSON web token (JWT)](https://wikipedia.org/wiki/JSON_Web_Token). The information in the parameters can also define additional context that Verified Permissions can include in the evaluation. The request is evaluated against all matching policies in the specified policy store. The result of the decision is either `Allow` or `Deny`, along with a list of the policies that resulted in the decision.

        Verified Permissions validates each token that is specified in a request by checking its expiration date and its signature.

        Tokens from an identity source user continue to be usable until they expire. Token revocation and resource deletion have no effect on the validity of a token in your policy store
    flag:
        access-token: |-
            Specifies an access token for the principal to be authorized. This token is provided to you by the identity provider (IdP) associated with the specified identity source. You must specify either an `accessToken`, an `identityToken`, or both.

            Must be an access token. Verified Permissions returns an error if the `token_use` claim in the submitted token isn't `access`.
        action: Specifies the requested action to be authorized. Is the specified principal authorized to perform this action on the specified resource.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        context: Specifies additional context that can be used to make more granular authorization decisions.
        entities: |-
            (Optional) Specifies the list of resources and their associated attributes that Verified Permissions can examine when evaluating the policies. These additional entities and their attributes can be referenced and checked by conditional elements in the policies in the specified policy store.

            You can't include principals in this parameter, only resource and action entities. This parameter can't include any entities of a type that matches the user or group entity types that you defined in your identity source.

            - The `IsAuthorizedWithToken` operation takes principal attributes from ***only*** the `identityToken` or `accessToken` passed to the operation.
            - For action entities, you can include only their `Identifier` and `EntityType`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        identity-token: |-
            Specifies an identity token for the principal to be authorized. This token is provided to you by the identity provider (IdP) associated with the specified identity source. You must specify either an `accessToken`, an `identityToken`, or both.

            Must be an ID token. Verified Permissions returns an error if the `token_use` claim in the submitted token isn't `id`.
        policy-store-id: Specifies the ID of the policy store. Policies in this policy store will be used to make an authorization decision for the input.
        resource: Specifies the resource for which the authorization decision is made. For example, is the principal allowed to perform the action on the resource?
