name: update
description: Update the settings for the Cloud Logging Logs Router.
flags:
    --analytics-mode=&: Update the analytics mode for newly-created project buckets.
    --clear-kms-key: Disable CMEK for the Logs Router by clearing out Cloud KMS cryptokey in the organization's CMEK settings.
    --disable-default-sink: Enable or disable ```_Default``` sink for the ```_Default``` bucket.
    --folder=: Folder to update Logs Router settings for.
    --kms-key-name=!: ID of the key or fully qualified identifier for the key.
    --kms-keyring=: The KMS keyring of the key.
    --kms-location=: The Google Cloud location for the key.
    --kms-project=: The Google Cloud project for the key.
    --no-clear-kms-key&: Disable CMEK for the Logs Router by clearing out Cloud KMS cryptokey in the organization's CMEK settings.
    --no-disable-default-sink&: Enable or disable ```_Default``` sink for the ```_Default``` bucket.
    --organization=: Organization to update Logs Router settings for.
    --storage-location=: Update the storage location for ```_Default``` bucket and ```_Required``` bucket.
completion:
    flag:
        analytics-mode:
            - required
            - optional
            - unspecified
documentation:
    command: |-
        Use this command to update the *--kms-key-name, --storage-location,
        --disable-default-sink* and --analytics-mode associated with the Cloud Logging
        Logs Router.

        The Cloud KMS key must already exist and Cloud Logging must have
        permission to access it.

        The storage location must be allowed by Org Policy.

        Customer-managed encryption keys (CMEK) for the Logs Router can currently
        only be configured at the organization-level and will apply to all projects
        in the organization.

        ## EXAMPLES

        To enable CMEK for the Logs Router for an organization, run:

          $ gcloud logging settings update --organization=[ORGANIZATION_ID]
          --kms-key-name='projects/my-project/locations/my-location/keyRings/my-keyring/cryptoKeys/key'

        To disable CMEK for the Logs Router for an organization, run:

          $ gcloud logging settings update --organization=[ORGANIZATION_ID] --clear-kms-key

        To update storage location for the Logs Router for an organization, run:

          $ gcloud logging settings update --organization=[ORGANIZATION_ID]
          --storage-location=[LOCATION_ID]

        To update storage location for the Logs Router for a folder, run:

          $ gcloud logging settings update --folder=[FOLDER_ID] --storage-location=[LOCATION_ID]

        To disable default sink for the Logs Router for an organization, run:

          $ gcloud logging settings update --organization=[ORGANIZATION_ID] --disable-default-sink=true

        To enable default sink for the Logs Router for an organization, run:

          $ gcloud logging settings update --organization=[ORGANIZATION_ID] --disable-default-sink=false

        To enable analytics for the log buckets under an organization, run:

          $ gcloud logging settings update --organization=[ORGANIZATION_ID] --disable-default-sink=false
          --analytics-mode=required
    flag:
        analytics-mode: Update the analytics mode for newly-created project buckets. Changing this setting does not modify any existing buckets.
        clear-kms-key: Disable CMEK for the Logs Router by clearing out Cloud KMS cryptokey in the organization's CMEK settings.
        disable-default-sink: 'Enable or disable ```_Default``` sink for the ```_Default``` bucket. Specify --no-disable-default-sink to enable a disabled ```_Default``` sink. Note: It only applies to the newly created projects and will not affect the projects created before.'
        folder: Folder to update Logs Router settings for.
        kms-key-name: |-
            ID of the key or fully qualified identifier for the key.
            +
            To set the `kms-key` attribute:
            * provide the argument `--kms-key-name` on the command line.
        kms-keyring: |-
            The KMS keyring of the key.
            +
            To set the `kms-keyring` attribute:
            * provide the argument `--kms-key-name` on the command line with a fully specified name;
            * provide the argument `--kms-keyring` on the command line.
        kms-location: |-
            The Google Cloud location for the key.
            +
            To set the `kms-location` attribute:
            * provide the argument `--kms-key-name` on the command line with a fully specified name;
            * provide the argument `--kms-location` on the command line.
        kms-project: |-
            The Google Cloud project for the key.
            +
            To set the `kms-project` attribute:
            * provide the argument `--kms-key-name` on the command line with a fully specified name;
            * provide the argument `--kms-project` on the command line;
            * set the property `core/project`.
        no-clear-kms-key: Disable CMEK for the Logs Router by clearing out Cloud KMS cryptokey in the organization's CMEK settings.
        no-disable-default-sink: 'Enable or disable ```_Default``` sink for the ```_Default``` bucket. Specify --no-disable-default-sink to enable a disabled ```_Default``` sink. Note: It only applies to the newly created projects and will not affect the projects created before.'
        organization: Organization to update Logs Router settings for.
        storage-location: 'Update the storage location for ```_Default``` bucket and ```_Required``` bucket. Note: It only applies to the newly created projects and will not affect the projects created before.'
