name: list-multi-region-endpoints
description: List the multi-region endpoints (global-endpoints).
flags:
    --next-token=: A token returned from a previous call to `ListMultiRegionEndpoints` to indicate the position in the list of multi-region endpoints (global-endpoints).
    --page-size=: The number of results to show in a single call to `ListMultiRegionEndpoints`.
documentation:
    command: |-
        List the multi-region endpoints (global-endpoints).

        Only multi-region endpoints (global-endpoints) whose primary region is the AWS-Region where operation is executed will be listed.
    flag:
        next-token: A token returned from a previous call to `ListMultiRegionEndpoints` to indicate the position in the list of multi-region endpoints (global-endpoints).
        page-size: The number of results to show in a single call to `ListMultiRegionEndpoints`. If the number of results is larger than the number you specified in this parameter, the response includes a `NextToken` element that you can use to retrieve the next page of results.
