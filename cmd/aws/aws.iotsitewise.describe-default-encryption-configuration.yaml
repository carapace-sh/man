name: describe-default-encryption-configuration
description: Retrieves information about the default encryption configuration for the Amazon Web Services account in the default or specified Region.
documentation:
    command: Retrieves information about the default encryption configuration for the Amazon Web Services account in the default or specified Region. For more information, see [Key management](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/key-management.html) in the *IoT SiteWise User Guide*.
