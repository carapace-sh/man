name: update-automated-reasoning-policy-annotations
description: Updates the annotations for an Automated Reasoning policy build workflow.
flags:
    --annotations=!:
        description: The updated annotations containing modified rules, variables, and types for the policy.
        nargs: -1
    --build-workflow-id=!: The unique identifier of the build workflow whose annotations you want to update.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --last-updated-annotation-set-hash=!: The hash value of the annotation set that you're updating.
    --policy-arn=!: The Amazon Resource Name (ARN) of the Automated Reasoning policy whose annotations you want to update.
documentation:
    command: Updates the annotations for an Automated Reasoning policy build workflow. This allows you to modify extracted rules, variables, and types before finalizing the policy.
    flag:
        annotations: The updated annotations containing modified rules, variables, and types for the policy.
        build-workflow-id: The unique identifier of the build workflow whose annotations you want to update.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        last-updated-annotation-set-hash: The hash value of the annotation set that you're updating. This is used for optimistic concurrency control to prevent conflicting updates.
        policy-arn: The Amazon Resource Name (ARN) of the Automated Reasoning policy whose annotations you want to update.
