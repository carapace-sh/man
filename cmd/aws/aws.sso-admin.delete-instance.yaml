name: delete-instance
description: Deletes the instance of IAM Identity Center.
flags:
    --instance-arn=!: The ARN of the instance of IAM Identity Center under which the operation will run.
documentation:
    command: Deletes the instance of IAM Identity Center. Only the account that owns the instance can call this API. Neither the delegated administrator nor member account can delete the organization instance, but those roles can delete their own instance.
    flag:
        instance-arn: The ARN of the instance of IAM Identity Center under which the operation will run.
