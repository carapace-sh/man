name: create-service-action
description: Creates a self-service action.
flags:
    --accept-language=: The language code.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --definition-type=!: The service action definition type.
    --definition=!: The self-service action definition.
    --description=: The self-service action description.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --idempotency-token=!: A unique identifier that you provide to ensure idempotency.
    --name=!: The self-service action name.
completion:
    flag:
        definition-type:
            - SSM_AUTOMATION
documentation:
    command: Creates a self-service action.
    flag:
        accept-language: |-
            The language code.

            - `jp` - Japanese
            - `zh` - Chinese
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        definition: |-
            The self-service action definition. Can be one of the following:

            Name

            The name of the Amazon Web Services Systems Manager document (SSM document). For example, `AWS-RestartEC2Instance`.

            If you are using a shared SSM document, you must provide the ARN instead of the name.

            Version

            The Amazon Web Services Systems Manager automation document version. For example, `"Version": "1"`

            AssumeRole

            The Amazon Resource Name (ARN) of the role that performs the self-service actions on your behalf. For example, `"AssumeRole": "arn:aws:iam::12345678910:role/ActionRole"`.

            To reuse the provisioned product launch role, set to `"AssumeRole": "LAUNCH_ROLE"`.

            Parameters

            The list of parameters in JSON format.

            For example: `[{\"Name\":\"InstanceId\",\"Type\":\"TARGET\"}]` or `[{\"Name\":\"InstanceId\",\"Type\":\"TEXT_VALUE\"}]`.
        definition-type: The service action definition type. For example, `SSM_AUTOMATION`.
        description: The self-service action description.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        idempotency-token: A unique identifier that you provide to ensure idempotency. If multiple requests differ only by the idempotency token, the same response is returned for each repeated request.
        name: The self-service action name.
