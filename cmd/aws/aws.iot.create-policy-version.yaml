name: create-policy-version
description: Creates a new version of the specified IoT policy.
flags:
    --policy-document=!: The JSON document that describes the policy.
    --policy-name=!: The policy name.
    --set-as-default=: Specifies whether the policy version is set as the default.
documentation:
    command: |-
        Creates a new version of the specified IoT policy. To update a policy, create a new policy version. A managed policy can have up to five versions. If the policy has five versions, you must use [DeletePolicyVersion]() to delete an existing version before you create a new one.

        Optionally, you can set the new version as the policy's default version. The default version is the operative version (that is, the version that is in effect for the certificates to which the policy is attached).

        Requires permission to access the [CreatePolicyVersion](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        policy-document: The JSON document that describes the policy. Minimum length of 1. Maximum length of 2048, excluding whitespace.
        policy-name: The policy name.
        set-as-default: Specifies whether the policy version is set as the default. When this parameter is true, the new policy version becomes the operative version (that is, the version that is in effect for the certificates to which the policy is attached).
