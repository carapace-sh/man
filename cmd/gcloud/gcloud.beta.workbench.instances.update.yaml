name: update
description: '*(BETA)*  Updates a workbench instance.'
flags:
    --accelerator-core-count=: Count of cores of this accelerator.
    --accelerator-type=: Type of this accelerator.
    --async: Return immediately, without waiting for the operation in progress to
    --container-repository=!: The path to the container image repository.
    --container-tag=: The tag of the container image.
    --custom-gpu-driver-path=: custom gpu driver path
    --install-gpu-driver=: Install gpu driver
    --labels=: Labels to apply to this instance.
    --location=: Google Cloud location of this environment https://cloud.google.com/compute/docs/regions-zones/#locations.
    --machine-type=: The [Compute Engine machine type](https://cloud.google.com/sdk/gcloud/reference/compute/machine-types) of this instance.
    --metadata=: Custom metadata to apply to this instance.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --shielded-integrity-monitoring=: Boolean.
    --shielded-secure-boot=: Boolean.
    --shielded-vtpm=: Boolean.
    --tags=: Tags to apply to this instance.
completion:
    flag:
        accelerator-type:
            - NVIDIA_TESLA_K80
            - NVIDIA_TESLA_P100
            - NVIDIA_TESLA_V100
            - NVIDIA_TESLA_P4
            - NVIDIA_TESLA_T4
            - NVIDIA_TESLA_A100
            - NVIDIA_A100_80GB
            - NVIDIA_TESLA_T4_VWS
            - NVIDIA_TESLA_P100_VWS
            - NVIDIA_TESLA_P4_VWS
            - NVIDIA_L4
            - NVIDIA_H100_80GB
            - NVIDIA_H100_MEGA_80GB
documentation:
    command: |
        *(BETA)*  Updates a workbench instance.
    flag:
        accelerator-core-count: Count of cores of this accelerator.
        accelerator-type: 'Type of this accelerator. _ACCELERATOR_TYPE_ must be one of: *NVIDIA_TESLA_K80*, *NVIDIA_TESLA_P100*, *NVIDIA_TESLA_V100*, *NVIDIA_TESLA_P4*, *NVIDIA_TESLA_T4*, *NVIDIA_TESLA_A100*, *NVIDIA_A100_80GB*, *NVIDIA_TESLA_T4_VWS*, *NVIDIA_TESLA_P100_VWS*, *NVIDIA_TESLA_P4_VWS*, *NVIDIA_L4*, *NVIDIA_H100_80GB*, *NVIDIA_H100_MEGA_80GB*.'
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        container-repository: 'The path to the container image repository. For example: gcr.io/`{project_id}`/`{image_name}`.'
        container-tag: The tag of the container image. If not specified, this defaults to the latest tag.
        custom-gpu-driver-path: custom gpu driver path
        install-gpu-driver: Install gpu driver
        labels: Labels to apply to this instance. These can be later modified by the setLabels method.
        location: |-
            Google Cloud location of this environment https://cloud.google.com/compute/docs/regions-zones/#locations.
            +
            To set the `location` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `notebooks/location`.
        machine-type: The [Compute Engine machine type](https://cloud.google.com/sdk/gcloud/reference/compute/machine-types) of this instance.
        metadata: Custom metadata to apply to this instance.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        shielded-integrity-monitoring: 'Boolean. Enable monitoring of the boot integrity of the instance. Supported values: `true`, `false`.'
        shielded-secure-boot: 'Boolean. Boot instance with secure boot enabled. Supported values: `true`, `false`.'
        shielded-vtpm: 'Boolean. Boot instance with TPM (Trusted Platform Module) enabled. Supported values: `true`, `false`.'
        tags: Tags to apply to this instance.
