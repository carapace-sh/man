name: describe
description: '*(BETA)*  Show details about a specific API config.'
flags:
    --api=: API ID.
    --view=: The API Configuration view to return.
completion:
    flag:
        view:
            - BASIC
            - FULL
documentation:
    command: '*(BETA)*  Show details about a specific API config.'
    flag:
        api: |-
            API ID.
            +
            To set the `api` attribute:
            * provide the argument `api_config` on the command line with a fully specified name;
            * provide the argument `--api` on the command line.
        view: 'The API Configuration view to return. If       ''FULL'' is specified, the base64 encoded API Configuration''s source file       conent will be included in the response. _VIEW_ must be one of: *BASIC*, *FULL*.'
