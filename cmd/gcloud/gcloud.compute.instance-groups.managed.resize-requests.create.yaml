name: create
description: Create a Compute Engine managed instance group resize request.
flags:
    --requested-run-duration=: The time you need the requested VMs to run before being
    --resize-by=!: The number of VMs to resize managed instance group by.
    --resize-request=!: The name of the resize request to create.
    --zone=: Zone of the managed instance group to operate on.
documentation:
    command: Create a Compute Engine managed instance group resize request.
    flag:
        requested-run-duration: |-
            The time you need the requested VMs to run before being
                    automatically deleted. The value must be formatted as the number of
                    days, hours, minutes, or seconds followed by `d`, `h`, `m`, and `s`
                    respectively. For example, specify `30m` for a duration of 30
                    minutes or `1d2h3m4s` for 1 day, 2 hours, 3 minutes, and 4 seconds.
                    The value must be between `10m` (10 minutes) and `7d` (7 days).
            +
                    If you want the managed instance group to consume a reservation or use
                    FLEX_START provisioning model, then this flag is optional. Otherwise,
                    it's required.
        resize-by: The number of VMs to resize managed instance group by.
        resize-request: The name of the resize request to create.
        zone: |-
            Zone of the managed instance group to operate on. If not specified and the ``compute/zone'' property isn't set, you
            might be prompted to select a zone (interactive mode only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
