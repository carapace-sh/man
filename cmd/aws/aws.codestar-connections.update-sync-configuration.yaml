name: update-sync-configuration
description: Updates the sync configuration for your connection and a specified external Git repository.
flags:
    --branch=: The branch for the sync configuration to be updated.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --config-file=: The configuration file for the sync configuration to be updated.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --publish-deployment-status=: Whether to enable or disable publishing of deployment status to source providers.
    --repository-link-id=: The ID of the repository link for the sync configuration to be updated.
    --resource-name=!: The name of the Amazon Web Services resource for the sync configuration to be updated.
    --role-arn=: The ARN of the IAM role for the sync configuration to be updated.
    --sync-type=!: The sync type for the sync configuration to be updated.
    --trigger-resource-update-on=: When to trigger Git sync to begin the stack update.
completion:
    flag:
        publish-deployment-status:
            - ENABLED
            - DISABLED
        sync-type:
            - CFN_STACK_SYNC
        trigger-resource-update-on:
            - ANY_CHANGE
            - FILE_CHANGE
documentation:
    command: Updates the sync configuration for your connection and a specified external Git repository.
    flag:
        branch: The branch for the sync configuration to be updated.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        config-file: The configuration file for the sync configuration to be updated.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        publish-deployment-status: Whether to enable or disable publishing of deployment status to source providers.
        repository-link-id: The ID of the repository link for the sync configuration to be updated.
        resource-name: The name of the Amazon Web Services resource for the sync configuration to be updated.
        role-arn: The ARN of the IAM role for the sync configuration to be updated.
        sync-type: The sync type for the sync configuration to be updated.
        trigger-resource-update-on: When to trigger Git sync to begin the stack update.
