name: delete-workspace
description: Deletes an existing workspace.
flags:
    --client-token=: A unique identifier that you can provide to ensure the idempotency of the request.
    --workspace-id=!: The ID of the workspace to delete.
documentation:
    command: |-
        Deletes an existing workspace.

        When you delete a workspace, the data that has been ingested into it is not immediately deleted. It will be permanently deleted within one month.
    flag:
        client-token: A unique identifier that you can provide to ensure the idempotency of the request. Case-sensitive.
        workspace-id: The ID of the workspace to delete.
