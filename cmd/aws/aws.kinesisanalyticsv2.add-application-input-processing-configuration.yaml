name: add-application-input-processing-configuration
description: Adds an [InputProcessingConfiguration]() to a SQL-based Kinesis Data Analytics application.
flags:
    --application-name=!: The name of the application to which you want to add the input processing configuration.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --current-application-version-id=!: The version of the application to which you want to add the input processing configuration.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --input-id=!: The ID of the input configuration to add the input processing configuration to.
    --input-processing-configuration=!: The [InputProcessingConfiguration]() to add to the application.
documentation:
    command: Adds an [InputProcessingConfiguration]() to a SQL-based Kinesis Data Analytics application. An input processor pre-processes records on the input stream before the application's SQL code executes. Currently, the only input processor available is [Amazon Lambda](https://docs.aws.amazon.com/lambda/).
    flag:
        application-name: The name of the application to which you want to add the input processing configuration.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        current-application-version-id: The version of the application to which you want to add the input processing configuration. You can use the [DescribeApplication]() operation to get the current application version. If the version specified is not the current version, the `ConcurrentModificationException` is returned.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        input-id: The ID of the input configuration to add the input processing configuration to. You can get a list of the input IDs for an application using the [DescribeApplication]() operation.
        input-processing-configuration: The [InputProcessingConfiguration]() to add to the application.
