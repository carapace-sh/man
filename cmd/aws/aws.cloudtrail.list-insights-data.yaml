name: list-insights-data
description: Returns Insights events generated on a trail that logs data events.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --data-type=!: Specifies the category of events returned.
    --dimensions=: Contains a map of dimensions.
    --end-time=: Specifies that only events that occur before or at the specified time are returned.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --insight-source=!: The Amazon Resource Name(ARN) of the trail for which you want to retrieve Insights events.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The number of events to return.
    --next-token=: The token to use to get the next page of results after a previous API call.
    --page-size=: The size of each page to get in the AWS service call.
    --start-time=: Specifies that only events that occur after or at the specified time are returned.
    --starting-token=: A token to specify where to start paginating.
completion:
    flag:
        data-type:
            - InsightsEvents
documentation:
    command: |-
        Returns Insights events generated on a trail that logs data events. You can list Insights events that occurred in a Region within the last 90 days.

        ListInsightsData supports the following Dimensions for Insights events:

        - Event ID
        - Event name
        - Event source

        All dimensions are optional. The default number of results returned is 50, with a maximum of 50 possible. The response includes a token that you can use to get the next page of results.

        The rate of ListInsightsData requests is limited to two per second, per account, per Region. If this limit is exceeded, a throttling error occurs.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        data-type: Specifies the category of events returned. To fetch Insights events, specify `InsightsEvents` as the value of `DataType`
        dimensions: Contains a map of dimensions. Currently the map can contain only one item.
        end-time: Specifies that only events that occur before or at the specified time are returned. If the specified end time is before the specified start time, an error is returned.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        insight-source: The Amazon Resource Name(ARN) of the trail for which you want to retrieve Insights events.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The number of events to return. Possible values are 1 through 50. The default is 50.
        next-token: The token to use to get the next page of results after a previous API call. This token must be passed in with the same parameters that were specified in the original call. For example, if the original call specified a EventName as a dimension with `PutObject` as a value, the call with NextToken should include those same parameters.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        start-time: Specifies that only events that occur after or at the specified time are returned. If the specified start time is after the specified end time, an error is returned.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
