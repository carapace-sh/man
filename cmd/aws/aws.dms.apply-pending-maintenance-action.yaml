name: apply-pending-maintenance-action
description: Applies a pending maintenance action to a resource (for example, to a replication instance).
flags:
    --apply-action=!: The pending maintenance action to apply to this resource.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --opt-in-type=!: A value that specifies the type of opt-in request, or undoes an opt-in request.
    --replication-instance-arn=!: The Amazon Resource Name (ARN) of the DMS resource that the pending maintenance action applies to.
documentation:
    command: Applies a pending maintenance action to a resource (for example, to a replication instance).
    flag:
        apply-action: |-
            The pending maintenance action to apply to this resource.

            Valid values: `os-upgrade`, `system-update`, `db-upgrade`, `os-patch`
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        opt-in-type: |-
            A value that specifies the type of opt-in request, or undoes an opt-in request. You can't undo an opt-in request of type `immediate`.

            Valid values:

            - `immediate` - Apply the maintenance action immediately.
            - `next-maintenance` - Apply the maintenance action during the next maintenance window for the resource.
            - `undo-opt-in` - Cancel any existing `next-maintenance` opt-in requests.
        replication-instance-arn: The Amazon Resource Name (ARN) of the DMS resource that the pending maintenance action applies to.
