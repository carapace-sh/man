name: delete-user-defined-function
description: Deletes an existing function definition from the Data Catalog.
flags:
    --catalog-id=: The ID of the Data Catalog where the function to be deleted is located.
    --database-name=!: The name of the catalog database where the function is located.
    --function-name=!: The name of the function definition to be deleted.
documentation:
    command: Deletes an existing function definition from the Data Catalog.
    flag:
        catalog-id: The ID of the Data Catalog where the function to be deleted is located. If none is supplied, the Amazon Web Services account ID is used by default.
        database-name: The name of the catalog database where the function is located.
        function-name: The name of the function definition to be deleted.
