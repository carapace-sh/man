name: describe
description: '*(BETA)*  Get description of a long-running video analysis operation.'
flags:
    --location=: Location of the operation.
documentation:
    command: |
        *(BETA)*  Get information about a long-running video analysis operation.
    flag:
        location: |-
            Location of the operation.
            +
            To set the `location` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
