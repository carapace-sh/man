name: channel-flow-callback
description: Calls back Amazon Chime SDK messaging with a processing response message.
flags:
    --callback-id=!: The identifier passed to the processor by the service when invoked.
    --channel-arn=!: The ARN of the channel.
    --channel-message=!: Stores information about the processed message.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --delete-resource: When a processor determines that a message needs to be `DENIED`, pass this parameter with a value of true.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-delete-resource: When a processor determines that a message needs to be `DENIED`, pass this parameter with a value of true.
documentation:
    command: |-
        Calls back Amazon Chime SDK messaging with a processing response message. This should be invoked from the processor Lambda. This is a developer API.

        You can return one of the following processing responses:

        - Update message content or metadata
        - Deny a message
        - Make no changes to the message
    flag:
        callback-id: The identifier passed to the processor by the service when invoked. Use the identifier to call back the service.
        channel-arn: The ARN of the channel.
        channel-message: Stores information about the processed message.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        delete-resource: When a processor determines that a message needs to be `DENIED`, pass this parameter with a value of true.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
