name: create-tags
description: DEPRECATED - `CreateTags` is deprecated and not maintained.
flags:
    --file-system-id=!: The ID of the file system whose tags you want to modify (String).
    --tags=!: An array of `Tag` objects to add.
documentation:
    command: |-
        DEPRECATED - `CreateTags` is deprecated and not maintained. To create tags for EFS resources, use the API action.

        Creates or overwrites tags associated with a file system. Each tag is a key-value pair. If a tag key specified in the request already exists on the file system, this operation overwrites its value with the value provided in the request. If you add the `Name` tag to your file system, Amazon EFS returns it in the response to the [DescribeFileSystems]() operation.

        This operation requires permission for the `elasticfilesystem:CreateTags` action.
    flag:
        file-system-id: The ID of the file system whose tags you want to modify (String). This operation modifies the tags only, not the file system.
        tags: An array of `Tag` objects to add. Each `Tag` object is a key-value pair.
