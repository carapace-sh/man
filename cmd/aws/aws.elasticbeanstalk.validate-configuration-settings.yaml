name: validate-configuration-settings
description: Takes a set of configuration settings and either a configuration template or environment, and determines whether those values are valid.
flags:
    --application-name=!: The name of the application that the configuration template or environment belongs to.
    --environment-name=: The name of the environment to validate the settings against.
    --option-settings=!: A list of the options and desired values to evaluate.
    --template-name=: The name of the configuration template to validate the settings against.
documentation:
    command: |-
        Takes a set of configuration settings and either a configuration template or environment, and determines whether those values are valid.

        This action returns a list of messages indicating any errors or warnings associated with the selection of option values.
    flag:
        application-name: The name of the application that the configuration template or environment belongs to.
        environment-name: |-
            The name of the environment to validate the settings against.

            Condition: You cannot specify both this and a configuration template name.
        option-settings: A list of the options and desired values to evaluate.
        template-name: |-
            The name of the configuration template to validate the settings against.

            Condition: You cannot specify both this and an environment name.
