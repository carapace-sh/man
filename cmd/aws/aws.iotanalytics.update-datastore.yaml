name: update-datastore
description: Used to update the settings of a data store.
flags:
    --datastore-name=!: The name of the data store to be updated.
    --datastore-storage=: Where data in a data store is stored.. You can choose `serviceManagedS3` storage, `customerManagedS3` storage, or `iotSiteWiseMultiLayerStorage` storage.
    --file-format-configuration=: Contains the configuration information of file formats.
    --retention-period=: How long, in days, message data is kept for the data store.
documentation:
    command: Used to update the settings of a data store.
    flag:
        datastore-name: The name of the data store to be updated.
        datastore-storage: Where data in a data store is stored.. You can choose `serviceManagedS3` storage, `customerManagedS3` storage, or `iotSiteWiseMultiLayerStorage` storage. The default is `serviceManagedS3`. You can't change the choice of Amazon S3 storage after your data store is created.
        file-format-configuration: |-
            Contains the configuration information of file formats. IoT Analytics data stores support JSON and [Parquet](https://parquet.apache.org/).

            The default file format is JSON. You can specify only one format.

            You can't change the file format after you create the data store.
        retention-period: How long, in days, message data is kept for the data store. The retention period can't be updated if the data store's Amazon S3 storage is customer-managed.
