name: delete
description: '*(BETA)*  Delete a Security Profile.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Location ID of the resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --organization=: Organization number.
documentation:
    command: |
        *(BETA)*  Delete the specified Security Profile.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            Location ID of the resource.
            +

            To set the `location` attribute:
            * provide the argument `security_profile` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * use default global location
            .
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        organization: |-
            Organization number.
            +

            To set the `organization` attribute:
            * provide the argument `security_profile` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
