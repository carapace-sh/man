name: add
description: '*(ALPHA)*  Add split points to a  Spanner database.'
flags:
    --initiator=: The tag to identify the initiator of the split points.
    --instance=: The Cloud Spanner instance for the database.
    --split-expiration-date=: The date when the split points become system managed and becomes eligible for merging.
    --splits-file=!: The path of a file containing split points to add to the database.
documentation:
    command: '*(ALPHA)*  Add split points to a  Spanner database.'
    flag:
        initiator: The tag to identify the initiator of the split points.
        instance: |-
            The Cloud Spanner instance for the database.
            +
            To set the `instance` attribute:
            * provide the argument `database` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line;
            * set the property `spanner/instance`.
        split-expiration-date: The date when the split points become system managed and becomes eligible for merging. The default is 10 days from the date of creation. The maximum is 30 days from the date of creation.
        splits-file: The path of a file containing split points to add to the database. Separate split points in the file with a new line. The file format is <ObjectType>[space]<ObjectName>[space]<Split Value>, where the ObjectType is one of TABLE or INDEX and the Split Value is the split point key. For index, the split point key is the index key with or without a full table key prefix.
