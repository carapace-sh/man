    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --global-replication-group-id=!: The name of the Global datastore
    --no-apply-immediately!: Indicates that the process begins immediately.
    --node-group-count=!: Total number of node groups you want
    --regional-configurations=:
        description: Describes the replication group IDs, the Amazon regions where they are stored and the shard configuration for each that comprise the Global datastore
        nargs: -1
