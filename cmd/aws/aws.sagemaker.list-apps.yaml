name: list-apps
description: Lists apps.
flags:
    --domain-id-equals=: A parameter to search for the domain ID.
    --max-results=: This parameter defines the maximum number of results that can be return in a single response.
    --next-token=: If the previous response was truncated, you will receive this token.
    --sort-by=: The parameter by which to sort the results.
    --sort-order=: The sort order for the results.
    --space-name-equals=: A parameter to search by space name.
    --user-profile-name-equals=: A parameter to search by user profile name.
completion:
    flag:
        sort-by:
            - CreationTime
        sort-order:
            - Ascending
            - Descending
documentation:
    command: Lists apps.
    flag:
        domain-id-equals: A parameter to search for the domain ID.
        max-results: This parameter defines the maximum number of results that can be return in a single response. The `MaxResults` parameter is an upper bound, not a target. If there are more results available than the value specified, a `NextToken` is provided in the response. The `NextToken` indicates that the user should get the next set of results by providing this token as a part of a subsequent call. The default value for `MaxResults` is 10.
        next-token: If the previous response was truncated, you will receive this token. Use it in your next request to receive the next set of results.
        sort-by: The parameter by which to sort the results. The default is CreationTime.
        sort-order: The sort order for the results. The default is Ascending.
        space-name-equals: A parameter to search by space name. If `UserProfileNameEquals` is set, then this value cannot be set.
        user-profile-name-equals: A parameter to search by user profile name. If `SpaceNameEquals` is set, then this value cannot be set.
