        --group-id=!: The ID of the security group to which the bot will be assigned.
        --network-id=!: The ID of the Wickr network where the bot will be created.
        --username=!: The username for the bot.
      documentation:
        command: Creates a new bot in a specified Wickr network. Bots are automated accounts that can send and receive messages, enabling integration with external systems and automation of tasks.
