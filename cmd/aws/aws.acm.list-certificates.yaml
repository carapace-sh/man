name: list-certificates
description: Retrieves a list of certificate ARNs and domain names.
flags:
    --certificate-statuses=: Filter the certificate list by status value.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --includes=: Filter the certificate list.
    --max-items=: Use this parameter when paginating results to specify the maximum number of items to return in the response.
    --next-token=: Use this parameter only when paginating results and only in a subsequent request after you receive a response with truncated results.
    --page-size=: The size of each page to get in the AWS service call.
    --sort-by=: Specifies the field to sort results by.
    --sort-order=: Specifies the order of sorted results.
    --starting-token=: A token to specify where to start paginating.
completion:
    flag:
        sort-by:
            - CREATED_AT
        sort-order:
            - ASCENDING
            - DESCENDING
documentation:
    command: Retrieves a list of certificate ARNs and domain names. You can request that only certificates that match a specific status be listed. You can also filter by specific attributes of the certificate. Default filtering returns only `RSA_2048` certificates. For more information, see [Filters]().
    flag:
        certificate-statuses: Filter the certificate list by status value.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        includes: Filter the certificate list. For more information, see the [Filters]() structure.
        max-items: Use this parameter when paginating results to specify the maximum number of items to return in the response. If additional items exist beyond the number you specify, the `NextToken` element is sent in the response. Use this `NextToken` value in a subsequent request to retrieve additional items.
        next-token: Use this parameter only when paginating results and only in a subsequent request after you receive a response with truncated results. Set it to the value of `NextToken` from the response you just received.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        sort-by: Specifies the field to sort results by. If you specify `SortBy`, you must also specify `SortOrder`.
        sort-order: Specifies the order of sorted results. If you specify `SortOrder`, you must also specify `SortBy`.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
