name: get-service-level-objective
description: Returns information about one SLO created in the account.
flags:
    --id=!: The ARN or name of the SLO that you want to retrieve information about.
documentation:
    command: Returns information about one SLO created in the account.
    flag:
        id: The ARN or name of the SLO that you want to retrieve information about. You can find the ARNs of SLOs by using the [ListServiceLevelObjectives](https://docs.aws.amazon.com/AmazonCloudWatch/latest/APIReference/API_ListServiceLevelObjectives.html) operation.
