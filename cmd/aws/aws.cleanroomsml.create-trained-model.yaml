name: create-trained-model
description: Creates a trained model from an associated configured model algorithm using data from any member of the collaboration.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configured-model-algorithm-association-arn=!: The associated configured model algorithm used to train this model.
    --data-channels=!:
        description: Defines the data channels that are used as input for the trained model request.
        nargs: -1
    --description=: The description of the trained model.
    --environment=: The environment variables to set in the Docker container.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --hyperparameters=: Algorithm-specific parameters that influence the quality of the model.
    --incremental-training-data-channels=:
        description: Specifies the incremental training data channels for the trained model.
        nargs: -1
    --kms-key-arn=: The Amazon Resource Name (ARN) of the KMS key.
    --membership-identifier=!: The membership ID of the member that is creating the trained model.
    --name=!: The name of the trained model.
    --resource-config=!: Information about the EC2 resources that are used to train this model.
    --stopping-condition=: The criteria that is used to stop model training.
    --tags=: The optional metadata that you apply to the resource to help you categorize and organize them.
    --training-input-mode=: The input mode for accessing the training data.
completion:
    flag:
        training-input-mode:
            - File
            - FastFile
            - Pipe
documentation:
    command: Creates a trained model from an associated configured model algorithm using data from any member of the collaboration.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        configured-model-algorithm-association-arn: The associated configured model algorithm used to train this model.
        data-channels: |-
            Defines the data channels that are used as input for the trained model request.

            Limit: Maximum of 20 channels total (including both `dataChannels` and `incrementalTrainingDataChannels`).
        description: The description of the trained model.
        environment: The environment variables to set in the Docker container.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        hyperparameters: Algorithm-specific parameters that influence the quality of the model. You set hyperparameters before you start the learning process.
        incremental-training-data-channels: |-
            Specifies the incremental training data channels for the trained model.

            Incremental training allows you to create a new trained model with updates without retraining from scratch. You can specify up to one incremental training data channel that references a previously trained model and its version.

            Limit: Maximum of 20 channels total (including both `incrementalTrainingDataChannels` and `dataChannels`).
        kms-key-arn: The Amazon Resource Name (ARN) of the KMS key. This key is used to encrypt and decrypt customer-owned data in the trained ML model and the associated data.
        membership-identifier: The membership ID of the member that is creating the trained model.
        name: The name of the trained model.
        resource-config: Information about the EC2 resources that are used to train this model.
        stopping-condition: The criteria that is used to stop model training.
        tags: |-
            The optional metadata that you apply to the resource to help you categorize and organize them. Each tag consists of a key and an optional value, both of which you define.

            The following basic restrictions apply to tags:

            - Maximum number of tags per resource - 50.
            - For each resource, each tag key must be unique, and each tag key can have only one value.
            - Maximum key length - 128 Unicode characters in UTF-8.
            - Maximum value length - 256 Unicode characters in UTF-8.
            - If your tagging schema is used across multiple services and resources, remember that other services may have restrictions on allowed characters. Generally allowed characters are: letters, numbers, and spaces representable in UTF-8, and the following characters: + - = . _ : / @.
            - Tag keys and values are case sensitive.
            - Do not use aws:, AWS:, or any upper or lowercase combination of such as a prefix for keys as it is reserved for AWS use. You cannot edit or delete tag keys with this prefix. Values can have this prefix. If a tag value has aws as its prefix but the key does not, then Clean Rooms ML considers it to be a user tag and will count against the limit of 50 tags. Tags with only the key prefix of aws do not count against your tags per resource limit.
        training-input-mode: |-
            The input mode for accessing the training data. This parameter determines how the training data is made available to the training algorithm. Valid values are:

            - `File` - The training data is downloaded to the training instance and made available as files.
            - `FastFile` - The training data is streamed directly from Amazon S3 to the training algorithm, providing faster access for large datasets.
            - `Pipe` - The training data is streamed to the training algorithm using named pipes, which can improve performance for certain algorithms.
