name: associate-approval-rule-template-with-repository
description: Creates an association between an approval rule template and a specified repository.
flags:
    --approval-rule-template-name=!: The name for the approval rule template.
    --repository-name=!: The name of the repository that you want to associate with the template.
documentation:
    command: Creates an association between an approval rule template and a specified repository. Then, the next time a pull request is created in the repository where the destination reference (if specified) matches the destination reference (branch) for the pull request, an approval rule that matches the template conditions is automatically created for that pull request. If no destination references are specified in the template, an approval rule that matches the template contents is created for all pull requests in that repository.
    flag:
        approval-rule-template-name: The name for the approval rule template.
        repository-name: The name of the repository that you want to associate with the template.
