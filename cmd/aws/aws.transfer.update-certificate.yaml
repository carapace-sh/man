name: update-certificate
description: Updates the active and inactive dates for a certificate.
flags:
    --active-date=: An optional date that specifies when the certificate becomes active.
    --certificate-id=!: The identifier of the certificate object that you are updating.
    --description=: A short description to help identify the certificate.
    --inactive-date=: An optional date that specifies when the certificate becomes inactive.
documentation:
    command: Updates the active and inactive dates for a certificate.
    flag:
        active-date: An optional date that specifies when the certificate becomes active. If you do not specify a value, `ActiveDate` takes the same value as `NotBeforeDate`, which is specified by the CA.
        certificate-id: The identifier of the certificate object that you are updating.
        description: A short description to help identify the certificate.
        inactive-date: An optional date that specifies when the certificate becomes inactive. If you do not specify a value, `InactiveDate` takes the same value as `NotAfterDate`, which is specified by the CA.
