name: update
description: '*(BETA)*  Update RbacRoleBinding Actuation Feature.'
flags:
    --add-allowed-custom-role=: Add a single custom role to the allowed custom roles list.
    --allowed-custom-roles=: The list of allowed custom roles that can be used in scope
    --remove-allowed-custom-role=: Remove a single custom role from the allowed custom roles list.
documentation:
    command: |-
        *(BETA)*  This command updates RbacRoleBinding Actuation Feature in a fleet.

        ## EXAMPLES

        To update the RbacRoleBinding Actuation Feature, run:

          $ gcloud container fleet rbacrolebinding-actuation update \
              --allowed-custom-roles=role1,role2

          $ gcloud container fleet rbacrolebinding-actuation update \
              --add-allowed-custom-role=role1

          $ gcloud container fleet rbacrolebinding-actuation update \
              --remove-allowed-custom-role=role2
    flag:
        add-allowed-custom-role: Add a single custom role to the allowed custom roles list.
        allowed-custom-roles: |-
            The list of allowed custom roles that can be used in scope
            RBACRoleBindings.
        remove-allowed-custom-role: Remove a single custom role from the allowed custom roles list.
