name: create
description: Create a Dataplex lake resource.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: Description of the lake.
    --display-name=: Display name of the lake.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location of the Dataplex resource.
    --metastore-service=: A relative reference to the Dataproc Metastore
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-validate-only&: Validate the create action, but don't actually perform it.
    --validate-only: Validate the create action, but don't actually perform it.
documentation:
    command: |-
        A lake is a centralized repository for managing data across the
        organization, where enterprise data is distributed across many cloud projects,
        and stored in a variety of storage services, such as Google Cloud Storage and
        BigQuery. A lake provides data admins with tools to organize, secure and
        manage their data at scale, and provides data scientists and data engineers an
        integrated experience to easily search, discover, analyze and transform data
        and associated metadata.

        The Lake ID will be used to generate names such as database and dataset names
        when publishing metadata to Hive Metastore and BigQuery.
        The Lake id must follow these rules:
         * Must contain only lowercase letters, numbers, and hyphens.
         * Must start with a letter.
         * Must end with a number or a letter.
         * Must be between 1-63 characters.
         * Must be unique within the customer project / location.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: Description of the lake.
        display-name: Display name of the lake.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location of the Dataplex resource.
            +
            To set the `location` attribute:
            * provide the argument `lake` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
        metastore-service: |-
            A relative reference to the Dataproc Metastore
                   (https://cloud.google.com/dataproc-metastore/docs) service instance into
                   which metadata will be published. This is of the form:
                   `projects/{project_number}/locations/{location_id}/services/{service_id}`
                   where the location matches the location of the lake.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-validate-only: Validate the create action, but don't actually perform it.
        validate-only: Validate the create action, but don't actually perform it.
