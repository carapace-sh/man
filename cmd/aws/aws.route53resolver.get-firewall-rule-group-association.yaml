name: get-firewall-rule-group-association
description: Retrieves a firewall rule group association, which enables DNS filtering for a VPC with one rule group.
flags:
    --firewall-rule-group-association-id=!: The identifier of the [FirewallRuleGroupAssociation]().
documentation:
    command: Retrieves a firewall rule group association, which enables DNS filtering for a VPC with one rule group. A VPC can have more than one firewall rule group association, and a rule group can be associated with more than one VPC.
    flag:
        firewall-rule-group-association-id: The identifier of the [FirewallRuleGroupAssociation]().
