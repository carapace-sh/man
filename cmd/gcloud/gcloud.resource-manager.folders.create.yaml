name: create
description: Create a new folder.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --display-name=!: Friendly display name to use for the new folder.
    --folder=: ID for the folder to use as a parent
    --no-async&: Return immediately, without waiting for the operation in progress to
    --organization=: ID for the organization to use as a parent
    --tags=: List of tags KEY=VALUE pairs to bind.
documentation:
    command: |-
        Creates a new folder in the given parent folder or organization.

        ## EXAMPLES

        The following command creates a folder with the name `abc` into a
        folder with the ID `2345`:

          $ gcloud resource-manager folders create --display-name=abc --folder=2345

        The following command creates a folder with the name `abc` into an
        organization with ID `1234`:

          $ gcloud resource-manager folders create --display-name=abc --organization=1234
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        display-name: Friendly display name to use for the new folder.
        folder: ID for the folder to use as a parent
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        organization: ID for the organization to use as a parent
        tags: |-
            List of tags KEY=VALUE pairs to bind.
            Each item must be expressed as
            `<tag-key-namespaced-name>=<tag-value-short-name>`.
            +
            Example: `123/environment=production,123/costCenter=marketing`
            +
            Note: Currently this field is in Preview.
