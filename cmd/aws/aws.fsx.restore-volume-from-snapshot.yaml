name: restore-volume-from-snapshot
description: Returns an Amazon FSx for OpenZFS volume to the state saved by the specified snapshot.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=: ""
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --options=:
        description: The settings used when restoring the specified volume from snapshot.
        nargs: -1
    --snapshot-id=!: The ID of the source snapshot.
    --volume-id=!: The ID of the volume that you are restoring.
documentation:
    command: Returns an Amazon FSx for OpenZFS volume to the state saved by the specified snapshot.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: ""
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        options: |-
            The settings used when restoring the specified volume from snapshot.

            - `DELETE_INTERMEDIATE_SNAPSHOTS` - Deletes snapshots between the current state and the specified snapshot. If there are intermediate snapshots and this option isn't used, `RestoreVolumeFromSnapshot` fails.
            - `DELETE_CLONED_VOLUMES` - Deletes any dependent clone volumes created from intermediate snapshots. If there are any dependent clone volumes and this option isn't used, `RestoreVolumeFromSnapshot` fails.
        snapshot-id: The ID of the source snapshot. Specifies the snapshot that you are restoring from.
        volume-id: The ID of the volume that you are restoring.
