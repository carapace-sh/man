name: add-endpoint
description: Add endpoint to a Compute Engine wire group.
flags:
    --cross-site-network=!: Name of the crossSiteNetwork to operate on.
    --endpoint-label=!: The endpoint label for the wire group.
documentation:
    command: |
        *gcloud compute interconnects wire-groups add-endpoint* is used to add endpoints to a wire group.

        For an example, refer to the *EXAMPLES* section below.
    flag:
        cross-site-network: Name of the crossSiteNetwork to operate on.
        endpoint-label: The endpoint label for the wire group.
