name: update
description: Update a Database Migration Service conversion workspace.
flags:
    --display-name=: A user-friendly name for the conversion workspace.
    --global-filter=: Filter the source entities based on [AIP-160](https://google.aip.dev/160) standard.
    --no-async: Waits for the operation in progress to complete before returning.
    --region=: The Cloud region for the conversion_workspace.
documentation:
    command: |
        Update a Database Migration Service conversion workspace.
    flag:
        display-name: |-
            A user-friendly name for the conversion workspace. The display name can
            include letters, numbers, spaces, and hyphens, and must start with a letter.
            The maximum length allowed is 60 characters.
        global-filter: |-
            Filter the source entities based on [AIP-160](https://google.aip.dev/160) standard.
            This filter will be applied to all subsequent operations on the source entities,
            such as convert and describe-entities.
        no-async: Waits for the operation in progress to complete before returning.
        region: |-
            The Cloud region for the conversion_workspace.
            +
            To set the `region` attribute:
            * provide the argument `conversion_workspace` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
