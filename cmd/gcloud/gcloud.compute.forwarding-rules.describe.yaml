name: describe
description: Display detailed information about a forwarding rule.
flags:
    --global: If set, the forwarding rule is global.
    --no-global&: If set, the forwarding rule is global.
    --region=: Region of the forwarding rule to describe.
documentation:
    command: |-
        *gcloud compute forwarding-rules describe* displays all data associated with a forwarding rule
        in a project.

        ## EXAMPLES
        To get details about a global forwarding rule, run:

          $ gcloud compute forwarding-rules describe FORWARDING-RULE --global

        To get details about a regional forwarding rule, run:

          $ gcloud compute forwarding-rules describe FORWARDING-RULE --region=us-central1
    flag:
        global: If set, the forwarding rule is global.
        no-global: If set, the forwarding rule is global.
        region: |-
            Region of the forwarding rule to describe. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
