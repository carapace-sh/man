name: update
description: '*(BETA)*  Update a Compute Engine interconnect.'
flags:
    --admin-enabled: Administrative status of the interconnect.
    --clear-labels: Remove all labels.
    --description=: An optional, textual description for the interconnect.
    --no-admin-enabled&: Administrative status of the interconnect.
    --no-clear-labels&: Remove all labels.
    --noc-contact-email=: Email address to contact the customer NOC for operations and maintenance
    --remove-labels=: List of label keys to remove.
    --requested-link-count=: Target number of physical links in the link bundle.
    --update-labels=: List of label KEY=VALUE pairs to update.
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute interconnects update* is used to update interconnects. An interconnect represents a
        single specific connection between Google and the customer.
    flag:
        admin-enabled: |-
            Administrative status of the interconnect.
            When this is enabled, the interconnect is operational and will carry
            traffic across any functioning linked interconnect attachments. Use
            --no-admin-enabled to disable it.
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        description: An optional, textual description for the interconnect.
        no-admin-enabled: |
            Administrative status of the interconnect.
            When this is enabled, the interconnect is operational and will carry
            traffic across any functioning linked interconnect attachments. Use
            --no-admin-enabled to disable it.
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        noc-contact-email: |-
            Email address to contact the customer NOC for operations and maintenance
            notifications regarding this interconnect.
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        requested-link-count: Target number of physical links in the link bundle.
        update-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
