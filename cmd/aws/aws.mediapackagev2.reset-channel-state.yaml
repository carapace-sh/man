name: reset-channel-state
description: Resetting the channel can help to clear errors from misconfigurations in the encoder.
flags:
    --channel-group-name=!: The name of the channel group that contains the channel that you are resetting.
    --channel-name=!: The name of the channel that you are resetting.
documentation:
    command: |-
        Resetting the channel can help to clear errors from misconfigurations in the encoder. A reset refreshes the ingest stream and removes previous content.

        Be sure to stop the encoder before you reset the channel, and wait at least 30 seconds before you restart the encoder.
    flag:
        channel-group-name: The name of the channel group that contains the channel that you are resetting.
        channel-name: The name of the channel that you are resetting.
