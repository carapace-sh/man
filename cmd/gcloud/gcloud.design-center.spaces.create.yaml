name: create
description: Create a space.
flags:
    --description=: Description for the space.
    --display-name=: Display name for the space.
    --enable-gcp-shared-templates: Flag to enable Google opinionated shared templates.
    --gcs-bucket=: An existing Google Cloud Storage bucket that you want to use instead of
    --location=: The location id of the space resource.
    --no-enable-gcp-shared-templates&: Flag to enable Google opinionated shared templates.
    --tags=: Tags are key/values bound to space resource.
documentation:
    command: Create a space.
    flag:
        description: Description for the space.
        display-name: Display name for the space.
        enable-gcp-shared-templates: Flag to enable Google opinionated shared templates.
        gcs-bucket: |-
            An existing Google Cloud Storage bucket that you want to use instead of
            creating a new bucket during ADC setup.
            If not provided, a default bucket is created during setup.
            The bucket must exist in the same project as the space.
            If the bucket name does not exist in the same project as the space, the
            request fails with an INVALID_ARGUMENT error.
            If you do not have access to the bucket, the request fails with a
            PERMISSION_DENIED error.
            Format: {$bucket_name}
            For example, if the Cloud Storage bucket URI is gs:\/\/{$bucket_name}, the
            format is {$bucket_name}.
        location: |-
            The location id of the space resource.
            +
            To set the `location` attribute:
            * provide the argument `space` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-enable-gcp-shared-templates: Flag to enable Google opinionated shared templates.
        tags: |-
            Tags are key/values bound to space resource.
            Example: `"123/environment": "production"
              "123/costCenter": "marketing"`. For more information on tag creation and management, see
            https://cloud.google.com/resource-manager/docs/tags/tags-overview.
            +
            *KEY*:::
            Sets `KEY` value.
            +
            *VALUE*:::
            Sets `VALUE` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --tags=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --tags='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --tags=path_to_file.(yaml|json)
            +
            ```
