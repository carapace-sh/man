name: disable
description: '*(ALPHA)*  Disable the Service Directory Feature.'
flags:
    --force: Force disablement.
    --no-force&: Force disablement.
documentation:
    command: |-
        *(ALPHA)*  Disables the Service Directory Feature in a fleet.

        ## EXAMPLES

        To disable the Service Directory Feature, run:

          $ gcloud alpha container hub service-directory disable
    flag:
        force: Force disablement. Bypasses any prompts for confirmation. When disabling the entire feature, proceeds even if the feature is in use. Might result in unexpected behavior.
        no-force: Force disablement. Bypasses any prompts for confirmation. When disabling the entire feature, proceeds even if the feature is in use. Might result in unexpected behavior.
