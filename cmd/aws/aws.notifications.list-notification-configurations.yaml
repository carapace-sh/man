name: list-notification-configurations
description: Returns a list of abbreviated `NotificationConfigurations` according to specified filters, in reverse chronological order (newest first).
flags:
    --channel-arn=: The Amazon Resource Name (ARN) of the Channel to match.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --event-rule-source=: The matched event source.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-items=: The  total number of items to return in the command's output.
    --max-results=: The maximum number of results to be returned in this call.
    --next-token=: The start token for paginated calls.
    --page-size=: The size of each page to get in the AWS service call.
    --starting-token=: A token to specify where to start paginating.
    --status=: The `NotificationConfiguration` status to match.
    --subtype=: The subtype used to filter the notification configurations in the request.
completion:
    flag:
        status:
            - ACTIVE
            - PARTIALLY_ACTIVE
            - INACTIVE
            - DELETING
        subtype:
            - ACCOUNT
            - ADMIN_MANAGED
documentation:
    command: Returns a list of abbreviated `NotificationConfigurations` according to specified filters, in reverse chronological order (newest first).
    flag:
        channel-arn: The Amazon Resource Name (ARN) of the Channel to match.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        event-rule-source: |-
            The matched event source.

            Must match one of the valid EventBridge sources. Only Amazon Web Services service sourced events are supported. For example, `aws.ec2` and `aws.cloudwatch`. For more information, see [Event delivery from Amazon Web Services services](https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-service-event.html#eb-service-event-delivery-level) in the *Amazon EventBridge User Guide*.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-items: |-
            The total number of items to return in the command's output.
            If the total number of items available is more than the value specified, a NextToken is provided in the command's output.
            To resume pagination, provide the NextToken value in the starting-token argument of a subsequent  command.
            Do not use the NextToken response element directly outside of the AWS CLI.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        max-results: The maximum number of results to be returned in this call. Defaults to 20.
        next-token: The start token for paginated calls. Retrieved from the response of a previous `ListEventRules` call. Next token uses Base64 encoding.
        page-size: |-
            The size of each page to get in the AWS service call.
            This does not affect the number of items returned in the command's output.
            Setting a smaller page size results in more calls to the AWS service, retrieving fewer items in each call.
            This can help prevent the AWS service calls from timing out.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        starting-token: |-
            A token to specify where to start paginating.
            This is the NextToken from a previously truncated response.

            For usage examples, see Pagination in the AWS Command Line Interface User Guide.
        status: "The `NotificationConfiguration` status to match.\n\n- Values:\n  \n  - `ACTIVE`\n    \n    - All `EventRules` are `ACTIVE` and any call can be run.\n  - `PARTIALLY_ACTIVE`\n    \n    - Some `EventRules` are `ACTIVE` and some are `INACTIVE`. Any call can be run.\n    - Any call can be run.\n  - `INACTIVE`\n    \n    - All `EventRules` are `INACTIVE` and any call can be run.\n  - `DELETING`\n    \n    - This `NotificationConfiguration` is being deleted.\n    - Only `GET` and `LIST` calls can be run."
        subtype: The subtype used to filter the notification configurations in the request.
