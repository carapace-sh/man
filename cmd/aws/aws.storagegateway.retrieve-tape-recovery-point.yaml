name: retrieve-tape-recovery-point
description: Retrieves the recovery point for the specified virtual tape.
flags:
    --gateway-arn=!: ""
    --tape-arn=!: The Amazon Resource Name (ARN) of the virtual tape for which you want to retrieve the recovery point.
documentation:
    command: |-
        Retrieves the recovery point for the specified virtual tape. This operation is only supported in the tape gateway type.

        A recovery point is a point in time view of a virtual tape at which all the data on the tape is consistent. If your gateway crashes, virtual tapes that have recovery points can be recovered to a new gateway.

        The virtual tape can be retrieved to only one gateway. The retrieved tape is read-only. The virtual tape can be retrieved to only a tape gateway. There is no charge for retrieving recovery points.
    flag:
        gateway-arn: ""
        tape-arn: The Amazon Resource Name (ARN) of the virtual tape for which you want to retrieve the recovery point.
