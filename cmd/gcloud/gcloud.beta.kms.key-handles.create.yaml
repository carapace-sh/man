name: create
description: '*(BETA)*  Create a new KeyHandle.'
flags:
    --generate-key-handle-id: Generate a KeyHandle id for the new KeyHandle resource.
    --key-handle-id=: The KeyHandle id for the new KeyHandle resource.
    --location=!: ID of the location or fully qualified identifier for the location.
    --no-generate-key-handle-id&: Generate a KeyHandle id for the new KeyHandle resource.
    --resource-type=!: The resource type selector for KeyHandle resources of the form {{SERVICE}}.{{UNIVERSE_DOMAIN}}/{{TYPE}}.
documentation:
    command: |-
        *(BETA)*  Creates a new KeyHandle, triggering the provisioning of a new CryptoKey for
        CMEK use with the given resource type in the configured key project and the
        same location

        ## EXAMPLES

        The following command creates a KeyHandle named `my-key-handle` within the
        location `global` for the resource type `compute.googleapis.com/Disk`:

          $ gcloud beta kms key-handles create --key-handle-id=my-key-handle --my-key-handle --location=global
          --resource-type=compute.googleapis.com/Disk

        In case we want to generate a random KeyHandle id, we can use the
        `--generate-key-handle-id` flag instead of the `--key-handle-id` flag.
    flag:
        generate-key-handle-id: Generate a KeyHandle id for the new KeyHandle resource.
        key-handle-id: The KeyHandle id for the new KeyHandle resource.
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line.
        no-generate-key-handle-id: Generate a KeyHandle id for the new KeyHandle resource.
        resource-type: The resource type selector for KeyHandle resources of the form {{SERVICE}}.{{UNIVERSE_DOMAIN}}/{{TYPE}}.
