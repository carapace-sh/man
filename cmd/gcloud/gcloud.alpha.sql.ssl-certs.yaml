name: ssl-certs
description: '*(ALPHA)*  *(DEPRECATED)*  Provide commands for managing SSL certificates of Cloud SQL instances.'
documentation:
    command: |-
        *(ALPHA)*  *(DEPRECATED)*  Provide commands for managing SSL certificates of Cloud SQL instances.

        `gcloud sql ssl-certs` is deprecated. Use `gcloud sql ssl client-certs` instead.

        Provide commands for managing SSL certificates of Cloud SQL instances,
        including creating, deleting, listing, and getting information about
        certificates.
