name: create-table
description: The `CreateTable` operation adds a new table to your account.
flags:
    --attribute-definitions=!:
        description: An array of attributes that describe the key schema for the table and indexes.
        nargs: -1
    --billing-mode=: Controls how you are charged for read and write throughput and how you manage capacity.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --deletion-protection-enabled: Indicates whether deletion protection is to be enabled (true) or disabled (false) on the table.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --global-secondary-indexes=:
        description: One or more global secondary indexes (the maximum is 20) to be created on the table.
        nargs: -1
    --key-schema=!:
        description: Specifies the attributes that make up the primary key for a table or an index.
        nargs: -1
    --local-secondary-indexes=:
        description: One or more local secondary indexes (the maximum is 5) to be created on the table.
        nargs: -1
    --no-deletion-protection-enabled: Indicates whether deletion protection is to be enabled (true) or disabled (false) on the table.
    --on-demand-throughput=: Sets the maximum number of read and write units for the specified table in on-demand capacity mode.
    --provisioned-throughput=: Represents the provisioned throughput settings for a specified table or index.
    --resource-policy=: An Amazon Web Services resource-based policy document in JSON format that will be attached to the table.
    --sse-specification=: Represents the settings used to enable server-side encryption.
    --stream-specification=: The settings for DynamoDB Streams on the table.
    --table-class=: The table class of the new table.
    --table-name=!: The name of the table to create.
    --tags=:
        description: A list of key-value pairs to label the table.
        nargs: -1
    --warm-throughput=: Represents the warm throughput (in read units per second and write units per second) for creating a table.
completion:
    flag:
        billing-mode:
            - PROVISIONED
            - PAY_PER_REQUEST
        table-class:
            - STANDARD
            - STANDARD_INFREQUENT_ACCESS
documentation:
    command: |-
        The `CreateTable` operation adds a new table to your account. In an Amazon Web Services account, table names must be unique within each Region. That is, you can have two tables with same name if you create the tables in different Regions.

        `CreateTable` is an asynchronous operation. Upon receiving a `CreateTable` request, DynamoDB immediately returns a response with a `TableStatus` of `CREATING`. After the table is created, DynamoDB sets the `TableStatus` to `ACTIVE`. You can perform read and write operations only on an `ACTIVE` table.

        You can optionally define secondary indexes on the new table, as part of the `CreateTable` operation. If you want to create multiple tables with secondary indexes on them, you must create the tables sequentially. Only one table with secondary indexes can be in the `CREATING` state at any given time.

        You can use the `DescribeTable` action to check the table status.
    flag:
        attribute-definitions: An array of attributes that describe the key schema for the table and indexes.
        billing-mode: |-
            Controls how you are charged for read and write throughput and how you manage capacity. This setting can be changed later.

            - `PAY_PER_REQUEST` - We recommend using `PAY_PER_REQUEST` for most DynamoDB workloads. `PAY_PER_REQUEST` sets the billing mode to [On-demand capacity mode](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/on-demand-capacity-mode.html).
            - `PROVISIONED` - We recommend using `PROVISIONED` for steady workloads with predictable growth where capacity requirements can be reliably forecasted. `PROVISIONED` sets the billing mode to [Provisioned capacity mode](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/provisioned-capacity-mode.html).
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        deletion-protection-enabled: Indicates whether deletion protection is to be enabled (true) or disabled (false) on the table.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        global-secondary-indexes: "One or more global secondary indexes (the maximum is 20) to be created on the table. Each global secondary index in the array includes the following:\n\n- `IndexName` - The name of the global secondary index. Must be unique only for this table.\n- `KeySchema` - Specifies the key schema for the global secondary index.\n- `Projection` - Specifies attributes that are copied (projected) from the table into the index. These are in addition to the primary key attributes and index key attributes, which are automatically projected. Each attribute specification is composed of:\n  \n  - `ProjectionType` - One of the following:\n    \n    - `KEYS_ONLY` - Only the index and primary keys are projected into the index.\n    - `INCLUDE` - Only the specified table attributes are projected into the index. The list of projected attributes is in `NonKeyAttributes`.\n    - `ALL` - All of the table attributes are projected into the index.\n  - `NonKeyAttributes` - A list of one or more non-key attribute names that are projected into the secondary index. The total count of attributes provided in `NonKeyAttributes`, summed across all of the secondary indexes, must not exceed 100. If you project the same attribute into two different indexes, this counts as two distinct attributes when determining the total. This limit only applies when you specify the ProjectionType of `INCLUDE`. You still can specify the ProjectionType of `ALL` to project all attributes from the source table, even if the table has more than 100 attributes.\n- `ProvisionedThroughput` - The provisioned throughput settings for the global secondary index, consisting of read and write capacity units."
        key-schema: "Specifies the attributes that make up the primary key for a table or an index. The attributes in `KeySchema` must also be defined in the `AttributeDefinitions` array. For more information, see [Data Model](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DataModel.html) in the *Amazon DynamoDB Developer Guide*.\n\nEach `KeySchemaElement` in the array is composed of:\n\n- `AttributeName` - The name of this key attribute.\n- `KeyType` - The role that the key attribute will assume:\n  \n  - `HASH` - partition key\n  - `RANGE` - sort key\n\nThe partition key of an item is also known as its *hash attribute*. The term \"hash attribute\" derives from the DynamoDB usage of an internal hash function to evenly distribute data items across partitions, based on their partition key values.\n\nThe sort key of an item is also known as its *range attribute*. The term \"range attribute\" derives from the way DynamoDB stores items with the same partition key physically close together, in sorted order by the sort key value.\n\nFor a simple primary key (partition key), you must provide exactly one element with a `KeyType` of `HASH`.\n\nFor a composite primary key (partition key and sort key), you must provide exactly two elements, in this order: The first element must have a `KeyType` of `HASH`, and the second element must have a `KeyType` of `RANGE`.\n\nFor more information, see [Working with Tables](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/WorkingWithTables.html#WorkingWithTables.primary.key) in the *Amazon DynamoDB Developer Guide*."
        local-secondary-indexes: "One or more local secondary indexes (the maximum is 5) to be created on the table. Each index is scoped to a given partition key value. There is a 10 GB size limit per partition key value; otherwise, the size of a local secondary index is unconstrained.\n\nEach local secondary index in the array includes the following:\n\n- `IndexName` - The name of the local secondary index. Must be unique only for this table.\n- `KeySchema` - Specifies the key schema for the local secondary index. The key schema must begin with the same partition key as the table.\n- `Projection` - Specifies attributes that are copied (projected) from the table into the index. These are in addition to the primary key attributes and index key attributes, which are automatically projected. Each attribute specification is composed of:\n  \n  - `ProjectionType` - One of the following:\n    \n    - `KEYS_ONLY` - Only the index and primary keys are projected into the index.\n    - `INCLUDE` - Only the specified table attributes are projected into the index. The list of projected attributes is in `NonKeyAttributes`.\n    - `ALL` - All of the table attributes are projected into the index.\n  - `NonKeyAttributes` - A list of one or more non-key attribute names that are projected into the secondary index. The total count of attributes provided in `NonKeyAttributes`, summed across all of the secondary indexes, must not exceed 100. If you project the same attribute into two different indexes, this counts as two distinct attributes when determining the total. This limit only applies when you specify the ProjectionType of `INCLUDE`. You still can specify the ProjectionType of `ALL` to project all attributes from the source table, even if the table has more than 100 attributes."
        on-demand-throughput: Sets the maximum number of read and write units for the specified table in on-demand capacity mode. If you use this parameter, you must specify `MaxReadRequestUnits`, `MaxWriteRequestUnits`, or both.
        provisioned-throughput: |-
            Represents the provisioned throughput settings for a specified table or index. The settings can be modified using the `UpdateTable` operation.

            If you set BillingMode as `PROVISIONED`, you must specify this property. If you set BillingMode as `PAY_PER_REQUEST`, you cannot specify this property.

            For current minimum and maximum provisioned throughput values, see [Service, Account, and Table Quotas](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Limits.html) in the *Amazon DynamoDB Developer Guide*.
        resource-policy: |-
            An Amazon Web Services resource-based policy document in JSON format that will be attached to the table.

            When you attach a resource-based policy while creating a table, the policy application is *strongly consistent*.

            The maximum size supported for a resource-based policy document is 20 KB. DynamoDB counts whitespaces when calculating the size of a policy against this limit. For a full list of all considerations that apply for resource-based policies, see [Resource-based policy considerations](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/rbac-considerations.html).

            You need to specify the `CreateTable` and `PutResourcePolicy` IAM actions for authorizing a user to create a table with a resource-based policy.
        sse-specification: Represents the settings used to enable server-side encryption.
        stream-specification: "The settings for DynamoDB Streams on the table. These settings consist of:\n\n- `StreamEnabled` - Indicates whether DynamoDB Streams is to be enabled (true) or disabled (false).\n- `StreamViewType` - When an item in the table is modified, `StreamViewType` determines what information is written to the table's stream. Valid values for `StreamViewType` are:\n  \n  - `KEYS_ONLY` - Only the key attributes of the modified item are written to the stream.\n  - `NEW_IMAGE` - The entire item, as it appears after it was modified, is written to the stream.\n  - `OLD_IMAGE` - The entire item, as it appeared before it was modified, is written to the stream.\n  - `NEW_AND_OLD_IMAGES` - Both the new and the old item images of the item are written to the stream."
        table-class: The table class of the new table. Valid values are `STANDARD` and `STANDARD_INFREQUENT_ACCESS`.
        table-name: The name of the table to create. You can also provide the Amazon Resource Name (ARN) of the table in this parameter.
        tags: A list of key-value pairs to label the table. For more information, see [Tagging for DynamoDB](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Tagging.html).
        warm-throughput: Represents the warm throughput (in read units per second and write units per second) for creating a table.
