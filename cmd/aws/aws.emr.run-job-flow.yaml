name: run-job-flow
description: RunJobFlow creates and starts running a new cluster (job flow).
flags:
    --additional-info=: A JSON string for selecting additional features.
    --ami-version=: Applies only to Amazon EMR AMI versions 3.x and 2.x. For Amazon EMR releases 4.0 and later, `ReleaseLabel` is used.
    --applications=: Applies to Amazon EMR releases 4.0 and later.
    --auto-scaling-role=: An IAM role for automatic scaling policies.
    --auto-termination-policy=: ""
    --bootstrap-actions=: A list of bootstrap actions to run before Hadoop starts on the cluster nodes.
    --configurations=: For Amazon EMR releases 4.0 and later.
    --custom-ami-id=: Available only in Amazon EMR releases 5.7.0 and later.
    --ebs-root-volume-iops=: The IOPS, of the Amazon EBS root device volume of the Linux AMI that is used for each Amazon EC2 instance.
    --ebs-root-volume-size=: The size, in GiB, of the Amazon EBS root device volume of the Linux AMI that is used for each Amazon EC2 instance.
    --ebs-root-volume-throughput=: The throughput, in MiB/s, of the Amazon EBS root device volume of the Linux AMI that is used for each Amazon EC2 instance.
    --extended-support=: Reserved.
    --instances=!: A specification of the number and type of Amazon EC2 instances.
    --job-flow-role=: Also called instance profile and Amazon EC2 role.
    --kerberos-attributes=: Attributes for Kerberos configuration when Kerberos authentication is enabled using a security configuration.
    --log-encryption-kms-key-id=: The KMS key used for encrypting log files.
    --log-uri=: The location in Amazon S3 to write the log files of the job flow.
    --managed-scaling-policy=: The specified managed scaling policy for an Amazon EMR cluster.
    --name=!: The name of the job flow.
    --new-supported-products=: For Amazon EMR releases 3.x and 2.x. For Amazon EMR releases 4.x and later, use Applications.
    --no-visible-to-all-users: The VisibleToAllUsers parameter is no longer supported.
    --osrelease-label=: Specifies a particular Amazon Linux release for all nodes in a cluster launch RunJobFlow request.
    --placement-group-configs=: The specified placement group configuration for an Amazon EMR cluster.
    --release-label=: The Amazon EMR release label, which determines the version of open-source application packages installed on the cluster.
    --repo-upgrade-on-boot=: Applies only when `CustomAmiID` is used.
    --scale-down-behavior=: Specifies the way that individual Amazon EC2 instances terminate when an automatic scale-in activity occurs or an instance group is resized.
    --security-configuration=: The name of a security configuration to apply to the cluster.
    --service-role=: The IAM role that Amazon EMR assumes in order to access Amazon Web Services resources on your behalf.
    --step-concurrency-level=: Specifies the number of steps that can be executed concurrently.
    --steps=: A list of steps to run.
    --supported-products=: For Amazon EMR releases 3.x and 2.x. For Amazon EMR releases 4.x and later, use Applications.
    --tags=: A list of tags to associate with a cluster and propagate to Amazon EC2 instances.
    --visible-to-all-users: The VisibleToAllUsers parameter is no longer supported.
completion:
    flag:
        repo-upgrade-on-boot:
            - SECURITY
            - NONE
        scale-down-behavior:
            - TERMINATE_AT_INSTANCE_HOUR
            - TERMINATE_AT_TASK_COMPLETION
documentation:
    command: |-
        RunJobFlow creates and starts running a new cluster (job flow). The cluster runs the steps specified. After the steps complete, the cluster stops and the HDFS partition is lost. To prevent loss of data, configure the last step of the job flow to store results in Amazon S3. If the [JobFlowInstancesConfig]() `KeepJobFlowAliveWhenNoSteps` parameter is set to `TRUE`, the cluster transitions to the WAITING state rather than shutting down after the steps have completed.

        For additional protection, you can set the [JobFlowInstancesConfig]() `TerminationProtected` parameter to `TRUE` to lock the cluster and prevent it from being terminated by API call, user intervention, or in the event of a job flow error.

        A maximum of 256 steps are allowed in each job flow.

        If your cluster is long-running (such as a Hive data warehouse) or complex, you may require more than 256 steps to process your data. You can bypass the 256-step limitation in various ways, including using the SSH shell to connect to the master node and submitting queries directly to the software running on the master node, such as Hive and Hadoop.

        For long-running clusters, we recommend that you periodically store your results.

        The instance fleets configuration is available only in Amazon EMR releases 4.8.0 and later, excluding 5.0.x versions. The RunJobFlow request can contain InstanceFleets parameters or InstanceGroups parameters, but not both.
    flag:
        additional-info: A JSON string for selecting additional features.
        ami-version: Applies only to Amazon EMR AMI versions 3.x and 2.x. For Amazon EMR releases 4.0 and later, `ReleaseLabel` is used. To specify a custom AMI, use `CustomAmiID`.
        applications: Applies to Amazon EMR releases 4.0 and later. A case-insensitive list of applications for Amazon EMR to install and configure when launching the cluster. For a list of applications available for each Amazon EMR release version, see the [Amazon EMRRelease Guide](https://docs.aws.amazon.com/emr/latest/ReleaseGuide/).
        auto-scaling-role: An IAM role for automatic scaling policies. The default role is `EMR_AutoScaling_DefaultRole`. The IAM role provides permissions that the automatic scaling feature requires to launch and terminate Amazon EC2 instances in an instance group.
        auto-termination-policy: ""
        bootstrap-actions: A list of bootstrap actions to run before Hadoop starts on the cluster nodes.
        configurations: For Amazon EMR releases 4.0 and later. The list of configurations supplied for the Amazon EMR cluster that you are creating.
        custom-ami-id: |-
            Available only in Amazon EMR releases 5.7.0 and later. The ID of a custom Amazon EBS-backed Linux AMI. If specified, Amazon EMR uses this AMI when it launches cluster Amazon EC2 instances. For more information about custom AMIs in Amazon EMR, see [Using a Custom AMI](https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-custom-ami.html) in the *Amazon EMR Management Guide*. If omitted, the cluster uses the base Linux AMI for the `ReleaseLabel` specified. For Amazon EMR releases 2.x and 3.x, use `AmiVersion` instead.

            For information about creating a custom AMI, see [Creating an Amazon EBS-Backed Linux AMI](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/creating-an-ami-ebs.html) in the *Amazon Elastic Compute Cloud User Guide for Linux Instances*. For information about finding an AMI ID, see [Finding a Linux AMI](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/finding-an-ami.html).
        ebs-root-volume-iops: The IOPS, of the Amazon EBS root device volume of the Linux AMI that is used for each Amazon EC2 instance. Available in Amazon EMR releases 6.15.0 and later.
        ebs-root-volume-size: The size, in GiB, of the Amazon EBS root device volume of the Linux AMI that is used for each Amazon EC2 instance. Available in Amazon EMR releases 4.x and later.
        ebs-root-volume-throughput: The throughput, in MiB/s, of the Amazon EBS root device volume of the Linux AMI that is used for each Amazon EC2 instance. Available in Amazon EMR releases 6.15.0 and later.
        extended-support: Reserved.
        instances: A specification of the number and type of Amazon EC2 instances.
        job-flow-role: Also called instance profile and Amazon EC2 role. An IAM role for an Amazon EMR cluster. The Amazon EC2 instances of the cluster assume this role. The default role is `EMR_EC2_DefaultRole`. In order to use the default role, you must have already created it using the CLI or console.
        kerberos-attributes: Attributes for Kerberos configuration when Kerberos authentication is enabled using a security configuration. For more information see [Use Kerberos Authentication](https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-kerberos.html) in the *Amazon EMR Management Guide*.
        log-encryption-kms-key-id: The KMS key used for encrypting log files. If a value is not provided, the logs remain encrypted by AES-256. This attribute is only available with Amazon EMR releases 5.30.0 and later, excluding Amazon EMR 6.0.0.
        log-uri: The location in Amazon S3 to write the log files of the job flow. If a value is not provided, logs are not created.
        managed-scaling-policy: The specified managed scaling policy for an Amazon EMR cluster.
        name: The name of the job flow.
        new-supported-products: |-
            For Amazon EMR releases 3.x and 2.x. For Amazon EMR releases 4.x and later, use Applications.

            A list of strings that indicates third-party software to use with the job flow that accepts a user argument list. Amazon EMR accepts and forwards the argument list to the corresponding installation script as bootstrap action arguments. For more information, see "Launch a Job Flow on the MapR Distribution for Hadoop" in the [Amazon EMR Developer Guide](https://docs.aws.amazon.com/emr/latest/DeveloperGuide/emr-dg.pdf). Supported values are:

            - "mapr-m3" - launch the cluster using MapR M3 Edition.
            - "mapr-m5" - launch the cluster using MapR M5 Edition.
            - "mapr" with the user arguments specifying "--edition,m3" or "--edition,m5" - launch the job flow using MapR M3 or M5 Edition respectively.
            - "mapr-m7" - launch the cluster using MapR M7 Edition.
            - "hunk" - launch the cluster with the Hunk Big Data Analytics Platform.
            - "hue"- launch the cluster with Hue installed.
            - "spark" - launch the cluster with Apache Spark installed.
            - "ganglia" - launch the cluster with the Ganglia Monitoring System installed.
        osrelease-label: Specifies a particular Amazon Linux release for all nodes in a cluster launch RunJobFlow request. If a release is not specified, Amazon EMR uses the latest validated Amazon Linux release for cluster launch.
        placement-group-configs: The specified placement group configuration for an Amazon EMR cluster.
        release-label: The Amazon EMR release label, which determines the version of open-source application packages installed on the cluster. Release labels are in the form `emr-x.x.x`, where x.x.x is an Amazon EMR release version such as `emr-5.14.0`. For more information about Amazon EMR release versions and included application versions and features, see [https://docs.aws.amazon.com/emr/latest/ReleaseGuide/](https://docs.aws.amazon.com/emr/latest/ReleaseGuide/). The release label applies only to Amazon EMR releases version 4.0 and later. Earlier versions use `AmiVersion`.
        repo-upgrade-on-boot: Applies only when `CustomAmiID` is used. Specifies which updates from the Amazon Linux AMI package repositories to apply automatically when the instance boots using the AMI. If omitted, the default is `SECURITY`, which indicates that only security updates are applied. If `NONE` is specified, no updates are applied, and all updates must be applied manually.
        scale-down-behavior: Specifies the way that individual Amazon EC2 instances terminate when an automatic scale-in activity occurs or an instance group is resized. `TERMINATE_AT_INSTANCE_HOUR` indicates that Amazon EMR terminates nodes at the instance-hour boundary, regardless of when the request to terminate the instance was submitted. This option is only available with Amazon EMR 5.1.0 and later and is the default for clusters created using that version. `TERMINATE_AT_TASK_COMPLETION` indicates that Amazon EMR adds nodes to a deny list and drains tasks from nodes before terminating the Amazon EC2 instances, regardless of the instance-hour boundary. With either behavior, Amazon EMR removes the least active nodes first and blocks instance termination if it could lead to HDFS corruption. `TERMINATE_AT_TASK_COMPLETION` available only in Amazon EMR releases 4.1.0 and later, and is the default for releases of Amazon EMR earlier than 5.1.0.
        security-configuration: The name of a security configuration to apply to the cluster.
        service-role: The IAM role that Amazon EMR assumes in order to access Amazon Web Services resources on your behalf. If you've created a custom service role path, you must specify it for the service role when you launch your cluster.
        step-concurrency-level: Specifies the number of steps that can be executed concurrently. The default value is `1`. The maximum value is `256`.
        steps: A list of steps to run.
        supported-products: |-
            For Amazon EMR releases 3.x and 2.x. For Amazon EMR releases 4.x and later, use Applications.

            A list of strings that indicates third-party software to use. For more information, see the [Amazon EMR Developer Guide](https://docs.aws.amazon.com/emr/latest/DeveloperGuide/emr-dg.pdf). Currently supported values are:

            - "mapr-m3" - launch the job flow using MapR M3 Edition.
            - "mapr-m5" - launch the job flow using MapR M5 Edition.
        tags: A list of tags to associate with a cluster and propagate to Amazon EC2 instances.
        visible-to-all-users: |-
            The VisibleToAllUsers parameter is no longer supported. By default, the value is set to `true`. Setting it to `false` now has no effect.

            Set this value to `true` so that IAM principals in the Amazon Web Services account associated with the cluster can perform Amazon EMR actions on the cluster that their IAM policies allow. This value defaults to `true` for clusters created using the Amazon EMR API or the CLI [create-cluster](https://docs.aws.amazon.com/cli/latest/reference/emr/create-cluster.html) command.

            When set to `false`, only the IAM principal that created the cluster and the Amazon Web Services account root user can perform Amazon EMR actions for the cluster, regardless of the IAM permissions policies attached to other IAM principals. For more information, see [Understanding the Amazon EMR cluster VisibleToAllUsers setting](https://docs.aws.amazon.com/emr/latest/ManagementGuide/security_IAM_emr-with-IAM.html#security_set_visible_to_all_users) in the *Amazon EMR Management Guide*.
