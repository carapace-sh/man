name: stop-resource
description: Stops a resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) that identifies the resource to stop.
documentation:
    command: |-
        Stops a resource.

        The resource undergoes the following states: `CREATE_STOPPING` and `CREATE_STOPPED`. You cannot resume a resource once it has been stopped.

        This operation can be applied to the following resources (and their corresponding child resources):

        - Dataset Import Job
        - Predictor Job
        - Forecast Job
        - Forecast Export Job
        - Predictor Backtest Export Job
        - Explainability Job
        - Explainability Export Job
    flag:
        resource-arn: The Amazon Resource Name (ARN) that identifies the resource to stop. The supported ARNs are `DatasetImportJobArn`, `PredictorArn`, `PredictorBacktestExportJobArn`, `ForecastArn`, `ForecastExportJobArn`, `ExplainabilityArn`, and `ExplainabilityExportArn`.
