name: delete-simulation
description: Deletes all SimSpace Weaver resources assigned to the given simulation.
flags:
    --simulation=!: The name of the simulation.
documentation:
    command: |-
        Deletes all SimSpace Weaver resources assigned to the given simulation.

        Your simulation uses resources in other Amazon Web Services. This API operation doesn't delete resources in other Amazon Web Services.
    flag:
        simulation: The name of the simulation.
