name: promote-replica
description: '*(ALPHA)*  Promotes Cloud SQL read replica to a stand-alone instance.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --failover: Whether the promote operation is a failover.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-failover&: Whether the promote operation is a failover.
documentation:
    command: '*(ALPHA)*  Promotes Cloud SQL read replica to a stand-alone instance.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        failover: Whether the promote operation is a failover. Use *--failover* to enable and *--no-failover* to disable.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-failover: Whether the promote operation is a failover.
