name: reboot-replication-instance
description: Reboots a replication instance.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --force-failover: If this parameter is `true`, the reboot is conducted through a Multi-AZ failover.
    --force-planned-failover: If this parameter is `true`, the reboot is conducted through a planned Multi-AZ failover where resources are released and cleaned up prior to conducting the failover.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-force-failover: If this parameter is `true`, the reboot is conducted through a Multi-AZ failover.
    --no-force-planned-failover: If this parameter is `true`, the reboot is conducted through a planned Multi-AZ failover where resources are released and cleaned up prior to conducting the failover.
    --replication-instance-arn=!: The Amazon Resource Name (ARN) of the replication instance.
documentation:
    command: Reboots a replication instance. Rebooting results in a momentary outage, until the replication instance becomes available again.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        force-failover: If this parameter is `true`, the reboot is conducted through a Multi-AZ failover. If the instance isn't configured for Multi-AZ, then you can't specify `true`. ( `--force-planned-failover` and `--force-failover` can't both be set to `true`.)
        force-planned-failover: If this parameter is `true`, the reboot is conducted through a planned Multi-AZ failover where resources are released and cleaned up prior to conducting the failover. If the instance isn''t configured for Multi-AZ, then you can't specify `true`. ( `--force-planned-failover` and `--force-failover` can't both be set to `true`.)
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        replication-instance-arn: The Amazon Resource Name (ARN) of the replication instance.
