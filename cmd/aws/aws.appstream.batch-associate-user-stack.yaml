name: batch-associate-user-stack
description: Associates the specified users with the specified stacks.
flags:
    --user-stack-associations=!: The list of UserStackAssociation objects.
documentation:
    command: Associates the specified users with the specified stacks. Users in a user pool cannot be assigned to stacks with fleets that are joined to an Active Directory domain.
    flag:
        user-stack-associations: The list of UserStackAssociation objects.
