name: get-savings-plans-utilization
description: Retrieves the Savings Plans utilization for your account across date ranges with daily or monthly granularity.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --filter=: Filters Savings Plans utilization coverage data for active Savings Plans dimensions.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --granularity=: The granularity of the Amazon Web Services utillization data for your Savings Plans.
    --sort-by=: The value that you want to sort the data by.
    --time-period=!: The time period that you want the usage and costs for.
completion:
    flag:
        granularity:
            - DAILY
            - MONTHLY
            - HOURLY
documentation:
    command: |-
        Retrieves the Savings Plans utilization for your account across date ranges with daily or monthly granularity. Management account in an organization have access to member accounts. You can use `GetDimensionValues` in `SAVINGS_PLANS` to determine the possible dimension values.

        You can't group by any dimension values for `GetSavingsPlansUtilization`.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        filter: |-
            Filters Savings Plans utilization coverage data for active Savings Plans dimensions. You can filter data with the following dimensions:

            - `LINKED_ACCOUNT`
            - `SAVINGS_PLAN_ARN`
            - `SAVINGS_PLANS_TYPE`
            - `REGION`
            - `PAYMENT_OPTION`
            - `INSTANCE_TYPE_FAMILY`

            `GetSavingsPlansUtilization` uses the same [Expression](https://docs.aws.amazon.com/aws-cost-management/latest/APIReference/API_Expression.html) object as the other operations, but only `AND` is supported among each dimension.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        granularity: |-
            The granularity of the Amazon Web Services utillization data for your Savings Plans.

            The `GetSavingsPlansUtilization` operation supports only `DAILY` and `MONTHLY` granularities.
        sort-by: |-
            The value that you want to sort the data by.

            The following values are supported for `Key`:

            - `UtilizationPercentage`
            - `TotalCommitment`
            - `UsedCommitment`
            - `UnusedCommitment`
            - `NetSavings`

            The supported values for `SortOrder` are `ASCENDING` and `DESCENDING`.
        time-period: The time period that you want the usage and costs for. The `Start` date must be within 13 months. The `End` date must be after the `Start` date, and before the current date. Future dates can't be used as an `End` date.
