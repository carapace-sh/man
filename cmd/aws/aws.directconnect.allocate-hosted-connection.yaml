name: allocate-hosted-connection
description: Creates a hosted connection on the specified interconnect or a link aggregation group (LAG) of interconnects.
flags:
    --bandwidth=!: The bandwidth of the connection.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --connection-id=!: The ID of the interconnect or LAG.
    --connection-name=!: The name of the hosted connection.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --owner-account=!: The ID of the Amazon Web Services account ID of the customer for the connection.
    --tags=: The tags associated with the connection.
    --vlan=!: The dedicated VLAN provisioned to the hosted connection.
documentation:
    command: |-
        Creates a hosted connection on the specified interconnect or a link aggregation group (LAG) of interconnects.

        Allocates a VLAN number and a specified amount of capacity (bandwidth) for use by a hosted connection on the specified interconnect or LAG of interconnects. Amazon Web Services polices the hosted connection for the specified capacity and the Direct Connect Partner must also police the hosted connection for the specified capacity.

        Intended for use by Direct Connect Partners only.
    flag:
        bandwidth: The bandwidth of the connection. The possible values are 50Mbps, 100Mbps, 200Mbps, 300Mbps, 400Mbps, 500Mbps, 1Gbps, 2Gbps, 5Gbps, 10Gbps, and 25Gbps. Note that only those Direct Connect Partners who have met specific requirements are allowed to create a 1Gbps, 2Gbps, 5Gbps, 10Gbps, or 25Gbps hosted connection.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        connection-id: The ID of the interconnect or LAG.
        connection-name: The name of the hosted connection.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        owner-account: The ID of the Amazon Web Services account ID of the customer for the connection.
        tags: The tags associated with the connection.
        vlan: The dedicated VLAN provisioned to the hosted connection.
