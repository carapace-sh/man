name: describe-tags
description: Retrieves a list of configuration items that have tags as specified by the key-value pairs, name and value, passed to the optional parameter `filters`.
flags:
    --filters=: You can filter the list using a *key*-*value* format.
    --max-results=: The total number of items to return in a single page of output.
    --next-token=: A token to start the list.
documentation:
    command: |-
        Retrieves a list of configuration items that have tags as specified by the key-value pairs, name and value, passed to the optional parameter `filters`.

        There are three valid tag filter names:

        - tagKey
        - tagValue
        - configurationId

        Also, all configuration items associated with your user that have tags can be listed if you call `DescribeTags` as is without passing any parameters.
    flag:
        filters: You can filter the list using a *key*-*value* format. You can separate these items by using logical operators. Allowed filters include `tagKey`, `tagValue`, and `configurationId`.
        max-results: The total number of items to return in a single page of output. The maximum value is 100.
        next-token: A token to start the list. Use this token to get the next set of results.
