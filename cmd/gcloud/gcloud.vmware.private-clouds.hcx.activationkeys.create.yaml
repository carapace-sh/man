name: create
description: Create a Google Cloud VMware HCX activation key.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Location of the private cloud or cluster.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --private-cloud=: VMware Engine private cloud.
documentation:
    command: |
        Create a HCX activation key in a VMware Engine private cloud. Successful creation of a HCX activation key results in a HCX activation key in AVAILABLE state. Check the progress of a HCX activation key using `gcloud vmware private-clouds hcx activationkeys list`.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        location: |-
            Location of the private cloud or cluster.
            +
            To set the `location` attribute:
            * provide the argument `hcx_activation_key` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/zone`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        private-cloud: |-
            VMware Engine private cloud.
            +
            To set the `private-cloud` attribute:
            * provide the argument `hcx_activation_key` on the command line with a fully specified name;
            * provide the argument `--private-cloud` on the command line.
