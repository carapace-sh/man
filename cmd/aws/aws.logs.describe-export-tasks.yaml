name: describe-export-tasks
description: Lists the specified export tasks.
flags:
    --limit=: The maximum number of items returned.
    --next-token=: The token for the next set of items to return.
    --status-code=: The status code of the export task.
    --task-id=: The ID of the export task.
completion:
    flag:
        status-code:
            - CANCELLED
            - COMPLETED
            - FAILED
            - PENDING
            - PENDING_CANCEL
            - RUNNING
documentation:
    command: Lists the specified export tasks. You can list all your export tasks or filter the results based on task ID or task status.
    flag:
        limit: The maximum number of items returned. If you don't specify a value, the default is up to 50 items.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
        status-code: The status code of the export task. Specifying a status code filters the results to zero or more export tasks.
        task-id: The ID of the export task. Specifying a task ID filters the results to one or zero export tasks.
