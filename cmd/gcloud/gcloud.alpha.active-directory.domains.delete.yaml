name: delete
description: '*(ALPHA)*  Delete a managed Microsoft Active Directory domain.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(ALPHA)*  Delete a managed Microsoft Active Directory (AD) domain with
        the given fully-qualified domain name.

        This command can fail for the following reasons:
          * The AD domain specified does not exist.
          * The active account does not have permission to access the given
            AD domain.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
