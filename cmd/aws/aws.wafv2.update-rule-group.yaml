name: update-rule-group
description: Updates the specified [RuleGroup]().
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --custom-response-bodies=: A map of custom response keys and content bodies.
    --description=: A description of the rule group that helps with identification.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --id=!: A unique identifier for the rule group.
    --lock-token=!: A token used for optimistic locking.
    --name=!: The name of the rule group.
    --rules=:
        description: The [Rule]() statements used to identify the web requests that you want to manage.
        nargs: -1
    --scope=!: Specifies whether this is for a global resource type, such as a Amazon CloudFront distribution.
    --visibility-config=!: Defines and enables Amazon CloudWatch metrics and web request sample collection.
completion:
    flag:
        scope:
            - CLOUDFRONT
            - REGIONAL
documentation:
    command: |-
        Updates the specified [RuleGroup]().

        This operation completely replaces the mutable specifications that you already have for the rule group with the ones that you provide to this call.

        To modify a rule group, do the following:

        1. Retrieve it by calling [GetRuleGroup]()
        2. Update its settings as needed
        3. Provide the complete rule group specification to this call

        A rule group defines a collection of rules to inspect and control web requests that you can use in a [WebACL](). When you create a rule group, you define an immutable capacity limit. If you update a rule group, you must stay within the capacity. This allows others to reuse the rule group with confidence in its capacity requirements.

        **Temporary inconsistencies during updates**

        When you create or change a web ACL or other WAF resources, the changes take a small amount of time to propagate to all areas where the resources are stored. The propagation time can be from a few seconds to a number of minutes.

        The following are examples of the temporary inconsistencies that you might notice during change propagation:

        - After you create a web ACL, if you try to associate it with a resource, you might get an exception indicating that the web ACL is unavailable.
        - After you add a rule group to a web ACL, the new rule group rules might be in effect in one area where the web ACL is used and not in another.
        - After you change a rule action setting, you might see the old action in some places and the new action in others.
        - After you add an IP address to an IP set that is in use in a blocking rule, the new address might be blocked in one area while still allowed in another.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        custom-response-bodies: |-
            A map of custom response keys and content bodies. When you create a rule with a block action, you can send a custom response to the web request. You define these for the rule group, and then use them in the rules that you define in the rule group.

            For information about customizing web requests and responses, see [Customizing web requests and responses in WAF](https://docs.aws.amazon.com/waf/latest/developerguide/waf-custom-request-response.html) in the *WAF Developer Guide*.

            For information about the limits on count and size for custom request and response settings, see [WAF quotas](https://docs.aws.amazon.com/waf/latest/developerguide/limits.html) in the *WAF Developer Guide*.
        description: A description of the rule group that helps with identification.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        id: A unique identifier for the rule group. This ID is returned in the responses to create and list commands. You provide it to operations like update and delete.
        lock-token: A token used for optimistic locking. WAF returns a token to your `get` and `list` requests, to mark the state of the entity at the time of the request. To make changes to the entity associated with the token, you provide the token to operations like `update` and `delete`. WAF uses the token to ensure that no changes have been made to the entity since you last retrieved it. If a change has been made, the update fails with a `WAFOptimisticLockException`. If this happens, perform another `get`, and use the new token returned by that operation.
        name: The name of the rule group. You cannot change the name of a rule group after you create it.
        rules: The [Rule]() statements used to identify the web requests that you want to manage. Each rule includes one top-level statement that WAF uses to identify matching web requests, and parameters that govern how WAF handles them.
        scope: |-
            Specifies whether this is for a global resource type, such as a Amazon CloudFront distribution. For an Amplify application, use `CLOUDFRONT`.

            To work with CloudFront, you must also specify the Region US East (N. Virginia) as follows:

            - CLI - Specify the Region when you use the CloudFront scope: `--scope=CLOUDFRONT --region=us-east-1`.
            - API and SDKs - For all calls, use the Region endpoint us-east-1.
        visibility-config: Defines and enables Amazon CloudWatch metrics and web request sample collection.
