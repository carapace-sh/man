name: set-iam-policy
description: '*(BETA)*  Set the IAM policy binding for a Compute Engine backend bucket.'
flags:
    --global: If set, the backend bucket is global.
    --no-global&: If set, the backend bucket is global.
    --region=: Region of the backend bucket to setIamPolicy.
documentation:
    command: "\n*(BETA)*  Sets the IAM policy for the given backend bucket as defined in a\nJSON or YAML file.  "
    flag:
        global: If set, the backend bucket is global.
        no-global: If set, the backend bucket is global.
        region: Region of the backend bucket to setIamPolicy. Overrides the default *compute/region* property value for this command invocation.
