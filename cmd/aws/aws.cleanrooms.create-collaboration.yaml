name: create-collaboration
description: Creates a new collaboration.
flags:
    --allowed-result-regions=:
        description: The Amazon Web Services Regions where collaboration query results can be stored.
        nargs: -1
    --analytics-engine=: The analytics engine.
    --auto-approved-change-request-types=:
        description: The types of change requests that are automatically approved for this collaboration.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --creator-display-name=!: The display name of the collaboration creator.
    --creator-member-abilities=!:
        description: The abilities granted to the collaboration creator.
        nargs: -1
    --creator-ml-member-abilities=: The ML abilities granted to the collaboration creator.
    --creator-payment-configuration=: The collaboration creator's payment responsibilities set by the collaboration creator.
    --data-encryption-metadata=: The settings for client-side encryption with Cryptographic Computing for Clean Rooms.
    --description=!: A description of the collaboration provided by the collaboration owner.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --job-log-status=: Specifies whether job logs are enabled for this collaboration.
    --members=!:
        description: A list of initial members, not including the creator.
        nargs: -1
    --name=!: The display name for a collaboration.
    --query-log-status=!: An indicator as to whether query logging has been enabled or disabled for the collaboration.
    --tags=: An optional label that you can assign to a resource when you create it.
completion:
    flag:
        analytics-engine:
            - SPARK
            - CLEAN_ROOMS_SQL
        job-log-status:
            - ENABLED
            - DISABLED
        query-log-status:
            - ENABLED
            - DISABLED
documentation:
    command: Creates a new collaboration.
    flag:
        allowed-result-regions: The Amazon Web Services Regions where collaboration query results can be stored. When specified, results can only be written to these Regions. This parameter enables you to meet your compliance and data governance requirements, and implement regional data governance policies.
        analytics-engine: |-
            The analytics engine.

            After July 16, 2025, the `CLEAN_ROOMS_SQL` parameter will no longer be available.
        auto-approved-change-request-types: The types of change requests that are automatically approved for this collaboration.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        creator-display-name: The display name of the collaboration creator.
        creator-member-abilities: The abilities granted to the collaboration creator.
        creator-ml-member-abilities: The ML abilities granted to the collaboration creator.
        creator-payment-configuration: |-
            The collaboration creator's payment responsibilities set by the collaboration creator.

            If the collaboration creator hasn't specified anyone as the member paying for query compute costs, then the member who can query is the default payer.
        data-encryption-metadata: The settings for client-side encryption with Cryptographic Computing for Clean Rooms.
        description: A description of the collaboration provided by the collaboration owner.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        job-log-status: |-
            Specifies whether job logs are enabled for this collaboration.

            When `ENABLED`, Clean Rooms logs details about jobs run within this collaboration; those logs can be viewed in Amazon CloudWatch Logs. The default value is `DISABLED`.
        members: A list of initial members, not including the creator. This list is immutable.
        name: The display name for a collaboration.
        query-log-status: |-
            An indicator as to whether query logging has been enabled or disabled for the collaboration.

            When `ENABLED`, Clean Rooms logs details about queries run within this collaboration and those logs can be viewed in Amazon CloudWatch Logs. The default value is `DISABLED`.
        tags: An optional label that you can assign to a resource when you create it. Each tag consists of a key and an optional value, both of which you define. When you use tagging, you can also use tag-based access control in IAM policies to control access to this resource.
