name: list-flow-operation-results
description: Returns the results of a specific flow operation.
flags:
    --availability-zone=: The ID of the Availability Zone where the firewall is located.
    --firewall-arn=!: The Amazon Resource Name (ARN) of the firewall.
    --flow-operation-id=!: A unique identifier for the flow operation.
    --max-results=: The maximum number of objects that you want Network Firewall to return for this request.
    --next-token=: When you request a list of objects with a `MaxResults` setting, if the number of objects that are still available for retrieval exceeds the maximum you requested, Network Firewall returns a `NextToken` value in the response.
    --vpc-endpoint-association-arn=: The Amazon Resource Name (ARN) of a VPC endpoint association.
    --vpc-endpoint-id=: A unique identifier for the primary endpoint associated with a firewall.
documentation:
    command: |-
        Returns the results of a specific flow operation.

        Flow operations let you manage the flows tracked in the flow table, also known as the firewall table.

        A flow is network traffic that is monitored by a firewall, either by stateful or stateless rules. For traffic to be considered part of a flow, it must share Destination, DestinationPort, Direction, Protocol, Source, and SourcePort.
    flag:
        availability-zone: |-
            The ID of the Availability Zone where the firewall is located. For example, `us-east-2a`.

            Defines the scope a flow operation. You can use up to 20 filters to configure a single flow operation.
        firewall-arn: The Amazon Resource Name (ARN) of the firewall.
        flow-operation-id: A unique identifier for the flow operation. This ID is returned in the responses to start and list commands. You provide to describe commands.
        max-results: The maximum number of objects that you want Network Firewall to return for this request. If more objects are available, in the response, Network Firewall provides a `NextToken` value that you can use in a subsequent call to get the next batch of objects.
        next-token: When you request a list of objects with a `MaxResults` setting, if the number of objects that are still available for retrieval exceeds the maximum you requested, Network Firewall returns a `NextToken` value in the response. To retrieve the next batch of objects, use the token returned from the prior request in your next request.
        vpc-endpoint-association-arn: The Amazon Resource Name (ARN) of a VPC endpoint association.
        vpc-endpoint-id: A unique identifier for the primary endpoint associated with a firewall.
