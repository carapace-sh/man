name: tag-resource
description: Adds tags to the specified applied quota.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) for the applied quota.
    --tags=!: The tags that you want to add to the resource.
documentation:
    command: Adds tags to the specified applied quota. You can include one or more tags to add to the quota.
    flag:
        resource-arn: The Amazon Resource Name (ARN) for the applied quota. You can get this information by using the Service Quotas console, or by listing the quotas using the [list-service-quotas](https://docs.aws.amazon.com/cli/latest/reference/service-quotas/list-service-quotas.html) CLI command or the [ListServiceQuotas](https://docs.aws.amazon.com/servicequotas/2019-06-24/apireference/API_ListServiceQuotas.html) Amazon Web Services API operation.
        tags: The tags that you want to add to the resource.
