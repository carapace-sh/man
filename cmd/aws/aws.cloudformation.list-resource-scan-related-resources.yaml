name: list-resource-scan-related-resources
description: Lists the related resources for a list of resources from a resource scan.
flags:
    --max-results=: If the number of available results exceeds this maximum, the response includes a `NextToken` value that you can use for the `NextToken` parameter to get the next set of results.
    --next-token=: The token for the next set of items to return.
    --resource-scan-id=!: The Amazon Resource Name (ARN) of the resource scan.
    --resources=!: The list of resources for which you want to get the related resources.
documentation:
    command: Lists the related resources for a list of resources from a resource scan. The response indicates whether each returned resource is already managed by CloudFormation.
    flag:
        max-results: If the number of available results exceeds this maximum, the response includes a `NextToken` value that you can use for the `NextToken` parameter to get the next set of results. By default the `ListResourceScanRelatedResources` API action will return up to 100 results in each response. The maximum value is 100.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
        resource-scan-id: The Amazon Resource Name (ARN) of the resource scan.
        resources: The list of resources for which you want to get the related resources. Up to 100 resources can be provided.
