name: untag-resource
description: Adds to or modifies the tags of the given resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource.
    --tag-keys=!: The list of keys of the tags to be removed from the resource.
documentation:
    command: Adds to or modifies the tags of the given resource. Tags are metadata which can be used to manage a resource. To untag a resource, the caller account must be the same as the resource’s `OwnerAccountId`. Untagging resources across accounts is not supported.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource.
        tag-keys: The list of keys of the tags to be removed from the resource.
