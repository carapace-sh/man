name: call
description: '*(ALPHA)*  Triggers execution of a Google Cloud Function.'
flags:
    --cloud-event=: JSON encoded string with a CloudEvent in structured content mode.
    --data=: JSON string with data that will be passed to the function.
    --gen2&: If enabled, this command will use Cloud Functions (Second generation).
    --no-gen2&: If enabled, this command will use Cloud Functions (Second generation).
    --region=: The Cloud region for the function.
    --timeout=&: The gcloud command timeout, e.g. 30s for 30 seconds.
documentation:
    command: '*(ALPHA)*  Triggers execution of a Google Cloud Function.'
    flag:
        cloud-event: |-
            JSON encoded string with a CloudEvent in structured content mode.
            +
            Mutually exclusive with --data flag.
            +
            Use for Cloud Functions 2nd Gen CloudEvent functions. The CloudEvent
            object will be sent to your function as a binary content mode message with
            the top-level 'data' field set as the HTTP body and all other JSON fields
            sent as HTTP headers.
        data: JSON string with data that will be passed to the function.
        gen2: If enabled, this command will use Cloud Functions (Second generation). If disabled with `--no-gen2`, Cloud Functions (First generation) will be used. If not specified, the value of this flag will be taken from the `functions/gen2` configuration property. If the `functions/gen2` configuration property is not set, defaults to looking up the given function and using its generation.
        no-gen2: If enabled, this command will use Cloud Functions (Second generation). If disabled with `--no-gen2`, Cloud Functions (First generation) will be used. If not specified, the value of this flag will be taken from the `functions/gen2` configuration property. If the `functions/gen2` configuration property is not set, defaults to looking up the given function and using its generation.
        region: |-
            The Cloud region for the function. Overrides the default `functions/region` property value for this command invocation.
            +
            To set the `region` attribute:
            * provide the argument `NAME` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `functions/region`.
        timeout: |-
            The gcloud command timeout, e.g. 30s for 30 seconds. Defaults to the
            function execution timeout duration of the function.

            See $ gcloud topic datetimes for information on duration formats.
