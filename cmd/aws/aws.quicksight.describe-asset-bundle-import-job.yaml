name: describe-asset-bundle-import-job
description: Describes an existing import job.
flags:
    --asset-bundle-import-job-id=!: The ID of the job.
    --aws-account-id=!: The ID of the Amazon Web Services account the import job was executed in.
documentation:
    command: |-
        Describes an existing import job.

        Poll job descriptions after starting a job to know when it has succeeded or failed. Job descriptions are available for 14 days after job starts.
    flag:
        asset-bundle-import-job-id: The ID of the job. The job ID is set when you start a new job with a `StartAssetBundleImportJob` API call.
        aws-account-id: The ID of the Amazon Web Services account the import job was executed in.
