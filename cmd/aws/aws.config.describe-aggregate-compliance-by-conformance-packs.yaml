name: describe-aggregate-compliance-by-conformance-packs
description: Returns a list of the existing and deleted conformance packs and their associated compliance status with the count of compliant and noncompliant Config rules within each conformance pack.
flags:
    --configuration-aggregator-name=!: The name of the configuration aggregator.
    --filters=: Filters the result by `AggregateConformancePackComplianceFilters` object.
    --limit=: The maximum number of conformance packs compliance details returned on each page.
    --next-token=: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
documentation:
    command: |-
        Returns a list of the existing and deleted conformance packs and their associated compliance status with the count of compliant and noncompliant Config rules within each conformance pack. Also returns the total rule count which includes compliant rules, noncompliant rules, and rules that cannot be evaluated due to insufficient data.

        The results can return an empty result page, but if you have a `nextToken`, the results are displayed on the next page.
    flag:
        configuration-aggregator-name: The name of the configuration aggregator.
        filters: Filters the result by `AggregateConformancePackComplianceFilters` object.
        limit: The maximum number of conformance packs compliance details returned on each page. The default is maximum. If you specify 0, Config uses the default.
        next-token: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
