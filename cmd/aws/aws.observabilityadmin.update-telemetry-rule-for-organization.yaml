name: update-telemetry-rule-for-organization
description: Updates an existing telemetry rule that applies across an Amazon Web Services Organization.
flags:
    --rule-identifier=!: The identifier (name or ARN) of the organization telemetry rule to update.
    --rule=!: The new configuration details for the organization telemetry rule, including resource type, telemetry type, and destination configuration.
documentation:
    command: Updates an existing telemetry rule that applies across an Amazon Web Services Organization. This operation can only be called by the organization's management account or a delegated administrator account.
    flag:
        rule: The new configuration details for the organization telemetry rule, including resource type, telemetry type, and destination configuration.
        rule-identifier: The identifier (name or ARN) of the organization telemetry rule to update.
