name: create-integration-response
description: Creates an IntegrationResponses.
flags:
    --api-id=!: The API identifier.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --content-handling-strategy=: Specifies how to handle response payload content type conversions.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --integration-id=!: The integration ID.
    --integration-response-key=!: The integration response key.
    --response-parameters=: A key-value map specifying response parameters that are passed to the method response from the backend.
    --response-templates=: The collection of response templates for the integration response as a string-to-string map of key-value pairs.
    --template-selection-expression=: The template selection expression for the integration response.
completion:
    flag:
        content-handling-strategy:
            - CONVERT_TO_BINARY
            - CONVERT_TO_TEXT
documentation:
    command: Creates an IntegrationResponses.
    flag:
        api-id: The API identifier.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        content-handling-strategy: |-
            Specifies how to handle response payload content type conversions. Supported values are CONVERT\_TO\_BINARY and CONVERT\_TO\_TEXT, with the following behaviors:

            CONVERT\_TO\_BINARY: Converts a response payload from a Base64-encoded string to the corresponding binary blob.

            CONVERT\_TO\_TEXT: Converts a response payload from a binary blob to a Base64-encoded string.

            If this property is not defined, the response payload will be passed through from the integration response to the route response or method response without modification.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        integration-id: The integration ID.
        integration-response-key: The integration response key.
        response-parameters: A key-value map specifying response parameters that are passed to the method response from the backend. The key is a method response header parameter name and the mapped value is an integration response header value, a static value enclosed within a pair of single quotes, or a JSON expression from the integration response body. The mapping key must match the pattern of method.response.header.{name}, where {name} is a valid and unique header name. The mapped non-static value must match the pattern of integration.response.header.{name} or integration.response.body.{JSON-expression}, where {name} is a valid and unique response header name and {JSON-expression} is a valid JSON expression without the $ prefix.
        response-templates: The collection of response templates for the integration response as a string-to-string map of key-value pairs. Response templates are represented as a key/value map, with a content-type as the key and a template as the value.
        template-selection-expression: The template selection expression for the integration response. Supported only for WebSocket APIs.
