name: add-tags-to-resource
description: Adds metadata tags to an Amazon DocumentDB resource.
flags:
    --resource-name=!: The Amazon DocumentDB resource that the tags are added to.
    --tags=!: The tags to be assigned to the Amazon DocumentDB resource.
documentation:
    command: Adds metadata tags to an Amazon DocumentDB resource. You can use these tags with cost allocation reporting to track costs that are associated with Amazon DocumentDB resources or in a `Condition` statement in an Identity and Access Management (IAM) policy for Amazon DocumentDB.
    flag:
        resource-name: The Amazon DocumentDB resource that the tags are added to. This value is an Amazon Resource Name .
        tags: The tags to be assigned to the Amazon DocumentDB resource.
