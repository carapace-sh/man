name: get-glossary
description: Gets a business glossary in Amazon DataZone.
flags:
    --domain-identifier=!: The ID of the Amazon DataZone domain in which this business glossary exists.
    --identifier=!: The ID of the business glossary.
documentation:
    command: |-
        Gets a business glossary in Amazon DataZone.

        Prerequisites:

        - The specified glossary ID must exist and be associated with the given domain.
        - The caller must have the `datazone:GetGlossary` permission on the domain.
    flag:
        domain-identifier: The ID of the Amazon DataZone domain in which this business glossary exists.
        identifier: The ID of the business glossary.
