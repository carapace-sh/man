name: sanitize-model-response
description: '*(BETA)*  Sanitize Model Response.'
flags:
    --location=: The location id of the template resource.
    --model-response-data-byte-item-from-file=: Bytes Data.
    --model-response-data-byte-item-type=!: The type of byte data.
    --model-response-data-byte-item=: Bytes Data
    --model-response-data-text=: Plaintext string data for sanitization.
    --multi-language-detection-metadata-enable: Enable detection of multi-language prompts and responses.
    --multi-language-detection-metadata-source=: Optional Source language of the user prompt.
    --no-multi-language-detection-metadata-enable&: Enable detection of multi-language prompts and responses.
    --user-prompt=: User Prompt associated with Model response.
completion:
    flag:
        model-response-data-byte-item-type:
            - csv
            - excel-document
            - pdf
            - plaintext-utf8
            - powerpoint-document
            - txt
            - word-document
documentation:
    command: '*(BETA)*  Sanitizes a model response.'
    flag:
        location: |-
            The location id of the template resource.
            +
            To set the `location` attribute:
            * provide the argument `template` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        model-response-data-byte-item: Bytes Data
        model-response-data-byte-item-from-file: Bytes Data. Use a full or relative path to a local file containing the value of model_response_data_byte_item.
        model-response-data-byte-item-type: |-
            The type of byte data. _MODEL_RESPONSE_DATA_BYTE_ITEM_TYPE_ must be one of:
            +
            *csv*::: CSV
            *excel-document*::: XLSX, XLSM, XLTX, XLYM
            *pdf*::: PDF
            *plaintext-utf8*::: plain text
            *powerpoint-document*::: PPTX, PPTM, POTX, POTM, POT
            *txt*::: TXT
            *word-document*::: DOCX, DOCM, DOTX, DOTM
            :::
            +
        model-response-data-text: Plaintext string data for sanitization.
        multi-language-detection-metadata-enable: Enable detection of multi-language prompts and responses.
        multi-language-detection-metadata-source: |-
            Optional Source language of the user prompt.
            +
            If multi-language detection is enabled but language is not set in that case
            we would automatically detect the source language.
        no-multi-language-detection-metadata-enable: Enable detection of multi-language prompts and responses.
        user-prompt: User Prompt associated with Model response.
