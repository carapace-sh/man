name: list-event-subscriptions
description: Lists all the event subscriptions for the assessment template that is specified by the ARN of the assessment template.
flags:
    --max-results=: You can use this parameter to indicate the maximum number of items you want in the response.
    --next-token=: You can use this parameter when paginating results.
    --resource-arn=: The ARN of the assessment template for which you want to list the existing event subscriptions.
documentation:
    command: Lists all the event subscriptions for the assessment template that is specified by the ARN of the assessment template. For more information, see [SubscribeToEvent]() and [UnsubscribeFromEvent]().
    flag:
        max-results: You can use this parameter to indicate the maximum number of items you want in the response. The default value is 10. The maximum value is 500.
        next-token: You can use this parameter when paginating results. Set the value of this parameter to null on your first call to the **ListEventSubscriptions** action. Subsequent calls to the action fill **nextToken** in the request with the value of **NextToken** from the previous response to continue listing data.
        resource-arn: The ARN of the assessment template for which you want to list the existing event subscriptions.
