name: start-image-scan
description: Starts a basic image vulnerability scan.
flags:
    --image-id=!: ""
    --registry-id=: The Amazon Web Services account ID associated with the registry that contains the repository in which to start an image scan request.
    --repository-name=!: The name of the repository that contains the images to scan.
documentation:
    command: |-
        Starts a basic image vulnerability scan.

        A basic image scan can only be started once per 24 hours on an individual image. This limit includes if an image was scanned on initial push. You can start up to 100,000 basic scans per 24 hours. This limit includes both scans on initial push and scans initiated by the StartImageScan API. For more information, see [Basic scanning](https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-scanning-basic.html) in the *Amazon Elastic Container Registry User Guide*.
    flag:
        image-id: ""
        registry-id: The Amazon Web Services account ID associated with the registry that contains the repository in which to start an image scan request. If you do not specify a registry, the default registry is assumed.
        repository-name: The name of the repository that contains the images to scan.
