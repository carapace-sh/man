name: describe-endpoint
description: Gets the properties associated with a specific endpoint.
flags:
    --endpoint-arn=!: The Amazon Resource Number (ARN) of the endpoint being described.
documentation:
    command: Gets the properties associated with a specific endpoint. Use this operation to get the status of an endpoint. For information about endpoints, see [Managing endpoints](https://docs.aws.amazon.com/comprehend/latest/dg/manage-endpoints.html).
    flag:
        endpoint-arn: The Amazon Resource Number (ARN) of the endpoint being described.
