name: update-expiration-for-hit
description: The `UpdateExpirationForHIT` operation allows you update the expiration time of a HIT.
flags:
    --expire-at=!: The date and time at which you want the HIT to expire
    --hitid=!: The HIT to update.
documentation:
    command: The `UpdateExpirationForHIT` operation allows you update the expiration time of a HIT. If you update it to a time in the past, the HIT will be immediately expired.
    flag:
        expire-at: The date and time at which you want the HIT to expire
        hitid: The HIT to update.
