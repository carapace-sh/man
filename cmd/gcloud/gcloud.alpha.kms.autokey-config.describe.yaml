name: describe
description: '*(ALPHA)*  Describe the AutokeyConfig of a folder.'
flags:
    --folder=!: The folder id in which the AutokeyConfig resource exists.
documentation:
    command: |-
        *(ALPHA)*  gcloud alpha kms autokey-config describe can be used to retrieve the AutokeyConfig of a folder.

        ## EXAMPLES

        The following command retrieves the AutokeyConfig of a folder having folder-id
        `123`:

        $ gcloud alpha kms autokey-config describe --folder=123
    flag:
        folder: The folder id in which the AutokeyConfig resource exists.
