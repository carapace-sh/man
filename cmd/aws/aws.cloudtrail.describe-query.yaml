name: describe-query
description: Returns metadata about a query, including query run time in milliseconds, number of events scanned and matched, and query status.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --event-data-store-owner-account-id=: The account ID of the event data store owner.
    --event-data-store=: The ARN (or the ID suffix of the ARN) of an event data store on which the specified query was run.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --query-alias=: The alias that identifies a query template.
    --query-id=: The query ID.
    --refresh-id=: The ID of the dashboard refresh.
documentation:
    command: |-
        Returns metadata about a query, including query run time in milliseconds, number of events scanned and matched, and query status. If the query results were delivered to an S3 bucket, the response also provides the S3 URI and the delivery status.

        You must specify either `QueryId` or `QueryAlias`. Specifying the `QueryAlias` parameter returns information about the last query run for the alias. You can provide `RefreshId` along with `QueryAlias` to view the query results of a dashboard query for the specified `RefreshId`.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        event-data-store: The ARN (or the ID suffix of the ARN) of an event data store on which the specified query was run.
        event-data-store-owner-account-id: The account ID of the event data store owner.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        query-alias: The alias that identifies a query template.
        query-id: The query ID.
        refresh-id: The ID of the dashboard refresh.
