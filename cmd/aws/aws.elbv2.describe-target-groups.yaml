name: describe-target-groups
description: Describes the specified target groups or all of your target groups.
flags:
    --load-balancer-arn=: The Amazon Resource Name (ARN) of the load balancer.
    --marker=: The marker for the next set of results.
    --names=: The names of the target groups.
    --page-size=: The maximum number of results to return with this call.
    --target-group-arns=: The Amazon Resource Names (ARN) of the target groups.
documentation:
    command: 'Describes the specified target groups or all of your target groups. By default, all target groups are described. Alternatively, you can specify one of the following to filter the results: the ARN of the load balancer, the names of one or more target groups, or the ARNs of one or more target groups.'
    flag:
        load-balancer-arn: The Amazon Resource Name (ARN) of the load balancer.
        marker: The marker for the next set of results. (You received this marker from a previous call.)
        names: The names of the target groups.
        page-size: The maximum number of results to return with this call.
        target-group-arns: The Amazon Resource Names (ARN) of the target groups.
