name: export
description: '*(ALPHA)*  Export the configuration for a Container node pool.'
flags:
    --all: Retrieve all resources within the project.
    --cluster=: The name of the cluster
    --location=: Compute zone or region (e.g. us-central1-a or us-central1) for the cluster.
    --no-all&: Retrieve all resources within the project.
    --path=: Path of the directory or file to output configuration(s).
    --region=: Compute region (e.g. us-central1) for a regional cluster.
    --resource-format=: Format of the configuration to export.
    --zone=: Compute zone (e.g. us-central1-a) for a zonal cluster.
completion:
    flag:
        resource-format:
            - krm
            - terraform
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha container node-pools config export* exports the configuration for a Container node pool.

        Node pool configurations can be exported in
        Kubernetes Resource Model (krm) or Terraform HCL formats. The
        default format is `krm`.

        Specifying `--all` allows you to export the configurations for all
        node pools within the project.

        Specifying `--path` allows you to export the configuration(s) to
        a local directory.
    flag:
        all: Retrieve all resources within the project. If `--path` is specified and is a valid directory, resources will be output as individual files based on resource name and scope. If `--path` is not specified, resources will be streamed to stdout.
        cluster: |-
            The name of the cluster
            +
            To set the `cluster` attribute:
            * provide the argument `node_pool` on the command line with a fully specified name;
            * provide the argument `--cluster` on the command line.
        location: Compute zone or region (e.g. us-central1-a or us-central1) for the cluster. Overrides the default compute/region or compute/zone value for this command invocation. Prefer using this flag over the --region or --zone flags.
        no-all: Retrieve all resources within the project. If `--path` is specified and is a valid directory, resources will be output as individual files based on resource name and scope. If `--path` is not specified, resources will be streamed to stdout.
        path: Path of the directory or file to output configuration(s). To output configurations to stdout, specify "--path=-".
        region: Compute region (e.g. us-central1) for a regional cluster. Overrides the default compute/region property value for this command invocation.
        resource-format: 'Format of the configuration to export. Available configuration formats are Kubernetes Resource Model YAML (krm) or Terraform HCL (terraform). Command defaults to "krm". _RESOURCE_FORMAT_ must be one of: *krm*, *terraform*.'
        zone: Compute zone (e.g. us-central1-a) for a zonal cluster. Overrides the default compute/zone property value for this command invocation.
