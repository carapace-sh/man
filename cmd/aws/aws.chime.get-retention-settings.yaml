name: get-retention-settings
description: Gets the retention settings for the specified Amazon Chime Enterprise account.
flags:
    --account-id=!: The Amazon Chime account ID.
documentation:
    command: Gets the retention settings for the specified Amazon Chime Enterprise account. For more information about retention settings, see [Managing Chat Retention Policies](https://docs.aws.amazon.com/chime/latest/ag/chat-retention.html) in the *Amazon Chime Administration Guide*.
    flag:
        account-id: The Amazon Chime account ID.
