name: get-regions
description: Returns a list of all valid regions for Amazon Lightsail.
flags:
    --include-availability-zones=: A Boolean value indicating whether to also include Availability Zones in your get regions request.
    --include-relational-database-availability-zones=: A Boolean value indicating whether to also include Availability Zones for databases in your get regions request.
documentation:
    command: Returns a list of all valid regions for Amazon Lightsail. Use the `include availability zones` parameter to also return the Availability Zones in a region.
    flag:
        include-availability-zones: 'A Boolean value indicating whether to also include Availability Zones in your get regions request. Availability Zones are indicated with a letter: `us-east-2a`.'
        include-relational-database-availability-zones: A Boolean value indicating whether to also include Availability Zones for databases in your get regions request. Availability Zones are indicated with a letter (`us-east-2a`).
