name: list-connectors
description: Lists the connectors for the specified Region.
flags:
    --max-results=: The maximum number of items to return.
    --next-token=: When you can get additional results from the `ListConnectors` call, a `NextToken` parameter is returned in the output.
documentation:
    command: Lists the connectors for the specified Region.
    flag:
        max-results: The maximum number of items to return.
        next-token: When you can get additional results from the `ListConnectors` call, a `NextToken` parameter is returned in the output. You can then pass in a subsequent command to the `NextToken` parameter to continue listing additional connectors.
