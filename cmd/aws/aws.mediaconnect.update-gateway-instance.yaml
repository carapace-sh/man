        bridge-placement:
            - AVAILABLE
            - LOCKED
documentation:
    command: Updates an existing gateway instance.
    flag:
        bridge-placement: The state of the instance. `ACTIVE` or `INACTIVE`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
