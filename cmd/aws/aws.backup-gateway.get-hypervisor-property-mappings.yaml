name: get-hypervisor-property-mappings
description: This action retrieves the property mappings for the specified hypervisor.
flags:
    --hypervisor-arn=!: The Amazon Resource Name (ARN) of the hypervisor.
documentation:
    command: This action retrieves the property mappings for the specified hypervisor. A hypervisor property mapping displays the relationship of entity properties available from the on-premises hypervisor to the properties available in Amazon Web Services.
    flag:
        hypervisor-arn: The Amazon Resource Name (ARN) of the hypervisor.
