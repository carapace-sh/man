name: search-system-instances
description: Searches for system instances in the user's account.
flags:
    --filters=: Optional filter to apply to the search.
    --max-results=: The maximum number of results to return in the response.
    --next-token=: The string that specifies the next page of results.
documentation:
    command: Searches for system instances in the user's account.
    flag:
        filters: |-
            Optional filter to apply to the search. Valid filters are `SYSTEM_TEMPLATE_ID`, `STATUS`, and `GREENGRASS_GROUP_NAME`.

            Multiple filters function as OR criteria in the query. Multiple values passed inside the filter function as AND criteria.
        max-results: The maximum number of results to return in the response.
        next-token: The string that specifies the next page of results. Use this when you're paginating results.
