name: list-enabled-products-for-import
description: Lists all findings-generating solutions (products) that you are subscribed to receive findings from in Security Hub.
flags:
    --max-results=: The maximum number of items to return in the response.
    --next-token=: The token that is required for pagination.
documentation:
    command: Lists all findings-generating solutions (products) that you are subscribed to receive findings from in Security Hub.
    flag:
        max-results: The maximum number of items to return in the response.
        next-token: |-
            The token that is required for pagination. On your first call to the `ListEnabledProductsForImport` operation, set the value of this parameter to `NULL`.

            For subsequent calls to the operation, to continue listing data, set the value of this parameter to the value returned from the previous response.
