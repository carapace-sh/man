name: clone-rules
description: '*(ALPHA)*  Replace the rules of a Compute Engine organization firewall policy with rules from another policy.'
flags:
    --organization=: Organization in which the organization firewall policy to copy the rules to.
    --source-firewall-policy=!: The URL of the source firewall policy to copy the rules from.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute firewall-policies clone-rules* is used to replace the rules of organization firewall policies. An
         organization firewall policy is a set of rules that controls access to
         various resources.
    flag:
        organization: Organization in which the organization firewall policy to copy the rules to. Must be set if firewall-policy is short name.
        source-firewall-policy: The URL of the source firewall policy to copy the rules from.
