name: get-container-images
description: Returns the container images that are registered to your Amazon Lightsail container service.
flags:
    --service-name=!: The name of the container service for which to return registered container images.
documentation:
    command: |-
        Returns the container images that are registered to your Amazon Lightsail container service.

        If you created a deployment on your Lightsail container service that uses container images from a public registry like Docker Hub, those images are not returned as part of this action. Those images are not registered to your Lightsail container service.
    flag:
        service-name: The name of the container service for which to return registered container images.
