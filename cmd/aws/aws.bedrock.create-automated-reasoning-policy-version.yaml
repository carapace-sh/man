name: create-automated-reasoning-policy-version
description: Creates a new version of an existing Automated Reasoning policy.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=: A unique, case-sensitive identifier to ensure that the operation completes no more than one time.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --last-updated-definition-hash=!: The hash of the current policy definition used as a concurrency token to ensure the policy hasn't been modified since you last retrieved it.
    --policy-arn=!: The Amazon Resource Name (ARN) of the Automated Reasoning policy for which to create a version.
    --tags=:
        description: A list of tags to associate with the policy version.
        nargs: -1
documentation:
    command: Creates a new version of an existing Automated Reasoning policy. This allows you to iterate on your policy rules while maintaining previous versions for rollback or comparison purposes.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: A unique, case-sensitive identifier to ensure that the operation completes no more than one time. If this token matches a previous request, Amazon Bedrock ignores the request, but does not return an error.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        last-updated-definition-hash: The hash of the current policy definition used as a concurrency token to ensure the policy hasn't been modified since you last retrieved it.
        policy-arn: The Amazon Resource Name (ARN) of the Automated Reasoning policy for which to create a version.
        tags: A list of tags to associate with the policy version.
