name: create-api-key
description: Creates a unique key that you can distribute to clients who invoke your API.
flags:
    --api-id=!: The ID for your GraphQL API.
    --description=: A description of the purpose of the API key.
    --expires=: From the creation time, the time after which the API key expires.
documentation:
    command: Creates a unique key that you can distribute to clients who invoke your API.
    flag:
        api-id: The ID for your GraphQL API.
        description: A description of the purpose of the API key.
        expires: From the creation time, the time after which the API key expires. The date is represented as seconds since the epoch, rounded down to the nearest hour. The default value for this parameter is 7 days from creation time. For more information, see .
