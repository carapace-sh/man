name: delete
description: Delete a runtime template.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: Cloud region for the runtime template.
documentation:
    command: |
        Delete a Colab Enterprise notebook runtime template.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            Cloud region for the runtime template.
            +
            To set the `region` attribute:
            * provide the argument `runtime_template` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `colab/region`.
