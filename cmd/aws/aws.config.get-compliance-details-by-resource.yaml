name: get-compliance-details-by-resource
description: Returns the evaluation results for the specified Amazon Web Services resource.
flags:
    --compliance-types=: Filters the results by compliance.
    --next-token=: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
    --resource-evaluation-id=: The unique ID of Amazon Web Services resource execution for which you want to retrieve evaluation results.
    --resource-id=: The ID of the Amazon Web Services resource for which you want compliance information.
    --resource-type=: The type of the Amazon Web Services resource for which you want compliance information.
documentation:
    command: Returns the evaluation results for the specified Amazon Web Services resource. The results indicate which Config rules were used to evaluate the resource, when each rule was last invoked, and whether the resource complies with each rule.
    flag:
        compliance-types: |-
            Filters the results by compliance.

            `INSUFFICIENT_DATA` is a valid `ComplianceType` that is returned when an Config rule cannot be evaluated. However, `INSUFFICIENT_DATA` cannot be used as a `ComplianceType` for filtering results.
        next-token: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
        resource-evaluation-id: |-
            The unique ID of Amazon Web Services resource execution for which you want to retrieve evaluation results.

            You need to only provide either a `ResourceEvaluationID` or a `ResourceID`and `ResourceType`.
        resource-id: The ID of the Amazon Web Services resource for which you want compliance information.
        resource-type: The type of the Amazon Web Services resource for which you want compliance information.
