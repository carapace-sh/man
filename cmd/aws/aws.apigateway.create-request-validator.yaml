name: create-request-validator
description: Creates a RequestValidator of a given RestApi.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=: The name of the to-be-created RequestValidator.
    --no-validate-request-body: A Boolean flag to indicate whether to validate request body according to the configured model schema for the method (`true`) or not (`false`).
    --no-validate-request-parameters: A Boolean flag to indicate whether to validate request parameters, `true`, or not `false`.
    --rest-api-id=!: The string identifier of the associated RestApi.
    --validate-request-body: A Boolean flag to indicate whether to validate request body according to the configured model schema for the method (`true`) or not (`false`).
    --validate-request-parameters: A Boolean flag to indicate whether to validate request parameters, `true`, or not `false`.
documentation:
    command: Creates a RequestValidator of a given RestApi.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the to-be-created RequestValidator.
        rest-api-id: The string identifier of the associated RestApi.
        validate-request-body: A Boolean flag to indicate whether to validate request body according to the configured model schema for the method (`true`) or not (`false`).
        validate-request-parameters: A Boolean flag to indicate whether to validate request parameters, `true`, or not `false`.
