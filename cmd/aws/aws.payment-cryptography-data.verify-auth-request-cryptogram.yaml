name: verify-auth-request-cryptogram
description: Verifies Authorization Request Cryptogram (ARQC) for a EMV chip payment card authorization.
flags:
    --auth-request-cryptogram=!: The auth request cryptogram imported into Amazon Web Services Payment Cryptography for ARQC verification using a major encryption key and transaction data.
    --auth-response-attributes=: The attributes and values for auth request cryptogram verification.
    --key-identifier=!: The `keyARN` of the major encryption key that Amazon Web Services Payment Cryptography uses for ARQC verification.
    --major-key-derivation-mode=!: The method to use when deriving the major encryption key for ARQC verification within Amazon Web Services Payment Cryptography.
    --session-key-derivation-attributes=!: The attributes and values to use for deriving a session key for ARQC verification within Amazon Web Services Payment Cryptography.
    --transaction-data=!: The transaction data that Amazon Web Services Payment Cryptography uses for ARQC verification.
completion:
    flag:
        major-key-derivation-mode:
            - EMV_OPTION_A
            - EMV_OPTION_B
documentation:
    command: |-
        Verifies Authorization Request Cryptogram (ARQC) for a EMV chip payment card authorization. For more information, see [Verify auth request cryptogram](https://docs.aws.amazon.com/payment-cryptography/latest/userguide/data-operations.verifyauthrequestcryptogram.html) in the *Amazon Web Services Payment Cryptography User Guide*.

        ARQC generation is done outside of Amazon Web Services Payment Cryptography and is typically generated on a point of sale terminal for an EMV chip card to obtain payment authorization during transaction time. For ARQC verification, you must first import the ARQC generated outside of Amazon Web Services Payment Cryptography by calling [ImportKey](https://docs.aws.amazon.com/payment-cryptography/latest/APIReference/API_ImportKey.html). This operation uses the imported ARQC and an major encryption key (DUKPT) created by calling [CreateKey](https://docs.aws.amazon.com/payment-cryptography/latest/APIReference/API_CreateKey.html) to either provide a boolean ARQC verification result or provide an APRC (Authorization Response Cryptogram) response using Method 1 or Method 2. The `ARPC_METHOD_1` uses `AuthResponseCode` to generate ARPC and `ARPC_METHOD_2` uses `CardStatusUpdate` to generate ARPC.

        For information about valid keys for this operation, see [Understanding key attributes](https://docs.aws.amazon.com/payment-cryptography/latest/userguide/keys-validattributes.html) and [Key types for specific data operations](https://docs.aws.amazon.com/payment-cryptography/latest/userguide/crypto-ops-validkeys-ops.html) in the *Amazon Web Services Payment Cryptography User Guide*.

        **Cross-account use**: This operation can't be used across different Amazon Web Services accounts.

        **Related operations:**

        - [VerifyCardValidationData]()
        - [VerifyPinData]()
    flag:
        auth-request-cryptogram: The auth request cryptogram imported into Amazon Web Services Payment Cryptography for ARQC verification using a major encryption key and transaction data.
        auth-response-attributes: The attributes and values for auth request cryptogram verification. These parameters are required in case using ARPC Method 1 or Method 2 for ARQC verification.
        key-identifier: The `keyARN` of the major encryption key that Amazon Web Services Payment Cryptography uses for ARQC verification.
        major-key-derivation-mode: The method to use when deriving the major encryption key for ARQC verification within Amazon Web Services Payment Cryptography. The same key derivation mode was used for ARQC generation outside of Amazon Web Services Payment Cryptography.
        session-key-derivation-attributes: The attributes and values to use for deriving a session key for ARQC verification within Amazon Web Services Payment Cryptography. The same attributes were used for ARQC generation outside of Amazon Web Services Payment Cryptography.
        transaction-data: The transaction data that Amazon Web Services Payment Cryptography uses for ARQC verification. The same transaction is used for ARQC generation outside of Amazon Web Services Payment Cryptography.
