name: batch-get-triggers
description: Returns a list of resource metadata for a given list of trigger names.
flags:
    --trigger-names=!: A list of trigger names, which may be the names returned from the `ListTriggers` operation.
documentation:
    command: Returns a list of resource metadata for a given list of trigger names. After calling the `ListTriggers` operation, you can call this operation to access the data to which you have been granted permissions. This operation supports all IAM permissions, including permission conditions that uses tags.
    flag:
        trigger-names: A list of trigger names, which may be the names returned from the `ListTriggers` operation.
