name: update-proxy-configuration
description: Updates the properties of the specified proxy configuration.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --default-rule-phase-actions=!: Evaluation points in the traffic flow where rules are applied.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --proxy-configuration-arn=: The Amazon Resource Name (ARN) of a proxy configuration.
    --proxy-configuration-name=: The descriptive name of the proxy configuration.
    --update-token=!: A token used for optimistic locking.
documentation:
    command: Updates the properties of the specified proxy configuration.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        default-rule-phase-actions: Evaluation points in the traffic flow where rules are applied. There are three phases in a traffic where the rule match is applied.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        proxy-configuration-arn: |-
            The Amazon Resource Name (ARN) of a proxy configuration.

            You must specify the ARN or the name, and you can specify both.
        proxy-configuration-name: |-
            The descriptive name of the proxy configuration. You can't change the name of a proxy configuration after you create it.

            You must specify the ARN or the name, and you can specify both.
        update-token: |-
            A token used for optimistic locking. Network Firewall returns a token to your requests that access the proxy configuration. The token marks the state of the proxy configuration resource at the time of the request.

            To make changes to the proxy configuration, you provide the token in your request. Network Firewall uses the token to ensure that the proxy configuration hasn't changed since you last retrieved it. If it has changed, the operation fails with an `InvalidTokenException`. If this happens, retrieve the proxy configuration again to get a current copy of it with a current token. Reapply your changes as needed, then try the operation again using the new token.
