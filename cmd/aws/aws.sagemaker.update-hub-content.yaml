name: update-hub-content
description: Updates SageMaker hub content (either a `Model` or `Notebook` resource).
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --hub-content-description=: The description of the hub content.
    --hub-content-display-name=: The display name of the hub content.
    --hub-content-markdown=: A string that provides a description of the hub content.
    --hub-content-name=!: The name of the hub content resource that you want to update.
    --hub-content-search-keywords=: The searchable keywords of the hub content.
    --hub-content-type=!: The content type of the resource that you want to update.
    --hub-content-version=!: The hub content version that you want to update.
    --hub-name=!: The name of the SageMaker hub that contains the hub content you want to update.
    --support-status=: Indicates the current status of the hub content resource.
completion:
    flag:
        hub-content-type:
            - Model
            - Notebook
            - ModelReference
        support-status:
            - Supported
            - Deprecated
            - Restricted
documentation:
    command: |-
        Updates SageMaker hub content (either a `Model` or `Notebook` resource).

        You can update the metadata that describes the resource. In addition to the required request fields, specify at least one of the following fields to update:

        - `HubContentDescription`
        - `HubContentDisplayName`
        - `HubContentMarkdown`
        - `HubContentSearchKeywords`
        - `SupportStatus`

        For more information about hubs, see [Private curated hubs for foundation model access control in JumpStart](https://docs.aws.amazon.com/sagemaker/latest/dg/jumpstart-curated-hubs.html).

        If you want to update a `ModelReference` resource in your hub, use the `UpdateHubContentResource` API instead.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        hub-content-description: The description of the hub content.
        hub-content-display-name: The display name of the hub content.
        hub-content-markdown: A string that provides a description of the hub content. This string can include links, tables, and standard markdown formatting.
        hub-content-name: The name of the hub content resource that you want to update.
        hub-content-search-keywords: The searchable keywords of the hub content.
        hub-content-type: The content type of the resource that you want to update. Only specify a `Model` or `Notebook` resource for this API. To update a `ModelReference`, use the `UpdateHubContentReference` API instead.
        hub-content-version: The hub content version that you want to update. For example, if you have two versions of a resource in your hub, you can update the second version.
        hub-name: The name of the SageMaker hub that contains the hub content you want to update. You can optionally use the hub ARN instead.
        support-status: Indicates the current status of the hub content resource.
