name: describe
description: View the details of a change.
flags:
    --zone=!: Name of the managed zone whose record sets you want to manage.
documentation:
    command: |-
        This command displays the details of the specified change.

        ## EXAMPLES

        To display the details of a change, run:

          $ gcloud dns record-sets changes describe change_id
    flag:
        zone: Name of the managed zone whose record sets you want to manage.
