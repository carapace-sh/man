name: start-replication-task-assessment-run
description: Starts a new premigration assessment run for one or more individual assessments of a migration task.
flags:
    --assessment-run-name=!: Unique name to identify the assessment run.
    --exclude=: Space-separated list of names for specific individual assessments that you want to exclude.
    --include-only=: Space-separated list of names for specific individual assessments that you want to include.
    --replication-task-arn=!: Amazon Resource Name (ARN) of the migration task associated with the premigration assessment run that you want to start.
    --result-encryption-mode=: Encryption mode that you can specify to encrypt the results of this assessment run.
    --result-kms-key-arn=: ARN of a custom KMS encryption key that you specify when you set `ResultEncryptionMode` to `"SSE_KMS`".
    --result-location-bucket=!: Amazon S3 bucket where you want DMS to store the results of this assessment run.
    --result-location-folder=: Folder within an Amazon S3 bucket where you want DMS to store the results of this assessment run.
    --service-access-role-arn=!: ARN of the service role needed to start the assessment run.
    --tags=: One or more tags to be assigned to the premigration assessment run that you want to start.
documentation:
    command: |-
        Starts a new premigration assessment run for one or more individual assessments of a migration task.

        The assessments that you can specify depend on the source and target database engine and the migration type defined for the given task. To run this operation, your migration task must already be created. After you run this operation, you can review the status of each individual assessment. You can also run the migration task manually after the assessment run and its individual assessments complete.
    flag:
        assessment-run-name: Unique name to identify the assessment run.
        exclude: |-
            Space-separated list of names for specific individual assessments that you want to exclude. These names come from the default list of individual assessments that DMS supports for the associated migration task. This task is specified by `ReplicationTaskArn`.

            You can't set a value for `Exclude` if you also set a value for `IncludeOnly` in the API operation.

            To identify the names of the default individual assessments that DMS supports for the associated migration task, run the `DescribeApplicableIndividualAssessments` operation using its own `ReplicationTaskArn` request parameter.
        include-only: |-
            Space-separated list of names for specific individual assessments that you want to include. These names come from the default list of individual assessments that DMS supports for the associated migration task. This task is specified by `ReplicationTaskArn`.

            You can't set a value for `IncludeOnly` if you also set a value for `Exclude` in the API operation.

            To identify the names of the default individual assessments that DMS supports for the associated migration task, run the `DescribeApplicableIndividualAssessments` operation using its own `ReplicationTaskArn` request parameter.
        replication-task-arn: Amazon Resource Name (ARN) of the migration task associated with the premigration assessment run that you want to start.
        result-encryption-mode: |-
            Encryption mode that you can specify to encrypt the results of this assessment run. If you don't specify this request parameter, DMS stores the assessment run results without encryption. You can specify one of the options following:

            - `"SSE_S3"` – The server-side encryption provided as a default by Amazon S3.
            - `"SSE_KMS"` – Key Management Service (KMS) encryption. This encryption can use either a custom KMS encryption key that you specify or the default KMS encryption key that DMS provides.
        result-kms-key-arn: ARN of a custom KMS encryption key that you specify when you set `ResultEncryptionMode` to `"SSE_KMS`".
        result-location-bucket: Amazon S3 bucket where you want DMS to store the results of this assessment run.
        result-location-folder: Folder within an Amazon S3 bucket where you want DMS to store the results of this assessment run.
        service-access-role-arn: ARN of the service role needed to start the assessment run. The role must allow the `iam:PassRole` action.
        tags: One or more tags to be assigned to the premigration assessment run that you want to start.
