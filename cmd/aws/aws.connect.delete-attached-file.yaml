name: delete-attached-file
description: Deletes an attached file along with the underlying S3 Object.
flags:
    --associated-resource-arn=!: The resource to which the attached file is (being) uploaded to.
    --file-id=!: The unique identifier of the attached file resource.
    --instance-id=!: The unique identifier of the Connect instance.
documentation:
    command: |-
        Deletes an attached file along with the underlying S3 Object.

        The attached file is **permanently deleted** if S3 bucket versioning is not enabled.
    flag:
        associated-resource-arn: |-
            The resource to which the attached file is (being) uploaded to. [Cases](https://docs.aws.amazon.com/connect/latest/APIReference/API_connect-cases_CreateCase.html) are the only current supported resource.

            This value must be a valid ARN.
        file-id: The unique identifier of the attached file resource.
        instance-id: The unique identifier of the Connect instance.
