name: create-dataset
description: Creates a container for a collection of data being ingested for analysis.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=!: A unique identifier for the request.
    --dataset-name=!: The name of the dataset being created.
    --dataset-schema=: A JSON description of the data that is in each time series dataset, including names, column names, and data types.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --server-side-kms-key-id=: Provides the identifier of the KMS key used to encrypt dataset data by Amazon Lookout for Equipment.
    --tags=:
        description: Any tags associated with the ingested data described in the dataset.
        nargs: -1
documentation:
    command: Creates a container for a collection of data being ingested for analysis. The dataset contains the metadata describing where the data is and what the data actually looks like. For example, it contains the location of the data source, the data schema, and other information. A dataset also contains any tags associated with the ingested data.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique identifier for the request. If you do not set the client request token, Amazon Lookout for Equipment generates one.
        dataset-name: The name of the dataset being created.
        dataset-schema: A JSON description of the data that is in each time series dataset, including names, column names, and data types.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        server-side-kms-key-id: Provides the identifier of the KMS key used to encrypt dataset data by Amazon Lookout for Equipment.
        tags: Any tags associated with the ingested data described in the dataset.
