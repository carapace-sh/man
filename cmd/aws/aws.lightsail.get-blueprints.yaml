name: get-blueprints
description: Returns the list of available instance images, or *blueprints*.
flags:
    --app-category=: Returns a list of blueprints that are specific to Lightsail for Research.
    --include-inactive: A Boolean value that indicates whether to include inactive (unavailable) blueprints in the response of your request.
    --no-include-inactive: A Boolean value that indicates whether to include inactive (unavailable) blueprints in the response of your request.
    --page-token=: The token to advance to the next page of results from your request.
completion:
    flag:
        app-category:
            - LfR
documentation:
    command: |-
        Returns the list of available instance images, or *blueprints*. You can use a blueprint to create a new instance already running a specific operating system, as well as a preinstalled app or development stack. The software each instance is running depends on the blueprint image you choose.

        Use active blueprints when creating new instances. Inactive blueprints are listed to support customers with existing instances and are not necessarily available to create new instances. Blueprints are marked inactive when they become outdated due to operating system updates or new application releases.
    flag:
        app-category: |-
            Returns a list of blueprints that are specific to Lightsail for Research.

            You must use this parameter to view Lightsail for Research blueprints.
        include-inactive: A Boolean value that indicates whether to include inactive (unavailable) blueprints in the response of your request.
        page-token: |-
            The token to advance to the next page of results from your request.

            To get a page token, perform an initial `GetBlueprints` request. If your results are paginated, the response will return a next page token that you can specify as the page token in a subsequent request.
