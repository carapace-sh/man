name: create-trust-store
description: Creates a trust store.
flags:
    --ca-certificates-bundle-s3-bucket=!: The Amazon S3 bucket for the ca certificates bundle.
    --ca-certificates-bundle-s3-key=!: The Amazon S3 path for the ca certificates bundle.
    --ca-certificates-bundle-s3-object-version=: The Amazon S3 object version for the ca certificates bundle.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the trust store.
    --tags=:
        description: The tags to assign to the trust store.
        nargs: -1
documentation:
    command: |-
        Creates a trust store.

        For more information, see [Mutual TLS for Application Load Balancers](https://docs.aws.amazon.com/elasticloadbalancing/latest/application/mutual-authentication.html).
    flag:
        ca-certificates-bundle-s3-bucket: The Amazon S3 bucket for the ca certificates bundle.
        ca-certificates-bundle-s3-key: The Amazon S3 path for the ca certificates bundle.
        ca-certificates-bundle-s3-object-version: The Amazon S3 object version for the ca certificates bundle. If undefined the current version is used.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: |-
            The name of the trust store.

            This name must be unique per region and can't be changed after creation.
        tags: The tags to assign to the trust store.
