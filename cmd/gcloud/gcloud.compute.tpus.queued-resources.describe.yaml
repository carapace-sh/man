name: describe
description: Describe a Queued Resource.
flags:
    --zone=: The compute/zone of the Cloud TPU.
documentation:
    command: |
        Get details on a Queued Resource.

        To get a list of Queued Resources to describe in more detail, run:

          $ gcloud compute tpus queued-resources list
    flag:
        zone: |-
            The compute/zone of the Cloud TPU.
            +
            If not specified, will use `default` compute/zone.
            +

            To set the `zone` attribute:
            * provide the argument `queued_resource` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line;
            * set the property `compute/zone`.
