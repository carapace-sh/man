name: get-credentials
description: '*(BETA)*  Fetch credentials for a membership with a particular namespace.'
flags:
    --membership-location=: The location of the membership resource, e.g. `us-central1`.
    --membership=: Membership ID to get credentials from.
    --no-use-client-side-generation&: Generate the kubeconfig locally rather than generating it using an API
    --set-namespace-in-config=: If true, the default namespace for the context in the generated
    --use-client-side-generation&: Generate the kubeconfig locally rather than generating it using an API
documentation:
    command: |-
        ## EXAMPLES

          Get the Connect Gateway kubeconfig for global membership `MEMBERSHIP`,
          using namespace `NAMESPACE` in the config:

            $ gcloud beta container hub scopes namespaces get-credentials NAMESPACE --membership=MEMBERSHIP --membership-location=global
              --set-namespace-in-config=true

          Get the Connect Gateway kubeconfig for global membership `MEMBERSHIP`:

            $ gcloud beta container hub scopes namespaces get-credentials NAMESPACE --membership=MEMBERSHIP --membership-location=global
    flag:
        membership: |-
            Membership ID to get credentials from. If not provided, a
            prompt will offer a list of memberships in the fleet.
        membership-location: |-
            The location of the membership resource, e.g. `us-central1`.
            If not specified, defaults to `global`.
        no-use-client-side-generation: |
            Generate the kubeconfig locally rather than generating it using an API
            call.
        set-namespace-in-config: |-
            If true, the default namespace for the context in the generated
            kubeconfig will be set to the Fleet namespace
            (i.e. the name given as the positional argument in this command).
            +
            Otherwise, no default namespace will be set, functioning the same as
            `gcloud container fleet memberships get-credentials`.
        use-client-side-generation: |
            Generate the kubeconfig locally rather than generating it using an API
            call.
