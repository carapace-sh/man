name: unlabel-parameter-version
description: Remove a label or labels from a parameter.
flags:
    --labels=!: One or more labels to delete from the specified parameter version.
    --name=!: The name of the parameter from which you want to delete one or more labels.
    --parameter-version=!: The specific version of the parameter which you want to delete one or more labels from.
documentation:
    command: |-
        Remove a label or labels from a parameter.

        Parameter names can't contain spaces. The service removes any spaces specified for the beginning or end of a parameter name. If the specified name for a parameter contains spaces between characters, the request fails with a `ValidationException` error.
    flag:
        labels: One or more labels to delete from the specified parameter version.
        name: |-
            The name of the parameter from which you want to delete one or more labels.

            You can't enter the Amazon Resource Name (ARN) for a parameter, only the parameter name itself.
        parameter-version: The specific version of the parameter which you want to delete one or more labels from. If it isn't present, the call will fail.
