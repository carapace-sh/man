name: import
description: '*(ALPHA)*  Import a Looker instance.'
flags:
    --region=: The region of the instance.
    --source-gcs-uri=: The path to the folder in Google Cloud Storage where the import will be retrieved from.
documentation:
    command: |-
        *(ALPHA)*  This command can fail for the following reasons:
              * The instance specified does not exist.
              * The active account does not have permission to access the given
                instance.
              * The Google Cloud Storage bucket does not exist.
    flag:
        region: |-
            The region of the instance.
            +
            To set the `region` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--region` on the command line.
        source-gcs-uri: The path to the folder in Google Cloud Storage where the import will be retrieved from. The URI is in the form `gs://bucketName/folderName`.
