name: delete-content-association
description: Deletes the content association.
flags:
    --content-association-id=!: The identifier of the content association.
    --content-id=!: The identifier of the content.
    --knowledge-base-id=!: The identifier of the knowledge base.
documentation:
    command: |-
        Deletes the content association.

        For more information about content associations--what they are and when they are used--see [Integrate Amazon Q in Connect with step-by-step guides](https://docs.aws.amazon.com/connect/latest/adminguide/integrate-q-with-guides.html) in the *Amazon Connect Administrator Guide*.
    flag:
        content-association-id: The identifier of the content association. Can be either the ID or the ARN. URLs cannot contain the ARN.
        content-id: The identifier of the content.
        knowledge-base-id: The identifier of the knowledge base.
