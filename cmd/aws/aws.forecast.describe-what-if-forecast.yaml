name: describe-what-if-forecast
description: Describes the what-if forecast created using the [CreateWhatIfForecast]() operation.
flags:
    --what-if-forecast-arn=!: The Amazon Resource Name (ARN) of the what-if forecast that you are interested in.
documentation:
    command: |-
        Describes the what-if forecast created using the [CreateWhatIfForecast]() operation.

        In addition to listing the properties provided in the `CreateWhatIfForecast` request, this operation lists the following properties:

        - `CreationTime`
        - `LastModificationTime`
        - `Message` - If an error occurred, information about the error.
        - `Status`
    flag:
        what-if-forecast-arn: The Amazon Resource Name (ARN) of the what-if forecast that you are interested in.
