name: get-attributes
description: Returns all of the attributes associated with the specified item.
flags:
    --attribute-names=: The names of the attributes.
    --consistent-read: Determines whether or not strong consistency should be enforced when data is read from SimpleDB.
    --domain-name=!: The name of the domain in which to perform the operation.
    --item-name=!: The name of the item.
    --no-consistent-read&: Determines whether or not strong consistency should be enforced when data is read from SimpleDB.
documentation:
    command: |-
        Returns all of the attributes associated with the specified item. Optionally, the attributes returned can be limited to one or more attributes by specifying an attribute name parameter.

        If the item does not exist on the replica that was accessed for this operation, an empty set is returned. The system does not return an error as it cannot guarantee the item does not exist on other replicas.
    flag:
        attribute-names: The names of the attributes.
        consistent-read: Determines whether or not strong consistency should be enforced when data is read from SimpleDB. If `true`, any data previously written to SimpleDB will be returned. Otherwise, results will be consistent eventually, and the client may not see data that was written immediately before your read.
        domain-name: The name of the domain in which to perform the operation.
        item-name: The name of the item.
