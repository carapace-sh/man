name: set-dag-timeout
description: '*(ALPHA)*  Set DAG timeout on a workflow template.'
flags:
    --dag-timeout=!: The duration for which a DAG of jobs can run before being
    --region=: Dataproc region for the template.
documentation:
    command: '*(ALPHA)*  Set DAG timeout on a workflow template.'
    flag:
        dag-timeout: |-
            The duration for which a DAG of jobs can run before being
            auto-cancelled, such as "10m" or "16h".
            See $ gcloud topic datetimes for information on duration formats.
        region: |-
            Dataproc region for the template. Each Dataproc region constitutes an independent resource namespace constrained to deploying instances into Compute Engine zones inside the region. Overrides the default `dataproc/region` property value for this command invocation.
            +
            To set the `region` attribute:
            * provide the argument `template` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `dataproc/region`.
