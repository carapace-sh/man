name: invite-account-to-organization
description: Sends an invitation to another account to join your organization as a member account.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --notes=: Additional information that you want to include in the generated email to the recipient account owner.
    --tags=:
        description: A list of tags that you want to attach to the account when it becomes a member of the organization.
        nargs: -1
    --target=!: The identifier (ID) of the Amazon Web Services account that you want to invite to join your organization.
documentation:
    command: |-
        Sends an invitation to another account to join your organization as a member account. Organizations sends email on your behalf to the email address that is associated with the other account's owner. The invitation is implemented as a [Handshake]() whose details are in the response.

        If you receive an exception that indicates that you exceeded your account limits for the organization or that the operation failed because your organization is still initializing, wait one hour and then try again. If the error persists after an hour, contact [Amazon Web Services Support](https://console.aws.amazon.com/support/home#/).

        If the request includes tags, then the requester must have the `organizations:TagResource` permission.

        You can only call this operation from the management account.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        notes: Additional information that you want to include in the generated email to the recipient account owner.
        tags: |-
            A list of tags that you want to attach to the account when it becomes a member of the organization. For each tag in the list, you must specify both a tag key and a value. You can set the value to an empty string, but you can't set it to `null`. For more information about tagging, see [Tagging Organizations resources](https://docs.aws.amazon.com/organizations/latest/userguide/orgs_tagging.html) in the Organizations User Guide.

            Any tags in the request are checked for compliance with any applicable tag policies when the request is made. The request is rejected if the tags in the request don't match the requirements of the policy at that time. Tag policy compliance is ***not*** checked again when the invitation is accepted and the tags are actually attached to the account. That means that if the tag policy changes between the invitation and the acceptance, then that tags could potentially be non-compliant.

            If any one of the tags is not valid or if you exceed the allowed number of tags for an account, then the entire request fails and invitations are not sent.
        target: |-
            The identifier (ID) of the Amazon Web Services account that you want to invite to join your organization. This is a JSON object that contains the following elements:

            `{ "Type": "ACCOUNT", "Id": "< account id number >" }`

            If you use the CLI, you can submit this as a single string, similar to the following example:

            `--target Id=123456789012,Type=ACCOUNT`

            If you specify `"Type": "ACCOUNT"`, you must provide the Amazon Web Services account ID number as the `Id`. If you specify `"Type": "EMAIL"`, you must specify the email address that is associated with the account.

            `--target Id=diego@example.com,Type=EMAIL`
