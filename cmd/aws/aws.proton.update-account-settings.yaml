name: update-account-settings
description: Update Proton settings that are used for multiple services in the Amazon Web Services account.
flags:
    --delete-pipeline-provisioning-repository: Set to `true` to remove a configured pipeline repository from the account settings.
    --no-delete-pipeline-provisioning-repository: Set to `true` to remove a configured pipeline repository from the account settings.
    --pipeline-codebuild-role-arn=: The Amazon Resource Name (ARN) of the service role you want to use for provisioning pipelines.
    --pipeline-provisioning-repository=: A linked repository for pipeline provisioning.
    --pipeline-service-role-arn=: The Amazon Resource Name (ARN) of the service role you want to use for provisioning pipelines.
documentation:
    command: Update Proton settings that are used for multiple services in the Amazon Web Services account.
    flag:
        delete-pipeline-provisioning-repository: Set to `true` to remove a configured pipeline repository from the account settings. Don't set this field if you are updating the configured pipeline repository.
        pipeline-codebuild-role-arn: The Amazon Resource Name (ARN) of the service role you want to use for provisioning pipelines. Proton assumes this role for CodeBuild-based provisioning.
        pipeline-provisioning-repository: |-
            A linked repository for pipeline provisioning. Specify it if you have environments configured for self-managed provisioning with services that include pipelines. A linked repository is a repository that has been registered with Proton. For more information, see [CreateRepository]().

            To remove a previously configured repository, set `deletePipelineProvisioningRepository` to `true`, and don't set `pipelineProvisioningRepository`.
        pipeline-service-role-arn: |-
            The Amazon Resource Name (ARN) of the service role you want to use for provisioning pipelines. Assumed by Proton for Amazon Web Services-managed provisioning, and by customer-owned automation for self-managed provisioning.

            To remove a previously configured ARN, specify an empty string.
