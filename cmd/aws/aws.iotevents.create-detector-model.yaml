name: create-detector-model
description: Creates a detector model.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --detector-model-definition=!: Information that defines how the detectors operate.
    --detector-model-description=: A brief description of the detector model.
    --detector-model-name=!: The name of the detector model.
    --evaluation-method=: Information about the order in which events are evaluated and how actions are executed.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --key=: The input attribute key used to identify a device or system to create a detector (an instance of the detector model) and then to route each input received to the appropriate detector (instance).
    --role-arn=!: The ARN of the role that grants permission to AWS IoT Events to perform its operations.
    --tags=:
        description: Metadata that can be used to manage the detector model.
        nargs: -1
completion:
    flag:
        evaluation-method:
            - BATCH
            - SERIAL
documentation:
    command: Creates a detector model.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        detector-model-definition: Information that defines how the detectors operate.
        detector-model-description: A brief description of the detector model.
        detector-model-name: The name of the detector model.
        evaluation-method: Information about the order in which events are evaluated and how actions are executed.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        key: The input attribute key used to identify a device or system to create a detector (an instance of the detector model) and then to route each input received to the appropriate detector (instance). This parameter uses a JSON-path expression in the message payload of each input to specify the attribute-value pair that is used to identify the device associated with the input.
        role-arn: The ARN of the role that grants permission to AWS IoT Events to perform its operations.
        tags: Metadata that can be used to manage the detector model.
