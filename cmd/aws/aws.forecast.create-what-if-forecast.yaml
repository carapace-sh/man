name: create-what-if-forecast
description: A what-if forecast is a forecast that is created from a modified version of the baseline forecast.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --tags=:
        description: A list of [tags](https://docs.aws.amazon.com/forecast/latest/dg/tagging-forecast-resources.html) to apply to the what if forecast.
        nargs: -1
    --time-series-replacements-data-source=: The replacement time series dataset, which contains the rows that you want to change in the related time series dataset.
    --time-series-transformations=:
        description: The transformations that are applied to the baseline time series.
        nargs: -1
    --what-if-analysis-arn=!: The Amazon Resource Name (ARN) of the what-if analysis.
    --what-if-forecast-name=!: The name of the what-if forecast.
documentation:
    command: A what-if forecast is a forecast that is created from a modified version of the baseline forecast. Each what-if forecast incorporates either a replacement dataset or a set of transformations to the original dataset.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        tags: A list of [tags](https://docs.aws.amazon.com/forecast/latest/dg/tagging-forecast-resources.html) to apply to the what if forecast.
        time-series-replacements-data-source: |-
            The replacement time series dataset, which contains the rows that you want to change in the related time series dataset. A replacement time series does not need to contain all rows that are in the baseline related time series. Include only the rows (measure-dimension combinations) that you want to include in the what-if forecast.

            This dataset is merged with the original time series to create a transformed dataset that is used for the what-if analysis.

            This dataset should contain the items to modify (such as item\_id or workforce\_type), any relevant dimensions, the timestamp column, and at least one of the related time series columns. This file should not contain duplicate timestamps for the same time series.

            Timestamps and item\_ids not included in this dataset are not included in the what-if analysis.
        time-series-transformations: The transformations that are applied to the baseline time series. Each transformation contains an action and a set of conditions. An action is applied only when all conditions are met. If no conditions are provided, the action is applied to all items.
        what-if-analysis-arn: The Amazon Resource Name (ARN) of the what-if analysis.
        what-if-forecast-name: The name of the what-if forecast. Names must be unique within each what-if analysis.
