name: reset-user-password
description: Resets the password for a specified user ID and generates a temporary one.
flags:
    --client-token=: A token that ensures idempotency.
    --user-id=!: The unique identifier of the user that a temporary password is requested for.
documentation:
    command: Resets the password for a specified user ID and generates a temporary one. Only a superuser can reset password for other users. Resetting the password immediately invalidates the previous password associated with the user.
    flag:
        client-token: A token that ensures idempotency. This token expires in 10 minutes.
        user-id: The unique identifier of the user that a temporary password is requested for.
