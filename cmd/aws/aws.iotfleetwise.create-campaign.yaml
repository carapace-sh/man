name: create-campaign
description: Creates an orchestration of data collection rules.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --collection-scheme=!: The data collection scheme associated with the campaign.
    --compression=: Determines whether to compress signals before transmitting data to Amazon Web Services IoT FleetWise.
    --data-destination-configs=: The destination where the campaign sends data.
    --data-extra-dimensions=: A list of vehicle attributes to associate with a campaign.
    --data-partitions=: The data partitions associated with the signals collected from the vehicle.
    --description=: An optional description of the campaign to help identify its purpose.
    --diagnostics-mode=: Option for a vehicle to send diagnostic trouble codes to Amazon Web Services IoT FleetWise.
    --expiry-time=: The time the campaign expires, in seconds since epoch (January 1, 1970 at midnight UTC time).
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the campaign to create.
    --post-trigger-collection-duration=: How long (in milliseconds) to collect raw data after a triggering event initiates the collection.
    --priority=: A number indicating the priority of one campaign over another campaign for a certain vehicle or fleet.
    --signal-catalog-arn=!: The Amazon Resource Name (ARN) of the signal catalog to associate with the campaign.
    --signals-to-collect=: A list of information about signals to collect.
    --signals-to-fetch=: A list of information about signals to fetch.
    --spooling-mode=: Determines whether to store collected data after a vehicle lost a connection with the cloud.
    --start-time=: The time, in milliseconds, to deliver a campaign after it was approved.
    --tags=: Metadata that can be used to manage the campaign.
    --target-arn=!: The ARN of the vehicle or fleet to deploy a campaign to.
completion:
    flag:
        compression:
            - "OFF"
            - SNAPPY
        diagnostics-mode:
            - "OFF"
            - SEND_ACTIVE_DTCS
        spooling-mode:
            - "OFF"
            - TO_DISK
documentation:
    command: |-
        Creates an orchestration of data collection rules. The Amazon Web Services IoT FleetWise Edge Agent software running in vehicles uses campaigns to decide how to collect and transfer data to the cloud. You create campaigns in the cloud. After you or your team approve campaigns, Amazon Web Services IoT FleetWise automatically deploys them to vehicles.

        For more information, see [Collect and transfer data with campaigns](https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/campaigns.html) in the *Amazon Web Services IoT FleetWise Developer Guide*.

        Access to certain Amazon Web Services IoT FleetWise features is currently gated. For more information, see [Amazon Web Services Region and feature availability](https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/fleetwise-regions.html) in the *Amazon Web Services IoT FleetWise Developer Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        collection-scheme: The data collection scheme associated with the campaign. You can specify a scheme that collects data based on time or an event.
        compression: |-
            Determines whether to compress signals before transmitting data to Amazon Web Services IoT FleetWise. If you don't want to compress the signals, use `OFF`. If it's not specified, `SNAPPY` is used.

            Default: `SNAPPY`
        data-destination-configs: |-
            The destination where the campaign sends data. You can send data to an MQTT topic, or store it in Amazon S3 or Amazon Timestream.

            MQTT is the publish/subscribe messaging protocol used by Amazon Web Services IoT to communicate with your devices.

            Amazon S3 optimizes the cost of data storage and provides additional mechanisms to use vehicle data, such as data lakes, centralized data storage, data processing pipelines, and analytics. Amazon Web Services IoT FleetWise supports at-least-once file delivery to S3. Your vehicle data is stored on multiple Amazon Web Services IoT FleetWise servers for redundancy and high availability.

            You can use Amazon Timestream to access and analyze time series data, and Timestream to query vehicle data so that you can identify trends and patterns.
        data-extra-dimensions: |-
            A list of vehicle attributes to associate with a campaign.

            Enrich the data with specified vehicle attributes. For example, add `make` and `model` to the campaign, and Amazon Web Services IoT FleetWise will associate the data with those attributes as dimensions in Amazon Timestream. You can then query the data against `make` and `model`.

            Default: An empty array
        data-partitions: The data partitions associated with the signals collected from the vehicle.
        description: An optional description of the campaign to help identify its purpose.
        diagnostics-mode: |-
            Option for a vehicle to send diagnostic trouble codes to Amazon Web Services IoT FleetWise. If you want to send diagnostic trouble codes, use `SEND_ACTIVE_DTCS`. If it's not specified, `OFF` is used.

            Default: `OFF`
        expiry-time: |-
            The time the campaign expires, in seconds since epoch (January 1, 1970 at midnight UTC time). Vehicle data isn't collected after the campaign expires.

            Default: 253402214400 (December 31, 9999, 00:00:00 UTC)
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The name of the campaign to create.
        post-trigger-collection-duration: |-
            How long (in milliseconds) to collect raw data after a triggering event initiates the collection. If it's not specified, `0` is used.

            Default: `0`
        priority: |-
            A number indicating the priority of one campaign over another campaign for a certain vehicle or fleet. A campaign with the lowest value is deployed to vehicles before any other campaigns. If it's not specified, `0` is used.

            Default: `0`
        signal-catalog-arn: The Amazon Resource Name (ARN) of the signal catalog to associate with the campaign.
        signals-to-collect: |-
            A list of information about signals to collect.

            If you upload a signal as a condition in a data partition for a campaign, then those same signals must be included in `signalsToCollect`.
        signals-to-fetch: A list of information about signals to fetch.
        spooling-mode: |-
            Determines whether to store collected data after a vehicle lost a connection with the cloud. After a connection is re-established, the data is automatically forwarded to Amazon Web Services IoT FleetWise. If you want to store collected data when a vehicle loses connection with the cloud, use `TO_DISK`. If it's not specified, `OFF` is used.

            Default: `OFF`
        start-time: |-
            The time, in milliseconds, to deliver a campaign after it was approved. If it's not specified, `0` is used.

            Default: `0`
        tags: Metadata that can be used to manage the campaign.
        target-arn: The ARN of the vehicle or fleet to deploy a campaign to.
