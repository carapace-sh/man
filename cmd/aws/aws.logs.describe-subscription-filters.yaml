name: describe-subscription-filters
description: Lists the subscription filters for the specified log group.
flags:
    --filter-name-prefix=: The prefix to match.
    --limit=: The maximum number of items returned.
    --log-group-name=!: The name of the log group.
    --next-token=: The token for the next set of items to return.
documentation:
    command: Lists the subscription filters for the specified log group. You can list all the subscription filters or filter the results by prefix. The results are ASCII-sorted by filter name.
    flag:
        filter-name-prefix: The prefix to match. If you don't specify a value, no prefix filter is applied.
        limit: The maximum number of items returned. If you don't specify a value, the default is up to 50 items.
        log-group-name: The name of the log group.
        next-token: The token for the next set of items to return. (You received this token from a previous call.)
