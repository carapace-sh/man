name: list-tags-for-resource
description: Displays the tags associated with a CloudWatch resource.
flags:
    --resource-arn=!: The ARN of the CloudWatch resource that you want to view tags for.
documentation:
    command: Displays the tags associated with a CloudWatch resource. Currently, alarms and Contributor Insights rules support tagging.
    flag:
        resource-arn: |-
            The ARN of the CloudWatch resource that you want to view tags for.

            The ARN format of an alarm is `arn:aws:cloudwatch:Region:account-id:alarm:alarm-name`

            The ARN format of a Contributor Insights rule is `arn:aws:cloudwatch:Region:account-id:insight-rule/insight-rule-name`

            For more information about ARN format, see [Resource Types Defined by Amazon CloudWatch](https://docs.aws.amazon.com/IAM/latest/UserGuide/list_amazoncloudwatch.html#amazoncloudwatch-resources-for-iam-policies) in the *Amazon Web Services General Reference*.
