name: refresh-token
description: This is for internal use.
flags:
    --provider=!: The third-party provider for the token.
    --refresh-token-body=!: Information about the refresh token request.
completion:
    flag:
        provider:
            - figma
documentation:
    command: |-
        This is for internal use.

        Amplify uses this action to refresh a previously issued access token that might have expired.
    flag:
        provider: The third-party provider for the token. The only valid value is `figma`.
        refresh-token-body: Information about the refresh token request.
