name: delete
description: '*(ALPHA)*  Deletes a Compute Engine network policy rule.'
flags:
    --network-policy-region=: Region of the network policy to delete.
    --network-policy=!: Network policy ID with which to delete rule.
    --priority=!: Priority of the rule to be removed.
documentation:
    command: '*(ALPHA)*  *gcloud alpha compute network-policies traffic-classification-rules delete* is used to delete network policy rules.'
    flag:
        network-policy: Network policy ID with which to delete rule.
        network-policy-region: Region of the network policy to delete. Overrides the default *compute/region* property value for this command invocation.
        priority: Priority of the rule to be removed. Valid in [1, 2147482647].
