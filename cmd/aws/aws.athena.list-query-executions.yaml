name: list-query-executions
description: Provides a list of available query execution IDs for the queries in the specified workgroup.
flags:
    --max-results=: The maximum number of query executions to return in this request.
    --next-token=: A token generated by the Athena service that specifies where to continue pagination if a previous request was truncated.
    --work-group=: The name of the workgroup from which queries are being returned.
documentation:
    command: Provides a list of available query execution IDs for the queries in the specified workgroup. Athena keeps a query history for 45 days. If a workgroup is not specified, returns a list of query execution IDs for the primary workgroup. Requires you to have access to the workgroup in which the queries ran.
    flag:
        max-results: The maximum number of query executions to return in this request.
        next-token: A token generated by the Athena service that specifies where to continue pagination if a previous request was truncated. To obtain the next set of pages, pass in the `NextToken` from the response object of the previous page call.
        work-group: The name of the workgroup from which queries are being returned. If a workgroup is not specified, a list of available query execution IDs for the queries in the primary workgroup is returned.
