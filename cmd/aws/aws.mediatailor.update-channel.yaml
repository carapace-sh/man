name: update-channel
description: Updates a channel.
flags:
    --audiences=: The list of audiences defined in channel.
    --channel-name=!: The name of the channel.
    --filler-slate=: The slate used to fill gaps between programs in the schedule.
    --outputs=!: The channel's output properties.
    --time-shift-configuration=: The time-shifted viewing configuration you want to associate to the channel.
documentation:
    command: Updates a channel. For information about MediaTailor channels, see [Working with channels](https://docs.aws.amazon.com/mediatailor/latest/ug/channel-assembly-channels.html) in the *MediaTailor User Guide*.
    flag:
        audiences: The list of audiences defined in channel.
        channel-name: The name of the channel.
        filler-slate: The slate used to fill gaps between programs in the schedule. You must configure filler slate if your channel uses the `LINEAR` `PlaybackMode`. MediaTailor doesn't support filler slate for channels using the `LOOP` `PlaybackMode`.
        outputs: The channel's output properties.
        time-shift-configuration: The time-shifted viewing configuration you want to associate to the channel.
