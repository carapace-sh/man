name: execute-query
description: Execute an openCypher query.
flags:
    --explain-mode=: The explain mode parameter returns a query explain instead of the actual query results.
    --graph-identifier=!: The unique identifier of the Neptune Analytics graph.
    --language=!: The query language the query is written in.
    --parameters=: The data parameters the query can use in JSON format.
    --plan-cache=: Query plan cache is a feature that saves the query plan and reuses it on successive executions of the same query.
    --query-string=!: The query string to be executed.
    --query-timeout-milliseconds=: Specifies the query timeout duration, in milliseconds.
completion:
    flag:
        explain-mode:
            - STATIC
            - DETAILS
        language:
            - OPEN_CYPHER
        plan-cache:
            - ENABLED
            - DISABLED
            - AUTO
documentation:
    command: |-
        Execute an openCypher query.

        When invoking this operation in a Neptune Analytics cluster, the IAM user or role making the request must have a policy attached that allows one of the following IAM actions in that cluster, depending on the query:

        - neptune-graph:ReadDataViaQuery
        - neptune-graph:WriteDataViaQuery
        - neptune-graph:DeleteDataViaQuery
    flag:
        explain-mode: The explain mode parameter returns a query explain instead of the actual query results. A query explain can be used to gather insights about the query execution such as planning decisions, time spent on each operator, solutions flowing etc.
        graph-identifier: The unique identifier of the Neptune Analytics graph.
        language: The query language the query is written in. Currently only openCypher is supported.
        parameters: 'The data parameters the query can use in JSON format. For example: {"name": "john", "age": 20}. (optional)'
        plan-cache: Query plan cache is a feature that saves the query plan and reuses it on successive executions of the same query. This reduces query latency, and works for both `READ` and `UPDATE` queries. The plan cache is an LRU cache with a 5 minute TTL and a capacity of 1000.
        query-string: The query string to be executed.
        query-timeout-milliseconds: Specifies the query timeout duration, in milliseconds. (optional)
