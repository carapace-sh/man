name: remove-permission
description: Revokes the permission of another Amazon Web Services account to be able to put events to the specified event bus.
flags:
    --event-bus-name=: The name of the event bus to revoke permissions for.
    --no-remove-all-permissions&: Specifies whether to remove all permissions.
    --remove-all-permissions: Specifies whether to remove all permissions.
    --statement-id=: The statement ID corresponding to the account that is no longer allowed to put events to the default event bus.
documentation:
    command: Revokes the permission of another Amazon Web Services account to be able to put events to the specified event bus. Specify the account to revoke by the `StatementId` value that you associated with the account when you granted it permission with `PutPermission`. You can find the `StatementId` by using [DescribeEventBus](https://docs.aws.amazon.com/eventbridge/latest/APIReference/API_DescribeEventBus.html).
    flag:
        event-bus-name: The name of the event bus to revoke permissions for. If you omit this, the default event bus is used.
        remove-all-permissions: Specifies whether to remove all permissions.
        statement-id: The statement ID corresponding to the account that is no longer allowed to put events to the default event bus.
