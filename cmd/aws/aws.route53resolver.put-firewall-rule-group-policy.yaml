name: put-firewall-rule-group-policy
description: Attaches an Identity and Access Management (Amazon Web Services IAM) policy for sharing the rule group.
flags:
    --arn=!: The ARN (Amazon Resource Name) for the rule group that you want to share.
    --firewall-rule-group-policy=!: The Identity and Access Management (Amazon Web Services IAM) policy to attach to the rule group.
documentation:
    command: Attaches an Identity and Access Management (Amazon Web Services IAM) policy for sharing the rule group. You can use the policy to share the rule group using Resource Access Manager (RAM).
    flag:
        arn: The ARN (Amazon Resource Name) for the rule group that you want to share.
        firewall-rule-group-policy: The Identity and Access Management (Amazon Web Services IAM) policy to attach to the rule group.
