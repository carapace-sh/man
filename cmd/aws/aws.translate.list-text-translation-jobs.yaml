name: list-text-translation-jobs
description: Gets a list of the batch translation jobs that you have submitted.
flags:
    --filter=: The parameters that specify which batch translation jobs to retrieve.
    --max-results=: The maximum number of results to return in each page.
    --next-token=: The token to request the next page of results.
documentation:
    command: Gets a list of the batch translation jobs that you have submitted.
    flag:
        filter: The parameters that specify which batch translation jobs to retrieve. Filters include job name, job status, and submission time. You can only set one filter at a time.
        max-results: The maximum number of results to return in each page. The default value is 100.
        next-token: The token to request the next page of results.
