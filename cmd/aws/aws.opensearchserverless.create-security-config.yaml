name: create-security-config
description: Specifies a security configuration for OpenSearch Serverless.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: Unique, case-sensitive identifier to ensure idempotency of the request.
    --description=: A description of the security configuration.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --iam-federation-options=: Describes IAM federation options in the form of a key-value map.
    --iam-identity-center-options=: Describes IAM Identity Center options in the form of a key-value map.
    --name=!: The name of the security configuration.
    --saml-options=: Describes SAML options in in the form of a key-value map.
    --type=!: The type of security configuration.
completion:
    flag:
        type:
            - saml
            - iamidentitycenter
            - iamfederation
documentation:
    command: Specifies a security configuration for OpenSearch Serverless. For more information, see [SAML authentication for Amazon OpenSearch Serverless](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-saml.html).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Unique, case-sensitive identifier to ensure idempotency of the request.
        description: A description of the security configuration.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
