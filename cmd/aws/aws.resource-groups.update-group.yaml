name: update-group
description: Updates the description for an existing group.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --criticality=: The critical rank of the application group on a scale of 1 to 10, with a rank of 1 being the most critical, and a rank of 10 being least critical.
    --description=: The new description that you want to update the resource group with.
    --display-name=: The name of the application group, which you can change at any time.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --group-name=: Don't use this parameter.
    --group=: The name or the ARN of the resource group to update.
    --owner=: A name, email address or other identifier for the person or group who is considered as the owner of this application group within your organization.
documentation:
    command: |-
        Updates the description for an existing group. You cannot update the name of a resource group.

        **Minimum permissions**

        To run this command, you must have the following permissions:

        - `resource-groups:UpdateGroup`
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        criticality: The critical rank of the application group on a scale of 1 to 10, with a rank of 1 being the most critical, and a rank of 10 being least critical.
        description: The new description that you want to update the resource group with. Descriptions can contain letters, numbers, hyphens, underscores, periods, and spaces.
        display-name: The name of the application group, which you can change at any time.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        group: The name or the ARN of the resource group to update.
        group-name: Don't use this parameter. Use `Group` instead.
        owner: A name, email address or other identifier for the person or group who is considered as the owner of this application group within your organization.
