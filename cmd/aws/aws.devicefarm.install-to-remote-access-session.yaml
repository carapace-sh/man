name: install-to-remote-access-session
description: Installs an application to the device in a remote access session.
flags:
    --app-arn=!: The ARN of the app about which you are requesting information.
    --remote-access-session-arn=!: The Amazon Resource Name (ARN) of the remote access session about which you are requesting information.
documentation:
    command: Installs an application to the device in a remote access session. For Android applications, the file must be in .apk format. For iOS applications, the file must be in .ipa format.
    flag:
        app-arn: The ARN of the app about which you are requesting information.
        remote-access-session-arn: The Amazon Resource Name (ARN) of the remote access session about which you are requesting information.
