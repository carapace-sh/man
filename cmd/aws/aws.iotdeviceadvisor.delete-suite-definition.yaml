name: delete-suite-definition
description: Deletes a Device Advisor test suite.
flags:
    --suite-definition-id=!: Suite definition ID of the test suite to be deleted.
documentation:
    command: |-
        Deletes a Device Advisor test suite.

        Requires permission to access the [DeleteSuiteDefinition](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        suite-definition-id: Suite definition ID of the test suite to be deleted.
