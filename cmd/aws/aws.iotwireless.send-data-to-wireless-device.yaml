name: send-data-to-wireless-device
description: Sends a decrypted application data frame to a device.
flags:
    --id=!: The ID of the wireless device to receive the data.
    --payload-data=!: ""
    --transmit-mode=!: The transmit mode to use to send data to the wireless device.
    --wireless-metadata=: Metadata about the message request.
documentation:
    command: Sends a decrypted application data frame to a device.
    flag:
        id: The ID of the wireless device to receive the data.
        payload-data: ""
        transmit-mode: 'The transmit mode to use to send data to the wireless device. Can be: `0` for UM (unacknowledge mode) or `1` for AM (acknowledge mode).'
        wireless-metadata: Metadata about the message request.
