name: create
description: '*(ALPHA)*  Create networkMonitoringProviders.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The location id of the networkMonitoringProvider resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --provider-type=!: Type of the NetworkMonitoringProvider.
completion:
    flag:
        provider-type:
            - external
documentation:
    command: '*(ALPHA)*  Create a networkMonitoringProvider'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The location id of the networkMonitoringProvider resource.
            +
            To set the `location` attribute:
            * provide the argument `network_monitoring_provider` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        provider-type: |-
            Type of the NetworkMonitoringProvider. _PROVIDER_TYPE_ must be (only one value is supported):
            +
            *external*::: External provider.
            :::
            +
