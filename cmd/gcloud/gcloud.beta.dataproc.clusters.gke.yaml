name: gke
description: '*(BETA)*  Create Dataproc GKE-based virtual clusters.'
documentation:
    command: |-
        *(BETA)*  All interactions other than creation should be handled by
        "gcloud dataproc clusters" commands.

        ## EXAMPLES

        To create a cluster, run:

          $ gcloud beta dataproc clusters gke my-cluster --region='us-central1' --gke-cluster='my-gke-cluster'
          --spark-engine-version='latest' --pools='name=dp,roles=default'
