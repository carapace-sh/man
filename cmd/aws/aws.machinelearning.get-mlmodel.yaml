name: get-mlmodel
description: Returns an `MLModel` that includes detailed metadata, data source information, and the current status of the `MLModel`.
flags:
    --mlmodel-id=!: The ID assigned to the `MLModel` at creation.
    --verbose=: Specifies whether the `GetMLModel` operation should return `Recipe`.
documentation:
    command: |-
        Returns an `MLModel` that includes detailed metadata, data source information, and the current status of the `MLModel`.

        `GetMLModel` provides results in normal or verbose format.
    flag:
        mlmodel-id: The ID assigned to the `MLModel` at creation.
        verbose: |-
            Specifies whether the `GetMLModel` operation should return `Recipe`.

            If true, `Recipe` is returned.

            If false, `Recipe` is not returned.
