name: list-identity-pool-usage
description: Gets a list of identity pools registered with Cognito.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of results to be returned.
    --next-token=: A pagination token for obtaining the next page of results.
documentation:
    command: |-
        Gets a list of identity pools registered with Cognito.

        ListIdentityPoolUsage can only be called with developer credentials. You cannot make this API call with the temporary user credentials provided by Cognito Identity.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
