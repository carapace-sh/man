name: failover
description: '*(ALPHA)*  Failover a BigLake Iceberg REST catalog.'
hidden: true
flags:
    --conditional-failover-replication-time=: If not specified, wait for all data from the source region to replicate to the new primary region before completing the failover, with no data loss.
    --no-validate-only&: If true, the failover will be validated but not executed.
    --primary-replica=!: The primary replica region to failover to.
    --validate-only: If true, the failover will be validated but not executed.
documentation:
    command: '*(ALPHA)*  Failover a BigLake Iceberg REST catalog.'
    flag:
        conditional-failover-replication-time: If not specified, wait for all data from the source region to replicate to the new primary region before completing the failover, with no data loss. If specified, the failover will be executed immediately, accepting data loss of any data commited after the specified timestamp. This timestamp must be in UTC format, e.g. "2025-10-09T01:13:34.038262Z". See `$ gcloud topic datetimes` for more information.
        no-validate-only: If true, the failover will be validated but not executed.
        primary-replica: The primary replica region to failover to.
        validate-only: If true, the failover will be validated but not executed.
