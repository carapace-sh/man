name: describe-table-statistics
description: Returns table statistics on the database migration task, including table name, rows inserted, rows updated, and rows deleted.
flags:
    --filters=: Filters applied to table statistics.
    --marker=: An optional pagination token provided by a previous request.
    --max-records=: The maximum number of records to include in the response.
    --replication-task-arn=!: The Amazon Resource Name (ARN) of the replication task.
documentation:
    command: |-
        Returns table statistics on the database migration task, including table name, rows inserted, rows updated, and rows deleted.

        Note that the "last updated" column the DMS console only indicates the time that DMS last updated the table statistics record for a table. It does not indicate the time of the last update to the table.
    flag:
        filters: |-
            Filters applied to table statistics.

            Valid filter names: schema-name | table-name | table-state

            A combination of filters creates an AND condition where each record matches all specified filters.
        marker: An optional pagination token provided by a previous request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that the remaining results can be retrieved.

            Default: 100

            Constraints: Minimum 20, maximum 500.
        replication-task-arn: The Amazon Resource Name (ARN) of the replication task.
