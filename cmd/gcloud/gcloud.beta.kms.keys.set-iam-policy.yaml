name: set-iam-policy
description: '*(BETA)*  Set the IAM policy for a key.'
flags:
    --keyring=: The KMS keyring of the key.
    --location=: The Google Cloud location for the key.
documentation:
    command: |-
        *(BETA)*  Sets the IAM policy for the given key as defined in a JSON or YAML file.

        See https://cloud.google.com/iam/docs/managing-policies for details of
        the policy file format and contents.

        ## EXAMPLES
        The following command will read am IAM policy defined in a JSON file
        'policy.json' and set it for the key `frodo` with the keyring
        `fellowship` and location `global`:

          $ gcloud beta kms keys set-iam-policy frodo policy.json --keyring=fellowship --location=global
    flag:
        keyring: |-
            The KMS keyring of the key.
            +
            To set the `keyring` attribute:
            * provide the argument `key` on the command line with a fully specified name;
            * provide the argument `--keyring` on the command line.
        location: |-
            The Google Cloud location for the key.
            +
            To set the `location` attribute:
            * provide the argument `key` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
