name: bulk-export
description: '*(ALPHA)*  Export configurations for all assets within the specified project, organization, or folder.'
flags:
    --folder=: Folder ID
    --on-error=: Determines behavior when a recoverable error is encountered while exporting a resource.
    --organization=: Organization ID
    --path=: Path of the directory or file to output configuration(s).
    --resource-format=: Format of the configuration to export.
    --resource-types-file=: A comma (',') or newline ('\n') separated file containing the list of
    --resource-types=: List of Config Connector KRM Kinds to export.
    --storage-path=: 'Google Cloud Storage path where a Cloud Asset Inventory export will be stored, example: `gs://your-bucket-name/your/prefix/path`'
completion:
    flag:
        on-error:
            - continue
            - halt
            - ignore
        resource-format:
            - krm
            - terraform
documentation:
    command: '*(ALPHA)*  Export configurations for all assets within the specified project, organization, or folder.'
    flag:
        folder: Folder ID
        on-error: 'Determines behavior when a recoverable error is encountered while exporting a resource. To stop execution when encountering an error, specify "halt". To log errors when encountered and continue the export, specify "continue". To continue when errors are encountered without logging, specify "ignore". _ON_ERROR_ must be one of: *continue*, *halt*, *ignore*.'
        organization: Organization ID
        path: Path of the directory or file to output configuration(s). To output configurations to stdout, specify "--path=-".
        resource-format: 'Format of the configuration to export. Available configuration formats are Kubernetes Resource Model YAML (krm) or Terraform HCL (terraform). Command defaults to "krm". _RESOURCE_FORMAT_ must be one of: *krm*, *terraform*.'
        resource-types: |-
            List of Config Connector KRM Kinds to export.
              For a full list of supported resource types for a given parent scope run:
            +
              $ {parent_command} list-resource-types --[project|organization|folder]=<PARENT>
        resource-types-file: |-
            A comma (',') or newline ('\n') separated file containing the list of
                  Config Connector KRM Kinds to export.
              For a full list of supported resource types for a given parent scope run:
            +
              $ {parent_command} list-resource-types --[project|organization|folder]=<PARENT>
            +
            Use a full or relative path to a local file containing the value of resource_types_file.
        storage-path: 'Google Cloud Storage path where a Cloud Asset Inventory export will be stored, example: `gs://your-bucket-name/your/prefix/path`'
