name: describe-pod-identity-association
description: Returns descriptive information about an EKS Pod Identity association.
flags:
    --association-id=!: The ID of the association that you want the description of.
    --cluster-name=!: The name of the cluster that the association is in.
documentation:
    command: |-
        Returns descriptive information about an EKS Pod Identity association.

        This action requires the ID of the association. You can get the ID from the response to the `CreatePodIdentityAssocation` for newly created associations. Or, you can list the IDs for associations with `ListPodIdentityAssociations` and filter the list by namespace or service account.
    flag:
        association-id: The ID of the association that you want the description of.
        cluster-name: The name of the cluster that the association is in.
