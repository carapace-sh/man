name: delete-user
description: Deletes the specified user from a Simple AD or Microsoft AD directory.
flags:
    --authentication-token=: Amazon WorkDocs authentication token.
    --user-id=!: The ID of the user.
documentation:
    command: |-
        Deletes the specified user from a Simple AD or Microsoft AD directory.

        Deleting a user immediately and permanently deletes all content in that user's folder structure. Site retention policies do NOT apply to this type of deletion.
    flag:
        authentication-token: Amazon WorkDocs authentication token. Do not set this field when using administrative API actions, as in accessing the API using Amazon Web Services credentials.
        user-id: The ID of the user.
