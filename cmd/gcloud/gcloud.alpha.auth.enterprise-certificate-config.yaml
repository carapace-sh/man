name: enterprise-certificate-config
description: '*(ALPHA)*  Manage enterprise certificate configurations.'
documentation:
    command: |-
        *(ALPHA)*  Currently only create is implemented.

        The gcloud alpha auth enterprise-certificate-config group lets you create enterprise certificate configurations.
        This configuration will be used by gcloud to communicate with the
        enterprise-certificate-proxy.

        See more details at `gcloud topic client-certificate`.
