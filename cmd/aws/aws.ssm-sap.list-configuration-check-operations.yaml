name: list-configuration-check-operations
description: Lists the configuration check operations performed by AWS Systems Manager for SAP.
flags:
    --application-id=!: The ID of the application.
    --filters=: The filters of an operation.
    --list-mode=: The mode for listing configuration check operations.
    --max-results=: The maximum number of results to return with a single call.
    --next-token=: The token for the next page of results.
completion:
    flag:
        list-mode:
            - ALL_OPERATIONS
            - LATEST_PER_CHECK
documentation:
    command: Lists the configuration check operations performed by AWS Systems Manager for SAP.
    flag:
        application-id: The ID of the application.
        filters: The filters of an operation.
        list-mode: |-
            The mode for listing configuration check operations. Defaults to "LATEST\_PER\_CHECK".

            - LATEST\_PER\_CHECK - Will list the latest configuration check operation per check type.
            - ALL\_OPERATIONS - Will list all configuration check operations performed on the application.
        max-results: The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned nextToken value.
        next-token: The token for the next page of results.
