name: execute-gremlin-profile-query
description: Executes a Gremlin Profile query, which runs a specified traversal, collects various metrics about the run, and produces a profile report as output.
flags:
    --chop=: If non-zero, causes the results string to be truncated at that number of characters.
    --gremlin-query=!: The Gremlin query string to profile.
    --index-ops: If this flag is set to `TRUE`, the results include a detailed report of all index operations that took place during query execution and serialization.
    --no-index-ops&: If this flag is set to `TRUE`, the results include a detailed report of all index operations that took place during query execution and serialization.
    --no-results&: If this flag is set to `TRUE`, the query results are gathered and displayed as part of the profile report.
    --results: If this flag is set to `TRUE`, the query results are gathered and displayed as part of the profile report.
    --serializer=: If non-null, the gathered results are returned in a serialized response message in the format specified by this parameter.
documentation:
    command: |-
        Executes a Gremlin Profile query, which runs a specified traversal, collects various metrics about the run, and produces a profile report as output. See [Gremlin profile API in Neptune](https://docs.aws.amazon.com/neptune/latest/userguide/gremlin-profile-api.html) for details.

        When invoking this operation in a Neptune cluster that has IAM authentication enabled, the IAM user or role making the request must have a policy attached that allows the [neptune-db:ReadDataViaQuery](https://docs.aws.amazon.com/neptune/latest/userguide/iam-dp-actions.html#readdataviaquery) IAM action in that cluster.

        Note that the [neptune-db:QueryLanguage:Gremlin](https://docs.aws.amazon.com/neptune/latest/userguide/iam-data-condition-keys.html#iam-neptune-condition-keys) IAM condition key can be used in the policy document to restrict the use of Gremlin queries (see [Condition keys available in Neptune IAM data-access policy statements](https://docs.aws.amazon.com/neptune/latest/userguide/iam-data-condition-keys.html)).
    flag:
        chop: If non-zero, causes the results string to be truncated at that number of characters. If set to zero, the string contains all the results.
        gremlin-query: The Gremlin query string to profile.
        index-ops: If this flag is set to `TRUE`, the results include a detailed report of all index operations that took place during query execution and serialization.
        results: If this flag is set to `TRUE`, the query results are gathered and displayed as part of the profile report. If `FALSE`, only the result count is displayed.
        serializer: If non-null, the gathered results are returned in a serialized response message in the format specified by this parameter. See [Gremlin profile API in Neptune](https://docs.aws.amazon.com/neptune/latest/userguide/gremlin-profile-api.html) for more information.
