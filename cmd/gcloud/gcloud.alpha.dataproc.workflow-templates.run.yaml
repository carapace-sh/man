name: run
description: '*(ALPHA)*  *(DEPRECATED)*  Run a workflow template.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: Dataproc region for the template.
    --timeout=&: Client side timeout on how long to wait for Dataproc operations.
documentation:
    command: |+
        *(ALPHA)*  *(DEPRECATED)*  Run a workflow template.

        Workflow template run command is deprecated, please use instantiate command: "gcloud beta dataproc workflow-templates instantiate"

    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            Dataproc region for the template. Each Dataproc region constitutes an independent resource namespace constrained to deploying instances into Compute Engine zones inside the region. Overrides the default `dataproc/region` property value for this command invocation.
            +
            To set the `region` attribute:
            * provide the argument `template` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `dataproc/region`.
        timeout: Client side timeout on how long to wait for Dataproc operations. See $ gcloud topic datetimes for information on duration formats.
