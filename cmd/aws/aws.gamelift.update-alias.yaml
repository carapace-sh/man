name: update-alias
description: '**This API works with the following fleet types:** EC2, Anywhere, Container'
flags:
    --alias-id=!: A unique identifier for the alias that you want to update.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A human-readable description of the alias.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=: A descriptive label that is associated with an alias.
    --routing-strategy=: The routing configuration, including routing type and fleet target, for the alias.
documentation:
    command: |-
        **This API works with the following fleet types:** EC2, Anywhere, Container

        Updates properties for an alias. Specify the unique identifier of the alias to be updated and the new property values.

        When reassigning an alias to a new fleet, provide an updated routing strategy. If successful, the updated alias record is returned.

        **Related actions**

        [All APIs by task](https://docs.aws.amazon.com/gamelift/latest/developerguide/reference-awssdk.html#reference-awssdk-resources-fleets)
    flag:
        alias-id: A unique identifier for the alias that you want to update. You can use either the alias ID or ARN value.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A human-readable description of the alias.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: A descriptive label that is associated with an alias. Alias names do not need to be unique.
        routing-strategy: The routing configuration, including routing type and fleet target, for the alias.
