name: cancel
description: Cancel a workflow execution.
flags:
    --location=: The Cloud location for the execution.
    --workflow=: The Cloud Workflow for the execution.
documentation:
    command: |
        Cancel a workflow execution.
    flag:
        location: |-
            The Cloud location for the execution. Alternatively, set the property [workflows/location].
            +

            To set the `location` attribute:
            * provide the argument `execution` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `workflows/location`.
        workflow: |-
            The Cloud Workflow for the execution.
            +

            To set the `workflow` attribute:
            * provide the argument `execution` on the command line with a fully specified name;
            * provide the argument `--workflow` on the command line.
