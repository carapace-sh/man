name: list-tags-for-resource
description: Lists all resource tags associated with an OpenSearch Ingestion pipeline.
flags:
    --arn=!: The Amazon Resource Name (ARN) of the pipeline to retrieve tags for.
documentation:
    command: Lists all resource tags associated with an OpenSearch Ingestion pipeline. For more information, see [Tagging Amazon OpenSearch Ingestion pipelines](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/tag-pipeline.html).
    flag:
        arn: The Amazon Resource Name (ARN) of the pipeline to retrieve tags for.
