name: get-bot-versions
description: Gets information about all of the versions of a bot.
flags:
    --max-results=: The maximum number of bot versions to return in the response.
    --name=!: The name of the bot for which versions should be returned.
    --next-token=: A pagination token for fetching the next page of bot versions.
documentation:
    command: |-
        Gets information about all of the versions of a bot.

        The `GetBotVersions` operation returns a `BotMetadata` object for each version of a bot. For example, if a bot has three numbered versions, the `GetBotVersions` operation returns four `BotMetadata` objects in the response, one for each numbered version and one for the `$LATEST` version.

        The `GetBotVersions` operation always returns at least one version, the `$LATEST` version.

        This operation requires permissions for the `lex:GetBotVersions` action.
    flag:
        max-results: The maximum number of bot versions to return in the response. The default is 10.
        name: The name of the bot for which versions should be returned.
        next-token: A pagination token for fetching the next page of bot versions. If the response to this call is truncated, Amazon Lex returns a pagination token in the response. To fetch the next page of versions, specify the pagination token in the next request.
