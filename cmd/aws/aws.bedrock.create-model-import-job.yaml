name: create-model-import-job
description: Creates a model import job to import model that you have customized in other environments, such as Amazon SageMaker.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=: A unique, case-sensitive identifier to ensure that the API request completes no more than one time.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --imported-model-kms-key-id=: The imported model is encrypted at rest using this key.
    --imported-model-name=!: The name of the imported model.
    --imported-model-tags=:
        description: Tags to attach to the imported model.
        nargs: -1
    --job-name=!: The name of the import job.
    --job-tags=:
        description: Tags to attach to this import job.
        nargs: -1
    --model-data-source=!: The data source for the imported model.
    --role-arn=!: The Amazon Resource Name (ARN) of the model import job.
    --vpc-config=: VPC configuration parameters for the private Virtual Private Cloud (VPC) that contains the resources you are using for the import job.
documentation:
    command: Creates a model import job to import model that you have customized in other environments, such as Amazon SageMaker. For more information, see [Import a customized model](https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-import-model.html)
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: A unique, case-sensitive identifier to ensure that the API request completes no more than one time. If this token matches a previous request, Amazon Bedrock ignores the request, but does not return an error. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html).
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        imported-model-kms-key-id: The imported model is encrypted at rest using this key.
        imported-model-name: The name of the imported model.
        imported-model-tags: Tags to attach to the imported model.
        job-name: The name of the import job.
        job-tags: Tags to attach to this import job.
        model-data-source: The data source for the imported model.
        role-arn: The Amazon Resource Name (ARN) of the model import job.
        vpc-config: VPC configuration parameters for the private Virtual Private Cloud (VPC) that contains the resources you are using for the import job.
