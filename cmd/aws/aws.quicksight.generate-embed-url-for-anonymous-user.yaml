name: generate-embed-url-for-anonymous-user
description: Generates an embed URL that you can use to embed an Amazon Quick Suite dashboard or visual in your website, without having to register any reader users.
flags:
    --allowed-domains=: The domains that you want to add to the allow list for access to the generated URL that is then embedded.
    --authorized-resource-arns=!: The Amazon Resource Names (ARNs) for the Quick Sight resources that the user is authorized to access during the lifetime of the session.
    --aws-account-id=!: The ID for the Amazon Web Services account that contains the dashboard that you're embedding.
    --experience-configuration=!: The configuration of the experience that you are embedding.
    --namespace=!: The Amazon Quick Sight namespace that the anonymous user virtually belongs to.
    --session-lifetime-in-minutes=: How many minutes the session is valid.
    --session-tags=: The session tags used for row-level security.
documentation:
    command: |-
        Generates an embed URL that you can use to embed an Amazon Quick Suite dashboard or visual in your website, without having to register any reader users. Before you use this action, make sure that you have configured the dashboards and permissions.

        The following rules apply to the generated URL:

        - It contains a temporary bearer token. It is valid for 5 minutes after it is generated. Once redeemed within this period, it cannot be re-used again.
        - The URL validity period should not be confused with the actual session lifetime that can be customized using the `SessionLifetimeInMinutes` parameter. The resulting user session is valid for 15 minutes (minimum) to 10 hours (maximum). The default session duration is 10 hours.
        - You are charged only when the URL is used or there is interaction with Amazon Quick Suite.

        For more information, see [Embedded Analytics](https://docs.aws.amazon.com/quicksight/latest/user/embedded-analytics.html) in the *Amazon Quick Suite User Guide*.

        For more information about the high-level steps for embedding and for an interactive demo of the ways you can customize embedding, visit the [Amazon Quick Suite Developer Portal](https://docs.aws.amazon.com/quicksight/latest/user/quicksight-dev-portal.html).
    flag:
        allowed-domains: |-
            The domains that you want to add to the allow list for access to the generated URL that is then embedded. This optional parameter overrides the static domains that are configured in the Manage Quick Sight menu in the Amazon Quick Sight console. Instead, it allows only the domains that you include in this parameter. You can list up to three domains or subdomains in each API call.

            To include all subdomains under a specific domain to the allow list, use `*`. For example, `https://*.sapp.amazon.com` includes all subdomains under `https://sapp.amazon.com`.
        authorized-resource-arns: |-
            The Amazon Resource Names (ARNs) for the Quick Sight resources that the user is authorized to access during the lifetime of the session.

            If you choose `Dashboard` embedding experience, pass the list of dashboard ARNs in the account that you want the user to be able to view.

            If you want to make changes to the theme of your embedded content, pass a list of theme ARNs that the anonymous users need access to.

            Currently, you can pass up to 25 theme ARNs in each API call.
        aws-account-id: The ID for the Amazon Web Services account that contains the dashboard that you're embedding.
        experience-configuration: The configuration of the experience that you are embedding.
        namespace: The Amazon Quick Sight namespace that the anonymous user virtually belongs to. If you are not using an Amazon Quick Suite custom namespace, set this to `default`.
        session-lifetime-in-minutes: How many minutes the session is valid. The session lifetime must be in \[15-600] minutes range.
        session-tags: |-
            The session tags used for row-level security. Before you use this parameter, make sure that you have configured the relevant datasets using the `DataSet$RowLevelPermissionTagConfiguration` parameter so that session tags can be used to provide row-level security.

            These are not the tags used for the Amazon Web Services resource tagging feature. For more information, see [Using Row-Level Security (RLS) with Tags](https://docs.aws.amazon.com/quicksight/latest/user/quicksight-dev-rls-tags.html)in the *Amazon Quick Sight User Guide*.
