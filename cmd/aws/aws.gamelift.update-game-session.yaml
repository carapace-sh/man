name: update-game-session
description: |-
    **This API works with the following fleet types:** EC2, Anywhere, Container

    Updates the mutable properties of a game session.
flags:
    --game-properties=: A set of key-value pairs that can store custom data in a game session.
    --game-session-id=!: A unique identifier for the game session to update.
    --maximum-player-session-count=: The maximum number of players that can be connected simultaneously to the game session.
    --name=: A descriptive label that is associated with a game session.
    --player-session-creation-policy=: A policy that determines whether the game session is accepting new players.
    --protection-policy=: Game session protection policy to apply to this game session only.
completion:
    flag:
        player-session-creation-policy:
            - ACCEPT_ALL
            - DENY_ALL
        protection-policy:
            - NoProtection
            - FullProtection
documentation:
    command: |-
        **This API works with the following fleet types:** EC2, Anywhere, Container

        Updates the mutable properties of a game session.

        To update a game session, specify the game session ID and the values you want to change.

        If successful, the updated `GameSession` object is returned.

        [All APIs by task](https://docs.aws.amazon.com/gamelift/latest/developerguide/reference-awssdk.html#reference-awssdk-resources-fleets)
    flag:
        game-properties: 'A set of key-value pairs that can store custom data in a game session. For example: `{"Key": "difficulty", "Value": "novice"}`. You can use this parameter to modify game properties in an active game session. This action adds new properties and modifies existing properties. There is no way to delete properties. For an example, see [Update the value of a game property](https://docs.aws.amazon.com/gamelift/latest/developerguide/gamelift-sdk-client-api.html#game-properties-update).'
        game-session-id: A unique identifier for the game session to update.
        maximum-player-session-count: The maximum number of players that can be connected simultaneously to the game session.
        name: A descriptive label that is associated with a game session. Session names do not need to be unique.
        player-session-creation-policy: A policy that determines whether the game session is accepting new players.
        protection-policy: |-
            Game session protection policy to apply to this game session only.

            - `NoProtection` -- The game session can be terminated during a scale-down event.
            - `FullProtection` -- If the game session is in an `ACTIVE` status, it cannot be terminated during a scale-down event.
