name: create-command
description: Creates a command.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --command-id=!: A unique identifier for the command.
    --description=: A short text decription of the command.
    --display-name=: The user-friendly name in the console for the command.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --mandatory-parameters=: A list of parameters that are required by the `StartCommandExecution` API.
    --namespace=: The namespace of the command.
    --payload=: The payload object for the command.
    --role-arn=: The IAM role that you must provide when using the `AWS-IoT-FleetWise` namespace.
    --tags=: Name-value pairs that are used as metadata to manage a command.
completion:
    flag:
        namespace:
            - AWS-IoT
            - AWS-IoT-FleetWise
documentation:
    command: Creates a command. A command contains reusable configurations that can be applied before they are sent to the devices.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        command-id: A unique identifier for the command. We recommend using UUID. Alpha-numeric characters, hyphens, and underscores are valid for use here.
        description: A short text decription of the command.
        display-name: The user-friendly name in the console for the command. This name doesn't have to be unique. You can update the user-friendly name after you define it.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        mandatory-parameters: A list of parameters that are required by the `StartCommandExecution` API. These parameters need to be specified only when using the `AWS-IoT-FleetWise` namespace. You can either specify them here or when running the command using the `StartCommandExecution` API.
        namespace: The namespace of the command. The MQTT reserved topics and validations will be used for command executions according to the namespace setting.
        payload: |-
            The payload object for the command. You must specify this information when using the `AWS-IoT` namespace.

            You can upload a static payload file from your local storage that contains the instructions for the device to process. The payload file can use any format. To make sure that the device correctly interprets the payload, we recommend you to specify the payload content type.
        role-arn: The IAM role that you must provide when using the `AWS-IoT-FleetWise` namespace. The role grants IoT Device Management the permission to access IoT FleetWise resources for generating the payload for the command. This field is not required when you use the `AWS-IoT` namespace.
        tags: Name-value pairs that are used as metadata to manage a command.
