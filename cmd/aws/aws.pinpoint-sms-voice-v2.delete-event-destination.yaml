name: delete-event-destination
description: Deletes an existing event destination.
flags:
    --configuration-set-name=!: The name of the configuration set or the configuration set's Amazon Resource Name (ARN) to remove the event destination from.
    --event-destination-name=!: The name of the event destination to delete.
documentation:
    command: |-
        Deletes an existing event destination.

        An event destination is a location where you send response information about the messages that you send. For example, when a message is delivered successfully, you can send information about that event to an Amazon CloudWatch destination, or send notifications to endpoints that are subscribed to an Amazon SNS topic.
    flag:
        configuration-set-name: The name of the configuration set or the configuration set's Amazon Resource Name (ARN) to remove the event destination from. The ConfigurateSetName and ConfigurationSetArn can be found using the [DescribeConfigurationSets]() action.
        event-destination-name: The name of the event destination to delete.
