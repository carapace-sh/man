name: get-resource-position
description: Get the position information for a given wireless device or a wireless gateway resource.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --resource-identifier=!: The identifier of the resource for which position information is retrieved.
    --resource-type=!: The type of resource for which position information is retrieved, which can be a wireless device or a wireless gateway.
completion:
    flag:
        resource-type:
            - WirelessDevice
            - WirelessGateway
documentation:
    command: Get the position information for a given wireless device or a wireless gateway resource. The position information uses the [World Geodetic System (WGS84)](https://gisgeography.com/wgs84-world-geodetic-system/).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        resource-identifier: The identifier of the resource for which position information is retrieved. It can be the wireless device ID or the wireless gateway ID, depending on the resource type.
        resource-type: The type of resource for which position information is retrieved, which can be a wireless device or a wireless gateway.
