name: delete-user
description: Deletes a user from the user pool.
flags:
    --authentication-type=!: The authentication type for the user.
    --user-name=!: The email address of the user.
completion:
    flag:
        authentication-type:
            - API
            - SAML
            - USERPOOL
            - AWS_AD
documentation:
    command: Deletes a user from the user pool.
    flag:
        authentication-type: The authentication type for the user. You must specify USERPOOL.
        user-name: |-
            The email address of the user.

            Users' email addresses are case-sensitive.
