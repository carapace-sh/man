name: get-status
description: '*(ALPHA)*  Get status of a Compute Engine router.'
flags:
    --region=: Region of the router to describe.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute routers get-status* displays all runtime data associated with a Compute Engine
        router.
    flag:
        region: |-
            Region of the router to describe. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
