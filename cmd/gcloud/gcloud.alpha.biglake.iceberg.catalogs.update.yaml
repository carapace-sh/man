name: update
description: '*(ALPHA)*  Update a BigLake Iceberg REST catalog.'
flags:
    --credential-mode=: Credential mode to create the catalog with.
completion:
    flag:
        credential-mode:
            - end-user
            - vended-credentials
documentation:
    command: '*(ALPHA)*  Update a BigLake Iceberg REST catalog.'
    flag:
        credential-mode: |-
            Credential mode to create the catalog with. _CREDENTIAL_MODE_ must be one of:
            +
            *end-user*::: Use end user credentials to access the catalog.
            *vended-credentials*::: Use vended credentials to access the catalog.
            :::
            +
