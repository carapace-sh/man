name: create
description: '*(ALPHA)*  Create a new artifact guard connector.'
hidden: true
flags:
    --description=: Description of the connector.
    --display-name=: User-specified name of the connector.
    --location=: ID of the location where the resource exists (for example, global).
    --organization=: (Optional) If the full resource name isn't provided e.g. organizations/123, then provide the
    --pipeline-type=!: The type of pipeline for which connector is being created.
completion:
    flag:
        pipeline-type:
            - github-actions
            - google-cloud-build
            - jenkins-pipeline
            - pipeline-type-unspecified
documentation:
    command: |
        *(ALPHA)*  Create a new artifact guard connector. Connectors are tags for images. When passed from CI
        pipeline to the Artifact Guard service, it is used to decide which policies need to be run
        against the image being built in the CI pipeline.
    flag:
        description: Description of the connector.
        display-name: User-specified name of the connector.
        location: |-
            ID of the location where the resource exists (for example, global).
            +

            To set the `location` attribute:
            * provide the argument `connector` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        organization: |-
            (Optional) If the full resource name isn't provided e.g. organizations/123, then provide the
            organization id which is the suffix of the organization. Example: organizations/123, the id is
            123.
            +

            To set the `organization` attribute:
            * provide the argument `connector` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
        pipeline-type: 'The type of pipeline for which connector is being created. _PIPELINE_TYPE_ must be one of: *github-actions*, *google-cloud-build*, *jenkins-pipeline*, *pipeline-type-unspecified*.'
