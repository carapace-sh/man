name: describe
description: '*(BETA)*  View Cloud DNS related information for a project.'
flags:
    --location=: Specifies the desired service location the request is sent to.
documentation:
    command: |-
        *(BETA)*  This command displays Cloud DNS related information for your project including
        quotas for various resources and operations.

        ## EXAMPLES

        To display Cloud DNS related information for your project, run:

          $ gcloud beta dns project-info describe my_project_id

        To display Cloud DNS related information for your project in us-east1-c, run:

          $ gcloud beta dns project-info describe my_project_id --location=us-east1-c
    flag:
        location: Specifies the desired service location the request is sent to. Defaults to Cloud DNS global service. Use --location=global if you want to target the global service.
