            This may  not  be  specified  along with --cli-input-yaml.
        configuration-set-name: The name of the configuration set or the configuration set Amazon Resource Name (ARN) to delete the default sender ID from. The ConfigurationSetName and ConfigurationSetArn can be found using the [DescribeConfigurationSets]() action.
