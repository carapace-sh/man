name: list-cost-allocation-tags
description: Get a list of cost allocation tags.
flags:
    --max-results=: The maximum number of objects that are returned for this request.
    --next-token=: The token to retrieve the next set of results.
    --status=: The status of cost allocation tag keys that are returned for this request.
    --tag-keys=: The list of cost allocation tag keys that are returned for this request.
    --type=: The type of `CostAllocationTag` object that are returned for this request.
completion:
    flag:
        status:
            - Active
            - Inactive
        type:
            - AWSGenerated
            - UserDefined
documentation:
    command: Get a list of cost allocation tags. All inputs in the API are optional and serve as filters. By default, all cost allocation tags are returned.
    flag:
        max-results: The maximum number of objects that are returned for this request. By default, the request returns 100 results.
        next-token: The token to retrieve the next set of results. Amazon Web Services provides the token when the response from a previous call has more results than the maximum page size.
        status: The status of cost allocation tag keys that are returned for this request.
        tag-keys: The list of cost allocation tag keys that are returned for this request.
        type: The type of `CostAllocationTag` object that are returned for this request. The `AWSGenerated` type tags are tags that Amazon Web Services defines and applies to support Amazon Web Services resources for cost allocation purposes. The `UserDefined` type tags are tags that you define, create, and apply to resources.
