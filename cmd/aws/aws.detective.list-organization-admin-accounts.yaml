name: list-organization-admin-accounts
description: Returns information about the Detective administrator account for an organization.
flags:
    --max-results=: The maximum number of results to return.
    --next-token=: For requests to get the next page of results, the pagination token that was returned with the previous set of results.
documentation:
    command: Returns information about the Detective administrator account for an organization. Can only be called by the organization management account.
    flag:
        max-results: The maximum number of results to return.
        next-token: For requests to get the next page of results, the pagination token that was returned with the previous set of results. The initial request does not include a pagination token.
