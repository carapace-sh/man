name: create-dataset-content
description: Creates the content of a dataset by applying a `queryAction` (a SQL query) or a `containerAction` (executing a containerized application).
flags:
    --dataset-name=!: The name of the dataset.
    --version-id=: The version ID of the dataset content.
documentation:
    command: Creates the content of a dataset by applying a `queryAction` (a SQL query) or a `containerAction` (executing a containerized application).
    flag:
        dataset-name: The name of the dataset.
        version-id: The version ID of the dataset content. To specify `versionId` for a dataset content, the dataset must use a [DeltaTimer](https://docs.aws.amazon.com/iotanalytics/latest/APIReference/API_DeltaTime.html) filter.
