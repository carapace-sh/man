name: get-data-source
description: Returns a `DataSource` that includes metadata and data file information, as well as the current status of the `DataSource`.
flags:
    --data-source-id=!: The ID assigned to the `DataSource` at creation.
    --verbose=: Specifies whether the `GetDataSource` operation should return `DataSourceSchema`.
documentation:
    command: |-
        Returns a `DataSource` that includes metadata and data file information, as well as the current status of the `DataSource`.

        `GetDataSource` provides results in normal or verbose format. The verbose format adds the schema description and the list of files pointed to by the DataSource to the normal format.
    flag:
        data-source-id: The ID assigned to the `DataSource` at creation.
        verbose: |-
            Specifies whether the `GetDataSource` operation should return `DataSourceSchema`.

            If true, `DataSourceSchema` is returned.

            If false, `DataSourceSchema` is not returned.
