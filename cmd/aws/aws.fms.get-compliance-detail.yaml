name: get-compliance-detail
description: Returns detailed compliance information about the specified member account.
flags:
    --member-account=!: The Amazon Web Services account that owns the resources that you want to get the details for.
    --policy-id=!: The ID of the policy that you want to get the details for.
documentation:
    command: |-
        Returns detailed compliance information about the specified member account. Details include resources that are in and out of compliance with the specified policy.

        The reasons for resources being considered compliant depend on the Firewall Manager policy type.
    flag:
        member-account: The Amazon Web Services account that owns the resources that you want to get the details for.
        policy-id: The ID of the policy that you want to get the details for. `PolicyId` is returned by `PutPolicy` and by `ListPolicies`.
