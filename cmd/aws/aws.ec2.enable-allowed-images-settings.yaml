name: enable-allowed-images-settings
description: Enables Allowed AMIs for your account in the specified Amazon Web Services Region.
flags:
    --allowed-images-settings-state=!: Specify `enabled` to apply the image criteria specified by the Allowed AMIs settings.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
completion:
    flag:
        allowed-images-settings-state:
            - enabled
            - audit-mode
documentation:
    command: "Enables Allowed AMIs for your account in the specified Amazon Web Services Region. Two values are accepted:\n\n- `enabled`: The image criteria in your Allowed AMIs settings are applied. As a result, only AMIs matching these criteria are discoverable and can be used by your account to launch instances.\n- `audit-mode`: The image criteria in your Allowed AMIs settings are not applied. No restrictions are placed on AMI discoverability or usage. Users in your account can launch instances using any public AMI or AMI shared with your account.\n  \n  The purpose of `audit-mode` is to indicate which AMIs will be affected when Allowed AMIs is `enabled`. In `audit-mode`, each AMI displays either `\"ImageAllowed\": true` or `\"ImageAllowed\": false` to indicate whether the AMI will be discoverable and available to users in the account when Allowed AMIs is enabled.\n\nThe Allowed AMIs feature does not restrict the AMIs owned by your account. Regardless of the criteria you set, the AMIs created by your account will always be discoverable and usable by users in your account.\n\nFor more information, see [Control the discovery and use of AMIs in Amazon EC2 with Allowed AMIs](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-allowed-amis.html) in *Amazon EC2 User Guide*."
    flag:
        allowed-images-settings-state: Specify `enabled` to apply the image criteria specified by the Allowed AMIs settings. Specify `audit-mode` so that you can check which AMIs will be allowed or not allowed by the image criteria.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
