name: create-knowledge-base
description: Creates a knowledge base.
flags:
    --client-token=: A unique, case-sensitive identifier to ensure that the API request completes no more than one time.
    --description=: A description of the knowledge base.
    --knowledge-base-configuration=!: Contains details about the embeddings model used for the knowledge base.
    --name=!: A name for the knowledge base.
    --role-arn=!: The Amazon Resource Name (ARN) of the IAM role with permissions to invoke API operations on the knowledge base.
    --storage-configuration=: Contains details about the configuration of the vector database used for the knowledge base.
    --tags=: Specify the key-value pairs for the tags that you want to attach to your knowledge base in this object.
documentation:
    command: "Creates a knowledge base. A knowledge base contains your data sources so that Large Language Models (LLMs) can use your data. To create a knowledge base, you must first set up your data sources and configure a supported vector store. For more information, see [Set up a knowledge base](https://docs.aws.amazon.com/bedrock/latest/userguide/knowlege-base-prereq.html).\n\nIf you prefer to let Amazon Bedrock create and manage a vector store for you in Amazon OpenSearch Service, use the console. For more information, see [Create a knowledge base](https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-create).\n\n- Provide the `name` and an optional `description`.\n- Provide the Amazon Resource Name (ARN) with permissions to create a knowledge base in the `roleArn` field.\n- Provide the embedding model to use in the `embeddingModelArn` field in the `knowledgeBaseConfiguration` object.\n- Provide the configuration for your vector store in the `storageConfiguration` object.\n  \n  - For an Amazon OpenSearch Service database, use the `opensearchServerlessConfiguration` object. For more information, see [Create a vector store in Amazon OpenSearch Service](https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup-oss.html).\n  - For an Amazon Aurora database, use the `RdsConfiguration` object. For more information, see [Create a vector store in Amazon Aurora](https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup-rds.html).\n  - For a Pinecone database, use the `pineconeConfiguration` object. For more information, see [Create a vector store in Pinecone](https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup-pinecone.html).\n  - For a Redis Enterprise Cloud database, use the `redisEnterpriseCloudConfiguration` object. For more information, see [Create a vector store in Redis Enterprise Cloud](https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-setup-redis.html)."
    flag:
        client-token: A unique, case-sensitive identifier to ensure that the API request completes no more than one time. If this token matches a previous request, Amazon Bedrock ignores the request, but does not return an error. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html).
        description: A description of the knowledge base.
        knowledge-base-configuration: Contains details about the embeddings model used for the knowledge base.
        name: A name for the knowledge base.
        role-arn: The Amazon Resource Name (ARN) of the IAM role with permissions to invoke API operations on the knowledge base.
        storage-configuration: Contains details about the configuration of the vector database used for the knowledge base.
        tags: Specify the key-value pairs for the tags that you want to attach to your knowledge base in this object.
