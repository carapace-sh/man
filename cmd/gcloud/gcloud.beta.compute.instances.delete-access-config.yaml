name: delete-access-config
description: '*(BETA)*  Delete an access configuration from a virtual machine network interface.'
flags:
    --access-config-name=: Specifies the name of the access configuration to delete.
    --network-interface=: Specifies the name of the network interface from which to delete the
    --zone=: Zone of the instance to operate on.
documentation:
    command: |
        *(BETA)*  *gcloud beta compute instances delete-access-config* is used to delete access configurations from network
        interfaces of Compute Engine virtual machines. Access
        configurations let you assign a public, external IP to a virtual
        machine. The delete-access-config operation removes external IP from
        the instance interface. If there is traffic routed to the external IP,
        after deleting the access config operation, traffic to the external IP
        will not reach the VM anymore.
    flag:
        access-config-name: |-
            Specifies the name of the access configuration to delete.
            ``external-nat'' is used as the default if this flag is not provided.
        network-interface: |-
            Specifies the name of the network interface from which to delete the
            access configuration. If this is not provided, then ``nic0'' is used
            as the default.
        zone: |-
            Zone of the instance to operate on. If not specified, you might be prompted to select a zone (interactive mode
            only). `gcloud` attempts to identify the appropriate zone by searching for
            resources in your currently active project. If the zone cannot be determined,
            `gcloud` prompts you for a selection with all available Google Cloud Platform
            zones.
            +
            To avoid prompting when this flag is omitted, the user can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
