name: delete-graph
description: Deletes the specified graph.
flags:
    --graph-identifier=!: The unique identifier of the Neptune Analytics graph.
    --no-skip-snapshot!&: Determines whether a final graph snapshot is created before the graph is deleted.
    --skip-snapshot!: Determines whether a final graph snapshot is created before the graph is deleted.
documentation:
    command: Deletes the specified graph. Graphs cannot be deleted if delete-protection is enabled.
    flag:
        graph-identifier: The unique identifier of the Neptune Analytics graph.
        skip-snapshot: Determines whether a final graph snapshot is created before the graph is deleted. If `true` is specified, no graph snapshot is created. If `false` is specified, a graph snapshot is created before the graph is deleted.
