name: describe-home-region-controls
description: This API permits filtering on the `ControlId` and `HomeRegion` fields.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --control-id=: The `ControlID` is a unique identifier string of your `HomeRegionControl` object.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --home-region=: The name of the home region you'd like to view.
    --max-results=: The maximum number of filtering results to display per page.
    --next-token=: If a `NextToken` was returned by a previous call, more results are available.
    --target=: The target parameter specifies the identifier to which the home region is applied, which is always of type `ACCOUNT`.
documentation:
    command: This API permits filtering on the `ControlId` and `HomeRegion` fields.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        control-id: The `ControlID` is a unique identifier string of your `HomeRegionControl` object.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        home-region: The name of the home region you'd like to view.
        max-results: The maximum number of filtering results to display per page.
        next-token: If a `NextToken` was returned by a previous call, more results are available. To retrieve the next page of results, make the call again using the returned token in `NextToken`.
        target: The target parameter specifies the identifier to which the home region is applied, which is always of type `ACCOUNT`. It applies the home region to the current `ACCOUNT`.
