name: enable-personal-auth-session
description: Enable a personal auth session on a cluster.
hidden: true
flags:
    --access-boundary=: The path to a JSON file specifying the credential access boundary for
    --no-refresh-credentials&: ""
    --openssl-command=&: ""
    --refresh-credentials&: ""
    --region=: Dataproc region for the cluster.
documentation:
    command: Enable a personal auth session on a cluster.
    flag:
        access-boundary: |-
            The path to a JSON file specifying the credential access boundary for
            the personal auth session.
            +
            If not specified, then the access boundary defaults to one that includes
            the following roles on the containing project:
            +
                roles/storage.objectViewer
                roles/storage.objectCreator
                roles/storage.objectAdmin
                roles/storage.legacyBucketReader
            +
            For more information, see:
            https://cloud.google.com/iam/docs/downscoping-short-lived-credentials.
        no-refresh-credentials: |
            Keep the command running to periodically refresh credentials.
        openssl-command: |
            The full path to the command used to invoke the OpenSSL tool on this
            machine.
        refresh-credentials: |
            Keep the command running to periodically refresh credentials.
        region: |-
            Dataproc region for the cluster. Each Dataproc region constitutes an independent resource namespace constrained to deploying instances into Compute Engine zones inside the region. Overrides the default `dataproc/region` property value for this command invocation.
            +
            To set the `region` attribute:
            * provide the argument `cluster` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `dataproc/region`.
