name: describe
description: Describe a Dataplex asset resource.
flags:
    --lake=: Identifier of the Dataplex lake resource.
    --location=: Location of the Dataplex resource.
    --zone=: Identifier of the Dataplex zone resource.
documentation:
    command: |
        Displays all details of a Dataplex asset resource given a valid asset ID.
    flag:
        lake: |-
            Identifier of the Dataplex lake resource.
            +

            To set the `lake` attribute:
            * provide the argument `asset` on the command line with a fully specified name;
            * provide the argument `--lake` on the command line.
        location: |-
            Location of the Dataplex resource.
            +

            To set the `location` attribute:
            * provide the argument `asset` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
        zone: |-
            Identifier of the Dataplex zone resource.
            +

            To set the `zone` attribute:
            * provide the argument `asset` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line.
