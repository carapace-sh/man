name: create-application-version
description: Creates an application version for the specified application.
flags:
    --application-name=!: The name of the application.
    --auto-create-application=: Set to `true` to create an application with the specified name if it doesn't already exist.
    --build-configuration=: Settings for an AWS CodeBuild build.
    --description=: A description of this application version.
    --process=: Pre-processes and validates the environment manifest (`env.yaml`) and configuration files (`*.config` files in the `.ebextensions` folder) in the source bundle.
    --source-build-information=: Specify a commit in an AWS CodeCommit Git repository to use as the source code for the application version.
    --source-bundle=: The Amazon S3 bucket and key that identify the location of the source bundle for this version.
    --tags=: Specifies the tags applied to the application version.
    --version-label=!: A label identifying this version.
documentation:
    command: |-
        Creates an application version for the specified application. You can create an application version from a source bundle in Amazon S3, a commit in AWS CodeCommit, or the output of an AWS CodeBuild build as follows:

        Specify a commit in an AWS CodeCommit repository with `SourceBuildInformation`.

        Specify a build in an AWS CodeBuild with `SourceBuildInformation` and `BuildConfiguration`.

        Specify a source bundle in S3 with `SourceBundle`

        Omit both `SourceBuildInformation` and `SourceBundle` to use the default sample application.

        After you create an application version with a specified Amazon S3 bucket and key location, you can't change that Amazon S3 location. If you change the Amazon S3 location, you receive an exception when you attempt to launch an environment from the application version.
    flag:
        application-name: The name of the application. If no application is found with this name, and `AutoCreateApplication` is `false`, returns an `InvalidParameterValue` error.
        auto-create-application: Set to `true` to create an application with the specified name if it doesn't already exist.
        build-configuration: Settings for an AWS CodeBuild build.
        description: A description of this application version.
        process: |-
            Pre-processes and validates the environment manifest (`env.yaml`) and configuration files (`*.config` files in the `.ebextensions` folder) in the source bundle. Validating configuration files can identify issues prior to deploying the application version to an environment.

            You must turn processing on for application versions that you create using AWS CodeBuild or AWS CodeCommit. For application versions built from a source bundle in Amazon S3, processing is optional.

            The `Process` option validates Elastic Beanstalk configuration files. It doesn't validate your application's configuration files, like proxy server or Docker configuration.
        source-build-information: Specify a commit in an AWS CodeCommit Git repository to use as the source code for the application version.
        source-bundle: |-
            The Amazon S3 bucket and key that identify the location of the source bundle for this version.

            The Amazon S3 bucket must be in the same region as the environment.

            Specify a source bundle in S3 or a commit in an AWS CodeCommit repository (with `SourceBuildInformation`), but not both. If neither `SourceBundle` nor `SourceBuildInformation` are provided, Elastic Beanstalk uses a sample application.
        tags: |-
            Specifies the tags applied to the application version.

            Elastic Beanstalk applies these tags only to the application version. Environments that use the application version don't inherit the tags.
        version-label: |-
            A label identifying this version.

            Constraint: Must be unique per application. If an application version already exists with this label for the specified application, AWS Elastic Beanstalk returns an `InvalidParameterValue` error.
