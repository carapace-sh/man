name: create
description: '*(ALPHA)*  Create a Distributed Cloud Edge Network interconnect attachment.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --description=: An optional, textual description for the interconnect attachment.
    --interconnect=!: The underlying interconnect object that this attachment's traffic will traverse through.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The global location name.
    --mtu=: Maximum transmission unit (MTU) is the size of the largest
    --network=: The network to use for dynamic routing.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --vlan-id=: The ID of the vlan to tag the subnetwork.
    --zone=: The name of the Google Distributed Cloud Edge zone.
documentation:
    command: |
        *(ALPHA)*  Create a new dedicated Distributed Cloud Edge Network interconnect attachment.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        description: An optional, textual description for the interconnect attachment.
        interconnect: The underlying interconnect object that this attachment's traffic will traverse through.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The global location name.
            +
            To set the `location` attribute:
            * provide the argument `interconnect_attachment` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        mtu: |-
            Maximum transmission unit (MTU) is the size of the largest
            IP packet that can be transmitted on this attachment. Default
            value is 1500 bytes, and the valid values are 1500 and 9000.
        network: The network to use for dynamic routing.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        vlan-id: The ID of the vlan to tag the subnetwork. Default value is 0.
        zone: |-
            The name of the Google Distributed Cloud Edge zone.
            +
            To set the `zone` attribute:
            * provide the argument `interconnect_attachment` on the command line with a fully specified name;
            * provide the argument `--zone` on the command line.
