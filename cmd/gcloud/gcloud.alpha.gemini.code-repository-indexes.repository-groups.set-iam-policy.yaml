name: set-iam-policy
description: '*(ALPHA)*  Get the IAM policy for a code repository index repository group.'
hidden: true
flags:
    --code-repository-index=: ID of the code repository index resource.
    --location=: Location of the Gemini resource.
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha gemini code-repository-indexes repository-groups set-iam-policy* sets the IAM policy for a code repository index repository group
        as defined in a JSON or YAML file.

        See https://cloud.google.com/iam/docs/managing-policies for details of
        the policy file format and contents.
    flag:
        code-repository-index: |-
            ID of the code repository index resource.
            +

            To set the `code-repository-index` attribute:
            * provide the argument `repository_group` on the command line with a fully specified name;
            * provide the argument `--code-repository-index` on the command line.
        location: |-
            Location of the Gemini resource.
            +

            To set the `location` attribute:
            * provide the argument `repository_group` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
