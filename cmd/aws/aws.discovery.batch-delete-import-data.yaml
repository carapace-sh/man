name: batch-delete-import-data
description: Deletes one or more import tasks, each identified by their import ID.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --delete-history: Set to `true` to remove the deleted import task from [DescribeImportTasks]().
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --import-task-ids=!: The IDs for the import tasks that you want to delete.
    --no-delete-history: Set to `true` to remove the deleted import task from [DescribeImportTasks]().
documentation:
    command: |-
        Deletes one or more import tasks, each identified by their import ID. Each import task has a number of records that can identify servers or applications.

        Amazon Web Services Application Discovery Service has built-in matching logic that will identify when discovered servers match existing entries that you've previously discovered, the information for the already-existing discovered server is updated. When you delete an import task that contains records that were used to match, the information in those matched records that comes from the deleted records will also be deleted.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        delete-history: Set to `true` to remove the deleted import task from [DescribeImportTasks]().
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        import-task-ids: The IDs for the import tasks that you want to delete.
