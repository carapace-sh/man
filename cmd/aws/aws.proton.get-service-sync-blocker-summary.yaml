name: get-service-sync-blocker-summary
description: Get detailed data for the service sync blocker summary.
flags:
    --service-instance-name=: The name of the service instance that you want to get the service sync blocker summary for.
    --service-name=!: The name of the service that you want to get the service sync blocker summary for.
documentation:
    command: Get detailed data for the service sync blocker summary.
    flag:
        service-instance-name: The name of the service instance that you want to get the service sync blocker summary for. If given bothe the instance name and the service name, only the instance is blocked.
        service-name: The name of the service that you want to get the service sync blocker summary for. If given only the service name, all instances are blocked.
