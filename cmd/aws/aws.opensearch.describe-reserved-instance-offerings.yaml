name: describe-reserved-instance-offerings
description: Describes the available Amazon OpenSearch Service Reserved Instance offerings for a given Region.
flags:
    --max-results=: An optional parameter that specifies the maximum number of results to return.
    --next-token=: If your initial `DescribeReservedInstanceOfferings` operation returns a `nextToken`, you can include the returned `nextToken` in subsequent `DescribeReservedInstanceOfferings` operations, which returns results in the next page.
    --reserved-instance-offering-id=: The Reserved Instance identifier filter value.
documentation:
    command: Describes the available Amazon OpenSearch Service Reserved Instance offerings for a given Region. For more information, see [Reserved Instances in Amazon OpenSearch Service](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/ri.html).
    flag:
        max-results: An optional parameter that specifies the maximum number of results to return. You can use `nextToken` to get the next page of results.
        next-token: If your initial `DescribeReservedInstanceOfferings` operation returns a `nextToken`, you can include the returned `nextToken` in subsequent `DescribeReservedInstanceOfferings` operations, which returns results in the next page.
        reserved-instance-offering-id: The Reserved Instance identifier filter value. Use this parameter to show only the available instance types that match the specified reservation identifier.
