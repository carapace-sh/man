name: get-identity-notification-attributes
description: Given a list of verified identities (email addresses and/or domains), returns a structure describing identity notification attributes.
flags:
    --identities=!: A list of one or more identities.
documentation:
    command: |-
        Given a list of verified identities (email addresses and/or domains), returns a structure describing identity notification attributes.

        This operation is throttled at one request per second and can only get notification attributes for up to 100 identities at a time.

        For more information about using notifications with Amazon SES, see the [Amazon SES Developer Guide](https://docs.aws.amazon.com/ses/latest/dg/monitor-sending-activity-using-notifications.html).
    flag:
        identities: 'A list of one or more identities. You can specify an identity by using its name or by using its Amazon Resource Name (ARN). Examples: `user@example.com`, `example.com`, `arn:aws:ses:us-east-1:123456789012:identity/example.com`.'
