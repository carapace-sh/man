name: describe-organization-config-rule-statuses
description: Provides organization Config rule deployment status for an organization.
flags:
    --limit=: The maximum number of `OrganizationConfigRuleStatuses` returned on each page.
    --next-token=: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
    --organization-config-rule-names=: The names of organization Config rules for which you want status details.
documentation:
    command: |-
        Provides organization Config rule deployment status for an organization.

        The status is not considered successful until organization Config rule is successfully deployed in all the member accounts with an exception of excluded accounts.

        When you specify the limit and the next token, you receive a paginated response. Limit and next token are not applicable if you specify organization Config rule names. It is only applicable, when you request all the organization Config rules.
    flag:
        limit: The maximum number of `OrganizationConfigRuleStatuses` returned on each page. If you do no specify a number, Config uses the default. The default is 100.
        next-token: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
        organization-config-rule-names: The names of organization Config rules for which you want status details. If you do not specify any names, Config returns details for all your organization Config rules.
