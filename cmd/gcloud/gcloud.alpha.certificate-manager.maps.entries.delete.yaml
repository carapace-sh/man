name: delete
description: '*(ALPHA)*  Delete a certificate map entry.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The Cloud location for the certificate map entry.
    --map=: The certificate map for the certificate map entry.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |-
        *(ALPHA)*  Delete a certificate map entry resource.

        ## EXAMPLES

        To delete the certificate map entry with name simple-entry, run:

          $ gcloud alpha certificate-manager maps entries delete simple-entry --map=simple-map
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        location: |-
            The Cloud location for the certificate map entry.
            +
            To set the `location` attribute:
            * provide the argument `entry` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * default value of location is [global].
        map: |-
            The certificate map for the certificate map entry.
            +
            To set the `map` attribute:
            * provide the argument `entry` on the command line with a fully specified name;
            * provide the argument `--map` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
