name: describe
description: '*(BETA)*  Describe a backup plan.'
flags:
    --location=: Google Cloud location.
documentation:
    command: |
        *(BETA)*  Describe a Backup for GKE backup plan.

        ## EXAMPLES

        To describe a backup plan ``my-backup-plan'' in project ``my-project'' in location ``us-central1'', run:

          $ gcloud beta container backup-restore backup-plans describe my-backup-plan --project=my-project --location=us-central1
    flag:
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `backup_plan` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `gkebackup/location`.
