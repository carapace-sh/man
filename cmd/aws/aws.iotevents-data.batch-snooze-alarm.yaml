name: batch-snooze-alarm
description: Changes one or more alarms to the snooze mode.
flags:
    --snooze-action-requests=!: The list of snooze action requests.
documentation:
    command: Changes one or more alarms to the snooze mode. The alarms change to the `SNOOZE_DISABLED` state after you set them to the snooze mode.
    flag:
        snooze-action-requests: The list of snooze action requests. You can specify up to 10 requests per operation.
