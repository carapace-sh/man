name: describe-jobs
description: Returns a list of Jobs.
flags:
    --filters=: A set of filters by which to return Jobs.
    --max-results=: Maximum number of Jobs to retrieve.
    --next-token=: The token of the next Job to retrieve.
documentation:
    command: Returns a list of Jobs. Use the JobsID and fromDate and toDate filters to limit which jobs are returned. The response is sorted by creationDataTime - latest date first. Jobs are created by the StartRecovery, TerminateRecoveryInstances and StartFailbackLaunch APIs. Jobs are also created by DiagnosticLaunch and TerminateDiagnosticInstances, which are APIs available only to \*Support* and only used in response to relevant support tickets.
    flag:
        filters: A set of filters by which to return Jobs.
        max-results: Maximum number of Jobs to retrieve.
        next-token: The token of the next Job to retrieve.
