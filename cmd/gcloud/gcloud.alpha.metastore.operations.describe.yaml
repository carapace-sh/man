name: describe
description: '*(ALPHA)*  Show metadata for a Dataproc Metastore operation.'
flags:
    --location=: The location of the Dataproc Metastore service.
documentation:
    command: |
        *(ALPHA)*  Display all metadata associated with a Metastore operation given a valid
        operation name.
    flag:
        location: |-
            The location of the Dataproc Metastore service.
            +
            If not specified, will use `default` metastore/location.
            +

            To set the `location` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `metastore/location`.
