name: create-cluster
description: Creates a DAX cluster.
flags:
    --availability-zones=:
        description: The Availability Zones (AZs) in which the cluster nodes will reside after the cluster has been created or updated.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cluster-endpoint-encryption-type=: The type of encryption the cluster's endpoint should support.
    --cluster-name=!: The cluster identifier.
    --description=: A description of the cluster.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --iam-role-arn=!: A valid Amazon Resource Name (ARN) that identifies an IAM role.
    --network-type=: Specifies the IP protocol(s) the cluster uses for network communications.
    --node-type=!: The compute and memory capacity of the nodes in the cluster.
    --notification-topic-arn=: The Amazon Resource Name (ARN) of the Amazon SNS topic to which notifications will be sent.
    --parameter-group-name=: The parameter group to be associated with the DAX cluster.
    --preferred-maintenance-window=: Specifies the weekly time range during which maintenance on the DAX cluster is performed.
    --replication-factor=!: The number of nodes in the DAX cluster.
    --security-group-ids=:
        description: A list of security group IDs to be assigned to each node in the DAX cluster.
        nargs: -1
    --sse-specification=: Represents the settings used to enable server-side encryption on the cluster.
    --subnet-group-name=: The name of the subnet group to be used for the replication group.
    --tags=:
        description: A set of tags to associate with the DAX cluster.
        nargs: -1
completion:
    flag:
        cluster-endpoint-encryption-type:
            - NONE
            - TLS
        network-type:
            - ipv4
            - ipv6
            - dual_stack
documentation:
    command: Creates a DAX cluster. All nodes in the cluster run the same DAX caching software.
    flag:
        availability-zones: The Availability Zones (AZs) in which the cluster nodes will reside after the cluster has been created or updated. If provided, the length of this list must equal the `ReplicationFactor` parameter. If you omit this parameter, DAX will spread the nodes across Availability Zones for the highest availability.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cluster-endpoint-encryption-type: |-
            The type of encryption the cluster's endpoint should support. Values are:

            - `NONE` for no encryption
            - `TLS` for Transport Layer Security
        cluster-name: |-
            The cluster identifier. This parameter is stored as a lowercase string.

            **Constraints:**

            - A name must contain from 1 to 20 alphanumeric characters or hyphens.
            - The first character must be a letter.
            - A name cannot end with a hyphen or contain two consecutive hyphens.
        description: A description of the cluster.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        iam-role-arn: A valid Amazon Resource Name (ARN) that identifies an IAM role. At runtime, DAX will assume this role and use the role's permissions to access DynamoDB on your behalf.
        network-type: |-
            Specifies the IP protocol(s) the cluster uses for network communications. Values are:

            - `ipv4` - The cluster is accessible only through IPv4 addresses
            - `ipv6` - The cluster is accessible only through IPv6 addresses
            - `dual_stack` - The cluster is accessible through both IPv4 and IPv6 addresses.

            If no explicit `NetworkType` is provided, the network type is derived based on the subnet group's configuration.
        node-type: The compute and memory capacity of the nodes in the cluster.
        notification-topic-arn: |-
            The Amazon Resource Name (ARN) of the Amazon SNS topic to which notifications will be sent.

            The Amazon SNS topic owner must be same as the DAX cluster owner.
        parameter-group-name: The parameter group to be associated with the DAX cluster.
        preferred-maintenance-window: |-
            Specifies the weekly time range during which maintenance on the DAX cluster is performed. It is specified as a range in the format ddd:hh24:mi-ddd:hh24:mi (24H Clock UTC). The minimum maintenance window is a 60 minute period. Valid values for `ddd` are:

            - `sun`
            - `mon`
            - `tue`
            - `wed`
            - `thu`
            - `fri`
            - `sat`

            Example: `sun:05:00-sun:09:00`

            If you don't specify a preferred maintenance window when you create or modify a cache cluster, DAX assigns a 60-minute maintenance window on a randomly selected day of the week.
        replication-factor: |-
            The number of nodes in the DAX cluster. A replication factor of 1 will create a single-node cluster, without any read replicas. For additional fault tolerance, you can create a multiple node cluster with one or more read replicas. To do this, set `ReplicationFactor` to a number between 3 (one primary and two read replicas) and 10 (one primary and nine read replicas). `If the AvailabilityZones` parameter is provided, its length must equal the `ReplicationFactor`.

            Amazon Web Services recommends that you have at least two read replicas per cluster.
        security-group-ids: |-
            A list of security group IDs to be assigned to each node in the DAX cluster. (Each of the security group ID is system-generated.)

            If this parameter is not specified, DAX assigns the default VPC security group to each node.
        sse-specification: Represents the settings used to enable server-side encryption on the cluster.
        subnet-group-name: |-
            The name of the subnet group to be used for the replication group.

            DAX clusters can only run in an Amazon VPC environment. All of the subnets that you specify in a subnet group must exist in the same VPC.
        tags: A set of tags to associate with the DAX cluster.
