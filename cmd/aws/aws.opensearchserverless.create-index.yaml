name: create-index
description: Creates an index within an OpenSearch Serverless collection.
flags:
    --id=!: The unique identifier of the collection in which to create the index.
    --index-name=!: The name of the index to create.
    --index-schema=: The JSON schema definition for the index, including field mappings and settings.
documentation:
    command: Creates an index within an OpenSearch Serverless collection. Unlike other OpenSearch indexes, indexes created by this API are automatically configured to conduct automatic semantic enrichment ingestion and search. For more information, see [About automatic semantic enrichment](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-manage.html#serverless-semantic-enrichment) in the *OpenSearch User Guide*.
    flag:
        id: The unique identifier of the collection in which to create the index.
        index-name: The name of the index to create. Index names must be lowercase and can't begin with underscores (\_) or hyphens (-).
        index-schema: The JSON schema definition for the index, including field mappings and settings.
