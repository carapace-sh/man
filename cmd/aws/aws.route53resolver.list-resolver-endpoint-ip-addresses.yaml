name: list-resolver-endpoint-ip-addresses
description: Gets the IP addresses for a specified Resolver endpoint.
flags:
    --max-results=: The maximum number of IP addresses that you want to return in the response to a `ListResolverEndpointIpAddresses` request.
    --next-token=: For the first `ListResolverEndpointIpAddresses` request, omit this value.
    --resolver-endpoint-id=!: The ID of the Resolver endpoint that you want to get IP addresses for.
documentation:
    command: Gets the IP addresses for a specified Resolver endpoint.
    flag:
        max-results: The maximum number of IP addresses that you want to return in the response to a `ListResolverEndpointIpAddresses` request. If you don't specify a value for `MaxResults`, Resolver returns up to 100 IP addresses.
        next-token: |-
            For the first `ListResolverEndpointIpAddresses` request, omit this value.

            If the specified Resolver endpoint has more than `MaxResults` IP addresses, you can submit another `ListResolverEndpointIpAddresses` request to get the next group of IP addresses. In the next request, specify the value of `NextToken` from the previous response.
        resolver-endpoint-id: The ID of the Resolver endpoint that you want to get IP addresses for.
