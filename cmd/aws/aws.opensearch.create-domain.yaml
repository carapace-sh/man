name: create-domain
description: Creates an Amazon OpenSearch Service domain.
flags:
    --access-policies=: Identity and Access Management (IAM) policy document specifying the access policies for the new domain.
    --advanced-options=: Key-value pairs to specify advanced configuration options.
    --advanced-security-options=: Options for fine-grained access control.
    --aimloptions=: Options for all machine learning features for the specified domain.
    --auto-tune-options=: Options for Auto-Tune.
    --cluster-config=: Container for the cluster configuration of a domain.
    --cognito-options=: Key-value pairs to configure Amazon Cognito authentication.
    --domain-endpoint-options=: Additional options for the domain endpoint, such as whether to require HTTPS for all traffic.
    --domain-name=!: Name of the OpenSearch Service domain to create.
    --ebsoptions=: Container for the parameters required to enable EBS-based storage for an OpenSearch Service domain.
    --encryption-at-rest-options=: Key-value pairs to enable encryption at rest.
    --engine-version=: String of format Elasticsearch\_X.Y or OpenSearch\_X.Y to specify the engine version for the OpenSearch Service domain.
    --identity-center-options=: Configuration options for enabling and managing IAM Identity Center integration within a domain.
    --ipaddress-type=: Specify either dual stack or IPv4 as your IP address type.
    --log-publishing-options=: Key-value pairs to configure log publishing.
    --node-to-node-encryption-options=: Enables node-to-node encryption.
    --off-peak-window-options=: Specifies a daily 10-hour time block during which OpenSearch Service can perform configuration changes on the domain, including service software updates and Auto-Tune enhancements that require a blue/green deployment.
    --snapshot-options=: DEPRECATED.
    --software-update-options=: Software update options for the domain.
    --tag-list=: List of tags to add to the domain upon creation.
    --vpcoptions=: Container for the values required to configure VPC access domains.
completion:
    flag:
        ipaddress-type:
            - ipv4
            - dualstack
documentation:
    command: Creates an Amazon OpenSearch Service domain. For more information, see [Creating and managing Amazon OpenSearch Service domains](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/createupdatedomains.html).
    flag:
        access-policies: Identity and Access Management (IAM) policy document specifying the access policies for the new domain.
        advanced-options: |-
            Key-value pairs to specify advanced configuration options. The following key-value pairs are supported:

            - `"rest.action.multi.allow_explicit_index": "true" | "false"` - Note the use of a string rather than a boolean. Specifies whether explicit references to indexes are allowed inside the body of HTTP requests. If you want to configure access policies for domain sub-resources, such as specific indexes and domain APIs, you must disable this property. Default is true.
            - `"indices.fielddata.cache.size": "80"` - Note the use of a string rather than a boolean. Specifies the percentage of heap space allocated to field data. Default is unbounded.
            - `"indices.query.bool.max_clause_count": "1024"` - Note the use of a string rather than a boolean. Specifies the maximum number of clauses allowed in a Lucene boolean query. Default is 1,024. Queries with more than the permitted number of clauses result in a `TooManyClauses` error.
            - `"override_main_response_version": "true" | "false"` - Note the use of a string rather than a boolean. Specifies whether the domain reports its version as 7.10 to allow Elasticsearch OSS clients and plugins to continue working with it. Default is false when creating a domain and true when upgrading a domain.

            For more information, see [Advanced cluster parameters](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/createupdatedomains.html#createdomain-configure-advanced-options).
        advanced-security-options: Options for fine-grained access control.
        aimloptions: Options for all machine learning features for the specified domain.
        auto-tune-options: Options for Auto-Tune.
        cluster-config: Container for the cluster configuration of a domain.
        cognito-options: Key-value pairs to configure Amazon Cognito authentication. For more information, see [Configuring Amazon Cognito authentication for OpenSearch Dashboards](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/cognito-auth.html).
        domain-endpoint-options: Additional options for the domain endpoint, such as whether to require HTTPS for all traffic.
        domain-name: Name of the OpenSearch Service domain to create. Domain names are unique across the domains owned by an account within an Amazon Web Services Region.
        ebsoptions: Container for the parameters required to enable EBS-based storage for an OpenSearch Service domain.
        encryption-at-rest-options: Key-value pairs to enable encryption at rest.
        engine-version: String of format Elasticsearch\_X.Y or OpenSearch\_X.Y to specify the engine version for the OpenSearch Service domain. For example, `OpenSearch_1.0` or `Elasticsearch_7.9`. For more information, see [Creating and managing Amazon OpenSearch Service domains](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/createupdatedomains.html#createdomains).
        identity-center-options: Configuration options for enabling and managing IAM Identity Center integration within a domain.
        ipaddress-type: Specify either dual stack or IPv4 as your IP address type. Dual stack allows you to share domain resources across IPv4 and IPv6 address types, and is the recommended option. If you set your IP address type to dual stack, you can't change your address type later.
        log-publishing-options: Key-value pairs to configure log publishing.
        node-to-node-encryption-options: Enables node-to-node encryption.
        off-peak-window-options: Specifies a daily 10-hour time block during which OpenSearch Service can perform configuration changes on the domain, including service software updates and Auto-Tune enhancements that require a blue/green deployment. If no options are specified, the default start time of 10:00 P.M. local time (for the Region that the domain is created in) is used.
        snapshot-options: DEPRECATED. Container for the parameters required to configure automated snapshots of domain indexes.
        software-update-options: Software update options for the domain.
        tag-list: List of tags to add to the domain upon creation.
        vpcoptions: Container for the values required to configure VPC access domains. If you don't specify these values, OpenSearch Service creates the domain with a public endpoint. For more information, see [Launching your Amazon OpenSearch Service domains using a VPC](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/vpc.html).
