name: delete
description: '*(ALPHA)*  Delete a Compute Engine organization firewall policy association.'
flags:
    --firewall-policy=!: Short name or ID of the firewall policy ID of the association.
    --organization=: ID of the organization in which the firewall policy is to be detached.
documentation:
    command: '*(ALPHA)*  *gcloud alpha compute firewall-policies associations delete* is used to delete organization firewall policy association.'
    flag:
        firewall-policy: Short name or ID of the firewall policy ID of the association.
        organization: ID of the organization in which the firewall policy is to be detached. Must be set if FIREWALL_POLICY is short name.
