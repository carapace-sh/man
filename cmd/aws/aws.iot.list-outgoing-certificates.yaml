name: list-outgoing-certificates
description: Lists certificates that are being transferred but not yet accepted.
flags:
    --ascending-order=: Specifies the order for results.
    --marker=: The marker for the next set of results.
    --page-size=: The result page size.
documentation:
    command: |-
        Lists certificates that are being transferred but not yet accepted.

        Requires permission to access the [ListOutgoingCertificates](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        ascending-order: Specifies the order for results. If True, the results are returned in ascending order, based on the creation date.
        marker: The marker for the next set of results.
        page-size: The result page size.
