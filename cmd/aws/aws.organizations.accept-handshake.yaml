name: accept-handshake
description: Sends a response to the originator of a handshake agreeing to the action proposed by the handshake request.
flags:
    --handshake-id=!: The unique identifier (ID) of the handshake that you want to accept.
documentation:
    command: "Sends a response to the originator of a handshake agreeing to the action proposed by the handshake request.\n\nYou can only call this operation by the following principals when they also have the relevant IAM permissions:\n\n- **Invitation to join** or **Approve all features request** handshakes: only a principal from the member account.\n  \n  The user who calls the API for an invitation to join must have the `organizations:AcceptHandshake` permission. If you enabled all features in the organization, the user must also have the `iam:CreateServiceLinkedRole` permission so that Organizations can create the required service-linked role named `AWSServiceRoleForOrganizations`. For more information, see [Organizations and service-linked roles](https://docs.aws.amazon.com/organizations/latest/userguide/orgs_integration_services.html#orgs_integrate_services-using_slrs) in the *Organizations User Guide*.\n- **Enable all features final confirmation** handshake: only a principal from the management account.\n  \n  For more information about invitations, see [Inviting an Amazon Web Services account to join your organization](https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_accounts_invites.html) in the *Organizations User Guide*. For more information about requests to enable all features in the organization, see [Enabling all features in your organization](https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_org_support-all-features.html) in the *Organizations User Guide*.\n\nAfter you accept a handshake, it continues to appear in the results of relevant APIs for only 30 days. After that, it's deleted."
    flag:
        handshake-id: |-
            The unique identifier (ID) of the handshake that you want to accept.

            The [regex pattern](http://wikipedia.org/wiki/regex) for handshake ID string requires "h-" followed by from 8 to 32 lowercase letters or digits.
