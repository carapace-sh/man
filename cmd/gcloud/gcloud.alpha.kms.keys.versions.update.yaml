name: update
description: '*(ALPHA)*  Update a key version.'
flags:
    --ekm-connection-key-path=: The path to the external key material on the EKM for keys with protection level "external-vpc".
    --external-key-uri=: The URI of the external key for keys with protection level "external".
    --key=: The containing key.
    --keyring=: Key ring of the key.
    --location=: Location of the keyring.
    --state=: State of the key version.
documentation:
    command: |-
        *(ALPHA)*  gcloud alpha kms keys versions update can be used to update the key versions. Updates can be made to the
        the key versions's state (enabling or disabling it), to its external key
        URI (if the key version has protection level EXTERNAL), or to its ekm
        connection key path (if the key version has protection level EXTERNAL_VPC).

        ## EXAMPLES

        The following command enables the key version 8 of key `frodo`
        within keyring `fellowship` and location `us-east1`:

          $ gcloud alpha kms keys versions update 8 --location=us-east1 \
                        --keyring=fellowship \
                        --key=frodo \
                        --state=enabled

        The following command disables the key version 8 of key `frodo`
        within keyring `fellowship` and location `us-east1`:

          $ gcloud alpha kms keys versions update 8 --location=us-east1 \
                        --keyring=fellowship \
                        --key=frodo \
                        --state=disabled

        The following command updates the external key URI of version 8 of key `frodo`
        within keyring `fellowship` and location `us-east1`:

          $ gcloud alpha kms keys versions update 8 --location=us-east1 \
                        --keyring=fellowship \
                        --key=frodo \
                        --external-key-uri=https://example.kms/v0/some/key/path

        The following command updates the ekm connection key path of version 8 of key
        `bilbo` within keyring `fellowship` and location `us-east1`:

          $ gcloud alpha kms keys versions update 8 --location=us-east1 \
                        --keyring=fellowship \
                        --key=bilbo \
                        --ekm-connection-key-path=v0/some/key/path
    flag:
        ekm-connection-key-path: The path to the external key material on the EKM for keys with protection level "external-vpc".
        external-key-uri: The URI of the external key for keys with protection level "external".
        key: The containing key.
        keyring: Key ring of the key.
        location: Location of the keyring.
        state: State of the key version.
