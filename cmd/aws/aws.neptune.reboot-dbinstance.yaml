name: reboot-dbinstance
description: You might need to reboot your DB instance, usually for maintenance reasons.
flags:
    --dbinstance-identifier=!: The DB instance identifier.
    --force-failover=: When `true`, the reboot is conducted through a MultiAZ failover.
documentation:
    command: |-
        You might need to reboot your DB instance, usually for maintenance reasons. For example, if you make certain modifications, or if you change the DB parameter group associated with the DB instance, you must reboot the instance for the changes to take effect.

        Rebooting a DB instance restarts the database engine service. Rebooting a DB instance results in a momentary outage, during which the DB instance status is set to rebooting.
    flag:
        dbinstance-identifier: |-
            The DB instance identifier. This parameter is stored as a lowercase string.

            Constraints:

            - Must match the identifier of an existing DBInstance.
        force-failover: |-
            When `true`, the reboot is conducted through a MultiAZ failover.

            Constraint: You can't specify `true` if the instance is not configured for MultiAZ.
