name: delete-partnership
description: Deletes the specified partnership.
flags:
    --partnership-id=!: Specifies the unique, system-generated identifier for a partnership.
documentation:
    command: Deletes the specified partnership. A partnership represents the connection between you and your trading partner. It ties together a profile and one or more trading capabilities.
    flag:
        partnership-id: Specifies the unique, system-generated identifier for a partnership.
