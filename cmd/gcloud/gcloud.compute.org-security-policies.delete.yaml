name: delete
description: Delete a Compute Engine organization security policy.
flags:
    --organization=: Organization in which the organization security policy is to be deleted.
documentation:
    command: |-
        *gcloud compute org-security-policies delete* is used to delete organization security policies. An organization
        security policy is a set of rules that controls access to various resources.
    flag:
        organization: Organization in which the organization security policy is to be deleted. Must be set if SECURITY_POLICY is short name.
