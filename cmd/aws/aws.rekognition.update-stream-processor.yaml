name: update-stream-processor
description: Allows you to update a stream processor.
flags:
    --data-sharing-preference-for-update=: Shows whether you are sharing data with Rekognition to improve model performance.
    --name=!: Name of the stream processor that you want to update.
    --parameters-to-delete=: A list of parameters you want to delete from the stream processor.
    --regions-of-interest-for-update=: Specifies locations in the frames where Amazon Rekognition checks for objects or people.
    --settings-for-update=: The stream processor settings that you want to update.
documentation:
    command: Allows you to update a stream processor. You can change some settings and regions of interest and delete certain parameters.
    flag:
        data-sharing-preference-for-update: Shows whether you are sharing data with Rekognition to improve model performance. You can choose this option at the account level or on a per-stream basis. Note that if you opt out at the account level this setting is ignored on individual streams.
        name: Name of the stream processor that you want to update.
        parameters-to-delete: A list of parameters you want to delete from the stream processor.
        regions-of-interest-for-update: Specifies locations in the frames where Amazon Rekognition checks for objects or people. This is an optional parameter for label detection stream processors.
        settings-for-update: The stream processor settings that you want to update. Label detection settings can be updated to detect different labels with a different minimum confidence.
