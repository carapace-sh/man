name: update-calculated-attribute-definition
description: Updates an existing calculated attribute definition.
flags:
    --calculated-attribute-name=!: The unique name of the calculated attribute.
    --conditions=: The conditions including range, object count, and threshold for the calculated attribute.
    --description=: The description of the calculated attribute.
    --display-name=: The display name of the calculated attribute.
    --domain-name=!: The unique name of the domain.
documentation:
    command: Updates an existing calculated attribute definition. When updating the Conditions, note that increasing the date range of a calculated attribute will not trigger inclusion of historical data greater than the current date range.
    flag:
        calculated-attribute-name: The unique name of the calculated attribute.
        conditions: The conditions including range, object count, and threshold for the calculated attribute.
        description: The description of the calculated attribute.
        display-name: The display name of the calculated attribute.
        domain-name: The unique name of the domain.
