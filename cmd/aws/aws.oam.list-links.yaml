name: list-links
description: Use this operation in a source account to return a list of links to monitoring account sinks that this source account has.
flags:
    --max-results=: Limits the number of returned links to the specified number.
    --next-token=: The token for the next set of items to return.
documentation:
    command: |-
        Use this operation in a source account to return a list of links to monitoring account sinks that this source account has.

        To find a list of links for one monitoring account sink, use [ListAttachedLinks](https://docs.aws.amazon.com/OAM/latest/APIReference/API_ListAttachedLinks.html) from within the monitoring account.
    flag:
        max-results: Limits the number of returned links to the specified number.
        next-token: The token for the next set of items to return. You received this token from a previous call.
