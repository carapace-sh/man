name: create-automated-reasoning-policy-test-case
description: Creates a test for an Automated Reasoning policy.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=: A unique, case-sensitive identifier to ensure that the operation completes no more than one time.
    --confidence-threshold=: The minimum confidence level for logic validation.
    --expected-aggregated-findings-result=!: The expected result of the Automated Reasoning check.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --guard-content=!: The output content that's validated by the Automated Reasoning policy.
    --policy-arn=!: The Amazon Resource Name (ARN) of the Automated Reasoning policy for which to create the test.
    --query-content=: The input query or prompt that generated the content.
completion:
    flag:
        expected-aggregated-findings-result:
            - VALID
            - INVALID
            - SATISFIABLE
            - IMPOSSIBLE
            - TRANSLATION_AMBIGUOUS
            - TOO_COMPLEX
            - NO_TRANSLATION
documentation:
    command: Creates a test for an Automated Reasoning policy. Tests validate that your policy works as expected by providing sample inputs and expected outcomes. Use tests to verify policy behavior before deploying to production.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-request-token: A unique, case-sensitive identifier to ensure that the operation completes no more than one time. If this token matches a previous request, Amazon Bedrock ignores the request, but does not return an error.
        confidence-threshold: The minimum confidence level for logic validation. Content that meets the threshold is considered a high-confidence finding that can be validated.
        expected-aggregated-findings-result: |-
            The expected result of the Automated Reasoning check. Valid values include: , TOO\_COMPLEX, and NO\_TRANSLATIONS.

            - `VALID` - The claims are true. The claims are implied by the premises and the Automated Reasoning policy. Given the Automated Reasoning policy and premises, it is not possible for these claims to be false. In other words, there are no alternative answers that are true that contradict the claims.
            - `INVALID` - The claims are false. The claims are not implied by the premises and Automated Reasoning policy. Furthermore, there exists different claims that are consistent with the premises and Automated Reasoning policy.
            - `SATISFIABLE` - The claims can be true or false. It depends on what assumptions are made for the claim to be implied from the premises and Automated Reasoning policy rules. In this situation, different assumptions can make input claims false and alternative claims true.
            - `IMPOSSIBLE` - Automated Reasoning can’t make a statement about the claims. This can happen if the premises are logically incorrect, or if there is a conflict within the Automated Reasoning policy itself.
            - `TRANSLATION_AMBIGUOUS` - Detected an ambiguity in the translation meant it would be unsound to continue with validity checking. Additional context or follow-up questions might be needed to get translation to succeed.
            - `TOO_COMPLEX` - The input contains too much information for Automated Reasoning to process within its latency limits.
            - `NO_TRANSLATIONS` - Identifies that some or all of the input prompt wasn't translated into logic. This can happen if the input isn't relevant to the Automated Reasoning policy, or if the policy doesn't have variables to model relevant input. If Automated Reasoning can't translate anything, you get a single `NO_TRANSLATIONS` finding. You might also see a `NO_TRANSLATIONS` (along with other findings) if some part of the validation isn't translated.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        guard-content: The output content that's validated by the Automated Reasoning policy. This represents the foundation model response that will be checked for accuracy.
        policy-arn: The Amazon Resource Name (ARN) of the Automated Reasoning policy for which to create the test.
        query-content: The input query or prompt that generated the content. This provides context for the validation.
