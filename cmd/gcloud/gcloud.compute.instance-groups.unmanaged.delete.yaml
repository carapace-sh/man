name: delete
description: Delete Compute Engine unmanaged instance groups.
flags:
    --zone=: Zone of the instance groups to delete.
documentation:
    command: |-
        *gcloud compute instance-groups unmanaged delete* deletes one or more Compute Engine unmanaged
        instance groups. This command just deletes the instance group and does
        not delete the individual virtual machine instances
        in the instance group.
        For example:

          $ gcloud compute instance-groups unmanaged delete example-instance-group-1 example-instance-group-2 \
              --zone us-central1-a

        The above example deletes two instance groups, example-instance-group-1
        and example-instance-group-2, in the ``us-central1-a'' zone.
    flag:
        zone: |-
            Zone of the instance groups to delete. If not specified and the ``compute/zone'' property isn't set, you
            might be prompted to select a zone (interactive mode only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
