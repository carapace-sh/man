name: describe-trails
description: Retrieves settings for one or more trails associated with the current Region for your account.
flags:
    --include-shadow-trails: Specifies whether to include shadow trails in the response.
    --no-include-shadow-trails: Specifies whether to include shadow trails in the response.
    --trail-name-list=: Specifies a list of trail names, trail ARNs, or both, of the trails to describe.
documentation:
    command: Retrieves settings for one or more trails associated with the current Region for your account.
    flag:
        include-shadow-trails: Specifies whether to include shadow trails in the response. A shadow trail is the replication in a Region of a trail that was created in a different Region, or in the case of an organization trail, the replication of an organization trail in member accounts. If you do not include shadow trails, organization trails in a member account and Region replication trails will not be returned. The default is true.
        trail-name-list: |-
            Specifies a list of trail names, trail ARNs, or both, of the trails to describe. The format of a trail ARN is:

            `arn:aws:cloudtrail:us-east-2:123456789012:trail/MyTrail`

            If an empty list is specified, information for the trail in the current Region is returned.

            - If an empty list is specified and `IncludeShadowTrails` is false, then information for all trails in the current Region is returned.
            - If an empty list is specified and IncludeShadowTrails is null or true, then information for all trails in the current Region and any associated shadow trails in other Regions is returned.

            If one or more trail names are specified, information is returned only if the names match the names of trails belonging only to the current Region and current account. To return information about a trail in another Region, you must specify its trail ARN.
