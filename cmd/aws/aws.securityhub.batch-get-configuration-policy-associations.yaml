name: batch-get-configuration-policy-associations
description: Returns associations between an Security Hub configuration and a batch of target accounts, organizational units, or the root.
flags:
    --configuration-policy-association-identifiers=!: Specifies one or more target account IDs, organizational unit (OU) IDs, or the root ID to retrieve associations for.
documentation:
    command: Returns associations between an Security Hub configuration and a batch of target accounts, organizational units, or the root. Only the Security Hub delegated administrator can invoke this operation from the home Region. A configuration can refer to a configuration policy or to a self-managed configuration.
    flag:
        configuration-policy-association-identifiers: Specifies one or more target account IDs, organizational unit (OU) IDs, or the root ID to retrieve associations for.
