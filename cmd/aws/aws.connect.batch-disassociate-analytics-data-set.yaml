name: batch-disassociate-analytics-data-set
description: Removes a list of analytics datasets associated with a given Amazon Connect instance.
flags:
    --data-set-ids=!: An array of associated dataset identifiers to remove.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --target-account-id=: The identifier of the target account.
documentation:
    command: Removes a list of analytics datasets associated with a given Amazon Connect instance. You can disassociate multiple datasets in a single call.
    flag:
        data-set-ids: An array of associated dataset identifiers to remove.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        target-account-id: The identifier of the target account. Use to disassociate a dataset from a different account than the one containing the Amazon Connect instance. If not specified, by default this value is the Amazon Web Services account that has the Amazon Connect instance.
