name: get-participant
description: Gets information about the specified participant token.
flags:
    --participant-id=!: Unique identifier for the participant.
    --session-id=!: ID of a session within the stage.
    --stage-arn=!: Stage ARN.
documentation:
    command: Gets information about the specified participant token.
    flag:
        participant-id: Unique identifier for the participant. This is assigned by IVS and returned by [CreateParticipantToken]().
        session-id: ID of a session within the stage.
        stage-arn: Stage ARN.
