name: delete-source-repository
description: Deletes a source repository in Amazon CodeCatalyst.
flags:
    --name=!: The name of the source repository.
    --project-name=!: The name of the project in the space.
    --space-name=!: The name of the space.
documentation:
    command: Deletes a source repository in Amazon CodeCatalyst. You cannot use this API to delete a linked repository. It can only be used to delete a Amazon CodeCatalyst source repository.
    flag:
        name: The name of the source repository.
        project-name: The name of the project in the space.
        space-name: The name of the space.
