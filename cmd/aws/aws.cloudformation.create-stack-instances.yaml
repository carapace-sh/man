name: create-stack-instances
description: Creates stack instances for the specified accounts, within the specified Amazon Web Services Regions.
flags:
    --accounts=:
        description: \[Self-managed permissions] The account IDs of one or more Amazon Web Services accounts that you want to create stack instances in the specified Region(s) for.
        nargs: -1
    --call-as=: \[Service-managed permissions] Specifies whether you are acting as an account administrator in the organization's management account or as a delegated administrator in a member account.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --deployment-targets=: \[Service-managed permissions] The Organizations accounts in which to create stack instances in the specified Amazon Web Services Regions.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --operation-id=: The unique identifier for this StackSet operation.
    --operation-preferences=: Preferences for how CloudFormation performs this StackSet operation.
    --parameter-overrides=:
        description: A list of StackSet parameters whose values you want to override in the selected stack instances.
        nargs: -1
    --regions=!:
        description: The names of one or more Amazon Web Services Regions where you want to create stack instances using the specified Amazon Web Services accounts.
        nargs: -1
    --stack-set-name=!: The name or unique ID of the StackSet that you want to create stack instances from.
completion:
    flag:
        call-as:
            - SELF
            - DELEGATED_ADMIN
documentation:
    command: |-
        Creates stack instances for the specified accounts, within the specified Amazon Web Services Regions. A stack instance refers to a stack in a specific account and Region. You must specify at least one value for either `Accounts` or `DeploymentTargets`, and you must specify at least one value for `Regions`.

        The maximum number of organizational unit (OUs) supported by a `CreateStackInstances` operation is 50.

        If you need more than 50, consider the following options:

        - *Batch processing:* If you don't want to expose your OU hierarchy, split up the operations into multiple calls with less than 50 OUs each.
        - *Parent OU strategy:* If you don't mind exposing the OU hierarchy, target a parent OU that contains all desired child OUs.
    flag:
        accounts: |-
            \[Self-managed permissions] The account IDs of one or more Amazon Web Services accounts that you want to create stack instances in the specified Region(s) for.

            You can specify `Accounts` or `DeploymentTargets`, but not both.
        call-as: "\\[Service-managed permissions] Specifies whether you are acting as an account administrator in the organization's management account or as a delegated administrator in a member account.\n\nBy default, `SELF` is specified. Use `SELF` for StackSets with self-managed permissions.\n\n- If you are signed in to the management account, specify `SELF`.\n- If you are signed in to a delegated administrator account, specify `DELEGATED_ADMIN`.\n  \n  Your Amazon Web Services account must be registered as a delegated administrator in the management account. For more information, see [Register a delegated administrator](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-delegated-admin.html) in the *CloudFormation User Guide*."
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        deployment-targets: |-
            \[Service-managed permissions] The Organizations accounts in which to create stack instances in the specified Amazon Web Services Regions.

            You can specify `Accounts` or `DeploymentTargets`, but not both.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        operation-id: |-
            The unique identifier for this StackSet operation.

            The operation ID also functions as an idempotency token, to ensure that CloudFormation performs the StackSet operation only once, even if you retry the request multiple times. You might retry StackSet operation requests to ensure that CloudFormation successfully received them.

            If you don't specify an operation ID, the SDK generates one automatically.

            Repeating this StackSet operation with a new operation ID retries all stack instances whose status is `OUTDATED`.
        operation-preferences: Preferences for how CloudFormation performs this StackSet operation.
        parameter-overrides: |-
            A list of StackSet parameters whose values you want to override in the selected stack instances.

            Any overridden parameter values will be applied to all stack instances in the specified accounts and Amazon Web Services Regions. When specifying parameters and their values, be aware of how CloudFormation sets parameter values during stack instance operations:

            - To override the current value for a parameter, include the parameter and specify its value.
            - To leave an overridden parameter set to its present value, include the parameter and specify `UsePreviousValue` as `true`. (You can't specify both a value and set `UsePreviousValue` to `true`.)
            - To set an overridden parameter back to the value specified in the StackSet, specify a parameter list but don't include the parameter in the list.
            - To leave all parameters set to their present values, don't specify this property at all.

            During StackSet updates, any parameter values overridden for a stack instance aren't updated, but retain their overridden value.

            You can only override the parameter *values* that are specified in the StackSet; to add or delete a parameter itself, use [UpdateStackSet](https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_UpdateStackSet.html) to update the StackSet template.
        regions: The names of one or more Amazon Web Services Regions where you want to create stack instances using the specified Amazon Web Services accounts.
        stack-set-name: The name or unique ID of the StackSet that you want to create stack instances from.
