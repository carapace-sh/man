name: describe-organization-configuration
description: Returns information about the account selected as the delegated administrator for GuardDuty.
flags:
    --detector-id=!: The detector ID of the delegated administrator for which you need to retrieve the information.
    --max-results=: You can use this parameter to indicate the maximum number of items that you want in the response.
    --next-token=: You can use this parameter when paginating results.
documentation:
    command: |-
        Returns information about the account selected as the delegated administrator for GuardDuty.

        There might be regional differences because some data sources might not be available in all the Amazon Web Services Regions where GuardDuty is presently supported. For more information, see [Regions and endpoints](https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_regions.html).
    flag:
        detector-id: |-
            The detector ID of the delegated administrator for which you need to retrieve the information.

            To find the `detectorId` in the current Region, see the Settings page in the GuardDuty console, or run the [ListDetectors](https://docs.aws.amazon.com/guardduty/latest/APIReference/API_ListDetectors.html) API.
        max-results: You can use this parameter to indicate the maximum number of items that you want in the response.
        next-token: You can use this parameter when paginating results. Set the value of this parameter to null on your first call to the list action. For subsequent calls to the action, fill `nextToken` in the request with the value of `NextToken` from the previous response to continue listing data.
