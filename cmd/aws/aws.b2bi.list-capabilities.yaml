name: list-capabilities
description: Lists the capabilities associated with your Amazon Web Services account for your current or specified region.
flags:
    --max-results=: Specifies the maximum number of capabilities to return.
    --next-token=: When additional results are obtained from the command, a `NextToken` parameter is returned in the output.
documentation:
    command: Lists the capabilities associated with your Amazon Web Services account for your current or specified region. A trading capability contains the information required to transform incoming EDI documents into JSON or XML outputs.
    flag:
        max-results: Specifies the maximum number of capabilities to return.
        next-token: When additional results are obtained from the command, a `NextToken` parameter is returned in the output. You can then pass the `NextToken` parameter in a subsequent command to continue listing additional resources.
