name: add-route-policy
description: '*(BETA)*  Add an empty route policy to a Compute Engine router.'
flags:
    --policy-name=!: Name of the route policy to add.
    --policy-type=!: Type of the route policy to add.
    --region=: Region of the router to update.
completion:
    flag:
        policy-type:
            - EXPORT
            - IMPORT
documentation:
    command: |
        *(BETA)*  *gcloud beta compute routers add-route-policy* adds an empty route policy to a Compute Engine router.
    flag:
        policy-name: Name of the route policy to add.
        policy-type: |-
            Type of the route policy to add. _POLICY_TYPE_ must be one of:
            +
            *EXPORT*::: The route policy is an export policy.
            *IMPORT*::: The route policy is an import policy.
            :::
            +
        region: |-
            Region of the router to update. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
