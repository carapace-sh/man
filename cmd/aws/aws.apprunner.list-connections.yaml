name: list-connections
description: Returns a list of App Runner connections that are associated with your Amazon Web Services account.
flags:
    --connection-name=: If specified, only this connection is returned.
    --max-results=: The maximum number of results to include in each response (result page).
    --next-token=: A token from a previous result page.
documentation:
    command: Returns a list of App Runner connections that are associated with your Amazon Web Services account.
    flag:
        connection-name: If specified, only this connection is returned. If not specified, the result isn't filtered by name.
        max-results: |-
            The maximum number of results to include in each response (result page). Used for a paginated request.

            If you don't specify `MaxResults`, the request retrieves all available results in a single response.
        next-token: |-
            A token from a previous result page. Used for a paginated request. The request retrieves the next result page. All other parameter values must be identical to the ones specified in the initial request.

            If you don't specify `NextToken`, the request retrieves the first result page.
