name: search-contact-flow-modules
description: Searches the flow modules in an Amazon Connect instance, with optional filtering.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
    --search-criteria=: The search criteria to be used to return flow modules.
    --search-filter=: Filters to be applied to search results.
documentation:
    command: Searches the flow modules in an Amazon Connect instance, with optional filtering.
    flag:
        instance-id: The identifier of the Amazon Connect instance. You can find the instance ID in the Amazon Resource Name (ARN) of the instance.
        max-results: The maximum number of results to return per page.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        search-criteria: |-
            The search criteria to be used to return flow modules.

            The `name` and `description` fields support "contains" queries with a minimum of 2 characters and a maximum of 25 characters. Any queries with character lengths outside of this range will result in invalid results.
        search-filter: Filters to be applied to search results.
