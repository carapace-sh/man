completion:
    flag:
        encryption-key-provider:
            - google-managed
            - oracle-managed
        properties-db-edition:
            - enterprise-edition
            - standard-edition
        properties-db-workload:
            - ajd
            - apex
            - dw
            - oltp
        properties-license-type:
            - bring-your-own-license
            - license-included
        properties-maintenance-schedule-type:
            - early
            - regular
documentation:
    command: Update an AutonomousDatabase.
    flag:
        add-properties-allowlisted-ips: Add new value to properties_allowlisted_ips list.
        add-properties-customer-contacts: |-
            Add new value to properties_customer_contacts list. The list of customer contacts.
            +
            *email*:::
            The email address used by Oracle to send notifications regarding databases
            and infrastructure.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --add-properties-customer-contacts=email=string --add-properties-customer-contacts=email=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --add-properties-customer-contacts='[{"email": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --add-properties-customer-contacts=path_to_file.(yaml|json)
            +
            ```
        admin-password: The password for the default ADMIN user.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        cidr: The subnet CIDR range for the Autonomous Database.
        clear-encryption-key-kms: Clear encryption_key_kms value and set to null.
        clear-labels: Clear labels value and set to empty map.
        clear-network: Clear network value and set to null.
        clear-odb-network: Clear odb_network value and set to null.
        clear-odb-subnet: Clear odb_subnet value and set to null.
        clear-properties: Set autonomousDatabase.properties back to default value.
        clear-properties-allowlisted-ips: Clear properties_allowlisted_ips value and set to empty list.
        clear-properties-customer-contacts: Clear properties_customer_contacts value and set to empty list.
        clear-source-config: Set autonomousDatabase.sourceConfig back to default value.
        clear-source-config-autonomous-database: Clear source_config_autonomous_database value and set to null.
        database: |-
            The name of the Autonomous Database. The database name must be unique in
            the project. The name must begin with a letter and can
            contain a maximum of 30 alphanumeric characters.
        display-name: |-
            The display name for the Autonomous Database. The name does not have to
            be unique within your project.
        encryption-key-kms: |-
            ID of the cryptoKey or fully qualified identifier for the cryptoKey.
            +
            To set the `crypto-key` attribute:
            * provide the argument `--encryption-key-kms` on the command line.
        encryption-key-provider: |-
            The provider of the encryption key. _ENCRYPTION_KEY_PROVIDER_ must be one of:
            +
            *google-managed*::: Google Managed KMS key, if selected, please provide the KMS key name.
            *oracle-managed*::: Oracle Managed.
            :::
            +
        key-ring: |-
            The keyRing id of the cryptoKey resource.
            +
            To set the `key-ring` attribute:
            * provide the argument `--current` on the command line with a fully specified name;
            * provide the argument `--key-ring` on the command line.
        labels: |-
            Set labels to new value. The labels or tags associated with the Autonomous Database.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --labels=path_to_file.(yaml|json)
            +
            ```
        location: For resources [autonomous_database, encryption-key-kms, odb-network, odb-subnet, source-config-autonomous-database], provides fallback value for resource location attribute. When the resource's full URI path is not provided, location will fallback to this flag value.
        network: |-
            ID of the network or fully qualified identifier for the network.
            +
            To set the `network` attribute:
            * provide the argument `--network` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-encryption-key-kms: Clear encryption_key_kms value and set to null.
        no-clear-labels: Clear labels value and set to empty map.
        no-clear-network: Clear network value and set to null.
        no-clear-odb-network: Clear odb_network value and set to null.
        no-clear-odb-subnet: Clear odb_subnet value and set to null.
        no-clear-properties: Set autonomousDatabase.properties back to default value.
        no-clear-properties-allowlisted-ips: Clear properties_allowlisted_ips value and set to empty list.
        no-clear-properties-customer-contacts: Clear properties_customer_contacts value and set to empty list.
        no-clear-source-config: Set autonomousDatabase.sourceConfig back to default value.
        no-clear-source-config-autonomous-database: Clear source_config_autonomous_database value and set to null.
        no-properties-is-auto-scaling-enabled: |-
            This field indicates if auto scaling is enabled for the Autonomous Database
            CPU core count.
        no-properties-is-storage-auto-scaling-enabled: |-
            This field indicates if auto scaling is enabled for the Autonomous Database
            storage.
        no-properties-mtls-connection-required: This field specifies if the Autonomous Database requires mTLS connections.
        no-source-config-automatic-backups-replication-enabled: |-
            This field specifies if the replication of automatic backups is enabled
            when creating a Data Guard.
        odb-network: For resources [odb-network, odb-subnet], provides fallback value for resource odb-network attribute. When the resource's full URI path is not provided, odb-network will fallback to this flag value.
        odb-subnet: |-
            ID of the odbSubnet or fully qualified identifier for the odbSubnet.
            +
            To set the `odb-subnet` attribute:
            * provide the argument `--odb-subnet` on the command line.
        properties-allowlisted-ips: Set properties_allowlisted_ips to new value.
        properties-backup-retention-period-days: |-
            The retention period for the Autonomous Database. This field is specified
            in days, can range from 1 day to 60 days, and has a default value of
            60 days.
        properties-character-set: The character set for the Autonomous Database. The default is AL32UTF8.
        properties-compute-count: The number of compute servers for the Autonomous Database.
        properties-cpu-core-count: The number of CPU cores to be made available to the database.
        properties-customer-contacts: |-
            Set properties_customer_contacts to new value. The list of customer contacts.
            +
            *email*:::
            The email address used by Oracle to send notifications regarding databases
            and infrastructure.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --properties-customer-contacts=email=string --properties-customer-contacts=email=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --properties-customer-contacts='[{"email": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --properties-customer-contacts=path_to_file.(yaml|json)
            +
            ```
        properties-data-storage-size-gb: The size of the data stored in the database, in gigabytes.
        properties-data-storage-size-tb: The size of the data stored in the database, in terabytes.
        properties-db-edition: |-
            The edition of the Autonomous Databases. _PROPERTIES_DB_EDITION_ must be one of:
            +
            *enterprise-edition*::: Enterprise Database Edition
            *standard-edition*::: Standard Database Edition
            :::
            +
        properties-db-version: The Oracle Database version for the Autonomous Database.
        properties-db-workload: |-
            The workload type of the Autonomous Database. _PROPERTIES_DB_WORKLOAD_ must be one of:
            +
            *ajd*::: Autonomous JSON Database.
            *apex*::: Autonomous Database with the Oracle APEX Application Development workload
            type.
            *dw*::: Autonomous Data Warehouse database.
            *oltp*::: Autonomous Transaction Processing database.
            :::
            +
        properties-is-auto-scaling-enabled: |-
            This field indicates if auto scaling is enabled for the Autonomous Database
            CPU core count. Use *--properties-is-auto-scaling-enabled* to enable and *--no-properties-is-auto-scaling-enabled* to disable.
        properties-is-storage-auto-scaling-enabled: |-
            This field indicates if auto scaling is enabled for the Autonomous Database
            storage. Use *--properties-is-storage-auto-scaling-enabled* to enable and *--no-properties-is-storage-auto-scaling-enabled* to disable.
        properties-license-type: |-
            The license type used for the Autonomous Database. _PROPERTIES_LICENSE_TYPE_ must be one of:
            +
            *bring-your-own-license*::: Bring your own license
            *license-included*::: License included part of offer
            :::
            +
        properties-maintenance-schedule-type: |-
            The maintenance schedule of the Autonomous Database. _PROPERTIES_MAINTENANCE_SCHEDULE_TYPE_ must be one of:
            +
            *early*::: An EARLY maintenance schedule patches the database before
            the regular scheduled maintenance.
            *regular*::: A REGULAR maintenance schedule follows the normal maintenance cycle.
            :::
            +
        properties-mtls-connection-required: This field specifies if the Autonomous Database requires mTLS connections. Use *--properties-mtls-connection-required* to enable and *--no-properties-mtls-connection-required* to disable.
        properties-n-character-set: |-
            The national character set for the Autonomous Database. The default is
            AL16UTF16.
        properties-private-endpoint-ip: The private endpoint IP address for the Autonomous Database.
        properties-private-endpoint-label: The private endpoint label for the Autonomous Database.
        properties-secret-id: The ID of the Oracle Cloud Infrastructure vault secret.
        properties-vault-id: The ID of the Oracle Cloud Infrastructure vault.
        remove-labels: |-
            Remove existing value from map labels. Sets `remove_labels` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-labels=string,string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-labels=["string"]
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-labels=path_to_file.(yaml|json)
            +
            ```
        remove-properties-allowlisted-ips: Remove existing value from properties_allowlisted_ips list.
        remove-properties-customer-contacts: |-
            Remove existing value from properties_customer_contacts list. The list of customer contacts.
            +
            *email*:::
            The email address used by Oracle to send notifications regarding databases
            and infrastructure.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --remove-properties-customer-contacts=email=string --remove-properties-customer-contacts=email=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --remove-properties-customer-contacts='[{"email": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --remove-properties-customer-contacts=path_to_file.(yaml|json)
            +
            ```
        request-id: |-
            An optional ID to identify the request. This value is used to identify
            duplicate requests. If you make a request with the same request ID
            and the original request is still in progress or completed, the server
            ignores the second request. This prevents clients from
            accidentally creating duplicate commitments.
            +
            The request ID must be a valid UUID with the exception that zero UUID is
            not supported (00000000-0000-0000-0000-000000000000).
        source-config-automatic-backups-replication-enabled: |-
            This field specifies if the replication of automatic backups is enabled
            when creating a Data Guard. Use *--source-config-automatic-backups-replication-enabled* to enable and *--no-source-config-automatic-backups-replication-enabled* to disable.
        source-config-autonomous-database: |-
            ID of the autonomousDatabase or fully qualified identifier for the autonomousDatabase.
            +
            To set the `autonomous-database` attribute:
            * provide the argument `--source-config-autonomous-database` on the command line.
        update-labels: |-
            Update labels value or add key value pair. The labels or tags associated with the Autonomous Database.
            +
            *KEY*:::
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            *VALUE*:::
            Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --update-labels=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --update-labels='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --update-labels=path_to_file.(yaml|json)
            +
            ```
