name: create
description: '*(BETA)*  Create a new secret.'
flags:
    --data-file=: File path from which to read secret data.
    --expire-time=: Timestamp at which to automatically delete the secret.
    --kms-key-name=: Global KMS key with which to encrypt and decrypt the secret.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=!: ID of the location or fully qualified identifier for the location.
    --locations=: Comma-separated list of locations in which the secret should be replicated.
    --next-rotation-time=: Timestamp at which to send rotation notification.
    --regional-kms-key-name=: Regional KMS key with which to encrypt and decrypt the secret.
    --replication-policy-file=: JSON or YAML file to use to read the replication policy.
    --replication-policy=: The type of replication policy to apply to this secret.
    --rotation-period=: Duration of time (in seconds) between rotation notifications.
    --set-annotations=: List of key-value pairs to set as Annotations.
    --tags=: List of tags KEY=VALUE pairs to bind.
    --topics=: List of Pub/Sub topics to configure on the secret.
    --ttl=: Duration of time (in seconds) from the running of the command until the secret is automatically deleted.
    --version-destroy-ttl=: Secret Version Time To Live (TTL) after destruction request.
documentation:
    command: |-
        *(BETA)*  Create a secret with the given name and creates a secret version with the
        given data, if any. Note, the created secret ends with a newline.
        If a secret already exists with the given name, this command will return
        an error.

        ## EXAMPLES

        Create a secret with an automatic replication policy without creating any
        versions:

          $ gcloud beta secrets create my-secret

        Create a new secret named 'my-secret' with an automatic replication policy
        and data from a file:

          $ gcloud beta secrets create my-secret --data-file=/tmp/secret

        Create a new secret named 'my-secret' in 'us-central1' with data from a file:

          $ gcloud beta secrets create my-secret --data-file=/tmp/secret
          --replication-policy=user-managed \
              --locations=us-central1

        Create a new secret named 'my-secret' in 'us-central1' and 'us-east1' with
        the value "s3cr3t":

          $ printf "s3cr3t" | gcloud beta secrets create my-secret --data-file=-
          --replication-policy=user-managed --locations=us-central1,us-east1

        Create a new secret named 'my-secret' in 'us-central1' and 'us-east1' with
        the value "s3cr3t" in PowerShell (Note: PowerShell will add a newline to the
        resulting secret):

          $ Write-Output "s3cr3t" | gcloud beta secrets create my-secret --data-file=-
          --replication-policy=user-managed --locations=us-central1,us-east1

        Create an expiring secret with an automatic replication policy using a ttl:

          $ gcloud beta secrets create my-secret --ttl="600s"

        Create an expiring secret with an automatic replication policy using an
        expire-time:

          $ gcloud beta secrets create my-secret --expire-time="2030-01-01T08:15:30-05:00"

        Create a secret with an automatic replication policy and a next rotation time:

          $ gcloud beta secrets create my-secret --next-rotation-time="2030-01-01T15:30:00-05:00"

        Create a secret with an automatic replication policy and a rotation period:

          $ gcloud beta secrets create my-secret --next-rotation-time="2030-01-01T15:30:00-05:00"
          --rotation-period="7200s"

        Create a secret with delayed secret version destroy enabled:

          $ gcloud beta secrets create my-secret --version-destroy-ttl="86400s"
    flag:
        data-file: File path from which to read secret data. Set this to "-" to read the secret data from stdin.
        expire-time: Timestamp at which to automatically delete the secret.
        kms-key-name: Global KMS key with which to encrypt and decrypt the secret. Only valid for secrets with an automatic replication policy.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line.
        locations: Comma-separated list of locations in which the secret should be replicated.
        next-rotation-time: Timestamp at which to send rotation notification.
        regional-kms-key-name: Regional KMS key with which to encrypt and decrypt the secret. Only valid for regional secrets.
        replication-policy: The type of replication policy to apply to this secret. Allowed values are "automatic" and "user-managed". If user-managed then --locations must also be provided.
        replication-policy-file: JSON or YAML file to use to read the replication policy. The file must conform to https://cloud.google.com/secret-manager/docs/reference/rest/v1/projects.secrets#replication.Set this to "-" to read from stdin.
        rotation-period: Duration of time (in seconds) between rotation notifications.
        set-annotations: List of key-value pairs to set as Annotations. All existing Annotations will be removed first.
        tags: |-
            List of tags KEY=VALUE pairs to bind.
            Each item must be expressed as
            `<tag-key-namespaced-name>=<tag-value-short-name>`.
            +
            Example: `123/environment=production,123/costCenter=marketing`
        topics: List of Pub/Sub topics to configure on the secret.
        ttl: Duration of time (in seconds) from the running of the command until the secret is automatically deleted.
        version-destroy-ttl: Secret Version Time To Live (TTL) after destruction request. For secret with TTL>0, version destruction does not happen immediately on calling destroy; instead, the version goes to a disabled state and destruction happens after the TTL expires. See `$ gcloud topic datetimes` for information on duration formats.
