name: delete
description: '*(BETA)*  Delete a Rule in a Compute Engine NAT.'
flags:
    --nat=!: Name of the NAT that contains the Rule
    --region=: Region of the NAT containing the Rules to delete.
    --router-region=&: 'Region of the router to operate on. '
    --router=!: Router to use for NAT.
documentation:
    command: |
        *(BETA)*  *gcloud beta compute routers nats rules delete* is used to delete a Rule on a Compute Engine NAT.
    flag:
        nat: Name of the NAT that contains the Rule
        region: |-
            Region of the NAT containing the Rules to delete. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
        router: Router to use for NAT.
        router-region: 'Region of the router to operate on. '
