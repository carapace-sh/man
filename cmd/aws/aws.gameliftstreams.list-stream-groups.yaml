name: list-stream-groups
description: Retrieves a list of all Amazon GameLift Streams stream groups that are associated with the Amazon Web Services account in use.
flags:
    --max-results=: The number of results to return.
    --next-token=: A token that marks the start of the next set of results.
documentation:
    command: Retrieves a list of all Amazon GameLift Streams stream groups that are associated with the Amazon Web Services account in use. This operation returns stream groups in all statuses, in no particular order. You can paginate the results as needed.
    flag:
        max-results: The number of results to return. Use this parameter with `NextToken` to return results in sequential pages. Default value is `25`.
        next-token: A token that marks the start of the next set of results. Use this token when you retrieve results as sequential pages. To get the first page of results, omit a token value. To get the remaining pages, provide the token returned with the previous result set.
