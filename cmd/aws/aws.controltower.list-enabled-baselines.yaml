name: list-enabled-baselines
description: Returns a list of summaries describing `EnabledBaseline` resources.
flags:
    --filter=: A filter applied on the `ListEnabledBaseline` operation.
    --include-children: A value that can be set to include the child enabled baselines in responses.
    --max-results=: The maximum number of results to be shown.
    --next-token=: A pagination token.
    --no-include-children&: A value that can be set to include the child enabled baselines in responses.
documentation:
    command: Returns a list of summaries describing `EnabledBaseline` resources. You can filter the list by the corresponding `Baseline` or `Target` of the `EnabledBaseline` resources. For usage examples, see [*the Amazon Web Services Control Tower User Guide*](https://docs.aws.amazon.com/controltower/latest/userguide/baseline-api-examples.html) .
    flag:
        filter: A filter applied on the `ListEnabledBaseline` operation. Allowed filters are `baselineIdentifiers` and `targetIdentifiers`. The filter can be applied for either, or both.
        include-children: A value that can be set to include the child enabled baselines in responses. The default value is false.
        max-results: The maximum number of results to be shown.
        next-token: A pagination token.
