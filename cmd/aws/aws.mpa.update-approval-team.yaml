name: update-approval-team
description: Updates an approval team.
flags:
    --approval-strategy=: An `ApprovalStrategy` object.
    --approvers=:
        description: An array of `ApprovalTeamRequestApprover` objects.
        nargs: -1
    --arn=!: Amazon Resource Name (ARN) for the team.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: Description for the team.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
documentation:
    command: |-
        Updates an approval team. You can request to update the team description, approval threshold, and approvers in the team.

        **Updates require team approval**

        Updates to an active team must be approved by the team.
    flag:
        approval-strategy: An `ApprovalStrategy` object. Contains details for how the team grants approval.
        approvers: An array of `ApprovalTeamRequestApprover` objects. Contains details for the approvers in the team.
        arn: Amazon Resource Name (ARN) for the team.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: Description for the team.
        generate-cli-skeleton: |-
