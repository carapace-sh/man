name: enforce
description: '*(ALPHA)*  Enforces a Service Perimeter''s dry-run configuration.'
flags:
    --async: Return immediately, without waiting for the operation in
    --no-async&: Return immediately, without waiting for the operation in
    --policy=: The ID of the access policy.
documentation:
    command: |-
        *(ALPHA)*  Copies a Service Perimeter's dry-run mode configuration to its
        enforcement mode configuration and unsets the explicit dry-run spec.
        After this operation succeeds, the Service Perimeter will not have
        an explicit dry-run mode configuration, and, instead, the previous
        dry-run mode configuration will become the enforcement mode
        configuration. The operation will not be performed if there is no
        explicit dry-run mode configuration or if the dry-run mode
        configuration is incompatible with the overall enforcement mode VPC
        Service Controls policy.
    flag:
        async: |-
            Return immediately, without waiting for the operation in
                        progress to complete.
        no-async: |-
            Return immediately, without waiting for the operation in
                        progress to complete.
        policy: |-
            The ID of the access policy.
            +
            To set the `policy` attribute:
            * provide the argument `perimeter` on the command line with a fully specified name;
            * provide the argument `--policy` on the command line;
            * set the property `access_context_manager/policy`.
