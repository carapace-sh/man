name: list-app-input-sources
description: Lists all the input sources of the Resilience Hub application.
flags:
    --app-arn=!: Amazon Resource Name (ARN) of the Resilience Hub application.
    --app-version=!: Resilience Hub application version.
    --max-results=: Maximum number of input sources to be displayed per Resilience Hub application.
    --next-token=: Null, or the token from a previous call to get the next set of results.
documentation:
    command: Lists all the input sources of the Resilience Hub application. For more information about the input sources supported by Resilience Hub, see [Discover the structure and describe your Resilience Hub application](https://docs.aws.amazon.com/resilience-hub/latest/userguide/discover-structure.html).
    flag:
        app-arn: 'Amazon Resource Name (ARN) of the Resilience Hub application. The format for this ARN is: arn:`partition`:resiliencehub:`region`:`account`:app/`app-id`. For more information about ARNs, see [Amazon Resource Names (ARNs)](https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html) in the *Amazon Web Services General Reference* guide.'
        app-version: Resilience Hub application version.
        max-results: Maximum number of input sources to be displayed per Resilience Hub application.
        next-token: Null, or the token from a previous call to get the next set of results.
