name: describe
description: Describe a group.
flags:
    --hub=: Id of the hub.
documentation:
    command: |
        Retrieve and display details about a group.
    flag:
        hub: |-
            Id of the hub.
            +
            To set the `hub` attribute:
            * provide the argument `group` on the command line with a fully specified name;
            * provide the argument `--hub` on the command line.
