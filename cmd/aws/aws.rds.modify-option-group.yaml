name: modify-option-group
description: Modifies an existing option group.
flags:
    --apply-immediately: Specifies whether to apply the change immediately or during the next maintenance window for each instance associated with the option group.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-apply-immediately: Specifies whether to apply the change immediately or during the next maintenance window for each instance associated with the option group.
    --option-group-name=!: The name of the option group to be modified.
    --options-to-include=: Options in this list are added to the option group or, if already present, the specified configuration is used to update the existing configuration.
    --options-to-remove=: Options in this list are removed from the option group.
documentation:
    command: Modifies an existing option group.
    flag:
        apply-immediately: Specifies whether to apply the change immediately or during the next maintenance window for each instance associated with the option group.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        option-group-name: |-
            The name of the option group to be modified.

            Permanent options, such as the TDE option for Oracle Advanced Security TDE, can't be removed from an option group, and that option group can't be removed from a DB instance once it is associated with a DB instance
        options-to-include: Options in this list are added to the option group or, if already present, the specified configuration is used to update the existing configuration.
        options-to-remove: Options in this list are removed from the option group.
