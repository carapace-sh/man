    --cli-input-yaml=: Read arguments from the YAML string provided.
    --directory-arn=!: The Amazon Resource Name (ARN) of the directory where you want to detach the typed link.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --typed-link-specifier=!: Used to accept a typed link specifier as input.
documentation:
    command: Detaches a typed link from a specified source and target object. For more information, see [Typed Links](https://docs.aws.amazon.com/clouddirectory/latest/developerguide/directory_objects_links.html#directory_objects_links_typedlink).
