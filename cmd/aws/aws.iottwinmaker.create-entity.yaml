name: create-entity
description: Creates an entity.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --components=: An object that maps strings to the components in the entity.
    --composite-components=: This is an object that maps strings to `compositeComponent` updates in the request.
    --description=: The description of the entity.
    --entity-id=: The ID of the entity.
    --entity-name=!: The name of the entity.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --parent-entity-id=: The ID of the entity's parent entity.
    --tags=: Metadata that you can use to manage the entity.
    --workspace-id=!: The ID of the workspace that contains the entity.
documentation:
    command: Creates an entity.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        components: An object that maps strings to the components in the entity. Each string in the mapping must be unique to this object.
        composite-components: This is an object that maps strings to `compositeComponent` updates in the request. Each key of the map represents the `componentPath` of the `compositeComponent`.
        description: The description of the entity.
        entity-id: The ID of the entity.
        entity-name: The name of the entity.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        parent-entity-id: The ID of the entity's parent entity.
        tags: Metadata that you can use to manage the entity.
        workspace-id: The ID of the workspace that contains the entity.
