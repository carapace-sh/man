name: create-service-network-vpc-association
description: Associates a VPC with a service network.
flags:
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --dns-options=: DNS options for the service network VPC association.
    --no-private-dns-enabled&: Indicates if private DNS is enabled for the VPC association.
    --private-dns-enabled: Indicates if private DNS is enabled for the VPC association.
    --security-group-ids=: The IDs of the security groups.
    --service-network-identifier=!: The ID or ARN of the service network.
    --tags=: The tags for the association.
    --vpc-identifier=!: The ID of the VPC.
documentation:
    command: |-
        Associates a VPC with a service network. When you associate a VPC with the service network, it enables all the resources within that VPC to be clients and communicate with other services in the service network. For more information, see [Manage VPC associations](https://docs.aws.amazon.com/vpc-lattice/latest/ug/service-network-associations.html#service-network-vpc-associations) in the *Amazon VPC Lattice User Guide*.

        You can't use this operation if there is a disassociation in progress. If the association fails, retry by deleting the association and recreating it.

        As a result of this operation, the association gets created in the service network account and the VPC owner account.

        If you add a security group to the service network and VPC association, the association must continue to always have at least one security group. You can add or edit security groups at any time. However, to remove all security groups, you must first delete the association and recreate it without security groups.
    flag:
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If you retry a request that completed successfully using the same client token and parameters, the retry succeeds without performing any actions. If the parameters aren't identical, the retry fails.
        dns-options: DNS options for the service network VPC association.
        private-dns-enabled: Indicates if private DNS is enabled for the VPC association.
        security-group-ids: The IDs of the security groups. Security groups aren't added by default. You can add a security group to apply network level controls to control which resources in a VPC are allowed to access the service network and its services. For more information, see [Control traffic to resources using security groups](https://docs.aws.amazon.com/vpc/latest/userguide/VPC_SecurityGroups.html) in the *Amazon VPC User Guide*.
        service-network-identifier: The ID or ARN of the service network. You must use an ARN if the resources are in different accounts.
        tags: The tags for the association.
        vpc-identifier: The ID of the VPC.
