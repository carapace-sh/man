name: update-classification-job
description: Changes the status of a classification job.
flags:
    --job-id=!: The unique identifier for the classification job.
    --job-status=!: The new status for the job.
completion:
    flag:
        job-status:
            - RUNNING
            - PAUSED
            - CANCELLED
            - COMPLETE
            - IDLE
            - USER_PAUSED
documentation:
    command: Changes the status of a classification job.
    flag:
        job-id: The unique identifier for the classification job.
        job-status: "The new status for the job. Valid values are:\n\n- CANCELLED - Stops the job permanently and cancels it. This value is valid only if the job's current status is IDLE, PAUSED, RUNNING, or USER\\_PAUSED.\n  \n  If you specify this value and the job's current status is RUNNING, Amazon Macie immediately begins to stop all processing tasks for the job. You can't resume or restart a job after you cancel it.\n- RUNNING - Resumes the job. This value is valid only if the job's current status is USER\\_PAUSED.\n  \n  If you paused the job while it was actively running and you specify this value less than 30 days after you paused the job, Macie immediately resumes processing from the point where you paused the job. Otherwise, Macie resumes the job according to the schedule and other settings for the job.\n- USER\\_PAUSED - Pauses the job temporarily. This value is valid only if the job's current status is IDLE, PAUSED, or RUNNING. If you specify this value and the job's current status is RUNNING, Macie immediately begins to pause all processing tasks for the job.\n  \n  If you pause a one-time job and you don't resume it within 30 days, the job expires and Macie cancels the job. If you pause a recurring job when its status is RUNNING and you don't resume it within 30 days, the job run expires and Macie cancels the run. To check the expiration date, refer to the UserPausedDetails.jobExpiresAt property."
