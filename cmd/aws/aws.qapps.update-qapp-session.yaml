name: update-qapp-session
description: Updates the session for a given Q App `sessionId`.
flags:
    --instance-id=!: The unique identifier of the Amazon Q Business application environment instance.
    --session-id=!: The unique identifier of the Q App session to provide input for.
    --values=: The input values to provide for the current state of the Q App session.
documentation:
    command: Updates the session for a given Q App `sessionId`. This is only valid when at least one card of the session is in the `WAITING` state. Data for each `WAITING` card can be provided as input. If inputs are not provided, the call will be accepted but session will not move forward. Inputs for cards that are not in the `WAITING` status will be ignored.
    flag:
        instance-id: The unique identifier of the Amazon Q Business application environment instance.
        session-id: The unique identifier of the Q App session to provide input for.
        values: The input values to provide for the current state of the Q App session.
