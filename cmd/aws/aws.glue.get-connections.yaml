name: get-connections
description: Retrieves a list of connection definitions from the Data Catalog.
flags:
    --catalog-id=: The ID of the Data Catalog in which the connections reside.
    --filter=: A filter that controls which connections are returned.
    --hide-password: Allows you to retrieve the connection metadata without returning the password.
    --max-results=: The maximum number of connections to return in one response.
    --next-token=: A continuation token, if this is a continuation call.
    --no-hide-password&: Allows you to retrieve the connection metadata without returning the password.
documentation:
    command: Retrieves a list of connection definitions from the Data Catalog.
    flag:
        catalog-id: The ID of the Data Catalog in which the connections reside. If none is provided, the Amazon Web Services account ID is used by default.
        filter: A filter that controls which connections are returned.
        hide-password: Allows you to retrieve the connection metadata without returning the password. For instance, the Glue console uses this flag to retrieve the connection, and does not display the password. Set this parameter when the caller might not have permission to use the KMS key to decrypt the password, but it does have permission to access the rest of the connection properties.
        max-results: The maximum number of connections to return in one response.
        next-token: A continuation token, if this is a continuation call.
