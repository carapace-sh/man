name: detect-phi
description: Inspects the clinical text for protected health information (PHI) entities and returns the entity category, location, and confidence score for each entity.
flags:
    --text=!: A UTF-8 text string containing the clinical content being examined for PHI entities.
documentation:
    command: Inspects the clinical text for protected health information (PHI) entities and returns the entity category, location, and confidence score for each entity. Amazon Comprehend Medical only detects entities in English language texts.
    flag:
        text: A UTF-8 text string containing the clinical content being examined for PHI entities.
