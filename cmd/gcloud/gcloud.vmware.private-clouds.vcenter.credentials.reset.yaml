name: reset
description: Reset VMware vCenter sign-in credentials associated with a Google Cloud VMware Engine private cloud.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Location of the private cloud or cluster.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --private-cloud=!: ID of the private cloud or fully qualified identifier for the private cloud.
    --username=&: The username of the user to reset the credentials.
documentation:
    command: |
        Reset VMware vCenter sign-in credentials associated with a VMware Engine private cloud.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        location: |-
            Location of the private cloud or cluster.
            +
            To set the `location` attribute:
            * provide the argument `--private-cloud` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `compute/zone`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        private-cloud: |-
            ID of the private cloud or fully qualified identifier for the private cloud.
            +
            To set the `private-cloud` attribute:
            * provide the argument `--private-cloud` on the command line.
        username: |
            The username of the user to reset the credentials.
