name: update-invoice-unit
description: You can update the invoice unit configuration at any time, and Amazon Web Services will use the latest configuration at the end of the month.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The assigned description for an invoice unit.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --invoice-unit-arn=!: The ARN to identify an invoice unit.
    --no-tax-inheritance-disabled: Whether the invoice unit based tax inheritance is/ should be enabled or disabled.
    --rule=: The `InvoiceUnitRule` object used to update invoice units.
    --tax-inheritance-disabled: Whether the invoice unit based tax inheritance is/ should be enabled or disabled.
documentation:
    command: You can update the invoice unit configuration at any time, and Amazon Web Services will use the latest configuration at the end of the month.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The assigned description for an invoice unit. This information can't be modified or deleted.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        invoice-unit-arn: The ARN to identify an invoice unit. This information can't be modified or deleted.
        rule: The `InvoiceUnitRule` object used to update invoice units.
        tax-inheritance-disabled: Whether the invoice unit based tax inheritance is/ should be enabled or disabled.
