name: delete-default-sender-id
description: Deletes an existing default sender ID on a configuration set.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --configuration-set-name=!: The name of the configuration set or the configuration set Amazon Resource Name (ARN) to delete the default sender ID from.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
documentation:
    command: |-
        Deletes an existing default sender ID on a configuration set.

        A default sender ID is the identity that appears on recipients' devices when they receive SMS messages. Support for sender ID capabilities varies by country or region.
    flag:
