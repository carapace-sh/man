name: create-endpoint-group
description: Create an endpoint group for the specified listener.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --endpoint-configurations=:
        description: The list of endpoint objects.
        nargs: -1
    --endpoint-group-region=!: The Amazon Web Services Region where the endpoint group is located.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --health-check-interval-seconds=: The time—10 seconds or 30 seconds—between each health check for an endpoint.
    --health-check-path=: If the protocol is HTTP/S, then this specifies the path that is the destination for health check targets.
    --health-check-port=: The port that Global Accelerator uses to check the health of endpoints that are part of this endpoint group.
    --health-check-protocol=: The protocol that Global Accelerator uses to check the health of endpoints that are part of this endpoint group.
    --idempotency-token=!: A unique, case-sensitive identifier that you provide to ensure the idempotency—that is, the uniqueness—of the request.
    --listener-arn=!: The Amazon Resource Name (ARN) of the listener.
    --port-overrides=:
        description: Override specific listener ports used to route traffic to endpoints that are part of this endpoint group.
        nargs: -1
    --threshold-count=: The number of consecutive health checks required to set the state of a healthy endpoint to unhealthy, or to set an unhealthy endpoint to healthy.
    --traffic-dial-percentage=: The percentage of traffic to send to an Amazon Web Services Region.
completion:
    flag:
        health-check-protocol:
            - TCP
            - HTTP
            - HTTPS
documentation:
    command: |-
        Create an endpoint group for the specified listener. An endpoint group is a collection of endpoints in one Amazon Web Services Region. A resource must be valid and active when you add it as an endpoint.

        For more information about endpoint types and requirements for endpoints that you can add to Global Accelerator, see [Endpoints for standard accelerators](https://docs.aws.amazon.com/global-accelerator/latest/dg/about-endpoints.html) in the *Global Accelerator Developer Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        endpoint-configurations: The list of endpoint objects.
        endpoint-group-region: The Amazon Web Services Region where the endpoint group is located. A listener can have only one endpoint group in a specific Region.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        health-check-interval-seconds: The time—10 seconds or 30 seconds—between each health check for an endpoint. The default value is 30.
        health-check-path: If the protocol is HTTP/S, then this specifies the path that is the destination for health check targets. The default value is slash (/).
        health-check-port: The port that Global Accelerator uses to check the health of endpoints that are part of this endpoint group. The default port is the listener port that this endpoint group is associated with. If listener port is a list of ports, Global Accelerator uses the first port in the list.
        health-check-protocol: The protocol that Global Accelerator uses to check the health of endpoints that are part of this endpoint group. The default value is TCP.
        idempotency-token: A unique, case-sensitive identifier that you provide to ensure the idempotency—that is, the uniqueness—of the request.
        listener-arn: The Amazon Resource Name (ARN) of the listener.
        port-overrides: |-
            Override specific listener ports used to route traffic to endpoints that are part of this endpoint group. For example, you can create a port override in which the listener receives user traffic on ports 80 and 443, but your accelerator routes that traffic to ports 1080 and 1443, respectively, on the endpoints.

            For more information, see [Overriding listener ports](https://docs.aws.amazon.com/global-accelerator/latest/dg/about-endpoint-groups-port-override.html) in the *Global Accelerator Developer Guide*.
        threshold-count: The number of consecutive health checks required to set the state of a healthy endpoint to unhealthy, or to set an unhealthy endpoint to healthy. The default value is 3.
        traffic-dial-percentage: |-
            The percentage of traffic to send to an Amazon Web Services Region. Additional traffic is distributed to other endpoint groups for this listener.

            Use this action to increase (dial up) or decrease (dial down) traffic to a specific Region. The percentage is applied to the traffic that would otherwise have been routed to the Region based on optimal routing.

            The default value is 100.
