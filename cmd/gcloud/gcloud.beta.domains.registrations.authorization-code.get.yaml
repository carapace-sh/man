name: get
description: '*(BETA)*  Get authorization code of a specific Cloud Domains registration.'
documentation:
    command: |-
        *(BETA)*  Get authorization code of a specific registration.

        You can call this API only after 60 days have elapsed since initial
        registration.

        ## EXAMPLES

        To get authorization code of ``example.com'', run:

          $ gcloud beta domains registrations authorization-code get example.com
