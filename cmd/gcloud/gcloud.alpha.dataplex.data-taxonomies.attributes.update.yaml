name: update
description: '*(ALPHA)*  Update a Dataplex Data Attribute.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --data-readers=: The set of principals to be granted reader role on the resource.
    --data-taxonomy=: The name of data attribute to use.
    --description=: Description of the Data Attribute.
    --display-name=: Display Name of the Data Attribute.
    --etag=: etag value of the Data Attribute resource.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location of the Dataplex resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-validate-only&: Validate the update action, but don't actually perform it.
    --parent=: Parent Data Attribute for the defined Data Attribute.
    --resource-owners=: The set of principals to be granted owner role on the resource.
    --resource-readers=: The set of principals to be granted reader role on the resource.
    --resource-writers=: The set of principals to be granted writer role on the resource.
    --validate-only: Validate the update action, but don't actually perform it.
documentation:
    command: '*(ALPHA)*  Update a Dataplex Data Attribute.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        data-readers: The set of principals to be granted reader role on the resource. Expected principal formats are user:$userEmail, group:$groupEmail
        data-taxonomy: |-
            The name of data attribute to use.
            +
            To set the `data_taxonomy` attribute:
            * provide the argument `data_attribute` on the command line with a fully specified name;
            * provide the argument `--data_taxonomy` on the command line.
        description: Description of the Data Attribute.
        display-name: Display Name of the Data Attribute.
        etag: etag value of the Data Attribute resource.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location of the Dataplex resource.
            +
            To set the `location` attribute:
            * provide the argument `data_attribute` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `dataplex/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-validate-only: Validate the update action, but don't actually perform it.
        parent: Parent Data Attribute for the defined Data Attribute. It can be attribute name or fully qualified attribute name.
        resource-owners: The set of principals to be granted owner role on the resource. Expected principal formats are user:$userEmail, group:$groupEmail
        resource-readers: The set of principals to be granted reader role on the resource. Expected principal formats are user:$userEmail, group:$groupEmail
        resource-writers: The set of principals to be granted writer role on the resource. Expected principal formats are user:$userEmail, group:$groupEmail
        validate-only: Validate the update action, but don't actually perform it.
