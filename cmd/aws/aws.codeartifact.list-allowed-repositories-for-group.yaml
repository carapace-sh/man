name: list-allowed-repositories-for-group
description: Lists the repositories in the added repositories list of the specified restriction type for a package group.
flags:
    --domain-owner=: The 12-digit account number of the Amazon Web Services account that owns the domain.
    --domain=!: The name of the domain that contains the package group from which to list allowed repositories.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
    --origin-restriction-type=!: The origin configuration restriction type of which to list allowed repositories.
    --package-group=!: The pattern of the package group from which to list allowed repositories.
completion:
    flag:
        origin-restriction-type:
            - EXTERNAL_UPSTREAM
            - INTERNAL_UPSTREAM
            - PUBLISH
documentation:
    command: Lists the repositories in the added repositories list of the specified restriction type for a package group. For more information about restriction types and added repository lists, see [Package group origin controls](https://docs.aws.amazon.com/codeartifact/latest/ug/package-group-origin-controls.html) in the *CodeArtifact User Guide*.
    flag:
        domain: The name of the domain that contains the package group from which to list allowed repositories.
        domain-owner: The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces.
        max-results: The maximum number of results to return per page.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        origin-restriction-type: The origin configuration restriction type of which to list allowed repositories.
        package-group: The pattern of the package group from which to list allowed repositories.
