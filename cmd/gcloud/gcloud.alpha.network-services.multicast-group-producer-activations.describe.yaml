name: describe
description: '*(ALPHA)*  Describe a multicast group producer activation.'
flags:
    --location=: The location Id.
documentation:
    command: |
        *(ALPHA)*  Show details of a multicastgroup producer activation in the specified location of the current project.
    flag:
        location: |-
            The location Id.
            +
            To set the `location` attribute:
            * provide the argument `multicast_group_producer_activation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
