name: get-subscription-definition-version
description: Retrieves information about a subscription definition version.
flags:
    --next-token=: The token for the next set of results, or ''null'' if there are no additional results.
    --subscription-definition-id=!: The ID of the subscription definition.
    --subscription-definition-version-id=!: The ID of the subscription definition version.
documentation:
    command: Retrieves information about a subscription definition version.
    flag:
        next-token: The token for the next set of results, or ''null'' if there are no additional results.
        subscription-definition-id: The ID of the subscription definition.
        subscription-definition-version-id: The ID of the subscription definition version. This value maps to the ''Version'' property of the corresponding ''VersionInformation'' object, which is returned by ''ListSubscriptionDefinitionVersions'' requests. If the version is the last one that was associated with a subscription definition, the value also maps to the ''LatestVersion'' property of the corresponding ''DefinitionInformation'' object.
