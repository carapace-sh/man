name: search-content
description: Searches for content in a specified knowledge base.
flags:
    --knowledge-base-id=!: The identifier of the knowledge base.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
    --search-expression=!: The search expression to filter results.
documentation:
    command: Searches for content in a specified knowledge base. Can be used to get a specific content resource by its name.
    flag:
        knowledge-base-id: The identifier of the knowledge base. This should not be a QUICK\_RESPONSES type knowledge base. Can be either the ID or the ARN. URLs cannot contain the ARN.
        max-results: The maximum number of results to return per page.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        search-expression: The search expression to filter results.
