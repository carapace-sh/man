name: create
description: Create a new root certificate authority.
flags:
    --auto-enable: If this flag is set, the Certificate Authority will be automatically enabled upon creation.
    --bucket=: The name of an existing storage bucket to use for storing the CA certificates and CRLs for CAs in this pool.
    --custom-aia-urls=: One or more comma-separated URLs that will be added to the Authority Information Access extension in the issued certificate.
    --custom-cdp-urls=: One or more comma-separated URLs that will be added to the CRL Distribution Points (CDP) extension in the issued certificate.
    --dns-san=: One or more comma-separated DNS Subject Alternative Names.
    --email-san=: One or more comma-separated email Subject Alternative Names.
    --extended-key-usages=: The list of extended key usages for this CA.
    --from-ca=!: ID of the source CA or fully qualified identifier for the source CA.
    --ip-san=: One or more comma-separated IP Subject Alternative Names.
    --key-algorithm=: The crypto algorithm to use for creating a managed KMS key for the Certificate Authority.
    --key-usages=: The list of key usages for this CA.
    --kms-key-version=!: ID of the key version or fully qualified identifier for the key version.
    --kms-key=: The KMS key of the key version.
    --kms-keyring=: The KMS keyring of the key version.
    --kms-location=: The location of the key version.
    --kms-project=: The project containing the key version.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location of the Certificate Authority.
    --max-chain-length=: Maximum depth of subordinate CAs allowed under this CA for a CA certificate.
    --name-constraints-critical: Indicates whether or not name constraints are marked as critical.
    --name-excluded-dns=: One or more comma-separated DNS names which are excluded from being issued certificates.
    --name-excluded-email=: One or more comma-separated emails which are excluded from being issued certificates.
    --name-excluded-ip=: One or more comma-separated IP ranges which are excluded from being issued certificates.
    --name-excluded-uri=: One or more comma-separated URIs which are excluded from being issued certificates.
    --name-permitted-dns=: One or more comma-separated  DNS names which are permitted to be issued certificates.
    --name-permitted-email=: One or more comma-separated email addresses which are permitted to be issued certificates.
    --name-permitted-ip=: One or more comma-separated IP ranges which are permitted to be issued certificates.
    --name-permitted-uri=: One or more comma-separated URIs which are permitted to be issued certificates.
    --no-auto-enable&: If this flag is set, the Certificate Authority will be automatically enabled upon creation.
    --no-name-constraints-critical&: Indicates whether or not name constraints are marked as critical.
    --no-unconstrained-chain-length&: If set, allows an unbounded number of subordinate CAs under this newly issued CA certificate.
    --pool=: The parent CA Pool of the Certificate Authority.
    --subject-file=&: A yaml file containing the RDN sequence for the Subject field.
    --subject-key-id=: Optional field to specify subject key ID for certificate.
    --subject=: X.501 name of the certificate subject.
    --unconstrained-chain-length: If set, allows an unbounded number of subordinate CAs under this newly issued CA certificate.
    --uri-san=: One or more comma-separated URI Subject Alternative Names.
    --use-preset-profile=: The name of an existing preset profile used to encapsulate X.509 parameter values.
    --validity=: The validity of this CA, as an ISO8601 duration.
completion:
    flag:
        key-algorithm:
            - ec-p256-sha256
            - ec-p384-sha384
            - rsa-pkcs1-2048-sha256
            - rsa-pkcs1-3072-sha256
            - rsa-pkcs1-4096-sha256
            - rsa-pss-2048-sha256
            - rsa-pss-3072-sha256
            - rsa-pss-4096-sha256
documentation:
    command: |-
        TIP: Consider setting a [project lien](https://cloud.google.com/resource-manager/docs/project-liens) on the project to prevent it from accidental deletion.

        ## EXAMPLES

        To create a root CA that supports one layer of subordinates:

            $ gcloud privateca roots create prod-root \
                --location=us-west1 --pool=my-pool \
                --kms-key-version="projects/my-project-pki/locations/us-west1/keyRings/kr1/cryptoKeys/k1/cryptoKeyVersions/1" \
                --subject="CN=Example Production Root CA, O=Google" \
                --max-chain-length=1

        To create a root CA that is based on an existing CA:

            $ gcloud privateca roots create prod-root \
                --location=us-west1 --pool=my-pool \
                --kms-key-version="projects/my-project-pki/locations/us-west1/keyRings/kr1/cryptoKeys/k1/cryptoKeyVersions/1" \
                --from-ca=source-root
    flag:
        auto-enable: If this flag is set, the Certificate Authority will be automatically enabled upon creation.
        bucket: The name of an existing storage bucket to use for storing the CA certificates and CRLs for CAs in this pool. If omitted, a new bucket will be created and managed by the service on your behalf.
        custom-aia-urls: One or more comma-separated URLs that will be added to the Authority Information Access extension in the issued certificate. These URLs are where the issuer CA certificate is located.
        custom-cdp-urls: One or more comma-separated URLs that will be added to the CRL Distribution Points (CDP) extension in the issued certificate. These URLs are where CRL information is located.
        dns-san: One or more comma-separated DNS Subject Alternative Names.
        email-san: One or more comma-separated email Subject Alternative Names.
        extended-key-usages: 'The list of extended key usages for this CA. This can only be provided if `--use-preset-profile` is not provided. _EXTENDED_KEY_USAGES_ must be one of: *server_auth*, *client_auth*, *code_signing*, *email_protection*, *time_stamping*, *ocsp_signing*.'
        from-ca: |-
            ID of the source CA or fully qualified identifier for the source CA.
            +
            To set the `certificate_authority` attribute:
            * provide the argument `--from-ca` on the command line.
        ip-san: One or more comma-separated IP Subject Alternative Names.
        key-algorithm: 'The crypto algorithm to use for creating a managed KMS key for the Certificate Authority. The default is *rsa-pkcs1-4096-sha256*. _KEY_ALGORITHM_ must be one of: *ec-p256-sha256*, *ec-p384-sha384*, *rsa-pkcs1-2048-sha256*, *rsa-pkcs1-3072-sha256*, *rsa-pkcs1-4096-sha256*, *rsa-pss-2048-sha256*, *rsa-pss-3072-sha256*, *rsa-pss-4096-sha256*.'
        key-usages: 'The list of key usages for this CA. This can only be provided if `--use-preset-profile` is not provided. _KEY_USAGES_ must be one of: *digital_signature*, *content_commitment*, *key_encipherment*, *data_encipherment*, *key_agreement*, *cert_sign*, *crl_sign*, *encipher_only*, *decipher_only*.'
        kms-key: |-
            The KMS key of the key version.
            +
            To set the `kms-key` attribute:
            * provide the argument `--kms-key-version` on the command line with a fully specified name;
            * provide the argument `--kms-key` on the command line.
        kms-key-version: |-
            ID of the key version or fully qualified identifier for the key version.
            +
            To set the `kms-key-version` attribute:
            * provide the argument `--kms-key-version` on the command line.
        kms-keyring: |-
            The KMS keyring of the key version.
            +
            To set the `kms-keyring` attribute:
            * provide the argument `--kms-key-version` on the command line with a fully specified name;
            * provide the argument `--kms-keyring` on the command line.
        kms-location: |-
            The location of the key version.
            +
            To set the `kms-location` attribute:
            * provide the argument `--kms-key-version` on the command line with a fully specified name;
            * provide the argument `--kms-location` on the command line;
            * provide the argument `location` on the command line;
            * set the property `privateca/location`.
        kms-project: |-
            The project containing the key version.
            +
            To set the `kms-project` attribute:
            * provide the argument `--kms-key-version` on the command line with a fully specified name;
            * provide the argument `--kms-project` on the command line;
            * provide the argument `project` on the command line;
            * set the property `core/project`.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location of the Certificate Authority.
            +
            To set the `location` attribute:
            * provide the argument `CERTIFICATE_AUTHORITY` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `privateca/location`.
        max-chain-length: Maximum depth of subordinate CAs allowed under this CA for a CA certificate. This can only be provided if neither `--use-preset-profile` nor `--unconstrained-chain-length` are provided.
        name-constraints-critical: Indicates whether or not name constraints are marked as critical. Name constraints are considered critical unless explicitly set to false. Enabled by default, use *--no-name-constraints-critical* to disable.
        name-excluded-dns: One or more comma-separated DNS names which are excluded from being issued certificates. Any DNS name that can be constructed by simply adding zero or more labels to the left-hand side of the name satisfies the name constraint. For example, `example.com`, `www.example.com`, `www.sub.example.com` would satisfy `example.com`, while `example1.com` does not.
        name-excluded-email: One or more comma-separated emails which are excluded from being issued certificates. The value can be a particular email address, a hostname to indicate all email addresses on that host or a domain with a leading period (e.g. `.example.com`) to indicate all email addresses in that domain.
        name-excluded-ip: One or more comma-separated IP ranges which are excluded from being issued certificates. For IPv4 addresses, the ranges are expressed using CIDR notation as specified in RFC 4632. For IPv6 addresses, the ranges are expressed in similar encoding as IPv4
        name-excluded-uri: One or more comma-separated URIs which are excluded from being issued certificates. The value can be a hostname or a domain with a leading period (like `.example.com`)
        name-permitted-dns: One or more comma-separated  DNS names which are permitted to be issued certificates. Any DNS name that can be constructed by simply adding zero or more labels to the left-hand side of the name satisfies the name constraint. For example, `example.com`, `www.example.com`, `www.sub.example.com` would satisfy `example.com`, while `example1.com` does not.
        name-permitted-email: One or more comma-separated email addresses which are permitted to be issued certificates. The value can be a particular email address, a hostname to indicate all email addresses on that host or a domain with a leading period (e.g. `.example.com`) to indicate all email addresses in that domain.
        name-permitted-ip: One or more comma-separated IP ranges which are permitted to be issued certificates. For IPv4 addresses, the ranges are expressed using CIDR notation as specified in RFC 4632. For IPv6 addresses, the ranges are expressed in similar encoding as IPv4
        name-permitted-uri: One or more comma-separated URIs which are permitted to be issued certificates. The value can be a hostname or a domain with a leading period (like `.example.com`)
        no-auto-enable: If this flag is set, the Certificate Authority will be automatically enabled upon creation.
        no-name-constraints-critical: Indicates whether or not name constraints are marked as critical. Name constraints are considered critical unless explicitly set to false.
        no-unconstrained-chain-length: If set, allows an unbounded number of subordinate CAs under this newly issued CA certificate. This can only be provided if neither `--use-preset-profile` nor `--max-chain-length` are provided.
        pool: |-
            The parent CA Pool of the Certificate Authority.
            +
            To set the `pool` attribute:
            * provide the argument `CERTIFICATE_AUTHORITY` on the command line with a fully specified name;
            * provide the argument `--pool` on the command line.
        subject: 'X.501 name of the certificate subject. Example: --subject "C=US,ST=California,L=Mountain View,O=Google LLC,CN=google.com"'
        subject-file: A yaml file containing the RDN sequence for the Subject field.
        subject-key-id: Optional field to specify subject key ID for certificate. DO NOT USE except to maintain a previously established identifier for a public key, whose SKI was not generated using method (1) described in RFC 5280 section 4.2.1.2.
        unconstrained-chain-length: If set, allows an unbounded number of subordinate CAs under this newly issued CA certificate. This can only be provided if neither `--use-preset-profile` nor `--max-chain-length` are provided.
        uri-san: One or more comma-separated URI Subject Alternative Names.
        use-preset-profile: |-
            The name of an existing preset profile used to encapsulate X.509 parameter values. USE_PRESET_PROFILE must be one of: leaf_client_tls, leaf_code_signing, leaf_mtls, leaf_server_tls, leaf_smime, root_unconstrained, subordinate_client_tls_pathlen_0, subordinate_code_signing_pathlen_0, subordinate_mtls_pathlen_0, subordinate_server_tls_pathlen_0, subordinate_smime_pathlen_0, subordinate_unconstrained_pathlen_0.
            +
            For more information, see https://cloud.google.com/certificate-authority-service/docs/certificate-profile.
        validity: The validity of this CA, as an ISO8601 duration. Defaults to 10 years.
