name: get-tag-sync-task
description: Returns information about a specified tag-sync task.
flags:
    --task-arn=!: The Amazon resource name (ARN) of the tag-sync task.
documentation:
    command: |-
        Returns information about a specified tag-sync task.

        **Minimum permissions**

        To run this command, you must have the following permissions:

        - `resource-groups:GetTagSyncTask` on the application group
    flag:
        task-arn: The Amazon resource name (ARN) of the tag-sync task.
