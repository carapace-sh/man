name: update-domain
description: Updates the default settings for new user profiles in the domain.
flags:
    --app-network-access-type=: Specifies the VPC used for non-EFS traffic.
    --app-security-group-management=: The entity that creates and manages the required security groups for inter-app communication in `VPCOnly` mode.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --default-space-settings=: The default settings for shared spaces that users create in the domain.
    --default-user-settings=: A collection of settings.
    --domain-id=!: The ID of the domain to be updated.
    --domain-settings-for-update=: A collection of `DomainSettings` configuration values to update.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --subnet-ids=: The VPC subnets that Studio uses for communication.
    --tag-propagation=: Indicates whether custom tag propagation is supported for the domain.
completion:
    flag:
        app-network-access-type:
            - PublicInternetOnly
            - VpcOnly
        app-security-group-management:
            - Service
            - Customer
        tag-propagation:
            - ENABLED
            - DISABLED
documentation:
    command: Updates the default settings for new user profiles in the domain.
    flag:
        app-network-access-type: |-
            Specifies the VPC used for non-EFS traffic.

            - `PublicInternetOnly` - Non-EFS traffic is through a VPC managed by Amazon SageMaker AI, which allows direct internet access.
            - `VpcOnly` - All Studio traffic is through the specified VPC and subnets.

            This configuration can only be modified if there are no apps in the `InService`, `Pending`, or `Deleting` state. The configuration cannot be updated if `DomainSettings.RStudioServerProDomainSettings.DomainExecutionRoleArn` is already set or `DomainSettings.RStudioServerProDomainSettings.DomainExecutionRoleArn` is provided as part of the same request.
        app-security-group-management: The entity that creates and manages the required security groups for inter-app communication in `VPCOnly` mode. Required when `CreateDomain.AppNetworkAccessType` is `VPCOnly` and `DomainSettings.RStudioServerProDomainSettings.DomainExecutionRoleArn` is provided. If setting up the domain for use with RStudio, this value must be set to `Service`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        default-space-settings: The default settings for shared spaces that users create in the domain.
        default-user-settings: A collection of settings.
        domain-id: The ID of the domain to be updated.
        domain-settings-for-update: A collection of `DomainSettings` configuration values to update.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        subnet-ids: |-
            The VPC subnets that Studio uses for communication.

            If removing subnets, ensure there are no apps in the `InService`, `Pending`, or `Deleting` state.
        tag-propagation: Indicates whether custom tag propagation is supported for the domain. Defaults to `DISABLED`.
