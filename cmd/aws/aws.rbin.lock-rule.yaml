name: lock-rule
description: Locks a Region-level retention rule.
flags:
    --identifier=!: The unique ID of the retention rule.
    --lock-configuration=!: Information about the retention rule lock configuration.
documentation:
    command: |-
        Locks a Region-level retention rule. A locked retention rule can't be modified or deleted.

        You can't lock tag-level retention rules, or Region-level retention rules that have exclusion tags.
    flag:
        identifier: The unique ID of the retention rule.
        lock-configuration: Information about the retention rule lock configuration.
