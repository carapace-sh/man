name: create-batch-load-task
description: Creates a new Timestream batch load task.
flags:
    --client-token=: ""
    --data-model-configuration=: ""
    --data-source-configuration=!: Defines configuration details about the data source for a batch load task.
    --record-version=: ""
    --report-configuration=!: ""
    --target-database-name=!: Target Timestream database for a batch load task.
    --target-table-name=!: Target Timestream table for a batch load task.
documentation:
    command: Creates a new Timestream batch load task. A batch load task processes data from a CSV source in an S3 location and writes to a Timestream table. A mapping from source to target is defined in a batch load task. Errors and events are written to a report at an S3 location. For the report, if the KMS key is not specified, the report will be encrypted with an S3 managed key when `SSE_S3` is the option. Otherwise an error is thrown. For more information, see [Amazon Web Services managed keys](https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html#aws-managed-cmk). [Service quotas apply](https://docs.aws.amazon.com/timestream/latest/developerguide/ts-limits.html). For details, see [code sample](https://docs.aws.amazon.com/timestream/latest/developerguide/code-samples.create-batch-load.html).
    flag:
        client-token: ""
        data-model-configuration: ""
        data-source-configuration: Defines configuration details about the data source for a batch load task.
        record-version: ""
        report-configuration: ""
        target-database-name: Target Timestream database for a batch load task.
        target-table-name: Target Timestream table for a batch load task.
