name: select
description: The `Select` operation returns a set of attributes for `ItemNames` that match the select expression.
flags:
    --consistent-read: Determines whether or not strong consistency should be enforced when data is read from SimpleDB.
    --next-token=: A string informing Amazon SimpleDB where to start the next list of `ItemNames`.
    --no-consistent-read&: Determines whether or not strong consistency should be enforced when data is read from SimpleDB.
    --select-expression=!: The expression used to query the domain.
documentation:
    command: |-
        The `Select` operation returns a set of attributes for `ItemNames` that match the select expression. `Select` is similar to the standard SQL SELECT statement.

        The total size of the response cannot exceed 1 MB in total size. Amazon SimpleDB automatically adjusts the number of items returned per page to enforce this limit. For example, if the client asks to retrieve 2500 items, but each individual item is 10 kB in size, the system returns 100 items and an appropriate `NextToken` so the client can access the next page of results.

        For information on how to construct select expressions, see Using Select to Create Amazon SimpleDB Queries in the Developer Guide.
    flag:
        consistent-read: Determines whether or not strong consistency should be enforced when data is read from SimpleDB. If `true`, any data previously written to SimpleDB will be returned. Otherwise, results will be consistent eventually, and the client may not see data that was written immediately before your read.
        next-token: A string informing Amazon SimpleDB where to start the next list of `ItemNames`.
        select-expression: The expression used to query the domain.
