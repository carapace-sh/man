name: create
description: '*(ALPHA)*  Create a VPN connection between an Edge Container cluster and a VPC network.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --cluster=!: ID of the cluster or fully qualified identifier for the cluster.
    --high-availability: Enables high availability on cluster side.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: For resources [cluster, vpn_connection], provides fallback value for resource location attribute.
    --nat-gateway-ip=: The NAT gateway IP for the gateway floating IPs.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-high-availability&: Enables high availability on cluster side.
    --router=: Name of the Cloud Router to use when creating the VPN connection.
    --vpc-network=!: The name of the VPC network to be connected.
    --vpc-project=: The project of the VPC network.
documentation:
    command: |
        *(ALPHA)*  Creates a new VPN connection.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        cluster: |-
            ID of the cluster or fully qualified identifier for the cluster.
            +
            To set the `cluster` attribute:
            * provide the argument `--cluster` on the command line.
        high-availability: |-
            Enables high availability on cluster side. This creates an additional VPN endpoint in
            cluster. Multiple Nodes/NodePools are required to enable this feature.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: For resources [cluster, vpn_connection], provides fallback value for resource location attribute. When the resource's full URI path is not provided, location will fallback to this flag value.
        nat-gateway-ip: The NAT gateway IP for the gateway floating IPs. Required if cluster sits behind NAT.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-high-availability: |
            Enables high availability on cluster side. This creates an additional VPN endpoint in
            cluster. Multiple Nodes/NodePools are required to enable this feature.
        router: |-
            Name of the Cloud Router to use when creating the VPN connection. This Cloud Router must be
            in the same region as the cluster and connected to the provided VPC network. If not
            provided, a service-managed Cloud Router will either be created or reused to create the VPN
            connection.
        vpc-network: |-
            The name of the VPC network to be connected. By default it is assumed to be under the same
            project as cluster. If this VPC network is under a different project, `vpc-project` is
            required.
        vpc-project: |-
            The project of the VPC network. Required if the project of VPC network differs from the
            project of the cluster.
