name: describe
description: '*(ALPHA)*  Describe the transaction.'
flags:
    --transaction-file=: Path of the file which contains the transaction.
    --zone=!: Name of the managed zone whose record sets you want to manage.
documentation:
    command: |-
        *(ALPHA)*  This command displays the contents of the transaction.

        ## EXAMPLES

        To look at the contents of the transaction, run:

          $ gcloud alpha dns record-sets transaction describe --zone=MANAGED_ZONE
    flag:
        transaction-file: Path of the file which contains the transaction.
        zone: Name of the managed zone whose record sets you want to manage.
