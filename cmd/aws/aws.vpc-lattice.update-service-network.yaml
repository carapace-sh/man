name: update-service-network
description: Updates the specified service network.
flags:
    --auth-type=!: The type of IAM policy.
    --service-network-identifier=!: The ID or ARN of the service network.
completion:
    flag:
        auth-type:
            - NONE
            - AWS_IAM
documentation:
    command: Updates the specified service network.
    flag:
        auth-type: |-
            The type of IAM policy.

            - `NONE`: The resource does not use an IAM policy. This is the default.
            - `AWS_IAM`: The resource uses an IAM policy. When this type is used, auth is enabled and an auth policy is required.
        service-network-identifier: The ID or ARN of the service network.
