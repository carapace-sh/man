name: create-license
description: '*(ALPHA)*  Create Compute Engine license-based commitments.'
flags:
    --amount=!: Number of licenses purchased.
    --cores-per-license=: Core range of the instance.
    --license=!: Applicable license URI.
    --plan=!: Duration of the commitment.
    --region=: Region of the commitment to create.
completion:
    flag:
        plan:
            - 12-month
            - 36-month
documentation:
    command: '*(ALPHA)*  Create Compute Engine license-based commitments.'
    flag:
        amount: Number of licenses purchased.
        cores-per-license: 'Core range of the instance. Must be one of: `1-2`, `3-4`, `5+`. Required for SAP licenses.'
        license: 'Applicable license URI. For example: `https://www.googleapis.com/compute/v1/projects/suse-sap-cloud/global/licenses/sles-sap-12`'
        plan: 'Duration of the commitment. _PLAN_ must be one of: *12-month*, *36-month*.'
        region: |-
            Region of the commitment to create. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
