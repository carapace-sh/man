name: delete-message-template
description: Deletes an Amazon Q in Connect message template entirely or a specific version of the message template if version is supplied in the request.
flags:
    --knowledge-base-id=!: The identifier of the knowledge base.
    --message-template-id=!: The identifier of the message template.
documentation:
    command: Deletes an Amazon Q in Connect message template entirely or a specific version of the message template if version is supplied in the request. You can provide the message template identifier as `<message-template-id>:<versionNumber>` to delete a specific version of the message template. If it is not supplied, the message template and all available versions will be deleted.
    flag:
        knowledge-base-id: The identifier of the knowledge base. Can be either the ID or the ARN. URLs cannot contain the ARN.
        message-template-id: The identifier of the message template. Can be either the ID or the ARN.
