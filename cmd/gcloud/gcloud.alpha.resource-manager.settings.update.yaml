name: update
description: '*(ALPHA)*  Update the value of a resource setting.'
hidden: true
flags:
    --setting-from-file=!: Path to JSON or YAML file that contains the resource setting.
documentation:
    command: |-
        *(ALPHA)*  Update the value of a resource setting.

        ## EXAMPLES

        To set the resource setting from the file with the path ``./sample_path'',
        run:

          $ gcloud alpha resource-manager settings update --setting-from-file="./test_input.json"
    flag:
        setting-from-file: Path to JSON or YAML file that contains the resource setting.
