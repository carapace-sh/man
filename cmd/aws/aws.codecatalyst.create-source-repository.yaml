name: create-source-repository
description: Creates an empty Git-based source repository in a specified project.
flags:
    --description=: The description of the source repository.
    --name=!: The name of the source repository.
    --project-name=!: The name of the project in the space.
    --space-name=!: The name of the space.
documentation:
    command: Creates an empty Git-based source repository in a specified project. The repository is created with an initial empty commit with a default branch named `main`.
    flag:
        description: The description of the source repository.
        name: The name of the source repository. For more information about name requirements, see [Quotas for source repositories](https://docs.aws.amazon.com/codecatalyst/latest/userguide/source-quotas.html).
        project-name: The name of the project in the space.
        space-name: The name of the space.
