name: describe-events
description: Lists events for a given source identifier and source type.
flags:
    --duration=: The duration of the events to be listed.
    --end-time=: The end time for the events to be listed.
    --event-categories=: A list of event categories for the source type that you've chosen.
    --filters=: Filters applied to events.
    --marker=: An optional pagination token provided by a previous request.
    --max-records=: The maximum number of records to include in the response.
    --source-identifier=: The identifier of an event source.
    --source-type=: The type of DMS resource that generates events.
    --start-time=: The start time for the events to be listed.
completion:
    flag:
        source-type:
            - replication-instance
documentation:
    command: Lists events for a given source identifier and source type. You can also specify a start and end time. For more information on DMS events, see [Working with Events and Notifications](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Events.html) in the *Database Migration Service User Guide.*
    flag:
        duration: The duration of the events to be listed.
        end-time: The end time for the events to be listed.
        event-categories: A list of event categories for the source type that you've chosen.
        filters: Filters applied to events. The only valid filter is `replication-instance-id`.
        marker: An optional pagination token provided by a previous request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by `MaxRecords`.
        max-records: |-
            The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that the remaining results can be retrieved.

            Default: 100

            Constraints: Minimum 20, maximum 100.
        source-identifier: The identifier of an event source.
        source-type: |-
            The type of DMS resource that generates events.

            Valid values: replication-instance | replication-task
        start-time: The start time for the events to be listed.
