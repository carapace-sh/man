name: delete
description: '*(BETA)*  Delete a Cloud Build Repository.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --connection=: Connection ID.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: The Google Cloud region.
documentation:
    command: '*(BETA)*  Delete a Cloud Build Repository in a Connection.'
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        connection: |-
            Connection ID.
            +
            To set the `connection` attribute:
            * provide the argument `repository` on the command line with a fully specified name;
            * provide the argument `--connection` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            The Google Cloud region.
            +
            To set the `region` attribute:
            * provide the argument `repository` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `builds/region`.
