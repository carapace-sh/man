name: list-domains
description: Lists Amazon DataZone domains.
flags:
    --max-results=: The maximum number of domains to return in a single call to `ListDomains`.
    --next-token=: When the number of domains is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of domains, the response includes a pagination token named `NextToken`.
    --status=: The status of the data source.
completion:
    flag:
        status:
            - CREATING
            - AVAILABLE
            - CREATION_FAILED
            - DELETING
            - DELETED
            - DELETION_FAILED
documentation:
    command: Lists Amazon DataZone domains.
    flag:
        max-results: The maximum number of domains to return in a single call to `ListDomains`. When the number of domains to be listed is greater than the value of `MaxResults`, the response contains a `NextToken` value that you can use in a subsequent call to `ListDomains` to list the next set of domains.
        next-token: When the number of domains is greater than the default value for the `MaxResults` parameter, or if you explicitly specify a value for `MaxResults` that is less than the number of domains, the response includes a pagination token named `NextToken`. You can specify this `NextToken` value in a subsequent call to `ListDomains` to list the next set of domains.
        status: The status of the data source.
