name: describe
description: '*(ALPHA)*  Describe a specific Immersive Stream for XR content resource.'
flags:
    --location=: Global location name.
documentation:
    command: |
        *(ALPHA)*  Describe a specific Immersive Stream for XR content resource.
    flag:
        location: |-
            Global location name.
            +
            To set the `location` attribute:
            * provide the argument `content` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * global is the only supported location.
