name: list-labeling-jobs
description: Gets a list of labeling jobs.
flags:
    --creation-time-after=: A filter that returns only labeling jobs created after the specified time (timestamp).
    --creation-time-before=: A filter that returns only labeling jobs created before the specified time (timestamp).
    --last-modified-time-after=: A filter that returns only labeling jobs modified after the specified time (timestamp).
    --last-modified-time-before=: A filter that returns only labeling jobs modified before the specified time (timestamp).
    --max-results=: The maximum number of labeling jobs to return in each page of the response.
    --name-contains=: A string in the labeling job name.
    --next-token=: If the result of the previous `ListLabelingJobs` request was truncated, the response includes a `NextToken`.
    --sort-by=: The field to sort results by.
    --sort-order=: The sort order for results.
    --status-equals=: A filter that retrieves only labeling jobs with a specific status.
completion:
    flag:
        sort-by:
            - Name
            - CreationTime
            - Status
        sort-order:
            - Ascending
            - Descending
        status-equals:
            - Initializing
            - InProgress
            - Completed
            - Failed
            - Stopping
            - Stopped
documentation:
    command: Gets a list of labeling jobs.
    flag:
        creation-time-after: A filter that returns only labeling jobs created after the specified time (timestamp).
        creation-time-before: A filter that returns only labeling jobs created before the specified time (timestamp).
        last-modified-time-after: A filter that returns only labeling jobs modified after the specified time (timestamp).
        last-modified-time-before: A filter that returns only labeling jobs modified before the specified time (timestamp).
        max-results: The maximum number of labeling jobs to return in each page of the response.
        name-contains: A string in the labeling job name. This filter returns only labeling jobs whose name contains the specified string.
        next-token: If the result of the previous `ListLabelingJobs` request was truncated, the response includes a `NextToken`. To retrieve the next set of labeling jobs, use the token in the next request.
        sort-by: The field to sort results by. The default is `CreationTime`.
        sort-order: The sort order for results. The default is `Ascending`.
        status-equals: A filter that retrieves only labeling jobs with a specific status.
