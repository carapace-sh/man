name: get-deployable-patch-snapshot-for-instance
description: Retrieves the current snapshot for the patch baseline the managed node uses.
flags:
    --baseline-override=: Defines the basic information about a patch baseline override.
    --instance-id=!: The ID of the managed node for which the appropriate patch snapshot should be retrieved.
    --no-use-s3-dual-stack-endpoint&: Specifies whether to use S3 dualstack endpoints for the patch snapshot download URL.
    --snapshot-id=!: The snapshot ID provided by the user when running `AWS-RunPatchBaseline`.
    --use-s3-dual-stack-endpoint: Specifies whether to use S3 dualstack endpoints for the patch snapshot download URL.
documentation:
    command: |-
        Retrieves the current snapshot for the patch baseline the managed node uses. This API is primarily used by the `AWS-RunPatchBaseline` Systems Manager document (SSM document).

        If you run the command locally, such as with the Command Line Interface (CLI), the system attempts to use your local Amazon Web Services credentials and the operation fails. To avoid this, you can run the command in the Amazon Web Services Systems Manager console. Use Run Command, a tool in Amazon Web Services Systems Manager, with an SSM document that enables you to target a managed node with a script or command. For example, run the command using the `AWS-RunShellScript` document or the `AWS-RunPowerShellScript` document.
    flag:
        baseline-override: Defines the basic information about a patch baseline override.
        instance-id: The ID of the managed node for which the appropriate patch snapshot should be retrieved.
        snapshot-id: The snapshot ID provided by the user when running `AWS-RunPatchBaseline`.
        use-s3-dual-stack-endpoint: Specifies whether to use S3 dualstack endpoints for the patch snapshot download URL. Set to `true` to receive a presigned URL that supports both IPv4 and IPv6 connectivity. Set to `false` to use standard IPv4-only endpoints. Default is `false`. This parameter is required for managed nodes in IPv6-only environments.
