name: get-scaling-configuration-recommendation
description: Starts an Amazon SageMaker Inference Recommender autoscaling recommendation job.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --endpoint-name=: The name of an endpoint benchmarked during a previously completed inference recommendation job.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --inference-recommendations-job-name=!: The name of a previously completed Inference Recommender job.
    --recommendation-id=: The recommendation ID of a previously completed inference recommendation.
    --scaling-policy-objective=: An object where you specify the anticipated traffic pattern for an endpoint.
    --target-cpu-utilization-per-core=: The percentage of how much utilization you want an instance to use before autoscaling.
documentation:
    command: Starts an Amazon SageMaker Inference Recommender autoscaling recommendation job. Returns recommendations for autoscaling policies that you can apply to your SageMaker endpoint.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        endpoint-name: |-
            The name of an endpoint benchmarked during a previously completed inference recommendation job. This name should come from one of the recommendations returned by the job specified in the `InferenceRecommendationsJobName` field.

            Specify either this field or the `RecommendationId` field.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        inference-recommendations-job-name: The name of a previously completed Inference Recommender job.
        recommendation-id: |-
            The recommendation ID of a previously completed inference recommendation. This ID should come from one of the recommendations returned by the job specified in the `InferenceRecommendationsJobName` field.

            Specify either this field or the `EndpointName` field.
        scaling-policy-objective: An object where you specify the anticipated traffic pattern for an endpoint.
        target-cpu-utilization-per-core: The percentage of how much utilization you want an instance to use before autoscaling. The default value is 50%.
