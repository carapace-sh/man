name: get-protection-status
description: If you created a Shield Advanced policy, returns policy-level attack summary information in the event of a potential DDoS attack.
flags:
    --end-time=: The end of the time period to query for the attacks.
    --max-results=: Specifies the number of objects that you want Firewall Manager to return for this request.
    --member-account-id=: The Amazon Web Services account that is in scope of the policy that you want to get the details for.
    --next-token=: If you specify a value for `MaxResults` and you have more objects than the number that you specify for `MaxResults`, Firewall Manager returns a `NextToken` value in the response, which you can use to retrieve another group of objects.
    --policy-id=!: The ID of the policy for which you want to get the attack information.
    --start-time=: The start of the time period to query for the attacks.
documentation:
    command: If you created a Shield Advanced policy, returns policy-level attack summary information in the event of a potential DDoS attack. Other policy types are currently unsupported.
    flag:
        end-time: The end of the time period to query for the attacks. This is a `timestamp` type. The request syntax listing indicates a `number` type because the default used by Firewall Manager is Unix time in seconds. However, any valid `timestamp` format is allowed.
        max-results: Specifies the number of objects that you want Firewall Manager to return for this request. If you have more objects than the number that you specify for `MaxResults`, the response includes a `NextToken` value that you can use to get another batch of objects.
        member-account-id: The Amazon Web Services account that is in scope of the policy that you want to get the details for.
        next-token: If you specify a value for `MaxResults` and you have more objects than the number that you specify for `MaxResults`, Firewall Manager returns a `NextToken` value in the response, which you can use to retrieve another group of objects. For the second and subsequent `GetProtectionStatus` requests, specify the value of `NextToken` from the previous response to get information about another batch of objects.
        policy-id: The ID of the policy for which you want to get the attack information.
        start-time: The start of the time period to query for the attacks. This is a `timestamp` type. The request syntax listing indicates a `number` type because the default used by Firewall Manager is Unix time in seconds. However, any valid `timestamp` format is allowed.
