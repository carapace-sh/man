name: create-user-profile
description: Creates a user profile.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-id=!: The ID of the associated Domain.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --single-sign-on-user-identifier=: A specifier for the type of value specified in SingleSignOnUserValue.
    --single-sign-on-user-value=: The username of the associated Amazon Web Services Single Sign-On User for this UserProfile.
    --tags=:
        description: Each tag consists of a key and an optional value.
        nargs: -1
    --user-profile-name=!: A name for the UserProfile.
    --user-settings=: A collection of settings.
documentation:
    command: Creates a user profile. A user profile represents a single user within a domain, and is the main way to reference a "person" for the purposes of sharing, reporting, and other user-oriented features. This entity is created when a user onboards to a domain. If an administrator invites a person by email or imports them from IAM Identity Center, a user profile is automatically created. A user profile is the primary holder of settings for an individual user and has a reference to the user's private Amazon Elastic File System home directory.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain-id: The ID of the associated Domain.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        single-sign-on-user-identifier: A specifier for the type of value specified in SingleSignOnUserValue. Currently, the only supported value is "UserName". If the Domain's AuthMode is IAM Identity Center, this field is required. If the Domain's AuthMode is not IAM Identity Center, this field cannot be specified.
        single-sign-on-user-value: The username of the associated Amazon Web Services Single Sign-On User for this UserProfile. If the Domain's AuthMode is IAM Identity Center, this field is required, and must match a valid username of a user in your directory. If the Domain's AuthMode is not IAM Identity Center, this field cannot be specified.
        tags: |-
            Each tag consists of a key and an optional value. Tag keys must be unique per resource.

            Tags that you specify for the User Profile are also added to all Apps that the User Profile launches.
        user-profile-name: A name for the UserProfile. This value is not case sensitive.
        user-settings: A collection of settings.
