name: get-findings
description: Returns a list of findings that match the specified criteria.
flags:
    --filters=: The finding attributes used to define a condition to filter the returned findings.
    --max-results=: The maximum number of findings to return.
    --next-token=: The token that is required for pagination.
    --sort-criteria=: The finding attributes used to sort the list of returned findings.
documentation:
    command: |-
        Returns a list of findings that match the specified criteria.

        If cross-Region aggregation is enabled, then when you call `GetFindings` from the home Region, the results include all of the matching findings from both the home Region and linked Regions.
    flag:
        filters: |-
            The finding attributes used to define a condition to filter the returned findings.

            You can filter by up to 10 finding attributes. For each attribute, you can provide up to 20 filter values.

            Note that in the available filter fields, `WorkflowState` is deprecated. To search for a finding based on its workflow status, use `WorkflowStatus`.
        max-results: The maximum number of findings to return.
        next-token: |-
            The token that is required for pagination. On your first call to the `GetFindings` operation, set the value of this parameter to `NULL`.

            For subsequent calls to the operation, to continue listing data, set the value of this parameter to the value returned from the previous response.
        sort-criteria: The finding attributes used to sort the list of returned findings.
