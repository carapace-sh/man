name: list-devices
description: Returns a list of devices.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --device-aggregated-status-filter=: Filter based on a device's status.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of devices to return in one page of results.
    --name-filter=: Filter based on device's name.
    --next-token=: Specify the pagination token from a previous request to retrieve the next page of results.
    --sort-by=: The target column to be sorted on.
    --sort-order=: The sorting order for the returned list.
completion:
    flag:
        device-aggregated-status-filter:
            - ERROR
            - AWAITING_PROVISIONING
            - PENDING
            - FAILED
            - DELETING
            - ONLINE
            - OFFLINE
            - LEASE_EXPIRED
            - UPDATE_NEEDED
            - REBOOTING
        sort-by:
            - DEVICE_ID
            - CREATED_TIME
            - NAME
            - DEVICE_AGGREGATED_STATUS
        sort-order:
            - ASCENDING
            - DESCENDING
documentation:
    command: Returns a list of devices.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        device-aggregated-status-filter: Filter based on a device's status.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The maximum number of devices to return in one page of results.
        name-filter: Filter based on device's name. Prefixes supported.
        next-token: Specify the pagination token from a previous request to retrieve the next page of results.
        sort-by: The target column to be sorted on. Default column sort is CREATED\_TIME.
        sort-order: The sorting order for the returned list. SortOrder is DESCENDING by default based on CREATED\_TIME. Otherwise, SortOrder is ASCENDING.
