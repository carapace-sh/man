name: monitor-contact
description: Initiates silent monitoring of a contact.
flags:
    --allowed-monitor-capabilities=: Specify which monitoring actions the user is allowed to take.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --contact-id=!: The identifier of the contact.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --user-id=!: The identifier of the user account.
documentation:
    command: Initiates silent monitoring of a contact. The Contact Control Panel (CCP) of the user specified by *userId* will be set to silent monitoring mode on the contact.
    flag:
        allowed-monitor-capabilities: Specify which monitoring actions the user is allowed to take. For example, whether the user is allowed to escalate from silent monitoring to barge. AllowedMonitorCapabilities is required if barge is enabled.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If not provided, the Amazon Web Services SDK populates this field. For more information about idempotency, see [Making retries safe with idempotent APIs](https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/).
        contact-id: The identifier of the contact.
        instance-id: The identifier of the Amazon Connect instance. You can find the instanceId in the ARN of the instance.
        user-id: The identifier of the user account.
