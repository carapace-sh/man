name: pause
description: '*(BETA)*  Pause a running Vertex AI model deployment monitoring job.'
flags:
    --region=: Cloud region for the monitoring_job.
documentation:
    command: '*(BETA)*  Pause a running Vertex AI model deployment monitoring job.'
    flag:
        region: |-
            Cloud region for the monitoring_job.
            +
            To set the `region` attribute:
            * provide the argument `monitoring_job` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
