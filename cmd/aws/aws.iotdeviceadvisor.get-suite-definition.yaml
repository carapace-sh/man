name: get-suite-definition
description: Gets information about a Device Advisor test suite.
flags:
    --suite-definition-id=!: Suite definition ID of the test suite to get.
    --suite-definition-version=: Suite definition version of the test suite to get.
documentation:
    command: |-
        Gets information about a Device Advisor test suite.

        Requires permission to access the [GetSuiteDefinition](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        suite-definition-id: Suite definition ID of the test suite to get.
        suite-definition-version: Suite definition version of the test suite to get.
