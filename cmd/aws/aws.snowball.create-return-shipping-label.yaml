name: create-return-shipping-label
description: Creates a shipping label that will be used to return the Snow device to Amazon Web Services.
flags:
    --job-id=!: The ID for a job that you want to create the return shipping label for; for example, `JID123e4567-e89b-12d3-a456-426655440000`.
    --shipping-option=: The shipping speed for a particular job.
completion:
    flag:
        shipping-option:
            - SECOND_DAY
            - NEXT_DAY
            - EXPRESS
            - STANDARD
documentation:
    command: Creates a shipping label that will be used to return the Snow device to Amazon Web Services.
    flag:
        job-id: The ID for a job that you want to create the return shipping label for; for example, `JID123e4567-e89b-12d3-a456-426655440000`.
        shipping-option: 'The shipping speed for a particular job. This speed doesn''t dictate how soon the device is returned to Amazon Web Services. This speed represents how quickly it moves to its destination while in transit. Regional shipping speeds are as follows:'
