name: list-account-associations
description: This is a paginated call to list linked accounts that are linked to the payer account for the specified time period.
flags:
    --billing-period=: The preferred billing period to get account associations.
    --filters=: 'The filter on the account ID of the linked account, or any of the following:'
    --next-token=: The pagination token that's used on subsequent calls to retrieve accounts.
documentation:
    command: This is a paginated call to list linked accounts that are linked to the payer account for the specified time period. If no information is provided, the current billing period is used. The response will optionally include the billing group that's associated with the linked account.
    flag:
        billing-period: The preferred billing period to get account associations.
        filters: |-
            The filter on the account ID of the linked account, or any of the following:

            `MONITORED`: linked accounts that are associated to billing groups.

            `UNMONITORED`: linked accounts that aren't associated to billing groups.

            `Billing Group Arn`: linked accounts that are associated to the provided billing group Arn.
        next-token: The pagination token that's used on subsequent calls to retrieve accounts.
