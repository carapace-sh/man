name: delete
description: '*(ALPHA)*  Delete a Intercept Endpoint Group.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: Location of the intercept endpoint group.
    --max-wait=: Time to synchronously wait for the operation to complete, after which the operation continues asynchronously.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |+
        *(ALPHA)*  Delete a intercept endpoint group. Check the progress of endpoint group deletion
        by using `gcloud network-security intercept-endpoint-groups list`.

        For more examples, refer to the EXAMPLES section below.

    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *True*. Enabled by default, use *--no-async* to disable.
        location: |-
            Location of the intercept endpoint group.
            +
            To set the `location` attribute:
            * provide the argument `INTERCEPT_ENDPOINT_GROUP` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        max-wait: Time to synchronously wait for the operation to complete, after which the operation continues asynchronously. Ignored if --no-async isn't specified. See $ gcloud topic datetimes for information on time formats.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
