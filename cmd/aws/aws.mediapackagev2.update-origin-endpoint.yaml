name: update-origin-endpoint
description: Update the specified origin endpoint.
flags:
    --channel-group-name=!: The name that describes the channel group.
    --channel-name=!: The name that describes the channel.
    --container-type=!: The type of container attached to this origin endpoint.
    --dash-manifests=: A DASH manifest configuration.
    --description=: Any descriptive information that you want to add to the origin endpoint for future identification purposes.
    --etag=: The expected current Entity Tag (ETag) for the resource.
    --force-endpoint-error-configuration=: The failover settings for the endpoint.
    --hls-manifests=: An HTTP live streaming (HLS) manifest configuration.
    --low-latency-hls-manifests=: A low-latency HLS manifest configuration.
    --mss-manifests=: A list of Microsoft Smooth Streaming (MSS) manifest configurations to update for the origin endpoint.
    --origin-endpoint-name=!: The name that describes the origin endpoint.
    --segment=: The segment configuration, including the segment name, duration, and other configuration values.
    --startover-window-seconds=: The size of the window (in seconds) to create a window of the live stream that's available for on-demand viewing.
completion:
    flag:
        container-type:
            - TS
            - CMAF
            - ISM
documentation:
    command: |-
        Update the specified origin endpoint. Edit the packaging preferences on an endpoint to optimize the viewing experience. You can't edit the name of the endpoint.

        Any edits you make that impact the video output may not be reflected for a few minutes.
    flag:
        channel-group-name: The name that describes the channel group. The name is the primary identifier for the channel group, and must be unique for your account in the AWS Region.
        channel-name: The name that describes the channel. The name is the primary identifier for the channel, and must be unique for your account in the AWS Region and channel group.
        container-type: The type of container attached to this origin endpoint. A container type is a file format that encapsulates one or more media streams, such as audio and video, into a single file.
        dash-manifests: A DASH manifest configuration.
        description: Any descriptive information that you want to add to the origin endpoint for future identification purposes.
        etag: The expected current Entity Tag (ETag) for the resource. If the specified ETag does not match the resource's current entity tag, the update request will be rejected.
        force-endpoint-error-configuration: The failover settings for the endpoint.
        hls-manifests: An HTTP live streaming (HLS) manifest configuration.
        low-latency-hls-manifests: A low-latency HLS manifest configuration.
        mss-manifests: A list of Microsoft Smooth Streaming (MSS) manifest configurations to update for the origin endpoint. This replaces the existing MSS manifest configurations.
        origin-endpoint-name: The name that describes the origin endpoint. The name is the primary identifier for the origin endpoint, and and must be unique for your account in the AWS Region and channel.
        segment: The segment configuration, including the segment name, duration, and other configuration values.
        startover-window-seconds: The size of the window (in seconds) to create a window of the live stream that's available for on-demand viewing. Viewers can start-over or catch-up on content that falls within the window. The maximum startover window is 1,209,600 seconds (14 days).
