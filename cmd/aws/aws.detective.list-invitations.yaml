name: list-invitations
description: Retrieves the list of open and accepted behavior graph invitations for the member account.
flags:
    --max-results=: The maximum number of behavior graph invitations to return in the response.
    --next-token=: For requests to retrieve the next page of results, the pagination token that was returned with the previous page of results.
documentation:
    command: |-
        Retrieves the list of open and accepted behavior graph invitations for the member account. This operation can only be called by an invited member account.

        Open invitations are invitations that the member account has not responded to.

        The results do not include behavior graphs for which the member account declined the invitation. The results also do not include behavior graphs that the member account resigned from or was removed from.
    flag:
        max-results: The maximum number of behavior graph invitations to return in the response. The total must be less than the overall limit on the number of results to return, which is currently 200.
        next-token: For requests to retrieve the next page of results, the pagination token that was returned with the previous page of results. The initial request does not include a pagination token.
