name: create-transit-gateway-connect
description: Creates a Connect attachment from a specified transit gateway attachment.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --options=!: The Connect attachment options.
    --tag-specifications=: The tags to apply to the Connect attachment.
    --transport-transit-gateway-attachment-id=!: The ID of the transit gateway attachment.
documentation:
    command: |-
        Creates a Connect attachment from a specified transit gateway attachment. A Connect attachment is a GRE-based tunnel attachment that you can use to establish a connection between a transit gateway and an appliance.

        A Connect attachment uses an existing VPC or Amazon Web Services Direct Connect attachment as the underlying transport mechanism.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        options: The Connect attachment options.
        tag-specifications: The tags to apply to the Connect attachment.
        transport-transit-gateway-attachment-id: The ID of the transit gateway attachment. You can specify a VPC attachment or Amazon Web Services Direct Connect attachment.
