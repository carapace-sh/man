name: test-invoke-method
description: Simulate the invocation of a Method in your RestApi with headers, parameters, and an incoming request body.
flags:
    --body=: The simulated request body of an incoming invocation request.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-certificate-id=: A ClientCertificate identifier to use in the test invocation.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --headers=: A key-value map of headers to simulate an incoming invocation request.
    --http-method=!: Specifies a test invoke method request's HTTP method.
    --multi-value-headers=: The headers as a map from string to list of values to simulate an incoming invocation request.
    --path-with-query-string=: The URI path, including query string, of the simulated invocation request.
    --resource-id=!: Specifies a test invoke method request's resource ID.
    --rest-api-id=!: The string identifier of the associated RestApi.
    --stage-variables=: A key-value map of stage variables to simulate an invocation on a deployed Stage.
documentation:
    command: Simulate the invocation of a Method in your RestApi with headers, parameters, and an incoming request body.
    flag:
        body: The simulated request body of an incoming invocation request.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-certificate-id: A ClientCertificate identifier to use in the test invocation. API Gateway will use the certificate when making the HTTPS request to the defined back-end endpoint.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        headers: A key-value map of headers to simulate an incoming invocation request.
        http-method: Specifies a test invoke method request's HTTP method.
        multi-value-headers: The headers as a map from string to list of values to simulate an incoming invocation request.
        path-with-query-string: The URI path, including query string, of the simulated invocation request. Use this to specify path parameters and query string parameters.
        resource-id: Specifies a test invoke method request's resource ID.
        rest-api-id: The string identifier of the associated RestApi.
        stage-variables: A key-value map of stage variables to simulate an invocation on a deployed Stage.
