name: apply-pending-maintenance-action
description: Applies a pending maintenance action to a resource (for example, to a DB instance).
flags:
    --apply-action=!: The pending maintenance action to apply to this resource.
    --opt-in-type=!: A value that specifies the type of opt-in request, or undoes an opt-in request.
    --resource-identifier=!: The RDS Amazon Resource Name (ARN) of the resource that the pending maintenance action applies to.
documentation:
    command: Applies a pending maintenance action to a resource (for example, to a DB instance).
    flag:
        apply-action: |-
            The pending maintenance action to apply to this resource.

            Valid Values:

            - `ca-certificate-rotation`
            - `db-upgrade`
            - `hardware-maintenance`
            - `os-upgrade`
            - `system-update`

            For more information about these actions, see [Maintenance actions for Amazon Aurora](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_UpgradeDBInstance.Maintenance.html#maintenance-actions-aurora) or [Maintenance actions for Amazon RDS](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.Maintenance.html#maintenance-actions-rds).
        opt-in-type: |-
            A value that specifies the type of opt-in request, or undoes an opt-in request. An opt-in request of type `immediate` can't be undone.

            Valid Values:

            - `immediate` - Apply the maintenance action immediately.
            - `next-maintenance` - Apply the maintenance action during the next maintenance window for the resource.
            - `undo-opt-in` - Cancel any existing `next-maintenance` opt-in requests.
        resource-identifier: The RDS Amazon Resource Name (ARN) of the resource that the pending maintenance action applies to. For information about creating an ARN, see [Constructing an RDS Amazon Resource Name (ARN)](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_Tagging.ARN.html#USER_Tagging.ARN.Constructing).
