name: list-ip-routes
description: Lists the address blocks that you have added to a directory.
flags:
    --directory-id=!: Identifier (ID) of the directory for which you want to retrieve the IP addresses.
    --limit=: Maximum number of items to return.
    --next-token=: The *ListIpRoutes.NextToken* value from a previous call to [ListIpRoutes]().
documentation:
    command: Lists the address blocks that you have added to a directory.
    flag:
        directory-id: Identifier (ID) of the directory for which you want to retrieve the IP addresses.
        limit: Maximum number of items to return. If this value is zero, the maximum number of items is specified by the limitations of the operation.
        next-token: The *ListIpRoutes.NextToken* value from a previous call to [ListIpRoutes](). Pass null if this is the first call.
