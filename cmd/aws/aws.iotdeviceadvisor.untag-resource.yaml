name: untag-resource
description: Removes tags from an IoT Device Advisor resource.
flags:
    --resource-arn=!: The resource ARN of an IoT Device Advisor resource.
    --tag-keys=!: List of tag keys to remove from the IoT Device Advisor resource.
documentation:
    command: |-
        Removes tags from an IoT Device Advisor resource.

        Requires permission to access the [UntagResource](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        resource-arn: The resource ARN of an IoT Device Advisor resource. This can be SuiteDefinition ARN or SuiteRun ARN.
        tag-keys: List of tag keys to remove from the IoT Device Advisor resource.
