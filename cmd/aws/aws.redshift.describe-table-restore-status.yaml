name: describe-table-restore-status
description: Lists the status of one or more table restore requests made using the [RestoreTableFromClusterSnapshot]() API action.
flags:
    --cluster-identifier=: The Amazon Redshift cluster that the table is being restored to.
    --marker=: An optional pagination token provided by a previous `DescribeTableRestoreStatus` request.
    --max-records=: The maximum number of records to include in the response.
    --table-restore-request-id=: The identifier of the table restore request to return status for.
documentation:
    command: Lists the status of one or more table restore requests made using the [RestoreTableFromClusterSnapshot]() API action. If you don't specify a value for the `TableRestoreRequestId` parameter, then `DescribeTableRestoreStatus` returns the status of all table restore requests ordered by the date and time of the request in ascending order. Otherwise `DescribeTableRestoreStatus` returns the status of the table specified by `TableRestoreRequestId`.
    flag:
        cluster-identifier: The Amazon Redshift cluster that the table is being restored to.
        marker: An optional pagination token provided by a previous `DescribeTableRestoreStatus` request. If this parameter is specified, the response includes only records beyond the marker, up to the value specified by the `MaxRecords` parameter.
        max-records: The maximum number of records to include in the response. If more records exist than the specified `MaxRecords` value, a pagination token called a marker is included in the response so that the remaining results can be retrieved.
        table-restore-request-id: The identifier of the table restore request to return status for. If you don't specify a `TableRestoreRequestId` value, then `DescribeTableRestoreStatus` returns the status of all in-progress table restore requests.
