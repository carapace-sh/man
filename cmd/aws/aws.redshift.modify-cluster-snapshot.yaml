name: modify-cluster-snapshot
description: Modifies the settings for a snapshot.
flags:
    --force: A Boolean option to override an exception if the retention period has already passed.
    --manual-snapshot-retention-period=: The number of days that a manual snapshot is retained.
    --no-force: A Boolean option to override an exception if the retention period has already passed.
    --snapshot-identifier=!: The identifier of the snapshot whose setting you want to modify.
documentation:
    command: |-
        Modifies the settings for a snapshot.

        This exanmple modifies the manual retention period setting for a cluster snapshot.
    flag:
        force: A Boolean option to override an exception if the retention period has already passed.
        manual-snapshot-retention-period: |-
            The number of days that a manual snapshot is retained. If the value is -1, the manual snapshot is retained indefinitely.

            If the manual snapshot falls outside of the new retention period, you can specify the force option to immediately delete the snapshot.

            The value must be either -1 or an integer between 1 and 3,653.
        snapshot-identifier: The identifier of the snapshot whose setting you want to modify.
