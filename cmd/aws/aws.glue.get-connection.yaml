name: get-connection
description: Retrieves a connection definition from the Data Catalog.
flags:
    --apply-override-for-compute-environment=: For connections that may be used in multiple services, specifies returning properties for the specified compute environment.
    --catalog-id=: The ID of the Data Catalog in which the connection resides.
    --hide-password: Allows you to retrieve the connection metadata without returning the password.
    --name=!: The name of the connection definition to retrieve.
    --no-hide-password&: Allows you to retrieve the connection metadata without returning the password.
completion:
    flag:
        apply-override-for-compute-environment:
            - SPARK
            - ATHENA
            - PYTHON
documentation:
    command: Retrieves a connection definition from the Data Catalog.
    flag:
        apply-override-for-compute-environment: For connections that may be used in multiple services, specifies returning properties for the specified compute environment.
        catalog-id: The ID of the Data Catalog in which the connection resides. If none is provided, the Amazon Web Services account ID is used by default.
        hide-password: Allows you to retrieve the connection metadata without returning the password. For instance, the Glue console uses this flag to retrieve the connection, and does not display the password. Set this parameter when the caller might not have permission to use the KMS key to decrypt the password, but it does have permission to access the rest of the connection properties.
        name: The name of the connection definition to retrieve.
