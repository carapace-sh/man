name: batch-get-case-rule
description: Gets a batch of case rules.
flags:
    --case-rules=!: A list of case rule identifiers.
    --domain-id=!: Unique identifier of a Cases domain.
documentation:
    command: Gets a batch of case rules. In the Amazon Connect admin website, case rules are known as *case field conditions*. For more information about case field conditions, see [Add case field conditions to a case template](https://docs.aws.amazon.com/connect/latest/adminguide/case-field-conditions.html).
    flag:
        case-rules: A list of case rule identifiers.
        domain-id: Unique identifier of a Cases domain.
