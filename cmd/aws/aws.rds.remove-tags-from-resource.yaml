name: remove-tags-from-resource
description: Removes metadata tags from an Amazon RDS resource.
flags:
    --resource-name=!: The Amazon RDS resource that the tags are removed from.
    --tag-keys=!: The tag key (name) of the tag to be removed.
documentation:
    command: |-
        Removes metadata tags from an Amazon RDS resource.

        For an overview on tagging an Amazon RDS resource, see [Tagging Amazon RDS Resources](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_Tagging.html) in the *Amazon RDS User Guide* or [Tagging Amazon Aurora and Amazon RDS Resources](https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_Tagging.html) in the *Amazon Aurora User Guide*.
    flag:
        resource-name: The Amazon RDS resource that the tags are removed from. This value is an Amazon Resource Name (ARN). For information about creating an ARN, see [Constructing an ARN for Amazon RDS](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_Tagging.ARN.html#USER_Tagging.ARN.Constructing) in the *Amazon RDS User Guide.*
        tag-keys: The tag key (name) of the tag to be removed.
