name: remove-tags-from-resource
description: Removes metadata tags from an Amazon Neptune resource.
flags:
    --resource-name=!: The Amazon Neptune resource that the tags are removed from.
    --tag-keys=!: The tag key (name) of the tag to be removed.
documentation:
    command: Removes metadata tags from an Amazon Neptune resource.
    flag:
        resource-name: The Amazon Neptune resource that the tags are removed from. This value is an Amazon Resource Name (ARN). For information about creating an ARN, see [Constructing an Amazon Resource Name (ARN)](https://docs.aws.amazon.com/neptune/latest/UserGuide/tagging.ARN.html#tagging.ARN.Constructing).
        tag-keys: The tag key (name) of the tag to be removed.
