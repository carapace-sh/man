name: create-annotation-store
description: Amazon Web Services HealthOmics variant stores and annotation stores will no longer be open to new customers starting November 7, 2025. If you would like to use variant stores or annotation stores, sign up prior to that date.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description for the store.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=: A name for the store.
    --reference=: The genome reference for the store's annotations.
    --sse-config=: Server-side encryption (SSE) settings for the store.
    --store-format=!: The annotation file format of the store.
    --store-options=: File parsing options for the annotation store.
    --tags=: Tags for the store.
    --version-name=: The name given to an annotation store version to distinguish it from other versions.
completion:
    flag:
        store-format:
            - GFF
            - TSV
            - VCF
documentation:
    command: |-
        Amazon Web Services HealthOmics variant stores and annotation stores will no longer be open to new customers starting November 7, 2025. If you would like to use variant stores or annotation stores, sign up prior to that date. Existing customers can continue to use the service as normal. For more information, see [Amazon Web Services HealthOmics variant store and annotation store availability change](https://docs.aws.amazon.com/omics/latest/dev/variant-store-availability-change.html).

        Creates an annotation store.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description for the store.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: A name for the store.
        reference: The genome reference for the store's annotations.
        sse-config: Server-side encryption (SSE) settings for the store.
        store-format: The annotation file format of the store.
        store-options: File parsing options for the annotation store.
        tags: Tags for the store.
        version-name: The name given to an annotation store version to distinguish it from other versions.
