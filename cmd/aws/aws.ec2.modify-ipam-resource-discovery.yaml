name: modify-ipam-resource-discovery
description: Modifies a resource discovery.
flags:
    --add-operating-regions=: Add operating Regions to the resource discovery.
    --add-organizational-unit-exclusions=: Add an Organizational Unit (OU) exclusion to your IPAM.
    --description=: A resource discovery description.
    --dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --ipam-resource-discovery-id=!: A resource discovery ID.
    --no-dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response.
    --remove-operating-regions=: Remove operating Regions.
    --remove-organizational-unit-exclusions=: Remove an Organizational Unit (OU) exclusion to your IPAM.
documentation:
    command: Modifies a resource discovery. A resource discovery is an IPAM component that enables IPAM to manage and monitor resources that belong to the owning account.
    flag:
        add-operating-regions: Add operating Regions to the resource discovery. Operating Regions are Amazon Web Services Regions where the IPAM is allowed to manage IP address CIDRs. IPAM only discovers and monitors resources in the Amazon Web Services Regions you select as operating Regions.
        add-organizational-unit-exclusions: |-
            Add an Organizational Unit (OU) exclusion to your IPAM. If your IPAM is integrated with Amazon Web Services Organizations and you add an organizational unit (OU) exclusion, IPAM will not manage the IP addresses in accounts in that OU exclusion. There is a limit on the number of exclusions you can create. For more information, see [Quotas for your IPAM](https://docs.aws.amazon.com/vpc/latest/ipam/quotas-ipam.html) in the *Amazon VPC IPAM User Guide*.

            The resulting set of exclusions must not result in "overlap", meaning two or more OU exclusions must not exclude the same OU. For more information and examples, see the Amazon Web Services CLI request process in [Add or remove OU exclusions](https://docs.aws.amazon.com/vpc/latest/ipam/exclude-ous.html#exclude-ous-create-delete) in the *Amazon VPC User Guide*.
        description: A resource discovery description.
        dry-run: A check for whether you have the required permissions for the action without actually making the request and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        ipam-resource-discovery-id: A resource discovery ID.
        remove-operating-regions: Remove operating Regions.
        remove-organizational-unit-exclusions: |-
            Remove an Organizational Unit (OU) exclusion to your IPAM. If your IPAM is integrated with Amazon Web Services Organizations and you add an organizational unit (OU) exclusion, IPAM will not manage the IP addresses in accounts in that OU exclusion. There is a limit on the number of exclusions you can create. For more information, see [Quotas for your IPAM](https://docs.aws.amazon.com/vpc/latest/ipam/quotas-ipam.html) in the *Amazon VPC IPAM User Guide*.

            The resulting set of exclusions must not result in "overlap", meaning two or more OU exclusions must not exclude the same OU. For more information and examples, see the Amazon Web Services CLI request process in [Add or remove OU exclusions](https://docs.aws.amazon.com/vpc/latest/ipam/exclude-ous.html#exclude-ous-create-delete) in the *Amazon VPC User Guide*.
