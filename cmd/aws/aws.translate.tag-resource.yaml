name: tag-resource
description: Associates a specific tag with a resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the given Amazon Translate resource to which you want to associate the tags.
    --tags=!: Tags being associated with a specific Amazon Translate resource.
documentation:
    command: Associates a specific tag with a resource. A tag is a key-value pair that adds as a metadata to a resource. For more information, see [Tagging your resources](https://docs.aws.amazon.com/translate/latest/dg/tagging.html).
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the given Amazon Translate resource to which you want to associate the tags.
        tags: Tags being associated with a specific Amazon Translate resource. There can be a maximum of 50 tags (both existing and pending) associated with a specific resource.
