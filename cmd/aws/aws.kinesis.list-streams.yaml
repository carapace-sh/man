name: list-streams
description: Lists your Kinesis data streams.
flags:
    --exclusive-start-stream-name=: The name of the stream to start the list with.
    --limit=: The maximum number of streams to list.
    --next-token=: ""
documentation:
    command: |-
        Lists your Kinesis data streams.

        The number of streams may be too large to return from a single call to `ListStreams`. You can limit the number of returned streams using the `Limit` parameter. If you do not specify a value for the `Limit` parameter, Kinesis Data Streams uses the default limit, which is currently 100.

        You can detect if there are more streams available to list by using the `HasMoreStreams` flag from the returned output. If there are more streams available, you can request more streams by using the name of the last stream returned by the `ListStreams` request in the `ExclusiveStartStreamName` parameter in a subsequent request to `ListStreams`. The group of stream names returned by the subsequent request is then added to the list. You can continue this process until all the stream names have been collected in the list.

        [ListStreams]() has a limit of five transactions per second per account.
    flag:
        exclusive-start-stream-name: The name of the stream to start the list with.
        limit: The maximum number of streams to list. The default value is 100. If you specify a value greater than 100, at most 100 results are returned.
        next-token: ""
