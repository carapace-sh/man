    --cli-input-yaml=: Read arguments from the YAML string provided.
    --filters=:
        description: Filters applied to the event categories.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --source-type=: The type of DMS resource that generates events.
documentation:
    command: Lists categories for all event source types, or, if specified, for a specified source type. You can see a list of the event categories and source types in [Working with Events and Notifications](https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Events.html) in the *Database Migration Service User Guide.*
    flag:
