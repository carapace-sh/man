name: describe-update
description: Describes an update to an Amazon EKS resource.
flags:
    --addon-name=: The name of the add-on.
    --name=!: The name of the Amazon EKS cluster associated with the update.
    --nodegroup-name=: The name of the Amazon EKS node group associated with the update.
    --update-id=!: The ID of the update to describe.
documentation:
    command: |-
        Describes an update to an Amazon EKS resource.

        When the status of the update is `Successful`, the update is complete. If an update fails, the status is `Failed`, and an error detail explains the reason for the failure.
    flag:
        addon-name: The name of the add-on. The name must match one of the names returned by [`ListAddons`](https://docs.aws.amazon.com/eks/latest/APIReference/API_ListAddons.html) . This parameter is required if the update is an add-on update.
        name: The name of the Amazon EKS cluster associated with the update.
        nodegroup-name: The name of the Amazon EKS node group associated with the update. This parameter is required if the update is a node group update.
        update-id: The ID of the update to describe.
