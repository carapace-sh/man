name: create-location-azure-blob
description: Creates a transfer *location* for a Microsoft Azure Blob Storage container.
flags:
    --access-tier=: Specifies the access tier that you want your objects or files transferred into.
    --agent-arns=: (Optional) Specifies the Amazon Resource Name (ARN) of the DataSync agent that can connect with your Azure Blob Storage container.
    --authentication-type=!: Specifies the authentication method DataSync uses to access your Azure Blob Storage.
    --blob-type=: Specifies the type of blob that you want your objects or files to be when transferring them into Azure Blob Storage.
    --cmk-secret-config=: Specifies configuration information for a DataSync-managed secret, which includes the authentication token that DataSync uses to access a specific AzureBlob storage location, with a customer-managed KMS key.
    --container-url=!: Specifies the URL of the Azure Blob Storage container involved in your transfer.
    --custom-secret-config=: Specifies configuration information for a customer-managed Secrets Manager secret where the authentication token for an AzureBlob storage location is stored in plain text.
    --sas-configuration=: Specifies the SAS configuration that allows DataSync to access your Azure Blob Storage.
    --subdirectory=: Specifies path segments if you want to limit your transfer to a virtual directory in your container (for example, `/my/images`).
    --tags=: Specifies labels that help you categorize, filter, and search for your Amazon Web Services resources.
completion:
    flag:
        access-tier:
            - HOT
            - COOL
            - ARCHIVE
        authentication-type:
            - SAS
            - NONE
        blob-type:
            - BLOCK
documentation:
    command: |-
        Creates a transfer *location* for a Microsoft Azure Blob Storage container. DataSync can use this location as a transfer source or destination. You can make transfers with or without a [DataSync agent](https://docs.aws.amazon.com/datasync/latest/userguide/creating-azure-blob-location.html#azure-blob-creating-agent) that connects to your container.

        Before you begin, make sure you know [how DataSync accesses Azure Blob Storage](https://docs.aws.amazon.com/datasync/latest/userguide/creating-azure-blob-location.html#azure-blob-access) and works with [access tiers](https://docs.aws.amazon.com/datasync/latest/userguide/creating-azure-blob-location.html#azure-blob-access-tiers) and [blob types](https://docs.aws.amazon.com/datasync/latest/userguide/creating-azure-blob-location.html#blob-types).
    flag:
        access-tier: Specifies the access tier that you want your objects or files transferred into. This only applies when using the location as a transfer destination. For more information, see [Access tiers](https://docs.aws.amazon.com/datasync/latest/userguide/creating-azure-blob-location.html#azure-blob-access-tiers).
        agent-arns: |-
            (Optional) Specifies the Amazon Resource Name (ARN) of the DataSync agent that can connect with your Azure Blob Storage container. If you are setting up an agentless cross-cloud transfer, you do not need to specify a value for this parameter.

            You can specify more than one agent. For more information, see [Using multiple agents for your transfer](https://docs.aws.amazon.com/datasync/latest/userguide/multiple-agents.html).

            Make sure you configure this parameter correctly when you first create your storage location. You cannot add or remove agents from a storage location after you create it.
        authentication-type: Specifies the authentication method DataSync uses to access your Azure Blob Storage. DataSync can access blob storage using a shared access signature (SAS).
        blob-type: Specifies the type of blob that you want your objects or files to be when transferring them into Azure Blob Storage. Currently, DataSync only supports moving data into Azure Blob Storage as block blobs. For more information on blob types, see the [Azure Blob Storage documentation](https://learn.microsoft.com/en-us/rest/api/storageservices/understanding-block-blobs--append-blobs--and-page-blobs).
        cmk-secret-config: |-
            Specifies configuration information for a DataSync-managed secret, which includes the authentication token that DataSync uses to access a specific AzureBlob storage location, with a customer-managed KMS key.

            When you include this paramater as part of a `CreateLocationAzureBlob` request, you provide only the KMS key ARN. DataSync uses this KMS key together with the authentication token you specify for `SasConfiguration` to create a DataSync-managed secret to store the location access credentials.

            Make sure the DataSync has permission to access the KMS key that you specify.

            You can use either `CmkSecretConfig` (with `SasConfiguration`) or `CustomSecretConfig` (without `SasConfiguration`) to provide credentials for a `CreateLocationAzureBlob` request. Do not provide both parameters for the same request.
        container-url: Specifies the URL of the Azure Blob Storage container involved in your transfer.
        custom-secret-config: |-
            Specifies configuration information for a customer-managed Secrets Manager secret where the authentication token for an AzureBlob storage location is stored in plain text. This configuration includes the secret ARN, and the ARN for an IAM role that provides access to the secret.

            You can use either `CmkSecretConfig` (with `SasConfiguration`) or `CustomSecretConfig` (without `SasConfiguration`) to provide credentials for a `CreateLocationAzureBlob` request. Do not provide both parameters for the same request.
        sas-configuration: |-
            Specifies the SAS configuration that allows DataSync to access your Azure Blob Storage.

            If you provide an authentication token using `SasConfiguration`, but do not provide secret configuration details using `CmkSecretConfig` or `CustomSecretConfig`, then DataSync stores the token using your Amazon Web Services account's secrets manager secret.
        subdirectory: Specifies path segments if you want to limit your transfer to a virtual directory in your container (for example, `/my/images`).
        tags: Specifies labels that help you categorize, filter, and search for your Amazon Web Services resources. We recommend creating at least a name tag for your transfer location.
