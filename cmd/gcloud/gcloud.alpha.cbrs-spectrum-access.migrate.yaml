name: migrate
description: '*(ALPHA)*  Migrates an existing SAS organization into Google Cloud.'
hidden: true
flags:
    --organization-id=!: The id of an existing SAS organization to migrate.
documentation:
    command: |-
        *(ALPHA)*  This will create a Google Cloud project for each existing deployment
        under the organization.

        ## EXAMPLES

        The following command migrates an existing SAS organization:

          $ gcloud cbrs-spectrum-access migrate --organization-id=1234
    flag:
        organization-id: The id of an existing SAS organization to migrate.
