name: create-managed-login-branding
description: Creates a new set of branding settings for a user pool style and associates it with an app client.
flags:
    --assets=: An array of image files that you want to apply to functions like backgrounds, logos, and icons.
    --client-id=!: The app client that you want to create the branding style for.
    --settings=: A JSON file, encoded as a `Document` type, with the the settings that you want to apply to your style.
    --use-cognito-provided-values=: When true, applies the default branding style options.
    --user-pool-id=!: The ID of the user pool where you want to create a new branding style.
documentation:
    command: |-
        Creates a new set of branding settings for a user pool style and associates it with an app client. This operation is the programmatic option for the creation of a new style in the branding editor.

        Provides values for UI customization in a `Settings` JSON object and image files in an `Assets` array. To send the JSON object `Document` type parameter in `Settings`, you might need to update to the most recent version of your Amazon Web Services SDK. To create a new style with default settings, set `UseCognitoProvidedValues` to `true` and don't provide values for any other options.

        This operation has a 2-megabyte request-size limit and include the CSS settings and image assets for your app client. Your branding settings might exceed 2MB in size. Amazon Cognito doesn't require that you pass all parameters in one request and preserves existing style settings that you don't specify. If your request is larger than 2MB, separate it into multiple requests, each with a size smaller than the limit.

        Amazon Cognito evaluates Identity and Access Management (IAM) policies in requests for this API operation. For this operation, you must use IAM credentials to authorize requests, and you must grant yourself the corresponding IAM permission in a policy.

        **Learn more**

        - [Signing Amazon Web Services API Requests](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_aws-signing.html)
        - [Using the Amazon Cognito user pools API and user pool endpoints](https://docs.aws.amazon.com/cognito/latest/developerguide/user-pools-API-operations.html)
    flag:
        assets: An array of image files that you want to apply to functions like backgrounds, logos, and icons. Each object must also indicate whether it is for dark mode, light mode, or browser-adaptive mode.
        client-id: The app client that you want to create the branding style for. Each style is linked to an app client until you delete it.
        settings: |-
            A JSON file, encoded as a `Document` type, with the the settings that you want to apply to your style.

            The following components are not currently implemented and reserved for future use:

            - `signUp`
            - `instructions`
            - `sessionTimerDisplay`
            - `languageSelector` (for localization, see [Managed login localization)](https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-managed-login.html#managed-login-localization)
        use-cognito-provided-values: |-
            When true, applies the default branding style options. These default options are managed by Amazon Cognito. You can modify them later in the branding editor.

            When you specify `true` for this option, you must also omit values for `Settings` and `Assets` in the request.
        user-pool-id: The ID of the user pool where you want to create a new branding style.
