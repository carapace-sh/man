name: list-incident-findings
description: Retrieves a list of the IDs of findings, plus their last modified times, that have been identified for a specified incident.
flags:
    --incident-record-arn=!: The Amazon Resource Name (ARN) of the incident for which you want to view associated findings.
    --max-results=: The maximum number of findings to retrieve per call.
    --next-token=: The pagination token for the next set of items to return.
documentation:
    command: Retrieves a list of the IDs of findings, plus their last modified times, that have been identified for a specified incident. A finding represents a recent application environment change made by an CloudFormation stack creation or update or an CodeDeploy deployment that can be investigated as a potential cause of the incident.
    flag:
        incident-record-arn: The Amazon Resource Name (ARN) of the incident for which you want to view associated findings.
        max-results: The maximum number of findings to retrieve per call.
        next-token: The pagination token for the next set of items to return. (You received this token from a previous call.)
