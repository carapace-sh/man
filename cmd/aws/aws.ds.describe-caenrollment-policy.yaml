name: describe-caenrollment-policy
description: Retrieves detailed information about the certificate authority (CA) enrollment policy for the specified directory.
flags:
    --directory-id=!: The identifier of the directory for which to retrieve the CA enrollment policy information.
documentation:
    command: Retrieves detailed information about the certificate authority (CA) enrollment policy for the specified directory. This policy determines how client certificates are automatically enrolled and managed through Amazon Web Services Private Certificate Authority.
    flag:
        directory-id: The identifier of the directory for which to retrieve the CA enrollment policy information.
