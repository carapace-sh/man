name: list-restore-testing-plans
description: Returns a list of restore testing plans.
flags:
    --max-results=: The maximum number of items to be returned.
    --next-token=: The next item following a partial list of returned items.
documentation:
    command: Returns a list of restore testing plans.
    flag:
        max-results: The maximum number of items to be returned.
        next-token: The next item following a partial list of returned items. For example, if a request is made to return `MaxResults` number of items, `NextToken` allows you to return more items in your list starting at the location pointed to by the nexttoken.
