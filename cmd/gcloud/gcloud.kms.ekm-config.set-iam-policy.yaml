name: set-iam-policy
description: Set the IAM policy for an EkmConfig.
flags:
    --location=!: ID of the location or fully qualified identifier for the location.
documentation:
    command: |-
        Sets the IAM policy for the EkmConfig in a location as defined in a JSON or
        YAML file.

        See https://cloud.google.com/iam/docs/managing-policies for details of
        the policy file format and contents.

        ## EXAMPLES
        The following command will read am IAM policy defined in a JSON file
        'policy.json' and set it for the EkmConfig with location `us-central1`:

          $ gcloud kms ekm-config set-iam-policy policy.json --location=us-central1
    flag:
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line.
