name: describe
description: '*(BETA)*  Lists container analysis data for a given image.'
flags:
    --metadata-filter=: Additional filter to fetch metadata for a given fully qualified image reference.
    --no-show-all-metadata&: Include all metadata in the output.
    --no-show-build-details&: Include build metadata in the output.
    --no-show-deployment&: Include deployment metadata in the output.
    --no-show-image-basis&: Include base image metadata in the output.
    --no-show-package-vulnerability&: Include vulnerability metadata in the output.
    --show-all-metadata: Include all metadata in the output.
    --show-build-details: Include build metadata in the output.
    --show-deployment: Include deployment metadata in the output.
    --show-image-basis: Include base image metadata in the output.
    --show-package-vulnerability: Include vulnerability metadata in the output.
documentation:
    command: |-
        *(BETA)*  Lists container analysis data for a valid image.

        ## EXAMPLES

        Describe the specified image:

          $ gcloud beta container images describe gcr.io/myproject/myimage@digest

                Or:

          $ gcloud beta container images describe gcr.io/myproject/myimage:tag

        Find the digest for a tag:

          $ gcloud beta container images describe gcr.io/myproject/myimage:tag \
            --format="value(image_summary.digest)"

                Or:

          $ gcloud beta container images describe gcr.io/myproject/myimage:tag \
            --format="value(image_summary.fully_qualified_digest)"

        See package vulnerabilities found by the Container Analysis API for the
        specified image:

          $ gcloud beta container images describe gcr.io/myproject/myimage@digest --show-package-vulnerability
    flag:
        metadata-filter: Additional filter to fetch metadata for a given fully qualified image reference.
        no-show-all-metadata: Include all metadata in the output.
        no-show-build-details: Include build metadata in the output.
        no-show-deployment: Include deployment metadata in the output.
        no-show-image-basis: Include base image metadata in the output.
        no-show-package-vulnerability: Include vulnerability metadata in the output.
        show-all-metadata: Include all metadata in the output.
        show-build-details: Include build metadata in the output.
        show-deployment: Include deployment metadata in the output.
        show-image-basis: Include base image metadata in the output.
        show-package-vulnerability: Include vulnerability metadata in the output.
