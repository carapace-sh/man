name: reboot-workspaces
description: Reboots the specified WorkSpaces.
flags:
    --reboot-workspace-requests=!: The WorkSpaces to reboot.
documentation:
    command: |-
        Reboots the specified WorkSpaces.

        You cannot reboot a WorkSpace unless its state is `AVAILABLE`, `UNHEALTHY`, or `REBOOTING`. Reboot a WorkSpace in the `REBOOTING` state only if your WorkSpace has been stuck in the `REBOOTING` state for over 20 minutes.

        This operation is asynchronous and returns before the WorkSpaces have rebooted.
    flag:
        reboot-workspace-requests: The WorkSpaces to reboot. You can specify up to 25 WorkSpaces.
