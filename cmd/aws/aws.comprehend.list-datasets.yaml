name: list-datasets
description: List the datasets that you have configured in this Region.
flags:
    --filter=: Filters the datasets to be returned in the response.
    --flywheel-arn=: The Amazon Resource Number (ARN) of the flywheel.
    --max-results=: Maximum number of results to return in a response.
    --next-token=: Identifies the next page of results to return.
documentation:
    command: List the datasets that you have configured in this Region. For more information about datasets, see [Flywheel overview](https://docs.aws.amazon.com/comprehend/latest/dg/flywheels-about.html) in the *Amazon Comprehend Developer Guide*.
    flag:
        filter: Filters the datasets to be returned in the response.
        flywheel-arn: The Amazon Resource Number (ARN) of the flywheel.
        max-results: Maximum number of results to return in a response. The default is 100.
        next-token: Identifies the next page of results to return.
