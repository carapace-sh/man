name: list-file-shares
description: Gets a list of the file shares for a specific S3 File Gateway, or the list of file shares that belong to the calling Amazon Web Services account.
flags:
    --gateway-arn=: The Amazon Resource Name (ARN) of the gateway whose file shares you want to list.
    --limit=: The maximum number of file shares to return in the response.
    --marker=: Opaque pagination token returned from a previous ListFileShares operation.
documentation:
    command: Gets a list of the file shares for a specific S3 File Gateway, or the list of file shares that belong to the calling Amazon Web Services account. This operation is only supported for S3 File Gateways.
    flag:
        gateway-arn: The Amazon Resource Name (ARN) of the gateway whose file shares you want to list. If this field is not present, all file shares under your account are listed.
        limit: The maximum number of file shares to return in the response. The value must be an integer with a value greater than zero. Optional.
        marker: Opaque pagination token returned from a previous ListFileShares operation. If present, `Marker` specifies where to continue the list from after a previous call to ListFileShares. Optional.
