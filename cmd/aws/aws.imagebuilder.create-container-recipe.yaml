name: create-container-recipe
description: Creates a new container recipe.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=!: Unique, case-sensitive identifier you provide to ensure idempotency of the request.
    --components=: The components included in the container recipe.
    --container-type=!: The type of container to create.
    --description=: The description of the container recipe.
    --dockerfile-template-data=: The Dockerfile template used to build your image as an inline data blob.
    --dockerfile-template-uri=: The Amazon S3 URI for the Dockerfile that will be used to build your container image.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --image-os-version-override=: Specifies the operating system version for the base image.
    --instance-configuration=: A group of options that can be used to configure an instance for building and testing container images.
    --kms-key-id=: The Amazon Resource Name (ARN) that uniquely identifies which KMS key is used to encrypt the Dockerfile template.
    --name=!: The name of the container recipe.
    --parent-image=!: The base image for the container recipe.
    --platform-override=: Specifies the operating system platform when you use a custom base image.
    --semantic-version=!: The semantic version of the container recipe.
    --tags=: Tags that are attached to the container recipe.
    --target-repository=!: The destination repository for the container image.
    --working-directory=: The working directory for use during build and test workflows.
completion:
    flag:
        container-type:
            - DOCKER
        platform-override:
            - Windows
            - Linux
            - macOS
documentation:
    command: Creates a new container recipe. Container recipes define how images are configured, tested, and assessed.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: Unique, case-sensitive identifier you provide to ensure idempotency of the request. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html) in the *Amazon EC2 API Reference*.
        components: The components included in the container recipe.
        container-type: The type of container to create.
        description: The description of the container recipe.
        dockerfile-template-data: The Dockerfile template used to build your image as an inline data blob.
        dockerfile-template-uri: The Amazon S3 URI for the Dockerfile that will be used to build your container image.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        image-os-version-override: Specifies the operating system version for the base image.
        instance-configuration: A group of options that can be used to configure an instance for building and testing container images.
        kms-key-id: The Amazon Resource Name (ARN) that uniquely identifies which KMS key is used to encrypt the Dockerfile template. This can be either the Key ARN or the Alias ARN. For more information, see [Key identifiers (KeyId)](https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html#key-id-key-ARN) in the *Key Management Service Developer Guide*.
        name: The name of the container recipe.
        parent-image: The base image for the container recipe.
        platform-override: Specifies the operating system platform when you use a custom base image.
        semantic-version: |-
            The semantic version of the container recipe. This version follows the semantic version syntax.

            The semantic version has four nodes: &lt;major&gt;.&lt;minor&gt;.&lt;patch&gt;/&lt;build&gt;. You can assign values for the first three, and can filter on all of them.

            **Assignment:** For the first three nodes you can assign any positive integer value, including zero, with an upper limit of 2^30-1, or 1073741823 for each node. Image Builder automatically assigns the build number to the fourth node.

            **Patterns:** You can use any numeric pattern that adheres to the assignment requirements for the nodes that you can assign. For example, you might choose a software version pattern, such as 1.0.0, or a date, such as 2021.01.01.
        tags: Tags that are attached to the container recipe.
        target-repository: The destination repository for the container image.
        working-directory: The working directory for use during build and test workflows.
