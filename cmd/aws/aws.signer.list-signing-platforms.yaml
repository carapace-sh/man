name: list-signing-platforms
description: Lists all signing platforms available in AWS Signer that match the request parameters.
flags:
    --category=: The category type of a signing platform.
    --max-results=: The maximum number of results to be returned by this operation.
    --next-token=: Value for specifying the next set of paginated results to return.
    --partner=: Any partner entities connected to a signing platform.
    --target=: The validation template that is used by the target signing platform.
documentation:
    command: Lists all signing platforms available in AWS Signer that match the request parameters. If additional jobs remain to be listed, Signer returns a `nextToken` value. Use this value in subsequent calls to `ListSigningJobs` to fetch the remaining values. You can continue calling `ListSigningJobs` with your `maxResults` parameter and with new values that Signer returns in the `nextToken` parameter until all of your signing jobs have been returned.
    flag:
        category: The category type of a signing platform.
        max-results: The maximum number of results to be returned by this operation.
        next-token: Value for specifying the next set of paginated results to return. After you receive a response with truncated results, use this parameter in a subsequent request. Set it to the value of `nextToken` from the response that you just received.
        partner: Any partner entities connected to a signing platform.
        target: The validation template that is used by the target signing platform.
