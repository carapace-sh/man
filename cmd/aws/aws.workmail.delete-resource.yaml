name: delete-resource
description: Deletes the specified resource.
flags:
    --organization-id=!: The identifier associated with the organization from which the resource is deleted.
    --resource-id=!: The identifier of the resource to be deleted.
documentation:
    command: Deletes the specified resource.
    flag:
        organization-id: The identifier associated with the organization from which the resource is deleted.
        resource-id: |-
            The identifier of the resource to be deleted.

            The identifier can accept *ResourceId*, or *Resourcename*. The following identity formats are available:

            - Resource ID: r-0123456789a0123456789b0123456789
            - Resource name: resource
