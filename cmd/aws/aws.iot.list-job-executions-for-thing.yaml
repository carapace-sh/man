name: list-job-executions-for-thing
description: Lists the job executions for the specified thing.
flags:
    --job-id=: The unique identifier you assigned to this job when it was created.
    --max-results=: The maximum number of results to be returned per request.
    --namespace-id=: The namespace used to indicate that a job is a customer-managed job.
    --next-token=: The token to retrieve the next set of results.
    --status=: An optional filter that lets you search for jobs that have the specified status.
    --thing-name=!: The thing name.
completion:
    flag:
        status:
            - QUEUED
            - IN_PROGRESS
            - SUCCEEDED
            - FAILED
            - TIMED_OUT
            - REJECTED
            - REMOVED
            - CANCELED
documentation:
    command: |-
        Lists the job executions for the specified thing.

        Requires permission to access the [ListJobExecutionsForThing](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        job-id: The unique identifier you assigned to this job when it was created.
        max-results: The maximum number of results to be returned per request.
        namespace-id: |-
            The namespace used to indicate that a job is a customer-managed job.

            When you specify a value for this parameter, Amazon Web Services IoT Core sends jobs notifications to MQTT topics that contain the value in the following format.

            `$aws/things/THING_NAME/jobs/JOB_ID/notify-namespace-NAMESPACE_ID/`

            The `namespaceId` feature is only supported by IoT Greengrass at this time. For more information, see [Setting up IoT Greengrass core devices.](https://docs.aws.amazon.com/greengrass/v2/developerguide/setting-up.html)
        next-token: The token to retrieve the next set of results.
        status: An optional filter that lets you search for jobs that have the specified status.
        thing-name: The thing name.
