name: create-connector
description: Creates a connector using the specified properties.
flags:
    --capacity=!: Information about the capacity allocated to the connector.
    --connector-configuration=!: A map of keys to values that represent the configuration for the connector.
    --connector-description=: A summary description of the connector.
    --connector-name=!: The name of the connector.
    --kafka-cluster-client-authentication=!: Details of the client authentication used by the Apache Kafka cluster.
    --kafka-cluster-encryption-in-transit=!: Details of encryption in transit to the Apache Kafka cluster.
    --kafka-cluster=!: Specifies which Apache Kafka cluster to connect to.
    --kafka-connect-version=!: The version of Kafka Connect.
    --log-delivery=: Details about log delivery.
    --plugins=!: Amazon MSK Connect does not currently support specifying multiple plugins as a list.
    --service-execution-role-arn=!: The Amazon Resource Name (ARN) of the IAM role used by the connector to access the Amazon Web Services resources that it needs.
    --tags=: The tags you want to attach to the connector.
    --worker-configuration=: Specifies which worker configuration to use with the connector.
documentation:
    command: Creates a connector using the specified properties.
    flag:
        capacity: Information about the capacity allocated to the connector. Exactly one of the two properties must be specified.
        connector-configuration: A map of keys to values that represent the configuration for the connector.
        connector-description: A summary description of the connector.
        connector-name: The name of the connector.
        kafka-cluster: Specifies which Apache Kafka cluster to connect to.
        kafka-cluster-client-authentication: Details of the client authentication used by the Apache Kafka cluster.
        kafka-cluster-encryption-in-transit: Details of encryption in transit to the Apache Kafka cluster.
        kafka-connect-version: The version of Kafka Connect. It has to be compatible with both the Apache Kafka cluster's version and the plugins.
        log-delivery: Details about log delivery.
        plugins: |-
            Amazon MSK Connect does not currently support specifying multiple plugins as a list. To use more than one plugin for your connector, you can create a single custom plugin using a ZIP file that bundles multiple plugins together.

            Specifies which plugin to use for the connector. You must specify a single-element list containing one `customPlugin` object.
        service-execution-role-arn: The Amazon Resource Name (ARN) of the IAM role used by the connector to access the Amazon Web Services resources that it needs. The types of resources depends on the logic of the connector. For example, a connector that has Amazon S3 as a destination must have permissions that allow it to write to the S3 destination bucket.
        tags: The tags you want to attach to the connector.
        worker-configuration: Specifies which worker configuration to use with the connector.
