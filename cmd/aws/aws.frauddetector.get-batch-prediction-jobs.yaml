name: get-batch-prediction-jobs
description: Gets all batch prediction jobs or a specific job if you specify a job ID.
flags:
    --job-id=: The batch prediction job for which to get the details.
    --max-results=: The maximum number of objects to return for the request.
    --next-token=: The next token from the previous request.
documentation:
    command: Gets all batch prediction jobs or a specific job if you specify a job ID. This is a paginated API. If you provide a null maxResults, this action retrieves a maximum of 50 records per page. If you provide a maxResults, the value must be between 1 and 50. To get the next page results, provide the pagination token from the GetBatchPredictionJobsResponse as part of your request. A null pagination token fetches the records from the beginning.
    flag:
        job-id: The batch prediction job for which to get the details.
        max-results: The maximum number of objects to return for the request.
        next-token: The next token from the previous request.
