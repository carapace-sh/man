name: create
description: '*(ALPHA)*  Create a new Cloud Media Asset transformer.'
hidden: true
flags:
    --create-transformer-configs-file=: File path to a config file in JSON format.
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: Google Cloud location.
documentation:
    command: '*(ALPHA)*  Create a new Media Asset transformer.'
    flag:
        create-transformer-configs-file: File path to a config file in JSON format. Use a full or relative path to a local file containing the value of create_transformer_configs_file.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `transformer` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `media_asset/location`.
