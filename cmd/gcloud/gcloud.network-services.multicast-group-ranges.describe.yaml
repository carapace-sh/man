name: describe
description: Describe a multicast group range.
flags:
    --location=: The location Id.
documentation:
    command: |
        Show details of a multicast group range in the specified location of the current project.
    flag:
        location: |-
            The location Id.
            +
            To set the `location` attribute:
            * provide the argument `multicast_group_range` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
