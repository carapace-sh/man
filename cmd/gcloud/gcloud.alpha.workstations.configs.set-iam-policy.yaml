name: set-iam-policy
description: '*(ALPHA)*  Set the IAM policy for a configuration.'
flags:
    --cluster=: The name of the cluster containing the config.
    --region=: The name of the region of the config.
documentation:
    command: |
        *(ALPHA)*  Sets the IAM policy for the given configuration as defined in a JSON or YAML file.
    flag:
        cluster: |-
            The name of the cluster containing the config.
            +

            To set the `cluster` attribute:
            * provide the argument `config` on the command line with a fully specified name;
            * provide the argument `--cluster` on the command line;
            * set the property `workstations/cluster`.
        region: |-
            The name of the region of the config.
            +

            To set the `region` attribute:
            * provide the argument `config` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `workstations/region`.
