name: cli
description: '*(ALPHA)*  An interactive shell for Spanner.'
flags:
    --database-role=: Database role user used to access the database.
    --delimiter=: Set the statement delimiter.
    --execute=: Execute the statement and then exits.
    --host=: Host on which Spanner server is located.
    --html: Show output in HTML format.
    --idle-transaction-timeout=: Set the idle transaction timeout.
    --init-command-add=: Additional SQL statement to execute after startup.
    --init-command=: SQL statement to execute after startup.
    --instance=: The Cloud Spanner instance for the database.
    --no-html&: Show output in HTML format.
    --no-show-exec-error&: If true and command fails, print the underlying command that was executed and its exit status.
    --no-skip-column-names&: Do not show column names in output.
    --no-skip-system-command&: Do not allow system command.
    --no-table&: Show output in table format.
    --no-xml&: Show output in XML format.
    --port=: Port number that gcloud uses to connect to Spanner.
    --prompt=: Set the prompt to the specified format.
    --show-exec-error&: If true and command fails, print the underlying command that was executed and its exit status.
    --skip-column-names: Do not show column names in output.
    --skip-system-command: Do not allow system command.
    --source=: Execute the statement from a file and then exits.
    --system-command=: Enable or disable system commands.
    --table: Show output in table format.
    --tee=: Append a copy of the output to a named file.
    --xml: Show output in XML format.
completion:
    flag:
        system-command:
            - "ON"
            - "OFF"
documentation:
    command: '*(ALPHA)*  An interactive shell for Spanner.'
    flag:
        database-role: Database role user used to access the database.
        delimiter: Set the statement delimiter.
        execute: Execute the statement and then exits.
        host: Host on which Spanner server is located.
        html: Show output in HTML format.
        idle-transaction-timeout: Set the idle transaction timeout. The default timeout is 60 seconds.
        init-command: SQL statement to execute after startup.
        init-command-add: Additional SQL statement to execute after startup.
        instance: |-
            The Cloud Spanner instance for the database.
            +
            To set the `instance` attribute:
            * provide the argument `database` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line;
            * set the property `spanner/instance`.
        no-html: Show output in HTML format.
        no-show-exec-error: If true and command fails, print the underlying command that was executed and its exit status.
        no-skip-column-names: Do not show column names in output.
        no-skip-system-command: Do not allow system command.
        no-table: Show output in table format.
        no-xml: Show output in XML format.
        port: Port number that gcloud uses to connect to Spanner.
        prompt: Set the prompt to the specified format.
        show-exec-error: If true and command fails, print the underlying command that was executed and its exit status.
        skip-column-names: Do not show column names in output.
        skip-system-command: Do not allow system command.
        source: Execute the statement from a file and then exits.
        system-command: 'Enable or disable system commands. Default: ON. _SYSTEM_COMMAND_ must be one of: *ON*, *OFF*.'
        table: Show output in table format.
        tee: Append a copy of the output to a named file.
        xml: Show output in XML format.
