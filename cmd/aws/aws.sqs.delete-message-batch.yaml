name: delete-message-batch
description: Deletes up to ten messages from the specified queue.
flags:
    --entries=!: Lists the receipt handles for the messages to be deleted.
    --queue-url=!: The URL of the Amazon SQS queue from which messages are deleted.
documentation:
    command: |-
        Deletes up to ten messages from the specified queue. This is a batch version of `DeleteMessage.` The result of the action on each message is reported individually in the response.

        Because the batch request can result in a combination of successful and unsuccessful actions, you should check for batch errors even when the call returns an HTTP status code of `200`.
    flag:
        entries: Lists the receipt handles for the messages to be deleted.
        queue-url: |-
            The URL of the Amazon SQS queue from which messages are deleted.

            Queue URLs and names are case-sensitive.
