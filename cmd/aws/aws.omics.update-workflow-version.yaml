name: update-workflow-version
description: Updates information about the workflow version.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: Description of the workflow version.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --readme-markdown=: The markdown content for the workflow version's README file.
    --storage-capacity=: The default static storage capacity (in gibibytes) for runs that use this workflow version.
    --storage-type=: The default storage type for runs that use this workflow version.
    --version-name=!: The name of the workflow version.
    --workflow-id=!: The workflow's ID.
completion:
    flag:
        storage-type:
            - STATIC
            - DYNAMIC
documentation:
    command: Updates information about the workflow version. For more information, see [Workflow versioning in Amazon Web Services HealthOmics](https://docs.aws.amazon.com/omics/latest/dev/workflow-versions.html) in the *Amazon Web Services HealthOmics User Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: Description of the workflow version.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        readme-markdown: The markdown content for the workflow version's README file. This provides documentation and usage information for users of this specific workflow version.
        storage-capacity: The default static storage capacity (in gibibytes) for runs that use this workflow version. The `storageCapacity` can be overwritten at run time. The storage capacity is not required for runs with a `DYNAMIC` storage type.
        storage-type: The default storage type for runs that use this workflow version. The `storageType` can be overridden at run time. `DYNAMIC` storage dynamically scales the storage up or down, based on file system utilization. STATIC storage allocates a fixed amount of storage. For more information about dynamic and static storage types, see [Run storage types](https://docs.aws.amazon.com/omics/latest/dev/workflows-run-types.html) in the *in the Amazon Web Services HealthOmics User Guide* .
        version-name: The name of the workflow version.
        workflow-id: The workflow's ID. The `workflowId` is not the UUID.
