name: delete
description: '*(ALPHA)*  Delete Cloud VPN Classic Target VPN Gateways.'
flags:
    --region=: Region of the Target VPN Gateways to delete.
documentation:
    command: |-
        *(ALPHA)*  *gcloud alpha compute target-vpn-gateways delete* deletes one or more Compute Engine Cloud VPN Classic
        Target VPN Gateways.
    flag:
        region: |-
            Region of the Target VPN Gateways to delete. If not specified, you might be prompted to select a region (interactive mode
            only).
            +
            To avoid prompting when this flag is omitted, you can set the
            ``compute/region'' property:
            +
              $ gcloud config set compute/region REGION
            +
            A list of regions can be fetched by running:
            +
              $ gcloud compute regions list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/region
            +
            Alternatively, the region can be stored in the environment
            variable ``CLOUDSDK_COMPUTE_REGION''.
