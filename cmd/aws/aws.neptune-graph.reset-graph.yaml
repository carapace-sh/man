name: reset-graph
description: Empties the data from a specified Neptune Analytics graph.
flags:
    --graph-identifier=!: ID of the graph to reset.
    --no-skip-snapshot!&: Determines whether a final graph snapshot is created before the graph data is deleted.
    --skip-snapshot!: Determines whether a final graph snapshot is created before the graph data is deleted.
documentation:
    command: Empties the data from a specified Neptune Analytics graph.
    flag:
        graph-identifier: ID of the graph to reset.
        skip-snapshot: Determines whether a final graph snapshot is created before the graph data is deleted. If set to `true`, no graph snapshot is created. If set to `false`, a graph snapshot is created before the data is deleted.
