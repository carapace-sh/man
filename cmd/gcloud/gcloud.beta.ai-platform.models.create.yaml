documentation:
    command: '*(BETA)*  Create a new AI Platform model.'
    flag:
        description: Description of the model.
        enable-console-logging: If set, enables StackDriver Logging of stderr and stdout streams for online prediction. These logs are more verbose than the standard access logs and can be helpful for debugging.
        enable-logging: If set, enables StackDriver Logging for online prediction. These logs are like standard server access logs, containing information such as timestamps and latency for each request.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        no-enable-console-logging: If set, enables StackDriver Logging of stderr and stdout streams for online prediction. These logs are more verbose than the standard access logs and can be helpful for debugging.
        no-enable-logging: If set, enables StackDriver Logging for online prediction. These logs are like standard server access logs, containing information such as timestamps and latency for each request.
        region: |-
            Google Cloud region of the regional endpoint to use for this command.
            +
            If you specify this flag, do not specify `--regions`.
            +
            If you specify `--region=global`, the model will be deployed to 'us-central1'
            by default using the global endpoint. Please use `--regions` only if you want
            to change the region where the model will be deployed against the global
            endpoint.
            +
            If both flags are unspecified and you don't set ``ai_platform/region'', you will
            be prompted for region of the regional endpoint.
            +
            Learn more about regional endpoints and see a list of available regions:
             https://cloud.google.com/ai-platform/prediction/docs/regional-endpoints
            +
            _REGION_ must be one of: *global*, *asia-east1*, *asia-northeast1*, *asia-southeast1*, *australia-southeast1*, *europe-west1*, *europe-west2*, *europe-west3*, *europe-west4*, *northamerica-northeast1*, *us-central1*, *us-east1*, *us-east4*, *us-west1*.
        regions: |-
            The Google Cloud region where the model will be deployed (currently only a
            single region is supported) against the global endpoint.
            +
            If you specify this flag, do not specify `--region`.
            +
            Defaults to 'us-central1' while using the global endpoint.
