    --automated-backup-retention-period=: The retention period of automated backup in the format of `30d` for 30 days.
    --change-stream-retention-period=: The length of time to retain change stream data for the table, in the range of [1 day, 7 days].
    --clear-change-stream-retention-period: This disables the change stream and eventually removes the change stream data.
    --clear-row-key-schema: Whether to clear the row key schema in the updated table.
    --deletion-protection: Once specified, the table is deletion protected.
    --disable-automated-backup: Once set, disables automated backup policy for the table.
    --enable-automated-backup: Once set, enables the default automated backup policy (retention_period=7d, frequency=1d) for the table.
