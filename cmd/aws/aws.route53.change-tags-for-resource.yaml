name: change-tags-for-resource
description: Adds, edits, or deletes tags for a health check or a hosted zone.
flags:
    --add-tags=:
        description: A complex type that contains a list of the tags that you want to add to the specified health check or hosted zone and/or the tags that you want to edit `Value` for.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --remove-tag-keys=:
        description: A complex type that contains a list of the tags that you want to delete from the specified health check or hosted zone.
        nargs: -1
    --resource-id=!: The ID of the resource for which you want to add, change, or delete tags.
    --resource-type=!: The type of the resource.
completion:
    flag:
        resource-type:
            - healthcheck
            - hostedzone
documentation:
    command: |-
        Adds, edits, or deletes tags for a health check or a hosted zone.

        For information about using tags for cost allocation, see [Using Cost Allocation Tags](https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-alloc-tags.html) in the *Billing and Cost Management User Guide*.
    flag:
        add-tags: |-
            A complex type that contains a list of the tags that you want to add to the specified health check or hosted zone and/or the tags that you want to edit `Value` for.

            You can add a maximum of 10 tags to a health check or a hosted zone.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        remove-tag-keys: A complex type that contains a list of the tags that you want to delete from the specified health check or hosted zone. You can specify up to 10 keys.
        resource-id: The ID of the resource for which you want to add, change, or delete tags.
        resource-type: |-
            The type of the resource.

            - The resource type for health checks is `healthcheck`.
            - The resource type for hosted zones is `hostedzone`.
