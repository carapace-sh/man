name: update
description: Update a Cloud NetApp Volume.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --backup-config=: Backup Config contains backup related config on a volume.
    --backup-vault=: The Backup Vault of the backup.
    --block-devices=: A block device to be created with the volume.
    --cache-parameters=: Cache Parameters contains cache parameters of a volume.
    --capacity=: The desired capacity of the Volume in GiB or TiB units.If no capacity unit is specified, GiB is assumed.
    --clear-labels: Remove all labels.
    --description=: A description of the Cloud NetApp Volume
    --enable-kerberos=: Boolean flag indicating whether Volume is a kerberos Volume or not
    --export-policy=: Export Policy of a Cloud NetApp Files Volume.
    --location=: The location of the volume.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-clear-labels&: Remove all labels.
    --protocols=: Type of File System protocols for the Cloud NetApp Files Volume.
    --remove-labels=: List of label keys to remove.
    --restricted-actions=: Actions to be restricted for a volume.
    --security-style=: The security style of the Volume.
    --share-name=: Share name of the Mount path clients will use.
    --smb-settings=: List of settings specific to SMB protocol for a Cloud NetApp Files Volume.
    --snap-reserve=: (DEPRECATED) The percentage of volume storage reserved for snapshot storage.
    --snapshot-daily=: Make a snapshot every day e.g. at 06:00, 05:20, 23:50
    --snapshot-directory=: Snapshot Directory if enabled (true) makes the Volume
    --snapshot-hourly=: Make a snapshot every hour e.g. at 04:00, 05:20, 06:00
    --snapshot-monthly=: Make a snapshot once a month e.g. at 2nd 04:00, 7th 05:20, 24th 23:50
    --snapshot-weekly=: Make a snapshot every week e.g. at Monday 04:00, Wednesday 05:20,
    --source-backup=!: ID of the backup or fully qualified identifier for the backup.
    --source-snapshot=!: ID of the snapshot or fully qualified identifier for the snapshot.
    --storage-pool=!: ID of the storage_pool or fully qualified identifier for the storage_pool.
    --throughput-mibps=: The desired throughput of the volume in MiB/s.
    --tiering-policy=: Tiering Policy contains auto tiering policy on a volume.
    --unix-permissions=: Unix permissions the mount point will be created with.
    --update-labels=: List of label KEY=VALUE pairs to update.
completion:
    flag:
        security-style:
            - ntfs
            - unix
documentation:
    command: |
        Update a Cloud NetApp Volume and its specified parameters
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        backup-config: |-
            Backup Config contains backup related config on a volume.
            +
                Backup Config will have the following format
                `--backup-config=backup-policies=BACKUP_POLICIES,
                backup-vault=BACKUP_VAULT_NAME,
                enable-scheduled-backups=ENABLE_SCHEDULED_BACKUPS
            +
            backup-policies is a pound-separated (#) list of backup policy names, backup-vault can include
            a single backup-vault resource name, and enable-scheduled-backups is a Boolean value indicating
            whether or not scheduled backups are enabled on the volume.
        backup-vault: |-
            The Backup Vault of the backup.
            +
            To set the `backup_vault` attribute:
            * provide the argument `--source-backup` on the command line with a fully specified name;
            * provide the argument `--backup_vault` on the command line;
            * provide the argument `--backup-vault` on the command line.
        block-devices: |-
            A block device to be created with the volume.
            +
            This flag can be repeated to specify multiple block devices.
            +
            The following keys are available:
            *name*::: A user-defined name for the block device.
            *host-groups*::: A comma-separated list of host groups that can mount the block volume.
            *os-type*::: The OS type of the volume. Allowed values are `OS_TYPE_UNSPECIFIED`, `LINUX`, `WINDOWS`.
            *size-gib*::: The size of the block device in GiB. Note that this value is ignored during volume creation and is system-managed.
        cache-parameters: |-
            Cache Parameters contains cache parameters of a volume.
            +
                Cache Parameters will have the following format
                `--cache-parameters=peer-volume-name=PEER_VOLUME_NAME,
                  peer-cluster-name=PEER_CLUSTER_NAME,
                  peer-svm-name=PEER_SVM_NAME,
                  peer-ip-addresses=[PEER-IP-ADDRESS1#PEER-IP-ADDRESS2#...],
                  enable-global-file-lock=ENABLE_GLOBAL_FILE_LOCK,
                  cache-config=CACHE_CONFIG`
            +
                *peer-volume-name*::: Name of the user's local source volume
                *peer-cluster-name*::: Name of the user's local source cluster
                *peer-svm-name*::: Name of the user's local source vserver svm
                *peer-ip-addresses*::: Hashtag-separated(#) list of IP addresses
                *enable-global-file-lock*::: If true, enable global file lock
                *cache-config*::: Cache-config as a hashtag-separated(#) list of key-value pairs
        capacity: The desired capacity of the Volume in GiB or TiB units.If no capacity unit is specified, GiB is assumed.
        clear-labels: |-
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.
            +
            For example, to remove all labels:
            +
                $ {command} --clear-labels
            +
            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':
            +
                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        description: A description of the Cloud NetApp Volume
        enable-kerberos: Boolean flag indicating whether Volume is a kerberos Volume or not
        export-policy: |-
            Export Policy of a Cloud NetApp Files Volume.
            This will be a field similar to network
            in which export policy fields can be specified as such:
            `--export-policy=allowed-clients=ALLOWED_CLIENTS_IP_ADDRESSES,
            has-root-access=HAS_ROOT_ACCESS_BOOL,access=ACCESS_TYPE,nfsv3=NFSV3,
            nfsv4=NFSV4,kerberos-5-read-only=KERBEROS_5_READ_ONLY,
            kerberos-5-read-write=KERBEROS_5_READ_WRITE,
            kerberos-5i-read-only=KERBEROS_5I_READ_ONLY,
            kerberos-5i-read-write=KERBEROS_5I_READ_WRITE,
            kerberos-5p-read-only=KERBEROS_5P_READ_ONLY,
            kerberos-5p-read-write=KERBEROS_5P_READ_WRITE`
        location: |-
            The location of the volume.
            +
            To set the `location` attribute:
            * provide the argument `volume` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `netapp/location`.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-clear-labels: |
            Remove all labels. If `--update-labels` is also specified then
            `--clear-labels` is applied first.

            For example, to remove all labels:

                $ {command} --clear-labels

            To remove all existing labels and create two new labels,
            ``foo'' and ``baz'':

                $ {command} --clear-labels --update-labels foo=bar,baz=qux
        protocols: |-
            Type of File System protocols for the Cloud NetApp Files Volume. Valid component values are:
                        `NFSV3`, `NFSV4`, `SMB`.
        remove-labels: |-
            List of label keys to remove. If a label does not exist it is
            silently ignored. If `--update-labels` is also specified then
            `--update-labels` is applied first.
        restricted-actions: |-
            Actions to be restricted for a volume. Valid restricted action options are:
                      'DELETE'.
        security-style: |-
            The security style of the Volume. This can either be
                      UNIX or NTFS.
            +
            _SECURITY_STYLE_ must be one of:
            +
            *ntfs*::: NTFS security style for Volume.
            *unix*::: UNIX security style for Volume
            :::
            +
        share-name: Share name of the Mount path clients will use.
        smb-settings: |-
            List of settings specific to SMB protocol for a Cloud NetApp Files Volume. Valid component values are:
              `ENCRYPT_DATA`, `BROWSABLE`, `CHANGE_NOTIFY`, `NON_BROWSABLE`,
              `OPLOCKS`, `SHOW_SNAPSHOT`, `SHOW_PREVIOUS_VERSIONS`,
              `ACCESS_BASED_ENUMERATION`, `CONTINUOUSLY_AVAILABLE`.
        snap-reserve: |-
            (DEPRECATED) The percentage of volume storage reserved for snapshot storage.
                  The default value for this is 0 percent
            +
            The snap-reserve option is deprecated
        snapshot-daily: Make a snapshot every day e.g. at 06:00, 05:20, 23:50
        snapshot-directory: |-
            Snapshot Directory if enabled (true) makes the Volume
                        contain a read-only .snapshot directory which provides access
                        to each of the volume's snapshots
        snapshot-hourly: Make a snapshot every hour e.g. at 04:00, 05:20, 06:00
        snapshot-monthly: Make a snapshot once a month e.g. at 2nd 04:00, 7th 05:20, 24th 23:50
        snapshot-weekly: |-
            Make a snapshot every week e.g. at Monday 04:00, Wednesday 05:20,
            Sunday 23:50
        source-backup: |-
            ID of the backup or fully qualified identifier for the backup.
            +
            To set the `backup` attribute:
            * provide the argument `--source-backup` on the command line.
        source-snapshot: |-
            ID of the snapshot or fully qualified identifier for the snapshot.
            +
            To set the `snapshot` attribute:
            * provide the argument `--source-snapshot` on the command line.
        storage-pool: |-
            ID of the storage_pool or fully qualified identifier for the storage_pool.
            +
            To set the `storage_pool` attribute:
            * provide the argument `--storage-pool` on the command line.
        throughput-mibps: The desired throughput of the volume in MiB/s.
        tiering-policy: |-
            Tiering Policy contains auto tiering policy on a volume.
            +
                  Tiering Policy will have the following format
                  --tiering-policy=tier-action=TIER_ACTION,
                  cooling-threshold-days=COOLING_THRESHOLD_DAYS
            +
                  tier-action is an enum, supported values are ENABLED or PAUSED,
            cooling-threshold-days is an integer represents time in days to mark the
            volume's data block as cold and make it eligible for tiering,
            can be range from 7-183. Default is 31.
        unix-permissions: Unix permissions the mount point will be created with. Unix permissions are only applicable with NFS protocol only
        update-labels: |-
            List of label KEY=VALUE pairs to update. If a label exists, its value is modified. Otherwise, a new label is created.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
