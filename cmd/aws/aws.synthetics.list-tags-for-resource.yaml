name: list-tags-for-resource
description: Displays the tags associated with a canary or group.
flags:
    --resource-arn=!: The ARN of the canary or group that you want to view tags for.
documentation:
    command: Displays the tags associated with a canary or group.
    flag:
        resource-arn: |-
            The ARN of the canary or group that you want to view tags for.

            The ARN format of a canary is `arn:aws:synthetics:Region:account-id:canary:canary-name`.

            The ARN format of a group is `arn:aws:synthetics:Region:account-id:group:group-name`
