name: associate-route-table
description: Associates a subnet in your VPC or an internet gateway or virtual private gateway attached to your VPC with a route table in your VPC.
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --gateway-id=: The ID of the internet gateway or virtual private gateway.
    --no-dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --public-ipv4-pool=: The ID of a public IPv4 pool.
    --route-table-id=!: The ID of the route table.
    --subnet-id=: The ID of the subnet.
documentation:
    command: |-
        Associates a subnet in your VPC or an internet gateway or virtual private gateway attached to your VPC with a route table in your VPC. This association causes traffic from the subnet or gateway to be routed according to the routes in the route table. The action returns an association ID, which you need in order to disassociate the route table later. A route table can be associated with multiple subnets.

        For more information, see [Route tables](https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Route_Tables.html) in the *Amazon VPC User Guide*.
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        gateway-id: The ID of the internet gateway or virtual private gateway.
        public-ipv4-pool: The ID of a public IPv4 pool. A public IPv4 pool is a pool of IPv4 addresses that you've brought to Amazon Web Services with BYOIP.
        route-table-id: The ID of the route table.
        subnet-id: The ID of the subnet.
