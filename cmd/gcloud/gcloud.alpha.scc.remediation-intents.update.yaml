name: update
description: '*(ALPHA)*  Updates a remediation intent resource.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --location=: The Google Cloud location for the remediationIntent.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --organization=: The Google Cloud organization for the remediationIntent.
    --ri-from-file=!: Path to the YAML file containing the remediation intent resource.
    --update-mask=: Comma separated string containing list of fields to be updated.
documentation:
    command: |-
        *(ALPHA)*  Updates a Cloud Security Command Center (SCC)
        RemediationIntent resource.

        Fields specified in update-mask flag are updated. Updatable fields depends on the state transition.

        Valid state transitions are:

        a) ENQUEUED to IN_PROGRESS (mask: state,remediation_input)

        b) REMEDIATION_SUCCESS to PR_GENERATION_SUCCESS (mask: state,remediation_artifacts)

        c) REMEDIATION_SUCCESS to PR_GENERATION_FAILED (mask: state,error_details)

        An empty or * as field mask will result in updating the relevant fields as per the transition.

        Updated resource is returned as the response of the command.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete. The default is *False*.
        location: |-
            The Google Cloud location for the remediationIntent.
            +
            To set the `location` attribute:
            * provide the argument `remediationintent` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        organization: |-
            The Google Cloud organization for the remediationIntent.
            +
            To set the `organization` attribute:
            * provide the argument `remediationintent` on the command line with a fully specified name;
            * provide the argument `--organization` on the command line.
        ri-from-file: |-
            Path to the YAML file containing the remediation intent resource.
                         Format: /path/to/file.yaml.
        update-mask: |-
            Comma separated string containing list of fields to be updated.
                         Format: field1,field2.
