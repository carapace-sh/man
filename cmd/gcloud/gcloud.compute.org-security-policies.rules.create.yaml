name: create
description: Create a Compute Engine organizationsecurity policy rule.
flags:
    --action=!: Action to take if the request matches the match condition.
    --cloud-armor: Specified for Hierarchical Cloud Armor rules.
    --description=: An optional, textual description for the rule.
    --dest-ip-ranges=: Destination IP ranges to match for this rule.
    --direction=: Direction of the traffic the rule is applied.
    --enable-logging: Use this flag to enable logging of connections that allowed or denied by this rule.
    --expression=: The Cloud Armor rules language expression to match for this rule.
    --layer4-configs=: A list of destination protocols and ports to which the firewall rule will apply.
    --no-cloud-armor&: Specified for Hierarchical Cloud Armor rules.
    --no-enable-logging&: Use this flag to enable logging of connections that allowed or denied by this rule.
    --no-preview&: If specified, the action will not be enforced.
    --organization=: Organization which the organization security policy belongs to.
    --preview: If specified, the action will not be enforced.
    --security-policy=!: short name of the security policy into which the rule should be inserted.
    --src-ip-ranges=: The source IPs/IP ranges to match for this rule.
    --target-resources=: List of URLs of target resources to which the rule is applied.
    --target-service-accounts=: List of target service accounts for the rule.
completion:
    flag:
        action:
            - allow
            - deny
            - deny-403
            - deny-404
            - deny-502
            - goto-next
            - redirect
        direction:
            - INGRESS
            - EGRESS
documentation:
    command: '*gcloud compute org-security-policies rules create* is used to create organization security policy rules.'
    flag:
        action: |-
            Action to take if the request matches the match condition. _ACTION_ must be one of:
            +
            *allow*::: Allows the request from HTTP(S) Load Balancing.
            *deny*::: (DEPRECATED) Only used for Hierarchical Firewalls.
            *deny-403*::: Denies the request from HTTP(S) Load Balancing, with an HTTP response status code of 403.
            *deny-404*::: Denies the request from HTTP(S) Load Balancing, with an HTTP response status code of 404.
            *deny-502*::: Denies the request from HTTP(S) Load Balancing, with an HTTP response status code of 502.
            *goto-next*::: Defers enforcement to the next policy in the hierarchy.
            *redirect*::: Redirects the request from HTTP(S) Load Balancing, based on redirect options.
            :::
            +
        cloud-armor: Specified for Hierarchical Cloud Armor rules.
        description: An optional, textual description for the rule.
        dest-ip-ranges: Destination IP ranges to match for this rule. Can only be specified if DIRECTION is egress.
        direction: 'Direction of the traffic the rule is applied. The default is to apply on incoming traffic. _DIRECTION_ must be one of: *INGRESS*, *EGRESS*.'
        enable-logging: Use this flag to enable logging of connections that allowed or denied by this rule. Use *--enable-logging* to enable and *--no-enable-logging* to disable.
        expression: The Cloud Armor rules language expression to match for this rule.
        layer4-configs: A list of destination protocols and ports to which the firewall rule will apply.
        no-cloud-armor: Specified for Hierarchical Cloud Armor rules.
        no-enable-logging: Use this flag to enable logging of connections that allowed or denied by this rule.
        no-preview: If specified, the action will not be enforced.
        organization: Organization which the organization security policy belongs to. Must be set if SECURITY_POLICY is short name.
        preview: If specified, the action will not be enforced.
        security-policy: short name of the security policy into which the rule should be inserted.
        src-ip-ranges: The source IPs/IP ranges to match for this rule. To match all IPs specify *.
        target-resources: List of URLs of target resources to which the rule is applied.
        target-service-accounts: List of target service accounts for the rule.
