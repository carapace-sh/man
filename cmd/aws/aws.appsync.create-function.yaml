name: create-function
description: Creates a `Function` object.
flags:
    --api-id=!: The GraphQL API ID.
    --code=: The `function` code that contains the request and response functions.
    --data-source-name=!: The `Function` `DataSource` name.
    --description=: The `Function` description.
    --function-version=: The `version` of the request mapping template.
    --max-batch-size=: The maximum batching size for a resolver.
    --name=!: The `Function` name.
    --request-mapping-template=: The `Function` request mapping template.
    --response-mapping-template=: The `Function` response mapping template.
    --runtime=: ""
    --sync-config=: ""
documentation:
    command: |-
        Creates a `Function` object.

        A function is a reusable entity. You can use multiple functions to compose the resolver logic.
    flag:
        api-id: The GraphQL API ID.
        code: The `function` code that contains the request and response functions. When code is used, the `runtime` is required. The `runtime` value must be `APPSYNC_JS`.
        data-source-name: The `Function` `DataSource` name.
        description: The `Function` description.
        function-version: The `version` of the request mapping template. Currently, the supported value is 2018-05-29. Note that when using VTL and mapping templates, the `functionVersion` is required.
        max-batch-size: The maximum batching size for a resolver.
        name: The `Function` name. The function name does not have to be unique.
        request-mapping-template: The `Function` request mapping template. Functions support only the 2018-05-29 version of the request mapping template.
        response-mapping-template: The `Function` response mapping template.
        runtime: ""
        sync-config: ""
