name: delete-domain
description: The `DeleteDomain` operation deletes a domain.
flags:
    --domain-name=!: The name of the domain to delete.
documentation:
    command: The `DeleteDomain` operation deletes a domain. Any items (and their attributes) in the domain are deleted as well. The `DeleteDomain` operation might take 10 or more seconds to complete.
    flag:
        domain-name: The name of the domain to delete.
