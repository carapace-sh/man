name: update-component-configuration
description: Updates the monitoring configurations for the component.
flags:
    --auto-config-enabled: Automatically configures the component by applying the recommended configurations.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --component-configuration=: The configuration settings of the component.
    --component-name=!: The name of the component.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --monitor: Indicates whether the application component is monitored.
    --no-auto-config-enabled: Automatically configures the component by applying the recommended configurations.
    --no-monitor: Indicates whether the application component is monitored.
    --resource-group-name=!: The name of the resource group.
    --tier=: The tier of the application component.
completion:
    flag:
        tier:
            - CUSTOM
            - DEFAULT
            - DOT_NET_CORE
            - DOT_NET_WORKER
            - DOT_NET_WEB_TIER
            - DOT_NET_WEB
            - SQL_SERVER
            - SQL_SERVER_ALWAYSON_AVAILABILITY_GROUP
            - MYSQL
            - POSTGRESQL
            - JAVA_JMX
            - ORACLE
            - SAP_HANA_MULTI_NODE
            - SAP_HANA_SINGLE_NODE
            - SAP_HANA_HIGH_AVAILABILITY
            - SAP_ASE_SINGLE_NODE
            - SAP_ASE_HIGH_AVAILABILITY
            - SQL_SERVER_FAILOVER_CLUSTER_INSTANCE
            - SHAREPOINT
            - ACTIVE_DIRECTORY
            - SAP_NETWEAVER_STANDARD
            - SAP_NETWEAVER_DISTRIBUTED
            - SAP_NETWEAVER_HIGH_AVAILABILITY
documentation:
    command: Updates the monitoring configurations for the component. The configuration input parameter is an escaped JSON of the configuration and should match the schema of what is returned by `DescribeComponentConfigurationRecommendation`.
    flag:
        auto-config-enabled: Automatically configures the component by applying the recommended configurations.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        component-configuration: The configuration settings of the component. The value is the escaped JSON of the configuration. For more information about the JSON format, see [Working with JSON](https://docs.aws.amazon.com/sdk-for-javascript/v2/developer-guide/working-with-json.html). You can send a request to `DescribeComponentConfigurationRecommendation` to see the recommended configuration for a component. For the complete format of the component configuration file, see [Component Configuration](https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/component-config.html).
        component-name: The name of the component.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        monitor: Indicates whether the application component is monitored.
        resource-group-name: The name of the resource group.
        tier: The tier of the application component.
