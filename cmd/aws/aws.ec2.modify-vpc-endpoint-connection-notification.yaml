name: modify-vpc-endpoint-connection-notification
description: Modifies a connection notification for VPC endpoint or VPC endpoint service.
flags:
    --connection-events=: The events for the endpoint.
    --connection-notification-arn=: The ARN for the SNS topic for the notification.
    --connection-notification-id=!: The ID of the notification.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
documentation:
    command: Modifies a connection notification for VPC endpoint or VPC endpoint service. You can change the SNS topic for the notification, or the events for which to be notified.
    flag:
        connection-events: The events for the endpoint. Valid values are `Accept`, `Connect`, `Delete`, and `Reject`.
        connection-notification-arn: The ARN for the SNS topic for the notification.
        connection-notification-id: The ID of the notification.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
