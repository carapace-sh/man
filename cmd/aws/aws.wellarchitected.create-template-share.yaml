name: create-template-share
description: Create a review template share.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-request-token=!: ""
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --shared-with=!: ""
    --template-arn=!: The review template ARN.
documentation:
    command: |-
        Create a review template share.

        The owner of a review template can share it with other Amazon Web Services accounts, users, an organization, and organizational units (OUs) in the same Amazon Web Services Region.

        Shared access to a review template is not removed until the review template share invitation is deleted.

        If you share a review template with an organization or OU, all accounts in the organization or OU are granted access to the review template.

        **Disclaimer**

        By sharing your review template with other Amazon Web Services accounts, you acknowledge that Amazon Web Services will make your review template available to those other accounts.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
