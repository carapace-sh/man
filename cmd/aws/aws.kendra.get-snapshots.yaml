name: get-snapshots
description: Retrieves search metrics data.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --index-id=!: The identifier of the index to get search metrics data.
    --interval=!: The time interval or time window to get search metrics data.
    --max-results=: The maximum number of returned data for the metric.
    --metric-type=!: The metric you want to retrieve.
    --next-token=: If the previous response was incomplete (because there is more data to retrieve), Amazon Kendra returns a pagination token in the response.
completion:
    flag:
        interval:
            - THIS_MONTH
            - THIS_WEEK
            - ONE_WEEK_AGO
            - TWO_WEEKS_AGO
            - ONE_MONTH_AGO
            - TWO_MONTHS_AGO
        metric-type:
            - QUERIES_BY_COUNT
            - QUERIES_BY_ZERO_CLICK_RATE
            - QUERIES_BY_ZERO_RESULT_RATE
            - DOCS_BY_CLICK_COUNT
            - AGG_QUERY_DOC_METRICS
            - TREND_QUERY_DOC_METRICS
documentation:
    command: Retrieves search metrics data. The data provides a snapshot of how your users interact with your search application and how effective the application is.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        index-id: The identifier of the index to get search metrics data.
        interval: |-
            The time interval or time window to get search metrics data. The time interval uses the time zone of your index. You can view data in the following time windows:

            - `THIS_WEEK`: The current week, starting on the Sunday and ending on the day before the current date.
            - `ONE_WEEK_AGO`: The previous week, starting on the Sunday and ending on the following Saturday.
            - `TWO_WEEKS_AGO`: The week before the previous week, starting on the Sunday and ending on the following Saturday.
            - `THIS_MONTH`: The current month, starting on the first day of the month and ending on the day before the current date.
            - `ONE_MONTH_AGO`: The previous month, starting on the first day of the month and ending on the last day of the month.
            - `TWO_MONTHS_AGO`: The month before the previous month, starting on the first day of the month and ending on last day of the month.
        max-results: The maximum number of returned data for the metric.
        metric-type: |-
            The metric you want to retrieve. You can specify only one metric per call.

            For more information about the metrics you can view, see [Gaining insights with search analytics](https://docs.aws.amazon.com/kendra/latest/dg/search-analytics.html).
        next-token: If the previous response was incomplete (because there is more data to retrieve), Amazon Kendra returns a pagination token in the response. You can use this pagination token to retrieve the next set of search metrics data.
