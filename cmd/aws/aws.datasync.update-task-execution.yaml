name: update-task-execution
description: Updates the configuration of a running DataSync task execution.
flags:
    --options=!: ""
    --task-execution-arn=!: Specifies the Amazon Resource Name (ARN) of the task execution that you're updating.
documentation:
    command: |-
        Updates the configuration of a running DataSync task execution.

        Currently, the only `Option` that you can modify with `UpdateTaskExecution` is `BytesPerSecond`, which throttles bandwidth for a running or queued task execution.
    flag:
        options: ""
        task-execution-arn: Specifies the Amazon Resource Name (ARN) of the task execution that you're updating.
