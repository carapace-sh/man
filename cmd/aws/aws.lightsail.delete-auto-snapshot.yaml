name: delete-auto-snapshot
description: Deletes an automatic snapshot of an instance or disk.
flags:
    --date=!: The date of the automatic snapshot to delete in `YYYY-MM-DD` format.
    --resource-name=!: The name of the source instance or disk from which to delete the automatic snapshot.
documentation:
    command: Deletes an automatic snapshot of an instance or disk. For more information, see the [Amazon Lightsail Developer Guide](https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-configuring-automatic-snapshots).
    flag:
        date: The date of the automatic snapshot to delete in `YYYY-MM-DD` format. Use the `get auto snapshots` operation to get the available automatic snapshots for a resource.
        resource-name: The name of the source instance or disk from which to delete the automatic snapshot.
