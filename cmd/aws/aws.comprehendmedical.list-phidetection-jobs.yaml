name: list-phidetection-jobs
description: Gets a list of protected health information (PHI) detection jobs you have submitted.
flags:
    --filter=: Filters the jobs that are returned.
    --max-results=: The maximum number of results to return in each page.
    --next-token=: Identifies the next page of results to return.
documentation:
    command: Gets a list of protected health information (PHI) detection jobs you have submitted.
    flag:
        filter: Filters the jobs that are returned. You can filter jobs based on their names, status, or the date and time that they were submitted. You can only set one filter at a time.
        max-results: The maximum number of results to return in each page. The default is 100.
        next-token: Identifies the next page of results to return.
