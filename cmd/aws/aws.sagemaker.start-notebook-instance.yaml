name: start-notebook-instance
description: Launches an ML compute instance with the latest version of the libraries and attaches your ML storage volume.
flags:
    --notebook-instance-name=!: The name of the notebook instance to start.
documentation:
    command: Launches an ML compute instance with the latest version of the libraries and attaches your ML storage volume. After configuring the notebook instance, SageMaker AI sets the notebook instance status to `InService`. A notebook instance's status must be `InService` before you can connect to your Jupyter notebook.
    flag:
        notebook-instance-name: The name of the notebook instance to start.
