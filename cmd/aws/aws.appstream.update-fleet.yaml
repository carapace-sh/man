name: update-fleet
description: Updates the specified fleet.
flags:
    --attributes-to-delete=:
        description: The fleet attributes to delete.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --compute-capacity=: The desired capacity for the fleet.
    --delete-vpc-config: Deletes the VPC association for the specified fleet.
    --description=: The description to display.
    --disconnect-timeout-in-seconds=: The amount of time that a streaming session remains active after users disconnect.
    --display-name=: The fleet name to display.
    --domain-join-info=: The name of the directory and organizational unit (OU) to use to join the fleet to a Microsoft Active Directory domain.
    --enable-default-internet-access: Enables or disables default internet access for the fleet.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --iam-role-arn=: The Amazon Resource Name (ARN) of the IAM role to apply to the fleet.
    --idle-disconnect-timeout-in-seconds=: The amount of time that users can be idle (inactive) before they are disconnected from their streaming session and the `DisconnectTimeoutInSeconds` time interval begins.
    --image-arn=: The ARN of the public, private, or shared image to use.
    --image-name=: The name of the image used to create the fleet.
    --instance-type=: The instance type to use when launching fleet instances.
    --max-concurrent-sessions=: The maximum number of concurrent sessions for a fleet.
    --max-sessions-per-instance=: The maximum number of user sessions on an instance.
    --max-user-duration-in-seconds=: The maximum amount of time that a streaming session can remain active, in seconds.
    --name=: A unique name for the fleet.
    --no-delete-vpc-config: Deletes the VPC association for the specified fleet.
    --no-enable-default-internet-access: Enables or disables default internet access for the fleet.
    --platform=: The platform of the fleet.
    --root-volume-config=: The updated configuration for the root volume of fleet instances.
    --session-script-s3-location=: The S3 location of the session scripts configuration zip file.
    --stream-view=: The WorkSpaces Applications view that is displayed to your users when they stream from the fleet.
    --usb-device-filter-strings=:
        description: The USB device filter strings that specify which USB devices a user can redirect to the fleet streaming session, when using the Windows native client.
        nargs: -1
    --vpc-config=: The VPC configuration for the fleet.
completion:
    flag:
        platform:
            - WINDOWS
            - WINDOWS_SERVER_2016
            - WINDOWS_SERVER_2019
            - WINDOWS_SERVER_2022
            - AMAZON_LINUX2
            - RHEL8
            - ROCKY_LINUX8
        stream-view:
            - APP
            - DESKTOP
documentation:
    command: "Updates the specified fleet.\n\nIf the fleet is in the `STOPPED` state, you can update any attribute except the fleet name.\n\nIf the fleet is in the `RUNNING` state, you can update the following based on the fleet type:\n\n- Always-On and On-Demand fleet types\n  \n  You can update the `DisplayName`, `ComputeCapacity`, `ImageARN`, `ImageName`, `IdleDisconnectTimeoutInSeconds`, and `DisconnectTimeoutInSeconds` attributes.\n- Elastic fleet type\n  \n  You can update the `DisplayName`, `IdleDisconnectTimeoutInSeconds`, `DisconnectTimeoutInSeconds`, `MaxConcurrentSessions`, `SessionScriptS3Location` and `UsbDeviceFilterStrings` attributes.\n\nIf the fleet is in the `STARTING` or `STOPPED` state, you can't update it."
    flag:
        attributes-to-delete: The fleet attributes to delete.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        compute-capacity: The desired capacity for the fleet. This is not allowed for Elastic fleets.
        delete-vpc-config: Deletes the VPC association for the specified fleet.
        description: The description to display.
        disconnect-timeout-in-seconds: |-
            The amount of time that a streaming session remains active after users disconnect. If users try to reconnect to the streaming session after a disconnection or network interruption within this time interval, they are connected to their previous session. Otherwise, they are connected to a new session with a new streaming instance.

            Specify a value between 60 and 36000.
        display-name: The fleet name to display.
        domain-join-info: The name of the directory and organizational unit (OU) to use to join the fleet to a Microsoft Active Directory domain.
        enable-default-internet-access: Enables or disables default internet access for the fleet.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        iam-role-arn: |-
            The Amazon Resource Name (ARN) of the IAM role to apply to the fleet. To assume a role, a fleet instance calls the AWS Security Token Service (STS) `AssumeRole` API operation and passes the ARN of the role to use. The operation creates a new session with temporary credentials. WorkSpaces Applications retrieves the temporary credentials and creates the **appstream\_machine\_role** credential profile on the instance.

            For more information, see [Using an IAM Role to Grant Permissions to Applications and Scripts Running on WorkSpaces Applications Streaming Instances](https://docs.aws.amazon.com/appstream2/latest/developerguide/using-iam-roles-to-grant-permissions-to-applications-scripts-streaming-instances.html) in the *Amazon WorkSpaces Applications Administration Guide*.
        idle-disconnect-timeout-in-seconds: |-
            The amount of time that users can be idle (inactive) before they are disconnected from their streaming session and the `DisconnectTimeoutInSeconds` time interval begins. Users are notified before they are disconnected due to inactivity. If users try to reconnect to the streaming session before the time interval specified in `DisconnectTimeoutInSeconds` elapses, they are connected to their previous session. Users are considered idle when they stop providing keyboard or mouse input during their streaming session. File uploads and downloads, audio in, audio out, and pixels changing do not qualify as user activity. If users continue to be idle after the time interval in `IdleDisconnectTimeoutInSeconds` elapses, they are disconnected.

            To prevent users from being disconnected due to inactivity, specify a value of 0. Otherwise, specify a value between 60 and 36000. The default value is 0.

            If you enable this feature, we recommend that you specify a value that corresponds exactly to a whole number of minutes (for example, 60, 120, and 180). If you don't do this, the value is rounded to the nearest minute. For example, if you specify a value of 70, users are disconnected after 1 minute of inactivity. If you specify a value that is at the midpoint between two different minutes, the value is rounded up. For example, if you specify a value of 90, users are disconnected after 2 minutes of inactivity.
        image-arn: The ARN of the public, private, or shared image to use.
        image-name: The name of the image used to create the fleet.
        instance-type: |-
            The instance type to use when launching fleet instances. The following instance types are available:

            - stream.standard.small
            - stream.standard.medium
            - stream.standard.large
            - stream.standard.xlarge
            - stream.standard.2xlarge
            - stream.compute.large
            - stream.compute.xlarge
            - stream.compute.2xlarge
            - stream.compute.4xlarge
            - stream.compute.8xlarge
            - stream.memory.large
            - stream.memory.xlarge
            - stream.memory.2xlarge
            - stream.memory.4xlarge
            - stream.memory.8xlarge
            - stream.memory.z1d.large
            - stream.memory.z1d.xlarge
            - stream.memory.z1d.2xlarge
            - stream.memory.z1d.3xlarge
            - stream.memory.z1d.6xlarge
            - stream.memory.z1d.12xlarge
            - stream.graphics-design.large
            - stream.graphics-design.xlarge
            - stream.graphics-design.2xlarge
            - stream.graphics-design.4xlarge
            - stream.graphics.g4dn.xlarge
            - stream.graphics.g4dn.2xlarge
            - stream.graphics.g4dn.4xlarge
            - stream.graphics.g4dn.8xlarge
            - stream.graphics.g4dn.12xlarge
            - stream.graphics.g4dn.16xlarge
            - stream.graphics.g5.xlarge
            - stream.graphics.g5.2xlarge
            - stream.graphics.g5.4xlarge
            - stream.graphics.g5.8xlarge
            - stream.graphics.g5.16xlarge
            - stream.graphics.g5.12xlarge
            - stream.graphics.g5.24xlarge
            - stream.graphics.g6.xlarge
            - stream.graphics.g6.2xlarge
            - stream.graphics.g6.4xlarge
            - stream.graphics.g6.8xlarge
            - stream.graphics.g6.16xlarge
            - stream.graphics.g6.12xlarge
            - stream.graphics.g6.24xlarge
            - stream.graphics.gr6.4xlarge
            - stream.graphics.gr6.8xlarge
            - stream.graphics.g6f.large
            - stream.graphics.g6f.xlarge
            - stream.graphics.g6f.2xlarge
            - stream.graphics.g6f.4xlarge
            - stream.graphics.gr6f.4xlarge

            The following instance types are available for Elastic fleets:

            - stream.standard.small
            - stream.standard.medium
            - stream.standard.large
            - stream.standard.xlarge
            - stream.standard.2xlarge
        max-concurrent-sessions: The maximum number of concurrent sessions for a fleet.
        max-sessions-per-instance: The maximum number of user sessions on an instance. This only applies to multi-session fleets.
        max-user-duration-in-seconds: |-
            The maximum amount of time that a streaming session can remain active, in seconds. If users are still connected to a streaming instance five minutes before this limit is reached, they are prompted to save any open documents before being disconnected. After this time elapses, the instance is terminated and replaced by a new instance.

            Specify a value between 600 and 432000.
        name: A unique name for the fleet.
        platform: The platform of the fleet. WINDOWS\_SERVER\_2019 and AMAZON\_LINUX2 are supported for Elastic fleets.
        root-volume-config: The updated configuration for the root volume of fleet instances. Note that volume size cannot be decreased below the image volume size.
        session-script-s3-location: The S3 location of the session scripts configuration zip file. This only applies to Elastic fleets.
        stream-view: |-
            The WorkSpaces Applications view that is displayed to your users when they stream from the fleet. When `APP` is specified, only the windows of applications opened by users display. When `DESKTOP` is specified, the standard desktop that is provided by the operating system displays.

            The default value is `APP`.
        usb-device-filter-strings: The USB device filter strings that specify which USB devices a user can redirect to the fleet streaming session, when using the Windows native client. This is allowed but not required for Elastic fleets.
        vpc-config: The VPC configuration for the fleet. This is required for Elastic fleets, but not required for other fleet types. Elastic fleets require that you specify at least two subnets in different availability zones.
