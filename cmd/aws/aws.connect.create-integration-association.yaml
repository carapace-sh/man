name: create-integration-association
description: Creates an Amazon Web Services resource association with an Amazon Connect instance.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --integration-arn=!: The Amazon Resource Name (ARN) of the integration.
    --integration-type=!: The type of information to be ingested.
    --source-application-name=: The name of the external application.
    --source-application-url=: The URL for the external application.
    --source-type=: The type of the data source.
    --tags=: The tags used to organize, track, or control access for this resource.
completion:
    flag:
        integration-type:
            - EVENT
            - VOICE_ID
            - PINPOINT_APP
            - WISDOM_ASSISTANT
            - WISDOM_KNOWLEDGE_BASE
            - WISDOM_QUICK_RESPONSES
            - Q_MESSAGE_TEMPLATES
            - CASES_DOMAIN
            - APPLICATION
            - FILE_SCANNER
            - SES_IDENTITY
            - ANALYTICS_CONNECTOR
            - CALL_TRANSFER_CONNECTOR
            - COGNITO_USER_POOL
        source-type:
            - SALESFORCE
            - ZENDESK
            - CASES
documentation:
    command: Creates an Amazon Web Services resource association with an Amazon Connect instance.
    flag:
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        integration-arn: |-
            The Amazon Resource Name (ARN) of the integration.

            When integrating with Amazon Web Services End User Messaging, the Amazon Connect and Amazon Web Services End User Messaging instances must be in the same account.
        integration-type: The type of information to be ingested.
        source-application-name: The name of the external application. This field is only required for the EVENT integration type.
        source-application-url: The URL for the external application. This field is only required for the EVENT integration type.
        source-type: The type of the data source. This field is only required for the EVENT integration type.
        tags: 'The tags used to organize, track, or control access for this resource. For example, { "Tags": {"key1":"value1", "key2":"value2"} }.'
