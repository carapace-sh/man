name: create
description: Create a Security Health Analytics custom module.
flags:
    --custom-config-from-file=!: Path to a YAML file that contains the configuration for the Security Health Analytics custom module.
    --display-name=!: Sets the display name of the Security Health Analytics custom module.
    --enablement-state=!: Sets the enablement state of the Security Health Analytics custom module.
    --folder=: Folder where the Security Health Analytics custom module resides.
    --organization=: Organization where the Security Health Analytics custom module resides.
completion:
    flag:
        enablement-state:
            - disabled
            - enabled
            - enablement-state-unspecified
            - inherited
documentation:
    command: Create a Security Health Analytics custom module.
    flag:
        custom-config-from-file: Path to a YAML file that contains the configuration for the Security Health Analytics custom module. Use a full or relative path to a local file containing the value of custom_config.
        display-name: Sets the display name of the Security Health Analytics custom module. This display name becomes the finding category for all findings that are returned by this custom module. The display name must be between 1 and 128 characters, start with a lowercase letter, and contain alphanumeric characters or underscores only.
        enablement-state: 'Sets the enablement state of the Security Health Analytics custom module. From the following list of possible enablement states, specify either enabled or disabled only. _ENABLEMENT_STATE_ must be one of: *disabled*, *enabled*, *enablement-state-unspecified*, *inherited*.'
        folder: Folder where the Security Health Analytics custom module resides. Formatted as `folders/456` or just `456`.
        organization: Organization where the Security Health Analytics custom module resides. Formatted as `organizations/123` or just `123`.
