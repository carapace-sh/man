name: describe
description: '*(BETA)*  Describe a Compute Engine firewall rule.'
documentation:
    command: |-
        *(BETA)*  *gcloud beta compute firewall-rules describe* displays all data associated with a Compute Engine
        firewall rule in a project.

        ## EXAMPLES

        To describe a firewall rule, run:

          $ gcloud beta compute firewall-rules describe my-firewall-rule
