name: update-cost-category-definition
description: Updates an existing Cost Category.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --cost-category-arn=!: The unique identifier for your Cost Category.
    --default-value=: ""
    --effective-start=: The Cost Category's effective start date.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --rule-version=!: ""
    --rules=!:
        description: The `Expression` object used to categorize costs.
        nargs: -1
    --split-charge-rules=:
        description: The split charge rules used to allocate your charges between your Cost Category values.
        nargs: -1
completion:
    flag:
        rule-version:
            - CostCategoryExpression.v1
documentation:
    command: Updates an existing Cost Category. Changes made to the Cost Category rules will be used to categorize the current month’s expenses and future expenses. This won’t change categorization for the previous months.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cost-category-arn: The unique identifier for your Cost Category.
        default-value: ""
        effective-start: The Cost Category's effective start date. It can only be a billing start date (first day of the month). If the date isn't provided, it's the first day of the current month. Dates can't be before the previous twelve months, or in the future.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        rule-version: ""
        rules: The `Expression` object used to categorize costs. For more information, see [CostCategoryRule](https://docs.aws.amazon.com/aws-cost-management/latest/APIReference/API_CostCategoryRule.html) .
        split-charge-rules: The split charge rules used to allocate your charges between your Cost Category values.
