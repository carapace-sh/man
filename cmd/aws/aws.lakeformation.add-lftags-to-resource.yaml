name: add-lftags-to-resource
description: Attaches one or more LF-tags to an existing resource.
flags:
    --catalog-id=: The identifier for the Data Catalog.
    --lftags=!: The LF-tags to attach to the resource.
    --resource=!: The database, table, or column resource to which to attach an LF-tag.
documentation:
    command: Attaches one or more LF-tags to an existing resource.
    flag:
        catalog-id: The identifier for the Data Catalog. By default, the account ID. The Data Catalog is the persistent metadata store. It contains database definitions, table definitions, and other control information to manage your Lake Formation environment.
        lftags: The LF-tags to attach to the resource.
        resource: The database, table, or column resource to which to attach an LF-tag.
