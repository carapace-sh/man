name: terminate-session
description: Permanently ends a session and closes the data connection between the Session Manager client and SSM Agent on the managed node.
flags:
    --session-id=!: The ID of the session to terminate.
documentation:
    command: Permanently ends a session and closes the data connection between the Session Manager client and SSM Agent on the managed node. A terminated session can't be resumed.
    flag:
        session-id: The ID of the session to terminate.
