name: get-engagement-invitation
description: Retrieves the details of an engagement invitation shared by AWS with a partner.
flags:
    --catalog=!: Specifies the catalog associated with the request.
    --identifier=!: Specifies the unique identifier for the retrieved engagement invitation.
documentation:
    command: Retrieves the details of an engagement invitation shared by AWS with a partner. The information includes aspects such as customer, project details, and lifecycle information. To connect an engagement invitation with an opportunity, match the invitation’s `Payload.Project.Title` with opportunity `Project.Title`.
    flag:
        catalog: 'Specifies the catalog associated with the request. The field accepts values from the predefined set: `AWS` for live operations or `Sandbox` for testing environments.'
        identifier: Specifies the unique identifier for the retrieved engagement invitation.
