name: list-workflows
description: Query to list all workflows.
flags:
    --domain-name=!: The unique name of the domain.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
    --query-end-date=: Retrieve workflows ended after timestamp.
    --query-start-date=: Retrieve workflows started after timestamp.
    --status=: Status of workflow execution.
    --workflow-type=: The type of workflow.
completion:
    flag:
        status:
            - NOT_STARTED
            - IN_PROGRESS
            - COMPLETE
            - FAILED
            - SPLIT
            - RETRY
            - CANCELLED
        workflow-type:
            - APPFLOW_INTEGRATION
documentation:
    command: Query to list all workflows.
    flag:
        domain-name: The unique name of the domain.
        max-results: The maximum number of results to return per page.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
        query-end-date: Retrieve workflows ended after timestamp.
        query-start-date: Retrieve workflows started after timestamp.
        status: Status of workflow execution.
        workflow-type: The type of workflow. The only supported value is APPFLOW\_INTEGRATION.
