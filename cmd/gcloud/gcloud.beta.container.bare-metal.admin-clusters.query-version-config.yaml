name: query-version-config
description: '*(BETA)*  Query versions for creating or upgrading an Anthos on bare metal admin cluster.'
flags:
    --admin-cluster=!: ID of the admin_cluster or fully qualified identifier for the admin_cluster.
    --location=: ID of the location or fully qualified identifier for the location.
documentation:
    command: '*(BETA)*  Query versions for creating or upgrading an Anthos on bare metal admin cluster.'
    flag:
        admin-cluster: |-
            ID of the admin_cluster or fully qualified identifier for the admin_cluster.
            +
            To set the `admin_cluster` attribute:
            * provide the argument `--admin-cluster` on the command line.
        location: |-
            ID of the location or fully qualified identifier for the location.
            +
            To set the `location` attribute:
            * provide the argument `--location` on the command line;
            * set the property `container_bare_metal/location`.
