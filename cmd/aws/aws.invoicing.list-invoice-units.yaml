name: list-invoice-units
description: This fetches a list of all invoice unit definitions for a given account, as of the provided `AsOf` date.
flags:
    --as-of=: The state of an invoice unit at a specified time.
    --filters=: An optional input to the list API.
    --max-results=: The maximum number of invoice units that can be returned.
    --next-token=: The next token used to indicate where the returned list should start from.
documentation:
    command: This fetches a list of all invoice unit definitions for a given account, as of the provided `AsOf` date.
    flag:
        as-of: The state of an invoice unit at a specified time. You can see legacy invoice units that are currently deleted if the `AsOf` time is set to before it was deleted. If an `AsOf` is not provided, the default value is the current time.
        filters: An optional input to the list API. If multiple filters are specified, the returned list will be a configuration that match all of the provided filters. Supported filter types are `InvoiceReceivers`, `Names`, and `Accounts`.
        max-results: The maximum number of invoice units that can be returned.
        next-token: The next token used to indicate where the returned list should start from.
