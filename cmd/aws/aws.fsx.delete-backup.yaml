name: delete-backup
description: Deletes an Amazon FSx backup.
flags:
    --backup-id=!: The ID of the backup that you want to delete.
    --client-request-token=: A string of up to 63 ASCII characters that Amazon FSx uses to ensure idempotent deletion.
documentation:
    command: |-
        Deletes an Amazon FSx backup. After deletion, the backup no longer exists, and its data is gone.

        The `DeleteBackup` call returns instantly. The backup won't show up in later `DescribeBackups` calls.

        The data in a deleted backup is also deleted and can't be recovered by any means.
    flag:
        backup-id: The ID of the backup that you want to delete.
        client-request-token: A string of up to 63 ASCII characters that Amazon FSx uses to ensure idempotent deletion. This parameter is automatically filled on your behalf when using the CLI or SDK.
