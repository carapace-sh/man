name: send-outbound-email
description: Send outbound email for outbound campaigns.
flags:
    --additional-recipients=: The additional recipients address of the email in CC.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --destination-email-address=!: The email address to send the email to.
    --email-message=!: The email message body to be sent to the newly created email.
    --from-email-address=!: The email address to be used for sending email.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --source-campaign=: A Campaign object need for Campaign traffic type.
    --traffic-type=!: Denotes the class of traffic.
completion:
    flag:
        traffic-type:
            - GENERAL
            - CAMPAIGN
documentation:
    command: |-
        Send outbound email for outbound campaigns. For more information about outbound campaigns, see [Set up Amazon Connect outbound campaigns](https://docs.aws.amazon.com/connect/latest/adminguide/enable-outbound-campaigns.html).

        Only the Amazon Connect outbound campaigns service principal is allowed to assume a role in your account and call this API.
    flag:
        additional-recipients: The additional recipients address of the email in CC.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request. If not provided, the Amazon Web Services SDK populates this field. For more information about idempotency, see [Making retries safe with idempotent APIs](https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/).
        destination-email-address: The email address to send the email to.
        email-message: The email message body to be sent to the newly created email.
        from-email-address: The email address to be used for sending email.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        source-campaign: A Campaign object need for Campaign traffic type.
        traffic-type: |-
            Denotes the class of traffic.

            Only the CAMPAIGN traffic type is supported.
