name: cancel-statement
description: Cancels a running query.
flags:
    --id=!: The identifier of the SQL statement to cancel.
documentation:
    command: |-
        Cancels a running query. To be canceled, a query must be running.

        For more information about the Amazon Redshift Data API and CLI usage examples, see [Using the Amazon Redshift Data API](https://docs.aws.amazon.com/redshift/latest/mgmt/data-api.html) in the *Amazon Redshift Management Guide*.
    flag:
        id: The identifier of the SQL statement to cancel. This value is a universally unique identifier (UUID) generated by Amazon Redshift Data API. This identifier is returned by `BatchExecuteStatment`, `ExecuteStatment`, and `ListStatements`.
