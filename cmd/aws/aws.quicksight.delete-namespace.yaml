name: delete-namespace
description: Deletes a namespace and the users and groups that are associated with the namespace.
flags:
    --aws-account-id=!: The ID for the Amazon Web Services account that you want to delete the Quick Sight namespace from.
    --namespace=!: The namespace that you want to delete.
documentation:
    command: Deletes a namespace and the users and groups that are associated with the namespace. This is an asynchronous process. Assets including dashboards, analyses, datasets and data sources are not deleted. To delete these assets, you use the API operations for the relevant asset.
    flag:
        aws-account-id: The ID for the Amazon Web Services account that you want to delete the Quick Sight namespace from.
        namespace: The namespace that you want to delete.
