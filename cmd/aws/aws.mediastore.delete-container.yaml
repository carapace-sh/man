name: delete-container
description: Deletes the specified container.
flags:
    --container-name=!: The name of the container to delete.
documentation:
    command: Deletes the specified container. Before you make a `DeleteContainer` request, delete any objects in the container or in any folders in the container. You can delete only empty containers.
    flag:
        container-name: The name of the container to delete.
