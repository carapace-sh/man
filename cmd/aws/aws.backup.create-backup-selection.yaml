name: create-backup-selection
description: Creates a JSON document that specifies a set of resources to assign to a backup plan.
flags:
    --backup-plan-id=!: The ID of the backup plan.
    --backup-selection=!: The body of a request to assign a set of resources to a backup plan.
    --creator-request-id=: A unique string that identifies the request and allows failed requests to be retried without the risk of running the operation twice.
documentation:
    command: Creates a JSON document that specifies a set of resources to assign to a backup plan. For examples, see [Assigning resources programmatically](https://docs.aws.amazon.com/aws-backup/latest/devguide/assigning-resources.html#assigning-resources-json).
    flag:
        backup-plan-id: The ID of the backup plan.
        backup-selection: The body of a request to assign a set of resources to a backup plan.
        creator-request-id: |-
            A unique string that identifies the request and allows failed requests to be retried without the risk of running the operation twice. This parameter is optional.

            If used, this parameter must contain 1 to 50 alphanumeric or '-\_.' characters.
