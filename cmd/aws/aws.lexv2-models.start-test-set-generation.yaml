name: start-test-set-generation
description: The action to start the generation of test set.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The test set description for the test set generation request.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --generation-data-source=!: The data source for the test set generation.
    --role-arn=!: The roleARN used for any operation in the test set to access resources in the Amazon Web Services account.
    --storage-location=!: The Amazon S3 storage location for the test set generation.
    --test-set-name=!: The test set name for the test set generation request.
    --test-set-tags=: A list of tags to add to the test set.
documentation:
    command: The action to start the generation of test set.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The test set description for the test set generation request.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generation-data-source: The data source for the test set generation.
        role-arn: The roleARN used for any operation in the test set to access resources in the Amazon Web Services account.
        storage-location: The Amazon S3 storage location for the test set generation.
        test-set-name: The test set name for the test set generation request.
        test-set-tags: A list of tags to add to the test set. You can only add tags when you import/generate a new test set. You can't use the `UpdateTestSet` operation to update tags. To update tags, use the `TagResource` operation.
