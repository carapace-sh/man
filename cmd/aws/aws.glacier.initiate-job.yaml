name: initiate-job
description: This operation initiates a job of the specified type, which can be a select, an archival retrieval, or a vault retrieval.
flags:
    --account-id=!: The `AccountId` value is the AWS account ID of the account that owns the vault.
    --job-parameters=: Provides options for specifying job information.
    --vault-name=!: The name of the vault.
documentation:
    command: This operation initiates a job of the specified type, which can be a select, an archival retrieval, or a vault retrieval. For more information about using this operation, see the documentation for the underlying REST API [Initiate a Job](https://docs.aws.amazon.com/amazonglacier/latest/dev/api-initiate-job-post.html).
    flag:
        account-id: The `AccountId` value is the AWS account ID of the account that owns the vault. You can either specify an AWS account ID or optionally a single '`-`' (hyphen), in which case Amazon S3 Glacier uses the AWS account ID associated with the credentials used to sign the request. If you use an account ID, do not include any hyphens ('-') in the ID.
        job-parameters: Provides options for specifying job information.
        vault-name: The name of the vault.
