name: list-application-associations
description: Returns a paginated list of application associations for an application.
flags:
    --application-id=!: A unique identifier for the Application.
    --max-results=: The maximum number of results to return per page.
    --next-token=: The token for the next set of results.
documentation:
    command: Returns a paginated list of application associations for an application.
    flag:
        application-id: A unique identifier for the Application.
        max-results: The maximum number of results to return per page.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
