name: create-prefetch-schedule
description: Creates a prefetch schedule for a playback configuration.
flags:
    --consumption=: The configuration settings for how and when MediaTailor consumes prefetched ads from the ad decision server for single prefetch schedules.
    --name=!: The name to assign to the schedule request.
    --playback-configuration-name=!: The name to assign to the playback configuration.
    --recurring-prefetch-configuration=: The configuration that defines how and when MediaTailor performs ad prefetching in a live event.
    --retrieval=: The configuration settings for retrieval of prefetched ads from the ad decision server.
    --schedule-type=: The frequency that MediaTailor creates prefetch schedules.
    --stream-id=: An optional stream identifier that MediaTailor uses to prefetch ads for multiple streams that use the same playback configuration.
completion:
    flag:
        schedule-type:
            - SINGLE
            - RECURRING
documentation:
    command: Creates a prefetch schedule for a playback configuration. A prefetch schedule allows you to tell MediaTailor to fetch and prepare certain ads before an ad break happens. For more information about ad prefetching, see [Using ad prefetching](https://docs.aws.amazon.com/mediatailor/latest/ug/prefetching-ads.html) in the *MediaTailor User Guide*.
    flag:
        consumption: The configuration settings for how and when MediaTailor consumes prefetched ads from the ad decision server for single prefetch schedules. Each consumption configuration contains an end time and an optional start time that define the *consumption window*. Prefetch schedules automatically expire no earlier than seven days after the end time.
        name: The name to assign to the schedule request.
        playback-configuration-name: The name to assign to the playback configuration.
        recurring-prefetch-configuration: The configuration that defines how and when MediaTailor performs ad prefetching in a live event.
        retrieval: The configuration settings for retrieval of prefetched ads from the ad decision server. Only one set of prefetched ads will be retrieved and subsequently consumed for each ad break.
        schedule-type: |-
            The frequency that MediaTailor creates prefetch schedules. `SINGLE` indicates that this schedule applies to one ad break. `RECURRING` indicates that MediaTailor automatically creates a schedule for each ad avail in a live event.

            For more information about the prefetch types and when you might use each, see [Prefetching ads in Elemental MediaTailor.](https://docs.aws.amazon.com/mediatailor/latest/ug/prefetching-ads.html)
        stream-id: An optional stream identifier that MediaTailor uses to prefetch ads for multiple streams that use the same playback configuration. If `StreamId` is specified, MediaTailor returns all of the prefetch schedules with an exact match on `StreamId`. If not specified, MediaTailor returns all of the prefetch schedules for the playback configuration, regardless of `StreamId`.
