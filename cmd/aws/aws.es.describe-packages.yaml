name: describe-packages
description: Describes all packages available to Amazon ES.
flags:
    --filters=: Only returns packages that match the `DescribePackagesFilterList` values.
    --max-results=: Limits results to a maximum number of packages.
    --next-token=: Used for pagination.
documentation:
    command: Describes all packages available to Amazon ES. Includes options for filtering, limiting the number of results, and pagination.
    flag:
        filters: Only returns packages that match the `DescribePackagesFilterList` values.
        max-results: Limits results to a maximum number of packages.
        next-token: Used for pagination. Only necessary if a previous API call includes a non-null NextToken value. If provided, returns results for the next page.
