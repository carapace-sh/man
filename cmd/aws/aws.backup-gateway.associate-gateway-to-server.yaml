name: associate-gateway-to-server
description: Associates a backup gateway with your server.
flags:
    --gateway-arn=!: The Amazon Resource Name (ARN) of the gateway.
    --server-arn=!: The Amazon Resource Name (ARN) of the server that hosts your virtual machines.
documentation:
    command: Associates a backup gateway with your server. After you complete the association process, you can back up and restore your VMs through the gateway.
    flag:
        gateway-arn: The Amazon Resource Name (ARN) of the gateway. Use the `ListGateways` operation to return a list of gateways for your account and Amazon Web Services Region.
        server-arn: The Amazon Resource Name (ARN) of the server that hosts your virtual machines.
