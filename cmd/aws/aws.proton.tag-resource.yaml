name: tag-resource
description: Tag a resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the Proton resource to apply customer tags to.
    --tags=!: A list of customer tags to apply to the Proton resource.
documentation:
    command: |-
        Tag a resource. A tag is a key-value pair of metadata that you associate with an Proton resource.

        For more information, see [Proton resources and tagging](https://docs.aws.amazon.com/proton/latest/userguide/resources.html) in the *Proton User Guide*.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the Proton resource to apply customer tags to.
        tags: A list of customer tags to apply to the Proton resource.
