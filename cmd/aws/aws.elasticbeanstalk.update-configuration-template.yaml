name: update-configuration-template
description: Updates the specified configuration template to have the specified properties or configuration option values.
flags:
    --application-name=!: The name of the application associated with the configuration template to update.
    --description=: A new description for the configuration.
    --option-settings=: A list of configuration option settings to update with the new specified option value.
    --options-to-remove=: A list of configuration options to remove from the configuration set.
    --template-name=!: The name of the configuration template to update.
documentation:
    command: |-
        Updates the specified configuration template to have the specified properties or configuration option values.

        If a property (for example, `ApplicationName`) is not provided, its value remains unchanged. To clear such properties, specify an empty string.

        Related Topics

        - [DescribeConfigurationOptions]()
    flag:
        application-name: |-
            The name of the application associated with the configuration template to update.

            If no application is found with this name, `UpdateConfigurationTemplate` returns an `InvalidParameterValue` error.
        description: A new description for the configuration.
        option-settings: A list of configuration option settings to update with the new specified option value.
        options-to-remove: |-
            A list of configuration options to remove from the configuration set.

            Constraint: You can remove only `UserDefined` configuration options.
        template-name: |-
            The name of the configuration template to update.

            If no configuration template is found with this name, `UpdateConfigurationTemplate` returns an `InvalidParameterValue` error.
