name: get-triggers
description: Gets all the triggers associated with a job.
flags:
    --dependent-job-name=: The name of the job to retrieve triggers for.
    --max-results=: The maximum size of the response.
    --next-token=: A continuation token, if this is a continuation call.
documentation:
    command: Gets all the triggers associated with a job.
    flag:
        dependent-job-name: The name of the job to retrieve triggers for. The trigger that can start this job is returned, and if there is no such trigger, all triggers are returned.
        max-results: The maximum size of the response.
        next-token: A continuation token, if this is a continuation call.
