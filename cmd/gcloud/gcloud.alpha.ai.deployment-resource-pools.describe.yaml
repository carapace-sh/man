name: describe
description: '*(ALPHA)*  Describe a Vertex AI deployment resource pool.'
hidden: true
flags:
    --region=: Cloud region for the deployment_resource_pool.
documentation:
    command: |-
        *(ALPHA)*  This command describes a deployment resource pool with a provided deployment
        resource pool.

        ## EXAMPLES

        To describe a deployment resource pool with name ''example'' in region
        ''us-central1'', run:

          $ gcloud alpha ai deployment-resource-pools describe example --region=us-central1
    flag:
        region: |-
            Cloud region for the deployment_resource_pool.
            +
            To set the `region` attribute:
            * provide the argument `deployment_resource_pool` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `ai/region`;
            * choose one from the prompted list of available regions.
