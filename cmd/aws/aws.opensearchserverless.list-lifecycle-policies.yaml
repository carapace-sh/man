name: list-lifecycle-policies
description: Returns a list of OpenSearch Serverless lifecycle policies.
flags:
    --max-results=: An optional parameter that specifies the maximum number of results to return.
    --next-token=: If your initial `ListLifecyclePolicies` operation returns a `nextToken`, you can include the returned `nextToken` in subsequent `ListLifecyclePolicies` operations, which returns results in the next page.
    --resources=: Resource filters that policies can apply to.
    --type=!: The type of lifecycle policy.
completion:
    flag:
        type:
            - retention
documentation:
    command: Returns a list of OpenSearch Serverless lifecycle policies. For more information, see [Viewing data lifecycle policies](https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-lifecycle.html#serverless-lifecycle-list).
    flag:
        max-results: An optional parameter that specifies the maximum number of results to return. You can use use `nextToken` to get the next page of results. The default is 10.
        next-token: If your initial `ListLifecyclePolicies` operation returns a `nextToken`, you can include the returned `nextToken` in subsequent `ListLifecyclePolicies` operations, which returns results in the next page.
        resources: Resource filters that policies can apply to. Currently, the only supported resource type is `index`.
        type: The type of lifecycle policy.
