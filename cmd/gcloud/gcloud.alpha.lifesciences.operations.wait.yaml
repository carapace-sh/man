name: wait
description: '*(ALPHA)*  Wait for Cloud Life Sciences operation to complete.'
flags:
    --location=: Google Cloud location.
documentation:
    command: |-
        ## EXAMPLES
        To wait for the completion of the operation called `my-operation`, run:

          $ gcloud alpha lifesciences operations wait my-operation
    flag:
        location: |-
            Google Cloud location.
            +
            To set the `location` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `lifesciences/location`.
