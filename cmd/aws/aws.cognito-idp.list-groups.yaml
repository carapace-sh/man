name: list-groups
description: Given a user pool ID, returns user pool groups and their details.
flags:
    --limit=: The maximum number of groups that you want Amazon Cognito to return in the response.
    --next-token=: This API operation returns a limited number of results.
    --user-pool-id=!: The ID of the user pool where you want to list user groups.
documentation:
    command: |-
        Given a user pool ID, returns user pool groups and their details.

        Amazon Cognito evaluates Identity and Access Management (IAM) policies in requests for this API operation. For this operation, you must use IAM credentials to authorize requests, and you must grant yourself the corresponding IAM permission in a policy.

        **Learn more**

        - [Signing Amazon Web Services API Requests](https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_aws-signing.html)
        - [Using the Amazon Cognito user pools API and user pool endpoints](https://docs.aws.amazon.com/cognito/latest/developerguide/user-pools-API-operations.html)
    flag:
        limit: The maximum number of groups that you want Amazon Cognito to return in the response.
        next-token: This API operation returns a limited number of results. The pagination token is an identifier that you can present in an additional API request with the same parameters. When you include the pagination token, Amazon Cognito returns the next set of items after the current list. Subsequent requests return a new pagination token. By use of this token, you can paginate through the full list of items.
        user-pool-id: The ID of the user pool where you want to list user groups.
