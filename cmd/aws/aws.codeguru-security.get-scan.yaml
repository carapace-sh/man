name: get-scan
description: Returns details about a scan, including whether or not a scan has completed.
flags:
    --run-id=: UUID that identifies the individual scan run you want to view details about.
    --scan-name=!: The name of the scan you want to view details about.
documentation:
    command: Returns details about a scan, including whether or not a scan has completed.
    flag:
        run-id: UUID that identifies the individual scan run you want to view details about. You retrieve this when you call the `CreateScan` operation. Defaults to the latest scan run if missing.
        scan-name: The name of the scan you want to view details about.
