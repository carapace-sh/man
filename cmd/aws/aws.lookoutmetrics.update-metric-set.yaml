name: update-metric-set
description: Updates a dataset.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --dimension-filter-list=: Describes a list of filters for choosing specific dimensions and specific values.
    --dimension-list=: The dimension list.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --metric-list=: The metric list.
    --metric-set-arn=!: The ARN of the dataset to update.
    --metric-set-description=: The dataset's description.
    --metric-set-frequency=: The dataset's interval.
    --metric-source=: ""
    --offset=: After an interval ends, the amount of seconds that the detector waits before importing data.
    --timestamp-column=: The timestamp column.
completion:
    flag:
        metric-set-frequency:
            - P1D
            - PT1H
            - PT10M
            - PT5M
documentation:
    command: Updates a dataset.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        dimension-filter-list: Describes a list of filters for choosing specific dimensions and specific values. Each filter consists of the dimension and one of its values that you want to include. When multiple dimensions or values are specified, the dimensions are joined with an AND operation and the values are joined with an OR operation.
        dimension-list: The dimension list.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        metric-list: The metric list.
        metric-set-arn: The ARN of the dataset to update.
        metric-set-description: The dataset's description.
        metric-set-frequency: The dataset's interval.
        metric-source: ""
        offset: After an interval ends, the amount of seconds that the detector waits before importing data. Offset is only supported for S3, Redshift, Athena and datasources.
        timestamp-column: The timestamp column.
