    --resource-manager-tags=: Applies the specified comma-separated resource manager tags that has the
    --resource-usage-bigquery-dataset=: The name of the BigQuery dataset to which the cluster's usage of cloud
    --scopes=: Specifies scopes for the node instances.
    --secret-manager-rotation-interval=: Set the rotation period for secrets in the Secret Manager CSI driver
    --secret-sync-rotation-interval=: Set the rotation period for secrets in the Secret Sync component.
    --security-group=: The name of the RBAC security group for use with Google security groups
    --security-posture=: Sets the mode of the Kubernetes security posture API's off-cluster features.
    --service-account-signing-keys=: A Cloud KMS asymmetric signing cryptoKeyVersion that will be used to sign service account tokens
    --service-account-verification-keys=: A Cloud KMS asymmetric signing cryptoKeyVersion that will be used to verify service account tokens.
    --service-account=: The Google Cloud Platform Service Account to be used by the node VMs.
    --services-ipv4-cidr=: Set the IP range for the services IPs.
    --services-secondary-range-name=: Set the secondary range to be used for services (e.g. ClusterIPs).
    --shielded-integrity-monitoring: Enables monitoring and attestation of the boot integrity of the
    --shielded-secure-boot: The instance will boot with secure boot enabled.
    --spot: Create nodes using spot VM instances in the new cluster.
    --stack-type=: IP stack type of the cluster nodes.
    --storage-pools=: A list of storage pools where the cluster's boot disks will be provisioned.
    --subnetwork=: The Google Compute Engine subnetwork
    --system-config-from-file=: Path of the YAML/JSON file that contains the node configuration, including
    --tag-bindings=&: List of tag-bindings KEY=VALUE pairs to bind.
    --tags=: Applies the given Compute Engine tags (comma separated) on all nodes in the new
    --threads-per-core=: The number of visible threads per physical core for each node.
    --tier=: (DEPRECATED) Set the desired tier for the cluster.
    --timeout=&: Timeout (seconds) for waiting on the operation to complete.
    --total-max-nodes=: Maximum number of all nodes in the node pool.
    --total-min-nodes=: Minimum number of all nodes in the node pool.
