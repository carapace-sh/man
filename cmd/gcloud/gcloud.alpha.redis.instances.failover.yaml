name: failover
description: '*(ALPHA)*  Failover a standard tier Cloud Memorystore for Redis instance from the master node to its replica.'
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --data-protection-mode=: Data protection mode to use for the failover.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: The name of the Redis region of the instance.
completion:
    flag:
        data-protection-mode:
            - force-data-loss
            - limited-data-loss
documentation:
    command: |
        *(ALPHA)*  Failover a standard tier Cloud Memorystore for Redis instance from the master node to its
        replica.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        data-protection-mode: |-
            Data protection mode to use for the failover. If not specified, defaults to
            'limited-data-loss'. _DATA_PROTECTION_MODE_ must be one of:
            +
            *force-data-loss*::: Failover without data loss protection. Can cause significant data loss.
            *limited-data-loss*::: Failover with data loss protection that ensures loss is within system thresholds.
            :::
            +
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            The name of the Redis region of the instance. Overrides the default
            redis/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `instance` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `redis/region`.
