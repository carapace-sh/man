name: untag-resource
description: Removes a tag from a rescore execution plan.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the rescore execution plan to remove the tag.
    --tag-keys=!: A list of tag keys to remove from the rescore execution plan.
documentation:
    command: Removes a tag from a rescore execution plan. A rescore execution plan is an Amazon Kendra Intelligent Ranking resource used for provisioning the `Rescore` operation.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the rescore execution plan to remove the tag.
        tag-keys: A list of tag keys to remove from the rescore execution plan. If a tag key does not exist on the resource, it is ignored.
