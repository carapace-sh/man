name: update-app-instance-user-endpoint
description: Updates the details of an `AppInstanceUserEndpoint`.
flags:
    --allow-messages=: Boolean that controls whether the `AppInstanceUserEndpoint` is opted in to receive messages.
    --app-instance-user-arn=!: The ARN of the `AppInstanceUser`.
    --endpoint-id=!: The unique identifier of the `AppInstanceUserEndpoint`.
    --name=: The name of the `AppInstanceUserEndpoint`.
completion:
    flag:
        allow-messages:
            - ALL
            - NONE
documentation:
    command: Updates the details of an `AppInstanceUserEndpoint`. You can update the name and `AllowMessage` values.
    flag:
        allow-messages: Boolean that controls whether the `AppInstanceUserEndpoint` is opted in to receive messages. `ALL` indicates the endpoint will receive all messages. `NONE` indicates the endpoint will receive no messages.
        app-instance-user-arn: The ARN of the `AppInstanceUser`.
        endpoint-id: The unique identifier of the `AppInstanceUserEndpoint`.
        name: The name of the `AppInstanceUserEndpoint`.
