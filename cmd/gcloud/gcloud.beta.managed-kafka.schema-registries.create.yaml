name: create
description: '*(BETA)*  Create a Managed Service for Apache Kafka schema registry.'
flags:
    --location=: ID of the location of the Managed Service for Apache Kafka resource.
documentation:
    command: |
        *(BETA)*  Create a Managed Service for Apache Kafka schema registry.
    flag:
        location: |-
            ID of the location of the Managed Service for Apache Kafka resource. See
            https://cloud.google.com/managed-service-for-apache-kafka/docs/locations for a list of supported
            locations.
            +

            To set the `location` attribute:
            * provide the argument `schema_registry` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
