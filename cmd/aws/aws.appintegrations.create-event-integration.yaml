name: create-event-integration
description: Creates an EventIntegration, given a specified name, description, and a reference to an Amazon EventBridge bus in your account and a partner event source that pushes events to that bus.
flags:
    --client-token=: A unique, case-sensitive identifier that you provide to ensure the idempotency of the request.
    --description=: The description of the event integration.
    --event-bridge-bus=!: The EventBridge bus.
    --event-filter=!: The event filter.
    --name=!: The name of the event integration.
