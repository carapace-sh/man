name: delete-job-tagging
description: Removes the entire tag set from the specified S3 Batch Operations job.
flags:
    --account-id=!: The Amazon Web Services account ID associated with the S3 Batch Operations job.
    --job-id=!: The ID for the S3 Batch Operations job whose tags you want to delete.
documentation:
    command: |-
        Removes the entire tag set from the specified S3 Batch Operations job.

        Permissions

        To use the `DeleteJobTagging` operation, you must have permission to perform the `s3:DeleteJobTagging` action. For more information, see [Controlling access and labeling jobs using tags](https://docs.aws.amazon.com/AmazonS3/latest/dev/batch-ops-managing-jobs.html#batch-ops-job-tags) in the *Amazon S3 User Guide*.

        Related actions include:

        - [CreateJob](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_CreateJob.html)
        - [GetJobTagging](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_GetJobTagging.html)
        - [PutJobTagging](https://docs.aws.amazon.com/AmazonS3/latest/API/API_control_PutJobTagging.html)

        You must URL encode any signed header values that contain spaces. For example, if your header value is `my file.txt`, containing two spaces after `my`, you must URL encode this value to `my%20%20file.txt`.
    flag:
        account-id: The Amazon Web Services account ID associated with the S3 Batch Operations job.
        job-id: The ID for the S3 Batch Operations job whose tags you want to delete.
