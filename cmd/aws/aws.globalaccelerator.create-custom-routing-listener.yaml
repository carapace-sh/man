name: create-custom-routing-listener
description: Create a listener to process inbound connections from clients to a custom routing accelerator.
flags:
    --accelerator-arn=!: The Amazon Resource Name (ARN) of the accelerator for a custom routing listener.
    --idempotency-token=!: A unique, case-sensitive identifier that you provide to ensure the idempotency—that is, the uniqueness—of the request.
    --port-ranges=!: The port range to support for connections from clients to your accelerator.
documentation:
    command: Create a listener to process inbound connections from clients to a custom routing accelerator. Connections arrive to assigned static IP addresses on the port range that you specify.
    flag:
        accelerator-arn: The Amazon Resource Name (ARN) of the accelerator for a custom routing listener.
        idempotency-token: A unique, case-sensitive identifier that you provide to ensure the idempotency—that is, the uniqueness—of the request.
        port-ranges: |-
            The port range to support for connections from clients to your accelerator.

            Separately, you set port ranges for endpoints. For more information, see [About endpoints for custom routing accelerators](https://docs.aws.amazon.com/global-accelerator/latest/dg/about-custom-routing-endpoints.html).
