name: batch-update-vehicle
description: Updates a group, or batch, of vehicles.
flags:
    --vehicles=!: A list of information about the vehicles to update.
documentation:
    command: |-
        Updates a group, or batch, of vehicles.

        You must specify a decoder manifest and a vehicle model (model manifest) for each vehicle.

        For more information, see [Update multiple vehicles (AWS CLI)](https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/update-vehicles-cli.html) in the *Amazon Web Services IoT FleetWise Developer Guide*.
    flag:
        vehicles: A list of information about the vehicles to update. For more information, see the API data type.
