name: update-generated-template
description: Updates a generated template.
flags:
    --add-resources=:
        description: An optional list of resources to be added to the generated template.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --generated-template-name=!: The name or Amazon Resource Name (ARN) of a generated template.
    --new-generated-template-name=: An optional new name to assign to the generated template.
    --no-refresh-all-resources: If `true`, update the resource properties in the generated template with their current live state.
    --refresh-all-resources: If `true`, update the resource properties in the generated template with their current live state.
    --remove-resources=:
        description: A list of logical ids for resources to remove from the generated template.
        nargs: -1
    --template-configuration=: The configuration details of the generated template, including the `DeletionPolicy` and `UpdateReplacePolicy`.
documentation:
    command: Updates a generated template. This can be used to change the name, add and remove resources, refresh resources, and change the `DeletionPolicy` and `UpdateReplacePolicy` settings. You can check the status of the update to the generated template using the `DescribeGeneratedTemplate` API action.
    flag:
        add-resources: An optional list of resources to be added to the generated template.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generated-template-name: The name or Amazon Resource Name (ARN) of a generated template.
        new-generated-template-name: An optional new name to assign to the generated template.
        refresh-all-resources: If `true`, update the resource properties in the generated template with their current live state. This feature is useful when the resource properties in your generated a template does not reflect the live state of the resource properties. This happens when a user update the resource properties after generating a template.
        remove-resources: A list of logical ids for resources to remove from the generated template.
        template-configuration: The configuration details of the generated template, including the `DeletionPolicy` and `UpdateReplacePolicy`.
