name: list-sessions
description: Lists the sessions in a workgroup that are in an active state like `CREATING`, `CREATED`, `IDLE`, or `BUSY`.
flags:
    --max-results=: The maximum number of sessions to return.
    --next-token=: A token generated by the Athena service that specifies where to continue pagination if a previous request was truncated.
    --state-filter=: A filter for a specific session state.
    --work-group=!: The workgroup to which the session belongs.
completion:
    flag:
        state-filter:
            - CREATING
            - CREATED
            - IDLE
            - BUSY
            - TERMINATING
            - TERMINATED
            - DEGRADED
            - FAILED
documentation:
    command: Lists the sessions in a workgroup that are in an active state like `CREATING`, `CREATED`, `IDLE`, or `BUSY`. Newer sessions are listed first; older sessions are listed later.
    flag:
        max-results: The maximum number of sessions to return.
        next-token: A token generated by the Athena service that specifies where to continue pagination if a previous request was truncated. To obtain the next set of pages, pass in the `NextToken` from the response object of the previous page call.
        state-filter: |-
            A filter for a specific session state. A description of each state follows.

            `CREATING` - The session is being started, including acquiring resources.

            `CREATED` - The session has been started.

            `IDLE` - The session is able to accept a calculation.

            `BUSY` - The session is processing another task and is unable to accept a calculation.

            `TERMINATING` - The session is in the process of shutting down.

            `TERMINATED` - The session and its resources are no longer running.

            `DEGRADED` - The session has no healthy coordinators.

            `FAILED` - Due to a failure, the session and its resources are no longer running.
        work-group: The workgroup to which the session belongs.
