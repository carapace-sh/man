name: list-keys
description: Lists API key resources in your Amazon Web Services account.
flags:
    --filter=: Optionally filter the list to only `Active` or `Expired` API keys.
    --max-results=: An optional limit for the number of resources returned in a single call.
    --next-token=: The pagination token specifying which page of results to return in the response.
documentation:
    command: |-
        Lists API key resources in your Amazon Web Services account.

        For more information, see [Use API keys to authenticate](https://docs.aws.amazon.com/location/latest/developerguide/using-apikeys.html) in the *Amazon Location Service Developer Guide*.
    flag:
        filter: Optionally filter the list to only `Active` or `Expired` API keys.
        max-results: |-
            An optional limit for the number of resources returned in a single call.

            Default value: `100`
        next-token: |-
            The pagination token specifying which page of results to return in the response. If no token is provided, the default page is the first page.

            Default value: `null`
