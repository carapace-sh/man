name: create
description: Create a workstation.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --cluster=: The name of the cluster containing the workstation.
    --config=: The name of the config containing the workstation.
    --env=: Environment variables passed to the Workstation.
    --labels=: Labels that are applied to the workstation and propagated to the underlying Compute Engine
    --no-async&: Return immediately, without waiting for the operation in progress to
    --region=: The name of the region of the workstation.
    --source-workstation=: Source workstation from which this workstations persistent directories are cloned on
documentation:
    command: |
        Create a workstation.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        cluster: |-
            The name of the cluster containing the workstation.
            +

            To set the `cluster` attribute:
            * provide the argument `workstation` on the command line with a fully specified name;
            * provide the argument `--cluster` on the command line;
            * set the property `workstations/cluster`.
        config: |-
            The name of the config containing the workstation.
            +

            To set the `config` attribute:
            * provide the argument `workstation` on the command line with a fully specified name;
            * provide the argument `--config` on the command line;
            * set the property `workstations/config`.
        env: Environment variables passed to the Workstation.
        labels: |-
            Labels that are applied to the workstation and propagated to the underlying Compute Engine
            resources.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        region: |-
            The name of the region of the workstation.
            +

            To set the `region` attribute:
            * provide the argument `workstation` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `workstations/region`.
        source-workstation: |-
            Source workstation from which this workstations persistent directories are cloned on
            creation. When specified, the workstations service agent must have
            `compute.disks.createSnapshot` and `compute.snapshots.useReadOnly` permissions on the source
            workstation's host project.
