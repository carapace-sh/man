name: delete
description: Delete a framework deployment.
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --etag=: An opaque identifier for the current version of the resource.
    --location=: The location id of the frameworkDeployment resource.
    --no-async&: Return immediately, without waiting for the operation in progress to
