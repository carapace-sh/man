name: reboot-dbinstance
description: You might need to reboot your instance, usually for maintenance reasons.
flags:
    --dbinstance-identifier=!: The instance identifier.
    --force-failover=: When `true`, the reboot is conducted through a Multi-AZ failover.
documentation:
    command: |-
        You might need to reboot your instance, usually for maintenance reasons. For example, if you make certain changes, or if you change the cluster parameter group that is associated with the instance, you must reboot the instance for the changes to take effect.

        Rebooting an instance restarts the database engine service. Rebooting an instance results in a momentary outage, during which the instance status is set to *rebooting*.
    flag:
        dbinstance-identifier: |-
            The instance identifier. This parameter is stored as a lowercase string.

            Constraints:

            - Must match the identifier of an existing `DBInstance`.
        force-failover: |-
            When `true`, the reboot is conducted through a Multi-AZ failover.

            Constraint: You can't specify `true` if the instance is not configured for Multi-AZ.
