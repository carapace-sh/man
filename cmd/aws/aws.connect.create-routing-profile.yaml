name: create-routing-profile
description: Creates a new routing profile.
flags:
    --agent-availability-timer=: Whether agents with this routing profile will have their routing order calculated based on *longest idle time* or *time since their last inbound contact*.
    --default-outbound-queue-id=!: The default outbound queue for the routing profile.
    --description=!: Description of the routing profile.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --manual-assignment-queue-configs=: The manual assignment queues associated with the routing profile.
    --media-concurrencies=!: The channels that agents can handle in the Contact Control Panel (CCP) for this routing profile.
    --name=!: The name of the routing profile.
    --queue-configs=: The inbound queues associated with the routing profile.
    --tags=: The tags used to organize, track, or control access for this resource.
completion:
    flag:
        agent-availability-timer:
            - TIME_SINCE_LAST_ACTIVITY
            - TIME_SINCE_LAST_INBOUND
documentation:
    command: Creates a new routing profile.
    flag:
        agent-availability-timer: Whether agents with this routing profile will have their routing order calculated based on *longest idle time* or *time since their last inbound contact*.
        default-outbound-queue-id: The default outbound queue for the routing profile.
        description: Description of the routing profile. Must not be more than 250 characters.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        manual-assignment-queue-configs: The manual assignment queues associated with the routing profile. If no queue is added, agents and supervisors can't pick or assign any contacts from this routing profile. The limit of 10 array members applies to the maximum number of RoutingProfileManualAssignmentQueueConfig objects that can be passed during a CreateRoutingProfile API request. It is different from the quota of 50 queues per routing profile per instance that is listed in Amazon Connect service quotas.
        media-concurrencies: The channels that agents can handle in the Contact Control Panel (CCP) for this routing profile.
        name: The name of the routing profile. Must not be more than 127 characters.
        queue-configs: |-
            The inbound queues associated with the routing profile. If no queue is added, the agent can make only outbound calls.

            The limit of 10 array members applies to the maximum number of `RoutingProfileQueueConfig` objects that can be passed during a CreateRoutingProfile API request. It is different from the quota of 50 queues per routing profile per instance that is listed in [Amazon Connect service quotas](https://docs.aws.amazon.com/connect/latest/adminguide/amazon-connect-service-limits.html).
        tags: 'The tags used to organize, track, or control access for this resource. For example, { "Tags": {"key1":"value1", "key2":"value2"} }.'
