name: update-application-layer-automatic-response
description: Updates an existing Shield Advanced automatic application layer DDoS mitigation configuration for the specified resource.
flags:
    --action=!: Specifies the action setting that Shield Advanced should use in the WAF rules that it creates on behalf of the protected resource in response to DDoS attacks.
    --resource-arn=!: The ARN (Amazon Resource Name) of the resource.
documentation:
    command: Updates an existing Shield Advanced automatic application layer DDoS mitigation configuration for the specified resource.
    flag:
        action: Specifies the action setting that Shield Advanced should use in the WAF rules that it creates on behalf of the protected resource in response to DDoS attacks. You specify this as part of the configuration for the automatic application layer DDoS mitigation feature, when you enable or update automatic mitigation. Shield Advanced creates the WAF rules in a Shield Advanced-managed rule group, inside the web ACL that you have associated with the resource.
        resource-arn: The ARN (Amazon Resource Name) of the resource.
