name: describe-vpc-endpoint-service-configurations
description: Describes the VPC endpoint service configurations in your account (your services).
flags:
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: The filters.
    --max-results=: The maximum number of results to return for the request in a single page.
    --next-token=: The token to retrieve the next page of results.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --service-ids=: The IDs of the endpoint services.
documentation:
    command: Describes the VPC endpoint service configurations in your account (your services).
    flag:
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            The filters.

            - `service-name` - The name of the service.
            - `service-id` - The ID of the service.
            - `service-state` - The state of the service (`Pending` | `Available` | `Deleting` | `Deleted` | `Failed`).
            - `supported-ip-address-types` - The IP address type (`ipv4` | `ipv6`).
            - `tag`:&lt;key&gt; - The key/value combination of a tag assigned to the resource. Use the tag key in the filter name and the tag value as the filter value. For example, to find all resources that have a tag with the key `Owner` and the value `TeamA`, specify `tag:Owner` for the filter name and `TeamA` for the filter value.
            - `tag-key` - The key of a tag assigned to the resource. Use this filter to find all resources assigned a tag with a specific key, regardless of the tag value.
        max-results: The maximum number of results to return for the request in a single page. The remaining results of the initial request can be seen by sending another request with the returned `NextToken` value. This value can be between 5 and 1,000; if `MaxResults` is given a value larger than 1,000, only 1,000 results are returned.
        next-token: The token to retrieve the next page of results.
        service-ids: The IDs of the endpoint services.
