name: describe-audit-finding
description: Gets information about a single audit finding.
flags:
    --finding-id=!: A unique identifier for a single audit finding.
documentation:
    command: |-
        Gets information about a single audit finding. Properties include the reason for noncompliance, the severity of the issue, and the start time when the audit that returned the finding.

        Requires permission to access the [DescribeAuditFinding](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        finding-id: A unique identifier for a single audit finding. You can use this identifier to apply mitigation actions to the finding.
