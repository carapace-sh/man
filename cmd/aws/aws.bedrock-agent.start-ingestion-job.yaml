name: start-ingestion-job
description: Begins a data ingestion job.
flags:
    --client-token=: A unique, case-sensitive identifier to ensure that the API request completes no more than one time.
    --data-source-id=!: The unique identifier of the data source you want to ingest into your knowledge base.
    --description=: A description of the data ingestion job.
    --knowledge-base-id=!: The unique identifier of the knowledge base for the data ingestion job.
documentation:
    command: Begins a data ingestion job. Data sources are ingested into your knowledge base so that Large Language Models (LLMs) can use your data.
    flag:
        client-token: A unique, case-sensitive identifier to ensure that the API request completes no more than one time. If this token matches a previous request, Amazon Bedrock ignores the request, but does not return an error. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html).
        data-source-id: The unique identifier of the data source you want to ingest into your knowledge base.
        description: A description of the data ingestion job.
        knowledge-base-id: The unique identifier of the knowledge base for the data ingestion job.
