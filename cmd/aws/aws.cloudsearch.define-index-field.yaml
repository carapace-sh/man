name: define-index-field
description: Configures an `IndexField` for the search domain.
flags:
    --analysis-scheme=: The name of an analysis scheme for a text field.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --default-value=: A value to use for the field if the field isn’t specified for a document.
    --domain-name=!: ""
    --facet-enabled: Whether facet information can be returned for the field.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --highlight-enabled: Whether highlights can be returned for the field.
    --name=!: A string that represents the name of an index field
    --return-enabled: Whether the contents of the field can be returned in the search results.
    --search-enabled: Whether highlights can be returned for the field.
    --sort-enabled: Whether the field can be used to sort the search results.
    --source-field=: The name of the source field to map to the field.
    --type=!: The type of field.
documentation:
    command: Configures an `IndexField` for the search domain. Used to create new fields and modify existing ones. You must specify the name of the domain you are configuring and an index field configuration. The index field configuration specifies a unique name, the index field type, and the options you want to configure for the field. The options you can specify depend on the `IndexFieldType`. If the field exists, the new configuration replaces the old one. For more information, see [Configuring Index Fields](http://docs.aws.amazon.com/cloudsearch/latest/developerguide/configuring-index-fields.html) in the *Amazon CloudSearch Developer Guide*.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain-name: ""
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        index-field: The index field and field options you want to configure.
