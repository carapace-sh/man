name: change-quorum
description: Change quorum of a Cloud Spanner database.
flags:
    --dual-region!: Switch to dual-region quorum type.
    --etag=: Used for optimistic concurrency control.
    --instance=: The Cloud Spanner instance for the database.
    --no-dual-region!&: Switch to dual-region quorum type.
    --no-single-region!&: Switch to single-region quorum type.
    --serving-location=!: The cloud Spanner location.
    --single-region!: Switch to single-region quorum type.
documentation:
    command: Change quorum of a Cloud Spanner database.
    flag:
        dual-region: Switch to dual-region quorum type.
        etag: Used for optimistic concurrency control.
        instance: |-
            The Cloud Spanner instance for the database.
            +
            To set the `instance` attribute:
            * provide the argument `database` on the command line with a fully specified name;
            * provide the argument `--instance` on the command line;
            * set the property `spanner/instance`.
        no-dual-region: Switch to dual-region quorum type.
        no-single-region: Switch to single-region quorum type.
        serving-location: The cloud Spanner location.
        single-region: Switch to single-region quorum type.
