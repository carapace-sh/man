name: list-service-network-vpc-associations
description: Lists the associations between a service network and a VPC.
flags:
    --max-results=: The maximum number of results to return.
    --next-token=: A pagination token for the next page of results.
    --service-network-identifier=: The ID or ARN of the service network.
    --vpc-identifier=: The ID or ARN of the VPC.
documentation:
    command: Lists the associations between a service network and a VPC. You can filter the list either by VPC or service network. You must provide either the ID of the service network identifier or the ID of the VPC.
    flag:
        max-results: The maximum number of results to return.
        next-token: A pagination token for the next page of results.
        service-network-identifier: The ID or ARN of the service network.
        vpc-identifier: The ID or ARN of the VPC.
