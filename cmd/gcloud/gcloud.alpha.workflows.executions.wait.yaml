name: wait
description: '*(ALPHA)*  Wait for an execution to complete.'
hidden: true
flags:
    --location=: Cloud location for the execution.
    --workflow=: Workflow for the execution.
documentation:
    command: '*(ALPHA)*  Wait for an execution to complete.'
    flag:
        location: |-
            Cloud location for the execution.  Alternatively, set the property [workflows/location].
            +
            To set the `location` attribute:
            * provide the argument `execution` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `workflows/location`.
        workflow: |-
            Workflow for the execution.
            +
            To set the `workflow` attribute:
            * provide the argument `execution` on the command line with a fully specified name;
            * provide the argument `--workflow` on the command line.
