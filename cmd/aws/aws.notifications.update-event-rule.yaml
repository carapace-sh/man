name: update-event-rule
description: Updates an existing `EventRule`.
flags:
    --arn=!: The Amazon Resource Name (ARN) to use to update the `EventRule`.
    --event-pattern=: An additional event pattern used to further filter the events this `EventRule` receives.
    --regions=: A list of Amazon Web Services Regions that sends events to this `EventRule`.
documentation:
    command: Updates an existing `EventRule`.
    flag:
        arn: The Amazon Resource Name (ARN) to use to update the `EventRule`.
        event-pattern: |-
            An additional event pattern used to further filter the events this `EventRule` receives.

            For more information, see [Amazon EventBridge event patterns](https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-event-patterns.html) in the *Amazon EventBridge User Guide.*
        regions: A list of Amazon Web Services Regions that sends events to this `EventRule`.
