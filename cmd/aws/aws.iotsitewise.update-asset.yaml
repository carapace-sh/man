name: update-asset
description: Updates an asset's name.
flags:
    --asset-description=: A description for the asset.
    --asset-external-id=: An external ID to assign to the asset.
    --asset-id=!: The ID of the asset to update.
    --asset-name=!: A friendly name for the asset.
    --client-token=: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request.
documentation:
    command: Updates an asset's name. For more information, see [Updating assets and models](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/update-assets-and-models.html) in the *IoT SiteWise User Guide*.
    flag:
        asset-description: A description for the asset.
        asset-external-id: An external ID to assign to the asset. The asset must not already have an external ID. The external ID must be unique within your Amazon Web Services account. For more information, see [Using external IDs](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/object-ids.html#external-ids) in the *IoT SiteWise User Guide*.
        asset-id: The ID of the asset to update. This can be either the actual ID in UUID format, or else `externalId:` followed by the external ID, if it has one. For more information, see [Referencing objects with external IDs](https://docs.aws.amazon.com/iot-sitewise/latest/userguide/object-ids.html#external-id-references) in the *IoT SiteWise User Guide*.
        asset-name: A friendly name for the asset.
        client-token: A unique case-sensitive identifier that you can provide to ensure the idempotency of the request. Don't reuse this client token if a new idempotent request is required.
