    --aws-account-id=!: The Amazon Web Services account ID associated with your QuickSight subscription.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-public-sharing-enabled: A Boolean value that indicates whether public sharing is turned on for an QuickSight account.
    --public-sharing-enabled: A Boolean value that indicates whether public sharing is turned on for an QuickSight account.
documentation:
    command: |-
        This API controls public sharing settings for your entire QuickSight account, affecting data security and access. When you enable public sharing:

        - Dashboards can be shared publicly
        - This setting affects your entire Amazon Web Services account and all QuickSight users

        **Before proceeding:** Ensure you understand the security implications and have proper IAM permissions configured.

        Use the `UpdatePublicSharingSettings` operation to turn on or turn off the public sharing settings of an QuickSight dashboard.

        To use this operation, turn on session capacity pricing for your QuickSight account.

        Before you can turn on public sharing on your account, make sure to give public sharing permissions to an administrative user in the Identity and Access Management (IAM) console. For more information on using IAM with QuickSight, see [Using QuickSight with IAM](https://docs.aws.amazon.com/quicksight/latest/user/security_iam_service-with-iam.html) in the *QuickSight User Guide*.
