name: delete-telemetry-rule
description: Deletes a telemetry rule from your account.
flags:
    --rule-identifier=!: The identifier (name or ARN) of the telemetry rule to delete.
documentation:
    command: Deletes a telemetry rule from your account. Any telemetry configurations previously created by the rule will remain but no new resources will be configured by this rule.
    flag:
        rule-identifier: The identifier (name or ARN) of the telemetry rule to delete.
