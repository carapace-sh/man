name: update-resource-position
description: Update the position information of a given wireless device or a wireless gateway resource.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --geo-json-payload=: The position information of the resource, displayed as a JSON payload.
    --resource-identifier=!: The identifier of the resource for which position information is updated.
    --resource-type=!: The type of resource for which position information is updated, which can be a wireless device or a wireless gateway.
completion:
    flag:
        resource-type:
            - WirelessDevice
            - WirelessGateway
documentation:
    command: Update the position information of a given wireless device or a wireless gateway resource. The position coordinates are based on the [World Geodetic System (WGS84)](https://gisgeography.com/wgs84-world-geodetic-system/).
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        geo-json-payload: The position information of the resource, displayed as a JSON payload. The payload uses the GeoJSON format, which a format that's used to encode geographic data structures. For more information, see [GeoJSON](https://geojson.org/).
        resource-identifier: The identifier of the resource for which position information is updated. It can be the wireless device ID or the wireless gateway ID, depending on the resource type.
        resource-type: The type of resource for which position information is updated, which can be a wireless device or a wireless gateway.
