name: update-resolver-endpoint
description: Updates the name, or endpoint type for an inbound or an outbound Resolver endpoint.
flags:
    --name=: The name of the Resolver endpoint that you want to update.
    --protocols=: The protocols you want to use for the endpoint.
    --resolver-endpoint-id=!: The ID of the Resolver endpoint that you want to update.
    --resolver-endpoint-type=: Specifies the endpoint type for what type of IP address the endpoint uses to forward DNS queries.
    --update-ip-addresses=: Specifies the IPv6 address when you update the Resolver endpoint from IPv4 to dual-stack.
completion:
    flag:
        resolver-endpoint-type:
            - IPV6
            - IPV4
            - DUALSTACK
documentation:
    command: Updates the name, or endpoint type for an inbound or an outbound Resolver endpoint. You can only update between IPV4 and DUALSTACK, IPV6 endpoint type can't be updated to other type.
    flag:
        name: The name of the Resolver endpoint that you want to update.
        protocols: |-
            The protocols you want to use for the endpoint. DoH-FIPS is applicable for default inbound endpoints only.

            For a default inbound endpoint you can apply the protocols as follows:

            - Do53 and DoH in combination.
            - Do53 and DoH-FIPS in combination.
            - Do53 alone.
            - DoH alone.
            - DoH-FIPS alone.
            - None, which is treated as Do53.

            For a delegation inbound endpoint you can use Do53 only.

            For an outbound endpoint you can apply the protocols as follows:

            - Do53 and DoH in combination.
            - Do53 alone.
            - DoH alone.
            - None, which is treated as Do53.

            You can't change the protocol of an inbound endpoint directly from only Do53 to only DoH, or DoH-FIPS. This is to prevent a sudden disruption to incoming traffic that relies on Do53. To change the protocol from Do53 to DoH, or DoH-FIPS, you must first enable both Do53 and DoH, or Do53 and DoH-FIPS, to make sure that all incoming traffic has transferred to using the DoH protocol, or DoH-FIPS, and then remove the Do53.
        resolver-endpoint-id: The ID of the Resolver endpoint that you want to update.
        resolver-endpoint-type: |-
            Specifies the endpoint type for what type of IP address the endpoint uses to forward DNS queries.

            Updating to `IPV6` type isn't currently supported.
        update-ip-addresses: Specifies the IPv6 address when you update the Resolver endpoint from IPv4 to dual-stack. If you don't specify an IPv6 address, one will be automatically chosen from your subnet.
