name: create
description: Create a new group.
flags:
    --customer=: The customer ID for the customer\'s G Suite account.
    --description=: An extended description to help users determine the purpose of a Group.
    --display-name=: The Group's display name.
    --dynamic-user-query=: Query that determines the memberships of the dynamic group.
    --group-type=: The type of group to create.
    --labels=: Labels for group resource.
    --organization=: The organization the Group being created belongs to.
    --with-initial-owner=: If specified the user making the request will be added as the initial owner of the group being
completion:
    flag:
        group-type:
            - discussion
            - dynamic
            - security
        with-initial-owner:
            - empty
            - with-initial-owner
documentation:
    command: Create a new group.
    flag:
        customer: |-
            The customer ID for the customer\'s G Suite account.
            Example of customer: "C01k1e9nw"
        description: |-
            An extended description to help users determine the purpose of a Group. For
            example, you can include information about who should join the Group, the
            types of messages to send to the Group, links to FAQs about the Group, or
            related Groups. Maximum length is 4,096 characters.
        display-name: The Group's display name.
        dynamic-user-query: |-
            Query that determines the memberships of the dynamic group.
            +
            Example of a query:
            --dynamic-user-query="user.organizations.exists(org,org.title=='SWE')"
        group-type: |-
            The type of group to create. Setting group-type will add the
            appropriate labels for the type of group being created. _GROUP_TYPE_ must be one of:
            +
            *discussion*::: Creates a Google Groups discussion group.
            *dynamic*::: Creates a dynamic group.
            *security*::: Creates a security group.
            :::
            +
        labels: |-
            Labels for group resource.
            Example of labels "--labels cloudidentity.googleapis.com/groups.discussion_forum"
        organization: |-
            The organization the Group being created belongs to. This can be
            specified either as an ID ("123456789") or as the associated domain
            ("example.com").
        with-initial-owner: |-
            If specified the user making the request will be added as the initial owner of the group being
            created. _WITH_INITIAL_OWNER_ must be one of:
            +
            *empty*::: The creator of the group will not be the owner of the group. This is
            the default for dynamic groups.
            +
            *with-initial-owner*::: The creator of the group will be the owner of the group. This is
            the default for non-dynamic groups.
            +
            :::
            +
