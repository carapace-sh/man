name: delete-queue-limit-association
description: Removes the association between a queue and a limit.
flags:
    --farm-id=!: The unique identifier of the farm that contains the queue and limit to disassociate.
    --limit-id=!: The unique identifier of the limit to disassociate.
    --queue-id=!: The unique identifier of the queue to disassociate.
documentation:
    command: Removes the association between a queue and a limit. You must use the `UpdateQueueLimitAssociation` operation to set the status to `STOP_LIMIT_USAGE_AND_COMPLETE_TASKS` or `STOP_LIMIT_USAGE_AND_CANCEL_TASKS`. The status does not change immediately. Use the `GetQueueLimitAssociation` operation to see if the status changed to `STOPPED` before deleting the association.
    flag:
        farm-id: The unique identifier of the farm that contains the queue and limit to disassociate.
        limit-id: The unique identifier of the limit to disassociate.
        queue-id: The unique identifier of the queue to disassociate.
