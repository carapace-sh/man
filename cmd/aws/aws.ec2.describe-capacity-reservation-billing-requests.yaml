name: describe-capacity-reservation-billing-requests
description: Describes a request to assign the billing of the unused capacity of a Capacity Reservation.
flags:
    --capacity-reservation-ids=: The ID of the Capacity Reservation.
    --dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --filters=: One or more filters.
    --max-results=: The maximum number of items to return for this request.
    --next-token=: The token to use to retrieve the next page of results.
    --no-dry-run&: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response.
    --role=!: 'Specify one of the following:'
completion:
    flag:
        role:
            - odcr-owner
            - unused-reservation-billing-owner
documentation:
    command: Describes a request to assign the billing of the unused capacity of a Capacity Reservation. For more information, see [Billing assignment for shared Amazon EC2 Capacity Reservations](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/transfer-billing.html).
    flag:
        capacity-reservation-ids: The ID of the Capacity Reservation.
        dry-run: Checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is `DryRunOperation`. Otherwise, it is `UnauthorizedOperation`.
        filters: |-
            One or more filters.

            - `status` - The state of the request (`pending` | `accepted` | `rejected` | `cancelled` | `revoked` | `expired`).
            - `requested-by` - The account ID of the Capacity Reservation owner that initiated the request. Not supported if you specify `requested-by` for **Role**.
            - `unused-reservation-billing-owner` - The ID of the consumer account to which the request was sent. Not supported if you specify `unused-reservation-billing-owner` for **Role**.
        max-results: The maximum number of items to return for this request. To get the next page of items, make another request with the token returned in the output. For more information, see [Pagination](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Query-Requests.html#api-pagination).
        next-token: The token to use to retrieve the next page of results.
        role: |-
            Specify one of the following:

            - `odcr-owner` - If you are the Capacity Reservation owner, specify this value to view requests that you have initiated. Not supported with the `requested-by` filter.
            - `unused-reservation-billing-owner` - If you are the consumer account, specify this value to view requests that have been sent to you. Not supported with the `unused-reservation-billing-owner` filter.
