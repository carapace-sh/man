name: import-migration-task
description: Registers a new migration task which represents a server, database, etc., being migrated to AWS by a migration tool.
flags:
    --dry-run=: Optional boolean flag to indicate whether any effect should take place.
    --migration-task-name=!: Unique identifier that references the migration task.
    --progress-update-stream=!: The name of the ProgressUpdateStream.
documentation:
    command: |-
        Registers a new migration task which represents a server, database, etc., being migrated to AWS by a migration tool.

        This API is a prerequisite to calling the `NotifyMigrationTaskState` API as the migration tool must first register the migration task with Migration Hub.
    flag:
        dry-run: Optional boolean flag to indicate whether any effect should take place. Used to test if the caller has permission to make the call.
        migration-task-name: Unique identifier that references the migration task. *Do not store personal data in this field.*
        progress-update-stream: The name of the ProgressUpdateStream. &gt;
