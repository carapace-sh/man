name: update-sshpublic-key
description: Sets the status of an IAM user's SSH public key to active or inactive.
flags:
    --sshpublic-key-id=!: The unique identifier for the SSH public key.
    --status=!: The status to assign to the SSH public key.
    --user-name=!: The name of the IAM user associated with the SSH public key.
completion:
    flag:
        status:
            - Active
            - Inactive
            - Expired
documentation:
    command: |-
        Sets the status of an IAM user's SSH public key to active or inactive. SSH public keys that are inactive cannot be used for authentication. This operation can be used to disable a user's SSH public key as part of a key rotation work flow.

        The SSH public key affected by this operation is used only for authenticating the associated IAM user to an CodeCommit repository. For more information about using SSH keys to authenticate to an CodeCommit repository, see [Set up CodeCommit for SSH connections](https://docs.aws.amazon.com/codecommit/latest/userguide/setting-up-credentials-ssh.html) in the *CodeCommit User Guide*.
    flag:
        sshpublic-key-id: |-
            The unique identifier for the SSH public key.

            This parameter allows (through its [regex pattern](http://wikipedia.org/wiki/regex)) a string of characters that can consist of any upper or lowercased letter or digit.
        status: The status to assign to the SSH public key. `Active` means that the key can be used for authentication with an CodeCommit repository. `Inactive` means that the key cannot be used.
        user-name: |-
            The name of the IAM user associated with the SSH public key.

            This parameter allows (through its [regex pattern](http://wikipedia.org/wiki/regex)) a string of characters consisting of upper and lowercase alphanumeric characters with no spaces. You can also include any of the following characters: \_+=,.@-
