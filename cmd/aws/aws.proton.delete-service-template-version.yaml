name: delete-service-template-version
description: If no other minor versions of a service template exist, delete a major version of the service template if it's not the `Recommended` version.
flags:
    --major-version=!: The service template major version to delete.
    --minor-version=!: The service template minor version to delete.
    --template-name=!: The name of the service template.
documentation:
    command: |-
        If no other minor versions of a service template exist, delete a major version of the service template if it's not the `Recommended` version. Delete the `Recommended` version of the service template if no other major versions or minor versions of the service template exist. A major version of a service template is a version that *isn't* backwards compatible.

        Delete a minor version of a service template if it's not the `Recommended` version. Delete a `Recommended` minor version of the service template if no other minor versions of the service template exist. A minor version of a service template is a version that's backwards compatible.
    flag:
        major-version: The service template major version to delete.
        minor-version: The service template minor version to delete.
        template-name: The name of the service template.
