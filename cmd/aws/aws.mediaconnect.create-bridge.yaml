name: create-bridge
description: Creates a new bridge.
flags:
    --egress-gateway-bridge=: An egress bridge is a cloud-to-ground bridge.
    --ingress-gateway-bridge=: An ingress bridge is a ground-to-cloud bridge.
    --name=!: The name of the bridge.
    --outputs=: The outputs that you want to add to this bridge.
    --placement-arn=!: The bridge placement Amazon Resource Number (ARN).
    --source-failover-config=: The settings for source failover.
    --sources=!: The sources that you want to add to this bridge.
documentation:
    command: Creates a new bridge. The request must include one source.
    flag:
        egress-gateway-bridge: An egress bridge is a cloud-to-ground bridge. The content comes from an existing MediaConnect flow and is delivered to your premises.
        ingress-gateway-bridge: An ingress bridge is a ground-to-cloud bridge. The content originates at your premises and is delivered to the cloud.
        name: The name of the bridge. This name can not be modified after the bridge is created.
        outputs: The outputs that you want to add to this bridge.
        placement-arn: The bridge placement Amazon Resource Number (ARN).
        source-failover-config: The settings for source failover.
        sources: The sources that you want to add to this bridge.
