name: list-nodes
description: Returns information about the nodes within a network.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --max-results=: The maximum number of nodes to list.
    --member-id=: The unique identifier of the member who owns the nodes to list.
    --network-id=!: The unique identifier of the network for which to list nodes.
    --next-token=: The pagination token that indicates the next set of results to retrieve.
    --status=: An optional status specifier.
completion:
    flag:
        status:
            - CREATING
            - AVAILABLE
            - UNHEALTHY
            - CREATE_FAILED
            - UPDATING
            - DELETING
            - DELETED
            - FAILED
            - INACCESSIBLE_ENCRYPTION_KEY
documentation:
    command: |-
        Returns information about the nodes within a network.

        Applies to Hyperledger Fabric and Ethereum.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        max-results: The maximum number of nodes to list.
        member-id: |-
            The unique identifier of the member who owns the nodes to list.

            Applies only to Hyperledger Fabric and is required for Hyperledger Fabric.
        network-id: The unique identifier of the network for which to list nodes.
        next-token: The pagination token that indicates the next set of results to retrieve.
        status: An optional status specifier. If provided, only nodes currently in this status are listed.
