name: create-agent
description: Creates an agent that orchestrates interactions between foundation models, data sources, software applications, user conversations, and APIs to carry out tasks to help customers.
flags:
    --agent-collaboration=: The agent's collaboration role.
    --agent-name=!: A name for the agent that you create.
    --agent-resource-role-arn=: The Amazon Resource Name (ARN) of the IAM role with permissions to invoke API operations on the agent.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: A unique, case-sensitive identifier to ensure that the API request completes no more than one time.
    --custom-orchestration=: Contains details of the custom orchestration configured for the agent.
    --customer-encryption-key-arn=: The Amazon Resource Name (ARN) of the KMS key with which to encrypt the agent.
    --description=: A description of the agent.
    --foundation-model=: The identifier for the model that you want to be used for orchestration by the agent you create.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --guardrail-configuration=: The unique Guardrail configuration assigned to the agent when it is created.
    --idle-session-ttl-in-seconds=: The number of seconds for which Amazon Bedrock keeps information about a user's conversation with the agent.
    --instruction=: Instructions that tell the agent what it should do and how it should interact with users.
    --memory-configuration=: Contains the details of the memory configured for the agent.
    --orchestration-type=: Specifies the type of orchestration strategy for the agent.
    --prompt-override-configuration=: Contains configurations to override prompts in different parts of an agent sequence.
    --tags=: Any tags that you want to attach to the agent.
completion:
    flag:
        agent-collaboration:
            - SUPERVISOR
            - SUPERVISOR_ROUTER
            - DISABLED
        orchestration-type:
            - DEFAULT
            - CUSTOM_ORCHESTRATION
documentation:
    command: "Creates an agent that orchestrates interactions between foundation models, data sources, software applications, user conversations, and APIs to carry out tasks to help customers.\n\n- Specify the following fields for security purposes.\n  \n  - `agentResourceRoleArn` – The Amazon Resource Name (ARN) of the role with permissions to invoke API operations on an agent.\n  - (Optional) `customerEncryptionKeyArn` – The Amazon Resource Name (ARN) of a KMS key to encrypt the creation of the agent.\n  - (Optional) `idleSessionTTLinSeconds` – Specify the number of seconds for which the agent should maintain session information. After this time expires, the subsequent `InvokeAgent` request begins a new session.\n- To enable your agent to retain conversational context across multiple sessions, include a `memoryConfiguration` object. For more information, see [Configure memory](https://docs.aws.amazon.com/bedrock/latest/userguide/agents-configure-memory.html).\n- To override the default prompt behavior for agent orchestration and to use advanced prompts, include a `promptOverrideConfiguration` object. For more information, see [Advanced prompts](https://docs.aws.amazon.com/bedrock/latest/userguide/advanced-prompts.html).\n- If your agent fails to be created, the response returns a list of `failureReasons` alongside a list of `recommendedActions` for you to troubleshoot.\n- The agent instructions will not be honored if your agent has only one knowledge base, uses default prompts, has no action group, and user input is disabled."
    flag:
        agent-collaboration: The agent's collaboration role.
        agent-name: A name for the agent that you create.
        agent-resource-role-arn: The Amazon Resource Name (ARN) of the IAM role with permissions to invoke API operations on the agent.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: A unique, case-sensitive identifier to ensure that the API request completes no more than one time. If this token matches a previous request, Amazon Bedrock ignores the request, but does not return an error. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html).
        custom-orchestration: Contains details of the custom orchestration configured for the agent.
        customer-encryption-key-arn: The Amazon Resource Name (ARN) of the KMS key with which to encrypt the agent.
        description: A description of the agent.
        foundation-model: |-
            The identifier for the model that you want to be used for orchestration by the agent you create.

            The `modelId` to provide depends on the type of model or throughput that you use:

            - If you use a base model, specify the model ID or its ARN. For a list of model IDs for base models, see [Amazon Bedrock base model IDs (on-demand throughput)](https://docs.aws.amazon.com/bedrock/latest/userguide/model-ids.html#model-ids-arns) in the Amazon Bedrock User Guide.
            - If you use an inference profile, specify the inference profile ID or its ARN. For a list of inference profile IDs, see [Supported Regions and models for cross-region inference](https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference-support.html) in the Amazon Bedrock User Guide.
            - If you use a provisioned model, specify the ARN of the Provisioned Throughput. For more information, see [Run inference using a Provisioned Throughput](https://docs.aws.amazon.com/bedrock/latest/userguide/prov-thru-use.html) in the Amazon Bedrock User Guide.
            - If you use a custom model, first purchase Provisioned Throughput for it. Then specify the ARN of the resulting provisioned model. For more information, see [Use a custom model in Amazon Bedrock](https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-use.html) in the Amazon Bedrock User Guide.
            - If you use an [imported model](https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-import-model.html), specify the ARN of the imported model. You can get the model ARN from a successful call to [CreateModelImportJob](https://docs.aws.amazon.com/bedrock/latest/APIReference/API_CreateModelImportJob.html) or from the Imported models page in the Amazon Bedrock console.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        guardrail-configuration: The unique Guardrail configuration assigned to the agent when it is created.
        idle-session-ttl-in-seconds: |-
            The number of seconds for which Amazon Bedrock keeps information about a user's conversation with the agent.

            A user interaction remains active for the amount of time specified. If no conversation occurs during this time, the session expires and Amazon Bedrock deletes any data provided before the timeout.
        instruction: Instructions that tell the agent what it should do and how it should interact with users.
        memory-configuration: Contains the details of the memory configured for the agent.
        orchestration-type: Specifies the type of orchestration strategy for the agent. This is set to `DEFAULT` orchestration type, by default.
        prompt-override-configuration: Contains configurations to override prompts in different parts of an agent sequence. For more information, see [Advanced prompts](https://docs.aws.amazon.com/bedrock/latest/userguide/advanced-prompts.html).
        tags: Any tags that you want to attach to the agent.
