name: start-bot-resource-generation
description: Starts a request for the descriptive bot builder to generate a bot locale configuration based on the prompt you provide it.
flags:
    --bot-id=!: The unique identifier of the bot for which to generate intents and slot types.
    --bot-version=!: The version of the bot for which to generate intents and slot types.
    --generation-input-prompt=!: The prompt to generate intents and slot types for the bot locale.
    --locale-id=!: The locale of the bot for which to generate intents and slot types.
documentation:
    command: Starts a request for the descriptive bot builder to generate a bot locale configuration based on the prompt you provide it. After you make this call, use the `DescribeBotResourceGeneration` operation to check on the status of the generation and for the `generatedBotLocaleUrl` when the generation is complete. Use that value to retrieve the Amazon S3 object containing the bot locale configuration. You can then modify and import this configuration.
    flag:
        bot-id: The unique identifier of the bot for which to generate intents and slot types.
        bot-version: The version of the bot for which to generate intents and slot types.
        generation-input-prompt: The prompt to generate intents and slot types for the bot locale. Your description should be both *detailed* and *precise* to help generate appropriate and sufficient intents for your bot. Include a list of actions to improve the intent creation process.
        locale-id: The locale of the bot for which to generate intents and slot types.
