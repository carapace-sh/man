name: create-data-source
description: Creates a `DataSource` object.
flags:
    --api-id=!: The API ID for the GraphQL API for the `DataSource`.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A description of the `DataSource`.
    --dynamodb-config=: Amazon DynamoDB settings.
    --elasticsearch-config=: Amazon OpenSearch Service settings.
    --event-bridge-config=: Amazon EventBridge settings.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --http-config=: HTTP endpoint settings.
    --lambda-config=: Lambda settings.
    --metrics-config=: Enables or disables enhanced data source metrics for specified data sources.
    --name=!: A user-supplied name for the `DataSource`.
    --open-search-service-config=: Amazon OpenSearch Service settings.
    --relational-database-config=: Relational database settings.
    --service-role-arn=: The Identity and Access Management (IAM) service role Amazon Resource Name (ARN) for the data source.
    --type=!: The type of the `DataSource`.
completion:
    flag:
        metrics-config:
            - ENABLED
            - DISABLED
        type:
            - AWS_LAMBDA
            - AMAZON_DYNAMODB
            - AMAZON_ELASTICSEARCH
            - NONE
            - HTTP
            - RELATIONAL_DATABASE
            - AMAZON_OPENSEARCH_SERVICE
            - AMAZON_EVENTBRIDGE
            - AMAZON_BEDROCK_RUNTIME
documentation:
    command: Creates a `DataSource` object.
    flag:
        api-id: The API ID for the GraphQL API for the `DataSource`.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A description of the `DataSource`.
        dynamodb-config: Amazon DynamoDB settings.
        elasticsearch-config: |-
            Amazon OpenSearch Service settings.

            As of September 2021, Amazon Elasticsearch service is Amazon OpenSearch Service. This configuration is deprecated. For new data sources, use [CreateDataSourceRequest$openSearchServiceConfig]() to create an OpenSearch data source.
        event-bridge-config: Amazon EventBridge settings.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        http-config: HTTP endpoint settings.
        lambda-config: Lambda settings.
        metrics-config: |-
            Enables or disables enhanced data source metrics for specified data sources. Note that `metricsConfig` won't be used unless the `dataSourceLevelMetricsBehavior` value is set to `PER_DATA_SOURCE_METRICS`. If the `dataSourceLevelMetricsBehavior` is set to `FULL_REQUEST_DATA_SOURCE_METRICS` instead, `metricsConfig` will be ignored. However, you can still set its value.

            `metricsConfig` can be `ENABLED` or `DISABLED`.
        name: A user-supplied name for the `DataSource`.
        open-search-service-config: Amazon OpenSearch Service settings.
        relational-database-config: Relational database settings.
        service-role-arn: The Identity and Access Management (IAM) service role Amazon Resource Name (ARN) for the data source. The system assumes this role when accessing the data source.
        type: The type of the `DataSource`.
