name: list-elasticsearch-instance-types
description: List all Elasticsearch instance types that are supported for given ElasticsearchVersion
flags:
    --domain-name=: DomainName represents the name of the Domain that we are trying to modify.
    --elasticsearch-version=!: Version of Elasticsearch for which list of supported elasticsearch instance types are needed.
    --max-results=: Set this value to limit the number of results returned.
    --next-token=: NextToken should be sent in case if earlier API call produced result containing NextToken.
documentation:
    command: List all Elasticsearch instance types that are supported for given ElasticsearchVersion
    flag:
        domain-name: DomainName represents the name of the Domain that we are trying to modify. This should be present only if we are querying for list of available Elasticsearch instance types when modifying existing domain.
        elasticsearch-version: Version of Elasticsearch for which list of supported elasticsearch instance types are needed.
        max-results: Set this value to limit the number of results returned. Value provided must be greater than 30 else it wont be honored.
        next-token: NextToken should be sent in case if earlier API call produced result containing NextToken. It is used for pagination.
