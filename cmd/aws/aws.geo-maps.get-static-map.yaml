name: get-static-map
description: '`GetStaticMap` provides high-quality static map images with customizable options.'
flags:
    --bounded-positions=: 'Takes in two or more pair of coordinates in World Geodetic System (WGS 84) format: \[longitude, latitude], with each coordinate separated by a comma.'
    --bounding-box=: 'Takes in two pairs of coordinates in World Geodetic System (WGS 84) format: \[longitude, latitude], denoting south-westerly and north-easterly edges of the image.'
    --center=: 'Takes in a pair of coordinates in World Geodetic System (WGS 84) format: \[longitude, latitude], which becomes the center point of the image.'
    --color-scheme=: Sets color tone for map, such as dark and light for specific map styles.
    --compact-overlay=: Takes in a string to draw geometries on the image.
    --crop-labels: It is a flag that takes in true or false.
    --file-name=!: The map scaling parameter to size the image, icons, and labels.
    --geo-json-overlay=: Takes in a string to draw geometries on the image.
    --height=!: Specifies the height of the map image.
    --key=: 'Optional: The API key to be used for authorization.'
    --label-size=: Overrides the label size auto-calculated by `FileName`.
    --language=: Specifies the language on the map labels using the BCP 47 language tag, limited to ISO 639-1 two-letter language codes.
    --no-crop-labels&: It is a flag that takes in true or false.
    --padding=: Applies additional space (in pixels) around overlay feature to prevent them from being cut or obscured.
    --points-of-interests=: Determines if the result image will display icons representing points of interest on the map.
    --political-view=: Specifies the political view, using ISO 3166-2 or ISO 3166-3 country code format.
    --radius=: Used with center parameter, it specifies the zoom of the image where you can control it on a granular level.
    --scale-bar-unit=: Displays a scale on the bottom right of the map image with the unit specified in the input.
    --style=: '`Style` specifies the desired map style.'
    --width=!: Specifies the width of the map image.
    --zoom=: Specifies the zoom level of the map image.
completion:
    flag:
        color-scheme:
            - Light
            - Dark
        label-size:
            - Small
            - Large
        points-of-interests:
            - Enabled
            - Disabled
        scale-bar-unit:
            - Kilometers
            - KilometersMiles
            - Miles
            - MilesKilometers
        style:
            - Satellite
            - Standard
documentation:
    command: |-
        `GetStaticMap` provides high-quality static map images with customizable options. You can modify the map's appearance and overlay additional information. It's an ideal solution for applications requiring tailored static map snapshots.

        For more information, see the following topics in the *Amazon Location Service Developer Guide*:

        - [Static maps](https://docs.aws.amazon.com/location/latest/developerguide/static-maps.html)
        - [Customize static maps](https://docs.aws.amazon.com/location/latest/developerguide/customizing-static-maps.html)
        - [Overlay on the static map](https://docs.aws.amazon.com/location/latest/developerguide/overlaying-static-map.html)
    flag:
        bounded-positions: |-
            Takes in two or more pair of coordinates in World Geodetic System (WGS 84) format: \[longitude, latitude], with each coordinate separated by a comma. The API will generate an image to encompass all of the provided coordinates.

            Cannot be used with `Zoom` and or `Radius`

            Example: 97.170451,78.039098,99.045536,27.176178
        bounding-box: |-
            Takes in two pairs of coordinates in World Geodetic System (WGS 84) format: \[longitude, latitude], denoting south-westerly and north-easterly edges of the image. The underlying area becomes the view of the image.

            Example: -123.17075,49.26959,-123.08125,49.31429
        center: |-
            Takes in a pair of coordinates in World Geodetic System (WGS 84) format: \[longitude, latitude], which becomes the center point of the image. This parameter requires that either zoom or radius is set.

            Cannot be used with `Zoom` and or `Radius`

            Example: 49.295,-123.108
        color-scheme: |-
            Sets color tone for map, such as dark and light for specific map styles. It only applies to vector map styles, such as Standard.

            Example: `Light`

            Default value: `Light`

            Valid values for `ColorScheme` are case sensitive.
        compact-overlay: |-
            Takes in a string to draw geometries on the image. The input is a comma separated format as follows format: `[Lon, Lat]`

            Example: `line:-122.407653,37.798557,-122.413291,37.802443;color=%23DD0000;width=7;outline-color=#00DD00;outline-width=5yd|point:-122.40572,37.80004;label=Fog Hill Market;size=large;text-color=%23DD0000;color=#EE4B2B`

            Currently it supports the following geometry types: point, line and polygon. It does not support multiPoint , multiLine and multiPolgyon.
        crop-labels: It is a flag that takes in true or false. It prevents the labels that are on the edge of the image from being cut or obscured.
        file-name: |-
            The map scaling parameter to size the image, icons, and labels. It follows the pattern of `^map(@2x)?$`.

            Example: `map, map@2x`
        geo-json-overlay: |-
            Takes in a string to draw geometries on the image. The input is a valid GeoJSON collection object.

            Example: `{"type":"FeatureCollection","features": [{"type":"Feature","geometry":{"type":"MultiPoint","coordinates": [[-90.076345,51.504107],[-0.074451,51.506892]]},"properties": {"color":"#00DD00"}}]}`
        height: Specifies the height of the map image.
        key: 'Optional: The API key to be used for authorization. Either an API key or valid SigV4 signature must be provided when making a request.'
        label-size: Overrides the label size auto-calculated by `FileName`. Takes in one of the values - `Small` or `Large`.
        language: |-
            Specifies the language on the map labels using the BCP 47 language tag, limited to ISO 639-1 two-letter language codes. If the specified language data isn't available for the map image, the labels will default to the regional primary language.

            Supported codes:

            - `ar`
            - `as`
            - `az`
            - `be`
            - `bg`
            - `bn`
            - `bs`
            - `ca`
            - `cs`
            - `cy`
            - `da`
            - `de`
            - `el`
            - `en`
            - `es`
            - `et`
            - `eu`
            - `fi`
            - `fo`
            - `fr`
            - `ga`
            - `gl`
            - `gn`
            - `gu`
            - `he`
            - `hi`
            - `hr`
            - `hu`
            - `hy`
            - `id`
            - `is`
            - `it`
            - `ja`
            - `ka`
            - `kk`
            - `km`
            - `kn`
            - `ko`
            - `ky`
            - `lt`
            - `lv`
            - `mk`
            - `ml`
            - `mr`
            - `ms`
            - `mt`
            - `my`
            - `nl`
