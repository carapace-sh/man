documentation:
    command: |
        *(ALPHA)*  Updates Firebase Data Connect service schema. Note only `schemas/main` is supported.
    flag:
        add-datasources: |-
            Add new value to datasources list. The data sources linked in the schema.
            +
            *postgresql*:::
            PostgreSQL configurations.
            +
            *cloudSql*::::
            Cloud SQL configurations.
            +
            *instance*:::::
            Name of the CloudSQL instance, in the format: `projects/{project}/locations/{location}/instances/{instance}`.
            +
            *database*::::
            Name of the PostgreSQL database.
            +
            *schemaMigration*::::
            Configure how to perform Postgresql schema migration.
            +
            *schemaValidation*::::
            Configure how much Postgresql schema validation to perform.
            +
            *unlinked*::::
            No Postgres data source is linked.
            If set, don't allow `database` and `schema_validation` to be configured.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --add-datasources=postgresql={cloudSql={instance=string},database=string,schemaMigration=string,schemaValidation=string,unlinked=boolean} --add-datasources=postgresql={cloudSql={instance=string},database=string,schemaMigration=string,schemaValidation=string,unlinked=boolean}
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --add-datasources='[{"postgresql": {"cloudSql": {"instance": "string"}, "database": "string", "schemaMigration": "string", "schemaValidation": "string", "unlinked": boolean}}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --add-datasources=path_to_file.(yaml|json)
            +
            ```
        add-source-files: |-
            Add new value to source_files list. The files that comprise the source set.
            +
            *contentFromFile*:::
            The file's textual content. Use a full or relative path to a local file containing the value of contentFromFile.
            +
            *path*:::
            The file name including folder path, if applicable. The path should be
            relative to a local workspace (e.g. dataconnect/(schema|connector)/*.gql)
            and not an absolute path (e.g. /absolute/path/(schema|connector)/*.gql).
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --add-source-files=contentFromFile=path_to_file,path=string --add-source-files=contentFromFile=path_to_file,path=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --add-source-files='[{"contentFromFile": path_to_file, "path": "string"}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --add-source-files=path_to_file.(yaml|json)
            +
            ```
        allow-missing: |-
            If true and the Schema is not found, a new Schema will be created.
            In this case, `update_mask` is ignored. Use *--allow-missing* to enable and *--no-allow-missing* to disable.
        annotations: |-
            Set annotations to new value. Stores small amounts of arbitrary data.
            +
            *KEY*:::
            Sets `KEY` value.
            +
            *VALUE*:::
            Sets `VALUE` value.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --annotations=string=string
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --annotations='{"string": "string"}'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --annotations=path_to_file.(yaml|json)
            +
            ```
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        clear-annotations: Clear annotations value and set to empty map.
        clear-datasources: Clear datasources value and set to empty list.
        clear-labels: Clear labels value and set to empty map.
        clear-primary-datasource: Set schema.primaryDatasource back to default value.
        clear-source: Set schema.source back to default value.
        clear-source-files: Clear source_files value and set to empty list.
        datasources: |-
            Set datasources to new value. The data sources linked in the schema.
            +
            *postgresql*:::
            PostgreSQL configurations.
            +
            *cloudSql*::::
            Cloud SQL configurations.
            +
            *instance*:::::
            Name of the CloudSQL instance, in the format: `projects/{project}/locations/{location}/instances/{instance}`.
            +
            *database*::::
            Name of the PostgreSQL database.
            +
            *schemaMigration*::::
            Configure how to perform Postgresql schema migration.
            +
            *schemaValidation*::::
