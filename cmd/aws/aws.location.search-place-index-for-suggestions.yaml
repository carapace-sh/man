name: search-place-index-for-suggestions
description: This operation is no longer current and may be deprecated in the future.
flags:
    --bias-position=:
        description: An optional parameter that indicates a preference for place suggestions that are closer to a specified position.
        nargs: -1
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --filter-b-box=:
        description: An optional parameter that limits the search results by returning only suggestions within a specified bounding box.
        nargs: -1
    --filter-categories=:
        description: A list of one or more Amazon Location categories to filter the returned places.
        nargs: -1
    --filter-countries=:
        description: An optional parameter that limits the search results by returning only suggestions within the provided list of countries.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --index-name=!: The name of the place index resource you want to use for the search.
    --key=: The optional [API key](https://docs.aws.amazon.com/location/previous/developerguide/using-apikeys.html) to authorize the request.
    --language=: The preferred language used to return results.
    --max-results=: An optional parameter.
    --text=!: The free-form partial text to use to generate place suggestions.
documentation:
    command: |-
        This operation is no longer current and may be deprecated in the future. We recommend you upgrade to [`Suggest`](/location/latest/APIReference/API_geoplaces_Suggest.html) or [`Autocomplete`](/location/latest/APIReference/API_geoplaces_Autocomplete.html) unless you require Grab data.

        - `SearchPlaceIndexForSuggestions` is part of a previous Amazon Location Service Places API (version 1) which has been superseded by a more intuitive, powerful, and complete API (version 2).
        - The version 2 `Suggest` operation gives better results for typeahead place search suggestions with fuzzy matching, while the version 2 `Autocomplete` operation gives better results for address completion based on partial input.
        - If you are using an Amazon Web Services SDK or the Amazon Web Services CLI, note that the Places API version 2 is found under `geo-places` or `geo_places`, not under `location`.
        - Since Grab is not yet fully supported in Places API version 2, we recommend you continue using API version 1 when using Grab.

        Generates suggestions for addresses and points of interest based on partial or misspelled free-form text. This operation is also known as autocomplete, autosuggest, or fuzzy matching.

        Optional parameters let you narrow your search results by bounding box or country, or bias your search toward a specific position on the globe.

        You can search for suggested place names near a specified position by using `BiasPosition`, or filter results within a bounding box by using `FilterBBox`. These parameters are mutually exclusive; using both `BiasPosition` and `FilterBBox` in the same command returns an error.
    flag:
        bias-position: |-
            An optional parameter that indicates a preference for place suggestions that are closer to a specified position.

            If provided, this parameter must contain a pair of numbers. The first number represents the X coordinate, or longitude; the second number represents the Y coordinate, or latitude.

            For example, `[-123.1174, 49.2847]` represents the position with longitude `-123.1174` and latitude `49.2847`.

            `BiasPosition` and `FilterBBox` are mutually exclusive. Specifying both options results in an error.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        filter-b-box: |-
            An optional parameter that limits the search results by returning only suggestions within a specified bounding box.

            If provided, this parameter must contain a total of four consecutive numbers in two pairs. The first pair of numbers represents the X and Y coordinates (longitude and latitude, respectively) of the southwest corner of the bounding box; the second pair of numbers represents the X and Y coordinates (longitude and latitude, respectively) of the northeast corner of the bounding box.

            For example, `[-12.7935, -37.4835, -12.0684, -36.9542]` represents a bounding box where the southwest corner has longitude `-12.7935` and latitude `-37.4835`, and the northeast corner has longitude `-12.0684` and latitude `-36.9542`.

            `FilterBBox` and `BiasPosition` are mutually exclusive. Specifying both options results in an error.
        filter-categories: |-
            A list of one or more Amazon Location categories to filter the returned places. If you include more than one category, the results will include results that match *any* of the categories listed.

            For more information about using categories, including a list of Amazon Location categories, see [Categories and filtering](https://docs.aws.amazon.com/location/previous/developerguide/category-filtering.html), in the *Amazon Location Service developer guide*.
        filter-countries: |-
            An optional parameter that limits the search results by returning only suggestions within the provided list of countries.

            - Use the [ISO 3166](https://www.iso.org/iso-3166-country-codes.html) 3-digit country code. For example, Australia uses three upper-case characters: `AUS`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        index-name: The name of the place index resource you want to use for the search.
        key: The optional [API key](https://docs.aws.amazon.com/location/previous/developerguide/using-apikeys.html) to authorize the request.
        language: |-
            The preferred language used to return results. The value must be a valid [BCP 47](https://tools.ietf.org/search/bcp47) language tag, for example, `en` for English.

            This setting affects the languages used in the results. If no language is specified, or not supported for a particular result, the partner automatically chooses a language for the result.

            For an example, we'll use the Greek language. You search for `Athens, Gr` to get suggestions with the `language` parameter set to `en`. The results found will most likely be returned as `Athens, Greece`.

            If you set the `language` parameter to `el`, for Greek, then the result found will more likely be returned as `Αθήνα, Ελλάδα`.

            If the data provider does not have a value for Greek, the result will be in a language that the provider does support.
        max-results: |-
            An optional parameter. The maximum number of results returned per request.

            The default: `5`
        text: The free-form partial text to use to generate place suggestions. For example, `eiffel tow`.
