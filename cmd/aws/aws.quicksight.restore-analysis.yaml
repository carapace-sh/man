name: restore-analysis
description: Restores an analysis.
flags:
    --analysis-id=!: The ID of the analysis that you're restoring.
    --aws-account-id=!: The ID of the Amazon Web Services account that contains the analysis.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-restore-to-folders: A boolean value that determines if the analysis will be restored to folders that it previously resided in.
    --restore-to-folders: A boolean value that determines if the analysis will be restored to folders that it previously resided in.
documentation:
    command: Restores an analysis.
    flag:
        analysis-id: The ID of the analysis that you're restoring.
        aws-account-id: The ID of the Amazon Web Services account that contains the analysis.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        restore-to-folders: A boolean value that determines if the analysis will be restored to folders that it previously resided in. A `True` value restores analysis back to all folders that it previously resided in. A `False` value restores the analysis but does not restore the analysis back to all previously resided folders. Restoring a restricted analysis requires this parameter to be set to `True`.
