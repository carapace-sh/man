name: describe-rule-group-metadata
description: High-level information about a rule group, returned by operations like create and describe.
flags:
    --rule-group-arn=: The descriptive name of the rule group.
    --rule-group-name=: The descriptive name of the rule group.
    --type=: Indicates whether the rule group is stateless or stateful.
completion:
    flag:
        type:
            - STATELESS
            - STATEFUL
documentation:
    command: High-level information about a rule group, returned by operations like create and describe. You can use the information provided in the metadata to retrieve and manage a rule group. You can retrieve all objects for a rule group by calling [DescribeRuleGroup]().
    flag:
        rule-group-arn: |-
            The descriptive name of the rule group. You can't change the name of a rule group after you create it.

            You must specify the ARN or the name, and you can specify both.
        rule-group-name: |-
            The descriptive name of the rule group. You can't change the name of a rule group after you create it.

            You must specify the ARN or the name, and you can specify both.
        type: |-
            Indicates whether the rule group is stateless or stateful. If the rule group is stateless, it contains stateless rules. If it is stateful, it contains stateful rules.

            This setting is required for requests that do not include the `RuleGroupARN`.
