name: get-performance-analysis-report
description: Retrieves the report including the report ID, status, time details, and the insights with recommendations.
flags:
    --accept-language=: The text language in the report.
    --analysis-report-id=!: A unique identifier of the created analysis report.
    --identifier=!: An immutable identifier for a data source that is unique for an Amazon Web Services Region.
    --service-type=!: The Amazon Web Services service for which Performance Insights will return metrics.
    --text-format=: Indicates the text format in the report.
completion:
    flag:
        accept-language:
            - EN_US
        service-type:
            - RDS
            - DOCDB
        text-format:
            - PLAIN_TEXT
            - MARKDOWN
documentation:
    command: Retrieves the report including the report ID, status, time details, and the insights with recommendations. The report status can be `RUNNING`, `SUCCEEDED`, or `FAILED`. The insights include the `description` and `recommendation` fields.
    flag:
        accept-language: The text language in the report. The default language is `EN_US` (English).
        analysis-report-id: A unique identifier of the created analysis report. For example, `report-12345678901234567`
        identifier: |-
            An immutable identifier for a data source that is unique for an Amazon Web Services Region. Performance Insights gathers metrics from this data source. In the console, the identifier is shown as *ResourceID*. When you call `DescribeDBInstances`, the identifier is returned as `DbiResourceId`.

            To use a DB instance as a data source, specify its `DbiResourceId` value. For example, specify `db-ABCDEFGHIJKLMNOPQRSTU1VW2X`.
        service-type: The Amazon Web Services service for which Performance Insights will return metrics. Valid value is `RDS`.
        text-format: Indicates the text format in the report. The options are `PLAIN_TEXT` or `MARKDOWN`. The default value is `plain text`.
