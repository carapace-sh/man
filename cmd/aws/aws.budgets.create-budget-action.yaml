name: create-budget-action
description: Creates a budget action.
flags:
    --account-id=!: ""
    --action-threshold=!: ""
    --action-type=!: The type of action.
    --approval-model=!: This specifies if the action needs manual or automatic approval.
    --budget-name=!: ""
    --definition=!: ""
    --execution-role-arn=!: The role passed for action execution and reversion.
    --notification-type=!: ""
    --resource-tags=: An optional list of tags to associate with the specified budget action.
    --subscribers=!: ""
completion:
    flag:
        action-type:
            - APPLY_IAM_POLICY
            - APPLY_SCP_POLICY
            - RUN_SSM_DOCUMENTS
        approval-model:
            - AUTOMATIC
            - MANUAL
        notification-type:
            - ACTUAL
            - FORECASTED
documentation:
    command: Creates a budget action.
    flag:
        account-id: ""
        action-threshold: ""
        action-type: The type of action. This defines the type of tasks that can be carried out by this action. This field also determines the format for definition.
        approval-model: This specifies if the action needs manual or automatic approval.
        budget-name: ""
        definition: ""
        execution-role-arn: The role passed for action execution and reversion. Roles and actions must be in the same account.
        notification-type: ""
        resource-tags: An optional list of tags to associate with the specified budget action. Each tag consists of a key and a value, and each key must be unique for the resource.
        subscribers: ""
