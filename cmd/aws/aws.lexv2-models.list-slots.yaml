name: list-slots
description: Gets a list of slots that match the specified criteria.
flags:
    --bot-id=!: The identifier of the bot that contains the slot.
    --bot-version=!: The version of the bot that contains the slot.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --filters=: Provides the specification of a filter used to limit the slots in the response to only those that match the filter specification.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --intent-id=!: The unique identifier of the intent that contains the slot.
    --locale-id=!: The identifier of the language and locale of the slots to list.
    --max-results=: The maximum number of slots to return in each page of results.
    --next-token=: If the response from the `ListSlots` operation contains more results than specified in the `maxResults` parameter, a token is returned in the response.
    --sort-by=: Determines the sort order for the response from the `ListSlots` operation.
documentation:
    command: Gets a list of slots that match the specified criteria.
    flag:
        bot-id: The identifier of the bot that contains the slot.
        bot-version: The version of the bot that contains the slot.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        filters: Provides the specification of a filter used to limit the slots in the response to only those that match the filter specification. You can only specify one filter and only one string to filter on.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        intent-id: The unique identifier of the intent that contains the slot.
        locale-id: The identifier of the language and locale of the slots to list. The string must match one of the supported locales. For more information, see [Supported languages](https://docs.aws.amazon.com/lexv2/latest/dg/how-languages.html).
        max-results: The maximum number of slots to return in each page of results. If there are fewer results than the max page size, only the actual number of results are returned.
        next-token: If the response from the `ListSlots` operation contains more results than specified in the `maxResults` parameter, a token is returned in the response. Use that token in the `nextToken` parameter to return the next page of results.
        sort-by: Determines the sort order for the response from the `ListSlots` operation. You can choose to sort by the slot name or last updated date in either ascending or descending order.
