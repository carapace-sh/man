name: set-iam-policy
description: '*(BETA)*  Set the IAM policy for a security gateway application.'
flags:
    --location=: The location id of the application resource.
    --security-gateway=: The securityGateway id of the application resource.
documentation:
    command: '*(BETA)*  Sets the IAM policy for the given security gateway application.'
    flag:
        location: |-
            The location id of the application resource. We support only global location.
            +
            To set the `location` attribute:
            * provide the argument `application` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        security-gateway: |-
            The securityGateway id of the application resource.
            +
            To set the `security_gateway` attribute:
            * provide the argument `application` on the command line with a fully specified name;
            * provide the argument `--security_gateway` on the command line.
