name: cancel
description: '*(ALPHA)*  Cancel a Looker import or export operation.'
flags:
    --region=: The name of the Looker region of the operation.
documentation:
    command: |
        *(ALPHA)*  Cancel a Looker import or export operation.
    flag:
        region: |-
            The name of the Looker region of the operation. Overrides the default
            looker/region property value for this command invocation.
            +

            To set the `region` attribute:
            * provide the argument `operation` on the command line with a fully specified name;
            * provide the argument `--region` on the command line;
            * set the property `looker/region`.
