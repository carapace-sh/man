name: list-workflows
description: Retrieves a list of existing workflows.
flags:
    --max-results=: The maximum number of workflows to return in one page of results.
    --name=: Filter the list by workflow name.
    --starting-token=: Specify the pagination token from a previous request to retrieve the next page of results.
    --type=: Filter the list by workflow type.
completion:
    flag:
        type:
            - PRIVATE
            - READY2RUN
documentation:
    command: Retrieves a list of existing workflows. You can filter for specific workflows by their name and type. Using the type parameter, specify `PRIVATE` to retrieve a list of private workflows or specify `READY2RUN` for a list of all Ready2Run workflows. If you do not specify the type of workflow, this operation returns a list of existing workflows.
    flag:
        max-results: The maximum number of workflows to return in one page of results.
        name: Filter the list by workflow name.
        starting-token: Specify the pagination token from a previous request to retrieve the next page of results.
        type: Filter the list by workflow type.
