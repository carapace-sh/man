name: get-aggregate-conformance-pack-compliance-summary
description: Returns the count of compliant and noncompliant conformance packs across all Amazon Web Services accounts and Amazon Web Services Regions in an aggregator.
flags:
    --configuration-aggregator-name=!: The name of the configuration aggregator.
    --filters=: Filters the results based on the `AggregateConformancePackComplianceSummaryFilters` object.
    --group-by-key=: Groups the result based on Amazon Web Services account ID or Amazon Web Services Region.
    --limit=: The maximum number of results returned on each page.
    --next-token=: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
completion:
    flag:
        group-by-key:
            - ACCOUNT_ID
            - AWS_REGION
documentation:
    command: |-
        Returns the count of compliant and noncompliant conformance packs across all Amazon Web Services accounts and Amazon Web Services Regions in an aggregator. You can filter based on Amazon Web Services account ID or Amazon Web Services Region.

        The results can return an empty result page, but if you have a nextToken, the results are displayed on the next page.
    flag:
        configuration-aggregator-name: The name of the configuration aggregator.
        filters: Filters the results based on the `AggregateConformancePackComplianceSummaryFilters` object.
        group-by-key: Groups the result based on Amazon Web Services account ID or Amazon Web Services Region.
        limit: The maximum number of results returned on each page. The default is maximum. If you specify 0, Config uses the default.
        next-token: The `nextToken` string returned on a previous page that you use to get the next page of results in a paginated response.
