name: replicate
description: Replicate a certificate template to multiple locations.
flags:
    --all-locations: Replicate this template to all supported locations.
    --continue-on-error: Continue replicating the template to other locations even if an error is encountered.
    --location=: The location of the CERTIFICATE_TEMPLATE.
    --overwrite: Overwrite any existing templates with the same name, if they exist.
    --target-locations=: Replicate this template to the given locations.
documentation:
    command: Replicate a certificate template to multiple locations.
    flag:
        all-locations: Replicate this template to all supported locations.
        continue-on-error: Continue replicating the template to other locations even if an error is encountered. If this is set, an error in one location will be logged but will not prevent replication to other locations.
        location: |-
            The location of the CERTIFICATE_TEMPLATE.
            +
            To set the `location` attribute:
            * provide the argument `CERTIFICATE_TEMPLATE` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * set the property `privateca/location`.
        overwrite: Overwrite any existing templates with the same name, if they exist.
        target-locations: Replicate this template to the given locations.
