name: update-fleet-attributes
description: '**This API works with the following fleet types:** EC2, Anywhere, Container'
flags:
    --anywhere-configuration=: Amazon GameLift Servers Anywhere configuration options.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: A human-readable description of a fleet.
    --fleet-id=!: A unique identifier for the fleet to update attribute metadata for.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --metric-groups=:
        description: The name of a metric group to add this fleet to.
        nargs: -1
    --name=: A descriptive label that is associated with a fleet.
    --new-game-session-protection-policy=: The game session protection policy to apply to all new game sessions created in this fleet.
    --resource-creation-limit-policy=: Policy settings that limit the number of game sessions an individual player can create over a span of time.
completion:
    flag:
        new-game-session-protection-policy:
            - NoProtection
            - FullProtection
documentation:
    command: |-
        **This API works with the following fleet types:** EC2, Anywhere, Container

        Updates a fleet's mutable attributes, such as game session protection and resource creation limits.

        To update fleet attributes, specify the fleet ID and the property values that you want to change. If successful, Amazon GameLift Servers returns the identifiers for the updated fleet.

        A managed fleet's runtime environment, which depends on the fleet's Amazon Machine Image {AMI} version, can't be updated. You must create a new fleet. As a best practice, we recommend replacing your managed fleets every 30 days to maintain a secure and up-to-date runtime environment for your hosted game servers. For guidance, see [Security best practices for Amazon GameLift Servers](https://docs.aws.amazon.com/gameliftservers/latest/developerguide/security-best-practices.html).

        **Learn more**

        [Setting up Amazon GameLift Servers fleets](https://docs.aws.amazon.com/gamelift/latest/developerguide/fleets-intro.html)
    flag:
        anywhere-configuration: Amazon GameLift Servers Anywhere configuration options.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: A human-readable description of a fleet.
        fleet-id: A unique identifier for the fleet to update attribute metadata for. You can use either the fleet ID or ARN value.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        metric-groups: The name of a metric group to add this fleet to. Use a metric group in Amazon CloudWatch to aggregate the metrics from multiple fleets. Provide an existing metric group name, or create a new metric group by providing a new name. A fleet can only be in one metric group at a time.
        name: A descriptive label that is associated with a fleet. Fleet names do not need to be unique.
        new-game-session-protection-policy: |-
            The game session protection policy to apply to all new game sessions created in this fleet. Game sessions that already exist are not affected. You can set protection for individual game sessions using [UpdateGameSession](https://docs.aws.amazon.com/gamelift/latest/apireference/API_UpdateGameSession.html) .

            - **NoProtection** -- The game session can be terminated during a scale-down event.
            - **FullProtection** -- If the game session is in an `ACTIVE` status, it cannot be terminated during a scale-down event.
        resource-creation-limit-policy: Policy settings that limit the number of game sessions an individual player can create over a span of time.
