name: lease
description: '*(ALPHA)*  Leases a list of tasks and displays them.'
flags:
    --filter=: Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
    --lease-duration=!: The number of seconds for the desired new lease duration for all tasks
    --limit=: The maximum number of tasks to lease.
    --location=: The location where we want to manage the queue or task.
    --no-oldest-tag&: Only lease tasks which have the same tag as the task with the oldest
    --no-uri&: Print a list of resource URIs instead of the default output, and change the
    --oldest-tag: Only lease tasks which have the same tag as the task with the oldest
    --queue=!: The queue the tasks belong to.
    --sort-by=: Comma-separated list of resource field key names to sort by.
    --tag=: A tag to filter each task to be leased.
    --uri: Print a list of resource URIs instead of the default output, and change the
documentation:
    command: |-
        *(ALPHA)*  Each task returned from this command will have its schedule time changed
        based on the lease duration specified. A task that has been returned by
        calling this command will not be returned in a different call before its
        schedule time. After the work associated with a task is finished, the lease
        holder should call `gcloud tasks acknowledge` on the task.
    flag:
        filter: |-
            Apply a Boolean filter _EXPRESSION_ to each resource item to be listed.
            If the expression evaluates `True`, then that item is listed. For more
            details and examples of filter expressions, run $ gcloud topic filters. This
            flag interacts with other flags that are applied in this order: *--flatten*,
            *--sort-by*, *--filter*, *--limit*.
        lease-duration: |-
            The number of seconds for the desired new lease duration for all tasks
            leased, starting from now. The maximum lease duration is 1 week.
        limit: |-
            The maximum number of tasks to lease. The maximum that can be requested is
            1000.
        location: The location where we want to manage the queue or task. If not specified, uses the location of the current project's App Engine app if there is an associated app.
        no-oldest-tag: |
            Only lease tasks which have the same tag as the task with the oldest
            schedule time.
        no-uri: |
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
        oldest-tag: |-
            Only lease tasks which have the same tag as the task with the oldest
            schedule time.
        queue: The queue the tasks belong to.
        sort-by: |-
            Comma-separated list of resource field key names to sort by. The
            default order is ascending. Prefix a field with ``~'' for descending
            order on that field. This flag interacts with other flags that are applied
            in this order: *--flatten*, *--sort-by*, *--filter*, *--limit*.
        tag: |-
            A tag to filter each task to be leased. If a task has the tag and the
            task is available to be leased, then it is listed and leased.
        uri: |-
            Print a list of resource URIs instead of the default output, and change the
            command output to a list of URIs. If this flag is used with *--format*,
            the formatting is applied on this URI list. To display URIs alongside other
            keys instead, use the *uri()* transform.
