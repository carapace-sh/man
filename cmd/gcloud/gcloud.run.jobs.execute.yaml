name: execute
description: Execute a job.
flags:
    --args=: Comma-separated arguments passed to the command run by the container image.
    --async: Return immediately, without waiting for the operation in progress to
    --container=: Specifies a container by name.
    --no-async&: Return immediately, without waiting for the operation in progress to
    --no-wait&: Wait until the execution has completed running before exiting.
    --region=: Region in which the resource can be found.
    --task-timeout=: The existing maximum time (deadline) a job task attempt can run for.
    --tasks=: Number of tasks that must run to completion for the execution to be considered done.
    --update-env-vars=: List of key-value pairs to set as environment variables overrides for an execution of a job.
    --wait: Wait until the execution has completed running before exiting.
documentation:
    command: |
        Execute a job.
    flag:
        args: Comma-separated arguments passed to the command run by the container image. If provided, an execution will be created with the input values. Otherwise, the existing arguments of the job are used.
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        container: |-
            Specifies a container by name. Flags following --container will apply to the specified container.
            +
            Flags that are not container-specific must be specified before --container.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        no-wait: Wait until the execution has completed running before exiting. If not set, gcloud exits successfully when the execution has started.
        region: Region in which the resource can be found. Alternatively, set the property [run/region].
        task-timeout: The existing maximum time (deadline) a job task attempt can run for. If provided, an execution will be created with this value. Otherwise existing maximum time of the job is used. In the case of retries, this deadline applies to each attempt of a task. If the task attempt does not complete within this time, it will be killed. It is specified as a duration; for example, "10m5s" is ten minutes, and five seconds. If you don't specify a unit, seconds is assumed. For example, "10" is 10 seconds.
        tasks: Number of tasks that must run to completion for the execution to be considered done. If provided, an execution will be created with this value. Otherwise the existing task count of the job is used.
        update-env-vars: List of key-value pairs to set as environment variables overrides for an execution of a job. If provided, an execution will be created with the merge result of the input values and the existing environment variables. New value overrides existing value if they have the same key. If not provided, existing environment variables are used.
        wait: Wait until the execution has completed running before exiting. If not set, gcloud exits successfully when the execution has started.
