name: create-long-term-pricing
description: Creates a job with the long-term usage option for a device.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --is-long-term-pricing-auto-renew: Specifies whether the current long-term pricing type for the device should be renewed.
    --long-term-pricing-type=!: The type of long-term pricing option you want for the device, either 1-year or 3-year long-term pricing.
    --no-is-long-term-pricing-auto-renew: Specifies whether the current long-term pricing type for the device should be renewed.
    --snowball-type=!: The type of Snow Family devices to use for the long-term pricing job.
completion:
    flag:
        long-term-pricing-type:
            - OneYear
            - ThreeYear
            - OneMonth
        snowball-type:
            - STANDARD
            - EDGE
            - EDGE_C
            - EDGE_CG
            - EDGE_S
            - SNC1_HDD
            - SNC1_SSD
            - V3_5C
            - V3_5S
            - RACK_5U_C
documentation:
    command: Creates a job with the long-term usage option for a device. The long-term usage is a 1-year or 3-year long-term pricing type for the device. You are billed upfront, and Amazon Web Services provides discounts for long-term pricing.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        is-long-term-pricing-auto-renew: Specifies whether the current long-term pricing type for the device should be renewed.
        long-term-pricing-type: The type of long-term pricing option you want for the device, either 1-year or 3-year long-term pricing.
        snowball-type: The type of Snow Family devices to use for the long-term pricing job.
