name: associate-entity-to-thing
description: Associates a device with a concrete thing that is in the user's registry.
flags:
    --entity-id=!: The ID of the device to be associated with the thing.
    --namespace-version=: The version of the user's namespace.
    --thing-name=!: The name of the thing to which the entity is to be associated.
documentation:
    command: |-
        Associates a device with a concrete thing that is in the user's registry.

        A thing can be associated with only one device at a time. If you associate a thing with a new device id, its previous association will be removed.
    flag:
        entity-id: |-
            The ID of the device to be associated with the thing.

            The ID should be in the following format.

            `urn:tdm:REGION/ACCOUNT ID/default:device:DEVICENAME`
        namespace-version: The version of the user's namespace. Defaults to the latest version of the user's namespace.
        thing-name: The name of the thing to which the entity is to be associated.
