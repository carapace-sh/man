name: create-graph-using-import-task
description: Creates a new Neptune Analytics graph and imports data into it, either from Amazon Simple Storage Service (S3) or from a Neptune database or a Neptune database snapshot.
flags:
    --blank-node-handling=: The method to handle blank nodes in the dataset.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --deletion-protection: Indicates whether or not to enable deletion protection on the graph.
    --fail-on-error: If set to `true`, the task halts when an import error is encountered.
    --format=: Specifies the format of S3 data to be imported.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --graph-name=!: A name for the new Neptune Analytics graph to be created.
    --import-options=: Contains options for controlling the import process.
    --kms-key-identifier=: Specifies a KMS key to use to encrypt data imported into the new graph.
    --max-provisioned-memory=: The maximum provisioned memory-optimized Neptune Capacity Units (m-NCUs) to use for the graph.
    --min-provisioned-memory=: The minimum provisioned memory-optimized Neptune Capacity Units (m-NCUs) to use for the graph.
    --no-deletion-protection: Indicates whether or not to enable deletion protection on the graph.
    --no-fail-on-error: If set to `true`, the task halts when an import error is encountered.
    --no-public-connectivity: Specifies whether or not the graph can be reachable over the internet.
    --parquet-type=: The parquet type of the import task.
    --public-connectivity: Specifies whether or not the graph can be reachable over the internet.
    --replica-count=: The number of replicas in other AZs to provision on the new graph after import.
    --role-arn=!: The ARN of the IAM role that will allow access to the data that is to be imported.
    --source=!: A URL identifying to the location of the data to be imported.
    --tags=: Adds metadata tags to the new graph.
    --vector-search-configuration=: Specifies the number of dimensions for vector embeddings that will be loaded into the graph.
completion:
    flag:
        blank-node-handling:
            - convertToIri
        format:
            - CSV
            - OPEN_CYPHER
            - PARQUET
            - NTRIPLES
        parquet-type:
            - COLUMNAR
documentation:
    command: |-
        Creates a new Neptune Analytics graph and imports data into it, either from Amazon Simple Storage Service (S3) or from a Neptune database or a Neptune database snapshot.

        The data can be loaded from files in S3 that in either the [Gremlin CSV format](https://docs.aws.amazon.com/neptune/latest/userguide/bulk-load-tutorial-format-gremlin.html) or the [openCypher load format](https://docs.aws.amazon.com/neptune/latest/userguide/bulk-load-tutorial-format-opencypher.html).
    flag:
        blank-node-handling: The method to handle blank nodes in the dataset. Currently, only `convertToIri` is supported, meaning blank nodes are converted to unique IRIs at load time. Must be provided when format is `ntriples`. For more information, see [Handling RDF values](https://docs.aws.amazon.com/neptune-analytics/latest/userguide/using-rdf-data.html#rdf-handling).
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        deletion-protection: Indicates whether or not to enable deletion protection on the graph. The graph can’t be deleted when deletion protection is enabled. (`true` or `false`).
        fail-on-error: If set to `true`, the task halts when an import error is encountered. If set to `false`, the task skips the data that caused the error and continues if possible.
        format: Specifies the format of S3 data to be imported. Valid values are `CSV`, which identifies the [Gremlin CSV format](https://docs.aws.amazon.com/neptune/latest/userguide/bulk-load-tutorial-format-gremlin.html), `OPEN_CYPHER`, which identifies the [openCypher load format](https://docs.aws.amazon.com/neptune/latest/userguide/bulk-load-tutorial-format-opencypher.html), or `ntriples`, which identifies the [RDF n-triples](https://docs.aws.amazon.com/neptune-analytics/latest/userguide/using-rdf-data.html) format.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        graph-name: |-
            A name for the new Neptune Analytics graph to be created.

            The name must contain from 1 to 63 letters, numbers, or hyphens, and its first character must be a letter. It cannot end with a hyphen or contain two consecutive hyphens. Only lowercase letters are allowed.
        import-options: Contains options for controlling the import process. For example, if the `failOnError` key is set to `false`, the import skips problem data and attempts to continue (whereas if set to `true`, the default, or if omitted, the import operation halts immediately when an error is encountered.
        kms-key-identifier: Specifies a KMS key to use to encrypt data imported into the new graph.
        max-provisioned-memory: |-
            The maximum provisioned memory-optimized Neptune Capacity Units (m-NCUs) to use for the graph. Default: 1024, or the approved upper limit for your account.

            If both the minimum and maximum values are specified, the final `provisioned-memory` will be chosen per the actual size of your imported data. If neither value is specified, 128 m-NCUs are used.
        min-provisioned-memory: 'The minimum provisioned memory-optimized Neptune Capacity Units (m-NCUs) to use for the graph. Default: 16'
        parquet-type: The parquet type of the import task.
        public-connectivity: Specifies whether or not the graph can be reachable over the internet. All access to graphs is IAM authenticated. (`true` to enable, or `false` to disable).
        replica-count: |-
            The number of replicas in other AZs to provision on the new graph after import. Default = 0, Min = 0, Max = 2.

            Additional charges equivalent to the m-NCUs selected for the graph apply for each replica.
        role-arn: The ARN of the IAM role that will allow access to the data that is to be imported.
        source: A URL identifying to the location of the data to be imported. This can be an Amazon S3 path, or can point to a Neptune database endpoint or snapshot.
        tags: Adds metadata tags to the new graph. These tags can also be used with cost allocation reporting, or used in a Condition statement in an IAM policy.
        vector-search-configuration: Specifies the number of dimensions for vector embeddings that will be loaded into the graph. The value is specified as `dimension=`value. Max = 65,535
