name: lookup
description: Lookup a Datastream stream object.
flags:
    --location=: The Cloud location for the stream.
    --mysql-database=!: Mysql database for the object.
    --mysql-table=!: Mysql table for the object.
    --oracle-schema=!: Oracle schema for the object.
    --oracle-table=!: Oracle table for the object.
    --postgresql-schema=!: PostgreSQL schema for the object.
    --postgresql-table=!: PostgreSQL table for the object.
    --salesforce-object-name=!: Salesforce object name.
    --sqlserver-schema=!: SQL Server schema for the object.
    --sqlserver-table=!: SQL Server table for the object.
    --stream=!: ID of the stream or fully qualified identifier for the stream.
documentation:
    command: Lookup a stream object by its source object identifier (e.g. schema.table)
    flag:
        location: |-
            The Cloud location for the stream.
            +
            To set the `location` attribute:
            * provide the argument `--stream` on the command line with a fully specified name;
            * provide the argument `--location` on the command line.
        mysql-database: Mysql database for the object.
        mysql-table: Mysql table for the object.
        oracle-schema: Oracle schema for the object.
        oracle-table: Oracle table for the object.
        postgresql-schema: PostgreSQL schema for the object.
        postgresql-table: PostgreSQL table for the object.
        salesforce-object-name: Salesforce object name.
        sqlserver-schema: SQL Server schema for the object.
        sqlserver-table: SQL Server table for the object.
        stream: |-
            ID of the stream or fully qualified identifier for the stream.
            +
            To set the `stream` attribute:
            * provide the argument `--stream` on the command line.
