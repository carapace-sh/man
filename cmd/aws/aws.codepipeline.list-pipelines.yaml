name: list-pipelines
description: Gets a summary of all of the pipelines associated with your account.
flags:
    --max-results=: The maximum number of pipelines to return in a single call.
    --next-token=: An identifier that was returned from the previous list pipelines call.
documentation:
    command: Gets a summary of all of the pipelines associated with your account.
    flag:
        max-results: The maximum number of pipelines to return in a single call. To retrieve the remaining pipelines, make another call with the returned nextToken value. The minimum value you can specify is 1. The maximum accepted value is 1000.
        next-token: An identifier that was returned from the previous list pipelines call. It can be used to return the next set of pipelines in the list.
