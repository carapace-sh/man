name: delete-all
description: '*(ALPHA)*  Deletes all Products in a ProductSet or all Products that are in no ProductSet.'
flags:
    --force: If specified, user will not be prompted and all the products in specified set will
    --no-force&: If specified, user will not be prompted and all the products in specified set will
    --no-orphan-products&: Delete all Products that are in no ProductSet.
    --orphan-products: Delete all Products that are in no ProductSet.
    --product-set=: Delete all Products that are in a ProductSet.
documentation:
    command: '*(ALPHA)*  Deletes all Products in a ProductSet or all Products that are in no ProductSet.'
    flag:
        force: |-
            If specified, user will not be prompted and all the products in specified set will
            be deleted. If not specified, user will be prompted to continue the delete.
        no-force: |
            If specified, user will not be prompted and all the products in specified set will
            be deleted. If not specified, user will be prompted to continue the delete.
        no-orphan-products: |
            Delete all Products that are in no ProductSet.
        orphan-products: Delete all Products that are in no ProductSet.
        product-set: |-
            Delete all Products that are in a ProductSet. Even if the Product is in multiple
            ProductSets, the Product is still deleted.
