name: create-monitoring-schedule
description: Creates a schedule that regularly starts Amazon SageMaker AI Processing Jobs to monitor the data captured for an Amazon SageMaker AI Endpoint.
flags:
    --monitoring-schedule-config=!: The configuration object that specifies the monitoring schedule and defines the monitoring job.
    --monitoring-schedule-name=!: The name of the monitoring schedule.
    --tags=: (Optional) An array of key-value pairs.
documentation:
    command: Creates a schedule that regularly starts Amazon SageMaker AI Processing Jobs to monitor the data captured for an Amazon SageMaker AI Endpoint.
    flag:
        monitoring-schedule-config: The configuration object that specifies the monitoring schedule and defines the monitoring job.
        monitoring-schedule-name: The name of the monitoring schedule. The name must be unique within an Amazon Web Services Region within an Amazon Web Services account.
        tags: (Optional) An array of key-value pairs. For more information, see [Using Cost Allocation Tags](https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-alloc-tags.html#allocation-whatURL) in the *Amazon Web Services Billing and Cost Management User Guide*.
