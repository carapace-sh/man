name: create-data-product
description: Creates a data product.
flags:
    --client-token=: A unique, case-sensitive identifier that is provided to ensure the idempotency of the request.
    --description=: The description of the data product.
    --domain-identifier=!: The ID of the domain where the data product is created.
    --forms-input=: The metadata forms of the data product.
    --glossary-terms=: The glossary terms of the data product.
    --items=: The data assets of the data product.
    --name=!: The name of the data product.
    --owning-project-identifier=!: The ID of the owning project of the data product.
documentation:
    command: |-
        Creates a data product.

        A data product is a comprehensive package that combines data assets with their associated metadata, documentation, and access controls. It's designed to serve specific business needs or use cases, making it easier for users to find and consume data appropriately. Data products include important information about data quality, freshness, and usage guidelines, effectively bridging the gap between data producers and consumers while ensuring proper governance.

        Prerequisites:

        - The domain must exist and be accessible.
        - The owning project must be valid and active.
        - The name must be unique within the domain (no existing data product with the same name).
        - User must have create permissions for data products in the project.
    flag:
        client-token: A unique, case-sensitive identifier that is provided to ensure the idempotency of the request.
        description: The description of the data product.
        domain-identifier: The ID of the domain where the data product is created.
        forms-input: The metadata forms of the data product.
        glossary-terms: The glossary terms of the data product.
        items: The data assets of the data product.
        name: The name of the data product.
        owning-project-identifier: The ID of the owning project of the data product.
