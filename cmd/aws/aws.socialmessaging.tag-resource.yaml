name: tag-resource
description: Adds or overwrites only the specified tags for the specified resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) of the resource to tag.
    --tags=!: The tags to add to the resource.
documentation:
    command: Adds or overwrites only the specified tags for the specified resource. When you specify an existing tag key, the value is overwritten with the new value.
    flag:
        resource-arn: The Amazon Resource Name (ARN) of the resource to tag.
        tags: The tags to add to the resource.
