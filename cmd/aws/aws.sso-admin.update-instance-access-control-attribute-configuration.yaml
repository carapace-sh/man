name: update-instance-access-control-attribute-configuration
description: Updates the IAM Identity Center identity store attributes that you can use with the IAM Identity Center instance for attributes-based access control (ABAC).
flags:
    --instance-access-control-attribute-configuration=!: Updates the attributes for your ABAC configuration.
    --instance-arn=!: The ARN of the IAM Identity Center instance under which the operation will be executed.
documentation:
    command: Updates the IAM Identity Center identity store attributes that you can use with the IAM Identity Center instance for attributes-based access control (ABAC). When using an external identity provider as an identity source, you can pass attributes through the SAML assertion as an alternative to configuring attributes from the IAM Identity Center identity store. If a SAML assertion passes any of these attributes, IAM Identity Center replaces the attribute value with the value from the IAM Identity Center identity store. For more information about ABAC, see [Attribute-Based Access Control](/singlesignon/latest/userguide/abac.html) in the *IAM Identity Center User Guide*.
    flag:
        instance-access-control-attribute-configuration: Updates the attributes for your ABAC configuration.
        instance-arn: The ARN of the IAM Identity Center instance under which the operation will be executed.
