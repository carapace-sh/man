name: list-privacy-budget-templates
description: Returns detailed information about the privacy budget templates in a specified membership.
flags:
    --max-results=: The maximum number of results that are returned for an API request call.
    --membership-identifier=!: A unique identifier for one of your memberships for a collaboration.
    --next-token=: The pagination token that's used to fetch the next set of results.
documentation:
    command: Returns detailed information about the privacy budget templates in a specified membership.
    flag:
        max-results: The maximum number of results that are returned for an API request call. The service chooses a default number if you don't set one. The service might return a \`nextToken\` even if the \`maxResults\` value has not been met.
        membership-identifier: A unique identifier for one of your memberships for a collaboration. The privacy budget templates are retrieved from the collaboration that this membership belongs to. Accepts a membership ID.
        next-token: The pagination token that's used to fetch the next set of results.
