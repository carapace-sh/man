name: create-artifact
description: Creates an *artifact*.
flags:
    --artifact-name=: The name of the artifact.
    --artifact-type=!: The artifact type.
    --metadata-properties=: ""
    --properties=: A list of properties to add to the artifact.
    --source=!: The ID, ID type, and URI of the source.
    --tags=: A list of tags to apply to the artifact.
documentation:
    command: Creates an *artifact*. An artifact is a lineage tracking entity that represents a URI addressable object or data. Some examples are the S3 URI of a dataset and the ECR registry path of an image. For more information, see [Amazon SageMaker ML Lineage Tracking](https://docs.aws.amazon.com/sagemaker/latest/dg/lineage-tracking.html).
    flag:
        artifact-name: The name of the artifact. Must be unique to your account in an Amazon Web Services Region.
        artifact-type: The artifact type.
        metadata-properties: ""
        properties: A list of properties to add to the artifact.
        source: The ID, ID type, and URI of the source.
        tags: A list of tags to apply to the artifact.
