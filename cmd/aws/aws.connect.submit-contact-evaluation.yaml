name: submit-contact-evaluation
description: Submits a contact evaluation in the specified Amazon Connect instance.
flags:
    --answers=: A map of question identifiers to answer value.
    --evaluation-id=!: A unique identifier for the contact evaluation.
    --instance-id=!: The identifier of the Amazon Connect instance.
    --notes=: A map of question identifiers to note value.
    --submitted-by=: The ID of the user who submitted the contact evaluation.
documentation:
    command: |-
        Submits a contact evaluation in the specified Amazon Connect instance. Answers included in the request are merged with existing answers for the given evaluation. If no answers or notes are passed, the evaluation is submitted with the existing answers and notes. You can delete an answer or note by passing an empty object (`{}`) to the question identifier.

        If a contact evaluation is already in submitted state, this operation will trigger a resubmission.
    flag:
        answers: A map of question identifiers to answer value.
        evaluation-id: A unique identifier for the contact evaluation.
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        notes: A map of question identifiers to note value.
        submitted-by: The ID of the user who submitted the contact evaluation.
