name: register-workflow-type
description: Registers a new *workflow type* and its configuration settings in the specified domain.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --default-child-policy=: If set, specifies the default policy to use for the child workflow executions when a workflow execution of this type is terminated, by calling the [TerminateWorkflowExecution]() action explicitly or due to an expired timeout.
    --default-execution-start-to-close-timeout=: If set, specifies the default maximum duration for executions of this workflow type.
    --default-lambda-role=: The default IAM role attached to this workflow type.
    --default-task-list=: If set, specifies the default task list to use for scheduling decision tasks for executions of this workflow type.
    --default-task-priority=: The default task priority to assign to the workflow type.
    --default-task-start-to-close-timeout=: If set, specifies the default maximum duration of decision tasks for this workflow type.
    --description=: Textual description of the workflow type.
    --domain=!: The name of the domain in which to register the workflow type.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=!: The name of the workflow type.
    --version=!: The version of the workflow type.
completion:
    flag:
        default-child-policy:
            - TERMINATE
            - REQUEST_CANCEL
            - ABANDON
documentation:
    command: "Registers a new *workflow type* and its configuration settings in the specified domain.\n\nThe retention period for the workflow history is set by the [RegisterDomain]() action.\n\nIf the type already exists, then a `TypeAlreadyExists` fault is returned. You cannot change the configuration settings of a workflow type once it is registered and it must be registered as a new version.\n\n**Access Control**\n\nYou can use IAM policies to control this action's access to Amazon SWF resources as follows:\n\n- Use a `Resource` element with the domain name to limit the action to only specified domains.\n- Use an `Action` element to allow or deny permission to call this action.\n- Constrain the following parameters by using a `Condition` element with the appropriate keys.\n  \n  - `defaultTaskList.name`: String constraint. The key is `swf:defaultTaskList.name`.\n  - `name`: String constraint. The key is `swf:name`.\n  - `version`: String constraint. The key is `swf:version`.\n\nIf the caller doesn't have sufficient permissions to invoke the action, or the parameter values fall outside the specified constraints, the action fails. The associated event attribute's `cause` parameter is set to `OPERATION_NOT_PERMITTED`. For details and example IAM policies, see [Using IAM to Manage Access to Amazon SWF Workflows](https://docs.aws.amazon.com/amazonswf/latest/developerguide/swf-dev-iam.html) in the *Amazon SWF Developer Guide*."
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        default-child-policy: |-
            If set, specifies the default policy to use for the child workflow executions when a workflow execution of this type is terminated, by calling the [TerminateWorkflowExecution]() action explicitly or due to an expired timeout. This default can be overridden when starting a workflow execution using the [StartWorkflowExecution]() action or the `StartChildWorkflowExecution` [Decision]().

            The supported child policies are:

            - `TERMINATE` – The child executions are terminated.
            - `REQUEST_CANCEL` – A request to cancel is attempted for each child execution by recording a `WorkflowExecutionCancelRequested` event in its history. It is up to the decider to take appropriate actions when it receives an execution history with this event.
            - `ABANDON` – No action is taken. The child executions continue to run.
        default-execution-start-to-close-timeout: |-
            If set, specifies the default maximum duration for executions of this workflow type. You can override this default when starting an execution through the [StartWorkflowExecution]() Action or `StartChildWorkflowExecution` [Decision]().

            The duration is specified in seconds; an integer greater than or equal to 0. Unlike some of the other timeout parameters in Amazon SWF, you cannot specify a value of "NONE" for `defaultExecutionStartToCloseTimeout`; there is a one-year max limit on the time that a workflow execution can run. Exceeding this limit always causes the workflow execution to time out.
        default-lambda-role: |-
            The default IAM role attached to this workflow type.

            Executions of this workflow type need IAM roles to invoke Lambda functions. If you don't specify an IAM role when you start this workflow type, the default Lambda role is attached to the execution. For more information, see [https://docs.aws.amazon.com/amazonswf/latest/developerguide/lambda-task.html](https://docs.aws.amazon.com/amazonswf/latest/developerguide/lambda-task.html) in the *Amazon SWF Developer Guide*.
        default-task-list: If set, specifies the default task list to use for scheduling decision tasks for executions of this workflow type. This default is used only if a task list isn't provided when starting the execution through the [StartWorkflowExecution]() Action or `StartChildWorkflowExecution` [Decision]().
        default-task-priority: |-
            The default task priority to assign to the workflow type. If not assigned, then `0` is used. Valid values are integers that range from Java's `Integer.MIN_VALUE` (-2147483648) to `Integer.MAX_VALUE` (2147483647). Higher numbers indicate higher priority.

            For more information about setting task priority, see [Setting Task Priority](https://docs.aws.amazon.com/amazonswf/latest/developerguide/programming-priority.html) in the *Amazon SWF Developer Guide*.
        default-task-start-to-close-timeout: |-
            If set, specifies the default maximum duration of decision tasks for this workflow type. This default can be overridden when starting a workflow execution using the [StartWorkflowExecution]() action or the `StartChildWorkflowExecution` [Decision]().

            The duration is specified in seconds, an integer greater than or equal to `0`. You can use `NONE` to specify unlimited duration.
        description: Textual description of the workflow type.
        domain: The name of the domain in which to register the workflow type.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: |-
            The name of the workflow type.

            The specified string must not contain a `:` (colon), `/` (slash), `|` (vertical bar), or any control characters (`\u0000-\u001f` | `\u007f-\u009f`). Also, it must *not* be the literal string `arn`.
        version: |-
            The version of the workflow type.

            The workflow type consists of the name and version, the combination of which must be unique within the domain. To get a list of all currently registered workflow types, use the [ListWorkflowTypes]() action.

            The specified string must not contain a `:` (colon), `/` (slash), `|` (vertical bar), or any control characters (`\u0000-\u001f` | `\u007f-\u009f`). Also, it must *not* be the literal string `arn`.
