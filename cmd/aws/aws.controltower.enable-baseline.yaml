name: enable-baseline
description: Enable (apply) a `Baseline` to a Target.
flags:
    --baseline-identifier=!: The ARN of the baseline to be enabled.
    --baseline-version=!: The specific version to be enabled of the specified baseline.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --parameters=: A list of `key-value` objects that specify enablement parameters, where `key` is a string and `value` is a document of any type.
    --tags=: Tags associated with input to `EnableBaseline`.
    --target-identifier=!: The ARN of the target on which the baseline will be enabled.
documentation:
    command: Enable (apply) a `Baseline` to a Target. This API starts an asynchronous operation to deploy resources specified by the `Baseline` to the specified Target. For usage examples, see [*the Amazon Web Services Control Tower User Guide*](https://docs.aws.amazon.com/controltower/latest/userguide/baseline-api-examples.html) .
    flag:
        baseline-identifier: The ARN of the baseline to be enabled.
        baseline-version: The specific version to be enabled of the specified baseline.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        parameters: A list of `key-value` objects that specify enablement parameters, where `key` is a string and `value` is a document of any type.
        tags: Tags associated with input to `EnableBaseline`.
        target-identifier: The ARN of the target on which the baseline will be enabled. Only OUs are supported as targets.
