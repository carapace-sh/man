name: revoke-cache-security-group-ingress
description: Revokes ingress from a cache security group.
flags:
    --cache-security-group-name=!: The name of the cache security group to revoke ingress from.
    --ec2-security-group-name=!: The name of the Amazon EC2 security group to revoke access from.
    --ec2-security-group-owner-id=!: The Amazon account number of the Amazon EC2 security group owner.
documentation:
    command: Revokes ingress from a cache security group. Use this operation to disallow access from an Amazon EC2 security group that had been previously authorized.
    flag:
        cache-security-group-name: The name of the cache security group to revoke ingress from.
        ec2-security-group-name: The name of the Amazon EC2 security group to revoke access from.
        ec2-security-group-owner-id: The Amazon account number of the Amazon EC2 security group owner. Note that this is not the same thing as an Amazon access key ID - you must provide a valid Amazon account number for this parameter.
