name: mac-sign
description: '*(BETA)*  Sign a user input file using a MAC key version.'
flags:
    --input-file=!: Path to the input file to sign.
    --key=: to use for signing.
    --keyring=: Key ring of the key.
    --location=: Location of the keyring.
    --no-skip-integrity-verification&: Skip integrity verification on request and response API fields.
    --signature-file=!: Path to the signature file to output.
    --skip-integrity-verification: Skip integrity verification on request and response API fields.
documentation:
    command: |-
        *(BETA)*  Creates a digital signature of the input file using the provided
        MAC signing key version and saves the base64 encoded signature.

        The required flag `signature-file` indicates the path to store signature.

        By default, the command performs integrity verification on data sent to and
        received from Cloud KMS. Use --skip-integrity-verification to disable
        integrity verification.

        ## EXAMPLES
        The following command will read the file '/tmp/my/file.to.sign', and sign it
        using the symmetric MAC CryptoKey `dont-panic` Version 3, and save the
        signature in base64 format to '/tmp/my/signature'.

          $ gcloud beta kms mac-sign \
          --location=us-central1 \
          --keyring=hitchhiker \
          --key=dont-panic \
          --version=3 \
          --input-file=/tmp/my/file.to.sign \
          --signature-file=/tmp/my/signature
    flag:
        input-file: Path to the input file to sign.
        key: to use for signing.
        keyring: Key ring of the key.
        location: Location of the keyring.
        no-skip-integrity-verification: Skip integrity verification on request and response API fields.
        signature-file: Path to the signature file to output.
        skip-integrity-verification: Skip integrity verification on request and response API fields.
