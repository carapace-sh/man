name: approve-assignment
description: The `ApproveAssignment` operation approves the results of a completed assignment.
flags:
    --assignment-id=!: The ID of the assignment.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --no-override-rejection: A flag indicating that an assignment should be approved even if it was previously rejected.
    --override-rejection: A flag indicating that an assignment should be approved even if it was previously rejected.
    --requester-feedback=: A message for the Worker, which the Worker can see in the Status section of the web site.
documentation:
    command: |-
        The `ApproveAssignment` operation approves the results of a completed assignment.

        Approving an assignment initiates two payments from the Requester's Amazon.com account

        - The Worker who submitted the results is paid the reward specified in the HIT.
        - Amazon Mechanical Turk fees are debited.

        If the Requester's account does not have adequate funds for these payments, the call to ApproveAssignment returns an exception, and the approval is not processed. You can include an optional feedback message with the approval, which the Worker can see in the Status section of the web site.

        You can also call this operation for assignments that were previous rejected and approve them by explicitly overriding the previous rejection. This only works on rejected assignments that were submitted within the previous 30 days and only if the assignment's related HIT has not been deleted.
    flag:
        assignment-id: The ID of the assignment. The assignment must correspond to a HIT created by the Requester.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        override-rejection: A flag indicating that an assignment should be approved even if it was previously rejected. Defaults to `False`.
        requester-feedback: A message for the Worker, which the Worker can see in the Status section of the web site.
