name: tag-resource
description: Use to add one or more tags to an existing scan.
flags:
    --resource-arn=!: The ARN of the `ScanName` object.
    --tags=!: An array of key-value pairs used to tag an existing scan.
documentation:
    command: Use to add one or more tags to an existing scan.
    flag:
        resource-arn: The ARN of the `ScanName` object. You can retrieve this ARN by calling `CreateScan`, `ListScans`, or `GetScan`.
        tags: |-
            An array of key-value pairs used to tag an existing scan. A tag is a custom attribute label with two parts:

            - A tag key. For example, `CostCenter`, `Environment`, or `Secret`. Tag keys are case sensitive.
            - An optional tag value field. For example, `111122223333`, `Production`, or a team name. Omitting the tag value is the same as using an empty string. Tag values are case sensitive.
