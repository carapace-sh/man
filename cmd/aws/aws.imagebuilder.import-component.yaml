name: import-component
description: Imports a component and transforms its data into a component document.
flags:
    --change-description=: The change description of the component.
    --client-token=!: Unique, case-sensitive identifier you provide to ensure idempotency of the request.
    --data=: The data of the component.
    --description=: The description of the component.
    --format=!: The format of the resource that you want to import as a component.
    --kms-key-id=: The Amazon Resource Name (ARN) that uniquely identifies the KMS key used to encrypt this component.
    --name=!: The name of the component.
    --platform=!: The platform of the component.
    --semantic-version=!: The semantic version of the component.
    --tags=: The tags of the component.
    --type=!: The type of the component denotes whether the component is used to build the image, or only to test it.
    --uri=: The uri of the component.
completion:
    flag:
        format:
            - SHELL
        platform:
            - Windows
            - Linux
            - macOS
        type:
            - BUILD
            - TEST
documentation:
    command: Imports a component and transforms its data into a component document.
    flag:
        change-description: The change description of the component. This description indicates the change that has been made in this version, or what makes this version different from other versions of the component.
        client-token: Unique, case-sensitive identifier you provide to ensure idempotency of the request. For more information, see [Ensuring idempotency](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/Run_Instance_Idempotency.html) in the *Amazon EC2 API Reference*.
        data: The data of the component. Used to specify the data inline. Either `data` or `uri` can be used to specify the data within the component.
        description: The description of the component. Describes the contents of the component.
        format: The format of the resource that you want to import as a component.
        kms-key-id: The Amazon Resource Name (ARN) that uniquely identifies the KMS key used to encrypt this component. This can be either the Key ARN or the Alias ARN. For more information, see [Key identifiers (KeyId)](https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html#key-id-key-ARN) in the *Key Management Service Developer Guide*.
        name: The name of the component.
        platform: The platform of the component.
        semantic-version: |-
            The semantic version of the component. This version follows the semantic version syntax.

            The semantic version has four nodes: &lt;major&gt;.&lt;minor&gt;.&lt;patch&gt;/&lt;build&gt;. You can assign values for the first three, and can filter on all of them.

            **Filtering:** With semantic versioning, you have the flexibility to use wildcards (x) to specify the most recent versions or nodes when selecting the base image or components for your recipe. When you use a wildcard in any node, all nodes to the right of the first wildcard must also be wildcards.
        tags: The tags of the component.
        type: The type of the component denotes whether the component is used to build the image, or only to test it.
        uri: The uri of the component. Must be an Amazon S3 URL and the requester must have permission to access the Amazon S3 bucket. If you use Amazon S3, you can specify component content up to your service quota. Either `data` or `uri` can be used to specify the data within the component.
