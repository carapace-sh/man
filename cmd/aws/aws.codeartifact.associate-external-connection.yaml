name: associate-external-connection
description: Adds an existing external connection to a repository.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --domain-owner=: The 12-digit account number of the Amazon Web Services account that owns the domain.
    --domain=!: The name of the domain that contains the repository.
    --external-connection=!: The name of the external connection to add to the repository.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --repository=!: The name of the repository to which the external connection is added.
documentation:
    command: |-
        Adds an existing external connection to a repository. One external connection is allowed per repository.

        A repository can have one or more upstream repositories, or an external connection.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        domain: The name of the domain that contains the repository.
        domain-owner: The 12-digit account number of the Amazon Web Services account that owns the domain. It does not include dashes or spaces.
        external-connection: |-
            The name of the external connection to add to the repository. The following values are supported:

            - `public:npmjs` - for the npm public repository.
            - `public:nuget-org` - for the NuGet Gallery.
            - `public:pypi` - for the Python Package Index.
            - `public:maven-central` - for Maven Central.
            - `public:maven-googleandroid` - for the Google Android repository.
            - `public:maven-gradleplugins` - for the Gradle plugins repository.
            - `public:maven-commonsware` - for the CommonsWare Android repository.
            - `public:maven-clojars` - for the Clojars repository.
            - `public:ruby-gems-org` - for RubyGems.org.
            - `public:crates-io` - for Crates.io.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        repository: The name of the repository to which the external connection is added.
