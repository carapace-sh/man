name: update-detector-version
description: Updates a detector version.
flags:
    --description=: The detector version description.
    --detector-id=!: The parent detector ID for the detector version you want to update.
    --detector-version-id=!: The detector version ID.
    --external-model-endpoints=!: The Amazon SageMaker model endpoints to include in the detector version.
    --model-versions=: The model versions to include in the detector version.
    --rule-execution-mode=: The rule execution mode to add to the detector.
    --rules=!: The rules to include in the detector version.
completion:
    flag:
        rule-execution-mode:
            - ALL_MATCHED
            - FIRST_MATCHED
documentation:
    command: Updates a detector version. The detector version attributes that you can update include models, external model endpoints, rules, rule execution mode, and description. You can only update a `DRAFT` detector version.
    flag:
        description: The detector version description.
        detector-id: The parent detector ID for the detector version you want to update.
        detector-version-id: The detector version ID.
        external-model-endpoints: The Amazon SageMaker model endpoints to include in the detector version.
        model-versions: The model versions to include in the detector version.
        rule-execution-mode: |-
            The rule execution mode to add to the detector.

            If you specify `FIRST_MATCHED`, Amazon Fraud Detector evaluates rules sequentially, first to last, stopping at the first matched rule. Amazon Fraud dectector then provides the outcomes for that single rule.

            If you specifiy `ALL_MATCHED`, Amazon Fraud Detector evaluates all rules and returns the outcomes for all matched rules. You can define and edit the rule mode at the detector version level, when it is in draft status.

            The default behavior is `FIRST_MATCHED`.
        rules: The rules to include in the detector version.
