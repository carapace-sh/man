name: list-tags-for-resource
description: Lists all of the tags associated with the Amazon Resource Name (ARN) that you specify.
flags:
    --resource-arn=!: Requests the tags associated with a particular Amazon Resource Name (ARN).
documentation:
    command: Lists all of the tags associated with the Amazon Resource Name (ARN) that you specify. The resource can be a capability, partnership, profile, or transformer.
    flag:
        resource-arn: Requests the tags associated with a particular Amazon Resource Name (ARN). An ARN is an identifier for a specific Amazon Web Services resource, such as a capability, partnership, profile, or transformer.
