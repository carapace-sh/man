        add-rules: |-
            Add new value to rules list. The rules that you can enforce to meet your security or compliance intent.
            +
            *celExpression*:::
            The rule's logic expression in Common Expression Language (CEL).
            +
            *expression*::::
            The logical expression in CEL. The maximum length of the condition
            is 1000 characters. For more information, see
            [CEL
            expression](https://cloud.google.com/security-command-center/docs/compliance-manager-write-cel-expressions).
            +
            *resourceTypesValues*::::
            The resource instance types on which this expression is defined.
            The format is `<SERVICE_NAME>/<type>`.
            For example: `compute.googleapis.com/Instance`.
            +
            *values*:::::
            The strings in the list.
            +
            *description*:::
            The rule description. The maximum length is 2000 characters.
            +
            *ruleActionTypes*:::
            The functionality that's enabled by the rule.
            +
            :::
            *Shorthand Example:*
            +
            ```
            +
            --add-rules=celExpression={expression=string,resourceTypesValues={values=[string]}},description=string,ruleActionTypes=[string] --add-rules=celExpression={expression=string,resourceTypesValues={values=[string]}},description=string,ruleActionTypes=[string]
            +
            ```
            +
            *JSON Example:*
            +
            ```
            +
            --add-rules='[{"celExpression": {"expression": "string", "resourceTypesValues": {"values": ["string"]}}, "description": "string", "ruleActionTypes": ["string"]}]'
            +
            ```
            +
            *File Example:*
            +
            ```
            +
            --add-rules=path_to_file.(yaml|json)
            +
            ```
