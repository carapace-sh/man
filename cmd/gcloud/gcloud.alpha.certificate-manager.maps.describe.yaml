name: describe
description: '*(ALPHA)*  Describe an existing certificate map.'
flags:
    --location=: The Cloud location for the certificate map.
documentation:
    command: |-
        *(ALPHA)*  This command fetches and prints information about an existing certificate map.

        ## EXAMPLES

        To describe a certificate map with name simple-map, run:

          $ gcloud alpha certificate-manager maps describe simple-map
    flag:
        location: |-
            The Cloud location for the certificate map.
            +
            To set the `location` attribute:
            * provide the argument `map` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * default value of location is [global].
