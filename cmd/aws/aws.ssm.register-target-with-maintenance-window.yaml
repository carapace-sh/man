name: register-target-with-maintenance-window
description: Registers a target with a maintenance window.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --client-token=: User-provided idempotency token.
    --description=: An optional description for the target.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=: An optional name for the target.
    --owner-information=: User-provided value that will be included in any Amazon CloudWatch Events events raised while running tasks for these targets in this maintenance window.
    --resource-type=!: The type of target being registered with the maintenance window.
    --targets=!:
        description: The targets to register with the maintenance window.
        nargs: -1
    --window-id=!: The ID of the maintenance window the target should be registered with.
completion:
    flag:
        resource-type:
            - INSTANCE
            - RESOURCE_GROUP
documentation:
    command: Registers a target with a maintenance window.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        client-token: User-provided idempotency token.
        description: An optional description for the target.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: An optional name for the target.
        owner-information: User-provided value that will be included in any Amazon CloudWatch Events events raised while running tasks for these targets in this maintenance window.
        resource-type: The type of target being registered with the maintenance window.
        targets: |-
            The targets to register with the maintenance window. In other words, the managed nodes to run commands on when the maintenance window runs.

            If a single maintenance window task is registered with multiple targets, its task invocations occur sequentially and not in parallel. If your task must run on multiple targets at the same time, register a task for each target individually and assign each task the same priority level.

            You can specify targets using managed node IDs, resource group names, or tags that have been applied to managed nodes.

            **Example 1**: Specify managed node IDs

            `Key=InstanceIds,Values=<instance-id-1>,<instance-id-2>,<instance-id-3>`

            **Example 2**: Use tag key-pairs applied to managed nodes

            `Key=tag:<my-tag-key>,Values=<my-tag-value-1>,<my-tag-value-2>`

            **Example 3**: Use tag-keys applied to managed nodes

            `Key=tag-key,Values=<my-tag-key-1>,<my-tag-key-2>`

            **Example 4**: Use resource group names

            `Key=resource-groups:Name,Values=<resource-group-name>`

            **Example 5**: Use filters for resource group types

            `Key=resource-groups:ResourceTypeFilters,Values=<resource-type-1>,<resource-type-2>`

            For `Key=resource-groups:ResourceTypeFilters`, specify resource types in the following format

            `Key=resource-groups:ResourceTypeFilters,Values=AWS::EC2::INSTANCE,AWS::EC2::VPC`

            For more information about these examples formats, including the best use case for each one, see [Examples: Register targets with a maintenance window](https://docs.aws.amazon.com/systems-manager/latest/userguide/mw-cli-tutorial-targets-examples.html) in the *Amazon Web Services Systems Manager User Guide*.
        window-id: The ID of the maintenance window the target should be registered with.
