name: start-schema-extension
description: Applies a schema extension to a Microsoft AD directory.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --create-snapshot-before-schema-extension!: If true, creates a snapshot of the directory before applying the schema extension.
    --description=!: A description of the schema extension.
    --directory-id=!: The identifier of the directory for which the schema extension will be applied to.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --ldif-content=!: The LDIF file represented as a string.
    --no-create-snapshot-before-schema-extension!: If true, creates a snapshot of the directory before applying the schema extension.
documentation:
    command: Applies a schema extension to a Microsoft AD directory.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        create-snapshot-before-schema-extension: If true, creates a snapshot of the directory before applying the schema extension.
        description: A description of the schema extension.
        directory-id: The identifier of the directory for which the schema extension will be applied to.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        ldif-content: The LDIF file represented as a string. To construct the LdifContent string, precede each line as it would be formatted in an ldif file with \\n. See the example request below for more details. The file size can be no larger than 1MB.
