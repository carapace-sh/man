name: get-config-connector-identity
description: Fetch default Config Connector identity.
flags:
    --location=!: The location (region) of the Anthos Config Controller.
documentation:
    command: |-
        gcloud anthos config controller get-config-connector-identity prints the default Config Connector Google Service Account in
        a specific Anthos Config Controller.
    flag:
        location: The location (region) of the Anthos Config Controller.
