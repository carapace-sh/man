name: update
description: '*(BETA)*  Update the configuration of a Cloud Source Repository.'
flags:
    --add-topic=!: ID of the topic or fully qualified identifier for the topic.
    --message-format=: The format of the message to publish to the topic.
    --remove-topic=!: ID of the topic or fully qualified identifier for the topic.
    --service-account=: Email address of the service account used for publishing Cloud Pub/Sub messages.
    --topic-project=: Cloud project for the topic.
    --update-topic=!: ID of the topic or fully qualified identifier for the topic.
completion:
    flag:
        message-format:
            - json
            - protobuf
documentation:
    command: |-
        ## EXAMPLES

        To associate a Cloud Pub/Sub topic to receive repository update notifications,
        run:

          $ gcloud beta source repos update REPO_NAME \
              --add-topic=TOPIC_NAME \
              --service-account=SERVICE_ACCOUNT_EMAIL \
              --message-format=json
    flag:
        add-topic: |-
            ID of the topic or fully qualified identifier for the topic.
            +
            To set the `topic` attribute:
            * provide the argument `--add-topic` on the command line.
        message-format: 'The format of the message to publish to the topic. _MESSAGE_FORMAT_ must be one of: *json*, *protobuf*.'
        remove-topic: |-
            ID of the topic or fully qualified identifier for the topic.
            +
            To set the `topic` attribute:
            * provide the argument `--remove-topic` on the command line.
        service-account: |-
            Email address of the service account used for publishing Cloud Pub/Sub messages.
            This service account needs to be in the same project as the repo. When added, the
            caller needs to have iam.serviceAccounts.actAs permission on this service
            account. If unspecified, it defaults to the Compute Engine default service
            account.
        topic-project: |-
            Cloud project for the topic. If not set, the currently set project will be
            used.
        update-topic: |-
            ID of the topic or fully qualified identifier for the topic.
            +
            To set the `topic` attribute:
            * provide the argument `--update-topic` on the command line.
