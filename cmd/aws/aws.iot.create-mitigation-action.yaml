name: create-mitigation-action
description: Defines an action that can be applied to audit findings by using StartAuditMitigationActionsTask.
flags:
    --action-name=!: A friendly name for the action.
    --action-params=!: Defines the type of action and the parameters for that action.
    --role-arn=!: The ARN of the IAM role that is used to apply the mitigation action.
    --tags=: Metadata that can be used to manage the mitigation action.
documentation:
    command: |-
        Defines an action that can be applied to audit findings by using StartAuditMitigationActionsTask. Only certain types of mitigation actions can be applied to specific check names. For more information, see [Mitigation actions](https://docs.aws.amazon.com/iot/latest/developerguide/device-defender-mitigation-actions.html). Each mitigation action can apply only one type of change.

        Requires permission to access the [CreateMitigationAction](https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsiot.html#awsiot-actions-as-permissions) action.
    flag:
        action-name: A friendly name for the action. Choose a friendly name that accurately describes the action (for example, `EnableLoggingAction`).
        action-params: Defines the type of action and the parameters for that action.
        role-arn: The ARN of the IAM role that is used to apply the mitigation action.
        tags: Metadata that can be used to manage the mitigation action.
