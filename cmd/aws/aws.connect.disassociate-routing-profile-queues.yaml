name: disassociate-routing-profile-queues
description: Disassociates a set of queues from a routing profile.
flags:
    --instance-id=!: The identifier of the Amazon Connect instance.
    --manual-assignment-queue-references=: The manual assignment queues to disassociate with this routing profile.
    --queue-references=: The queues to disassociate from this routing profile.
    --routing-profile-id=!: The identifier of the routing profile.
documentation:
    command: |-
        Disassociates a set of queues from a routing profile.

        Up to 10 queue references can be disassociated in a single API call. More than 10 queue references results in a single call results in an InvalidParameterException.
    flag:
        instance-id: The identifier of the Amazon Connect instance. You can [find the instance ID](https://docs.aws.amazon.com/connect/latest/adminguide/find-instance-arn.html) in the Amazon Resource Name (ARN) of the instance.
        manual-assignment-queue-references: The manual assignment queues to disassociate with this routing profile.
        queue-references: The queues to disassociate from this routing profile.
        routing-profile-id: The identifier of the routing profile.
