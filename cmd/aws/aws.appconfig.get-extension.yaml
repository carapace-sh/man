name: get-extension
description: Returns information about an AppConfig extension.
flags:
    --extension-identifier=!: The name, the ID, or the Amazon Resource Name (ARN) of the extension.
    --version-number=: The extension version number.
documentation:
    command: Returns information about an AppConfig extension.
    flag:
        extension-identifier: The name, the ID, or the Amazon Resource Name (ARN) of the extension.
        version-number: The extension version number. If no version number was defined, AppConfig uses the highest version.
