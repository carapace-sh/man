name: revoke-cluster-security-group-ingress
description: Revokes an ingress rule in an Amazon Redshift security group for a previously authorized IP range or Amazon EC2 security group.
flags:
    --cidrip=: The IP range for which to revoke access.
    --cluster-security-group-name=!: The name of the security Group from which to revoke the ingress rule.
    --ec2-security-group-name=: The name of the EC2 Security Group whose access is to be revoked.
    --ec2-security-group-owner-id=: The Amazon Web Services account number of the owner of the security group specified in the `EC2SecurityGroupName` parameter.
documentation:
    command: Revokes an ingress rule in an Amazon Redshift security group for a previously authorized IP range or Amazon EC2 security group. To add an ingress rule, see [AuthorizeClusterSecurityGroupIngress](). For information about managing security groups, go to [Amazon Redshift Cluster Security Groups](https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-security-groups.html) in the *Amazon Redshift Cluster Management Guide*.
    flag:
        cidrip: The IP range for which to revoke access. This range must be a valid Classless Inter-Domain Routing (CIDR) block of IP addresses. If `CIDRIP` is specified, `EC2SecurityGroupName` and `EC2SecurityGroupOwnerId` cannot be provided.
        cluster-security-group-name: The name of the security Group from which to revoke the ingress rule.
        ec2-security-group-name: The name of the EC2 Security Group whose access is to be revoked. If `EC2SecurityGroupName` is specified, `EC2SecurityGroupOwnerId` must also be provided and `CIDRIP` cannot be provided.
        ec2-security-group-owner-id: |-
            The Amazon Web Services account number of the owner of the security group specified in the `EC2SecurityGroupName` parameter. The Amazon Web Services access key ID is not an acceptable value. If `EC2SecurityGroupOwnerId` is specified, `EC2SecurityGroupName` must also be provided. and `CIDRIP` cannot be provided.

            Example: `111122223333`
