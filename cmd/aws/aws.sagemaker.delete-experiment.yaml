name: delete-experiment
description: Deletes an SageMaker experiment.
flags:
    --experiment-name=!: The name of the experiment to delete.
documentation:
    command: Deletes an SageMaker experiment. All trials associated with the experiment must be deleted first. Use the [ListTrials](https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_ListTrials.html) API to get a list of the trials associated with the experiment.
    flag:
        experiment-name: The name of the experiment to delete.
