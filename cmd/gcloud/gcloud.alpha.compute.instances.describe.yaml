name: describe
description: '*(ALPHA)*  Describe a virtual machine instance.'
flags:
    --guest-attributes=: Instead of instance resource display guest attributes of the instance stored with the given keys.
    --view=: Specifies the information that the output should contain.
    --zone=: Zone of the instance to describe.
completion:
    flag:
        view:
            - BASIC
            - FULL
documentation:
    command: |
        *(ALPHA)*  *gcloud alpha compute instances describe* displays all data associated with a Compute
        Engine virtual machine instance.

        It's possible to limit the the scope of the description by using the
        '--format' flag. For details, see
        [Filtering and formatting fun with gcloud](https://cloud.google.com/blog/products/gcp/filtering-and-formatting-fun-with).
    flag:
        guest-attributes: Instead of instance resource display guest attributes of the instance stored with the given keys.
        view: |-
            Specifies the information that the output should contain. _VIEW_ must be one of:
            +
            *BASIC*::: Default output view. Output contains all configuration details of the instance, except partner metadata.
            *FULL*::: Output contains all configuration details of the instance, including partner metadata.
            :::
            +
        zone: |-
            Zone of the instance to describe. If not specified, you might be prompted to select a zone (interactive mode
            only). `gcloud` attempts to identify the appropriate zone by searching for
            resources in your currently active project. If the zone cannot be determined,
            `gcloud` prompts you for a selection with all available Google Cloud Platform
            zones.
            +
            To avoid prompting when this flag is omitted, the user can set the
            ``compute/zone'' property:
            +
              $ gcloud config set compute/zone ZONE
            +
            A list of zones can be fetched by running:
            +
              $ gcloud compute zones list
            +
            To unset the property, run:
            +
              $ gcloud config unset compute/zone
            +
            Alternatively, the zone can be stored in the environment variable
            ``CLOUDSDK_COMPUTE_ZONE''.
