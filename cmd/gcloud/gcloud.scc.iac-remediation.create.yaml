name: create
description: Remediates a Security Command Center finding.
hidden: true
flags:
    --finding-name=!: Canonical name of the finding
    --finding-org-id=!: Organization ID of the finding
    --git-config-path=!: Path to the git config file in YAML format to raise the PR.
    --project-id=!: Project ID of the LLM enabled project
    --tfstate-file-paths=: Comma seperated list of paths to terraform state files.
documentation:
    command: Remediates a Security Command Center finding.
    flag:
        finding-name: |-
            Canonical name of the finding
                   Format: projects/{proj_id}/sources/{src_id}/locations/global/findings/{finding_id}
        finding-org-id: Organization ID of the finding
        git-config-path: |-
            Path to the git config file in YAML format to raise the PR.
                       Format: /path/to/file.yaml. Sample Config file:
            +
                         remote: origin
                         main-branch-name: master
                         branch-prefix: iac-remediation-
        project-id: Project ID of the LLM enabled project
        tfstate-file-paths: |-
            Comma seperated list of paths to terraform state files.
                   Format: /path/to/file1.tfstate,/path/to/file2.tfstate
