name: put-events
description: Records item interaction event data.
flags:
    --event-list=!: A list of event data from the session.
    --session-id=!: The session ID associated with the user's visit.
    --tracking-id=!: The tracking ID for the event.
    --user-id=: The user associated with the event.
documentation:
    command: Records item interaction event data. For more information see [Recording item interaction events](https://docs.aws.amazon.com/personalize/latest/dg/recording-item-interaction-events.html).
    flag:
        event-list: A list of event data from the session.
        session-id: The session ID associated with the user's visit. Your application generates the sessionId when a user first visits your website or uses your application. Amazon Personalize uses the sessionId to associate events with the user before they log in. For more information, see [Recording item interaction events](https://docs.aws.amazon.com/personalize/latest/dg/recording-item-interaction-events.html).
        tracking-id: The tracking ID for the event. The ID is generated by a call to the [CreateEventTracker](https://docs.aws.amazon.com/personalize/latest/dg/API_CreateEventTracker.html) API.
        user-id: The user associated with the event.
