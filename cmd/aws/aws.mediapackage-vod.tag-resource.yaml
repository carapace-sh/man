name: tag-resource
description: Adds tags to the specified resource.
flags:
    --resource-arn=!: The Amazon Resource Name (ARN) for the resource.
    --tags=!: A collection of tags associated with a resource
documentation:
    command: Adds tags to the specified resource. You can specify one or more tags to add.
    flag:
        resource-arn: The Amazon Resource Name (ARN) for the resource. You can get this from the response to any request to the resource.
