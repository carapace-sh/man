name: create-probe
description: Create a probe within a monitor.
flags:
    --client-token=: Unique, case-sensitive identifier to ensure the idempotency of the request.
    --monitor-name=!: The name of the monitor to associated with the probe.
    --probe=!: Describes the details of an individual probe for a monitor.
    --tags=: The list of key-value pairs created and assigned to the probe.
documentation:
    command: Create a probe within a monitor. Once you create a probe, and it begins monitoring your network traffic, you'll incur billing charges for that probe. This action requires the `monitorName` parameter. Run `ListMonitors` to get a list of monitor names. Note the name of the `monitorName` you want to create the probe for.
    flag:
        client-token: Unique, case-sensitive identifier to ensure the idempotency of the request. Only returned if a client token was provided in the request.
        monitor-name: The name of the monitor to associated with the probe.
        probe: Describes the details of an individual probe for a monitor.
        tags: The list of key-value pairs created and assigned to the probe.
