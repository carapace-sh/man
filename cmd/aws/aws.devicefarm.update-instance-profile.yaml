name: update-instance-profile
description: Updates information about an existing private device instance profile.
flags:
    --arn=!: The Amazon Resource Name (ARN) of the instance profile.
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --description=: The updated description for your instance profile.
    --exclude-app-packages-from-cleanup=:
        description: An array of strings that specifies the list of app packages that should not be cleaned up from the device after a test run is over.
        nargs: -1
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --name=: The updated name for your instance profile.
    --no-package-cleanup: The updated choice for whether you want to specify package cleanup.
    --no-reboot-after-use: The updated choice for whether you want to reboot the device after use.
    --package-cleanup: The updated choice for whether you want to specify package cleanup.
    --reboot-after-use: The updated choice for whether you want to reboot the device after use.
documentation:
    command: Updates information about an existing private device instance profile.
    flag:
        arn: The Amazon Resource Name (ARN) of the instance profile.
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        description: The updated description for your instance profile.
        exclude-app-packages-from-cleanup: |-
            An array of strings that specifies the list of app packages that should not be cleaned up from the device after a test run is over.

            The list of packages is only considered if you set `packageCleanup` to `true`.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        name: The updated name for your instance profile.
        package-cleanup: The updated choice for whether you want to specify package cleanup. The default value is `false` for private devices.
        reboot-after-use: The updated choice for whether you want to reboot the device after use. The default value is `true`.
