name: describe
description: Describe a shared template revision.
flags:
    --google-catalog: If provided, describes a shared template revision from the Google Catalog.
    --location=: The location id of the revision resource.
    --no-google-catalog&: If provided, describes a shared template revision from the Google Catalog.
    --shared-template=: The sharedTemplate id of the revision resource.
    --space=: The space id of the revision resource.
documentation:
    command: Describe a shared template revision.
    flag:
        google-catalog: If provided, describes a shared template revision from the Google Catalog. This sets the project to "gcpdesigncenter" and space to "googlespace".
        location: |-
            The location id of the revision resource.
            +
            To set the location attribute:
              * provide the argument `revision` on the command line with a fully specified name;
              * provide the argument `--location` on the command line.
        no-google-catalog: If provided, describes a shared template revision from the Google Catalog. This sets the project to "gcpdesigncenter" and space to "googlespace".
        shared-template: |-
            The sharedTemplate id of the revision resource.
            +
            To set the shared-template attribute:
              * provide the argument `revision` on the command line with a fully specified name;
              * provide the argument `--shared-template` on the command line.
        space: |-
            The space id of the revision resource.
            +
            To set the space attribute:
              * provide the argument `revision` on the command line with a fully specified name;
              * provide the argument `--space` on the command line.
