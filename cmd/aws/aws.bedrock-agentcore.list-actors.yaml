name: list-actors
description: Lists all actors in an AgentCore Memory resource.
flags:
    --max-results=: The maximum number of results to return in a single call.
    --memory-id=!: The identifier of the AgentCore Memory resource for which to list actors.
    --next-token=: The token for the next set of results.
documentation:
    command: |-
        Lists all actors in an AgentCore Memory resource. We recommend using pagination to ensure that the operation returns quickly and successfully.

        To use this operation, you must have the `bedrock-agentcore:ListActors` permission.
    flag:
        max-results: The maximum number of results to return in a single call. Minimum value of 1, maximum value of 100. Default is 20.
        memory-id: The identifier of the AgentCore Memory resource for which to list actors.
        next-token: The token for the next set of results. Use the value returned in the previous response in the next request to retrieve the next set of results.
