name: get-distributions
description: Returns information about one or more of your Amazon Lightsail content delivery network (CDN) distributions.
flags:
    --cli-input-json=: Read arguments from the JSON string provided.
    --cli-input-yaml=: Read arguments from the YAML string provided.
    --distribution-name=: The name of the distribution for which to return information.
    --generate-cli-skeleton: Prints a JSON skeleton to standard output without sending an API request.
    --page-token=: The token to advance to the next page of results from your request.
documentation:
    command: Returns information about one or more of your Amazon Lightsail content delivery network (CDN) distributions.
    flag:
        cli-input-json: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        cli-input-yaml: |-
            Reads arguments from the JSON string provided.
            The JSON string follows the  format  provided  by --generate-cli-skeleton.
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values.
            It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        distribution-name: |-
            The name of the distribution for which to return information.

            When omitted, the response includes all of your distributions in the Amazon Web Services Region where the request is made.
        generate-cli-skeleton: |-
            If other arguments are provided on the command line,  those  values  will override the JSON-provided values. It is not possible to pass arbitrary binary values using a JSON-provided value as the string will be taken literally.
            This may  not  be  specified  along with --cli-input-yaml.
        page-token: |-
            The token to advance to the next page of results from your request.

            To get a page token, perform an initial `GetDistributions` request. If your results are paginated, the response will return a next page token that you can specify as the page token in a subsequent request.
