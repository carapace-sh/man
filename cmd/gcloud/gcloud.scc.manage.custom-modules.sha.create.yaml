name: create
description: Create an Security Health Analytics custom module.
flags:
    --custom-config-from-file=!: Path to a YAML custom configuration file.
    --display-name=!: The display name of the custom module.
    --enablement-state=!: Sets the enablement state of the Security Health Analytics custom module.
    --folder=: Folder associated with the custom module.
    --no-validate-only&: If present, the request is validated (including IAM checks) but no action is taken.
    --organization=: Organization associated with the custom module.
    --parent=: Parent associated with the custom module.
    --validate-only: If present, the request is validated (including IAM checks) but no action is taken.
documentation:
    command: |-
        ## EXAMPLES

        To create a Security Health Analytics custom module for organization
        `123`, run:

          $ gcloud scc manage custom-modules sha create --organization=organizations/123
              --display-name="test_display_name"
              --enablement-state="ENABLED"
              --custom-config-from-file=custom_config.yaml
    flag:
        custom-config-from-file: Path to a YAML custom configuration file. Use a full or relative path to a local file containing the value of custom_config.
        display-name: The display name of the custom module.
        enablement-state: Sets the enablement state of the Security Health Analytics custom module. Valid options are ENABLED, DISABLED, OR INHERITED.
        folder: Folder associated with the custom module.
        no-validate-only: If present, the request is validated (including IAM checks) but no action is taken.
        organization: Organization associated with the custom module.
        parent: |-
            Parent associated with the custom module. Can be one of
                          organizations/<id>, projects/<id or name>, folders/<id>
        validate-only: If present, the request is validated (including IAM checks) but no action is taken.
