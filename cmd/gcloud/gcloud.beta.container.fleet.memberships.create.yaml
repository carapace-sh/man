name: create
description: '*(BETA)*  Create a new membership for a cluster.'
hidden: true
flags:
    --async: Return immediately, without waiting for the operation in progress to
    --external-id=: External-id of the membership resource.
    --gke-cluster-self-link=: GKE cluster self-link of the cluster represented by this membership;
    --labels=: List of label KEY=VALUE pairs to add.
    --location=: The location name.
    --no-async&: Return immediately, without waiting for the operation in progress to
documentation:
    command: |
        *(BETA)*  Create a Fleet Membership resource corresponding to the cluster.

        This command does not install the Connect Agent or in-cluster Kubernetes Resources that are
        required to connect the cluster with Google. For complete cluster registration, consider using
        the command: `gcloud beta container fleet memberships register --help`.
    flag:
        async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
        external-id: External-id of the membership resource.
        gke-cluster-self-link: |-
            GKE cluster self-link of the cluster represented by this membership;
            for example,
            '//container.googleapis.com/projects/my-project/locations/us-central1-a/clusters/my-cluster.'
            This is only valid if the represented cluster is a GKE cluster. The
            provided self-link will be validated to confirm that it maps to the
            cluster represented by this membership.
        labels: |-
            List of label KEY=VALUE pairs to add.
            +
            Keys must start with a lowercase character and contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers. Values must contain only hyphens (`-`), underscores (```_```), lowercase characters, and numbers.
        location: |-
            The location name.
            +
            To set the `location` attribute:
            * provide the argument `membership` on the command line with a fully specified name;
            * provide the argument `--location` on the command line;
            * global is the only supported location.
        no-async: |-
            Return immediately, without waiting for the operation in progress to
            complete.
