name: untag-resource
description: Removes the association of tags from a Timestream resource.
flags:
    --resource-arn=!: The Timestream resource that the tags will be removed from.
    --tag-keys=!: A list of tags keys.
documentation:
    command: Removes the association of tags from a Timestream resource.
    flag:
        resource-arn: The Timestream resource that the tags will be removed from. This value is an Amazon Resource Name (ARN).
        tag-keys: A list of tags keys. Existing tags of the resource whose keys are members of this list will be removed from the Timestream resource.
