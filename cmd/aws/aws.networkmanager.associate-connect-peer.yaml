name: associate-connect-peer
description: Associates a core network Connect peer with a device and optionally, with a link.
flags:
    --connect-peer-id=!: The ID of the Connect peer.
    --device-id=!: The ID of the device.
    --global-network-id=!: The ID of your global network.
    --link-id=: The ID of the link.
documentation:
    command: |-
        Associates a core network Connect peer with a device and optionally, with a link.

        If you specify a link, it must be associated with the specified device. You can only associate core network Connect peers that have been created on a core network Connect attachment on a core network.
    flag:
        connect-peer-id: The ID of the Connect peer.
        device-id: The ID of the device.
        global-network-id: The ID of your global network.
        link-id: The ID of the link.
