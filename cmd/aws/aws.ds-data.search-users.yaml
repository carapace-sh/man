name: search-users
description: Searches the specified directory for a user.
flags:
    --directory-id=!: The identifier (ID) of the directory that's associated with the user.
    --max-results=: The maximum number of results to be returned per request.
    --next-token=: An encoded paging token for paginated calls that can be passed back to retrieve the next page.
    --realm=: The domain name that's associated with the user.
    --search-attributes=!: One or more data attributes that are used to search for a user.
    --search-string=!: The attribute value that you want to search for.
documentation:
    command: |-
        Searches the specified directory for a user. You can find users that match the `SearchString` parameter with the value of their attributes included in the `SearchString` parameter.

        This operation supports pagination with the use of the `NextToken` request and response parameters. If more results are available, the `SearchUsers.NextToken` member contains a token that you pass in the next call to `SearchUsers`. This retrieves the next set of items.

        You can also specify a maximum number of return results with the `MaxResults` parameter.
    flag:
        directory-id: The identifier (ID) of the directory that's associated with the user.
        max-results: The maximum number of results to be returned per request.
        next-token: An encoded paging token for paginated calls that can be passed back to retrieve the next page.
        realm: |-
            The domain name that's associated with the user.

            This parameter is optional, so you can return users outside of your Managed Microsoft AD domain. When no value is defined, only your Managed Microsoft AD users are returned.

            This value is case insensitive.
        search-attributes: One or more data attributes that are used to search for a user. For a list of supported attributes, see [Directory Service Data Attributes](https://docs.aws.amazon.com/directoryservice/latest/admin-guide/ad_data_attributes.html).
        search-string: |-
            The attribute value that you want to search for.

            Wildcard `(*)` searches aren't supported. For a list of supported attributes, see [Directory Service Data Attributes](https://docs.aws.amazon.com/directoryservice/latest/admin-guide/ad_data_attributes.html).
