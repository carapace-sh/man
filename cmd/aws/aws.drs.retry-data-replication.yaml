name: retry-data-replication
description: 'WARNING: RetryDataReplication is deprecated.'
flags:
    --source-server-id=!: The ID of the Source Server whose data replication should be retried.
documentation:
    command: 'WARNING: RetryDataReplication is deprecated. Causes the data replication initiation sequence to begin immediately upon next Handshake for the specified Source Server ID, regardless of when the previous initiation started. This command will work only if the Source Server is stalled or is in a DISCONNECTED or STOPPED state.'
    flag:
        source-server-id: The ID of the Source Server whose data replication should be retried.
