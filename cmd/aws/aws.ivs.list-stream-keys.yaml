name: list-stream-keys
description: Gets summary information about stream keys for the specified channel.
flags:
    --channel-arn=!: Channel ARN used to filter the list.
    --max-results=: Maximum number of streamKeys to return.
    --next-token=: The first stream key to retrieve.
documentation:
    command: Gets summary information about stream keys for the specified channel.
    flag:
        channel-arn: Channel ARN used to filter the list.
        max-results: 'Maximum number of streamKeys to return. Default: 1.'
        next-token: The first stream key to retrieve. This is used for pagination; see the `nextToken` response field.
