name: get-sink
description: Returns complete information about one monitoring account sink.
flags:
    --identifier=!: The ARN of the sink to retrieve information for.
    --include-tags=: Specifies whether to include the tags associated with the sink in the response.
documentation:
    command: |-
        Returns complete information about one monitoring account sink.

        To use this operation, provide the sink ARN. To retrieve a list of sink ARNs, use [ListSinks](https://docs.aws.amazon.com/OAM/latest/APIReference/API_ListSinks.html).
    flag:
        identifier: The ARN of the sink to retrieve information for.
        include-tags: |-
            Specifies whether to include the tags associated with the sink in the response. When `IncludeTags` is set to `true` and the caller has the required permission, `oam:ListTagsForResource`, the API will return the tags for the specified resource. If the caller doesn't have the required permission, `oam:ListTagsForResource`, the API will raise an exception.

            The default value is `false`.
